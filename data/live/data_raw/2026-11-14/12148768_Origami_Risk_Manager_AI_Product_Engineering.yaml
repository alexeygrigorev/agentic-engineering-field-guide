description: |
  Overview

  The Manager of AI Product Engineering leads a team of AI
  Product Engineers responsible for delivering high quality,
  secure, and scalable AI enabled product experiences.
  Reporting to the Director of AI Product Engineering, this
  role is accountable for day to day execution, technical
  dependency management, delivery predictability, and
  consistency of technical patterns across a defined product
  or platform area.

  The Manager operates at the intersection of Product,
  Engineering, Architecture, Design, and Security, ensuring
  that AI Product Engineers effectively translate product
  intent into executable, maintainable solutions. This role
  functions to oversee and direct AI assisted product
  development—actively monitoring incoming work, sequencing
  priorities, resolving dependencies, identifying risk, and
  ensuring teams move quickly without compromising quality,
  security, or user experience.

  Working in tight partnership with Product Managers and
  Backend Engineering counterparts, the Manager ensures that
  AI Product Engineering work is well planned, well
  integrated, and well governed, while continuously improving
  execution efficiency and delivery outcomes.

  Starting base pay for this role is between $145,000 and
  $185,000. The actual base pay is dependent upon many
  factors, such as transferable skills, work experience,
  business needs, training, location, and market demands. The
  base pay range is subject to change and may be modified in
  the future. This role will be eligible for a bonus as well
  as competitive medical, dental, and vision benefits,
  wellness reimbursement, life insurance, and a 401(k) with
  company match. We offer vacation and sick leave benefits
  (under a flexible time off policy in most states).

  Responsibilities

  Execution & Delivery Leadership

  - Owns day-to-day delivery execution for one or more AI-
    enabled product areas, ensuring commitments are met with
    high quality and predictability.
  - Actively monitors all incoming work to identify conflicts,
    sequencing challenges, technical dependencies, and
    delivery risks early.
  - Ensures consistent application of approved technical
    patterns, tooling, and guardrails across the team’s
    deliverables.
  - Maintains visibility into delivery status, risks, and
    dependencies; escalate issues to the Director with clear
    options and recommendations.
  - Balances speed and quality, ensuring delivery velocity does
    not compromise maintainability, security, or compliance.
  - Proactively identifies delivery risks related to
    dependencies, platform maturity, tooling limitations, or
    unclear requirements.
  - Drives continuous improvement in delivery practices, tooling
    usage, and execution efficiency.
  - Reinforces a culture where teams proactively improve
    requirement quality and execution readiness to enable
    faster delivery cycles.

  Strategic Leadership

  - Partners closely with Product and Backend Engineering to
    ensure implementations align with reference architectures,
    platform constraints, and long-term maintainability goals.
  - Ensures AI Product Engineers adhere to secure-by-design
    principles, including authentication/authorization
    patterns, secrets management, RBAC, data privacy, and
    auditability.
  - Champions consistency of use of the design system and UX
    patterns, integration approaches, and AI-assisted assembly
    techniques.
  - Identifies and resolves recurring technical friction or
    delivery bottlenecks and drive improvements in patterns,
    tooling, or processes.
  - Works hand in hand with Product Managers to clarify
    requirements, strengthen execution readiness, and sequence
    work effectively.
  - Ensures AI Product Engineers enrich and supplement
    requirements, adding technical insight, UX considerations,
    integration patterns, and feasibility constraints.
  - Partners closely with Engineering, Security, DevOps, and QA
    to ensure smooth handoffs, shared ownership, and adherence
    to SDLC processes.
  - Services as the primary point of coordination between AI
    Product Engineers and Backend Engineering teams for
    assigned initiatives.

  People Leadership

  - Directly manages, coaches, and develops AI Product
    Engineers, fostering a culture of accountability,
    collaboration, and technical excellence
  - Sets clear expectations around delivery quality, ownership,
    technical rigor, and cross-functional partnership.
  - Leads all performance management and compensation-related
    activities, including annual reviews.
  - Supports career development through regular feedback, skills
    coaching, and growth planning aligned with established
    skill frameworks.
  - Ensures team members understand and apply security,
    compliance, and governance requirements relevant to AI-
    assisted development
  - Models and reinforce Origami Risk’s values: Prioritize
    Clients’ Trust and Success, Innovate with an
    Entrepreneurial Spirit, Collaborate and Win as a Team.

  Qualifications

  - Bachelor’s degree in Information Technology, Computer
    Science, Engineering, or related field.
  - Experience in product-adjacent engineering, technical
    solutions, platform configuration, or AI-assisted
    development roles.
  - Experience leading or managing technical teams preferred.
  - Strong systems thinking skills, including APIs, integration
    patterns, data flows, and platform constraints.
  - Hands-on experience with low/no-code platforms or AI-
    assisted engineering tools.
  - Solid product mindset with the ability to coach engineers on
    user-centric design and execution.
  - Experience working within secure, regulated environments and
    understanding secure SDLC practices.
  - Strong communication, prioritization, and cross-functional
    collaboration skills.

  Benefits

  - Medical and Dental coverage available for employees,
    dependents, domestic partners, and spouses
  - Paid Time Off – Flexible options plus 10 paid company
    holidays where available**
  - All full-time positions are hybrid, with many eligible to be
    completely remote
  - Fully Paid by Origami Risk – Vision insurance, Short & Long-
    Term Disability Insurance, and Basic Life Insurance
  - Generous family leave options—including adoption and foster
    care placements
  - Pre-Tax Savings Accounts – Flexible Spending Account, Health
    Savings Account, Commuter Benefits, Dependent Care Savings
    Account
  - Retirement Savings – 401(k) with company match up to 4%
  - Employee Assistance Program (EAP) – Confidential & Free
    support offered to colleagues facing personal or work-
    related complications
  - Education Assistance Program – to help colleagues pursue
    industry/role-specific certifications
  - Wellness Benefits – reimbursement program to invest in
    healthy habits as well as support better colleague
    productivity and stress management
  - Additional coverages available – Pet Insurance, Critical
    Illness Insurance, and Voluntary Life & AD&D coverage

  **Flexible PTO not available in California or the UKWho We
  Are

