description: |
  SGNL is looking for top talent to help solve authorization-
  at-scale for the world's largest companies. If you think you
  have what it takes to make a major impact at a well-funded
  startup we want to hear from you!

  About You

  The right candidate will possess proven software engineering
  skills, with experience building and launching large,
  distributed systems in a team-centric environment. You are
  versatile and able to thrive in a dynamic, entrepreneurial
  setting and are eager to mentor junior engineers.

  You are comfortable managing competing priorities and are
  able to bring order to ambiguous scenarios. Maturity,
  impeccable judgment, and the ability to influence and lead
  are essential to success in this role.

  You are data-driven and analytical. You can clearly &
  effectively communicate (written as well as verbally) across
  the organization and up to senior leadership. You value
  diverse perspectives and have a growth mindset.

  About SGNL

  SGNL was founded in 2021 by product and engineering leaders
  from companies such as Google, Okta, and Microsoft to push
  the boundaries of what is possible in the enterprise
  authorization space. We help enterprise companies to make
  sense of access to sensitive information and ensure the
  trust of their customers.

  SGNL offers an integrated access service for organizations
  to have a single pane to manage authorization based on role,
  context, and justification, remediate authorization
  requests, and prevent anomalous user behavior through
  modeling expected user behavior across applications.

  Basic Qualifications

  - 5+ years of professional software development experience
  - 4+ years of programming experience with at least one modern
    language such as Go, Java, C++, or C# including object-
    oriented design
  - 3+ years of experience contributing to the architecture and
    design (architecture, design patterns, reliability and
    scaling) of new and current systems
  - Experience building cloud-deployed applications
  - BS/BE in CS or related field

  Preferred Qualifications

  - 4+ years experience building high scale, distributed systems
    that handle large amounts of data
  - Solid knowledge of data structures, algorithms, and
    designing for performance, scalability, reliability, and
    availability
  - Track record of building and delivering mission critical,
    production software systems
  - Proven ability to mentor other software engineers in all
    aspects of their engineering skill sets
  - Experience working with a relational DB (MySQL/Postgres)
  - Experience with Microservices/Containerization
  - Experience with NoSQL/Graph DB/Kafka/Redis will be a plus
  - Masters in CS or related field

  Remote, hybrid, or in-person is OK. SGNL HQ is located in
  Palo Alto, California. SGNL offers a competitive salary, an
  employee equity plan, flexible PTO, and health coverage.

  SGNL is committed to a diverse and inclusive workforce. SGNL
  is an equal opportunity employer and does not discriminate
  on the basis of race, ethnicity, gender, gender identity,
  sexual orientation, protected veteran status, disability,
  age, or other legally protected status.
