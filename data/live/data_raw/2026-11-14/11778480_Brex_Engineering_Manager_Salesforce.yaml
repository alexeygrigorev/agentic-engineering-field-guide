description: |
  Why join us

  Brex is the intelligent finance platform that enables
  companies to spend smarter and move faster in more than 200
  markets. By combining global corporate cards and banking
  with intuitive spend management, bill pay, and travel
  software, Brex enables founders and finance teams to
  accelerate operations, gain real-time visibility, and
  control spend effortlessly. Brex’s AI-native automation and
  world-class service eliminate manual expense and accounting
  tasks for customers so they can focus on what matters most.
  Tens of thousands of the world's best companies run on Brex,
  including DoorDash, Coinbase, Robinhood, Zoom, Plaid,
  Reddit, and SeatGeek.

  Working at Brex allows you to push your limits, challenge
  the status quo, and collaborate with some of the brightest
  minds in the industry. We’re committed to building a diverse
  team and inclusive culture and believe your potential should
  only be limited by how big you can dream. We make this a
  reality by empowering you with the tools, resources, and
  support you need to grow your career.

  Engineering at Brex

  Engineering at Brex is about building systems that scale
  with speed and intention. Our teams span Software, Data,
  Security, and IT, and operate with high autonomy and deep
  collaboration. We tackle hard technical problems, own our
  outcomes, and push for excellence at every level — from
  architecture to deployment. It’s an environment where
  engineering is a craft, and builders become leaders.

  What you’ll do

  As a Salesforce Lead, you will be responsible for designing,
  testing, implementing, and supporting the Salesforce
  PaaS/Saas at Brex. You will work closely with functional
  leaders, organizational units, and subject matter experts to
  identify, develop and deploy new business processes
  including: Sales, Marketing, Customer Experience, Customer
  Account Management, IT and core business processes. We’re
  searching for someone with a record of success aligning
  business processes with Salesforce best practices,
  translating business requirements into technical
  specifications, and implementing the solutions.

  Where you’ll work

  This role will be based in our New York office. We are a
  hybrid environment that combines the energy and connections
  of being in the office with the benefits and flexibility of
  working from home. We currently require a minimum of three
  coordinated days in the office per week, Monday, Wednesday
  and Thursday. As a perk, we also have up to four weeks per
  year of fully remote work!

  Responsibilities

  - Work collaboratively with functional business units and help
    translate business requirements into logical technical
    designs; defining technical solutions in Salesforce.com to
    support business work processes and bring the design to
    life through declarative or programmatic solutions
  - Participate in cross-functional teams that address strategic
    business issues across departments (Marketing, Sales,
    Operations, Support, and others as needed) aligning
    business processes with Salesforce best practices
  - Coordinate the evaluation, scope and completion of new
    development requests
  - Use advanced declarative and programmatic tools to design,
    build, test, deploy, and support Salesforce solutions
  - Coding and development according to current industry
    standards and best practices
  - Manage change management and deployment process for
    Salesforce code base
  - Conduct code reviews for ongoing projects to ensure high
    code quality and design patterns are followed

  Requirements

  - 7+ years of progressive experience in Salesforce development
    with Salesforce implementations in a complex B2B
    environment
  - Ability to assess the impact of new requirements on
    Salesforce.com and all upstream and downstream
    applications, systems and processes
  - Strong understanding of the Salesforce platform, with the
    ability to build custom apps and objects, formula fields,
    workflows, custom views, and other content of intermediate
    complexity
  - Strong interpersonal and relationship-building skills with
    the ability to work with key stakeholders across the
    organization; manage laterally and upward
  - Ability to communicate effectively with diverse people and
    individuals at various levels within the organization
  - Familiarity with advanced Apex programming concepts
    including core design patterns, limits and bulk patterns,
    efficient and reliable trigger handling, asynchronous
    operations and effective unit testing
  - Experience with Salesforce APIs to integrate Salesforce with
    other tools and third-party applications
  - Expertise using key Salesforce core programming languages
    (Apex, Visualforce, Lightning Web Components, HTML, XML,
    JavaScript, CSS, AJAX, SOQL, RestAPIs)
  - Experience with CI/CD and deployment techniques in
    Salesforce
  - English proficiency/fluency, both written and speaking
    (note: interviews will be conducted in English)

  Bonus points

  - Salesforce certifications (Platform Developer I, Platform
    Developer II, Architect)
  - Experience building Slack applications and integrating with
    Slack
  - Experience working in a SCRUM or Agile methodology
  - Previous non-Salesforce software engineering experience
  - University or College Degree in Computer Science, Software
    Engineering or related experience
  - Front-end development experience with HTML, CSS, and the
    Lightning Design System
  - Experience as a Salesforce Administrator or Business Analyst

  Compensation

  The expected salary range for this role is $240,000 -
  $300,000. However, the starting base pay will depend on a
  number of factors including the candidate’s location,
  skills, experience, market demands, and internal pay parity.
  Depending on the position offered, equity and other forms of
  compensation may be provided as part of a total compensation
  package.

  Brex LLC is a wholly owned subsidiary of Capital One, N.A.

  Please be aware, job-seekers may be at risk of targeting by
  malicious actors looking for personal data. Brex recruiters
  will only reach out via LinkedIn or email with a brex.com
  domain. Any outreach claiming to be from Brex via other
  sources should be ignored.
