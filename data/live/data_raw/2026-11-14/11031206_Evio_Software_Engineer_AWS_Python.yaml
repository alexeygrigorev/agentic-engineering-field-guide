  Fraud Notice

  We’ve recently learned of fraudulent job postings and
  individuals falsely claiming to represent Evio. Protecting
  our candidates is incredibly important to us, and we want to
  share a few reminders:

  - All official communication will come from an email ending in
    @evio.com.
  - We will never conduct text-only interviews (Teams, SMS,
    WhatsApp, Telegram, etc.).
  - We will never ask for payment, gift cards, fees, or
    purchases of any kind.
  - We will never request sensitive financial information during
    the recruiting process.
  - Our open roles are posted only on our official website,
    LinkedIn, and Greenhouse job board.

  If you believe you’ve encountered a scam, you can also
  report it to the Federal Trade Commission or the Internet
  Crime Complaint Center. Thank you for your care and
  vigilance — we’re grateful to everyone who helps keep our
  community safe.

  Information Disclosure

  We value transparency in our hiring process and want
  applicants to understand how your information is used.

  We collect and use personal information you provide during
  the application process such as your resume, employment
  history, education, interview responses, and other job-
  related information, to evaluate your qualifications for
  employment. This may also include limited technical and
  interaction data, such as IP address and device or browser
  information.

  We may use automated or AI-assisted tools to help review
  applications, identify qualified candidates, and detect or
  investigate potentially fraudulent or deceptive activity.
  Human reviewers remain involved, and these tools support,
  not replace, human judgment.

  These measures support a fair and secure hiring process for
  all candidates. If you require a reasonable accommodation,
  please inform us when invited to interview.

  California privacy notice Consistent with California law, we
  use this information for recruiting, hiring, and related
  business purposes, including evaluating your candidacy and
  improving our hiring processes.
