description: |
  Peraton Overview

  Peraton is a next-generation national security company that
  drives missions of consequence spanning the globe and
  extending to the farthest reaches of the galaxy. As the
  world’s leading mission capability integrator and
  transformative enterprise IT provider, we deliver trusted,
  highly differentiated solutions and technologies to protect
  our nation and allies. Peraton operates at the critical
  nexus between traditional and nontraditional threats across
  all domains: land, sea, space, air, and cyberspace. The
  company serves as a valued partner to essential government
  agencies and supports every branch of the U.S. armed forces.
  Each day, our employees do the can’t be done by solving the
  most daunting challenges facing our customers. Visit
  peraton.com to learn how we’re keeping people around the
  world safe and secure.

  Responsibilities

  Peraton is seeking a COBOL / IDMS Software
  Programmer/Developer with experience developing and
  maintaining applications written using COBOL, IDMS and ADSO
  for IBM mainframe operating systems. The Peraton DFAS
  account is seeking expertise to provide Application Support
  Services in support of the maintenance and development of
  Defense Civilian Payroll System (DCPS) project.

  - Plans, directs, and coordinates all activities associated
    with creating software across multiple functional areas
    and products.
  - Prioritizes and allocates projects, products, and resources
    with the assistance of architects and managers.
  - Participates in the strategic decisions about technology,
    definition, and implementation of the software products.
  - Makes employment decisions, such as hiring, rewarding.
  - Plan, direct, and coordinate activities of a multi-team or
    cross-functional organization.
  - Directs software development projects to include, ensuring
    that projects are completed on time and according to
    quality standards, facilitating communication upward and
    across project team including project status,
    justifications for variances and technical information.
  - Organizes projects through development of a project plan
    which includes communication of product goals as defined
    by top management, definition of project strategy,
    identification of the roles and responsibilities of key
    project groups, development of a schedule with key
    milestones, identification of risks, contingency plans,
    and allocation of project resources.
  - Monitors technology trends such as emerging standards for
    new technology opportunities.

  Qualifications

  Required Qualification

  - 2 years with BS/BA; 0 years with MS/MA; 6 years with HS
    Diploma
  - Must be a U.S Citizen
  - Ability to obtain and maintain a Public Trust clearance
  - Experience with specifications for software requirement
    changes.
  - Experience with design, development of software systems.
  - Strong experience with COBOL in a mainframe environment is
    required
  - Experience with IDMS  (Integrated Database Management
    System)
  - Experience with ADSO (Application Development System Online)

