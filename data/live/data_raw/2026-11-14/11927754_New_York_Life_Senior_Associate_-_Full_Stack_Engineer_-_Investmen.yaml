  Bring • 5+ years of hands-on software development experience
  • Solid understanding of the full Software Development
  Lifecycle (SDLC) • Proficiency with both Agile and Waterfall
  methodologies • Experience leveraging AI-assisted
  development tools to improve software design, development,
  testing, documentation, debugging, and engineering
  productivity. • Working knowledge of Generative AI, Large
  Language Model APIS (OpenAI, Anthropic, Google Gemini),
  prompt engineering, Retrieval-Augmented Generation (RAG) and
  their application within enterprise software solutions. •
  Familiarity with containerization (Docker, Kubernetes) and
  cloud platforms (AWS, Google Cloud Platform, or Microsoft
  Azure) • Strong grasp of application integration via APIs-
  including vendor systems • A flexible mindset-ready to work
  across different platforms and projects • Strategic thinker
  who understands business needs and regulatory pressures •
  Passionate about tech, ideally with experience in the
  investment domain • Up to date on architecture trends and
  systems best practices Your Tech Toolbox We work across a
  modern and dynamic stack. You'll thrive here if you're
  proficient in: • .NET Technology Stack, Web API, NodeJS •
  Web development with Angular, React, Python, ASP.NET MVC,
  JavaScript, CSS, jQuery, AJAX, HTML5, SharePoint Online,
  PowerShell • Databases: Databricks, Snowflake, Vector
  databases, Oracle, SQL, Postgres, Redshift, NoSQL • Cloud
  Infrastructure: AWS, GCP or Azure • Reporting Tools:
  Tableau, Business Objects, Crystal Reports • DevOps & Tools:
  GIT, Team Foundation Server (TFS), JIRA, CI/CD pipelines •
  Bonus points if you've worked with: Aspose, Kendo UI,
