description: |
  Company Description

  Experian is a global data and technology company, powering
  opportunities for people and businesses around the world. We
  operate across a range of markets, from financial services
  to healthcare, automotive, agribusiness, insurance, and many
  more. Experian invests in people and new advanced
  technologies to unlock the power of data. We have an amazing
  team of 25,200 people in 32 countries.

  Job Description

  At Experian, we're redefining employment and income
  verification, and we need a Fullstack Engineer who thrives
  in a TDD-first, product-driven environment. Reporting into
  our Engineering Director you'll work across frontend and
  backend, pair-programming with a collaborative team to ship
  high-quality, impactful features.

  Although no two days are the same, you will be expected to:

  - Work with the Head of Engineering to meet clear milestones
  - Communicate trade-offs to other areas of the business
  - Collaborate with the whole development team to influence
    system architecture and feature design
  - Design, test, and deploy new features
  - Work with product and design to manage features end-to-end.
    You build it, you run it.
  - Build and deploy APIs for interconnected services
  - Help improve front-end design
  - Use AI-assisted development tools to enhance frontend
    workflows.
  - Enhance the availability of our main services
  - Strengthen the security and reliability of our entire system

  Our stack

  - Infrastructure: AWS, Terraform
  - Frontend: Vercel, NextJS, React / Redux, Testcafe (or
    similar, Cypress, Playwright)
  - Backend: TypeScript, Vitest, TypeORM, Python, FastAPI,
    SQLAlchemy, pytest, Docker Compose

  Qualifications

  - Experience as a full stack engineer
  - An end-to-end systems-mindset; we are building a product
    that should grow itself and require minimal intervention
    from our team
  - Experience working in a close knit, collaborative, rapidly
    growing team
  - The ability to work in a highly agile environment, using
    CI/CD practices
  - A passion for creating products that are user-friendly and
    contribute to our product-led growth strategy
  - A knack for identifying good UX
  - Strong testing practices, especially Test Driven Development
  - Nice to have: experience with Continuous Deployment, Feature
    flags, E2E testing, AWS SQS, and AWS Lambda

  Additional Information

  Benefits include

  - Hybrid-based role 40% office base
  - Great compensation package and discretionary bonus plan
  - Core benefits include pension, BUPA healthcare and more
  - 25 days annual leave plus bank holidays

  Our uniqueness is that we celebrate yours. Experian's people
  first, inclusive and purpose driven culture is multi award-
  winning; World's Best Workplaces™ 2025 (Fortune Global Top
  25), Great Place To Work™ in 26 countries to name a few.
  Check out Experian Life on social or explore our Careers
  Site to understand why. Experian is also proud to be an
  Equal Opportunity and Affirmative Action employer. If you
  have a disability or special need that requires
  accommodation, please let us know at the earliest
  opportunity.

