description: |
  At Kpler, we are dedicated to helping our clients navigate
  complex markets with ease. By simplifying global trade
  information and providing valuable insights, we empower
  organisations to make informed decisions in commodities,
  energy, and maritime sectors.



  Since our founding in 2014, we have focused on delivering
  top-tier intelligence through user-friendly platforms. Our
  team of over 850 experts from 69 countries works tirelessly
  to transform intricate data into actionable strategies,
  ensuring our clients stay ahead in a dynamic market
  landscape. Join us to leverage cutting-edge innovation for
  impactful results and experience unparalleled support on
  your journey to success.



  About the Role

  As a Machine Learning Engineering Manager at Kpler, you will
  lead and grow an engineering team dedicated to bringing
  production-grade machine learning models to the core of
  global trade intelligence. Operating at the intersection of
  people leadership, system architecture, and applied AI, you
  will guide your team in scaling resilient MLOps pipelines
  and deploying models that process massive, real-time
  datasets. Your leadership directly accelerates how our
  platform translates complex market telemetry into
  actionable, high-impact signals for global commodity and
  maritime leaders.



  Key Responsibilities

  Experience & Background

  We are a dynamic company dedicated to nurturing connections
  and innovating solutions to tackle market challenges head-
  on. If you thrive on customer satisfaction and turning ideas
  into reality, then you’ve found your ideal destination. Are
  you ready to embark on this exciting journey with us?



  We make things happen

  We act decisively and with purpose, going the extra mile.



  We build together

  We foster relationships and develop creative solutions to
  address market challenges.



  We are here to help

  We are accessible and supportive to colleagues and clients
  with a friendly approach.





  Our People Pledge



  Don’t meet every single requirement? Research shows that
  women and people of color are less likely than others to
  apply if they feel like they don’t match 100% of the job
  requirements. Don’t let the confidence gap stand in your
  way, we’d love to hear from you! We understand that
  experience comes in many different forms and are dedicated
  to adding new perspectives to the team.



  Kpler is committed to providing a fair, inclusive and
  diverse work-environment. We believe that different
  perspectives lead to better ideas, and better ideas allow us
  to better understand the needs and interests of our diverse,
  global community. We welcome people of different
  backgrounds, experiences, abilities and perspectives and are
  an equal opportunity employer.







