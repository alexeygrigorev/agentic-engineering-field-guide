description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About Us

  Fanatics is building a leading global digital sports
  platform. We ignite the passions of global sports fans and
  maximize the presence and reach for our hundreds of sports
  partners globally by offering products and services across
  Fanatics Commerce, Fanatics Collectibles, and Fanatics
  Betting & Gaming, allowing sports fans to Buy, Collect, and
  Bet. Through the Fanatics platform, sports fans can buy
  licensed fan gear, jerseys, lifestyle and streetwear
  products, headwear, and hardgoods; collect physical and
  digital trading cards, sports memorabilia, and other digital
  assets; and bet as the company builds its Sportsbook and
  iGaming platform. Fanatics has an established database of
  over 100 million global sports fans; a global partner
  network with approximately 900 sports properties, including
  major national and international professional sports
  leagues, players associations, teams, colleges, college
  conferences and retail partners, 2,500 athletes and
  celebrities, and 200 exclusive athletes; and over 2,000
  retail locations, including its Lids retail stores. Our more
  than 22,000 employees are committed to relentlessly
  enhancing the fan experience and delighting sports fans
  globally.

  Overview

  As a Staff Engineer, Client Services at Fanatics Betting &
  Gaming (FBG), you’ll join the Sportsbook Client team—an
  innovative, culturally driven group powering the rapidly
  growing Fanatics Sportsbook app. The team owns the core
  customer experience, from showcasing markets, events, and
  player statistics to rendering highly dynamic, real-time
  data. Together, we build features that elevate performance,
  usability, and engagement, driving customer loyalty through
  an exceptional user experience.

  As a Staff Engineer at FBG, you are a seasoned contributor
  and technical leader, known for your ability to build
  scalable, high-impact solutions that drive the business
  forward. You combine deep hands-on expertise with a strong
  architectural mindset, delivering results across mobile
  systems. You are expected to set the technical direction,
  drive engineering excellence across multiple client-facing
  teams, and empower engineers to deliver features at the
  highest quality. You play a key role in shaping the future
  of our technology stack while mentoring others and setting a
  high bar for engineering excellence.

  We embrace principles of data-driven development,
  operational excellence, and continuous process optimization
  to deliver a stable, scalable platform. Central to our
  strategy is Kotlin, and Kotlin Multiplatform, which empowers
  us to deliver high-quality features quickly and consistently
  across multiple ecosystems. By focusing on object-oriented
  design, modern coding practices, open-source frameworks, and
  third-party platform integrations, we continuously innovate
  and deliver at speed in this exciting and fast-moving
  market.

  Responsibilities

  - Lead the planning, design, and technical development of
    major product features, from inception through deployment,
    ensuring alignment with overall platform strategy.
  - Own and drive technical excellence, including defining and
    scaling best practices in code quality, system design, and
    testing across the Client Services domain and peer teams.
  - Conduct exceptionally thorough and constructive technical
    design and code reviews to maintain the highest bar for
    quality, reliability, and security.
  - Mentor and empower engineers across multiple teams,
    fostering a culture of technical ownership, innovation,
    and continuous improvement.
  - Help your team define and adhere to the principles,
    guidelines, and best practices of our engineering strategy
    and actively drive adoption across related client teams.
  - Lead end-to-end delivery of multi-team projects,
    coordinating across engineering, product, and design.
    Effectively represent the team's plans, updates, and
    technical decisions in cross-functional planning and
    review forums.
  - Define and lead the testing strategy for complex client-side
    features and systems, promoting a culture of quality and
    ensuring systems are testable by design.
  - Guide teams in operational best practices, actively raising
    the bar for observability, reliability, and system
    resilience. Design, stress-test, and refine systems for
    maintainability.
  - Improve the team's processes and response rhythms for
    handling high-pressure situations, scope changes, or
    production incidents, fostering an environment of
    composure and continuous learning.
  - Develop, test, document, and deploy high quality software
    into production.
  - Develop a fundamental understanding of our industry,
    product, feature set and roadmap.
  - Work closely with our product team, design, and other
    internal stakeholders to make technology decisions that
    grow and improve our products.
  - Participate in an on-call rotation to address urgent issues
    outside business hours and contribute to app enhancements
    and operational efficiency (OE) by troubleshooting and
    resolving application-related problems.
  - Escalate when tasks or projects hit roadblocks.
  - Be open to occasional travel to Fanatics offices and other
    locations for conferences, events, meetings, and team-
    building activities.

  Required Qualifications

  - 7+ years of experience designing and building highly
    scalable backend services.
  - Expertise with Kotlin as the primary development language,
    OR deep knowledge of Java with a strong willingness to
    transition to and develop primarily in Kotlin.
  - Proven experience with modern backend frameworks such as
    Spring Boot or similar.
  - Experience with Coroutines and Dependency Injection.
  - Team-first mentality, with a willingness to do what it takes
    to get the job done and a desire to strive for better.
  - Effectively communicate complex technical subjects to a
    variety of audiences (engineers, technical leaders,
    marketing and operations teams, non-technical functional
    leaders).
  - Familiar with Agile software product delivery and SCRUM
    methodology.
  - Thrives in a high-growth environment where priorities evolve
    regularly and decisions are made quickly.
  - Effectively work cross-functionally within an enterprise
    environment.
  - A Bachelor’s degree, or professional certification, or a
    combination of education and experience

  Preferred Qualifications

  - Experience designing and building backend services using
    Spring Boot or similar Java frameworks
  - Experience working in large-scale distributed systems and
    event-driven architectures
  - Exposure to cloud infrastructure (e.g., AWS, GCP), CI/CD
    pipelines, and observability tools
  - Familiarity with functional programming paradigms and actor-
    based concurrency frameworks like Apache Pekko (or Akka).

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Ranges will change based on country and state of residence,
  which are reflected in Geographical Zones defined by
  Fanatics Betting and Gaming. The range incorporates all of
  our Geographical Compensation Zones and is subject to change
  as the Zone associated with the actual offer is confirmed.
  In addition to the base and bonus, full-time employment, and
  more. For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Salary Range

  $144,000—$237,000 USD

  By submitting your application, you agree to our terms of
  service and acknowledge you have read our Candidate Privacy
  Policy.

  Fanatics will never ask candidates for money, banking
  information, or other sensitive personal information as part
  of the interview process. If you receive a suspicious
  message claiming to be from Fanatics recruiting, please do
  not respond and report it here.
