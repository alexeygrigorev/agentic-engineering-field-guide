description: |
  Hummingbird is a remote-first, fully distributed team united
  by the shared mission of helping fight financial crime.
  Since our launch in 2017, we’ve helped major financial
  institutions and tech-savvy trailblazers alike (e.g. Plaid,
  Raymond James, Crypto.com etc.) orchestrate their compliance
  programs through our thoughtfully designed, intuitive, AI
  powered compliance tools. We believe finding and stopping
  financial crime is a problem rooted in code, language and
  design, so we built the product that the heroes doing this
  work deserve.

  We are customer-obsessed, and we love building and shipping
  great products. We set a high bar, challenge our
  assumptions, seek diverse opinions, and support each other
  to do our best work.

  We do our best to write inclusive, descriptive and accurate
  job descriptions, but we’re not always perfect. If you’re
  interested in the role, we’d love to hear from you even if
  you don’t feel like you meet everything we’re looking for.
  We’re always iterating and improving, and it’s possible that
  your experience is even more impactful than we could have
  imagined.





   About the role

  At Hummingbird, we’re building better software to fight
  financial crime—and our engineering team makes that mission
  possible. As a Senior Software Engineer on the Cortex Team,
  you’ll play a key role in driving AI at Hummingbird. You’ll
  design and deliver customer-facing AI features that make
  complex work more intuitive and efficient, and iterate on
  existing features, like our context-aware AI Assistant and
  Review Agent.

  In this role, you’ll collaborate closely with Product,
  Design, and other engineers to bring ideas to life—from
  prototyping to production. You’ll balance thoughtful model
  and tool selection with sound engineering principles,
  ensuring our systems are scalable, secure, and auditable.
  The projects you’ll take on are often ambitious and open-
  ended, and you’ll have the trust and autonomy to drive them
  from concept to completion.

  We’re looking for someone who’s curious, collaborative, and
  motivated by impact—someone who thrives in the messy middle
  of hard problems and helps bring clarity and direction to
  the team. If you’re excited to use AI and data to make the
  world’s financial systems safer and more transparent, we’d
  love to meet you.

  What you'll do:

  - Build AI features end-to-end. You’ll design, implement, and
    ship features that bring great user experiences to life
    —with a strong focus on measurement, observability, and
    real-world performance.
  - Scale for impact. You’ll architect and deliver systems that
    handle high data volumes and complex workflows with
    reliability and speed, ensuring our AI features are as
    resilient and efficient as they are powerful.
  - Enhance trust and transparency. You’ll improve grounding
    quality with permission-safe retrieval, citations, and
    evaluations that make AI outputs auditable and dependable.
  - Optimize for experience. You’ll drive latency and cost
    improvements where they matter most—creating fast,
    seamless interactions for our users.
  - Shape the product and strategy. You’ll collaborate closely
    with Product and Design from discovery through iteration,
    helping define what AI can do for our customers. Great
    ideas come from everywhere, and your voice will help shape
    where we go next.

  What we're looking for:

  - Experience that matters. You’ve shipped 0-1 products to real
    users (ideally AI products!) and are excited to keep
    pushing the boundaries of what’s possible.
  - Safety first. You care deeply about quality, testing, and
    security—because trust and reliability are non-negotiable
    foundations of scalable systems.
  - Curiosity and creativity. You love learning new
    technologies, exploring unfamiliar domains, and turning
    complex ideas into elegant, understandable solutions.
  - Purpose-driven builder. You want to use your technical
    skills to create something meaningful—AI that helps make
    the world’s financial systems safer and more transparent.
  - Strong engineering fundamentals. You bring solid backend
    experience, data fluency, and operational maturity to
    every project.
  - Iterative mindset. You enjoy refining ideas, incorporating
    feedback, and improving through collaboration.
  - Product intuition and communication. You think beyond code,
    partnering effectively with Product and Design to build
    features that delight and empower users.
  - Bonus points for: Experience with OpenSearch or other vector
    databases, Snowflake, evaluation frameworks like Langfuse,
    or familiarity with fintech and compliance domains.

  Technologies we use and teach:

  - AWS, Azure, PostgreSQL, Redis
  - Terraform, CircleCI, Nix, Docker
  - Ruby/Rails, Python
  - OpenAI
  - React, JavaScript, TypeScript, GraphQL, d3

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. We will ensure that individuals with
  disabilities are provided reasonable accommodation to
  participate in the job application or interview process, to
  perform essential job functions, and to receive other
  benefits and privileges of employment. Please don't hesitate
  to contact us to request accommodation.
