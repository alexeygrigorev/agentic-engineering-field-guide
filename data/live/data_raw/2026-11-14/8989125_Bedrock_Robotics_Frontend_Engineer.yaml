description: |
  Join the team bringing autonomy to the built world

  At Bedrock, we're moving AI out of the lab and onto real job
  sites. Our team includes veterans who helped launch Waymo,
  scaled Segment to a $3.2B acquisition, and grew Uber Freight
  to $5B in revenue. We retrofit the heavy equipment
  contractors already own, starting with excavators, so
  experienced crews can safely take on more projects and
  deliver more of the critical infrastructure our society
  needs. In August 2026, Bedrock-equipped excavators began
  doing fully autonomous, paid work on live commercial job
  sites. We've more than doubled our customer base since 2025,
  and our machines now work with contractors across the South,
  Midwest, and Mid-Atlantic In October 2026, we raised a $600M
  Series C co-led by CapitalG and Emergence Capital, bringing
  our total funding to nearly $1B. We're using it to put more
  autonomous machines to work, build the field and operations
  teams behind every deployment, and expand into new machine
  types and job-site tasks. This is where algorithms meet
  steel-toed boots. You'll work alongside construction
  veterans and world-class engineers to solve physical-world
  problems that simulations can't touch. If you're ready to do
  meaningful work on hard problems, we'd love to have you join
  us.

  About The Role

  We are building highly complex interfaces for the bleeding
  edge of robotics and autonomy. A customer's first real
  contact with Bedrock technology is the interface that
  mediates the autonomous machine and their intentions. It is
  critical that the software they interact with is as magical
  as the autonomy that powers the machine.

  In this foundational role, you will establish our core UI
  interactions and workflows. You will deeply own our software
  stack, pushing the boundaries of what is possible across a
  variety of browser and native environments to deliver ultra-
  low latency control over heavy machinery.

  Also, you get to drive 100,000 lb excavators.

  What You'll Do

  - Take a foundational role in establishing the core UI
    interactions, architecture, and workflows that operators,
    engineers, and field teams rely on every day.
  - Architect highly complex interfaces capable of visualizing
    massive multi-modal datasets (telemetry, live video, 3D
    scenes, geospatial maps) in real time.
  - Push the performance limits of modern frontend frameworks
    across mobile operating systems to ensure a seamless,
    magical user experience.
  - Own the 0-to-1 design and implementation of frontend
    foundations, including state management patterns,
    component systems, and asynchronous data flows.
  - Partner closely with robotics, autonomy, and backend
    engineers to translate high-dimensional machine data into
    intuitive operational workflows.

  Required Qualifications

  - 6+ years of professional experience driving the design,
    architecture, and implementation of highly complex,
    business-critical frontend applications.
  - Deep expertise in shipping iOS and Android apps.
  - A strong understanding of network management, memory
    management, and rendering performance.
  - Experience building sophisticated applications that handle
    massive datasets, complex state, real-time data streaming
    (WebSockets, WebRTC), and asynchronous flows.
  - Strong product and systems thinking: the ability to design
    architectures from first principles and craft polished,
    "magical" user experiences for power users.
  - Comfort deeply owning a software stack and navigating the
    ambiguity of rapid prototyping in a fast-paced startup
    environment.

  Preferred Qualifications

  - Experience pushing performance boundaries in native and
    cross-platform (Swift, Kotlin, KMP, React Native, etc).
  - Background in 3D visualization, rendering, or scene-based
    interfaces using WebGL/WebGPU, Three.js, CesiumJS or
    similar technologies.
  - Experience working with geospatial tooling, massive map
    datasets, or GIS systems (e.g., handling GeoTIFFs, WGS84,
    custom projections).
  - Familiarity with ultra-low latency workflows, real-time
    video streaming pipelines, or interfaces operating in
    constrained edge-network environments.
  - Previous experience designing user experiences for robotics,
    autonomous vehicles, industrial systems, or teleoperation
    command-and-control platforms.

