description: |
  Summary

  Are you an engineer ready to take the next step in building
  production systems? Topstep is looking for a Mid-Level
  Software Engineer to contribute to critical components of
  our trading platform. In this role, you'll work on the
  systems that power real-time trading, market data delivery,
  and brokerage integrations — the systems thousands of active
  traders depend on with real money on the line.

  You'll work primarily in a modern .NET stack, building
  cloud-native services that handle high-throughput workloads,
  and occasionally work across the stack in our
  React/TypeScript frontend. You'll own features from design
  through deployment, learn the architectural patterns used
  across the platform, and deepen your skills in distributed
  systems and production operations.

  This role suits an engineer with solid fundamentals who
  wants real ownership of production systems while continuing
  to grow. You'll own your work end-to-end with support from
  senior engineers, partner with senior engineers and product
  on the hard problems, and help raise the engineering bar at
  Topstep.

  Key Responsibilities

  - Build and ship features for services and APIs that power
    core trading platform capabilities.
  - Own your features from design through deployment, with
    support from senior engineers.
  - Collaborate with product and design to translate
    requirements into maintainable technical solutions.
  - Learn and apply the architectural patterns and practices
    used across the engineering organization.
  - Write clean, well-tested code with a focus on reliability
    and performance.
  - Participate in on-call rotations and respond to incidents,
    with support from senior team members.
  - Help instrument your services with metrics and logging, and
    grow your skills in observability.
  - Occasionally work across the stack, contributing to the
    React/TypeScript frontend as features require.
  - Participate in code reviews, giving and receiving feedback
    to improve code quality.
  - Help maintain and improve existing systems through bug
    fixes, refactoring, and performance improvements.
  - Contribute to team documentation and knowledge sharing.

  Required Qualifications and Key Competencies

  - 3–4 years of software engineering experience building and
    shipping production features.
  - Solid proficiency in C# and .NET, with experience building
    production services.
  - Understanding of RESTful API design and service integration
    patterns.
  - Working knowledge of databases including SQL, basic schema
    design, and query fundamentals.
  - Experience writing automated tests and an understanding of
    testing best practices.
  - Ability to debug issues in production systems with guidance.
  - Strong problem-solving skills and drive to take on
    increasing scope and responsibility.
  - Good communication skills, with the ability to collaborate
    effectively across engineering and product.
  - Comfort working in agile environments with iterative
    development and changing requirements.

  Preferred

  - Experience with React, TypeScript, or other modern frontend
    frameworks.
  - Exposure to distributed systems, microservices, or event-
    driven architectures (Redis, NATS, Kafka,
    SignalR/WebSockets).
  - Familiarity with PostgreSQL or SQL Server in production
    environments.
  - Understanding of observability tools (metrics, logging,
    tracing).
  - Familiarity with container technologies (Docker) or cloud
    platforms (AWS).
  - Prior on-call or incident-response experience.
  - Previous work in financial services, fintech, or other
    compliance-regulated environments.
  - Understanding of trading systems, market data, or brokerage
    operations.

  Company Culture & Perks

  - Topstep is an engaging working environment which ranges from
    fully remote to hybrid. We foster a culture of
    collaboration with cameras on during meetings and a robust
    Slack environment for communication.
  - Seven Company-paid Holidays and generous Family Leave. Paid
    time off is front-loaded.
  - Competitive 401(k) matching, health, dental, and vision
    insurance is offered for full time employees.
  - Vacations are encouraged with a bonus for taking 5
    consecutive days. Employee referrals are bonused. Topstep
    offers a food and groceries budget and contributes towards
    health and wellness.

  New Hire Base Salary Range

  - $125,000 - $160,000 annually.
  - Bonus: This position is eligible for a performance-based
    bonus as provided by the plan terms and governing
    documents.
  - The compensation offered will take into account internal
    compensation structure and may vary depending on the
    candidate's geographic region, job-related knowledge,
    skills, and experience among other factors.

  Equal Opportunity Employer

  Topstep is an Equal Opportunity Employer. We are committed
  to fostering an inclusive environment where all employees
  and applicants are valued. All qualified candidates will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, age, disability, or
  veteran status, in compliance with applicable federal,
  state, and local laws.

