description: |
  You’re ready to gain the skills and experience needed to
  grow within your role and advance your career — and we have
  the perfect software engineering opportunity for you.

  As a Software Engineer II at JPMorganChase within the Wealth
  Management, Account Opening space, you are part of an agile
  team that works to enhance, design, and deliver the software
  components of the firm’s state-of-the-art technology
  products in a secure, stable, and scalable way. As an
  emerging member of a software engineering team, you execute
  software solutions through the design, development, and
  technical troubleshooting of multiple components within a
  technical product, application, or system, while gaining the
  skills and experience needed to grow within your role.

  Job responsibilities



  - Executes software solutions, design, development, and
    technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Writes secure and high-quality code using the syntax of at
    React and Java J2EE programming languages with limited
    guidance
  - Designs, develops, codes, and troubleshoots with
    consideration of upstream and downstream systems and
    technical implications
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain to improve the value realized by
    automation
  - Applies technical troubleshooting to break down solutions
    and solve technical problems of basic complexity
  - Gathers, analyzes, and draws conclusions from large, diverse
    data sets to identify problems and contribute to decision-
    making in service of secure, stable application
    development
  - Learns and applies system processes, methodologies, and
    skills for the development of secure, stable code and
    systems
  - Adds to team culture of diversity, opportunity, inclusion,
    and respect

  Required qualifications, capabilities, and skills



  - Formal training or certification on software engineering
    concepts and 2+ years applied experience
  - Overall knowledge of the Software Development Life Cycle
  - Solid understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Hands-on practical experience in system design, application
    development, testing, and operational stability
  - Proficient in coding in one or more languages
  - Experience in developing, debugging, and maintaining code in
    a large corporate environment with one or more modern
    programming languages and database querying languages
  - Proficiency in Front-End frameworks such as Angular, React,
    JavaScript, etc. Experience with User Acceptance testing
    and identifying issues (including accessibility testing)
  - Experience in few modern technologies such as: Java version
    14+, Spring Boot, Restful Microservices, AWS or Cloud
    Foundry, Kubernetes
  - Experience in asynchronous messaging such as Kafka
  - Experience with Relational or NoSQL Datastores such as
    Cassandra
  - Demonstrated knowledge of software applications and
    technical processes within a technical discipline (e.g.,
    cloud, artificial intelligence, machine learning, mobile,
    etc.)



  Preferred qualifications, capabilities, and skills



  - Familiarity with modern front-end technologies
  - Exposure to cloud technologies
  - Experience in developing code using AI tools like Github
    Copilot
  - Hands-on experience using agentic workflows across all
    phases of the software development lifecycle

