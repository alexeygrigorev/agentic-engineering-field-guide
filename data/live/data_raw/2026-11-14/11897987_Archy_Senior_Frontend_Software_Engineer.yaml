description: |
  About Archy

  Smile! Those teeth you are showing deserve the best care you
  can give them, yet the status quo of the software your
  dentist uses today is outdated.

  Archy is a Series C vertical SaaS solution revolutionizing
  the dental practice management space — giving dental
  providers AI agents and software that lets them do what they
  do best (be dentists!) while we handle the more technical
  sides of running their practice business.

  Job Description:

  Join Archy as a Senior Frontend Software Engineer and help
  revolutionize dental practice management with our cutting-
  edge SaaS solution. You’ll work with our React/TypeScript
  frontend to deliver reliable, scalable systems that empower
  dental professionals to focus on patient care.

  We are looking for a passionate Senior Frontend Software
  Engineer to join our growing team. You’ll thrive in our
  environment, where you’ll own the user experience and
  frontend performance. You ensure that our React/TypeScript
  architecture is modular, tested, and ready for rapid feature
  releases. You’ll have the opportunity to contribute to and
  own critical product domains, collaborate with a mighty
  team, and see your work have a direct impact on the success
  of our product and users.

  Job Responsibilities:

  - Lead the release of major frontend features and product
    updates. You are responsible for managing the production
    lifecycle of your domains, ensuring a seamless and bug-
    free experience for our dental practices.
  - Integrate AI tools (like Claude) into your daily development
    process to improve efficiency. You should be an expert at
    using AI to complement your work, using it to handle
    repetitive tasks while you focus on complex state
    management, performance optimization, and user experience.
  - Play a key role in developing and refining the AI-powered
    interfaces our customers use, ensuring our new product
    updates are intuitive and high-performing.
  - Collaborate closely with the Backend team to ensure seamless
    integration between our Java Spring Boot backend and
    React/TypeScript frontend.
  - Participate in code reviews, providing and receiving
    constructive feedback to help the team continuously
    improve.
  - Identify opportunities for improving team efficiency and
    work to implement those improvements.
  - Estimate and plan development efforts for projects, ensuring
    timely and high-quality delivery.

  Job Requirements:

  - Bachelor’s degree in Engineering, Computer Science, or
    equivalent experience.
  - 6+ years of experience as a frontend engineer, with a strong
    emphasis on writing clean, quality code.
  - Experience with React and TypeScript. Tailwind is a plus.
  - Extensive experience managing releases and monitoring
    frontend health in a live production environment.
  - Ability to articulate when and how to use AI to improve
    velocity without compromising the long-term
    maintainability of the React codebase.
  - A deep focus on testing, stability, and performance to
    ensure our platform remains rock-solid for our users.
  - A customer-centric mindset: understanding that dental
    practices are relying on us to keep their businesses
    running smoothly.
  - Strong collaboration and communication skills, with an
    openness to feedback and a respect for the diverse voices
    and talents on our team.

  What We Offer:

  - Health & Wellness: Comprehensive medical, dental, and vision
    coverage for you and your family, plus Spring Health and
    One Medical access.
  - Competitive Compensation: Base pay and equity, 401(k) with
    company match, and performance-based incentives (bonus or
    commission eligibility by role).
  - Flexibility & Remote Support: A remote-friendly culture that
    values flexibility and time to rest and recharge, with
    home office support and time-off benefits varying by role.
  - Team Connection: Annual all-company offsites to collaborate
    and connect in person.
