description: |
  Drive innovation and deliver trusted, market-leading
  technology at scale within Consumer & Community Banking.

  Join one of the world's most innovative financial
  institutions and help shape the future of technology in
  banking. At JPMorganChase, you'll work alongside talented
  engineers and leaders who are passionate about building
  secure, scalable, and impactful solutions that serve
  millions of customers every day. This is your opportunity to
  grow your career, deepen your technical expertise, and make
  a meaningful difference at a firm that invests in its people
  and its technology.

  As a Senior Lead Software Engineer at JPMorganChase within
  Consumer & Community Banking, you are an integral part of an
  agile team that works to enhance, build, and deliver trusted
  market-leading technology products in a secure, stable, and
  scalable way. You will drive significant business impact
  through your capabilities and contributions, applying deep
  technical expertise and problem-solving methodologies to
  tackle a diverse array of challenges that span multiple
  technologies and applications. In this role, you will serve
  as a subject matter expert, influencing product design,
  application functionality, and technical operations while
  actively contributing to the broader engineering community.

  Job responsibilities

  - Provide technical guidance and direction to support the
    business and its technical teams, contractors, and vendors
    on a regular basis
  - Develop secure, high-quality production code and conduct
    thorough reviews and debugging of code written by others
  - Drive adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes —
    including AI-assisted code review, refactoring, test
    acceleration, release readiness, and incident and root-
    cause analysis — while establishing measurable validation
    standards and promoting reuse of proven patterns within
    the software development lifecycle toolchain
  - Apply knowledge of tools within the software development
    lifecycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale
  - Influence product design, application functionality, and
    technical operations and processes through data-driven,
    outcome-focused decision-making
  - Serve as a function-wide subject matter expert in one or
    more areas of technical focus
  - Actively contribute to the engineering community as an
    advocate of firmwide frameworks, tools, and practices
    across the software development lifecycle

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Advanced proficiency in one or more programming languages
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment — including coding, code review, test
    acceleration, and troubleshooting — with the ability to
    set team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs and outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers and leads on compliant usage patterns and
    controls
  - Ability to tackle design and functionality problems
    independently with little to no oversight
  - Practical cloud-native experience

  Preferred qualifications, capabilities, and skills

  - Experience working in large-scale, distributed systems
    within a regulated financial services or enterprise
    environment
  - Familiarity with DevSecOps practices and integrating
    security controls throughout the software development
    lifecycle
  - Experience mentoring or guiding junior and mid-level
    engineers in technical best practices and engineering
    standards
  - Exposure to multiple cloud platforms and containerization
    technologies such as Kubernetes or Docker
  - Demonstrated ability to contribute to open-source projects
    or internal engineering communities of practice

  About Us



    JPMorganChase, one of the oldest financial institutions,
  offers innovative financial solutions to millions of
  consumers, small businesses and many of the world’s most
  prominent corporate, institutional and government clients
  under the J.P. Morgan and Chase brands. Our history spans
  over 200 years and today we are a leader in investment
  banking, consumer and small business banking, commercial
  banking, financial transaction processing and asset
  management.




  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions. We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.





