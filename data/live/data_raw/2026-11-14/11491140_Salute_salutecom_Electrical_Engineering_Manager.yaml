description: |
  This job description is for the recruitment of a full time
  position of Electrical Engineering Manager at Northshore.
  For avoidance of doubt, Northshore is a wholly owned
  subsidiary of Salute. In this position, the candidate would
  be supporting Northshore’s mission to build and operate a
  more energy efficient and sustainable internet; along with
  our aspirations to positively influence all types of
  building infrastructure in respect to energy &
  sustainability performance.

  Description of Duties

  As an Engineering Manager at Northshore, you will uphold and
  embody the company’s core values as you deliver projects or
  program initiatives. This role requires commitment to
  excellence, collaboration, and forward-thinking to deliver
  successful project outputs.

  - Lead electrical design coordination for new construction,
    retrofit, expansion, densification, and infrastructure
    upgrade projects.
  - Review and validate electrical one-line diagrams, equipment
    layouts, sequences of operation, design narratives,
    specifications, calculations, and studies.
  - Provide technical oversight for utility services,
    switchgear, transformers, generators, UPS systems, PDUs,
    grounding, lighting, protective relaying, and associated
    electrical distribution systems.
  - Review load calculations, short-circuit studies, protective
    device coordination studies, arc-flash analyses, and other
    electrical engineering calculations for technical validity
    and alignment with project requirements.
  - Perform technical reviews of equipment submittals, RFIs,
    design packages, vendor documentation, and other customer
    engineering requests.
  - Lead electrical QA/QC and design validation activities,
    confirming completeness, interdisciplinary coordination,
    constructability, operability, maintainability, safety,
    security, resilience, and commissioning readiness.
  - Coordinate with Engineers of Record, internal design support
    teams, owners, contractors, vendors, procurement teams,
    field leadership, utilities, Authorities Having
    Jurisdiction, and commissioning providers.
  - Identify and resolve interdisciplinary design conflicts
    across electrical, mechanical, controls, civil,
    structural, architectural, security, and
    telecommunications systems.
  - Track design deliverables, technical decisions, design
    risks, open issues, and required stakeholder actions
    through resolution.
  - Support permitting, utility coordination, inspections,
    submittal reviews, RFI responses, and field clarification
    requests.

  - Support commissioning planning, integrated systems testing,
    as-built reviews, turnover documentation, and project
    closeout.
  - Provide technical guidance and mentorship to engineering
    staff while supporting the development of consistent
    design-review processes, technical standards, and quality
    expectations.
  - Develop scopes of work and identify opportunities to support
    densification, diversification, and infrastructure
    improvement initiatives for existing and prospective
    customers.
  - Maintain fiscal responsibility for assigned projects and
    support successful performance against established scope,
    schedule, budget, quality, and utilization targets.
  - Travel to customer sites to support design reviews, field
    investigations, assessments, construction activities,
    commissioning, and project delivery.

  Responsibilities

  Be Accountable

  - Facilitate project outcomes aligned with client feedback,
    financial health, and schedules.
  - Monitor and communicate staff utilization rates, ensuring
    resource allocation supports operational success.
  - Oversee financial accountability for project work to drive
    profitability.

  Collaboration

  - Lead the onboarding and mentoring of team members to foster
    integration and growth.
  - Ensure effective collaboration with cross-functional teams
    and regions.
  - Maintain professional communication with vendors, clients,
    and stakeholders to drive project success.

  Lead by Example

  - Exhibit Northshore’s core values in all interactions and
    serve as a role model for your team.
  - Provide guidance and mentorship to develop team members’
    technical expertise and leadership capabilities.
  - Align team strategies with organizational goals to maintain
    focus and productivity.

  Customer Obsession

  - Develop and maintain strong client relationships by
    understanding and aligning with their goals and
    motivations.
  - Actively collect and incorporate client feedback to improve
    service quality and ensure project outcomes exceed
    expectations.
  - Identify opportunities to expand service offerings within
    existing programs to enhance client success.

  Future Thinking

  - Attend and participate in industry events to stay updated on
    trends and innovations in the data center industry.
  - Apply lessons learned from past projects to improve future
    outcomes and team processes.
  - Align project proposals with clients’ long-term goals and
    emerging market needs.

  Intentional

  - Ensure all meetings and communications are purposeful, with
    clear agendas and actionable objectives.
  - Develop and execute career paths and professional growth
    plans for team members to support their long-term
    development.
  - Advocate for resources and process improvements that align
    with company goals.

  Performance Expectations

  As an Engineering Manager, you will operate autonomously on
  program-specific responsibilities and will be held
  accountable for:

  - Maintaining collaborative, professional relationships across
    teams and stakeholders.
  - Delivering high-quality, client-focused project outcomes on
    time.
  - Embodying the company core values to foster growth,
    accountability and innovation.
  - Target Utilization Rate of 70% balancing external delivery
    of technical guidance across clients and programs with
    internal investment in developing technical resources and
    knowledge.

  Required Experience

  The expected experience is required for this job position
  include the following:

  - Bachelor’s degree in Electrical Engineering from an
    accredited university.
  - 10+ years of progressively responsible experience in
    electrical design, engineering, project engineering,
    construction support, or design management.
  - Demonstrated experience with data centers, mission-critical
    facilities, utilities, industrial facilities, or other
    MEP-intensive projects.
  - Strong technical knowledge of medium- and low-voltage
    electrical distribution systems, switchgear, transformers,
    generators, UPS systems, PDUs, grounding, lighting, and
    protection and control systems.
  - Experience reviewing electrical drawings, specifications,
    calculations, equipment submittals, vendor documentation,
    and technical studies.
  - Experience coordinating multidisciplinary engineering teams
    and working with Engineers of Record, contractors,
    vendors, utilities, commissioning providers, and
    Authorities Having Jurisdiction.
  - Knowledge of applicable electrical codes, safety
    requirements, design standards, and industry practices,
    including NFPA 70, NFPA 70E, and relevant IEEE standards.
  - Ability to independently manage technical priorities,
    communicate complex engineering issues, and lead issues
    through resolution.
  - Strong written and verbal communication skills, including
    the ability to present technical findings and
    recommendations to customers and project stakeholders.
  - Active Professional Engineer license in Electrical
    Engineering.

  The additional experience that is helpful for this job
  position include the following:

  - Electrical infrastructure design experience for AI, high-
    density computing, or liquid-cooled data center
    environments.
  - Experience with facility expansions, brownfield retrofits,
    electrical system densification, and phased construction
    in operational facilities.
  - Experience supporting commissioning, integrated systems
    testing, energized work planning, and operational
    turnover.
  - Familiarity with energy-efficiency evaluations, electrical
    loss calculations, utility incentive programs, or
    electrical energy engineering.
  - Experience leading or mentoring electrical engineers and
    technical design-review teams.

