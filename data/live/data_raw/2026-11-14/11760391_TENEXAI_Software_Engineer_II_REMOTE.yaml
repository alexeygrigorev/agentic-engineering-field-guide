description: |
  Company Overview

  TENEX is an AI-native, automation-first, built-for-scale
  Managed Detection and Response (MDR) provider. We are a
  force multiplier for defenders, helping organizations
  enhance their cybersecurity posture through advanced threat
  detection, rapid response, and continuous protection. Our
  team is composed of industry experts with deep experience in
  cybersecurity, automation and AI-driven solutions. Backed by
  leading investors, we are rapidly growing and seeking top
  talent to join our mission of revolutionizing the AI-Native
  MDR landscape.

  We’re a fast growing startup backed by industry experts and
  top tier investors led by Crosspoint Capital Partners and
  also backed by Shield Capital, DTCP (formerly Deutsche
  Telekom Capital Partners), Deepwork Capital, and the Florida
  Opportunity Fund. Seed round led by Andreessen Horowitz
  (a16z). As an early employee, you’ll play a meaningful role
  in defining and building our culture. Get in on the ground
  floor. We’re a small but well-funded team that just raised a
  substantial round – joining now comes with limited risk and
  unlimited upside.

  We are seeking a highly motivated and versatile Software
  Engineer II to join our core engineering team. You will be
  instrumental in building and scaling our platform, working
  across the entire technology stack from designing robust
  backend systems to crafting engaging user interfaces. As an
  early team member, you'll have the opportunity to contribute
  to key technical decisions and help define our engineering
  culture. We value individuals who are proactive, enjoy
  problem-solving, and are eager to learn and adapt in a fast-
  paced environment.

  Culture is one of the most important things at
  TENEX.AI—explore our culture deck at culture.tenex.ai to
  witness how we embody it, prioritizing the irreplaceable
  collaboration and community of in-person work.

  For candidates who embody the rare "10x of 10x" talent, we
  offer the flexibility of fully remote work. If you are an
  exceptional, unrivaled force in this role and prefer not to
  relocate at this time, we encourage you to apply for this
  remote-first position. Please be aware that the competition
  for these remote roles is exceptionally fierce, and the
  standards for selection are significantly higher.

  Job Responsibilities

  - Design, develop, and deploy scalable and reliable backend
    services and APIs.
  - Build and maintain responsive and user-friendly frontend
    applications.
  - Collaborate closely with product, design, and other
    engineers to define and implement new features.
  - Write clean, well-documented, and testable code.
  - Participate in code reviews to ensure code quality and
    knowledge sharing.
  - Troubleshoot and debug issues across the full stack.
  - Contribute to the improvement of our development processes
    and tools.
  - Stay up-to-date with the latest technologies and industry
    trends.
  - Be proactive in identifying and solving technical
    challenges.

  Qualifications:

  - 3-5 years of professional software engineering experience.
  - Experience with at least one backend programming language
    such as Go, Python, or an equivalent.
  - Experience with at least one modern frontend framework such
    as Next.js, TypeScript, React, Vue.js, or an equivalent.
  - Experience working with relational databases such as
    PostgreSQL or MySQL.
  - Familiarity with cloud platforms such as GCP or AWS.
  - Ability to learn new technologies quickly and independently.
  - Strong problem-solving and analytical skills.
  - Excellent communication and collaboration skills.

  Desired (While experience in all is not required, any of the
  following would be a plus):

  - Experience with containerization technologies like Docker
    and orchestration tools like Kubernetes.
  - Experience with CI/CD pipelines.
  - Exposure to AI/ML concepts and technologies, such as:
    - Prompt Engineering
    - Retrieval-Augmented Generation (RAG)
    - Supervised Fine-Tuning (SFT)
    - Vector Databases
  - Experience working in an early-stage startup environment.

  Education & Certifications

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field (or equivalent experience).
  - GCP certifications such as Professional Cloud Developer or
    Professional Data Engineer are a plus.

  Why Join Us?

  - Opportunity to work with cutting-edge AI-driven
    cybersecurity technologies and Google SecOps solutions.
  - Collaborate with a talented and innovative team focused on
    continuously improving security operations.
  - Competitive salary and benefits package.
  - A culture of growth and development, with opportunities to
    expand your knowledge in AI, cybersecurity, and emerging
    technologies.

  If you're passionate about combining cybersecurity expertise
  with artificial intelligence and have experience with Google
  SecOps and Chronicle, we encourage you to apply!
