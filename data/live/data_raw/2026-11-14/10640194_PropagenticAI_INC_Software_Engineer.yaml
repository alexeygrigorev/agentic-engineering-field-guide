description: |
  About Us

  We are a dynamic and close-knit team passionate about
  building innovative solutions. Our culture is collaborative
  and fast-paced. We value initiative, creativity, and
  resilience. As we continue to grow, we are seeking a
  talented Full Stack Software Engineer with a strong emphasis
  on backend development to join our team.

  Role Overview

  As a Full Stack Software Engineer, you will play a key role
  in designing, developing, and maintaining scalable backend
  systems that power our product. You will collaborate closely
  with team members to deliver high-quality software
  solutions, with opportunities to contribute to both backend
  and frontend development as needed.

  Key Responsibilities

  - Design, implement, and maintain robust backend services and
    APIs using Node.js and Firebase.
  - Optimize applications for maximum speed, scalability, and
    reliability.
  - Ensure code quality through code reviews, unit testing, and
    best practices.
  - Troubleshoot, debug, and upgrade existing software.
  - Stay up-to-date with emerging technologies and industry
    trends, especially in backend development and Gen AI
    integrations.
  - Contribute to frontend development tasks as required.

  Qualifications

  - Holding or working towards a Bachelor’s degree in Computer
    Science, Engineering, or a related field, or equivalent
    practical experience.
  - Proficiency in Node.js and experience working with Firebase.
  - Basic understanding of RESTful API design, database
    management, and cloud services.
  - Familiarity with frontend technologies is a plus.
  - Strong problem-solving skills and the ability to work
    independently in a fast-paced environment.
  - Excellent communication and teamwork abilities.

  What We Offer

  - Opportunity to work in a collaborative, high-energy
    environment.
  - Significant ownership and impact on product direction.
  - Flexible work arrangements and a supportive team culture.
  - The chance to work with cutting-edge technologies, including
    Gen AI.

  If you are a motivated engineer eager to take on new
  challenges and make a tangible impact, we would love to hear
  from you!
