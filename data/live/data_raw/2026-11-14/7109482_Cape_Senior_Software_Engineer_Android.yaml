description: |
  About Cape

  Cape is America’s privacy-first mobile carrier. Our mission
  is to be a force for good in global wireless. Cape was
  founded in 2022 by people who believe privacy is a
  fundamental right, not a luxury to be traded away. Our
  journey began when our founder recognized a critical
  vulnerability in our modern world: everyone relies on the
  same stagnant cellular infrastructure and legacy systems
  that track our every movement, monitor and profile our
  connections, and lose and sell our personal data.

  Instead of accepting the status quo, we decided to fix it.
  National security professionals, journalists, parents, and
  everyone in between can stay connected and have privacy.

  We didn’t just build a layer on top of old tech; we built
  America’s most private and secure mobile carrier from the
  ground up. By building our own network from scratch, we are
  able to design and build a suite of privacy and security
  features that no other carrier on the planet can offer.

  Today, Cape provides our secure network to consumers,
  businesses, and government agencies alike. We closed our
  Series C in March 2026, and we are scaling rapidly, with the
  goal of giving people back control of their most personal
  information.

  The Team

  At Cape, we are the architects of a privacy-centric movement
  that is just getting started. We are relentless builders,
  constantly innovating at the edge of what's possible in
  telecommunications. We operate on a foundation of high trust
  and high expectations. Our structure is flat, and
  collaboration matters more than hierarchy. As a member of
  our team, you will collaborate with world-class engineers,
  architects, and visionaries, and work across organizational
  lines to solve "impossible" problems and deliver mission-
  critical results for our users every single day.

  The Role

  Cape’s platform gives customers end-to-end control of their
  digital identity, optimizing for resiliency, privacy, and
  security at every turn. We’re transforming how customers
  sign up for, use, and think about their mobile phones—and
  the privacy implications associated with them. Customers are
  protected at every level of the communications stack—from
  the mobile device, through infrastructure, and to the core
  of the network itself.

  As an Android Engineer at Cape, your mission is to build the
  definitive application for private mobile communication. We
  don’t just white-label an application and do the bare
  minimum for onboarding and collecting payment. The mobile
  application is the interface where users build trust with
  Cape and protect their digital lives. You will own the
  entire feature lifecycle—from architectural design to launch
  on both the Google Play Store and alternative, privacy-
  conscious app stores. Using Kotlin and Jetpack Compose, you
  will tackle some of the hardest technical challenges in
  security and cryptography in order to secure personal
  information (PII), account data, and even voice and SMS
  traffic. In our tight-knit engineering team, you won't just
  build features - you will ship the product that makes our
  promise of privacy a reality.

  What You'll Work On

  - Take ownership of the mobile product lifecycle — from
    conceptualization, through design and development, all the
    way to launch.
  - Maintain high coding standards by developing guidelines,
    actively participating in code reviews, and fostering a
    culture of continuous improvement and knowledge sharing.
  - Champion the security, performance, and stability of our
    applications by implementing and overseeing robust
    testing, monitoring, and release processes to guarantee a
    seamless, trustworthy user experience.
  - Actively improve user workflows by collaborating with cross-
    functional teams, ensuring seamless experiences across
    product boundaries and a cohesive user journey.

  What We Value

  - Proven ability to learn continuously, work independently,
    and make decisions with minimal supervision.
  - A thoughtful, practical approach to problem-solving that
    considers tradeoffs and avoids over-engineering.
  - Comfort working in a constantly evolving environment with
    dynamic objectives and frequent iteration with users.
  - Ability to collaborate effectively with both technical and
    non-technical teammates, and an understanding of how
    technical decisions impact users.
  - Ability to learn new technologies and concepts, even without
    prior in-depth experience.

  Experience

  - 4+ years of Android software development experience.
  - Background in Computer Science, Mathematics, Software
    Engineering, Physics, or a related field.
  - Proficiency in Kotlin and a strong foundational
    understanding of the Android ecosystem (architecture, app
    lifecycle, concurrency, etc.).
  - Professional experience with Jetpack Compose is preferred,
    but a deep appreciation for building modern user
    interfaces is essential.
  - Strong written and verbal communication skills, with the
    ability to iterate quickly with teammates, incorporate
    feedback, and maintain a high bar for quality.
  - Experience brainstorming and iterating with product
    designers.
  - Experience with Android concurrency and storage frameworks
    such as Coroutines, Room, and DataStore.
  - Familiarity with privacy-focused Android OSs.
  - (Bonus Points) Knowledge of cryptography, trusted execution
    environments and StrongBox, or cellular technologies
    (eSIM, 4G, 5G).

  Compensation

  We offer competitive compensation that is geo-adjusted based
  on your location, along with meaningful equity so you share
  in the value you help create. Salary range for this role in
  New York, New York is $180,000 - $250,000 depending on
  experience and interview performance.

  Our benefits include:

  - 401(k) match
  - 100% coverage of medical, dental, and vision premiums for
    you and your dependents
  - 12 weeks paid parental leave (for all parents, no waiting
    period)
  - Stipends for
    - Family-forming needs
    - Gender-affirming care
  - Unlimited PTO

  Your day-to-day will vary, but everything you work on will
  have a high impact. One day, you could be delivering a new
  capability to prevent targeting of soldiers on the
  battlefield; the next, you could be architecting a system to
  prevent financial fraud via SIM swaps for everyday citizens.

  Our Culture & Values

  - We hire excellent people, give them outsized responsibility,
    and trust them to execute. Every person at Cape has a
    proven track record of tackling hard problems and winning.
  - We believe that personal privacy and national security are
    not at odds, and that they can be reconciled through
    strong technology.
  - We believe companies exist to build awesome things and take
    care of the people who build them, so we offer top-tier
    healthcare, 401(k) matching, and a generous vacation
    policy that our team actually uses to recharge.
  - We believe that a stronger company and a better product are
    built by people from all walks of life. We hire without
    regard to race, color, ancestry, religion, sex, national
    origin, sexual orientation, gender identity, age, marital
    status, disability, or Veteran status. If you are great at
    what you do, you belong here.

  How to apply

  Click the link below to apply.

