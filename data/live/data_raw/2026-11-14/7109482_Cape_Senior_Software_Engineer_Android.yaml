  We are an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, or national origin, and without regard to
  disability or status as a protected veteran, or any other
  status protected by law.
