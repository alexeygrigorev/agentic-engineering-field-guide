description: |
  A fast-growing, well-funded consumer marketplace company
  reimagining a large, fragmented legacy industry — seeking an
  Engineering Manager to lead a cross-functional web team at
  the center of its growth engine.

  The Opportunity

  This company is building the technology backbone for a new
  generation of independent entrepreneurs entering a large,
  traditionally offline industry — combining a modern
  platform, data, and community to help thousands of people
  build real businesses on top of it. Backed by top-tier
  venture investors and recognized among the most innovative
  companies in its category, the company has scaled quickly
  while maintaining a tight, high-caliber engineering culture.

  We're looking for an Engineering Manager to own a fast-
  moving web platform team responsible for the digital front
  door of the business: a flexible content management system,
  AI-assisted landing page generation, design system
  foundations, and site performance at scale. This is a high-
  visibility role that sits at the intersection of product,
  design, and growth — directly shaping how the company
  acquires and retains the entrepreneurs who rely on its
  platform.

  If you love frontend systems, web performance, and building
  the tools that let a whole marketplace scale, this is a rare
  chance to lead that work end to end.

  What You'll Do

  - Lead day-to-day execution of a cross-functional sprint team,
    setting clear priorities and sustainable delivery
    practices
  - Partner closely with product, design, and growth leaders to
    solve for acquisition, onboarding, and web-based workflow
    challenges
  - Drive development of new platform capabilities while
    continuously improving the CMS, landing page tooling,
    design system, and performance infrastructure
  - Provide hands-on technical leadership — engaging with
    architecture and implementation details to guide sound
    technical decisions
  - Coach and grow engineers through regular feedback,
    mentorship, and career development
  - Build a collaborative, inclusive team culture within a
    diverse, high-performing engineering org

  RequirementsWhat You Bring

  - 4+ years in engineering management with a track record of
    successful delivery and team growth
  - 8+ years building web systems
  - Strong technical judgment — comfortable making architectural
    calls, managing technical debt, and setting engineering
    standards
  - Excellent project management skills: breaking down complex
    work, anticipating risk, delivering consistently
  - Clear communicator who can translate technical concepts
    across stakeholders and run smooth, low-drama launches
  - Recruiting experience — you know how to evaluate engineering
    talent and sell candidates on a mission
  - A collaborative, humble leadership style with genuine
    openness to feedback
  - Entrepreneurial comfort with ambiguity and pace typical of
    an early-to-mid-stage startup
  - First-principles thinker who knows when to use established
    patterns versus build something bespoke

  Benefits

  A competitive base in the $200K–$230K range plus equity,
  along with unlimited vacation, fully-covered health
  insurance option, dental & vision, wellness stipend, 401(k)
  match, commuter benefits, supplemental life insurance, and
  stock options.

  Most importantly, they want you to have a life. They offer a
  very healthy work/life balance, a fantastic work culture and
  environment, and meaningful challenges to tackle. You are
  not going to be asked to burn the candle at both ends.
