description: |
  The location for this role is our NYC office in the Flatiron
  District. Our hybrid model, with a minimum of two days per
  week (Tuesdays and Thursdays), gives team members the best
  of both worlds, with plenty of focus time and in-person
  collaboration that foster trust, innovation, and a strong
  team culture.



  About Superhuman

  Superhuman is the AI productivity platform on a mission to
  unlock the superhuman potential in everyone. The Superhuman
  suite of apps and agents brings AI wherever people work,
  integrating with over 1 million applications and websites.
  The company’s products include Grammarly’s writing
  assistance, Superhuman Docs’s collaborative workspaces,
  Mail’s inbox management, and Go, the proactive AI assistant
  that understands context and delivers help automatically.
  Founded in 2009, Superhuman empowers over 40 million people,
  50,000 organizations, and 3,000 educational institutions
  worldwide to eliminate busywork and focus on what matters.
  Learn more at superhuman.com and about our values here.



  The Opportunity

  Superhuman is building the AI productivity platform that
  works everywhere people do — and the front end is where it
  all comes together. Our Front-End engineers own the
  interfaces that put AI capabilities directly into users'
  hands: the Chrome extension and desktop app for Go (our
  proactive AI assistant), the editor and collaboration
  surfaces in Superhuman Docs, the inbox experience in
  Superhuman Mail, and the admin controls that let enterprises
  deploy it all at scale.

  This isn't typical front-end work. You'll build interfaces
  that stream and render AI-generated content in real time,
  design interaction patterns for inline agent suggestions
  that appear while users are writing, and create the tools
  that let anyone build and customize their own AI agents — no
  code required. The craft challenges are deep: orchestrating
  state across browser extensions, native desktop apps, and
  web surfaces; making agentic workflows feel instant and
  fluid; and shipping a consistent experience across a product
  suite that reaches millions of users.

  Superhuman's engineers have the freedom to innovate and
  uncover breakthroughs - and, in turn, influence our product
  roadmap. The complexity of our technical challenges is
  growing rapidly as we scale AI-powered features across every
  surface. You can hear more from our team on our technical
  blog.

  As a Front-End Software Engineer, you will:

  - Build the interfaces for AI-powered products used by
    millions — including real-time chat experiences, inline
    agent suggestions, document editors, and agent builder
    tools.
  - Design and implement rich, responsive UI in React and
    TypeScript to build refined and elegant user interfaces.
  - Work across the Superhuman product suite — Go, Mail, Docs,
    Grammarly, or enterprise..
  - Target high availability for consumer and enterprise
    customers.
  - Tackle hard interaction design problems: streaming content,
    complex state management, and multi-surface interactions.
  - Collaborate widely with Product, Design, and ML/AI teams to
    translate AI capabilities into intuitive user
    experiences..
  - Contribute to an engineering culture with a strong emphasis
    on documentation, testing, and user experience.
  - Mentor and grow junior engineers on the team.



  Qualifications

  - 7 years of experience in front-end development, with expert-
    level knowledge of TypeScript (and/or JavaScript), HTML,
    and CSS, extensive experience with ReactJS (or similar UI
    frameworks) and modern web client development and testing
    tools.
  - Excellent software engineering fundamentals, including
    knowledge of algorithms and data structures.
  - Comfort working with AI-powered features — whether that's
    building UI for LLM-generated content, streaming
    responses, or agentic workflows. Prior experience
    integrating AI/ML into product surfaces is a plus.
  - Fluency with AI coding tools (Copilot, Cursor, Claude Code,
    etc.) and a point of view on how they change the way teams
    build software.
  - Experience with browser extensions, cross-platform web
    clients, or shipping front-end code across multiple
    surfaces (web, desktop, mobile) is a plus.
  - Deep understanding of continuous integration and delivery
    methods.
  - Strong product instincts — you care about the end-user
    experience and strive to ensure high quality.
  - Ability to work independently with minimal guidance,
    proactively manage priorities across multiple projects,
    and collaborate effectively with cross-functional teams.

  We invite you to share your knowledge, experience, and goals
  with us to help us find the best team match for you. Tell us
  your superpower!



  Compensation and Benefits

  Superhuman offers all team members competitive pay along
  with a benefits package encompassing the following and more:

  - Excellent health care (including a wide range of medical,
    dental, vision, mental health, and fertility benefits)
  - Disability and life insurance options
  - 401(k) and RRSP matching
  - Paid parental leave
  - 20 days of paid time off per year, 12 days of paid holidays
    per year, two floating holidays per year, and flexible
    sick time
  - Generous stipends (including those for caregiving, pet care,
    wellness, your home office, and more)
  - Annual professional development budget and opportunities

  Superhuman takes a market-based approach to compensation,
  which means base pay may vary depending on your location.
  Our US locations are categorized into two compensation zones
  based on proximity to our hub locations.

  Base pay may vary considerably depending on job-related
  knowledge, skills, and experience. The expected salary
  ranges for this position are outlined by compensation zone
  and may be modified in the future.

  For more information about our compensation zones and
  locations where we currently support employment, please
  refer to this page. If a location of interest is not listed,
  please speak with a recruiter for additional information.



