description: |
  Join Citi's XVA Technology team in London as a Lead Software
  Engineer, Applications Development at Vice President level —
  a senior role at the forefront of engineering innovation
  within a globally operating financial institution. In this
  position, you will lead the design, development, and
  delivery of complex application systems that directly shape
  how technology integrates across critical business
  functions. Working alongside high-calibre engineers and
  engaged business partners, you will own technical outcomes
  at scale and drive meaningful improvement across
  applications platforms.

  Responsibilities

  - Lead the design and development of application systems and
    software, ensuring solutions align with the overall
    architecture blueprint and meet evolving business
    requirements.
  - Partner with multiple management teams to define system
    enhancements that support the deployment of new products
    and process improvements.
  - Resolve high-impact technical problems by conducting in-
    depth analysis of complex business processes, system
    workflows, and industry standards.
  - Develop and enforce standards for coding, testing,
    debugging, and implementation to maintain quality and
    consistency across the engineering team.
  - Build comprehensive knowledge of how business functions such
    as architecture and infrastructure interconnect, applying
    this understanding to deliver integrated technical
    solutions.
  - Translate business context and domain knowledge into well-
    scoped technical solutions, bridging the gap between
    stakeholder intent and engineering execution across the
    full development lifecycle.
  - Apply AI-assisted coding tools such as GitHub Copilot or
    Devin with critical engineering judgment — reviewing
    outputs rigorously, asking the right questions to validate
    context, and safeguarding code quality, security, and
    architectural integrity before integration.
  - Mentor and coach mid-level developers and analysts,
    providing technical guidance and allocating work to
    support team delivery and professional growth.
  - Assess risk in engineering and business decisions, ensuring
    compliance with applicable regulations, policies, and
    controls while maintaining transparency in issue
    escalation and reporting.

  Required Qualifications & Skills

  - Proven experience in applications development or systems
    analysis, with a demonstrable record of delivering complex
    software solutions.
  - Deep expertise in system analysis and software application
    programming, with the ability to independently evaluate
    and resolve technical challenges.
  - Proven ability to manage and deliver technology projects
    end-to-end, coordinating across teams and stakeholders to
    achieve successful outcomes.
  - Subject matter expertise in at least one domain of
    applications development, with the depth to set technical
    direction and define best practices.
  - Strong T-shaped engineering capability — deep technical
    specialism combined with the breadth to understand
    business processes, interpret stakeholder needs, and
    design solutions that are both technically sound and
    commercially relevant.
  - Strong leadership and project management capability, with
    experience guiding mid-level engineers and analysts in a
    delivery-focused environment.
  - Clear and concise written and verbal communication skills,
    with the ability to convey technical concepts to both
    engineering and non-technical audiences.
  - Ability to reprioritise rapidly in response to shifting
    business or technical demands, maintaining delivery
    momentum under changing conditions.

  Beneficial Skills & Qualifications

  - Experience working within large-scale financial services or
    similarly complex regulated technology environments.
  - Hands-on experience with prompt engineering and agentic or
    skills-based AI solutions — designing workflows where AI
    models operate as active participants in the development
    lifecycle, not just productivity accelerators.
  - A demonstrable habit of staying current with the evolving AI
    tooling landscape — actively engaging with new
    developments, sharing knowledge across teams, challenging
    established approaches where appropriate, and enabling
    colleagues to adopt AI capability safely and effectively
    beyond surface-level use.



  What We Offer

  At Citi, you will work at genuine global scale — where your
  engineering decisions, technical leadership, and project
  outcomes have real impact across one of the world's leading
  financial institutions. This is an opportunity to own
  complex, high-value problems alongside talented engineers
  and engaged business partners in a performance-driven
  environment.

  - A hybrid working model with 3 days in the office and 2 days
    working remotely, supporting effective collaboration and
    personal flexibility.
  - Senior-level ownership and influence — the autonomy to set a
    technical agenda, drive architectural decisions, and shape
    how applications are built across a global platform.
  - Access to learning and development opportunities that
    support technical growth and career progression at a
    senior level.
  - A collaborative team environment where engineers work
    alongside high-calibre colleagues and business partners on
    complex, meaningful challenges.
  - Competitive financial wellbeing, with compensation and
    benefits structured to reflect the seniority and strategic
    impact of the role.
  - Wellbeing support and work-life balance resources as part of
    Citi's broader commitment to sustainable, high-performance
    ways of working.

  Build the systems that matter — apply now to bring your
  engineering leadership to Citi's XVA Technology team and
  help redefine how technology powers global financial
  operations.

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

  What we’ll provide you

  By joining Citi, you will not only be part of a business
  casual workplace with a hybrid working model (up to 2 days
  working at home per week), but also receive a competitive
  base salary (which is annually reviewed), and enjoy a whole
  host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our About Us | Culture, Values & Benefits page to
  learn more.



  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

