description: |
  📍 Remote | Full-Time | UK

  👋 About Us

  At Medify, we’re on a mission to widen access to medicine
  and healthcare careers through world-class digital learning
  experiences. Since 2009, we’ve helped thousands of students
  prepare for high-stakes admissions tests, and we’re
  continuing to invest in our technology to build innovative,
  scalable products that support learners around the world.

  As we continue to grow, we’re looking for an experienced
  Engineering Manager to lead, mentor and develop our
  engineering team while remaining hands-on in building the
  platform that powers Medify.

  🎯 The Role

  As an Engineering Manager, you’ll play a pivotal role in
  shaping both our engineering culture and technical
  direction. Working closely with the CTO, Product and Design
  teams, you’ll lead a team of talented full-stack engineers,
  helping them grow while ensuring we continue to deliver
  high-quality software that delights our users.

  This is a hands-on leadership role, with at least 50% of
  your time dedicated to engineering. You’ll contribute across
  the full software development lifecycle - from architecture
  and design through to development, testing and deployment -
  while driving engineering excellence and fostering a
  collaborative, high-performing team.

  Our current technology stack includes Ruby on Rails, React,
  PostgreSQL, with infrastructure transitioning from Heroku to
  AWS.

  🚀 Key Responsibilities

  - Lead, mentor and support a team of full-stack engineers
    through coaching, regular 1:1s and performance reviews.
  - Foster a culture of continuous learning, collaboration and
    technical excellence.
  - Support career development, engagement and long-term
    capability building across the engineering team.
  - Contribute to hiring by supporting interviews and
    recruitment of exceptional engineering talent.
  - Design, develop and maintain scalable, high-quality software
    solutions.
  - Collaborate closely with Product and Design teams to
    translate requirements into technical solutions.
  - Participate in architectural decisions and help shape the
    future of the Medify platform.
  - Conduct thoughtful code reviews and promote engineering best
    practices.
  - Troubleshoot and resolve software issues while maintaining
    high standards of reliability and performance.
  - Develop automated tests and contribute to a robust testing
    culture.
  - Participate in agile planning, backlog refinement and sprint
    delivery.
  - Stay up to date with emerging technologies and identify
    opportunities to improve our engineering practices.

  💡 About You

  You’ll be a technically strong engineering leader who enjoys
  developing people just as much as building great software.
  You’re comfortable balancing strategic leadership with
  hands-on development and thrive in a fast-moving,
  collaborative environment.

  You’ll ideally have:

  - 2+ years’ experience leading or managing software
    engineering teams.
  - 5+ years’ experience in software development.
  - Strong experience with modern software engineering practices
    and frameworks.
  - Experience with Ruby on Rails and React (highly desirable).
  - A proven track record of building scalable, maintainable
    software.
  - Experience working in Agile development environments.
  - Experience collaborating with cross-functional Product and
    Design teams.
  - Experience recruiting, mentoring and developing engineers.
  - Strong communication and stakeholder management skills.
  - Excellent problem-solving ability with a focus on quality
    and continuous improvement.

  🎓 Qualifications

  - Degree in Computer Science, Engineering or a related
    discipline is desirable, but not essential.

  🛠 Technical Skills

  - Strong knowledge of modern programming languages and
    software frameworks.
  - Excellent understanding of software architecture, design
    principles, data structures and algorithms.
  - Experience working with relational databases, APIs and
    networking.
  - Knowledge of automated testing frameworks and software
    quality practices.
  - Familiarity with DevOps tools and deployment pipelines.
  - Ability to quickly learn and adopt new technologies.
  - Excellent collaboration and communication skills.

  ✅ What We Offer

  - Fully remote working with flexibility and autonomy.
  - The opportunity to shape the future of Medify’s technology
    platform.
  - A supportive, collaborative engineering culture that values
    continuous learning.
  - A hands-on leadership role with real technical influence.
  - The opportunity to work on products that positively impact
    thousands of aspiring healthcare professionals every year.
  - Competitive salary and benefits package.

  📩 How to Apply

  If you’re passionate about building exceptional software,
  developing high-performing engineering teams and making a
  meaningful impact in education, we’d love to hear from you.

  Submit your application along with your CV using our
  application form.
