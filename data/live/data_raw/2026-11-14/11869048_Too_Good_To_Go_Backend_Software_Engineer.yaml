description: |
  At Too Good To Go, we have an ambitious mission: to inspire
  and empower everyone to fight food waste together. More than
  1/3 of all food produced in the world is wasted. And that
  has a huge impact on the health of our planet. 10% of
  greenhouse gas emissions come from food waste and loss.
  Through our marketplace app, we connect businesses that have
  unsold, surplus food, with consumers who can buy and enjoy
  it at ⅓ of retail value. We are on a mission to empower
  everyone to take action against food waste: alongside our
  marketplace app, we create educational tools, explore new
  business solutions, and influence legislation to help reduce
  food waste. We’re growing fast: Our community of 120 million
  registered users and 180,000 active partners across 20
  countries, have together already saved over 500 million
  meals from going to waste In 2023, Too Good To Go was
  recognised on Fortune's acclaimed 'Change the World' list,
  named as one of Deloitte's 'Best Managed Companies' and won
  a coveted 'Cultural Impact Award' at the annual Apple App
  Store Awards.

  The Role

  We are building a brand-new engineering hub in London, and
  we are looking for foundational Backend Software Engineers
  to help us kick it off. This is a unique opportunity: you
  will be joining a completely new team, building a new hub
  from scratch, and working remotely from the rest of our
  global Tech organisation.

  As an integral part of this new product team, you will help
  define, build, and deliver our product features. You will
  work towards specific outcomes with the freedom and
  responsibility to figure out the best way to achieve them
  together with your team. Your mission will be to help
  refine, design, implement, deliver, and maintain an
  international top-class product, ensuring quality,
  maintainability, and sustainability.

  The Tech Stack

  We have created a scalable Spring Boot Application running
  on Java 25 in Kubernetes, deployed in a multi-region setup
  in AWS. Developers are able to run a full development
  environment locally, which gives a great developer
  experience.

  Responsibilities

  - Build and evolve our backend services and infrastructure to
    stay ahead of our growth curve.
  - Develop exciting new features for our customers and
    businesses who partner with us.
  - Actively participate in your team’s agile development
    processes with a continuous improvement mindset.
  - Strive to deliver international top-class products with
    maximum quality, maintainability and scalability.
  - Take on additional tasks outside your current boundaries
    with help from your team to continue to grow and expand
    your skills.

  The ideal candidate

  - A wealth of experience in Backend development with the Java
    ecosystem.
  - Proven production experience with Java, SpringBoot, MySQL,
    Message System & GIT.
  - Has worked with Domain Driven Design, and Clean, or
    Hexagonal Architecture.
  - Knowledge of AWS services (SQS, SNS, S3…), ElasticSearch,
    Redis, Docker, Kubernetes.
  - Experience with Restful APIs.
  - Experience with building scalable solutions.
  - Enjoys actively participating in a cross-functional product
    team.
  - Takes pride in writing quality code.

  Our Values

  - We Win Together
  - We Raise the Bar
  - We Keep It Simple
  - We Build A Legacy
  - We Care

  What we have to offer

  - A rare opportunity to work in a social impact company where
    you can see real and tangible impact in your role.
  - Working alongside an international community of users,
    partners and 1,200+ colleagues across 20 countries that
    are on the same important mission.
  - Personal and professional development opportunities in a
    fast-paced scale-up environment.
  - An inclusive company culture where you can bring your
    authentic self to work.
  - A strong, values-driven team culture where we celebrate
    successes and socialise with colleagues that care.

  Benefits

  WORK FLEXIBLY:

  - Enjoy hybrid working from our great office (2 days per week
    in Shoreditch).
  - Extra parental leave and days off beyond local legislation
    and the option to take an extra week of unpaid leave.
  - Health insurance and pension plans.
  - Additional days off for significant life events.

  CELEBRATE & SOCIALISE

  - Regular social events like summer and winter parties.
  - Coffee, snacks and fully-equipped kitchens.
  - Get to know our community with a monthly free Surprise Bag.
  - Paid volunteer time through our Shareback volunteering
    programme.
  - Women in the Workplace, P.R.I.D.E., People of Colour and
    Functionally Diverse Employee Resource Groups .

  How to apply

  We take recruitment very seriously, so please carefully read
  everything we have written above. Please also check our
  website and international media in order to get a good
  overview of Too Good To Go.

  Submit your CV and Cover letter in English.

  Please note that we only accept applications coming through
  our platform. No CV or Cover Letter will be accepted by
  email or LinkedIn direct messaging.

