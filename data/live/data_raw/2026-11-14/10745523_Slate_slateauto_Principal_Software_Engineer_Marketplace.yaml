description: |
  ABOUT SLATE

  At Slate, we’re building safe, reliable vehicles that people
  can afford, personalize and love—and doing it here in the
  USA as part of our commitment to reindustrialization. The
  spirit of DIY and customization runs throughout every
  element of a Slate, because people should have control over
  how their trucks look, feel, and represent them.

  WHO ARE WE LOOKING FOR

  Slate is looking for a Principal Software Development
  Engineer to define and lead the technical strategy for our
  next-generation ecommerce platform. We’re building a direct-
  to-consumer EV brand from the ground up, and this role will
  own the systems that connect customers to their Slate, from
  discovering and customizing their vehicle to purchasing
  accessories and managing their ownership journey.

  You’ll architect and evolve the platform that powers our
  digital storefront, spanning product discovery, vehicle
  configuration, checkout, payments, order management, and
  fulfillment. This is a high-impact role where your technical
  decisions will shape the customer experience and directly
  influence the future of Slate.

  You thrive in environments where the path is not always
  defined. You enjoy solving complex problems, making
  thoughtful decisions with incomplete information, and
  balancing speed with long-term technical excellence. At
  Slate, there is no distance between what you build and the
  impact it creates - your work will help define how customers
  experience an entirely new automotive brand.

  WHAT YOU'LL GET TO DO

  - You lead the definition, design, architecture,
    implementation, and delivery of Slate software.
  - You code and test system components, leading code and design
    reviews.
  - You own end-to-end code quality, system tests, functional
    tests, and integration.
  - You relentlessly simplify, demonstrating significant
    innovation, creativity, and judgement when solving
    challenging problems.
  - You collaborate with UX and product teams to build and
    invent new solutions and applications that put customers
    first.
  - You are considered an authority on technical issues by the
    technical and business community and are frequently
    consulted for making difficult trade-off decisions.
  - You drive awareness about the impact and consequences of
    technical decisions on the business, balancing technical
    leadership with strong business judgment to make the right
    long-term decisions about technology choices.
  - You assist in the career development of others, actively
    mentoring individuals and the community on advanced
    technical issues and helping managers guide the career
    growth of their team members.



  WHAT YOU'LL BRING TO THE TEAM

  - 12+ years of professional software development experience,
    with deep expertise building and operating scalable,
    customer-facing software systems.
  - Strong technical leadership experience, including defining
    architecture, making complex technical trade-offs, and
    driving engineering decisions across teams.
  - Experience designing and building reliable, scalable
    distributed systems, including web services, APIs, cloud
    infrastructure, and modern software development practices.
  - Proven ability to lead through ambiguity, simplify complex
    problems, and deliver high-quality solutions in fast-paced
    environments.
  - Experience with modern ecommerce architectures, including
    headless or composable commerce patterns and integrations
    across product catalog (PIM), cart/checkout, payments,
    order management (OMS), and fulfillment systems.
  - Experience integrating third-party platforms and SaaS
    products through APIs, events, and webhooks to create
    seamless customer experiences.
  - Familiarity with marketplace or multi-vendor commerce models
    and the technical challenges they introduce.
  - Experience building high-performance customer experiences,
    including frontend performance optimization, Core Web
    Vitals, and conversion-focused engineering.

  SALARY RANGE

  The compensation  for this position is the range Slate
  reasonably and in good faith expects to pay for the position
  taking into account the wide variety of factors that are
  considered in making compensation decisions, including job-
  related knowledge; skillset; experience, education and
  training; certifications; work location; and other relevant
  business and organizational factors.

  Base Pay Range (Annual)

  155,854.00 - 233,781.00 USD Annual

  Additional Compensation and Benefits: Slate offers a wide
  range of competitive benefits, including medical, dental,
  vision, life insurance, disability insurance, vacation, and
  401k. The successful candidate may also be eligible to
  participate in the equity program and/or a discretionary
  annual incentive program, subject to the rules governing
  such programs.

  WHY JOIN TEAM SLATE?

  At Slate, we’re fueled by grit, determination, and attention
  to detail. The start-up spirit of ingenuity and
  resourcefulness move our business forward. Team Slate
  fosters a culture of excellence, innovation, and mutual
  respect, and is motivated by shared principles.

  - Safety First
  - Delight Customers
  - One Team
  - Relentless Improvement
  - Fast, Frugal, and Scrappy
  - Respectful Collaboration
  - Positive Legacy

  WE WANT TO WORK WITH PEOPLE THAT REFLECT THE COMMUNITIES IN
  WHICH WE OPERATE.

  Slate is proud to be an Equal Employment Opportunity and
  Affirmative Action employer. We do not discriminate based
  upon race, color, religion, gender, gender identity or
  expression, sexual orientation, national origin, genetics,
  disability, age, veteran status, marital status, parental
  status, cultural background, organizational level, work
  styles, tenure and life experiences. Or for any other
  reason.

  Slate is committed to providing reasonable accommodation for
  qualified individuals with disabilities in our job
  application procedures. If you need assistance or an
  accommodation due to a disability, you may contact us at

  slate-talent_acquisition@slate.auto.
