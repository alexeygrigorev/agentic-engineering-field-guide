description: |
  At MyFitnessPal, we believe good health starts with what you
  eat. We provide tools, resources and support to enable users
  to reach their health goals.

  We are looking for a Software Engineering Manager to join
  the MyFitnessPal Engineering team leading our Advertising
  squad to drive the development of a quality-first ad
  experience for our users.

  As a member of our MyFitnessPal Engineering team, you’ll
  lead a cross-functional team of backend and iOS engineers
  focused on outcomes over outputs, using data and
  experimentation to drive MFP's product strategy.

  About the Team:

  The team is responsible for building the ad experiences that
  help fund our mission while respecting user privacy and
  trust. The team of iOS engineers works closely with Product,
  Design, Ad Operations, and Sales on programmatic and direct-
  sold formats, including native ads, post-log interstitials,
  and sponsored in-app experiences. You'll lead a squad that
  ships experiments quickly, partners across the business, and
  navigates the evolving privacy and consent landscape.

  Essential Duties:

  As the Engineering Manager you are first and foremost
  responsible for the team and their ability to support the
  objectives of the product squad. You will ensure engineers
  are working closely with Product and Design in discovery and
  the work is eﬀectively transitioned through delivery,
  keeping an eye on the quality and maintainability of
  codebases.

  What you’ll be doing:

  - Partner closely with Product and Design, leveraging a
    variety of qualitative and quantitative tools to discover
    solutions that are valuable for customers and the business
  - Take a hands-on approach to delivery management, ensuring
    the backlog is healthy, maintenance and tech debt work are
    scheduled, and work is broken down appropriately, in a
    timely manner
  - Run team ceremonies while coaching others to do the same to
    create an engaged, empowered team environment
  - Coach and develop your team, investing in individuals while
    keeping team health top-of-mind

  Qualifications to be successful in this role:

  - 2+ years experience leading mobile engineering teams in the
    Product Model, working iteratively with a deep focus on
    outcomes
  - Strong foundation in A/B testing-based product iterations
  - Experience leading consumer-facing development work focused
    on native apps using iterative, learning-focused agile
    methodologies
  - A track record of collaborative partnership with Product,
    Design, and Engineering teams to plan, execute, and
    deliver projects
  - Experience developing high-trust engineering teams through
    mentorship and coaching: you set clear goals, context, and
    decision-making frameworks while empowering engineers to
    own technical execution and tradeoff discussions
  - Knowledge of common patterns and software engineering and
    best practices: you’ve worked with high-traffic mobile
    applications and know how to build for scale, balancing
    speed, quality, and safety.

  Values you’ll model

  - Be Kind and Care — build with empathy; assume positive
    intent; support teammates and members.
  - Live Good Health — champion healthy habits and balance in
    how we work and what we ship.
  - Be Data-Inspired — ground decisions in research and data;
    measure what matters.
  - Champion Change — lean into ambiguity; iterate, learn, and
    improve continuously.
  - Leave it Better than You Found It — raise quality, clarify
    systems, and document as you go.
  - Make It Happen — bias to action; deliver impact with craft
    and accountability.

  The reasonably estimated salary for this role at
  MyFitnessPal ranges from $140,000 - $190,000. Actual
  compensation is based on factors such as the candidate’s
  skills, qualifications, and experience. In addition,
  MyFitnessPal offers a wide range of comprehensive and
  inclusive employee benefits for this role including
  healthcare, parental planning, mental health benefits,
  annual performance bonus, a 401(k) plan and match,
  responsible time off, monthly wellness and technology
  allowances, and others.

  Exciting Full-Time Employee Benefits, Perks and Culture

  Face-to-Face Connections: We value personal connections.
  Enjoy opportunities to meet and connect with your team
  members in person to help forge meaningful relationships
  that extend beyond the virtual realm. Teams meet as often as
  needed and all of MyFitnessPal gathers annually.

  Flexibility At Its Best: Achieve the work-life balance you
  deserve. Enjoy a flexible time-off policy with our
  Responsible Time Off benefit.

  Give Back: Use  your volunteer days off to support what
  matters most to you. Each full time teammate receives 2 days
  per calendar year to give back to their community through
  service.

  Mentorship Program: Take control of your career through our
  mentorship program where, if you’d like, you will be matched
  with a teammate who can help you scale your skills and
  propel your growth.

  Family-Friendly Support: Embrace the journey with confidence
  and care. Enjoy our paid maternity and paternity leave, to
  provide time to balance family responsibilities with your
  career and take the time needed to strengthen family
  relationships.  We understand the complexities of starting
  or expanding a family, which is why we provide best-in-class
  comprehensive assistance for fertility-related matters.

  Wellness Comes First: Live Good Health is one of our core
  values. Receive a monthly Wellness Allowance, empowering you
  to focus on your physical and mental well-being by choosing
  from a range of wellness initiatives, including dedicated
  mental health days.

  Celebrate Greatness: Your hard work deserves recognition!
  Our reward and recognition platform empowers peers to
  acknowledge and reward each other for the exceptional
  contributions they make.

  Elevate Your Health & Fitness: Get access to MyFitnessPal
  Premium, allowing you to take your fitness, health and
  wellness journey to new heights.

  Unlock Your Potential: Access our virtual learning and
  development library, and participate in training
  opportunities  to continuously grow and enhance your skills.

  Championing Inclusion: Our dedicated DEI Committee actively
  fosters a diverse and inclusive workplace by setting
  actionable goals and evaluating progress across the
  organization.

  Healthcare Matters: Your well-being is our priority. Take
  advantage of our competitive medical, dental, and vision
  benefits that cater to your holistic healthcare needs. Feel
  secure and supported on your wellness journey.

  Secure Your Future: Benefit from our retirement savings
  program, giving you peace of mind for your financial goals.
  Reach them sooner with MyFitnessPal’s competitive employer
  match.

  At MyFitnessPal, our mission is to enable people to make
  healthy choices. And it wouldn't be possible without our
  team. We celebrate the unique POV that each person brings to
  the table and believe in a collaborative and inclusive
  environment. As an equal opportunity employer, we prohibit
  any unlawful discrimination on the basis of race, religion,
  military or veteran status, sex, gender, marital status,
  gender identity or expression, sexual orientation, national
  origin, age, or disability. These are our guiding ideologies
  and apply across all aspects of employment.

  MyFitnessPal participates in E-Verify.
