description: |
  The Role

  We are hiring Software Engineers (E3) to build the product
  and systems through which customers experience Clark.

  You will own projects and features from customer problem
  through implementation, working across frontend
  applications, backend services, integrations, and production
  systems.

  This is a broad engineering role for someone who enjoys
  operating across the stack, collaborating closely with users
  and teammates, and taking ownership of meaningful product
  and technical outcomes.

  You will help build customer-facing workflows, integrations,
  internal tooling, and platform capabilities that support
  Clark's continued growth.

  Why This Role Matters

  Clark's customers operate across complex workflows involving
  documents, accounting systems, workpapers, approvals,
  evidence, and collaboration.

  Software Engineers help turn Clark's AI capabilities into
  products customers can rely on every day. You'll build the
  workflows, integrations, and experiences that make audit
  work faster, more accurate, and more scalable.

  The systems you build will directly influence customer
  experience, product velocity, and our ability to grow
  alongside our customers.

  What You'll Do

  - Own and ship product features from planning through
    production
  - Build intuitive user experiences for complex audit and
    accounting workflows
  - Design and implement APIs, services, data models, and
    application logic
  - Partner with AI engineers to integrate AI capabilities into
    customer-facing products
  - Build integrations with customer systems and third-party
    platforms
  - Improve the reliability, scalability, and performance of
    existing systems
  - Contribute to shared services, internal tools, and platform
    capabilities
  - Improve observability, testing, deployment, and developer
    workflows
  - Investigate production issues and help resolve operational
    challenges
  - Work closely with Product, Design, Customer Success,
    Implementation, and Sales teams
  - Translate business and customer requirements into practical
    technical solutions
  - Maintain high standards for security, reliability, and code
    quality
  - Contribute to technical discussions and engineering best
    practices

  Who You Are

  - 2-5 years of software engineering experience
  - Experience building and maintaining production web
    applications
  - Strong foundations in software engineering, system design,
    and debugging
  - Comfortable owning projects independently from requirements
    through deployment
  - Experience building APIs, backend services, and modern web
    applications
  - Familiarity with relational databases and cloud
    infrastructure
  - Strong product instincts and customer empathy
  - Comfortable working with ambiguity and making sound
    technical decisions
  - Able to balance speed, quality, and maintainability
  - Strong communication skills and a collaborative mindset
  - High ownership and accountability
  - Excited to work in person with a fast-moving, talent-dense
    team

  Bonus

  - Experience building enterprise SaaS products or workflow
    software
  - Experience building integrations, APIs, or data
    synchronization systems
  - Experience with accounting, compliance, financial, or
    document-management software
  - Experience incorporating LLMs or AI systems into products
  - Experience with cloud infrastructure, observability, or
    platform tooling
  - Experience automating internal business processes
  - Experience working at an early-stage startup
