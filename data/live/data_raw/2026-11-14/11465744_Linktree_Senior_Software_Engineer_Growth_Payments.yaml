description: |
  The Role

  We are seeking a talented and experienced Software Engineer
  with a deep understanding of payment platforms and the
  ability to optimize them for efficiency, security, and
  performance. The ideal candidate will play a crucial role in
  enhancing our payment systems to ensure seamless
  transactions, improve recurring payment performance, reduce
  latency, and maintain the highest level of security. If you
  are passionate about payment technology and have a proven
  track record of optimizing payment platforms, we invite you
  to apply for this position.

  What You’ll Own

  - Payment Platform Optimization:
    - Collaborate with cross-functional teams to analyze, design,
      and implement enhancements to our payment platforms.
    - Improve recurring payment performance and reliability across
      the subscription lifecycle.
    - Ensure compliance with industry standards and regulations in
      all payment-related activities.
  - Performance Enhancement:
    - Optimize payment processing pipelines to reduce latency and
      increase transaction speed, as well as throughput
    - Monitor system performance and proactively address issues
      that could impact payment processing.
    - Ensure graceful handling of payment service provider
      degradation, timeouts, and other failure scenarios.
  - Security and Fraud Prevention:
    - Implement and maintain robust security measures to protect
      sensitive payment data.
    - Stay updated on the latest security threats and best
      practices in payment security.
    - Collaborate with security teams to proactively detect and
      prevent fraud.
  - Integration and API Development:
    - Work closely with third-party payment service providers to
      integrate their APIs into our systems.
    - Develop and maintain APIs for payment processing and
      reconciliation.
    - Ensure seamless integration with various payment methods and
      gateways.
  - Payment Platform Monitoring:
    - Implement monitoring and alerting systems to track the
      health and performance of payment platforms.
    - Respond to incidents and troubleshoot issues related to
      payment processing.
    - Maintain thorough logs and documentation for auditing
      purposes.

  Who We’re Looking For

  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field (or equivalent work experience).
  - Proven experience as a Software Engineer with a focus on
    payment platforms and optimization.
  - Strong understanding of payment processing workflows,
    protocols, and security standards (e.g., PCI DSS).
  - Proficiency in programming languages commonly used for
    payment platforms (e.g., Python, Java, C++).
  - Experience using AI coding assistants to accelerate software
    development, with the ability to effectively prompt,
    iterate, validate, and refine AI-generated code.
  - Experience with payment gateway integrations and APIs.
  - Knowledge of database systems and data modeling related to
    payments.
  - Familiarity with payment fraud prevention and risk
    management.
  - Excellent problem-solving and debugging skills.
  - Strong communication and teamwork skills.
  - Attention to detail and a commitment to delivering high-
    quality work.
  - Self-motivated and able to work independently or in a
    collaborative environment.
  - Knowledge of mobile payment technologies.
  - Familiarity with regulatory requirements in the payments
    industry.
  - Experience working with cloud-based payment solutions.

  Linktree is committed to providing a fair and competitive
  compensation package including cash, equity, and benefits.
  The base salary offered for this role is targeted at
  $190,000-$215,000 for roles based in San Francisco and Los
  Angeles. Final offers depend on multiple factors including
  location, experience, expertise, and role scope, and may
  vary from the range listed.

  P.S. If you don’t tick every box in this listing, please
  don’t rule yourself out. We take pride in inclusion and
  hiring incredible human beings with great potential over
  ticking boxes – so if this role resonates with you, hit that
  apply button!

  Our Story

  We’re on a mission to empower anyone to curate, grow, and
  monetize their digital universe. We created the “link in
  bio” category — and we’re just getting started. From
  creators, artists, and entrepreneurs to global brands, we’re
  redefining how people connect with their communities,
  showcase their content and promote products — all in one
  link.

  Today, a community of 70+ million use Linktree, including
  icons like Adidas, TikTok, the UN Environmental Program, The
  NFL, Manchester United, World Central Kitchen, Sabrina
  Carpenter, Olivia Rodrigo, and Selena Gomez. With 48,000 new
  accounts created every day, Linktree is the fastest-growing
  leader in our space.

  We’ve teamed up with some of the world’s biggest platforms
  including TikTok, Snap, YouTube, GoFundMe, Spotify, Google,
  Stripe, Reddit, Laylo, and Kajabi, to unify Linkers’ digital
  spaces, and we partner with retail brands Amazon, Nike,
  Nordstrom Target, Sephora, Vuori, and more to share products
  they love.

  We’re a tight-knit, passionate team building best-in-class
  tools that make online presence simple, powerful, and yours.
  If you're excited by the idea of shaping a new category,
  setting the standard, and making space for everyone to be
  seen and succeed, we’d love to meet you.

  Where and How We Work

  We're a global, diverse team spread across continents with
  offices in London, Los Angeles, Melbourne, and San
  Francisco. We work together flexibly and you can choose the
  setup that works best for you: fully remote or a hybrid mix
  of office and home.

  We offer autonomy in how you structure your days and weeks.
  While we’re mindful of time zones and occasionally
  collaborate outside the typical 9–5, we lean into async work
  to keep things flowing. Our culture is family-friendly and
  Zoom-casual where kids, pets, and delivery drivers are
  welcome.

  How we’ll help you thrive

  Our approach to benefits considers the whole person and the
  unique contributions they bring to Linktree. We want the
  experience at Linktree to be one that enables people to
  truly thrive so we can Go Further Together (one of our
  values). Some ways we support you:

  - An annual wellbeing allowance to use on things like (but not
    limited to) fitness memberships, development courses,
    childcare, travel, charitable donations, pet insurance,
    home office set-up - the choice is yours!
  - 100% coverage (and 80% for your dependents) of your monthly
    premiums for medical, dental, vision, disability and life
    insurance for US-based employees.
  - Employer contribution towards your retirement.
  - Generous time off for vacation, holidays, parental leave,
    volunteer time, and other categories.
  - Employee stock option program - we want each and every
    employee to share in the company’s success.

  At Linktree, we believe in promoting a culture that
  celebrates unique backgrounds, talents, and experiences, and
  we’re proud to be an equal opportunity workplace. We are
  creating an inclusive workplace where every individual feels
  valued, respected, and has equal opportunities to thrive. We
  aim to foster a diverse and inclusive environment where all
  team members have a sense of belonging. Linktree welcomes
  all people regardless of sex, gender identity, race,
  ethnicity, disability, pregnancy, age, or other lived
  experience. If you require accommodations to fully
  participate in our opportunities, please don't hesitate to
  reach us at talent@linktr.ee – your needs are important to
  us.
