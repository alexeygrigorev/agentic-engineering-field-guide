description: |
  About Atticus

  At any given time, 16 million Americans are experiencing a
  crisis that requires urgent help from our legal system or
  government. The right assistance could transform their
  lives. But today, most never get it.

  Our mission is to tear down barriers between people in
  crisis and the aid they deserve. In the last six years,
  we’ve become the leading platform connecting people with
  disabilities to government benefits. We also help victims of
  accidents, misconduct, and violence get compensation from
  insurance. So far, we’ve helped hundreds of thousands of
  people access over $10 billion in life-changing aid —and
  earned over 20,000 five-star reviews. And we’re just getting
  started.

  We've raised more than $100 million from top VC firms like
  Forerunner, Google Ventures, and True Ventures, and we’re on
  our way to creating a category defining business assisting
  Americans in need.

  The Job

  As the Engineering Manager for our Growth Pod, you will lead
  a full-stack product pod, reporting directly to Toby, our VP
  of Engineering. You will be accountable for both the health
  and growth of the team, and what it delivers. That means
  shaping an ambitious roadmap and directly driving the work
  to get there.

  The Growth Pod is staffed with four full-stack engineers, a
  PM, a designer, and a data scientist who all share the same
  mission and goals: delivering experiences to help our
  clients find Atticus and understand how we can help them in
  a moment of crisis. The team operates on a rapid
  experimentation cadence, constantly testing new ideas and
  making data-driven decisions about what works best.

  Engineering Managers at Atticus are hands-on leaders. In
  addition to owning your team’s roadmap, you’ll shape your
  team’s culture and processes, have an active hand in
  developing the careers of the people you manage, and be
  actively involved in the day to day technical work your team
  ships. EMs here aren’t typically our most senior technical
  contributors, but you should expect to be directly
  accountable for the quality of your team’s output and
  closely involved in coaching their technical work. That
  means staying close to the code; we want you reviewing PRs,
  weighing in on architecture, and diving into the details
  alongside your teammates when that's the right call.

  Qualifications

  Required

  - You've managed a team of at least three engineers for more
    than a year.
  - You've grown engineers, including senior ICs and people
    early in their careers. You're also able to have hard
    performance conversations when someone isn't meeting
    expectations.
  - You've worked in a high-performing product organization,
    with strong PMs and designers, and you know what it means
    for engineers to own product outcomes.
  - You've operated with ambiguity and limited resources, either
    at a startup like ours or by carving that out inside a
    larger company.
  - You've been using AI coding tools seriously in your own work
    over the past year, and have a view on where they help and
    how to get the most out of them without shipping slop.
  - You’re hands-on. You write code, review it, and have
    opinions about how systems get built.

  Nice To Have

  - Expertise in A/B testing, experiment design, and growth-
    style rapid iterative product development.
  - Hands-on proficiency with our core stack: Go, TypeScript and
    Next.js, Temporal, or GCP. (Though, we care more that you
    can ramp quickly on technical context than that you've
    used these specific tools).
  - Background in an industry with complex professional
    workflows, such as legal, healthcare, or financial
    services.

  We are strongly committed to building a diverse team. If
  you’re from a background that’s underrepresented in tech,
  we’d love to meet you.

  Salary and Benefits

  This is a rare opportunity to join a startup that has strong
  traction (substantial funding, well-respected backers,
  tremendous growth, and many happy customers) but is still
  small enough that you can have a huge impact and play a role
  in shaping our culture.

  We’re a certified B Corporation tackling a critical social
  problem. Our mission to help people in need drives
  everything we do, and your work here will touch many lives.

  We offer competitive pay — including equity for all
  employees — and generous benefits:

  - Medical and dental insurance with 100% of premiums covered
    for employees and their families
  - 15 vacation days & ~20 paid holidays each year (including
    two weeks at end-of-year)
  - Free membership to OneMedical
  - $600/year internet stipend
  - $1,000/year reimbursable stipend for education and training
    outside of work
  - Up to $1,200/year student loan repayment assistance
  - 401(k) and optional HSA/FSA
  - Humble, thoughtful, smart, fun colleagues

  We anticipate the base salary band for this role will be
  between $195,500 and $264,500 in addition to equity and
  benefits. The salary at offer will be determined by a number
  of factors such as candidate’s experience, knowledge, skills
  and abilities, as well as internal equity among our team.

  Location

  This job is fully remote and we’re committed to empowering
  everyone with flexibility. Work remotely, and travel to LA
  (on the company dime) as needed to be with your colleagues –
  usually quarterly, plus offsites. We care a lot about
  building a great culture and we think some interactions need
  to happen in person, so we put a lot of thought into
  retreats, offsites, and other ways to gather.
