  About Us:

  Building Services 32BJ Benefit Funds (“the Funds”) is the
  umbrella organization responsible for administering Health,
  Pension, Retirement Savings, Training, and Legal Services
  benefits to over 100,000 SEIU 32BJ members. Our mission is
  to make significant contributions to the lives of our
  members by providing high quality benefits and services.
  Through our commitment, we embody five core values:
  Flexibility, Initiative, Respect, Sustainability, and
  Teamwork (FIRST). By following our core values, employees
  are open to different and new ways of doing things, take
  active steps to improve the organization, create an
  environment of trust and respect, approach their work with
  the intent of a positive outcome, and work collaboratively
  with colleagues.



  The Funds oversees and manages $9 billion of dollars in
  assets, which are made up of many, varied and complex funds.
  The dollars come from a number of sources, including the
  property owners who pay into the funds on behalf of their
  employees, and as such, requires those who oversee and
  manage the money to be highly skilled financial management
  people.

  For 2025 and beyond, 32BJ Benefit Funds will continue to
  drive innovation, equity, and technology insights to further
  help the lives of our hard-working members and their
  families. We use cutting edge technology such as: M365,
  Dynamics 365 CRM, Dynamics 365 F&O, Azure, AWS, SQL,
  Snowflake, QlikView, and more.



  Please take a moment to watch our video to learn more about
  our culture and contributions to our members:
  youtu.be/hYNdMGLn19A



  Job Summary:

  Under the supervision of the Team Lead, Application
  Development, the Senior Developer is involved in designing,
  coding, testing, and deploying software applications to meet
  business requirements. The Senior Developer would leverage
  technical expertise to configure and maintain software
  applications.



  Essential Duties and Responsibilities:

  - Develop and maintain new and existing applications, systems,
    custom reports, and database structure.

  - Participate in requirement analysis along with business
    analysts, and business users.

  - Design and develop various modules and work with other
    developers and other IT staff as required.

  - Write well designed, testable, efficient code, that adheres
    to security standards.

  - Develop and design database schema, SQL queries and tuning,
    and stored procedures.

  - Production and End User Support Activities.

  - Estimate effort involved in completing various development
    tasks.

  - Plan and prioritize activities.

  - Report activities and progress to the management on a
    regular basis.

  - Work on multiple projects at the same time.

  - Assist and support other programmers in development
    procedures, techniques, and coding assignments.

  - Create and update System documentation and Design
    specifications.

  - Apply industry software development standards and best
    practices.

  - Research and recommend new and existing technologies to meet
    business needs, including creating prototypes, design
    documents, and solution designs.

  - Perform tasks as required by management/supervisory staff.

  - Provide support after hours, on weekends for emergency
    issues and production releases as required.



  Qualifications (Competencies):

  - To perform this job successfully, an individual must be able
    to perform each essential duty satisfactorily. The
    requirements listed below are representative of the
    knowledge, skill, and/or ability required.
  - 5-10 years of professional experience in
    designing/developing software applications.
  - Experience in full System Development Life Cycle (SDLC) with
    knowledge of Agile and/or Waterfall methodologies.
  - Good knowledge of Object-Oriented design.
  - Experience building and consuming REST APIs (and/or GraphQL
    is a plus).
  - Minimum 5 years working experience in HTML5, CSS3,
    JavaScript/TypeScript, Modern frameworks like React /
    Angular / Vue (at least one)
  - Experience with SQL and database design.
  - Minimum 5 years of working experience in a high-level
    programming language such as C#, Java, Python
  - Experience in developing/deploying web applications.
  - Experience in with cloud services (Azure, AWS, Google).
  - Experience with authentication/authorization (OAuth, JWT,
    SSO concepts).
  - Ability to work with business analysts and business users.
  - Candidate must have excellent communication (verbal and
    written) and interpersonal skills.
  - Experience working with Microsoft SharePoint and/or
    Microsoft Dynamics is a plus.



  Soft Skills (Interpersonal Skills):

  - Detail oriented with excellent organization and analytical
    skills.

  - Ability to plan and take initiatives to accomplish
    objectives in a timely fashion.

  - Ability to prioritize work and meet deadlines.

  - Ability to establish and maintain effective working
    relationships with project team members, supervisors, and
    employees from other departments.



  Education:

  Bachelor’s degree in Computer Science, or a related
  discipline.



  Language Skills:

  Speak, read, write, and understand English.



  Reasoning Ability:

  High



  Certificates, Licenses, Registrations:

  None



