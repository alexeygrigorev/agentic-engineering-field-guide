description: |
  Welcome to Planet. We believe in using space to help life on
  Earth.

  Planet designs, builds, and operates the largest
  constellation of imaging satellites in history. This
  constellation delivers an unprecedented dataset of empirical
  information via a revolutionary cloud-based platform to
  authoritative figures in commercial, environmental, and
  humanitarian sectors. We are both a space company and data
  company all rolled into one.

  Customers and users across the globe use Planet's data to
  develop new technologies, drive revenue, power research, and
  solve our world’s toughest obstacles.

  As we control every component of hardware design,
  manufacturing, data processing, and software engineering,
  our office is a truly inspiring mix of experts from a
  variety of domains.

  We have a people-centric approach toward culture and
  community and we strive to iterate in a way that puts our
  team members first and prepares our company for growth. Join
  Planet and be a part of our mission to change the way people
  see the world.

  Planet is a global company with employees working remotely
  world wide and joining us from offices in San Francisco,
  Washington DC, Germany, Austria, Slovenia, and The
  Netherlands.

  About the Role:

  We’re looking for a Software Engineer focused on building
  clear, thoughtful experiences for customers to understand
  their accounts. Our team is small, and we are distributed
  across eastern North America and Europe. You will work on
  building experiences which make complex information
  comprehensible and interactive for customers and the
  business using React and Typescript interacting with Python
  and Golang backends.

  The ideal candidate will be willing to learn or have
  experience with all these languages, have a collaborative
  attitude, a customer-driven mindset, and be passionate about
  solving complex problems in innovative ways. Additionally,
  you will have the opportunity to work closely with cross-
  functional teams, contributing to the development of new
  features and improving existing systems.

  This is a full-time, hybrid role which will require you to
  work from our Berlin or Ljubljana office 3 days per week.

  Impact You’ll Own:

  - Iterating on a newly-built ecosystem of apps to address
    customer needs
  - Identifying, troubleshooting, and resolving technical issues
  - Conducting design and code reviews
  - Iterating new features based on team feedback
  - Developing tools and libraries and writing technical
    documentation to help other engineering teams integrate
    with customer telemetry
  - Ensuring the accuracy and reliability of code through
    automated testing

  What You Bring:

  - 4+ years of experience in software development
  - Bachelor’s degree in Computer Science or similar
  - Experience with React and Typescript, and steering the
    architecture of React apps
  - Professional working proficiency in English, the language of
    the company
  - Experience working in cross-functional teams that put
    customer requirements first
  - Ability to be adaptable and open to mentorship
  - Experience with CI/CD and source control tooling (GitHub,
    GitLab)

  What Makes You Stand Out:

  - Experience working collaboratively with product managers and
    designers
  - Experience with a production React ecosystem (Redux Thunk,
    Emotion CSS)
  - Experience with OpenAPI and REST code generation
  - Experience with iterative, agile development
  - Experience using spatial data and web mapping

  Application Deadline:

  11:45p / 23:45 CET on the date stated below. Applications
  are reviewed on a rolling basis. This posting may be removed
  earlier than projected if a suitable pool of applications
  has been received. For this reason, we recommend applying as
  soon as you are able to.

  Benefits While Working at Planet:

  These offerings are dependent on employment type and
  geographical location, based upon applicable law or company
  policy.

  - Paid time off including vacation, holidays and company-wide
    days off
  - Employee Wellness Program
  - Home Office Reimbursement
  - Monthly Phone and Internet Reimbursement
  - Tuition Reimbursement and access to LinkedIn Learning
  - Equity
  - Volunteering Paid Time Off

  Compensation:

  The expected starting gross salary range for this role is
  listed below. Individual placement within this range is
  determined objectively based on gender-neutral criteria such
  as your skills, qualifications, and professional experience.
  This position may also be eligible for discretionary bonuses
  and/or equity.

  Germany Salary Range

  €60.900—€76.100 EUR

  San Francisco Fair Chance Ordinance Pursuant to the San
  Francisco Fair Chance Ordinance, we will consider for
  employment qualified applicants with arrest and conviction
  records.

  Why we care so much about Belonging.  We’re dedicated to
  helping the whole Planet, and to do that we must strive to
  represent all of it within each of our offices and on all of
  our teams. That’s why Planet is guided by an ultimate north
  star of Belonging—dreaming big as we approach our ongoing
  work.  If this job intrigues you, but you’re thinking you
  might not have all the qualifications, please... do apply!
  At Planet, we are looking for well-rounded people from
  around the world who can contribute to more ways than just
  what is listed in this job description.  We don’t just fill
  positions, we aspire to fulfill people’s careers, most
  excited about folks who are motivated by our underlying
  humanitarian efforts.  We are a few orbits around the sun
  before we get to where we want to be, so we hope you’re
  excited to come along for the ride.

