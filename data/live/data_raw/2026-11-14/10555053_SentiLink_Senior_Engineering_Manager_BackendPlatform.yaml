description: |
  SentiLink helps institutions and protects customers by
  accurately resolving identities and flagging fraud risk.
  Each day, we verify more than 3 million identities, flagging
  150k+ fraud attempts in the process. The problems we work on
  are challenging, and solving them takes deep domain
  expertise, rigorous analysis, and a willingness to dig into
  the details.

  At SentiLink, you'll work alongside smart, highly
  collaborative colleagues who respect each other's time and
  judgment, take ownership, and follow through on their
  commitments. Together, we do truly meaningful work
  protecting the identities of innocent consumers and flagging
  the fraudsters attempting to exploit them.

  We're well capitalized and growing quickly. We already serve
  13 of the top 15 U.S. banks, we're expanding into new
  markets, and we're backed by Craft Ventures, Andreessen
  Horowitz, NYCA, and Max Levchin. We've been named to the
  Forbes Fintech 50 and as a 2026 FICO Industry Vanguard
  Decision Award Winner. We were also the first company to go
  live with the electronic Consent Based Social Security
  Number Verification (eCBSV) service, and we've testified
  before the U.S. Congress on the future of identity.

  We want SentiLink to be the best place you've ever worked.
  We offer generous benefits and support a range of working
  arrangements, from fully remote to in-office. We are a
  digital-first company with strong collaboration across the
  U.S. and India, and we meet in person regularly to build
  relationships. We have offices in Austin, San Francisco, New
  York City, Seattle (Bellevue), Los Angeles, and Chicago in
  the U.S., and in Gurugram (Delhi) and Bengaluru in India.

  Role:

  We’re looking for a strong Senior Engineering Manager to
  lead a backend/platform-focused engineering team responsible
  for powering SentiLink’s core products.

  This team owns the backend systems, external APIs, and
  services that power these experiences, as well as the
  technical foundation that ensures the product is scalable,
  reliable, and secure.

  You will lead a small but growing team of engineers
  responsible for building API-driven systems, evolving our
  platform architecture, and enabling product teams to move
  quickly with confidence.

  This role sits at the intersection of backend platform
  development, technical architecture, and people leadership.
  You’ll partner closely with product, data science,
  infrastructure, and front-end engineering teams to deliver
  high-quality systems in a fast-moving environment.

  We are looking for a manager who is fundamentally a strong
  backend engineer and enjoys staying close to technical work,
  contributing to architecture, guiding design decisions, and
  unblocking complex systems challenges.

  This is a remote, US-based position.

  Technologies: React, Golang, Python, PostgreSQL (RDS),
  Docker, OpenSearch, AWS technologies (Lambda, Cognito and
  other standard services)

  Responsibilities:

  - Lead and grow a team of 10 Senior & Staff backend/platform
    engineers building the systems that power Intercept and
    other critical applications
  - Drive execution across planning, prioritization, and
    delivery with a focus on reliability and scalability
  - Own the technical direction of backend services and APIs,
    ensuring systems are secure, performant, and maintainable
  - Partner with product and front-end teams to translate
    product requirements into robust backend architectures
  - Collaborate with data science to productionize models and
    integrate decisioning systems into APIs and workflows
  - Work closely with infrastructure to improve system
    reliability, observability, and developer experience
  - Contribute to architectural decisions and guide the long-
    term evolution of our platform
  - Maintain high standards for code quality, testing, and
    operational excellence
  - Support incident response and ensure systems meet SLA
    expectations
  - Hire, mentor, and develop engineers while maintaining a high
    hiring bar
  - Foster a culture of ownership, accountability, and
    continuous improvement
  - Contribute to code and technical problem-solving as needed

  Requirements:

  - 3-7 years of engineering management experience leading
    backend or platform teams
  - Strong background as a senior or staff-level backend
    engineer
  - Deep experience building API-driven systems using languages
    like Golang, Python, or similar
  - Strong understanding of distributed systems, scalability,
    and system design
  - Experience owning and evolving backend architecture in
    production environments
  - Track record of shipping complex, customer-facing or
    platform systems
  - Comfortable leading technical discussions and diving into
    implementation details
  - Experience working in fast-paced, startup or growth-stage
    environments

  - Experience building platforms that support product teams
    (internal APIs, shared services, developer tooling)
    preferred
  - Familiarity with data-intensive systems, search
    (OpenSearch), or risk/decisioning systems preferred
  - Experience in fintech or highly regulated environments
    preferred

  Compensation:

  $200,000/year - $260,000/year + equity + benefits

  Perks:

  - Employer paid group health insurance for you and your
    dependents
  - 401(k) plan with employer match (or equivalent for non US-
    based roles)
  - Flexible paid time off
  - Regular company-wide in-person events
  - Home office stipend, and more!

  Corporate Values:

  - Follow Through
  - Deep Understanding
  - Whatever It Takes
  - Do Something Smart
