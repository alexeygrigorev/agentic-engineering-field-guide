description: |
  Contribute to real software projects in a supported part-
  time internship, with the opportunity to progress to a full-
  time Junior Software Engineer role after three months.

  About the role

  This internship sits within Architexor’s Software &
  Automation practice. You will work with experienced team
  members on client-facing and internal applications, learning
  how requirements become maintainable software and how
  engineering decisions are communicated across a
  multidisciplinary studio. We expect curiosity, reliable
  follow-through and a willingness to ask thoughtful
  questions—not prior mastery of every tool in our stack.

  What you’ll do

  - Implement well-scoped application features and fixes with
    guidance from experienced engineers
  - Write clear, maintainable code in TypeScript, React, Python,
    C# or the agreed project stack
  - Test your work, investigate defects methodically and
    document what you learn
  - Participate in code reviews and apply feedback to improve
    both the code and your engineering judgment
  - Clarify requirements and communicate progress, questions and
    blockers early
  - Contribute to technical notes, setup instructions and
    project handover documentation
  - Work responsibly with source control, development
    environments and shared team workflows

  What we’re looking for

  - Foundational programming ability demonstrated through
    coursework, personal projects, open-source work or
    previous experience
  - Familiarity with at least one general-purpose programming
    language and the fundamentals of web applications
  - A basic understanding of APIs, data structures, version
    control and debugging
  - The ability to explain your approach, learn from feedback
    and improve work through iteration
  - Clear written communication and reliable participation in a
    remote team
  - Availability for an agreed part-time schedule throughout the
    initial three-month internship

  Helpful, but not essential

  - Experience with TypeScript, React, Node.js, Python, C# or
    .NET
  - A portfolio, GitHub profile or project account that explains
    your contribution and decisions
  - Exposure to databases, cloud deployment, automated testing
    or continuous integration
  - Interest in AI-assisted systems, workflow automation,
    architecture, BIM or creative technology

  What success looks like

  By the end of three months, you can deliver appropriately
  scoped work with growing independence, respond
  constructively to review, communicate risks early and leave
  code and documentation that another engineer can understand.

  Employment path

  This role begins as a part-time internship. After three
  months, we will review delivery quality, learning progress,
  communication, reliability and collaboration. Strong
  performance may lead to an offer for a full-time Junior
  Software Engineer position, subject to business needs and
  mutual fit.

  Compensation

  Compensation, expected weekly hours and scheduling will be
  discussed during the interview process and will reflect the
  candidate’s location and experience.
