description: |
  Senior Software Engineer, Backend Services & APIs

  Office based in Moorgate, London

  Join Fortinet, a global cybersecurity pioneer with over two
  decades of excellence, as we continue to shape the future of
  cybersecurity and redefine the intersection of networking
  and security. At Fortinet, our mission is to safeguard
  people, devices, and data everywhere. We are currently
  seeking an experienced Software Engineer to contribute to
  the success of our rapidly growing business.

  The FortiDLP platform collects millions of data points per
  second. We protect people and data anywhere, and innovative
  companies worldwide use FortiDLP for human-centric data loss
  protection. Our users need a way to spot trends in this
  data, search for security breaches, and take effective
  action. Handling data at that scale, while developing and
  maintaining services and integrations is a complex
  challenge. The FortiDLP team is looking for a Senior
  Software Engineer passionate about finding pragmatic
  solutions to delicate problems to help with the server-side
  applications underpinning FortiDLP, including APIs,
  databases, and external integrations.

  Key Responsibilities and Technologies:

  ●    Implementing new capabilities within the FortiDLP
  server-side services, taking ownership of features and
  leading the development effort. ●    Maintain and improve
  existing functionalities of the FortiDLP platform. ●
  Contributing to code, tests, and code review. ●    Keep a
  strong focus on code quality, maintainability, and secure
  coding practices. ●    Maintain close communication within
  the team as well as across other teams to coordinate
  progress. ●    Optionally help with operational tasks
  maintaining the FortiDLP service.


  Direct experience in these technologies is a bonus but not a
  requirement. We are looking for relevant experience in
  comparable technologies and frameworks, and the ability to
  learn new technologies.

  We value: ●    Strong programming skills backed by at least
  3-5 years of software engineering experience. ●
  Familiarity with computer science fundamentals and backend
  development concepts. ●    Experience in Golang. ●
  Experience with relational and non-relational databases
  (e.g. Elasticsearch, Postgres). ●    Experience with micro-
  service architecture and Cloud computing environments. ●
  Experience with high-volume data pipelines.

  Communication and Collaboration: We work on complex, cross-
  functional features that require close collaboration with
  engineers across the stack, product managers, technical
  writers, and support teams. Team members contribute
  throughout the development lifecycle — from writing
  technical specifications and coordinating implementation to
  demoing features internally, supporting launches, and
  ensuring our solutions are well-documented and maintainable.
  We also work closely with the support and QA teams to
  prepare for releases, debug early issues in the field, and
  ensure a smooth rollout experience. High engineering
  standards are central to our team culture, including
  thorough code reviews, rigorous testing, and shared
  responsibility for quality and reliability. We’re looking
  for engineers who communicate clearly, work well with a wide
  range of collaborators, and enjoy building shared
  understanding across disciplines. The role suits people who
  are thoughtful partners to product managers and support
  teams, value feedback as part of the development process,
  and bring a sense of ownership and care to both their code
  and their collaboration. Why Join Us:


