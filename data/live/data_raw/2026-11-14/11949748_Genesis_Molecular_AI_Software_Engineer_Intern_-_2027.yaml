description: |
  Genesis Molecular AI is building a world-class software team
  to solve problems in drug discovery through machine
  learning, biophysical simulation, and computational
  chemistry. We are looking for engineers excited to help
  develop new medicines and play a critical role in building
  out our software platform.

  You will

  - Build and expand on tools for visualizing molecules and
    proteins, analyzing machine learning models, and managing
    complex chemical workflows
  - Work closely with machine learning engineers and medicinal
    chemists to develop and productionize new computational
    methods for molecular property prediction
  - Help scale our core infrastructure to handle billions of
    datapoints and thousands of parallel deep learning and
    molecular dynamics jobs

  You are

  - A strong software engineer who will write code quickly and
    uphold our code quality standards
  - A deep thinker who reasons from first principles over
    pattern matching
  - Interested in learning about biochemistry and the drug
    development process

  What we offer

  - The opportunity to work on high impact tools and products
    that are immediately deployed to accelerate the discovery
    of new medicines
  - Strong technical coworkers in AI, software, and chemistry,
    who all have a powerful mix of intellectual curiosity and
    humility. The team reads and discusses 1-2 machine
    learning or chemistry papers every week to stay on top of
    the field and inspire new ideas

  About Genesis Molecular AI

  Genesis Molecular AI is pioneering foundation models for
  molecular AI to unlock a new era of drug design and
  development. Our generative and predictive AI platform, GEMS
  (Genesis Exploration of Molecular Space), integrates AI and
  physics into industry-leading models to generate and
  optimize drug molecules, including the breakthrough
  generative diffusion model Pearl for structure prediction.
  Genesis is backed by premier AI and life science investors,
  including a16z, NVIDIA, Rock Springs Capital, Menlo
  Ventures, T. Rowe Price, Fidelity, and Radical Ventures.
  Genesis has also signed category-leading AI-pharma deals,
  the most recent of which was a significant expansion with
  Incyte (see coverage in Forbes and GEN) with a total
  potential deal value of several billion dollars.

  Genesis is headquartered in San Mateo, CA, with a fully
  integrated laboratory in San Diego. We are proud to be an
  inclusive workplace and an Equal Opportunity Employer.
