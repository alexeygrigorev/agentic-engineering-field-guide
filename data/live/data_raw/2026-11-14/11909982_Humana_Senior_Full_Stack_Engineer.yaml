description: |
  Become a part of our caring community Humana is seeking a
  Senior Full Stack Software Engineer who will be responsible
  for building and enhancing the UI/UX layer of Humana's
  Enterprise Data Governance Platform and Control Plane. This
  role will contribute to the design and development of
  modern, scalable applications that integrate with data
  governance, metadata, and analytics platforms across the
  enterprise. This position is ideal for a developer who
  enjoys working on complex systems, building full-stack
  applications, and helping shape the architecture of a
  platform used across the organization.

  The Senior Full Stack Engineer Is involved in all stages of
  software development, including front-end development, back-
  end development, database integrations, network and hosting
  management, user interface, user experience, and back-end
  server management. Begins to influence department's
  strategy. Makes decisions on moderately complex to complex
  issues regarding technical approach for project components,
  and work is performed without direction. Exercises
  considerable latitude in determining objectives and
  approaches to assignments. Key responsibilities include but
  are not limited to...

  - Support continuous improvement of the Information
    Marketplace as a core enterprise platform
  - Design, develop, and maintain full-stack web applications
    supporting the Information Marketplace platform
  - Build modern front-end interfaces using React, TypeScript,
    and state management frameworks
  - Develop scalable backend services and APIs using Node.js and
    related technologies
  - Translate business and technical requirements into well-
    designed, maintainable software solutions
  - Contribute to the architecture of microservices, APIs, and
    UI frameworks with a focus on scalability, security, and
    performance
  - Integrate with enterprise platforms including metadata
    services, APIs, and third-party tools
  - Troubleshoot and resolve complex application issues,
    identifying root causes and implementing long-term fixes
  - Optimize applications for performance, reliability, and
    usability
  - Participate in code reviews and help establish development
    standards and best practices
  - Collaborate with product owners, architects, data engineers,
    and governance teams to deliver new capabilities
  - Contribute to DevOps practices including CI/CD pipelines,
    containerization, and automated testing
  - Stay current with modern development frameworks, tools, and
    engineering practices

  Use your skills to make an impact


  Required Qualifications

  - Bachelor's degree in computer science, Engineering, or
    related field
  - 5 or more years of experience (ideally 8+ years of
    experience) in application development or full-stack
    engineering
  - 1 or more years of experience (ideally 2+ years of
    experience) developing applications using Go and/or
    Python.
  - Experience developing production web applications
  - Can evaluate challenges, identify practical solutions, and
    manage responsibilities proactively.
  - Experience utilizing AI and AI Coding tools to accelerate
    development lifecycle
  - Can collaborate in a cross-functional team environment
  - Experience with cloud environments (Especially Azure)
  - Experience working in Agile / Scrum teams
  - This role is not eligible for work visa sponsorship

  Required Skills

  - Node.js
  - React.js
  - TypeScript
  - Phython and/or Go
  - REST API development
  - Git-based source control
  - Experience building full-stack web applications

  Preferred Qualifications

  - Experience working on enterprise applications
  - Experience building developer platforms, data platforms, or
    internal tools
  - Master's degree in computer science or related field

  Preferred Skills

  - Redux or modern state management frameworks
  - Tailwind CSS or modern UI styling frameworks
  - Sequelize ORM or similar data access frameworks
  - Docker / containerization
  - CI/CD pipelines (YAML-based or similar)
  - Experience with microservices architectures
  - Experience integrating with enterprise APIs or data
    platforms
  - WebAssembly (WASM) or performance-focused web technologies

  Work at Home Requirements: To ensure Home or Hybrid
  Home/Office employees’ ability to work effectively, the
  self-provided internet service of Home or Hybrid Home/Office
  employees must meet the following criteria: At minimum, a
  download speed of 25 Mbps and an upload speed of 10 Mbps is
  required; wireless, wired cable or DSL connection is
  suggested. In certain roles, the minimum recommended
  internet speed required by Humana may not be sufficient for
  business needs. Humana reserves the right to require
  associates to upgrade their internet service if necessary.
  Work from a dedicated space lacking ongoing interruptions to
  protect member PHI / HIPAA information. Travel: While this
  is a remote position, occasional travel to Humana's offices
  for training or meetings may be required.

  Scheduled Weekly Hours

  40

  Pay Range

  The compensation range below reflects a good faith estimate
  of starting base pay for full time (40 hours per week)
  employment at the time of posting. The pay range may be
  higher or lower based on geographic location and individual
  pay will vary based on demonstrated job related skills,
  knowledge, experience, education, certifications, etc.



  $106,900 - $147,000 per year



  This job is eligible for a bonus incentive plan. This
  incentive opportunity is based upon company and/or
  individual performance.

  Description of Benefits

  Humana, Inc. and its affiliated subsidiaries (collectively,
  “Humana”) offers competitive benefits that support whole-
  person well-being. Associate benefits are designed to
  encourage personal wellness and smart healthcare decisions
  for you and your family while also knowing your life extends
  outside of work. Among our benefits, Humana provides
  medical, dental and vision benefits, 401(k) retirement
  savings plan, time off (including paid time off, company and
  personal holidays, paid parental and caregiver leave),
  short-term and long-term disability, life insurance and many
  other opportunities.

  About us About Humana: Humana Inc. (NYSE: HUM) is a leading
  U.S. healthcare company. Through our Humana insurance
  services and our CenterWell healthcare services, we make it
  easier for the millions of people we serve to achieve their
  best health – delivering the care and service they need,
