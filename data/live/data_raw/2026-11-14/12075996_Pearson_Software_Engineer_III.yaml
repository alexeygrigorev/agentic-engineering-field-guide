description: |
  Position Summary The Delivery Engineer is an early-career
  technical role for engineers and other builders who want to
  develop broad expertise across technology, customer
  delivery, and product. Delivery Engineers are aligned to a
  state or customer rather than a single product. Working
  alongside experienced technical and delivery leaders, they
  develop an end-to-end understanding of how Pearson's
  platforms, integrations, data flows, and operational
  processes work together to meet customer requirements and
  contractual commitments. This is a hands-on role. Delivery
  Engineers demonstrate solutions, investigate technical
  issues, validate integrations, support implementations and
  production events, and work across teams to drive problems
  toward resolution. The role provides broad exposure to
  customers, products, and technology organizations and is
  designed to develop future leaders across Technology
  Readiness, Technical Product Management, Product Management,
  Delivery, Implementation, Support, and Technology. Key
  Responsibilities •    Develop deep knowledge of assigned
  state or customer programs, including requirements,
  contractual commitments, technical solutions, integrations,
  configurations, and operational processes. •    Build and
  maintain an end-to-end understanding of the customer
  solution across test administration, test delivery, scoring,
  reporting, data exchange, identity, infrastructure, and
  external integrations. •    Translate customer, RFP, and
  contractual requirements into technical requirements,
  solution approaches, validation criteria, and delivery
  considerations. •    Create and maintain system diagrams,
  integration flows, data flows, and other technical
  documentation that clearly explains how the customer
  solution works. •    Develop the product and solution
  knowledge needed to confidently explain and demonstrate
  Pearson's technology capabilities to customers and internal
  stakeholders. •    Participate in customer technical
  discussions, demonstrations, integration reviews, solution
  workshops, and RFP or proposal activities. •    Provide
  hands-on technical support during implementation,
  integration testing, readiness activities, administration
  windows, production events, and customer escalations. •
  Investigate technical issues across systems by analyzing
  configurations, APIs, integrations, data flows, logs, and
  system behavior. •    Partner across Engineering, Product,
  Quality Engineering, Implementation, Operations, Support,
  Security, and Infrastructure to resolve technical issues and
  delivery risks. •    Support end-to-end validation to ensure
  systems, integrations, and operational processes
  collectively meet customer requirements and commitments. •
  Identify technical gaps, dependencies, risks, and product
  limitations, and help ensure they are understood and
  addressed by the appropriate teams. •    Apply lessons from
  implementations, incidents, and customer feedback to improve
  products, documentation, processes, and future customer
  solutions. Required Qualifications •    1 to 3 years of
  experience in software engineering, systems engineering,
  technical support, quality engineering, or another hands-on
  technology discipline, or equivalent experience building,
  testing, integrating, or operating software systems. •
  Practical experience with software applications, APIs,
  integrations, data flows, cloud-based systems, or related
  enterprise technologies. •    Experience troubleshooting
  technical issues using structured problem-solving and
  technical evidence. •    Ability to read technical
  documentation and create or interpret system diagrams,
  integration flows, and data flows. •    Strong written and
  verbal communication skills with the ability to explain
  technical concepts to technical and nontechnical audiences.
  •    Strong technical curiosity, problem-solving skills, and
  interest in understanding how complex systems work together.
  •    Ability to collaborate across technical, product,
  implementation, and operational teams. •    Interest in
  working directly with customers and developing confidence in
  customer-facing technical discussions and demonstrations.
  Preferred Qualifications •    Experience with APIs, cloud
  platforms, identity and access management, logging and
  monitoring tools, or distributed applications. •
  Experience supporting customer implementations, integration
  testing, production systems, incident response, or technical
  escalations. •    Experience in enterprise technology,
  education technology, government, or large-scale assessment.
  •    Exposure to RFPs, proposals, product management,
  solution engineering, implementation, or delivery functions.
  What Makes Someone Successful in This Role Successful
  Delivery Engineers are curious, hands-on problem solvers who
  want to understand both the customer and the technology.
  They communicate clearly, collaborate effectively across
  teams, ask thoughtful questions, surface risks, and stay
  engaged until problems are resolved. They are comfortable
  learning beyond a single application and are motivated to
  understand how multiple products and integrations come
  together as one customer solution. Career Development The
  Delivery Engineer role is intentionally designed as a
  development path for early-career technical talent. Through
  direct exposure to customers, products, engineering teams,
  implementations, and production delivery, Delivery Engineers
  build the technical judgment, product understanding, and
  customer perspective needed for future opportunities in
  Technology Readiness, Technical Product Management, Product
  Management, Delivery, Implementation, Support, Solution
  Engineering, and broader Technology leadership. Delivery
  Engineers build depth on the customer and breadth across the
  technology ecosystem.

  Compensation at Pearson is influenced by a wide array of
  factors including but not limited to skill set, level of
  experience, and specific location. As required by the
  California, Colorado, Hawaii, Illinois, Maryland, Minnesota,
  New Jersey, New York State, New York City, Vermont,
  Washington State, and Washington DC laws, the pay range for
  this position is as follows:

  The minimum full-time salary range is between $80,000 -
  $120,000.

  This position is eligible to participate in an annual
  incentive program, and information on benefits offered is
  here.

  Applications will be accepted through 16th November 2026.
  This window may be extended depending on business needs.
