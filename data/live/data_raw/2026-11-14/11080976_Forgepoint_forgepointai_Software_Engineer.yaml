description: |
  The Role

  This is a true 0→1 product engineering role. You'll take
  real customer problems and well-scoped requirements, turn
  them into product improvements, and ship them end-to-
  end—from implementation and testing through rollout and
  production follow-through.

  You'll build across the stack on AI agent workflows,
  customer-facing experiences, and integrations with messy
  legacy ERPs and CRMs. The work includes rapid prototyping
  with LLMs, debugging complex data flows, and building
  flexible systems that handle real-world edge cases reliably.

  You'll work closely with customers and teammates, contribute
  to technical decisions and code reviews, and steadily take
  ownership of more complex parts of the product. Our stack is
  TypeScript end-to-end with React, Node.js, and PostgreSQL.

  What you’ll do

  - Build and ship focused product improvements across the
    frontend and backend
  - Understand requirements, connect implementation choices to
    customer value, and own work through release and
    production operation
  - Write clear, maintainable code that follows existing
    patterns and solves the immediate problem without
    unnecessary complexity
  - Test important behavior, use logs and metrics to investigate
    failures, and fix root causes rather than symptoms
  - Debug and improve agent workflows, product experiences,
    integrations, APIs, data flows, and background jobs
  - Participate thoughtfully in code reviews, incorporate
    feedback, and grow ownership of increasingly complex
    product areas

  Who you are

  - You have 2+ years of experience as a product software
    engineer and a track record of shipping working software
  - You can translate scoped requirements into reliable product
    code and are comfortable working across the stack
  - You care about code quality and simplicity, follow existing
    patterns, and avoid abstractions that do not serve the
    immediate problem
  - You test your work, debug systematically, and follow through
    when production behavior differs from expectations
  - You have a product mindset: you learn how customers work,
    connect technical decisions to user value, and notice
    opportunities to improve the experience
  - You communicate clearly, collaborate well, give and receive
    useful feedback, and learn unfamiliar systems quickly
  - You are ambitious, resourceful, action-oriented, and team-
    first; you care about strengthening American manufacturing
    and are excited to work in person five days a week in NYC

  Bonus points

  - Experience with TypeScript, Node.js, React, or PostgreSQL
  - Experience with distributed systems, queues, caching,
    retries, consistency, or observability
  - Experience building third-party API integrations or working
    with legacy systems
  - Practical experience with LLM APIs, agent workflows,
    prompting, or evaluations
  - Experience building software for manufacturing or another
    operationally complex industry

  About Forgepoint

  Revitalize an industry. Rebuild America's manufacturing
  backbone.

  America builds satellites, jet engines, semiconductors, and
  more with world-class precision, but the software running
  factory offices is decades behind. Estimators, procurement
  teams, and engineers still lose hours to spreadsheets, PDFs,
  and manual data entry.

  Forgepoint builds AI workers for non-production departments
  — think inside sales, quoting, and procurement. By removing
  back-office bottlenecks, we help US manufacturers move
  faster, grow, and compete globally.

  We're backed by a16z speedrun and angels from Brex, Xwing,
  and Betterment. Join us in rebuilding the digital foundation
  of American manufacturing.

  Our Founders

  Jack Strauss — Co-Founder & CEO

  Jack began his career at Acer and Northrop Grumman, then
  advised industrial companies at Bain. At Xwing, he helped
  scale the company and led GTM through its acquisition by
  Joby Aviation. He holds an MBA from Stanford and a BA from
  USC.

  Alex Pareto — Co-Founder & CTO

  Alex began at Meta, then founded YC-backed Demeanor which
  was acquired by NTWRK. He later became a founding engineer
  on Brex Spend Management, and ultimately the Head of
  Engineering for that organization. He holds a BS in Computer
  Science from USC.

  How we work

  - In person every day in NYC for high-bandwidth collaboration
  - Talk to users constantly—we build with manufacturers, not
    for them
  - Own outcomes end-to-end and drive solutions without waiting
    for permission

  Our Values

  - We're Here to Win: We are building to help American
    manufacturers, our customers, our company, and our
    teammates win at the highest level.
  - There's Always a Way: We are relentlessly resourceful, take
    ownership of constraints, and find a path forward when
    others stop.
  - Truth Over Comfort: We choose honesty over ego, surface
    reality quickly, and change course when the facts demand
    it.
  - Act Now: We move fast, trust our instincts, and correct
    course as we go.
  - Step Up: We act like founders, fill gaps, fix problems, and
    follow through until the work is done.
  - The Team. The Team. The Team.: We put the team first, push
    and support each other, share wins, and own failures
    together.

  Comp & Benefits

  - Top-tier salary and equity
  - Great healthcare
  - Dinner at the office
  - Unlimited Celsius

  Location

  Onsite in New York City, five days a week.
