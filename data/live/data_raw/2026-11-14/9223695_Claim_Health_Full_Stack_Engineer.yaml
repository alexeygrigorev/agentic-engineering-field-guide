description: |
  Full Stack Engineer

  Location: NYC (In-Person)

  Compensation: Competitive salary + meaningful equity

  Stage: YC-backed, early-stage

  About Claim Health

  Claim Health is the AI Revenue Platform for Post-Acute Care.

  With the US population aging and preference for care moving
  to the home, post-acute care (home health, skilled nursing,
  home care, hospice) is one of the fastest growing verticals
  within healthcare. Post-acute providers operate across
  fragmented systems, manual workflows, and reactive processes
  that create operational drag and financial uncertainty.
  Claim Health replaces this fragmentation with an
  intelligent, software-driven platform that unifies data,
  automates execution, and enables real-time decision-making
  across revenue-critical operations. We’re building an
  adaptive platform that brings clarity, predictability, and
  scale to environments where reliability matters.

  The Role

  We’re looking for a Full Stack Engineer to help build and
  scale the core Claim Health platform. We don’t believe that
  frontend, backend, or infra engineers alone will succeed at
  Claim Health and push our mission forward. You will work
  directly with customers and all across the stack to design
  systems that coordinate complex intake & authorization
  workflows, surface real-time signals, and automate high-
  stakes operational processes. This role has significant
  ownership and influence over how the platform evolves. You
  won’t just ship features - you’ll help define the
  foundational systems that power the product and deliver end-
  to-end workflow automation for our partners. How Claim
  Health Engineering Works

  - Build and ship end-to-end product capabilities across the
    stack
  - Have direct conversations with customers and be your own PM
  - Dig into disconnected and messy data to create abstractions
    that allow for operational scale and data intelligence.
  - Develop automation and orchestration layers for complex,
    real-world workflows
  - Create internal tools and user-facing interfaces that drive
    clarity and control
  - Design for correctness, observability, and resilience in
    mission-critical revenue and operational systems in large
    healthcare systems
  - Partner closely with GTM at Claim Health and customers to
    translate ambiguity into durable solutions

  What We’re Looking For

  We care more about how you think and operate than specific
  tools or frameworks.

  You likely have:

  - 3+ years of experience building full-stack products in
    production
  - Strong backend fundamentals
  - Comfort working across frontend, backend, and infrastructure
  - Experience deconstructing real-life workflow complexity into
    automation

  You thrive if you:

  - Enjoy working on systems with messy real-world constraints
  - Care deeply about reliability, edge cases, and long-term
    quality
  - Prefer solving root problems over patching symptoms
  - Are comfortable operating with ambiguity and high ownership
  - Want to build foundational systems, not one-off features
  - Care about healthcare and improving outcomes for patients

  Bonus (Not Required)

  - Background in agent automation, orchestration, or
    integration platforms
  - Experience deploying AI-powered systems in production
  - Prior exposure to healthcare, finance, or operationally
    complex domains

  Why Join Claim Health

  - Real impact: Your work affects mission-critical operations
    and financial outcomes
  - Ownership: Meaningful equity and influence over the
    platform’s direction
  - Hard problems: Complex systems, real constraints, no toy use
    cases
  - Speed: Small team, fast feedback loops, high leverage work.
    We have a bias towards moving as fast as possible.
  - Culture: Low ego, high standards, deep respect for craft
  - Fun One of the most important things we screen for is can
    you laugh with us.
