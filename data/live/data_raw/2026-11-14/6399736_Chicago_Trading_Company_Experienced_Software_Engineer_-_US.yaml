description: |
  Chicago Trading Company (CTC) is a premier proprietary
  trading firm specializing in options market making.  Our
  collaborative culture fuels innovation in quantitative
  research, systematic trading strategies, and cutting-edge
  trading technology.  For over three decades CTC has provided
  critical liquidity across derivatives exchanges worldwide -
  making them fairer, more transparent, and more efficient.

  We strive to be the most innovative firm in the industry
  today, tomorrow, and long into the future while upholding
  ethical excellence. We believe that CTC makes a positive
  impact on the markets, the lives of our employees, and all
  the communities to which we belong. Started in 1995 by a
  team of forward-thinking Traders, we are proud to call
  ourselves an industry leader that keeps making markets and
  each other better.

  WHAT YOU'LL DO

  - Design, develop, and maintain high-performance trading
    systems and algorithms, utilizing languages such as C++,
    Python, and Java
  - Minimum of 4 years working experience in software
    development, preferably within a large distributed
    computing or systematic trading environment
  - Bachelor's degree in Computer Science or quantitative field
  - Comfortable working in a fast-paced, dynamic environment,
    adapting quickly to changing priorities and demonstrating
    flexibility in handling various tasks and projects

  Most teams at CTC, with the exception of Trading, follow a
  hybrid workplace model, subject to change based on business
  need.

  OUR BENEFITS

  We strongly believe in the well-being of our employees and
  their families so we offer outstanding benefits to support
  you both professionally and personally. These benefits
  include generous time off, insurance coverage, paid parental
  leave, free breakfast and lunch (plus healthy snacks, of
  course), wellness reimbursement, and a variety of other
  benefits focused on providing the best employee experience.

  (Disclaimer: interns and contractors are not eligible for
  benefits at CTC)

  OUR COMMITMENT TO DIVERSITY, EQUITY and INCLUSION

  At CTC, we aim to cultivate a workplace that celebrates
  diversity and each person feels included, engaged and
  empowered. Where each of us feels we belong. We are
  committed to having a diverse workforce and are proud to be
  an equal opportunity employer. CTC does not discriminate on
  the basis of race, religion, color, national origin, sex,
  gender, gender expression, sexual orientation, age, marital
  status, veteran status, or disability status. We will ensure
  that individuals with disabilities are provided reasonable
  accommodation to participate in the job application or
  interview process, to perform crucial job functions, and to
  receive other benefits and privileges of employment.

  If you have a disability and believe you need a reasonable
  accommodation in order to search for a job opening or to
  apply for a position, please contact us at
  info@chicagotrading.com. Note that emails sent to this email
  account for non-disability related issues, such as following
  up on an application, will not receive a response.

  USE OF ARTIFICIAL INTELLIGENCE (AI)

  Information submitted by job applicants may be subject to
  review and analysis by automated systems, including
  Artificial Intelligence (AI), as part of the recruitment
  process. Such systems are utilized to enhance the efficiency
  and effectiveness of our hiring procedures. Applicants are
  advised that any information provided may be evaluated by AI
  tools to ensure an equitable and thorough assessment.
