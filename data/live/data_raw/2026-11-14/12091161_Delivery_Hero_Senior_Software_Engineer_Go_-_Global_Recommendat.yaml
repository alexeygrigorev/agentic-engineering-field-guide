description: |
  Company Description

  As the world’s pioneering local delivery platform, our
  mission is to deliver an amazing experience, fast, easy, and
  to your door. We operate in around 65 countries worldwide,
  powered by tech, designed by people. As one of Europe’s
  largest tech platforms, headquartered in Berlin, Germany,
  Delivery Hero has been listed on the Frankfurt Stock
  Exchange since 2017 and is part of the MDAX stock market
  index. We push hard, learn quickly and stay human along the
  way. It’s this wonderful mix of high performance and real
  community that makes Delivery Hero a place where ambition
  and belonging grow side by side. If you’re curious,
  collaborative and ready to dive deep into meaningful work,
  you’ll fit right in.

  Job Description

  Big architecture. Bigger impact. As a Senior Software
  Engineer, you'll own the services that decide what millions
  of customers see when they open our apps, from low-latency
  serving paths to the ranking and model integrations behind
  them. You'll make the architectural calls, turn ambiguous
  problems into small releasable steps, and build a team that
  succeeds even when you're not there.

  The engineering teams at the Global Recommendations and
  Ranking domain build systems that are behind what millions
  of customers see across the Delivery Hero apps every day,
  from vendors and products to ranking and personalisation. We
  build and run the services that serve, rank and orchestrate
  recommendations for all Delivery Hero brands and platforms,
  working closely with data scientists, machine learning
  engineers, product managers and platform teams.

  At Delivery Hero, you'll shape the global consumer
  experience for millions of users. Your work will have a
  direct impact on how we attract and retain customers,
  creating data-driven, personalized interactions that keep
  them coming back. As part of our Consumer Team, you'll
  enhance customer satisfaction and drive global growth and
  profitability through innovative projects.

  - Own and drive multiple features in our recommendation and
    ranking services (Go and Python), from discovery through
    release and operation, including low-latency serving paths
    and model-serving integrations
  - Drive architectural decisions on the features you build:
    assess where each system is in its lifecycle, fix
    architecture deficiencies early, write clear RFCs and
    ADRs, and build consensus by laying out pros and cons
  - Break complex, ambiguous initiatives into milestones that
    deliver impact early and often, and parallelise work where
    resources allow
  - Raise the bar on observability, scalability, cost
    efficiency, security and code quality, resolve
    vulnerabilities within SLA, and handle on-call incidents
    with quality post-incident reports
  - Mentor less experienced engineers, take part in hiring, and
    partner with data scientists, machine learning engineers
    and product managers to bring models and experiments
    safely into production
  - Contribute to your team's development process by
    recommending coding standards, frameworks and tools,
    including agent-assisted engineering, and evangelise the
    practices that work so your team adopts them

  Qualifications

  - Strong backend engineering experience in Go and/or Python,
    building and owning production services, including
    stateful APIs, gRPC/REST integrations and high-throughput
    request paths
  - Experience with event streaming (Kafka, Flink, Pub/Sub) and
    infrastructure as code such as Terraform, and with
    operating mission-critical services in production on AWS
    and/or GCP and Kubernetes, with observability, alerting
    and on-call processes in place
  - Experience recommending and evangelising engineering best
    practices and tools in a team, with a clear view of where
    agent-assisted development helps, where it fails, and how
    to review its output
  - Deep knowledge of the frameworks and tools your team uses,
    beyond what is documented, applied to critical decisions
    and problem solving
  - A track record of sound architectural trade-offs, explained
    clearly to engineers and non-engineers, and the ability to
    work autonomously on ambiguous problems, slicing them into
    releasable increments and judging trade-offs by business
    impact
  - A mentoring mindset and excellent written and verbal
    English: your team is stronger because of you and does not
    need you present to succeed

  Nice to have

  - Background in recommendations, ranking, search,
    personalisation or relevance engineering
  - Experience with ML serving, feature stores, vector databases
    or real-time feature pipelines
  - Familiarity with A/B testing and experimentation platforms

  Additional Information

  Ensuring you and all our Heroes are looked after, happy, and
  healthy is always on the menu. Because if you’re in good
  shape, then we’re in good shape.

  - Make the most of our hybrid working model and join the team
    for face-to-face connection and collaboration in our
    beautiful Berlin campus 2 days a week
  - We offer 27 days holiday with an extra day on 2nd and 3rd
    year of service
  - We will support you in developing yourself and your career
    growth opportunities: 1.000 € Educational Budget, Language
    Courses, Parental Support and access to the Udemy Business
    platform to explore a variety of online courses.
  - Get moving and release those wonderful, mind-boosting
    endorphins: Health Checkups, Meditation & Gym.
  - Cash. Dough. Cheddar. Whatever you call it, we’ll help you
    with it: Employee Share Purchase Plan, Sabbatical Bank,
    Public Transportation Ticket Discount, Life & Accident
    Insurance, Corporate Pension Plan
  - The power of getting together over some food is unrivaled.
    Here are a few ways to help you do that. All the yum:
    Digital Meal Vouchers and Food Vouchers.
  - Wondering what relocating to Berlin is like? In this
    article, we’ve put together 10 things you should know
    about moving to Berlin  and how Delivery Hero can support
    you. You can also visit our relocation hub and check out
    more information about moving to Berlin.
  - Ready to prepare for your interview? Check out the list of
    the 5 most common interview questions and answers created
    in collaboration with our recruiters.

  Heads up: exact benefits may look a little different for
  intern, working student, fixed-term, and part-time roles.

  Ready to join our team? If you’re excited to grow,
  collaborate and be part of the world’s leading delivery
  platform, we’d love to hear from you. Apply today!

  We believe diversity and inclusion are key to creating not
  only an exciting product, but also an amazing customer and
  employee experience. Fostering this starts with hiring -
  therefore we do not discriminate on the basis of racial
  identities, religious beliefs, color, national origin,
  gender identities or expressions, sexual orientations, age,
  marital or disability statuses, or any other aspect that
  makes you, you.

  We encourage you to let us know if you need any
  accommodations or specific accessibility support to ensure a
  smooth interview experience—just let us know with an email
  to our Inclusion Officer at inclusion@deliveryhero.com.

  You're welcome to share your pronouns (he/she/they) right
  from the start so we can address you respectfully from our
  first contact.
