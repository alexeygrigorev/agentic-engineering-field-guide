description: |
  About us

  Scribe is where exceptional people come to do the best work
  of their careers. More than 94% of the Fortune 500 use
  Scribe to document and scale how work gets done. We’re
  growing fast — since our founding in 2019, we’ve grown to
  over 4 million users across 600,000 businesses. Based in San
  Francisco, we've raised $55M in funding from top-tier
  investors and are honored to have been named as a Forbes
  Next Billion Dollar Startup and LinkedIn Top Startup. Join
  us in our mission to uplevel how people do work.

  How we work

  We are builders aspiring to master our crafts. We care
  deeply about our teammates and want to win, together. We
  embrace the following values:

  - Accelerate impact
  - Raise the bar
  - Make our users heroes
  - Clear is kind
  - Rapid learning machine
  - One team one dream

  About the role

  Scribe’s Platform team provides the secure, scalable
  foundations that power every feature in our
  product—authentication, authorization, role-based access
  control, SSO/SCIM provisioning, team settings, and the full
  document lifecycle. As Engineering Manager, you will lead a
  predominantly backend team, ensuring enterprise-grade
  reliability while enabling rapid product iteration. You will
  define technical strategy, drive execution against clear
  outcomes, and foster a culture of engineering excellence and
  continuous learning. The team conducts most day-to-day
  discussions in Serbian, so fluency is essential.

  We work with React, Next.js, Django, Postgres, and AWS.
  While experience with these technologies is helpful, we
  value adaptability and a willingness to learn just as much.

  👉Read Why I joined Scribe (and Why I Stayed) by Luka
  Filipovic, one of Scribes first engineers!

  Responsibilities

  - Set the platform vision. Develop and maintain a roadmap that
    anticipates customer and internal engineering needs as
    Scribe grows.
  - Own product outcomes. Collaborate with Product, Design, and
    Security to prioritize and deliver high-impact admin and
    enterprise capabilities.
  - Engineer for reliability and compliance. Establish
    standards, reviews, and automation that keep our services
    available, auditable, and secure.
  - Drive disciplined execution. Convert strategy into delivered
    services and UI components, balancing speed with long-term
    maintainability.
  - Develop top talent. Recruit, mentor, and retain a diverse
    team of engineers, providing clear growth paths and
    feedback.
  - Elevate engineering culture. Model Scribe’s
    values—Accelerate Impact, Raise the Bar, Clear is
    Kind—while championing a “platform as product” mindset.
  - Enable the wider organization. Produce documentation,
    processes, and reusable libraries that make it seamless
    for all Scribe teams to integrate platform services.

  About you

  - Leadership experience. 3+ years managing high-performing
    engineering teams, ideally focused on platform, security,
    or infrastructure.
  - Technical depth. 10+ years of software development
    experience with modern backend frameworks (e.g., Django)
    and cloud infrastructure.
  - Proven execution. Demonstrated success shipping
    authentication, authorization, or enterprise-grade admin
    features at scale.
  - Security mindset. Comfortable embedding best practices and
    compliance requirements into everyday development.
  - People development. Track record of hiring, coaching, and
    retaining engineers who raise the collective bar.
  - Continuous improvement. Passionate about learning, measuring
    impact, and iterating on both product and process.
  - Clear communication. Able to create alignment across
    functions and geographies, driving clarity in ambiguous
    situations.
  - Language proficiency. Fluent in Serbian and English;
    comfortable leading meetings, documentation, and cross-
    team collaboration in both languages.

  Full-time International Employee Benefits Include

  - Some of the nicest and smartest teammates you’ll ever work
    with
  - Competitive salaries
  - Flexible PTO
  - Parental Leave
  - WFH Stipend

  Compensation

  Compensation will be determined based on a candidate’s level
  of experience and location.

  We consider several factors when determining compensation,
  including location, experience, and other job-related
  factors. At Scribe, we celebrate our differences and are
  committed to creating a workplace where all employees feel
  supported and empowered to do their best work. We believe
  this benefits not only our employees but our product,
  customers, and community as well. Scribe is proud to be an
  Equal Opportunity and Affirmative Action Employer.

