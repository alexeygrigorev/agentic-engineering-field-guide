description: |
  Accruent is seeking an experienced Site Reliability
  Engineering Manager to lead and evolve our Site Reliability
  Engineering practice. The role leads a global team
  responsible for the reliability, scalability, security, and
  operational excellence of our cloud-based SaaS platforms,
  while shaping the standards, operating model, and
  engineering practices needed to support sustainable growth.

  Working closely with Engineering, Product, Security,
  Support, and Technology leadership, the SRE Manager will
  strengthen platform resilience, expand automation, improve
  operational maturity, and help deliver dependable customer
  experiences. The successful candidate will combine strong
  technical judgement with credible people leadership and a
  practical approach to building capable, accountable teams.

  Position Summary

  The Site Reliability Engineering Manager will establish and
  mature a consistent SRE operating model across Accruent’s
  SaaS platforms. The role is accountable for building team
  capability, defining reliability standards, reducing
  operational risk and manual effort, and ensuring that
  service health is managed through measurable objectives and
  evidence-based decision-making. Working across Cloud
  Operations and Product Engineering, the manager will help
  embed reliability as a shared responsibility throughout the
  technology organization.

  Key Responsibilities Leadership and Talent Development

  Lead, mentor, and develop a globally distributed team of
  Site Reliability Engineers. Manage the transition of Systems
  Engineers into Site Reliability Engineering roles by
  defining the required competencies, establishing structured
  development pathways, and providing the coaching, practical
  experience, and support needed for individuals to succeed in
  the SRE operating model. Create clear goals, expectations,
  and development plans aligned with business priorities,
  while fostering a culture of ownership, collaboration,
  innovation, and continuous improvement. Support effective
  hiring, onboarding, succession planning, career development,
  and capability building across the team.

  Reliability and Operational Excellence

  Define and execute the Site Reliability Engineering strategy
  and roadmap, with a clear focus on platform availability,
  scalability, resilience, and operational simplicity.
  Champion reliability-focused engineering across the
  organization and promote consistent use of automation,
  standardization, observability, and measurable service
  objectives to reduce complexity and improve efficiency.

  Incident Management and Service Resilience

  Provide leadership during major incidents and customer-
  impacting events, ensuring that response activities are
  calm, coordinated, and focused on service restoration.
  Strengthen problem management through effective root cause
  analysis, clear corrective actions, and disciplined follow-
  through. Lead disaster recovery, resilience testing, and
  business continuity initiatives so that recovery
  capabilities are understood, exercised, and continually
  improved.

  Cross-Functional Partnership

  Reporting to the Director of Cloud Operations, work closely
  with other Cloud Operations leaders to align SRE priorities,
  operating practices, resource plans, and transformation
  activities across the wider function. Partner with
  Engineering, Product, Security, and Support teams to connect
  operational priorities with product roadmaps, customer
  needs, and business objectives. Use operational insight to
  influence technical decisions, improve long-term platform
  health, and provide senior leaders with clear, evidence-
  based recommendations on reliability, risk, capacity, and
  investment priorities.

  Security, Governance, and Continuous Improvement

  Work with Security and Governance teams to strengthen
  platform security, reduce operational risk, and support
  compliance and vulnerability management initiatives.
  Establish a continuous improvement approach informed by
  service data, operational metrics, automation opportunities,
  and emerging technologies, including responsible use of AI-
  enabled solutions.

  Cloud Operations and FinOps

  Support cloud optimization and capacity planning by
  balancing reliability, performance, scalability, and cost.
  Identify opportunities to simplify operations, improve
  resource utilization, and reduce avoidable spend without
  compromising service quality or resilience.

  Required Qualifications

  • 8+ years of experience in Site Reliability Engineering,
  Cloud Operations, DevOps, Infrastructure Engineering, or a
  related discipline.

  • 3+ years of experience leading technical engineering
  teams.

  • Demonstrated experience managing technical workforce
  transitions, capability development, or the progression of
  Systems Engineers into Site Reliability Engineering roles.

  • Proven experience supporting large-scale SaaS platforms in
  Microsoft Azure.

  • Strong understanding of reliability engineering principles
  and operational excellence practices, including service
  level indicators, service level objectives, error budgets,
  and observability.

  • Experience leading incident management, problem
  management, disaster recovery, and resilience programmes.

  • Practical experience with Infrastructure as Code, CI/CD,
  automation, monitoring, and cloud security practices.

  • Strong communication, stakeholder management, and
  leadership skills, with the ability to explain technical
  risk and priorities to senior audiences.

  • Demonstrated ability to lead teams through change and
  drive cross-functional collaboration.

  Preferred Qualifications

  • Experience leading or supporting an SRE transformation or
  establishing an SRE operating model.

  • Experience operating large-scale, customer-facing SaaS
  environments.

  • Experience leading globally distributed engineering teams
  and follow-the-sun operations.

  • Knowledge of container platforms, cloud-native
  architectures, and modern observability tooling.

  • Experience driving cloud optimization and FinOps
  initiatives.

  • Relevant cloud, security, or service management
  certifications.

  Success in this Role

  Success will be demonstrated through measurable improvements
  in service reliability, resilience, customer experience, and
  operational maturity. The role should reduce operational
  overhead through automation and process improvement,
  strengthen security and governance outcomes, and deliver
  cloud optimization without weakening service quality.

  Equally important will be the development of an engaged,
  capable SRE team and the creation of strong cross-functional
  partnerships. The SRE Manager will be expected to make a
  visible contribution to Accruent's cloud operations strategy
  and the sustainable growth of its SaaS platforms.

