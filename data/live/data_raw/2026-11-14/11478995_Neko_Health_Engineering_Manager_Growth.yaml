description: |
  Mission

  Neko is redefining what prevention means, from treating
  illness when it arrives, to sustaining health before it's
  ever at risk. Our mission: make data-driven, preventative
  care accessible to more people, before symptoms appear.  In
  a single, non-invasive visit under an hour, proprietary
  technology and direct clinical care combine to deliver
  personalised, actionable insights. It's a team that thinks
  in 10x, not 10%. Every role here plays a part in building a
  world where prevention is the norm, and where your work
  genuinely helps people live longer, healthier lives.

  Role Purpose

  We are looking for an Engineering Manager for Growth: a
  building leader who is obsessed with growth and wants to
  stay deep in the work. You lead a pod of four to six
  engineers, spending most of your time building and
  delivering, and the rest setting technical direction, owning
  quality and raising the bar for the people around you.

  Growth owns how people find Neko, join it, pay for it and
  bring their friends: the website, waitlist, booking,
  payments, referrals, invites, membership tiers, B2B,
  localization, and the launch of every new clinic and market.
  More clinics and more members mean more lives improved and
  saved, and the faster we grow, the more lives we reach. You
  watch the dashboards daily, run experiments in days rather
  than quarters, and build the loops that compound.

  What You'll Deliver in the First 6–12 Months

  - Ship the Growth roadmap on time and at quality, building
    alongside the pod on the funnel, payments, booking and
    launches (Impact, not activity).
  - Set the technical direction for growth at Neko: architecture
    and instrumentation that let the pod test fast and
    launches where a new clinic or market is configuration,
    not a project (Chase 10X, not 10%).
  - Own quality: what gets tested, how we release, what ships.
    Public surfaces that are fast, secure, and resilient to
    fraud and abuse (Member-first, always).
  - A pod that gets better every quarter: hiring, mentorship,
    direct feedback, and AI tools in every engineer's loop
    (Tech-enabled, human-centered).
  - Know what is really going on, in the code and in the
    numbers, and say so (Optimistic truth seeking).



  Minimum Qualifications

  - Deep experience building consumer products across the stack,
    with real depth in at least one of payments, growth
    systems, internationalization or the web platform.
  - You have owned a funnel, a conversion rate or a revenue
    line, and moved it.
  - You have run experiments with discipline and know the
    difference between a result and noise.
  - You have led engineers as a tech lead or equivalent and
    raised a team's standards and judgment. Direct, low-ego,
    high expectations.
  - Daily use of AI coding tools, and you can show what you have
    shipped with them

  Preferred Qualifications

  - Launching a consumer product in a new country or market.
  - Referral, invite or viral loops that drove growth.
  - A regulated or trust-critical domain: healthcare, fintech or
    similar.
  - Fraud, abuse and bot resilience on public surfaces.

  Our Stack

  - Frontend: React, React Native, TypeScript, Swift and Kotlin
    where needed, Next.js, Sanity, Vercel
  - Backend: C#, Node, Cosmos DB
  - Design: Figma
  - Tooling: Azure DevOps, Claude Code
