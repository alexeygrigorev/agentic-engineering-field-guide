description: |
  IMC is seeking a highly skilled C++ Software Engineer to
  join our Chicago team. As a Software Engineer, you will
  design and develop software solutions tailored to the
  hardware-specific needs of our global trading system with a
  focus on optimizing performance. Our dynamic, fast-paced
  tech environment enables collaboration and rapid feedback
  loops across global teams. You will be responsible for
  spotting new opportunities, solving problems and developing
  innovative technologies. Software development here is
  innovative, pragmatic and fun, even as complexity grows.
  Your Core Responsibilities:

  - Design and build low latency, high-performance trading
    systems
  - Optimize production code and other system components to
    achieve low-latency and high-throughput capabilities
  - Write highly performant software solutions to control and
    interface with hardware components such as ASICs and FPGAS
  - Work closely with hardware engineers and cross-functional
    teams to understand requirements and implement effective
    solutions
  - Ensure a seamless integration of new applications and
    enhancements to the existing trading infrastructure

  Your Skills and Experience:

  - Bachelor's or Master's degree in Computer Science, Computer
    Engineering, or related field of study
  - 2+ years of professional experience using modern C++ in a
    low-latency environment
  - Experience with software development for hardware platforms
  - Knowledge of trading systems and financial markets is a
    strong plus
  - Excellent problem-solving and communication skills

