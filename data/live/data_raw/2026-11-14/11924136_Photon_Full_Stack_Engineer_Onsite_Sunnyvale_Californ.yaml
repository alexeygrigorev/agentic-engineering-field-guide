description: |
  Role Overview







  We are looking for a senior Full Stack Engineer to design,
  build, and ship scalable web applications and services
  across the stack. You will own features end to end, from API
  design and data modeling to user-facing interfaces, and help
  set engineering standards for the team.







  Key Responsibilities







  - Design and develop RESTful APIs and microservices using Java
    and Spring Boot, and Node.js where appropriate.







  - Build responsive, high-quality user interfaces with React.







  - Model and manage data in NoSQL databases, with attention to
    performance and scalability.







  - Contribute to architecture and design decisions; write clear
    technical designs and review those of others.







  - Use AI coding assistants (GitHub Copilot, Claude)
    responsibly to speed up development while maintaining code
    quality.







  - Participate in code reviews, mentor junior engineers, and
    uphold testing and documentation standards.







  - Partner with product, design, QA, and DevOps to deliver
    reliable releases.







  Required Qualifications







  - 8+ years of professional software engineering experience.







  - Strong proficiency in Java and Spring Boot; solid experience
    with Node.js.







  - Hands-on experience with React and modern
    JavaScript/TypeScript.







  - Proven experience designing and consuming RESTful APIs.







  - Experience with NoSQL databases (for example MongoDB,
    DynamoDB, Cassandra, or Couchbase).







  - Familiarity with CI/CD, version control (Git), and automated
    testing.







  Preferred Qualifications











  - Experience with cloud platforms (AWS or GCP) and
    containerization.







  - Experience integrating AI-assisted development tools into
    team workflows.







  - Background in performance tuning, security best practices,
    and observability.





    Compensation, Benefits and Duration

  Minimum Compensation: USD 50,000 Maximum Compensation: USD
  175,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
