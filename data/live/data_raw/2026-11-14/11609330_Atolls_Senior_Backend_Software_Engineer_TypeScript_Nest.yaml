  in an inclusive environment. Our employment opportunities
  are open to every gender, race, religion, age, sexual
  orientation, ability, place of origin, or socioeconomic
  status. We remain committed to a culture of diversity,
  equity and belonging, where all employees are welcomed,
  respected, connected, and engaged.

  As part of our recruitment process at Atolls, we use AI
  tools for interview recording and transcription. These tools
  are designed to assist our teams and are never used
  independently to make hiring decisions. Every assessment and
  hiring decision is made by our hiring panel and team through
  human judgment. Before your first interview, you will
  receive an email with the option to opt out. You can also
  change your preference at any time during the recruitment
  process by using the link in that email or by contacting
  your Talent Acquisition Partner.

  The use of AI, or the choice not to use it, will not affect
  your application in any way.
