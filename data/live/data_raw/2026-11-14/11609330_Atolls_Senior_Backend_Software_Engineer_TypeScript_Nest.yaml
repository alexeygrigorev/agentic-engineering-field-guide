description: |
  Atolls is the world’s largest community-driven shopping
  platform, active in 20+ markets.

  We help millions make smarter spending decisions across
  discovery, evaluation, and (re-)purchase by connecting
  people with the right brands and retailers.

  Our 1,000+ team across 10 countries builds products used
  every day at global scale, where you’ll have real ownership
  and see your impact. Want to shape the destinations people
  rely on to shop with confidence? Keep reading.

  About This Role:

  We are looking for a Senior Backend Software Engineer
  (TypeScript, NestJS/Node.js) to join our Fulfilment team in
  London (hybrid) or working remotely from the UK. You will
  build and scale the backend services that power our saving
  and rewards programs, ensuring customers can securely
  authenticate, manage their accounts, and use self-services
  without friction.

  By implementing proactive fraud prevention and building
  resilient architecture, you will protect our users and
  create a reliable, seamless experience that prevents issues
  before they need to contact support.

  Our Benefits:

  At Atolls, we believe in nurturing both your professional
  and personal growth. Here’s what you can expect:

  - A culture that values personal and professional development,
    with internal mobility opportunities.
  - A supportive and open-minded team that embraces diverse
    perspectives and innovative ideas.
  - 32 days of paid vacation plus your birthday off, giving you
    the time you need to recharge.
  - A flexible hybrid working scheme to balance work and life.
  - Access to a learning budget and internal training to help
    you grow in your role.
  - Mental health coaching to support your well-being.
  - Regular global and local get-togethers to celebrate
    successes and build connections.
  - The possibility of taking a sabbatical after three years
    with the company.
  - A cloud-based company setup, providing flexibility and
    collaboration opportunities no matter where you are.

  *These are global benefits that apply to all employees, with
  additional local perks based on your location.

  Responsibilities:

  In this role, you will:

  - Architect and develop scalable web applications using
    Node.js, TypeScript, and NestJS
  - Drive collaboration with product and engineering teams to
    deliver secure, high-quality backend solutions.
  - Optimize application performance and resolve complex backend
    issues to ensure a frictionless user journey.
  - Architect seamless integrations with third-party APIs and
    messaging queues like SQS and SNS.
  - Establish best practices for code documentation, unit
    testing, and backend security.
  - Mentor engineering team members and guide technical
    decision-making for backend architecture.

   Your Profile:

  We’re looking for someone with advanced backend development
  and cloud architecture experience, who is dedicated to
  building secure, scalable fulfilment systems that protect
  and empower our users.

  - You have 6+ years of experience as a Software Developer.
  - Knowledge of AWS technologies such as DynamoDB,
    Elasticsearch, relational and NoSQL databases, EventBridge
    and messaging and queuing solutions like SQS, SNS (or any
    other cloud platform like Google Cloud or Azure).
  - General understanding of common design and architectural
    patterns, with the ability to produce elegant designs in
    back-end, REST API, EDA and microservice architectures.
  - Logical, analytical thinking, with a structured and target-
    oriented approach and very good problem-solving skills.
  - Passion for delivering clean code, unit/integration tests,
    and maintainable documentation.
  - Familiarity with Agile/Scrum methodologies and DevOps best
    practices.
  - Knowledge of common frameworks such as GitLab, Docker, and
    CI/CD solutions.
  - Optionally, experience with GraphQL, federation and
    Supergraph concepts.
  - Good communication skills in English.

  Our hiring process:

  - TA Call: Meet one of our Talent Experts and get to know
    Atolls better.
  - Technical Round: Focus on the technical aspects of the role
    (Through a Live Case), and meet your potential manager.
  - Final Round: Meet other Atollians 🏝️It varies from 1 to 3
    interviews

  *Some processes might slightly change according to needs

  Ready to apply?

  Be part of a destination where your work helps millions of
  people make better decisions every day. One focused
  application is all we need. If you truly fit more than one
  role, you’re welcome to apply to up to three. This helps us
  match you with the right opportunity faster.

  We review every application with equal care and will reach
  out if your profile aligns. Apply now with your CV in
  English. *Portfolios, writing samples, or certifications may
  be requested based on the role.

  #LI-AK1 #LI-Hybrid

