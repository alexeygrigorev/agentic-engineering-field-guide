description: |
  To get the best candidate experience, please consider
  applying for a maximum of 3 roles within 12 months to ensure
  you are not duplicating efforts.

  Job Category

  Software Engineering

  Job Details

  About Salesforce

  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.

  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.

  The Experience Revenue Cloud Rating is a newly formed
  engineering team inside Salesforce's Revenue Cloud
  organization, created through our acquisition of m3ter, and
  we're rebuilding our event-driven microservices platform on
  Salesforce's own infrastructure to rate complex, usage-based
  pricing at high volume and low latency. As a Member of
  Technical Staff, you'll join a fully remote, UK-based team
  to help carry both the product and the team through this
  transition, with Agentforce increasingly part of how we
  design and build. What You'll Actually Be Doing

  - Design, build, and operate backend services within our Java-
    based, event-driven microservices architecture, with AI as
    a core part of your development workflow to deliver
    secure, optimized, high-quality code.
  - Make sound technical decisions with incomplete information
    as the team learns and builds in parallel.
  - Critically evaluate code — your own, your teammates', and
    AI-generated — for correctness, quality, security, and
    performance.

  You're Our Person If...

  - You have 4-5 years of backend Java experience, including
    building and operating microservice and event-driven
    architectures.
  - You bring a strong tolerance for ambiguity, with the
    judgment to work independently and make decisions as a
    team and product transition into a new organization.
  - You have hands-on experience with AI development tools
    (e.g., GitHub Copilot, Cursor, Claude Code, Codex) as part
    of your regular workflow, with the prompt engineering
    skill to make outputs reliable and production-ready.
  - Experience will be evaluated based on alignment to the core
    competencies for the role (e.g. extracurricular leadership
    roles, military experience, volunteer work, etc.).

  Even Better If...

  - You've worked through a team or product integration
    following an acquisition.
  - You have experience working with high throughput, low
    latency systems, whilst applying complex business logic.
  - You've contributed to a shared system context — documented
    design standards and constraints that help AI tools
    operate reliably.

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

  Accommodations

  If you need a reasonable accommodation during the
  application or the recruiting process, please submit a
  request via this Accommodations Request Form.

  Please note that Salesforce uses artificial intelligence
  (AI) tools to help our recruiters assess and evaluate
  candidates’ resumes and qualifications throughout the
  recruiting process. Humans will always make any candidate
  selection and hiring decisions. Please see our Candidate
  Privacy Statement for more information about how we use your
  personal data and your rights, including with regard to use
  of AI tools and opt out options.

  We are a recognised Disability Confident member under the UK
  Government Disability Confident employer scheme. We are
  committed to providing an inclusive recruitment process and
  will offer an interview to disabled applicants who meet the
  essential criteria for the role. Applicants are welcome to
  opt-in to the interview scheme as part of the application
  process. If you would like to apply under the scheme, please
  click the link to the Accommodations Request Form above and
  scroll to the UK Disability Confident Scheme section within
  the form.

