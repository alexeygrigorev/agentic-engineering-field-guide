description: |
  What We Do

  In most companies, while an engineer may know why an SLA was
  missed, sales leaders often struggle to tell you why their
  numbers were missed, and they don't even know where to look.
  Finance knows they are spending a ton on "growth" — but they
  don't know what's working, what's not, and how that impacts
  the plan.

  QFlow.ai is the first product that satisfies the needs of
  the entire organization and aligns GTM inputs with Finance
  realities, eliminating the need to hire teams to build data
  warehouses and write custom solutions often involving error
  prone spreadsheets and other manual systems.

  QFlow.ai helps revenue teams at B2B companies focus on
  what's working and improve what’s not. We automate strategic
  planning and analysis, gaining insight from financial,
  sales, and business data.

  We have bootstrapped our way to growth and we're about to
  wrap up our pre-seed round, giving us 24 months of runway .
  Our architecture is in good shape. We are looking for
  engineers who seek continuous improvement, move fast, and
  get excited about customer conversations! No bespoke
  software.Job Description

  We are seeking a talented Senior Fullstack Engineer to join
  our dynamic team. In this role, you will be instrumental in
  developing and maintaining our cutting-edge software
  solutions, ensuring they meet the highest standards of
  scalability, reliability, and performance.

  Responsibilities

  - Design and implement robust full-stack solutions. We use a
    lot of Python and Pandas, but we're not religious about
    tech (if there's a better tool for a job, great)
  - Develop and maintain scalable data infrastructure and
    architecture.
  - Collaborate with cross-functional teams to deliver high-
    quality products.
  - Ensure the integration of new technologies into the existing
    system architecture.
  - Optimize applications for maximum speed and scalability.

  Requirements

  - 3+ years of experience in full-stack development.
  - Proficiency in Python and Pandas.
  - Strong understanding of data infrastructure and AWS
    services.
  - Experience in designing and implementing scalable software
    architecture.
  - Ability to work collaboratively in a team environment.

  Location

  This position is based in the United States, offering a
  blend of on-site and remote work opportunities to best suit
  the needs of our team and projects.

  Join Our Team

  If you are passionate about leveraging technology to create
  impactful solutions and are looking for an opportunity to
  grow with a leading-edge company, we would love to hear from
  you. Apply now to become a part of QFlow.ai's success story.
