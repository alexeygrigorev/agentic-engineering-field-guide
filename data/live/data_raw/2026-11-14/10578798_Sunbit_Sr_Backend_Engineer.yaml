description: |
  Description

  JOB TITLE: Sr. Backend Engineer

  LOCATION: Jersey City (Hybrid, 3 days/ week)

  REPORTS TO: Squad Leader

  The Company:

  Sunbit builds financial technology for real life. Our AI-
  native platform helps more people get to “yes” at the
  moments that matter with personalized offers, transparent
  terms, and no added consumer fees. In stores, practices and
  service centers across the country, Sunbit provides a fast,
  fair pay-over-time option. For everything else, the Sunbit
  Credit Card delivers a modern, no-fee credit experience
  managed in a powerful mobile app.

  We are guided by people-centered values: Serve Others Before
  Self, Include Always, Connect Genuinely, Innovate for Good.
  These values shape how we build, how we support customers
  and merchants, and how we work with each other.

  What makes Sunbit different is an AI-native infrastructure
  that runs through the full customer and merchant journey.
  Our interconnected AI systems power instant decisioning,
  streamline fraud checks with human-in-the-loop safeguards,
  and enable highly personalized offers at scale. The result
  is a quick, fair, and simple experience for consumers and
  merchants.

  We pair this technology with inclusion and transparency.
  Sunbit delivers industry-leading approval rates — 90%+ in
  auto service and 85%+ in dental — while maintaining zero
  consumer fee-based revenue. It is a better way to serve
  people and merchants, proven at scale.

  Today, Sunbit is available across a nationwide, in-person
  merchant network of 30,000+ locations spanning auto service
  centers, dental and optical practices, veterinary clinics,
  and other specialty services. We help teams say “yes” more
  often and help customers move forward with confidence.

  The Role:

  We are looking for a Sr Backend Engineer to join our team
  responsible for designing, building, and maintaining the
  core platform that supports our call center operations,
  including the agent desktop that powers day-to-day customer
  interactions. The solutions developed by this team have a
  direct impact on how efficiently our agents assist customers
  and resolve issues.

  In this role, you will also contribute to improving
  operational efficiency through automation, AI, and
  intelligent workflows. This includes developing tools that
  enable agents to work more effectively, integrating systems
  across the call center ecosystem, and introducing AI-powered
  capabilities that enhance both the agent and customer
  experience.

  This is a high-impact opportunity where engineering work
  directly influences real-world operations at scale. You will
  tackle complex product and platform challenges in a fast-
  paced environment while helping shape the technology that
  powers Sunbit’s customer success organization.

  Requirements

  What You'll Do:

  - Design, build, and evolve the Customer Success agent
    desktop, the core platform used by our call center to
    support customers.
  - Develop tools, workflows, and integrations that connect
    multiple systems used by our Customer Success
    organization.
  - Improve agent productivity and operational efficiency
    through automation, smart workflows, and AI-driven
    capabilities.
  - Work on high-impact product and platform challenges, solving
    real operational problems at scale.
  - Collaborate closely with Product, Customer Success, Product
    lines, and Operations teams to design solutions that
    improve both agent and customer experience.
  - Ensure systems are reliable, scalable, and maintainable,
    supporting a fast-growing operational environment.
  - Write clean, high-quality code, with strong testing and
    observability practices.
  - Take ownership of features end-to-end, from design and
    architecture through development and production
    deployment.
  - Contribute to a strong engineering culture by sharing ideas,
    improving processes, and supporting teammates.

  What You'll Bring:

  - 5+ years of experience in software engineering
  - Bachelor’s degree in Computer Science or a related field.
  - Experience in Kotlin, Java, or Scala with hands-on
    experience.
  - Experience in the Spring Framework.
  - Proficient in both relational (e.g., MySQL) and non-
    relational databases (e.g., MongoDB).
  - Proficiency in micro-service architecture
  - Familiarity with message queue technologies such as Kafka,
    SQS, RabbitMQ, or similar.
  - Strong problem-solving skills, capable of meeting technical
    challenges head-on.
  - Experience with backend software development.
  - A passion for learning, constantly staying up to date with
    industry trends and technology advancements.
  - Resourceful, self-motivated, and capable of working
    independently.
  - Background in fintech is a plus.

  Why Choose Sunbit?

  Sunbit is recognized as one of the fastest-growing and most
  admired fintech companies, earning honors from Inc. 5000
  (four consecutive years), Forbes Fintech 50, Deloitte
  Technology Fast 500, Financial Times, and FinTech
  Breakthrough for its innovation and impact. The company has
  also been featured among Newsweek’s Most Loved Workplaces
  and CB Insights’ Unicorn Companies, reflecting a valuation
  of $1.1B.

  People choose Sunbit for its people-first culture rooted in
  service, inclusion, and real-world impact. Powered by AI
  that helps people in life’s critical moments—offering high
  approvals, speed, and zero fees—Sunbit has achieved proven
  scale across tens of thousands of merchants and millions of
  transactions. Its fast, fair, and simple financial products
  empower consumers and partners alike through clarity and
  trust.

  The Perks:

  - Join one of LA’s fastest growing startups (2023), A Most
    Loved Workplace, #576 on the 2023 Inc 5000 list, and
    Forbes Fintech 50 (2024), #161 on Deloitte Technology Fast
    500 list
  - Mission driven + empowered + collaborative
  - Competitive pay and stock options
  - Unlimited PTO
  - Health Insurance options including Medical, Dental, Vision,
    Life, EAP, FSA, & Maternity Leave
  - Newly added HSA and Pet Insurance
  - 401K Plan with Matching
  - Cell Phone Stipend
  - Team based strategic planning + Team owned deliverables

  ﻿How We Pay:

  - We believe in paying fairly and equitably based on a number
    of factors including but not limited to previous
    experience, relevant work history, interview performance,
    geographical location, internal equity, and expected level
    of ownership
  - We are targeting a base salary of $160k-190k per year for
    this role.
  - This role will also be granted company equity via stock
    options

  Sunbit is an Equal Opportunity Employer. We strive to
  provide a professional & welcoming workplace for all
  employees.

  Recruitment Fraud Disclaimer

  We’ve been made aware of fraudsters impersonating Sunbit
  employees during the hiring process. Please note that all
  official communication will come from an @sunbit.com email
  address, through our applicant tracking platform
  @sunbit.comeet-notifications.com or directly via LinkedIn.
  We will never ask for your age, Social Security number, bank
  account details, payment of any kind, or other unrelated
  personal information during the application process. Our
  hiring process always includes interviews, either by phone,
  zoom, or in person, before any offer is made.

  If something feels suspicious, please contact us at
  hr@sunbit.com to confirm. We ask that you contact
  hr@sunbit.com only about potential instances of fraud.
  hr@sunbit.com does not reach our recruiting team directly.
  Your application directly through the posting is the best
  way to ensure that your candidacy is reviewed by our team.
  Due to the volume of applications, we will not respond to
  nor forward emails about your candidacy that are sent to
  hr@sunbit.com directly, and your email about your
  application will be deleted from our systems.

  ﻿

