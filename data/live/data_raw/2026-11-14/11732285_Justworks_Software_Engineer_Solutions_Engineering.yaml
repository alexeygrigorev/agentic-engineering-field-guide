description: |
  Who We Are

  At Justworks, you’ll enjoy a welcoming and casual
  environment, great benefits, wellness program offerings,
  company retreats, and the ability to interact with and learn
  from leaders in the startup community. We work hard and care
  about our most prized asset - our people.

  We’re helping businesses get off the ground by enabling them
  to focus on running their business. We solve HR issues.
  We’re data-driven and never stop iterating. If you’d like to
  work in a supportive, entrepreneurial environment, are
  interested in building something meaningful and having fun
  while doing it, we’d love to hear from you.

  We're united by shared goals and shared motivations at
  Justworks. These are best summed up in our company values,
  which are reflected in our product and in our team.

  Our Values

  If this sounds like you, you’ll fit right in.

  Who You Are

  You are a thoughtful software engineer who wants to make
  other developers successful. You enjoy building products
  that are clear, reliable, and pleasant to use, and you are
  energized by learning how real customers and partners use an
  API, not just how it is supposed to work on a diagram.

  You have solid engineering fundamentals and are developing
  confidence across web applications, APIs, and integration
  patterns. You ask good questions, write what you learn down,
  and care about shipping complete experiences: code, tests,
  documentation, observability, and a clear path for someone
  else to use what you built.

  On this team, you will build the connective tissue of the
  Justworks developer ecosystem while supporting partner
  integrations. You will learn directly from developer and
  partner feedback, contribute to hands-on solutioning, and
  turn repeatable needs into self-service capabilities.

  What You Will Work On

  - Build, test, deploy, and operate developer-facing
    experiences such as developer portal, documentation
    tooling, SDK improvements, quickstarts, code samples, and
    integration templates.
  - Contribute to partner integration work by researching APIs,
    implementing well-scoped components, validating
    integration flows, and preparing clear technical
    documentation and test plans.
  - Pair with senior engineers in partner working sessions;
    progressively own bounded technical discussions and
    follow-up deliverables.
  - Turn repeated questions and friction into durable
    improvements to docs, samples, SDKs, tooling, and product
    feedback.
  - Write maintainable code with appropriate automated tests,
    logging and metrics, code review, and security practices.
  - Participate in design reviews, incident and debugging work,
    and team retrospectives; use what you learn to improve the
    developer journey.
  - Collaborate with Engineering, Product, Partnerships and
    Sales, and Support with curiosity, reliability, and clear
    communication.

  How You Will Do Your Work

  As a Software Engineer, how results are achieved is central
  to success at Justworks. You will demonstrate:

  - Good judgment: You seek context, understand the impact of
    changes, raise risks early, and take ownership of the work
    you commit to.
  - Resourcefulness: You investigate thoughtfully, use available
    tools and documentation well, and ask for help when it
    will unblock progress.
  - Teamwork and communication: You communicate clearly,
    document your work, welcome feedback, and treat internal
    and external collaborators with respect.
  - Influence and leadership: You contribute ideas, share what
    you learn, and build trust through dependable execution.
  - Skills and knowledge: You continuously strengthen your
    software-engineering, API, testing, and developer-
    experience craft.

  You model Justworks' COGIS values—Camaraderie, Openness,
  Grit, Integrity, and Simplicity—in both the products you
  build and the relationships you create.

  Qualifications

  - 2+ years of professional software engineering experience, or
    equivalent experience building and shipping production-
    quality software.
  - Experience with one or more modern programming languages
    such as TypeScript/JavaScript, Go, Ruby, or Python.
  - Familiarity with HTTP APIs and the fundamentals of web
    applications, including authentication, structured data,
    error handling, and testing.
  - Experience building, debugging, or consuming APIs in a
    professional, academic, open-source, or substantial
    personal-project setting.
  - A commitment to clear written communication, documentation,
    and collaborative software development.
  - Curiosity about developer tools, integrations, and the users
    of the software you build.

  Nice To Have

  - Experience with a frontend framework, backend service, API
    client or SDK, developer documentation, or sample
    application.
  - Familiarity with OAuth/OIDC, OpenAPI, webhooks, cloud
    infrastructure, containers, or observability tools.
  - Experience in customer-facing, developer-facing, or cross-
    functional product work.

  Technologies and Experience

  Our work includes TypeScript/JavaScript, Go, Ruby, AWS, API
  specifications, OAuth/OIDC, automated testing, and
  observability tooling. We do not expect expertise in every
  technology; we expect strong fundamentals, a learning
  mindset, and care for the people who use what we build.

  The base wage range for this position based in our New York
  City Office is targeted at $131,000 - $169,000 per year.

