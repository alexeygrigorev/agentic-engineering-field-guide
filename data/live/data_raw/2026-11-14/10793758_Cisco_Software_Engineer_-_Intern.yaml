description: |
  Please note this posting is to advertise potential job
  opportunities. This exact role may not be open today but
  could open in the near future. When you apply, a Cisco
  representative may contact you directly if a relevant
  position opens.

   Meet the Team

  Cisco’s Ensoft software engineering team are responsible for
  developing components for the Cisco IOS-XR operating system,
  which is used on high-end carrier and data-center routers.
  We create cutting-edge software that helps to run the
  Internet, delivered with outstanding quality.

  As an intern with our team, you’ll be working alongside
  incredibly passionate individuals, like yourself, with a
  shared enthusiasm for software development. The Ensoft team
  is entirely made up of people recruited as energetic,
  exceptional graduates from top universities who have
  developed into all the roles that make up our team today -
  from the management team to the industry leading technical
  experts.

  We have a really friendly culture. It is a sign of how well
  people get on that employees arrange so many activities
  together in their spare time. This is on top of the many
  company funded social events arranged by our social team.

  Your Impact

  Our aim is to provide you with a full experience of what it
  is like to work as part of the Ensoft engineering team, in
  order to help you to decide if this is the career for you.

  To achieve this, you will be working closely alongside one
  of our teams on a project with a real result, and with a
  completion point that can be reached within the 8-10 week
  period that you are with us. This should allow you to
  experience everything from design through to coding and
  testing of the product, and to familiarize yourself with the
  day to day agile processes and AI-enabled workflows that we
  use as part of the job.

  Minimum Qualifications

  - You must have a curiosity about developing software - that's
    what we do!
  - You should be an undergraduate student taking a numerate
    degree at a UK university.
  - We need you to have enough software and programming
    experience to become quickly productive, so we can offer
    an exciting placement.
  - Finally, you must be sociable. Our software development
    process is collaborative, so you should enjoy working
    closely with the other people in your team.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
