description: |
  About Fubo:

  FuboTV Inc. is a consumer-first live TV streaming company
  that is defining the future of TV.

  Ranked among Fast Company’s Most Innovative Companies (2026)
  and the Financial Times’ The Americas’ Fastest-Growing
  Companies (2026, 2025), FuboTV owns Hulu + Live TV
  (entertainment), Fubo (sports) and Molotov (entertainment
  and sports), which stream in markets around the globe.

  Our Mission:

  Our mission is to deliver premium sports, news and
  entertainment programming through a best-in-class user
  experience that offers greater choice, flexibility and
  value.

  About the Role:

  *This role is a New York City based HYBRID position.
  Candidates must be located in NYC, and willing to come into
  the office on a hybrid basis, four times a week (Monday,
  Tuesday, Wednesday, Thursday).*

  Fubo is looking for a Senior Backend Software Engineer to
  join our product development team. In this role, you'll
  design and build the scalable APIs that power Fubo's
  backend-driven user experiences across the globe.

  You'll work closely with a Backend Engineering Manager and
  collaborate across disciplines, partnering with product
  managers, QA, and frontend and backend engineers, to ship
  features across web, mobile, Smart TV, Roku, and Apple TV.

  We're looking for engineers who care as much about the
  product experience as they do about the engineering systems
  that drive it. If you take pride in optimizing user
  journeys, owning system performance end-to-end, and
  operating within a complex distributed microservices
  architecture, you'll thrive here.

  Requirements:

  - 7+ years of experience shipping production code. We use Go,
    so experience with that (or another strongly-typed
    language) is ideal.
  - Solid cloud and infrastructure chops. You've built reliable
    backend services on infrastructure (we use GCP) and are
    comfortable deploying with Docker and Kubernetes.
  - You can navigate ambiguity. You're a self-starter who can
    take a vague idea, work with product teams to hammer out
    the details, and own it all the way to delivery. We are
    involved in all stages of the product life cycle, not
    solely engineering.
  - A pragmatist who cares about quality. You advocate for
    simple, maintainable solutions and have a habit of leaving
    the codebase better than you found it.
  - Team-first. You enjoy mentoring others, sharing what you
    know, and fostering a culture of honest, empathetic
    feedback to help others grow.
  - Curiosity and learning. You're genuinely interested in how
    AI tools can change the way we write and ship code. You
    seek to continuously expand your and your teammates’
    abilities.

  Perks & Benefits:

  - At Fubo, you will have the opportunity to personally
    influence what live media looks like after it goes through
    its next big transformation
  - Fubo provides a highly competitive compensation based on
    experience and market standards
  - Robust benefit package including Health/Dental/Vision
    coverage 401k, Life Insurance, and commuter benefits
  - Free Premium Fubo Account
  - Unlimited PTO days and regular company-wide activities
  - Fubo's main headquarters are located in Midtown Manhattan,
    with offices in Paris, and Bangalore
  - Fubo is an e-verified company

  Fubo’s minimum base salary for this role if hired in New
  York City is $185,000 per year; maximum base salary for this
  role is $215,000 per year. Additionally, this role is
  eligible to participate in Fubo's equity plan, annual cash
  bonus plans, unlimited PTO, and a full range of medical
  benefits. The final offer amount will be at the company’s
  sole discretion and determined by multiple factors,
  including years and depth of experience and expertise, and
  other business considerations.
