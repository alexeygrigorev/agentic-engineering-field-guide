description: |
  About Agentio

  Agentio enables marketers to buy creator led ads as easily
  and scalably as Meta or Google ads—automating sourcing,
  pricing, contracting, delivery, and measurement—so work that
  took months now happens in minutes.

  We're on a mission to transform a $800B digital ad ecosystem
  by shifting digital ad spend into the hands of creators.
  That means better outcomes for marketers and enabling
  creators to live off their work—finally being paid in
  proportion to the value they create. That shift is
  accelerating: Unilever's CEO has said the company will move
  roughly half of its ad budget into social and
  creators—Unilever is among the world's largest advertisers,
  spending around $9–10B annually. As these dollars move, they
  need performance-grade pipes; Agentio is how those dollars
  flow to creators with the speed, control, and measurement
  marketers expect. We enable brands like Uber, DoorDash, and
  Bombas to run creator campaigns with the same rigor,
  control, and accountability as their core performance
  channels.

  Our AI-Native platform enables real-time content
  understanding at scale, simultaneous reasoning across
  hundreds of thousands of pieces of content, and intelligent
  allocation of multi-million dollar budgets. Our models apply
  more cross-platform performance signal than anyone else in
  the world, compounding with every campaign through a high-
  trust marketplace with accelerating network effects. The
  result is a flywheel: brands get the performance they've
  been chasing, creators get the intelligence and income they
  deserve, and Agentio becomes the infrastructure powering a
  generational shift in where media dollars flow.

  The market agrees. Agentio has raised $56M at a $340M
  valuation, including a Series B led by Forerunner that
  followed our Series A within a calendar year. Backed by
  Benchmark, Craft, and AlleyCorp. Named to Forbes' Next
  Billion Dollar Startups, 2025. Named to Inc.'s Best Places
  to Work 2026, one of 10 companies nationally recognized in
  the "On the Rise: 0–4 Years in Business" category.

  An $800B market. A once-in-a-generation technology shift.
  This is the moment. This is the team. Come build something
  generational with us.

  About the Role

  We’re looking for a senior software engineer with experience
  in early-stage or high-growth environments to join our team.
  As a foundational member of engineering, you’ll work
  directly with our founders to design, build, and launch new
  product features—from first lines of code to production.
  Every week, you’ll ship real functionality and have the
  autonomy to tackle meaningful, complex engineering problems.

  You’ll be tackling complex challenges in marketplace design,
  multimodal content understanding with large models, and
  campaign optimization in a high-performance environment
  where technical decisions directly shape product direction
  and business outcomes.

  This is a rare opportunity to get in early at a generational
  company redefining how advertising works for brands and
  creators. If you're excited by ownership, fast execution,
  and real-world impact, this could be a great fit.

  What You Need

  - Experience building and scaling high-quality, maintainable,
    products from the client to the server
  - Experience and interest in working across the stack

  About You

  - You enjoy building features, as well as designing and
    scaling architectureNimble, hungry, humble, and adaptive
    to changeYou appreciate good design, and you get excited
    to translate that into functional experiences that people
    use every day
  - You are a human-centric product thinker who loves thinking
    about how technology can best be used to enhance people's
    lives
  - You are excited to learn and grow in a fast-paced
    environment
  - A true problem-solver and self-starter, with incredible
    ambition and drive
  - Competitive and highly motivated to exceed expectations
  - Ready to roll up your sleeves, get things done, and work
    harder than you’ve likely ever worked before, but with far
    greater reward
  - A fun, honest, empathetic, and curious teammate
  - You understand that Agentio is building in-person, 5 days a
    week

  What You'll Get

  - The opportunity to build a first-of-its kind business as an
    early team-member and make a meaningful impact in the way
    brands share their stories and creators live off their
    work.
  - Crash-course in what it takes to scale a start-up with
    first-hand exposure to the different foundational business
    drivers and needs.
  - The chance to work with an exceptional team and help build
    our engineering culture
  - A collaborative, transparent, and engaging work environment.

  Benefits & Perks

  - Flexible PTO – Take the time you need to recharge
  - Comprehensive Health Coverage – Top medical plan through
    Aetna
  - Dental & Vision Plans – Protect your smile and your sight
    with coverage from Guardian
  - 401(k) Retirement Plan – Invest in your future while you
    build your career
  - $100 Monthly Lifestyle Credit – Use it to shop with our
    amazing Agentio Brand Partners
  - Daily lunches and snacks in the office to keep you at your
    best
  - Dinner provided Monday - Thursday
  - Fully subsidized gold tier access on Wellhub (Includes
    LifeTime, Barry's, Solidcore, Headspace, etc)
  - Gym in the building! – Your workout, right downstairs

