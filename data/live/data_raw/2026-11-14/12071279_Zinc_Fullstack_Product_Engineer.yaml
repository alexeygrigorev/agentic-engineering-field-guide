description: |
  We are expanding our engineering team to boost our
  development capacity and take our product to the next level.
  As a Fullstack Product Engineer, you'll play a hands-on role
  in building high-quality features across our platform,
  contributing to technical decisions, and helping us deliver
  a product that's efficient, robust, and a delight for
  thousands of customers to use.

  You'll work closely with Product, Design, and more senior
  engineers to understand problems deeply, translate them into
  well-crafted solutions, and grow your ability to shape how
  we build for long-term success.

  Key Responsibilities 🗝️

  Building powerful features 🚀 – Design and deliver high-
  impact solutions that are clean, scalable, and built to
  last, delighting thousands of customers.

  Contributing to the big picture 🎯 – Collaborate with
  Product, Design, and the wider engineering team to
  understand what we're building and why, and bring thoughtful
  input to technical decisions.

  Keeping things running smoothly 🛠️ – Help maintain,
  optimise, and secure our systems so they perform at their
  best, even at scale.

  Problem-solving like a pro 🧠 – Tackle tricky technical
  challenges with support from the team, building your ability
  to turn complex problems into elegant, maintainable
  solutions.

  Growing and sharing 🤝 – Learn from senior engineers around
  you, share what you know, and contribute to a team culture
  of continuous improvement.

  Staying ahead of the game 📚 – Keep up with new tools,
  trends, and best practices, and bring fresh ideas to how we
  evolve our stack and processes.

  Owning your work end-to-end 🎨 – Take responsibility for
  features from initial idea to production, making sure every
  detail delivers value to users.

  Skills, Knowledge and Expertise 🚀

  Hard skills ⚡

  Full Stack Development 💻 – Solid working experience with
  Node.js (Express/Nest.js) and modern frontend frameworks
  like Vue/Nuxt or React/Next, building reliable experiences
  end-to-end.

  TypeScript & JavaScript 📜 – Good hands-on experience
  delivering production applications using modern JS/TS
  practices, with a desire to deepen your expertise.

  System Design 🏗️ – An understanding of how to build
  scalable, maintainable systems, and an eagerness to develop
  stronger architectural instincts over time.

  Database & Cloud ☁️ – Working familiarity with MongoDB and
  AWS services (Lambda, S3, API Gateway), comfortable building
  and shipping cloud-native features.

  DevOps & CI/CD 🚀 – Some experience with deployment pipelines
  and automated processes, with appetite to grow your
  infrastructure skills.

  Testing & Quality Assurance 🧪 – Comfortable writing tests
  using tools like Jest and Cypress to ship with confidence.

  Soft skills ✨

  Highly Collaborative 🤝 – Works well in cross-functional
  teams alongside engineers, designers, and product, and
  actively contributes to a positive team dynamic.

  Product-Minded 🚀 – Thinks beyond the code, staying curious
  about how features improve the user experience and serve
  broader business goals.

  Clear Communicator 🗣️ – Can explain technical thinking
  clearly, ask good questions, and engage constructively with
  feedback.

  Kind & Supportive ❤️ – Contributes to a respectful,
  inclusive team culture and brings a collaborative, humble
  attitude to their work.

  What we offer 🍉

  Zinc offers a chance to work on a product that brings a
  fresh perspective on data ownership in hiring

  - 24 days holiday + Bank Holidays + your birthday off 🎉
  - £1200 annual benefits allowance (ThanksBen, from month 2)
  - Early finish Fridays (16:00)
  - Yearly company retreat abroad ✈️
  - 30 days to work from anywhere 🌍
  - Enhanced Maternity, Paternity, and Adoption Leave (2 months
    full pay, then statutory)
  - Statutory pension with NEST (3% employer, 5% employee)
  - Zinc shares, issued through the EMI Scheme
  - Unlimited access to MoreHappi coaching
  - Company socials, quarterly team socials, free Monday lunches
  - Nursery workplace benefit scheme (Yellownest)
  - Option to lease an electric car through Electric Car Scheme
  - Celebrated Zinc anniversaries 🥳

  About Who are Zinc? ⚡️We believe in better background
  checking: making them easy, instant and delightful - for
  candidates and HR teams across the world 🌎. Founded in 2017,
  we've grown year-on-year, reaching the Times Top 100 fastest
  growing businesses, the Deloitte EMEA fast 500 and winning
  the 2026 HSBC x WIRED Award in the Trailblazers Category.But
  we're not all work, our founders Luke and Charlotte are hot
  on being a culture first business. By this, we don't just
  mean an active calendar of company and team events (although
  these are great! 🍻 🥂🍕🎯) - our culture is defined by respect,
  fostering support for new ideas, promoting flexible work
  environments and operating with autonomy and low ego.
  🔥💥❤️It's not just us who think they've done a stellar job -
  we've won awards for being a Top Place To Work in 2025 and
  2026 from Tembo and SeedLegals 💚What are our values? 🧩🧩🧩Our
  values are: Pragmatism, Integrity, Empathy, Collaboration,
  Empowerment and Speed. We call them the PIECES that make
  Zinc (see what we did there 😂).How do we work?
  🧑🏽‍💻👩🏼‍💻👨🏿‍💻We operate on a hybrid working model, with
  everyone coming to our Shoreditch Offices on Mondays and
