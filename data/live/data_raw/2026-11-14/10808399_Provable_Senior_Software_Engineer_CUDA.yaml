description: |
  About Provable

  At Provable, our mission is to redefine trust and privacy in
  the digital world.

  By creating tools that simplify the complexities of zero-
  knowledge technology, we empower developers to build
  applications that prioritize security, user control and
  scalability. We envision a future where privacy is not an
  afterthought but a fundamental standard, enabling a more
  secure and equitable Web3.

  Our commitment extends beyond technology to fostering a
  vibrant, collaborative community of innovators. Through
  accessible resources, thoughtful design, and a focus on
  developer success, we aim to bridge the gap between cutting-
  edge blockchain technology and real-world applications.
  Together we’re not just building tools-we’re shaping the
  foundation for a private decentralized future.

  The Role

  Provable is searching for exceptional senior CUDA engineers
  to help build privacy preserving zero knowledge protocols
  and products.

  As a Provable senior engineer you will use your engineering
  talent to design, implement and maintain both cryptographic
  and distributed systems and help build privacy preserving
  products on top of those systems. Collaboration will be key.
  You should be able to work well with engineers, designers,
  and leadership to turn our products and technical vision
  into deliverables each quarter. You should be able to
  clearly and thoroughly communicate your ideas.



  Responsibilities

  - Designing, developing, and optimizing high-performance
    confidential computing solutions using CUDA for our core
    services and products.
  - Identifying and resolving performance bottlenecks in complex
    computational workflows, leveraging advanced CUDA
    programming techniques and profiling tools.
  - Writing clean, efficient, well-documented, and thoroughly
    tested CUDA code that sets a high standard for quality
    within the engineering team.
  - Collaborating closely with developer services and
    infrastructure teams to integrate GPU-accelerated
    algorithms into our existing systems and ensure seamless
    functionality.



  Key Qualifications

  - 5+ years of software engineering experience
  - 2-3+ years of professional CUDA experience
  - A strong foundation in blockchain concepts and ideally,
    experience contributing to a blockchain project
  - Low-level system programming and/or distributed systems
    design experience



