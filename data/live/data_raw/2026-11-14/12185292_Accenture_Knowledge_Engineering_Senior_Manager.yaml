description: |
  #LI-MP #LI-EU

  YOU ARE

  You lead the complete knowledge engineering scope on our
  most strategic and complex programs; lead creation of
  thought leadership, innovation, and assets for the
  discipline. You own how the most demanding programs
  formulate real-world problems into scalable AI and KG
  solutions, setting strategy and architecture end to end. You
  lead and develop teams of engineers, building capability
  across the discipline and guiding adoption of new methods
  and algorithms. You define what staying at the forefront
  means for the practice; drive innovation and translate it
  into new offerings. You set the standards for how ontologies
  are designed, evaluated, and maintained across programs. You
  make the case to senior stakeholders and shape the
  methodologies and data architectures that prove value at
  scale. You lead the creation of thought leadership,
  innovation, and reusable assets that advance the discipline
  beyond any single engagement. You partner with business and
  technical leaders to direct end-to-end delivery across
  complex, multi-stakeholder programs.

  THE WORK

  - Lead the complete Knowledge Graph solution scope that
    transforms data architecture for our most strategic and
    complex clients.
  - Own the design, development, and implementation of AI and
    semantic solutions across the program.
  - Partner with project leaders, delivery leads, and senior
    client stakeholders to create stand-out, graph-powered
    offerings.
  - Develop trusted-advisor relationships with senior client
    stakeholders.
  - Make and defend the business case for the semantic layer
    solution at the executive level.
  - Lead Accenture sales and pre-sales efforts and shape data
    transformation programs.
  - Drive the practice's thought leadership, innovation, and
    asset development on trends and agentic technologies, and
    develop the teams who deliver them.

  BASIC (REQUIRED) QUALIFICATION

  - Bachelor's degree or equivalent, plus all of the following:
  - Significant experience with Knowledge Graph technologies
    (RDF, SPARQL, LPG, SHACL)
  - Advanced practical knowledge of schema design, ontology
    management, and KG curation
  - Seasoned in designing and developing KG solutions and graph-
    based ML models (functional + technical)
  - Proven experience in end-to-end data pipeline
    implementations for AI applications (esp. LLMs), with
    hands-on design and configuration
  - Extensive experience with strong knowledge of relational
    databases, object stores, graph databases (Stardog, Neo4J,
    Amazon Neptune), and vector databases
  - Managerial experience leading people, able to explain the
    value of the semantic layer and knowledge graphs to senior
    business and technology stakeholders, with a proven track
    record in sales and/or pre-sales and in delivering data
    transformation programs and developing teams

  PREFERRED QUALIFICATION

  - Experience in Practical experience with NLP techniques
    and/or Search Techniques, prompt engineering
  - Experience with LLMs for enterprise-scale applications.
  - Hands-on experience with cloud platforms (AWS, Azure, GCP)
  - Well-versed in Python, with experience in frameworks like
    Tensorflow, PyTorch, and tools for building ETL pipelines
    (e.g. Apache NiFi, Airflow)
  - Strong collaboration skills with the ability to work across
    engineering, research, and product teams across multiple
    time zones.
  - You have external client-facing consulting experience
  - Ph.D. in Computer Science, Computer or Electrical
    Engineering, Mathematics, or a related field.
  - Broad experience in diverse ML techniques and agentic
    systems.

  #LI-MP

