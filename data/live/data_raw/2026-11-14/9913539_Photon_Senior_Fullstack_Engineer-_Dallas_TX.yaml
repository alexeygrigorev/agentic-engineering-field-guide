description: |
  We are seeking an experienced Full Stack developer to join
  us in the design and development of innovative technology
  for financial advisors and their clients using the latest
  technology stack in a collaborative and engaging
  environment.  You will play a leading role in the agile
  development of the web applications used by thousands of
  Investment Professionals to deliver comprehensive brokerage
  solutions to their customers.  Our development teams are
  highly collaborative and encourage creativity, innovation,
  and excellence. Your experience, skills, and input will be
  critical to our shared success.

  The Expertise and Skills You Bring

  - 5+ years full stack software development experience building
    enterprise web and middle tier applications including
    Angular, Typescript, and core Java with Spring/Springboot.
  - B.S. in Computer Science, Engineering, Mathematics, or
    equivalent experience.
  - Leadership experience to guide, encourage, and motivate your
    fellow engineers.
  - Experience working in an Agile Scrum development
    environment.
  - Experience with web services - JSON, XML, REST, SOAP, etc.
  - Experience with Docker, Kubernetes, Terraform, and AWS cloud
    deployment/application management.
  - Experience with unit testing and test automation
    libraries/strategies.
  - Experience building and deploying applications using
    continuous integration pipelines and automated deployment
    tools such as Jenkins.
  - Experience using source control and pull requests for
    collaborative development in code repository tools such as
    GitHub.
  - Strong communications and problem-solving skills

  The Value You Deliver

  - Developing and deploying software in a fast-paced
    environment.
  - Collaborating with colleagues on technical implementation
    and process improvement.
  - Able to clearly present sophisticated technical solutions,
    ideas, and plans to senior management, business partners,
    and less technical team members as needed.
  - Working closely with technology and business partners to
    design new features.
  - Passion for learning the latest technologies and frameworks.
  - Building positive relationships within and across teams.











  Compensation, Benefits and Duration



  Minimum Compensation: USD 35,000 Maximum Compensation: USD
  123,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
