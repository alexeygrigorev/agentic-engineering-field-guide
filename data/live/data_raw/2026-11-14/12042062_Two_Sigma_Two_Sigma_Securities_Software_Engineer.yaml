description: |
  Position Summary  Two Sigma is a leading quantitative
  investment management and trading firm. The company applies
  a scientific approach to investing, combining cutting-edge
  technology, artificial intelligence, data science, and
  quantitative research with rigorous human inquiry to
  capitalize on market opportunities and deliver alpha for
  investors. Our team of engineers, quantitative researchers
  and data scientists looks beyond the traditional to test
  hypotheses and develop creative solutions to some of the
  world's most complex economic problems. Two Sigma Securities
  brings a scientific approach to systematic trading and risk
  management to make markets more efficient. Our team trades
  equites, options and futures, leveraging our high
  performance trading system to execute over 850 million
  shares per day. Two Sigma Securities is entering an exciting
  growth phase. We value the insights of our colleagues and
  encourage them to innovate and shape their own work agenda.
  New joiners use our proprietary platform to work on diverse
  projects. From building next generation trading technologies
  and researching novel AI and machine learning techniques to
  enhancing our strategies and deploying automation, our team
  is pushing the frontier in systematic trading We are looking
  for a Software Engineer to join our Wholesale Market Making
  (WMM) Engineering team. This role will involve building
  trading systems and research infrastructure for a market-
  making business that provides liquidity to retail
  brokerages, working at the intersection of high-performance
  engineering and quantitative finance. This is a high-impact
  opportunity on a small, focused team with clear and
  measurable outcomes, where the engineer will help shape a
  modern trading platform from the ground up while
  collaborating daily with top-tier researchers and traders.
  You will take on the following responsibilities:

  - Design, build, and optimize a next-generation, low-latency,
    high-throughput trading platform
  - Develop and maintain research infrastructure supporting
    strategy development and analysis
  - Collaborate closely with quantitative researchers, modelers,
    and traders to solve pivotal business problems
  - Deliver engineering work that directly impacts trading
    performance and revenue

  You should posses the following qualifications:

  - Minimum 1 year of experience in software engineering
    required; 5+ years in cutting-edge software engineering
    preferred
  - A Bachelor's degree with Honours in a relevant discipline
    required, or a Master's degree in Computer Science,
    Engineering, or a related field
  - Proficiency with Python, Java, C, or C++
  - Interest in distributed, high-performance, and low-latency
    systems
  - Ability to collaborate effectively with technical and
    business stakeholders
  - Experience in trading, financial systems, or other latency-
    sensitive domains is a plus but not required

  You will enjoy the following benefits:

  - Core Benefits: Fully paid medical and dental insurance
    premiums for employees and dependents, competitive 401k
    match, employer-paid life & disability insurance
  - Perks: Onsite gyms with laundry service, wellness
    activities, casual dress, snacks, game rooms
  - Learning: Tuition reimbursement, conference and training
    sponsorship
  - Time Off: Generous vacation and unlimited sick days,
    competitive paid caregiver leaves
  - Hybrid Work Policy: Flexible in-office days with budget for
    home office setup

  The base pay for this role will be between $165,000 and
  $250,000. This role may also be eligible for other forms of
  compensation and benefits, such as a discretionary bonus,
  health, dental and other wellness plans and 401(k)
  contributions. Discretionary bonus can be a significant
  portion of total compensation. Actual compensation for
  successful candidates will be carefully determined based on
  a number of factors, including their skills, qualifications
  and experience. We are proud to be an equal opportunity
  workplace. We do not discriminate based upon race, religion,
  color, national origin, sex, sexual orientation, gender
  identity/expression, age, status as a protected veteran,
  status as an individual with a disability, or any other
  applicable legally protected characteristics. Two Sigma is
  committed to providing reasonable accommodations to
  qualified individuals in accordance with applicable federal,
  state, and local laws. If you believe you need an
  accommodation, please visit our website for additional
  information.
