description: |
  This is a hybrid role (3 days per week) based out of London.

  About Iconic:

  We’re building digital actors: AI-driven characters that
  don’t just talk, but act; shaping the world, responding to
  the player, and driving stories that evolve through both
  words and actions.

  The Mission:

  We believe games and interactive media are on the verge of a
  fundamental shift.

  Today’s experiences are largely scripted, characters follow
  predefined paths, and player choice is limited. We’re
  building systems that change that: digital actors that can
  think, communicate, and take action in real time.

  Our goal is to create worlds that are truly alive—where
  stories emerge from interaction, and every player experience
  is unique.

  Recent advances in AI make this possible for the first time.
  The challenge now is turning that potential into real,
  scalable systems that people can play.

  The Role:

  We’re looking for a Software Engineer to help build the
  systems powering our digital actors and interactive worlds.

  This is a highly hands-on role working across gameplay
  systems, AI infrastructure, tools, runtime systems, and
  product features. You’ll collaborate closely with engineers,
  researchers, designers, and artists to help turn emerging AI
  capabilities into real player experiences.

  This is not just an implementation role. You’ll be
  contributing to the foundations of a new kind of interactive
  medium helping shape how intelligent characters behave,
  respond, and interact with players in real time.

  A background in games is not required, but a strong interest
  in games, simulation, and interactive systems is essential.

  What You’ll Do:

  - Design, build, and maintain production systems across
    multiple areas of the stack
  - Contribute directly to gameplay systems, AI integrations,
    runtime infrastructure, and developer tooling
  - Collaborate with researchers to help bring experimental
    systems into real products
  - Work closely with product and design to build compelling
    interactive experiences
  - Write clean, maintainable, and performant production code
  - Help improve engineering practices, tooling, and workflows
    as the team grows
  - Contribute ideas and experimentation around how AI can
    create new forms of gameplay and interaction

  What We’re Looking For:

  - Strong software engineering fundamentals
  - Experience building and shipping production software
  - Comfortable working across different languages, tools, and
    systems
  - Strong problem-solving ability and willingness to learn new
    technologies quickly
  - Interest in AI systems and how they can be applied to games
    and interactive experiences
  - Interest in games, simulation, or emergent systems
  - Collaborative mindset and comfort working in cross-
    functional teams
  - Strong understanding of engineering quality and
    maintainability

  Nice to Have:

  - Experience with game engines (Unity, Unreal, or similar)
  - Experience working on gameplay systems or real-time
    applications
  - Familiarity with AI/ML systems, APIs, or tooling
  - Experience in startups or small, fast-moving teams
  - Personal projects, mods, prototypes, or game jams

  Why Join Us

  Be a foundational member of a team innovating at the
  intersection of AI, art, and storytelling. You'll help shape
  the research direction, culture, and technical foundations
  of a company building toward something genuinely new.

  What we offer:

  - Competitive salary and equity compensation
  - 25 days annual leave + bank holidays
  - Private healthcare
  - Based in London with hybrid work
  - Inclusive & friendly company culture with socials and game
    breaks
