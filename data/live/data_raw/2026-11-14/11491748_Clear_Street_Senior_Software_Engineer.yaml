description: |
  About Clear Street:

  Clear Street’s mission is to give every sophisticated
  investor access to every asset, in every market, through a
  unified platform built for speed, transparency and scale.

  We give our clients the technology, tools, and service once
  reserved for the largest institutions, rebuilt with modern
  infrastructure. Our single, cloud-native, end-to-end capital
  markets platform powers investor growth today and is
  transforming how they can interact with markets tomorrow.

  For more information, visit https://clearstreet.io.

  The Role:

  As an experienced Senior Software Engineer you will help
  build our flagship Clear Street Studio, a modern brokerage
  experience. You will tackle non trivial problems that force
  you to balance trade offs while implementing clean and
  efficient solutions. You will join our team of passionate
  and collaborative engineers to build core services for our
  world-class financial platform designed to handle all
  aspects of client needs while maintaining a high SLA.

  You will develop a wide range of services, from user
  authentication and authorization to client data delivery.
  You will have the opportunity to solve complex problems that
  will challenge your system design skills, implement clean
  and efficient code, and simplify complexity through feature
  and service design. As a senior team member, you will mentor
  teammates, evolve our technical standards and best
  practices, and promote a culture of system design.

  The Team:

  Our team is composed of highly talented and motivated
  engineers who are passionate about pushing the boundaries of
  financial technology. Working together, we have built a
  platform that serves institutional clients and is at the
  forefront of technological innovation. As a member of our
  team, you will have the opportunity to work with cutting-
  edge technologies, collaborate with colleagues from diverse
  backgrounds, and make a meaningful impact on the financial
  industry. We value creativity, innovation, and a strong work
  ethic, and we are committed to providing our team members
  with the support and resources they need to succeed.

  Requirements:

  - You have at least seven (7) years of professional experience
    implementing highly scalable services in Java with a deep
    understanding of the Spring Framework ecosystem.
  - You have contributed to systems that deliver solutions to
    complex business problems that handle massive amounts of
    data. You are drawn towards scale, distributed systems,
    and associated technologies.
  - You can clearly explain the nuances of system design and
    paradigms to engineers and stakeholders.
  - You prioritize end user experience and it shows in your APIs
    design, functionality, and performance.
  - You have a strong command over design patterns, data
    structures, and algorithms.
  - You communicate technical ideas with ease and always look to
    collaborate to deliver high quality products.
  - Your experience will help you mentor team members, define
    our engineering standards, and drive a system design
    approach to building new services.
  - Preferred, but not required, experience on the Platform
    team’s stack: Authentication providers and protocols
    (OAuth2), Fine-Grained Authorization experience (systems
    like Auth0 FGA or Authzed),  gRPC, PostgreSQL, Redis,
    Docker, Gradle and Kubernetes. Readiness to learn this
    stack is required.

  We offer:

  - The opportunity to join a growing team of good people, where
    you can make a difference.
  - A new, high-quality code base with little technical debt and
    room to build new services and features.
  - An environment that embraces the utility of a DevOps
    oriented culture and combines it with a focus on CI/CD
    methodology.
  - A meritocratic philosophy that champions collaboration.
  - Competitive compensation, benefits, and perks.

  The Base Salary Range is $170,000 - $220,000. These ranges
  are representative of the starting base salaries for this
  role at Clear Street. Which range a candidate fits into and
  where a candidate falls in the range will be based on job
  related factors such as relevant experience, skills, and
  location. These ranges represent Base Salary only, which is
  just one element of Clear Street's total compensation. The
  ranges stated do not include other factors of total
  compensation such as bonuses or equity.

  At Clear Street, we offer competitive compensation packages,
  company equity, 401k matching, gender neutral parental
  leave, and full medical, dental and vision insurance. Our
  belief has always been that we are better as a business when
  we are all together in person. We are requiring employees to
  be in the office 4 days per week. In-office benefits include
  lunch stipends, fully stocked kitchens, happy hours, a great
  location, and amazing views.

  Our top priority is our people. We’re continuously investing
  in a culture that promotes collaboration. We help each other
  through challenges and celebrate each other's successes. We
  believe that modern workplaces succeed by virtue of having
  high-performance workforces that are diverse — in ideas, in
  cultures, and in experiences. We put in the effort to make
  such a workplace a daily reality and are proud to be an
  equal opportunity employer.

