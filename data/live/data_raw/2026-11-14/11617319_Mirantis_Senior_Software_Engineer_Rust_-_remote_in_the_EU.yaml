description: |
  Company Description

  Mirantis is the Kubernetes-native AI infrastructure company,
  enabling organizations to build and operate scalable,
  secure, and sovereign infrastructure for modern AI, machine
  learning, and data-intensive applications. By combining open
  source innovation with deep expertise in Kubernetes
  orchestration, Mirantis empowers platform engineering teams
  to deliver composable, production-ready developer platforms
  across any environment—on-premises, in the cloud, at the
  edge, or in sovereign data centers. As enterprises navigate
  the growing complexity of AI-driven workloads, Mirantis
  delivers the automation, GPU orchestration, and policy-
  driven control needed to manage infrastructure with
  confidence and agility. Committed to open standards and
  freedom from lock-in, Mirantis ensures that customers retain
  full control of their infrastructure strategy. Mirantis
  serves many of the world’s leading enterprises, including
  Adobe, DocuSign, Liberty Mutual, PayPal, Reliance Jio,
  Societe Generale, Splunk, and Volkswagen. Learn more at
  www.mirantis.com.

  Job Description

  About the Team

  Our engineering team builds next-generation, cloud-native
  bare-metal orchestration platforms for AI neo-cloud
  environments. We operate on a T-shaped engineering model:
  while each engineer brings deep expertise in a primary
  domain, every team member maintains practical fluency across
  neighboring systems. This shared foundation enables rigorous
  design reviews, effective cross-domain code reviews, and
  dependable on-call coverage. Our development is
  fundamentally based on open-source projects, and
  contributing to them is a major part of our work.

  We develop primary control plane software in Rust and Go,
  leverage Kubernetes operators, and foster an OpenTelemetry-
  first operational culture.

  Role Overview

  We are seeking a Senior Software Engineer who combines
  strong software architecture principles with understanding
  of Datacenter Networking and DPU architectures. Fitting into
  our T-shaped engineering model, you will drive the
  development of control planes powering high-density, high-
  throughput infrastructure for AI training and inference
  workloads. Familiarity with automated bare-metal
  provisioning and lifecycle management is a strong asset.

  Core Responsibilities

  - Control Plane Development: Design, build, and maintain
    production-grade control plane microservices, custom
    Kubernetes operators, and robust reconciliation engines in
    Rust and Go.
  - Architecture & API Design: Author clear Functional (FR) and
    Non-Functional Requirements (NFR), architectural specs,
    system sequence diagrams, and clean gRPC/Protobuf and REST
    API schemas.
  - Network Integration: Develop custom integration modules and
    integrations for modern network operating systems (SONiC,
    NVUE, Cumulus) and DPU hardware platforms.
  - Observability & Diagnostics: Instrument services end-to-end
    using OpenTelemetry (OTel) traces and metrics, performing
    systematic root-cause analysis across polyglot distributed
    systems.
  - Quality & Engineering Excellence: Participate in rigorous,
    review-gated pull request workflows across Rust, Go, and
    SQL codebases while ensuring high test coverage via mock-
    driven testing.

  Qualifications

  Required:

  - Bachelor’s or Master’s degree in Computer Science, Computer
    Engineering, or equivalent practical experience.
  - 5+ years of software engineering experience in cloud-native
    platforms or systems programming
  - Primary mastery of Rust (Tokio async runtime, Tonic, Axum,
    sqlx) and proficiency in Go (secondary).
  - Concurrency & Reliability: Strong background in async
    concurrency models, lock-free patterns, distributed state
    handling, and mock-driven testing discipline.
  - APIs & Serialization: gRPC/Protobuf contract design (via
    tonic/prost) and schema evolution (using zero-copy
    serialization and compile-time type generation).
  - Kubernetes Control Planes: Experience writing custom
    controllers/operators using kube-rs with CRD-driven
    reconciliation loop patterns.
  - Testing Discipline: Commitment to test-driven design,
    writing highly testable code with mock interfaces for
    external service dependencies.
  - Collaborative Architecture: Proven track record of writing
    crisp architectural specs and engaging in constructive,
    cross-functional design reviews.

  Desired:

  - Advanced SQL / PostgreSQL fluency
  - Datacenter Protocols & OS: Expertise in BGP, MP-BGP, EVPN,
    VXLAN, L3VNI, route targets, and route server design.
    Hands-on experience with SONiC, Cumulus Linux, and NVUE
    (featuring a first-class NVUE client).
  - DPU & Fabric Ecosystem: Deep knowledge of NVIDIA DOCA, Host-
    Based Networking (HBN), BlueField DPU architectures, and
    the DPF (DOCA Platform Framework) operator model (BFB,
    DPUSet, DPUNode CRDs).
  - High-Performance Interconnects: Understanding of InfiniBand
    fabrics, NVLink / NMX-M partitioning, and RoCEv2.
  - Linux Kernel Networking: Advanced grasp of Linux netlink,
    network namespaces, routing tables, and internal DHCP/DNS
    service implementations (the project ships its own
    services).
  - Cloud & Kubernetes Networking: Familiarity with CNI plugins
    (Calico, Cilium). OVS and DPDK experience is a plus.
  - Provisioning & Boot Infrastructure: Expertise in PXE/iPXE,
    UEFI, Secure Boot, measured boot, and TPM attestation.
  - Hardware Management: Proficiency in Redfish, IPMI, and BMC
    abstractions across heterogeneous hardware platforms
    (Dell, Lenovo, NVIDIA reference hardware).
  - Linux Systems Internals: In-depth knowledge of boot chains,
    systemd, initramfs, BIOS configuration matrices.
  - Identity & Security: Practical experience with PKI, X.509
    certificates, TLS, SPIFFE/SVID, Vault, KMS, Keycloak
    (OAuth2/JWT), and RBAC.
  - Virtualization: Experience with KubeVirt / KVM.
  - Kubernetes Control Planes: Experience writing custom
    controllers/operators using kube-rs or controller-runtime
    with CRD-driven reconciliation loop patterns.
  - Demonstrated participation or maintaining open-source
    systems projects

  Additional Information

  It is understood that Mirantis, Inc. may use automated
  decision-making technology (ADMT) for specific employment-
  related decisions. Opting out of ADMT use is requested for
  decisions about evaluation and review connected with the
  specific employment decision for the position applied for.
  You also have the right to appeal any decisions made by ADMT
  by sending your request to isamoylova@mirantis.com

  By submitting your resume, you consent to the processing and
  storage of your personal data in accordance with applicable
  data protection laws, for the purposes of considering your
  application for current and future job opportunities.

