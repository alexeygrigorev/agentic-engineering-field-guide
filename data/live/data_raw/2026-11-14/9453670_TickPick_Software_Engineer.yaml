description: |
  Who We Are:

  Same Seats. Better Prices.

  Among the fastest growing technology companies, TickPick is
  reshaping the secondary ticket marketplace, putting money
  back in the wallets of live event-goers. Since inception, we
  have saved our customers over $55 million in service fees.
  Our BestPrice Guarantee backs up our promise to deliver
  better prices than our competition.

  For the last five years, TickPick has been named a Deloitte
  Technology Fast 500 award winner and has landed on lists of
  Inc. 5000's and Crain's New York Business' Fast 50.

  If you are passionate about concerts, sports, or theater,
  and want to see your skills and experience have a direct
  impact on a fast growing company, TickPick is the place for
  you. We are building a lean, high-output engineering team
  committed to providing the most innovative, transparent, and
  cost-effective ticket marketplace in the industry.

  Who You Are:

  As a Software Engineer, you are early in your career but
  already know how to build. You learn quickly, take
  ownership, and want your work to matter. You are excited by
  the idea of contributing across the full stack — API, web,
  and mobile — instead of being boxed into one narrow lane.

  You are comfortable using AI coding agents as part of how
  you build software. You've used them to help write code,
  explore problems, and learn faster — whether on personal
  projects, school work, or early jobs. You're starting to
  develop a sense for when they accelerate your work and when
  you need to think for yourself.

  You are comfortable working ambiguously defined problem
  spaces, and you are a curious and creative problem solver
  who uses AI tooling to ramp faster, automate repetitive
  work, and contribute beyond what entry-level engineers were
  historically able to do.

  What You'll Do:

  - Contribute across the entire stack — .NET APIs,
    React/Next.js web, and React Native mobile
  - Use AI coding agents daily to help with implementation,
    debugging, code review, and learning new parts of the
    codebase
  - Pair with senior engineers and AI agents to solve problems
    that would traditionally require much more experience
  - Help build and improve agentic workflows — testing loops,
    code review pipelines, and internal automation that reduce
    manual overhead
  - Design and develop new APIs and product features
  - Create integrations to third party providers (e.g. fintech,
    ticket brokers, primary marketplaces) in order to offer
    more services to our users
  - Explore ways to make the user experience more personalized
    (event notifications, recommendations, pricing alerts,
    etc.)
  - Identify tedious engineering tasks and help automate them so
    the team can focus on higher-impact work
  - Use data to help drive decisions in our business logic

  Tools You'll Use:

  - Languages: C#/.NET, TypeScript/Node.js, React/React Native
  - Datastores: Azure SQL, Azure Service Bus, Azure Storage,
    Azure Cosmos DB
  - AI: Claude Code, Codex, and other coding agents as part of
    daily workflow
  - IDE: Visual Studio, VSCode, Cursor
  - Infrastructure: Azure Cloud Platform (App Service,
    Functions, Service Bus)

  What Sets You Apart:

  - You've used AI agents for more than just autocomplete —
    you've experimented with using them to explore codebases,
    generate tests, or work through unfamiliar problems
  - You learn unfamiliar codebases quickly and use AI tools to
    close gaps fast
  - You don't wait to be spoon-fed tasks — you notice problems,
    ask good questions, and start solving them
  - You're comfortable being early in your career but operating
    with a high degree of ownership
  - You care more about building useful things than collecting
    credentials

  Diversity at TickPick:

  At TickPick, we know that diversity of all types, in an
  environment that pursues equity and inclusion, strengthens
  our organization's culture. When our employees are
  representative of the communities we serve, with diversity
  in demographics and a broad set of backgrounds, we provide a
  superior experience for both our customers and our
  employees. Fostering an open and supportive environment
  where our employees are empowered and encouraged to bring
  their whole selves to the table enables TickPick to thrive.

  TickPick, LLC is proud to be an equal opportunity employer
  open to all qualified candidates regardless of race, color,
  religion, national origin, gender, sexual orientation,
  gender identity or expression, age, mental or physical
  disability, marital status, citizenship status, military
  status, protected veteran status or any other category
  protected by law.

  Salary Range:

  $100,000 to $130,000

  Requirements

  - 0-3 years of professional software engineering experience,
    or equivalent experience through internships, open source
    work, freelance work, or substantial personal projects
  - Strong in at least one of C#/.NET, TypeScript/Node.js, or
    React — and excited to work across the stack with the help
    of AI agents
  - You've used AI coding agents in your workflow and can talk
    about how they've helped you build or learn
  - You've shipped something real - a product, side project,
    internship work, open source contribution, or anything
    else that demonstrates you can turn ideas into working
    software
  - Experience with relational databases (SQL Server or
    PostgreSQL) is a plus
  - Azure Cloud Platform experience is a plus

  Benefits

  - Health Care Plan (Medical, Dental & Vision)
  - Retirement Plan (401k, IRA)
  - Life Insurance (Basic, Voluntary & AD&D)
  - Paid Time Off (Vacation, Sick & Public Holidays)
  - Family Leave (Maternity, Paternity)
  - Training & Development
  - Employee Outings
  - Free Lunch & Snacks
