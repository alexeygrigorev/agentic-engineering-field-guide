description: |
  Who we areAbout Stripe

  Stripe, LLC. is a financial infrastructure platform for
  businesses. Millions of companies - from the world’s largest
  enterprises to the most ambitious startups - use Stripe to
  accept payments, grow their revenue, and accelerate new
  business opportunities. Our mission is to increase the GDP
  of the internet, and we have a staggering amount of work
  ahead. That means you have an unprecedented opportunity to
  put the global economy within everyone's reach while doing
  the most important work of your career.

  What you’ll doResponsibilities

  - Scope, design, build, and maintain APIs, services, and
    large-scale systems that reliably and efficiently handle
    billions of money movement requests.
  - Debug and solve critical production issues across services
    and multiple levels of the stack.
  - Collaborate with stakeholders across the company to build
    new features at large scale while improving internal
    engineering standards, tooling, and processes.
  - Extend balance management platform and build out new fund
    accessibility platforms leveraged by enterprises and SMBs.
  - Collaborate cross-functionally across infrastructure and
    product teams to deliver innovative solutions that address
    evolving user needs.

  Who you areMinimum requirements

  Must have a Bachelor's degree or foreign equivalent in
  Engineering, Computer Science, Mathematics, or a related
  field, plus five (5) years of progressive, post-
  baccalaureate related work experience in software
  engineering.

  Must also have five (5) years of experience in each of the
  following:

  - Large-scale financial tracking systems;
  - Cloud-based services including: gRPC, GraphQL,
    Docker/Kubernetes, or AWS;
  - Design, development, and operation of mission-critical gRPC
    services; and
  - Software Architecture and system design,
    debugging/troubleshooting, and API development and design.

  Must have one (1) year of experience in the following:

  - Design, development, and operation of public web APIs.

  Salary: $193,461 - $285,600/yr.

  This salary range represents the base salary range for the
  role and any sales commissions/sales bonuses targets, if
  applicable, would be in addition to the base salary.

  40 hrs/week

  50% Telecommuting permitted.

  Multiple Positions Available.

  Additional benefits for this role may include: equity,
  company bonus or sales commissions/bonuses; 401(k) plan;
  medical, dental, and vision benefits; and wellness stipends.
