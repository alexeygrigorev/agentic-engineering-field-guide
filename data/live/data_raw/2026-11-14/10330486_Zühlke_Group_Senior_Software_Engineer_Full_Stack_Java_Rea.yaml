title: "Senior Software Engineer (Full Stack) — Java & React"
company: Zühlke Group
location: London, GBR
work_type: FULL_TIME
company_size: 1,627 Employees
description: |
  Founded in Switzerland in 1968, Zühlke is owned by its
  partners and located across Europe and Asia. We are a global
  transformation partner, with engineering and innovation in
  our DNA. We're trusted to help clients envision and build
  their businesses for the future – to run smarter today while
  adapting for tomorrow’s markets, customers, and communities.
  Our multidisciplinary teams specialise in tech strategy and
  business innovation, digital solutions and applications, and
  device and systems engineering. We excel in complex,
  regulated spaces including health and finance, connecting
  strategy, tech implementation, and operational services to
  help clients become more effective, resilient businesses.



  If you share our values and want to do the best work, for
  the right reasons, we can offer you the chance to do it on a
  global scale and play a real role in shaping our exciting
  journey.

  The role


  As a Senior Software Engineer, you will be a hands-on member
  of a high-performing engineering squad, building and
  operating business-critical digital services.


  This is a backend-led full-stack role. You will use Kotlin
  or modern Java, ideally Java 17 or later, together with the
  wider JVM ecosystem, to develop reliable services and APIs.
  You will also contribute to modern web interfaces using
  technologies such as React and TypeScript.

  You will work in an increasingly AI-augmented engineering
  environment. We are looking for people who are curious about
  AI-augmented engineering and willing to experiment with
  tools that improve software delivery. You will not be
  expected to use AI tools every day, but you should be open
  to applying them where they provide clear value, while
  validating outputs for correctness, security and
  maintainability.


  Working closely with product managers, designers, engineers,
  and architects, you will turn product requirements into
  well-structured, maintainable, production-ready solutions.
  You will contribute throughout the delivery lifecycle—from
  technical discovery and implementation through to
  deployment, production support and continuous improvement.

  You will take ownership of significant features and
  services, contribute to technical decisions, support other
  engineers and help maintain high standards of engineering
  quality.


  How you will make an impact

  - Build and maintain reliable JVM-based services using Kotlin
    or modern Java.

  - Design and develop APIs and integrations following industry
    standards.

  - Contribute to API design standards and documentation.

  - Deliver complete end-to-end features by connecting backend
    services and data with responsive web interfaces.

  - Use appropriate test-first and test-informed practices to
    create effective automated tests.

  - Experiment with AI-assisted engineering tools where they
    provide clear value, such as exploring solutions,
    improving tests, documenting systems or investigating
    issues.

  - Validate AI-assisted outputs for correctness, security,
    maintainability, and suitability before using them.

  - Contribute to event-driven workflows and asynchronous
    processing.

  - Participate in technical discovery, spikes, architecture
    discussions and peer code reviews.

  - Improve build, test and deployment pipelines to support safe
    and efficient delivery.

  - Embed structured logging, metrics and distributed tracing to
    make services easier to operate and troubleshoot.

  - Consider the operational, security and governance
    implications of engineering decisions, particularly in
    complex or regulated environments.

  - Identify and address technical debt, performance issues and
    reliability risks.

  - Share knowledge, support collective code ownership and
    contribute to a collaborative, low-ego team culture.

  What's important to us

  - Strong commercial experience developing server-side
    applications with Kotlin or modern Java, ideally Java 17
    or later.

  - Good knowledge of the JVM ecosystem and common backend
    development practices.

  - Experience designing, building and operating APIs.

  - Understanding of service reliability, maintainability,
    performance and security.

  - Proven experience writing effective automated tests.

  - Practical experience with relational databases.

  - Experience with modern frontend development, ideally using
    React and TypeScript.

  - Familiarity with CI/CD practices and supporting software in
    production.

  - Experience working collaboratively in an agile, product-
    focused engineering team.

  - Curiosity about AI-augmented engineering and a willingness
    to develop new ways of working.

  - A thoughtful approach to code quality, technical trade-offs
    and continuous improvement.

  Desirable experience

  - Practical experience using AI-assisted development or
    productivity tools in a software engineering context.

  - Familiarity with asynchronous & event-driven architectures.

  - Experience with frameworks such as Spring Boot, Quarkus,
    Micronaut or Ktor.

  - Cloud platforms such as AWS, Azure or GCP.

  - Developing with containers

  - Understanding the difference between relational, NoSQL and
    other persistence technologies.

  - Experience building shared platforms, common services or
    greenfield technical foundations.

  - Building APIs adhering to design principles such as RESTful
    API design

  - Building observable systems

  - Experience in regulated or financial-services environments.

  - Exposure to payments, transaction processing or other
    business domains.

  - Equivalent experience with comparable technologies will be
    considered.

  What success looks like

  In this role, you will:

  - deliver valuable, production-ready features with the squad;

  - build services and APIs that are reliable, reusable and easy
    for others to consume;

  - improve the reliability, performance and operability of the
    services you work on;

  - use emerging engineering tools thoughtfully and responsibly
    where they add value;

  - contribute constructively to technical decisions, API
    standards and code reviews;

  - help the team release software safely and efficiently; and

  - support a culture of learning, collaboration and shared
    responsibility.

  Working environment

  You will work as part of a cross-functional engineering
  squad alongside product, design and delivery colleagues. The
  role is expected to remain substantially hands-on, with
  opportunities to influence technical direction and support
  the development of other engineers.

  The role may include working on-site with clients,
  collaborating directly with client stakeholders and delivery
  teams to understand their needs, shape technical solutions
  and support successful delivery. This may involve occasional
  travel or agreed on-site working, depending on the project
  and client requirements.


  What we offer

  - Work life blend: we offer a safe & healthy workplace, with
    flexible working hours and the possibility to work from
    home
  - Profit share scheme: In addition to your annual salary, you
    may receive a profit share defined by the company’s
    success in the previous year
  - Global and Diverse Zühlke community: witness how colleagues
    from all our 16 offices across the globe come together to
    create a unique, positive and inclusive work culture,
    learning from one another at annual team camps, and
    celebrating year-end parties and other local festivities.
  - Committed to development: we are committed to the growth of
    our people and are investing in your development. We’re
    empowering you to build the skills you need to make a
    positive impact, both personally and for our clients,
    today and in the future.

  To dive deeper into local benefits of working in Zühlke
  follow the link

  How to Apply


  Important* To ensure a smooth review process, please submit
  all application documents (CV, cover letter) in English
  only.

  AI can help you with your application, but please don't let
  it do all the talking. We want to understand your
  experience, your skills and what aligns you to the role. We
  don't use keyword scanning software, your CV is reviewed by
  real people, so make sure your application reflects you, not
  just an AI-generated CV.




  If you feel you don't meet all the requirements, we are
  still happy to get to know you, learn more about your
  ambitions and ideas and look forward to receiving your
  application!

  We welcome people from all backgrounds, regardless of their
  gender, personality, national origin, race, religion,
  colour, sexual orientation, gender identity, age, marital
  status, disability or veteran status.
