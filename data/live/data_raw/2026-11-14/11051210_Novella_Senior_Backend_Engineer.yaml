description: |
  Novella is building AI to protect the largest, most
  complicated assets in the world. Whether it's a rocket going
  to space or a skyscraper on the coast, Novella is building
  the first AI powered specialty insurance brokerage.

  The Role

  We're looking for a Senior Backend Engineer to join our
  team. In your day-to-day work, you'll be responsible for
  building all aspects of our product, from discussing big
  ideas to debugging production issues. As one of our first 15
  hires, you'll also help establish a strong engineering
  culture and take on a leadership role as the company grows.

  The Day to Day

  - Design and develop AI driven application on modern
    technology stack.
  - Research and use AI tools in your line of work.
  - Collaborate closely with the founders and product team to
    define and implement our technical vision.

  What We're Looking For

  - A true Senior Engineer with a minimum of 5 years of
    experience.
  - Excited about the challenge of building a new business from
    scratch, not just writing more code.
  - Excited to use generative AI tools in day-to-day work and
    adapt as the tools and best practices change.
  - Our backend stack right now:
    - Node, TypeScript, PostgreSQL, Redis, AWS, Docker, GitHub,
      and GitHub Actions.
