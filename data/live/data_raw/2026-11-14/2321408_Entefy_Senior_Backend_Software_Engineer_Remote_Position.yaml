description: |
  There are few tech jobs where your code contributions can
  directly improve the way businesses operate. Work with
  Entefy to solve some of the biggest challenges at the
  rapidly evolving intersection of software and advanced
  machine intelligence. Can you succeed in a fast-paced
  environment that prizes (and requires) motivation, vision,
  and technical chops? At Entefy, you won’t be just a coder
  but a key contributor in building highly impactful products.

  Skills and Experience:

  Entefy is not your typical company; it’s a mission. The next
  phase of technology will be defined by advanced computing,
  machine intelligence, and hyperautomation. So, if you’re
  passionate about the future of technology and the many ways
  it can power and improve society, and can demonstrate the
  right set of software engineering skills to effectively
  develop robust and scalable applications, then you’ve earned
  yourself an interview with our team. The ideal candidate for
  this role possesses:

  Requirements:

  - Minimum 6 years of demonstrable experience building
    intricate backend systems
  - Solid SQL and noSQL database experience (Postgres, MongoDB,
    and Elasticsearch are desired)
  - Advanced knowledge of system architecture and database
    design
  - Demonstrable problem-solving ability
  - Ability to quickly learn complex systems and new
    technologies
  - Know-how dealing with building and maintaining complex
    event-driven systems (i.e. Kafka) with high availability
  - Strong knowledge of Node.js
  - Ability to build highly performant microservices and APIs to
    power data visualizations
  - Experience dealing with scalability requirements and
    performance improvements
  - Ability to collaborate well with others
  - Strong communication skills
  - Prior experience with Continuous Integration and test-driven
    development
  - Proficiency in Docker and container orchestration tools

  Other Qualifications:

  - Full stack experience is a plus
  - Experience with graph databases is a plus
  - Startup experience is a plus

  Visit www.entefy.com and www.entefy.com/blog
