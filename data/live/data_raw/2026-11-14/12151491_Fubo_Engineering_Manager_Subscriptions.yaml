title: Engineering Manager, Subscriptions
company: Fubo
location: New York, USA
work_type: FULL_TIME
company_size: 575 Employees
description: |
  About Fubo:

  FuboTV Inc. is a consumer-first live TV streaming company
  that is defining the future of TV.

  Ranked among Fast Company’s Most Innovative Companies (2026)
  and the Financial Times’ The Americas’ Fastest-Growing
  Companies (2026, 2025), FuboTV owns Hulu + Live TV
  (entertainment), Fubo (sports) and Molotov (entertainment
  and sports), which stream in markets around the globe.

  Our Mission:

  Our mission is to deliver premium sports, news and
  entertainment programming through a best-in-class user
  experience that offers greater choice, flexibility and
  value.

  About the Role:

  *This role is a New York City based HYBRID position.
  Candidates must be located in NYC, and willing to come into
  the office on a hybrid basis, four times a week (Monday,
  Tuesday, Wednesday, Thursday).*

  As an Engineering Manager, you will lead the US part of
  Fubo’s subscription engineering team, the group that owns
  the purchase and subscription management flows across our
  microservices architecture. These services sit first in line
  for revenue, so they need to be reliable, scalable, and
  efficient. You will work in tandem with the engineering
  manager in France, who leads the team’s French engineers, to
  set one technical vision and one roadmap for the whole team.
  This is a hands-on role: you will design, code, and review
  alongside your engineers, and you will be the voice of
  Engineering for subscriptions with Product, Business
  Development, Finance, and executive leadership. You will
  report to a VP of Engineering in New York.

  Responsibilities:

  - Own the success and long-term vision of Fubo’s commerce
    platform by designing APIs that interconnects with our
    vendor partners and expose data to our internal services
  - Be the voice of Engineering in conversations with internal
    stakeholders (Product, Marketing, Business Development, …)
    up to C-levels or external partners/vendors.
  - Define and defend a roadmap for the team based on the input
    of multiple stakeholders
  - Prioritize work for your team, ensuring on-time deliverables
    and high-quality software.
  - Provide hands-on technical leadership through system design,
    coding, code review, and mentorship
  - Own the health, reliability, and performance of the systems
    your team builds
  - Fubo is investing heavily in AI to optimize its software
    development process. We expect you to be hands-on and
    proactively discover new ways AI tools and new processes
    can improve speed and quality for you, your team, and the
    org
  - Lead recruiting, interviewing, hiring, and onboarding in
    partnership with Talent Acquisition

  Requirements:

  - 8+ years experience as a software engineer and 5+ years
    leading medium to large software engineering teams
  - Proven experience building large-scale distributed systems
    with SOA or microservices architecture, preferably with
    Golang
  - Experience with distributed transactions, caching, circuit-
    breaking, load testing, and generally speaking making
    large micro-services systems reliable and scalable.
  - Experience in a CI/CD environment, and with test automation
    strategies
  - Experience with relational databases
  - Experience with monitoring and observability tools
  - Strong verbal and written communication
  - A self-driven, proactive, and curious team player with the
    ability to collaborate cross functionally with many
    different teams, with a focus on win-win solutions

  Our tech stack:

  - Go/Golang
  - Docker and Kubernetes
  - Google Cloud Platform
  - Datadog

  Perks & Benefits:

  - At Fubo, you will have the opportunity to personally
    influence what live media looks like after it goes through
    its next big transformation
  - Fubo provides a highly competitive compensation based on
    experience and market standards
  - Robust benefit package including Health/Dental/Vision
    coverage 401k, Life Insurance, and commuter benefits
  - Free Premium Fubo Account
  - Unlimited PTO days and regular company-wide activities
  - Fubo's main headquarters are located in Midtown Manhattan,
    with offices in Paris, and Bangalore
  - Fubo is an e-verified company

  Fubo’s minimum base salary for this role if hired in New
  York City is $200,000 per year; maximum base salary for this
  role is $250,000 per year. Additionally, this role is
  eligible to participate in Fubo's equity plan, annual cash
  bonus plans, unlimited PTO, and a full range of medical
  benefits. The final offer amount will be at the company’s
  sole discretion and determined by multiple factors,
  including years and depth of experience and expertise,
  location and other business considerations.
