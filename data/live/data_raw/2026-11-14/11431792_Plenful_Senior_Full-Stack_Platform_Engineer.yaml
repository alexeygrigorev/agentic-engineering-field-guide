description: |
  About Plenful

  Plenful is on a mission to transform healthcare operations
  from the inside out. Fresh off our $50M Series B and backed
  by Notable Capital, Bessemer Venture Partners, TQ Ventures,
  Susa/Kivu Ventures, and other leading investors, we’re
  building the category-defining AI automation platform that
  healthcare teams rely on to operate smarter, faster, and
  more efficiently. Our technology empowers healthcare
  operators across hospital and health systems, pharmacies and
  payors to eliminate manual work, reduce administrative
  burden, and improve compliance, all while unlocking critical
  revenue to fund programs for their in-need patient
  populations.

  Built by healthcare operators for healthcare operators,
  Plenful is driven by a deep understanding of the challenges
  facing today’s care teams. We’re passionate about equipping
  healthcare workers with world-class tools that deliver real,
  measurable impact, and we’re proud to serve 100+ leading
  health systems, pharmacies, and healthcare organizations
  across the country. If you’re excited to help shape the
  future of healthcare, we’d love to meet you. Apply now to
  join our growing team.

  What you’ll do

  - Build, and operate platform services and APIs in Python and
    FastAPI that power complex healthcare workflows.
  - Build end-to-end features across backend systems and user-
    facing applications using JavaScript, TypeScript, and
    React.
  - Model data and integrate internal and external systems with
    attention to correctness, security, and maintainability.
  - Improve reliability, observability, performance, and
    developer workflows as the platform and customer base
    grow.
  - Partner with product, design, and other engineers to
    translate ambiguous requirements into pragmatic technical
    solutions.
  - Review designs and code, mentor teammates, and help shape
    engineering practices across the platform.

  What you’ll bringMinimum qualifications

  - 7+ years of professional software engineering experience
    delivering production applications across the stack.
  - Strong, hands-on experience with Python, FastAPI,
    JavaScript, TypeScript, and React.
  - Depth in backend design, including API design, data
    modeling, integrations, and operating services in
    production.
  - Experience building frontend features and collaborating on
    usable, accessible product experiences.
  - Ability to own projects from design through launch,
    communicate tradeoffs clearly, and raise the quality of a
    team’s work.

  Preferred qualifications

  - Experience building platforms for complex, configurable
    workflows or data-intensive products.
  - Experience working at a health tech startup or with
    healthcare data and integrations.
  - Familiarity with FHIR and HL7.

  Location: Candidates must be based in the San Francisco or
  Seattle area. The San Francisco role requires working in the
  office two days per week.

  Why You'll Love Working Here

  - 🚀 Mission-Driven, World-Class Team — Join an exceptional
    group of professionals aligned around a meaningful mission
    and committed to making an impact
  - 📈 Opportunities for Growth — Strengthen your expertise
    through collaboration with experienced, high-performing
    leaders across the organization
  - 🏢 Flexible Hybrid Work Environment — We're remote-first,
    with meaningful office presence in San Francisco and New
    York. R&D roles follow a hybrid model, with two days per
    week in our San Francisco office

  Benefits & Perks

  - 🏥 Healthcare Coverage — Full medical, dental, and vision
    insurance for you and participation for your family
  - 💰 401(k) with Company Match — Plenful matches 50% of your
    first 3% contributed
  - 📊 Equity — Every full-time employee shares in our success
  - 🌴 Unlimited PTO — Take the time you need, when you need it
  - 🍽️ Daily Lunch Stipend — $100/week to cover your midday
    meals
  - 💪 Wellness Stipend — $100/month to support your health and
    well-being
  - 🚇 Commuter Benefits — $100/month for SF and NYC-based
    employees
  - 👶 Parental Leave — Paid leave to support growing families

  Compensation

  The compensation range for this position reflects the
  average span for this role. Where an offer lands depends on
  your experience, qualifications, and interview performance,
  measured against Plenful’s internal leveling guidelines and
  market benchmarks. We set offers individually.

  This role is also eligible to participate in Plenful’s
  equity plan, subject to the terms of the applicable plans
  and policies.
