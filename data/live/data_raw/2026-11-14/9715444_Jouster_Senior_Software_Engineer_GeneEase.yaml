description: |
  GeneEase is a stealth-mode biotech startup building next-
  generation gene therapy solutions for subclinical health
  issues — beginning with overlooked and under-researched
  autoimmune responses, such as alcohol intolerance and other
  subtle immune dysregulations. We believe that personalized,
  precision medicine powered by AI can unlock treatments for
  millions who fall through the cracks of traditional
  diagnostics.

  We’re seeking a Senior Full-Stack Software Engineer to help
  us build our first product — a data-driven diagnostic and
  personalization platform that leverages AI and genetic data.
  This is a foundational role where you’ll shape both the
  technology and the culture of the company alongside a small,
  fast-moving team.

  🔧 What You’ll Do

  - Build core components of GeneEase’s diagnostic platform —
    from backend data pipelines to clean, usable frontends.
  - Design and implement services that support genomic data
    ingestion, AI-driven insights, and personalized treatment
    recommendations.
  - Collaborate closely with the Product Manager and fellow
    engineers to iterate quickly on prototypes and MVP
    features.
  - Work hands-on with ML engineers to integrate models into the
    product stack.
  - Contribute to architectural decisions that balance speed,
    reliability, and scalability.
  - Help build cloud infrastructure (e.g., AWS, GCP, or similar)
    to support development and deployment of AI-powered
    features.
  - Create and maintain APIs and internal tools that support
    both user-facing and data-science workflows.

  ✅ You Might Be a Fit If You Have

  - 5+ years of software engineering experience, ideally in
    fast-paced or startup environments.
  - Full-stack experience across backend, frontend, and cloud
    (exact stack is flexible).
  - Experience with ML/AI model integration — working alongside
    data scientists or ML engineers.
  - Strong background in APIs, data pipelines, and cloud
    infrastructure.
  - Ability to take ownership of complex problems and turn them
    into clean, maintainable systems.
  - Excitement about working in early-stage environments with
    high autonomy and ambiguity.

  ⭐️ Bonus Points For

  - Prior experience working in health tech, bioinformatics, or
    diagnostics.
  - Familiarity with genomics data formats (e.g., FASTA, VCF) or
    cloud-based ML workflows.
  - Experience building products from zero-to-one — including
    greenfield architecture.

  🌱 Why Join GeneEase?

  - Help launch a first-of-its-kind diagnostic platform at the
    intersection of AI and gene therapy.
  - Work closely with a world-class early team on meaningful,
    deeply technical challenges.
  - Fully remote, async-friendly, and highly collaborative.
  - A fast-moving, product-first culture that values speed,
    integrity, and scientific rigor.
