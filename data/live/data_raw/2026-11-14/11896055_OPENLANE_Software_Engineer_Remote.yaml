description: |
  Who We Are:

  At OPENLANE we make wholesale easy so our customers can be
  more successful.

  We’re a technology company building the world’s most
  advanced—and uncomplicated—digital marketplace for used
  vehicles.

  We’re a data company helping customers buy and sell smarter
  with clear, actionable insights they can understand and use.

  And we’re an innovation company accelerating the future of
  wholesale remarketing through curiosity, collaboration, and
  an entrepreneurial spirit.

  Our Values:

  Driven Waybuilders. We pursue challenges that inspire us to
  build, create, and innovate.

  Relentless Curiosity. We seek to understand and improve our
  customers’ experience.

  Smart Risk-Taking. We transform risk into progress through
  data, experience, and intuition.

  Fearless Ownership. We deliver what we promise and learn
  along the way.


  About Our Candidate:

  We are seeking a talented full-time Full Stack Software
  Engineer to join our agile engineering team. You will help
  design, build, and maintain backend systems using PHP and
  Node.js, developing containerized microservices on AWS-
  hosted Kubernetes (EKS). This hands-on role involves working
  with SQL databases, managing application dependencies, and
  improving development environments and release workflows.
  You should be comfortable troubleshooting across the
  application stack and taking services from development
  through production, with an emphasis on reliability,
  performance, and clean, maintainable code.

  You Are:

  - AI-forward. You already use AI tools to enhance development
    speed, quality, and efficiency, and you continuously adapt
    as tooling evolves.
  - Product-minded. You think beyond code and understand how
    technical decisions impact customers and business
    outcomes.
  - Ownership-driven. You take responsibility for systems end-
    to-end, including reliability and operational health.
  - Technically curious. You enjoy learning new technologies and
    thoughtfully evaluating emerging approaches.
  - Quality-focused. You value clean, maintainable code, strong
    testing practices, and production-ready engineering
    standards.

  You Will:

  - Provide technical guidance to the application development
    team.
  - Collaborate with stakeholders, including project managers,
    product owners, to understand requirements and translate
    them into technical solutions.
  - Design, develop, and maintain high-quality software
    solutions using object-oriented programming languages and
    frameworks.
  - Conduct code reviews, identify areas for improvement, and
    ensure adherence to coding standards and best practices.
  - Participate in the full software development lifecycle,
    including requirements gathering, design, implementation,
    testing, deployment, and maintenance.
  - Conduct automated testing (Unit, Integration, and End-to-
    End)
  - Strong problem-solving skills and creativity with a desire
    to learn new emerging technologies.

  Who You Will Work With:

  - Reporting to the Engineering Manager, this role will
    collaborate with the development team, devops teams,
    project managers, and product owners on a regular basis.

  - Additionally, you may have exposure to stakeholders from
    other departments, such as QA, and data engineering.

  Must-Have's:

  - Bachelor's degree in Computer Science or equivalent
    experience in a related technical field involving coding.
  - 3–5+ years of professional software development experience.
  - Constant desire to learn new technology and best practices,
    we work in various stacks and don’t expect everyone to
    come in knowing everything.
  - Develop high-quality code to build solutions in an agile
    development environment.
  - Participate in code reviews, planning and estimation
    meetings.
  - Test solutions and troubleshoot issues.
  - Engage in cross-discipline collaboration with team members
    including the product owners, designers, and testers.

  Nice to Have's:

  - Experience with PHP (Laravel), Node.js, JavaScript,
    TypeScript, or Vue.js.
  - Familiarity with HTML/CSS and frameworks such as Bootstrap
    or Tailwind.
  - Experience developing and integrating REST/JSON APIs and
    working with SOAP services.
  - Working knowledge of Go or Java.
  - Experience with MySQL, MS SQL, or NoSQL databases, including
    query troubleshooting and optimization.
  - Familiarity with automated unit, integration, and functional
    testing.
  - Experience building and troubleshooting containerized
    applications using Docker and Kubernetes.
  - Familiarity with CI/CD pipelines and YAML-based application
    configuration.
  - Understanding of microservices architecture, service
    dependencies, and configuring local development and test
    environments.
  - Experience deploying and supporting applications on AWS,
    particularly EKS, with exposure to GCP or Azure.
  - Familiarity with agile delivery and collaborating across
    development, testing, and production releases.

  Qualified candidates must be legally authorized to be
  employed in the United States. OPENLANE will not provide
  nonimmigrant or immigrant visa sponsorship for this
  employment position.

  What We Offer:

  - Competitive pay
  - Medical, dental, and vision benefits with employer HSA
    contributions (US) and FSA options (US)
  - Immediately vested 401K (US) or RRSP (Canada) with company
    match
  - Paid Vacation, Personal, and Sick Time
  - Paid maternity and paternity leave (US)
  - Employer-paid short-term disability, long-term disability,
    life insurance, and AD&D (US)
  - Robust Employee Assistance Program
  - Employer paid Leap into Service Day to volunteer
  - Tuition Reimbursement for eligible programs
  - Opportunities to expand your skill set and share your
    knowledge across a publicly traded, global organization
  - Company culture of internal promotions, diverse career
    paths, and meaningful advancement

  Sound like a match? Apply Now - We can't wait to hear from
  you!


  Compensation Range of

  Annual Salary: $90,000.00 - $125,000.00 USD

  (Depending on experience, skill set, qualifications, and
  other relevant factors.)
