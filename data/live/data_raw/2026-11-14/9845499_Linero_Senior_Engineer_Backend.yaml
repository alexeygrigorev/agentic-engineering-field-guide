description: |
  About Linero

  Linero is building the operational infrastructure that
  ensures the world's most sensitive technologies reach the
  right hands, and never the wrong ones.

  Our customers include some of the most consequential
  companies in the world: leading AI labs, aerospace and
  defense primes, semiconductor giants, quantum computing
  pioneers, and companies pushing the frontier in chemicals,
  advanced manufacturing, and robotics.

  We are an AI-native, venture-backed company creating a new
  category of software at the intersection of national
  security, industrial infrastructure, and enterprise AI.



  The Role

  As a Senior Engineer, Backend, you will own significant
  pieces of the core infrastructure: designing and shipping
  systems that power deep enterprise integrations, complex
  data workflows, and a product that operates under the most
  stringent security requirements in the industry.

  This is a high-ownership role. You will drive significant
  architectural decisions, influence platform choices that
  will shape how Linero scales, and work closely with the
  founding engineering team to shape the architecture and
  trajectory of the product.

  What You'll Own

  - Design, build, and maintain core backend services and APIs
    that power Linero's platform at scale
  - Contribute to the design and implementation of multi-tenant
    architecture with strict data isolation requirements
  - Build scalable, high-performance data pipelines that operate
    reliably under demanding latency and volume requirements
  - Collaborate closely with AI/ML, infrastructure, and frontend
    teams to ship cohesive, production-grade product
  - Establish backend engineering standards: code quality,
    testing practices, and deployment patterns that the team
    can build on
  - Participate in code reviews, architectural discussions, and
    the continuous raising of engineering standards across the
    team

  What we're looking for

  - 5+ years of backend engineering experience with a proven
    track record of designing and shipping complex, high-scale
    systems
  - Demonstrated experience with software architecture; you have
    designed systems, not just built to spec, and you can
    articulate the trade-offs behind your decisions
  - Deep proficiency in at least one backend language: Python,
    Go, or Java preferred
  - Strong experience with API design, distributed systems, and
    data modeling, including multi-tenant SaaS architectures
    with strict data isolation requirements
  - Experience building enterprise integrations across
    heterogeneous systems - ERPs, SaaS platforms, or internal
    tooling - with fluency in enterprise integration patterns
  - Familiarity with zero-trust security models and experience
    operating in high-security or regulated environments
  - You take ownership seriously; you don't wait to be told what
    needs fixing
  - Based in or willing to relocate to New York City

  What we offer

  - Competitive compensation commensurate with experience
  - Meaningful equity in a company at an early and critical
    stage of growth
  - Comprehensive benefits including health, dental, and vision
  - The opportunity to shape the core architecture of one of the
    most consequential platforms being built today
  - Direct access to leadership and genuine influence over how
    Linero is built

  Equal Opportunity & Eligibility

  - Linero is an equal opportunity employer. We do not
    discriminate on the basis of race, religion, color,
    national origin, gender, sexual orientation, age, marital
    status, veteran status, or disability status.
  - This role requires access to export-controlled information,
    as a result, applicants must be U.S. persons (citizens,
    lawful permanent residents, refugees, or asylees) as
    defined under applicable U.S. law.
  - Start date is immediate, with flexibility for the right
    candidate. If you are not based in New York, we can
    accommodate remote work for an initial period and offer
    relocation assistance on a case-by-case basis.
