description: |
  Company Description Since its creation in 2007 in the
  financial city of Frankfurt am Main, Solactive AG has grown
  to one of the key players in the indexing space. The German
  multi-asset index provider focusses on tailor-made indices,
  offering to its clients a faster service, with greater
  flexibility and at a reasonable cost. Solactive AG and its
  subsidiaries have become one of the fastest growing index
  providers over the past few years and support the leading
  investment banks and asset managers across the globe. We
  have gained global recognition for our role in the Exchange
  Traded Fund (ETF) industry, where we rank among the top
  providers worldwide for underlying indices. We also excel in
  diverse areas such as Structured Products and investment
  mandates, showcasing the wide range of our capabilities. The
  impact and value we bring to the market is palpable, but
  also in the reputation we have proudly built by being close
  to our customers, solidifying Solactive AG as a trusted and
  reliable ally in the ever-evolving global financial
  landscape. Job Overview Do you think in systems and lead by
  doing? At Solactive, we are looking for a Staff Engineer to
  drive the technical direction and architectural evolution of
  our Index Setup platform, building scalable, maintainable,
  and secure solutions. If you thrive on leading complex
  initiatives and shaping engineering excellence, we'd love to
  hear from you. Your Tasks * Own the technical direction and
  architectural evolution of the domain, delivering scalable,
  maintainable, and secure solutions for index management and
  future platform capabilities. * Lead complex initiatives
  end-to-end: clarify ambiguous requirements, shape solution
  approaches, and drive implementation across backend,
  frontend, data, and infrastructure. * Raise engineering
  standards through hands-on leadership, including code and
  design reviews, coaching, and a strong focus on simplicity,
  quality, and maintainability. * Partner with product,
  business stakeholders, and engineering teams to identify
  core problems, challenge assumptions, and deliver solutions
  aligned with the platform vision. * Drive system design
  across distributed services, APIs, integrations, data
  models, and cloud infrastructure, ensuring scalability,
  reliability, and operational readiness. * Improve
  engineering effectiveness by refining processes, reducing
  friction, strengthening ownership, and enabling better
  trade-offs between speed, quality, and risk. * Mentor
  engineers and support their growth in technical depth,
  ownership, and end-to-end delivery. Your Profile * Strong
  hands-on software engineering background (7+ years) with
  deep expertise in Java and Spring-based backend development
  in distributed systems. * Experience with React / TypeScript
  frontend development in product teams owning full-stack
  delivery. * Strong system design skills, including service
  decomposition, API design, integration patterns, data
  modeling, scalability, reliability, and operational concerns
  in cloud-native environments. * Ability to lead ambiguous,
  business-heavy problem spaces: identify real requirements
  and root problems, structure chaos, and translate needs into
  pragmatic technical solutions. * Proven track record of
  simplifying complex systems and delivering maintainable end-
  to-end solutions with high business impact. * Strong
  experience with modern engineering practices: code reviews,
  design reviews, CI/CD, testing strategy, observability,
  incident response, and production ownership. * Excellent
  collaboration and communication skills, with the ability to
  influence engineers, product managers, and business
  stakeholders without formal authority. * Product mindset and
  delivery orientation: balances technical quality with
  business value and drives initiatives to completion. Our
  Offer * Global Team: Join our motivated international team
  at Solactive. * Modern Culture: Enjoy our modern, flat
  hierarchy and startup-like culture. * Responsibility &
  Connections: Take over responsibility from day one and build
  relationships in- and outside of the company. * Vacation:
  Enjoy 30 annual vacation days, plus extra time off for
  Christmas Eve and New Year. * Competitive Compensation:
  Receive a competitive compensation package. * Community &
  Networking: Engage in our various networking events. *
  Professional Development: Grow both personally and
  professionally through our diverse training offers. *
  Flexibility: Embrace a flexible work culture with the
  freedom to choose your work hours, including a hybrid work
  model, all within a diverse and dynamic environment. ##
