description: |
  TheGuarantors is a fintech company helping multifamily
  owners and operators mitigate leasing risk while expanding
  access for renters. With a deep understanding of owner,
  operator, and renter needs, we believe renters deserve
  better access to the home of their choice and operators
  deserve greater protection and growth opportunities. That’s
  why we’re leveraging our real estate expertise and using AI-
  driven renter underwriting to help operators qualify renters
  faster while mitigating the financial risk of renter
  default. With $7B+ in lease value protected, we work with 9
  of the country’s top 10 operators, are the #1 lease
  guarantee provider nationwide, and have consistently been
  named one of Inc. 5000’s fastest-growing companies, one of
  Forbes’ Best Startup Employers, and one of Deloitte’s
  Technology Fast 500

  The Role

  The Senior Software Engineer is responsible for designing,
  building, and operating mission-critical systems that power
  our deal and application lifecycle. This role supports our
  engineering organization by building scalable backend
  services and modernizing our platform from a monolithic
  architecture to micro-services.

  The ideal candidate will bring 5+ years of software
  engineering experience with strong backend expertise
  (Node.js/NestJS, TypeScript) and solid distributed-systems
  fundamentals and will be expected to  own features end-to-
  end from requirements through development, QA, and
  production, lead technical design discussions, and mentor
  other engineers.

  Location This is a hybrid role based in NYC.

  What You’ll Do

  - Own a slice of the product end-to-end — from requirements
    through development, QA, and production.
  - Execute day-to-day responsibilities related to building and
    extending backend services and React frontends within a
    micro-service architecture with accuracy, timeliness, and
    consistency.
  - Analyze, review, or maintain services, APIs, and data models
    to support business needs.
  - Partner with product managers, QA, designers, and engineers
    across teams to support shared priorities and cross-team
    projects and ensure alignment.
  - Communicate updates, risks, blockers, and recommendations
    clearly and proactively.
  - Identify opportunities to improve system reliability,
    scalability, and developer experience.
  - Use data, judgment, and business context to inform decisions
    and recommendations.
  - Manage assigned work independently and follow through on
    commitments, deadlines, and deliverables.
  - Ensure work is completed in accordance with applicable
    policies, procedures, standards, and regulatory
    requirements.
  - Perform other role-related responsibilities as assigned and
    aligned with business needs.

  Requirements

  - 5+ years of experience in software engineering, with a
    strong backend focus.
  - Experience with Node.js, NestJS, TypeScript, Go in
    production, including designing and operating APIs
    (REST/GraphQL) and relational data models (PostgreSQL).
  - Strong understanding of distributed systems and micro-
    service architecture, including experience decomposing or
    migrating away from monolithic systems.
  - Demonstrated ability to manage complex features end-to-end,
    partner with product and cross-functional stakeholders,
    and deliver high-quality work in a dynamic business
    environment.
  - Bachelor's degree in Computer Science or a related field
    (Master's degree preferred), or equivalent practical
    experience.

  Nice to Have

  - Experience working in a fast-paced, high-growth, cross-
    functional environment.
  - Experience using Node.js, Go, GraphQL, AWS products, Redis,
    and React.
  - Master's degree in Computer Science or additional training
    in distributed systems or software architecture.
  - Prior experience in fintech, insurance, or real estate
    technology.

  Benefits

  - Opportunities to make an impact within a fast growing
    company
  - Medical, dental, & vision insurance, beginning day one
  - Health savings account with employer contribution
  - Generous PTO and paid holidays
  - Flexible working hours
  - 401(k)
  - Paid parental leave
  - Company sponsored short and long term disability
  - Flexible spending accounts (healthcare, dependent care,
    commuter)
  - Competitive salary

  Base Salary

  This is an individual contributor role, internally leveled
  as IC4.

  The annual U.S. base salary range is $170,000–$205,000. Base
  salary does not include other forms of compensation or
  benefits. Individual pay is determined by work location,
  skills, experience, and other job-related factors, which
  will be discussed during the hiring process.

