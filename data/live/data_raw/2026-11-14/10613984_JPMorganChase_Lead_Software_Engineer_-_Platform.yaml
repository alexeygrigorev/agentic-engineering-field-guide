description: |
  Behind every investment is a person with ambitions,
  motivations and values. While we know that every client is
  unique, they come to J.P. Morgan Personal Investing for the
  same reason: our straightforward and transparent approach to
  investing, and the trust that 150 years of J.P. Morgan
  heritage brings.

  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to almost 300,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals.

  As a Lead Software Engineer at JPMorgan Chase within J.P.
  Morgan Personal Investing, you will join a Backend
  Engineering Platform team dedicated to building a Spring
  Boot based framework and libraries that enable our product
  engineering teams to build and run financial services at
  scale.

  This hands-on role combines deep technical expertise in Java
  and the Spring ecosystem, with strong problem-solving
  abilities. You will work closely with SDLC and
  Infrastructure teams and play a pivotal role in driving
  standardization and promoting best practices across
  Investments' technology landscape.

  Job responsibilities

  - Design, develop, and maintain backend frameworks and
    libraries using Java and Spring Boot.
  - Build components that provide out of the box implementations
    of functional and non-functional requirements.
  - Collaborate closely with product engineering teams to
    understand their needs and deliver solutions that improve
    their productivity and engineering experience.
  - Tackle complex technical challenges, design innovative
    strategic solutions and provide guidance to the team.
  - Close collaboration with SDLC and Infrastructure teams to
    enable delivery of Platform as a Product

  Required qualifications, capabilities, and skills

  - Strong proficiency in Java and Spring Boot (or similar)
    framework.
  - Experience with managing build tools such as Maven and
    Gradle and their role in SDLC standardisation.
  - Experience with building APIs in micro-service-oriented
    architectures and distributed systems with high level of
    complexity.
  - Solid understanding of software engineering principles,
    design patterns, and best practices.
  - Excellent communication, mentoring, and stakeholder
    management skills.
  - Understanding the needs of engineering teams with the
    ability to drive change and influence their technical
    direction.
  - Passion for driving standardisation, process improvement,
    and engineering excellence.
  - Understanding importance of controls and compliance in
    regulated organisations.

  Preferred qualifications, capabilities, and skills

  - Experience with designing libraries that have been used
    across multiple engineering teams.
  - Deep understanding of Spring and Spring Boot internals.
  - Experience working in financial services, investment
    platforms, or similar regulated organisations.
  - Experience with building self-serve tooling for engineering
    teams.
  - Hands-on experience building and maintaining CI/CD
    pipelines.

  About UsJ.P. Morgan is a global leader in financial
  services, providing strategic advice and products to the
  world’s most prominent corporations, governments, wealthy
  individuals and institutional investors. Our first-class
  business in a first-class way approach to serving clients
