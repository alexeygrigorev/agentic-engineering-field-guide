description: |
  Company Description NBCUniversal is one of the world's
  leading media and entertainment companies. We create world-
  class content, which we distribute across our portfolio of
  film, television, and streaming, and bring to life through
  our global theme park destinations, consumer products, and
  experiences. We own and operate leading entertainment and
  news brands, including NBC, NBC News, NBC Sports, Telemundo,
  NBC Local Stations, Bravo, and Peacock, our premium ad-
  supported streaming service. We produce and distribute
  premier filmed entertainment and programming through our
  powerhouse film and television studios, including Universal
  Pictures, DreamWorks Animation, and Focus Features, and the
  four global television studios under the Universal Studio
  Group banner, and operate industry-leading theme parks and
  experiences around the world through Universal Destinations
  & Experiences, including Universal Orlando Resort, home to
  Universal Epic Universe, and Universal Studios Hollywood.
  NBCUniversal is a subsidiary of Comcast Corporation. Visit
  www.nbcuniversal.com for more information. Our impact is
  rooted in improving the communities where our employees,
  customers, and audiences live and work. We have a rich
  tradition of giving back and ensuring our employees have the
  opportunity to serve their communities. We champion an
  inclusive culture and strive to attract and develop a
  talented workforce to create and deliver a wide range of
  content reflecting our world. Job Description In this role,
  you'll be leading engineering operations for our Geospatial
  Pipeline Engineering and DevOps teams to ensure projects are
  completed on time and meet quality standards. You will take
  ownership of the on-time delivery of cutting-edge Geospatial
  AI features and implementation in our pipeline, as well as
  people management of the team members. You'll organize and
  manage the team's workflow using agile practices, such as
  sprint planning, daily check-ins, and feedback sessions. You
  will manage professional success for the members of the
  team. You'll work closely with the Digital Twin Engineering
  Manager to align on the product goals, user needs, and
  system architecture, while also coordinating with several
  adjacent teams to set priorities, monitor progress, and
  deliver product value. You will also work closely with the
  Principal Engineer of the Geospatial Pipeline team and the
  Geospatial Systems and Data Leader to execute their
  technical vision for this pipeline, on a cadence that
  ensures timely product delivery. Responsibilities include,
  but not limited to:

  - You will work with the Geospatial Pipeline Principal
    Engineer in overseeing day-to-day engineering operations,
    ensuring teams meet deadlines and deliver high-quality
    work.
  - You will manage and facilitate an Agile process, including
    participating in sprint planning, daily stand-ups,
    retrospectives, and backlog grooming.
  - You will people-manage the Geospatial Pipeline team and
    DevOps team, driving project success and supporting the
    contributors on the team towards their professional
    success goals.
  - You will collaborate closely with the DT Engineering Manager
    and Geospatial Systems and Data Leader to understand
    product and feature requirements and user needs.
  - You will manage resource allocation and facilitate timely
    feature delivery.
  - You will coordinate with peers on adjacent teams to refine
    product priorities, track progress, align delivery
    schedules, and weigh trade-offs.

  Qualifications

  - Bachelor's in Computer Science, Engineering, Mathematics, or
    a related field.
  - 10+ years of relevant industry experience in a fast paced,
    high growth tech environment.
  - Strong people management experience with highly technical
    teams.
  - Experience with Agile methodologies, with a track record of
    implementing and refining processes that drive team
    efficiency and effectiveness.
  - Ability to work backwards from the big picture to deliver
    incremental milestones without getting bogged down in
    bureaucracy.
  - Experience coordinating across multiple teams, including
    aligning teams' goals with a collaborative, team-oriented
    approach.
  - A demonstrated aptitude, enthusiasm, and willingness to
    learn new methods, tools, practices and skills.

  Desired Characteristics:

  - Master's Degree in Computer Science, Engineering,
    Mathematics, or a related field.
  - Strong background in Software Engineering, with experience
    in managing technical teams and delivering complex
    projects.
  - Organizational and leadership skills, with the ability to
    motivate and guide a diverse team
  - High emotional quotient, with a proven ability to
    communicate and align with technical and nontechnical
    stakeholders with a variety of skillsets.
  - Exceptional written and verbal communication skills to
    collaborate effectively across teams and present technical
    concepts to non-technical stakeholders
  - An intuition and enthusiasm for launching groundbreaking,
    deep-tech products.
  - Problem-solving skills, attention to detail, and the ability
    to thrive in a fast-paced environment.

  Bonus/Nice-to-Have Characteristics:

  - Experience with modern C++ and Python will give you deeper
    insights into the technology you are managing.
  - Experience in the fields of computer graphics, computer
    vision, or visual computing, with a strong understanding
    of core concepts, algorithms, and tools used to create,
    analyze, and manipulate visual data.
  - Experience with procedural modeling techniques to create
    scalable, dynamic 3D assets and environments, utilizing
    tools such as Houdini, Blender, or custom scripting for
    automated content generation.

  This position is eligible for company sponsored benefits,
  including medical, dental and vision insurance, 401(k), paid
  leave, tuition reimbursement, and a variety of other
  discounts and perks. Learn more about the benefits offered
  by NBCUniversal by visiting the Benefits page of the Careers
  website. Salary range: $170,000k-230,000 (bonus eligible) We
  are accepting applications for this position on an ongoing
  basis. Additional Information As part of our selection
  process, external candidates may be required to attend an
  in-person interview with an NBCUniversal employee at one of
  our locations prior to a hiring decision. NBCUniversal's
