  orientation, marital status, pregnancy, veteran status,
  membership in the uniformed services, genetic information,
  or any other basis protected by applicable law. If you are a
  qualified individual with a disability or a disabled
  veteran, you have the right to request a reasonable
  accommodation if you are unable or limited in your ability
  to use or access nbcunicareers.com as a result of your
  disability. You can request reasonable accommodations by
  emailing AccessibilitySupport@nbcuni.com. For LA County and
  City Residents Only: NBCUniversal will consider for
  employment qualified applicants with criminal histories, or
  arrest or conviction records, in a manner consistent with
  relevant legal requirements, including the City of Los
  Angeles' Fair Chance Initiative For Hiring Ordinance, the
  Los Angeles County Fair Chance Ordinance for Employers, and
  the California Fair Chance Act, where applicable.
