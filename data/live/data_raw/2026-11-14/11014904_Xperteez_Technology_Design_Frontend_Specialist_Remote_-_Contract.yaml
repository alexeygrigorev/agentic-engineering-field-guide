description: |
  Role Title: Design & Frontend Specialist

  Role Type: Contractor

  Location: Remote

  Required Skills:

  - Product Design
  - UX Design & User Research
  - UI/Visual Design
  - Design Systems (Figma)
  - Frontend Engineering (JavaScript/Typescript
  - React or Comparable)
  - Accessibility
  - Design & Techinical Rationale Writing
  - Design Docs
  - Research Reports
  - RFCs/ADRs
  - Trade-Offs Analysis
  - Synthesis of Complex Information
  - Analytical Writing
  - Attention To Detail

  In this role, you'll apply your expertise to help train
  next-generation AI systems. Your work will shape how models
  learn, reason, and perform through high-quality, real-world
  input. No prior experience in AI is required — your domain
  knowledge is what matters. This opportunity is ideal for
  professionals who excel at explaining the 'why' behind their
  design and technical decisions, and who are passionate about
  producing thorough, thoughtful written deliverables. Rather
  than execution, your primary contributions will be
  analytical and explanatory, focusing on trade-offs,
  constraints, user impact, and communicating complex concepts
  to varied audiences.

  Scope of Work:

  - Analyze product and design challenges, and articulate
    decision-making rationales in clear, structured written
    English.
  - Draft and refine design documents, usability reports,
    research summaries, RFCs/ADRs, and related analytical
    materials.
  - Synthesize complex design and technical information into
    accessible, well-organized content tailored for diverse
    audiences.
  - Evaluate and write about design systems (especially Figma
    workflows), accessibility considerations, and frontend
    architecture trade-offs.
  - Produce detailed reports on user research findings,
    including insights and actionable recommendations.
  - Critically assess design and engineering approaches,
    documenting pros, cons, and strategic implications.
  - Participate in structured reviews to provide expert
    commentary and feedback on submitted project artifacts.

  Preferred Qualifications:

  - Minimum 3 years of professional experience in product
    design, UX, UI/visual design, or frontend engineering
    (JavaScript/TypeScript, React or comparable frameworks).
  - Demonstrated expertise in producing high-quality written
    deliverables (design docs, case studies, design system
    documentation, usability reports, RFCs/ADRs).
  - Strong analytical skills with the ability to synthesize and
    clearly communicate complex or nuanced information.
  - Proficiency with Figma and contemporary design systems,
    along with deep familiarity with accessibility best
    practices.
  - Exceptional attention to detail and precision in analytical
    writing.
  - Experience articulating and justifying technical or design
    trade-offs in written form for stakeholders.
  - Background with leading universities or highly regarded
    organizations is especially valued.
