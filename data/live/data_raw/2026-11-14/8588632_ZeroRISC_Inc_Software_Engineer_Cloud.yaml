description: |
  ZeroRISC



  ZeroRISC is redefining silicon security and supply chain
  integrity by empowering device owners and operators in
  crucial sectors like silicon production, IoT, and critical
  infrastructure with full device ownership, control, and
  visibility. Led by the founders of the OpenTitan secure
  silicon project, ZeroRISC is driving commercial adoption of
  high assurance software and services rooted in open silicon
  designs. Our products forge an immutable connection between
  hardware and software, enabling users to trust their devices
  no matter where they’re built or where they’re deployed.



  Role Overview



  As a Software Engineer at zeroRISC, you will develop our
  suite of security-focused cloud services and infrastructure.
  You’ll have the opportunity to learn, grow, and directly
  contribute to the design and implementation of scalable,
  reliable, and secure systems. You’ll collaborate closely
  with the rest of our engineering team to design APIs, build
  backend systems, and implement cloud integrations, ensuring
  seamless functionality with our embedded platform. This
  position is ideal for an early-career engineer with a few
  years of industry experience who is interested in a high-
  growth environment.

  Key Responsibilities:

  - Design, build, and maintain cloud infrastructure and cloud-
    based services and APIs to support the functionality and
    scalability of our platform
  - Contribute to the development of software applications that
    interface with our embedded operating system and provide
    key features for end-users
  - Identify and resolve bugs, and write automated tests to
    ensure system reliability and maintainability
  - Stay informed about advancements in cloud computing,
    distributed systems, and secure software practices,
    applying these insights to your work

  What We’re Looking For:

  - Bachelor’s or Master’s degree in Computer Science, Computer
    Engineering, or a related field
  - Strong understanding of computer science fundamentals,
    including algorithms, data structures, and system design
  - 3+ years of full-time industry experience in a role with
    cloud infrastructure or cloud service development as a
    primary focus
  - Proficiency in programming with a modern language like Go
    and Python (prior experience with Go is not required but
    is a plus)
  - Strong understanding of distributed systems, cloud computing
    concepts, and RESTful API design
  - Strong teamwork and communication skills to work effectively
    with senior engineers, product teams, and other
    stakeholders

  Preferred Qualifications:

  - Familiarity with cloud platforms such as AWS, GCP, or Azure
  - Experience with containerization and orchestration tools
    like Docker and Kubernetes
  - Knowledge of industry-standard PKI and hardware security
    practices

  Why Join Us?

  - Your work will directly contribute to the development of
    cutting-edge security solutions, protecting critical
    systems in industrial and IoT environments
  - As a seed-stage startup, this role offers significant
    opportunities for learning and career growth
  - Join a close-knit, innovative team where you can learn,
    grow, and contribute to building something meaningful in
    the security space
