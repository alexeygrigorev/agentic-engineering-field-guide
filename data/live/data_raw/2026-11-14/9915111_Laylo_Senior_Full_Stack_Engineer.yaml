description: |
  Laylo powers drops for some of the world’s biggest creators
  and brands. Drops have become the predominant marketing
  strategy for merch, tickets and content and we're building
  the leading CRM to power them. The platform combines landing
  pages, messaging, link tracking, and more to empower
  musicians, live events, promoters, and brands with the tools
  to drive more sales and streams around their most important
  moments.

  We’re building a next-generation marketing platform complete
  with drop campaigns, cross-platform messaging, landing
  pages, and link tracking –giving creators the power to own
  and activate their fanbase.

  As a full stack engineer, writing code and building
  beautiful user experiences is just one part of your job.
  You'll also talk to users, get involved with design, and
  develop your own opinion on what needs to exist in the
  world. Then you'll move with urgency to make it happen.

  Laylo now powers Drops to over 60 million fans across music
  and live events. Notable customers include Sabrina
  Carpenter, Usher, Outside Lands and more.

  To learn more about how we work, take a look at Our Values

  What will you do?

  - You'll work with a small engineering team to build mission-
    critical tools for creators.
  - As one of our first engineers, you'll build entirely new
    products from scratch and make important architectural
    decisions.
  - You'll be responsible for planning, organizing, and
    executing entire projects end to end, from idea to launch.
    To do so, you'll have to work closely with design,
    operations, and (of course) creators.
  - You'll help build the foundation for Laylo engineering
    standards, tooling, and processes.
  - Creators are the most visual people on the planet -- you'll
    build a user experience that is both visually stunning and
    easy-to-use.
  - As we grow, we'll build up an engineering team around you.

  Requirements:

  - Experience with: React, Node.js, Typescript, GraphQL, AWS
    Services (EC2, S3, Lambda), Claude Code, Cursor

  We're looking for someone who:

  - Cares about culture and wants to build something meaningful.
    The tools we create will empower the next generation of
    entrepreneurs, and we take that responsibility seriously.
  - Enjoys all aspects of building a product from scratch. You
    love talking to customers just as much as making technical
    decisions.
  - Understands the importance of both speed and quality, and
    the trade-offs of choosing one over the other.
  - Has 3+ years experience with frontend development,
    preferably with hands-on experience with React,
    Typescript, and Graphql
  - Wants to join a tight-knit team -- we work on solutions as a
    whole engineering team. If you love working on the end-to-
    end product experience, you'll love working here.

  Other Roles:

  If this role isn’t a fit for you but you’d like to work with
  us, find all of our open roles here.

  About Us:

  Our founders met while building competing consumer startups.
  We’ve launched multiple products across consumer and SaaS
  and talked to thousands of fans and creators in the process.
  In 2020, we realized one of the biggest pain points creators
  and brands have is building high conversion drop experiences
  and engaging with their fans.

  We went through Y Combinator in summer 2020 while building
  that new product and after seeing really strong early
  traction, raised our seed round in mid 2021.

  Right now we're a small team that's mostly based in Los
  Angeles but working from remotely with other team members in
  various states. We're open to hiring remotely (in North
  America), but expect to find an office in Los Angeles at
  some point TBD.

  We have a strong written documentation culture, leveraging
  Notion to share ideas and record processes and learnings. We
  try to do as much as possible asynchronously to move quickly
  and efficiently. We have a daily 30 minute standup and
  operate across Slack, Notion & Figma.

  Compensation

  The base pay range for this role is $120 – $175 per year.
