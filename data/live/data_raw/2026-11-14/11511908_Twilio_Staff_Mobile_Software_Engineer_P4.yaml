description: |
  Who we are

  At Twilio, we’re shaping the future of communications, all
  from the comfort of our homes. We deliver innovative
  solutions to hundreds of thousands of businesses and empower
  millions of developers worldwide to craft personalized
  customer experiences.

  Our dedication to remote-first work, and strong culture of
  connection and global inclusion means that no matter your
  location, you’re part of a vibrant team with diverse
  experiences making a global impact each day. As we continue
  to revolutionize how the world interacts, we’re acquiring
  new skills and experiences that make work feel truly
  rewarding. Your career at Twilio is in your hands. .

  Hiring and how we work

  We use Artificial Intelligence (AI) to help make our hiring
  process efficient. That said, every hiring decision is made
  by real Twilions!

  Also, while we are a remote-first company, you may be asked
  to report in person on an ad-hoc basis for team gatherings,
  functional off-sites or customer meetings. .

  See yourself at Twilio

  Join the team as Twilio's next Staff Mobile Software
  Engineer for Stytch, where you'll shape the next generation
  of identity and fraud prevention products.

  About the job

  The position is needed to help scale Stytch’s core identity
  and fraud products as we bring Stytch capabilities to
  Twilio’s full customer base, delivering secure, developer-
  first identity and fraud prevention experiences. You’ll
  build mobile SDK products that power authentication, fraud
  detection and prevention as well as emerging agentic
  identity use cases. You’ll partner closely with product and
  engineering leadership to design and deliver high-impact
  customer-facing features, and evolve our platform for
  Twilio’s scale. This is a rare chance to operate like a
  startup within Twilio: you’ll work in a high-ownership
  environment with startup speed, backed by Twilio’s reach and
  scale.

  Responsibilities

  In this role, you’ll:

  - Build and own the mobile SDKs for Stytch’s identity and
    fraud detection platforms on Twilio—go deep on device
    internals for complex signal collection to improve
    identification of bad actors and ship new SDK surfaces
    powering core authentication flows, including agenting and
    non-human identity use cases.
  - Partner with Product and Engineering leadership to set
    direction, translate customer needs into product
    capabilities, and deliver high-impact roadmap features.
  - Collaborate across Twilio and Stytch teams to align on
    architecture, integrate platform capabilities, and unblock
    cross-team initiatives.
  - Operate with deep technical ownership: author design docs,
    drive key technical decisions, review code, and stay close
    to the systems you ship.
  - Build in ambiguity—break down complex problems, make
    pragmatic tradeoffs, and design developer experiences that
    delight our customers.
  - Improve production quality and resilience through strong
    observability, incident response and remediation.
  - Mentor and support other engineers through pairing,
    feedback, and knowledge-sharing, helping raise the team’s
    technical bar and culture.

  Qualifications

  Twilio values diverse experiences from all kinds of
  industries, and we encourage everyone who meets the required
  qualifications to apply. If your career is just starting or
  hasn't followed a traditional path, don't let that stop you
  from considering Twilio. We are always looking for people
  who will bring something new to the table!

  Required

  - 6+ years of professional mobile engineering experience, with
    deep experience in designing, building and maintaining
    mobile applications.
  - Android development experience, fluent in Kotlin or Java.
  - Expertise in mobile development ecosystems, frameworks, 3rd
    party libraries.
  - Deep understanding of software engineering best practices,
    including monitoring, observability, and building
    maintainable systems.
  - Experience making high-impact technical decisions and
    leading technical initiatives.
  - A proven track record of driving technical excellence while
    keeping customer needs at the center of your work.
  - Deep understanding of software engineering best practices,
    including monitoring, observability, and building for the
    long term.
  - Exceptional communication and collaboration skills, with the
    ability to influence and align stakeholders.
  - Bachelor’s degree in Computer Science or related industry
    experience.
  - Excellent written and verbal communication skills.
  - Schedule: ability to work non-standard, on-call rotation
    weekend and holiday hours.

  Desired

  - iOS development experience.
  - Familiarity with Kotlin Multiplatform, C/C++, Swift or Go.
  - Experience building developer tools or SDKs.
  - Builder at heart. Through a hobby or your profession, you
    are passionate about being hands on and seeing your work
    come to life.

  Location

  This role will be remote in the US.

  Travel

  We prioritize connection and opportunities to build
  relationships with our customers and each other. For this
  role, you may be required to travel occasionally to
  participate in project or team in-person meetings.

  What We Offer

  Working at Twilio offers many benefits, including
  competitive pay, generous time off, ample parental and
  wellness leave, healthcare, a retirement savings program,
  and much more. Offerings vary by location.

  Compensation

  *Please note the salary range information provided applies
  only to candidates residing in California, Colorado, Hawaii,
  Illinois, Maryland, Massachusetts, Minnesota, New Jersey,
  New York, Vermont, Washington D.C., and Washington State due
  to local requirements. Compensation for candidates in other
  locations will be discussed during the hiring process.
  Please note that hiring for this role is not restricted to
  the locations listed above.

  The estimated pay ranges for this role are as follows:

  - Based in Colorado, Hawaii, Illinois, Maryland,
    Massachusetts, Minnesota, Vermont or Washington D.C.:
    $171,120 - $213,900.
  - Based in New York, New Jersey, Washington State, or
    California (outside of the San Francisco Bay area):
    $181,200 - $226,500.
  - Based in the San Francisco Bay area, California: $201,280 -
    $251,600.
  - This role may be eligible to participate in Twilio’s equity
    plan and corporate bonus plan. All roles are generally
    eligible for the following benefits: health care
    insurance, 401(k) retirement account, paid sick time, paid
    personal time off, paid parental leave.

  The successful candidate’s starting salary will be
  determined based on permissible, non-discriminatory factors
  such as skills, experience, and geographic location.

  Twilio thinks big. Do you?

  We like to solve problems, take initiative, pitch in when
  needed, and are always up for trying new things. That's why
  we seek out colleagues who embody our values — something we
  call Twilio Magic. Additionally, we empower employees to
  build positive change in their communities by supporting
  their volunteering and donation efforts.

  So, if you're ready to unleash your full potential, do your
  best work, and be the best version of yourself, apply now!
  If this role isn't what you're looking for, please consider
  other open positions.

  .

