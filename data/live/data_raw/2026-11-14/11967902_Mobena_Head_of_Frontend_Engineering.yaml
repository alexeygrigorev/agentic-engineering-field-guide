description: |
  About Mobena

  Mobena is the planning system for wealthy families that puts
  income tax, estate planning and financial planning in one
  model. An advisor enters a family and everything it owns,
  owes and does: every trust, entity, partnership interest and
  asset. The system simulates the family year by year and
  compares the effects of planning decisions and life events,
  such as a GRAT, sale of a business, move to a different
  state or a death. Every result can be followed back to its
  support, down to the form line.

  Mobena's founder and CEO is a tax attorney, CPA and
  Bloomberg Tax Author of the Year. He created Mobena to solve
  his own clients' problems.

  The opportunity

  A family's model holds every trust, entity and ownership
  layer the family has, projected for as many years as the
  plan requires. Our design rule is that financial complexity
  must not become interface complexity. Your job is to help an
  advisor compare a planning decision year by year, understand
  the tax consequences and explain the result to a family.

  Mobena has a full, active user interface, and tester
  feedback has just begun. We expect the updated version to be
  in place before you join. You will take ownership of the
  frontend and lead it to general release in March 2027. This
  is a hands-on role: you will write code every day.

  How we work

  - You will lead frontend engineering independently and report
    to the CTO, who architected the SaaS platform and owns the
    backend. You and the CTO will operate as strategic
    partners to set the technical direction of the company.
  - You will also work directly with the CEO, who created the
    core financial logic and collaborates on product design,
    and with the Head of Product Delivery, who coordinates
    client feedback and testing.
  - Remote within the United States, working East Coast hours.
    We have team members in the New York and Washington, DC
    areas, and our corporate office is in Baltimore.

  What you'll do

  - Own the frontend codebase as an initial team of one: Build
    and ship new UI components, screens and features, fix bugs
    and turn advisor feedback into concrete improvements.
  - Adapt and improve the frontend tech stack: Manage the
    application architecture and code quality. The current
    frontend is primarily built in React, TypeScript and
    Tailwind CSS. In collaboration with the CTO, you will
    decide our frontend tech stack as we scale.
  - Work with the CTO on the engine and APIs: Decide together
    what the interface needs, how state and results move
    between the frontend and core engine, and who builds what.
  - Make complexity usable: Build family and ownership
    workflows, the forecasting grid, scenario comparisons,
    income-tax and estate views, document review and reports
    advisors can use with families and export to PDF.
  - Lead the existing frontend to release: Plan and deliver
    changes without disrupting the advisors who are testing
    it.
  - Set the standard: Put testing, performance, accessibility, a
    design system, code review and release practices in place,
    serving as a senior technical resource for the team.
  - Grow the team when it is time: Help decide when the next
    frontend engineer is hired and who to hire.

  Who you are

  - WealthTech or tax tech experience is highly preferred. You
    have built software for financial advisors, wealth
    managers, CPAs or estate planners in financial planning,
    portfolio reporting, tax preparation, tax planning or
    estate planning. You know what an advisor does all day and
    where software slows them down.
  - 8+ years building production web applications (or equivalent
    experience), with deep expertise in React and TypeScript
    and several years spent as a lead or senior frontend
    engineer.
  - Experience on a small team, raising the bar through
    collaborative code review and architectural choices that
    you explain rather than impose.
  - Experience building data-dense web interfaces: grids, multi-
    level forms, charts, side-by-side comparisons and
    printable reports.
  - Daily use of AI coding tools is required. You are fast with
    them and you know where they are wrong.
  - A record of improving an existing codebase without a rewrite
    that stops the business.
  - Product judgment and independence. You have worked closely
    with designers and users. You can tell an advisor's
    request from an advisor's need, push back with reasons and
    raise decisions outside your area with a recommendation.

  Why you'll love working here

  You will be the 5th person at a fast-growing startup with
  the opportunity to make a significant contribution at a very
  early stage.

  You will build the interface that makes the consequences of
  planning decisions understandable to an advisor. It is early
  enough that the engineer who owns the frontend will set how
  Mobena works for years.

  Compensation

  - $180,000–$220,000 base salary. Bonus eligible.
  - Eligible to participate in employee equity pool.

  You must be authorized to work in the United States. We do
  not sponsor visas. Mobena is an equal opportunity employer.
