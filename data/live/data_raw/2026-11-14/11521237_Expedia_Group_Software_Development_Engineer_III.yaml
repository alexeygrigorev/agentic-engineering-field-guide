description: |
  At Expedia Group, we help travelers explore the world, one
  journey at a time. As a global travel company powered by
  passionate people, trusted partnerships, and leading
  technology, we connect travelers, partners, and advertisers
  through our consumer brands, B2B network, and travel
  advertising business.

  Here, you'll do meaningful work that helps millions of
  people discover, book, and experience travel with more ease,
  confidence, and joy. Our five Behaviors-Traveler First,
  Think Big, Operate with Excellence, Ownership Mindset, and
  Succeed Together-help foster a supportive environment where
  people can grow their careers and have the flexibility,
  benefits, and support to do their best work. Join us and
  build for travelers everywhere.

  Introduction to the Team

  In the B2B division, we bring Expedia Group's innovative
  technology and distribution solutions to partners across the
  world. These businesses include global financial
  institutions, corporate managed travel, offline travel
  agents, global travel suppliers (like major airlines) and
  many more.

  As a Software Development Engineer III within B2B, you will
  be a key technical contributor building scalable, high-
  quality software solutions that power our global partner
  ecosystem.

  You will mentor junior engineers, lead complex engineering
  initiatives, and help shape the technical direction of our
  products and systems.

  In this role, you will:

  - Lead the design, development, and delivery of complex
    systems and APIs consumed across the business unit
  - Operate Tier 1 or business-critical services, participate in
    on-call rotations, respond to production incidents, and
    use monitoring and alerting tools to maintain service
    reliability.
  - Mentor junior engineers, providing technical guidance and
    leading code evolution through structured code reviews
  - Proactively collaborate with peers across the organization
    to identify cross-dependencies and engage in shared
    problem-solving
  - Design software that is clean, maintainable, modular, and
    optimized, applying software design principles, data
    structures, and design patterns
  - Test, debug, and resolve production issues within
    established SLAs, ensuring software consistently meets
    design requirements
  - Identify areas of inefficiency in code or system operations
    and propose actionable improvements
  - Contribute to a community of practice, sharing new skills
    and technical knowledge to increase overall team
    effectiveness
  - Present findings on major operational or technical
    initiatives (e.g., Root Cause Analyses) to broader
    stakeholder groups, both in written and verbal formats
  - Apply knowledge of software frameworks, databases, and
    database design principles to develop robust, effective
    data solutions
  - Bring together stakeholders with varied perspectives to
    develop solutions and contribute actionable
    recommendations

  Experience and Qualifications:

  - Bachelor's degree in Computer Science, Engineering, or
    related technical field; or equivalent related
    professional experience — with 5+ years of software
    development experience; OR Master's degree in Computer
    Science, Engineering, or related technical field; or
    equivalent related professional experience — with 3+ years
    of software development experience
  - Proficiency in at least three programming languages, with
    primary experience in Java/Kotlin or another JVM-based
    language.
  - Experience working with NoSQL databases, particularly
    DynamoDB.
  - Experience operating Tier 1 or business-critical services,
    including participation in on-call rotations, handling
    production incidents, and using monitoring and alerting
    tools.
  - Experience maintaining and operating at least 4 software
    projects or products in production environments (e.g., bug
    fixing, troubleshooting, monitoring)
  - Experience designing and building APIs for consumption
    across a business unit
  - Knowledge of software design principles, data structures,
    design patterns, and computer science fundamentals
  - Familiarity with testing and monitoring tools, with the
    ability to design easily testable and observable software
  - Ability to work both collaboratively and autonomously across
    cross-functional teams

  #LI-SV1

