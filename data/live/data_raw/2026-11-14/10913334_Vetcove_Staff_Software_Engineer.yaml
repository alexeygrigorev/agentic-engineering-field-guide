description: |
  Join Vetcove and help modernize the future of veterinary
  software and the pet parent healthcare experience. Our suite
  of platforms features a market-leading procurement
  marketplace, an ultra-modern home delivery ecommerce
  experience, and a next-generation practice management
  system. More than 25,000 hospitals across all 50 states rely
  on Vetcove daily, supporting tens of thousands of
  veterinarians who care for tens of millions of pets each
  year.

  We are modernizing the 50 billion dollar plus animal health
  industry by giving veterinary organizations the tools to
  focus more on patient care. Backed by Y Combinator and top
  venture investors in Silicon Valley, New York and Miami,
  Vetcove is a fast-growing, mission-driven company. We are
  searching for talented and passionate people who want to
  help shape the future of veterinary care.



  About the Position

  As a Staff Software Engineer at Vetcove, you’ll take
  ownership of major product areas—designing, building, and
  improving the tools that help veterinary clinics streamline
  operations, deliver exceptional patient care, and optimize
  their supply chains. The systems you create will manage
  billions of dollars in transactions and empower clinics to
  focus on their patients, not their logistics.



  This isn’t just another engineering job—it’s a chance to
  tackle meaningful challenges and make a real-world impact.
  You’ll be involved in everything: deciding what to build,
  designing how it works, and ensuring it gets into the hands
  of users seamlessly. If you thrive on solving hard problems
  and creating tools that matter, this role is for you!



  About Our Team



  We’re a fast-moving team solving big challenges in a field
  that’s rapidly adopting technology. Our platform powers
  every aspect of veterinary clinic operations, from medical
  records to purchasing workflows. But we’re not just building
  software—we’re rethinking how the industry operates, making
  it more efficient and humane.



  At Vetcove, engineers work across the stack and have a
  holistic view of the platform. You’ll have the opportunity
  to work closely with users, influence the product roadmap,
  and make a real difference in an industry that impacts
  millions of animals and their caregivers. We operate in a
  fully remote environment, giving you the flexibility to do
  your best work while staying deeply connected to a fast
  moving highly collaborative team.



  What You’ll Do

  - Lead the design, architecture, and delivery of complex
    product initiatives across web and mobile platforms
  - Build and enhance React and React Native applications used
    by tens of thousands of veterinary professionals and
    industry partners
  - Set engineering standards, drive code quality, and ensure
    strong test coverage across the codebase
  - Develop scalable components, shared libraries, and
    architectural patterns that support team-wide productivity
  - Mentor engineers, provide technical guidance, and influence
    engineering direction across multiple teams
  - Partner closely with our CTO, engineering leadership, and
    cross-functional stakeholders to define and execute high-
    impact solutions
  - Design features and data models with accuracy, security, and
    performance in mind, including optimizing database queries
    and API interactions
  - Troubleshoot complex issues across the stack and lead
    efforts to improve system performance and reliability
  - Work in a fully remote team environment



  What We’re Looking For

  - 8+ years of professional software engineering experience
    with ownership of complex, production-grade systems
  - Bachelor’s degree required, ideally in Computer Science or a
    related technical field
  - Deep expertise in at least one modern programming language
    and strong experience with modern web frameworks
  - Strong proficiency in JavaScript and React, including
    architecting large-scale front-end applications
  - Proven ability to design scalable systems, APIs, and data
    models
  - Solid experience working with relational databases and
    optimizing queries
  - Consistent practice of writing well-tested, maintainable,
    and reliable code
  - Demonstrated ability to mentor engineers and lead technical
    decision-making
  - Excellent communication skills, with the ability to convey
    complex ideas clearly
  - Collaborative, adaptable, and effective in fast-paced or
    evolving environments



  Tools We Use

  - Backend: Python (Django, Django Rest Framework)
  - Frontend: JavaScript (React, React-Query), Less.js,
    TypeScript
  - Datastores: Postgres, Elasticsearch, Redis, Clickhouse
  - Mobile: React Native
  - Version Control: Git



  Benefits (Full Time Roles)

  - 100% remote within the USA
  - Medical, Dental, and Vision Insurance
  - Automatic 401k contribution
  - Employee referral program
  - At home office set up
  - Bi-annual company retreats
  - Open vacation policy
  - Equity
  - Monthly team events



  The typical base pay range for this role across the U.S. is:
  $170,000/year - $230,000/year + bonus + equity + benefits.
  There is a different range applicable to specific work
  locations. For Colorado, the salary range is: $190,000 -
  $210,000 + bonus + equity + benefits. This salary range is a
  good faith estimate of what Vetcove may pay for this
  position at the time of posting. Actual compensation may
  vary based on skills, qualifications, and experience. The
  range reflects the base hourly rate or annual compensation
  (as applicable), and does not include bonus, equity or other
  incentives.

  In addition to base compensation, Vetcove offers a
  comprehensive benefits package. Please refer to the
  “Benefits (Full Time Roles)” section above for more details.



  To apply, please submit your application through Vetcove’s
  Careers Page. The application deadline is accepted on an on
  going basis.



  Please note we are unable to sponsor work visas at this
  time.

