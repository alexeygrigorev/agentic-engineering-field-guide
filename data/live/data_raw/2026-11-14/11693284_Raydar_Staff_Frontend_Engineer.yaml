description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Lead frontend engineering work to make a data-intensive web
  application stable and quick. The role covers fixing
  stability problems, tuning rendering speed, and building the
  tooling and conventions that help other engineers deliver
  safely. It also includes guiding technical direction and
  mentoring teammates.

  What you'll do

  - Resolve core stability issues in the web application,
    including error handling, client-side state and data
    consistency.

  - Improve performance for views with very large lists through
    virtualization, smaller bundles and faster rendering.

  - Set up monitoring and observability so problems surface
    before users report them.

  - Define testing approaches that prevent regressions.

  - Build shared abstractions and patterns that let engineers
    deliver faster while protecting existing behavior.

  - Drive technical decisions and mentor teammates through
    complex migrations.

  Requirements

  What we're looking for

  - 7+ years building frontend applications at scale.

  - Deep, hands-on expertise in React and TypeScript, including
    modern build tooling.

  - Significant hands-on experience making large, data-heavy
    interfaces fast and responsive.

  - A track record of diagnosing and fixing production
    performance issues at scale.

  - Experience with search or recommendation features.

  - Well-founded views on frontend architecture, grounded in
    real shipping experience.

  - At least one strong signal of excellence, such as experience
    at a well-regarded startup, rapid career progression at a
    large technology company, or experience at a data-centric
    product company.

  - Clear, direct communication that holds up under in-depth
    technical questions, on both technical and non-technical
    topics.

  - Genuine enthusiasm for joining an early-stage company and
    contributing to team discussions.

  Bonus points

  - Fluency with AI-assisted development tools.

  - Enough familiarity with backend interfaces and caching to
    shape frontend design around them.

  - Familiarity with business data products.

  Benefits

  Compensation and benefits

  - Base salary: USD 200,000 to 280,000 per year

  - Equity

  - Health, dental and vision coverage

  - Retirement plan

  Location and work model

  - New York, New York, United States

  - Hybrid, 3 days in-office

  - Full-time
