description: |
  As our portfolio companies grow, Galaxy Ventures helps them
  hire and scale teams by selectively connecting top industry
  talent with their open roles. A piece of this is the Galaxy
  Ventures Talent Network, an invite-only network of elite
  crypto industry professionals.

  By applying and being accepted into the network, you will be
  on our short list of Software Engineer candidates that we
  confidentially share with our portfolio company founders who
  are hiring. We welcome all experience levels and
  specializations to apply.

  Joining is confidential and doesn't commit you into any
  agreement. Candidates in our network will be shared with
  portfolio companies on a case-by-case basis for career
  opportunities as well as receiving invitations to invite-
  only networking events like our Constellations series.

  Galaxy Ventures invests in crypto’s cutting edge founders,
  technologies, and business models across software
  infrastructure, financialized applications, protocols, and
  consumer use cases. Since 2018, we've invested at early
  stages and directly support globally distributed portfolio
  companies spanning the entire crypto ecosystem.

  How it works:

  1) Apply below to join and we'll review your application.
  Upon acceptance into our Talent Network and compatibility
  with an open role, we’ll discreetly share your profile with
  portfolio companies hiring for opportunities that might be a
  fit for you.

  2) If there’s a mutual fit, we’ll facilitate a warm
  introduction directly to our portfolio company.

  3) If timings not right, we'll keep the line of
  communication open and surface opportunities to you as they
  become available.
