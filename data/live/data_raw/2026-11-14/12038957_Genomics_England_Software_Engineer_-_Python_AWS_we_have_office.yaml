description: |
  Company Description

  Genomics England is a global leader in enabling genomic
  medicine and research, focused on creating a world where
  everyone benefits from genomic healthcare. Building on the
  100,000 Genomes Project, we support the NHS’s world-first
  national whole genome sequencing service and run the growing
  National Genomic Research Library, alongside delivering
  numerous major genomics initiatives. By connecting research
  and clinical care at national scale, we enable immediate
  healthcare benefits and advances for the future.

  Our mission is to provide the evidence and digital systems
  so that by 2035 genomics could play a role in up to half of
  all healthcare interactions, whilst securing the UK’s
  position as the best place to discover, prove and benefit
  from genomic innovations.

  We are accelerating our impact and working with patients,
  doctors, scientists, government and industry to improve
  genomic testing, and help researchers access the health data
  and technology they need to make new medical discoveries and
  create more effective, targeted medicines for everybody.

  Behind the Healthcare and Research outcomes, Genomics
  England delivers through designing, developing and operating
  complex healthcare software systems.

  We're on the cusp of big changes with the real prospect of
  genomics becoming the fabric of everyday healthcare through
  the lifetime - from birth to old age.

  Job Description

  Software Engineer - Python & AWS

  Genomics England is hiring an experienced Software Engineer
  with strong Python and AWS experience to join our Scientific
  R&D team, which sits within our Generate Research Data (GRD)
  service. GRD works across our organisation and with external
  partners to generate, obtain and enrich high-quality
  genomic, multi-omic and clinical datasets.

  The service supports the journey from new research studies
  and emerging technologies through to preparing data for
  release into the National Genomic Research Library (NGRL),
  helping enable research, discovery and clinical impact.

  The Scientific R&D team develops and tests new genomic and
  multi-omic approaches and provides scientific expertise
  across GRD. The team operates wet-lab and bioinformatics
  capabilities, including long-read sequencing, data analysis,
  technology assessment and pilot development. It supports
  programmes such as Cancer 2.0 and Generation Study-related
  discovery work, while investigating how emerging
  technologies can be applied to future research.

  This Software Engineer role develops and maintains data
  processing systems within the Scientific R&D team, working
  across a mixture of cloud and on-premises infrastructure to
  support the assessment of cutting-edge sequencing
  technologies for clinical genome sequencing.

  What you’ll be doing: 

  - Thinking through, designing and enabling the future facing
    research cohorts end to end

  - Writing clean, scalable Python code, following engineering
    best practices

  - Developing working solutions to enable processing of long
    read data, including future facing solutions in AWS

  - Designing and maintaining services on AWS, with a focus on
    resilience and performance

  - Working on distributed systems that handle big data
    processing at scale

  - Building and evolving our test automation frameworks

  - Troubleshooting issues, working closely with colleagues

  - Staying up to date with the latest tools, libraries and tech
    approaches

  - Using GitLab, Jira, and Confluence to work effectively in a
    modern agile setup

  What you’ll bring: 

  - Strong Python skills and experience building scalable
    backend services

  - Hands-on experience with AWS, microservice architectures,
    and containerised environments

  - Experience working on data-heavy or distributed systems

  - Familiarity with agile delivery and test-driven development

  - Self-sufficiency combined with a collaborative mindset and
    openness to learning from others

  Nice to have: 

  - Hands on orchestration skills and experience using Terraform

  - Experience with big data tools (e.g. Spark, AWS Glue, or
    similar)

  - Strong grasp of code review best practices

  - Some knowledge of JavaScript

  - Cloud Migration/AWS knowledge

  - Understanding/experience working with orchestration and data
    flows

  - Solution building expertise

  Qualifications

  BSc in Computer Science or equivalent experience

