description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do

  The Physical AI Field Engineering team at CoreWeave brings
  AI into the engineering organizations that design, test,
  validate, and operate physical products. We work alongside
  customer teams to identify high-value problems, build
  solutions against their data and real-world constraints, and
  deploy software that engineers use in their daily workflows.

  As Manager, Field Engineering (Physical AI), you will build
  and lead the operating model for this specialist practice in
  your region. You will combine people leadership, technical
  judgment, customer delivery, and commercial understanding to
  make Physical AI Field Engineering a repeatable, high-
  performing part of CoreWeave’s Field Engineering
  organization.

  - Evolve the operating model for Physical AI Field Engineering
    within your region, from opportunity qualification and
    problem framing through data exploration, model
    development, deployment, adoption, and expansion.
  - Lead, coach, and develop a high-performing team of
    Specialist Field Engineers, Forward Deployed Data
    Scientists, and Forward Deployed Engineers, including
    hiring, workforce planning, career development,
    performance management, and succession planning.
  - Set the technical and delivery bar for customer engagements,
    ensuring that teams build solutions that are grounded in
    engineering criteria, validated against physical
    constraints, and deployed into workflows where they create
    measurable value.
  - Partner directly with strategic customers and senior
    stakeholders across automotive, robotics, aerospace, and
    industrial engineering to understand their priorities,
    shape technical strategy, and maintain executive
    confidence throughout delivery.
  - Work closely with Account Executives, Account Managers,
    Account Solutions Architects, Technical Solutions
    Managers, Product, Engineering, and Platform teams to
    qualify opportunities, allocate specialist capacity, and
    create a consistent customer experience.
  - Build mechanisms that make the team more effective at scale,
    including reusable engagement patterns, delivery
    standards, onboarding, enablement, technical reviews, and
    knowledge-sharing practices.
  - Establish a disciplined field-to-product feedback loop:
    identify recurring customer needs, distinguish reusable
    product opportunities from one-off delivery work, and
    translate field evidence into actionable recommendations
    for Product and Engineering.
  - Own the operating metrics that show whether the model is
    working, including customer value, time to deployment,
    software adoption, delivery quality, team capacity,
    expansion, and infrastructure or SaaS opportunities
    created through engagements.
  - Represent Physical AI Field Engineering internally and
    externally, helping CoreWeave explain how domain
    expertise, applied AI, and the CoreWeave platform combine
    to solve difficult engineering problems.

  Who You Are

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, Physics, Mathematics, or a related technical
    discipline, or equivalent practical experience.
  - 10+ years of experience in technical consulting, field
    engineering, product engineering, applied AI, or a related
    customer-facing engineering discipline.
  - 5+ years of experience leading and developing technical
    teams in a fast-moving environment, with a track record of
    hiring strong people, setting a clear bar, and creating an
    environment where specialists can do their best work.
  - Sufficient technical depth in AI/ML applied to physical
    systems or engineering workflows to engage credibly with
    ML engineers, data scientists, controls engineers,
    simulation specialists, and engineering leaders, and to
    make sound judgments about data, modeling, validation, and
    deployment trade-offs.
  - Experience partnering across Product, Engineering, Sales,
    Marketing, and Field Engineering to align priorities and
    move work from customer signal to delivered capability.
  - Excellent written and verbal communication skills with the
    ability to clearly articulate complex technical topics to
    technical, executive, and customer audiences.

  Preferred

  - Experience in automotive, robotics, aerospace and defense,
    industrial, manufacturing, or another engineering-
    intensive industry.
  - Experience delivering or supporting AI solutions in
    embedded, on-site, production, or safety-critical
    environments.
  - Familiarity with modern ML platforms and workflows spanning
    experimentation, model management, data exploration,
    application development, and cloud deployment.
  - Capable of owning capacity models, hiring plans, creating
    technical career frameworks, delivery KPIs, or portfolio-
    level planning across multiple customer engagements.
  - Track record of converting repeated customer problems into
    reusable software, product capabilities, or standardized
    delivery patterns.

  Wondering if you’re a good fit?

  We believe in investing in our people, and value candidates
  who can bring their own diversified experiences to our teams
  — even if you aren’t a 100% skill or experience match.

  Here are a few qualities we’ve found compatible with our
  team. If some of this describes you, we’d love to talk.

  - You enjoy operating at the boundary between technical depth,
    customer outcomes, and team leadership, and you know when
    to go deep yourself and when to create the conditions for
    others to do their best work.
  - You are excited by the challenge of bringing AI into
    engineering organizations that may not have historically
    worked with dedicated data science teams.
  - You care about building working software that engineers use
    in production, not producing recommendations that someone
    else has to implement.
  - You are comfortable creating structure in an evolving
    environment, while keeping the focus on customer value and
    delivery rather than process for its own sake.
  - You believe the strongest teams learn from every engagement,
    turn repeated lessons into reusable capabilities, and
    share those practices generously across the organization.
  - You want to help shape a category-defining Physical AI
    practice while building a team and operating model that
    can scale with CoreWeave.

  The base salary range for this role is $157,000 to $231,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

