description: |
  Meet the Team

  Cisco ThousandEyes is a Digital Assurance platform that
  empowers organizations to deliver flawless digital
  experiences across every network – even the ones they don’t
  own. Powered by AI and an unmatched set of cloud, internet
  and enterprise network telemetry data, ThousandEyes enables
  IT teams to proactively detect, diagnose, and remediate
  issues – before they impact end- user experiences.

  ThousandEyes is deeply integrated across the entire Cisco
  technology portfolio and beyond, helping customers deploy at
  scale while also delivering AI-powered assurance insights
  within Cisco’s leading Networking, Security, Collaboration,
  and Observability portfolios.

  Your Impact

  As a Senior Software Engineer you will:

  - Design, build, test, and operate near real time data
    streaming-based (Spark/Flink) solutions for some of the
    largest Networking customers in the world.
  - Develop agentic workflows, reusable skills, tool
    integrations, and orchestration capabilities.
  - Integrate AI tools with source control, CI/CD systems, issue
    trackers, documentation platforms, and internal developer
    environments.
  - Build backend services, MCP and APIs that are secure,
    observable, reliable, and easy to maintain.
  - Apply large scale data processing to real time streaming
    telemetry across various domains.
  - Contribute to technical design discussions and help evolve
    the architecture of our AI development platform.
  - Improve engineering processes, documentation, and
    operational practices across the team.

  Minimum Qualifications

  - Professional software development experience using Java
    within a production environment.
  - Experience across the full lifecycle (designing, building,
    testing, and operating) of real-time data processing
    pipelines, utilizing at least one core streaming or real-
    time analytics technology such as Apache Kafka (including
    Kafka Streams), Apache Flink, or ClickHouse.
  - Experience designing and implementing APIs within
    distributed software architectures.
  - Experience with Git, automated testing, Kubernetes, and
    continuous integration and delivery workflow.

  Preferred Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field, and an excellent understanding of
    computer science fundamentals.
  - Familiarity with relational, document-based, or vector
    datastores.
  - Familiarity with AI-assisted development tools such as
    Kosmos, Codex, or Claude.
  - Understanding of containers and modern cloud deployment
    practices.
  - Strong problem-solving and communication skills, with the
    ability to collaborate effectively in a cross-functional
    team.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
