description: |
  This is a US-based remote role. You will be required to
  interview in person. Must be a US citizen as is required by
  FedRAMP standards.

  About SailPoint:

  SailPoint is defining the next era of identity security. Our
  unified, AI-powered platform seamlessly secures both the
  Human Fabric of your workforce and the Agentic Fabric of AI
  and non-human identities, completely eliminating
  organizational blind spots.

  Built on core principles like zero-standing privilege and
  contextualized risk, our platform transforms identity from a
  vulnerability into a strategic business advantage. Today, we
  are trusted by some of the largest, most complex
  organizations in the world to deliver intelligent,
  autonomous identity security at scale.

  About the Role:

  As the Software Engineering Manager for our All SaaS
  Performance and Quality Frameworks portfolio, you will lead
  a group responsible for some of the most crucial aspects of
  our SailPoint Engineering Quality Platform: performance
  engineering and the shared functional testing frameworks
  that enable consistent, scalable product validation.

  As a highly technical and forward-thinking leader, you will
  solve complex challenges around scalability and reliability
  while driving the architecture, expansion, and maintenance
  of reusable functional testing capabilities. You will
  pioneer the use of AI-powered tools such as Cursor and
  Claude Code to accelerate development, test creation,
  framework maintenance, result analysis, and the optimization
  of load, performance, and functional testing workflows.

  You will own the strategy, roadmap, reliability,
  documentation, adoption, and self-service experience for
  shared functional testing frameworks. Product engineering
  teams will continue to own the tests for the features they
  deliver, while your portfolio provides the reusable
  capabilities, standards, and enablement that help them test
  with confidence.

  Stakeholder management is a significant aspect of this role;
  you will work closely with Product Managers, Designers,
  Architects, Quality, DevOps, Product Engineering, and
  Customer Facing teams to drive a culture of performance,
  quality, and innovation.

  About the Team:

  The All SaaS Performance and Quality Frameworks team builds
  and scales the core infrastructure, performance engineering
  platforms, and shared functional testing frameworks utilized
  across all SailPoint engineering teams. We focus on
  developer productivity, reliability at enterprise scale, and
  enabling engineering squads to deliver high-quality, high-
  velocity SaaS products through self-service capabilities and
  cutting-edge AI-assisted workflows.

  Roadmap and Timeline to Success

  Within the first 30 days you will:

  - Onboard into your new role, getting familiar with our
    product offerings, technology stack, and the Top 5 Project
    Initiatives.
  - Get to know your team members, understanding their
    strengths, motivations, and development areas.
  - Evaluate the current performance testing toolchain and
    shared functional testing frameworks; establish baselines
    for adoption, reliability and flakiness, test-development
    cycle time, coverage, and support burden; and identify
    opportunities for AI to enhance test creation, execution,
    maintenance, and analysis.
  - Interview stakeholders across the organization to understand
    our business goals, product roadmap, performance
    challenges, and functional testing enablement needs, while
    clarifying the boundary between shared framework ownership
    and product-team test ownership.

  By 90 days:

  - You are motivating, encouraging, and challenging your team
    to explore and implement innovative, internal AI-driven
    solutions to complex performance and quality-framework
    problems.
  - You have initiated pilot projects using tools like Cursor
    and Claude Code, demonstrating measurable improvements in
    the efficiency of performance script development,
    functional framework development and maintenance, and data
    analysis.
  - You are actively participating in technical decision-making,
    challenging the team to find more optimal and scalable
    solutions, and have established a prioritized roadmap for
    framework expansion, reliability, documentation, and self-
    service.
  - You have established regular syncs with your stakeholders
    and are thinking 2-3 years ahead to develop a long-term
    strategy for scaling the SailPoint Engineering and its
    shared testing capabilities.

  By 6 months:

  - Your team is successfully using AI-powered tools to
    proactively identify performance bottlenecks, improve
    functional testing capabilities, reduce technical debt,
    and deliver actionable insights.
  - Shared functional testing frameworks have expanded to
    prioritized use cases, and evidence shows progress in
    adoption, reliability and flakiness, test-development
    cycle time, coverage, documentation, self-service, and
    support burden.
  - The team has found synergy, is consistently delivering on
    its commitments, and has struck a healthy balance between
    shipping new capabilities and resolving defects.
  - You have earned the trust of your team and are a respected
    partner to your stakeholders.
  - You are attracting and motivating excellent engineers who
    are passionate about building great software and testing
    platforms with the help of AI.

  By 1 year:

  - Your team is operating at high efficiency, with AI tooling
    deeply integrated into daily workflows for performance
    testing, optimization, and functional framework
    development and maintenance.
  - The team’s size and skills are aligned with a forward-
    looking roadmap that fully leverages AI for real business
    results across performance and quality frameworks.
  - You are consistently using data—including framework
    adoption, reliability and flakiness, test-development
    cycle time, coverage, support burden, and insights
    generated from AI analysis—to objectively measure impact
    and optimize engineering processes.
  - You are fostering a culture of continuous learning, coaching
    your engineers to become experts in performance
    engineering, functional testing framework engineering, and
    the application of AI, while enabling product teams to own
    their feature tests through effective self-service.

  Required Experience & Skills

  - Must be a US citizen as is required by FedRAMP standards
  - 2+ years of experience in an engineering leadership role.
  - 8+ years of hands-on experience as a performance or software
    engineer.
  - Bachelor's degree in related field or equivalent work
    experience
  - Proven hands-on experience architecting, expanding, and
    maintaining shared functional testing frameworks,
    libraries, or services used by multiple product teams.
  - Mandatory ability to pursue, measure, and optimize the
    portfolio’s use of AI tooling and drive a measurable
    reduction in engineering and test-development cycle time
    for product features that engage the performance team or
    shared testing frameworks.
  - Mandatory ability to build strong human connections with
    external teams to encourage self-service, drive adoption
    of shared testing frameworks, and secure dedicated time
    for hands-on load, stress, and performance testing of end-
    to-end product functionality.
  - Proven experience leveraging AI-assisted development tools
    (e.g., Cursor, Claude Code) to write, debug, maintain, and
    optimize complex code.
  - Demonstrated ability to select the right AI model and agent
    to solve specific engineering problems, with a focus on
    improving team efficiency and test coverage.
  - Passion for high-performance, high-load SaaS solutions,
    reliable functional testing infrastructure, and best
    practices in performant and testable design.
  - Experience architecting, developing, and supporting highly
    distributed, scalable, and available systems in a public
    cloud environment (preferably AWS).
  - Deep knowledge of microservice architecture, containerized
    CI/CD (Docker, Kubernetes), and agile methodologies.
  - Experience using evidence such as framework adoption,
    reliability and flakiness, test-development cycle time,
    coverage, and support burden to prioritize improvements.
  - Excellent technical documentation and communication skills,
    with an emphasis on creating documentation that is both
    human-friendly and easily consumable by frontier model
    LLMs.
  - Effective leadership, mentoring, and project management
    abilities.

  AI-assisted engineering:

  Our engineers are expected to use AI development tools as a
  core part of their daily workflow, not as a novelty. We
  expect you to use these tools to accelerate delivery, expand
  your scope, and raise the quality bar, while applying strong
  engineering judgment to review, validate, and own everything
  that ships under your name. Comfort with prompting, agentic
  workflows, and human-in-the-loop review of AI-generated code
  is a baseline expectation for this role.

  AI related Technology:

  - Cursor, Claude Code
  - Python-based AI/ML frameworks and libraries such as scikit-
    learn, pandas, and numpy
  - Deep Learning Frameworks such as PyTorch
  - LLMs and Foundation Models in Bedrock, VertexAI, or similar

  Benefits:

  At SailPoint, our identity security innovations are powered
  by a global crew. We are proudly headquartered in Austin,
  Texas, with a beautiful campus that overlooks the scenic 4
  Points Preserve. We embrace a flexible, remote-first work
  culture that prioritizes personal autonomy, trust, and work-
  life balance. Working here is defined by "The SailPoint
  Way"; a highly collaborative and inclusive environment where
  leadership is transparent, "smart jerks" are not tolerated,
  and crew members have the freedom to drive real impact in
  security.

  We provide:

  - Competitive Compensation
  - Flexible Time Off: Trust-based vacation policies alongside
    paid company holidays to help you recharge.
  - Comprehensive Healthcare: Premium medical, dental, and
    vision insurance options
  - Career Growth Opportunities
  - Plus so much more!

  Benefits and Compensation listed vary based on the location
  of your employment and the nature of your employment with
  SailPoint.

  As a part of the total compensation package, this role may
  be eligible for the SailPoint Corporate Bonus Plan or a
  role-specific commission, along with potential eligibility
  for equity participation. SailPoint maintains broad salary
  ranges for its roles to account for variations in knowledge,
  skills, experience, market conditions and locations, as well
  as reflect SailPoint’s differing products, industries, and
  lines of business. Candidates are typically placed into the
  range based on the preceding factors as well as internal
  peer equity. We estimate the base salary, for US-based
  employees, will be in this range from (min-max, USD):

  $140,500 - $236,826.00

  Base salaries for employees based in other locations are
  competitive for the employee’s home location.

  Benefits Overview

  1. Health and wellness coverage: Medical, dental, and vision
  insurance

  2. Disability coverage: Short-term and long-term disability

  3. Life protection: Life insurance and Accidental Death &
  Dismemberment (AD&D)

  4. Additional life coverage options: Supplemental life
  insurance for employees, spouses, and children

  5. Flexible spending accounts for health care, and dependent
  care; limited purpose flexible spending account

  6. Financial security: 401(k) Savings and Investment Plan
  with company matching

  7. Time off benefits: Flexible vacation policy

  8. Holidays: 8 paid holidays annually

  9. Sick leave

  10. Parental support: Paid parental leave

  11. Employee Assistance Program (EAP) and Care Counselors

  12. Voluntary benefits: Legal Assistance, Critical Illness,
  Accident, Hospital Indemnity and Pet Insurance options

  13. Health Savings Account (HSA) with employer contribution

