  Are you ready to make your mark?

  About the Role  Intermedia is looking for a Senior Software
  Engineer Backend to join our organization. In this role, you
  will design and build the backend services, APIs, and data
  capabilities that power intuitive analytics, visualizations
  across Intermedia's products.

  You will help transform complex product and customer data
  into reliable, performant, and easily consumable information
  that enables users to understand trends, identify
  opportunities, and make better decisions.

  You will work closely with frontend engineers, AI/ML
  engineers, data engineers, product managers, and UX teams to
  bring sophisticated insights into compelling customer
  experiences. This is a great opportunity for an experienced
  backend

  engineer who enjoys solving complex data and distributed
  systems challenges and wants to help redefine how customers
  interact.

  What You Will Be Doing

  • Design, develop, test, and maintain scalable backend
  services and APIs that power analytics, dashboards and
  visualizations.

  • Build services that process, aggregate, enrich, and serve
  structured and unstructured data for interactive analytics
  experiences.

  • Develop APIs and data services optimized for efficient
  consumption by dashboards, visualizations, reporting
  interfaces, and other customer-facing experiences.

  • Build backend capabilities that enable users to explore,
  filter, compare, drill into, and understand complex datasets
  and insights.

  • Partner closely with frontend engineers and UX teams to
  define service interfaces and data structures that enable
  intuitive, responsive visualization experiences.

  • Work with data engineers to establish reliable data flows
  between source systems, analytical platforms, visualization
  services, and downstream applications. • Collaborate with
  product managers and engineering teams to translate customer
  and business needs into scalable technical solutions.

  • Contribute to technical design decisions for backend
  services, analytics APIs, data models, processing workflows,
  caching strategies, and integrations.

  • Design systems that deliver timely and accurate analytics
  while maintaining appropriate data quality and consistency.

  • Optimize data access, aggregation, and service performance
  to support responsive and interactive customer experiences.

  • Design backend capabilities that can support both
  predefined analytics experiences and more dynamic
  exploration of data.

  • Analyze and improve the performance, scalability,
  reliability, and maintainability of analytics services.

  • Write high-quality, readable, testable code that follows
  established engineering standards and best practices.

  • Participate in code and design reviews and contribute to
  strong engineering and quality practices across the team.

  • Troubleshoot and resolve complex issues across backend
  services, analytics workflows, data processing, and frontend
  integrations.

  • Build appropriate monitoring, logging, testing, and
  observability into production services.

  • Collaborate with DevOps and platform teams to support
  reliable deployment and operation of Analytics
  Visualizations services.

  • Stay current with emerging technologies and engineering
  approaches related to analytics, data visualization, data
  processing, and backend development.

  • Participate in continuous improvement initiatives that
  enhance product performance, reliability, customer
  experience, and engineering efficiency.

  What You Will Bring to the Role

  • Bachelor's degree in Computer Science, Software
  Engineering, or a related technical

  field, or equivalent practical experience.

  • 5+ years of professional software engineering experience,
  with demonstrated

  experience developing backend applications and services.

  • Strong proficiency in one or more backend programming
  languages and associated

  frameworks.

  • Experience designing and developing RESTful APIs,
  microservices, or other service-

  oriented applications.

  • Solid understanding of software design principles, data
  structures, algorithms, and

  distributed systems concepts.

  • Experience working with relational and/or NoSQL databases.

  • Experience designing applications that process, transform,
  aggregate, or serve significant

  volumes of data.

  • Experience developing backend services or APIs that
  support data-rich, interactive

  applications.

  • Experience building and supporting scalable, reliable
  production applications.

  • Understanding of data modeling, aggregation, filtering,
  querying, and other patterns

  commonly used in analytics applications.• Working knowledge
  of cloud platforms such as AWS or Azure and cloud-based

  application architectures.

  • Familiarity with automated testing, CI/CD, source control,
  and modern software

  development practices.

  • Strong understanding of application performance and the
  ability to optimize services and

  data access for responsive user experiences.

  • Strong problem-solving skills and the ability to
  independently investigate and resolve

  complex technical issues.

  • Strong communication and collaboration skills with the
  ability to work effectively across backend, frontend, data,
  UX, and product teams.

  • Working understanding of Agile development methodologies
  and frameworks.

