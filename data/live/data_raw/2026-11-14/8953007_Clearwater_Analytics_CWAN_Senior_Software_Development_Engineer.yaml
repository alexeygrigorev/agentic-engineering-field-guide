description: |
  Job Summary:



  We are seeking a skilled and motivated Senior Software
  Engineer to join our dynamic team at CWAN. The role joins
  our Beacon Core Engineering team. The Core team develops
  large part of Beacon Cloud, just above the Platform
  abstraction. It deals with the developer tools (SDLC) that
  we offer to clients and use internally - IDE including Cline
  integration, Code Review, Test Framework, Release process;
  also runtime execution - batch scheduler, super computer
  scheduler, containerization, coding libraries - dependency
  graph and deal model used by the financial layer and clients
  directly.

  In this role, you will be responsible for designing,
  building, deploying, and maintaining high-quality code while
  collaborating with cross-functional teams to enhance our
  software offerings. This position is ideal for an engineer
  who is driven by client satisfaction and has a strong
  commitment to continuous learning and improvement. We use AI
  agents to speed up development safely and at same time help
  clients achieve the same.





  Responsibilities

  - Design, build, deploy, and maintain quality code that is
    simple, well-structured, clear, and well-tested.
  - Use AI agents to speed up development and advise others how
    to use them safely, both clients and internally.
  - Break down and solve complex problems efficiently, utilizing
    research and collaboration as needed.
  - Communicate effectively across various mediums, with
    different audiences, and at appropriate times.
  - Implement and maintain multiple levels of automated testing
    (e.g., unit, integration, contract, end-to-end).
  - Mentor new and less-experienced team members, sharing
    knowledge and best practices.
  - Lead design and feature discussions, advocating for
    enhancements in software performance, scalability,
    reliability, and security.
  - Coordinate with cross-functional teams to ensure successful
    integration of software applications.
  - Troubleshoot and resolve production incidents promptly and
    effectively.
  - Understand customer needs and address issues with empathy
    and a sense of urgency.
  - Undertake any other reasonable activities required by
    management.



  Required Skills

  - Excellent proficiency in Python
  - Experience with TypeScript or Javascript, and Rust would be
    a strong plus
  - Familiarity with C++ is a plus.
  - Experience in Financial domain is a plus.
  - Strong command of a typed, object-oriented programming
    language.
  - Deep knowledge of software methodologies, tools, and common
    architectural patterns.
  - Passion for working in a software-as-a-service environment.
  - Strong focus on client satisfaction and user experience.
  - Excellent teamwork and collaboration skills.
  - Ability to manage time effectively and deliver results
    within deadlines.
  - Commitment to continuous learning and professional
    development.
  - Exceptional analytical and problem-solving skills.
  - Proficient in Microsoft Office and other essential computer
    applications.
  - Attention to detail and strong documentation capabilities.
  - Outstanding verbal and written communication skills.
  - Strong organizational and interpersonal skills.



  Education and Experience:

  - Degree in Computer Science or related field.
  - 5+ years of software development experience using Python or
    any other OOP languages.
