description: |
  Machinify is a leading healthcare intelligence company with
  expertise across the payment continuum, delivering unmatched
  value, transparency, and efficiency to health plan clients
  across the country. Deployed by over 85 health plans,
  including many of the top 20, and representing more than 270
  million lives, Machinify brings together a fully
  configurable and content-rich, AI-powered platform along
  with best-in-class expertise. We’re constantly reimagining
  what’s possible in our industry, creating disruptively
  simple, powerfully clear ways to maximize financial outcomes
  and drive down healthcare costs.

  Location: Remote – US Salary Range: $225,000–$260,000 base,
  plus equity and benefits (MGR level evaluated through our
  interview process)

  The Role

  We're hiring a Technical Senior Engineering Manager to lead
  the engineering team for Coordination of Benefits (COB).
  This is a new need as we expand our right payer solutions
  products! You'll build a scalable, AI-driven, cloud-native
  solution that transforms how COB is done. Making it faster,
  more accurate, and more efficient. Our Coordinate product
  will be core to how we identify overlapping coverage,
  determine primacy, and recover dollars, ultimately helping
  reduce the cost of care for millions of members.

  You'll be leading the team building this product from the
  ground up! You will set the technical direction and
  engineering bar for a new product and a growing team,
  establishing strong principles from the outset and making
  sound architectural decisions under genuine ambiguity. You
  will lead a team of 5–6 engineers that’ll partner closely
  with product, platform, DS, ML, UX, QA and operations team.
  This is a great opportunity for someone with high technical
  ownership to lead a team shaping a product as we build 0-1!

  What You'll Do

  Engineering & Team Leadership

  - Own the architecture, technical roadmap, and production
    releases for CORA, holding the team accountable for
    quality, reliability, and delivery pace
  - Stay hands-on through architectural design, code review, and
    selective coding where it sets the technical bar for the
    team
  - Hire, develop, and retain a team of 5–6 engineers, with
    deliberate investment in coaching, career growth, and
    performance management
  - Establish the engineering standards, operational practices,
    and delivery rhythm appropriate to an early-stage
    greenfield product
  - Guide the design of the core rules engine, the claims
    pipeline, and the AI innovation that moves COB
    determinations to be more accurate and efficient
  - Drive platform decisions for extensibility, scalability, and
    the security that regulated healthcare data demands as
    CORA onboards new payers

  Cross-Functional & Stakeholder Leadership

  - Partner with product, ML, UX, and operations to translate
    evolving payer and analyst requirements into scoped,
    sequenced work with measurable targets
  - Align stakeholders across teams on priorities, tradeoffs,
    and timelines, and drive cross-functional decisions
    cleanly to closure
  - Define and report the metrics that demonstrate engineering
    and product impact to leadership and to partner teams
    across the company
  - Represent the team to executive and customer audiences,
    presenting results and clear articulation of technical
    strategy

  What You Bring

  - 3+ years of combined technical leadership and engineering
    management
  - 8+ years building production backend services and
    applications
  - Hands-on experience building and operating microservice
    architectures oncontainers and orchestration (Docker,
    Kubernetes) with strong observability
  - Proficiency in Java, GoLang, Scala, or Rust
  - Proven track record hiring, developing, and managing high-
    performing engineering teams, including performance
    management
  - Demonstrated success leading cross-functional initiatives
    and aligning product, ML, and business stakeholders toward
    shared outcomes
  - Excellent communication skills, including translating
    technical tradeoffs for non-technical audiences and
    presenting to executives
  - Demonstrated ability to drive ambiguous, open-ended problems
    to closure with measurable outcomes
  - Power-user fluency with Claude Code or Codex for planning,
    building, and debugging non-trivial work
  - BS or MS in Computer Science or equivalent

  Strongly Preferred

  - Experience building greenfield products and establishing
    engineering standards for a new team
  - Experience in healthcare, insurance, finance, or other high-
    stakes domains where "mostly right" is unacceptable
  - Familiarity with claims, payments, or coordination-of-
    benefits and payment-integrity workflows
  - Experience designing high-throughput rules or decisioning
    engines that evaluate logic against large data volumes in
    near real time
  - Experience operating systems on regulated data (PHI/PII),
    including the security and compliance controls production
    healthcare requires
  - Experience shipping AI- or ML-driven features in production,
    including how they are evaluated and earn the business's
    trust
  - Track record defining and owning business-trusted metrics
    such as precision/recall and dollar-weighted impact
  - Experience with lightweight operational practices such as
    on-call, incident review, and release management

  What We Offer

  - Work from anywhere in the US! Machinify is digital-first.
  - Top Medical/Dental/Vision offerings
  - FSA/HSA
  - Tuition reimbursement
  - Competitive salary, 401(k) with company match
  - Unlimited PTO
  - Additional health and wellness benefits and perks
  - Flexible and trusting environment where you’ll feel
    empowered to do your best work

  The salary and level for this position is based on an array
  of factors unique to each candidate: Such as years and depth
  of experience, set skills, certifications, etc. We are
  hiring for different levels, and our Recruiting team will
  let you know if you qualify for a different role/range.
  Salary is one component of the total compensation package,
  which includes meaningful equity, excellent healthcare,
  flexible time off, and other benefits and perks.

