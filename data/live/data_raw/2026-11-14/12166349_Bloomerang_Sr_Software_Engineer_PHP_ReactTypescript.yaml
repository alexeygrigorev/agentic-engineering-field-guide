description: |
  At Bloomerang, we believe change happens on purpose. We
  champion the power and potential of nonprofits, igniting
  next-level impact with the team and technology built for
  purpose. Our powerful giving platform and stellar support
  enable tens of thousands of nonprofits to raise more,
  recruit more, and retain more, fueling maximum impact and
  raising the bar on what’s possible for the nonprofit sector.
  That's why, even as the nonprofit sector sees declines in
  giving, Bloomerang customers raise more year over year.

  We're also in the business of creating thriving employees.
  Join a mission-driven culture built on our core values of
  Simplify, Care and Act. We know our people are the key to
  our success, and we're proud to be home to some of the most
  innovative and skilled individuals in the workforce today.
  Come feel invigorated and unstoppable with us!



  The Role

  As a Senior Full-Stack Software Engineer on the Events &
  Auctions team, you'll help build the tools nonprofits use to
  run galas, auctions, and live fundraising events. You'll
  take a problem from "what do our customers need?" all the
  way to working software in production: the React interface,
  the PHP behind it, and the data underneath. The work leans
  heavier toward the frontend than the backend, and you'll
  work alongside Product, QA, and fellow engineers to deliver
  a complete solution rather than handing work across a stack
  boundary.

  The problems we work on are rarely fully specified. We're
  looking for someone who can make progress with 70% of the
  picture, state their assumptions, and keep moving; who sees
  work through to done, including the tests, the rollout, and
  the follow-up; and who makes the people around them better.
  AI tools are part of how our team builds software every day,
  and we expect you to use them well and keep learning as they
  change.



  What You Will Do

  - Own solutions end to end. Shape the approach, build the UI,
    write the PHP services and APIs, design the data changes,
    test it, and ship it safely behind feature flags.
  - Solve real problems. Find the actual problem behind the
    request, work through ambiguity, and drive it to a genuine
    resolution rather than a plausible-looking one.
  - Work with AI as a normal part of the job. Use tools like
    Claude Code day to day for coding, debugging, research,
    and review, and apply the judgment to tell a real fix from
    a convincing one.
  - Build quality in. Write unit, component, Storybook,
    Playwright, and PHPUnit tests, and give and receive
    thoughtful code review.
  - Diagnose production issues. Use logs, Sentry, and system-
    level knowledge to find root causes and keep them from
    coming back.
  - Collaborate across disciplines. Partner with Product, QA,
    and the mobile engineers who build our iOS and Android
    terminals, and communicate tradeoffs clearly.



  What You Need to Succeed

  - Deep, recent experience with React and TypeScript in
    production, including state management (Redux Toolkit or
    similar).
  - Strong, recent professional experience with PHP (8.x
    preferred). PHP is required.
  - AI proficiency. Hands-on, day-to-day experience building
    with AI coding tools such as Claude Code or GitHub
    Copilot, including prompting and giving context
    effectively, and critically verifying AI-generated code
    with tests and review before it ships.
  - Strong modern web fundamentals: accessible, responsive UI,
    Tailwind or utility-first CSS, and reusable component
    design.
  - Strong SQL and relational database skills (MySQL), including
    query design and performance.
  - Solid understanding of REST API design, async/queue-based
    processing, caching (Redis), and production debugging and
    observability.
  - Experience with automated testing across the stack
    (Vitest/Jest, React Testing Library, Storybook,
    Playwright, PHPUnit).



  How You Work

  - You solve problems and drive them to resolution. You make
    progress when the ticket is vague, ask good questions
    without stalling, make a reasonable call and say what you
    assumed, and consider what your change touches beyond the
    lines you edited.
  - You take ownership. You treat the work as yours through to
    done, including the unglamorous parts, and you flag a
    slipping commitment as soon as you know rather than at the
    deadline.
  - You learn quickly and adapt. You pick up new areas without
    needing the same explanation twice, move between projects
    without friction, and adopt better ways of working,
    including AI tools, before being told to.
  - You're coachable. You take feedback as information, change
    your mind on evidence, and hold high standards for your
    work with low ego.
  - You multiply the people around you. You mentor, review
    thoughtfully, write things down, and leave the next person
    better positioned than you found them.
  - You've been the senior engineer on a team. You are able to
    influence technical direction without formal management
    authority.
  - You heavily leverage AI development tools. You use Claude
    Code or GitHub Copilot in your daily work and can show how
    they've improved the quality and speed of what you
    deliver.

  Nice to Haves But Not Required

  - Twig, Psalm/PHPStan, and modern PHP tooling
  - Real-time web experience (SSE, WebSockets) or live-event and
    auction systems
  - Payments or PCI-aware development experience
  - AWS (SQS, Kafka, S3) and Docker-based local development
  - Mobile (Swift/Kotlin) familiarity
  - CRM or nonprofit/fundraising platform experience

  Benefits

  Health + Wellness You’ll have access to generous health,
  vision, and dental insurance options as well as
  HealthiestYou, a healthcare service that offers convenient,
  confidential access to quality doctors 24/7, anytime,
  anywhere.

  Time Off You'll get a competitive PTO package that includes
  20 PTO days, 3 flex days, 4 optional volunteer days, 12 paid
  holidays, as well as paid parental leave. More is more!

  401k You'll receive a 401k match to help invest in your
  future.

  Equipment Everything you need to be successful, shipped
  right to your door. You got this. We got you.

  Compensation  The salary range for this position is $114,800
  - $191,400. You may also be eligible for a discretionary
  bonus. Actual compensation within the range will be
  dependent on your skills, experience, qualifications, and
  location, as well as applicable employment laws

  Location This is a permanent, full-time, fully remote
  position (within the U.S. and select Canadian Provinces
  only). Employees living in Indianapolis, IN are welcome to
  work from our company headquarters. We do not offer Visa
  sponsorship or relocation assistance at this time.

  Accommodations Applicants who require accommodations may
  contact careers@bloomerang.com to request an accommodation
  in completing an application.

  Bloomerang is an Equal Opportunity Employer. Individuals
  seeking employment at Bloomerang are considered without
  regard to race, color, religion, national origin, age, sex,
  marital status, ancestry, physical or mental disability,
  veteran status, gender identity, or sexual orientation.

  Bloomerang uses artificial intelligence (AI) tools to help
  find candidates, review and rank applications against job
  requirements, and take interview notes. AI does not make
  hiring decisions. People review every application and every
  AI recommendation, make all rejection decisions, and make
  all final hiring decisions.
