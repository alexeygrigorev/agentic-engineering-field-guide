description: |
  About Us:

  The United States has the poorest maternal and birth
  outcomes of all developed countries with the underserved,
  Black, Brown, Indigenous communities disproportionately
  affected. Nadia Care is working to drastically change the
  experience of affected communities by reimagining how we
  deliver meaningful and compassionate care to expectant moms.

  Nadia Care’s mission is to improve pregnancy, birth and the
  postpartum journey for women and their families by
  reimagining how maternity care is delivered. Our team is
  focused on building trust-based engagement and wrap-around
  support for expectant moms at home, in person and virtually
  to ensure they have all the social support they need for a
  successful and joyful pregnancy journey. We help our members
  with care navigation, doula support, assistance with
  lactation, nutrition, housing, transportation and a wide
  range of other needs. We leverage technology to support our
  virtual engagement that allows us to meet all our moms where
  they are.

  We ensure that our members have trusted sources for support,
  resources, and information throughout their pregnancy,
  delivery and well into postpartum. Nadia Care does not
  replace the primary obstetrician or doctor’s relationships.
  Instead, we support expectant mothers with all other health-
  related social needs not typically available through their
  doctors’ offices.

  Our Values:

  - Empathy is at the heart of everything we do. We must always
    center the experiences of the mothers and families we
    serve, as well as support and uplift one another.
  - Collaboration is what makes us stronger. We achieve the
    greatest impact when we work together, share knowledge,
    and elevate each other’s strengths.
  - Resilience reflects our ability to push through challenges,
    adapt in a fast-changing environment, and remain committed
    to our mission no matter the obstacles.

  The Role:

  Nadia Care is looking for a Senior Full-Stack Engineer to
  join our mission-driven engineering team. You will be a
  high-impact individual contributor responsible for building
  and scaling technical solutions that improve maternal health
  outcomes. This role requires a blend of product-minded
  development and a deep commitment to operational excellence
  in a regulated healthcare environment.

  You will collaborate closely with product, clinical,
  operational, and business stakeholders to build our next
  generation care team and member facing applications.

  Key Responsibilities

  - Full-Stack Development: Design, build, and maintain scalable
    features across our mobile web platforms using React and
    Python.
  - Care-Team Automation: Develop AI-native workflows to
    automate internal administrative tasks, such as AI-
    assisted documentation and member summaries, to reduce
    manual work for our care team.
  - Production Reliability: Own the stability and performance of
    the production environment, utilizing tools like Datadog
    for monitoring and ensuring HIPAA compliance for PHI.
  - Technical Standards: Set high standards for code quality,
    testing methodologies, and deployment automation within a
    small, agile team.
  - Collaboration: Partner closely with Product, Data, and
    Clinical Ops teams to translate complex healthcare
    workflows into practical, high-leverage technical
    solutions.

  Required Qualifications

  - 5+ years of experience as a full-stack engineer, ideally
    within a early stage startup.
  - Expert-level skills in Python, SQL, Typescript/Javascript,
    and CSS.
  - Deep experience with modern React, MaterialUI, and Tailwind
    CSS.
  - Prior experience working in regulated environments (e.g.,
    healthcare, fintech) and a strong understanding of
    HIPAA/PHI security requirements.
  - Ability to navigate technical ambiguity and a proven track
    record of shipping practical solutions to messy workflow
    bottlenecks.
  - Problem solver who prioritizes iteration and business impact
    over perfection
  - Experience with AWS and IaC (AWS CDK, Terraform) strongly
    preferred.

  Why join us:

  Working with us is a chance to build something from the
  ground up, shape the future of maternal health, and grow
  with a team that values impact, ownership, and care. As an
  early team member, you’ll help define how we deliver care
  and support at scale.

  At Nadia Care, we recognize that great talent deserves great
  rewards. The expected base salary for this position is
  between $140K - $155K annually, based on relevant and direct
  experience.

  Our Interview Process

  At Nadia Care, we value transparency and want you to feel
  prepared at every stage of your candidate journey. Below is
  our standard interview process for this role:

  - Recruiter Interview | 30 minutes
  - Async Codility Technical Assessment | 70 minutes (2-day
    window)
  - Hiring Manager Interview | 1 hour
  - Collaborator Interviews
  - Executive Leadership Interview | 30 minutes

  Please note that this process is subject to change, but we
  will always keep you informed along the way.

  For full-time employees, we offer a comprehensive benefits
  package designed to support you both professionally and
  personally:

  Time Off That Works for You

  - Recharge with annual paid holidays off.
  - Full-Time Salaried Employees (Exempt): Enjoy unlimited time
    off after the 90-day introductory period.
  - Full-Time Hourly Employees (Non-Exempt): Receive three weeks
    of paid time off after the 90-day introductory period.

  Comprehensive Health & Wellness Coverage

  - Medical Insurance: Access top-tier healthcare, covering
    hospital, surgical, and prescription drug benefits.
    Coverage begins the first of the following month.
  - Dental Insurance: Coverage for preventive care, as well as
    basic and major procedures.
  - Vision Insurance: Coverage for routine eye exams and
    eyeglasses.

  Security & Future Planning Options

  - Stock Option Grant: We believe in shared success.
  - Life Insurance: Financial protection for your beneficiaries.
  - Disability Insurance: Short-term and long-term coverage in
    case of illness or injury.
  - 401(k) Retirement Plan: Opportunity to save for the future.

  We’re building something great and want you to be part of
  it. If you're looking for a fast-paced, dynamic environment
  where your contributions make an impact, apply today!

  Remote positions are open to candidates in the contiguous US
  only. Due to operational and compliance requirements, we are
  unable to hire candidates residing in ND, AL, HI, PR or
  outside the contiguous US.

  Please note that our recruitment team will only contact
  candidates via an official company email address ending in
  @nadiacare.com. Be cautious of scams; Nadia Care will never
  ask for financial information or payments at any stage of
  the hiring process.
