description: |
  Join the Utility Team!

  Utility is an end-to-end mobile app and digital platform
  agency, focused on designing and engineering innovative,
  transformative technology. Our clients are premier global
  brands and new ventures across the wellness, fitness,
  entertainment, streaming, and educational spaces. Founded by
  digital leaders from companies like Major League Baseball
  and McCann Erickson, Utility is built by folks who have been
  on the other side of the table. We treat every project as if
  it were our own, from startup ventures to blue-chip brands.

  What You'll Do

  Senior Backend Engineers are key members of our engineering
  team, building the back-end services and infrastructure
  essential to our client’s products. Over time, we expect you
  to grow by learning and practicing technical ownership,
  promoting best practices in coding and architecture,
  collaborating with and mentoring other members of the
  engineering team, and becoming a vocal advocate of our
  engineering-forward culture.

  Our clients rely on us to build and grow their businesses
  and we are committed to building fast and scalable products
  that people love, all while using best practices and the
  latest technologies.

  Qualifications

  - 8+ years of professional experience developing web
    applications and other modern web technologies.
  - 4+ years experience with Node/TypeScript.
  - Track record designing scalable architectures for high-
    performance web and mobile delivery.
  - Ability to engineer simple and elegant solutions to
    challenging problems.
  - Ability to design and engineer secure RESTful APIs.
  - Estimating and tracking tasks using Agile methodologies.
  - Enthusiastic about learning and applying new cutting-edge
    technologies.
  - Taking ownership of your own work.
  - Having excellent interpersonal and communication skills and
    are able to convey technical solutions.

  Benefits

  - Competitive salary
  - 100% remote
  - PTO policy: unlimited (within reason)
  - Holidays policy: Local holidays apply
  - Additional benefits: Growth Potential, Flexible Work
    Location, Company Branded Swag Package, Professional
    Personal Development Support
