description: |
  This is a remote position.



  About the Team



  You'd be joining a product group focused on making cloud
  data costs easier to understand and optimize. It started a
  few years ago from a simple frustration — the lack of a good
  tool for spotting savings and managing data-warehouse spend
  — and grew once it became clear plenty of other
  practitioners felt the same way. Today it's a small, tight-
  knit crew serving a healthy and growing customer base,
  shipping improvements to users on a near-weekly basis.




  The team operates with a lot of autonomy: lean, efficient,
  and holding onto the values and working habits that let a
  small group move quickly.




  The Opportunity



  As a Senior Software Engineer, you'll help take the product
  to its next stage by designing and building new
  capabilities. You'll work closely with founding team members
  and fellow engineers, and you'll have real input into both
  the roadmap and the technical design.




  What You'll Do



  Alongside the rest of the engineering team, you'll be:




  - Building cost-management features — forecasting, anomaly
    alerts, cost allocation — that make staying on top of
    spend effortless
  - Crafting reusable, resilient UI components that keep the
    cost-exploration experience smooth
  - Creating fresh data-visualization capabilities to convey
    performance, query timing, and efficiency in new ways
  - Developing data pipelines and transformation models that
    surface new insights and opportunities for users
  - Strengthening the reliability and performance of the
    application



  We're also looking for people who can:




  - Zero in on the problems that matter most, weighing tradeoffs
    to deliver the highest-impact outcomes for customers as
    fast as possible
  - Own features end to end — from shaping the initial design
    and plan through implementation, testing, and release
  - Move quickly and pragmatically, trusting strong instincts
    while balancing speed against depth
  - Hold a high bar for collaboration and communication, whether
    that's a clear written proposal, solid documentation,
    readable commit messages, or thorough testing












    Requirements

  What We're Looking For



  - Experienced engineers with a backend and data-engineering
    skill set
  - Solid working knowledge of Python, FastAPI, Postgres, dbt,
    Dagster, and Snowflake
  - Comfort with system design
  - Excellent written and verbal English
  - Self-directed, goal-oriented, and motivated — confident,
    thorough, and persistent
  - Able to stay effective and flexible in a fast-moving,
    evolving environment
  - A good sense of humor and a genuine enjoyment of the work



  Bonus Points



  - Familiarity with the problem space (FinOps, cloud-
    infrastructure cost management, data-warehouse management
    and observability)
  - Experience in an early-stage startup



  How We Work



  We're a distributed team that values flexibility, ownership,
  and balance — the freedom to structure your work around your
  life, plus real support for growing your skills both
  professionally and personally. At our core, we're
  entrepreneurial, curious, and here to have fun while we do
  good work.
