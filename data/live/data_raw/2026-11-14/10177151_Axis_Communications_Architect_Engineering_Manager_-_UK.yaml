description: |
  Job Title

  Architect & Engineering Manager - UK

  Job Description

  Are you passionate about building meaningful relationships
  and positioning innovative solutions within the security
  industry? As our new Architecture & Engineering (A&E)
  Manager, you'll shape how consultants and specifiers across
  the Midlands and South West discover and design with Axis
  solutions. This is a home-office-based role covering the
  UK's Midlands and South West region.

  Who is your future team?

  You'll be joining the UK & Ireland sales organisation,
  working alongside regional sales and end customer teams who
  are dedicated to growing Axis's presence in one of our key
  markets. The team thrives on collaboration, knowledge-
  sharing, and a shared ambition to position Axis as the
  trusted advisor in the video surveillance industry. You'll
  also be part of a virtual global network of A&E peers across
  Axis sales regions worldwide - meaning you'll always have
  access to best practices and fresh ideas.

  What you'll do here as Architecture & Engineering Manager

  As our A&E Manager, you'll be the bridge between Axis and
  the consultant community, ensuring our solutions are
  understood, specified, and championed. You'll drive thought
  leadership, educate specifiers, and build a strong project
  pipeline - all while representing the best of the Axis
  brand.

  - Cultivate and manage relationships with A&E programme
    members, and build connections with new consultants in
    this space
  - Advise consultants on specifications for Axis network
    products and support the development of focus accounts
    within the A&E programme
  - Proactively educate the consultant community on key industry
    challenges, positioning Axis as a thought leader and
    trusted advisor
  - Train specifiers on Axis design tools to improve system
    design accuracy and their operational efficiency
  - Define strategy and actions aligned with the EMEA, Northern
    and Eastern Europe (NEE), and UK & Ireland regional
    priorities
  - Align A&E programme activities with sales teams to build a
    project pipeline through product specification into new
    projects
  - Collaborate with A&E peers from Axis sales regions worldwide
    to develop and share best practices

  Who are you?

  We're looking for someone who is proactive, independent, and
  energised by building relationships. You communicate clearly
  and confidently at all levels, and you understand the value
  of long-term partnerships. You have a flair for demand
  creation - you think creatively, develop new initiatives,
  and bring a results-oriented, positive approach to
  everything you do.

  What we're looking for:

  - Degree in Engineering or equivalent professional experience
  - Demonstrated ability to develop and execute business plans
    that deliver strong results
  - Engaging presentation and communication skills, comfortable
    presenting to diverse audiences
  - Experience building and nurturing professional networks and
    stakeholder relationships
  - Fluent in English, written and spoken

  Bonus points for:

  - Active participation in industry forums and associations
  - Familiarity with CRM platforms such as Salesforce
  - Experience within the security, surveillance, or building
    technology sectors

  Travel: Regular travel primarily across the UK Midlands and
  South West region, with occasional trips to the Nordic
  countries.

  What Axis has to offer

  We are a world leader in network video, where cutting-edge
  technology meets global impact. Here, you'll contribute to
  meaningful projects that shape the future of security and
  surveillance — developing solutions used worldwide.

  As a fast-growing company, we offer exciting career
  opportunities. You'll grow professionally through continuous
  learning, supported by a collaborative team that values
  creativity, innovation, and work-life balance. Our culture
  is characterised by openness, curiosity, trust, and honesty
  — we care about your individual progress and about you as a
  person.

  Ready to Act?

  Axis is a company realising the benefits of a diverse
  workforce. We know that diversity in groups creates a better
  working environment and promotes creativity, something that
  is fundamental for our success. We welcome all applications.
  If you need any adjustments to the recruitment process,
  please let us know — we're happy to accommodate.

  We review applications continuously, so don't wait — send in
  your application today!

  In case of questions, please reach out to Simon Green,
  Manager, Strategic Accounts and A&E — UK & Ireland, at
  simon.green@axis.com.

