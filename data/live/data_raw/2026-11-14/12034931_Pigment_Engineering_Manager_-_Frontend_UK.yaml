description: |
  Join Pigment: The AI Platform Redefining Business Planning



  Pigment is the AI-powered business planning and performance
  management platform built for agility and scale. We connect
  people, data, and processes in one intuitive platform, with
  AI agents that work alongside every team, from Finance to
  HR, to build, adapt, and align strategic plans in real time.
  Founded in 2019, Pigment is one of the fastest-growing SaaS
  companies globally, passing $100M in ARR in 2026 and
  doubling revenue for the second year in a row. Industry
  leaders like Unilever, Uber, Anthropic, Snowflake, and
  Siemens use Pigment every day to make better-informed
  decisions and navigate any scenario with confidence. In
  October 2026, we raised a $250M Series E at a $2.3B
  valuation, bringing our total funding to $650M+. Today we’re
  a growing team of 700+ across Paris, London, New York,
  Toronto, San Francisco, and Austin, and we’ve been named a
  Visionary in the Gartner® Magic Quadrant™ for Financial
  Planning Software two years running. At Pigment, we take
  smart risks, celebrate bold ideas, and challenge the status
  quo - all while working as one team. If you’re driven by
  innovation and ready to make an impact at scale, we’d love
  to hear from you.

  You’ll join Pigment’s Reporting & Collaboration community,
  working as a senior hands-on Frontend Engineer on some of
  the most complex parts of the product.

  This community is responsible for how users access,
  configure and interact with their data. That creates
  significant frontend challenges around large-scale datasets,
  filtering, visualisation, complex configuration and
  increasingly AI-powered experiences.

  On the engineering part:

  - Spend approximately 80% of your time as a hands-on engineer,
    designing, building and shipping production features.
  - Work on complex, data-heavy frontend problems where
    performance, usability and scale all matter.
  - Build sophisticated interfaces for displaying, filtering and
    interacting with large datasets.
  - Work with React, TypeScript and JavaScript, while
    contributing to the wider technical decisions behind the
    product.
  - Partner closely with Product Managers, Product Designers and
    Engineers to take features from problem definition through
    to production.
  - Make pragmatic engineering decisions based on the needs of
    the product and its users, rather than pursuing technical
    complexity for its own sake.
  - Contribute to areas across Reporting & Collaboration
    depending on business needs and your interests, including
    data extraction and filtering, visualisation, complex
    configuration and emerging AI experiences.
  - Use modern engineering tooling, with Pigment teams working
    across GCP, CircleCI and AI development tools such as
    Claude Code, Cursor and GitHub Copilot.

  On the people management part, here is what it entails:

  - Spend approximately 20% of your time on people management.
  - Gradually take on direct reports after establishing yourself
    as an IC during your probation period.
  - Coach engineers across different teams within the Reporting
    & Collaboration community.
  - Support engineers with career progression, development,
    feedback and performance.
  - Run regular 1:1s and help engineers understand what they
    need to do to progress.
  - Set clear expectations and provide actionable feedback.
  - Handle difficult performance conversations when necessary
    and follow through with clear development plans.
  - Partner with Tech Leads to understand how your reports are
    performing technically without taking ownership of the
    Tech Lead's responsibilities.
  - Help create an environment where strong engineers can
    continue to develop while doing their best work.

  Who you are

  - Significant professional software-engineering experience,
    with the technical depth expected of a senior engineer.
  - Strong recent hands-on frontend engineering experience.
  - Production experience with React, TypeScript and/or
    JavaScript.
  - Previous formal people-management experience. Ideally, you
    have already managed engineers rather than looking for
    your first management opportunity.
  - Experience owning areas such as coaching, career
    development, feedback and performance management, not
    simply mentoring engineers or leading projects.
  - Experience building complex product interfaces, ideally
    within B2B SaaS, enterprise software, analytics, data
    platforms or another sophisticated data-heavy product.
  - Experience solving frontend problems involving areas such as
    large datasets, visualisation, filtering, configuration,
    performance or complex workflows.
  - A strong product mindset. You care about what you're
    building, who is using it and whether it genuinely solves
    their problem.
  - Strong collaboration skills across Engineering, Product and
    Design.
  - The ability and desire to remain deeply hands-on in the code
    while managing people.
  - The autonomy expected of a senior IC: once you understand
    the problem, you can work with the team to move it forward
    without needing constant direction.
  - Fluent English. French is not required.

  What you will get

  We conduct background checks as part of our hiring process,
  in accordance with applicable laws and regulations in the
  countries where we operate. This may include verification of
  employment history, education, and, where legally permitted,
  criminal records. Any checks will be conducted lawfully
  prior to formal employment contracts being signed, with
  candidate consent, and information will be treated
  confidentially.



  Pigment is an equal opportunity employer. We believe
  diversity is a strength and fosters innovation. We are
  committed to enabling everyone to feel included and valued
  at the workplace.  All qualified applicants will receive
  consideration for employment without regard to age, color,
  family, gender identity, marital status, national origin,
  physical or mental disability,  sex (including pregnancy),
  sexual orientation, social origin, or any other
  characteristic protected by applicable laws. We may process
  your personal data in accordance with our HR Data Protection
  Notice.
