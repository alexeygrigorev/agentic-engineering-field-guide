description: |
  We Do Consulting Differently

  Preferred locations: New York, Chicago, Washington, D.C.,
  Dallas, and Boston. Strong candidates in other locations may
  be considered case by case.

  We do Consulting Differently

  About the Practice

  Berkeley Research Group is launching a new Financial
  Institution Operations & Technology practice. We combine
  deep financial services expertise with AI-enabled delivery
  to improve operations across commercial and consumer
  lending, payments, and asset and wealth management.

  Help build a new practice within an established consulting
  firm. You will develop market-leading AI solutions, work
  with our AI Co-lab to frame solutions with vendor partners,
  collaborate with client teams, and build reusable digital
  assets. You will also contribute to recruiting, new
  offerings, thought leadership, and delivery improvement.

  The Role

  You will lead hands-on application engineering workstreams
  that turn AI capabilities into practical tools for financial
  services teams. Working closely with client users, you will
  build secure, accessible applications that fit real
  operating workflows and support expert review. You will
  guide engineers and collaborate with domain experts, data
  and AI specialists, and change and risk practitioners to
  deliver reusable applications and practical implementation
  roadmaps.

  What You’ll Do

  - Lead full-stack engineering workstreams from workflow
    discovery through production handover, coordinating
    application design, implementation dependencies, and
    delivery risks with client teams.
  - Build responsive interfaces in TypeScript with React or
    comparable frameworks that make complex operational tasks
    clear and efficient for client users.
  - Develop Python or Node.js APIs and backend services that
    connect user workflows to AI capabilities, business rules,
    data products, and client systems.
  - Implement human-review workflows with evidence displays,
    editable outputs, approval steps, exception queues, and
    escalation paths that preserve expert accountability.
  - Build authentication, role-based access controls, and audit
    trails with client security and risk teams, enforcing
    permissions at the service and data layers as well as the
    interface.
  - Integrate enterprise platforms and AI services using APIs,
    event-driven patterns, streaming responses, and
    asynchronous jobs with robust error handling and recovery
    behavior.
  - Work in the AI Co-lab with vendor partners and domain
    experts to frame application solutions, prototype workflow
    options, and validate usability and integration
    feasibility with client users.
  - Establish automated unit, integration, and end-to-end tests,
    accessibility checks, and deployment pipelines, and
    implement monitoring and support procedures for production
    applications.
  - Mentor engineers and review code and designs while
    collaborating with data, AI, change, and risk colleagues
    to support adoption and track workflow performance and
    service quality.
  - Turn proven workflows and expert feedback into reusable
    components, integration patterns, and digital assets, and
    contribute technical scope, effort estimates, and delivery
    assumptions to future pursuits.

  Qualifications

  Required

  - A minimum of 5 years of prior applicable work experience is
    required to be considered for the Managing Consultant
    level. To be considered at the Sr. Managing Consultant
    level, a minimum of 6 years of experience is required.

  - You can demonstrate senior, hands-on delivery of full-stack
    applications into production, with equivalent practical
    experience recognized regardless of formal education or
    certification.
  - You have strong TypeScript skills and experience with React
    or comparable frontend frameworks, including state
    management, responsive interfaces, and accessible
    interaction design.
  - You can build and test Python or Node.js APIs and backend
    services, including persistence, validation, error
    handling, and integration with external systems.
  - You have implemented authentication, role-based
    authorization, secure session or token handling, and audit
    logging, and understand why permissions must be enforced
    beyond the frontend.
  - You can design reliable integrations and interactive
    workflows using REST or comparable APIs, streaming,
    queues, and asynchronous processing, including retries and
    duplicate-request handling.
  - You have delivered applications using automated testing,
    version control, CI/CD, cloud deployment, monitoring, and
    practical accessibility and security checks.
  - You can lead a complex technical workstream, mentor
    engineers, and collaborate directly with client users and
    technology teams to refine requirements, explain design
    choices, and contribute credible delivery estimates.
  - Ability to travel to client sites as needed.

  Preferred

  - You have built operational applications for financial
    services teams in lending, servicing, collections,
    payments disputes, or investment operations.
  - Integrated AI services into applications with source
    evidence, human approvals, feedback capture, and clear
    handling of uncertain or failed results.
  - Experience connecting applications to enterprise identity
    providers, case-management platforms, document systems, or
    core financial services systems.
  - Developed reusable component libraries or workflow
    accelerators and used client research or usage data to
    improve adoption and operational outcomes.

  Success means delivering secure, accessible, reusable
  applications that make governed AI useful in daily client
  operations, support effective expert review, and improve
  measurable workflow efficiency and service quality.

  Managing Consultant salary range: $158,000-180,000

  Senior Managing Consultant salary range: $190,000 - $210,000

  Job title and level will be determined based on
  qualifications and experience.

  Candidates must be able to verify their legal right to work
  in the United States without employer sponsorship now or in
  the future.

