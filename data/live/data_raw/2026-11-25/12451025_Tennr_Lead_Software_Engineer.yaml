description: |
  Company Description

  Today, when you go to your doctor and get referred to a
  specialist, your doctor sends out a referral and tells you,
  “They’ll be in touch soon.” So you wait. And wait. Sometimes
  days, weeks, or even months. Why? Because too often
  providers are overwhelmed with the painstakingly tedious
  work required to get paid by insurance companies. Powered by
  proprietary models, Tennr handles the complex paperwork that
  gets patients through the door and providers paid, helping
  operators get patients the right care, at the right time, in
  the right setting.



  Role Description

  We’re seeking a Tech Lead Manager with strong technical
  leadership, attention to detail, and a passion for scalable
  system design. In this role, you’ll lead the engineering on
  one of our product pods. You will be a player-coach. You
  will be responsible for architecting, scoping, and building
  systems and features end-to-end, as well as leveraging and
  developing a team of talented engineers to make a reliable,
  delightful and valuable product for our customers, to get
  patients their care as quickly, carefully, and efficiently
  as possible.

  What you’ll do

  - Lead technical decisions and contribute through coding,
    technical design, and code review.
  - Coach engineers, give clear feedback, and help hire and grow
    the team.
  - Collaborate with product and design leads to define new
    product features.
  - Interact with customers through calls and on-sites to get
    feedback and represent Tennr.
  - Collaborate with product, sales, and customer success teams
    to incorporate feedback from customers into the product.

  What you’ll bring

  - 7+ years of experience in full-stack or back-end software
    engineering.
  - Demonstrated ability to mentor and lead junior, mid-level
    and senior engineers.
  - Proven track record of building and maintaining scalable web
    applications, in-depth knowledge of distributed systems
    and service-oriented system design.
  - Clear communication, comfort with ambiguity and hard work,
    and an interest in improving the healthcare system.
  - Excellent time-management and prioritization skills.

  Nice to have

  - 3+ years of engineering management experience
  - Professional experience building products on top of LLMs or
    agent harnesses
  - Professional experience building on top of speech models
  - Professional experience building real-time A/V web systems
  - Professional experience integrating with telephony
    infrastructure

  Why Tennr?

  - Drive Impact: one of our company values is Cowboy, meaning
    you set the pace. You won’t just talk about things, you’ll
    get them done. And feel the impact.
  - Develop Operational Expertise: learn the inner workings of
    scaling systems, tools, and infrastructure
  - Innovate with Purpose: we’re not just doing this for fun
    (although we do have a lot of fun). At Tennr, you’ll join
    a high-caliber team maniacally focused on reducing patient
    delays across the U.S. healthcare system.
  - Build Relationships: collaborate and connect with like-
    minded, driven individuals in our Hudson Square office 4
    days/week
  - Free lunch! Plus a pantry full of snacks.

  Benefits

  - Beautiful new office at 345 Hudson Street
  - Unlimited PTO
  - 100% paid employee health benefit options
  - Employer funded 401(k) match
  - Competitive parental leave
