description: |
  This role is for one of our clients

  Compensation: $70 - $90 per hour

  Employment Type: Independent Contractor Work Arrangement:
  Fully Remote Working Schedule: Flexible – Work on your own
  schedule Payment Frequency: Weekly via Stripe or Wise

  About the Role

  We are seeking experienced Software Developers to contribute
  to a cutting-edge AI research initiative focused on
  improving the capabilities of advanced AI models in software
  development.

  In this role, you will evaluate AI-assisted software
  development sessions and coding workflows used to train and
  assess frontier AI models. You will review end-to-end coding
  trajectories generated through AI-powered developer tools,
  assessing code correctness, problem-solving approaches,
  workflow efficiency, and adherence to software engineering
  best practices.

  You will provide structured, rubric-based feedback to help
  improve how AI models understand development requirements,
  generate code, debug issues, and execute complex, multi-step
  programming tasks.

  This opportunity is ideal for software engineers with strong
  coding and debugging expertise who are familiar with modern
  AI-assisted development tools and agentic or specification-
  driven workflows.

  RequirementsKey Responsibilities

  - Evaluate end-to-end software development sessions produced
    using AI-assisted coding tools.
  - Assess code quality, correctness, functionality, and
    adherence to software engineering best practices.
  - Review multi-step coding trajectories to determine whether
    the AI follows a logical and effective development
    workflow.
  - Identify bugs, implementation gaps, inefficient approaches,
    and errors in AI-generated code.
  - Evaluate the quality of reasoning, debugging strategies, and
    problem-solving demonstrated throughout development
    sessions.
  - Review full-stack and backend development tasks across
    different programming environments and system
    architectures.
  - Provide clear, structured, and actionable written feedback
    based on predefined evaluation rubrics.
  - Identify opportunities to improve AI-generated code,
    development workflows, and agentic coding capabilities.

  Required Qualifications & Skills

  - Minimum 3+ years of professional software development
    experience.
  - Hands-on experience with AI-assisted coding tools such as
    Cursor, GitHub Copilot, Claude Code, or similar platforms.
  - Practical understanding of agentic coding, AI-powered
    development environments, and specification-driven
    workflows.
  - Strong code-reading, debugging, and problem-solving
    capabilities.
  - Experience working with full-stack or backend software
    systems.
  - Ability to evaluate complex, multi-step coding workflows and
    assess their correctness, efficiency, and overall quality.
  - Strong understanding of software development principles,
    coding standards, and engineering best practices.
  - Excellent written communication skills, with the ability to
    explain technical issues and provide detailed evaluation
    feedback.

  Preferred Qualifications

  - Experience working with Kiro or Amazon CodeCatalyst.
  - Previous experience evaluating, reviewing, or grading AI-
    generated code.
  - Contributions to developer tools, engineering productivity
    platforms, or open-source software projects.
  - Familiarity with AI agents and automated software
    development workflows.

  Contract & Payment Terms

  - Engagement will be on an independent contractor basis.
  - The role is fully remote and offers flexible working hours,
    allowing you to complete assignments on your own schedule.
  - Project duration may be extended, shortened, or concluded
    early depending on business requirements and individual
    performance.
  - Payments will be processed weekly through Stripe or Wise,
    based on services rendered.
  - The role will not require access to confidential or
    proprietary information belonging to any current or former
    employer, client, or institution.
  - Candidates requiring H-1B or STEM OPT sponsorship are not
    eligible for this opportunity at present.

  Equal Opportunity

  All qualified applicants will be considered without
  discrimination based on legally protected characteristics
  under applicable laws. Reasonable accommodations are
  available throughout the application process upon request.
