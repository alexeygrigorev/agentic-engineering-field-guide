description: |
  About Every Cure:

  Every Cure is an AI-driven nonprofit, biotech organization
  on a mission to save and improve lives by repurposing
  existing medicines for diseases with significant unmet need.
  We are working to create a world where every drug is used to
  treat every disease it possibly can, so that no patient
  suffers when an existing treatment could help them. Rather
  than starting with a single disease or drug, we take an
  “all-vs-all" approach, systematically looking across every
  FDA-approved drug and every known disease to surface
  repurposing opportunities most likely to help patients. We
  are also the first organization to take end-to-end ownership
  of that process: from identifying promising repurposing
  opportunities, to validating it in the lab and/or clinic, to
  working with physicians, payers, and patient advocacy groups
  to get it to the patients who need it. We are filling a gap
  left by the current biomedical system, which doesn’t
  systematically pursue new uses for old drugs. Every Cure
  pairs AI-driven prediction with rigorous review from our
  medical team, plus close collaboration with healthcare
  professionals and patient advocacy groups, to unlock the
  full potential of existing medicines to treat every disease
  and every patient we possibly can.   Inspired by Every
  Cure’s co-founders' work repurposing drugs for Castleman
  disease and other rare diseases, Every Cure is advancing
  repurposed treatments for neglected diseases and has been
  featured in The New Yorker, The New York Times, USA Today,
  Good Morning America, Nature, and other news media. Led by a
  talented leadership team and an outstanding Board of
  Directors, Every Cure is supported through funding from
  leading philanthropic organizations like Chan Zuckerberg
  Initiative, TED’s Audacious Project, as well as the federal
  agency ARPA-H.

  Our approach:

  - AI-Powered Identification: We use advanced artificial
    intelligence to analyze the world’s biomedical knowledge
    and identify FDA-approved drugs that can be repurposed for
    conditions with unmet needs. This cutting-edge technology
    enables us to explore new therapeutic possibilities
    efficiently.
  - Open-Source Commitment: Many of our methods' code, quality-
    checking tools, and knowledge graph pipeline are open-
    source, and our drug list, disease list, and knowledge
    graph-based drug-disease scores are freely available. We
    aim to foster collaboration and transparency within the
    scientific community and unlock the potential for
    discovering new treatments.
  - High-Impact Focus: We prioritize drug repurposing
    opportunities that will relieve the most suffering and
    have the greatest impact possible.
  - Rigorous Validation: Promising opportunities are thoroughly
    validated through laboratory and clinical studies to
    confirm their efficacy and safety before advancing to
    broader application.
  - Strategic Marketing and Access: We disseminate information
    about effective repurposed treatments through multiple
    channels and are committed to ensuring that new cures are
    accessible to all patients.

  Every Cure is seeking a mission-driven Engineering Manager -
  Data & AI to lead a multidisciplinary team of engineers and
  data scientists advancing our technology platform and drug
  repurposing efforts.

  Reporting to the Vice President of Technology, this
  individual will provide technical leadership, guide
  execution, and translate organizational priorities into
  scalable, high-quality solutions that support Every Cure's
  mission of identifying new treatments for patients.

  This is a hands-on leadership opportunity for someone who
  combines strong technical expertise with a passion for
  developing people, solving complex problems, and delivering
  meaningful results. The ideal candidate brings experience in
  software engineering, data engineering, machine learning, or
  applied data science, along with the ability to lead teams
  working across these disciplines.

  Working closely with colleagues across Technology, Product,
  and Research, this person will strengthen technical
  processes, remove barriers to execution, and foster a
  collaborative, high-performing team.

  We are looking for a thoughtful, adaptable leader who
  thrives in a fast-moving, mission-driven environment and is
  excited to turn complex technical challenges into meaningful
  impact for patients.

  How You Will Make an Impact

  Technical Leadership & Delivery

  - Lead technical initiatives across engineering and data
    science, partnering with Product and Research to translate
    organizational priorities into actionable plans and
    milestones.

  - Oversee delivery across multiple workstreams, proactively
    managing dependencies, addressing challenges, and keeping
    projects moving forward.

  - Balance technical quality, scalability, and speed to deliver
    solutions that advance Every Cure's mission.

  Technical Design & Engineering Excellence

  - Guide technical decisions across software engineering, data
    pipelines, and machine learning workflows, ensuring
    solutions are reliable, maintainable, and scalable.

  - Establish and continuously improve engineering practices,
    infrastructure, and technical standards to support high-
    quality, reproducible work.

  - Remain technically engaged through code reviews,
    prototyping, debugging, and evaluating architectural
    decisions and trade-offs.

  Team Leadership & Development

  - Lead, mentor, and develop a multidisciplinary team of
    engineers and data scientists, fostering a culture of
    curiosity, ownership, collaboration, and continuous
    improvement.

  - Provide ongoing coaching, constructive feedback, and
    professional development opportunities to help team
    members grow and succeed.

  - Establish clear expectations, priorities, and workflows that
    empower team members to take ownership of their work and
    contribute effectively as Every Cure grows.

  What You Bring to the Team

  Education

  - Bachelor's degree in Computer Science, Software Engineering,
    Data Science, Mathematics, Statistics, or a related
    technical field, or equivalent practical experience.

  Experience

  - 5 - 7+ years of progressive technical experience in software
    engineering, data engineering, machine learning, data
    science, or a related discipline.

  - Experience leading technical delivery for a team of three or
    more engineers, data scientists, or other technical
    professionals.

  - 1 - 2+ years of people management or technical team
    leadership experience, including mentoring, coaching,
    providing feedback, and supporting professional
    development.

  - Proven ability to manage complex technical initiatives,
    balance competing priorities, and collaborate across
    technical and cross-functional teams.

  - Hands-on technical experience with the ability to evaluate
    technical decisions, contribute directly when needed, and
    improve engineering practices and delivery processes.

  Skills & Attributes

  - Strong proficiency in Python or a comparable programming
    language, with the ability to review code, guide technical
    decisions, and contribute to development efforts.

  - Solid understanding of data engineering principles,
    including the development and maintenance of production
    data and machine learning pipelines.

  - Familiarity with cloud-based infrastructure and services,
    particularly Google Cloud Platform (GCP).

  - Strong communication and interpersonal skills, with the
    ability to translate complex technical concepts and
    collaborate effectively across disciplines.

  - Sound technical judgment and a practical, solutions-oriented
    approach to balancing quality, scalability, and execution.

  - A collaborative, adaptable leadership style with a
    commitment to developing people, fostering accountability,
    and supporting team success.

  - Genuine enthusiasm for Every Cure's mission and the
    opportunity to apply technology and AI to improve
    patients' lives.

  Our Technology Stack

  Our technology team leverages modern cloud infrastructure,
  data engineering, and AI tools to advance Every Cure's drug
  repurposing mission.

  - Core Technologies: Python, Google Cloud Platform (GCP),
    Large Language Models (LLMs), and GitHub.

  - Additional Technologies: Experience with Kedro, Pandas,
    Feast, or Neo4j is a plus.

  We don't expect candidates to have experience with every
  tool. We value strong technical fundamentals, sound
  judgment, and a willingness to learn and adapt as our
  technology evolves.

  Compensation & Benefits:

  - Your paycheck: Competitive salary based on experience.

  - Health and wellness: Comprehensive plans with medical,
    dental, and vision coverage, administered by Bupa.

  - Future nest egg: A pension plan with an employer match of 3%
    helps you save for your future.

  - Relax and recharge: Generous time off, including paid
    holidays.

  - We have you covered: Comprehensive life and income
    protection administered by Unisure, ensuring you have the
    support you need during important times.

  This role is based in London, England, United Kingdom, with
  an expectation of a minimum of three days per week in the
  office. Applicants must have the existing right to work in
  the United Kingdom, as visa sponsorship is not available for
  this position.

  Every Cure is an Equal Opportunity Employer. We celebrate
