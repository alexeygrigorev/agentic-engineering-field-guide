description: |
  At Expedia Group, we help travelers explore the world, one
  journey at a time. As a global travel company powered by
  passionate people, trusted partnerships, and leading
  technology, we connect travelers, partners, and advertisers
  through our consumer brands, B2B network, and travel
  advertising business.

  Here, you'll do meaningful work that helps millions of
  people discover, book, and experience travel with more ease,
  confidence, and joy. Our five Behaviors-Traveler First,
  Think Big, Operate with Excellence, Ownership Mindset, and
  Succeed Together-help foster a supportive environment where
  people can grow their careers and have the flexibility,
  benefits, and support to do their best work. Join us and
  build for travelers everywhere.

  The team

  As a Fullstack engineer in the Product Experience team, you
  will be responsible for building and maintaining our high-
  availability, high-transactional Property Detail Pages on
  the app. You will be part of a multi-functional team of
  Product Managers, TPMs, Engineering Managers, and Software
  Engineers based in Gurgaon, Bangalore, London, and Madrid.
  We prioritise building high-quality software with a focus on
  availability, performance, scalability, and system
  resiliency.

  Our London team is looking for curious, empathetic, and
  creative problem solvers with a growth mindset. We value our
  team culture and work together from the office three times a
  week.

  In this role, you will:

  - Design, build, and maintain robust full stack applications
    and scalable services across multiple domains, applying
    deep technical expertise and architectural skills.
  - Lead the end-to-end development process, including system
    design, API design, and data modelling, ensuring quality
    and maintainability of solutions.
  - Collaborate across engineering, product, and business teams
    to define requirements, deliver impactful features, and
    drive technology strategy.
  - Mentor and guide engineers, fostering best practices in
    coding, testing, and operational excellence within and
    across teams.
  - Safely integrate and operate AI/ML-enabled solutions to
    improve business and customer outcomes, ensuring secure
    and ethical adoption.
  - Demonstrate adaptability by contributing to projects
    spanning different technical stacks, domains, and
    platforms.

  Minimum Qualifications:

  - Bachelor’s degree in Computer Science or a related technical
    field; or equivalent related professional experience.
  - 8+ years of relevant professional experience.
  - Strong engineering skills and curiosity to push what’s
    possible with modern tech, regardless of stack.
  - Ability to break down complex problems and ship simple,
    innovative solutions with a cross‑functional team.
  - Proven experience building scalable, user‑centric products
    that power great user experiences.
  - Clear, concise communication skills, translating technical
    details for both technical and non‑technical audiences.
  - Growth‑minded and data‑driven, always learning,
    experimenting, and raising the bar for how we build
    products and experiences.
  - Familiarity with AI-driven systems, tools, or workflows and
    applying AI/ML concepts to real world products.

  Preferred Qualifications:

  - Hands‑on experience with multiple system architectures (e.g.
    microservices, event‑driven, composable) and the ability
    to evaluate and communicate the trade‑offs between them
    for scale, reliability, and speed of delivery.
  - Hands on experience with Kotlin for server side, or/and
    React and Typescript for the frontend.
  - Proven track record of refactoring and modernising legacy
    codebases and architectures, improving performance and
    maintainability while minimising risk and customer impact.
  - Track record of integrating and optimizing AI/ML-enabled
    features or workflows within production systems.

  Accommodation requests

  Expedia Group is committed to providing an inclusive and
  accessible recruiting experience. If you need an
  accommodation or adjustment due to a disability during the
  application or recruiting process, please submit a request
  at https://expedia.service-
  now.com/askeg?id=job_accommodation.

  About Expedia Group

  Expedia Group includes three flagship consumer brands -
  Expedia, Hotels.com, and Vrbo - along with a leading B2B
  travel business and travel advertising offerings. Across our
  brands and business, we help travelers explore the world
  with confidence and ease.

  Important notice

  Employment opportunities and job offers at Expedia Group
  will always come from Expedia Group's Talent Acquisition and
  hiring teams. Never share sensitive personal information
  unless you are confident of the recipient. Expedia Group
  does not extend job offers via email or messaging tools to
  individuals with whom we have not made prior contact. Our
  email domain is @expediagroup.com. The official place to
  find and apply for roles is
  https://careers.expediagroup.com/jobs/.

  Equal Opportunity

  Expedia is committed to creating an inclusive work
  environment with a diverse workforce. All qualified
  applicants will receive consideration for employment without
  regard to race, religion, gender, sexual orientation,
  national origin, disability or age.
