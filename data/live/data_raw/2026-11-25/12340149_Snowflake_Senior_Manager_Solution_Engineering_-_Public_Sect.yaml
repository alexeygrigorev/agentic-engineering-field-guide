description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  Our Solution Engineering organization is seeking a Senior
  Manager for Solution Engineering to lead a highly skilled
  team of UK based Solution Engineers focussed on the Public
  Sector. In this role you will lead an experienced SE team as
  well as working directly with our sales team and partners to
  understand the needs of our customers, strategise on how to
  navigate sales cycles, provide value-based demonstrations,
  support POCs and close business.



  Reporting to the RVP of UK Solution Engineering, you will
  play a hands on role building and running a team of field
  Solution Engineers.



  IN THIS ROLE YOU WILL GET TO:



  - Build and lead a team of Solution Engineers who serve as our
    core product introduction, evaluation and education
    experts
  - Partner with sales leadership to achieve regional quota
    targets, our goals and ensure relationships are built
  - Provide guidance to revenue leaders on sales strategy,
    product obstacles/gaps and represent the team's needs to
    executive staff
  - Interpret complex problems, create simple solutions and
    collaborate closely with prospects, channel partners and
    our sales team to deliver winning solutions
  - Collaborate and maintain a close working relationship with
    product, engineering, sales, marketing and services
  - Play an active role in sourcing and screening potential
    candidates and managing the interview process
  - Act as a player/coach working with your team on and
    delivering compelling presentations to customers and
    prospects

  ON DAY ONE WE WILL EXPECT YOU TO HAVE:



  - 10+ years of industry experience in a pre-sales capacity
    with 4+ years of direct line management experience
    (hiring, training and retaining top talent)
  - Understanding of and experience with data architecture, data
    analytics and cloud technology
  - Experience working with modern data technology (e.g. dbt,
    spark, containers, devops tooling, orchestration tools,
    git, etc.)
  - Experience with SAAS or consumption-based business model
    preferred
  - Extensive experience in the UK Public-Sector (NHS, Local &
    Central Government, Education)
  - Outstanding presenting skills to both technical and
    executive audiences, whether impromptu on a whiteboard or
    using presentations and demos.
  - Ability to connect a customer's specific business problems
    and Snowflake's solutions
  - University degree in computer science, engineering,
    mathematics or related fields, or equivalent experience
    preferred

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
