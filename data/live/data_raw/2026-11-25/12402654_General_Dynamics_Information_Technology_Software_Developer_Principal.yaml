  Job Description:

  Seeking a seasoned Software Developer Principal with deep
  Snowflake expertise and strong AWS experience to design,
  develop, and support enterprise data and software solutions.
  The ideal candidate will possess strong SQL and Linux
  skills, experience with GitHub and Jenkins CI/CD processes,
  knowledge of deployment methodologies, and a solid
  understanding of unit testing and data structures. Python
  experience is preferred, while JavaScript and API
  development experience are considered desirable. This role
  may provide technical leadership and mentorship to
  development teams while supporting critical business
  initiatives.

  The Software Developer Principal serves as a senior
  technical contributor responsible for designing, developing,
  testing, deploying, and maintaining enterprise software
  solutions and data platforms. This role performs all phases
  of the software development lifecycle, collaborates with
  business and technical stakeholders to define requirements,
  and develops scalable solutions utilizing modern cloud and
  data technologies. The Software Developer Principal provides
  technical leadership, supports system optimization efforts,
  and ensures software quality, performance, and
  maintainability.

  Key Responsibilities

  - Perform all phases of the Software Development Lifecycle
    (SDLC), including requirements gathering, design,
    development, testing, deployment, maintenance, and
    support.
  - Analyze business and user requirements to design and
    implement software solutions that meet organizational
    objectives.
  - Develop, maintain, and optimize applications, data
    pipelines, and system integrations.
  - Create technical designs, models, diagrams, and
    documentation to communicate system architecture and
    application functionality.
  - Design, develop, and maintain solutions utilizing Snowflake,
    AWS cloud services, SQL, and Linux-based environments.
  - Participate in code reviews and enforce coding standards,
    best practices, and quality assurance processes.
  - Execute software updates, enhancements, debugging,
    troubleshooting, and performance tuning activities.
  - Develop and execute unit tests to ensure software
    reliability and quality.
  - Support CI/CD deployment processes utilizing GitHub,
    Jenkins, and related DevOps tools.
  - Collaborate with cross-functional teams to deliver scalable
    and secure technology solutions.
  - Prepare reports and provide analysis on project status,
    technical specifications, risks, and development
    activities.
  - Recommend and implement best practices for documentation,
    maintainability, scalability, and future system
    enhancements.
  - Support production deployments and issue resolution
    activities.
  - May mentor, coach, and provide technical guidance to less
    experienced team members.
  - May serve as a technical lead, team lead, or task lead on
    software development initiatives.
  - Occasional after-hours support may be required during
    deployments, maintenance activities, or critical
    production incidents.
  - Perform other duties as assigned.

  Required Qualifications

  Experience

  - Bachelor's degree in a related technical discipline, or
    equivalent technical training and/or relevant work
    experience will be considered in lieu of a degree.
  - Minimum 5 years of hands-on software development experience.
  - Experience participating in all phases of the software
    development lifecycle.
  - Experience working in Agile or similar development
    environments.

  Technical Skills

  - Extensive hands-on experience with Snowflake development,
    optimization, and administration.
  - Strong experience with AWS cloud services and cloud-based
    application development.
  - Strong proficiency in SQL, including complex query
    development and database optimization.
  - Experience working in Linux/Unix environments.
  - Experience with GitHub source control management and Jenkins
    CI/CD processes.
  - Experience supporting software deployment and release
    management processes.
  - Strong understanding of unit testing methodologies and test
    automation practices.
  - Knowledge of data structures, algorithms, and software
    design principles.
  - Strong troubleshooting, debugging, and problem-solving
    capabilities.

  Preferred Qualifications

  - Experience developing applications using Python.
  - Experience with JavaScript development.
  - Knowledge of RESTful APIs and system integration concepts.
  - Experience with data engineering, ETL processes, and cloud-
    based data platforms.
  - Experience leading technical projects or mentoring
    development teams.

  Knowledge, Skills, and Abilities

  - Advanced knowledge of software engineering principles and
    development best practices.
  - Strong analytical and critical-thinking skills.
  - Ability to design scalable, maintainable, and secure
    software solutions.
  - Strong written and verbal communication skills.
  - Ability to manage multiple priorities in a fast-paced
    environment.
  - Demonstrated ability to collaborate effectively with
    technical and non-technical stakeholders.
  - Ability to work independently while contributing to team
    success.

