description: |
  THE ROLE AND THE TEAM

  The ZEOS B2B is the core engine that enables our partners to
  integrate and scale within the Zalando ecosystem. As a
  Backend Software Engineer, you will join an agile, cross-
  functional team dedicated to building the high-performance
  services that power our partner-facing products. We work in
  an API-first environment where we turn complex business
  logic into scalable, reliable software.

  In this role, you will work alongside Engineers and Product
  Managers to implement new features and evolve our
  microservice landscape. You will be part of a culture that
  values technical curiosity and operational responsibility.
  At ZEOS, we believe in "You Write It, You Run It," meaning
  you will be involved in the entire lifecycle of your
  services—from the first line of code to monitoring and
  operating your applications in our cloud environment.

  INCLUSIVE BY DESIGN

  - If you think you have what it takes, we encourage you to
    apply even if you don't meet every single requirement. You
    may just be the right candidate for this or other roles!
  - At Zalando, our vision is to be the leading pan-European
    ecosystem for fashion and lifestyle e-commerce – one that
    thrives on diversity and is truly inclusive by design. We
    believe that diverse teams fuel innovation and creativity,
    and we actively seek out talent from all backgrounds.
  - We actively seek to reduce bias in our hiring and employment
    processes, focusing on your qualifications, skills, and
    contributions. To support this, we kindly ask that you
    refrain from including personal details such as your
    photo, age, or marital status in your CV, ensuring a fair
    and equitable evaluation based solely on your abilities
    and potential.
  - We are committed to providing an exceptional and accessible
    candidate experience for everyone. If you require any
    accommodations to support you throughout the hiring
    process, please let us know – we are here to assist you.
  - Discover more about our commitment to creating a diverse and
    inclusive workplace: https://jobs.zalando.com/en/our-
    culture/diversity-and-inclusion

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

    - Develop Robust Services: Build and maintain scalable
      Microservices using Java/Kotlin and Spring Boot,
      ensuring your code is clean, well-documented, and
      performant.
    - Design Clean APIs: Contribute to the design and
      implementation of RESTful services, focusing on creating
      intuitive interfaces for our customer portals and
      internal tools.
    - Own Your Code: Take responsibility for the full development
      cycle. You will participate in the design, testing, and
      deployment of your features using Gradle and our CI/CD
      pipelines.
    - Ensure Operational Health: Participate in the deployment and
      operation of your services within AWS and Kubernetes,
      learning to monitor and troubleshoot applications in a
      production environment.
    - Collaborate and Grow: Participate in code reviews and team
      ceremonies, providing and receiving feedback to help
      maintain high standards of code quality and technical
      excellence.
    - Think End-to-End: While focusing on the backend, you
      collaborate closely with frontend engineers and show an
      interest in Fullstack context to ensure we deliver a
      seamless experience to our partners.

  WE'D LOVE TO MEET YOU IF

    - Solid Java Foundation: You have professional experience in
      Kotlin/Java development and a good understanding of the
      Spring Boot framework. Check our Tech Radar for more
      information on the technologies we use at Zalando.
    - Microservices Knowledge: You are familiar with Microservice
      architectures and have experience working with REST APIs
      and data handling.
    - Event-Driven Experience: You have a strong understanding of
      event-based systems, are proficient with technologies
      like Kafka or Nakadi and are able to develop event-
      driven solutions.
    - Reliable Individual Contributor: You have a proven track
      record of delivering stable features in an agile
      environment and taking ownership of your tasks from
      discovery to delivery.
    - Tooling & Automation: You are comfortable using build tools
      like Gradle and have a strong interest in (or experience
      with) automated testing and CI/CD workflows.
    - Cloud Ready: You are eager to work with AWS and Kubernetes
      and are excited to embrace the "You Write It, You Run
      It" mindset.
    - Effective Communicator: You possess strong English skills
      and enjoy solving problems collaboratively in a diverse,
      international team environment.

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

    - 27 days of holiday a year to start for full-time employees
      (+1 day for every calendar year up to 30 days)
    - 2 paid volunteering days a year
    - Hybrid working model with up to 40% remote per week, actual
      practice is up to each team to best support their
      collaboration
    - Work from abroad for up to 30 working days a year
    - Employee shares program
    - 40% off fashion and beauty products sold and shipped by
      Zalando, 30% off Lounge by Zalando, discounts from
      external partners
    - Relocation assistance available (subject to prior agreement)
    - Family services, including counseling and support
    - Health and wellbeing options (including Wellhub, formerly
      Gympass)
    - Mental health support and coaching available
