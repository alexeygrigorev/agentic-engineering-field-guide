description: |
  Help us prove, build and scale AI solutions that deliver
  real value

  GSK’s Enterprise AI team turns high-value AI opportunities
  into working solutions that can scale across the business.

  As a Senior Forward Deployed Engineer (FDE), you will work
  directly with business teams to understand complex problems
  and rapidly determine whether AI can solve them. You will
  take ideas from problem definition to working proof of
  concept (PoC), proof of value (PoV) or minimum viable
  product (MVP), often within days or weeks.

  This is a hands-on engineering role. You will combine strong
  software engineering skills with generative AI, agent-based
  approaches and AI-assisted development. You will work
  closely with product owners, engineering leads and business
  stakeholders to build working software, validate value and
  determine which solutions should progress to scale.

  In this role, you will

  - Lead high-priority AI use cases from problem framing through
    to working prototypes and MVPs, providing evidence-based
    recommendations on whether they should progress.
  - Build rapidly using AI coding assistants, agent-based
    workflows and modern software engineering practices,
    applying your own judgement to validate and improve AI-
    generated outputs.
  - Embed with business teams to understand real workflows, data
    and user needs, translating complex challenges into
    practical AI solutions.
  - Design and test generative AI solutions using approaches
    such as AI agents, multi-agent orchestration, retrieval-
    augmented generation (RAG), prompt engineering and
    evaluation.
  - Prepare successful solutions for scale, providing working
    code, architecture decisions, identified risks and clear
    handover to engineering teams.
  - Build responsible AI and appropriate governance into
    solutions from the outset, while contributing reusable
    agents, templates, engineering patterns and reference
    architectures for future use.

  Basic Qualifications

  We are looking for professionals with these required skills
  to achieve our goals:

  - Bachelor’s degree in Computer Science, Software Engineering
    or a related discipline, or equivalent practical
    experience.
  - Significant experience in full-stack software engineering,
    AI/ML engineering or a related engineering discipline,
    including experience delivering production systems.
  - Demonstrated experience taking complex ideas from initial
    problem definition to working software at pace.
  - Strong programming skills in Python, alongside experience
    with a modern language such as TypeScript/JavaScript, Go
    or equivalent.
  - Hands-on experience building generative AI solutions using
    areas such as AI agents, multi-agent workflows, RAG,
    prompt engineering and evaluation.
  - Experience using AI-assisted software development tools or
    coding agents as part of the development lifecycle.



  Preferred Qualifications

  If you have the following characteristics, it would be a
  plus:

  - Experience in a Forward Deployed Engineer, Customer
    Engineer, Solutions Architect or similarly hands-on
    customer-facing engineering role.
  - Experience building AI solutions in a regulated environment
    such as pharmaceuticals, healthcare or financial services.
  - Familiarity with relevant governance or regulatory
    considerations, such as GxP, GDPR or SOX.
  - Knowledge of model fine-tuning approaches and Model Context
    Protocol (MCP) integrations.
  - Experience designing and orchestrating agent-based or multi-
    agent systems, including determining when human oversight
    is required.
  - A track record of creating reusable engineering patterns,
    frameworks, tooling or reference architectures that
    improve delivery across multiple teams.



  Why join Enterprise AI?

  Enterprise AI brings engineering expertise together with
  scientific, clinical and business teams to turn advances in
  artificial intelligence into practical solutions.

  This is an opportunity to work at the point where emerging
  AI technology meets real business problems. You will have
  the autonomy to explore ideas quickly, challenge assumptions
  and build working solutions, while helping teams adopt new
  AI-augmented ways of working.

  Success means more than delivering a prototype. You will
  help determine where AI can create genuine value, establish
  the foundations for solutions to scale and leave behind
  reusable engineering capabilities that make future delivery
  faster and stronger. #AGTech #hybrid

  Closing date for applications: 2nd December 2026

  Skills

  Artificial Intelligence (AI), Artificial Intelligence
  Ethics, Artificial Neural Networks (ANNS), Classification
  Models, Deep Learning, Intelligent Automation (IA), Machine
  Learning (ML), Model Evaluation, Model Validation,
  Predictive Modeling, Probabilistic Modeling, Python
  (Programming Language), Test Documentation

  Why GSK?

  Uniting science, technology and talent to get ahead of
  disease together.

  GSK is a global biopharma company with a purpose to unite
  science, technology and talent to get ahead of disease
  together. We aim to positively impact the health of 2.5
  billion people by the end of the decade, as a successful,
  growing company where people can thrive. We get ahead of
  disease by preventing and treating it with innovation in
  specialty medicines and vaccines. We focus on four
  therapeutic areas: respiratory, immunology and inflammation;
  oncology; HIV; and infectious diseases – to impact health at
  scale.

  People and patients around the world count on the medicines
  and vaccines we make, so we’re committed to creating an
  environment where our people can thrive and focus on what
  matters most. Our culture of being ambitious for patients,
  accountable for impact and doing the right thing is the
  foundation for how, together, we deliver for patients,
  shareholders and our people.

