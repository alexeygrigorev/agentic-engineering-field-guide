  The United States base range for this position is
  $151,942–$189,927 USD, plus equity. The benefits available
  for this position include health insurance, six-month paid
  parental leave, 401(k) retirement plan, monthly meal
  allowance, 23 paid days off, paid flexible holidays, and
  paid sick leave. These ranges may be modified in the future.



