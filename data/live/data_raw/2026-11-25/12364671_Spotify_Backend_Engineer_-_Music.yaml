description: |
  The Music Mission team owns Spotify's end to end proposition
  for music creators and the experiences they create for fans.
  The organization is dedicated to building tools and services
  to enable creation, promotion, expression, and monetization
  at scale.

  Our team makes music videos easy for fans to discover and
  meaningful for artists, powered by scalable, intelligent
  infrastructure that grows with our catalog. We're building
  personalized music video playlists, sorting videos into
  meaningful categories, and learning which videos listeners
  are most likely to love, then helping that content reach the
  right people.

  As a Backend Engineer, you'll help shape how millions of
  listeners experience music videos on Spotify, working
  alongside Data Engineers, Backend Engineers, and partners
  across product and design.

