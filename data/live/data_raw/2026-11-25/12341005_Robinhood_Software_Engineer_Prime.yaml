description: |
  Join us in building the future of finance.

  Our mission is to democratize finance for all. An estimated
  $124 trillion of assets will be inherited by younger
  generations in the next two decades. The largest transfer of
  wealth in human history. If you’re ready to be at the
  epicenter of this historic cultural and financial shift,
  keep reading.

  About the team + role

  We are building an elite team, applying frontier
  technologies to the world’s biggest financial problems.
  We’re looking for bold thinkers. Sharp problem-solvers.
  Builders who are wired to make an impact. Robinhood isn’t a
  place for complacency, it’s where ambitious people do the
  best work of their careers. We’re a high-performing, fast-
  moving team with ethics at the center of everything we do.
  Expectations are high, and so are the rewards.

  The Prime team's mission is to build Bitstamp's prime
  brokerage for institutional clients — the platform that lets
  hedge funds, market makers, and professional trading firms
  fund, trade, borrow against, and settle positions at scale.
  We build the systems that move real institutional money:
  cross-venue settlement, credit against collateral, matched-
  book lending, and the bridge that brings tokenized
  securities to our order book. These are correctness-critical
  systems where a wrong answer can't be cheaply undone —
  getting them right is the whole job.

  We are looking for a Backend Engineer to join our team. As a
  Backend Engineer, you will lead the backend development
  process for core components and build services from
  inception to deployment. This individual will be helping
  solve correctness, scaling, and reliability challenges on a
  backend-first, high-performance, and world-class
  institutional trading platform.

  This role is based in our London office, with in-person
  attendance expected at least 3 days per week.

  At Robinhood, we believe in the power of in-person work to
  accelerate progress, spark innovation, and strengthen
  community. Our office experience is intentional, energizing,
  and designed to fully support high-performing teams.

  Requires participation in an on-call rotation to support
  business needs.

  What you’ll do

  - Design and ship production services: Implement and operate
    resilient backend services and subsystems that move
    institutional money — contributing to flows such as cross-
    venue settlement, collateral credit, matched-book lending,
    and order execution.
  - Author focused technical specs: Draft clear technical
    designs for new features and components, explicitly
    defining data invariants, error handling, state
    boundaries, and recovery mechanisms before writing code.
  - Build for failure: Write clean, idiomatic, and thoroughly
    tested code, pairing production features with rigorous
    unit/integration tests, sensible monitoring, structured
    logging, and targeted alerts.
  - Maintain operational health: Actively participate in the
    team's on-call rotation, debug production anomalies, and
    contribute to blameless post-mortems and remediation work
    to harden our platform.
  - Collaborate and review: Participate in architectural
    discussions and provide thoughtful, constructive code
    reviews to help maintain high code quality and consistency
    across the team.

  What you bring

  - Proven backend track record: Solid experience independently
    designing, implementing, and maintaining backend services
    in a production environment, taking full ownership of what
    you ship.
  - Correctness-critical mindset: Hands-on experience with
    financial, transactional, or distributed systems (e.g.,
    payments, ledgers, trading, order management, or inventory
    engines) where data integrity is paramount and mistakes
    are costly.
  - Systems fundamentals: Strong understanding of distributed
    systems and transactional boundaries, including relational
    data modeling (PostgreSQL), data consistency, idempotency,
    and asynchronous workflows/message queues.
  - Defensive engineering: Good design judgment and an instinct
    to test failure paths; you think about race conditions,
    boundary failures, and network partitions rather than just
    the happy path.
  - Language fluency: Proficiency in a modern backend language
    (such as Python or Go), with the ability to quickly get up
    to speed on our core stack (Python/Django and Go).
  - Clear communication: Strong written and verbal communication
    skills; you can clearly explain technical trade-offs,
    document system behaviors, and collaborate effectively
    with peers and cross-functional partners.

  What we offer

  - Challenging, high-impact work to grow your career and shape
    the future of global institutional finance
  - Performance-driven compensation with multipliers for
    outsized impact, bonus programs, and equity ownership
  - Top-tier health benefits to fuel your work, including 100%
    employer-paid private medical insurance for you and
    comprehensive coverage for dependents, alongside mental
    health and wellbeing support programs
  - Pension Scheme with highly competitive company matching to
    secure your future
  - Lifestyle Wallet: A highly flexible employer-paid benefits
    spending account to offset expenses like wellness,
    learning, childcare, and more
  - Access to the best AI tools on the market with continuous AI
    skill-building opportunities for all employees
  - Time to recharge: Generous paid time off, company holidays,
    sick time, parental leave, and paid volunteer time off

  Click here to learn more about our Total Rewards, which vary
  by region and entity.

  If our mission energizes you and you’re ready to build the
  future of finance, we look forward to seeing your
  application.

