  At Harvey, the future of professional services is being
  written today — and we’re just getting started.

  Role Overview

  Harvey’s Legal Engineering Manager, Custom Solutions,
  position plays a critical leadership role in scaling how we
  deliver high-impact, bespoke AI solutions to our existing
  customers. You will lead and develop a team of Custom
  Solutions Legal Engineers who design, build, and deploy
  custom prompts, agents, and playbooks tailored to the needs
  of leading law firms and legal departments.

  This role sits at the intersection of customer value
  proposition, product innovation, and applied legal
  expertise. You will own both team performance and the
  overall strategy for how Custom Solutions drives customer
  value, adoption, and retention. You will partner closely
  with other Legal Engineering functions, Customer Success,
  Account Executives, the Transformation Office, Product and
  Engineering to ensure our solutions are impactful, scalable,
  and aligned with evolving customer needs.

  We are seeking a hands-on leader with deep legal experience
  who thrives in ambiguity, can manage complex customer
  engagements, and is excited to build and scale a high-
  performing team in a fast-paced environment.



  What You'll Do

  Lead and develop a high-performing team

  - Recruit, mentor, and manage a team of Custom Solutions Legal
    Engineers, setting a high bar for quality, creativity, and
    customer impact
  - Coach team members through complex customer engagements,
    including scoping ambiguous problems and delivering
    tailored solutions
  - Support performance management, career development, and
    capacity planning across the team

  Own team strategy and operations

  - Define and execute the strategy for Custom Solutions across
    Harvey’s customer base
  - Oversee day-to-day operations, including customer
    allocation, prioritization of engagements, and resource
    planning
  - Establish metrics to measure solution impact, customer
    adoption, and overall team performance

  Drive high-impact customer engagements

  - Oversee and, when needed, directly engage in complex
    customer projects involving custom prompts, workflows,
    playbooks and vault templates
  - Ensure consistent, high-quality delivery across all customer
    engagements, from initial scoping through implementation
    and iteration
  - Build strong relationships with key customer stakeholders to
    drive long-term adoption and value realization

  Scale solutions and best practices

  - Lead the development of reusable assets, templates, and
    playbooks to improve efficiency and consistency across
    deployments
  - Identify opportunities to standardize common use cases while
    preserving flexibility for bespoke solutions
  - Establish and refine processes that enable the team to scale
    without compromising quality

  Partner cross-functionally to improve product and delivery

  - Translate customer feedback into actionable product insights
    and partner with Product and Engineering to influence
    roadmap priorities
  - Collaborate with Customer Success to ensure solutions drive
    measurable improvements in customer outcomes and retention
  - Work with Legal Enablement to develop training materials,
    best practices, and internal knowledge sharing

  Drive innovation in legal AI

  - Encourage rapid prototyping, testing, and iteration of new
    features leveraging the latest Harvey capabilities and
    models for our customers
  - Stay at the forefront of legal industry trends and AI
    applications, bringing new ideas into customer solutions
    and team practices



  What You Have

  - 5+ years of legal experience at a top-tier law firm and/or
    in-house, with strong understanding of legal workflows and
    processes
  - Prior management or team lead experience with proven ability
    to lead, mentor, and develop high-performing teams of
    legal professionals
  - Experience working directly with customers or stakeholders
    on complex, ambiguous problems
  - Strong operational mindset with experience building or
    scaling processes, systems, or teams
  - Excellent communication skills with the ability to translate
    legal needs into technical or product-oriented solutions
  - Demonstrated interest in AI and its applications in the
    legal industry
  - Experience in legal innovation, legal tech, or building AI-
    enabled solutions
  - Experience working cross-functionally with Product,
    Engineering, or Customer Success teams
  - Track record of influencing product direction through
    customer insights

  Compensation

  $315,000 - $385,000 USD OTE 75/25 Split

