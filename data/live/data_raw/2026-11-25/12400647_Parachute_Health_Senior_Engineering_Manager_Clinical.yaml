description: |
  Parachute Health is transforming post-acute care as the
  leading digital ordering platform for medical equipment and
  supplies. We connect major health systems, health plans, and
  suppliers to help patients get the life-saving products they
  need at home. Since launching, we've connected 300,000+
  clinicians and 3,000+ supplier locations across all 50
  states and helped 15M+ patients. What started as a DME
  ePrescribing tool has become the order management platform
  of choice for home medical equipment.

  Join our team and make a difference in patient care.

  About the Role

  We are seeking a Senior Engineering Manager to lead two
  teams in our Clinical Division. You will own the engineering
  health, delivery, and technical direction of the clinician
  order pipeline and the patient continuity experience — two
  connected areas that sit at the center of how clinicians get
  patients the equipment they need.

  This is a multi-team role managing engineers spanning mid-
  level through staff. You will manage day to day, grow
  careers, hold a high performance bar, and partner closely
  with Product and Design to keep both teams shipping at a
  fast, sustainable pace.

  Responsibilities

  - Performance Management: Set a clear, high bar and hold it.
    Give direct, timely feedback; run substantive reviews;
    build promotion cases; and address underperformance early
    and fairly. You are comfortable having the hard
    conversation and following through on it.
  - Coaching and Growth: Manage multiple teams, with real
    ownership of their career growth and technical
    development. Develop tech leads and senior engineers who
    can carry scope without you in the room.
  - Team Execution and Delivery: Own both teams' goals and
    roadmap execution. Keep a high operating pace by removing
    blockers, tightening feedback loops, and protecting focus
    through planning, IPM, PR review turnaround, and work-in-
    progress discipline.
  - AI-Native Engineering: Raise how effectively your teams use
    AI tooling in daily engineering work — agentic coding,
    repo-native tooling and MCP servers, review and test
    acceleration. You are hands-on enough to have opinions
    about what works, where it breaks down, and how to build
    the judgment to tell the difference.
  - Product and Design Partnership: Act as the engineering
    counterpart to two PMs and two designers. Shape scope with
    them early, push back where the technical cost does not
    match the user value, and keep discovery and delivery
    moving in the same direction.
  - Strategic Technical Oversight: Review Architecture Decision
    Documents, run pre-launch risk assessments, and make sure
    the two areas evolve coherently instead of drifting apart
    at the seams.
  - Technical Shaping: Lead early technical discovery,
    feasibility analysis, and capacity estimation across both
    roadmaps.
  - Maintain Relevance: Stay close to the code through regular
    PR reviews, design discussions, and incident
    retrospectives.
  - Engineering Excellence: Guide engineering practice across
    both teams using agile methods, TDD, and robust software
    design principles.
  - Stakeholder Management: Serve as the primary point of
    contact for both teams with Product, Design, clinical
    stakeholders, and leadership.

  Requirements

  - Minimum of 5 years of management experience, including
    managing more than one team or managing through tech leads
  - Minimum of 10 years of experience delivering software in a
    production environment
  - Demonstrated track record as a performance manager: evidence
    of growing engineers to the next level, and of handling
    underperformance directly
  - Professional experience with open source programming
    languages
  - Hands-on familiarity with modern AI development tooling and
    experience on how to generate team adoption
  - Must reside in the U.S.

  Nice to Have

  - Experience in healthcare, clinical workflows, or another
    regulated domain
  - Experience leading teams through a manager transition or
    period of structural change
  - Experience operating in a large shared codebase with clear
    domain ownership boundaries

  Benefits

  - Medical, Dental, and Vision Coverage: Comprehensive plans
    with options for low-to-no-cost premiums
  - Employer HSA Contribution: Company-funded contributions to
    your Health Savings Account
  - 401(k) Retirement Plan
  - Equity Incentive Plan
  - Annual Company-Wide Bonus: Opportunity for up to 15% bonus
    based on company performance
  - Remote-First Culture: We are remote-first with a dedicated
    NYC office and reimbursement options for co-working spaces
  - Flexible Vacation Policy
  - Summer Fridays: 5 additional Fridays off during the summer
    (separate from PTO)
  - Home Office and Wellness Stipend
  - Monthly Internet Stipend
  - Annual Learning and Development Stipend

  Base Salary Band (based on experience and level)

  $260,000 - $310,000

