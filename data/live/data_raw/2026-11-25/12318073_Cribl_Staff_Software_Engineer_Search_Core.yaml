description: |
  Join the company that’s building the telemetry
  infrastructure for the AI era. At Cribl, we partner with IT
  and Security teams at many of the world’s biggest
  enterprises, including half of the Fortune 100, to bridge
  the gap between AI ambition and infrastructure reality. As
  the AI Platform for Telemetry, we give customers the choice,
  control, and flexibility to manage and analyze telemetry for
  both humans and agents, so they can build what’s next.

  We’re one of the fastest‑growing private companies and a
  leading player in a massive, fast‑moving market. With a
  global workforce, we’re remote‑first and grounded in a
  simple idea: software is a people business. Cribl is the
  place where curious, collaborative people can do their best
  work, grow fast, and bring their full selves to the herd.

  Why You'll Love This Role

  Cribl Search powers high-speed investigations for security
  and IT teams at some of the world's largest enterprises.
  Whether data lives in Lakehouse Engines or is spread across
  Federated sources, Search unifies ingest, storage, and
  analysis into a single experience — no tool-hopping, no
  complex orchestration. Teams collect once, search anywhere,
  and investigate with no blind spots.

  Now add agentic AI to the picture. AI-driven workloads are
  exploding, autonomous agents are firing queries alongside
  human analysts, and the volume and complexity of concurrent
  searches is growing fast. The query engine at the heart of
  Cribl Search needs to be faster, more concurrent, and more
  resilient than ever — and that's where you come in.

  Cribl is looking for a backend-focused Staff Software
  Engineer to join a remote-first, diverse, inclusive, cross-
  functional team of software developers focused on making
  search stupid fast. You will play a central role in evolving
  the query engine at the heart of Cribl Search – breaking
  through concurrency ceilings, optimizing query dispatching
  and execution, and tuning performance for workloads ranging
  from interactive analyst investigations to AI agents firing
  thousands of concurrent queries. This is an ideal role for
  anyone who is passionate about making Search blazing fast at
  a massive scale.

  On top of it all, you will have fun! Cribl strives to be a
  great place to work for everyone.

  As An Active Member Of Our Team, You Will …

  - Contribute to technical direction, bringing strong, loosely
    held, opinions to shape how Cribl Search evolves as a
    platform for multiple products
  - Own high-impact changes to large-scale systems, increasing
    performance and concurrency for both human and AI-driven
    agentic workloads
  - Build and support a strong foundation for Cribl Search as a
    whole, collaborating across various teams and divisions
  - Champion improvements to performance, reliability, and
    operability
  - Drive clarity across multiple stakeholders and ambiguous
    requirements, communicating tradeoffs and risks of
    competing priorities
  - Partner with leadership to translate organizational needs
    from across the business into actionable plans on our
    roadmap
  - Lead projects end-to-end – from ideation, scoping and design
    through implementation, testing, deployment, and
    production support
  - Mentor and coach engineers through design reviews, code
    reviews, and pairing
  - Write clean, maintainable, and testable code with an eye
    toward observability and resilience
  - Share on-call responsibilities as part of a team that
    embraces service ownership
  - Help define and refine the software development practices
    that make our team effective – everybody’s feedback helps
    shape our process
  - We are a remote-first company and work happens across many
    time-zones – this position will require stand-by, on-call,
    or off-hours duties

  If You've Got - We Want It

  - Strong experience designing and operating multiple-petabyte-
    scale data systems, including object and distributed
    storage
  - Experience building search, query, and/or analytic systems
    working with structured and unstructured data
  - Deep understanding of how search tools work – indexing,
    inverted indices, query parsing, and execution (think
    Lucene/Solr, Elasticsearch)
  - Experience working on high-performance, data-intensive
    applications where concurrency, throughput, and latency
    matter
  - Familiarity with compilers, ASTs, and query language
    internals
  - Polyglot engineer – C++ experience is highly desirable
  - Ability to problem-solve from first principles and maintain
    focus on overarching objectives
  - Demonstrated ability to lead projects through ambiguity,
    driving technical decisions across team boundaries
  - Experience working in a fast paced, dynamic environment
    where priorities shift quickly
  - Excellent communication skills, both verbal and written –
    able to explain complex technical topics to stakeholders
    in remote, distributed environments
  - Experience mentoring engineers and raising the technical bar
    on a team
  - Experience with C++, Typescript/JavaScript, NodeJS, and SQL

  #LI-JB1 #LI-Remote

  The salary for this role is dependent on geographic location
  and will be based on the individual candidate's job-related
  knowledge, skills, and experience. In addition to base
  salary, for sales and some sales-adjacent roles, employees
  are eligible to earn incentive compensation (commission).
  For all other roles, employees are eligible to participate
  in the Cribl Corporate Bonus Program. In addition to a
  competitive salary, Cribl also offers a generous benefits
  package which includes health, dental, vision, short-term
  disability, and life insurance, paid holidays and paid time
  off, a fertility treatment benefit, 401(k), and equity.

  Base Salary Range

  $205,000—$240,000 USD

  Bring Your Whole Self

  Diversity drives innovation, enables better decisions to
  support our customers, and inspires change for the better.
  We’re building a culture where differences are valued and
  welcomed, and we work together to bring out the best in each
  other. All qualified applicants will receive consideration
  for employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which the candidate is applying.

  Interested in joining the Cribl herd? Learn more about the
  smartest, funniest, most passionate goats you’ll ever meet
  at cribl.io/about-us.
