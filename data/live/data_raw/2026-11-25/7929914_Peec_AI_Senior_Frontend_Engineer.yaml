description: |
  About Peec AI

  AI search is changing how brands are discovered and chosen.
  People now ask ChatGPT, Gemini, Claude and Google’s AI
  answers what they used to search for, and AI assistants
  increasingly shape the journey from discovery to purchase.
  Winning customers now means winning over the AI systems that
  influence their decisions.

  Peec AI is an AI search platform that helps marketing teams
  understand and improve how their brands are discovered,
  represented, and recommended. We show them where they stand,
  what’s shaping it, and where to act. Since launching in
  January 2025, Peec AI has passed $20M ARR and 4,000+ paying
  customers. We’re a Series A company backed by 20VC and
  Singular, with 100+ people across our Berlin HQ and our New
  York office.

  What You’ll Do

  - Take ownership of complex frontend features end-to-end -
    from scoping and architecture to polished, high-quality
    delivery
  - Push the boundaries of what’s possible with modern frontend
    technologies and build pixel-perfect, visually refined UI
    that matches design specs down to the smallest detail
  - Collaborate closely with Product, Design, and Backend teams
    to translate ideas into elegant, performant user
    interfaces, ensuring a world-class user experience
  - Maintain high standards for code quality, accessibility, and
    performance through thoughtful reviews, testing, and best
    practices
  - Contribute to evolving our frontend architecture, component
    library, and design system to support rapid iteration at
    scale

  What We’re Looking For

  - 8+ years of professional frontend engineering experience,
    ideally in fast-paced startup or high-growth environments
  - Deep expertise in TypeScript, React, and modern frontend
    tooling - with a proven track record of shipping high-
    quality user-facing products
  - Experience contributing to, maintaining or building a shared
    component library or design system
  - A strong portfolio or GitHub showcasing frontend development
    expertise
  - Strong CSS knowledge, professional experience with
    TailwindCSS and semantic HTML
  - Exceptional attention to visual detail and a strong eye for
    design - capable of translating Figma designs into
    flawless, pixel-perfect interfaces
  - Strong communication skills and a high sense of ownership -
    able to operate with autonomy while staying aligned with
    team goals
  - Some markers of excellence, which could also be non-work
    related, like having a high FIDE rating
  - Genuinely kind, collaborative and hard-working people who
    make the team better through empathy and openness

  Tech Stack

  - Languages: TypeScript, CSS
  - Frontend: React, Tailwind CSS, Firebase/Firestore

  Bonus Points

  - Background working on AI products, complex data-heavy UIs,
    or real-time applications
  - Familiarity with technologies like Firebase/Firestore and
    shaping efficient frontend–backend interfaces
  - Strong architectural ability to design clean, scalable
    frontend systems
  - Academic background in Computer Science or a related
    technical field

  What We Offer

  - Exciting and challenging work with real impact and ownership
    at one of Europe’s fastest-growing Series A startups
  - Regular team events and off-sites
  - Aggressive equity compensation package
  - Paid Dinner & Uber home when working late
  - The most beautiful office space and work environment in
    Berlin
