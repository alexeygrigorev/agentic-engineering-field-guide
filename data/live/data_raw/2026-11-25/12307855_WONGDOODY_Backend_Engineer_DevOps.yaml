description: |
  wongdoody creates human experiences at 25 studios across 4
  continents. We believe the future can be molded. And by
  shaping human experiences through creativity and tech, we
  work to build a future we believe in.

  For us, this starts with our own culture. We strive to
  create an inclusive environment where every human can bring
  their whole self to work. Our clients are brands we believe
  in, from global big players to local heroes to startups we
  love. With each of our partners, we embark on a journey of
  co-creation, pushing the boundaries of what's possible and
  exploring the space where creativity and tech meet.

  Our team of fun, welcoming, values-driven, and collaborative
  problem solvers has one focus at the heart of everything we
  do: human experience. Human experiences are the touchpoints
  where brands connect with customers. And we transform
  businesses by creating engaging, inspiring moments using
  strategy, creativity, data and technology - all backed by
  the global technological power of Infosys.

  Experience, Tech & AI

  We are a cross-unit and cross-location AI, tech and
  experience team. With more than 50 developers, AI engineers,
  technical artists and consultants working directly with
  other WongDoody teams, we are team players and specialists -
  both in frontend and backend, as well as in creative
  production pipelines. As part of Infosys, we belong to a
  leading global technology company with access to solutions
  and extensive know-how in the fields of commerce, marketing
  automation and AI.

  Our local benefits

  - Flexible working hours and 100% overtime compensation
  - Work where it works for you. At home or in the office, or
    any mix you like
  - Working for strong brands and clients we believe in
  - 30 days vacation per year
  - Company Benefits
  - Urban Sports Club
  - Nice people in welcoming teams

  What you can expect

  - Develop and maintain web applications and APIs (REST,
    GraphQL) in line with architectural, security, and code
    quality guidelines using Python and Node.js; PHP may be
    used depending on the project.
  - Create technical concepts and proofs of concept (PoCs) as a
    basis for project estimates, and maintain technical
    project documentation.
  - Implement serverless and server-based cloud hosting
    environments (AWS, Azure, GCP) using and improving our
    automated toolset.
  - Build and improve automated CI/CD pipelines using GitLab,
    GitHub, Terraform, and Docker, with Kubernetes where
    applicable.
  - Contribute to the scalability, observability, security, and
    cost efficiency of the technical architecture, taking on
    greater ownership depending on your experience.
  - Maintain delivered solutions by monitoring their
    availability and providing necessary security and
    performance updates.
  - Share knowledge with team members and colleagues on
    development and operations topics, with opportunities to
    provide technical guidance and mentoring depending on your
    experience.
  - Use AI assistants such as Claude Code, GitHub Copilot,
    Codex, ChatGPT, and internal AI tools.
  - Ensure high software quality in your own work and contribute
    to team quality through active participation in peer code
    reviews.
  - Design, improve, and automate infrastructure for our
    development teams.

  What we'd love to see

  - 3+ years of practical experience in commercial software
    development projects; we welcome both intermediate and
    senior candidates.
  - A college or university degree in an IT-related field, or
    comparable education.
  - Strong technical knowledge of Python; experience with PHP
    and Node.js is a plus.
  - Strong knowledge of object-oriented programming, design
    patterns, and relational and document-based databases.
  - Experience with Bash scripting is a plus.
  - Practical experience with Docker and a solid understanding
    of cloud-based infrastructures such as AWS and GCP.
  - Working knowledge of DevOps tools and technologies,
    including CI/CD pipelines; deeper expertise in designing
    and improving these systems is welcome.
  - Familiarity with Linux-based systems such as Debian,
    including secure provisioning and maintenance.
  - Experience with automation tools for testing and
    infrastructure provisioning.
  - Familiarity with agile project management processes such as
    Scrum or Kanban.
  - Depending on your experience, the ability to take technical
    ownership, contribute to architectural decisions, and
    support colleagues through technical guidance and
    mentoring.
  - Strong English skills are required; good German skills are a
    plus.

  We care about your personality and professional skills. We
  don't care about your gender, age, nationality or appearance
  and are open to working with everyone.

  Please note: This is a job ad by wongdoody GmbH based in
  Germany. Through our website or other sources, you may find
  job ads published by one of our wongdoody sister companies
  around the globe with whom we act jointly under the band
  “wongdoody”. For each job offer, only the entity is
  responsible, which has published the ad. Contact persons,
  required information and applicable terms may differ. You
  can inform yourself how wongdoody GmbH is processing your
  personal data provided in the application process here.

  If you have any questions about the application process,
  feel free to contact our People & Culture Team directly
  under job@odt.net
