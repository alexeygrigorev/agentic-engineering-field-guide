description: |
  Join us in building the future of finance.

  Our mission is to democratize finance for all. An estimated
  $124 trillion of assets will be inherited by younger
  generations in the next two decades. The largest transfer of
  wealth in human history. If you’re ready to be at the
  epicenter of this historic cultural and financial shift,
  keep reading.

  About the team + role

  We are building an elite team, applying frontier
  technologies to the world’s biggest financial problems.
  We’re looking for bold thinkers. Sharp problem-solvers.
  Builders who are wired to make an impact. Robinhood isn’t a
  place for complacency, it’s where ambitious people do the
  best work of their careers. We’re a high-performing, fast-
  moving team with ethics at the center of everything we do.
  Expectations are high, and so are the rewards. Our
  engineering group is composed of the Brokerage, Incentives,
  and Identity teams, which are essential to our core platform
  and user growth. Together, we build and scale services that
  support trading, deliver personalized rewards, and protect
  our customers by preventing fraud. We collaborate with teams
  across Data Science, Crypto, Security, and Product to build
  reliable infrastructure! Our culture is high-performing,
  fast-moving, and ethical in everything we do.

  As a Software Engineer, Backend - Government Products, you
  will design, build, and own backend services,
  infrastructure, and data systems that support Robinhood’s
  core products. You will solve complex scalability challenges
  while gaining deep expertise in financial systems and making
  a direct impact on the products used by millions. In this
  position, you will build product-facing features and
  platform enhancements that meet strict correctness
  standards. You will partner with engineering leads and
  product managers to deliver impactful technical solutions
  that expand our services.

  This role is based in our Menlo Park, CA or New York, NY
  office(s), with in-person attendance expected at least 3
  days per week. At Robinhood, we believe in the power of in-
  person work to accelerate progress, spark innovation, and
  strengthen community. Our office experience is intentional,
  energizing, and designed to fully support high-performing
  teams.

  What you’ll do

  - Design, build, test, and deploy scalable backend services
    and systems with a strong emphasis on long-term
    maintainability.
  - Develop product-facing features and platform enhancements
    that meet strict correctness and scalability standards.
  - Identify and implement improvements to system performance,
    engineering productivity, and risk reduction.
  - Collaborate closely with client teams, product partners, and
    external vendors to deliver impactful technical solutions.

  What you bring

  - 2+ years of experience in software development.
  - Strong track record of successfully delivering large-scope
    technical projects in collaborative team environments
    partnering across engineering, product, and operations.
  - Commitment to high standards in code quality and review
    processes.
  - Solid understanding of backend development, system design,
    and the intersection of product and engineering.
  - Proficiency in Go or Python.
  - Hands-on experience with Kafka or similar data streaming
    technologies.
  - Familiarity with managing and processing large-scale
    datasets.

  Bonus points

  - Experience working at a fintech company or financial
    institution.
  - Familiarity with technologies like Postgres, Kubernetes
    (K8s), Redis, and AWS (or similar cloud platforms).

  What we offer

  - Challenging, high-impact work to grow your career.
  - Performance driven compensation with multipliers for
    outsized impact, bonus programs, equity ownership, and
    401(k) matching.
  - Top Tier benefits to fuel your work, including 100% paid
    health insurance for employees with 90% coverage for
    dependents.
  - Access to the Robinhood Employee Fund that gives eligible US
    employees the opportunity to invest in a private employee
    fund that provides exposure to Robinhood Ventures funds.
  - Access to the best AI tools on the market and continuous AI
    skill-building for every employee, technical or not.
  - Lifestyle wallet - a highly flexible benefits spending
    account for wellness, learning, and more.
  - Employer-paid life & disability insurance, fertility
    benefits, and mental health benefits.
  - Time off to recharge including company holidays, paid time
    off, sick time, parental leave, and more!
  - Exceptional office experience with catered meals, events,
    and comfortable workspaces.

  Position Restriction: This position is restricted to US
  citizens or lawful permanent residents

  In addition to the base pay range listed below, this role is
  also eligible for bonus opportunities + equity + benefits.

  Base pay for the successful applicant will depend on a
  variety of job-related factors, which may include education,
  training, experience, location, business needs, or market
  demands. The expected base pay range for this role is based
  on the location where the work will be performed and is
  aligned to one of 3 compensation zones. For other locations
  not listed, compensation can be discussed with your
  recruiter during the interview process.

  Base Pay Range:

  Zone 1 (Menlo Park, CA; New York, NY; Bellevue, WA;
  Washington, DC)

  $166,000—$195,000 USD

  Zone 2 (Denver, CO; Westlake, TX; Chicago, IL)

  $147,000—$172,000 USD

  Zone 3 (Lake Mary, FL; Clearwater, FL; Gainesville, FL)

  $130,000—$152,000 USD

  Click here to learn more about our Total Rewards, which vary
  by region and entity.

  If our mission energizes you and you’re ready to build the
  future of finance, we look forward to seeing your
  application.

  AI Usage Disclosure: Robinhood uses artificial intelligence
  (AI) tools to support parts of our recruiting process. These
  tools enhance the efficiency and consistency of our hiring
  process; however, all hiring decisions are made by our
  hiring teams.

  Application Limit: Candidates may submit no more than 3
  applications in any 90 days. Within that time, they may
  apply to each role only once.

  Robinhood provides equal opportunity for all applicants,
  offers reasonable accommodations upon request, and complies
  with applicable equal employment and privacy laws. Inclusion
  is built into how we hire and work—welcoming different
  backgrounds, perspectives, and experiences so everyone can
  do their best. Please review the Privacy Policy for your
  country of application.
