description: |
  Tech Lead – Full Stack & SaaS Platform

  Location: Hybrid (Eastern Time Zone) Employment Type: Full-
  Time (Minimum 36.5 hours/week) Compensation: $200,000 -
  $225,000

  We are a leading, full-service Medicaid management and
  healthcare financial consulting firm operating across 22
  states. Over the past twenty years, we have built
  proprietary workflows and case-tracking systems that allow
  our teams to process thousands of complex long-term care
  Medicaid applications every year—helping healthcare
  facilities accelerate approvals and supporting families
  through critical transitions. With over 450 employees across
  multiple locations, we continue to invest heavily in our
  internal SaaS platforms and data infrastructure to automate
  workflows, strengthen compliance, and scale our operational
  reach.

  As Tech Lead – Full Stack & SaaS Platform, you will serve as
  a true player-coach—blending hands-on software architecture
  and full-stack development with direct people management for
  a team of developers. Our engineering organization needs a
  leader who does not step away from the codebase, but instead
  leads from the front: designing resilient Python/FastAPI
  backends, React frontends, and AWS data pipelines while
  actively guiding engineers, enforcing clean code standards,
  and owning delivery from architectural blueprint to
  production release.

  Key Responsibilities

  - Manage, coach, and provide daily technical direction to a
    team of full-stack software engineers—overseeing sprint
    planning, workload allocation, code quality, and career
    growth.
  - Stay actively hands-on in system architecture and full-stack
    feature development using Python, FastAPI, and React.
  - Design, optimize, and maintain scalable AWS cloud
    infrastructure, high-volume data pipelines, and hybrid
    data architectures utilizing PostgreSQL and DynamoDB.
  - Lead thorough code reviews, establish and enforce
    engineering standards, and mentor developers to elevate
    overall team velocity and code maintainability.
  - Own technical projects end-to-end—translating business
    requirements into scalable SaaS platform architectures,
    resolving complex production issues, and ensuring
    reliable, on-time delivery.

  Required Qualifications & Must-Haves

  - Experience & Management Baseline (Strict Requirement):
    Minimum of 5+ years of professional software engineering
    experience, including at least 2+ years of actual team
    management experience leading developers.
  - Proven Engineering Leadership: Demonstrated track record
    managing engineers, overseeing their day-to-day technical
    output, and providing clear technical direction.
  - Core Full-Stack & Cloud Proficiency: Strong, hands-on
    expertise in Python, FastAPI, React, and AWS.
  - Data & SaaS Architecture: Solid production experience with
    PostgreSQL, DynamoDB, data pipelines, and building
    scalable SaaS platforms.
  - Code Quality & Mentorship: Proven ability to lead code
    reviews, enforce engineering standards, and actively
    mentor developers.
  - Architectural Ownership: Strong technical architecture,
    complex problem-solving, and end-to-end project ownership
    skills, with hybrid availability in the Eastern Time Zone.
