description: |
  Overview

  The Artificial Intelligence (AI) Infrastructure Efficiency
  team at Microsoft is focused on maximizing efficiency for
  Microsoft’s GPU fleet, including model inference. You will
  be focused on end-to-end performance analysis and
  optimization for fleet and inference operations.

  This work spans all layers of the stack to achieve results,
  from underlying operational data completeness and quality,
  to inference engines, to fleet operations, to product offer
  design.

  As a Principal Software Engineer in the Efficiency team, you
  will be accountable for end-to-end results, building hands-
  on, and providing technical leadership for a deeply complex
  and ambiguous problem space.  You will establish engineering
  standards, mentor other engineers, influence cross-
  functional teams, and drive secure, reliable, and
  maintainable solutions across product boundaries.

  Key qualities include a bias to action and the ability to
  balance long- and short-term concerns, maintaining technical
  rigor while making pragmatic choices. You should be
  comfortable building in an agent-first way, but with the
  judgment to know when the agent is off track. Strong
  communication skills are also essential, as the role will
  involve working across multiple engineering groups to
  achieve efficiencies.

  This opportunity will allow you to make a huge impact on
  Microsoft by supporting both growth and profit goals. You
  will also have the chance to expand your influence across
  Microsoft and the broader technology community.

  Microsoft's mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others and collaborate to realize our shared goals. Each day
  we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Oversee and own the design and implementation of deeply
    complex and ambiguous efficiency improvements, evaluate
    design options and trade-offs, and align technical
    decisions with customer, business, and long-term platform
    outcomes.

  - Drive innovation and delivery across efficiency initiatives,
    directly building and guiding teams through architecture,
    design, implementation, validation, deployment, and
    operationalization.

  - Design platform-first products, services, tools, and
    extensible code that can be reused across the organization
    while meeting performance, scalability, resiliency,
    disaster recovery, security, compliance, and cost
    requirements.

  - Act as a technical authority for full-stack performance
    analysis and optimization, verification, telemetry, and
    reliable automation.

  - Build alignment across teams, customers, and technical
    leadership; negotiate dependencies and trade-offs, hold
    stakeholders accountable for commitments, and execute a
    long-term vision for core infrastructure.

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 8+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python OR equivalent experience.

  Other Requirements:

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include but are not limited to the
  following specialized security screenings: Microsoft Cloud
  Background Check: This position will be required to pass the
  Microsoft Cloud background check upon hire/transfer and
  every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 12+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python OR Bachelor's Degree in
    Computer Science or related technical field AND 15+ years
    technical engineering experience with coding in languages
    including, but not limited to, C, C++, C#, Java,
    JavaScript, or Python OR equivalent experience.

  - Experience directly building in large-scale, high-
    performance, reliable systems.

  - Experience providing architecture and technical leadership
    for multiple large-scale distributed systems, databases,
    analytics systems, or platform product areas.

  - Experience aligning technical decisions with business
    outcomes and influencing cross-functional teams and senior
    technical leadership.

  - Experience building interactive services, analytics
    interfaces, data infrastructure, compute infrastructure,
    or other large-scale platform systems.

