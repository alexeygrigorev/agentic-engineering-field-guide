description: |
  Redpanda is the first runtime and control plane for agent-
  data interaction — a unified platform that combines
  streaming, SQL analytics, and intelligent connectivity with
  the governance layer enterprise AI agents need in
  production.

  Built on infrastructure already trusted by Fortune 500
  companies and fast-growing startups, Redpanda enforces
  governance entirely outside the agent's data path,
  controlling what agents see, limiting what they do, and
  capturing a tamper-proof record of everything they touch, so
  organizations never have to choose between innovation and
  control.

  About the Role:

  Forward Deployed Engineering (FDE) is how Redpanda gets the
  Agentic Data Plane (ADP) into production at our most
  strategic customers. We embed engineers with those customers
  to build the agents, integrations and pipelines that turn
  ADP into outcomes they own.

  As Sr. Manager, Customer Engineering, you’ll lead pods of
  FDE, a small teams of engineers who cover a group of
  customers together. You’ll manage and grow the engineers,
  set up new engagements, and be the first person customers
  and your team call when something goes wrong. The team is
  new and the model is still being written, so you’ll help
  shape how it works as we scale.

  You Will:

  - Lead our pods. Manage the FDEs in ours pods, run it so any
    engineer can pick up any of the pod’s customers.
  - Build the team. Hire FDEs, coach them against our FDE,
    Senior and Staff levels, and give them direct feedback on
    their work.
  - Set up engagements. Work with Sales and the customer to
    decide whether we deliver the work ourselves or build
    alongside their engineers. Agree scope and success
    criteria, and staff each engagement with the right level
    of engineer.
  - Own escalations. Be the first line of escalation for your
    pod’s customers and engineers. Resolve what you can fast,
    and send production incidents through support so your FDEs
    aren’t left running them.
  - Deliver outcomes. Work with engagement managers so each
    quarter ends with something live that the customer can run
    without us. Track time to value across the pod and fix
    what slows it down.
  - Shape the model. Help define how pods are staffed, how
    engagements are scoped and sold, how we measure success,
    and what goes in our playbooks. Bring patterns from the
    field back to Product.

  You Have:

  - Experience. 6+ years across software engineering and
    customer-facing technical roles, including 2+ years
    leading engineers on customer deployments, either as a
    manager or as the lead of a deployment team.
  - Engineering credibility. You’ve written production software.
    You can still review a design and hold your own in an
    architecture debate.
  - Deployment leadership. You’ve led enterprise deployments
    from scoping to production. You’ve told a customer
    executive a project was at risk and then got it back on
    track.
  - People leadership. You’ve hired and coached strong
    engineers, given hard feedback, and helped someone grow
    from executing tasks to leading their own engagement.
  - Starting from scratch. You’ve built team process where none
    existed, and you’re comfortable leading while the model is
    still taking shape.

  Nice to Have:

  - Experience in a forward deployed model.
  - Background in streaming or real-time data (Kafka, Flink,
    Redpanda), or agent and LLM systems in production.
  - Work in regulated industries (financial services,
    healthcare, public sector) or air-gapped environments.
  - Experience shaping services commercials with Sales.

  U.S. base salary range for this role is $220,000, not
  including bonus and/or commission. Our salary ranges are
  determined by role, level, and location. We strive to
  consider each candidate's job-related skills, location,
  experience, relevant education or training to determine
  individual base salary. Your talent partner will share more
  about the specific salary range for your preferred location
  during the hiring process.

  Join Redpanda if you’d enjoy being part of a fast-moving,
  diverse, people-first organization with team members around
  the globe and a culture based on trust, transparency,
  communication, and kindness. You'll dive into a nimble,
  high-impact team with the latest AI tools — and the budget
  to actually use them.
