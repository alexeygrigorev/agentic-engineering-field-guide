description: |
  Overview

  Nakupuna Companies is looking for a Senior Software
  Engineer/Developer to provide Naval Supply Systems Command
  (NAVSUP) Business Systems Center (BSC) contractor support
  services to support Development efforts. NAVSUP BSC requires
  technical support services to modernize systems and support
  the migration of multiple systems to various platforms. The
  main function of this position is to assist in identifying
  common services across multiple applications and building
  them with the correct infrastructure to be called. Support
  services will include engineering, coding, integration
  testing, and documentation of change requests for government
  client in Mechanicsburg, PA.

  Responsibilities

  The following reflects management’s definition of essential
  functions for this job but does not restrict the tasks that
  may be assigned. Management may assign additional duties
  andresponsibilities to this job at any time due to
  reasonable accommodation or other reasons.

  - Provide engineering expertise for the design, development,
    implementation, and sustainment of IT solutions that
    enhance overall system performance and availability
  - Develop, create, maintain, and write/code new (or modify
    existing) computer applications, software, or specialized
    utility programs in support of system modernization
  - Analyze information to determine, recommend, and plan the
    development of a new application or modification of an
    existing application.
  - Analyze user needs and software requirements to determine
    feasibility of design within time and cost constraints
  - Compile and write documentation of program development and
    subsequent revisions, inserting comments in the coded
    instructions so others can understand the program.
  - Confer with systems analysts, engineers, programmers, and
    others to design applications and to obtain information on
    project limitations and capabilities, performance
    requirements, and interfaces
  - Consult with engineering staff to evaluate the interface
    between hardware and software.
  - Develop software system testing and validation procedures,
    programming, and documentation
  - Modify and maintain existing software to correct errors, to
    adapt it to new hardware, or to upgrade interfaces and
    improve performance
  - Perform integrated quality assurance testing for security
    functionality and resiliency attack
  - Store, retrieve, and manipulate data for analysis of system
    capabilities and requirements
  - Apply cybersecurity functions (e.g., encryption, access
    control, and identity management) to reduce exploitation
    opportunities using cybersecurity principles and
    organizational requirements (relevant to confidentiality,
    integrity, availability, authentication, nonrepudiation)
    that apply to software development Identify and leverage
    the enterprise-wide version control system while designing
    and developing secure applications
  - Consult with customers about software system design and
    maintenance
  - Debug software using standard debugging principles
  - Work with assigned application teams to assist in
    development of policies for standardizing systems,
    development tools and security patches
  - Create programs that validate and process multiple inputs
    including command line arguments, environmental variables,
    and input streams
  - Develop applications that can log and handle errors,
    exceptions, and application faults and logging
  - Write code in a currently supported programming using
    programming principles such as object-oriented design,
    standard computer networking concepts and protocols, and
    network security methodologies
  - Develop documentation based upon Industry Agile best
    practices and current organizational policies
  - Assist with operational, technical tool standardization,
    consistent continuous integration and continuous
    deployment (CI/CD) pipelines, and system and services
    views for architectures using applicable Navy security
    standards
  - Automate builds, testing, and deployments within CI/CD
    pipelines while enforcing security and quality standards
    including version control
  - Establish technical artifact management practices across
    artifacts such as libraries, dependencies, and builds
  - Support production outages, as required
  - Provide support to the development of the release packages
  - Create and update work items in the designated tool
  - Participate in internal review/change boards
  - Conduct quality audits of NAVSUP products, perform causative
    research on errors, and provide corrective action
  - Excellent technical skills, organizational and planning
    skills, excellent communication, and problem-solving
    skills, problem analysis, attention to detail and
    accuracy, solid judgment and decision-making ability,
    takes initiative and is adaptable.

  Qualifications

  Skills/Qualifications: The candidate must have experience
  working with the following technologies: Java 8 or higher,
  JavaScript, JQuery, XML, XML Schema, SQL, Oracle databases,
  .NET, C#. Must have the required IAM Level I certification
  (CompTIA Security +).

  The following are desirable qualifications/levels of
  experience:

  - Technical knowledge in Navy or DoD supply processes and
    interfaces
  - Minimum of 2 years of college/technical knowledge and 5
    years of work experience in modern software development
  - Minimum 2 years of college/technical knowledge and 5 years
    of work experience with Azure DevOps, Microsoft O365 and
    Teams, Excel, Visio and Outlook applications
  - Minimum of 3 years of experience in agile concepts and
    principles and experience participating in agile teams
  - Minimum of 5 years of knowledge and experience working
    proficiently in one or more of the following:
    - Java EE, Java Persistence API (JPA), JSP, EJB,
    - JDeveloper, Eclipse, Maven
    - Java Services, Service Oriented Architecture
    - C#, .NET, .NET Core, Entity Framework, ASP.NET,
    - PowerShell, Visual Studio
    - HTML, CSS, JavaScript, Typescript, VS Code, jQuery
    - Java Spring Framework
    - Service-based architectures, APIs, REST,
    - SOAP, including Event-driven architectures
    - EDI (ASC X l 2/DLMS standards), XML (CICA standards)
    - WebLogic, Fusion Middleware
    - Secure FTP scripting
    - Web application development and environments
    - Oracle 12c (SQL, PL/SQL programming, stored procedures,
      views, schemas, etc.).
    - Kubernetes, OCI Containers

  - Minimum 3 years of experience with DevOps tools and
    practices (e.g., CI/CD pipelines, containerization, cloud
    platforms)
  - Strong knowledge of security tools and techniques (e.g.,
    vulnerability scanners, intrusion detection systems)
  - Ability to write scripts for automation (e.g., Bash,
    PowerShell)
  - Minimum 3 years of knowledge and experience with:
    - Cloud-native architectures
    - Infrastructure as Code

  - At least one year of experience with Platform as a Service
    (PaaS) environment, such as Appian or SalesForce
  - Strong analytical skills to assess security risks and
    vulnerabilities
  - Excellent communication skills to collaborate with
    development, security, and operations teams
  - Ability to work effectively in a collaborative environment
  - A strong understanding of security principles and best
    practices
  - A passion for automating tasks to improve efficiency and
    reduce risk
  - The ability to adapt to changing security threats and
    technologies

  Education and Experience:

  - Bachelor’s degree, with a technical major, such as
    engineering or computer science is required. Degree may be
    substituted for 2 years of college and 3-5 years of
    related work experience.

  - Experience with government and DoD environments is desired.

  Required: CompTIA Security +

  Military Installation Access: Must be able to qualify for
  and obtain a base access pass. Must be able to obtain a
  favorable National Security Agency Check (NACI), including a
  FBI fingerprint check.  Must be a U.S. citizen. Must obtain
  CAC Card.



  Travel: Travel will not occur regularly and will typically
  be less than 5% of the time.

  Location: This is a remote position.

  Physical Requirements: The ideal candidate must at a minimum
  be able to meet the following physical requirements of the
  job with or without a reasonable accommodation:

  - Ability to perform repetitive motions with the hands,
    wrists, and fingers.
  - Ability to engage in and follow audible communications in
    emergency situations.
  - Ability to sit for prolonged periods at a desk and working
    on a computer.

  The Nakupuna Companies use a market-based compensation
  strategy to ensure that our employees are compensated within
  applicable market ranges commensurate with multiple factors,
  including but not limited to the individual’s particular
  combination of education, knowledge, skills, competencies,
  and experience, as well as contract-specific affordability,
  organizational requirements, and position location. The
  projected compensation range for this position is $120,000
  to $135,000 (annualized USD). The salary range displayed
  represents the typical salary range for this position and is
  just one component of Nakupuna Companies' total compensation
  package for employees.
