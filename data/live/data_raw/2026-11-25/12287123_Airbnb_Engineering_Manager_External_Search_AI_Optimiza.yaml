description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.

  The Community You Will Join:

  The Growth Platform (Marketing Technology) team’s vision is
  to drive long term sustainable growth for the Airbnb
  community. Our mission is to build best-in-class agentic
  systems, and capabilities to support the growth of all
  Airbnb products, current and future.

  The External Search & AI Optimization team's mission is to
  make Airbnb the most visible and trusted destination
  wherever people search for travel, from traditional search
  engines to AI answer engines and assistants. We build
  landing pages, structured content, and platform that help
  travelers discover stays, experiences, and services across
  hundreds of thousands of destinations and a broad range of
  languages and locales. As a product, infrastructure, and
  growth team within Marketing Technology, we own our stack
  end to end: CDN, frontend, backend, data pipelines, and AI
  agents. We partner closely with Product, Design, Marketing,
  and Data Science, as well as engineering teams across the
  company, to grow Airbnb's visibility, organic traffic, and
  bookings.

  The Difference You Will Make:

  As the Engineering Manager for External Search & AI
  Optimization, you will lead a team of engineers, from early-
  career to staff, working across frontend, backend, and data.
  You will own the engineering strategy and roadmap as travel
  discovery expands from search results to AI-generated
  answers, balancing continued growth in traditional search
  with new investment in making Airbnb easy for AI products to
  read, cite, and recommend. In your first year, success means
  measurable growth in Airbnb's visibility, traffic, and
  bookings from search and AI, a single roadmap shared across
  functions, and a healthy team whose engineers are growing.

  A Typical Day:

  - Lead, coach, and grow a team of full stack and data
    engineers, and create an environment where they own
    initiatives end to end.
  - Set technical strategy and roadmap with Product, Design,
    Marketing, and Data Science, and keep many concurrent
    cross-functional projects prioritized and moving.
  - Guide the team in building fast, reliable landing pages,
    content systems, and data pipelines that serve travelers,
    search crawlers, and AI agents across many languages and
    locales.
  - Drive responsible use of LLMs to generate, translate, and
    improve content at scale, with strong evaluation and
    quality practices.
  - Build the measurement and experimentation needed to show how
    search and AI referrals drive bookings, and communicate
    progress and impact to senior leadership.
  - Stay close to the work through design reviews and technical
    deep dives, and uphold a high bar for engineering quality
    and reliability.

  Your Expertise:

  - 9+ years of relevant software engineering industry
    experience, including 5+ years of engineering management
    experience leading teams that own large-scale, user-facing
    systems.
  - Track record of hiring, growing, and retaining a diverse,
    high-performing team, including staff-level engineers.
  - Technical breadth across web frontend, backend services, and
    data pipelines, with the judgment to guide architecture
    decisions.
  - Experience applying machine learning or LLMs in production,
    and using experimentation to measure impact.
  - Experience driving growth for a consumer product; search
    engine optimization, AI answer engine optimization, or
    other organic growth experience is a plus.
  - Strong communication and influence with technical and non-
    technical partners, including Product, Marketing, Data,
    Finance, and Legal.
  - Comfort leading through ambiguity, balancing short-term
    business outcomes with long-term technical and team
    health.

  Preferred Qualifications:

  - Experience with technical SEO and search engineering,
    including crawling, indexing, rendering, structured data,
    sitemaps, internal linking, and search performance
    optimisation.
  - Understanding of how SEO and SEM work together, and how
    engineering can drive automation and optimisation at
    scale.
  - GEO/AEO and optimisation for AI-powered search experiences.
  - Agile Practice for AI Production: Experience with the entire
    AI product development lifecycle from incubation to
    production at scale, following agile practices in the
    Applied AI/ML domain.
  - Infrastructure Acumen: Experience building robust testing
    frameworks for agent behavior validation and continuous
    improvement, and driving architectural requirements on
    agentic systems

  How We'll Take Care of You:

  Our job titles may span more than one career level. The
  actual base pay is dependent upon many factors, such as:
  training, transferable skills, work experience, business
  needs and market demands. The base pay range is subject to
  change and may be modified in the future. This role may also
  be eligible for bonus, equity, benefits, and Employee Travel
  Credits.

  Pay Range

  $212,000—$265,000 USD

  Reasonable Accommodations: We are committed to providing
  reasonable accommodations throughout the recruitment process
  for applicants with disabilities. If you need assistance, or
  an accommodation, please let your recruiter know once you
  are contacted about a role.

  A Note on Recruiting Scams: Scammers sometimes pose as
  Airbnb recruiters to get money or personal information from
  candidates. A few things that will always be true for
  Airbnb’s hiring process: our open roles are posted on
  Airbnb’s Career’s Page at careers.airbnb.com, and our
  recruiters correspond only from @airbnb.com or
  @ext.airbnb.com email addresses. Our recruiters will never
  ask for your Social Security number, bank account details,
  passport, or payment app information while you are
  interviewing.  We’ll also never ask you to pay a fee, send
  money, deposit or cash a check, or purchase work-related
  equipment (such as a company laptop) during the interview
  process. We encourage candidates to remain vigilant of these
  recruiting scams and not share sensitive information if you
  do not believe an individual is actually affiliated with
  Airbnb.
