description: |
  The Platform team creates the technology that enables
  Spotify to learn quickly and scale easily, enabling rapid
  growth in our users and our business around the globe.
  Spanning many disciplines, we work to make the business
  work; creating the infrastructure, tooling, frameworks, and
  capabilities needed to welcome a billion customers.

  We're looking for a Backend Engineer to join Babka, a team
  within Spotify's Data Infrastructure organization. Babka
  powers the analytics behind experiences like Spotify for
  Artists and Spotify for Creators, helping artists, creators,
  and music labels explore how their content performs through
  fast, interactive data insights.

  Originally built to support music analytics, our platform
  now serves podcasts, audiobooks, and internal Spotify tools.
  As we expand our capabilities across Spotify, you'll join us
  at an exciting stage, with opportunities to shape our
  technical direction, improve our infrastructure, and make
  analytics easier for engineering teams to build and operate.

