description: |
  Role summary

  This position is ideal for an experienced software
  engineering leader with an interest in the manufacturing
  industry to join the Global Manufacturing Applications team
  as a Manager supporting Align’s global manufacturing
  operations. Leading a team of Software Engineers and
  Software Quality Engineers, you’ll partner with global
  product and process engineering teams to deliver reliable,
  scalable and high-quality manufacturing software solutions
  that enable high-tech manufacturing and operational
  improvements. This role is responsible for building and
  developing a high-performing software engineering team,
  driving predictable execution, advancing software
  engineering and quality practices, and ensuring the
  reliability and operational success of business-critical
  manufacturing applications. The Manager will play a key role
  in advancing Align Technology’s manufacturing software
  architecture, CI/CD, test automation and DevOps capabilities
  while balancing roadmap delivery, technical sustainability
  and operational priorities.

  Key Responsibilities

  Key Responsibilities

  ·       Lead, develop and manage a team of approximately 8
  Software Engineers and Software Quality Engineers,
  establishing clear expectations, accountability and a
  culture of collaboration, continuous learning and technical
  excellence.

  ·       Provide ongoing coaching, technical guidance,
  performance feedback and career development for team
  members, enabling engineers to grow their technical
  capabilities, ownership and overall effectiveness.

  ·       Accountable for the planning, execution and delivery
  of manufacturing software initiatives, balancing product
  roadmap commitments, operational priorities, technical debt
  and continuous improvement activities.

  ·       Partner with product, process engineering,
  manufacturing, architecture and other cross-functional
  stakeholders to translate business and manufacturing needs
  into clear software priorities, technical solutions and
  achievable delivery plans.

  ·       Provide technical leadership and oversight for the
  design, development, testing, deployment and support of
  reliable, scalable and performant MES applications,
  integrations and reporting solutions.

  ·       Establish and continuously improve software
  engineering and software quality practices, including design
  and code reviews, automated unit and integration testing,
  test automation, defect management, release readiness and
  engineering documentation.

  ·       Advance the team’s CI/CD and DevOps capabilities,
  partnering with Software Engineers, Software Quality
  Engineers, DevOps engineers and other technology teams to
  increase deployment reliability, automation and development
  efficiency.

  ·       Guide the design and implementation of MES
  integrations using technologies such as Kafka, Rockwell
  FTPC, SAP Mii, RESTful APIs and other synchronous and event-
  driven integration approaches.

  ·       Ensure effective management and resolution of issues
  within multi-tiered and highly integrated manufacturing
  systems, facilitating systematic root-cause analysis,
  appropriate technical escalation and sustainable corrective
  solutions.

  ·       Establish and monitor appropriate measures of
  software quality, delivery predictability, system
  reliability, operational performance and engineering
  effectiveness, using data to identify improvement
  opportunities and guide team priorities.

  ·       Proactively manage technical risk, application
  lifecycle considerations, technical debt and system
  maintainability, partnering with architects and senior
  technical contributors on technology and architecture
  decisions.

  ·       Promote a security, performance, scalability,
  reliability, maintainability and usability mindset across
  software design, development, testing and deployment
  activities.

  ·       Ensure application designs, architectural decisions,
  solution implementation notes, configuration changes,
  testing artifacts and deployment work instructions are
  appropriately documented and maintained.

  ·       Promote effective Agile/Scrum practices, enabling
  clear priorities, effective planning, transparent
  communication, timely escalation of risks and continuous
  improvement of team execution.

  ·       Build strong working relationships across global
  manufacturing and technology teams and communicate technical
  topics, delivery status, risks, dependencies and trade-offs
  clearly to both technical and non-technical stakeholders.

  ·       Foster a collaborative and inclusive team
  environment that encourages ownership, constructive
  technical discussion, knowledge sharing, innovation and
  recognition of individual and team accomplishments.

  Skills, Knowledge & Expertise

  Skills, Knowledge & Expertise

  ·       Bachelor’s or Master’s Degree in Computer Science,
  Engineering or a related technical field.

  ·       8+ years of experience in software engineering,
  software development, software quality engineering or
  related technical roles, including demonstrated experience
  leading software engineering teams or complex software
  delivery initiatives.

  ·       Demonstrated experience managing and developing
  software engineering professionals, including coaching,
  performance management, career development, hiring and
  establishing clear expectations and accountability.

  ·       Strong understanding of full-stack web application
  and distributed system architecture, including front-end
  applications, backend services, APIs, databases, messaging
  and system integrations.

  ·       Strong technical foundation in modern software
  engineering concepts, including object-oriented design and
  development, API design, automated testing, integration
  patterns, source control, CI/CD and DevOps practices.

  ·       Ability to provide technical leadership and make
  sound engineering decisions while empowering Software
  Engineers and Software Quality Engineers to own
  implementation details and technical solutions.

  ·       Experience leading software development using modern
  SDLC and Agile/Scrum methodologies, with demonstrated
  ability to manage competing priorities, dependencies, risks
  and delivery commitments.

  ·       Strong understanding of software quality engineering
  and test automation, including unit, API, integration,
  regression and end-to-end testing and the integration of
  automated testing into CI/CD pipelines.

  ·       Demonstrated ability to lead the troubleshooting of
  complex, multi-tiered and highly integrated software
  systems, including effective root-cause analysis and
  management of critical production issues.

  ·       Demonstrated security, performance, scalability,
  reliability, maintainability and usability mindset when
  evaluating software solutions and engineering practices.

  ·       Strong analytical and problem-solving capabilities,
  including the ability to evaluate technical and business
  trade-offs and make decisions in situations with competing
  priorities or incomplete information.

  ·       Excellent written and verbal communication,
  presentation and technical teach-back skills, with the
  ability to communicate effectively with engineers,
  manufacturing stakeholders and senior leadership.

  ·       Demonstrated ability to build effective cross-
  functional and global partnerships and influence outcomes
  beyond the manager’s immediate team. Complementary Skills

  ·       Experience leading teams developing full-stack
  applications using Java, Spring Boot, RESTful APIs and
  modern Single-Page Application (SPA) frameworks such as
  Angular or React.

  ·       Experience with Manufacturing Execution Systems
  (MES) and manufacturing applications, including Rockwell
  FTPC Modular Framework or similar platforms.

  ·       Experience with Java-based enterprise applications,
  object-oriented software architecture and modern application
  development practices.

  ·       Knowledge of shop-floor manufacturing processes, MES
  workflows, manufacturing system integrations and business-
  critical operational systems.

  ·       Experience managing software supporting high-
  availability or business-critical manufacturing operations
  across multiple sites or regions.

  ·       Experience working within the medical device or
  another regulated manufacturing industry.

  Additional Information

  The salary range indicated for this role reflects the
  minimum and maximum we expect to offer at the time of
  publication of the advert. The final salary will be
  determined based on factors such as experience, skills,
  business needs and alignment with equivalent salary levels.
  Where applicable, employees may also be eligible for an
  annual bonus, long-term incentive schemes and other
  benefits; further details are available from our Talent
  Acquisition team.

