description: |
  Why Harvey

  At Harvey, we’re transforming how legal and professional
  services operate. By combining frontier agentic AI, an
  enterprise-grade platform, and deep domain expertise, we’re
  reshaping how critical knowledge work gets done for decades
  to come.

  This is a rare chance to help build a generational company
  at a true inflection point. We have strong product-market
  fit and world-class investor support. We’re scaling fast and
  defining a new category in real time. The work is ambitious,
  the bar is high, and the opportunity for growth — personal,
  professional, and financial — is unmatched.

  Our team moves fast, takes ownership, and is deeply
  committed to the mission — operating with intensity, staying
  close to our customers, and pushing each other for
  excellence. We live by three values: Decisiveness,
  Simplicity, and Job's Not Finished. We act quickly on clear
  judgment over perfect information, we believe simplicity is
  what scales, and we're never satisfied with where we are. If
  you want to do the best work of your career alongside people
  who share that drive, we'd love to build with you.

  At Harvey, the future of professional services is being
  written today — and we’re just getting started.

  Role Overview

  We’re looking for experienced frontend engineers to help
  build and evolve Harvey’s frontend platform—the systems,
  tools, and abstractions that enable our engineering team to
  ship high-quality product experiences quickly and
  consistently.

  This team focuses on developer experience, performance,
  reliability, and scalability across our frontend stack.
  Rather than building one-off product features, you’ll create
  shared foundations that power all of Harvey’s user-facing
  applications.

  This is a high-impact role with broad scope across the
  engineering organization. You’ll work closely with product
  engineers, design, and infrastructure teams to define and
  drive the future of frontend development at Harvey.

  What You'll Do

  - Build and evolve shared frontend infrastructure, including
    our design system and developer tooling
  - Contribute to and evolve frontend architecture for
    scalability and performance
  - Improve developer experience and engineering velocity
  - Improve application performance and reliability
  - Partner with product teams to drive adoption of platform
    systems
  - Identify and reduce friction across the development
    lifecycle

  What You Have

  - 10+ experience working on large-scale frontend systems or
    platform-level infrastructure.
  - Ability to think in systems and abstractions, not just
    features
  - A track record of improving developer experience or
    engineering velocity
  - Experience influencing technical decisions across teams or
    driving adoption of shared systems

  Compensation

  $231,000 - 340,000 USD

