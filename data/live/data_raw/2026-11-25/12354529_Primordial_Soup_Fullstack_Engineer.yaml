description: |
  Primordial Soup is a vertically integrated generative studio
  founded by acclaimed filmmaker Darren Aronofsky. Alongside
  the world’s leading generative artists and storytellers, we
  make original content and build the proprietary technology
  it runs on. Every project starts with a creator’s vision,
  and we give them the tools and team to bring stories that
  were once unimaginable to life.

  The Role

  As Fullstack Engineer, you'll build the creative tools our
  artists and creators use to bring their stories to life. We
  believe generative AI will transform how films and series
  are made, and we're building proprietary, web-native and
  agentic tools for that new way of working: first for our own
  productions, then for creators everywhere, from professional
  studios to ambitious independent artists. You'll own
  features end to end, from the interface a filmmaker touches
  to the hosted services that run generations and rendering at
  scale.

  This is a senior, hands-on role on a lean, fast-growing
  team, so you'll shape technical decisions and write a lot of
  the code that delivers them. You'll work closely with our
  artists, product and design, and you'll use agentic
  development to ship real, production-quality products faster
  than a traditional engineering team. As we grow, there's
  room to build and lead an engineering team.

  What You'll Do

  - Build and ship features across the full stack, from rich web
    interfaces to APIs, data and infrastructure
  - Design, host and scale the services behind our tools,
    including generation and rendering pipelines, media
    storage and delivery
  - Partner day to day with product managers and designers to
    turn early concepts into shippable products
  - Prototype quickly with artists and real users, then harden
    what works for production
  - Use agentic development workflows to move fast while keeping
    code reliable, tested and maintainable
  - Integrate generative models and AI agents into creator-
    facing workflows
  - Set a high bar for code quality, performance and reliability
    as the platform and team grow
  - Stay ahead of advances in generative video, agent tooling
    and AI-assisted development, and bring the best of them
    into our stack

  What We're Looking For

  - Senior-level experience as a fullstack engineer (10+ years
    relevant experience), shipping production web applications
    end to end
  - Has built creative tools, ideally for video, with a working
    understanding of video production and post-production
    workflows
  - Has built, hosted and scaled services in production, with
    strong judgment on architecture and operations
  - A track record of working closely with designers and product
    managers in cross-functional teams
  - Fluent in agentic development, using AI agents to build
    shippable products quickly, well beyond "vibe coding"
  - Strong product instincts and care for the experience of the
    people using what you build
  - Comfortable with ambiguity and fast iteration in an early-
    stage startup
  - Advanced computer graphics, shaders, rendering or video
    processing experience is a plus
  - Engineering management experience is a plus

  Primordial Soup provides equal employment opportunities
  (EEO) to all employees and applicants for employment without
  regard to race, color, religion, sex, national origin, age,
  disability, genetics, sexual orientation, gender identity,
  or gender expression. We are committed to a diverse and
  inclusive workforce and welcome people from all backgrounds,
  experiences, perspectives, and abilities.

  Primordial Soup is committed to a fair and transparent
  hiring process. We confirm that this advertisement is for an
  active, existing vacancy within our organization. Please be
  advised that we may use artificial intelligence-driven tools
  to assist our recruitment team in screening, assessing, and
  selecting candidates for this position.
