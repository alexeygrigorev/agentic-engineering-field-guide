description: |
  At Aledade, we empower primary care physicians with
  technology to keep their patients healthy, preventing
  unnecessary hospitalizations.

  As the Senior Engineering Manager for our Data Modeling
  team, you will be a highly technical leader delivering high
  business impact on projects of increasing dependencies and
  ambiguity. You will build and empower a high-efficiency team
  of individual contributors, with a relentless focus on
  scaling data throughput while maintaining uncompromising
  data quality.

  In this role, your team will develop the foundational
  technology that saves lives and improves mental and physical
  health for millions of people. You will guide the
  architectural and operational modeling of complex healthcare
  domains aligned with FHIR concepts—including claims,
  encounters, attribution, medications, and clinical
  status—leveraging tools like DBT, Kafka, Snowflake,
  Databricks.

  Bonus Qualifications: While strong engineering leadership is
  paramount, hands-on expertise with Snowflake, Databricks,
  and deep healthcare business domain knowledge are strong
  pluses that will help you accelerate your team's success.

