description: |
  About Karoo Health

  Cardiovascular care is often the #1 cost for health plans
  and employers, with the current fee for service model
  incentivizing providers to maximize volume and throughput at
  the expense of clinical outcomes and patient satisfaction.
  Karoo’s mission is to improve the lives of every cardiac
  patient in America by transforming the current care model to
  improve patient outcomes at significantly lower cost. Karoo
  deploys a value-based approach which combines a blend of
  traditional, guideline-based medicine and state of the art
  digital tools to accomplish this important mission by
  enabling the conversion to, and success in, value-based care
  arrangements for cardiovascular networks, health systems and
  payers. Karoo is backed by leading venture capitalists,
  including First Trust Capital Partners and BIP Ventures, and
  has near and medium-term plans for further rounds.

  Senior Software Engineer - Technical Lead

  Job Description

  Overview

  Location: Pittsburgh preferred, or remote, U.S.-based

  Type: Full-time technical leadership role

  An Industry Defining Company

  Karoo is a venture-backed startup, prior to Series A, on a
  mission to transform cardiovascular care. Our platform is
  designed to empower large provider groups and health systems
  to succeed in value-based care contracts with payers by
  improving patient outcomes and reducing cost of care through
  better coordination, analytics, and disease management.
  While our initial focus is cardiology, we are building a
  scalable operating system for managing complex conditions
  across the healthcare spectrum.

  This is a rare opportunity to join a mission-driven founding
  team at a pivotal stage and help define the future of
  healthcare technology, with the power to improve the lives
  of patients with cardiovascular disease, the number one
  cause of death in America today.

  The Role

  Karoo Health is seeking a skilled and dedicated Technical
  Leader to guide our core engineering efforts. In this role,
  you will maintain hands-on contribution while stepping up to
  lead a small team of software engineers. You will be
  responsible for setting technical direction, driving agile
  processes (daily standups, sprint planning, retrospectives),
  and fostering a high-performance culture.

  In order to do this job well, you must be a curious,
  pragmatic problem solver and an empathetic technical leader.
  You strive to produce simple solutions to complex problems
  and know how to lead constructive technical discussions to
  guide your team toward the best path forward.

  When applying, please include a description of why you’re
  interested in this role.

  What You'll Do

  - Lead and Mentor: Set technical direction, unblock
    developers, and drive continuous improvement.
  - Orchestrate Agile Processes: Facilitate daily standups,
    weekly sprint planning, backlog grooming, and team
    retrospectives to ensure predictable and timely delivery.
  - Execute: Craft clean, testable, and maintainable code in
    collaboration with the team.
  - Deliver: Own the software from requirements development
    through deployment and maintenance.
  - Operationalize Data: Architect, optimize, and maintain
    databases to ensure reliability and performance
  - Architect: Design and deploy scalable, secure, cloud
    infrastructure leveraging infrastructure-as-code best
    practices
  - Safeguard Data: Ensure compliance with healthcare data
    regulations (e.g., HIPAA, HITRUST)

  What We're Looking For

  - At least 4 years of experience leading small technical teams
    with direct responsibility for deliverables.
  - Minimum 6 years of dedicated professional experience in
    backend or full stack engineering, ideally in a startup or
    fast-paced environment.
  - Experience with healthcare data regulations (e.g., HIPAA,
    HITRUST) and data formats (e.g. FHIR).
  - Strong communication skills with an ability to translate
    product requirements into technical task breakdowns.
  - Bachelor's degree in Computer Science, Software Engineering,
    or related field, or equivalent work experience.
  - Deep understanding of cloud platforms (AWS preferred) and
    cloud-native development.
  - Proficiency with relational and NoSQL databases (e.g.,
    PostgreSQL, MySQL, MongoDB, DynamoDB) and API design
    (RESTful, GraphQL).
  - Proven capability in system architecture, scalability,
    security best practices, and CI/CD pipelines.
  - Must be legally authorized to work in the United States and
    not require employer sponsorship now or in the future.

  Why Join Us

  - Competitive salary and equity in an early-stage startup
  - Opportunity to define the technical solution from the ground
    up
  - Possibly fully remote work environment with flexible hours
  - Health benefits, learning stipends, and professional
    development support
  - A collaborative and transparent company culture that values
    creativity and ownership

