description: |
  Overview

  Imagine a world with virtually unlimited storage, accessible
  anytime, anywhere, from any device. A world where
  individuals, businesses, researchers, and organizations can
  securely store, access, analyze, and collaborate on data on
  a global scale. Microsoft Azure Storage is making that
  vision a reality. Azure Storage is Microsoft's massively
  scalable, highly distributed, and ubiquitously accessible
  cloud storage platform, powering critical workloads for
  customers around the world. As Azure continues its rapid
  growth, we are building the next generation of storage
  infrastructure designed to manage Exabytes of data today and
  scale toward Zettabytes in the future.

  The Azure Storage NPI SKU Qualification & Performance team
  plays a critical role in enabling this growth. Our team
  develops the software platforms, automation systems,
  telemetry pipelines, and performance analysis frameworks
  used to qualify and validate next-generation Azure Storage
  hardware technologies before they are deployed into
  production. We work across servers, SSDs (solid state
  drives), networking components, firmware releases, operating
  systems, and platform innovations to ensure every Azure
  Storage SKU meets Microsoft's standards for performance,
  reliability, scalability, and operational excellence.

  As a Senior Software Engineer, you will design and build
  large-scale automation platforms, data-driven validation
  systems, performance benchmarking frameworks, and diagnostic
  tools that accelerate hardware onboarding across one of the
  world's largest cloud storage platforms. You will
  collaborate closely with software engineers, hardware
  architects, service teams, and industry-leading vendors to
  bring the next generation of Azure infrastructure into
  production.

  This is a Microsoft onsite 3 days a week in Redmond,
  Washington.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others and collaborate to realize our shared goals. Each day
  we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Design and develop software services, automation platforms,
    and engineering systems that enable qualification and
    onboarding of next-generation Azure Storage hardware and
    platform technologies
  - Build and enhance large-scale performance measurement,
    telemetry, and analytics platforms used to validate Azure
    Storage infrastructure at hyperscale. Design and implement
    features across Azure Storage services to support new
    server, SSD, networking, firmware, and operating system
    innovations
  - Investigate and resolve complex issues spanning distributed
    systems, cloud services, hardware platforms, firmware, and
    operating systems. Analyze large-scale performance and
    reliability datasets to identify bottlenecks and drive
    improvements in system efficiency, scalability, and
    availability
  - Develop automation solutions that improve qualification
    coverage, deployment readiness, operational efficiency,
    and engineering productivity
  - Drive technical design discussions and contribute to the
    architecture of software platforms used across the Azure
    Storage qualification ecosystem. Document system
    architectures, technical designs, and engineering
    learnings while effectively communicating complex concepts
    to technical and non-technical audiences
  - Research and evaluate emerging technologies, tools, and AI-
    assisted engineering approaches to improve qualification
    quality and operational excellence

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C#,
    Python, Java, C++ or other object-oriented programming
    languages
    - OR equivalent experience

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include, but are not limited to
    the following specialized security screenings:
    - Microsoft Cloud Background Check: This position will be
      required to pass the Microsoft Cloud Background Check
      upon hire/transfer and every two years thereafter

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C#,
    Python, Java, C++ or other object-oriented programming
    languages
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 8+ years technical engineering
      experience with coding in languages including, but not
      limited to, C#, Python, Java, C++ or other object-
      oriented programming languages
    - OR equivalent experience
  - 5+ years of experience designing, building, and operating
    large-scale distributed systems or cloud services
  - Experience with:
    - Designing and implementing scalable software architectures,
      microservices, REST APIs (Representational State
      Transfer Application Programming Interface), and
      distributed systems
    - Troubleshooting complex issues across software,
      infrastructure, networking, operating systems, and
      distributed services
    - Cloud platforms such as Azure, AWS, or Google Cloud
      Platform, as well as familiarity with Azure Storage,
      distributed databases, Cosmos DB, Kusto, or large-scale
      data processing systems
    - Modern software development practices, including CI/CD
      (continuous integration/continuous delivery), source
      control, code reviews, automated testing, and Agile
      methodologies
    - Large-scale telemetry, observability, monitoring, or
      analytics platforms, performance engineering,
      benchmarking, scalability analysis, or capacity planning
    - Storage systems, SSDs, networking technologies, firmware,
      operating systems, or datacenter infrastructure
    - Building automation frameworks, diagnostic tools, or
      validation platforms

