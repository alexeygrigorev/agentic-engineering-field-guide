description: |
  Intetics Inc., a leading American technology company
  specializing in custom software application development,
  distributed professional teams creation, software product
  quality assessment, and “all-things-digital” solutions, is
  looking for a Back-end Developer to join our team.

  Long-term cooperation on an as-needed basis, with potential
  part-time assignments and travel to the client’s office if
  required

  Our client is an international organization supporting
  global environmental and sustainability initiatives. The
  engagement focuses on developing and supporting enterprise
  applications, digital services, and technology solutions
  used across the organization. Specialists will collaborate
  with internal teams and external partners in an
  international environment, following established
  architecture, security, and delivery standards.

  We are looking for a Back-end Developer to develop and
  maintain enterprise backend applications, APIs, and system
  integrations. You will implement business logic and
  contribute to secure, reliable, and scalable services in
  collaboration with business and technical stakeholders.

  Responsibilities

  - Design, develop, test, and maintain backend services using
    .NET, Python, Node.js, or equivalent technologies.
  - Translate business requirements into application
    functionality, APIs, and integrations.
  - Design and manage relational and/or NoSQL databases.
  - Implement authentication, encryption, logging, monitoring,
    and caching.
  - Develop automated unit tests, participate in code reviews,
    and troubleshoot defects.
  - Maintain technical documentation and communicate
    implementation progress, dependencies, and issues.

  Requirements

  - At least 5 years of experience developing and maintaining
    backend applications, including APIs, integrations, and
    service-based architectures.
  - At least 5 years of experience working independently and
    within multidisciplinary teams across business functions,
    organizations, or locations.
  - At least 3 years of experience using Jira in collaborative
    software delivery environments.
  - Strong experience with one or more enterprise backend
    technologies, such as .NET, Python, or Node.js.
  - Experience with relational and/or NoSQL databases, server-
    side security, reliability, and scalability.
  - Experience with automated unit testing and software quality
    practices.
  - Experience using AI-assisted development tools, with
    critical review of generated outputs.
  - Bachelor’s degree or higher in Computer Science, Software
    Engineering, IT, or a related field.
  - At least one relevant professional certification, such as
    AZ-204, AWS Certified Developer – Associate, Oracle
    Certified Professional Java SE Developer, CKAD, or
    equivalent.

  Would be a plus:

  - For university degrees, the awarding institution must rank
    among the top 500 in an overall or subject-specific
    university ranking

  - Experience working with or for large organizations with
    complex structures and multiple business units
