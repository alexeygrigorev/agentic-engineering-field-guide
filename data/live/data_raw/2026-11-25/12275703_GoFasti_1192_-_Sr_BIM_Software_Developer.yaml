description: |
  We Make Remote Work Remarkable • TopTalent from LatAm

  Hello! We are GoFasti, a Talent-as-a-Service. GoFasti
  bridges the gap between world-class developers and designers
  from LatAm and first-class companies around the globe.

  We need an English-fluent Sr. BIM Software Developer, based
  in Latin America, available to work remotely. We are looking
  for someone with exceptional communication and relationship-
  building skills, who embraces changes while maintaining
  strong attention to detail. An interested and proactive
  person, who's constantly learning and improving their
  skills.

  Are you the one we are looking for?

  Responsibilities:

  - Build and support internal web applications using ASP.NET.
  - Automate repetitive tasks and data workflows with PowerShell
    and Python scripts.
  - Troubleshoot, debug, and improve existing tools and
    integrations.
  - Join a few check-ins with the client's team each week to
    share progress and align on priorities.
  - Document the tools you build so the team can use and
    maintain them.

  Requirements:

  - 4-5 Years of experience developing and maintaining add-ins
    and plugins for Revit, AutoCAD, and Navisworks using C#
    and the Autodesk APIs.
  - Strong experience with C# and the .NET framework.
  - Experience building web applications with ASP.NET.
  - Hands-on experience developing with the Revit API, AutoCAD
    API, and Navisworks API.
  - Scripting experience with PowerShell and Python.
  - Proficiency across the Microsoft stack (e.g., Visual Studio,
    SQL Server, Azure, or IIS).
  - Able to work independently with limited supervision.

  It's a plus:

  - Background in architecture, engineering, or construction, or
    experience as a BIM user.
  - Experience with Dynamo or other BIM automation tools.

  Compensation:

  - The salary range offered for this position varies from (USD)
    $3,500 - $4,500 per month, depending on seniority and
    skillset.
  - This is a one-month contract with the possibility of an
    extension based on the client's needs.
  - This position is for a full time contract, through a payroll
    platform.
  - The talent will work remotely allocated at our client.

  Here are the steps for this process: Live Assessment >
  Application review/approval > Screening interview with
  GoFasti's team > We build and send your profile to our
  client > Profile review/approval by client > Interview with
  the client > Hiring and onboarding.

  Once you apply for the job, our team will review your
  resume. If it meets the requirements, we will contact you
  and move forward in the process.

  Note for Candidates Approached Directly: If you were
  contacted directly by a member of our team and are
  interested in this opportunity, please do not apply through
  this link. Instead, reach out to the person who contacted
  you to coordinate a meeting. Thank you!
