description: |
  Company Description

  Legal & General (L&G) is a leading UK financial services
  group and major global investor.

  We’ve been safeguarding people’s financial futures since
  1836, and strive to build a better society, while improving
  the lives of our customers and creating value for
  shareholders.

  We are one of the world’s largest asset managers and provide
  powerful asset origination capabilities. Together, these
  underpin our retirement and protection solutions: we are an
  international player in pension risk transfer, in UK and US
  life insurance, and in UK workplace pensions and retirement
  income.

  Who we are

  Our Retail business supports customers throughout their
  lives, to help them save, plan, protect and enjoy
  retirement.

  We’re a leading provider of retirement and protection
  solutions. We aim to support our c.12.8 million
  policyholders and workplace members throughout their
  lifelong financial journeys.

  We focus on helping the customers of today and tomorrow
  achieve better long-term outcomes. We either talk with them
  directly or work with intermediaries and employers to meet
  their needs. We use the latest technology to connect with
  them quickly, efficiently and wherever possible in highly
  personalised ways.

  Job Description

  At Legal & General, we're transforming the way technology
  enables our business and delivers exceptional experiences
  for our customers. We're looking for a talented SDET to join
  our engineering team, helping to build, test and support
  scalable, secure and resilient cloud-based applications.

  This is an exciting opportunity for an experienced Software
  Development Engineer in Test who is passionate about quality
  engineering, automation and continuous improvement. You'll
  work closely with engineers, technical leaders and
  stakeholders to shape testing strategies, enhance platform
  reliability and drive engineering excellence across modern
  AWS-based solutions.

  What you'll be doing:

  - Building and enhancing high-quality software features and
    automated testing solutions across cloud-based
    applications
  - Analysing complex technical challenges and resolving end-to-
    end issues across distributed systems
  - Defining and implementing test strategies that improve
    quality, security, usability and accessibility
  - Conducting code reviews and promoting engineering best
    practice across functional and non-functional requirements
  - Driving improvements in CI/CD pipelines, deployment
    processes and platform reliability
  - Collaborating with engineers to reduce technical debt and
    evolve application architecture
  - Mentoring colleagues, sharing technical knowledge and
    contributing to a culture of continuous learning
  - Researching emerging technologies and identifying
    opportunities to improve products, tooling and ways of
    working

  Who we're looking for:

  - Strong experience developing and testing enterprise
    applications using Java or other JVM-based languages
  - Proven expertise working with AWS cloud services, including
    serverless technologies and containerised solutions
  - Strong knowledge of software testing practices, including
    test-driven development and automation frameworks
  - Experience building and supporting CI/CD pipelines, source
    control processes and automated deployment practices
  - Good understanding of microservices, distributed systems,
    APIs and modern software architecture patterns
  - Knowledge of web security, API security and secure software
    development practices
  - Experience working within Agile delivery environments such
    as Scrum or Kanban
  - Strong collaboration, communication and problem-solving
    skills, with a passion for continuous improvement and
    knowledge sharing

  Whatever your role, we reward performance and behaviour with
  a package that looks after all the things that are important
  to you. Here are some of the benefits we offer:

  - The opportunity to participate in our annual, performance
    -related bonus plan and valuable share schemes
  - Generous pension contribution
  - Life assurance
  - Healthcare Plan (permanent employees only)
  - At least 25 days holiday, plus public holidays, 26 days
    after 2 years’ service. There’s also the option to buy and
    sell holiday
  - Competitive family leave
  - Participate in our electric car scheme, which offers
    employees the option to hire a brand-new electric car
    through tax efficient salary sacrifice (permanent
    employees only)
  - There are many discounts we offer – both for our own
    products and at a range of high street stores and online
  - We’re creating net‑zero carbon workplaces by 2030 by
    investing in our sustainable, modern offices across the
    UK, all designed to bring people together and elevate the
    in‑person experience

  #LI-NH1

  Additional Information

  At L&G, we believe it's possible to generate positive
  returns today while helping to build a better future for
  all.

  If you join us, you’ll be part of a welcoming, inclusive
  culture, with opportunities to collaborate with people of
  diverse backgrounds, views, and experiences. Guided by
  leaders with integrity who care about your future and
  wellbeing. Empowered through initiatives which support
  people to develop their careers and excel.

  We care passionately about outcomes rather than attendance
  and are therefore open to discussing all kinds of flexible
  working options including part-time and job shares. Although
  some roles have limited flexibility due to customer demand,
  we accommodate requests when we can.

  It doesn’t matter if you don’t meet every single criterion
  in this advert. Instead, think about what you excel at and
  what else you can bring in terms of strengths, potential and
  connection to our purpose.
