description: |
  We have an exciting and rewarding opportunity for you to
  take your software engineering career to the next level.

  As a Senior Software Engineer at JPMorganChase within the
  Connected Commerce, Travel division, you are an integral
  part of an agile team that works to enhance, build, and
  deliver trusted market-leading technology products in a
  secure, stable, and scalable way. As a core technical
  contributor, you are responsible for conducting critical
  technology solutions across multiple technical areas within
  various business functions in support of the firm’s business
  objectives.

  Job Responsibilities:

  - Designs and implements complex features and services within
    owned domains; collaborates with upstream/downstream teams
    to deliver end-to-end solutions; contributes to API
    contracts, versioning, and backward compatibility.
  - Contributes to production readiness and operational
    excellence by helping define/meet SLOs/SLIs, improving
    observability (logs, metrics, traces), participating in
    incident response and post-incident reviews, and
    delivering durable fixes and runbooks to reduce repeat
    issues.
  - Applies secure-by-default and resilient design patterns in
    day-to-day development (timeouts, retries with exponential
    backoff/jitter, circuit breakers, bulkheads, idempotency,
    graceful degradation).
  - Authors design proposals and participates in design reviews;
    partners with Architecture and peer teams to align designs
    and reduce integration risk.
  - Writes secure, concise, high-quality production code and
    reviews/debugs code across backend and frontend as needed.
  - Engages in pair programming, rigorous code reviews, and
    reliable estimation; builds user-facing experiences that
    meet established performance and accessibility standards.
  - Applies database rigor across SQL/NoSQL: schema design,
    indexing, query tuning, and caching to improve latency and
    throughput.
  - Integrates firm-approved, privacy-safe AI assistants into
    development workflows to accelerate test generation,
    documentation, refactoring, and static analysis
    triage—with human-in-the-loop review and CI quality gates.
  - Follows established AI governance and guardrails (prompt
    hygiene, secrets/PII protection, provenance expectations,
    objective acceptance criteria such as
    lint/coverage/SAST/DAST/performance checks) and provides
    feedback to improve standards.
  - Contributes to measurement of AI-assisted workflows (e.g.,
    cycle time, defect trends) without compromising security
    or reliability.



  Required qualifications, capabilities, and skills:

  - Formal training or certification on software engineering
    concepts and 3+ years applied experience delivering
    production systems in a team environment, including
    ownership of major features/components and end-to-end
    delivery within a squad.
  - B.S. in Computer Science/Engineering or related field (or
    equivalent practical experience).
  - Proficiency in Java and Spring Boot development, SQL, and
    event-driven/messaging systems such as SNS, SQS, and
    Kafka.
  - Hands-on experience with AWS and cloud-native services
    (e.g., ECS/EKS/Lambda, API Gateway,
    RDS/DynamoDB/CassandraDB, S3, CloudWatch, IAM).
  - Proficiency in JavaScript, HTML5, and CSS3 with the ability
    to contribute to, debug, and review user-facing code when
    needed.
  - Hands-on experience in system design, RESTful JSON API
    design, microservices, application development, testing
    strategy, and operational stability within large,
    distributed environments.
  - Hands-on experience across the SDLC, including CI/CD
    pipelines and automated testing practices.
  - Strong understanding of security and resiliency, including
    OWASP Top 10, OAuth2/OIDC, secrets management, encryption
    in transit/at rest, and resilient integration patterns
    (timeouts, retries, circuit breakers, bulkheads).
  - Ability to author and present design proposals, participate
    effectively in design reviews, and influence technical
    decisions through data and collaboration.
  - Demonstrated ability to provide strong code reviews, support
    pairing/mentoring, and raise engineering quality across
    the team.
  - AI-assisted development: operational experience using
    approved AI assistants within development workflows with
    human review and CI quality gates, following established
    governance and objective acceptance criteria.

  Preferred qualifications, capabilities, and skills

  - Experience in TypeScript and React.
  - Travel or hospitality domain experience, especially with
    booking flows, inventory consistency, and resilient
    integrations.
  - Experience contributing to evaluation practices for AI-
    assisted development or AI features (offline metrics,
    canarying, telemetry, drift detection), in partnership
    with senior engineers/architecture.
  - Familiarity with frontend performance and accessibility best
    practices, including diagnosing and fixing common issues.

  About Us

  Chase is a leading financial services firm, helping nearly
  half of America’s households and small businesses achieve
  their financial goals through a broad range of financial
  products. Our mission is to create engaged, lifelong
  relationships and put our customers at the heart of
  everything we do. We also help small businesses, nonprofits
  and cities grow, delivering solutions to solve all their
  financial needs.

  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions.  We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.

  We recognize that our people are our strength and the
  diverse talents they bring to our global workforce are
  directly linked to our success. We are an equal opportunity
  employer and place a high value on diversity and inclusion
  at our company. We do not discriminate on the basis of any
  protected attribute, including race, religion, color,
  national origin, gender, sexual orientation, gender
  identity, gender expression, age, marital or veteran status,
  pregnancy or disability, or any other basis protected under
  applicable law. We also make reasonable accommodations for
  applicants’ and employees’ religious practices and beliefs,
  as well as mental health or physical disability needs. Visit
  our FAQs for more information about requesting an
  accommodation.

  Equal Opportunity Employer/Disability/Veterans

  About the TeamOur Consumer & Community Banking Group depends
  on innovators like you to serve consumers, small businesses,
  municipalities and non-profits.  You’ll support the delivery
  of award winning tools and services that cover everything
  from personal and small business banking as well as lending,
  mortgages, credit cards, payments, auto finance and
  investment advice. This group is also focused on developing
  and delivering cutting edged mobile applications, digital
  experiences and next generation banking technology solutions
  to better serve our clients and customers.
