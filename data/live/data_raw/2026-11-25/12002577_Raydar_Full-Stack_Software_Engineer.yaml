description: |
  About the company

  Our client is an insurance company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build full-stack features and backend services for internal
  business software, owning work from concept through
  production. Partner with domain specialists to turn
  complicated operational logic into dependable, well-
  structured systems. Contribute to automation features that
  reduce manual effort across core business processes.

  What you'll do

  - Build full-stack features for internal business tools.

  - Develop backend services and data models that support core
    operational workflows.

  - Translate complex domain logic from specialists into clean,
    maintainable code.

  - Take ownership of systems from concept through production
    release.

  - Contribute to automation features that reduce manual work in
    business processes.

  Requirements

  What we're looking for

  - Software engineering experience in a full-stack, backend, AI
    or data engineering role, with shipped product or backend
    work (infrastructure-only experience does not count).

  - Experience as a software engineer at a venture-backed
    startup or a large technology company.

  - Paid coding experience in a modern scripting or web
    language.

  - Demonstrated accountability for server-side software running
    in live environments, from build through operation.

  Bonus points

  - Prior work in a compliance-heavy sector, such as financial
    or insurance technology.

  - Computer science degree.

  - Experience with React, JavaScript, Ruby or Kotlin.

  Benefits

  Compensation and benefits

  - Base salary: $190K to $400K

  - Equity

  - Health, dental and vision coverage

  - Fertility and family building support

  - Flexible time off

  - Retirement plan

  - Professional development support

  - Relocation assistance

  Location and work model

  - New York City, NY, United States

  - San Francisco, CA, United States

  - On-site

  - Full-time
