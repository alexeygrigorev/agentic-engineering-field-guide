description: |
  We are KOPE and we are dedicated to revolutionising how we
  design and construct the build environment

  KOPE is the only purpose-built software platform for offsite
  construction. We enable the transition from traditional
  construction by integrating offsite processes and products.
  We instantly apply real-world products directly to design
  models, allowing the worlds of design and manufacturing to
  come together as one.

  We are building a better future.

  Join us.

  The Role

  In this role, your day-to-day will involve close
  collaboration with our team of geometry experts. You'll be
  diving deep into fascinating technical challenges, working
  together to translate those challenges into elegant software
  solutions. This means you'll be designing and developing
  robust C# libraries that tackle complex problems, often
  involving algorithms, data structures, and creative problem-
  solving. You'll be a key bridge between the worlds of
  geometry and computer science, ensuring our software
  effectively addresses the needs of our computational design
  applications. Some days might involve brainstorming new
  approaches to a problem, while others might focus on writing
  and optimizing code, reviewing code with colleagues, or
  researching new technologies.

  Responsibilities

  - Collaborate closely with other developers and domain experts
    to create exceptional products.

  - Collaborate closely with geometry experts to understand
    their needs and translate them into software solutions.

  - Analyse geometrical problems and identify the most suitable
    computer science concepts and algorithms for solving them.
  - Write efficient, scalable code with performance and resource
    usage in mind
  - Make thoughtful engineering decisions around data access
    patterns, processing efficiency, and system design to
    ensure solutions remain performant and cost-effective
    under real-world load

  - Participate in our agile development process, including
    sprint planning workshops, demos, code reviews, and
    quality assurance activities.

  - Design, develop, and maintain C# libraries for computational
    design applications.

  Requirements

  - Strong C# knowledge with .NET framework/.NET Core

  - Proven ability to architect and develop reusable libraries
    with a focus on computational design applications.

  - Strong ability to understand complex geometrical problems
    and translate them into appropriate computer science
    concepts (e.g., data structures, algorithms, design
    patterns).

  - Skills in collaborating with domain experts (geometry
    experts in this case) to design and implement effective
    software solutions.

  - Excellent communication and interpersonal skills for
    effective collaboration and knowledge sharing.

  - Strong analytical and problem-solving skills to tackle
    complex challenges.

  - Proficiency with Git or similar version control systems.

  - Highly adaptable and keen to develop your skills in a
    collaborative & engaging environment

  Bonus skills:

  - Knowledge of computational geometry concepts and techniques
    would be a significant advantage.

  - Ability to write optimized code for performance-critical
    applications.

  - Experience with unit testing and other software testing
    methodologies.

  - Familiarity with Agile development practices.

  Benefits

  - Remote first
  - Flexible working style
  - Relaxed and fun culture
  - Greenfield development with no legacy apps
  - Autonomy & responsibility encouraged
  - Generous holiday allowance - 23 days paid holiday plus
    public and bank holidays
  - Aviva Health Insurance
  - Winter leave – the office closes between Christmas eve and
    1st January (inclusive) this is in addition to your
    personal annual leave
  - All-company in person events
  - Generous maternity, paternity and parental leave policy
