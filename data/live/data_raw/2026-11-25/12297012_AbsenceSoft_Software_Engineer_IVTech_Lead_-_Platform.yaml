  Software Engineer IV / Tech Lead - Platform

  Software Engineer IV/Tech Lead is a senior engineer on the
  team responsible for the core of AbsenceSoft’s leave
  management platform. Employers rely on it to decide whether
  employees get the leave and pay their owed, so every change
  must land safely in a system customers use every day. This
  is a senior hands-on role with a path to tech lead. You will
  write production code, shape technical direction alongside
  the team’s tech leads, and raise the engineers around you,
  partnering with Product and Engineering leadership to
  deliver changes that hold up in production.

  What You’ll Do

  - Modernize the platform. Retarget shared libraries, separate
    business logic, and move hundreds of legacy controllers
    and views to ASP.NET Core.
  - Upgrade the dependencies that block the move.
  - Prove the old and new code behave the same. Write tests that
    capture what the legacy code does today and compare
    results before and after each change.
  - Use AI coding agents for large repetitive changes such as
    call-site rewrites, API-gap fixes, and test scaffolding.
    Check their output with builds, tests, and diffs.
  - Lead the work. Write the migration playbook, review other
    teams’ migrations, guide the engineers on the program, and
    work with Infrastructure, QA, and Product on sequencing
    and risk.
  - Keep the platform shipping. Migration work lands in small
    changes that can each be released, alongside normal
    feature work.

  What’ll Set You Up for Success Required Skills

  - You’ve led or delivered a large .NET Framework to modern
    .NET migration of a production system that stayed live
    during the move. A greenfield rebuild doesn’t count.
  - Deep ASP.NET experience on both sides: MVC 5, Web API 2,
    OWIN, and System.Web, and ASP.NET Core (middleware,
    dependency injection, hosting, authentication).
  - Fluency with the mechanics: SDK-style projects, target
    frameworks and multi-targeting, .NET Standard, NuGet
    compatibility, and dependency conflicts.
  - Strong testing discipline (NUnit, xUnit, or MSTest),
    including tests that pin down the current behavior of
    legacy code you didn’t write.
  - Daily hands-on use of AI coding tools, with the habit of
    checking their output rather than trusting it.

  Preferred Skills

  - 10+ years of professional software engineering experience.
  - Major library upgrades with breaking changes.
  - Authentication/Authorization migration.
  - Incremental-migration tooling.
  - Multi-tenant SaaS, including keeping each customer’s data
    isolated.
  - C#, TypeScript/Node.js.
  - AWS; Datadog or structured logging; Docker, GitHub Actions,
    Jenkins.

  Key Skills & Behaviors

  - Rigor: treats “the number changed” as the worst bug a
    migration can ship, and designs to prevent it.
  - Incremental by instinct: prefers many small, safe,
    releasable steps over one big cutover, and can explain how
    each step rolls back.
  - Scope discipline: keeps behavior the same during the move,
    and writes redesign ideas down for later instead of
    slipping them in.
  - Domain curiosity: learns leave and pay rules well enough to
    know which behaviors must not change.
  - Honest estimator: surfaces risks early rather than absorbing
    them quietly.
  - Clear communicator: explains sequencing and risk to
    engineers, Product, and executives.
  - Mentor: leaves patterns and docs other teams can follow
    without them.

