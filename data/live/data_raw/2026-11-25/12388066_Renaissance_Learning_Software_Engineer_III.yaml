description: |
  About Renaissance

  When you join Renaissance®, you join a global leader in
  pre-K–12 education technology! Renaissance’s solutions help
  educators analyze, customize, and plan personalized learning
  paths for students, allowing time for what matters—creating
  energizing learning experiences in the classroom. Our
  fiercely passionate employees and educational partners have
  helped drive phenomenal student growth, with Renaissance
  solutions being used in over one-third of US schools and in
  more than 100 countries worldwide.

  Every day, we are connected to our mission by exemplifying
  our values: trust each other, win together, strive for the
  best, own our actions, and grow and evolve.

  Job Description

  As a Software Engineer III, you will build features across
  the discovery layer and the products behind it: the search
  and browse experiences teachers use to find the right
  lesson, the curation tools admins use to govern what their
  district sees, and the services that make four separate
  products feel like one library. You will be making it fast
  and intuitive for admins to govern and curate, for teachers
  to find and instruct, and for students to explore and grow
  their respective libraries. You will work with a high degree
  of independence and help ensure that problems and solutions
  are appropriately scoped.

  In addition, you will be the first team to adopt
  Renaissance’s S3 model of software development. You will be
  expected to build multi-agent orchestration, where
  specialized agents coordinate on complete features and
  engineers shift from managing individual tasks to designing
  the systems that produce the work.

  In this role as a Software Engineer III, you will: 

  - Build features across the discovery layer and the products
    it connects — search and browse for teachers, curation and
    governance for admins, exploration for students.
  - Develop backend services that leverage relational databases,
    non-relational datastores, message queuing, and cloud
    infrastructure, against typed contracts.
  - Build and test frontend experiences in TypeScript and React,
    contract-tested against the backend, with accessibility
    treated as a requirement rather than a follow-up.
  - Write the tests and the instrumentation with the feature —
    unit, component, and contract tests, plus the traces,
    metrics, and logs that make the system debuggable.

  Qualifications

  For this role, you must have: 

  - Professional experience building and shipping production web
    applications or services.
  - Experience developing backend services against relational
    databases, and comfort with non-relational datastores,
    message queuing, and/or cloud infrastructure.
  - Excitement to help craft a new, AI-first software
    development lifecycle. The idea of encoding engineering
    understanding into formal constraints that can be consumed
    by an AI workflow is an interesting problem to you, not a
    necessary evil.
  - Working knowledge of cloud operations — you can deploy
    across environments, read a dashboard, and troubleshoot an
    application problem in a cloud environment.
  - Effective communication skills and the ability to
    collaborate well with distributed engineering, product,
    and design teams.
  - Bachelor's degree or equivalent industry experience.

  Experience with various engineering technologies such as: 

  - SQL (MSSQL, PostgreSQL, etc.)
  - Proficiency in a typed language, ideally TypeScript, and
    comfort working in a strictly typed codebase.

    Optionally, you could have: 

  - Experience leading and mentoring others
  - Experience with the AWS technologies
  - Knowledge of DevOps processes and technologies

  Additional information

