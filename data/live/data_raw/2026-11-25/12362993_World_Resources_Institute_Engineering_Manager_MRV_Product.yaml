description: |
  This is a hybrid position which requires 8 days per month in
  the office. You can be based in any one of our offices in
  Washington, D.C, The Hague, London, Mexico City, Addis Ababa
  or Kigali.

  Existing work authorization is required at the time of
  application submission as WRI is unable to sponsor any visa
  work sponsorship for this position. To be eligible for this
  position in US, you must be a resident of DC, Maryland or
  Virginia at the start of employment.

  About the Program

  We’re building a New Restoration Economy

  Two billion hectares of the world’s land is degraded. That’s
  an area larger than South America, and one of the greatest
  economic opportunities of our time. A growing movement is
  working to seize it by building a New Restoration Economy,
  where restoration is trusted, priced, and investable, and
  the people doing the work share in the value it creates. WRI
  is proud to be at the forefront of that effort.

  For more than a decade, WRI’s Global Restoration Initiative
  has worked to make restoration happen on the ground. We
  partner with governments to put restoration into national
  policy and planning, and we help direct funding to the local
  enterprises, cooperatives, and community groups doing the
  work.

  Meet RestorationWorks

  RestorationWorks is a new platform, built to become the
  operating system for restoration. It connects the local
  enterprises and community groups restoring land with the
  funders, investors, and governments who can scale their
  work.

  Today, that connection breaks down over trust. Funders want
  to back local restoration, but they have no consistent way
  to verify that it’s working. Without credible proof, money
  stays on the sidelines.

  We’re addressing this with a narrow focus, to start.
  Building on the data we’ve gathered from our TerraMatch
  platform, RestorationWorks will do one critical thing:
  verify tree growth for small scale restoration projects.
  We’re building tools that enable comprehensive reporting and
  verification of restoration activities, with the ability to
  share results funders can rely on. Get that right, and it
  becomes the model for every restoration outcome that
  follows.

  The team you’ll join

  RestorationWorks is built through a dedicated Product team
  with two distinct groups. The MRV Product (monitoring,
  reporting and verification) group builds the tools that turn
  reported into verified results. The Core Platform group
  builds the shared infrastructure and data architecture
  everything runs on, so RestorationWorks operates as one
  system. Both groups are made up of small squads, each with
  their own mission and goals.

  Join us

  This is a rare chance to make nature something people can
  invest in. You’ll have WRI’s research credibility behind you
  and a network of local partners across three continents. If
  you’ve been looking for work where your craft in product,
  design, engineering or data can make a real difference on
  climate and nature, this is it.



  Job highlight:

  This is primarily a people leadership role. The Engineering
  Manager will lead the data engineering team members embedded
  across the MRV Product and Core Platform groups, aligning
  each squad’s roadmap with the broader RestorationWorks
  strategy as priorities evolve. The Engineering Manager will
  set the technical direction in collaboration with senior
  data engineers and data scientists, and will align research,
  product, and senior leadership around that direction.

  The role calls for strong technical credibility in data
  engineering and geospatial systems: enough depth to evaluate
  architecture and data quality tradeoffs, ask sharp
  questions, and earn the trust of senior engineers and
  scientists. As a leadership role, the primary impact comes
  through hiring, coaching, and organizing engineers to
  execute their roadmaps.

  What you will do:

  Lead and build the engineering team

  - Represent engineering capacity, constraints, and risk in
    product and program planning so that tradeoffs are made
    with complete information.

  - Manage the contractors currently supporting engineering
    delivery, including scope and quality of work.

  - Build a strong engineering culture and sustainable ways of
    working and clear ownership.

  - Shape the team structure and skill mix required to deliver
    the RestorationWorks strategy as it evolves.

  - Lead hiring to build out the engineering bench as the
    product and data production system scales.

  Set the strategy for the data production system

  - Define the technical direction for reliably producing,
    versioning, and publishing geospatial and field-collected
    data at scale.

  - Ensure the team has the engineering practices, tooling, and
    operating model, required to execute against the product
    led roadmap.

  - Track and communicate how methodology and data quality
    evolve over time.

  Align research, product, and leadership

  - Serve as the translation layer between research priorities,
    the product roadmap, and engineering delivery capacity.

  - Make tradeoffs visible and understandable to non-technical
    stakeholders.

  - Keep leadership informed on roadmap health, risk, and
    capacity across squads.



  What You Will Need

  - Experience in engineering management, including at least 2
    years leading data engineering, geospatial, remote
    sensing, or research engineering teams.

  - A track record of leading through others, including setting
    technical direction, raising the bar, and holding teams
    accountable.

  - Strong technical credibility in data engineering and
    geospatial or remote sensing systems.

  - Clear written and verbal communication, with experience
    representing engineering in cross functional and
    leadership planning.

  - Experience hiring, developing, and growing engineering
    teams.

  Strongly Preferred

  - Background in restoration, conservation, environmental
    monitoring, earth observation, or climate/conservation
    finance

  - Familiarity with FAIR data principles and open publishing
    standards

  - Experience leading engineering for more than one product or
    program from a shared data/engineering backbone



  Potential Salary:

  US: 139,000 USD to 175,000 USD

  Netherlands: 76,000 to 95,000 Euros(Excluding 8% vacation
  allowance)

  London: 67,000 to 84,000 Pounds

  Salary is commensurate with experience and other compensable
  factors.

  How to Apply:

  Please submit a resume with a cover letter by December 11,
  2026. Internal applicants should submit their application
  through the Jobs Hub portal in Workday. External applicants
  must apply through the WRI Careers portal to be considered.
  We may close for applications sooner if we receive a high
  volume of applications from qualified candidates.

  What we offer:

  - Access to the WRI global network with the opportunity to
    exchange with and learn from passionate colleagues working
    at the cutting edge of their fields across Asia, Africa,
    Europe, Latin America and the US
  - The chance to have an impact and to develop your career
    within a mission driven organization with access to varied
    learning and training opportunities
  - A workplace that strives to put diversity and inclusion at
    the heart of our work
  - The opportunity to join and get involved in different
    working groups and affinity groups to shape the future of
    WRI
  - Commitment to hybrid working model with flexible working
    hours
  - Generous leave days that increase with tenure.
  - If based in the US: Medical Coverage, Dental Coverage,
    Vision Coverage, retirement plan access and employer
    contribution.



  About Us:

  World Resources Institute works to improve people's lives,
  protect and restore nature and stabilize the climate. As an
  independent research organization, we leverage our data,
  expertise and global reach to influence policy and catalyse
  change across systems like food, land and water; energy; and
  cities. Our 2,000+ staff work on the ground in more than a
  dozen focus countries and with partners in over 50 nations.

  Our mission and values:

  WRI's mission is to move human society to live in ways that
  protect Earth's environment and its capacity to provide for
  the needs and aspirations of current and future generations.

  Our values are shared ideals that bind us together:
  Independence, Integrity, Impact, Partnership and Care.



  Our culture:

  WRI is committed to advancing gender and social equity for
  human well-being in our mission including equal
  opportunities in employment. All qualified applicants will
  receive consideration for employment without regard to race,
  ethnicity, religion, sex, national origin, age, caste,
  marital status, sexual orientation, gender identity and
  expression, disability, or protected Veteran status.

  Our People team carefully reviews all applications.
