  performance to clients through active management.


    We serve a diverse client base that includes pension
  schemes, insurance companies, sovereign wealth funds,
  endowments, foundations, high net worth individuals, family
  offices, as well as end clients through partnerships with
  distributors, financial advisers, and online platforms.


    Established in 1804, we have around 5,500 people across 36
  global locations.


    Schroders' success can be attributed to its diversified
  business model, which spans a range of asset classes, client
