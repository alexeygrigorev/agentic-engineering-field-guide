description: |
  Building the Future of Open Finance

  Payward - the parent company behind Kraken, NinjaTrader,
  Breakout, xStocks, Payward Services and CF Benchmarks - has
  spent the last 15 years building one of the most modern and
  globally accessible financial infrastructure platforms in
  the industry, built to advance an open, global financial
  system.

  The team

  Founded in 2011, Kraken is one of the world's longest-
  standing crypto platforms, trusted by over 10 million
  individuals and institutions across the globe. It offers
  spot trading, margin, futures, staking, and OTC services,
  with products built for both individual investors and
  institutional clients. The opportunity Consumer Growth helps
  customers get more value from the Kraken app. We improve how
  people discover relevant features, build confidence using
  them, and keep coming back. We work closely with Product,
  Design and Data to understand customer behavior, identify
  opportunities and test ideas.

  Our engineers help shape what we build. You’ll bring ideas
  to the table, challenge assumptions and own your work from
  the initial hypothesis through launch, measurement and
  iteration.

  Ship fast experiments, from a couple of days to a couple of
  weeks, to improve conversion and retention in the Kraken
  app.

  - Find funnel drop-offs and turn them into testable ideas,
    then build, measure and iterate.
  - Design, develop and maintain high-quality React Native
    features for our consumer mobile app.
  - Help customers discover and adopt relevant features through
    improvements to customer journeys, incentives and A/B
    tests.
  - Use AI to build quickly, then review and ship with a high
    quality bar.
  - Deliver polished, user-friendly UI that makes the product
    feel great to use.
  - Build for correctness, accessibility, performance and
    reliability, with testing appropriate to the change.
  - Work closely with Product, Design, Data and Backend
    Engineering to define hypotheses and measure results.
  - Instrument your work so the team can evaluate customer
    behavior and experiment results, and use what you learn to
    improve, expand or stop an experiment.
  - Turn successful experiments into reliable, maintainable
    product experiences.
  - Proactively spot gaps and opportunities, and take ownership
    of the outcome.





  What you bring

  - Strong experience building production mobile apps with React
    Native and TypeScript.
  - A product and growth mindset, focused on moving metrics
    rather than just shipping code.
  - Evidence of product impact: you can explain what you built,
    why you built it and what you learned after launch.
  - Curiosity about data, and comfort using analytics tools such
    as Mixpanel and Segment.
  - Experience working in a scale-up or other high-growth, fast-
    moving environment.
  - Fluency in using AI tools to build, review and ship code,
    while retaining ownership of engineering decisions and the
    quality of the result.
  - A strong eye for UI quality and polish.
  - A self-directed approach, with the confidence to find
    problems and fix them without being asked.
  - Comfort working from an ambiguous customer problem,
    proposing ideas and finding a small, useful change to
    test.
  - Collaborative working style across Product, Design and
    Engineering.
  - Strong written and verbal communication skills in English.



  Nice to haves

  - Hands-on experience running A/B tests and experiments,
    ideally with Statsig or a similar tool.
  - Experience with large-scale consumer products used by
    millions of people.
  - Agency or consulting background shipping across multiple
    products.
  - Experience in consumer fintech, payments or crypto apps.









