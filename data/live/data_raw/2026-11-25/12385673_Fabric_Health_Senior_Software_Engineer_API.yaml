description: |
  About Fabric Health

  At Fabric Health, we are powering boundless care by solving
  healthcare’s biggest challenge: clinical capacity. We aren’t
  here to disrupt healthcare; we’re here to fix it. We unify
  the care journey from intake to treatment, using intelligent
  automation to remove administrative burdens and make care
  delivery 2-10x more efficient. Our technology empowers
  clinicians to move faster and focus on what matters most:
  the patient.

  We are a mission-driven team of brilliant minds trusted by
  leading organizations including Intermountain Health, OSF
  HealthCare, SSM Health, and MUSC Health. Our vision is
  backed by premier investors such as Thrive Capital, GV
  (Google Ventures), General Catalyst, and Salesforce
  Ventures. We move quickly for good reason, listen deeply to
  solve big challenges, and build products with the same care
  and quality we’d want for our own loved ones.

  Learn more: About Us | News & Press | LinkedIn | Careers

  About the Role

  As a Senior Software Engineer on our Virtual Care Platform,
  you will be the driving force behind the APIs and data
  models that power our core products. In this highly
  collaborative role, you will work closely with Architecture,
  Product, and Quality teams to design, build, and scale
  robust backend services.

  You won't just be writing code; you will be shaping the
  technical direction of our platform. Operating within a
  fast-paced two-week Scrum cycle, you will tackle complex
  architectural challenges, optimize application performance,
  and elevate the entire engineering team through mentorship
  and rigorous code reviews. If you thrive on building
  scalable data models, deeply understand modern web
  frameworks, and love collaborating to turn conceptual
  designs into high-quality features, this role offers
  incredible impact.

  What You'll Do

  As a Senior Software Engineer on the Virtual Care
  development team, your primary responsibilities will
  include:

  - Design, develop, document, and debug APIs, services, and
    data models across multiple Ruby on Rails applications.
  - Partner closely with Architects and Product Owners to
    translate conceptual feature designs and technical
    specifications into functional, scalable software.
  - Contribute to maintaining the team's level of technical
    excellence by performing code reviews and actively
    mentoring fellow engineers in Rails best practices and new
    technologies.
  - Apply a deep understanding of computer science fundamentals
    to ensure our applications are fast and reliable.
  - Participate in technical design meetings and team demos,
    translating complex app functionality and use-cases for
    non-engineering stakeholders, Implementations, and Support
    teams.
  - Diagnosing and fixing bugs across a large, mature Ruby on
    Rails codebase, from quick corrections to real root-cause
    changes.
  - Making careful, safe live production data edits in Ruby to
    resolve urgent issues, with the discipline that patient-
    facing systems demand.

  Why You Might Be a Good Fit

  - You love designing clean, efficient APIs and tackling
    complex relational database structures to build systems
    that scale.
  - You are a Ruby on Rails expert with a deep, hands-on
    understanding of MVC-based web applications and
    PostgreSQL.
  - You take pride in leveling up your team. You view code
    reviews as an opportunity to teach and improve the
    codebase, not just a rubber stamp.
  - You understand that in healthcare, code quality matters. You
    weave automated testing and security best practices into
    your daily development cycle.
  - You excel in a fast-paced Scrum environment and can
    effortlessly communicate technical ideas to both engineers
    and non-technical teammates.

  This Might Not Be The Right Fit If...

  - You prefer to work in isolation and avoid technical design
    discussions, peer code reviews, or cross-functional
    collaboration.
  - You view automated testing as an afterthought or a task
    solely meant for a QA team rather than an integral part of
    the engineering process.
  - You aren't interested in mentoring junior or mid-level
    engineers.
  - You prefer heavily siloed environments over fast-paced,
    iterative two-week Agile/Scrum sprints.

  Your Qualifications

  - 4-6+ years of professional experience building MVC-based web
    applications, demonstrating increasing skill in tackling
    complex technical challenges.
  - Deep, hands-on expertise with Ruby, Ruby on Rails, and
    testing frameworks.
  - Strong experience designing, building, and consuming APIs
    for web applications.
  - Solid experience with relational databases (RDBMS),
    specifically PostgreSQL, and a firm grasp of relational
    database concepts and optimization.
  - Strong understanding of core software development concepts:
    Object-Oriented Programming, space/time complexity
    analysis, caching, and web application security.
  - BA/BS Degree in Computer Science, Information Systems, or a
    related field (or an equivalent combination of education
    and an additional 2-4 years of industry experience).
  - High professional integrity, credibility, and the ability to
    operate in a high-trust environment.

  Bonus Points

  - Experience building software in healthcare, or in another
    high-stakes, highly regulated domain (especially with PHI
    in a HIPAA environment).
  - Experience with React, Python, or TypeScript.
  - Knowledge of WebSockets for real-time messaging
    applications.
  - Familiarity with integrating AI / ML concepts and models
    into production applications.
  - Familiarity with healthcare interoperability standards such
    as HL7 or FHIR.

  The national pay range for this role is $140,000.00 -
  $170,000.00 per year. Actual compensation will be determined
  by factors such as the candidate's geographic market,
  experience, skills, and qualifications. Certain roles may
  also be eligible for additional compensation, including a
