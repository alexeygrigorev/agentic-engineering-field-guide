  Discover your potential. Build your legacy.

  Go the distance with Capital Group

  At Capital Group, we go the distance — for our people, our
  clients, and each other. As a global, privately held firm
  with more than 95 years of history, we believe meaningful
  careers, like meaningful investing, are built over the long
  term. That’s why we invest in our associates with the same
  conviction we bring to our clients — through career growth,
  purpose-driven work, whole-person wellness, and rewards that
  recognize your contributions. Here, you’ll find the
  opportunity, global scale and support to unlock your
  potential and build a career that lasts.

  The role

  As a Software Engineer, you’ll partner with business
  partners, product managers, and engineers to turn business
  problems into reliable production software, with a
  particular focus on AI-enabled solutions that improve our
  investment process and business outcomes. You’ll contribute
  across the software development lifecycle, from
  understanding the problem and designing the solution through
  implementation, testing, deployment, and production support.
  By combining strong engineering foundations with emerging AI
  capabilities, you’ll help build software that can be
  operated responsibly and improved over the long term.

  The team

  You’ll work within a technology team that develops solutions
  for Capital Group’s investment professionals. The team
  brings together engineers, product managers, data
  scientists, and business partners to create and improve
  tools that support investment workflows, including portfolio
  construction and simulation. Together, you’ll apply
  practical software engineering and responsible AI practices
  to deliver solutions that are reliable, secure, and useful
  in day-to-day decision-making.

  Your impact

  - Partner with business partners and product managers to
    understand workflows, clarify requirements, and translate
    business problems into practical technical solutions.

  - Design, build, test, deploy, and operate production software
    that is maintainable, reliable, secure, scalable, and
    performant.

  - Build AI-enabled applications using retrieval, embeddings,
    context and prompt engineering, tool use, and agentic
    workflows integrated with enterprise data and systems.

  - Define acceptance criteria and automated evaluations that
    measure AI quality, latency, failure modes, and
    hallucination risk.

  - Own software in production through logging, monitoring,
    observability, debugging, and continuous improvement.

  - Embed authentication, authorization, secrets management,
    data protection, auditability, privacy, and responsible-AI
    guardrails into solutions.

  - Evaluate technical trade-offs and contribute to
    architectural decisions that favor simple, maintainable
    solutions.

  - Create reusable components, patterns, documentation, and
    engineering practices that help others operate and extend
    the systems you build.

  What you’ll bring

  - Professional software engineering experience and proficiency
    in Python, Java, C#, or another modern programming
    language.

  - Strong foundations in APIs, data structures, system design,
    data stores, testing, source control, continuous
    integration and delivery, debugging, and production
    operations.

  - Experience designing, building, testing, deploying, and
    supporting production software with attention to
    maintainability, reliability, performance, and security.

  - Experience working with APIs, databases, cloud services, and
    structured or unstructured enterprise data.

  - Strong problem-solving and communication skills, with the
    ability to work through ambiguity, explain technical
    decisions, collaborate effectively, and incorporate
    feedback.

  - A bachelor’s degree in computer science, engineering, or a
    related technical field, or equivalent practical
    experience.

  - A collaborative approach grounded in urgency, ownership,
    humility, sound engineering judgment, and high standards
    for testing, clarity, and reliability.

  - The confidence to challenge scope constructively, propose
    better alternatives, protect quality and team capacity,
    and keep pace with a changing technology landscape.

  Preferred

  - Experience in financial services or another regulated
    enterprise environment.

  - Experience with public cloud and modern data or AI
    platforms, such as AWS, Azure AI, or Databricks.

  - Experience with vector or hybrid search, tool calling,
    agents, AI orchestration, or protocols such as MCP.

  - Experience with AI or machine learning operational
    practices, including evaluation, monitoring,
    observability, model or prompt versioning, and continuous
    integration and delivery.

  - Experience developing across backend services, APIs, data
    integrations, cloud infrastructure, or user-facing
    applications.

  - Hands-on experience building AI or large-language-model
    applications using context and prompt engineering,
    retrieval, embeddings, tool use, agents, or evaluation.

  What you’ll get

  When you go the distance for our clients, we go the distance
  for you. You’ll grow through mentoring, leadership programs,
  and tuition reimbursement, and do work that matters at a
  firm managing $3T+ in AUM for millions of investors
  worldwide. We invest in your whole life too — comprehensive
  wellness and mental health support, family-first benefits,
  competitive pay with performance and profitability bonuses,
  and a company-funded retirement plan. And as a privately
  held firm built for the long term, we offer the opportunity
  and support to build a career that lasts.

  Ready to apply? Visit careers.capitalgroup.com.

