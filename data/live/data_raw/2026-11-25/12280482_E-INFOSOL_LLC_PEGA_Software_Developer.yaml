  Summary

  E-INFOSOL LLC is seeking a motivated and results-driven PEGA
  Software Developer be a full-time, fully remote employee and
  join our innovative and customer solutions focused team.



  Position Overview

  The PEGA Software Developer will be responsible for
  designing, developing, testing, and maintaining PEGA
  applications. This role requires collaboration with cross-
  functional teams to deliver high-quality software solutions
  that meet business requirements.

  Key Responsibilities

  - Design and develop PEGA applications using PEGA PRPC
    (PegaRULES Process Commander) platform.
  - Collaborate with business analysts, project managers, and
    other developers to understand requirements and translate
    them into technical designs.
  - Create and maintain technical documentation including design
    specifications, test plans, and deployment guides.
  - Perform unit testing and support user acceptance testing
    (UAT) to ensure the quality of the delivered solutions.
  - Troubleshoot and resolve technical issues in PEGA
    applications.
  - Participate in code reviews to ensure adherence to best
    practices and coding standards.
  - Optimize application performance and ensure scalability and
    reliability.
  - Stay updated with the latest PEGA technologies and industry
    trends to continuously improve skills and knowledge.

  Required Qualifications

  - Active Secret security clearance
  - Bachelor's degree in Computer Science, Information
    Technology, or a related field.
  - Minimum of 5 years of experience in PEGA development.
  - PEGA Certified Senior System Architect (CSSA) certification
    is preferred.
  - Strong understanding of PEGA PRPC architecture, components,
    and features.
  - Proficiency in PEGA Rules, Flows, Activities, Reports, and
    User Interfaces.
  - Experience with integration technologies such as SOAP, REST,
    JMS, and MQ.
  - Knowledge of relational databases and SQL.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and interpersonal skills.
  - Ability to work independently and as part of a team in a
    fast-paced environment.
  - Active Secret security clearance

  Preferred Qualifications:

  - Experience with Agile/Scrum methodologies.
  - Knowledge of Java, JavaScript, HTML, and CSS.
  - Familiarity with DevOps practices and tools such as Jenkins,
    Git, and Docker.
  - Understanding of cloud platforms such as AWS, Azure, or
    Google Cloud.



  About E-INFOSOL

  E-INFOSOL is a Service Disabled and Veteran Owned Small
  Business (SDVOSB) located in the Washington, D.C.
  metropolitan area. We specialize in building modern and
  tailored solutions to support our customers’ mission. As a
  mission-first organization, we deliver Subject Matter
  Expertise (SME) in cloud computing, virtualization, cyber
  security, software development and data services. We support
  the Intelligence Community, Department of Defense, Federal
  Law Enforcement, Civilian Agencies and the Private Sector.

  Through strategic partnerships with top industry players
  such as Amazon Web Services (AWS), Broadcom, Microsoft and
  Cisco, E-INFOSOL provide an array of IT products and
  solutions. Combined with our industry expertise, we deliver
  in-depth knowledge on Government requirements and fully
  understand NIST and DoD security requirements. Our expertise
  in the latest technologies combined with our understanding
  of infrastructure needs and security requirements provides
  the best combination for achieving innovative and secure
  environments for Government Agencies and Private Sector.



