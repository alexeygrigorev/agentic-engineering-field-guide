  ● Design, develop, and maintain responsive web applications
  using Angular.





      ● Develop cross-platform mobile applications using
  Kotlin Multiplatform (KMP).





      ● Build, maintain, and optimize native Android and iOS
  applications using Kotlin and KMP.





      ● Develop scalable backend services and RESTful APIs
  using Node.js.





      ● Create, maintain, and manage API documentation using
  Swagger / OpenAPI.





      ●





      Integrate frontend and mobile applications with backend
  services.





      ● Work with databases, implement data models, and
