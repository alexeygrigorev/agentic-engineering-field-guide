      ●





      Identify, debug, and resolve application performance and
  technical issues.





      ● Write clean, reusable, maintainable, and well-
  documented code.





      ● Collaborate with team members to deliver features and
  product enhancements










  Ideal Candidate:



  Strong proficiency in front-end and back-end development,
  with excellent problem-solving and analytical skills and a
  proactive, hands-on approach. Experience with programming
  languages, frameworks, databases and API integration is
  essential; experience in developing scalable web
  applications is preferred.




  Experience: 1-3 years preferred.



  Join SEHYOG Academy and help build a positive, professional
  and well-organised workplace.







    Requirements



      ● Hands-on experience with Angular.





      ● Strong knowledge of TypeScript, JavaScript, HTML5, and
  CSS3.





      ● Experience with REST API integration.





