description: |
  We are hiring a software engineering manager with a passion
  for developer experience and build tooling to have a
  positive impact on the day-to-day workflow of thousands of
  snap and charm publishers. To be successful on this team
  you'll need to be interested in packaging formats, build
  systems and automation that can simplify the lives of
  developers and engineers trying to ship software to the
  widest possible audience.

  We design and maintain specialist Python tools to support
  the developer build and publication process. The team takes
  responsibility for tooling that builds snaps, charms and
  more recently, rocks (OCI images).

  Snapcraft allows developers to deliver app updates to
  millions of Linux systems automatically, eliminating the
  long tail of supported releases and complex install
  instructions. Snapcraft enables thousands of applications
  from over a thousand developers, including well-recognized
  names like Spotify, Slack, and Microsoft. Likewise,
  Charmcraft enables collaboration between charmed operator
  developers, and publication on Charmhub, home of the Charmed
  Operator Collection. Charmed Operators enable developers to
  package software like databases, event queues, caches,
  observability tools, identity tools and more, right
  alongside the operations code that enables teams to
  integrate and operate that software at scale from Day 0 to
  Day 1,000, and beyond.

  Your primary responsibility is to your team: helping them
  grow as engineers, do important and satisfying work, and
  have a great time while doing it. Technical leadership
  experience and a background in software engineering are
  necessary prerequisites for this role. You will be expected
  to lead, challenge, and develop strong engineers, positively
  influence the culture, facilitate technical delivery, and
  work with your team on strategy and execution.

  This Engineering Management role is an opportunity for a
  technologist with a passion for developer experience to
  build a career with Canonical and drive the success of the
  business. If you have an affinity for open source
  development, then you will enjoy working with some of the
  best people in the industry at Canonical.

  Location: This is a remote role, we are considering
  candidates in AMER time zones.

  The role entails

  - Leading your team to elevate the Linux developer experience.
  - Demonstrating sound engineering principles through
    architecture, development and code reviews.
  - Being responsible for planning, estimation and execution.
  - Setting and managing expectations with other engineering
    teams, senior management, and external stakeholders.
  - Building and leading a distributed regional team of
    engineers.
  - Offering coaching, mentoring, technical feedback and hands-
    on career development.
  - Designing, embracing, and evangelizing great engineering and
    organizational practices.
  - Being an active part of the leadership team and collaborate
    with other leaders in the organization.
  - Engaging with the wider open source community for feedback
    and collaboration.

  What we are looking for in you

  - An undergraduate degree in a technical subject or a
    compelling narrative about your alternative chosen path.
  - Knowledge of modern high-level languages (Python, Go) as
    well as containerization technologies and primitives
    (Snaps, Docker, etc.).
  - Experience in the design and architecture of command-line
    and server-side applications
  - Software project management skills, encompassing risk
    assessment and resource allocation.
  - Ability to balance technical leadership with effective team
    management.
  - A passion for technology and a drive to work with
    intelligent, motivated colleagues.
  - A track record of open source leadership and collaboration.
  - Curiosity, flexibility, and a strong sense of
    accountability.
  - A focus on soft skills, including passion, enterprise, and
    self-motivation.
  - Strong written and verbal communication skills.
  - Ability to travel twice a year, for company events up to two
    weeks long.

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We assess
  performance and revisit compensation twice annually to
  ensure we recognize outstanding colleagues. In addition to
  base pay, we offer a performance-driven annual bonus or
  commission. We provide all team members with additional
  benefits which reflect our values and ideals. We balance our
  programs to meet local needs and ensure fairness globally.

  - Distributed work environment with twice-yearly team sprints
    in person.
  - Personal learning and development budget of USD 2,000 per
    year.
  - Bi-annual compensation review.
  - Company recognition rewards.
  - 40 days annual leave per annum, including public holidays
    and our All Company holiday periods.
  - Maternity and paternity leave.
  - Team Member Assistance Program & Wellness Platform.
  - Opportunity to travel to new locations to meet colleagues,
    with Priority Pass for lounge access.

  About Canonical

  Canonical is a pioneering tech firm at the forefront of the
  global move to open source. Our platform, Ubuntu, is very
  widely used in breakthrough enterprise initiatives such as
  public cloud, data science, AI, engineering innovation, and
  IoT. Our customers include the world's leading public cloud
  and silicon providers, and industry leaders in many sectors.
  We are founder-led, profitable, and growing.

  Powered by worldwide distributed collaboration since our
  inception in 2004, we believe tech and business leadership
  can emerge anywhere. We have no central headquarters. Most
  of us work from home, but we are exceptionally disciplined
  about this. We have very high expectations of all
  colleagues, and are champions of excellence. Working here is
  a step into the future and will challenge you to think
  differently, work smarter, learn new skills, and raise your
  game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.
