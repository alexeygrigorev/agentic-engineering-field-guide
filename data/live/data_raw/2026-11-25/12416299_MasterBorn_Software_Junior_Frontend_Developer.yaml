title: Junior Frontend Developer
company: MasterBorn Software
location: USA
remote: true
work_type: FULL_TIME
company_size: 85 Employees
description: |
  We’re looking for a Junior Frontend Developer to help build
  and improve applications for our US clients - from early-
  stage MVPs to established products in FinTech, SportsTech,
  MedTech, and other industries.

  TypeScript, React, and Node.js are our bread and butter. We
  value solid fundamentals, curiosity, and a willingness to
  learn how applications work beyond a particular framework.

  We’re building a team of engineers who can contribute across
  the application while developing deep expertise in frontend
  or backend engineering. In this role, frontend is your
  primary discipline, and you’ll broaden your contribution
  across the stack as your experience grows. You’ll build this
  foundation with support from experienced teammates.

  AI-assisted development is part of this role. You’ll learn
  to use coding assistants for exploration, implementation,
  and debugging, while building the skills to understand their
  suggestions, check the results, and recognise when to ask
  for help.

  Contract summary:

  - Rate: PLN 6.000 - 9.000 + VAT / month (B2B); PLN 6.000 -
    7.400 gross / month (UZL)
  - Contract: B2B/UZL, no-service days, 100% remote (or
    hybrid/onsite-as you prefer), Polish time zone, Europe-
    based, flexible hours, full-time position, long-term
    contract
  - Perks and Benefits: 3,000 PLN annual training budget,
    Multisport, Luxmed, Cafeteria Platform, Tech-talks,
    Learning sessions, and more
  - Tools you’ll use: Apple MacBook Pro, Slack, Google
    Workspace, GitHub, Jira, Coda, FigJam, AI tools

  Your future tasks:

  - Develop application features and fix bugs, working on
    clearly defined tasks with support from experienced
    developers
  - Implement responsive interfaces with attention to design
    details, accessibility, and user experience
  - Connect interfaces to APIs and learn how the frontend,
    backend, and data work together
  - Gradually contribute to backend tasks, such as small API
    changes or straightforward business logic, with guidance
    and code review
  - Work with AI coding agents on everyday tasks: plan before
    implementing, follow project rules, and verify the output
    with tests and code review
  - Write readable code following team standards and verify your
    changes
  - Write tests for your own code and keep the existing test
    suite green
  - Learn how changes move from a pull request to a deployed
    application, using the team's automated checks and
    deployment workflow with support
  - Collaborate with designers, developers, QA, and product
    owners to understand requirements and deliver features
  - Participate in code reviews, apply feedback, document your
    work, and share what you learn

  About you - Tech skills & Experience:

  - Around 1 year of commercial experience in web development
  - Solid JavaScript fundamentals, basic TypeScript knowledge,
    and a practical understanding of HTML and CSS
  - Solid React fundamentals: state and immutability, effects
    and their cleanup, and knowing when memoization makes
    sense
  - Understanding of rendering models (CSR, SSR, SSG, hydration)
    and the split between server and client code - you know
    when each one makes sense (SEO, load time, apps behind a
    login)
  - Experience fetching and caching server data with a library
    such as TanStack Query or SWR, including loading and error
    states
  - Experience building interfaces with forms and handling user
    input
  - Writing tests for your own code (Vitest/Jest, React Testing
    Library)
  - Ability to explain your technical choices and their trade-
    offs, not just "I've used X"
  - Daily work with an AI coding agent (e.g. Claude Code, Codex,
    Cursor) beyond chat: planning before implementation,
    project rules files, and verifying results with tests and
    review
  - Basic understanding of HTTP and how an application
    communicates with a backend
  - Ability to investigate issues using browser developer tools,
    error messages, and documentation
  - Familiarity with Git and running applications locally using
    standard development tools

  About you - Soft skills:

  - Curious about user needs and why a feature matters
  - You learn beyond your current project's stack and follow the
    frontend ecosystem and new AI workflows
  - Ask questions, share progress, and raise blockers when you
    need help
  - You welcome feedback and use it to improve your work
  - Comfortable acknowledging knowledge gaps and working through
    them with your teammates
  - Open to learning new tools and gradually exploring backend
    development
  - Ready to work closely with mentors while building
    independence and contributing to an Agile/Scrum team
  - English at B2 or above for international collaboration
  - Polish at C1 or above for daily team communication

  Nice to have:

  - Experience with a meta-framework, e.g. Next.js, Remix, or
    TanStack Start
  - Familiarity with MCP, agent skills, or spec-driven
    development
  - Experience with performance tools and techniques, e.g. React
    Profiler or list virtualization
  - Exposure to backend development, databases, or building a
    simple API
  - Experience taking a personal or commercial application from
    an idea to a working deployment
  - Basic familiarity with cloud services, Docker, or
    configuring CI/CD pipelines

  Recruitment process:

  - CV review
  - Phone call with our Recruiter - 15 minutes
  - Coding assignment - 4 hours
  - Soft-skills interview with our Recruiter - 45 min
  - Technical interview with our Specialists - 2 hours
  - Decision and feedback 🥳
