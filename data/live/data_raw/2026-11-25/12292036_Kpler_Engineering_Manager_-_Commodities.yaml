description: |
  At Kpler, we are dedicated to helping our clients navigate
  complex markets with ease. By simplifying global trade
  information and providing valuable insights, we empower
  organisations to make informed decisions in commodities,
  energy, and maritime sectors.



  Since our founding in 2014, we have focused on delivering
  top-tier intelligence through user-friendly platforms. Our
  team of over 850 experts from 69 countries works tirelessly
  to transform intricate data into actionable strategies,
  ensuring our clients stay ahead in a dynamic market
  landscape. Join us to leverage cutting-edge innovation for
  impactful results and experience unparalleled support on
  your journey to success.



  The Commodities Tribe builds the systems that turn
  fragmented maritime, cargo and market data into a real-time
  view of how commodities are moving around the world. Our
  platforms process complex and often incomplete data at
  scale, powering products, APIs and analytical workflows used
  by customers and internal experts to understand global
  trade.

  As a Engineering Manager, you will lead teams at the centre
  of this domain as we modernise a business-critical platform
  and move towards a more modular, scalable and AI-native
  architecture. You will be responsible for building a high-
  performing and sustainable engineering environment:
  developing people, improving delivery, strengthening
  operational ownership and enabling Technical Leads and
  senior engineers to make strong technical decisions. The
  role is well suited to either an existing Engineering
  Manager or an experienced Technical Lead or senior engineer
  ready to take their first formal step into management.

  Your mission is to

  - Guide the teams through the platform transformation, helping
    engineers understand, influence and adopt the new
    direction.
  - Partner with Product and domain stakeholders to shape the
    roadmap around customer value, data quality and business
    outcomes.
  - Develop Technical Leads and senior engineers, delegating
    decisions to the people with the strongest context while
    keeping accountability clear.
  - Maintain enough technical depth to lead credibly, challenge
    assumptions and support sound decision-making without
    becoming the default technical owner.
  - Set clear goals, milestones and delivery rhythms with the
    teams, balancing roadmap commitments with technical debt
    and platform health.
  - Build strong end-to-end operational ownership, including on-
    call, runbooks, incident response and follow-up actions.
  - Improve reliability and observability across the cargo data
    platform, addressing gaps in monitoring, alerting and data
    integrity.
  - Lead significant incidents affecting the domain and ensure
    contributing factors are understood and acted on.
  - Shape and grow your team through effective hiring,
    capability planning and interviewer development.
  - Develop and retain engineers through coaching, actionable
    feedback, meaningful goals and fair performance
    management.

