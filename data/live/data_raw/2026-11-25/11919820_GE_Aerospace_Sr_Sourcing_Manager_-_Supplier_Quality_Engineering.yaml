description: |
  Job Description SummarySupplier Quality Engineer for
  Aerospace forgings including but not limited to closed die,
  and rings. Drive quality for assigned suppliers, including
  quality plan implementation. Select suppliers through
  qualification processes. Own supplier results, drive
  improvements utilizing supplier scorecards. Own supplier
  audits, ensuring compliance, and driving improvement plans
  where needed. Has in-depth knowledge of best practices and
  how own area integrates with others; has working knowledge
  of competition and the factors that differentiate them in
  the marketJob Description

  Roles and Responsibilities

  - Includes both Supplier Quality Assurance and Supplier
    Quality Development for forging based suppliers. Includes
    supplier qualifications, action plans, audits, performance
    monitoring, and assisting key suppliers towards industrial
    standards of excellence. SQEs have various levels of
    differentiation which are related to level of technical
    understanding of engineering drawings and ability to
    manage vendors.
  - Developing specialized depth and/or breadth of expertise in
    own job discipline or field. Serves as best
    practice/quality resource. Has awareness of latest
    functional developments in own area. Contributes towards
    strategy and policy development, and ensures delivery
    within area of responsibility.
  - Skilled influencer, able to communicate complex messages to
    others. Acts as a resource for colleagues with less
    experience. May lead small projects with moderate risks
    and resource requirements. Explains difficult or sensitive
    information; works to build consensus. Developing
    persuasion skills required to influence others on topics
    within field.
  - Impacts approaches, projects and programs in the functional
    area or affected business organization and ways of
    working. Impacts quality, efficiency and effectiveness of
    own team. These jobs have significant input into their
    priorities. Jobs at this level tend to be covered by
    professional practices and policies but these are shaped
    by the role. Working within broad guidelines and policies,
    roles at this level have moderate autonomy, requiring high
    levels of evaluative judgment.
  - Uses judgment to make decisions or solve moderately complex
    tasks or problems that impact the function. Takes new
    perspective on existing solutions. Uses technical
    experience and expertise for data analysis to support
    recommendations. Uses multiple internal and limited
    external sources outside of own function to arrive at
    decisions.

  Required Qualifications

  - Bachelor’s Degree from an accredited college or university
    +  Minimum of 5 years of Sourcing & Supplier Quality
    Engineering experience
  - Or a high school diploma / GED with at least 10 years of
    experience in Sourcing & Supplier Quality Engineering

  Desired Characteristics

  - Strong oral and written communication skills.
  - Strong interpersonal and leadership skills.
  - Demonstrated ability to analyze and resolve problems.
  - Demonstrated ability to lead programs / projects.
  - Ability to document, plan, market, and execute programs.
  - Established project management skills.

