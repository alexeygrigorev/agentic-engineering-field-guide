description: |
  Meet Domaine, the world's largest independent Shopify design
  and development partner, formed by the union of Half Helix
  and Tomorrow. We are a team of commerce experts dedicated to
  creating, building, and growing beloved brands. As pioneers
  and not just participants in our industry, we are inspired
  to write, break, and re-write the rules for a new generation
  of commerce.

  We are looking for a Frontend Technical Lead to own the
  technical delivery of custom Shopify builds for some of the
  world's best-known brands. This is a client-facing
  leadership role. You are the technical partner to our
  clients and our Delivery team, you lead a project team of
  engineers, and you own the health of the projects you run:
  quality, bugs, technical debt, velocity and releases. You
  understand the "why" behind what a client asks for, shape
  the right technical approach, and make sure your team
  understands it too. You know when to dive into the code to
  unblock progress, and when to step back so your engineers
  own the solution.

  What you'll do

  Delivery and accountability

  - Lead several projects at once, aligning technical delivery
    with each client's business goals.
  - Validate estimates and technical approaches across your
    projects so the plan is feasible: scope, timeline and
    technical constraints in balance.
  - Own project health. Respond to issues with sustainable fixes
    rather than short-term patches.
  - Spot delivery risks early (scaling, API limits,
    maintainability) and raise them with a clear
    recommendation.

  Technical leadership

  - Guide engineers in Shopify best practices and own content
    modeling decisions (metafields, metaobjects, theme
    settings) so builds stay scalable and easy for merchants
    to manage.
  - Own code review, branching and the release pipeline, with
    semantic versioning and GitHub release management on every
    release.
  - Make sure every story has acceptance criteria and QA
    coverage, anticipate edge cases, and build ownership of
    quality into the engineering team, not just QA.
  - Make sure features meet our performance and accessibility
    benchmarks, and weigh user behavior and marketing context
    in technical decisions.
  - Make vendor and technology recommendations, and escalate
    project risks early.

  Clients and collaboration

  - Communicate technical decisions, risks and trade-offs to
    clients, and push back on requirements with clear
    reasoning when needed.
  - Join weekly client status calls, own technical stakeholder
    reporting, and secure client approval on technical
    requirements at milestones.
  - Co-lead demos, technical workshops and QA sign-off sessions
    with your PM and BSA.
  - Work daily with your PM on priorities, and partner closely
    with Delivery, QA and Design.
  - Document technical decisions and releases.

  People leadership

  - Manage engineers directly: regular check-ins, performance
    reviews and growth planning.
  - Build a high-performing team through mentorship, clear
    expectations and constructive feedback.
  - Delegate on purpose: down to grow your engineers, up when
    blockers or scope changes need it, and sideways to share
    ownership with peers.
  - Set the standard for professional, respectful communication.
    De-escalate tension and keep trust across the project
    team.

  AI in the workflow

  - Build AI into your project workflows (documentation,
    requirements gathering, development) and make sure your
    team uses it responsibly, reviewing what it produces
    rather than relying on it.

  What you bring

  - Several years building custom Shopify storefronts, including
    leading engineering teams or projects in an agency or
    client-services setting.
  - Deep knowledge of Shopify theme development: Liquid, Online
    Store 2.0, metafields and metaobjects, Shopify CLI, and
    the Storefront and Admin APIs.
  - Strong JavaScript, with Tailwind CSS and web components (we
    use Lit). React and TypeScript for Checkout UI extensions
    and Shopify Functions; familiarity with Rust for Functions
    is a plus.
  - Experience with checkout features, third-party integrations
    and API implementations.
  - Solid grasp of web performance, accessibility and
    maintainable component architecture.
  - Git, GitHub (including GitHub Actions) and a ticketing
    system such as Jira.
  - Clear written and spoken communication with technical and
    non-technical audiences, including clients.
  - Experience mentoring engineers; people management experience
    is a strong plus.
  - Practical, responsible use of AI tools in engineering work.

  Perks and benefits

  - You will work on fun, impactful, visible and challenging
    projects for growing brands in the Champions League of
    e-commerce.
  - Flexible location: possibility to work in our beautiful
    office in picturesque Delft, or hybrid- we meet up weekly
    during dev-days in the office in Delft, easy accessibility
    by public transport and car.
  - You will join an agency with high ambitions but realistic
    expectations. We actively facilitate a healthy work-life
    balance.
  - Your personal and professional development is essential to
    us: we spend budget and time to facilitate your growth.
  - Informal dress code and open culture – we like to feel at
    home! So expect to have fun with after-work drinks & team
    outings.
  - Being part of a team where your input will be valued and
    respected.
  - Continued education and personal development opportunities
  - Competitive PTO policy
  - Employer-paid pension contributions
  - Working from home allowance
  - Apple gear (e.g. Macbook Pro)
  - Continued education and personal development opportunities

  *We are an Equal Opportunity employer. We do not
  discriminate in hiring on the basis of sex, gender identity,
  sexual orientation, race, color, religious creed, national
  origin, physical or mental disability, protected veteran
  status, or any other characteristic protected by federal,
  state, or local law.
