description: |
  We're looking for a Junior Backend Developer to help build
  and improve applications for our US clients - from early-
  stage MVPs to established products in FinTech, SportsTech,
  MedTech, and other industries.

  TypeScript, Node.js, and React are our bread and butter. We
  value solid fundamentals, curiosity, and a willingness to
  learn how applications work beyond a particular framework.

  We're building a team of engineers who can contribute across
  the application while developing deep expertise in backend
  or frontend engineering. In this role, backend is your
  primary discipline, and you'll broaden your contribution
  across the stack as your experience grows. You'll build this
  foundation with support from experienced teammates.

  AI-assisted development is part of this role. You'll learn
  to use coding assistants for exploration, implementation,
  and debugging, while building the skills to understand their
  suggestions, check the results, and recognise when to ask
  for help.

  - Rate: PLN 6.000 - 10.000 + VAT (B2B); PLN 5.000 - 7.500
    brutto (UZL)
  - Required: 6-12 months commercial experience with Python,
    knowledge hungry, understand core Python concepts (Python
    3.10+), basic experience with Django, hands-on experience
    with SQL databases, understand what SOLID & DRY stand for
  - Offer: B2B/UZL, paid days off, 100% remote (or hybrid/onsite
    - as you prefer), Polish time zone, flexible hours, full-
    time position, Scrum Teams
  - Perks and Benefits: 3,000 PLN annual training budget,
    Multisport, Luxmed, Cafeteria Platform, Learning Sessions,
    Education Budget & more
  - Tools you'll use: Apple MacBook Pro, Slack, GSuite, GitHub,
    Jira, Coda, Miro

  Your future tasks and duties:

  - Writing clean, maintainable, and well-structured Python
    code, leveraging AI coding agents while taking full
    ownership of the final solution
  - Technical involvement in the product - finding the ways to
    improve it
  - Writing documentation for delivered code
  - Peer code review
  - Reuse and improve of the company knowledge base
  - Communicate with the team to efficiently translate business
    complexity (user stories/tasks) into solutions (end
    results/estimations)
  - Learning, learning and learning ;)

  About you - Tech skills & Experience:

  - At least 6 months of commercial experience with Python
  - Understand Python (Python 3.10+) fundamentals, type hints,
    OOP principles, common data structures, and know how to
    write clean, readable and maintainable code
  - Basic experience with Django - know its core features
    (models, views, ORM, migrations), worked on at least 1
    project involving Django, would be great to have
    commercial experience in it
  - Familiarity with building and consuming RESTful APIs
  - Know what OOP is, understand basic good practices and data
    structures, want to have a SOLID and DRY code with the use
    of design patterns
  - Know how to use AI (Claude Code preferred), but understand
    the consequences of its use and can independently write
    code without its support
  - Have worked with SQL databases (e.g. PostgreSQL, MySQL) -
    can write basic SQL queries and use them alongside Django
    ORM
  - Experience with Git

  About You - Soft Skills:

  - English level B2 to cooperate with American clients
  - Polish level C1 to communicate easily within the team
  - Knowledge-hungry, positive attitude
  - Effective communication - crucial for seeking feedback and
    understanding others’ perspectives
  - Open-minded to new ideas, perspectives, and feedback from
    experienced colleagues
  - Being open to change and adapting to different situations
  - Being aware of your strengths, weaknesses, and areas for
    improvements
  - Enthusiastic for learning and taking on challenges
  - Actively seeking solutions and trying to figure things out
    on your own, but not being afraid to ask for help when
    needed

  Nice to have:

  - Open-source contributions
  - Understand what Agile/Scrum is and want to work as a team
    towards one goal
  - Understand the significance of MVP and aim to deliver top-
    notch results, even amid tight project timelines
  - Experience with Django REST Framework or other Python
    frameworks (e.g. FastAPI, Flask)
  - Familiarity with Django Admin
  - Experience with automated testing (e.g. pytest)
  - Experience with Celery (or another task queue) and Redis
  - Experience integrating with payment or billing providers
    (e.g. Stripe, Zuora) or email platforms
  - Know what AWS is and get why it is used
  - Serverless experience
  - Know how to run Docker images and how to use them







  Meaningful projects, top-notch experts and value-driven
  workplace

  Sound good?

  Apply now!
