  About the Role

  You'll lead our Search Intelligence and Data Science teams
  and be the engineering owner of Lucidworks AI (LWAI), the
  platform that brings generative AI, embeddings, and ML into
  our clients' search experiences. You'll partner with Product
  on the roadmap, turn research into production capability,
  and lead the team's shift to AI-led development, where
  engineers direct AI agents across the software lifecycle.
  This role reports to the VP of Engineering.

  Lucidworks offers SaaS-native solutions that couple with our
  flagship enterprise software product, Fusion, to power
  search and discovery for some of the world's largest
  companies. Our MLOps platform is central to that strategy,
  and your teams will contribute to both product lines. We
  integrate with the biggest generative AI providers, and we
  get strong performance out of open source embedding models
  and LLMs that we host ourselves.

