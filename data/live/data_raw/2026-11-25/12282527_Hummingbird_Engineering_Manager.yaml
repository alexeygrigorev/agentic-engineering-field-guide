description: |
  Hummingbird is a remote-first, fully distributed team united
  by the shared mission of helping fight financial crime.
  Since our launch in 2017, we’ve helped major financial
  institutions and tech-savvy trailblazers alike (e.g. Plaid,
  Raymond James, Crypto.com etc.) orchestrate their compliance
  programs through our thoughtfully designed, intuitive, AI
  powered compliance tools. We believe finding and stopping
  financial crime is a problem rooted in code, language and
  design, so we built the product that the heroes doing this
  work deserve.

  We are customer-obsessed, and we love building and shipping
  great products. We set a high bar, challenge our
  assumptions, seek diverse opinions, and support each other
  to do our best work.

  We do our best to write inclusive, descriptive and accurate
  job descriptions, but we’re not always perfect. If you’re
  interested in the role, we’d love to hear from you even if
  you don’t feel like you meet everything we’re looking for.
  We’re always iterating and improving, and it’s possible that
  your experience is even more impactful than we could have
  imagined.





  About the Role

  Our customers trust us with their most sensitive data and
  with the compliance work that keeps financial crime in
  check. The Trust team keeps that trust: we own Hummingbird's
  infrastructure, security, reliability and data platform.
  We're looking for a hands-on Engineering Manager to lead the
  team. You'll own its roadmap, still write code, and help us
  grow from serving fast-moving fintechs to serving some of
  the largest banks in North America.

  What you’re looking to do:

  - Lead and grow the Trust team. Manage, coach and hire a
    small, senior team of infrastructure, security and data
    engineers, and take over from our current leader.
  - Own the Trust roadmap. Act as the team's technical product
    manager. Weigh enterprise customer needs against
    reliability, security and platform investments, and
    explain those trade-offs across the company.
  - Stay hands-on. Contribute to our AWS and Terraform
    infrastructure, review designs and PRs, and help during
    incidents. You'll be technical, while keeping yourself out
    of the critical path.
  - Raise the bar on security and reliability. Lead work on
    disaster recovery, incident follow-ups, security posture,
    and our compliance programs.
  - Support enterprise growth. Help run single-tenant
    deployments for large financial institutions, and work
    with Sales and CS on customer security reviews.
  - Partner closely with (and, depending on your background,
    lead) our IT and security functions, which sit within the
    Trust team.

  What we’re looking for:

  - A US-based engineering leader who has managed people and is
    still technical enough to ship infrastructure code. You'd
    be comfortable in a Terraform PR or in front of a
    production dashboard.
  - A strong background in cloud infrastructure (AWS preferred)
    and running production systems where reliability and
    security really matter.
  - Practical about process: you shape how a team works around
    what it actually needs, keeping what works and fixing what
    doesn't.
  - Security instincts built from real experience. Hands-on SOC
    2 or PCI work is a big plus.
  - A clear communicator who can explain the same incident to an
    engineer, an executive, and a bank's InfoSec team.
  - Bonus: you've owned a technical roadmap or done technical
    product management. You'll own the Trust roadmap here, but
    we'll support you as you grow into it.

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. We will ensure that individuals with
  disabilities are provided reasonable accommodation to
  participate in the job application or interview process, to
  perform essential job functions, and to receive other
  benefits and privileges of employment. Please don't hesitate
  to contact us to request accommodation.
