description: |
  About Ping Identity:

  At Ping Identity, we believe in making digital experiences
  both secure and seamless for all users, without compromise.
  We call this digital freedom. And it's not just something we
  provide our customers. It's something that inspires our
  company. People don't come here to join a culture that's
  built on digital freedom. They come to cultivate it.

  Our intelligent, cloud identity platform lets people shop,
  work, bank, and interact wherever and however they want.
  Without friction. Without fear.

  While protecting digital identities is at the core of our
  technology, protecting individual identities is at the core
  of our culture. We champion every identity. One of our core
  values, Respect Individuality, reminds us to celebrate
  differences so you are empowered to bring your authentic
  self to work.

  We're headquartered in Denver, Colorado and we have offices
  and employees around the globe. We serve the largest, most
  demanding enterprises worldwide, including more than half of
  the Fortune 100. At Ping Identity, we're changing the way
  people and businesses think about cybersecurity, digital
  experiences, and identity and access management.

  In this Software Engineer role, you will play an important
  part in the development of a market-leading, open standards
  first platform, providing flexible, modular and scalable
  identification, authentication, and authorization to a range
  of applications. You will be part of a team that prides
  itself on an open, flexible environment, embracing
  collaboration, agile methodologies, continuous improvement,
  and most of all, the love of a challenge.

  We require a passionate developer who flourishes in a fast-
  moving, agile environment. You must have good communications
  skills, an outstanding ability to translate requirements and
  designs to functional Java code, and a strong attention to
  security, quality, testability and performance.

  You Will

  - Work as part of an agile development team to implement the
    highest quality product features
  - Use AI tooling as a practical part of the engineering
    workflow to accelerate discovery and delivery
  - Have a voice in working with product management and owners
    to improve the platform and develop new features for our
    platform
  - Understand and improve our local and cloud deployments
  - Plan and estimate work to be completed
  - Maintain existing code and resolve reported defects
  - Actively contribute to the culture that makes this such a
    great team

  You Have

  - Strong familiarity with the Java programming language
  - Possess the desire to learn and curiosity to understand how
    and why things work
  - Demonstrate strong collaboration, communication, and
    teamwork skills
  - Exceptional problem-solving skills
  - Ideal candidate must be keen to learn quickly and
    independently, and be capable of gathering information and
    understanding complex features and environments
  - Ability to use AI engineering tools to accelerate research,
    code understanding, prototyping, implementation, and
    documentation while applying sound engineering judgment

  Bonus Points If You Have

  - Familiarity with UI development, using javascript, and the
    Vue or React frameworks
  - Experience with development tools, including IDEs, Git,
    Jenkins, and Maven, Bazel
  - Solid understanding of RESTful web services
  - Experience with identity management technologies and
    protocols (e.g., OAuth 2.0, OpenID Connect, certificate &
    key management, cryptography, etc.)
  - Understanding of enterprise-scale systems and configurations
    related to security
  - Solid grounding in modern software engineering practices and
    design patterns, including the design and implementation
    of modern web applications

  Salary Range: $150,000.00 - $170,000.00 USD

  In accordance with Colorado’s Equal Pay for Equal Work Act
  (SB 19-085) the approximate compensation range for this role
  in Colorado is listed above. Final compensation for this
  role will be determined by various factors, such as
  knowledge, skills, and abilities.

  Life at Ping:

  We believe in and facilitate a flexible, collaborative work
  environment. We’re growing quickly, but remain true to the
  innovative, can-do startup values that got us here. Most
  importantly, we keep hiring talented, smart, fun, and
  genuinely nice people because that’s who we want to succeed
  with every day.

  Here are just a few of the things that make Ping special:

  - A company culture that empowers you to do your best work.
  - Employee Resource Groups that create a sense of belonging
    for everyone.
  - Regular company and team bonding events.
  - Competitive benefits and perks.
  - Global volunteering and community initiatives

  Our Benefits:

  - Generous PTO & Holiday Schedule
  - Parental Leave
  - Progressive Healthcare Options
  - Retirement Programs
  - Opportunity for Education Reimbursement
  - Commuter Offset (Specific locations)

  Ping is the collective sum of all our individual
  experiences, backgrounds and influences and we pride
  ourselves in growing and learning together. We are committed
  to building an inclusive and diverse environment where
  everyone’s individuality is respected and everyone has an
  Identity. In recruiting for new colleagues, we welcome the
  unique contributions you can bring and encourage you to be
  your best self.

  We are an Equal Opportunity/Affirmative Action employer.
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex
  including sexual orientation and gender identity, national
  origin, disability, protected Veteran Status, or any other
  characteristic protected by applicable federal, state, or
  local law.
