description: |
  Job Title: Software Engineer  Location: On-site in Glen
  Allen, VA Job Description: As a mid-level Software Engineer
  at Richmond National, you will play a pivotal role in
  building enterprise software products and solutions. You
  will work closely with cross-functional teams to deliver
  high-quality software that meets both customer requirements
  and exceeds industry standards. We are seeking a highly
  motivated engineer who is passionate about modern technology
  and has a track record of delivering exceptional results.
  Responsibilities:

  - Work directly with Software Engineers, QA Engineers, and
    Data Engineers to develop, maintain, and improve internal
    applications, integrations, and utilities.

  - Support complex software systems that are secure, scalable,
    reliable, and maintainable.

  - Write high-quality, efficient, and maintainable code in
    accordance with best practices and Richmond National
    coding standards.

  - Perform code reviews and provide constructive feedback to
    team members.

  - Mentor and guide junior engineers, sharing your expertise
    and best practices.

  - Identify and address technical debt, performance
    bottlenecks, and security vulnerabilities.

  - Troubleshoot and debug software issues, working closely with
    Cloud Engineers and QA Engineers to ensure smooth
    deployments.

  - Stay up-to-date with emerging technologies and industry
    trends, evaluating their potential for incorporation into
    our projects.

  - Continuously improve development processes and tools to
    enhance team productivity.

  Qualifications:

  - Bachelor's or Master's degree in Computer Science or a
    related field. Preferred but not required if proficiency
    can be demonstrated.

  - 2-5 years of professional software development experience on
    complex software solutions.

  - Proficiency in one or more programming languages such as
    Java or Python.

  - Strong knowledge of software design principles, data
    structures, and algorithms.

  - Experience with software development methodologies like
    Agile or Scrum.

  - Familiarity with version control systems (e.g., Git) and
    issue tracking tools (e.g., Jira).

  - Excellent problem-solving and analytical skills.

  - Strong communication and collaboration skills.

  - Ability to work effectively in a fast-paced, dynamic
    environment, both individually and within a team.

  Preferred Qualifications:

  - Experience with Web Technologies (JavaScript, CSS, HTML) and
    frameworks such as Angular.
  - Experience with backend frameworks such as Spring Boot or
    FastAPI.
  - Experience with cloud platforms (AWS preferred).
  - Knowledge of containerization and orchestration
    technologies: Docker, ECS.

  - Familiarity with DevOps best practices and CI/CD pipelines
    for building and deploying applications such as GitHub
    actions.

  - Previous experience in a leadership or mentorship role with
    ability to mentor.

  Compensation: At the time of posting, the expected base
  salary range for this role is $100,000-$120,000 annually.
  Additionally, this position is eligible for participation in
  our annual bonus program. Actual compensation will be
  determined by many factors, including but not limited to,
  location, education, certifications, qualifications,
  relevant experience, internal equity, business need, and any
  applicable minimum wage requirements. Richmond National
  offers a comprehensive benefits package, more details on
  which can be found below.
