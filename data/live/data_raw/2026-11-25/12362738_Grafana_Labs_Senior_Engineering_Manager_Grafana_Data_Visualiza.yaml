description: |
  Grafana Labs is the company behind Grafana Cloud, the fully
  managed observability platform trusted by more than 10,000
  organizations to ensure reliability, resolve incidents
  faster, and optimize telemetry at scale. Built on open
  source and open standards and designed for interoperability
  across any stack, Grafana Cloud brings AI to observability
  and observability to AI, giving teams (and their agents)
  unified visibility so they can see, understand, and act on
  all their disparate data, wherever it lives, and move at the
  speed of their ambitions. Customers, including Anthropic,
  Bloomberg, NVIDIA, Microsoft, and Salesforce, rely on
  Grafana Labs. We are a 100% remote company with team members
  across 40+ countries, backed by leading investors including
  Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue,
  J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
  grafana.com and follow us on LinkedIn and X.

  We’re scaling fast and staying true to what makes us
  different: an open-source legacy, a global collaborative
  culture, and a passion for meaningful work. Our team thrives
  in an innovation-driven environment where transparency,
  autonomy, and trust fuel everything we do.

  You may not meet every requirement, and that’s okay. If this
  role excites you, we’d love you to raise your hand for what
  could be a truly career-defining opportunity.

  This is a remote opportunity and we would be interested in
  applicants from USA in EST time zones only at this time.
  Senior Engineering Manager, Grafana Data Visualization  The
  Opportunity:

  Grafana is an open-source observability product and a
  platform that teams and plugin developers build on. The
  Frontend group shapes its user experience (from dashboards
  and visualisation to navigation, search and sharing) and the
  foundations that support engineering teams and community
  contributors across the Grafana ecosystem.

  As Senior Engineering Manager, you’ll lead the DataViz
  squad, owning its performance, delivery and customer
  outcomes. The squad owns a range of Grafana visualisations,
  their underlying libraries, configuration experiences and
  interactions, spanning core Grafana and standalone plugins.
  You’ll help shape how these capabilities enable users to
  understand their data and take action. You’ll develop senior
  engineers, partner with Product and Design to shape
  direction, and improve how the squad works, including
  through AI and automation. We use Cloud-first rollout and
  experimentation to learn quickly, bringing relevant
  improvements to OSS and Enterprise.

  AI Notice: We invest heavily in developer productivity. You
  can use modern AI coding assistants as part of your daily
  workflow (your choice of tools, within security guidelines),
  backed by a company-funded usage budget so you can iterate
  quickly without unnecessary friction. We encourage pragmatic
  AI-assisted development: faster prototyping, test
  generation, refactors, documentation, and incident follow-
  ups—always with strong code review and quality standards.
  You'll also have access to the latest frontier models from
  OpenAI, Anthropic, and Google.

  What You’ll Be Doing:

  - Be accountable for the performance of a distributed
    engineering squad: set clear expectations, delegate
    effectively, coach and develop each team member, give
    timely feedback, address performance gaps and build a
    culture of trust and accountability.
  - Own hiring and team planning, aligning team capacity and
    skills with product priorities and longer-term needs.
  - Lead discovery with your squad: engage directly with
    customers, community members and internal users, combine
    their feedback with research and usage evidence, and use
    those insights to shape roadmaps and priorities.
  - Develop an informed point of view on product direction with
    Product, Design and senior engineers. Keep priorities
    explicit, assess new requests against business impact and
    capacity, and make clear decisions about what to stop or
    defer, balancing customer and community needs with long-
    term platform investments and operational demands.
  - Own delivery from discovery through rollout and measurement.
    Help the squad scope small, valuable increments, learn
    through short feedback loops and complete the most
    important work. Build the team’s ability to surface risks
    early and adapt plans as evidence and priorities change.
  - Use AI regularly in your management work to synthesise
    research and feedback, inform roadmap and resourcing
    decisions, and streamline coordination, reporting and
    follow-through.
  - Improve how the squad plans, makes decisions and delivers,
    including limits on work in progress. Lead the adoption of
    AI and automation across engineering and operational
    workflows, evaluating their impact on delivery speed,
    quality and time spent on repetitive work.
  - Set engineering direction with senior engineers for the
    squad’s visualisations, rendering libraries, panel
    configuration and interactions. Balance user experience,
    accessibility, performance, reliability and security with
    the evolution of shared foundations and the plugin
    ecosystem.
  - Build shared ownership so engineers recognise delivery
    risks, help one another and rally around the highest-
    priority outcomes. Coach the squad to make decisions
    together and shift effort across projects when needed.
  - Set and uphold engineering standards for quality, security
    and operability, including how teams evaluate and validate
    AI-assisted work.
  - Lead improvements across Grafana and R&D that increase
    engineering productivity and improve business outcomes.
  - Participate in the engineering management on-call rota,
    coordinate responses and drive improvements that reduce
    recurring disruption. Regularly use Grafana’s AI
    capabilities for observability, incident investigation and
    management, bringing that experience into product feedback
    and roadmap decisions.

  What Makes You a Great Fit

  - Significant experience managing senior engineers, building
    healthy teams and developing technical leaders. You give
    clear feedback and address performance gaps directly and
    fairly.
  - A strong technical foundation in modern web or frontend
    systems, enabling you to evaluate technical trade-offs and
    shape architectural and engineering-quality decisions with
    senior engineers.
  - A track record of turning ambiguous problems into clear
    priorities and measurable results, delivering in small
    increments and adapting commitments as business needs and
    evidence change.
  - Strong product and customer judgement, with the curiosity to
    understand users’ workflows, develop a point of view and
    help teams make tough trade-offs between product needs and
    platform investments.
  - Clear, concise written communication and the ability to work
    effectively in a remote, globally distributed
    organisation.
  - An appreciation for open-source development and the
    judgement to balance Cloud-first delivery with the needs
    of customers, community members and internal teams.
  - Practical experience using AI and automation in your own
    leadership work, and leading teams to adopt them
    effectively.

  Bonus Points For

  - Experience with React, TypeScript or comparable large-scale
    frontend ecosystems.
  - Experience leading teams that balance shared technical
    foundations with user-facing product development,
    including plugins or extensions.
  - Experience with data visualisation, interactive analytical
    tools or workflows that help users understand data and
    take action.
  - Experience leading major library or platform migrations
    while protecting compatibility and the user experience.
  - Experience working on a widely adopted open-source product.

  Compensation & Rewards:

  In the United States, the Base compensation range for this
  role is USD 214,860 - USD 257,832. Actual compensation may
  vary based on level, experience, and skillset as assessed in
  the interview process.

  All of our roles include Restricted Stock Units (RSUs),
  giving every team member ownership in Grafana Labs' success.
  We believe in shared outcomes—RSUs help us stay aligned and
  invested as we scale globally.

  *Compensation ranges are country specific. If you are
  applying for this role from a different location than listed
  above, your recruiter will discuss your specific market’s
  defined pay range & benefits at the beginning of the
  process.

  Why You’ll Thrive at Grafana Labs:

  - 100% Remote, Global Culture - As a remote-only company, we
    bring together talent from around the world, united by a
    culture of collaboration and shared purpose.
  - Scaling Organization – Tackle meaningful work in a high-
    growth, ever-evolving environment.
  - Transparent Communication – Expect open decision-making and
    regular company-wide updates.
  - Innovation-Driven – Autonomy and support to ship great work
    and try new things.
  - Open Source Roots – Built on community-driven values that
    shape how we work.
  - Empowered Teams – High trust, low ego culture that values
    outcomes over optics.
  - Career Growth Pathways – Defined opportunities to grow and
    develop your career.
  - Approachable Leadership – Transparent execs who are
    involved, visible, and human.
  - Passionate People – Join a team of smart, supportive folks
    who care deeply about what they do.
  - In-Person onboarding - We want you to thrive from day 1 with
    your fellow new ‘Grafanistas’ to learn all about what we
    do and how we do it.
  - Balance is Key - We operate a global annual leave policy of
    30 days per annum. 3 days of your annual leave entitlement
    are reserved for Grafana Shutdown Days to allow the team
    to really disconnect. *We will comply with local
    legislation where applicable.

  Equal Opportunity Employer: Grafana Labs is an equal
  opportunities employer. We welcome applications from
  everyone regardless of race, colour, nationality, origin,
  caste, sex, gender reassignment identity or expression,
  sexual orientation, age, religion or belief, disability,
  veteran status, genetic information, pregnancy, maternity,
  marital, family or carer status, or any other characteristic
  which is protected by local law. We believe that equality
  and diversity build a strong organisation, and we work hard
  to ensure that is the foundation of our organisation as we
  grow.

  Grafana Labs may utilize AI tools in its recruitment process
  to assist in matching information provided in CVs to job
  postings. The recruitment team will continue to review
  inbound CVs manually to identify alignment with current
  openings.

