description: |
  Create an outstanding customer experience through
  exceptional service. Establish and maintain a safe and clean
  environment that encourages our customers to return. Assist
  the department manager in reaching sales and profit goals
  established for the department, and monitor all established
  quality assurance standards. Assist in directing and
  supervising all functions, duties and activities for the
  Front-end department. Support the day-to-day functions of
  the Front-end operations. Responsible for assisting with the
  execution of best practices, goals and Front-end standards
  established for the department. Demonstrate the company's
  core values of respect, honesty, integrity, diversity,
  inclusion and safety.

  Responsibilities

  - Promote trust and respect among associates.
  - Create an environment that enables customers to feel
    welcome, important and appreciated by answering questions
    regarding products sold within the department and
    throughout the store.
  - Gain and maintain knowledge of products sold within the
    departments and be able to respond to questions and make
    suggestions about products.
  - Assist with monitoring and control supply expenses for the
    department.
  - Assist with managing cash control, sales and cash items and
    records for the store.
  - Manage the scheduling of Front-end associates to provide
    adequate department coverage.
  - Assist store management in preparing the store/department
    budget, profit and loss reviews, and take appropriate
    action on all financial reports.
  - Assist with creating and execute budgets and scheduling of
    labor in partnership with store management.
  - Assist in the development and implementation of department
    action plans to achieve desired results.
  - Collaborate with Front-end associates and promote teamwork.
  - Display a positive attitude.
  - Stay current with present, future, seasonal and special ads.
  - Adhere to all food safety regulations and guidelines.
  - Ensure proper temperatures in cases and coolers are
    maintained and temperature logs are maintained.
  - Reinforce safety programs by complying with safety
    procedures and identify unsafe conditions and notify store
    management.
  - Practice preventive maintenance by properly inspecting
    equipment and notify appropriate department or store
    manager of any items in need of repair.
  - Notify management of customer or employee accidents.
  - Report all safety risks or issues, and illegal activity,
    including: robbery, theft or fraud.
  - Adhere to all local, state and federal laws, and company
    guidelines.
  - Ability to work cooperatively in high paced and sometimes
    stressful environment.
  - Ability to manage conflict in a reasonable,
    nonconfrontational and cooperative manner.
  - Ability to act with honesty and integrity regarding customer
    and business information.
  - Ability to follow directions and seek assistance when
    necessary to resolve customer and business issues.
  - Provide support and assistance through direct interaction
    with minors, individuals with special needs, and older
    adults.
  - Must be able to perform the essential functions of this
    position with or without reasonable accommodation.

  Qualifications

  Minimum

  - Ability to handle stressful situations
  - Effective communication skills
  - Knowledge of basic math (counting, addition, and
    subtraction)
  - Retail or Customer Service experience

  Desired

  - High school diploma or equivalent
  - Management experience
  - Second language (speaking, reading and/or writing)
industries:
