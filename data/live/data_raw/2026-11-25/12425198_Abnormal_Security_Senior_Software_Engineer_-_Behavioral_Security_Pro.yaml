description: |
  At Abnormal AI, we protect our customers against nefarious
  adversaries who are constantly evolving their techniques and
  tactics to outwit and undermine the traditional approaches
  to Security.

  Abnormal is recognized as a top cybersecurity startup
  (Leader in the 2025 Gartner Magic Quadrant for Email
  Security Platforms), securing a Series D funding of $250
  million at a $5.1 billion valuation in August 2024.

  About The Team

  The team is responsible for the ownership, development, and
  operation of the infrastructure and ML models, customer
  facing APIs and internal tools that drive Abnormal's Account
  Takeover (ATO) protection product. This product is crucial
  for detecting malicious activity and safeguarding customers
  from account theft.

  About The Role

  We are looking for a Senior Software Engineer to take
  ownership of complex feature delivery and technical design
  for our ATO platform. This pivotal role involves evolving
  the platform to scale with expanding product requirements.
  The position requires a blend of hands-on backend systems
  development, production ownership, stakeholder management,
  and team mentorship. The core goal is to enhance system
  reliability, reduce latency, and significantly accelerate
  feature release cycles.

  What You’ll Do

  Technical Delivery & Excellence

  Leadership & Collaboration

  What We’re Looking For

  - Ownership & Growth: A senior engineer mindset—able to
    independently lead complex projects and grow into a
    technical leader within the team.
  - Attention to Detail: Deep focus on code quality,
    reliability, monitoring, and performance.
  - System Thinker: Ability to anticipate long-term scaling
    needs and design resilient architectures.
  - Strong Collaborator: Comfortable influencing cross-team
    goals, mentoring peers, and working in a distributed
    environment.
  - GenAI Affinity: Proactive in leveraging modern developer
    productivity tools, including GenAI assistants, to
    accelerate delivery.

  Must-Have Skills

  - 7+ years of industry experience, with proven expertise as a
    Senior Software Engineer.
  - Strong backend proficiency in Python, with experience
    designing and scaling production systems.
  - Proven experience with large scale system design, building
    resilient, scalable, and fault-tolerant applications.
  - Strong knowledge of relational databases and modern data
    storage technologies .
  - Familiarity with service-to-service communication (gRPC,
    Kafka) and caching (Redis).
  - Experience with AWS cloud services (S3, RDS) and deployment
    practices.Familiarity with containerization and
    orchestration (Docker, Kubernetes, Helm).
  - Strong understanding of service health, monitoring, and
    incident response practices.
  - Experience writing technical design documents and
    influencing adoption across teams.

