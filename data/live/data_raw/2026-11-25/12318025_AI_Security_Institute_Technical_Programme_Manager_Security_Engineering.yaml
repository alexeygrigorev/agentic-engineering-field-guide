description: |
  About the AI Security Institute

  The AI Security Institute is the world's largest and best-
  funded team dedicated to understanding advanced AI risks and
  translating that knowledge into action. We’re in the heart
  of the UK government with direct lines to No. 10 (the Prime
  Minister's office), and we work with frontier developers and
  governments globally.

  We’re here because governments are critical for advanced AI
  going well, and UK AISI is uniquely positioned to mobilise
  them. With our resources, unique agility and international
  influence, this is the best place to shape both AI
  development and government action.

  The deadline for applying to this role is Wednesday 25th
  November 2026, end of day (UK Time).About the team

  As the models we test get more capable and the environments
  we run them in get more sensitive, we have to continue to be
  able to run evaluations of highly capable models under
  proper control and ensure that it remains governed well.
  Building that governance and keeping it fast is what lets
  AISI keep pace with the work in front of it. The Security
  Engineering team keeps AISI's research platform, evaluation
  environments, and sensitive data secure, and runs the
  governance, risk, and compliance around them. We harden the
  environments evaluations run in, detect and respond to
  threats, and build the controls that let evaluations of
  highly capable models proceed safely. We work with research
  teams across AISI, with partners in frontier AI companies
  and government.

  About the role

  Rigorous safety governance and fast-moving research aren't
  mutually exclusive. AISI research involves working with
  highly capable AI models, often before they have been
  released to the public and often with lowered safeguards, to
  understand their true capabilities. That work has to be
  properly controlled, and someone has to build the processes
  and systems that help us make the call that it's safe to run
  without becoming a bottleneck. We're hiring a Technical
  Programme Manager in Security Engineering to own the AISI-
  wide governance mechanism that oversees these safety
  judgements, the controls research teams work under, and
  every edge case and escalation in between. You'll work with
  the team's engineers and the researchers whose work this
  governs.

  What you'll own:

  - AISI-wide Governance Mechanism that oversees safety. Own the
    process, make clear what it approves and how, help people
    work through their requirements proactively, and keep
    decisions well-evidenced and moving.
  - The research/control interface. You'll own how research
    teams meet the security controls that apply to their work,
    and the defined path for handling the exceptions.
  - Programme architecture and delivery. You'll track the team's
    work and spot problems early, with enough visibility to
    stay in control.
  - Cross-government governance engagement. You'll represent
    AISI on governance and risk with partners across
    government, including the Cabinet Office, building the
    relationships, and turning departmental policy into AISI
    process.

  Who we're looking forEssential experience:

  You may be a good fit if you have some of the following
  skills, experience and attitudes:

  - A track record with technical colleagues. You've delivered
    technical programmes somewhere similarly ambiguous. You
    can scope and structure an open-ended goal. Technical
    teams trust you.
  - Comfort at the frontier of AI. You don't have to be an ML
    researcher, but you need to hold your own in constant
    conversation with technical staff about the work, the
    strategy, and the risks. You should have a view on what's
    hard, what's speculative, what's blocked, and what "good"
    looks like.
  - High agency and ownership. You own outcomes, not activity.
  - Strong prioritisation under pressure. You can tell what
    actually matters day to day and quarter to quarter.

  Desirable experience:

  Strong candidates may also have:

  - Experience in security, risk, or GRC. A technical background
    with a genuine interest in security is ideal but not
    required.
  - Fluency in, or appetite for, modern productivity tools
    (coding agents, Linear, Slack) and AI tools as part of
    daily work.

  We encourage you to apply even if you don't meet every point
  above. We care more about what you've broken, and how, than
  about certifications or job titles.

  Selection process

  The interview process may vary from vacancy to vacancy,
  however, you should expect a typical process to include some
  technical proficiency tests, discussions with a cross-
  section of our team at AISI (including non-technical staff)
  and conversations with your team lead. The process will
  culminate in a conversation with members of the senior
  leadership team here at AISI.

  Candidates should expect to go through some or all of the
  following stages once an application has been submitted:

  - Application - CV and a short cover note (max 500 words)
    explaining what draws you to this role and what you would
    bring.

  - Screening interview - Lightweight conversation on
    trajectory, motivation and fit.

  - Work test - A take-home exercise designed to test programme
    management judgement in context. You will receive this
    after the screening interview.

  - Technical interview - Discussion of your work test.

  - Behavioural interview - Deeper dive on stakeholder
    management, prioritisation and team dynamics.

  - Senior leadership interview (30 min) - Final conversation
    with AISI senior leadership.

  Security ClearanceAppointment is conditional on successfully
  completing UK Government SC clearance. Prior clearance is
  not required—we will sponsor and support you. You should
  normally have been resident in the UK for the past 5 years.
  More detail on clearance eligibility can be found on the UK
  Government website: National security vetting: clearance
  levels - GOV.UK.



  What We Offer

  Impact you couldn't have anywhere else

  - Incredibly talented, mission-driven and supportive
    colleagues.

  - Direct influence on how frontier AI is governed and deployed
    globally.

  - Work with the Prime Minister’s AI Advisor and leading AI
    companies.

  - Opportunity to shape the first & best-resourced public-
    interest research team focused on AI security.

  Resources & access

  - Pre-release access to multiple frontier models and ample
    compute.

  - Extensive operational support so you can focus on research
    and ship quickly.

  - Work with experts across national security, policy, AI
    research and adjacent sciences.

  Growth & autonomy

  - If you’re talented and driven, you’ll own important problems
    early.

  - 5 days off and annual stipends for learning and development,
    and funding for conferences and external collaborations.

  - Freedom to pursue research bets without product pressure.

  - Opportunities to publish and collaborate externally.

  Life & family*

  - Modern central London office, or where applicable, option to
    work in similar government offices in Birmingham, Cardiff,
    Darlington, Edinburgh, Salford or Bristol.

  - Hybrid working, flexibility for occasional remote work
    abroad and stipends for work-from-home equipment.

  - At least 25 days’ annual leave, 8 public holidays, extra
    team-wide breaks and 3 days off for volunteering.

  - Generous paid parental leave (36 weeks of UK statutory leave
    shared between parents + 3 extra paid weeks + option for
    additional unpaid time).

  - Excellent pension provision, with a choice between
    Partnership (no employee contributions required and up to
    14.75% employer contributions) or Alpha, a valuable
    defined benefit scheme that provides a guaranteed,
    inflation-linked retirement income for life. Find out what
    benefits a Civil Service Pension provides (opens in a new
    window).

  - Discounts and benefits for cycling to work, donations and
    retail/gyms.

  *These benefits apply to direct employees. Benefits may
  differ for individuals joining through other employment
  arrangements such as secondments.

  Salary

  Annual salary is benchmarked to role scope and relevant
  experience. Most offers land between £65,000 and £145,000
  made up of a base salary plus a technical allowance (take-
  home salary = base + technical allowance).

  This role sits outside of the DDaT pay framework given the
  scope of this role requires in depth technical expertise in
  frontier AI safety, robustness and advanced AI
  architectures.

  The full range of salaries are available below:

  - Level 3: £65,000–£75,000 (Base £40,850 + Technical Allowance
    £24,150–£34,150)
  - Level 4: £85,000–£95,000 (Base £48,540 + Technical Allowance
    £36,460–£46,460)
  - Level 5: £105,000–£115,000 (Base £63,165 + Technical
    Allowance £41,835–£51,835)
  - Level 6: £125,000–£135,000 (Base £76,475 + Technical
    Allowance £48,525–£58,525)
  - Level 7: £145,000 (Base £76,475 + Technical Allowance
    £68,525)

  Additional Information

  Use of AI in Applications

  Artificial Intelligence can be a useful tool to support your
  application, however, all examples and statements provided
  must be truthful, factually accurate and taken directly from
  your own experience. Where plagiarism has been identified
  (presenting the ideas and experiences of others, or
  generated by artificial intelligence, as your own)
  applications may be withdrawn and internal candidates may be
  subject to disciplinary action. Please see our candidate
  guidance for more information on appropriate and
  inappropriate use. Use of AI tools in recruitment We may use
  AI tools to help our hiring team review applications, for
  example by summarising application materials and helping us
  prioritise them against the published criteria. We do not
  use AI tools to find information about you from other
  sources, including online. People make every decision. We do
  not make solely automated decisions about candidates. Find
  out more, including your rights, in our recruitment privacy
  notice: https://www.aisi.gov.uk/careers/privacy-policy.

  Internal Fraud Database

  The Internal Fraud function of the Fraud, Error, Debt and
  Grants Function at the Cabinet Office processes details of
  civil servants who have been dismissed for committing
  internal fraud, or who would have been dismissed had they
  not resigned. The Cabinet Office receives the details from
  participating government organisations of civil servants who
  have been dismissed, or who would have been dismissed had
  they not resigned, for internal fraud. In instances such as
  this, civil servants are then banned for 5 years from
  further employment in the civil service. The Cabinet Office
  then processes this data and discloses a limited dataset
  back to DLUHC as a participating government organisations.
  DLUHC then carry out the pre employment checks so as to
  detect instances where known fraudsters are attempting to
  reapply for roles in the civil service. In this way, the
  policy is ensured and the repetition of internal fraud is
  prevented.  For more information please see - Internal Fraud
  Register.

  SecuritySuccessful candidates must undergo a criminal record
  check and get baseline personnel security standard (BPSS)
  clearance before they can be appointed. Additionally, there
  is a strong preference for eligibility for counter-terrorist
  check (CTC) clearance. Some roles may require higher levels
  of clearance, and we will state this by exception in the job
  advertisement. See our vetting charter here.

  Nationality requirements

  We may be able to offer roles to applicant from any
  nationality or background. As such we encourage you to apply
  even if you do not meet the standard nationality
  requirements (opens in a new window).

  Working for the Civil Service

  The Civil Service Code (opens in a new window) sets out the
  standards of behaviour expected of civil servants. The Civil
  Service embraces diversity and promotes equal opportunities.
  As such, we run a Disability Confident Scheme (DCS) for
  candidates with disabilities who meet the minimum selection
  criteria. The Civil Service also offers a Redeployment
  Interview Scheme to civil servants who are at risk of
  redundancy, and who meet the minimum requirements for the
  advertised vacancy.

  Diversity and Inclusion

  The Civil Service is committed to attract, retain and invest
  in talent wherever it is found. To learn more please see the
  Civil Service People Plan (opens in a new window) and the
  Civil Service Diversity and Inclusion Strategy (opens in a
  new window). As part of the application process, we monitor
  statistics on D&I. You can see how we process this data
  here: Recruitment privacy notice - GOV.UK.
