description: |
  This is a remote position.



      Paradigm is seeking a Senior Software Engineer to
  support our client in the development of high-volume,
  mission-critical web applications. This is a hands-on
  engineering role for an experienced developer who can
  contribute across the full software development lifecycle
  while serving as a technical resource and mentor to other
  members of the development team.










      The ideal candidate brings strong experience with
  TypeScript/JavaScript, Next.js, and SQL, along with
  significant cloud development experience, preferably in
  Microsoft Azure. This position also requires practical
  experience using AI development tools as part of the daily
  software development process, including analysis, design,
  coding, debugging, and related engineering tasks.










   Type: Contract





   Duration: 12-month*





   Pay Rate: $70-$80/hour





   Benefits: Medical, dental, vision, life, 401(k), PTO, and
  sick leave





   Location: Remote – approved U.S. locations





   Job No.: Para_1503










   * Assignment lengths are estimated based on the expected
  workload and scope of work. The assignment may be extended
  or conclude earlier than anticipated based on business
  needs.









   Approved Hiring Locations: Alabama, Arizona, Colorado,
  Connecticut, Delaware, Florida, Georgia, Idaho, Illinois,
  Indiana, Kansas, Kentucky, Louisiana, Maryland,
  Massachusetts, Michigan, Minnesota, Missouri, Nevada, New
  Jersey, New York, North Carolina, Ohio, Oklahoma, Oregon,
  Pennsylvania, South Carolina, Tennessee, Texas, Utah,
  Virginia, Washington DC, and Wisconsin.










  As a Senior Software Engineer, you will:



  - Design, develop, debug, test, and deliver high-volume
    enterprise web applications.
  - Work throughout the Agile Scrum software development
    lifecycle, including requirements analysis, software
    design, prototyping, programming, debugging, testing, and
    implementation.
  - Develop applications using TypeScript/JavaScript, Next.js,
    SQL, and related technologies.
  - Use AI-assisted development tools as part of the daily
    engineering workflow, including analysis, design, coding,
    debugging, and problem-solving.
  - Write and optimize SQL, including stored procedures,
    database design, and performance-related work.
  - Deploy and support applications in cloud environments, with
    an emphasis on Microsoft Azure.
  - Participate in technical design and implementation
    decisions.
  - Identify and proactively raise concerns when requirements or
    specifications could create application quality,
    performance, or architectural issues.
  - Develop multi-tier components for high-volume systems.
  - Troubleshoot complex application and technical issues and
    help drive them through resolution.
  - Collaborate with developers and other technical and business
    teams across the organization.
  - Serve as a technical resource and mentor to fellow software
    engineers.
  - Take a self-directed, proactive approach to solving problems
    and delivering results.


    Requirements

   Our ideal candidate will have:









  - 5+ years of software development experience with JavaScript,
    TypeScript, and/or Node.js.
  - 3+ years of experience developing web applications using
    Next.js.
  - 5+ years of SQL database development experience, including
    stored procedures, database design, and performance
    optimization.
  - 3+ years of experience deploying and running applications in
    cloud environments; Microsoft Azure is strongly preferred.
  - Hands-on experience using AI tools in the software
    development lifecycle, including analysis, design, coding,
    debugging, and related development activities.
  - Experience developing multi-tier components for high-volume
    systems.
  - Strong troubleshooting and technical support skills.
  - Ability to organize competing priorities and deliver high-
    quality work within established deadlines.



   Preferred Qualifications




  - Additional development experience with languages such as C#,
    Java, or Python.
  - Advanced infrastructure experience.
  - Experience using AI agents to chain tasks and create
    automated development workflows.
  - Experience in infrastructure management.
  - Experience with NoSQL database systems.
  - Advanced degree or additional training in a related
    technical field.


    Benefits

      Paradigm offers a competitive benefits package that
  includes medical, dental, vision, life, 401K, PTO, and sick
  days.










   About Us, Paradigm









  Paradigm Information Services is an established staffing
  company that has been connecting talented people with great
  opportunities for more than 25 years. We work with clients
  across a variety of industries and positions, giving our
  recruiting team the opportunity to work on interesting and
  sometimes challenging searches.




  Paradigm Information Services does not discriminate based on
  race, sex, color, religion, age, national origin, marital
  status, disability, veteran status, genetic information,
  sexual orientation, gender identity or any other reason
  prohibited by law in provision of employment opportunities
  and benefits.
