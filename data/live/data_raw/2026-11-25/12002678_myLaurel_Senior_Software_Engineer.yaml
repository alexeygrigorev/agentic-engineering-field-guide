  About myLaurel

  myLaurel was founded on the belief that a meaningful portion
  of hospital care can—and should—be delivered in the comfort
  of home. As a tech-enabled medical group, we provide on-
  demand acute and transitional care to frail, elderly, or
  medically complex patients at home—helping them avoid the
  traditional pathway of ambulance, emergency department,
  hospital admission, and post-acute facility care.

  Health systems, payers, and provider groups partner with
  myLaurel to reduce avoidable utilization, lower readmission
  rates, accelerate throughput, and improve the patient
  experience—all while maintaining the highest standards of
  clinical quality and safety. We stand behind our outcomes by
  putting our fees at risk, demonstrating both accountability
  and confidence in the results we deliver.

  Care is delivered through a physician-led model that
  combines virtual oversight with in-home clinicians, advanced
  technology, diagnostics, and therapies. For high-risk
  populations, myLaurel achieves 33% lower ED utilization, a
  49% absolute reduction in readmissions, and an average of 15
  bed-days saved daily - alongside a Net Promoter Score of 97.

  Recognized for innovation and industry leadership, myLaurel
  has been named to Fast Company's Most Innovative Companies
  and the New York Digital Health 100. The company is
  headquartered in New York City.

