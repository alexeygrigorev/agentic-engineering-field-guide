description: |
  JOB SUMMARY

  As a Senior Software Engineer at Baylor Genetics, you will
  play a pivotal role in designing, developing, and
  maintaining high-quality software solutions. This position
  is REMOTE and requires extensive technical expertise, strong
  problem-solving skills, and the ability to mentor junior
  engineers to deliver scalable and efficient software
  systems.



  Tell me about your experience with dog

  KEY RESPONSIBILITIES

  - Software Development: Lead the design and development of
    software solutions aligned with business   objectives.

  - Technical Leadership: Provide technical guidance and
    mentorship to junior engineers.

  - Code Review: Conduct code reviews and ensure adherence to
    coding standards and best practices.

  - Architectural Design: Contribute to the architectural design
    of software systems.

  QUALIFICATIONS

  Required

  - BS in Computer Science or related field required

  - 7+ years of professional software engineering experience,
    including significant experience in large-scale or complex
    systems



  - Experience in software development, with proficiency in
    programming languages such as JavaScript, C#, etc.

  - Proficiency in relational databases such as SQL Server

  - Proficiency with REST APIs

  - Proficiency in some commonly used frameworks such as .Net,
    React and Angular

  - Proficiency with version control systems and software
    development tools

  - Strong understanding of software development methodologies
    and best practices.

  - Excellent problem-solving and analytical skills.

  - Ability to effectively communicate technical concepts to
    both technical and non-technical stakeholders.



  - Leadership skills with the ability to mentor and guide
    junior team members.

  Preferred:

  - M.S. or higher preferred in Computer Science or related
    field

  - Experience in healthcare, clinical diagnostics, genomics, or
    NGS environments



  COMPETENCIES

  - A strategic technical leader who can define long-term
    architectural direction
  - Strong ownership mindset with the ability to drive
    initiatives from concept to production
  - Exceptional communication skills, capable of translating
    complex technical concepts for diverse audiences
  - A collaborative partner who elevates team performance and
    mentors engineers at all levels
  - Sound judgment balancing innovation, speed, quality, and
    regulatory requirements
  - Passion for building systems that directly support clinical
    decision-making and patient outcomes



