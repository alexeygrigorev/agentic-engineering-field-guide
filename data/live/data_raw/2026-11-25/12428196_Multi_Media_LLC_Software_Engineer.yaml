description: |
  About Multi Media, LLC

  Multi Media, LLC is a global technology company operating a
  high-traffic live-streaming platform used by millions of
  people around the world. Behind the experience is a team
  solving challenging problems in real-time video,
  scalability, reliability, data, machine learning, and user
  experience.

  We’re a place for people who want their work to matter. Our
  teams have the autonomy to make decisions, the opportunity
  to work on problems at meaningful scale, and the ability to
  see their work shape experiences for a global audience in
  real time. We value curiosity, ownership, collaboration, and
  continuous improvement.

  The Role

  We are looking for a frontend-leaning Software Engineer to
  join our Viewer team and help build user-facing features
  that reach millions of people worldwide.

  You'll primarily work with React and JavaScript/TypeScript,
  collaborating closely with product, design, QA, and other
  engineers to deliver meaningful improvements to the user
  experience. We're looking for someone who enjoys solving
  problems beyond writing code, understands the value of the
  features they're building, and is excited to leverage modern
  development tools, including AI, to work more effectively.

  This is a great opportunity for an early-career engineer who
  is eager to grow their technical skills, take ownership of
  their work, and contribute to the broader product
  development process.

  What You’ll Do

  - Design, develop, and maintain user-facing features using
    React, JavaScript/TypeScript, and Python
  - Write clean, maintainable, and well-tested code
  - Collaborate with engineers, product managers, designers, and
    QA to build and improve features
  - Participate in code reviews, debugging, and troubleshooting
  - Contribute to technical discussions and help identify
    solutions to engineering challenges
  - Work with experienced engineers to learn best practices and
    grow your technical skills
  - Take ownership of assigned tasks and see features through
    development, testing, and deployment
  - Help improve the performance, reliability, and overall user
    experience of our platform

  RequirementsYou Have

  - Bachelor's degree in Computer Science or a related field (or
    equivalent practical experience)
  - Foundational experience in web development
  - Experience writing production code in JavaScript/TypeScript
    and/or Python
  - Experience working with React in a professional or
    substantial project setting
  - Familiarity with backend frameworks such as Django, Flask,
    or similar
  - Strong debugging, problem-solving, and critical thinking
    skills
  - Ability to collaborate effectively with cross-functional
    teams, including product, design, and QA
  - Ownership mindset and ability to manage tasks through
    completion with guidance
  - Interest in understanding user needs and the impact of your
    work on the product
  - Curiosity and willingness to learn new technologies,
    including AI-assisted development tools
  - Collaborative, adaptable, and open to feedback

  Bonus Points

  - Experience shipping full-stack features end-to-end
  - Hands-on experience using AI coding assistants to improve
    development workflows
  - Experience working with QA teams, writing tests, or
    improving software quality
  - Experience with AWS or GCP
  - Experience working on high-traffic applications

  BenefitsWhat You’ll Get

  - Fair and competitive base salary
  - Fully Remote Optional
  - Health, Vision, Dental, and Life Insurances for you and any
    dependents, with policy premiums covered by the Company
  - Long & Short term disability insurance
  - Unlimited PTO
  - Annual Year-End Company Closure
  - Optional 401k with 5% matching
  - 12 Paid Holidays
  - Paid Lunches in-office, or if Remote, a $125/week stipend
    via Sharebite
  - EAP and Employee Recognition Programs
  - And much more!

  The base salary range for this position is $130,000 -
  $165,000 annually, plus additional compensation and
  benefits. The range displayed reflects the minimum and
  maximum range for a new hire across the U.S. for the posted
  position. A candidate's specific pay will be determined on a
  case-by-case basis and may vary based on the candidate's
  job-related skills, relevant education, training,
  experience, certifications, and abilities, as well as other
  factors unique to each candidate.

  Multi Media, LLC, is an equal opportunity employer that
  values diversity. We do not discriminate on the basis of
  race, religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.
