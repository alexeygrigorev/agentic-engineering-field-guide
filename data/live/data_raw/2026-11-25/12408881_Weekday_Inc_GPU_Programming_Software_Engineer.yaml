description: |
  This role is for one of Weekday's clients.

  Location: Remote Employment Type: Independent Contractor
  Compensation: USD 50–120 per hour

  About the Role

  We are seeking experienced GPU Programming Software
  Engineers to contribute to an AI training and development
  project focused on GPU architecture, performance
  optimization, and high-performance computing.

  In this role, you will leverage your GPU programming
  expertise to design, develop, test, and optimize GPU-based
  tasks that help train and improve Large Language Models
  (LLMs). You will work with GPU programming technologies such
  as CUDA, WebGPU, and GLSL to build efficient kernels and
  shaders, improve computational performance, and develop
  reliable software solutions.

  This opportunity is ideal for engineers with strong
  programming fundamentals and hands-on experience in GPU
  computing, graphics programming, machine learning
  acceleration, or scientific computing.

  RequirementsKey Responsibilities

  - Design, develop, and optimize GPU-based software solutions
    using CUDA, WebGPU, GLSL, or other relevant GPU
    programming technologies.
  - Create and implement GPU programming tasks and workflows to
    support LLM training and evaluation.
  - Profile, benchmark, and fine-tune GPU kernels and shaders to
    maximize performance and computational efficiency.
  - Identify performance bottlenecks and implement optimization
    techniques for GPU workloads.
  - Develop host-side logic, interfaces, and integrations using
    C++.
  - Evaluate GPU implementations for correctness, scalability,
    and performance.
  - Document technical approaches, implementation details, and
    optimization outcomes.
  - Ensure completed tasks meet defined technical specifications
    and quality standards.

  Required Qualifications

  - Advanced hands-on experience with at least one GPU
    programming language or framework capable of running on
    NVIDIA GPUs.
  - Strong understanding of GPU architecture, parallel
    computing, and performance optimization.
  - Proficiency in C++ and experience developing host-side
    applications or integrations.
  - Ability to design, implement, debug, and optimize GPU-based
    programs.
  - Strong analytical and problem-solving skills.
  - Ability to work independently and deliver high-quality
    technical outputs within project deadlines.

  Preferred Background

  Candidates with experience in one or more of the following
  domains are particularly encouraged to apply:

  - Graphics Programming
  - Machine Learning Acceleration
  - Scientific Computing
  - High-Performance Computing (HPC)
  - GPU Kernel Development
  - Parallel Computing
  - Computer Architecture

  Relevant Technologies

  - CUDA
  - WebGPU
  - GLSL
  - C++
  - NVIDIA GPU Architecture
  - GPU Kernels and Shaders
  - Performance Profiling and Benchmarking
  - Parallel Programming and Optimization

  Compensation Structure

  - Compensation ranges from USD 50–120 per hour.
  - Payment is output-based, with experts compensated for tasks
    that successfully meet the specified project requirements.
  - Task completion time may vary depending on complexity,
    technical expertise, and individual workflow.
  - Minimum submission requirements apply, and contractors are
    expected to complete and submit a minimum number of tasks
    each week.

  Start Timeline & Availability

  - Positions are typically filled within 48 hours.
  - Candidates should be available to begin immediately.
  - Selected candidates are expected to start their first tasks
    within 24–48 hours of completing onboarding.

  Ideal Candidate: A skilled GPU programming engineer with
  advanced knowledge of GPU technologies, strong C++
  proficiency, and practical experience building and
  optimizing high-performance GPU applications. The ideal
  candidate can independently deliver efficient, reliable, and
  technically accurate solutions.
