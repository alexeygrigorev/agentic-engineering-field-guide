description: |
  About Care Access

  Care Access is working to make the future of health better
  for all. With hundreds of research locations, mobile
  clinics, and clinicians across the globe, we bring world-
  class research and health services directly to communities
  that often face barriers to care. We are dedicated to
  ensuring that every person has the opportunity to understand
  their health, access the care they need, and contribute to
  the medical breakthroughs of tomorrow.

  With programs like Future of Medicine, which makes advanced
  health screenings and research opportunities accessible to
  communities worldwide, and Difference Makers, which supports
  local leaders to expand their community health and wellbeing
  efforts, we put people at the heart of medical progress.
  Through partnerships, technology, and perseverance, we are
  reimagining how clinical research and health services reach
  the world. Together, we are building a future of health that
  is better and more accessible for all.

  To learn more about Care Access, visit www.CareAccess.com.

  How This Role Makes a Difference

  As the Senior Manager, Engineering, you are a strong
  technical leader and an exceptional people manager who
  deeply cares about your team and the success of those around
  you. You bring energy and curiosity to your work, quickly
  learning and applying new insights to drive both technical
  excellence and team growth. With a servant-leadership
  approach, you wake up every day focused on improving the
  experiences of your team and the organization. You excel as
  a collaborator, are an impeccable communicator, and inspire
  confidence by combining technical vision with thoughtful,
  people-first leadership.

  How You'll Make An Impact

  - Coding:
    - Review and provide technical guidance on software design,
      architecture, and code quality to ensure engineers
      follow best practices and make sound design decisions.
    - Contribute hands-on coding when needed, while leading
      technical reviews, mentoring engineers, and driving high
      standards for maintainability, scalability, and
      performance.
  - Technical Delivery & Process Excellence:
    - Lead a constantly improving agile engineering process.
    - Have a strong sense of ownership for your deliverables and
      milestones.
    - Drive and review technical designs, ensuring solutions are
      scalable, reliable, secure, and aligned with long-term
      platform goals.
  - Team Leadership:
    - Help product feature teams to accelerate product feature
      development by building capabilities that simplify
      OneStudyTeam architecture and by reducing technical
      debt.
    - Ensure the team delivers consistently and predictably
      through effective planning, prioritization, and
      stakeholder communication.
    - Manage, mentor, and grow a team of up to 5 software
      engineers, fostering a culture of ownership,
      collaboration, and continuous improvement.
  - Other Responsibilities:
    - Recruit and hire engineers consistent with organizational
      values.
    - Experience with our stack is not required. We use: ReactJS,
      Javascript, Typescript, Clojure, AWS, Postgres, Kafka,
      Terraform, Kubernetes, Docker and Git.

  The Expertise Required

  - Preferred but not required: ability to use ReactJS,
    Javascript, Typescript, Clojure, AWS, Postgres, Kafka,
    Terraform, Kubernetes, Docker and Git.
  - Passionate about improving developer experience and
    developer velocity.
  - Extensive experience leading engineering teams and driving
    complex technical initiatives, with a track record of
    making high-impact architectural and design decisions.
  - As a former engineer, you can hold your own in technical
    conversations.
  - Analytical thinkers who can navigate ambiguity, break down
    complex problems, and guide the team toward practical,
    effective solutions.

  Certifications/Licenses, Education, and Experience

  - Minimum Education:
    - Bachelor’s degree in a relevant field.
  - Minimum Experience:
    - 6-8 years of experience
    - Experience with the strengths (and pitfalls) of using LLMs
      to build software.
    - Experience working remotely. The engineering team is a
      distributed one with remote-first processes.
    - Extensive experience leading engineering teams and driving
      complex technical initiatives, with a track record of
      making high-impact architectural and design decisions.
    - Experience or strong interest in healthcare products.

  How We Work Together

  - Location: Remote within the United States. This role
    requires 100% of work to be performed in a remote office
    environment.
  - Travel: This is a remote position with less than 10% travel
    requirements. Occasional planned travel may be required as
    part of the role.
  - Physical demands associated with this position Include: The
    ability to use keyboards and other computer equipment.

  The expected pay range for this role is $170,000 - $220,000
  USD per year for full time team members.

  Benefits & Perks (US Full Time Employees)

  - Paid Time Off (PTO) and Company Paid Holidays
  - 100% Employer paid medical, dental, and vision insurance
    plan options
  - Health Savings Account and Flexible Spending Accounts
  - Bi-weekly HSA employer contribution
  - Company paid Short-Term Disability and Long-Term Disability
  - 401(k) Retirement Plan, with Company Match



