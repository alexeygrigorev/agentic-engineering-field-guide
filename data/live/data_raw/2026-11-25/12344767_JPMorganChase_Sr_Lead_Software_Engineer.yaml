description: |
  Senior Lead Software Engineer in Data Platforms within the
  Chief Data and Analytics Office, you will lead a squad of
  engineers focused on enhancing the firmwide data catalogue
  system, Fusion. You will help teams across the globe access
  data efficiently, applying your technical expertise and
  engineering mindset to deliver secure, scalable solutions.
  You’ll be second in command within a wider team of 40,
  taking a high degree of ownership and responsibility. Your
  role will foster innovation, collaboration, and continuous
  improvement, positioning you for advancement to Executive
  Director.

  Job responsibilities



  - Lead a squad of engineers, providing technical guidance and
    fostering a collaborative team environment
  - Drive the development and enhancement of the firmwide data
    catalogue system (Fusion) to enable global data access
  - Apply strong problem-solving skills and an engineering firm
    mindset to deliver secure, high-quality solutions
  - Take ownership of technical decisions, influencing product
    design and application functionality
  - Serve as a subject matter expert in data platforms and
    related technologies
  - Advocate for and implement firmwide frameworks, tools, and
    practices within the Software Development Life Cycle
  - Promote adoption and governance of approved AI-assisted
    engineering practices to improve code quality and delivery
    speed
  - Encourage diversity, inclusion, and respect within the team
    culture
  - Apply knowledge of automation tools and AI-assisted
    development capabilities to maximize value at scale
  - Collaborate with stakeholders to deliver solutions aligned
    to business needs
  - Support operational stability and continuous improvement
    across the platform

  Required qualifications, capabilities, and skills

  - Experience leading technical teams and managing stakeholders
    to deliver high-quality solutions
  - Hands-on expertise in system design, application
    development, testing, and operational stability
  - Advanced proficiency in one or more programming languages
    and technical disciplines (cloud, AI, ML, etc.)
  - Ability to tackle design and functionality challenges
    independently
  - Demonstrated experience with enterprise-authorized AI-
    assisted software development tools
  - Strong understanding of responsible AI use, including data
    sensitivity and secure handling
  - An Understanding or knowledge of data modelling concepts
  - High degree of ownership and accountability in technical
    leadership
  - Excellent problem-solving skills and engineering mindset

  Preferred Qualifications, Capabilities, and Skills:

  - Experience working with global data platforms or catalogue
    systems
  - Familiarity with Fusion or similar data catalogue
    technologies
  - Ambition to progress to Executive Director
  - Internal experience within JPMorgan Chase is advantageous
  - Experience running squads in agile environments
  - Ability to coach and mentor engineers on compliant AI usage
  - Exposure to large, diverse engineering team

