  Senior Software Engineer, Full Stack, Government
  ProductsJoin us in building the future of finance.

  Our mission is to democratize finance for all. An estimated
  $124 trillion of assets will be inherited by younger
  generations in the next two decades. The largest transfer of
  wealth in human history. If you're ready to be at the
  epicenter of this historic cultural and financial shift,
  keep reading.

  About the Team & Role

  We are building an elite team, applying frontier
  technologies to the world's biggest financial problems.
  We're looking for bold thinkers. Sharp problem-solvers.
  Builders who are wired to make an impact. Robinhood isn't a
  place for complacency, it's where ambitious people do the
  best work of their careers. We're a high-performing, fast-
  moving team with ethics at the center of everything we do.
  Expectations are high, and so are the rewards.

  The Government Products team focuses on building and scaling
  systems that support long-term investing and account
  management for millions of customers. This team works
  closely with product, data, and infrastructure partners to
  deliver reliable, secure, and intuitive experiences. You
  will help shape systems that enable customers to plan for
  their financial future with confidence!

  As a Senior Software Engineer, Full Stack, you will serve as
  a key technical contributor for this 0-to-1 initiative. You
  will be responsible for designing and building the features,
  services, and cross-functional integrations that span our Go
  backend and React web experience, working securely with
  external institutional partners. This is a high-visibility,
  high-impact role where you will directly shape a platform
  built to serve millions of future customers

  This role is based in our New York, NY and Menlo Park, CA
  offices, with in-person attendance expected 3 days per week.

  At Robinhood, we believe in the power of in-person work to
  accelerate progress, spark innovation, and strengthen
  community. Our office experience is intentional, energizing,
  and designed to fully support high-performing teams.

  What You'll Do

  - Design, build, and ship features across Go backend services
    and React-based front-end experiences for a brand-new,
    standalone product optimized for security, reliability,
    and scale.
  - Contribute to the architectural strategy and technical
    decisions of a 0-to-1 platform, setting foundational
    engineering patterns built to last.
  - Partner closely with Product, Design, and external
    stakeholders to translate complex requirements into
    secure, well-tested, and maintainable systems.
  - Move fluidly between backend and front-end work as
    priorities shift, helping the team stay flexible and
    deliver quickly.
  - Mentor engineers through design discussions and code
    reviews, fostering technical excellence and raising the
    engineering bar for the team.

  What You Bring

  - 5+ years experience building and maintaining production
    backend services, ideally in Go or Ruby, with a solid
    grasp of API design, domain modeling, and reliable data
    flows.
  - Strong experience building front-end applications with
    JavaScript frameworks such as React, with comfort working
    in Node and backend-for-frontend architectures.
  - Demonstrable execution in a zero-to-one product space,
    navigating technical ambiguity, making sound technical
    decisions, and taking features from design through
    production.
  - A track record of guiding the work of other engineers
    through design reviews, code reviews, and mentorship.
  - Excellent communication skills with the ability to partner
    closely with Product, Design, and external institutional
    partners.
  - Experience with financial products, ledgering, reporting, or
    investment technology is a plus.

  What we offer

  - Challenging, high-impact work to grow your career
  - Performance driven compensation with multipliers for
    outsized impact, bonus programs, equity ownership, and
    401(k) matching
  - Best in class benefits to fuel your work, including 100%
    paid health insurance for employees with 90% coverage for
    dependents
  - Lifestyle wallet - a highly flexible benefits spending
    account for wellness, learning, and more
  - Employer-paid life & disability insurance, fertility
    benefits, and mental health benefits
  - Time off to recharge including company holidays, paid time
    off, sick time, parental leave, and more!
  - Exceptional office experience with catered meals, events,
    and comfortable workspaces.

  Position Restriction: This position is restricted to US
  citizens or lawful permanent residents

  In addition to the base pay range listed below, this role is
  also eligible for bonus opportunities + equity + benefits.

  Base pay for the successful applicant will depend on a
  variety of job-related factors, which may include education,
  training, experience, location, business needs, or market
  demands. The expected base pay range for this role is based
  on the location where the work will be performed and is
  aligned to one of 3 compensation zones. For other locations
  not listed, compensation can be discussed with your
  recruiter during the interview process.

  Base Pay Range:

  Zone 1 (Menlo Park, CA; New York, NY; Bellevue, WA;
  Washington, DC)

  $196,000—$230,000 USD

  Zone 2 (Denver, CO; Westlake, TX; Chicago, IL)

  $172,000—$202,000 USD

  Zone 3 (Lake Mary, FL; Clearwater, FL; Gainesville, FL)

  $153,000—$179,000 USD

  Click here to learn more about our Total Rewards, which vary
  by region and entity.

