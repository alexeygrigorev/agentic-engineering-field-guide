description: |
  Join the People Helping People

  Velera is the nation’s premier payments credit union service
  organization (CUSO) and an integrated fintech solutions
  provider. The company serves more than 4,000 financial
  institutions throughout North America, operating with
  velocity to help our clients keep pace with the rapid
  momentum of change and fuel growth in the new era of
  financial services. Our purpose: We accelerate partners’
  success through innovative financial technology solutions
  and inspired service.

  The Opportunity

  This position will excel in designing, developing, testing,
  maintaining, and supporting secure, scalable, and robust
  .Net applications. The candidate will possess a deep
  understanding of technical issues, adept troubleshooting
  skills, and the ability to propose and implement
  enhancements. This role entails collaborating on the
  development of enterprise solutions.

  The incumbent for this position will need an intermediate to
  advanced development level skillset allowing them to
  understand complex technologies, systems, standards, and
  best practices. The incumbent will exhibit a skilled
  perspective when identifying and delivering effective
  solutions, capable of working independently with minimal
  supervision.

  Day in the Life

  - Work in a fast-paced Agile/Scrum environment in which the
    role would:
    - Develop basic to complex C# code & designs to maintain new
      and existing technology systems following company
      standards.
    - Accountable to develop and deliver technical documentation.
    - Undergo peer code and design reviews to ensure stable and
      high-quality production-ready code.
  - Build and maintain .Net applications that meet or exceed
    industry regulatory requirements.
  - Foster and maintain high collaboration with team members,
    other technical colleagues, and business partners from
    across the organization.
  - Ensure compliance with established SDLC frameworks,
    including requirements gathering, analysis, design,
    development, testing, release management, and deployment.
  - Ability to gradually take on more development tasks as
    learning increases.
  - Exercise discretion and good judgment in making decisions.
  - Lead a team with meeting project commitments, such as
    project goals, objectives, and corresponding delivery
    dates.
  - Provide engineering leadership and mentorship to junior
    level engineers.
  - Ensure compliance with all the audit and security
    requirements of the company.
  - Review code for complex maintainability, coding standards
    and security issues.
  - Participate and follow established agile standards
    (including attending all Agile events) to create a
    collaborative and efficient development environment and
    meet project goals and delivery dates.
  - Foster innovation to improve on existing challenges and to
    realize new opportunities.
  - Effectively collaborate with Architects to develop and
    review intended solutions.
  - Ability to travel as needed to perform position
    responsibilities.
  - Availability to be on-call as needed
  - Perform other duties as assigned.

  Qualifications:

  - Bachelor's degree in Computer Science, Management
    Information Systems, related technology field, or
    equivalent combination of education and experience.
  - Seven years professional work experience in software
    development required.
  - Two years of experience performing as a subject matter
    expert.
  - Proficiency as a .Net full-stack engineer with knowledge in
    two or more modern programming languages.
  - Years of experience may be offset by having proficiency in
    one or more highly specialized technologies or skills.
  - Proficiency of computer engineering fundamentals in object-
    oriented design, data structures, and algorithms.
  - Ability to modify existing code and write complex scripts
    according to standards and best practices.
  - Thorough understanding of databases, including creation of
    basic to complex database SQL statements.
  - Advanced technical skills and knowledge in API development
  - Full stack development: front-end, back-end, and data
    development and architecture.
  - Leading and authoring of technical specifications and
    detailed designs.
  - Demonstrate advanced knowledge of coding standards and apply
    them.

