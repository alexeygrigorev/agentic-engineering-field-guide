  About Velera

  At Velera, inclusion isn’t an initiative – it’s how we work.
  Guided by a people‑helping‑people philosophy, we cultivate a
  culture where every employee feels valued, respected and
  empowered to do their best work. We’re committed to building
  a diverse workforce and fostering meaningful connection
  across our teams. Through a remote‑first, flexible
  environment, we prioritize psychological safety, wellbeing
  and belonging so individuals and teams can collaborate to
  thrive. Together, we’re shaping a new era of secure,
  innovative solutions for the clients and communities we
  serve. Learn more about what it’s like to work at Velera.

  Pay Equity

  $95,800.00 - $124,500.00 - $153,200.00 of salary range

