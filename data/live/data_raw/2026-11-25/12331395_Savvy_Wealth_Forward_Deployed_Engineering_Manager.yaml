description: |
  About Savvy Wealth:

  Wealth management is a $545 billion industry that still runs
  on manual work. 75% of advisors offer no digital
  communication beyond email, and most still build financial
  plans by hand in Excel. Savvy is reinventing what it looks
  like to be a financial advisor. Founder Ritik Malhotra saw
  the fragmentation firsthand after seeking out his own
  advisor, and started Savvy to give independent advisors a
  modern, AI-native home.

  Savvy is a registered investment advisor (RIA), and we
  partner with experienced financial advisors who want to grow
  without running the back office themselves. Advisors bring
  their book and join Savvy, running under their own brand (or
  ours), and Savvy earns a percentage of the assets they
  manage. In return, they get a true business-in-a-box: a
  proprietary tech platform and client portal, an in-house
  marketing team that helps them grow, a world-class
  investment management team, and a dedicated client services
  team that runs day-to-day operations and support. Advisors
  at Savvy service up to 50% more households and save 19 hours
  a week.

  AI runs through everything we do. On the product side, Savvy
  Intelligence (released April 2026) is the only AI built for
  wealth managers that can see a client's complete financial
  picture. Internally, everyone at Savvy uses Claude and is
  encouraged to experiment with it, backed by a dedicated AI
  enablement team and a RevOps org building agents in-house.

  The trajectory is steep and it's still early. We're a Series
  C company with 170+ people, $200M raised, and $100M ARR in
  sight this year. Inc. ranked us the No. 1 fastest-growing
  financial services company in America in 2026. Come build
  the next stage with us!

  Recognition:

  We're a Certified Great Place to Work and have been honored
  for our culture and our growth:

  - Newsweek's America's Greatest Startup Workplaces (2026)
  - Fortune Best Workplaces in New York™ (2026)
  - Great Place to Work Certified™

  The Role:

  As our Forward Deployed Engineering Manager, you'll build
  and run Savvy's deployment bench: a team of forward deployed
  engineers who go into the firms and advisor teams we partner
  with and make Savvy work inside their world.

  You'll lead a bench of engineers with different strengths,
  from moving large datasets with AI to building integrations
  using Savvy’s harness to solving deep technical problems
  that only a single customer has. As new customers come on,
  you'll match the right people to the work, keep deployments
  moving, and make sure what we deliver holds up. You'll be a
  hands-on leader who grows engineers quickly and sets the
  standard for how we show up for customers.

  Because this is a new function, you'll also help shape how
  it runs: how the team is structured, how work gets staffed,
  and how we handle the moments when something goes wrong.

  This role is part engineering manager and part solutions
  engineering manager. It's different from our product EM
  roles: your success is measured by how quickly and reliably
  customers get value from Savvy, and by the strength of the
  bench you build.

  All of this is only possible at scale with intense use of AI
  through your own work, and by extension, the team you build.

  How you'll make an impact:

  - Build the bench
    - Hire and develop an early-career-leaning team of forward
      deployed engineers with complementary strengths.
    - Coach scrappy, curious engineers through stretch
      assignments, direct feedback, and a high bar for
      technical and customer excellence.
  - Deploy the bench
    - Partner with Forward Deployed PMs on customer intake, then
      staff each engagement with the right engineers.
    - Own delivery across concurrent deployments, staying hands-on
      enough to review code and debug the hard problems.
  - Own escalations
    - Build the guardrails (testing, reviews, approval checks)
      that keep customer data and accounts safe.
  - Scale the function
    - Build the playbooks, templates, and tooling that make each
      deployment faster than the last.
    - Feed field learnings back to Product and Engineering so
      repeated customer needs become product capabilities.

  Must Have:

  - You have 6+ years of experience in software engineering,
    solutions or sales engineering, or technical consulting
    (including meaningful customer-facing delivery work)
  - You have 2+ years managing or leading engineers, with a
    track record of hiring, developing, and retaining a strong
    team.
  - You use AI coding tools (e.g. Claude Code, Cursor) day to
    day and are excited to build a team that does the same;
    bonus if you’ve built your own software factory.
  - You've been a strong IC in this kind of work yourself, such
    as an FDE, solutions engineer, implementation engineer, or
    customer-facing product engineer, and you can still go
    deep technically.
  - You've owned end-to-end delivery across several customer
    engagements at once.
  - You have hands-on experience with data migrations and system
    integrations (AI now writes all of this, but you need to
    be familiar with the concepts).
  - You stay calm under pressure, own mistakes openly, and
    communicate clearly with everyone from junior engineers to
    frustrated customer stakeholders.
  - You thrive in ambiguity and have helped build a team,
    process, or function that didn't exist before.

  Nice to Have:

  - Experience in fintech, wealth management, or another
    regulated, high-trust industry, such as custodial
    integrations, account transfers, or financial data.
  - Experience building playbooks, internal tooling, or
    onboarding systems that outlasted your time on the team.
  - Experience at a high-growth startup.

  Benefits:

  - Competitive salary and equity package
  - We offer a generous relocation package to help top talent
    make the move to our NYC office
  - Unlimited PTO + paid company holidays
  - Access to holistic medical, dental, and vision plans
  - Company 401(k) (including Mega backdoor Roth options),
    Commuter, and HSA/FSA plans
  - NYC office in Union Square
  - Lunch and snacks provided in the office, & dinner if you
    stay late
  - Access to virtual mental health care (Spring Health) and
    health concierge (Rightway) to help you find the right
    care
  - Access to counseling for stress management, dependent care,
    nutrition, fitness, legal, and financial issues (Guardian
    WorkLifeMatters EAP)
  - Benefits are available to full-time employees
