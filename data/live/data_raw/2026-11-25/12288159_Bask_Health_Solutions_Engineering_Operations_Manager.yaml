description: |
  About Bask Health

  Bask Health is a telehealth technology platform that helps
  entrepreneurs, healthcare businesses, and brands launch,
  manage, and grow their own telehealth businesses.

  Our platform brings together storefronts, patient
  experiences, clinical workflows, pharmacy operations, and
  business management tools in one place.

  We help businesses operate their own healthcare brands
  without having to build all the technology and operational
  infrastructure themselves.

  We're a fast-moving team that values initiative, ownership,
  and clear communication. Our teams collaborate across Sales,
  Customer Success, Finance, Product, Engineering, and
  Operations to improve how our platform works and support the
  businesses that rely on it.

  About the Role

  We're looking for a Solutions Engineering Operations Manager
  to help Bask Health improve how our Solutions Engineering
  team plans, coordinates, and delivers technical support for
  merchant opportunities.

  You'll work closely with Solutions Engineering leadership,
  Sales, Customer Success, Product, and Engineering to develop
  operational processes that make technical engagements more
  organized, efficient, and measurable.

  This role focuses on the systems and workflows behind
  Solutions Engineering. You'll help manage capacity planning,
  resource assignments, engagement tracking, and performance
  reporting so technical specialists can focus on solving
  merchant problems.

  You'll also identify recurring operational challenges,
  improve coordination between teams, and build processes that
  support consistent technical engagement delivery as Bask
  grows.

  We're looking for someone who understands technical
  customer-facing operations, enjoys improving systems, and
  can bring structure to complex workflows without creating
  unnecessary administrative work.

  What You'll Do

  - Own and improve operational processes supporting Bask's
    Solutions Engineering function.
  - Develop consistent workflows for Solutions Engineering
    engagement requests, assignments, and tracking.
  - Partner with Solutions Engineering leadership to understand
    team capacity and resource availability.
  - Build capacity planning models based on active engagements,
    upcoming opportunities, and expected demand.
  - Coordinate resource allocation processes for Solutions
    Engineering engagements.
  - Establish clear criteria for prioritizing incoming technical
    requests.
  - Support assignment decisions based on technical
    requirements, business priorities, and available
    resources.
  - Maintain visibility into active Solutions Engineering
    engagements and outstanding commitments.
  - Develop standardized intake procedures for technical
    presales requests.
  - Improve handoffs between Sales and Solutions Engineering.
  - Help ensure technical specialists receive complete
    requirements and merchant context before beginning an
    engagement.
  - Establish consistent engagement stages, ownership
    expectations, and tracking procedures.
  - Support operational planning for technical discovery
    sessions, product demonstrations, and solution design
    activities.
  - Coordinate with Sales leadership to anticipate technical
    resource needs across the pipeline.
  - Partner with Customer Success to support transitions from
    presales technical discussions to post-sale activities.
  - Work with Product and Engineering when technical engagements
    require additional expertise or development coordination.
  - Develop dashboards and recurring reports on Solutions
    Engineering activity and performance.
  - Track engagement volume, workload distribution, resource
    utilization, and delivery timelines.
  - Identify operational bottlenecks affecting technical
    engagement turnaround times.
  - Analyze historical engagement data to understand demand
    patterns and resource requirements.
  - Develop consistent methods for measuring Solutions
    Engineering operational performance.
  - Support recurring operational reviews with Solutions
    Engineering and commercial leadership.
  - Recommend improvements to assignment processes, engagement
    workflows, and resource planning.
  - Identify opportunities to reduce manual tracking and
    administrative work.
  - Improve documentation of technical engagement requirements,
    status, and outcomes.
  - Develop templates and operating procedures for common
    Solutions Engineering activities.
  - Help establish escalation procedures for urgent or complex
    technical engagement requests.
  - Coordinate cross-functional resolution of operational issues
    affecting technical delivery.
  - Partner with Revenue Operations to improve the accuracy of
    technical engagement information in CRM systems.
  - Support improvements to project management and technical
    engagement tracking tools.
  - Identify opportunities to automate request intake,
    assignment notifications, and reporting workflows.
  - Monitor adoption of new operational processes and gather
    feedback from technical teams.
  - Prepare operational recommendations for improving Solutions
    Engineering efficiency.
  - Support planning for new commercial initiatives that require
    Solutions Engineering involvement.
  - Help leadership understand capacity constraints and the
    operational impact of increasing demand.
  - Support onboarding and process documentation for new
    Solutions Engineering team members.
  - Maintain clear communication with stakeholders regarding
    resource availability and engagement priorities.
  - Support continuous improvements to Bask's Solutions
    Engineering operating model.

  Requirements

  - 5+ years of experience in Solutions Engineering Operations,
    Technical Operations, Field Engineering Operations,
    Resource Management, Business Operations, or a related
    field.
  - Experience supporting Solutions Engineering, Sales
    Engineering, or other customer-facing technical teams.
  - Strong understanding of technical presales engagement
    processes.
  - Experience developing and managing operational workflows for
    technical teams.
  - Experience with resource allocation, workload management, or
    capacity planning.
  - Ability to coordinate operational processes across Sales,
    Solutions Engineering, Product, and Engineering.
  - Experience developing operational performance metrics and
    reporting.
  - Strong analytical and problem-solving skills.
  - Advanced spreadsheet skills, including capacity models,
    workload analysis, and operational reporting.
  - Experience using CRM, project management, or resource
    planning tools.
  - Ability to identify operational bottlenecks and implement
    process improvements.
  - Strong project management and organizational skills.
  - Experience documenting processes and developing standard
    operating procedures.
  - Ability to manage multiple competing priorities and
    operational requests.
  - Strong written and verbal communication skills.
  - Ability to communicate effectively with technical and
    nontechnical stakeholders.
  - Experience building dashboards or recurring operational
    reports.
  - Excellent attention to detail and commitment to accurate
    tracking.
  - Ability to coordinate cross-functional projects and drive
    process adoption.
  - Comfortable taking ownership of operational systems and
    improvements.
  - Ability to work independently in a fast-moving environment.
  - Availability to collaborate during U.S. Eastern Time
    business hours.

  Nice to Have

  - Experience managing operations for a Solutions Engineering
    team at a SaaS company.
  - Familiarity with Sales Engineering or technical presales
    organizations.
  - Experience supporting Customer Solutions Engineering or
    Forward Deployed Engineering teams.
  - Experience coordinating technical discovery, product
    demonstrations, and solution design engagements.
  - Experience with technical resource forecasting and
    utilization reporting.
  - Familiarity with API integrations and SaaS implementation
    workflows.
  - Experience using Salesforce, HubSpot, or similar CRM
    systems.
  - Experience using Jira, Linear, Asana, or similar project
    management tools.
  - Experience with resource planning or professional services
    automation platforms.
  - Experience using SQL for operational analysis.
  - Experience with Looker, Tableau, Power BI, or similar
    reporting tools.
  - Familiarity with e-commerce platforms or merchant
    technology.
  - Experience coordinating technical engagements for enterprise
    or mid-market customers.
  - Experience improving presales-to-post-sales technical
    handoffs.
  - Familiarity with telehealth or healthcare technology.
  - Experience building operational processes in a growing SaaS
    company.
