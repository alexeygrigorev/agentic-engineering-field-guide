description: |
  Principal Software Engineer - Cloud/DevOps Engineer 24337

  Location: United Kingdom (Hybrid - Winchester or London
  office 1-2 times a week)

  What’s in it for you

  - Salary 57,400 to 83,500 dependent on experience
  - Bonus - 10%
  - 6% pension contribution
  - Private Medical Insurance
  - 25 days annual leave
  - Access to flexible benefits including discounts on major
    brands, wellness programmes, gymflex, travel and dental
    insurance
  - A flexible and hybrid working culture

  Overview

  AWS will be your primary technical focus as a Principal
  Cloud/DevOps Engineer, drawing on your expertise as a
  leading technical SME in AWS and Cloud/DevOps Engineering.

  You will work across multiple teams and domains, providing
  deep technical expertise, solving complex engineering
  problems and defining and evolving the engineering
  standards, technical practices and reference patterns used
  by other engineers.

  You will remain closely connected to practical engineering
  and production operations, ensuring technical direction is
  grounded in real engineering challenges. You will provide
  architectural leadership as part of this wider technical
  responsibility while contributing expertise to broader
  organisational strategy.

  You will also be an SME for the practical application of AI-
  assisted and agentic engineering within Cloud/DevOps,
  helping establish effective and secure patterns for GitHub
  Copilot, Kiro, coding agents and MCP integrations.

  Accountabilities

  - Provide hands-on AWS and Cloud/DevOps SME leadership across
    teams and domains, resolving complex problems and
    mentoring Senior Engineers.
  - Define standards and reference patterns; provide technical
    assurance and identify systemic risks, debt and capability
    gaps.
  - Evaluate technologies and contribute to Cloud/DevOps
    strategy, with architecture forming part of wider SME
    responsibilities.
  - Define AWS patterns across networking, security, identity,
    compute, storage, databases, containers, serverless and
    integration.
  - Develop multi-account governance, IAM, SCP, KMS and
    centralised logging approaches.
  - Define hybrid connectivity patterns using Transit Gateway,
    Direct Connect, VPN and PrivateLink.
  - Establish reusable Terraform modules, Infrastructure as
    Code, CI/CD and automated governance patterns.
  - Align with Architecture, Security and Network standards;
    escalate organisation-wide decisions appropriately.
  - Define DevSecOps, production-readiness, operational
    ownership, observability and resilience practices; lead
    complex incidents and improve disaster recovery and AWS
    cost efficiency using operational lessons and FinOps
    insights.

  AI-assisted and Agentic Engineering

  - Guide Senior Engineers and define Cloud/DevOps patterns for
    GitHub Copilot, Kiro, coding agents, MCP integrations and
    equivalent tools.
  - Govern agent access to AWS and engineering tools through
    permissions, auditability, guardrails and human approval.
  - Identify valuable opportunities for automation, AI
    assistance and agentic execution, evaluating emerging
    capabilities against engineering value, security and
    operational risk.

  Required Technical Skills

  - Expert AWS engineering, including networking, IAM, security,
    Organisations, multi-account governance and hybrid
    connectivity.
  - Expert Terraform, Infrastructure as Code and automation;
    strong engineering-grounded architecture and reusable
    pattern design.
  - Strong Platform Engineering, SRE, DevSecOps and secure
    supply-chain expertise.
  - Expert troubleshooting; strong observability, resilience,
    disaster recovery, operations and AWS cost optimisation
    knowledge.
  - Strong AI-assisted and agentic engineering knowledge,
    including MCP, permissions, integrations and human
    oversight; sufficient GCP knowledge for multi-cloud input.

  Other Key Skills

  - Technical credibility, continuous learning and strong
    mentoring of Senior Engineers.
  - Sound judgement balancing quality, security, reliability,
    cost and delivery; ability to recognise strategic and
    architectural escalation needs.
  - Clear technical communication and influence without line-
    management authority across Engineering, Architecture,
    Security, Networks, Service Management and senior
    stakeholders.

  Qualifications

  - Degree in Computer Science, Engineering or a related
    discipline, or equivalent extensive industry experience.
  - AWS Professional-level, Terraform, Kubernetes, networking,
    security or related certifications are highly desirable,
    but expert demonstrable experience is equally valued.
  - GCP or AI-related professional qualifications are beneficial
    where relevant.

  Why Arqiva:

  We enable a switched-on world to flow. As the UK’s leader in
  TV and radio broadcast and the country’s top smart utilities
  platform, we are shaping the future of connectivity.

  Our infrastructure delivers media and data exactly where
  they’re needed - whether that’s bringing TV and radio to
  your home or sending smart meter data to your utility
  provider. Our technology works quietly behind the scenes,
  connecting millions every day.

  But it’s not just what we do, it’s how we do it. At Arqiva,
  you’ll find real connection: supportive teams, active
  colleague networks and plenty of ways to get involved and
  feel part of our community. We’ll give you the space and
  support to grow - whether that’s developing your skills,
  trying something new or taking on fresh challenges. And
  because there is more to life than work, our rewards and
  benefits are designed to support your wellbeing, your
  lifestyle and what matters most to you.

  Our commitment to Diversity & Inclusion

  At Arqiva, we’re committed to building a workplace where
  everyone feels valued, heard and empowered to succeed. We
  welcome applications from all backgrounds and experiences,
  and we work hard to remove barriers so every colleague can
  thrive. If you need any adjustments at any stage of the
  recruitment process, please reach out to talent@arqiva.com.

  If this sounds like the right next step for you, we’d love
  to hear from you!
