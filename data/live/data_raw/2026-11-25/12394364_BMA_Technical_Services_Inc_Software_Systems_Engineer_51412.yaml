description: |
  BBMA is seeking a Software Systems Engineer to support work
  on the DLA JAMMEX Program. This is a fully remote role.



  Job Summary

  Formulates/defines specifications for complex operating
  software programming applications or  modifies/maintains
  complex existing applications using engineering releases and
  utilities from the manufacturer. Designs, codes, tests,
  debugs, and documents those programs. Provides overall
  operating system maintenance, such as sophisticated file
  maintenance routines, large telecommunications networks,
  computer accounting, and advanced mathematical/scientific
  software packages. Assists all phases of software systems
  programming applications. Evaluates new and existing
  software products.

  Clearance Requirements

  Must posses an IT-II Security clearance or have a current
  National Agency Check (NACLC).

  Required Skills & Certifications

  • Must possess IT-II security clearance or have a current
  National Agency Check with Local  Agency Check and Credit
  Check (NACLC) at time of proposal submission. • Relevant
  certification from a nationally recognized technical
  authority. • DoD Approved 8570 Baseline Certification:
  Category IAT Level I • Okta Certified Professional or
  equivalent SSO certification


  Overview

  BMA is an employee-owned small business headquartered in
  Huntsville, AL that provides superior customer service by
  empowering all levels of our staff to make timely decisions
  to produce high-quality results. BMA fosters an environment
  of passion, precision, and dedication in order to fulfill
  our commitments to our partners, government, and country.

  Benefits

  We believe that our employees well-being is paramount to our
  success so our benefits package has been crafted with that
  in mind. We offer multiple healthcare coverage options to
  include low deductible, high deductible, and plans eligible
  for our Health Savings Account (HSA) option. Along with
  medical coverage, employees have dental, vision, accident &
  illness, short- and long-term disability all available to
  them. BMA proudly maintains a 401(k) plan with an industry
  leading 6% match that can include profit sharing based on
  company performance. Lastly, being an employee-owned company
  means that BMA offers a 100% Employee Stock Ownership Plan
  (ESOP), providing eligible employees the opportunity to earn
  stock in BMA, subject to plan eligibility and vesting
  requirements.

  AAP & EEO Statement BMA is an Equal opportunity/Affirmative
  Action Employer. All qualified applicants will receive
  consideration for employment without regards to race, color,
  religion, religious creed, gender, sexual orientation,
  gender identity, gender expression, transgender, pregnancy,
  marital status, national origin, ancestry, citizenship
  status, age, disability, protected Veteran Status, genetics
  or any other characteristics protected by applicable
  Federal, State, or Local Law.
