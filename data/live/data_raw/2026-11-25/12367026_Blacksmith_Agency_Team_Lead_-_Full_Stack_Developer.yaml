description: |
  Join the Blacksmith Team!

  Blacksmith is seeking a Team Lead - Full Stack Developer who
  is motivated to spearhead the development of unique, custom
  WordPress themes and plugins for our clients without leaving
  behind backend coding. The lead will transform completed
  designs into live, interactive web experiences with
  beautiful, clean code while supporting clean code practices
  on the team and acting as technical advisor to our clients
  alongside the Director of Engineering.

  If you enjoy finding elegant solutions to complex problems
  and aren’t afraid to take initiative then join our growing
  team of talented individuals!

  Position Benefits:

  - Competitive pay and benefits
  - Remote – 100% work from home
  - Opportunity to work and grow at an award winning digital
    agency

  Essential Functions and Responsibilities:

  - Experience leading code reviews
  - Advisor to clients for projects that best meet their bottom
    line
  - Experience scoping out complex custom WordPress or ecommerce
    builds
  - Expert level skills in HTML, CSS and JavaScript
  - Expert on backend development with PHP.
  - Experience working and managing MySQL databases.
  - Experience building custom WordPress themes/plugins
  - Complete understanding of the WordPress core software and
    its functions at the code level
  - Hands on experience with SASS/SCSS/LESS and Flexbox
  - Build responsive websites that function perfectly on any
    device or browser size
  - Experience with Git/Bitbucket
  - Ability to execute ADA and SEO best practices
  - Leverage WP Plugin Advanced Custom Fields
  - Proactively perform cross-browser compatibility tests and
    iterate to work through the bugs
  - Adept at developing custom WP themes from Figma design files
  - Collaborate with both UX/UI Web Designers and Backend
    Developers to bridge the gap between graphical design and
    technical implementation in order to complete projects,
    websites, platforms and other web experiences
  - Optimize application for optimum speed and scalability
  - Communicate positively and honestly with a strong work ethic
    and reliability
  - Excitement to learn new technologies and self-teach when
    needed
  - This position does not use existing WordPress templates or
    page builders (i.e WP Bakery, Divi, Elementor, etc) as all
    projects are custom and built from scratch

  Bonus Qualifications:

  - Experience with SOWs or RFPs or other pre-sales activity
  - Experience with Angular, React, or other JavaScript
    frameworks
  - Experience with vanilla.js, ES6/ES2015, Gutenberg blocks
  - Experience working with Laravel PHP Framework and other
    backend technologies like CodeIgniter and NodeJS.
  - Ability to use a taskrunner (ie: Gulp/Grunt/Webpack) to
    generate website assets
  - Develop with a JavaScript compiler (ie: Babel, etc) to
    generate cross-browser compatible JS code
  - Testing experience
  - 3+ years of agency experience
