description: |
  About the company

  Our client is an AI software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Take end-to-end ownership of product areas as a full-stack
  engineer, carrying early ideas through to live production.
  Build AI-powered features, payment-related services and the
  testing and monitoring tools that keep them dependable. Work
  directly with end users to turn their day-to-day processes
  into software, making product decisions on your own while
  reporting to technical leadership.

  What you'll do

  - Design, build and release software features across the full
    stack, from first concept to live use.

  - Build AI components that complete multi-step tasks across
    several communication channels and existing software
    tools.

  - Build payment-related services and data pipelines that
    process financial records.

  - Create evaluation, monitoring and safety tooling that checks
    how dependable AI components are.

  - Talk with end users to map out how they work and turn those
    findings into product requirements.

  - Take full ownership of difficult technical and product
    problems within a defined area of the product.

  Requirements

  What we're looking for

  - Has put working software into live use with a real user
    base.

  - Solid skills across client and server work, with a record of
    getting code released quickly.

  - Has built AI-driven products or tooling for testing such
    systems.

  - Was writing software before relying on coding assistants or
    similar tools.

  - Can talk through a shipped project in technical depth,
    explaining the reasoning behind its structure and design
    trade-offs.

  - Owns technical and product results from start to finish and
    makes decisions independently.

  - Up to three years of experience, with demonstrated ability
    valued over years served.

  - Available for a short work trial, ideally in person.

  Bonus points

  - Experience with production LLM or AI agent systems.

  - Prior startup experience.

  - Prior founder or entrepreneurial experience.

  - Experience with forward-deployed engineering or direct
    customer work on operational workflows.

  - Experience with voice agents, browser tools, payments, or
    monitoring and guardrails.

  - Distinctive depth or achievement in a technical or other
    meaningful area.

  Benefits

  Compensation and benefits

  - Base salary: USD 150,000 to 220,000 per year

  - Equity

  - Health coverage

  Location and work model

  - New York, NY, United States

  - On-site

  - 4-5 days per week in office

  - Full-time
