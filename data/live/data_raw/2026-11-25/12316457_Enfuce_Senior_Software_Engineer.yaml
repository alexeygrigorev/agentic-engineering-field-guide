description: |
  About Enfuce:

  - Founded in 2016, Enfuce is a female-founded and led global
    payments partner solving payments complexity for ambitious
    brands, banks and fintech leaders. Born in the Nordics and
    built for the world, Enfuce combines deep payments
    expertise with cloud-native technology to help customers
    launch and scale with confidence.
  - Enfuce is a strategic issuing and licensing partner
    delivering premium, flexible payment programmes across
    consumer, commercial and B2B use cases. Built for fast
    launch and trusted scale, Enfuce designs, launches and
    runs card programmes supporting debit, credit, prepaid,
    fleet and fuel propositions, alongside digital wallets and
    card scheme connectivity.
  - Enfuce combines cloud-native issuing, embedded compliance
    and fraud intelligence to deliver velocity with control.
    Its modular technology and in-house expertise enable
    customers to create tailored payment solutions that are
    flexible, scalable and secure.
  - As a regulated payments partner, Enfuce holds Electronic
    Money Institution licences from both the Finnish Financial
    Supervisory Authority and the UK Financial Conduct
    Authority and is a principal member of Visa and
    Mastercard. Its PCI-DSS-certified, cloud-native platform
    is designed for enterprise-grade reliability and global
    scalability, with 99.999% platform uptime.
  - Enfuce has raised €73.5 million in funding and has received
    industry recognition including Fintech of the Year and
    Best ESG Campaign at the 2024 European Fintech Awards.

  About the role:

  - In this role you are going to be developing APIs that
    provide essential functionality that helps our customers
    grow their business and will be the cornerstone of the
    Enfuce service offerings for the foreseeable future as we
    build out our next generation cloud native modular API.
  - We are looking for people who are focussed on writing high-
    quality scalable code and can take ownership of key
    deliverables and contribute to our fast paced, ambitious
    team. This role will directly support Enfuce’s mission to
    deliver flexible, scalable, and secure payment solutions,
    enhancing customer satisfaction and business efficiency.

  What you'll be doing:

  - As a Senior Software Engineer at Enfuce, you will be at the
    forefront of architecting and developing mission-critical
    APIs and systems that not only empower our customers to
    scale but also shape the foundation of our next-generation
    cloud-native modular API. The solutions you create will be
    pivotal to Enfuce's future offerings, making this role a
    unique opportunity to leave a lasting impact on a fast-
    growing fintech. This isn’t just about writing code - this
    is about owning meaningful projects, influencing the
    technical direction of our platform, and contributing to
    the scalability and success of Enfuce. If you're driven to
    push boundaries, own solutions from concept to deployment,
    and grow in a dynamic, high-stakes environment, this is
    the opportunity you’ve been waiting for.

  What you'll bring:

  - You're highly proficient in building robust, scalable Java
    services.
  - You have hands-on experience designing, building, and
    running applications in AWS.
  - You have built high-performance applications using Spring
    framework.
  - SQL experience (ideally with Oracle, Aurora or Postgres
    databases)
  - Growth mindset, curious to learn about card issuing and the
    payments industry, and you thrive on pushing your
    technical limits.
  - Excellent communication in English and great collaboration
    skills
  - You're ready to coach and mentor other engineers, offering
    constructive feedback in code reviews to elevate the
    entire team.

  Nice to have:

  - Payments industry experience.
  - Familiarity with OpenAPI documentation standards.
  - Proficiency in Test-Driven Development (TDD) using jUnit.
  - Experience building AWS cloud infrastructure with AWS CDK.
  - Experience using Generative AI or AI agents (e.g., coding
    assistance, testing, or automation).

  Why You’ll Love Working At Enfuce:

  - High autonomy & ownership: We give you the freedom to own
    your work and trust you to make the best decisions for
    your projects.
  - Top-tier talent: Join a team of industry experts and highly
    skilled professionals who are as passionate as you are
    about innovation.
  - Unlimited growth potential: We support your ambition with
    plenty of room for personal and professional growth within
    the company.
  - Flexible, remote work: Work from anywhere up to 30 days, in
    an environment that values flexibility and work-life
    balance.
  - A supportive culture: You’ll be part of a team that
    encourages, motivates, and celebrates success together.

  Comprehensive benefits package: We take care of our people
  with great benefits to match the value you bring.

  Benefits & Perks:

  Fair pay and employee stock option:

  - We value the input of every employee and want you to tap
    into the growth we build together. That’s why our salaries
    are competitive and reassessed regularly, and you have
    access to an employee stock option program.

  Flexible Paid Time Off:

  - We offer a flexible paid time off policy, providing up to 5
    weeks of annual vacation days and paid family leave,
    subject to country regulations. Additionally, you can
    benefit from hybrid or remote work options, promoting a
    healthy work-life balance.

  Regular Fun With Your Team:

  - To spend other than work-related time with your teammates,
    you get a team activity budget for three quarters a year.
    The fourth quarter is reserved for a company-wide event.

  Healthcare, Mobile Phone And More:

  - Depending on location, additional benefits can include
    healthcare, pension, phone support, lunch, wellbeing and
    insurance benefits.
