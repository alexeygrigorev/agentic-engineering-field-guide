description: |
  About Bridger

  Bridger is building the world’s first autonomous financial
  services firm. Businesses of all sizes have finance needs,
  but SMBs can’t afford in-house teams, so they outsource to
  accounting firms. With 75% of CPAs potentially retiring by
  2030, fees are rising and quality is declining.

  We’re building agents that run the entire office of the CFO.
  We started by acquiring multiple firms with 20+ years of
  operating experience, which provide foundational data and
  workflows. Engineers and CPAs from MIT, Blackstone,
  Microsoft, and EY build agents and serve clients.

  Today, we serve 1000+ clients including a vet in New Jersey,
  a nonprofit in Hawaii, and a bubble tea chain here in NYC.
  We raised a large seed round and are already profitable.

  About the Role

  We’re looking for an excellent software engineer to join us
  in building our shared technology platform. This is a broad
  role encompassing full stack development, as well as
  developing AI agents for workflow automation.

  Join us if the following excites you:

  - Being on the cutting edge of technology: We are pushing the
    bounds of AI agents in real, production workflows. This is
    exciting, but difficult, and will require learning
    together
  - Working with end users: You will literally be sitting next
    to your users, and partnering with them to help make their
    lives easier
  - Working in-person in our NYC office

  About you

  - You love to build, and have 0-1 experience in a scrappy,
    ambiguous environment
  - You have a high level of ownership, and can drive products
    from conception to production
  - You have empathy to work with operational teams and
    understand their needs
  - You have experience working with data, statistical, or
    machine learning systems
  - You have 5+ years of engineering experience

  Compensation & Benefits

  For this role, the salary range is $150,000 to $350,000.
  Actual compensation will vary based on skills, experience,
  and seniority.

  - Comprehensive medical, dental, and vision coverage
  - Unlimited PTO and wellness benefits
  - 401(k) with company matching
  - Equity determined by level and experience
  - Grow into the leader you aspire to be. At a fast-growing
    company at the forefront of AI transformation, you can
    enjoy unmatched career growth.
