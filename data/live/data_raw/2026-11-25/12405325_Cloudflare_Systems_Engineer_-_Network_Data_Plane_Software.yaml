description: |
  About Us  At Cloudflare, we are on a mission to help build a
  better Internet. Today the company runs one of the world's
  largest networks that powers millions of websites and other
  Internet properties for customers ranging from individual
  bloggers to SMBs to Fortune 500 companies. Cloudflare
  protects and accelerates any Internet application online
  without adding hardware, installing software, or changing a
  line of code. Internet properties powered by Cloudflare all
  have web traffic routed through its intelligent global
  network, which gets smarter with every request. As a result,
  they see significant improvement in performance and a
  decrease in spam and other attacks. Cloudflare was named to
  Entrepreneur Magazine's Top Company Cultures list and ranked
  among the World's Most Innovative Companies by Fast Company.
  At Cloudflare, we're not looking for people who wait for a
  polished roadmap; we're looking for the builders who see the
  cracks in the Internet that everyone else has simply learned
  to live with. We value candidates who have the instinct to
  spot a "normalized" problem and the AI-native curiosity to
  create a solution using the latest tools. Our culture is
  built on iteration, leveraging AI to ship faster today to
  make it better tomorrow, while ensuring that every
  improvement, no matter how small, is shared across the team
  to lift everyone up. If you're the type of person who values
  curiosity over bureaucracy, and that AI is a partner in
  solving tough problems to keep the Internet moving forward,
  you'll fit right in. Locations: Austin TX, Champaign IL,
  Lisbon Portugal, London England, Atlanta GA, Washington DC,
  About the team Cloudflare is redefining the way networks are
  run at scale, and some of the largest networks in the world
  now run their traffic through us. Cloudflare's network runs
  in hundreds of cities on general-purpose Linux servers, not
  dedicated routers, so the routers, firewalls, load
  balancers, and proxies that carry our customers' traffic are
  software that we write, ship, and operate ourselves. Our
  Packet Processing team builds and operates that software:
  high-performance code that processes customer traffic at the
  packet level as it moves through Cloudflare's network, in
  every Cloudflare data center. That includes the L4 load
  balancer at the front door of every server, a per-customer
  routing and forwarding data plane, a stateful network
  firewall, and a TCP/UDP reverse proxy (the engines behind
  products like Magic Transit, Cloudflare WAN, Cloudflare
  Network Firewall, and Spectrum). We are a team of engineers
  who obsess over performance, correctness, and reliability at
  massive scale. We own what we build in production, a lot of
  our work happens close to the kernel and the NIC. About the
  role We're looking for engineers who want to build the
  software that forwards, filters, and load-balances packets
  for a meaningful fraction of the internet. If you've worked
  on routers, switches, firewalls, load balancers, or SDN data
  planes, and you'd like to do that in software, at
  Cloudflare's scale, this is the role. We're moving towards a
  unified data plane platform that all of our L3/L4 products
  share. Instead of each product having its own data path,
  with its own configuration, performance work, and failure
  modes, we build a feature once and every product gets it.
  Some of the things you'd work on:

  - The shared platform: packet I/O, a graph of processing
    stages, per-core steering, per-customer isolation, and
    upgrades that don't drop traffic
  - A userspace forwarding plane that gives each customer their
    own routing and forwarding, with traffic arriving and
    leaving over tunnels (GRE, IPsec) and direct connections
  - A stateful packet firewall written in Rust: rule evaluation,
    rate limiting, intrusion detection, packet capture, and
    dual-stack IPv4/IPv6
  - An XDP-based L4 load balancer that touches nearly every
    connection into Cloudflare and forwards packets between
    servers and between data centers
  - A fast path that uses XDP and eBPF to forward very large
    single flows at multiple Gbps
  - Host networking: classifying each packet once and using that
    result everywhere on the server, instead of separate
    configs that can disagree
  - Chasing down packet drops, latency, and throughput problems
    across a fleet of servers in hundreds of cities


  We write mostly Go and Rust (plus C for eBPF) on Linux, and
  the work ranges from XDP and the kernel network stack to
  userspace packet pipelines and the control planes that
  configure them. You'll build, deploy, and operate these
  systems on top of one of the largest edge networks in the
  world. You'll partner with some of the best engineers and
  product managers, on our team and across Cloudflare, to
  solve big problems that have a meaningful impact in the
  lives of our customers and users. We're looking for curious,
  empathetic engineers who are excited to join us in changing
  the way networking is done! Examples of desirable skills,
  knowledge, and experience

  - Systems programming experience in Rust, Go, C, or C++
  - A solid understanding of L3 and L4 networking: IP, TCP, UDP,
    routing and forwarding, tunneling (GRE, IPsec), NAT,
    connection tracking, and anycast
  - Experience building data plane software: routers, switches,
    firewalls, load balancers, VPN gateways, or SDN/NFV
    systems
  - Linux networking: eBPF/XDP, tc, netfilter/nftables, network
    namespaces, sockets, etc.
  - High-performance packet processing in user space or the
    kernel (e.g., AF_XDP, DPDK, VPP)
  - Debugging, profiling, and optimizing systems where
    throughput and latency matter
  - Building and operating large-scale, reliable, distributed
    systems
  - Operating what you build: on-call, incident response, and
    root cause analysis
  - Reading unfamiliar code and safely evolving systems that
    have been in production for years
  - Owning work end to end, from design through deployment, and
    working across teams to land shared solutions
  - Clear written and verbal communication; we design in written
    specs and review each other's work

   Bonus points

  - Router, switch, or network OS development (e.g., at a
    network equipment vendor or cloud provider)
  - Network firewalls, IDS/IPS (e.g., Suricata, Snort), or rate
    limiting
  - L4 load balancing (e.g., Maglev-style consistent hashing,
    Katran, IPVS)
  - Running large networks: ISPs, data center networks, or
    backbone operations
  - Contributions to open-source networking projects (e.g., the
    Linux kernel, DPDK, VPP, FRR)

