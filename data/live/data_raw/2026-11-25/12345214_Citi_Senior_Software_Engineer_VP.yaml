description: |
  The Team

  Groupwide AI sets the direction for AI across the
  organisation. Our mission is to help all teams use AI
  safely, responsibly, and at scale, so that they can change
  business ideas into new products. The AI Governance team is
  part of Groupwide AI. We define how the organisation uses
  AI, and we make the tools that make sure that teams use AI
  correctly. We set the standards for all AI work. Then we
  change these standards into products, so that the correct
  method is also the easy method. We own the core technology
  and the infrastructure. Thus, our work has a direct impact
  on how engineers across the organisation use AI. We are a
  product team. We put the needs of our users first, and we
  deliver in small steps. We work closely together. We want
  engineers who have experience in product teams and who
  understand the needs of users.

  The Role

  Software engineers are the core of all that we deliver. As a
  GenAI Senior Full-Stack Software Engineer, you will have an
  important part in our work. You will build products that
  have a large effect, and you will work with teams from other
  functions. Our engineers take part in all stages of product
  development, from the first idea to the release. You will
  work with Generative AI (GenAI) technologies, and use the
  latest LLM engineering techniques day-to-day to also enable
  these technologies in the products we build. You will
  understand the needs of our users, and you will help to
  define the product vision. You will move GenAI research from
  experiments into enterprise production solutions that can
  scale. Our technology stack includes Python, Go, TypeScript,
  React, Kubernetes, Postgres, MongoDB, and GenAI
  integrations. Thus, you must be able to adapt and to learn
  continuously.

  Responsibilities

  - Design, develop, and test software applications that use
    Large Language Models (LLMs) and other AI capabilities.
  - Work closely with team members to deliver software on time
    and within budget.
  - Set high standards for software quality and for user
    experience.
  - Learn continuously about new software development methods
    and AI/ML technologies.
  - Make sure that software platforms obey the Citi security and
    Software Development Life Cycle (SDLC) processes.
  - Help teams across the organisation to use AI governance
    practices.
  - Help to change the culture of the organisation. Encourage
    people to think critically about how they use and govern
    AI.
  - Encourage continuous improvement.
  - Integrate LLM capabilities into production applications, and
    improve their performance.
  - Develop strong prompt engineering strategies.
  - Automate AI workflows.

  Key Characteristics

  - You can find and solve complex problems.
  - You communicate clearly, and you work well with others.
  - You are self-motivated. You work well in a team and in
    remote environments.
  - You manage risk in a practical and creative way.
  - You support inclusion and diversity in all parts of your
    work.
  - You have a growth mindset. You learn and adapt quickly in an
    environment that changes fast.
  - You show enthusiasm. You build trust because you understand
    the needs of other people.
  - You are curious about technology, and about AI/ML
    technologies in particular.

  Required Experience

  - Experience as a Full-Stack Software Engineer in product
    teams
  - Experience in the design, delivery, and support of
    production software, preferably in Python, Go, or
    TypeScript
  - Experience in agile software development environments
  - Experience with distributed systems, event-driven
    architectures, and container-based environments

  Preferred Experience

  - Experience with OpenAI, Anthropic, Google AI, or other LLM
    providers
  - Experience with the integration of AI/ML models or APIs into
    production applications
  - Knowledge of LLM APIs, prompt engineering, and AI workflow
    design
  - Knowledge of AI safety, responsible AI practices, and how to
    improve model performance
  - Knowledge of vector databases and semantic search
    technologies
  - Experience with AI model fine-tuning or custom model
    deployment
  - Experience in natural language processing (NLP) or machine
    learning
  - Experience with AI governance and compliance frameworks

  What we’ll provide you

  This is a unique role that will put you in the position to
  be part of a new venture and actively drive change. Every
  day there will be new challenges that will help you develop
  new skills that can drive your career.

  By joining Citi London, you will not only be part of a
  business casual workplace with a hybrid working model (up to
  2 days working at home per week), but also receive a
  competitive base salary (which is annually reviewed), and
  enjoy a whole host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends

  Visit our Global Benefits page to learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

