description: |
  Tatari is on a mission to revolutionize TV advertising.
  Founded in 2016 to transform the antiquated world of TV
  advertising through the intelligent application of AI and
  machine learning, Tatari helps some of the world’s fastest
  growing brands, including Chime, Calm, Tecovas, Manscaped,
  Saatva, and Liquid I.V., reach their customers with linear
  and streaming TV ads.

  From engineers and data scientists to product managers and
  media experts, our team works as one to turn TV advertising
  into an automated, digital-like experience, so businesses of
  any size can advertise on TV. Led by an executive team of
  former founders and senior leaders from Shazam, TrueCar,
  AdapTV, LiveRail, Amazon, Google, Meta, Microsoft, and
  Yahoo. Inc. Magazine, we’ve been named Best Workplace three
  years in a row.

  The advertising industry has also taken notice. Tatari was
  named Ad Tech Innovation of the Year at the 2026 Convergent
  TV Awards and Best CTV AdTech Platform in the 8th annual
  MarTech Breakthrough Awards, and has earned honors from
  Digiday (Best Connected TV Platform), AdExchanger (Most
  Innovative TV Advertising Technology), and Business Insider
  (Hottest AdTech Companies). The people behind that work are
  recognized too: in 2026, members of our media team were
  honored on AdExchanger’s Top Women in Media & Ad Tech List
  and Ad Age’s Media Buying Power List. If you are ready to do
  your best work and have it recognized, we would love to meet
  you.

  We are looking for a Staff Backend Engineer to join the
  Buying and Optimization team and set the technical direction
  for how our platform's core services and data models evolve
  as we scale. You will own large, cross-team initiatives from
  design through production, mentor other engineers, and raise
  the engineering bar through code review and example. At
  Tatari you are empowered to do your best work at a
  sustainable pace with a stellar group of smart, creative,
  and humble human beings. Come help us build a television
  first programmatic buying experience!

  Responsibilities:

  - Own the architecture of major platform services and
    initiatives end to end, from design through production,
    and ship high-quality code to production regularly
  - Set technical direction on system architecture and scaling
    decisions, and lead design discussions and code reviews
    across the engineering organization
  - Design relational and non-relational data models for optimal
    storage, retrieval, and complex processing/calculations
  - Partner with Data Science, Product, and other engineering
    teams to push boundaries, shape our roadmap, and deliver
    on our mission
  - Mentor more junior members of the team and promote best
    practices in code quality, testing, and reliability

  Qualifications:

  - 10+ years building and operating production backend software
    - Python required, Rust Preferred
  - Experience building and running distributed systems at
    scale, including reliability, observability, and
    performance in production
  - Experience designing abstract data models that reconcile
    heterogeneous entities from multiple data sources into a
    single, coherent, extensible representation
  - Strong proficiency with relational data stores, and the
    judgment to choose and evolve schema designs that balance
    flexibility, query performance, and long-term
    maintainability
  - Experience developing highly available APIs using modern
    frameworks (e.g. REST, gRPC, GraphQL)
  - A record of leading large, cross-team initiatives, such as a
    platform migration, a major re-architecture, or a system
    adopted by several teams
  - Hands-on experience with agentic coding tools (e.g., Claude
    Code, Codex, Cursor, etc) to accelerate development while
    maintaining a high quality bar
  - Strong communication skills, with experience translating
    technical tradeoffs into terms that align engineering,
    product, and executive stakeholders on long-term platform
    direction

  Nice to have:

  - Full stack experience preferred
  - Experience developing applied AI/ML-enabled features,
    including deploying LLM-based systems in production
  - Familiarity with prompt engineering, retrieval-augmented
    generation (RAG) architectures, evaluation frameworks, or
    fine-tuning

  Benefits

  - Total compensation ($190,000 - 225,000)
  - Equity compensation
  - Health insurance coverage for you and your dependents
  - 401K matching, FSA, and commuter benefits
  - $150 monthly spending account
  - $1,000 annual continued education benefit
  - $500 Newbie Productivity Perk
  - Unlimited PTO and sick days
  - Monthly Company Wellness Day Off
  - Snacks, drinks, and catered lunches at the office
  - Team building events
  - Hybrid RTO of 2 days per week in officeAt Tatari, we believe
    in the importance of cultivating teams with diverse
    backgrounds and offering equal opportunities to all. We
    strive to create a welcoming, inclusive environment where
    every team member feels valued and diversity is
    celebrated.#LI-HYBRID
