description: |
  Overview

  Are you insatiably curious, deeply passionate about the
  realm of databases and analytics, and ready to tackle
  complex challenges in a dynamic environment in the era of
  Agentic AI? If so, we invite you to join our team as a Cloud
  & AI Data Solution Engineer for commercial customers at
  Microsoft.

  In this technical sales role, you'll be at the forefront of
  cutting-edge projects that leverage the latest technologies
  to drive meaningful impact. Join us and be part of a team
  that thrives on collaboration, creativity, and continuous
  learning.

  Databases & Analytics is a growth opportunity for Microsoft
  Azure, as well as its partners and customers. These
  technologies empower customers to build, deploy, and manage
  database and analytics solutions in the age of Frontier AI.

  As a Cloud & AI Data Solution Engineer, you will play a
  pivotal role in helping enterprises unlock the full
  potential of Microsoft’s cloud database and analytics stack
  across every stage of deployment. You will work directly
  with technical and business stakeholders to design secure,
  scalable, and resilient database and analytics architectures
  that support business-critical applications and Frontier AI
  transformation. As a trusted technical advisor, you’ll guide
  customers and win their technical decisions on Azure for
  their database and analytics deployment.

  You bring deep expertise in database and analytics
  workloads—including Microsoft Fabric, Azure Databricks, and
  Azure Databases SQL DB, Cosmos DB, DocumentDB, PostgreSQL
  while exploring how Agentic AI can accelerate Frontier
  transformation.

  As you join the team, you will have the opportunity to
  accelerate your career growth, develop deep business acumen,
  hone your technical skills, and become adept at solution
  design and deployment. In summary, you’ll help customers
  modernize their database and analytics platforms to realize
  the full value of Microsoft’s platform, all while enjoying
  flexible work opportunities.

  As a trusted technical advisor, you’ll guide customers
  through secure, scalable solution design, influence
  technical decisions, and accelerate database and analytics
  migration into their deployment workflows. In summary,
  you’ll help customers modernize their data platform and
  realize the full value of Microsoft’s platform.

   Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, empower others, and
  collaborate to realize our shared goals. Each day we build
  on our values of respect, integrity, and accountability to
  create a culture of inclusion where everyone can thrive at
  work and beyond.

  Responsibilities

  - Lead Databases & Analytics customer engagements.
  - Drive technical sales with decision makers using demos and
    PoCs to influence solution design and enable production
    deployments.
  - Drive technical workshop using live demos, co-create with
    customers whiteboarding & architecture, rapid prototyping,
    hands-on proofs of concept & pilots to resolve technical
    blockers.
  - Prove technical solutions, co-create or re-use existing
    architecture to influence solution design and enable
    customer commitment for deployments.
  - Maintain deep expertise in Analytics Portfolio: Microsoft
    Fabric including OneLake, Azure Databricks, and Azure
    Databases: SQL DB, Cosmos DB, PostgreSQL.
  - Deepen knowledge of on-prem EDW (Teradata, Netezza,
    Exadata), Hadoop & BI solutions.

  Qualifications Required/minimum qualifications

  Master's Degree in Computer Science, Information Technology,
  or related field AND 1+ year(s) technical pre-sales or
  technical consulting experience

  OR Bachelor's Degree in Computer Science, Information
  Technology, or related field AND 2+ years technical pre-
  sales or technical consulting experience

  OR 3+ years technical pre-sales or technical consulting
  experience

  OR equivalent experience.



  Other requirements:  Microsoft Cloud Background Check: This
  position will be required to pass the Microsoft Cloud
  background check upon hire/transfer and every two years
  thereafter.

  Additional or preferred qualifications

  4+ years technical pre-sales, technical consulting, or
  technology delivery, or related experience OR equivalent
  experience.

  2+ years experience with cloud and hybrid, or on premises
  infrastructures, architecture designs, migrations, industry
  standards, and/or technology management.

  Expert on Azure Databases (SQL DB, Cosmos DB, DocumentDB,
  PostgreSQL) for migration & modernization.

  Expert on Microsoft Fabric including OneLake, Azure
  Databricks and competitors (BigQuery, Redshift, Snowflake)
  in data warehouse, data lake, big data, analytics, real-time
  intelligent, and reporting using integrated Data Security &
  Governance.

  Proven ability to lead technical engagements (e.g.,
  prototyping, pilot, PoCs) that drive production-scale
  outcomes.

  Familiarity with database technologies (ETL, DW, Reporting)

  Proficient on data warehouse & big data migration including
  on-prem appliance (Teradata, Netezza, Oracle), Hadoop
  (Cloudera, Hortonworks) and Azure Synapse Gen2.



  Solution Engineering IC3 - The typical base pay range for
  this role across the U.S. is USD $86,100 - $169,800 per
  year. There is a different range applicable to specific work
  locations, within the San Francisco Bay area and New York
  City metropolitan area, and the base pay range for this role
  in those locations is USD $113,300 - $187,400 per year.



  Certain roles may be eligible for benefits and other
  compensation. Find additional benefits and pay information
  here: https://careers.microsoft.com/us/en/us-corporate-pay

  This position will be open for a minimum of 5 days, with
  applications accepted on an ongoing basis until the position
  is filled.

