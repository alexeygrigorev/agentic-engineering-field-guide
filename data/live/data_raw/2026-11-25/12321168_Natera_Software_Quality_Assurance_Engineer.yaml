  LOCATION: Remote / Hybrid / or On-Site in Boulder, CO
  (Foresight Dx business unit, a Natera company)



  ABOUT OUR COMPANY:

  Foresight Diagnostics is a molecular diagnostics company
  pioneering non-invasive cancer detection through highly
  sensitive, cell-free DNA-based liquid biopsy technologies.
  Our proprietary methods - originally developed at Stanford
  University - are designed to detect smaller tumors earlier
  and enable more personalized treatment strategies for
  patients with cancer.

  We sit at the intersection of molecular biology,
  bioinformatics, and next-generation sequencing (NGS), and we
  translate rigorous science into clinically meaningful
  solutions. Following our acquisition by Natera, we now
  combine the agility of a mission-driven startup with the
  scale and resources of a global leader in cell-free DNA
  testing. It’s an exciting moment to join us.

  Headquartered in Boulder, Colorado, our team operates in a
  high accountability, collaborative environment where quality
  and continuous improvement aren’t just values - they’re how
  we work every day.

  POSITION SUMMARY:

  The Software QA Engineer supports the quality system
  processes of the Natera CLIA laboratories and activities
  associated with assays and software. This position may
  represent QA on product development projects, support audits
  (internal, supplier, and external), support activities
  associated with software as part of a medical device. With
  general supervision, works directly with software
  engineering and cross-functional teams to ensure compliance
  of procedures to CAP/CLIA/NYS, FDA Part 820, Part 11, IEC
  62304, ISO 14971 requirements; review software verification
  and validation activities; perform risk and / or impact
  assessments for software systems; support preparation,
  execution, and resolution of internal and external audits.
  Working with software engineering compliance, this position
  will provide value-added guidance throughout the software
  lifecycle. Support CAPA, Deviation, and Nonconformance
  investigation and reporting. Other duties as assigned.

  PRIMARY RESPONSIBILITIES:

  - Participate in software risk management activities (perform
    risk and/or impact assessments forLab, Product, and
    Quality Management software systems), review software
    change requests and maintenance updates along with
    associated test plans, protocols, and reports.
  - Represent software QA on development projects; support
    preparation and execution of internal and supplier audits
    as well as hosting external audits related to software.
  - Participate and/or lead computer system validation /
    Spreadsheet validation projects; draftIQ/OQ/PQ software
    plans, protocols, and reports; ensure validation state of
    software systems are maintained; perform audit trail
    reviews.
  - Participate and/or lead cross-functional teams to
    investigate and resolve software
  - nonconformities, deviations, CAPAs, and complaints.
  - Partners with leadership to develop and implement strategies
    for software compliance.Responsibilities are assigned
    based on demonstrated competency.

  QUALIFICATIONS:

  - 4-7 years of work experience in Biotech industry preferred
    or a relevant combination of skills, education, and
    experience in a Quality Assurance.
  - Software quality assurance additionally: Basic understanding
    of Computer System Validation,Spreadsheet Validation.
    Hands-on experience with validation methodologies.
  - Bachelor’s Degree in Life Sciences, Engineering, Software or
    equivalent
  - May have ASQ or SQA certification.

  KNOWLEDGE, SKILLS, AND ABILITIES:

  - Computer skills (MS Word, Excel, PowerPoint, etc.)
  - Good technical writing and communication skills, independent
    worker, a self-starter with strong organizational and
    planning skills
  - Has an ability to be productive and successful in an intense
    work environment
  - Demonstrates good judgment, excellent attention to detail,
    excellent written, verbal communication and interpersonal
    skills are desired with the ability to be flexible and
    collaborate on multiple projects.
  - Travel – Approximately 10% of work time will be spent
    traveling but flexibility required to meet changing
    business needs.
  - Duties are typically performed in an office setting.
  - This position requires the ability to use a computer
    keyboard, communicate over the telephone and read printed
    material.
  - Duties may require working outside normal working hours
    (evenings and weekends) at times.

  Compensation & Total Rewards

  This range reflects a good-faith estimate of the base pay we
  reasonably expect to offer at the time of hire. Final
