description: |
  Overview

  Microsoft is a company where passionate innovators come to
  collaborate, envision what can be and take their careers
  further. This is a world of more possibilities, more
  innovation, more openness, and the sky is the limit thinking
  in a cloud-enabled world.

  Microsoft’s Azure Data engineering team is leading the
  transformation of analytics in the world of data with
  products like databases, data integration, big data
  analytics, messaging & real-time analytics, and business
  intelligence. The products our portfolio include Microsoft
  Fabric, Azure SQL DB, Azure Cosmos DB, Azure PostgreSQL,
  Azure Data Factory, Azure Synapse Analytics, Azure Service
  Bus, Azure Event Grid, and Power BI. Our mission is to build
  the data platform for the age of AI, powering a new class of
  data-first applications and driving a data culture.

  Within Azure Data, the databases team builds and maintains
  Microsoft's operational Database systems. We store and
  manage data in a structured way to enable multitude of
  applications across various industries. We are on a journey
  to enable developer friendly, mission-critical, AI enabled
  operational Databases across relational, non-relational and
  OSS offerings.

  We are hiring a Software Development Engineers and Senior
  Software Engineers to join the Azure PostgreSQL team, where
  you will work on and drive innovations in one or more areas
  of a relational database engine such as Query processing,
  Transaction logging and recovery, Versioning, IO subsystems,
  Scale-out and Distributed systems. You will have the
  opportunity to contribute to open-source PostgreSQL and
  Linux, and\or develop extensions.

  The group fosters a diverse and inclusive work culture that
  prioritizes people at all times. We spend our days
  collaborating with, teaching, and learning from a diverse
  set of world class engineers. We develop, test, and check
  code in every day. We do not just value differences or
  different perspectives, we seek them out and invite them in
  so we can tap into the collective power of everyone in the
  company. As a result, our customers are better served.

  We do not just value differences or different perspectives.
  We seek them out and invite them in so we can tap into the
  collective power of everyone in the company. As a result,
  our customers are better served.

  Responsibilities

  - Works with appropriate stakeholders (e.g., project manager,
    technical lead) to determine user requirements for a set
    of features.
  - Contributes to processes for the architecture of a
    product/solution feature and helps to create proposals for
    architecture by testing design hypotheses and helping to
    refine code plans, with technical leadership from others.
  - Creates a clear and articulated plan for testing and
    assuring quality of solutions, and defines success for
    outcomes of tests (e.g., unit tests).
  - Creates and implements code for a product, service, or
    feature, reusing code as applicable. Writes and learns to
    create code that is extensible and maintainable. Considers
    diagnosability, reliability, and maintainability with few
    defects, and understands when the code is ready to be
    shared and delivered. Applies coding patterns and best
    practices to write code.
  - Maintains operations of live service as issues arise on a
    rotational, on-call basis. Identifies solutions and
    mitigations to simple issues and complex issues when
    applicable impacting performance or functionality of Live
    Site services and escalates as necessary.
  - Builds knowledge, shares new ideas, and shares pinpoints of
    engineering tool gaps to improve software developer tools
    to support other programs, tools, and applications to
    create, debug, and maintain code for complex product
    features. Uses open source when possible.

  Embody our culture and values

  Qualifications

  Required/Minimum Qualifications

  - Bachelor's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience..

  Job Requirements: Other & Additional

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include, but are not limited to the
  following specialized security screenings: Microsoft Cloud
  Background Check:

  - This position will be required to pass the Microsoft Cloud
    background check upon hire/transfer and every two years
    thereafter.

  Preferred/Additional Qualifications

  - 2+ years of experience in developing and shipping system
    level features in an enterprise production backend server
    system.
  - 2+ years of experience building and supporting distributed
    cloud services with production grade
  - Experience with internals of PostgreSQL or similar
    Enterprise Database Management system, including Storage
    Engine and High Availability.
  - Experience building Distributed Systems with strong
    guarantees.
  - Understanding of data structures, algorithms, and
    distributed systems.
  - Solve problems by always leading with deep passion and
    empathy for customers.
  - Have a deep desire to work collaboratively, solve problems
    with groups, find win/win solutions and celebrate
    successes.

