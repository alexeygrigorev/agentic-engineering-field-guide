description: |
  Company Description

  Palmetto is a consumer energy platform that provides
  homeowners with a single destination to discover, purchase,
  finance, install, monitor and manage home energy products
  and services. By offering one integrated platform across
  solar, battery storage, HVAC, heat pumps and more, Palmetto
  helps homeowners make home energy more affordable, reliable
  and accessible. Today Palmetto serves hundreds of thousands
  of homeowners, across 30+ states, building the operating
  infrastructure for the consumer energy transition, one home
  at a time.

  Our employees are our most valuable resource. We foster a
  promote-from-within culture that prioritizes talent
  development, career growth, and purpose-driven work.
  Palmetto offers a comprehensive benefits package—including
  unlimited PTO, medical, dental, and vision coverage, paid
  parental leave, retirement plans, and more—so you can have
  it all both personally and professionally. Palmetto
  prioritizes people, planet, and profit—backed by a culture
  that values collaboration, impact, and balance. Join us in
  building a brighter, cleaner world.

  Location:

  This position will be based in Charlotte, NC. Remote
  candidates acceptable.

  Reporting:

  This position will report to the Senior Manager,
  Engineering.

  Summary of Role:

  You will own the technical direction of our Growth area,
  which builds how homeowners find and choose Palmetto. That
  includes our digital acquisition experience, the multi-
  product front door, and the funnel that turns interested
  leads into qualified appointments. You'll design and build
  the APIs and services behind it in TypeScript and Node.js,
  settle hard architecture questions across teams, and help
  other engineers do their best work, alongside Product and
  Design.

  This is a high-leverage individual contributor role. You'll
  set technical direction, write foundational code, and raise
  the bar for the engineers around you. AI tools are part of
  how we build, and you'll help the teams use them well.

  Strategic & Tactical:

  - Set technical direction. Own the architecture for Growth,
    make the trade-offs explicit, and align Product, Design,
    and engineering teams around it.
  - Build and ship. Design and implement APIs, services, and web
    experiences in TypeScript and Node.js that move interested
    homeowners toward a qualified appointment.
  - Build for learning. Make instrumentation and experimentation
    part of every release, and use the results to decide what
    to do next.
  - Own quality and reliability. Set testing and CI/CD
    standards, diagnose production issues, and propose fixes
    that last.
  - Settle hard questions. Write the design docs that resolve
    cross-team architecture questions, and run design reviews.
  - Grow engineers. Mentor engineers and tech leads through code
    review, pairing, and design feedback.
  - Partner. Work with product managers, designers, marketing,
    QA, and platform teams to deliver solutions people use.
  - Raise the bar. Shape Palmetto's engineering standards, and
    use AI coding tools responsibly.

  Qualifications:

  - 8+ years of professional software engineering experience,
    including time at a Staff or lead level owning a system
    used by multiple teams.
  - Strong TypeScript and JavaScript.
  - Production experience with Node.js and Express, and
    designing and consuming REST APIs.
  - Hands-on experience with MongoDB or another document
    database.
  - Solid web fundamentals: HTML, CSS, security, and
    performance.
  - Strong testing discipline, plus CI/CD and Git.
  - Design docs that settled cross-team architecture questions,
    and engineers who got better working with you.
  - Clear written and verbal communication with non-engineers.
  - Practical knowledge of agentic engineering.

  Preferred Qualifications:

  - React and single-page apps.
  - NestJS or Fastify.
  - Web experimentation and analytics.
  - Authentication and authorization patterns (OAuth, JWT).
  - Docker and a major cloud.
  - Microservice or event-driven systems.



  Employment is contingent upon the successful completion of a
  background check.

  Equal Employment Opportunity

  Palmetto embraces diversity and is an Equal Employment
  Opportunity employer. Employment is decided on the basis of
  qualifications, merit, and business need. We do not
  discriminate based upon race, religion, color, national
  origin, gender, sexual orientation, gender identity, gender
  expression, age, status as a protected veteran, status as an
  individual with a disability, or any other status protected
  under federal, state, or local law.

  To ensure a fair evaluation, we may use AI to assist in
  sorting applications, but all final decisions are made by
  our hiring team and no candidate dispositions are automated.
  We will keep your information on file for four years from
  the date of your application. For detailed information about
  how we handle your data and our use of AI, please review our
  full privacy policy.

  For more about our Privacy Policy, visit:
  https://palmetto.com/privacy-policy
