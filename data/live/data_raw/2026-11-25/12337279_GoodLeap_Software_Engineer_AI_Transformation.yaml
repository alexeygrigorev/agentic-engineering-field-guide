description: |
  About GoodLeap:

  GoodLeap is a technology company delivering best-in-class
  financing and software products for sustainable solutions,
  from solar panels and batteries to energy-efficient HVAC,
  heat pumps, roofing, windows, and more. Over 1 million
  homeowners have benefited from our simple, fast, and
  frictionless technology that makes the adoption of these
  products more affordable, accessible, and easier to
  understand. Thousands of professionals deploying home
  efficiency and solar solutions rely on GoodLeap’s
  proprietary, AI-powered applications and developer tools to
  drive more transparent customer communication, deeper
  business intelligence, and streamlined payment and
  operations. Our platform has led to more than $30 billion in
  financing for sustainable solutions since 2018.



  GoodLeap is also proud to support our award-winning
  nonprofit, GivePower, which is building and deploying life-
  saving water and clean electricity systems, changing the
  lives of more than 1.6 million people across Africa, Asia,
  and South America.

  Position Summary

  GoodLeap's AI Transformation team partners with business
  units across the company to enable safe and effective AI
  adoption through tools, guidance, training, and custom
  solutions. As a Software Engineer on the team, you will
  build the AI solutions GoodLeap runs on: AI agents, Claude
  plugins and skills, evaluation frameworks, and integrations
  with enterprise systems such as Microsoft 365, Databricks,
  Okta, and Salesforce.

  This role is primarily focused on AI solutions work, with
  crossover into our Salesforce (SFDC) team — you should
  expect to periodically pick up Salesforce platform work
  (integrations, automation, AI features inside SFDC) as
  business priorities require.

  Essential Job Duties & Responsibilities

  - Build & Ship AI Solutions – Design, build, and maintain AI
    agents, Claude plugins/skills, evaluation harnesses, and
    integrations with enterprise systems (Microsoft 365/Graph,
    Databricks, Okta, SharePoint). Own solutions end-to-end
    from prototype through production support.
  - Business Unit Partnership – Work directly with business
    units in consult and co-develop engagements: gather
    requirements, prototype quickly, train users, and hand off
    or maintain solutions.
  - Salesforce (SFDC) Crossover – Support the Salesforce team as
    needed: platform integrations, workflow automation, and AI
    capabilities within the SFDC ecosystem.
  - Quality & Operations – Write tests and evals, participate in
    code review, document solutions, and support the tools the
    team owns.

  Required Skills, Knowledge & Abilities

  Please note: This role is not eligible for visa sponsorship.



