description: |
  Job Description

  Hours: Full-Time – 35 Hours  Work Location: 30-30 Thomson
  Avenue, LIC, NY 11101 Only candidates who are permanent in
  the Computer Specialist (Software) title or those who are
  reachable on the open-competitive list (exam #5056) may
  apply. Please indicate a copy of your Notice of Result card
  or indicate if you are already permanent in the title. If
  you do not meet the previously mentioned civil service
  criteria, you will not be considered for an interview. The
  Technology and Innovation Division (T&I) within the New York
  City Department of Design and Construction (DDC) seeks to
  hire an experienced Senior Software (Fullstack) Developer.
  DDC is the City’s primary capital construction agency,
  responsible for delivering safe, sustainable, and innovative
  public buildings and infrastructure across the five
  boroughs. Partnering with client agencies, design
  professionals, and the construction industry, DDC manages a
  broad portfolio of projects from firehouses, libraries, and
  community centers to roadways, sewers, and resiliency
  initiatives helping to shape a more equitable, efficient,
  and resilient city. Through its commitment to design
  excellence, technological modernization, and public service,
  DDC ensures that critical civic projects are delivered on
  time, on budget, and to the highest standards of quality.
  The Technology and Innovation (T&I) Division serves as DDC’s
  centralized Information, Technology, and Telecom operation,
  organized into three core units: Network, Infrastructure and
  Security; Service Delivery; and Application Development.
  Together, these units provide the hardware, software,
  enterprise applications, and data ecosystem that support the
  agency’s daily operations. In addition to maintaining core
  systems, the division leads strategic modernization efforts
  aimed at improving efficiency, strengthening security, and
  advancing programmatic excellence across the agency. The
  Senior Software (Fullstack) Developer will lead software
  development initiatives within the Application Development
  unit. Working closely with project managers, system
  architects, business analysts, designers, data specialists,
  and technology teams, the selected candidate will design,
  develop, maintain, and enhance agency applications using
  current software development methodologies and DevOps best
  practices, and will translate complex business and policy
  requirements into reliable, scalable, user-friendly
  technology solutions. The responsibilities include:
  - Develop responsive web and mobile-friendly applications,
    business systems, informational websites, and dashboards.
  - Build backend integrations with existing systems using REST
    APIs and web services.
  - Enhance the agency’s application portfolio and develop new
    systems and services.
  - Collaborate with design and business teams on prototypes,
    test scenarios, and user testing to support reliable
    releases.
  - Work with project management teams to develop and maintain
    project plans, technical documentation, and application
    artifacts.
  - Coordinate development and integration efforts with internal
    teams, external vendors, and other NYC agencies, including
    work involving commercial off-the-shelf products.
  - Review agency and interagency deliverables, support
    implementation activities, and identify opportunities to
    improve business operations.
  Additionally, educational credentials must be from a U.S.
  Department of Education-recognized accredited institution.
  Credentials from foreign institutions require independent
  equivalency verification from an approved evaluation
  service. A list of providers (fees apply) is available at: h
  ttps://www.nyc.gov/assets/dcas/downloads/pdf/employment/nyc-
  dcas-foreign-education-evaluation-guide.pdf.  All
  applicants, including City Employees: Please go to NYC
  Government Jobs | Explore Careers | City of New York, go to
  Search for Open Jobs, and type in the Job ID # listed above.
  Submit job application as prompted. Do not apply via
  Employee Self-Service (ESS), e-mail, mail, or fax your
  resume to DDC directly. COMPUTER SPECIALIST (SOFTWARE) -
  13632

  Qualifications

  (1) A baccalaureate degree from an accredited college,
  including or supplemented by twenty-four (24) semester
  credits in computer science or a related computer field and
  two (2) years of satisfactory full-time software experience
  in designing, programming, debugging, maintaining,
  implementing, and enhancing computer software applications,
  systems programming, systems analysis and design, data
  communication software, or database design and programming,
  including one year in a project leader capacity or as a
  major contributor on a complex project; or  (2) A four-year
  high school diploma or its educational equivalent and six
  (6) years of full-time satisfactory software experience as
  described in “1" above, including one year in a project
  leader capacity or as a major contributor on a complex
  project; or (3) A satisfactory combination of education and
  experience that is equivalent to (1) or (2) above. College
  education may be substituted for up to two years of the
  required experience in (2) above on the basis that sixty
  (60) semester credits from an accredited college is equated
  to one year of experience. A masters degree in computer
  science or a related computer field may be substituted for
  one year of the required experience in (1) or (2) above.
  However, all candidates must have a four year high school
  diploma or its educational equivalent, plus at least one (1)
  year of satisfactory full-time software experience in a
  project leader capacity or as a major contributor on a
  complex project. NOTE: In order to have your experience
  accepted as Project Leader or Major Contributor experience,
  you must explain in detail how your experience qualifies you
  as a project leader or as a major contributor. Experience in
  computer operations, technical support, quality assurance
  (QA), hardware installation, help desk, or as an end user
  will not be accepted for meeting the minimum qualification
  requirements. Special Note To be eligible for placement in
  Assignment Level IV, in addition to the Qualification
  Requirements stated above, individuals must have one year of
  satisfactory experience in a project leader capacity or as a
  major contributor on a complex project in data
  administration, database management systems, operating
  systems, data communications systems, capacity planning,
  and/or on-line applications programming.

  Additional Information

  The City of New York is an inclusive equal opportunity
  employer committed to recruiting and retaining a diverse
  workforce and providing a work environment that is free from
  discrimination and harassment based upon any legally
  protected status or protected characteristic, including but
  not limited to an individual's sex, race, color, ethnicity,
  national origin, age, religion, disability, sexual
  orientation, veteran status, gender identity, or pregnancy.
