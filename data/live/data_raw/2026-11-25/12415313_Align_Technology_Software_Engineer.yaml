description: |
  Role summary

  This position is ideal for an experienced software engineer
  with an interest in the manufacturing industry to join the
  Global Manufacturing Applications team as a Software
  Engineer supporting Align’s global manufacturing operations.
  Partnering with global product and process engineering
  teams, you’ll apply strong software engineering, problem-
  solving and analytical skills to enable high-tech
  manufacturing and drive operational improvements.

  This role is instrumental in designing, developing and
  continuously improving reliable manufacturing software
  solutions, while advancing Align Technology’s manufacturing
  software CI/CD capabilities and supporting the overall
  operational success of our global manufacturing systems.

  Key Responsibilities

  - Design, develop, test and maintain reliable, scalable and
    performant MES applications, integrations and reporting
    solutions using Rockwell FTPC and other emerging
    technologies, primarily using Java, SQL, PNuts and other
    programming languages as needed.
  - Develop and improve CI/CD pipeline solutions and software
    engineering practices for the MES platform in
    collaboration with DevOps engineers and other members of
    the software engineering team.
  - Design, develop and support MES integrations using Kafka,
    Rockwell FTPC, SAP Mii, RESTful APIs and other synchronous
    and event-driven integration approaches.
  - Seek opportunities to improve application architecture,
    system reliability, development practices and
    manufacturing processes, and proactively share ideas and
    solutions with the team.
  - Troubleshoot multi-tiered and highly integrated software
    systems, performing systematic root-cause analysis and
    developing sustainable solutions to complex technical
    problems.
  - Ensure that application designs, solution implementation
    notes, configuration changes and deployment work
    instructions are appropriately documented and maintained
    in a common repository.
  - Maintain and continuously advance technical knowledge,
    seeking mastery of software engineering technologies,
    tools and practices relevant to the team’s applications
    and architecture.
  - Collaborate with a diverse group of end-users, SMEs,
    Software Quality Engineers, DevOps engineers and other
    cross-functional team members to translate manufacturing
    and business requirements into robust technical solutions.
  - Actively participate in Scrum and other team collaboration
    activities and share technical experience, design insights
    and engineering best practices related to manufacturing
    software development.
  - Contribute to a collaborative team culture by supporting the
    development and success of other team members and
    celebrating shared accomplishments.
  - This position does not supervise others.

  Skills, Knowledge & Expertise

  - Bachelor’s or Master’s Degree in Computer Science,
    Engineering or a related technical field.
  - 5+ years of experience in software development and
    implementation, including 2+ years of hands-on software
    development experience supporting Manufacturing Operations
    or similarly complex operational systems.
  - Strong understanding of full-stack web application and
    distributed system architecture, including front-end
    applications, backend services, APIs, databases and system
    integrations.
  - Strong Core Java and object-oriented analysis, design and
    development skills, including experience developing
    automated unit tests.
  - Ability to independently analyze complex technical problems
    while working collaboratively within a full-stack
    engineering team including architects, Software Engineers,
    Software Quality Engineers and DevOps engineers.
  - Demonstrated security, performance, scalability,
    reliability, maintainability and usability mindset
    throughout software design and development.
  - Working knowledge of modern SDLC, Agile/Scrum, source
    control, automated testing, CI/CD and DevOps practices.
  - Strong troubleshooting and analytical skills, including the
    ability to diagnose issues across application,
    integration, database and infrastructure layers.
  - Excellent written and verbal communication, presentation and
    technical knowledge-sharing/teach-back skills.

  Complementary Skills

  - Experience developing full-stack applications using Spring
    Boot, RESTful APIs, and modern Single-Page Application
    (SPA) frameworks such as Angular or React.
  - Experience developing applications using the Rockwell FTPC
    Modular Framework or Vaadin framework.
  - Experience designing and developing synchronous and
    asynchronous system integrations, including integrations
    using message brokers such as Kafka.
  - Experience designing, developing and consuming RESTful APIs
    and web services.
  - Experience with relational databases, SQL, data modeling and
    application performance optimization.
  - Knowledge of shop-floor manufacturing processes,
    manufacturing execution systems (MES), and manufacturing
    system integrations.
  - Experience supporting high-availability or business-critical
    manufacturing software systems.
  - Experience working within the medical device or another
    regulated manufacturing industry.
  - Experience with software solutions supporting global product
    labeling or other regulated manufacturing processes.

  Additional Information

  The salary range indicated for this role reflects the
  minimum and maximum we expect to offer at the time of
  publication of the advert. The final salary will be
  determined based on factors such as experience, skills,
  business needs and alignment with equivalent salary levels.
  Where applicable, employees may also be eligible for an
  annual bonus, long-term incentive schemes and other
  benefits; further details are available from our Talent
  Acquisition team.

