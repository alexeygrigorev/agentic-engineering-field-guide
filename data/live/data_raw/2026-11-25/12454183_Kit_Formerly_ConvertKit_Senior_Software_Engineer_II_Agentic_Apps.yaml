description: |
  Kit is the email marketing platform experts choose to grow
  their audience, deepen their relationships, and build a
  business around the work they love. For coaches, YouTubers,
  authors, podcasters, and other creatives, there isn't a
  better marketing hub to rely on to grow audiences, automate
  email marketing, and sell digital products — all within one
  platform.  More importantly, there isn't a team more
  committed to helping creators earn a living. We're on a
  mission to help creators earn $1 billion using our creator
  marketing platform. We have always been 100% independent and
  100% remote. We are proud to have built a product that our
  customers love, and we look for people who have enthusiasm
  and belief in our mission, vision, and values to join our
  team. We're also embracing AI thoughtfully — both in how we
  build and how we hire to ensure our team is adaptable,
  innovative, and ready for what's next.

  The role

  Creators use Kit's first-party apps and integrations to
  connect Kit to the rest of their business. Today we build
  and maintain these apps by hand, with help from an agency
  partner. That doesn't scale. We're looking for a Senior
  Software Engineer II to own app delivery and maintenance end
  to end, so a small team can support creators of every size.

  You'll be the first engineer on the Apps squad. Your focus
  is shipping high quality apps at a high pace, and
  maintaining them to an industry-best standard. To get there,
  you'll take a systems-level view and build on Kit's coding
  agent. You'll work closely with our AI Developer Experience
  squad, which builds the coding agent. You'll own the creator
  experience of every app you build, and you're free to
  improve Kit's platform when that makes those apps better.

  This is a full-time IC role for an AI-first, product-minded,
  full-stack engineer who has shipped agent workflows to
  production and judges them by reliable outcomes, not lines
  of code. You combine technical depth with leadership and
  extreme ownership. You take input from Partnerships,
  Product, and Design to help shape the "what," and you own
  the "how." You thrive in ambiguity, take initiative without
  waiting for permission, and elevate everyone around you
  through your generosity and optimism.

  We're excited about first-party apps because they let
  creators do more with Kit than Kit does on its own. Our own
  apps should just work, and set the bar for every app built
  on Kit.



  Your support system

  You'll report to John Bohannon, Senior Engineering Manager
  for the Ecosystem and Apps squads. You'll collaborate
  closely with a Partnerships Manager, Product Manager,
  Product Designer, and engineers on the Ecosystem squad.
  You'll also work closely with our AI Developer Experience
  squad on Kit's coding agent, and with a contractor who helps
  maintain our apps.

  The Apps squad works as a sibling to Ecosystem. You'll set
  its rhythms, collaborate with our Partnerships Manager on
  which apps to build next, and join Ecosystem's cycle
  planning.

  A peer onboarding buddy will help you learn our systems and
  codebase, and you'll have engineers across Kit for support
  and mentorship.



  What you'll do

  - First Week: Set up your local environment and merge your
    first production code. Meet the team through Get To Know
    You's. Start the app handover with the contractor who
    maintains them today. Watch the recorded app walkthroughs
    and read the runbooks for our most-used apps.
  - First Month: Audit our first-party apps and integrations,
    starting with the apps that need the most maintenance.
    Measure what each app costs to maintain, including partner
    app reviews like those at Google, Meta, and Shopify. Learn
    how Kit's API, OAuth, and App Store support creators from
    small to large. Fix bugs and support escalations in the
    apps you now own. Learn how Kit's coding agent works with
    the AI Developer Experience squad.
  - First Three Months: Adapt Kit's coding agent to build your
    first apps and maintain existing ones. Give it the
    context, guardrails, and evals it needs. Turn what you
    learn into shared pieces every app can use, like a
    reusable load test, infrastructure automation, and app
    manifests. Write runbooks that let others work on any app.
    Drive each app's maintenance toward zero human time with
    the coding agent.
  - First Six Months: Ship new apps at a steady pace. Take over
    the rest of the app catalog and apply the coding agent to
    its maintenance. Show that one engineer with agents can
    maintain many apps at high quality. Define the metrics and
    dashboards for agent-built apps: launches, reliability,
    time to fix, and revenue impact. Share how agents build
    and maintain our apps, for example in a Lunch & Learn.
  - First Year: Kit ships more high-quality apps, faster, and
    the coding agent handles more of the routine builds and
    fixes, with you steering the system. The legacy
    integration model is retired. You use catalog metrics to
    recommend where the Apps squad invests next. You and the
    AI Developer Experience squad improve the coding agent
    together, so other Kit engineers benefit too.

   What will S.E.T. you up for success



  Skills

  - Expert in agentic AI development. You've built agent
    workflows that ship and maintain production code, with
    evals, guardrails, and human review.
  - Strong in APIs, including OAuth, webhooks, and integrations
    with third-party platforms. Fluent in Ruby on Rails, or
    able to ramp into it fast. Full-stack, with React where an
    app needs it.
  - Ship well-tested, performant, accessible code, whether you
    or an agent writes it. Set the quality bar and build the
    tests, evals, and reviews that hold agents to it.
  - Set up dashboards, alerts, and load tests that find problems
    across many apps early.
  - Measure each app's maintenance cost, and make the team's
    open capacity for new apps easy to see.
  - Communicate clearly across Engineering, Product, Design, and
    Partnerships.
  - Align others on goals, trade-offs, and success criteria
    without formal authority.



  Experiences

  - Led a major cross-team initiative from ambiguous
    requirements to delivery, partnering with senior leaders
    across functions, with measurable business impact
  - Built agents or tools that measurably improved how a team
    ships software, not only how much code it writes
  - Took ownership of a codebase someone else built, with thin
    documentation, and made it maintainable
  - Independently managed a large project, such as a migration
    or deprecation that required customers or partners to move



  Traits

  - Create leverage, not only features. Invest in reusable
    systems that make your team and others faster.
  - Judge AI work by outcomes, like launches and reliability,
    not by the volume of code or PRs. Share what works and
    what the risks are.
  - Own everything you and your agents produce, from code to PR
    descriptions. Know the details well enough to stand behind
    every line, and don't leave reviewers or readers to do the
    work.
  - Lead work without waiting for a formal role or permission.
  - Make reversible product decisions on your own, and know when
    to pull in cross-functional stakeholders like Product,
    Design, Partnerships, and Support.
  - Break big, ambiguous problems into steps that you and others
    can deliver.
  - Write docs that let others work on any app, so the work
    doesn't depend on one person.
  - Put creator outcomes ahead of features.
  - Share work in progress and the reasons behind trade-offs.
    Give and ask for direct feedback.

  Nice to Haves

  - You will stand out if you have:
    - Built AI tools that other developers use, such as MCP
      servers, agent skills, or eval suites
    - Built integrations with creator-economy platforms
    - Directed the work of contractors or an agency partner
    - Shared your work through talks, blog posts, or open-source
      contributions





  What won't set you up for success

  - Needing established processes, full consensus, or permission
    before you move forward
  - Wanting a large team of engineering peers on your own team
    from day one
  - Preferring to stay heads-down in code over shaping what to
    build with Partnerships, Product, and Design
  - Preferring greenfield work over inheriting and improving
    legacy code
  - Building each app by hand when a shared system could serve
    many
  - Measuring AI success by code volume instead of shipped,
    reliable apps
  - Avoiding direct feedback, whether giving or receiving it



   Working hours and location

  We're 100% remote with team members across the globe. We
  work mostly on East Coast time—so if you're based on the
  West Coast of the United States, Europe, or Asia, you might
  have a few early mornings or late evenings. We do our best
  to keep things reasonable, but a little time zone juggling
  comes with the territory.



  Compensation + perks + benefits

  Kit has standardized salaries based on position, no matter
  where you live. For this role, we’re hiring at our level P4
  ($186,000/year). Level is determined based on experience and
  our interview process.



  Perks + benefits include:

  - Profit Sharing
  - Kit equity
  - 401k with a 5% match
  - We cover up to $2,280 per month toward medical premiums,
    with dental and vision premiums fully covered. We offer
    Health Insurance plans through Aetna
  - $2,000 equipment allowance for your first two years, $1,000
    budget every following two years. Company-provided laptops
    are issued to every Kit team member and are not included
    in the equipment budget
  - Individual learning + development budget ($3,500/year)
  - Creator meetup budget ($50/month) to connect with creators
    over coffee, lunch, or other in-person meetups
  - Gender affirming benefits
  - Childcare benefit up to $3,000 annually through JOON
  - Twenty (20) days of paid time off during each year of
    employment
  - Paid paid vacation: An after-tax bonus of $1,000 for taking
    five consecutive days of vacation where you’re fully
    unplugged from work
  - Ten (10) paid holidays a year
  - Two weeks of paid sick time each year, including mental
    health + well being days
  - Twelve (12) weeks paid parental leave and flexible
    scheduling in your child’s first year
  - Up to six weeks of paid bereavement leave, medical leave,
    and disaster after six months of employment, two weeks of
    each paid leave in your first six months
  - Winter Break Closure: Kit closes for a week at the end of
    December, giving everyone a collective break to enjoy the
    holiday season. Essential support services remain
    available, with teams coordinating to ensure coverage
    during this period
  - Four-week, paid sabbatical after five years with the team
  - Fantastic in-person or virtual retreats with the team twice
    a year



  How to apply

  We usually receive a large number of applications, and our
  goal is to follow up with you within two weeks. You’ll hear
  from us either way. Here’s what you can expect from the rest
  of our hiring process:

  - Phone screen with our recruiter (30 min)
  - Hiring manager interview (45 min)
  - Take-home assignment
  - Technical interview (75 min)
  - Technical execution and leadership/collaboration interview
    (60 min)

  We’ll keep you informed through every step. To get started,
  complete this application, including a cover letter and
  answers to the questions on the next page. We read every
  single application, and your cover letter and responses help
  put your experience into context.

  Kit is an equal opportunity employer

  We value diversity in all of its forms. Research tells us
  that applicants who are female or non-binary, as well as
  applicants who are people of color, are less likely to apply
  for roles they do not feel 100% qualified for. If you think
  you meet more than 50% of our requirements but fewer than
  100% of them, please apply.

  We’re imperfect communicators, so think of our job postings
  as the starting point for discussion rather than proof that
  you shouldn’t apply.

  Kit does not discriminate on the basis of race, sex, color,
  religion, age, national origin, marital status, disability,
  veteran status, genetic information, sexual orientation,
  gender identity or any other reason prohibited by law in
  provision of employment opportunities and benefits.
