description: |
  SecurityBridge is a fast-growing global software leader
  transforming how enterprises secure their SAP environments.
  Our mission is to deliver cutting-edge, high-impact SAP
  security solutions that enable some of the world’s largest
  organizations to stay ahead of ever-evolving cyber threats.
  We are looking for a Software Engineer to join the team
  behind TrustBroker, SecurityBridge’s SAP-certified
  authentication solution. TrustBroker enables enterprise
  customers to enforce policy-based multi-factor
  authentication (MFA) across SAP environments and is
  certified for RISE with SAP. In this role, you will work
  across the full software development lifecycle, contributing
  to both product development and quality assurance. You will
  develop new functionality, resolve complex technical issues,
  write automated tests, and ensure the reliability and
  security of authentication mechanisms used by enterprise
  customers worldwide. You will play a key role in maintaining
  and evolving authentication technologies , and multi-factor
  authentication integrations while helping shape the future
  of secure SAP authentication.

  Key Responsibilities

  - Develop, maintain, and enhance TrustBroker functionality
    across authentication and identity management components.
  - Implement fixes and feature enhancements for Kerberos,
    OpenID Connect (OIDC), RADIUS, and multi-factor
    authentication integrations.
  - Contribute to the expansion of OIDC-based authentication
    capabilities.
  - Design, implement, and maintain automated tests for all
    delivered functionality, including unit and integration
    testing.
  - Validate integrations against real identity providers and
    MFA vendors, including Microsoft Entra ID, Okta, Ping
    Identity, Duo, and others.
  - Troubleshoot complex authentication, connectivity, and
    protocol-related issues across customer environments.
  - Maintain and improve customer-facing documentation,
    configuration references, and troubleshooting guides.
  - Collaborate closely with Product, Support, and Engineering
    teams to deliver secure and reliable authentication
    solutions.
  - Participate in design discussions and contribute to
    architectural decisions for security-critical
    functionality.
  - Leverage modern development tools, including AI-assisted
    development workflows, to improve productivity and code
    quality.


  Required Qualifications

  - 3–5+ years of professional software development experience
    in C.
  - Strong understanding of memory management, multithreading,
    error handling, and cross-platform software development.
  - Hands-on experience with at least one authentication or
    identity protocol, such as Kerberos, OpenID Connect
    (OIDC), OAuth 2.0, SAML, or RADIUS.
  - Solid understanding of TLS, PKI, X.509 certificates, and
    modern authentication concepts.
  - Experience developing software for Windows and Linux
    environments.
  - Strong troubleshooting and debugging skills, including
    protocol analysis and log-based root-cause investigation.
  - Experience writing automated tests as part of the
    development process.
  - Ability to work independently in a remote, international
    team environment.
  - Strong written and verbal communication skills in English.
  - Openness to modern development practices, including AI-
    assisted coding and iterative delivery methodologies.


  Nice to Have

  - Experience with Kerberos and Active Directory environments.
  - Experience implementing or supporting OpenID Connect (OIDC)
    solutions.
  - Experience integrating with MFA providers such as Microsoft
    Entra ID, Okta, Ping Identity, Duo, RSA, or RADIUS-based
    solutions.
  - Familiarity with SAP technologies, including SAP NetWeaver,
    SNC, SAP Crypto, RFC SDK, or SAP BTP.
  - Experience with OpenSSL and security-focused software
    development.
  - Knowledge of DNS, certificate management, and enterprise
    authentication architectures.
  - Experience creating technical documentation for customers or
    internal teams.
  - Customer-facing experience, with a willingness to develop
    toward pre-sales responsibilities.


  Important Information

  - This position is remote Worldwide.
  - Visa sponsorship and relocation support are not available.
  - Candidates must hold valid authorization to work in their
    country of residence.


  Our Offer

  - The opportunity to work on a security-critical
    authentication product used by enterprise customers
    worldwide.
  - Exposure tomodern identity, authentication, and SAP security
    technologies.
  - A collaborative, international engineering team with a
    strong focus on quality and innovation.
  - Flexible working hours and aresults-oriented work culture.
  - Professional development and continuous learning
    opportunities.
  - Competitive salary and benefits package.


  What Makes It Special to Work with Us  Flat hierarchies
  await you at our company. If you have a good idea or
  knowledge, feel free to contribute, your perspective is
  valued from day one. We trust our people to organize their
  work in a way that suits them best, focusing on outcomes
  rather than physical presence. Honesty, respect,
  helpfulness, and integrity form the core of our company
  culture. We believe strong teams are the foundation of
  sustainable success. That’s why we strive to create an
  environment where employees feel supported, connected, and
  empowered to grow.
