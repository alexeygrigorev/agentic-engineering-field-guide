description: |
  This role is for one of our clients

  Compensation: $150 per hour

  Role Type: Contract Work Commitment: 30–40 hours per week
  Work Arrangement: Remote, Flexible Schedule

  Role Overview

  Join a leading AI research team's Generative AI (GenAI)
  initiative and contribute to the development of foundational
  AI models. We are looking for experienced Software Engineers
  who are established open-source maintainers or core
  contributors with substantial hands-on ownership of mature,
  widely adopted open-source codebases.

  In this role, you will leverage your practical engineering
  expertise, repository knowledge, and senior-level code
  review judgment to help improve AI systems' capabilities in
  software engineering, code quality, and open-source
  maintenance. You will work closely with AI researchers and
  engineering teams to create realistic coding challenges,
  develop reference solutions, evaluate AI-generated code, and
  provide high-quality technical feedback.

  The engagement requires a commitment of 30–40 hours per
  week, with flexible scheduling. Most tasks are asynchronous
  and can be completed during evenings or weekends, with
  occasional meetings with research teams as required.

  RequirementsKey Responsibilities

  - Collaborate with AI research and engineering teams to
    identify knowledge gaps and improve model performance in
    software engineering, code review, debugging, and open-
    source project maintenance.
  - Develop challenging, realistic engineering tasks based on an
    open-source repository you actively maintain or contribute
    to. Tasks may include feature development, code
    refactoring, bug fixes, testing, and other
    responsibilities typically handled by experienced
    maintainers.
  - Create accurate, well-structured reference implementations
    and solutions that demonstrate strong engineering
    practices and repository-specific conventions.
  - Review and evaluate AI-generated code, test cases, and
    grading rubrics against the project's architecture, coding
    standards, maintainability requirements, and quality
    benchmarks.
  - Build, configure, and execute the open-source project
    locally, including using Docker, to validate tasks,
    reference solutions, and test suites.
  - Assess code quality, identify edge cases, detect potential
    bugs, and evaluate the correctness, reliability, and
    maintainability of AI-generated changes.
  - Write detailed technical explanations and rationales
    outlining expected solution quality, identifying
    shortcomings, and explaining important engineering
    decisions.
  - Provide actionable written feedback to help improve AI-
    generated code and strengthen model performance.
  - Work with other subject matter experts to maintain
    consistency, technical accuracy, and quality across AI
    training datasets.

  Required Skills and Qualifications

  - Established Open-Source Experience: Must be a recognised
    maintainer or core contributor to a widely used open-
    source software project.
  - Maintainer Criteria: Listed in the repository's MAINTAINERS
    or CODEOWNERS file, or have completed at least 10 pull
    request (PR) reviews within the last 12 months.
  - Core Contributor Criteria: Have at least 3 substantive
    merged pull requests within the last 12 months.
  - Repository Maturity: The project must be at least two years
    old, have an established user base, maintain an active
    code review culture, and consist primarily of human-
    written code.
  - Verifiable Contribution History: Demonstrated history of
    sustained open-source contributions, publicly verifiable
    through the candidate's own GitHub account.
  - Advanced Code Review Expertise: Strong engineering judgment
    and the ability to critically assess AI-generated code,
    test coverage, edge cases, architecture, and
    implementation quality.
  - Hands-on Development Skills: Ability to independently build,
    configure, run, and test the project and its test suite
    locally, including through Docker.
  - Technical Communication: Excellent written communication
    skills, with the ability to explain complex technical
    concepts, code review decisions, and engineering trade-
    offs clearly.
  - Independent Ownership: Ability to develop tasks, validate
    solutions, and provide technical feedback independently,
    ensuring all written rationales and evaluations are
    personally authored.

  Engagement Requirements

  - Availability to commit 30–40 hours per week as the primary
    professional focus. This engagement is not suitable for
    individuals simultaneously holding another full-time job.
  - Exclusivity throughout the engagement, with no concurrent
    work for another AI research lab or AI training
    organisation, including other similar project engagements.
  - Must be legally authorised to work in the country of
    residence.
  - Willingness to complete required background verification and
    sign confidentiality agreements before commencing work.
  - Ability to work using a company-provided device to maintain
    information security and confidentiality.
  - Availability for occasional discussions and meetings with AI
    researchers and engineering teams as required.
