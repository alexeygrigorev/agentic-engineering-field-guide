description: |
  Overview

  This position is primarily responsible for providing
  software and application development support for web-based
  environmental data management modules, tailored to meet the
  needs of Navy environmental clients.

  ESSENTIAL DUTIES AND RESPONSIBILITIES:• Assist the
  designated project manager with activities and tasks
  associated with all stages of software development
  lifecycle, including requirements gathering, design,
  development, construction, implementation, and testing.•
  Provide web development technical leadership, subject matter
  expertise, support, and mentoring to other project team
  members.• Respond to and troubleshoot user experience
  issues.• Enhance and maintain existing web-based
  applications/systems/web sites.• Help in administering and
  maintaining the cornerstone web infrastructure.• Create
  knowledgebase articles to disseminate web solutions to
  resources and clients.• Perform other short-term and long-
  term tasks and duties as assigned by Management.• Test
  software for responsiveness and efficiency.• Troubleshoot,
  debug and upgrade software as required.• Create, implement,
  validate security and data protection settings.•
  Draft/update technical documentation.• Attend and facilitate
  client meetings.

  NON-ESSENTIAL DUTIES AND RESPONSIBILITIES:• Other duties as
  assigned.

  REQUIREMENTS/QUALIFICATIONS:EDUCATION AND EXPERIENCE:

  • One or both of the following: Experience with server-side
  applications using ASP.NET, Web API, or MVC using the
  Microsoft .NET Framework. Experience with client-side
  applications using React.js or a similar client-side
  framework.

  • Bachelor’s or associate degree.• Experience with working
  in a distributed version control system such as Git.•
  Excellent organizational skills; must be detail oriented.•
  Ability to complete tasks individually as well as
  collaborate with other team members.• Self-disciplined and
  have proven ability to work independently without direct
  supervision and make a positive contribution to
  multidisciplinary team.• Ability to quickly pick up and
  learn new languages and frameworks.• Familiarity with Azure
  DevOps and Single Page Applications is a plus.• Self-
  motivated and have a pro-active work ethic with a “can-do”
  attitude to provide excellent customer service and actively
  contribute to building and expanding consultancy services.•
  Willingness and ability to learn during fast-paced on the
  job training.• Effective communication skills.

  PREFERRED KNOWLEDGE, SKILLS AND/OR ABILITIES:• Knowledge of
  the Navy’s Environmental Compliance programs. Able to
  provide technical support in complying with applicable
  environmental regulations and guidance. Capable of drafting
  technical documents, point papers, and briefing packages.•
  Ability to apply common sense understanding to carry out
  instructions furnished in either written, oral, or diagram
  form. Able to rely heavily on experience and independent
  judgment to plan and accomplish.• Proficient in adding,
  subtracting, multiplying, and dividing in all units of
  measure using whole numbers, common fractions, and decimals.
  Skilled in computing rate, ratio, and percent and drawing
  and interpreting diagrams. Able to read, interpret, analyze,
  and discuss data.• Adept at reading, writing, and
  understanding the English language and able to read,
  interpret, and analyze documents such as technical drawings
  and manuals, operating and maintenance instructions,
  procedure manuals, proposals, etc. Must learn and understand
  naval acronyms. Ability to author detailed reports and
  correspondence as needed. Talented in effectively presenting
  information orally and in writing and communicating clearly
  and concisely while under pressure.

  REASONABLE ACCOMODATION:

  Reasonable accommodation may be made to enable individuals
  with disabilities to perform the following essential
  functions.

  SUPERVISOR RESPONSIBILITY:

  None.

  WORK ENVIORNMENT:

  A professional office in which typical office equipment and
  information technology is used.

  PHYSICAL REQUIREMENTS:

  The physical demands described must be met by an employee to
  perform the essential functions of the job – able to: see,
  hear, and speak; lift objects weighing up to 20 pounds; sit
  for extended time; and, use a personal computer keyboard,
  mouse, and other peripheral devices.

  TRAVEL:

  None

  WORK AUTHORIZATION / SECURITY CLEARANCE:

  DoD Secret or higher security clearance, or the ability to
  obtain and maintain a Secret clearance. U.S. Citizenship is
  required.

  ADDITIONAL QUALIFYING FACTORS:

  Must have the ability to obtain and maintain a security
  clearance. In addition, a satisfactory background screening,
  negative drug test, positive references and proof of
  identity and legal authorization to work in the United
  States are required.

  As an equal opportunity employer, The Tatitlek Corporation
  recognizes that our strength lies in our people.
  Discrimination and all unlawful harassment, including sexual
  harassment, in employment is not tolerated. We encourage
  success based on our individual merits and abilities without
  regard to race, color, religion, national origin, gender,
  sexual orientation, gender identity, age, disability,
  marital status, citizenship status, military status,
  protected Veteran’s status or employment.

  BENEFITS:

  For more information please visit:

  https://careers-tatitlek.icims.com/

  Salary$95k/annually
