description: |
  Join Revive Media to help advertisers across the country
  scale their localized ads. Our business is in the midst of
  transforming from a services agency to a product-led
  business with our new native platform. The platform is live
  with external partners, and we're expanding its reach. This
  role will help us build the new features that power that
  growth, and you'll have real ownership over what we ship
  next.

  As a Senior Back-End Developer, your primary responsibility
  will be to design, develop, and maintain robust and high-
  performing back-end systems that meet our growing business
  needs. Partnered closely with the product management and
  front-end development teams as well as our principal
  architect, you will play a critical role in the entire
  application lifecycle, focusing primarily on coding,
  debugging, and testing back-end APIs and integrations into
  third-party systems. Your in-depth knowledge and expertise
  in C# and .NET frameworks will be instrumental in continuing
  to build a scalable and maintainable internal and customer-
  facing application.

  We are a remote-first culture and virtual team of high-
  performing professionals with diverse backgrounds located
  across many time zones, including North America, Europe, and
  Asia. We prioritize asynchronous communication and
  documentation but come together as a team to solve hard
  problems.

  Key Responsibilities

  - Development and Coding

  - Team Collaboration and Leadership
  - Compliance & Best Practices

  RequirementsTechnical Requirements

  - Experience: Minimum of 9 years of experience in back-end
    development, including 8+ years with C# and .NET.
  - Programming Languages: Highly proficient in C#. Familiarity
    with TypeScript and/or React is preferred but not
    required.
  - .NET Framework: Extensive experience with .NET, minimally
    .NET 6, with a preference for candidates who have
    experience with .NET 10.
  - Database Management: Proficient in SQL and experience with
    database design and management. Knowledge of NoSQL
    databases is a plus.
  - API Development: Extensive experience in developing and
    integrating RESTful APIs, preferably using Minimal API.
  - Dependency Injection: Thorough understanding of dependency
    injection concepts and experience with its implementation.
  - ORM: Experience with a modern ORM like Entity Framework.
  - Amazon AWS: Familiarity with AWS and the .NET tools used to
    interact with the various services like SNS, SQS, SES, S3,
    Lambda, Bedrock, etc.

  Other Requirements

  - Analytical Skills: Strong problem-solving skills and the
    ability to think algorithmically.
  - Communication Skills: Excellent verbal and written
    communication skills.
  - Independence: Ability to make decisions independently and
    collaborate where necessary.
  - Teamwork: Ability to collaborate with team members and work
    under pressure in a fast-paced remote environment.
  - Time Management: Excellent organizational and time
    management skills.
  - Continuous Learning: A strong commitment to continuous
    personal and professional development.
  - Location: Based in the United States of America

  Benefits

  - Comprehensive healthcare including medical, vision & dental
    benefits covered at 100% for employees and 50% for
    dependents
  - We're fully Remote and offer a remote working stipend
  - Flexible PTO - take what you need, when you need
  - Coffee or Tea Subscription
  - Monthly 3 day weekend

  Revive Media provides the wage it reasonably and in good
  faith expects to pay for all remote roles and as otherwise
  required by applicable law. The expected annual base pay for
  this role is $165,000 - $180,000. Actual compensation may
  vary within the listed range based on a wide array of
  factors including, but not limited to, skill set,
  experience, and specific geographic location. The role also
  includes a target annual bonus of 10%, paid out quarterly
  based on performance. Total compensation typically ranges
  from $180,000 to $200,000. All new hires have equity in the
  business.

  Revive Media is an Equal Opportunity Employer. We do not
  discriminate on the basis of race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. We assess all
  qualified candidates on the basis of skill, experience and
  talent.

  Privacy Notice to California Candidates
