description: |
  About Chiri

  Chiri collapses fragmented software into one governed
  operating layer for mid-sized businesses: companies with
  valuable workflows and real urgency, but no internal AI
  organization to take a use case to production.We combine our
  platform with forward-deployed expertise to connect
  customers' existing systems, build what they need, and
  operate it in production.Increasingly, buyers are asking
  ChatGPT, Perplexity, Gemini, Claude, and other AI systems
  what they should use. Chiri must be one of their top
  answers.

  Role Overview

  We're looking for a highly capable Backend Engineer to build
  fast, reliable, production-grade services for a transaction-
  intensive healthcare and pharmacy-finance platform.

  This role requires a strong engineering foundation in
  concurrency, parallel programming, memory management, code
  profiling, and performance optimization.

  You'll help build the services supporting real-time claim
  validation, decision engines, data processing, and
  enterprise integrations.

  Key Responsibilities

  - Performance Engineering: Develop backend services designed
    for demanding latency and throughput requirements.
  - Concurrency & Parallelism: Build efficient concurrent
    systems with careful attention to threading, asynchronous
    execution, synchronization, and memory utilization.
  - Profiling & Optimization: Identify and eliminate performance
    bottlenecks through code profiling, benchmarking, load
    testing, and runtime analysis.
  - Cold-Start Performance: Design and optimize initialization,
    warm-up, and cold-start mechanisms to minimize processing
    delays.
  - Decision Systems: Implement reliable APIs, validation
    workflows, and rules-based processing with predictable and
    testable behavior.
  - Production Reliability: Ensure correctness, error handling,
    observability, security, and operational stability.

  Required Skills and Experience

  - Strong production backend engineering experience, preferably
    with Golang.
  - Demonstrated expertise in concurrent and parallel
    programming, including race conditions, synchronization,
    and resource contention.
  - Deep understanding of memory management, application runtime
    behavior, and performance profiling.
  - Proven ability to optimize latency and throughput in
    production systems.
  - Strong fundamentals in statistics, including distributions,
    percentiles, variability, and performance measurement.
  - Experience with APIs, databases, asynchronous processing,
    and distributed systems.
  - Experience with Docker, Git, automated testing, and CI/CD.
  - Strong debugging, problem-solving, and communication skills.

  Preferred Qualifications

  - Experience in competitive programming.
  - Experience building payment, transaction-processing,
    financial, or healthcare systems.
  - Experience optimizing serverless execution and cold-start
    behavior.
  - Experience with deterministic rules engines, real-time
    decision systems, or high-volume event processing.

  What We Offer

  The opportunity to solve challenging performance problems
  and build the core transaction-processing capabilities of a
  new production platform.

  Our SCOUT Values

  Our values are not wall art. They describe how we expect
  people to operate.

  Seek to Understand

  Assume you might be wrong. Clarity before action.

  Call It Out

