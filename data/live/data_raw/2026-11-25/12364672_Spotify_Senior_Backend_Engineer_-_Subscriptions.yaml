description: |
  The Subscriptions Mission builds and scales the products,
  platforms, and business models that turn free listeners into
  lifelong Premium subscribers. We focus on attracting new
  subscribers, improving conversion and retention, and
  creating seamless commerce experiences that support
  Spotify's growth and bring fans closer to the creators they
  love.

  At Spotify, subscription data helps shape the decisions and
  experiences behind our 700M+ monthly active users and 290M+
  Premium subscribers. You'll join a collaborative team
  building the backend systems that power merchandising,
  personalized experiences, and subscription journeys at a
  global scale. Your work will help listeners discover the
  value of Premium and give them more reasons to stay.

