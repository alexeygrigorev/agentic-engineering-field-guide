description: |
  About the team:

  The Identity team plays a critical role in delivering secure
  and seamless experiences for millions of SumUp users
  worldwide. We build and maintain authentication and account
  protection services, as well as central identity solutions
  that enable teams and products across SumUp.

  We are a cross-functional, engineering-driven team that
  values technical excellence, collaboration, and continuous
  improvement. We keep our processes lean, encourage open
  discussions, and believe in a strong team-first mentality
  where everyone contributes to the team's success.

  As a Senior Software Engineer, your primary focus will be
  backend development in Go, building reliable and scalable
  solutions that support SumUp's identity ecosystem. Depending
  on your interests and strengths, you'll also have
  opportunities to contribute to infrastructure, web, or
  mobile development. Previous experience in all these areas
  isn't required, curiosity and a willingness to get hands-on
  are what matter.

  We're looking for someone proactive and adaptable who enjoys
  taking ownership and driving initiatives end-to-end. You'll
  collaborate with engineers and stakeholders to shape
  requirements, design technical solutions, make
  implementation decisions, and drive rollouts. You'll have
  the opportunity to influence how we build and improve our
  services while making a meaningful impact on the security
  and experience of SumUp users.

  What you’ll do:

  - Collaborate with other engineers to design and build clean,
    reliable APIs, such as the next generation of our central
    Authentication and Permission APIs and facilitate a smooth
    gradual migration to these new systems.
  - Evolve our authentication and authorization services that
    serve both internal and external users.
  - Develop and ship solutions that enhance the security of our
    apps and SDKs, protect millions of users from fraud and
    account takeovers.
  - Create secure, user-friendly self-service features that
    empower our users to manage their accounts and contact
    preferences with confidence.
  - Work with a talented distributed team that values
    collaboration, learning, and continuous improvement.
  - Enjoy your work! We are looking for someone to be paid to do
    what they love.

  You’ll be great for this role if you have:

  - Experience in backend or fullstack development, primarily
    with Go. Familiarity with other languages like TypeScript,
    Ruby, Java, Kotlin, or Swift is a big plus and can be
    helpful for working across different systems.
  - Excitement for security and reliability topics. Experience
    with authentication and authorization technologies (e.g.
    OAuth, Multi-Factor Authentication) would be nice to have.
  - A flexible mindset and the ability to adapt quickly in a
    fast-moving environment and navigate complex domains. You
    are a quick learner and have a proven ability to pick up
    new skills and concepts swiftly.
  - A structured, proactive way of working. You enjoy working
    independently but also effectively collaborate with your
    cross-functional team and other teams.
  - A natural drive to improve things—you're always looking to
    make systems and processes better. You strive for great
    solutions, but also know when to be pragmatic.
  - Confidence in asking for help or using available tools (like
    search engines or AI assistants) when something is beyond
    your grasp.
  - Strong communication skills in English, both spoken and
    written. As part of a globally distributed team, clear and
    respectful communication is essential.

  Why you should join SumUp:

  🌍 Opportunity to work with SumUppers globally on large-scale
  fintech products used by millions of businesses worldwide,
  from our Berlin office. This involves an office-first setup

  🧑‍🔬 We take learning and experimentation seriously with Hack
  Days every second Friday, and entire global Hack Weeks.

  🌈 Commitment to Diversity and Inclusion: Be part of a
  workplace that values and promotes diversity, fostering an
  inclusive environment where everyone's perspectives are
  respected and embraced

  📚 A dedicated annual L&D budget of €2,000 for attending
  conferences and/or advancing your career through further
  education

  🚀 Enrolment onto our VSOP program: You will own a stake in
  SumUp’s future success

  💶 A corporate pension scheme where we match up to 20% of
  your contributions

  🔄 30 Days Sabbatical: Enjoy the unique opportunity to take a
  well-deserved break with our 30 days sabbatical benefit
  after completing 3 years of employment with SumUp

  🔗 Referral Bonus: Earn additional rewards by referring
  talented individuals to join the SumUp team

  🚵🏾‍♂️ Numerous other benefits such as Urban Sports Club
  subsidy, Kita placement assistance, relocation assistance,
  subsidised office lunches

