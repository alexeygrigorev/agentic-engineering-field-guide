description: |
  About the company Our client is building an AI platform for
  construction capital program owners, helping teams collect,
  organize, and analyze project data and documents. Backed by
  $7.7M in seed funding, this 20-person company combines
  knowledge graphs, agentic workflows, and automation to
  reduce manual work in a major industry. Engineers work
  closely with the founders and have broad influence over the
  product and engineering culture. The role We are hiring a
  Mid-Level Software Engineer with 2 to 5 years of backend
  engineering experience to build and maintain production
  integrations and data pipelines. This is a hands-on Python
  role for someone who enjoys operating reliable systems,
  owning well-scoped projects, and growing into broader design
  responsibilities. What you'll do • Build and maintain API
  integrations, including authentication, pagination, rate
  limiting, retries, idempotency, asynchronous processing, and
  error handling. • Implement and operate data workflows using
  tools such as Prefect, Dagster, AWS Step Functions, or
  Airflow. • Investigate production issues, improve pipeline
  resilience, and reduce recurring incidents. • Deliver
  backend projects from requirements through implementation,
  testing, rollout, and monitoring. • Partner with senior and
  forward deployed engineers to turn customer insights into
  reliable product capabilities.

  Requirements

  What we're looking for • 2 to 5 years of backend software
  engineering experience and strong Python proficiency. •
  Experience building and maintaining production data or
  integration pipelines. • Hands-on experience with API
  integrations at scale and workflow orchestration tools. • A
  bachelor's degree in Computer Science from a reputable
  university. • A willingness to own day-to-day production
  maintenance, learn quickly, and grow with an early-stage
  team. • Ability to work from the Midtown Manhattan office
  three days per week. Bonus points • Experience at an early-
  stage B2B SaaS startup. • Hands-on AWS experience, including
  Lambda, Step Functions, ECS, SQS, or CDK. • Experience with
  AI tools, agentic workflows, or LLM integrations.

  Benefits

  Compensation and benefits • Base salary of $140K to $160K. •
  Competitive equity. • Full-time position. Location and work
  model • Hybrid in New York, NY, with three days per week in
  the Midtown Manhattan office. • Candidates should be based
  in or near New York City. • Visa sponsorship is not
  available.
