description: |
  Job Description & Responsibilities

  We're looking for a hands-on Embedded Software Engineer who
  will be responsible for software development and support of
  Persistent Systems’ industry-leading Wave Relay® mobile ad-
  hoc networking (MANET) system. You will be heavily involved
  in the development and implementation of a wide range of
  software (C/C++ and Java) in a Linux environment. This
  position provides the opportunity to work alongside our team
  of highly skilled senior software engineers to develop
  technology that enables our customers to solve their most
  difficult networking problems. 

  Position Responsibilities 

  - Use C/C++ to architect, develop, and implement software for
    embedded Linux hardware platforms
  - Develop software running on the Wave Relay® network, which
    may include network stack development, backend services,
    cryptographic and security features, Java applications,
    and other low-level programming activities.
  - Take an active role in our code review process and software
    development cycle
  - Collaborating with other developers and business leaders to
    build solutions to new problems
  - Support internal and external engineering activities,
    including travel to test locations, military facilities,
    and customer sites to directly support the testing,
    evaluation, and deployment of the Wave Relay® system

  Job Qualifications & Experience

  Minimum Qualifications 

  - Bachelor’s degree in computer science, computer engineering,
    or a related field or equivalent experience
  - At least 3 years of work experience developing software in
    C/C++
  - Experience with Java and JavaScript
  - Familiarity with REST and WS APIs and UNIX socket networking
  - Experience with unit testing and dependency injection
  - Must have a US Security Clearance or the ability to
    obtain one

  Preferred Qualifications 

  - Master’s degree in computer science, computer engineering,
    or a related field or equivalent experience
  - Experience with Linux kernel development
  - Experience with cryptographic software development in C/C++
  - Experience with UNIX shell scripting
  - Experience with SQL databases

  The total compensation for this role can vary from $133,000
  to $160,000 a year based on the selected individual's
  education and experience. Persistent Systems, LLC offers a
  comprehensive benefits package including medical, dental,
  vision, life, and disability insurance; paid time off;
  flexible spending accounts; 401(k) plan with company match;
  fitness membership reimbursement; tuition assistance; mental
  health benefits; and veterinary benefits. We will accept
  applications on a rolling basis until the role is filled.

  Company Overview

  Persistent Systems, LLC, a leader in defense technology, has
  been engineering secure Mobile Ad Hoc Networking (MANET)
  solutions since 2007, enabling joint forces and
  multinational coalitions to communicate, collaborate, and
  achieve mission success. Persistent created the Wave Relay®
  Ecosystem, a unified data network for unmanned systems,
  sensors, and software, empowering warfighters to accomplish
  tactical objectives across the operational area.  Built on
  the company’s Wave Relay MANET and Cloud Relay™
  technologies, this ecosystem delivers a global data fabric
  for military, first responders, and commercial users.
  Persistent has offices in New York City, Colorado, North
  Carolina, Montana, North Dakota, and Wyoming.
