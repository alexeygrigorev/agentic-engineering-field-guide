description: |
  ustwo is looking for an experienced Lead Full-stack Engineer
  to join our team on a 12-month fixed-term contract, working
  four days per week onsite in London. This is a predominantly
  full-stack development role, but extends to supporting
  mobile app teams, depending on the project. Work
  collaboratively to solve difficult problems and build great
  features in a cross-functional team of engineers, designers,
  product owners and delivery coaches. With your technical
  expertise you will manage project priorities, deadlines and
  deliverables. You will help design, develop, test, and
  deploy software. You will work on projects that make a
  meaningful impact for our clients, their customers, and the
  world. We work very hard to win interesting and challenging
  projects. Many of our client relationships span multiple
  years and projects. We work across the project lifecycle,
  from highly strategic discovery work to large-scale build
  projects and everything in between. Our teams work in a
  collaborative cross-discipline environment where everyone is
  responsible for quality, and hence encouraged to look beyond
  their immediate role. It’s also great fun working at ustwo!
  Candidates with experience in financial services, fintech or
  similarly regulated industries will be prioritised. What
  you’ll do

  - Design, develop, test, deploy, and improve digital products
    with a focus on full-stack development: from front-end, to
    backend, to infrastructure.
  - Work with product/delivery and design leads to ensure we're
    building high-quality products as well as delivering the
    project on time, on budget.
  - Expected to drive technical direction in projects and assure
    they meet scalability, robustness and security
    requirements.
  - Responsible for the technical approach to problems, and
    getting the team aligned on a technical vision.
  - Hands-on with projects, getting deep into code and being
    looked upon as a senior authority in software development.
  - Spend lots of time working with client teams to agree on
    technical approach and constraints, interacting with
    client stakeholders, and socialising tech designs to
    varied audiences
  - As a tech lead, part of your role is to uplift the tech team
    through mentoring, working collaboratively, and possibly
    line management if it’s a good fit for all involved.
  - Bring new ways of working and approaches to building
    products.
  - Accountable for the technical delivery of the project by the
    team.

  About you

  - Wide experience building secure, reliable, performant, and
    usable web applications.
  - Can identify and apply the best design patterns for the
    problem at hand.
  - Lead our team in implementation and delivery, working
    alongside product in dividing up work to be done and
    ensuring it’s specified to a high quality, and broken down
    for iterative delivery
  - Your technical experience includes leading a team with the
    technologies we typically use (and pushing bravely into
    those we don’t!), including:
    - Crafting the highest-possible quality user interfaces using
      HTML/CSS/JS.
    - Using JS/TS/Node or at least one other server-side language.
    - Deploying, securing, scaling, and monitoring in the cloud,
      with you bringing deep experience of at least one of
      AWS, Azure, or GCP.
    - Standing up/working with infrastructure as code (using tools
      like Terraform)
    - Modern front-end frameworks/libraries (React, Vue, Next,
      etc), with you bringing deep experience in at least one.
    - Selecting/working with databases (SQL / NoSQL / real-time,
      etc.).
    - API design and API integration / testing / implementation
      (i.e. GraphQL, REST, etc.).
    - Working with version control effectively.
    - Standing up/implementing automated testing (e.g. unit,
      integration, API, etc.)
    - Creating and maintaining CI/CD pipelines and typical
      integrations.
  - Experience designing for the most common non-functional
    requirements (NFRs) including performance, reliability and
    availability, usability and accessibility, security,
    maintainability, scalability, observability, portability,
    and compliance (e.g. GDPR).
  - Use AI as a core part of how you build, with good judgement
    on where human review matters. You are curious and keen to
    keep learning as the tools change. You set the standard
    for how the team uses AI and keeps quality high. You are
    well versed in Claude Code, MCP, and defining shared
    rules/skills for a team.
  - Experience working within agile frameworks such as Scrum /
    Kanban, leading agile ceremonies, and most importantly,
    embodying the agile principles.

  Nice to have experience

  - What we’re looking for here is potential and interest to
    learn. So, don’t stress if your skills don’t stretch
    across all these areas.
  - Knowledge of latest enhancements in core web technologies
    along with browser support – to enable good
    recommendations for our implementation choices.
  - Experience leading the development of accessible, WCAG-
    compliant user interfaces.
  - Interest in systems architecture, and demonstrated
    experience using diagrams to visualise complex ecosystems
    (or application designs) for varied audiences.
  - Experience with TDD and/or BDD and automating this using a
    framework (Mocha, Jest, Cucumber, Rspec, Capybara,
    Selenium, etc.).
  - Experience working with containerised services and
    orchestration
  - Experience delivering AI capabilities: context engineering,
    vector stores, RAG, on-device AI.

  What you’re like

  - Hands on, caring, resilient, patient, results-oriented, and
    humble person - you get things done.
  - Foster community and are interested in bringing people
    together and making your team a great place to work.
  - You are human, and recognise humanity in others. This means
    both learning together and being able to speak to others,
    regardless of level/position, and empathise with their
    concerns
  - Make great products that affect real people’s lives, at
    scale.
  - Recognise that “lead” is not just a level of technical
    acumen, but also a social responsibility that is
    accompanied by level of trust within our teams. You set an
    example for others to follow: curious, helpful, eager,
    creative, pragmatic, and positive.
  - Interested in exploring new technologies and sharing
    knowledge.
  - Welcome feedback and look to improve project development and
    understanding.
  - Communicate well with non-technical team members or
    stakeholders.
  - You don’t mind swerving out of your lane to take on the most
    valuable task when it’s needed, whether it’s in your job
    description or not.
  - Able to work to deadlines and in a fast-paced environment.
  - A team player.

  Benefits Why ustwo? We're a design and technology studio
  that believes thoughtful design creates better outcomes for
  people and businesses. You'll work alongside talented people
  from different disciplines who care about what they do,
  enjoy solving problems together and are always looking for
  ways to learn and improve. We value curiosity, collaboration
  and great work, and want everyone at ustwo to have the
  opportunity to contribute, grow and make an impact. We
  encourage applications from people with different
  backgrounds and experiences. If this role excites you, we’d
  love to hear from you, even if you don’t meet every
  requirement.

  Salary Range: £80,000 to £105,000 depending on experience
  Job benefits Our full benefits package is available to all
  permanent and fixed term contract employment, please see
  further details here. We will also be able to share a
  benefits deck to showcase local benefits.
