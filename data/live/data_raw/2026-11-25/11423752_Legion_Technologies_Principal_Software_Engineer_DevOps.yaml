  How We Determine What We Pay

  As a global employer, Legion determines pay for positions
  using local, national, and industry-specific survey data. We
  evaluate external equity and the cost of labor/prevailing
  wage index in the relative marketplace for jobs directly
  comparable to jobs within our company. Our posted salary
  range is based on national data and may be refined for a
  candidate's region/town/cost of living. For new hires, we
  strive to make competitive offers allowing the new employee
  room for future growth. Salaries will be based on the
  applicant’s location, level of experience, education, and
  specialized knowledge and skills. Additionally, we consider
  the external market rate, the amount we have budgeted
  internally, and internal equity within the company for the
  same position. An employee/candidate with a stronger skill
  set will receive higher pay.

  Job Applicant Privacy Policy

  This Job Applicant Privacy Policy (“Policy”) describes how
  Legion Technologies, Inc. (“Legion”, “we”, “us” and “our”)
  collects, uses, and discloses “personal information” as
  defined under California law from and about job applicants
  who are residents of California.

  This Policy does not apply to our handling of data gathered
  about you in your role as a user of our consumer-facing
  services. When you interact with us as in that role, the
  Legion Privacy Policy applies.

  - Types of Personal Information We Handle We collect, store,
    and use various types of personal information through the
    application and recruitment process. We collect such
    information either directly from you or (where applicable)
    from another person or entity, such as an employment
    agency or consultancy, background check provider, or other
    referral sources. This information includes:
    - Identification and contact information, and related
      identifiers such as full name, date and place of birth,
      citizenship and permanent residence, home and business
      addresses, telephone numbers, email addresses, and such
      information about your beneficiaries or emergency
      contacts.
    - Professional or employment-related information, including:
      - Recruitment, employment, or engagement information such as
        application forms and information included in a
        resume, cover letter, or otherwise provided through
        any application or engagement process; and copies of
        identification documents, such as driver’s licenses,
        passports, and visas; and background screening results
        and references.
      - Career information such as job titles; work history; work
        dates and work locations; information about skills,
        qualifications, experience, publications, speaking
        engagements, and preferences; and professional
        memberships
    - Education Information such as institutions attended,
      degrees, certifications, training courses, publications,
      and transcript information.
    - Legally protected classification information such as race,
      sex/gender, religious/ philosophical beliefs, gender
      identity/expression, sexual orientation, marital status,
      military service, nationality, ethnicity, request for
      family care leave, political opinions, and criminal
      history.
    - Other information such as any information you voluntarily
      choose to provide in connection with your job
      application.
  - How We Use Personal InformationWe collect, use, share, and
    store personal information from job applicants for our and
    our service providers’ business and operational purposes
    in the recruitment process such as: processing your
    application, tracking your application through the
    recruitment process, contacting references with your
    authorization, conducting background checks you authorize,
    and making hiring decisions. We will also use job
    applicant information for internal analysis purposes to
    understand the applicants who apply and to improve our
    recruitment process. We may sometimes need to use
    applicant information for legal purposes, such as in
    connection with any challenges made to our hiring
    decisions.
  - With Whom We Share Personal Information We will disclose job
    applicant personal information to the following types of
    entities or in the following circumstances (where
    applicable):
    - Internally: to other Legion personnel involved in the
      recruiting and hiring process.
    - Vendors: such as technology service providers, travel
      management providers, human resources suppliers,
      background check companies, and employment agencies or
      recruiters, where applicable.
    - Legal Compliance: when required to do so by law, regulation,
      or court order or in response to a request for
      assistance by the police or other law enforcement
      agency.
    - Litigation Purposes: to seek legal advice from our external
      lawyers or in connection with litigation with a third
      party.
    - Business Transaction Purposes: in connection with the sale,
      purchase, or merger.
  - How to Contact Us About this Policy – If you have any
    questions about this Policy, please contact
    privacy@legion.co.
