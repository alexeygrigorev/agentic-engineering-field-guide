description: |
  The Trade Desk is a global technology company and the
  world’s leading independent platform for digital
  advertising, with over 3,000 employees across more than 30
  offices. Our technology helps advertisers reach the right
  audiences across the open internet — from streaming TV and
  podcasts to mobile apps, news, and more.   Advertising
  powers the content people love. By making it more
  transparent, effective, and responsible, we help support
  trusted journalism, quality entertainment, and creators
  worldwide. The world’s brands and agencies rely on us to
  reach their customers and grow their businesses responsibly.
  The scale of our platform brings unique technical challenges
  — from processing massive datasets in real time to building
  systems that operate reliably on a global scale. When you
  work here, your impact is worldwide. We welcome diverse
  perspectives, encourage curiosity, and build teams that
  learn from one another. If you’re driven to solve meaningful
  challenges, we’d love to meet you.

  What we do

  Our Software Engineers are end-to-end owners who have the
  opportunity to participate in many aspects of designing,
  building, and delivering data-focused products for our
  stakeholders.

  At The Trade Desk, we believe that each opportunity to
  engage with consumers is unique. User experience can make or
  break our business. This means our users must have all the
  flexibility to harness our system’s growing power and
  present meaningful insight from the petabytes of data
  streaming through our platform with unparalleled ease.

  Our system performs every day, 24/7, serving global traffic.
  We deliver features to improve our clients’ abilities to
  make real-time decisions and troubleshoot campaigns with
  simple-to-use interfaces and high-performance data
  interactions. To improve our users’ day-to-day lives, we
  collaborate closely with user experience and product
  management organizations to ensure consistent, modern
  designs as well as the right balance of requirements. Our
  frontend developers work up and down the stack (client to
  server) to deliver these world-class experiences.

  What you’ll do

  Some of the work that you will be doing to help us deliver
  on our mission is:

  - Design, build, deliver, and own full lifecycle development
    software from inception to production
  - Demonstrate a firm grasp of the entire software development
    lifecycle
  - Drive complex changes involving multiple components
  - Deliver quality changes, including automated tests, metrics,
    and monitoring
  - Collaborate with team members to deliver features
  - Guide and review changes to product features in line with
    product roadmaps
  - Implement and maintain product features
  - Validate changes to ensure high quality product releases
  - Work in a distributed system environment
  - Understand the business objectives behind the code
  - Understand system architecture fundamentals through self-
    directed learning
  - Lead others through example, mentorship, teaching, and/or
    participate in hiring activities

  We are a global team with different backgrounds,
  experiences, and perspectives. To complement this team, you
  will welcome ideas that are different from your own and be
  well-versed in building from common ground to value, seek
  out, and foster invisible and visible dimensions of
  diversity.

  Who you are

  Our culture is much deeper than just having fun together
  (though we do that well, too). We take pride in our
  engineers being trust-builders, generous givers, scrappy
  problem solvers, and gritty pursuers of excellence. You do
  not have to meet all the requirements below, but we believe
  that people who meet most of them will have a higher
  likelihood of succeeding in this role:

  - You are comfortable working on an agile, distributed team
    spanning multiple time zones and continents.
  - You are able to communicate effectively across both
    technical and non-technical audiences.
  - You have a solid understanding of computer science and
    engineering fundamentals.
  - You are passionate about building beautiful and seamless
    user interfaces.
  - You have love for, and desire to advance, the state of the
    art of technology.
  - You are trained in JavaScript/TypeScript.
  - You have 4+ years of software development engineering
    experience.
  - You have a Bachelor’s/Master’s level degree in computer
    science or relevant engineering-related field or
    equivalent experience. Not everyone has the same level of
    access to opportunities. What is most important to us is
    what and how you can contribute, which is why our
    consideration is not limited by the level of education you
    have.
  - You have additional nice-to-have experience in the following
    areas: languages/technology on the server-side (C#, Java,
    NodeJS, SQL), building enterprise level services or web-
    based user experiences, knowledge of front-end frameworks
    (React/Redux).

  A variety of technical opportunities is one of the best
  things about working at The Trade Desk as a software
  engineer, which is why we do not expect you to know every
  technology we use when you start. What we care about is that
  you can learn quickly and find solutions to complex problems
  using the optimum tools for the job. What you know is less
  important than how well you learn and innovate. We are not
  seeking engineers who know all the answers; we need
  engineers who can invent answers no one has thought of yet
  and find answers to the questions yet to be asked.

  In accordance with various US state laws, the range provided
  is the Trade Desk's reasonable estimate of the base
  compensation for this role. The actual amount may differ
  based on non-discriminatory factors such as experience,
  knowledge, skills, and location.  All employees may be
  eligible to become The Trade Desk shareholders through
  eligibility for stock-based compensation grants, which are
  awarded to employees based on company and individual
  performance. The Trade Desk also offers other compensation
  depending on the role such as variable compensation-based
  incentives and commissions. Plus, expected benefits for this
  role include comprehensive healthcare (medical, dental, and
  vision) with premiums paid in full for employees and
  dependents, retirement benefits such as a 401k plan and
  company match, short and long-term disability coverage,
  basic life insurance, well-being benefits, reimbursement for
  certain tuition expenses, parental leave, sick time of 1
  hour per 30 hours worked, vacation time for full-time
  employees up to 120 hours thru the first year and 160 hours
  thereafter, and around 13 paid holidays per year.  Employees
  can also purchase The Trade Desk stock at a discount through
  The Trade Desk’s Employee Stock Purchase Plan.

  The Trade Desk also offers a competitive benefits package.
  Click here to learn more.

  Note: Interns are not eligible for variable incentive awards
  such as stock-based compensation, retirement plan, vacation,
  tuition reimbursement or parental leave

  At the Trade Desk, Base Salary is one part of our
  competitive total compensation and benefits package and is
  determined using a salary range. The base salary range for
  this role is

  $103,200—$189,200 USD

