description: |
  Engineering Manager (m/f/x)

  Location: EU/UK

  (Remote)



  Who You’ll Work For:



  At Makersite, we're pioneering the future of sustainable
  product development and digital collaboration. As a leading
  platform for product lifecycle management (PLM), we empower
  companies to make smarter, more sustainable decisions across
  their entire supply chain. Our cutting-edge software enables
  teams to design, prototype, and manufacture with
  transparency, efficiency, and responsibility—reducing
  environmental impact while optimizing performance.

  We're a fast-growing, innovative company that thrives on
  creativity, collaboration, and continuous learning. If
  you're passionate about technology, sustainability, and
  creating meaningful impact, we’d love to hear from you. Join
  us and be a part of shaping the future of manufacturing and
  product innovation.



  Who we're looking for:



  As part of our growing team, you will play a key role in
  shaping the future of sustainable product development. We’re
  looking for innovative, driven Engineering Managers who are
  passionate about technology and sustainability to join us in
  building tools that enable companies to make smarter, more
  responsible decisions. In this role, you’ll have the
  opportunity to collaborate with talented professionals,
  contribute to cutting-edge projects, and help drive the
  digital transformation of industries worldwide. If you're
  ready to make an impact and contribute to meaningful change,
  we want to hear from you!

  This role is a fixed, permanent position. All successful
  applicants will receive a permanent employment contract
  regardless of location.



  The role:

  The role is responsible for driving engineering delivery,
  accountability and operational excellence across multiple
  teams. It translates evolving business needs into clear
  priorities, ensures effective project execution, and
  develops engineering talent while maintaining high technical
  standards. The role also focuses on improving processes,
  removing blockers, managing stakeholder and enterprise
  customer expectations, and building scalable team structures
  that support sustainable growth, strong performance and
  employee retention.

  - Engineering Leadership: 3–5+ years of experience managing
    large or multiple engineering teams.
  - Enterprise SaaS Experience: Proven experience in B2B
    enterprise SaaS environments.
  - Entrepreneurial Mindset: Adaptable, innovative and
    comfortable challenging the status quo in a fast-paced
    environment.
  - Stakeholder Management: Builds strong relationships and
    aligns diverse stakeholder priorities.
  - Communication: Communicates clearly, precisely and
    transparently, including during difficult conversations.
  - Accountability & Results Orientation: Takes ownership,
    follows through on commitments and proactively drives
    results.
  - People Leadership & Emotional Intelligence: Demonstrates
    empathy, builds trust, navigates conflict and actively
    supports team development.
  - Adaptability & Resilience: Responds effectively to change,
    ambiguity and new challenges.
  - Pragmatic Decision-Making: Balances ambition with realistic
    expectations, sound judgement and sustainable delivery.
  - Growth Mindset: Curious, open to new ideas and motivated by
    continuous improvement.

  - Residing in and legally permitted to work in the EU or UK.



  What We Offer:



  - Competitive Salary – We reward your skills and experience
    with a compensation package that reflects your value.

  - 30 Days Paid Time Off – Take the time you need to recharge
    and maintain a healthy work-life balance.

  - Remote-First Flexibility – Work from anywhere in EU/UK, with
    the option to collaborate in person at our offices in
    Stuttgart, Berlin (role dependent).

  - Generous Learning & Development Budget – We invest in your
    growth, providing ample resources for personal and
    professional development.

  - Choose Your Ideal Work Equipment – Whether you prefer Apple
    or Microsoft, we’ll equip you with the tools you need to
    excel.
  - Save on your bicycle leasing through JobRad® - German-based
    employees.



  The Experience:



  - Purpose-Driven Work – Build something meaningful. Here,
    you’re not just creating another app; you’re contributing
    to a transformative vision that you can be proud of.

  - Great Colleagues – Join a team that’s open, transparent, and
    international. We value inclusivity and foster a culture
    of collaboration and mutual respect.

  - Work-Life Balance – As a remote-first company, we trust you
    to do your best work, your way. You have the flexibility
    to work when it suits you, ensuring a healthy balance
    between personal and professional life.

  - Pride in Impact – We're already making a significant
    difference with global, well-known customers who share our
    vision. Be part of something that matters.

  - Stability with Ambition – With realistic growth plans, we’re
    committed to changing the way things are made—without
    sacrificing our ambitious goals for innovation and impact.





  If you want to find out more about what it’s like to work at
  Makersite, check out our Careers Page here



  Diversity and Inclusion

  If you have a medical condition or an individual need for an
  adjustment to our process, and you believe this may affect
  your ability to be at your best – please let us know so we
  can talk about how we can best support you and make any
  adjustments that may be needed.



  At Makersite, we are dedicated to fostering an environment
  that champions diversity, equity, inclusion, and belonging.
  We believe that diverse teams drive innovation and success,
  and we are proud to be an equal opportunity employer. We
  welcome applicants from all backgrounds and will consider
  all applications regardless of age, disability, gender
  identity, marital status, pregnancy or maternity, race,
  nationality, religion, sex, sexual orientation, or any other
  status protected by applicable law. Rest assured, all
  applications will be handled with the utmost
  confidentiality.
