description: |
  We’re Capital on Tap 👋 💳 Capital on Tap started because
  small businesses were underserved. Big banks were slow,
  their products weren't fit for purpose, and small business
  owners often couldn't access what they needed. We set out to
  fix that.

  Today we're a financial platform - not just a credit card
  company. We offer a best-in-class business credit card, SME-
  focused spend management platform, a savings product that
  hit £1 billion in funds within its first year, and a growing
  suite of tools and financial products that make running a
  small business easier.

  1,000+ employees, £20bn in annual card spend, 200,000+
  customers, 17,000+ Trustpilot reviews averaging 4.7 stars,
  and we're profitable. We’ve done a pretty good job so far,
  but we’re just getting started!

  📍 London  / Porto | 🏢 2 days a week

  The Team 🚀 You’ll join one of our platform teams (XP
  Platform, within Engineering). We build the foundations that
  every web and mobile app at Capital on Tap sits on: the
  design system and shared UI packages, the app shell, and
  core flows such as sign-in, settings and protected actions.
  Product teams build their features on top of this, so we set
  the patterns, prove they work, and help other teams adopt
  them.

  Right now the focus is the Customer Portal, the signed-in
  experience our customers use every day. We work very closely
  with Design, talk to Product early about what’s coming, and
  partner with the Engineering Architecture Team on where the
  frontend is heading. We also run a monthly demo for the
  whole department to share what we’ve built.

  The Role This role is for an engineer who wants to make web
  development the focus of their career. You might be a
  backend or mobile engineer who has picked up some React
  along the way, or someone who has built a few things in
  their own time and wants to do it properly. You don’t need
  to be an expert yet. What matters is real interest in the
  web and the drive to get good at it.

  You’ll join a team of experienced web and mobile engineers
  and learn the craft on real work, not side projects. You’ll
  pair with seniors, have your code reviewed by people who
  care about it, and over time take full ownership of features
  in packages that the rest of the department builds on.
  Because those packages are used by other engineers, you’ll
  learn to think about developer experience as well as what
  the customer sees.

  You already know how Capital on Tap works, which products we
  have and how our teams fit together. That context is useful
  here from day one.

  What You’ll Be Doing

  - Build and maintain components, features and shared packages
    in React and TypeScript, with support from senior
    engineers
  - Work with Design to bring our design system to life in code,
    so customers get a consistent experience across the
    product
  - Help with our in-flight migrations, such as moving off AntD
    onto Base UI and adopting Zustand, React Hook Form and Zod
  - Write unit, integration and visual tests for the work you
    ship
  - Pick up bugs and production issues, and learn how our web
    platform behaves in the real world
  - Take part in refinement and planning, and give technical
    input on the work you’re picking up
  - Try out AI tools in your day-to-day work and share what
    helps with the team

  We’re Looking For 🔎

  - Some hands-on experience with React, TypeScript or modern
    JavaScript, whether at work, on a side project or through
    self-study
  - Solid engineering fundamentals from your current role, in
    any stack
  - A genuine interest in web development and in building good
    user experiences
  - Good testing habits, or a willingness to build them
  - Experience working in an Agile team
  - Curiosity and a willingness to ask questions while you learn
    something new
  - A proactive, supportive and collaborative way of working

  How We’ll Support You

  - A senior engineer to pair with and learn from as you get
    going
  - Thorough code reviews focused on helping you improve, not
    just approving the change
  - Time to learn the stack properly, including the parts that
    are new to you
  - A clear picture of what good looks like at your level, and
    regular conversations about your progress towards Senior

  Our Tech Stack

  - Frontend: React, Next.js, TypeScript
  - UI and state: Base UI (migrating from AntD), Zustand, React
    Hook Form, Zod
  - Testing: Unit, integration and visual tests

  Our Values

  - Be A Buddy
  - Why Not Today
  - Just Pilot

