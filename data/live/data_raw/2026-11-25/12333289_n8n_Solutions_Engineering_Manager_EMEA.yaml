description: |
  The AI orchestration of your wildest imagination.

  n8n is the open workflow orchestration platform built for
  the new era of AI. We give technical teams the freedom of
  code with the speed of no-code, so they can automate faster,
  smarter, and without limits. Backed by a fiercely inventive
  community and 500+ builder-approved integrations, we’re
  changing the way people bring systems together and scale
  ideas for impact.

  Since our founding in 2019, we’ve grown into a diverse team
  of over 260 - working across Europe and the US, connected by
  a shared builder spirit and with our centre of gravity in
  Berlin. Along the way, we’ve:

  - Cultivated a community of more than 650,000 active
    developers and builders
  - Earned 190K+ GitHub stars, making us one of the world’s Top
    40 most popular projects
  - Backed by top investors, from Sequoia’s first German seed to
    our SAP's recent strategic investment - bringing us to a
    $5.2bn valuation

  That’s the company we’ve built. Now we’d love to see what
  you can build. If you’re applying, try n8n out - whether
  you’re technical or not - and share a screenshot of your
  first workflow with us. The easiest place to start is here:
  app.n8n.cloud/register.

  We’re in a defining moment of an incredible journey. Come
  and build with us.

  🎯 Your main goal will be to build, lead, and scale a high-
  performing Solutions Engineering team that accelerates
  enterprise growth, delivers exceptional technical sales
  experiences, and helps customers unlock the full potential
  of n8n's AI-powered automation platform.

  As we rapidly expand across EMEA, you'll play a key role in
  developing our Solutions Engineering function and enabling
  your team to succeed. Here's how you'll make an impact:

  Lead and develop a high-performing Solutions Engineering
  team

  - Manage, coach, and develop a regional team of Solutions
    Engineers, fostering a culture of ownership,
    collaboration, and continuous improvement.
  - Support team growth through hiring, onboarding, mentoring,
    and career development, ensuring your team is equipped to
    succeed as we scale.
  - Build effective team structures, processes, and ways of
    working to support regional expansion and evolving
    business needs.

  Drive technical excellence throughout the sales cycle

  - Guide your team through complex enterprise sales cycles,
    from initial discovery and technical validation to
    negotiations and deal closure.
  - Coach Solutions Engineers on delivering impactful product
    demonstrations, proofs of concept, and technical solutions
    that address customer challenges.
  - Provide strategic and hands-on technical guidance when
    needed, helping your team navigate complex opportunities
    and accelerate new business and account expansion.

  Partner across teams to accelerate revenue growth

  - Collaborate closely with Sales and Sales leadership to align
    technical strategies with commercial priorities and
    support successful enterprise deals.
  - Partner with Product, Engineering, Marketing, and Product
    Marketing to share customer insights, resolve technical
    challenges, and strengthen sales enablement.
  - Coordinate with post-sales teams and Forward-Deployed
    Engineers to ensure smooth customer handoffs and support
    technical validation for expansion opportunities.

  REQUIREMENTS

  Must-haves

  - 👥 Experienced pre-sales leader: You have at least 2 years of
    experience managing and developing pre-sales or Solutions
    Engineering teams, ideally within a high-growth B2B
    software environment.
  - 🚀 Proven people manager: You have a track record of
    coaching, mentoring, and developing technical talent while
    building high-performing teams and supporting their
    growth.
  - 🤝 Enterprise sales expertise: You have strong experience
    navigating complex technical sales cycles, including
    discovery, demonstrations, proofs of concept, technical
    validation, and negotiations.
  - 💻 Strong technical foundation: You have the technical depth
    to understand complex software solutions, advise your
    team, and engage confidently with technical stakeholders.
  - 🔗 Relevant industry experience: You've worked with technical
    software products in areas such as data platforms,
    databases, data integration, or data flows, and understand
    the challenges faced by technical buyers.
  - 🌍 Regional location: You're based in the UK, Ireland, or
    Germany to support our growing EMEA Solutions Engineering
    organisation.

  Nice-to-haves

  - 🤖 AI-first mindset: You're excited about the potential of
    AI-driven automation and have experience working with AI
    technologies or within an AI-focused company.
  - 👨‍💻 Coding experience: You have hands-on experience with
    programming or scripting, enabling you to better
    understand technical integrations and automation
    workflows.
  - ⚡ Technical software vendor experience: You've worked at a
    technical software vendor, ideally in a fast-growing SaaS
    environment, and understand how to scale pre-sales teams
    alongside a rapidly expanding sales organisation.

  Why join us?

  At n8n, you'll have the opportunity to shape and scale a
  critical function at one of Europe's fastest-growing
  startups. You'll build and develop a regional Solutions
  Engineering team, influence how we win complex enterprise
  opportunities, and help bring the power of AI-driven
  automation to businesses worldwide.

  You'll have real ownership over how your team grows,
  develops, and operates, with the visibility and cross-
  functional influence to make a meaningful impact on our
  commercial success. You'll join a collaborative, remote-
  first company that values autonomy, experimentation, and
  continuous learning, where your leadership will directly
  contribute to our next stage of growth.

  Sound like a challenge you're excited to take on?

  Apply now — and help us build the future of automation.

  n8n is an equal opportunity employer and does not
  discriminate on the basis of race, religion, colour,
  national origin, gender, sexual orientation, gender
  identity, age, marital status, veteran status, or disability
  status.

  We can sponsor visas to Germany; for any other country, you
  need to have existing right to work.

  Our company language is English.

  You care about diversity and inclusion? We do too! Check out
  our Diversity, Inclusion and Belonging initiatives at n8n
  (https://www.notion.so/n8n/Diversity-inclusion-and-
  belonging-n8n-c1bec2fff536422d868b1a438d990e35).

  Location disclaimer: If you see multiple job postings for
  the same role, it is most likely because we're hiring
  remotely for this role and posting in different locations to
  make sure every potential candidate can see the role. Please
  apply to the location you're the most likely to work from in
  the future.

  Benefits

  - Competitive compensation 💸 – We offer fair and attractive
    pay.
  - Ownership 💪 – Our core value is to “empower others,” and we
    mean it—you’ll get a slice of n8n with equity.
  - Work/life balance 🏖️ – We work hard but ensure you have time
    to recharge:
    - Europe: 30 days of vacation, plus public holidays wherever
      you are.
    - US: 20 vacation days, 8 sick days, plus public holidays
      wherever you are.
  - Health & wellness 🩺 –
    - Europe: We provide benefits according to local country
      norms.*
    - US: Multiple low-premium, low-deductible medical plans with
      coverage for individuals and families—plus a no-cost
      premium HDHP option with a pre-seeded HSA—along with
      dental and vision coverage.
  - Future planning 💰 –
    - Europe: We provide pension contributions according to local
      country norms.*
    - US: 401(k) retirement plan with a 4% employer match.
  - Financial security 🛡️ –
    - Europe: We provide benefits according to local country
      norms.*
    - US: Company-paid short-term and long-term disability
      insurance, plus life insurance to support you and your
      loved ones.
  - Career growth 📈 – We hire rising stars who grow with us!
    You’ll get €1K (or equivalent) per year to spend on
    courses, books, events, or coaching to level up your
    skills.
  - A passionate team 🤩 – We love our product, and we prove it
    with regular hackathons where we see who can build the
    coolest thing with it!
  - Remote-first 🌏 – Our team works remotely across Europe, with
    regular off-sites for team bonding. Some roles, like sales
    in the US, are hybrid—please check the job description.
  - Giving back 🤝 – We're big fans of open source, and you'll
    get $100 per month to support projects you care about.
  - Transparency 🙏 – We all know what everyone’s working on, how
    the company is doing—the whole shebang.

  *Country and/or State specific details provided in your
  employment agreement.
