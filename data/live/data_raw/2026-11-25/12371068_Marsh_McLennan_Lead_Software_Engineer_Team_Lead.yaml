description: |
  Company:Marsh Corporate

  Description:

  We are seeking a talented individual to join our Client
  Analytics & Technology (CAT) team at Mercer, a Marsh
  business. This role will be based in London. This is a
  hybrid role that has a requirement of working at least two
  days a week in the office.

  The CAT team builds and runs internal and client-facing
  analytics and technology products across Mercer businesses.
  You will be the hands-on Tech Lead for a small UK-based team
  working closely with an India engineering pod, owning
  technical direction, delivery, and day-to-day engineering
  leadership. The role requires strong domain partnership
  (risk advisory / consulting stakeholders) alongside
  pragmatic software engineering and architecture judgment.

  We will count on you to:

  - Lead end-to-end delivery of CAT products (e.g., Concierge an
    agentic AI workflow tool, Prism a Mercer knowledge fabric
    for scheme data, and similar initiatives), from problem
    framing and design through build, release, and support.
  - Translate risk advisory / consulting needs into clear
    technical requirements, user stories, and solution
    designs; partner with stakeholders through UAT and
    rollout.
  - Own the backend and integration approach (APIs, data flows,
    security, RBAC), and ensure solutions are scalable,
    maintainable, and well documented
  - Provide technical leadership for a distributed team (London
    + India): sprint planning input, code reviews, mentoring,
    and raising engineering standards.
  - Drive quality and operational readiness: testing strategy,
    CI/CD, release notes, production deployment governance,
    and incident/root-cause management.
  - Identify and deliver pragmatic AI/ML opportunities where
    valuable (e.g., agentic workflows, RAG/LLM-enabled
    capabilities) with appropriate governance and human-in-
    the-loop controls.

  What you need to have: 

  - Experience managing a team, as this role involves leading a
    team of 5 as well as contributing hands-on coding work.
  - Proven experience as a Tech Lead / Lead Engineer delivering
    production software, including hands-on coding and code
    review ownership.
  - Strong backend engineering skills (API design, data
    modelling, performance) and experience building secure,
    role-based applications.
  - Experience working directly with business stakeholders in a
    financial firm, with the ability to explain technical
    tradeoffs clearly.
  - Demonstrated ability to lead delivery with an agile team
    across time zones (e.g., sprint ceremonies, prioritization
    support, and team coordination).

  What makes you stand out?

  - Prior experience in UK pensions covenant / advisory /
    trustee-facing tools, and strong ability to connect
    technical design to covenant outcomes.
  - Experience with Python-based services (e.g., FastAPI) and
    modern web stacks (e.g., Next.js/React.js) in real-world
    delivery.
  - Practical experience delivering GenAI/agentic solutions
    (prompt engineering, RAG, governance patterns) in
    production or controlled enterprise environments.
  - Worked with data pipelines / SQL databases / Mongo databases
    or Document storages.

  Why join our team:

  - We help you be your best through professional development
    opportunities, interesting work and supportive leaders.

  - We foster a vibrant and inclusive culture where you can work
    with talented colleagues to create new solutions and have
    impact for colleagues, clients and communities.

  - Our scale enables us to provide a range of career
    opportunities, as well as benefits and rewards to enhance
    your well-being.

  Marsh (NYSE: MRSH) is a global leader in risk, reinsurance
  and capital, people and investments, and management
  consulting, advising clients in 130 countries. With annual
  revenue of over $27 billion and more than 95,000 colleagues,
  Marsh helps build the confidence to thrive through the power
  of perspective. For more information, visit marsh.com, or
  follow us on LinkedIn and X.

  Marsh is committed to embracing a diverse, inclusive and
  flexible work environment. We aim to attract and retain the
  best people and embrace diversity of age background, civil
  partnership status, disability, ethnic origin, family
  duties, gender orientation or expression, gender
  reassignment, marital status, nationality, parental status,
  personal or social status, political affiliation, race,
  religion and beliefs, sex/gender, sexual orientation or
  expression, skin color, or any other characteristic
  protected by applicable law. We are an equal opportunities
  employer. We are committed to providing reasonable
  adjustments in accordance with applicable law to any
  candidate with a disability to allow them to fully
  participate in the recruitment process. If you have a
  disability that may require reasonable adjustments, please
  contact us at reasonableaccommodations@marsh.com.

  Marsh is committed to hybrid work, which includes the
  flexibility of working remotely and the collaboration,
  connections and professional development benefits of working
  together in the office. All Marsh colleagues are expected to
  be in their local office or working onsite with clients at
  least three days per week. Office-based teams will identify
  at least one “anchor day” per week on which their full team
  will be together in person.
