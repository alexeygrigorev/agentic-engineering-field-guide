  growth and adventure, we can't wait to meet you!

  ABOUT HTB:

  Hack The Box is the leading cyber readiness platform for the
  agentic era, battle-testing and upskilling both humans and
  AI agents to enhance organizational cyber resilience.
  Trusted by the Fortune 500, government agencies, and MSSPs,
  the platform delivers threat-informed learning paths
  consisting of real-world scenarios in gamified labs and
  live-fire simulations that build and validate offensive and
  defensive cyber capabilities. With a loyal community of more
  than 4 million members and 800+ enterprise customers, Hack
  The Box empowers teams and intelligent systems alike to
  strengthen cyber defenses and reduce breach risk
  effectively.

  Rapidly growing its international footprint and reach, Hack
  The Box is headquartered in the UK, with additional offices
  in the US, Australia, and Greece.

