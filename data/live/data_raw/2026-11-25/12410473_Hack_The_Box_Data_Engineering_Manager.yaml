description: |
  Welcome! Super excited you dropped by 🥳 Let's redefine cyber
  security expertise standards and connect business -
  community through highly engaging hacking experiences. (Find
  out more insights about Hack The Box culture in our career
  site).

  ✨The core mission of the Data Engineering Manager:

  In your first 6 months, you'll step into the day-to-day
  leadership of a 5 person data engineering squad, help drive
  our Snowflake-to-BigQuery migration across the finish line,
  and establish delivery rhythms, SLOs, and quality gates that
  keep our pipelines boringly reliable. Over the next year,
  you'll focus on execution and technical maturity: rolling
  out data contracts with upstream service teams, optimizing
  our GCP infrastructure, and ensuring our data platform
  reliably feeds HTB's AI/ML and Analytics workloads.

  🏢 Location &  Work Mode:

  - Europe/Greece

  - Choose between fully remote work across Europe or relocating
    to our Athens Tech Hub with relocation support.

  Fully Remote / Hybrid (2 days in the office, 3 days remote,
  plus one month of work from anywhere) - If only in Greece:
  When hiring in Greece, we’re open to candidates from all
  locations. Those based within 55 km of our Athens office
  will follow a hybrid work model. For candidates located
  beyond that radius, a fully remote arrangement is available.

  ✈️ Relocation

  - We offer a 10% relocation bonus on the annual salary to
    support your move.
  - In addition, you would benefit from a 50% tax reduction on
    your income as part of the relocation.
  - We'll support you with accommodation during the first few
    weeks

  🍺 The fellowship you’ll be joining:

  You'll lead a focused squad of 5 Data Engineers building and
  operating streaming and batch pipelines (Pub/Sub, Dataflow,
  Kafka, Airflow) and maintaining our BigQuery/Bigtable core
  platform. You will report to the Director of Platform and
  work closely alongside the Analytics Engineering, BI, and
  AI/ML infrastructure teams (self-hosted GPU inference, LLM
  platform) within the same department. Your key day-to-day
  partners outside the squad: Software Development,
  Infrastructure, Product Engineering, and Analytics Engineers
  who rely on your team's pipelines and data availability to
  build downstream models and products.

  ⚔️ Technology tools & weapons you’ll be using:

  - Google Cloud Platform: BigQuery, Pub/Sub, Dataflow (Apache
    Beam), Bigtable, Vertex AI Feature Store
  - Distributed processing: Apache Flink / Spark
  - Streaming & messaging: Kafka (Aiven), Pub/Sub with Avro
    schemas and schema registry (Karapace)
  - Orchestration & transformation: Airflow, Python, SQL
  - Governance & DevOps: Data contracts, CI/CD quality gates,
    infrastructure-as-code

  🚀 The adventures that await you after becoming Data
  Engineering Manager at Hack The Box:

  - Manage, mentor, and grow a squad of 5 data engineers,
    running 1:1s, sprint ceremonies, code/architecture
    reviews, and hiring to fill key skill gaps
  - Own the sprint-to-sprint delivery of the data engineering
    roadmap: break down quarterly goals into executable tasks,
    manage dependencies, and keep delivery commitments
    transparent
  - Execute the consolidation onto our GCP-native architecture
    (BigQuery, Pub/Sub, Dataflow, Bigtable), completing the
    migration off legacy warehouses and CDC pipelines
  - Implement practical data governance across engineering
    teams: enforce schema contracts, compatibility tiers, and
    CI/CD quality gates between upstream producers and the
    platform
  - Maintain strong operational discipline: monitor SLOs for
    data freshness and pipeline reliability, track BigQuery
    compute/storage costs (FinOps), lead incident response,
    and enforce documentation standards
  - Collaborate closely with the AI/ML team to ensure low-
    latency, reliable data ingestion for feature stores, model
    training, and AI product telemetry
  - Communicate technical trade-offs, project status, and
    infrastructure needs clearly to department leadership and
    peer engineering managers

  🏆 Skills, knowledge, and experience points required to
  unlock the role of Data Engineering Manager at Hack The Box:

  - 5–7+ years in data engineering, including 1–3+ years
    directly managing or tech-leading a squad of 3+ data
    engineers in a product or SaaS environment
  - Proven track record building and operating a modern cloud
    data platform — ideally GCP (BigQuery, Pub/Sub, Dataflow);
    strong experience with another major cloud data stack also
    counts
  - Strong hands-on fluency with streaming and batch
    architectures: Kafka or Pub/Sub, schema management
    (Avro/Protobuf, schema registries), Python, and SQL
  - Experience implementing data quality and governance
    practices that engineers actually adopt: schema
    validation, CI/CD gates, lineage, and alerting
  - Pragmatic engineering leadership: able to jump into
    architecture discussions and PR reviews with your team
    while keeping sprints unblocked and stakeholders informed
  - Bonus XP: exposure to ML/AI data infrastructure (feature
    stores, model telemetry), cybersecurity or
    gaming/community-driven products, ClickHouse

  What your Hack The Box adventure will have in store:

  - 🎯You'll have the exhilarating opportunity to contribute to a
    product that is highly appreciated by users and the
    cybersecurity community at large
  - 🎯 You'll experience a highly supportive and caring
    environment, fostering growth, flexibility, and autonomy
  - 🎯 You'll embark on an exciting journey of continuous
    learning and problem-solving, leveling up as our
    organization grows
  - 🎯 Most importantly, you'll have a blast at HTB 🥳 because fun
    is an essential ingredient in our recipe for success! Just
    wait until you see our global meet-ups!

  💰 The gems you’ll be enjoying as a Data Engineering Manager:

  - We have also other benefits that will keep you happy:
  - 25 annual leave days
  - Paid parental leave
  - Home Office Allowance
  - Dedicated budget for training and professional development,
    participation in conferences
  - State-of-the-art equipment
  - Full access to the Hack The Box lab offerings; so you can
    learn how to hack 😉
  - Flexibility in working hours

  Our benefits package is designed to provide strong support
  to our team, but it may vary depending on location and type
  of employment (e.g., UK, US, Greece, Australia, or
  engagement through an Employer of Record or contract).

   🗺️ The Quest of Becoming Hack The Box’s Data Engineering
  Manager:

  - Level 1: To complete level one’s objective, submit your
    application.
  - Level 2: Meet the Talent Acquisition team. Level’s
    objective: highlight your past achievements, ambitions,
    and values.
  - Level 3: Meet the hiring team. Level’s objective: connect
    with the hiring team and share with them your
    achievements.
  - Level 4: Have a technical session that aligns with day-to-
    day job-related tasks and responsibilities.
  - Level 5: Congratulations! Not many reach this level 💪.
    Level’s objective: have a constructive, final conversation
    with senior leadership to explore the role and your future
    at HTB.
  - Level 6: You've officially received an offer from HTB! To
    complete the last level and the Quest, all you need to do
    is accept the offer.
  - Quest complete. Congratulations, you’re officially one of us
    🥳🎉🎇Your next quest: complete the onboarding.

  Hack Your Career, Today. Join us in this epic adventure of
  cybersecurity at Hack The Box! 🚀🔒💻

  At Hack The Box, we are on a quest to find the most
  exceptional and enthusiastic talent to join our team.
