description: |
  About Noto

  Noto is the AI-native operating system for after-school
  businesses: tutoring centers, music schools, sports
  academies, and dance studios. About 360,000 of these
  businesses operate in the U.S., and millions of kids pass
  through them every week.

  They’re run by people who are passionate about teaching but
  spend their evenings managing schedules, payroll, and parent
  emails, often in software built in 2011, or in spreadsheets
  and sticky notes.

  Noto replaces the entire stack with a modern platform for
  scheduling, billing, payroll, marketing, CRM,
  communications, classroom management, and student and parent
  portals. We bring the whole back office into one place, with
  AI agents that automate a lot of the manual work.

  A school that spends less time on paperwork can teach more
  kids, hire another teacher, and grow its business! Come help
  us build the best operating system for these small-business
  owners!

  (Fall 2026 team offsite: magic shows, lawn games, trivia,
  friendly competition, bartender-made drinks, and a cookout
  🔥)

  Team

  We’re a team of about 20 in New York City: smart,
  collaborative, ambitious, and genuinely nice to work with!

  AJ Ding (CEO): second-time founder who previously built an
  AI recruiting company. ML engineer and data scientist at
  Quora, Lyft, and Meta. Studied statistics at Yale and grew
  up in a family of small-business owners.

  Steve Wang (CTO): former Head of Engineering at Nitra, an
  a16z-backed vertical SaaS company for doctors. Previously
  worked in data science and engineering at Lyft. Studied math
  at Harvard.

  We’re backed by top-tier VCs and operators who’ve built
  multi-billion-dollar software businesses, and we closing our
  Series A by the end of 2026.

  Location

  - Four days a week in office near Herald Square and one day
    WFH
  - One week per quarter working from anywhere
  - Occasional travel for team offsites and customer visits

  The Role

  We’re hiring our first Engineering Manager to lead Noto’s
  engineering team. This is a senior role on our leadership
  team: you’ll report to Steve (CTO) and manage engineers
  directly, starting with a team of 4 that will grow to about
  10 over the next 6-8 months. The role is built to grow with
  the team. As engineering expands into multiple teams, you’ll
  have a direct path to Director or Head of Engineering,
  hiring and leading the managers who report to you.

  You’ll:

  - Build the team. Hire about six engineers over the next 6
    months, owning sourcing, the interview loop and closing.
    Every hire should raise the bar.
  - Lead: Hold Weekly 1:1s, set clear expectations, give honest
    feedback, and create real career growth for every
    engineer.
  - Own delivery. Own planning and the weekly cadence so we ship
    large features on time without burning people out. Set up
    and evolve the process for the team as we scale.
  - Stay hands-on. While the team is small, expect to spend a
    share of your time building and providing technical
    leadership. Review PRs, coach new teammates, make
    challenging technical calls, and partner with the CTO on
    architecture decisions we’ll live with for years.
  - Collaborate across the company. Partner with product and
    Customer Success on scoping and tradeoffs, and turn
    customer issues and escalations into product improvements.
  - Own quality and reliability: incidents, on-call and
    releases. Our customers run their businesses on Noto six
    hours a day, so when something breaks, it matters.
  - Raise the bar. Push the team to get better every week, in
    craft, speed and how we work together.

  What makes this role different:

  - You own how engineering works. You’ll hire most of the
    engineers you manage and decide how we plan, ship, review
    and hire. You’re not inheriting someone else’s playbook;
    you’re writing it.
  - You’re part of the leadership team. You’ll work directly
    with our co-founders, Steve and AJ, and alongside the
    leaders of sales and customer success. You’ll see how the
    whole business runs and have a real voice in what we
    build, not just how we build it.
  - You’ll scale through the stage that makes careers. We’re
    closing our Series A and have a clear plan to grow.
    Leading engineering from a handful of engineers to
    multiple teams is the experience that turns strong
    managers into future Heads of Engineering, and this role
    is built to take you there.

  Ideal Candidate

  - 2+ years as an engineering manager at a startup that scaled
    from Seed to Series A or Series A to B/C, managing
    engineers directly.
  - 5+ years building software before you moved into management,
    and still technical enough to ship code, review a PR and
    push back on a design. Our stack is React, Next.js, Node
    and Postgres.
  - You’ve grown a team from a handful of engineers to 10 or
    more, and hired some of them yourself.
  - You’ve coached people to grow, managed underperformance, and
    let someone go when it was the right call.
  - Product-minded. You’ve worked closely with product, design
    and customers in B2B SaaS, and you can turn messy customer
    feedback into a plan.
  - Comfortable in a startup environment. There’s no HR team
    writing your career ladder, no platform team, no program
    managers.
  - You want to be close to the work with a small team. This is
    not a manage-managers role yet.
  - Bonus: you’ve also seen a larger, well-run engineering org
    up close and know what good looks like.
  - Interest in helping education businesses thrive.

  Culture

  As our first Engineering Manager you’ll have a huge impact
  on how we build our product and shape our culture. Here’s
  what’s true today:

  - Serve the customer. Our users run small businesses. We sit
    in their schools, attend their industry conferences, and
    take support calls ourselves. We get ideas by listening to
    our customers’ problems.
  - Low ego. We make decisions collaboratively. Nobody wins an
    argument through seniority, including the founders. Good
    ideas come from whoever is closest to the problem.
  - Ownership. Each engineer owns a large, mission-critical part
    of the product. It feels like we are multiple teams made
    of 1. Pre-AI, it would’ve taken a team of 5X the headcount
    to build what we’ve done so far. The role is about growth
    and impact. If you want to build something meaningful, own
    a lot, be challenged, let’s talk.
  - Work ethic. Team members work 50–60-hour weeks. Some late
    nights and occasional weekends are expected. The work is
    intense, but we care about balance. Customers will send
    thank-you gifts and sing your praises when you ship
    something useful, and call for help on a Sunday if
    something goes wrong.
  - Growth mindset. We attend industry conferences to connect
    with our users, learn, network, and push the boundaries of
    our craft.

  Compensation

  - Competitive salary and equity worth caring about
  - 100% company-paid benefits
  - Lunch and dinner in the office and a stipend for your work
    setup
  - Company retreats (we are going to Miami for our 2026 Winter
    Retreat in December!)

  Interview Process

  - 30-minute meet and greet (Zoom)
  - 60-minute resume deep dive (Zoom)
  - 60-minute technical round (Zoom)
  - Onsite in New York City to experience a day in the life of a
    Notopian

  Why Work With Us

  Our product makes a huge positive impact on business owners,
  educators, and their local communities. Watch our customer
  testimonial video at the bottom of our home page and see it
  for yourself.

  You’ll love this role if:

  - You’re an engineering manager at a fast-growing startup and
    want to build a team, not maintain one someone else built.
  - Layers have been added above you, and you want more
    ownership and a clear path up.
  - You want to stay technical and close to the technology while
    leading people.
  - You love coaching people to do the best work of their
    careers, and when someone’s falling short, you have the
    hard conversation early and directly.
  - You care more about building a great team than about the
    size of your org on day one.

  This probably isn’t the right role if:

  - You want to manage managers or run a large org right away.
  - You’re ready to stop writing code for good.
  - You need established processes, a recruiting team and a
    written career ladder to do your best work.
  - You’re optimizing for title over scope.
