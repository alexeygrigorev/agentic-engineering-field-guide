description: |
  The Opportunity As a Tax Innovation - Software Engineering -
  Manager, you will develop software solutions that help
  clients navigate changing tax needs within our Tax practice.
  In this role, you will guide the design, coding, and testing
  of applications that support tax service delivery, drawing
  on software engineering and product innovation to improve
  how tax professionals work. You will collaborate with tax
  and technology colleagues to translate client needs into
  usable solutions and contribute to technology-driven
  approaches that make tax processes more efficient. As a
  Manager, you will lead engineering teams through project
  planning and delivery, balancing timelines, budgets, and
  client expectations. You will coach team members, use their
  strengths thoughtfully, and turn work reviews into
  opportunities to build their skills. Your ability to see how
  components interact across an application will inform
  decisions when requirements are complex or unclear. You will
  address issues directly with clients and colleagues,
  applying professional skepticism and sound judgment while
  upholding technical standards, tax guidance, and
  independence requirements. By encouraging thoughtful use of
  technology and leading with integrity, you will help your
  team deliver work that reflects the firm's purpose and
  values. Responsibilities
  - Leading software engineering workstreams for tax service
    delivery tools, translating functional requirements and
    tax process needs into implementation plans, milestones,
    and technical deliverables
  - Designing solution and enterprise application architectures
    for scalable tax applications, evaluating system
    interactions, integration points, and tradeoffs across
    service workflows
  - Directing development of C#.NET services and React Native
    interfaces, coordinating coding and testing to improve
    application functionality and user experiences
  - Managing application lifecycles and continuous integration
    and continuous delivery pipelines, setting release
    schedules, tracking defects, and coordinating deployments
    across development teams
  - Reviewing code and test results, troubleshooting application
    issues, and providing engineers with technical feedback to
    improve maintainability and delivery consistency
  - Evaluating tax service workflows using analytical thinking
    and AI fluency, identifying opportunities to automate
    repetitive tasks and improve processes through software
  - Coordinating with tax professionals and client stakeholders
    to clarify requirements, demonstrate product capabilities,
    and prioritize enhancements based on service delivery
    needs
  - Planning engineering capacity, budgets, and timelines while
    coaching team members and distributing work to support
    sustainable workloads and timely project completion
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Leading application lifecycle management for software
    supporting tax service delivery, from functional
    requirements through implementation
  - Designing enterprise application and solution architectures
    for scalable software using C#.NET and React Native
  - Managing continuous integration and continuous delivery
    pipelines while reviewing code and troubleshooting issues
    across engineering workstreams
  - Applying AI fluency and analytical thinking when identifying
    business process improvements in tax service delivery
  - Coaching software engineering teams through code reviews,
    feedback, and collaborative problem-solving during
    application development
  - Balancing project timelines, budgets, and delivery
    priorities while coordinating with stakeholders on tax
    technology initiatives
  The salary range for this position is: $99,000 - $266,000.
