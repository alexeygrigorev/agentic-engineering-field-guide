description: |
  Liftoff is a leading AI-powered performance marketing
  platform for the mobile app economy. Our end-to-end
  technology stack helps app marketers acquire and retain
  high-value users, while enabling publishers to maximize
  revenue across programmatic and direct demand.

  Liftoff’s solutions, including Accelerate, Direct, Monetize,
  Intelligence, and Vungle Exchange, support over 6,600 mobile
  businesses across 74 countries in sectors such as gaming,
  social, finance, ecommerce, and entertainment. Founded in
  2012 and headquartered in Redwood City, CA, Liftoff has a
  diverse, global presence.

  About the Role:

  As a Software Engineer at Liftoff working on the Dash team,
  you will be key in building and scaling the core systems
  that power our mobile growth platform. You’ll be part of a
  high-impact engineering team responsible for developing web
  applications, backing services, APIs and tools that help app
  developers acquire users, optimize engagement, and drive
  monetization across millions of devices worldwide.

  Your contributions will directly impact the performance,
  reliability, and scalability of our ad delivery, user
  acquisition, and analytics products. From designing
  efficient UIs, APIs and services to supporting machine
  learning pipelines, you'll help ensure our platform remains
  best-in-class for mobile growth and monetization.

  Responsibilities:

  - Design, build, and maintain UIs, APIs and backend systems
    that support liftoff accelerate real-time campaign
    management, bidding, user targeting, and in-app
    monetization, primarily by developing configuration
    management and analytics services.
  - Work with large-scale data sources to enable real-time
    analytics dashboards and reports.
  - Improve our development environment and engineering systems
    with AI and LLM tooling, championing agentic workflows
    that raise the whole team’s velocity and quality.
  - Optimize backend systems for high availability and low-
    latency response under peak global traffic.
  - Contribute to the scalability and observability of the
    platform through metrics, logging, and alerting best
    practices.
  - Develop high value user interfaces that optimize user flow,
    for both internal and external consumers securely, with a
    high bar for safety and correctness.
  - Partner closely with product managers, UX stakeholders,
    operations and bidding / ML engineers to deliver cohesive
    end-to-end features.
  - Participate in architectural design documentation,
    discussions and long-term technical planning for
    infrastructure, systems and platform evolution.
  - Continuously evaluate emerging tools and technologies in the
    mobile ad tech landscape and bring forward
    recommendations.
  - Actively participate in code reviews and mentorship
    opportunities to strengthen team-wide engineering
    excellence.
  - Other duties as assigned.

  Requirements:

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field. Equivalent practical
    experience may be considered in place of a formal degree.
  - Experience building full stack UI systems.
  - Strong programming skills in one or more languages such as
    Go, Java, Python, or Typescript/Node.js.
  - Solid understanding of data structures, algorithms, and
    system design.
  - Experience with cloud infrastructure (AWS, GCP, or Azure)
    and container orchestration (Docker, Kubernetes).
  - Familiarity with leading edge UI technologies, including
    React.
  - You operate with Agency and Urgency by taking initiative to
    solve problems and drive outcomes independently, with a
    strong sense of ownership and accountability.
  - You have a Growth Mindset and are adaptable, quick to test,
    iterate, and improve both ideas and your own skill set.
  - Experience in the mobile advertising or app monetization
    space is a plus.
  - Exposure to mobile SDKs, ad exchanges, or real-time bidding
    protocols is a plus.
  - Understanding of data pipelines, stream processing, and
    large-scale analytics is a plus.
  - Passion for building performant, scalable systems that
    operate at a global scale.

  Location: This role is eligible for full-time remote work in
  one of our entities: CA, CO, ID, IL, FL, GA, MA, MI, MN, MO,
  NJ, NV, NY, OR, PA, TX, UT, and WA.

  We are a remote-first company with US hubs in Redwood City,
  Los Angeles, and New York City.

  Travel Expectations: We offer several opportunities for in-
  person team gatherings, including but not limited to project
  meetings, regional meetups, and company-wide events. We
  expect our employees to attend these gatherings at least
  once per quarter. These gatherings provide essential
  opportunities for collaboration, communication, and team
  building.

  Compensation: Liftoff offers all employees a full
  compensation package that includes equity and
  health/vision/dental benefits associated with your country
  of residence. Base compensation will vary based on the
  candidate's location and experience.

  The following are our base salary ranges for this role:

  - SF Bay Area, NYC, Los Angeles/Orange County: $210k - $260k
  - Seattle/Olympia, Austin, San Diego, Santa Barbara, Boston:
    $193k - $239k
  - All other cities and towns in our approved states: $180k -
    $223k

