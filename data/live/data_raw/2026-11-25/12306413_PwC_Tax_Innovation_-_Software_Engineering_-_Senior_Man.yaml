description: |
  The Opportunity As a Tax Innovation Software Engineering
  Senior Manager, you will lead the development of software
  applications that improve tax service delivery within our
  Tax practice. This role brings software engineering into
  work supporting clients as they navigate tax compliance,
  planning, and optimization across domestic and international
  matters. You will guide the design, development, testing,
  and maintenance of scalable applications, with attention to
  how tax professionals and clients use them. Working with tax
  and technology teams, you will help turn changing service
  needs into practical tools that improve efficiency and the
  client experience. As a Senior Manager, you will bring
  strategic judgment to large software projects, connecting
  technical decisions to client needs and broader tax service
  goals. You will use your influence and software engineering
  knowledge to challenge assumptions, identify underlying
  problems, and explain trade-offs clearly to clients and
  teams. With autonomy comes accountability for decisions,
  timely escalation, and consistent technical and professional
  standards. You will also coach a diverse, inclusive team
  through complexity, use client feedback to assess outcomes,
  and find ways to improve delivery processes while
  maintaining operational excellence. Responsibilities
  - Leading software engineering projects that develop
    technology solutions for tax service delivery, from
    architecture and project planning through implementation
  - Designing enterprise applications and microservices that
    support scalable tax workflows and improve the efficiency
    of tax-related processes
  - Directing the development and testing of C# applications,
    reviewing technical decisions, and addressing complex
    issues throughout the application lifecycle
  - Translating tax service needs and client feedback into
    solution requirements, using active listening and
    analytical thinking to clarify priorities
  - Applying business process management methods to identify
    opportunities for automation and guide software
    improvements within tax service delivery
  - Evaluating AI capabilities for appropriate use in tax
    software solutions, including their potential impact on
    workflows and application design
  - Managing software development plans, coordinating
    engineering work across teams, and adjusting delivery
    approaches as requirements evolve
  - Coaching engineers through technical feedback and
    collaborative problem-solving while planning workloads
    that support sustainable delivery
  What You Must Have
  - At least a Bachelor's degree
  - At least 6 years of experience
  What Sets You Apart
  - Architecting enterprise applications and microservices that
    support scalable tax technology solutions
  - Directing C#.NET development across application lifecycles
    using established software development methodologies
  - Leading software project planning and solution architecture
    across complex engineering initiatives
  - Applying business process management and analytical thinking
    to identify opportunities for improving tax service
    delivery
  - Evaluating AI capabilities for technology-driven solutions
    and communicating design tradeoffs to senior stakeholders
  - Coaching engineering teams through technical decisions,
    incorporating feedback and fostering collaboration across
    disciplines
