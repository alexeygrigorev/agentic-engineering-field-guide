description: |
  Your Role:

  As a part of the larger Engineering department, the Platform
  team plays a crucial role in enhancing emnify competitive
  edge by improving developer experience to increase
  development efficiency and scale productivity.

  You will join a growing team, fostering empathy and a
  collaboration mindset to ensure continuous improvement of
  development experience at emnify. The Platform team
  provides, in addition to the centrally managed
  infrastructure used by all the teams for observability and
  CI/CD, consultation, SME services, and hands-on support to
  the engineering teams.

  As the authority on K8s and CI/CD, you will guide
  infrastructure engineers in best practices for K8s, Jenkins,
  and GitHub Actions, collaborate with the security team to
  enhance our cloud infrastructure security, and research and
  implement new features, tools, and services in the emnify
  infrastructure and tooling landscape. Your experience and
  advice will help teams deliver impactful projects
  successfully.

  Emnify technology radar

  Your Impact:

  - You’ll design, implement, and maintain K8s-based solutions,
    clusters, and supporting AWS infrastructure that help
    other engineering teams run their applications reliably on
    Kubernetes. You’ll elevate how we deliver our business-
    critical applications on Kubernetes
  - You’ll work closely with the security team to maintain and
    increase emnify's security posture.
  - You’ll continuously improve our CI/CD systems and concepts,
    enabling product teams to safely and efficiently deploy
    their applications on AWS-managed services and Kubernetes.
  - You’ll collaborate with the product teams and take an active
    part in implementing new infrastructure and services,
    providing valuable insights and implementation
    recommendations to ensure the successful and timely
    delivery of projects.
  - As part of the internal team rotation, take part in
    supporting the teams in their day-to-day operations and
    challenges they are facing.

  Your Skills:

  - Extensive hands-on experience designing and managing
    Kubernetes solutions and supporting AWS infrastructure,
    balancing cost, performance, usability, and
    maintainability.
  - Extraordinary K8s and infrastructure troubleshooting skills.
    You should be comfortable with digging into the K8s
    control plane, drivers, and networking components to
    locate a bit out of place.
  - Solid experience with CI/CD tools and pipelines. Ideally
    with Jenkins, GitHub Actions, and the Argo suite.
  - Solid knowledge of networking, security, monitoring, and
    Linux system administration. Experience in
    telecom/connectivity domains is a plus
  - Valid Kubernetes CKA certification is required, CKS
    certification is a big plus.
  - Strong verbal and written communication skills and the
    ability to convey a technical topic to non-technical
    personnel.
