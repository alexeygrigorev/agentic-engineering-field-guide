  An overview of this role

  As Senior Manager, Enterprise Application Development
  Engineering, you’ll lead the team that builds and runs
  GitLab’s internal applications. You’ll report to the Senior
  Director, Enterprise AI, and lead a team growing to seven
  engineers across the US, EMEA and India. The work is highly
  cross-functional: your partners span go-to-market, Finance,
  People, R&D, Data & Insights and more, often with competing
  priorities.

  This is a leadership role, not a hands-on coding role.
  You’ll own the technical direction and the team’s standards
  and working practices, and spend most of your time
  developing engineers and making sure the team delivers at
  pace while holding a very high bar for quality. Hiring will
  be a big focus early on as the team grows.

  What you’ll do

  - Lead and develop the team. Coach and grow engineers across
    time zones, with clear expectations, useful feedback and
    async practices that hold up, and hire well as the team
    grows.
  - Own the technical direction and quality bar. This is an AI-
    native team: agents write most of the code, and engineers
    set the direction and own the result. You’ll review
    designs and architecture, set the standards for testing,
    code review, CI/CD and releases, and be accountable for
    everything the team ships meeting a high bar for quality,
    however much of it AI wrote.
  - Shape what gets built. Each application has a named business
    owner who owns the outcome; you own how it’s built and
    run. Decide with them whether to build, buy, configure or
    extend, weighing cost, expected return and long-term
    ownership.
  - Manage delivery across the portfolio. Turn priorities into
    achievable plans, make trade-offs visible and balance new
    work with maintenance and support.
  - Work as one team with AI Engineering. Application
    development and AI engineering are one Enterprise AI team
    with different focus areas. Decide together whether a
    problem needs an app, an agent or a skill.
  - Protect sensitive data. Several applications hold people and
    financial data. Work with Security, Privacy and Legal on
    access, data protection reviews and works council
    requirements.
  - Own each application for its whole life. Make sure each one
    has an owner, monitoring, support and a known cost to run,
    and consolidate or retire it when it stops earning its
    keep.
  - Measure what matters. Track idea-to-production time, user
    satisfaction (CSAT) and cost to run against value.

  What you’ll bring

  - Several years managing software engineering teams, including
    senior engineers, with a record of hiring and developing
    people.
  - A background building and running production software across
    the stack, including data and integrations, so you can
    engage credibly with the technical detail.
  - Sound engineering and product judgment: you know when an
    approach needs to change and where custom software is
    justified.
  - Experience leading a distributed team across time zones in a
    highly cross-functional, remote and asynchronous setting.
  - Experience leading AI-native development, where agents write
    most of the code, and the judgment to keep quality high as
    output grows.
  - Strong communication with technical and non-technical
    partners.

  Preferred qualifications

  - Experience leading a portfolio of internal business
    applications.
  - Experience with GitLab, CI/CD and data platforms such as
    Snowflake.
  - Experience with applications that handle sensitive people or
    financial data.

  About the team

  Enterprise Application Development sits within Enterprise AI
  in GitLab’s Enterprise Technology & AI organization.
  Application development and AI engineering work as one team,
  alongside Data & Insights and partners across the business,
  guided by GitLab’s operating principles: Speed with Quality,
  Ownership Mindset and Customer Outcomes, built on a Culture
  of Excellence.

