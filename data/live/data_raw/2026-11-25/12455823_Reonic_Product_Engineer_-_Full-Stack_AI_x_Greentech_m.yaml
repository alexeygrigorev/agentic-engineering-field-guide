description: |
  Build the Interface of the Energy Transition Most
  engineering jobs ask you to ship fast and care about
  quality. This one asks you to build the interface of an
  entire industry. At Reonic, we’re building the AI operating
  system for renewable installers, with competitive pay,
  growth opportunities and a strong culture based on ambition,
  impact and ownership. And we’re doing it fast. What makes
  this role different

  - Your work directly impacts how renewable energy gets
    deployed
  - You’ll own features end-to-end - not just tickets
  - You’ll feel the speed: idea → code → live → feedback
  - No endless planning cycles. No hiding behind process.
  - AI-assisted development is encouraged: we mostly use
    Anthropic's Claude, and we also have Codex subscriptions
    you can use.

  Just building, shipping, improving. You will:

  - Build high-impact features used daily by real businesses
  - Ship fast using TypeScript throughout the whole stack.
  - Dive into Node.js backends and handle data with PostgreSQL
    and Prisma
  - Turn complex workflows into clean, intuitive interfaces with
    React and Tailwind
  - Work closely with product and design — no layers, no
    handoffs
  - See your code in production within days, not months

  And if you want more: Work with Rust to extend our
  Simulation that predicts the future of our customers project
  This is not a narrow role. It’s a playground for builders.
  You’ll thrive here if you…

  - Love turning complexity into simplicity
  - Care about UX as much as clean code
  - Prefer ownership over instructions
  - Move fast, learn fast, and fix things instead of debating
    them
  - Actually want to build, not just talk about building

  If you need perfect specs and slow timelines — this isn’t
  it. If you want to grow fast and ship real product — you’ll
  love it. Why join now

  - Competitive pay and equity opportunities
  - High ownership from day one and unlimited growth options
  - Steep career development: No cycles — rewarded when earned
  - Gym membership or Transportation ticket: pick between Urban
    sports club or D-ticket
  - Uber eats and Uber drive on us when you finish late
  - Take a few "workation" weeks a year—work remotely from
    anywhere.
  - We're still early. Be at the forefront of the energy
    transition.

  About Reonic At Reonic, we're building the AI-native
  operating system for renewable installers. We’re replacing
  fragmented tools (CRM, design, proposals, project
  management, invoicing) with a single integrated platform
  that supports installers across the full project lifecycle.
  Today, more than 3,000 companies across 13 countries use
  Reonic, and it’s just the beginning. We're a well-funded VC-
  backed startup reshaping how the world uses energy. With
  top-tier people, great investors, and massive goals ahead.
  We work hard and move fast, to build a company that lasts,
  and that brings lasting change.
