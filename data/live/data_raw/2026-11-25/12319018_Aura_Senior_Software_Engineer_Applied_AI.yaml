description: |
  We are on a mission to empower people of all ages to thrive
  in an increasingly connected world. By uniting Aura and
  Qoria, organizations driven by personal experiences with
  identity theft and cyberbullying, our AI-powered platform
  brings together global category leaders to build a safer
  internet across all stages of life–protecting individuals
  and families across home, school, and work environments.
  Today, our $340M+ ARR platform protects millions of
  individuals and families, and 32k schools worldwide. Driven
  by a global team of over 1,000 people, we are combining
  intelligent digital threat protection with student and child
  wellbeing tools so everyone can navigate the digital world
  safely and with confidence.

  About the Role:

  We are seeking a talented software engineer for our
  intelligence platform team. This team is focused on creating
  Aura’s new way of working, bringing AI into mission-critical
  workflows for internal and external facing use cases. You
  will be focused on building, maintaining, and promoting an
  AI stack for technical and nontechnical teams within Aura.
  The ideal candidate is familiar with today’s landscape of AI
  tools for engineering teams like ours. They are passionate
  about optimizing their development setup and sharing it to
  enable other engineers.

  You’ll join a group that brings the spirit of a startup to
  an established public company, giving you both creative
  freedom and substantial resources. You’ll need to be willing
  to work hard in a high velocity environment with multiple
  ongoing projects at a time.

  Day to Day:

  - Develop AI tools and background agents for internal use at
    Aura.
  - Collaborate with stakeholders to define requirements and
    improve system performance.
  - Work in a high velocity environment with multiple ongoing
    projects at a time.
  - Adopt bleeding-edge techniques for automating and scaling
    your own work using AI.
  - Projects:





  What you bring to the table:

  - 5+ years of experience in software engineering
  - Familiarity with a cloud compute platform such as AWS, GCP,
    Cloudflare, or similar
  - Strong proficiency in Python or NodeJS for backend
    development.
  - Git-based workflows for development, including pull requests
    and code reviews.



  - Familiarity with an AI agent harness such as Claude Code or
    Pi; understanding of harness extension points such as
    plugins or MCP



  It would be great if you also had:

  - Experience with virtualization technologies based on
    Firecracker, QEMU or gVisor.
  - Familiarity with an AI agent harness such as Claude Code or
    Pi; understanding of harness extension points such as
    plugins or MCP.
  - Hands-on experience with Terraform or other infrastructure-
    as-code.
  - Demonstrated effectiveness delivering new products in
    research or startup environments.

  Education & Qualifications

  - Bachelor’s or Master’s degree in Computer Science, Data
    Science, Engineering, or a related quantitative field, or
    equivalent industry experience.

  Aura is committed to offering a generous package to support
  our employees in all aspects of their life in and out of
  work. Our packages offer competitive pay, generous health
  and wellness benefits, retirement savings plans, parental
  leave and much more! Pay range for this position is
  $140,000–$200,000, but may vary depending on job-related
  knowledge, skills, experience and location. This position is
  remote, but candidates must be US-based.

