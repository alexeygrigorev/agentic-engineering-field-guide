description: |
  About the company

  Our client is a healthcare technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and extend software across the user interface, server
  side and infrastructure of a software platform used by
  organizations in the healthcare sector. The role carries
  wide responsibility for system design, from defining core
  components to delivering automation for partner
  organizations.

  What you'll do

  - Ship product features that run from the front end through
    the back end and into infrastructure.

  - Speak with customers directly and shape requirements without
    a separate product manager.

  - Organize messy, fragmented data into clean models that
    support growth and analysis.

  - Build automation and workflow orchestration for complex
    operational processes.

  - Create internal tools and customer-facing screens that make
    operations transparent and manageable.

  - Engineer financial and operational systems that hold up
    under load, can be monitored and recover well.

  - Work closely with go-to-market and customer teams to turn
    open-ended problems into lasting solutions.

  Requirements

  What we're looking for

  - Three or more years of hands-on experience delivering
    complete web products to real users.

  - Solid grounding in server-side engineering.

  - Ability to move comfortably between client code, services
    and cloud infrastructure.

  - Track record of converting intricate, real-world processes
    into automated systems.

  - Background in building systems that are accurate, traceable
    and dependable in demanding settings.

  - Willingness to talk with customers and understand what they
    need.

  Benefits

  Compensation and benefits

  - Base salary: USD 150,000 to 200,000 per year

  - Equity

  Location and work model

  - New York City, NY, United States

  - On-site

  - 4 days in office per week

  - Full-time
