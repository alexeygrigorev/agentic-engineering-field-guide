description: |
  To get the best candidate experience, please consider
  applying for a maximum of 3 roles within 12 months to ensure
  you are not duplicating efforts.

  Job Category

  Marketing & Communications

  Job Details

  About Salesforce

  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.

  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.

  Why It Matters Join Salesforce's Agentforce AI marketing
  team and help us SHOW audiences what Agentforce makes
  possible. As a Demo Engineer, you'll blend technical
  creativity with problem-solving to craft polished, credible
  demos that inspire trust and excitement. You'll collaborate
  with technical marketers, UX designers, and product teams to
  showcase the transformative potential of AI agents and help
  audiences experience what Agentforce and our portfolio of
  agents can do for them. What You Will Be Doing

  - Build demos that show what Agentforce makes
    possible—leveraging live product whenever possible and,
    when necessary, by showcasing future versions of
    Agentforce—and develop creative and credible ways to
    demonstrate AI agent capabilities and explain how they
    work.
  - Collaborate with technical marketers, UX designers, product
    teams, and other demo builders in a dynamic environment
    that thrives on asking, 'What about this?'
  - Build custom apps with creative license to design and vibe-
    code an end-to-end solution for high-visibility events and
    experiences.
  - Balance rapid experimentation with practicality, focusing on
    building credibility while exploring innovative ways to
    demonstrate what's possible, and troubleshoot and maintain
    demo environments to ensure performance and reliability
    for key events.

  The Experience

  - Demonstrated experience in software engineering, demo
    creation, or a related technical field, with a focus on
    technical problem-solving and building credible solutions.
  - Proven ability to translate product narratives into
    compelling demos that resonate with diverse audiences and
    inspire trust.
  - A strong foundation in technical creativity and
    adaptability, with the ability to experiment and deliver
    in fast-paced, high-stakes environments.
  - A collaborative mindset with excellent communication skills
    to work across technical and non-technical teams,
    contributing to an iterative, problem-solving culture.

  Even Better

  - Hands-on experience with Salesforce development, including
    Agentforce, Data Cloud, Lightning Web Components, Flows,
    and Apex Classes.
  - Hands-on exploration of Generative AI technologies,
    including coding agents, LLM APIs, LangChain, and Vector
    Databases, through personal or side projects.
  - Experience designing and delivering demos for high-
    visibility moments like keynotes, workshops, or product
    launches, and coordinating demo delivery under tight
    timelines using project management best practices.

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

  Accommodations

  If you need a reasonable accommodation during the
  application or the recruiting process, please submit a
  request via this Accommodations Request Form.

