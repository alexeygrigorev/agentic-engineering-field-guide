  Job Title: Senior Software Engineer

  Job Function: Engineering Position

  Type: Full-Time

  Job Family: Software Engineering

  Team: AI Agents

  Location: United Kingdom

  General Summary

  The Senior Software Engineer is responsible for designing,
  building and operating the software that powers AI agents
  across the ConnectWise platform. Working within the AI
  Agents team, this role applies strong software engineering
  fundamentals to integrate large language models, tools and
  data into reliable, secure and scalable production services
  that deliver thoughtful experiences for our partners. This
  role works in partnership with ML engineers, product
  managers and platform teams to bring agentic capabilities
  from prototype to production.

  Essential Duties & Responsibilities

  - Designs, develops, tests and maintains backend services and
    APIs that power AI agents and LLM-based features.

  - Builds agent capabilities such as tool and function calling,
    workflow orchestration, memory and context management, and
    integrations with internal and third-party systems.

  - Implements retrieval-augmented generation components,
    including data ingestion, embeddings, vector search and
    prompt pipelines.

  - Contributes to evaluation, testing and observability of
    agents, including automated tests, eval harnesses,
    logging, tracing and monitoring.

  - Ensures production readiness of services through performance
    tuning, reliability engineering, security and cost
    optimization.

  - Participates in design reviews and code reviews, and upholds
    engineering best practices and standards.

  - Collaborates with cross-functional teams to translate
    product requirements into well-scoped technical
    deliverables.

  - Mentors junior engineers and shares knowledge across the
    team.

  - Researches new tools, frameworks and techniques in the AI
    agent space and documents findings.

  Knowledge, Skills, and/or Abilities Required

  - Ability to work independently on features and projects with
    limited supervision.

  - Strong programming skills in Python, working knowledge of
    another language (e.g. TypeScript, Java, Go or C#) is a
    plus.

  - Solid understanding of software engineering fundamentals:
    data structures, algorithms, object-oriented and service-
    oriented design, and testing.

  - Experience building RESTful or gRPC APIs and microservices,
    with frameworks such as FastAPI, Flask or similar.

  - Practical experience with LLM APIs (e.g. OpenAI, Azure
    OpenAI, Anthropic, AWS Bedrock) and agent frameworks such
    as LangGraph, LangChain, Semantic Kernel or similar.

  - Familiarity with retrieval-augmented generation, vector
    databases and prompt engineering; awareness of protocols
    such as Model Context Protocol (MCP) is a plus.

  - Experience with containerization and orchestration (Docker,
    Kubernetes) and CI/CD pipelines.

  - Proficient in SQL and comfortable working with relational
    and NoSQL data stores.

  - Knowledge of at least one cloud platform (e.g. AWS or Azure)
    and its relevant services.

  - Proficiency in version control systems such as Git.

  - Ability to break down and communicate technical concepts
    clearly to audiences of varying technical understanding.

  Educational/Vocational/Previous Experience Recommendations

  - Bachelor's degree in Computer Science or a related field
    required; Master's degree preferred.

  - 5+ years of relevant software engineering experience.

  - Experience building and shipping production software on
    cloud computing platforms.

  - Hands-on experience building LLM-powered applications or AI
    agents is strongly preferred.

  - Experience deploying, monitoring and iterating services in
    production.

  Working Conditions

  - Onsite/Hybrid/Remote depending on location

  - 0-10% travel may be required

