description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  About the Role:

  As a Senior Engineering Manager in the Transactions
  organization, you'll lead a team at the center of a real
  estate technology platform that makes buying, selling and
  renting homes simpler. Transactions covers the full deal
  lifecycle after an agent wins a client: managing the
  transaction, document compliance and review, contracts and
  commissions, and getting agents paid accurately and on time.
  Our tools save agents and operations staff time and let
  Compass scale its brokerage business.

  You'll oversee critical products and services behind agent
  and staff workflows. These include Commissions, Contracts
  while working with other cross-team product like Business
  Tracker, Compliance, and Agent Finances. These systems sit
  at the center of the Compass platform, connect to many core
  products and handle real money, so this role needs a
  seasoned manager with the highest operational standards.
  You'll need to be comfortable leading tough conversations
  with stakeholders in Transaction Operations, Finance,
  Accounting, Legal, Compliance and Internal Audit.

  You'll work on projects tied to the top priorities of the
  technology roadmap and the business. These include
  onboarding acquired brokerages and agents onto our platform,
  moving off legacy transaction and back-office systems, and
  building self-service tools that remove engineering
  bottlenecks. You'll manage a talented, energetic group of
  engineers delivering critical roadmap features. You'll help
  build a strong, efficient team that can Own, Innovate and
  Move Fast, with a culture of collaboration and trust. You'll
  work with Product Managers, Designers and Staff Engineers to
  find and deliver the right long-term solutions for our
  customers.

  You'll play a key role in setting the north star, standards
  and operational excellence for the Compass platform and
  engineering team.

  Responsibilities:

  - Lead, mentor and grow an organization of talented managers
    and engineers.
  - Own the technical strategy and delivery for Commissions and
    Contracts, including commission calculation engines
    (static, tiered and production-based splits, caps and
    deductions), contract and agreement management, roster and
    team setup, and commission disbursement authorization
    (CDA) workflows.
  - Drive large platform migrations, moving acquired brokerages
    and agents off legacy transaction and back-office systems
    onto Compass with phased, low-risk rollouts and clear
    go/no-go gates.
  - Partner with Finance and Accounting to make sure commission,
    payout, billing and fee data flows reliably into
    downstream ERP and general-ledger systems.
  - Uphold SOX and financial-control standards for in-scope
    systems, working with GRC and Internal Audit to keep a
    clean audit posture.
  - Build configurable, self-service admin tools so operations
    staff can set up markets, fees, documents and bank
    onboarding without engineering help.
  - Evolve the platform toward a composable, domain-oriented,
    multi-tenant architecture that supports new brands,
    markets and business models.
  - Set and enforce operational excellence: SLOs, incident
    response, on-call health, observability and lower KTLO and
    tech debt.
  - Lead quarterly and annual planning with Product. Turn
    business goals into roadmaps with realistic estimates,
    clear dependencies and named risks.
  - Manage performance actively: grow high performers, coach
    underperformers and run calibrations fairly.
  - Be a connector across engineering teams to drive sound
    technical and architecture decisions that help our
    products scale, weighing short- and long-term risks.

  Requirements:

  - 10+ years of experience in software development, including
    at least 7 years in management.
  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - A highly technical, hands-on leader and an effective people
    manager with experience directly leading teams and other
    managers.
  - Experience building or running financial, payments,
    commissions, billing or ledger systems where accuracy,
    auditability and reconciliation are critical.
  - Experience designing, building and maintaining web
    applications and distributed backend systems.
  - Experience with technologies such as Java, AWS, Postgres,
    Kafka, Python, TypeScript and React.
  - Experience leading large system migrations or platform
    consolidations, ideally including integrating acquired
    companies.
  - Familiarity with SOX controls, compliance requirements, or
    working in regulated domains (strongly preferred).
  - Strong leadership and interpersonal skills, with the ability
    to motivate and inspire a team.
  - Proven track record of using agile principles across
    multiple teams and products to meet goals and ship high-
    quality products.
  - Excellent communication skills, used to collaborate within
    Engineering and across the company, including non-
    technical stakeholders in Finance, Operations and Legal.
  - Excellent mentoring and review skills to help engineers grow
    technically and in their careers.
  - Exceptional customer focus, building products that are
    stable, reliable and accurate.

  Compensation: The base pay range for this position is
  $225,900-$251,100; however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

