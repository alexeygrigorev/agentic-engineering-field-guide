description: |
  What we’re doing

  Owning a home is a foundational part of building financial
  security and wealth in America. However, the tools and
  technology that support homeownership are antiquated,
  dependent on things like fax machines, handwritten
  documentation, and hours of manual review.

  We're here to change it.

  Vesta was founded to rebuild the mortgage LOS from the
  ground up. Our founding belief is that the future of
  mortgage lending will be a fully automated process. Today,
  our AI augmented platform makes that a reality. Our mission
  has been to build a platform where AI isn’t just an add-on,
  but the core engine that transforms how a loan is actually
  manufactured.

  Who we are

  Our founding team is no stranger to the complexities of the
  financial industry. As early employees at Blend, they spent
  years together focused on creating modern cloud
  infrastructure for banks. Now, with Vesta, they are
  transforming the mortgage industry by creating the most
  flexible, open, and automated origination experience,
  benefiting financial institutions and their customers.

  And, we're not alone.

  We've raised $85M from top tier investors, including
  Andreessen Horowitz, Bain Capital Ventures, Conversion
  Capital, Zigg Capital, and Index Ventures.

  We believe that our team is our greatest competitive
  advantage and take pride in having a team of exceptional
  humans. As a team, we value humility, empathy, self-
  awareness, and an orientation towards action. If this sounds
  like you and you're excited by the idea of getting in at the
  ground level to be part of building the infrastructure that
  will power the future of the finance industry, we would love
  to hear from you!

  Who you are

  You’ve built and operated production software and led
  engineers through decisions about what to build, how to
  build it, and what to do when plans change. You enjoy the
  people side of the job as much as the technical side. You
  give candid, specific feedback, make expectations clear, and
  create opportunities for engineers to grow. You can explain
  a difficult technical tradeoff to a product partner and help
  a team make a decision it can deliver on.

  About your role

  You’ll lead one or more product-facing engineering teams
  building Vesta’s mortgage loan origination system. You’ll be
  accountable for what the team ships, how well it runs in
  production, and how the engineers on the team perform and
  grow.

  - Shape the roadmap and deliver it. Work with Product and
    Design to turn company goals and customer needs into a
    plan the team can execute. Maintain efficient engineering
    delivery through thoughtful consideration of business
    tradeoffs and risks.
  - Understand the architecture and own technical quality. Know
    how the team’s systems fit together so you can evaluate
    designs, spot risks, and make informed tradeoffs. Set
    technical standards with Tech Leads and senior/staff
    engineers, give them clear ownership of technical
    direction and execution, and step in when coverage is
    needed. Make sure the team owns incidents, runbooks, and
    follow-through, and reserve time for reliability and
    technical debt.
  - Build AI factories that help each engineer deliver more.
    Build and roll out repeatable AI-assisted workflows for
    how Engineering, Product, and Design build software, from
    scoping work through implementation, testing, and review.
    Track where those workflows help engineers ship more or
    shorten delivery cycles while maintaining quality and
    iterate with the organization.
  - Coach, hire, and manage performance. Use regular 1:1s to
    understand what each engineer needs to grow and give them
    work that builds those skills. Set clear expectations,
    give timely feedback, and address performance concerns
    directly. Identify gaps on the team, help interview and
    close candidates, and make sure new engineers have a clear
    path to meaningful work. Make it easy for people to ask
    for help, challenge a decision, and share what they know.

  Our stack primarily includes C#, PostgreSQL, React,
  TypeScript and AWS services (Kafka, Redis, S3, etc.).

  Minimum requirements for the role

  - 3+ years of leading an engineering team’s technical
    direction and delivery as a Tech Lead, Engineering
    Manager, or in an equivalent role.
  - Experience building, shipping, and operating production
    software at scale, with the technical depth to guide
    design reviews and evaluate tradeoffs in reliability and
    maintainability.
  - Hands-on experience building software with AI, with sound
    judgment about where to use it and how to validate the
    outputs it produces.
  - Experience directly managing engineers across the full
    employee lifecycle, including hiring, onboarding,
    coaching, career development, performance management, and
    handling performance-related terminations.
  - Experience shaping a roadmap with Product or business
    partners, delivering complex work, and communicating risks
    and decisions across functions.

  Nice to have

  - Experience building software for lending, fintech, or
    another regulated industry.
  - Experience building B2B enterprise web applications.

  Benefits and perks

  - Robust medical, vision, & dental coverage (~100% of employee
    premiums covered)
  - FSA plan offering
  - 401(K) plan offering
  - Meaningful parental leave - 16 weeks fully paid for all new
    parents, birthing & non-birthing parents (applies to
    adoptions as well!)
  - Remote-first culture with a physical hub in the Bay area &
    New York!
  - Generous Work From Anywhere & Wellness Benefits
  - Monthly cell & wifi stipend
  - Monthly Doordash benefits
  - Open & encouraged flexible time off
  - Company offsites to get to know the team!

  Our cash compensation amount for this role is targeted at
  $240,000 - $280,000. Final offer amounts are determined by
  multiple factors including candidate experience and
  expertise and may vary from the amounts listed above.

  At Vesta, we believe that the only way we can tackle the
  challenging problems in front of us is by having diverse
  perspectives and an environment that promotes inclusivity.
  We’re committed to equal opportunity regardless of race,
  color, ancestry, religion, gender, gender identity, parental
  or pregnancy status, national origin, sexual orientation,
  age, citizenship, marital status, disability, or veteran
  status. Pursuant to the San Francisco Fair Chance Ordinance,
  we will consider for employment qualified applicants with
  arrest and conviction records. As part of our onboarding
  process, we participate in the E-Verify program.
