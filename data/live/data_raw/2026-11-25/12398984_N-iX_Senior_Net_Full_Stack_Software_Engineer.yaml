description: |
  Our client is dedicated to making education engaging and
  accessible through innovative online learning platforms.
  They develop personalized learning experiences for students,
  helping them grow in a supportive and interactive
  environment. Their vision is to elevate online learning by
  applying the most successful approaches in virtual education
  to create an accessible and inclusive education curriculum
  platform where all students can be successful!

  As we continue to scale, we are looking for a Senior .Net
  Full Stack Software Engineer to join our team. In this role,
  you’ll join a team of engineers ranging from junior to
  senior, a group of experienced hands-on engineering
  managers, and a range of other team members all focused on
  one thing - providing a world-class educational experience
  to students from all walks of life.

  Responsibilities:

  - Design, develop, and maintain scalable and reliable web
    applications using C# and Vue.js
  - Collaborate with product and engineering managers,
    stakeholders, and other teams to scope, prioritize, and
    deliver value adding features to our consumers
  - Write clean and testable code
  - Lead and mentor more junior developers in code quality,
    clean architecture, and best practices

  Requirements:

  - 6+ years of professional software development experience
  - Proficient (2+ years experience) in each of the following,
    with senior-level expertise in at least one:
  - Strong clean coding experience (maintainability,
    flexibility, extensibility, reliability)
  - Strong communication skills and experience giving and
    receiving code reviews
  - Experience with version control systems
  - Experience mentoring other developers, formally or
    informally

  Nice to have:

  - University degree in Software Engineering or related field
  - Experience with GCP, GKE, GCS (or similar cloud
    technologies)
  - Experience with PostgreSQL
  - Familiarity with DevOps (CI/CD pipelines, K8s, Helm, Argo
    CD, Terraform)
  - Experience with Application Security, SecOps, Cloud
    Security, or similar
  - Experience with migration patterns (strangler-fig, dual-
    write, CDC, etc)
  - Experience with rollout strategies (blue-green, canary,
    phased)

  Qualities that will make you successful:

  - Strong interpersonal and communication skills; ability to
    work collaboratively in a remote environment.
  - Growth mindset and motivated by constructive feedback
  - Proven ability to work independently, manage schedules, and
    meet deadlines
  - Passion for education and building solutions that support
    students and educators

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
