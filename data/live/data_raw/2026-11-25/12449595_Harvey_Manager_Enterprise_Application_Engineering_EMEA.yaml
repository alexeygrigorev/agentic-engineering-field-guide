description: |
  Why Harvey

  At Harvey, we’re transforming how legal and professional
  services operate. By combining frontier agentic AI, an
  enterprise-grade platform, and deep domain expertise, we’re
  reshaping how critical knowledge work gets done for decades
  to come.

  This is a rare chance to help build a generational company
  at a true inflection point. We have strong product-market
  fit and world-class investor support. We’re scaling fast and
  defining a new category in real time. The work is ambitious,
  the bar is high, and the opportunity for growth — personal,
  professional, and financial — is unmatched.

  Our team moves fast, takes ownership, and is deeply
  committed to the mission — operating with intensity, staying
  close to our customers, and pushing each other for
  excellence. We live by three values: Decisiveness,
  Simplicity, and Job's Not Finished. We act quickly on clear
  judgment over perfect information, we believe simplicity is
  what scales, and we're never satisfied with where we are. If
  you want to do the best work of your career alongside people
  who share that drive, we'd love to build with you.

  At Harvey, the future of professional services is being
  written today — and we’re just getting started.



  Role Overview

  We're hiring a hands-on engineering manager for Harvey's
  Revenue Technology team. You'll bring software-engineering
  discipline to the systems our go-to-market organisation runs
  on, with Salesforce at the core and the CPQ, contracting,
  billing, marketing automation, revenue intelligence and
  post-sale platforms around it, and you'll put AI to work
  across that stack. You'll start as a player-coach: shipping
  yourself, setting the architecture and release practices for
  the system administrators and product owners already on the
  team, and hiring the engineers who come next. You'll be
  based in Dublin or London, with enough overlap with US
  stakeholders to stay tightly coupled to the wider team.

  Harvey's go-to-market organisation is growing quickly, and
  this role owns the engineering practice behind its systems:
  how we design, build, test, release and monitor on
  Salesforce and the platforms around it, and the engineering
  standards across custom development, integrations and
  agents. The ideal candidate is a working manager: someone
  with hands-on Salesforce engineering and DevOps experience,
  who has led an engineering team and shipped AI agents that
  sellers actually use. Harvey builds AI for legal
  professionals; the internal bar has to match the external
  one.

  At Harvey, we value Decisiveness, Simplicity, and the
  mindset that Job's Not Finished. We move fast, prioritize
  clarity, and are always striving for excellence. If this
  resonates with you, we'd love to hear from you.



  What You'll Do

  - Stay hands-on. Spend a meaningful share of your time in the
    work - designing systems, reviewing code, writing
    integrations, unblocking your engineers on production
    issues. You set the technical bar by demonstrating it.
  - Own the architecture of the GTM platform. Take
    responsibility for how Salesforce and the surrounding GTM
    systems fit together across lead-to-cash and the post-sale
    lifecycle, including reliability, data integrity, security
    posture, and lifecycle. Decide where customisation belongs
    and where it doesn't.
  - Drive AI enablement into the business. Apply AI and
    automation to how our go-to-market teams work, with the
    evaluation and guardrail practices that make it safe, and
    drive adoption with the teams that use it.
  - Build and lead the team. Hire, onboard, and develop the
    software engineers who join Revenue Technology, and set
    the architectural direction for the system administrators
    and product owners you work alongside. Own the interview
    loop, ramp plans, and performance for the engineering
    discipline.
  - Partner with business and systems owners. Work directly with
    Sales, Marketing Operations, Customer Success and Support,
    Deal Desk, Finance Systems and Enterprise Integrations to
    turn ambiguous business problems into scoped, sequenced
    engineering work, and to say no clearly when something
    shouldn't be built.
  - Establish engineering standards. Define how this team
    writes, tests, deploys, documents, and monitors what it
    builds. Introduce the practices that scale a growing team
    without adding process for its own sake.
  - Anchor Revenue Technology in EMEA. Provide senior technical
    presence in Dublin or London for a growing international
    sales organisation, and hold enough overlap with US
    stakeholders to stay tightly coupled to the wider org.
  - Make build-vs-buy calls. Assess when a business need is
    better solved by configuration, a vendor, an integration,
    custom code or an agent we build, and make that call with
    cost, security, and long-term maintenance in view.



  What You Have

  - 7+ years of hands-on engineering on Salesforce-centred
    business systems, and experience leading engineers as a
    manager, tech lead or architect.
  - Salesforce engineering experience (Apex, LWC, Flows,
    integrations) and hands-on experience setting up
    Salesforce DevOps: source control, CI/CD, sandbox strategy
    and release management.
  - Hands-on engineering depth in a modern language (Python,
    TypeScript, Go, or similar) and real experience designing
    and operating API-based integrations between business
    systems.
  - Working knowledge of the GTM stack beyond the CRM (CPQ,
    marketing automation, revenue intelligence, support and
    customer-success platforms, contract and billing systems)
    and how lead-to-cash and the post-sale lifecycle actually
    flow across them.
  - Demonstrated experience building and shipping LLM-based
    agents or automations into production, outside a vendor's
    packaged agent product, with a clear point of view on
    evaluation, guardrails, and where the technology does and
    doesn't hold up.
  - Track record of hiring and developing engineers, and of
    raising the technical bar on a team you inherited or
    built.
  - Strong communication and stakeholder management skills,
    especially with non-technical teams.
  - Ability to thrive in a fast-paced, high-growth, and global
    environment.

  Bonus Points:

  - Experience standing up an engineering practice inside a team
    that was previously admin- and configuration-led, or in a
    new office or region.
  - Background at a high-growth B2B SaaS company scaling through
    2,000+ employees.
  - Hands-on work with MCP, agent orchestration frameworks, or
    LLM gateway and evaluation tooling.
  - Fluency with agentic coding tools (Claude Code, Cursor,
    Codex) as a daily working practice.
  - Experience with enterprise iPaaS platforms (e.g., Workato)
    and event-driven integration patterns.
  - Exposure to legal, professional services, or another
    regulated industry.



