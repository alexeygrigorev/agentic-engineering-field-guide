description: |
  We are hiring a software engineer to design and lead a
  critical Cash & Intraday Liquidity Management platform. This
  platform sits at the intersection of engineering ambition
  and real-world financial impact — for a wide range of
  internal and external consumers. This is a rare opportunity
  for a hands-on engineering leader to own a multi-year
  technical roadmap, build and scale a world-class global
  engineering organization, and deliver AI-first, cloud-native
  systems that operate with the highest standards of
  availability across multiple geographies and regulatory
  environments. If you are energized by hard engineering
  problems, thrive at the intersection of technical depth and
  organizational scale, and want your work to matter at a
  global level — this role is built for you.

  Responsibilities:

  - Own the end-to-end technical strategy and multi-year roadmap
    for a foundational cash & intraday liquidity management
    platform — making architectural decisions that determine
    how a high-throughput, multi-consumer API ecosystem
    evolves across global markets.
  - Design and deliver highly available, fault-tolerant
    distributed systems across multiple geographic regions,
    with architectures that maintain platform continuity, data
    sovereignty compliance, and consistent service levels
    across jurisdictions with differing regulatory
    requirements.
  - Drive an AI-first engineering culture — embedding LLM
    tooling into both the platform and the team's day-to-day
    engineering practices to accelerate delivery velocity and
    raise the quality bar.
  - Lead, grow, and develop a global engineering organization of
    engineers, architects and product managers — building a
    team environment where technical craft, accountability,
    and continuous improvement are the standard.
  - Stay hands-on in design reviews, code quality, and technical
    decision-making — providing direct engineering guidance on
    microservices design, cloud-native deployment, distributed
    systems patterns, and API development.
  - Partner with risk, compliance, and infrastructure teams to
    embed security controls, disaster recovery planning, and
    audit-ready practices across all operating regions —
    ensuring the platform meets regulatory obligations without
    compromising engineering agility.

  Required Skills, Knowledge & Experience

  - 6+ years of software engineering and technology hands-on
    experience, with at least 4 years in enterprise-grade,
    high-traffic applications — this is a hands-on technical
    leader role, and architectural decisions are made by
    someone who can build.
  - Demonstrated expertise designing and operating highly
    available, multi-region distributed systems — including
    active-active and active-passive topologies, data
    residency controls, disaster recovery strategies, and
    cross-jurisdictional regulatory compliance architecture.
  - Deep hands-on proficiency in Java, Spring Boot, with
    practical experience building microservices, APIs, and
    event-driven systems using Apache Kafka, IBM MQ or
    equivalent high-throughput messaging platforms.
  - Fluency across the full engineering stack — front-end
    (ReactJS), back-end (Java, Spring), data stores (Oracle,
    MongoDB), and containerized cloud-native infrastructure
    (Kubernetes, Docker, OpenShift, public cloud).
  - Minimum 8 years leading globally distributed engineering
    teams, with the ability to set technical direction, drive
    delivery accountability, and develop engineering talent
    across multiple geographies and regulatory contexts.
  - Expertise in CI/CD, test-driven development, and modern
    engineering tooling — including JUnit, JMeter, Mockito,
    Cucumber, Jenkins, and GitHub Actions — applied
    consistently to maintain engineering quality at scale.

  - Experience in using AI coding assistants such as CoPilot,
    Devin, Claude Code or equivalent.
  - Strong stakeholder management skills — experience navigating
    complex, matrixed organizations and driving alignment
    across business, technology, and operations
  - Demonstrated ability to structure and lead product working
    groups, driving consensus on requirements and facilitating
    the development and implementation of processes, data, and
    system designs.
  - Proven ability to attract, develop, and retain top
    engineering talent in a competitive market
  - Experience operating in Agile delivery frameworks at
    enterprise scale, with a bias for continuous delivery and
    iterative value creation

  Education:

  - Bachelor’s degree/University degree or equivalent experience
  - Master’s degree preferred

