description: |
  LiveRamp is shaping the future of responsible data
  collaboration between the world’s leading brands, retailers,
  financial services providers, and healthcare innovators. As
  consumers embrace new AI-driven experiences, the LiveRamp
  data collaboration network exponentially expands the breadth
  and accuracy of the data on which marketing AI capabilities
  operate, powering deeper customer insight and measurable
  performance on a global scale. LiveRamp is headquartered in
  San Francisco, California, with offices worldwide. Learn
  more at LiveRamp.com.

  LiveRamp is looking for a Senior Fullstack Software Engineer
  to help shape the next generation of Data Marketplace
  capabilities. In this role, you will lead the design and
  delivery of scalable product and platform features across
  customer-facing experiences, backend services, and ecosystem
  integrations. You’ll partner closely with Product, Design,
  Infrastructure, and other engineering teams to solve complex
  technical problems and deliver reliable, high-quality
  systems that directly impact customers.

  You will

  - Design, build, and scale core Data Marketplace capabilities
    across APIs, services, and user-facing workflows.
  - Lead medium-to-large technical initiatives from design
    through production rollout, balancing speed, quality, and
    maintainability.
  - Drive architecture and implementation decisions for systems
    that support marketplace discovery, activation,
    monetization, and partner integrations.
  - Improve reliability, observability, performance, and
    operational excellence across production systems.
  - Collaborate with cross-functional partners to translate
    product requirements into pragmatic technical solutions.
  - Raise the engineering bar through thoughtful code reviews,
    strong testing practices, and clear technical
    documentation.
  - Mentor other engineers, unblock teammates, and help the team
    make sound tradeoffs in ambiguous problem spaces.
  - Contribute to the evolution of AI-forward marketplace
    experiences, including systems that improve automated
    discovery and access to premium data.

  About you

  - 5+ years of professional software engineering experience
    building and operating production systems.
  - Bachelor’s degree in Computer Science, Engineering,
    Mathematics, or a related technical field.
  - Strong experience designing and delivering scalable
    distributed systems, APIs, and data-intensive
    applications.
  - Proficiency in one or more backend programming languages
    such as Go, Python.
  - Experience working across modern application stacks, with
    the ability to contribute effectively to backend-heavy or
    full-stack projects.
  - Strong ownership mindset with a track record of driving
    projects from concept to launch.
  - Ability to work effectively in ambiguous environments and
    translate business problems into durable technical
    solutions.
  - Experience collaborating across teams and influencing
    technical direction without relying on formal authority.
  - Passion for code quality, testing, maintainability, and
    operational excellence.
  - Excellent communication skills and a collaborative, low-ego
    working style.

  Nice to have

  - Experience with TypeScript and React for customer-facing
    product development.
  - Experience with cloud-native infrastructure such as
    Kubernetes and Google Cloud Platform.
  - Familiarity with event-driven or streaming systems,
    background job orchestration, and distributed data
    workflows.
  - Experience in AdTech, MarTech, data marketplaces, or
    privacy-conscious data products.
  - Experience building 0-to-1 product capabilities or
    modernizing legacy systems at scale.
  - Interest in AI-enabled product experiences, agentic
    workflows, or automated data discovery.

  The approximate annual base compensation range is $130,000
  to $196,500. The actual offer, reflecting the total
  compensation package and benefits, will be determined by a
  number of factors including the applicant's experience,
  knowledge, skills, and abilities, geography, as well as
  internal equity among our team.



  We use automated decision systems (ADS) as part of our
  recruitment and hiring process. If you require an
  accommodation or believe that the use of an ADS may create a
  barrier to your application or participation in the hiring
  process due to a disability or other protected
  characteristic, please let us know. We are committed to
  providing reasonable accommodations and ensuring an
  equitable hiring experience for all candidates.

  To all recruitment agencies: LiveRamp does not accept agency
  resumes. Please do not forward resumes to our jobs alias,
  LiveRamp employees or any other company location. LiveRamp
  is not responsible for any fees related to unsolicited
  resumes.
