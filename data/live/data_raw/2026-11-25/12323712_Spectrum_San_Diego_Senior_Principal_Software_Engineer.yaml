description: |
  SAIC is seeking an experienced Senior Principal Software
  Engineer to design automation driven code, debug, refine,
  maintain, and modernize our enterprise-level systems.

  This role is Remote in San Diego, CA. Must be local to the
  area. Must be open to travel up to 10%.

  JOB DUTIES:

  - Ideal candidate will work with a team of engineers to
    automate network configuration and deployment
    environments.
  - Candidate must possess deep expertise in Python, Ansible
    playbooks, Scripting, and Jinja.
  - Evaluate emerging technologies and automation tools to
    continuously improve engineering capabilities and
    operational effectiveness.
  - Contribute to network automation initiatives through the
    application of networking concepts, automation frameworks,
    and infrastructure-as-code methodologies.
  - Apply object-oriented programming principles and software
    engineering best practices to develop scalable, reusable,
    and maintainable automation solutions.
  - Partner with business and technology stakeholders to
    translate requirements into architectural designs and
    automation roadmaps that support strategic objectives.

  Qualifications

  REQUIREMENTS:

  Experience and Education:

  - Bachelors in Computer Science, Information Technology, or a
    closely related technical field and fourteen (14) years or
    more experience; Masters and twelve (12) years or more
    experience; PhD or JD and nine (9) years or more
    experience. Years of experience in lieu of degree to be
    reviewed.
  - Experience with direct professional software engineering
    centered on Python.
  - Demonstrated experience navigating code version control
    systems (e.g., Git, SVN) and managing enterprise software
    development lifecycles (SDLC).
  - Must be experienced with the following:
    - Python programming language (skilled)
    - Ansible playbooks (skilled)
    - Scripting programming (familiar)
    - Jinja templates (skilled)

  Clearance:

  - Must be a U.S. Citizen.
  - Must have an Active Secret Clearance to start.
  - Must be able to obtain a TS/SCI clearance after start.

  DESIRED SKILLS:

  - AAP (Ansible Automation Platform)
  - Automation or pipeline building (skilled)
  - Git version control (skilled)
  - Nautobot tool (familiar)
  - Networking (familiar)
  - Object oriented programming (familiar)
  - JSON (familiar)

