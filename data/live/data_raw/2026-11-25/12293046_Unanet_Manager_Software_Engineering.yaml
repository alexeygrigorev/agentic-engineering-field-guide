description: |
  Our growing team is looking for an Engineering Manager to
  help take our web application, services, and agentic
  development practices to the next level. This role leads a
  cluster of small, cross-functional fusion pods that use AI
  agentic development across the SDLC. You will create the
  conditions for the pod to deliver customer value quickly,
  safely, and predictably while preserving strong technical
  judgment, product quality, and team health. The right leader
  is a technically credible people manager who can efficiently
  operate across multiple work-streams. You will partner
  closely with Product Management, Architecture, Platform,
  Security, and other engineering leaders to clarify outcomes,
  remove dependencies, improve engineering effectiveness, and
  develop the next generation of leaders.

  What You’ll Do:

  - Lead and develop a cluster of three to four Fusion Pods,
    establishing clear charters, ownership boundaries,
    operating rhythms, and escalation paths.
  - Partner with Product Management and other stakeholders to
    translate customer and business outcomes into priorities,
    delivery commitments, dependency plans, and risk
    decisions.
  - Own people leadership for the cluster, including one-on-
    ones, feedback, performance and career development,
    recognition, hiring, onboarding, retention, and
    development of future pod and technical leaders.
  - Maintain delivery visibility across the cluster, remove
    blockers, communicate changes transparently, lead overall
    release management and represent the pods in planning,
    roadmap, hiring, and cross-functional leadership forums.
  - Engineering technical leadership - Guide technical quality
    through architecture and design reviews, technical
    planning, code reviews, and production-readiness
    discussions while preserving pod ownership of day-to-day
    decisions by collaborating with VP of Product Development.
  - Establish and track expectations for AI-agent use, context
    repository, reusable skills, workflow quality, review
    practices, secure tool usage, and human accountability.
  - Ensure consistent practices for testing, security,
    performance, reliability, observability, documentation,
    and incident follow-through across the pods.
  - Use delivery, quality, reliability, pod experience, and
    customer-impact signals to improve the operating model,
    reduce duplicated work, and prioritize shared technical
    investments.

  Your First 90 Days:

  By Day 30

  - With the support of your leadership team, you will
    participate in our virtual immersive onboarding program to
    learn our product, customers, organization, and technology
    stack.
  - You will meet the fusion pods, product partners,
    architecture and platform partners, and key stakeholders.
    You will understand each pod’s charter, roadmap,
    dependencies, production responsibilities, team-health
    signals, and current use of AI-assisted development tools.
  - You will observe pod ceremonies, design and code reviews,
    release and incident practices, and identify the most
    important opportunities and risks across the cluster.

  By Day 60

  - You will work with the pod teams and product management to
    clarify ownership, delivery priorities, technical risks,
    and cross-pod dependencies.
  - You will establish a lightweight operating rhythm for the
    cluster, including delivery reviews, dependency
    management, people-leadership routines, and a consistent
    approach to surfacing risks and decisions.
  - You will partner with technical leads and senior team
    members to identify improvements to AI-assisted
    development workflows, quality practices, developer
    experience, and production readiness.

  By Day 90

  - You will play an integral role in delivering roadmap
    commitments across the Fusion Pod cluster.
  - You will have established clear expectations for pod
    ownership, delivery accountability, technical leadership,
    and team health. You will have a prioritized improvement
    plan with measurable outcomes and will have begun
    executing the highest-value changes.
  - You will contribute to hiring and development plans,
    strengthen cross-pod collaboration, and help the teams
    adopt AI-assisted practices that improve speed and quality
    without weakening engineering judgment or accountability.

  Who You Are:

  - 8+ years of software engineering experience in an enterprise
    SaaS product-development environment.
  - 5+ years of experience directly managing software engineers
    and leading engineering teams.
  - Experience leading multiple teams, pods, workstreams, or
    product areas concurrently.
  - Strong technical depth in distributed systems, web
    applications, APIs, data-intensive services, cloud
    platforms, or comparable product technology.
  - The ability to participate meaningfully in architecture,
    design, code-quality, reliability, and production-
    readiness discussions.
  - Experience partnering with Product Management and other
    stakeholders to plan, prioritize, estimate, sequence, and
    deliver customer-facing software.
  - Experience building healthy teams through coaching,
    feedback, career development, hiring, onboarding, and
    performance management.
  - Experience working in a HyperAgile or Agile environment
  - Strong written and verbal communication skills, including
    the ability to communicate risks, trade-offs, decisions,
    and changes clearly.
  - A track record of improving delivery predictability,
    quality, reliability, developer experience, or engineering
    effectiveness.

  Your Differentiators:

  - Experience leading or championing AI-assisted or agentic
    development practices across an engineering team or
    organization.
  - Practical experience with tools such as Claude Code, Codex,
    Cursor, GitHub Copilot, or comparable agentic development
    tools.
  - Experience establishing standards for AI-generated code
    review, testing, evaluation, observability, secure tool
    access, and human accountability.
  - Experience building or operating shared developer platforms,
    reusable engineering workflows, internal tooling, or
    engineering enablement programs.
  - Experience leading a transition from larger Scrum teams to
    smaller, outcome-oriented pods.
  - Experience with Java, full-stack web development, relational
    databases, RESTful APIs, cloud services, CI/CD, Docker,
    and modern front-end frameworks.
  - Experience in regulated industry environments where
    security, auditability, reliability, and customer trust
    are essential.

  Our Values

  - We are a Team. Employees, customers, and partners working
    together.
  - We are Customer-Focused. Customers are the heart of
    everything we do.
  - We are Driven. Seeking exceptional outcomes.
  - We Own our Success. Every employee has a stake in our
    company.
  - We do the right thing and have fun in the process.

  The salary range for this opportunity is $175,000 - $185,000
  per year. You will be eligible for employee equity as well
  as discretionary bonus compensation, subject to plans that
  may be in effect from time to time. You will further be
  eligible to participate in Unanet's employee benefits plans
  and programs. For more details on Unanet's benefits
  offerings, please visit https://unanet.com/employee-
  benefits.

  Unanet is proud to be an Equal Opportunity Employer.
  Applicants will be considered for positions without regard
  to race, religion, sex, national origin, age, disability,
  veteran status or any other consideration made unlawful by
  applicable federal, state or local laws.
