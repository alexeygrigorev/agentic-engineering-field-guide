description: |
  Shield AI is a venture-backed defense-tech company with the
  mission of protecting service members and civilians with
  intelligent systems. Its products include Hivemind autonomy
  software, V-BAT and X-BAT aircraft, and Aechelon simulation
  and synthetic reality technologies. With offices and
  facilities across the U.S., Europe, the Middle East, and
  Asia-Pacific, Shield AI’s technology actively supports
  operations worldwide. For more information, visit
  www.shield.ai. Follow Shield AI on LinkedIn, X, Instagram,
  and YouTube.



  Job Description:

  We are seeking a skilled Systems Engineer to join the
  Hivemind Solutions Systems Engineering team. In this role,
  the candidate will support the design, development,
  integration, and validation of complex systems leveraging
  the Hivemind autonomy software. This role requires a strong
  foundation in systems thinking, cross-functional
  collaboration, and the ability to translate stakeholder
  needs into robust technical solutions.

  What you'll do:

  - Define, analyze, and manage system requirements, ensuring
    traceability and alignment with mission objectives
  - Develop system architectures and perform trade studies to
    balance performance, cost, and risk
  - Coordinate and manage interfaces across hardware, software,
    and external systems
  - Support system integration, verification, and validation
    activities, including test planning and execution
  - Identify technical risks and develop mitigation strategies
    throughout the system lifecycle

  Required qualifications:

  - A minimum of 5 years of systems engineering or related
    experience with a Bachelor’s degree; or 4 years and a
    Master’s Degree; or 2 years with a PhD; or equivalent work
    experience
  - B.S. degree in a STEM discipline (e.g. Software, Aerospace,
    Mechanical, Electrical, Systems Engineering)
  - Experience with Systems Engineering practices and
    principals, including writing, organizing, and verifying
    requirements
  - Experience with MBSE and related efforts
  - Experience working in cross-functional teams
  - Excellent communication skills, both written and verbally
  - Organized and methodical
  - Software engineer experience in C++ and/or Python
  - Experience in reading, interpreting, and applying
    engineering drawings, including assembly drawings, parts
    lists, wiring diagrams, and schematics
  - Demonstrated record of working hard, being a trustworthy
    teammate, holding yourself and others to high standards,
    and being kind to others
  - The ability to obtain and maintain a US Security Clearance.
    US Citizenship is required as only US citizens are
    eligible for a security clearance

  Preferred qualifications:

  - Expertise with MBSE, inclusive of use of Cameo API and
    Velocity Template Language (VTL)
  - Expertise with Requirement & Design decomposition
  - Experience in any/all of the following: Autonomy, Aircraft,
    Unmanned Vehicles

