  Click this link to learn more about our SaaS platform:
  https://www.performyard.com/flexible-features

  This is a 100% Remote position - Now & Forever

  Requirements

  As a Full-Stack Software Engineer, you will innovate,
  design, and develop end-to-end product capabilities that
  stretch from our React-based frontend to our
  NodeJS/Python/MongoDB/Docker backend. Every Software
  Engineer at PerformYard will collaborate with our
  development team and corporate leadership to deliver
  innovative new features for our SaaS employee performance
  platform, transforming high-level specifications into
  scalable, efficient and easy-to-use features.

  What You’ll Do:

  - Participate in the full application development lifecycle,
    with a focus on writing clean, efficient and reusable
    code.
  - Own development of features, manage implementation of code
    and enhance product usability and consistency within the
    product.
  - Build new features using React, Javascript, Python, MongoDB,
    Docker
  - Collaborate on and develop the UI/UX and product
    capabilities of our employee performance SaaS product
  - Contribute to our API and maintain API-based connections
    with other, related systems
  - Identify and resolve performance bottlenecks
  - Collaborate directly with founders as well as the
    Collaborate closely with product management, QA, and other
    engineering team members
  - Understand internal and customer requests and creatively
    implement those features into PerformYard production
    software
  - Contribute to our full stack including AWS infrastructure
    that delivers our products to users worldwide.

  What You’ll Bring:

  - Bachelor's Degree
  - 3-5+ years of development experience with React, Redux,
    Python, TypeScript, Node and/or JavaScript
  - Practical knowledge of and experience with NoSQL and/or SQL
    databases
  - Bonus if experience working with Docker and other Javascript
    frameworks
  - Experience building integrations using web services and
    maintaining an API
  - Experience with the AWS stack

  Bonus Points for:

  - Experience developing, documenting, and versioning public
    REST APIs
  - Node.js experience
  - GraphQL experience
  - Experience working with Docker
  - Experience with additional Javascript frameworks in addition
    to React and Redux

  APPLY HERE

