description: |
  Join us as an Engineering Manager

  - In this key role, you’ll be leading a team of talented and
    creative engineers to build products
  - We’ll look to you to deliver exceptionally high-quality work
    and empower engineers to make a big impact
  - It’s a great opportunity to be recognised for your expertise
    and knowledge as you contribute to NatWest Boxed's /
    Mettle's Strategy

  What you’ll do

  As an Engineering Manager, you’ll be instrumental to the
  success of our engineering teams

  Day-to-day, you’ll be:

  - Managing software and quality engineers in a matrixed
    product engineering organisation, across empowered squads
  - Owning technical stewardship of one or more of NW Boxed /
    Mettle's product mission teams
  - Ensuring your direct reports are motivated, happy and
    engaged to achieve high performance
  - Providing engineering support and guidance to mission
    Product Managers, Product Owners and squad tech leads
  - Working with our staff engineers and architecture function,
    to ensure your squads deliver the highest standards of
    technical design and implementation and that our platform
    is operationally excellent

  The skills you'll need

  We’re looking for someone with experience of building and
  designing scalable and performant systems and making
  significant contributions to the wider engineering goals of
  an organisation.

  You’ll also have:

  - Experience leading teams of highly skilled software
    engineers to success
  - Solid practical and theoretical knowledge of modern software
    development
  - Excellent experience building services within a modern,
    cloud hosted, event driven or sourced, microservice
    architecture

  Hours

  35

