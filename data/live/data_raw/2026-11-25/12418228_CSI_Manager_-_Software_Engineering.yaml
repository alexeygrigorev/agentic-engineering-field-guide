description: |
  Job Description:

  A manager follows direction of senior management and ensures
  that team function/department is staffed properly, employees
  have the training and tools they need, OKRs are met, and the
  department is managed to perform within approved budgets.
  The manager is a tactical leader for day-to-day interaction
  and decision making for the team and/or function. Provides
  estimates supporting needs, schedules, and assigns work to
  meet service targets. The Manager – Engineering position is
  responsible for overseeing the development, enhancement, and
  maintenance of the software products of CSI.  Supervisory &
  Management Responsibilities:

  - Responsible for a team of employees within the department.
  - Hires, trains, evaluates performance of team.
  - Communicates policy and strategy to department employees.
  - Schedules employee tasks, following budgets.
  - Continual improvement and problem solving.
  - Upholds all policies and procedures, company culture and
    values.

  Budget Responsibilities:

  - Manages to budget set by senior management.

  Additional Functional Responsibilities:

  - Attends Sprint, Design, and various other meetings
    associated with the development and design of software
    changes.
  - Ensures team productivity expectations are being fulfilled.
  - Ensures Sprint and other deadlines are meet.
  - Ensures cross team collaboration efforts are being met.
  - Performs other duties as assigned

  Requirements:

  - Bachelor’s in Computer Science or equivalent work
    experience.
  - 5+ years leading/managing a software engineering team to
    deliver ready for production software products
  - 2+ years proven experience developing scalable / secure
    platforms
  - Experience managing all aspects of software delivery,
    including development, software architecture, QA,
    requirements, release management, etc.
  - Ability to understand both technical and functional problems
    to actively participate in issue resolution and
    negotiation
  - Excellent time management and organizational skills and
    experience establishing guidelines in these areas for
    others
  - Passion for learning, building software quickly, driving
    value, and mitigating risk
  - Excellent communicator
  - Proactive work habits and strong interpersonal skills to
    facilitate teamwork within and between teams
  - Strong sense of personal accountability regarding decision-
    making and managing software engineering teams
  - Experience working in a high-level collaborative environment
    and promoting a teamwork mentality
  - Detail-oriented and able to understand the bigger picture
    via technical expertise and problem solving to prioritize
    and manage issues.

  As a forward-thinking software provider, Computer Services,
  Inc. (CSI) helps community and regional financial
