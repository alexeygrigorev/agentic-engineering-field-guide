description: |
  StackAdapt is the leading technology company that empowers
  marketers to reach, engage, and convert audiences with
  precision. With 465 billion automated optimizations per
  second, the AI-powered StackAdapt Marketing Platform
  seamlessly connects brand and performance marketing to drive
  measurable results across the entire customer journey. The
  most forward-thinking marketers choose StackAdapt to
  orchestrate high-impact campaigns across programmatic
  advertising and marketing channels.

  About the Data Solutions Team We're looking for a Senior
  Software Engineer to help build Data Solutions, a new domain
  at StackAdapt. Data Solutions turns the data StackAdapt
  generates, licenses, and partners for into trusted, reusable
  data products. Those products power targeting, measurement,
  AI, and new products across the company. You'll help shape
  the enablement layers that power numerous core features
  across StackAdapt, including Ivy, StackAdapt's AI assistant
  for marketers. You'll also combine our proprietary datasets
  with third-party data to generate new insights. The data
  underneath is large and rich: billions of events a day
  across impressions, clicks, and conversions, plus partner
  and licensed datasets. Our core technologies include Flink,
  Spark, Kafka, Iceberg, Golang, and Kubernetes. If you want
  to build data products that people rely on, and help define
  how an AI-forward company uses its data, this role is for
  you. What You'll Be Doing • Design, build, and operate data
  products end to end, including audiences, signals,
  enrichments, and the APIs and services that expose them •
  Build the foundational data layer that gives Ivy and other
  AI agents rich context on audiences, campaigns, inventory,
  and performance • Develop streaming and batch pipelines with
  Flink, Spark, and Kafka that publish into our Iceberg-based
  data plane, with clear contracts for schema, freshness, and
  ownership • Create reusable frameworks for onboarding third-
  party and partner data, so new providers can be added
  quickly and shared across products • Turn raw platform data
  into insights, such as audience traits, inventory signals,
  and performance baselines, that improve targeting and
  recommendations • Work closely with Product, Data Science,
  and external data partners to decide what to build and why •
  Lead projects from technical design through production
  rollout, monitoring, and iteration • Use AI tools and agents
  in your daily work, and help shape how the team builds with
  them • Mentor engineers and raise the bar through design
  reviews and code reviews What You'll Bring to the Table • 5+
  years of experience as a backend, data, or platform software
  engineer, with strong coding skills in Java, Scala, Python,
  or Go • A track record of shipping data products or
  platforms that other teams or customers depend on • Hands-on
  experience with distributed processing, streaming, and
  lakehouse or warehouse technologies (e.g., Flink, Spark,
  Kafka, Iceberg, Redshift, ClickHouse, Trino) • Strong grasp
  of data modeling, data contracts, and data quality at scale
  • Product sense: you care who uses the data and whether it
  moves a business outcome • Comfort working with technical
  and non-technical stakeholders to turn ambiguous needs into
  well-scoped systems • An AI-forward mindset, with hands-on
  use of AI tools and curiosity about building data that
  agents consume Bonus Points • Proficiency in Golang •
  Experience working with privacy or legal teams on data use,
  such as consent, licensing, or clean rooms • Experience
  building and shipping AI products or features, such as LLM-
  powered applications, agents, or recommendation systems •
  Experience building data for ML or AI systems, such as
  features, embeddings, vector stores, retrieval, or MCP
  servers • AdTech or MarTech experience • Experience building
  data catalogs, marketplaces, or semantic layers

