description: |
  About Warp

  Warp is the AI-native Employee Management Platform for
  ambitious companies. HRIS, payroll, benefits, IT, tax
  compliance, and more, all built from scratch on one AI-
  native platform.

  Every company runs on its people, and the software that
  manages them is some of the oldest in the enterprise.
  Incumbents like ADP and Workday built their businesses on
  complexity and large ops teams. Warp is built for AI to be
  the primary operator. Every advance in LLM capability widens
  our lead.

  We process $X billion in annual payments for high-growth
  companies across all 50 US states + globally.

  We've raised $85M from Battery Ventures, Sapphire Ventures,
  Peak XV, Sound Ventures (Ashton Kutcher), and Y Combinator,
  alongside operators including Tobi Lütke (Shopify), Claire
  Hughes Johnson (Stripe), and the founders of Dropbox and
  Replit. Our team comes from MIT, Ramp, Brex, Google, Gusto,
  Rippling, and more.

  We hire people who ship constantly, own outcomes, and care
  about craft. If you want to automate an entire category of
  work that every company depends on, this is the place.

  About the Role

  As the Staff Software Engineer for Identity & Access at
  Warp, you'll be the technical lead for the systems that
  control how thousands of companies manage who has access to
  what, on which devices, from day one of employment to the
  last. Authentication and authorization, role-based and
  attribute-based access control, application provisioning,
  and cross-platform MDM all sit in your area. It's high-
  stakes work that touches every part of the product.

  You'll own the technical direction for this area and lead a
  small pod of engineers building it with you. You've done
  this before: you've been the person making the architecture
  calls on identity or access infrastructure that real
  customers depend on, and you chose to keep building rather
  than move into people management. You'll work closely with
  the CTO.

  What You'll Do

  - Own the architecture and technical direction for
    authentication and authorization across Warp's entire
    product
  - Design and lead the implementation of role-based and
    attribute-based access control systems that hold up as
    customers scale
  - Lead application provisioning and deprovisioning,
    automatically granting and revoking access as employees
    join, change roles, or leave
  - Own cross-platform MDM for macOS, Windows, iOS, and Android
  - Own the protocols that power it all: SAML, SCIM, OIDC, OAuth
  - Lead a pod of two to three engineers: set the technical bar,
    review their work, and grow them
  - Work directly with customers to define what automated IT
    management looks like at scale
  - Collaborate directly with the CTO and CEO on where identity
    and access go next
  - Help us scale 10x in the next year

  You'll Be Good for This Role If You

  - Have been the tech lead and primary decision maker on at
    least two meaningful identity, access, or security
    systems, and can explain the decisions you'd make
    differently now
  - Have built authentication or authorization systems. Not just
    configured them.
  - Have seen a system grow from a few customers to thousands
    and know what breaks along the way
  - Chose the technical track deliberately. You want to lead
    through architecture and code, not headcount.
  - Understand access control models (RBAC, ABAC) and how to
    implement them at scale
  - Have strong opinions about the tools you use and can explain
    the trade-offs behind them
  - Get energized by technically hard problems with serious
    security implications

  What You Need

  - 5+ years of software engineering experience, including
    leading technical efforts across a team
  - Deep familiarity with identity protocols: SAML, SCIM, OIDC,
    OAuth
  - Experience building or owning MDM or cross-platform device
    management
  - Experience designing access control systems at scale
  - Strong expertise in a modern, strongly typed language
  - Experience designing and operating reliable backend systems
  - Strong systems-level thinking and a security-first mindset
  - High agency and strong communication skills
  - Willingness to work from our NYC office five days a week

  Benefits at Warp:

  - 100% Health Coverage: Comprehensive medical, dental, and
    vision plans for you and your dependents.
  - 401(k) Matching: Start investing in your future from day
    one.
  - Flexible PTO: We offer uncapped flexible PTO, meaning you’re
    trusted to take the time you need to recharge while
    balancing your responsibilities and team commitments.
  - Commuter Benefits: Pre-tax commuter benefits for your daily
    trip to our NYC office.
  - Catered Lunch Daily: Great food, every day, on us. No meal
    prep, no decision fatigue.
  - Quarterly Offsites: Beautiful locations to connect as a
    team. Past locations include Spain, Catskills, and San
    Francisco.

  Warp is based in New York City, and most of our team works
  together in-office 5x per week. Please refer to the top of
  this page for this position's hiring location and working
  model.
