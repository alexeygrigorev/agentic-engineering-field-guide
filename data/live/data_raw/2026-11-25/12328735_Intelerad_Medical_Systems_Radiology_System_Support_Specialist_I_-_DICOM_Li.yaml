    such as FACTS)
  - Must be willing to complete all required onboarding steps,
    which may include background investigations,
    fingerprinting, and identity verification
  - Must comply with all client and government security
    requirements as a condition of continued employment

  Failure to obtain or maintain required clearance(s) or
  complete required steps within designated timeframes may
