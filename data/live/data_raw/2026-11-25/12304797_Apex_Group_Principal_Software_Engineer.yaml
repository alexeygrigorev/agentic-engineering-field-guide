  2Tocan - Principal Agentic AI Engineer

  Alongside that, the role carries a growing responsibility
  for determining where and how AI

  should be applied within the Tocan product itself. Delivery
  is the day one focus. Product is a real

  and near term direction rather than a distant aspiration.

  This is not a greenfield AI initiative. Tocan has already
  started the transition towards an AI native

  delivery model, and there is existing capability, tooling
  and agentic workflow in use today. The

  successful candidate will inherit that capability, form an
  independent technical view of it,

  determine what should be retained, strengthened or replaced,
  and take responsibility for

  industrialising it into a production grade, scalable
  engineering capability.

  The role reports to the Chief Technology Officer, with scope
  for an expanded remit once the

  foundational capability is established. The successful
  candidate will hire and lead two Senior

  Agentic AI Engineers and will shape how that team is built.

  This is a deeply hands on Principal level engineering role.
  We are not looking for an AI strategist

  operating several layers away from implementation. The
  successful candidate must be capable

  of engaging senior stakeholders, defining architecture and
  technical direction, and remaining

  directly involved in engineering, evaluation, testing,
  governance and production deployment.

  What Already Exists

  We would rather be specific than overstate our position,
  because the first thing the successful

  candidate will do is test it.

  Tocan has an agentic architecture in place built on
  Microsoft Copilot, with orchestration across a

  number of other AI capabilities. Its first substantial
  application has been testing within the

  Product Development Lifecycle, and that work is now
  extending into agents for UI design and

  front end software engineering. Separately, Google Gemini is
  already used for AI augmentation

  within the Tocan platform. Software development is currently
  delivered through a globally

  dispersed capability, and this role is the beginning of
  building deeper engineering capability in

  house.

  What exists is real, working and useful. It is not yet
  industrialised. The evaluation, observability,

  governance and engineering discipline required to run
  agentic delivery at production scale is

  largely still to be built, and that is the substance of this
  role.

  Some existing approaches may need to be strengthened. Some
  may need to be replaced.

  Others will provide the foundations on which the next
  generation of capability is built. The

  successful candidate will have the autonomy and the
  responsibility to make those judgements.

