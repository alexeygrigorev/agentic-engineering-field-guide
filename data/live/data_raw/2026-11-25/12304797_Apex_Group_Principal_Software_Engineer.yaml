  About Tocan

  Tocan is an investor onboarding platform for the private
  funds market.

  Onboarding an investor into a private fund remains one of
  the most manual processes in

  financial services. A single subscription can involve
  hundreds of pages of documentation,

  multiple entities across multiple jurisdictions, layered KYC
  and KYB requirements, and weeks of

  iteration between investors, wealth managers, fund managers
  and fund administrators. It is

  slow, expensive, error prone and almost entirely people
  intensive.

  Tocan digitises that process end to end through three
  connected portals: a Client Portal for

  investors, a Manager Portal for fund managers and wealth
  managers, and an Agent Portal for

  fund administrators. Every party works from a single,
  structured, auditable view of an

  onboarding, from initial interest through to accepted
  subscription.

  Tocan is majority owned by a global fund administration and
  financial services group, which is

  also our anchor client. That gives us something rare for a
  business of our size: direct access to

  institutional scale, real regulated volume, and a
  distribution route into a global client base,

  combined with the pace and autonomy of a small, focused
  product organisation.

  The problem is genuinely well suited to AI. Onboarding is
  document heavy, rules heavy,

  jurisdictionally complex and full of judgement currently
  applied manually by expert people at

  considerable cost. It is exactly the kind of domain where
  agentic systems can deliver material

  change, provided they are built with the rigour a regulated
  financial services environment

  demands.

  The Role

  Tocan is looking for a Principal Agentic AI Engineer to take
  technical ownership of how we build

  software.

  The immediate mandate is our agentic software delivery
  capability: the agents, tooling and

  orchestration Tocan uses across the Product Development
  Lifecycle. The objective is to

  accelerate our progression from human led, to AI augmented,
  to agent led, to increasingly

  autonomous product delivery.

