description: |
  JLL empowers you to shape a brighter way.

  Our people at JLL are shaping the future of real estate for
  a better world by combining world class services, advisory
  and technology for our clients. We are committed to hiring
  the best, most talented people and empowering them to
  thrive, grow meaningful careers and to find a place where
  they belong.  Whether you’ve got deep experience in
  commercial real estate, skilled trades or technology, or
  you’re looking to apply your relevant experience to a new
  industry, join our team as we help shape a brighter way
  forward.

  What this job involves:

  The Mobile Engineering Operations Manager drives operational
  excellence across a complex retail and facilities portfolio
  by leading maintenance operations, vendor management, and
  cross-functional collaboration. In this high-impact role,
  you'll partner directly with site leadership to optimize
  engineering performance, ensure equipment reliability, and
  deliver consistent service excellence. You'll build
  strategic client relationships, anticipate operational
  needs, and implement solutions that enhance both facility
  performance and workplace experience.

  What your day-to-day will look like:

  Service Delivery & Operations Management

  Work Order & Asset Management

  - Schedule and coordinate repairs, maintenance, and work
    requests across the portfolio, ensuring timely completion
    and KPI compliance
  - Maintain asset validation processes using Excel, Power
    Query, and Power Pivot to ensure data accuracy
  - Document data flows, transformation logic, and validation
    rules to maintain system integrity
  - Administer retail contact databases and coordinate monthly
    updates with stakeholder groups
  - Support operational planning through GIS portfolio mapping
    and geographic analysis
  - Identify service improvement opportunities and recommend
    site inspection priorities

  Vendor & Stakeholder Coordination

  - Provide clear direction to vendors, facilities staff, and
    service providers to ensure seamless work execution with
    minimal disruption
  - Support vendor procurement processes and ensure compliance
    with asset management protocols
  - Manage vendor onboarding in coordination with IFM Facility
    Coordinators
  - Oversee Master Lock Lockbox Program including programming,
    distribution, security governance, and battery monitoring

  Strategic Operations Support

  Workforce Planning & Deployment

  - Utilize Maptive and Excel modeling to optimize route
    assignments and resource allocation
  - Plan multi-state deployments considering union labor
    requirements and local regulations
  - Collaborate with regional managers on coverage models and
    adjust strategies based on operational needs
  - Manage escalations and provide solutions to deployment
    challenges

  Change Management & Process Improvement

  - Drive adoption of new systems and standardized processes
    across field operations
  - Develop training materials and build champion networks to
    support change initiatives
  - Monitor adoption metrics and proactively address resistance
    or implementation barriers
  - Deploy client-requested projects ensuring alignment with
    operational standards and contract requirements

  Emergency Preparedness & Safety

  - Maintain and enhance emergency response plans including
    evacuation procedures and after-hours protocols
  - Serve as site point of contact for facility-related matters
    and coordinate event logistics
  - Uphold safety and security support protocols across all
    operations

  Client Relationship Management

  Strategic Partnership

  - Build and maintain relationships with key stakeholders
    across operations, IT, and client teams
  - Participate in recurring forums and contribute to strategic
    decision-making processes
  - Serve as operational point of contact for GMR and Retail
    Violations programs
  - Ensure seamless communication on active initiatives and
    escalations

  Service Excellence

  - Ensure compliance with all client contract requirements and
    consistently meet or exceed KPIs
  - Deliver exceptional service quality as measured by client
    feedback and satisfaction metrics
  - Coordinate site operations in accordance with agreed
    policies, procedures, and contract scope

  Required Qualifications:

  Experience & Technical Knowledge

  - 3+ years in facilities management, property management,
    operations, or related field
  - Demonstrated experience with field service operations and
    deployment logistics
  - Proven ability to manage multiple concurrent workstreams
    with competing priorities
  - Experience driving process standardization and technology
    adoption across teams
  - Track record of successful cross-functional collaboration
    and stakeholder management

  Technical Proficiency

  - Advanced proficiency in Microsoft Office Suite (Excel,
    Outlook, Word, PowerPoint)
  - Experience with collaborative platforms (SharePoint, Teams)
  - Comfort learning and adapting to new technology platforms
    and tools

  Communication

  - Excellent written and verbal communication skills with
    ability to tailor messaging to different audiences
  - Confidence interacting with client stakeholders at various
    organizational levels
  - Experience facilitating meetings, presenting findings, and
    influencing outcomes
  - Strong relationship-building skills and customer service
    orientation

  Preferred Qualifications:

  - Knowledge of local occupational health and safety
    requirements
  - Experience in retail or commercial real estate environments
  - Familiarity with union labor considerations in multi-state
    operations
  - Experience with critical facilities and vendor management
    for specialized technical services
  - Understanding of building systems (HVAC, fire protection,
    mechanical & electrical systems)
  - Genuine interest in facilities management and operational
    excellence

  Work Schedule:

  8:00 AM – 5:00 PM (Monday – Friday)

  This position does not provide visa sponsorship. Candidates
  must be authorized to work in the United States without
  sponsorship.

  Expected compensation for this position:

  90,000.00 – 120,000.00 USD per year

  Final compensation packages are determined by various
  considerations including but not limited to candidate
  qualifications, location, market conditions, and internal
  considerations.

  Location:

  On-site –New York, NY

  If this job description resonates with you, we encourage you
  to apply, even if you don’t meet all the requirements.
  We’re interested in getting to know you and what you bring
  to the table!

  Personalized benefits that support personal well-being and
  growth:

  JLL recognizes the impact that the workplace can have on
  your wellness, so we offer a supportive culture and
  comprehensive benefits package that prioritizes mental,
  physical and emotional health. Some of these benefits
  include:

  - 401(k) plan with matching company contributions
  - Comprehensive Medical, Dental & Vision Care
  - Paid parental leave at 100% of salary
  - Paid Time Off and Company Holidays
  - Early access to earned wages through Daily Pay

  At JLL, we harness the power of artificial intelligence (AI)
  to efficiently accelerate meaningful connections between
  candidates and opportunities. Using AI capabilities, we
  analyze your application for relevant skills, experiences,
  and qualifications to generate valuable insights about how
  your unique profile aligns with the specific requirements of
