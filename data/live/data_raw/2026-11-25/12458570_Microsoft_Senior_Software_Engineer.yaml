description: |
  Overview

  Microsoft Ads 3rd Party Ads Solutions and Data Management
  Platforms is building the next innovative platform for AI-
  driven advertising. Our team empowers internal engineering
  teams through secure, scalable, and cost-effective on-prem
  and cloud infrastructure solutions. We are looking for a
  Senior Software Engineer who will help us maintain and
  evolve foundational Kubernetes and Azure platform
  capabilities that enable the Xandr on-prem to Azure
  migration to complete on time and ensure the resulting
  platform is stable, secure, and maintainable over the long
  term.

  As part of the Platform Engineering team, the Senior
  Software Engineer will partner with engineering teams,
  architects, and product groups to design, implement, and
  evangelize cloud and Kubernetes platform best practices, all
  while staying curious and open to trying new ideas.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.  

  Starting January 26, 2026, Microsoft AI (MAI) employees who
  live within a 50- mile commute of a designated Microsoft
  office in the U.S. or 25-mile commute of a non-U.S.,
  country-specific location are expected to work from the
  office at least four days per week. This expectation is
  subject to local law and may vary by jurisdiction.

  Responsibilities

  - Leads Infrastructure Design and Architecture: Analyze and
    understand challenges in on-prem and Azure platform and
    infrastructure solutions. Develop and build durable
    solutions for present and future states. Own the technical
    approach to create and improve architecture. Deeply
    understand evolving security risk, security research, and
    security tradeoffs associated with engineering patterns
    and approaches.
  - Guide cross-functional teams through architectural
    discussions and decision-making for solution components,
    including design, compliance, scaling, and cost
    considerations.
  - Develop and present architecture and design proposals: lead
    the testing and validation of hypotheses and proposed
    solutions.
  - Drive AKS enablement and workload onboarding: Support
    engineering teams transitioning to AKS by driving
    standardized onboarding tools, pipelines, Terraform
    modules, runbooks, and migration guides, and providing
    hands-on guidance.
  - Drive cross-cutting platform initiatives: Partner across
    teams to enable testing, workload certification, and
    migration programs and unblock adoption at scale.
  - Author Well-Designed, Scalable, Reliable Code: Author
    thoughtful, well-designed infrastructure code, including
    libraries for essential platform functions, proof-of-
    concept code, and bugs or foundational changes.
    Effectively share findings from technical investigations.
  - Collaborate with Partner Teams: Collaborate with the broader
    product engineering and product teams to understand
    product and platform architecture and develop thoughtful
    infrastructure improvements.
  - Lead the creation of design documentation: determine
    appropriate technologies and their interactions.
    Facilitate and contribute to design discussions, ensuring
    alignment across teams and incorporating learnings from
    prior work.
  - Nurture Talent: Mentor other engineers throughout the design
    and testing process.
  - Embody our culture and values.

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Other Requirements: Ability to meet Microsoft, customer
  and/or government security screening requirements are
  required for this role. These requirements include but are
  not limited to the following specialized security
  screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 8+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - 4+ years of experience designing, building, and operating
    developer productivity, CI/CD, or release engineering
    systems, including significant experience with Microsoft
    Azure (or AWS/GCP with solid Azure proficiency) and
    Infrastructure as Code such as Terraform or Bicep.
  - Solid proficiency in modern CI/CD and release engineering
    practices, including building, operating, and evolving
    pipelines using tools such as Azure DevOps Pipelines
    (preferred), Jenkins, Concourse, GitHub Actions, CircleCI,
    Spinnaker, or ArgoCD. Experience owning and supporting
    CI/CD pipelines used by multiple engineering teams,
    providing shared templates, guardrails, security, and
    reliability at scale.
  - Experience operating large-scale, globally distributed,
    highly available, 24/7 systems, with a focus on release
    reliability, security, and operational excellence.
  - Proficiency in modern software development practices,
    including code review, testing, release validation, and
    operational readiness, using languages such as Go, Python,
    or TypeScript.
  - Demonstrated ability to drive architectural direction across
    teams, influence technical decisions around build and
    release systems, and translate ambiguous requirements into
    scalable, durable release platforms.
  - Excellent written and verbal communication skills, including
    the ability to explain complex release, reliability, and
    automation concepts to diverse audiences.
  - Hands-on experience designing and maintaining shared
    infrastructure and tooling ecosystems, such as reusable
    Terraform modules, pipeline templates, and onboarding
    toolchains that improve developer velocity, experience,
    consistency, and security across teams.

