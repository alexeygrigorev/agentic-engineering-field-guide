description: |
  This role is based in the UK. You will be required to
  interview in person.

  About SailPoint

  SailPoint is the leader in identity security for the cloud
  enterprise. Our identity security solutions secure and
  enable thousands of companies worldwide, giving our
  customers unmatched visibility into the entirety of their
  digital workforce, ensuring workers have the right access to
  do their job – no more, no less. Built on a foundation of AI
  and ML, our Identity Security Cloud Platform delivers the
  right level of access to the right identities and resources
  at the right time—matching the scale, velocity, and changing
  needs of today’s cloud-oriented, modern enterprise.

  About the Role

  Join the team building SailPoint Observability & Insights,
  an industry-leading visualization capability for identity
  governance that shows every access path from identities to
  sensitive data and enables fast, policy-driven action from a
  unified view. As a Software Development Engineer in Test,
  you will take ownership of the quality and reliability of
  our platform. You will develop and implement automated
  testing frameworks, create extensive test plans, and ensure
  that processes consistently meet established quality
  standards across all layers of the testing trophy. Your day-
  to-day will involve utilizing a modern tech stack including
  Cypress, Selenium, Playwright, Pactflow, TestNG, PyTest, k6,
  Datadog, and CI/CD tools to drive several projects to
  completion from a quality perspective.

  About the Team

  You will be joining the dynamic and collaborative SailPoint
  Observability & Insights team, working closely with
  engineers, engineering managers, and product managers. In
  addition to our core visualization platform, our team owns
  Response & Remediation—an incident response capability that
  allows admins to detect and respond to threats from external
  systems—along with an exciting new product slated for
  release this year. We are a team that values quality, cross-
  functional collaboration, and continuous improvement, and we
  rely on our SDETs to act as technical mentors and customer
  advocates.

  Roadmap for Success30 Days

  - Ramp up on existing Observability & Insights testing, key
    pipelines, and operational practices.
  - Deliver scoped testing improvements to fill missing gaps in
    the testing trophy and production deployment monitoring
    for Observability & Insights, Response and Remediation,
    and our new product.
  - Build effective working relationships within the team and
    with immediate partner teams.
  - Gain foundational knowledge in the Identity Governance
    domain via hands-on learning and formal training sessions.

  60 Days

  - Own the majority of the testing process and infrastructure
    with absolute confidence in quality and coverage.
  - Propose and implement broader improvements to testing,
    including establishing new tests run as part of CI
    pipelines.
  - Mentor other members of the team on testing best practices
    and framework adoption.
  - Write comprehensive test plans that provide thorough test
    coverage for both critical and edge case scenarios based
    on business requirements.

  6 Months

  - Operate as the trusted test owner of the product, with your
    test improvements making a considerable impact on the
    quality and reliability of releases.
  - Collaborate in a well-honed and efficient manner with the
    whole team to ensure all new and existing features receive
    a solid level of testing coverage.
  - Strengthen team practices through rigorous code reviews,
    tooling enhancements, mentorship, and clear documentation.
  - Verify the quality of features added or enhanced in the
    product, acting as a customer advocate to ensure offerings
    are well-designed and easy to use.

  1 Year

  - Drive the long-term automation testing strategy and
    framework architecture across the entire Observability &
    Insights suite.
  - Ensure testing processes scale alongside the growth of the
    team and the introduction of new features and product
    lines.
  - Participate actively in on-call rotations for data systems
    and drive incident learnings into lasting, automated
    quality fixes.

  Requirements

  - Bachelors degree in related field, or equivalent
    professional experience
  - 5+ years of experience in a SDET/Automation Test Engineering
    role.
  - 5+ years of designing, developing, and maintaining
    functional UI test framework with frameworks such as
    Cypress, Selenium, or Playwright.
  - 3+ years of experience designing, developing, and
    maintaining automated integration testing of APIs with
    tools such as Pactflow, TestNG, PyTest, or Selenium.
  - 2+ years developing and/or maintaining performance tests
    with frameworks such as k6, karate, or loadster.
  - Experience acting as a technical mentor to help drive
    adoption of new frameworks and automation testing best
    practices.
  - Experience working with monitoring and system logs utilizing
    tools like Datadog to help identify potential defects.
  - Experience working with CI/CD to help drive parallel
    development of test coverage alongside release code to
    optimize deployment quality.
  - Experience working in agile environments and proficiency
    with project management tools such as Jira and Confluence.
  - Have excellent written and oral English communication
    skills.
  - Experience testing graph-based visualization products is
    preferred.
  - Experience with security testing and accessibility testing
    is preferred.
  - Experience working with a distributed team is preferred.

  Benefits

  At SailPoint, we empower businesses to take control of
  identity security—and we do the same for our people. Whether
  you're engineering solutions, advising customers, or
  accelerating business growth, you’ll expand your skills,
  collaborate with top talent, and grow with purpose. Benefits
  are dependent upon your country location however SailPoint
  provides: Competitive pay Medical, dental and vision plans
  Paid Holidays Career and growth opportunities

  SailPoint is an equal opportunity employer and we welcome
  all qualified candidates to apply to join our team.  All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, protected veteran status, or any other category
  protected by applicable law.

  Alternative methods of applying for employment are available
  to individuals unable to submit an application through this
  site because of a disability. Contact
  applicationassistance@sailpoint.com or mail to 11120 Four
  Points Dr, Suite 100, Austin, TX 78726, to discuss
  reasonable accommodations.  NOTE: Any unsolicited resumes
  sent by candidates or agencies to this email will not be
  considered for current openings at SailPoint.
