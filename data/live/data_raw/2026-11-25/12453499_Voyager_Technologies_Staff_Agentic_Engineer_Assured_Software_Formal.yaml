description: |
  Voyager is an innovative space, defense, and national
  security technology company committed to advancing and
  delivering transformative, mission-critical solutions. We
  tackle the most complex challenges to unlock new frontiers
  for human progress, fortify national security, and protect
  critical assets to lead in the race for technological and
  operational superiority from ground to space.

  Forge the Future: Join Voyager Technologies

  The future belongs to those who build it. At Voyager
  Technologies, we’re building technologies that protect
  lives, expand frontiers and prepare us for what’s next. And
  we’re doing that with people who are wired to solve, build,
  adapt and lead. These roles are not for the faint of heart. 

  You’ll help lay the foundation for humanity's future. Join a
  culture where innovation thrives, curiosity is rewarded, and
  impact is real. We’re a company of doers, thinkers and
  builders, united by purpose and grounded in reality.

  If you want to put your skills to work where the stakes are
  real and the mission is bigger than any one person, forge
  the future with Voyager.

  We are seeking a Staff Agentic Engineer with passion for
  bringing together LLMs and formal methods to create
  bulletproof software and hardware. You will architect and
  build the pipeline from systems models to verified software,
  define how agent-generated evidence earns certification
  credit, and build and lead the team that does it.

  You will be joining an early-stage team within Voyager's
  Advanced Technology Group building an AI-native engineering
  platform. We hire curious, highly motivated domain experts
  who already build with AI and have the taste to know what
  good looks like.

  If your experience aligns with our basic qualifications and
  you are inspired by our mission, we’d like to connect. If
  you don’t see the right role right now, Join Our Talent
  Community and stay connected as we continue to build what’s
  next.

  Responsibilities:

  - Architect an agentic pipeline from systems-engineering
    models to typed interfaces, ICDs, and verified parser and
    protocol code (e.g., EverParse/F*).
  - Define the methodology and approach for agent-written
    modules to ship using machine-generated tests and proofs
    along with the required certification evidence.
  - Own the tool-qualification strategy (DO-330) and work with
    DERs and certification authorities.
  - Design the agents, skills, and evals that generate and
    repair proofs and measure where they fail.
  - Implement methods to ensure proofs capture the design
    intent.
  - Benchmark the approach head-to-head against conventional
    development.
  - Hire, lead, and mentor engineers; capture every check,
    proof, and failure as structured data for future model
    training.

  Required Qualifications:

  - Bachelor's or Master's degree in Mathematics, Computer
    Science, Physics, or Engineering with 10+ years of safety-
    critical software (DO-178C DAL A/B, NPR 7150.2 Class A/B,
    or equivalent) and/or formal methods work.
  - Hands-on formal methods: F*/EverParse, Coq/Rocq, Lean,
    Isabelle, SPARK/Ada, Frama-C, or others.
  - Has authored certification evidence packages for safety-
    critical systems.
  - Working proficiency with Claude Code or Codex.
  - Critical thinker and excellent communicator.
  - S. citizen with ability to obtain and maintain a U.S. Secret
    Security Clearance. TS preferred.

  Preferred Qualifications:

  - PhD in programming languages or formal verification.
  - Qualified a tool under DO-330.
  - Verified parsers, protocols, or compilers (EverParse,
    CompCert, seL4).
  - Reinforcement learning with verifiable rewards or fine-
    tuning LLMs for code or proofs.
  - LLM formal methods experience.

  Travel, Physical and/or Government Mandated Requirements:

  - Remote (U.S.), with periodic travel to Voyager locations
    (Los Angeles, CA; Washington, D.C.; Seattle, WA) for lab
    work, hardware test events, and technical reviews.
  - Clearance Required: Ability to obtain and maintain a U.S.
    Secret Security Clearance. TS preferred.

  This offer is contingent upon your being a U.S. citizen and
  requires the ability to obtain and maintain a Clearance
  Level U.S. Government security clearance, access
  eligibility, and need-to-know required for the position and
  applicable government contract. Clearance eligibility is
  determined by our U.S. Government customer.

  The good faith base salary range for this role is
  $180,000-$210,000 at the time of this posting. Where you
  fall within the range depends on your experience, skills,
  and location. This range reflects base salary only and does
  not include benefits or bonus/incentive. This range may be
  adjusted in the future.

  Voyager offers a highly competitive total compensation
  package designed to support the well-being, growth, and
  success of our employees. Employees benefit from a flexible
  and comprehensive rewards program that supports both
  professional and personal well-being.

  - Flexible Time Off (FTO), empowering employees to take the
    time they need to recharge and maintain a healthy work-
    life balance
  - Comprehensive medical, dental, and vision coverage for
    employees and their families, with a significant portion
    of premiums covered by the company and many benefits paid
    at 100% for employees
  - Flexible, affordable gym memberships with 12,700+ options
    nationwide, including 24 Hour Fitness, EoS Fitness, Crunch
    Fitness, Anytime Fitness, Blink Fitness, Chuze Fitness,
    and more! No long-term contracts and FREE on-demand
    workout videos before you enroll
  - 401(k) retirement plan with a 50% company match on
    contributions up to 8%, supporting long-term financial
    security
  - Company wellness programs that support physical and mental
    well-being
  - Additional voluntary benefits and employee support resources
  - The opportunity to work alongside a highly talented team in
    an innovative, mission-driven environment

