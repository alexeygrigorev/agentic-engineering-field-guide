description: |
  Are you ready to own something big? Automox is turning IT
  admins into IT heroes by replacing traditional tools with
  our award winning cloud-native endpoint management platform.
  Our product works autonomously and so do our teams. We value
  a ‘one team’ mentality where everyone’s unique skills
  contribute to an environment that encourages collaboration
  and ownership. At Automox you’re enabled to do your best
  work, grow your career, and have an impact that will be
  noticeable. WE ARE A_TOMOX… all that’s missing is U!

  OUR TECH STACK

  - Backend Languages: Go, TypeScript, Java, PHP
  - Frontend Languages: TypeScript, Vue 3, Tauri (Rust)
  - Operating Systems: Windows, Linux, MacOS
  - Databases/Data Tools: PostgreSQL, DynamoDB, Redis, S3

  OVERVIEW

  Our Engineering team builds products that autonomously
  manage endpoint configuration, security, and patching across
  Windows, macOS, and Linux devices. We value a "one team"
  mentality, empowering our engineers with autonomy,
  collaboration, and meaningful ownership of impactful
  solutions. At Automox, you’ll do your best work, grow your
  career, and see the direct impact of your contributions.

  You are a curious software developer who is dedicated to
  your craft and enjoys solving big problems; you write code
  that you are proud of and can hit the ground running with
  support from the team. You understand that SaaS software
  delivery necessitates innovation and speed of execution.
  You want to be a part of a creative and enterprising team
  with challenging problems to solve. You pride yourself in
  owning problems but don’t want to work in a vacuum to solve
  them.  Collaborating with the team to come up with the best
  solution for your customer is what fuels your fire.

  WHAT YOU'LL BE DOING

  - Research, design, develop, secure and solutions that
    facilitate communications with over 2 millionAutomox
    agents deployed globally.
  - Extend, enhance, and evolve event driven services to provide
    new and exciting features in the Automox platform and in
    our endpoint software.
  - Contribute to continuous improvement by testing, performance
    tuning, refactoring, making usability improvements, and
    automation.
  - Evaluate technical options, make a clear recommendation, and
    move forward in a way that invites feedback and iteration.
  - Operate with a quality-first mindset. Your approach to
    testing sets you apart from your peers.
  - Make data-driven decisions. You understand the impact of
    your development before it reaches production.

  BACKGROUND AND SKILLS REQUIRED

  - Programming experience in Golang or Java is preferred
    although we'll consider polyglots. The right candidate
    will show versatility writing and developing software in a
    variety of languages over their career.
  - 3 - 5 years of experience designing, developing, testing,
    and monitoring applications deployed in a high
    availability SaaS environment.
  - Professional experience shipping frontend features in a
    modern JavaScript framework using TypeScript. You don’t
    need to be a UI specialist, but you should be comfortable
    owning the UI half of a feature you built the backend for.
  - Experience building production applications in cloud
    environments (AWS) with a strong emphasis on security best
    practices.
  - Enjoy scaling microservice architectures and large-scale
    event ingestion platforms. Have familiarity scaling
    websockets, real-time messaging systems (Kafka, MQTT), and
    non-relational database systems like DynamoDB, and DevOps.
  - Excellent communicator, thrives within a tightly knit,
    cross-functional remote team environment.
  - Impactful collaborator working with other engineers, Product
    Managers, Program Managers and Technical Support.

  NICE TO HAVE

  - Experience building desktop or cross-platform applications.
  - Experience with software that runs on customer endpoints
    across macOS, Windows, or Linux (such as agents,
    installers, or system services).
  - Experience writing automated end-to-end tests (Python,
    Playwright, or similar)

  How We Work

  We run a 70/20/10 model across our engineering pods: 70% of
  sprint capacity goes to primary roadmap, 20% to tech debt
  and service health, and 10% to learning and exploration.
  That last 10% is protected — it's how we invest in our
  engineers and stay sharp as a team.

  We're moving toward full service ownership, where the team
  that builds it, runs it. That means you'll understand your
  services at a level most engineers don't get to — cost
  profiles, failure modes, operational behavior — and you'll
  have the autonomy to make them better.

  We have an Architecture Review Board (led by our Principal
  Engineer) that provides guardrails and review for
  significant technical decisions. You'll have input there as
  your experience grows.



  The salary range listed is the base pay range for this
  position. In addition, the total compensation package
  includes bonus, equity and benefits. Actual earnings may be
  less or more depending on a candidate's direct experience,
  skills, industry knowledge, and location.

  Compensation

  $122,000—$160,000 USD

  LOCATION

  We are a fully distributed company of remote employees.

  ***Note: We currently don't hire in California or New York
  metro***

  ABOUT AUTOMOX

  Automox is the cloud-native IT operations platform for
  modern organizations. Our award-winning answer to modern IT
  operations and best-in-class results earned Automox four
  straight quarters of record growth. We are now trusted by
  more than 2,500 leading companies and MSPs worldwide,
  including NASA, Yale, Xerox, Allbirds, and Unicef. It makes
  it easy to keep every endpoint automatically configured,
  patched, and secured – anywhere in the world. The future of
  IT Operations is cloud-native – and right now. Will you join
  us?

