description: |
  Tapestry PRM · New York, NY · Full-time employee · In person

  The role

  Build how Tapestry finds, ranks, and explains credible paths
  to an introduction, and when to suggest no one. You will
  work across relationship modeling, recommendations, product
  behavior, and evaluation, with responsibility for what
  members experience on both sides of an ask.

  About Tapestry PRM

  Own your network. Keep your relationship history private.
  Discover who can connect you.

  Tapestry is a personal CRM for founders and operators. Look
  up a company, see whom you know there, and reopen the last
  conversation before deciding whom to ask for an
  introduction.

  Our mission is to help people remember what matters,
  reconnect with purpose, and discover who can help, while
  keeping control of their relationship history.

  We believe trusted relationships and personal context become
  more valuable as AI makes execution easier. Our vision is to
  make that context useful whenever people need it: preparing
  for a conversation, offering help, reconnecting, or finding
  a path to someone they want to meet. We want people to show
  up prepared, thoughtful, useful, and connected.

  Our founder

  Andrew Stroup founded Leverage AI (acquired) and co-founded
  MegaBots and Project N95, which worked with the White House
  to secure medical supplies during COVID-19. He previously
  led product and technology for the White House Presidential
  Innovation Fellows, worked at the Pentagon, and served as
  Entrepreneur in Residence at Bank of America. He also
  competed on Discovery Channel’s engineering series, The Big
  Brain Theory.

  Why join now

  You’ll work directly with the founder and help shape the
  product, the company, and how we operate. We’re building in
  person in New York City, using AI throughout research,
  development, and operations. Expect fast decisions, direct
  feedback, and responsibility for taking work from an idea
  through delivery and learning from the result.

  What you will own

  - Model people, organizations, and relationships over time,
    using only sources members authorize. Handle sparse, old,
    conflicting, and incorrectly linked information.
  - Build and evaluate introduction-path recommendations. Start
    with simple baselines, suppress plausible suggestions with
    weak evidence, and explain results with information the
    member has permission to see.
  - Preserve community boundaries: members see names and roles
    on the roster; company lookups show a count. A requester
    learns which member can help only after that member
    agrees.
  - Account for the person receiving the request, including
    repeated asks that could wear out a relationship.
  - Design voluntary, content-free feedback to learn whether a
    suggestion led to a useful introduction or an unwanted
    ask, without collecting private conversations.
  - Ship and evaluate features with the team. Use AI development
    tools to accelerate implementation while reviewing code,
    testing behavior, and protecting private data.

  Your first 90 days

  - Understand the existing graph, permissions, recommendation
    behavior, and failure cases.
  - Establish a simple evaluation baseline and a documented set
    of difficult cases.
  - Ship an improvement, then assess usefulness, incorrect
    suggestions, and the effects on people receiving requests.

  What you bring

  You have personally shipped people discovery, connection
  recommendations, mutual connections, relationship ranking,
  or another two-sided social product. Experience at a small
  company counts just as much as experience at a large
  platform.

  You can explain technical tradeoffs, investigate data
  quality, and judge when a recommendation should be withheld.
  Show us how you evaluate usefulness beyond clicks.

  How we work

  We work in person in New York City. This is a full-time
  employee role with no visa sponsorship.

  Expect an intense early-stage environment: fast decisions,
  direct feedback, hands-on work, and ownership through
  delivery. We value urgency and careful judgment.

  Apply

  Apply through our careers page with a public or anonymized
  feature you owned, a plausible recommendation you
  deliberately suppressed, and how you learned whether people
  benefited. Include a short explanation of what you
  personally built.

  Before applying, sign up at https://tapestryprm.com and try
  Tapestry. Include one specific observation, piece of
  feedback, or bug report in your application. Tell us what
  you tried and what happened. If reporting a bug, include
  steps to reproduce it and what you expected. Keep private
  contacts, messages, and relationship details out of your
  submission.
