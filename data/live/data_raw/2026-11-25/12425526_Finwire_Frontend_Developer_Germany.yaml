description: |
  Recruitee develops innovative SaaS Recruitment Software to
  help companies hire better, and we are on a mission to make
  great hiring accessible to all. 🤲

  We’re headquartered in Amsterdam with offices in Poznan,
  Wroclaw, and Paris! Our international team just crossed 180
  happy employees of 25 nationalities. We are proud of our
  humble beginnings, which have now transformed into rocketing
  growth with over 4,500 much-loved customers worldwide, and
  we are not stopping here!

  Due to the constant growth of our product and solving
  challenges in the application's codebase and scalability, we
  want to hire fresh blood for backend development. Whatever
  technology you come from—RoR, Python, Golang, PHP, or
  Java—you might be our next Programmer working in the most
  appealing technology on the market: Elixir!

  We have a few experienced teams where you would grow as a
  Backend Developer: Core, Foundation, or Careers. 🚀

  Our backend and main API are written in Elixir (REST +
  WebSockets), and we leverage the best available in the
  Phoenix framework and OTP. The whole project includes a few
  separate applications driven by microservices. Other
  services are developed in Ruby on Rails and Python/Flask.

  - Strong motivation to switch into Elixir programming after
    delivering projects in any other backend language.
  - Experience in building scalable applications.
  - Solid knowledge of databases (preferably PostgreSQL).
  - General knowledge of ElasticSearch.
  - Good command of Polish and intermediate English. We speak in
    dev teams mainly in Polish, while documentation and
    communication with other branches are held in English.
  - Putting stress on quality and error-free solutions.
