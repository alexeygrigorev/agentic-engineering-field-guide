description: |
  Senior Software Engineer – Permanent - £60,000 - £70,000

  Join us and be part of a mission-driven, independent
  publisher. You’ll work with a diverse group of people who
  share a passion for empowering researchers, educators, and
  institutions to shape the future.

  About Sage:

  Sage is a global academic publisher of books, journals, and
  library resources with a growing range of technologies to
  enable discovery, access, and engagement. Believing that
  research and education are critical in shaping society, Sara
  Miller McCune founded Sage in 1965. Today, we are controlled
  by a group of trustees charged with maintaining our
  independence and mission indefinitely. 

  Our guaranteed independence means we’re free to:

  - Do more – supporting an equitable academic future,
    furthering disciplines that drive social change, and
    helping social and behavioural science make an impact
  - Work together – building lasting relationships, championing
    diverse perspectives, and co-creating resources to
    transform teaching and learning
  - Think long-term – experimenting, taking risks, and investing
    in new ideas

  About our Team:

  You’ll join a collaborative, multi‑disciplinary engineering
  team that builds the publishing systems powering critical
  business operations across content delivery, access control,
  workflow, analytics, eCommerce, finance, and metadata
  management. Working closely with product managers,
  architects, designers, and stakeholders across multiple
  business units, the team focuses on creating reliable,
  scalable, and modern solutions that enable colleagues and
  customers to work, learn, and innovate with confidence.
  Together, we champion continuous improvement, shared
  learning, and inclusive engineering practices that help
  every team member thrive.

  Could you be our new Senior Software Engineer? Are you?

  - Experienced in full‑stack engineering with a strong track
    record of delivering complex solutions on modern
    technology - Microsoft stack strongly preferred (.NET, C#,
    Azure, SQL Server).
  - Skilled in cloud development with hands-on experience
    designing, deploying, and operating solutions preferably
    in Azure (Functions, Service Bus, Cosmos DB, Key Vault, or
    equivalents).
  - Curious about AI‑enabled development and understand concepts
    like LLMs, prompt engineering, and workflow orchestration,
    and you're keen to explore how they change the way
    software gets built.
  - Able to apply AI responsibly to accelerate analysis, coding,
    testing, documentation, and day to day productivity while
    ensuring accuracy, security, and maintainability.
  - Attentive to security and governance with awareness of data
    protection, access control, auditability, and risk as part
    of the design consideration.
  - Collaborative and self‑directed with experience contributing
    effectively to remote Agile teams.
  - Analytical and detail‑oriented with the ability to
    prioritise, work through ambiguity, and deliver high-
    quality work under time pressure.
  - A supportive technical leader recognised for mentoring
    others, sharing expertise, and continuously developing
    your own skills.

  Your new role:

  This role shapes the technical direction of our publishing
  platforms, designing and developing sophisticated solutions
  that support business‑critical outcomes. You’ll contribute
  to architecture decisions, build high‑quality software, and
  influence engineering standards across teams. Your work will
  directly improve system reliability, developer experience,
  and customer impact.

  - Deliver scalable solutions that meet business needs through
    robust full‑stack development and thoughtful architectural
    design.
  - Advance technical direction by contributing to multi‑team
    architecture, patterns, and engineering practices.
  - Enhance existing systems through continuous improvement,
    optimisation, and modernisation of features and
    capabilities.
  - Strengthen platform reliability by implementing high‑quality
    enhancements, resolving issues, and ensuring seamless
    integration across products.
  - Champion engineering excellence by researching and applying
    modern standards, tools, and approaches—including
    responsible use of AI‑assisted development.
  - Support team growth by mentoring colleagues, sharing
    knowledge, and contributing positively to team culture.
  - Drive Agile collaboration through active participation in
    ceremonies, cross‑team discussions, and remote‑first ways
    of working.
  - Solve complex problems independently while helping others
    navigate challenges with clarity and confidence.

  Overview of benefits:

  - 25 days annual leave (plus bank holidays) with 2 additional
    floating personal days.
  - Home working allowance
  - Life assurance, income protection, and travel insurance.
  - Private medical cover and access to the company doctor.
  - Tuition scheme and support for pursuing professional
    qualifications, including access to Sage books and
    journals.
  - Variety of snacks and beverages available in the office.
  - Healthy lifestyle reimbursement and anniversary trips.
  - Access to Company loans (season ticket loan, rental deposit
    loan, cycle loan).

  We’re a Disability Confident Employer (Level 1). If you’d
  like to apply under this scheme, please let us know in your
  application.

  We’re committed to making our recruitment process accessible
  and inclusive. If you’d like to request reasonable
  adjustments, please email humanresources@sagepub.co.uk.
  Please note we only accept applications via email if an
  adjustment has been agreed.

  Closing date for applications: Thursday 26th November 2026

  To ensure we can give each application the attention it
  deserves, we may consider bringing the closing date forward.
  Therefore, we encourage you to submit your application as
  soon as possible to ensure it is considered.

  Diversity, Equity, and Inclusion

  At Sage, we are committed to building a diverse and
  inclusive team and to sustaining a culture that celebrates
  diversity, encourages authenticity, and builds a deep sense
  of belonging. We encourage applications from all members of
  society irrespective of age, disability, sex or gender
  identity, sexual orientation, colour, race, nationality,
  ethnic or national origin, religion, or belief as crafting
  value through diversity is what makes us strong.
