description: |
  About Us

  In 2019, the founders were working as engineers solving
  complex cross-domain problems within government
  organisations.

  TwinStream was formed to bring together their collective
  expertise and experience into a single business, focused on
  delivering technical excellence and high-quality service to
  clients.

  Since then, the company has grown to over 100 team members
  across the UK, with colleagues working both on-site with
  clients, hybrid and remotely from home.

  Details

  Salary: Up to £100,000 Location: Remote Security Clearance:
  BPSS

  About the Role

  We're looking for an experienced Principal Software Engineer
  (Java) to join TwinStream and play a key role in designing,
  developing and delivering complex software solutions within
  our cross-domain security systems.

  As a Principal Software Engineer, you'll be a technical
  leader within an agile development team, combining hands-on
  software engineering with technical guidance, mentoring and
  architectural input.

  You'll be involved throughout the entire software
  development lifecycle, from understanding business
  requirements and designing solutions through to coding,
  testing, deployment and ongoing support.

  At TwinStream, our engineers are more than just developers.
  We value people who understand the bigger picture, enjoy
  solving complex technical challenges and are passionate
  about sharing their knowledge to help others grow.

  This is an excellent opportunity for someone who enjoys
  remaining hands-on technically while helping shape
  engineering best practices and supporting the development of
  other engineers.

  Responsibilities

  - Take a leading role in designing, developing and delivering
    high-quality, scalable software solutions.
  - Translate high-level business and technical requirements
    into effective engineering solutions.
  - Provide technical leadership and guidance to engineers
    across the development team.
  - Mentor and support junior and mid-level engineers, sharing
    knowledge, providing constructive feedback and helping
    them develop their technical skills.
  - Remain hands-on with Java development, contributing to
    complex features and technical problem-solving.
  - Investigate new technologies and recommend improvements to
    existing systems and development practices.
  - Champion engineering best practices, including clean code,
    automated testing, code reviews and continuous delivery.
  - Lead and contribute to technical design discussions and
    architectural decisions.
  - Develop and maintain automated tests, including unit,
    integration, acceptance and performance testing.
  - Collaborate with DevOps specialists to build and improve
    deployment pipelines and infrastructure.
  - Investigate and resolve complex technical issues, including
    escalations from third-line support.
  - Participate in technical estimation, planning and delivery
    activities.
  - Encourage collaboration, knowledge sharing and continuous
    improvement across engineering teams.

  Key Skills & Experience

  We're looking for someone with strong technical expertise, a
  collaborative mindset and the ability to positively
  influence engineering teams.

  - Extensive commercial experience developing software using
    Java and Spring Boot.
  - Proven experience working as a Senior, Lead or Principal
    Software Engineer.
  - Strong understanding of software architecture, design
    principles and building scalable, maintainable
    applications.
  - Experience working with cloud technologies, ideally AWS.
  - Strong knowledge of microservices and RESTful APIs.
  - Experience with containerisation technologies such as Docker
    and Kubernetes.
  - A solid understanding of CI/CD pipelines and modern DevOps
    practices.
  - Experience working in agile environments, including TDD,
    BDD, pair programming and continuous delivery.
  - Excellent problem-solving skills, particularly when dealing
    with complex technical challenges.
  - Experience mentoring, coaching or providing technical
    guidance to other software engineers.
  - Confidence in leading technical discussions, reviewing code
    and influencing engineering decisions.
  - Strong communication skills and a positive, collaborative
    approach to working with others.

  Core Technologies

  Java is our primary development language, with Spring Boot
  forming a key part of our technology stack.

  You'll have the opportunity to work with a range of modern
  technologies, including:

  - Languages: Java, with occasional exposure to Python,
    JavaScript, Golang and Bash.
  - Frameworks: Spring Boot, JPA and REST APIs.
  - Cloud: AWS (S3, Fargate, Lambda, SQS/SNS).
  - Databases: PostgreSQL, Oracle, MongoDB and DynamoDB.
  - Messaging: RabbitMQ.
  - Containers & Orchestration: Docker and Kubernetes.
  - Infrastructure as Code: Terraform and Ansible.
  - CI/CD & Version Control: Jenkins, Git, Bitbucket and GitLab.
  - Operating Systems: Linux.

  You don't need to have experience with every technology
  listed, but we're looking for someone with strong Java
  expertise and the ability to quickly learn and adapt.

  Desirable Skills

  - Experience with OpenShift and Docker Compose/Swarm.
  - Strong knowledge of Terraform and Ansible.
  - Experience developing applications or automation using
    Python.
  - Experience contributing to software architecture and
    technical strategy.
  - Previous experience leading technical initiatives or
    supporting engineering teams through complex projects.

  What You’ll Get

  - Competitive salary and benefits package

  - 28 days’ holiday plus bank holidays, with the option to buy
    or sell an additional week

  - Annual bonus

  - 8% non-contributory pension

  - Private healthcare and life insurance

  - Enhanced parental leave

  - Flexible working

  - Opportunities for learning, development, and career
    progression

  - Supportive and inclusive team environment

  - The chance to work on meaningful projects

  AI & Innovation

  We're looking for people who are curious about emerging
  technologies, open to using AI tools and eager to use AI
  tools to work smarter, solve problems and improve
  efficiency.

  Experience using AI-powered tools in your day-to-day work is
  welcomed, but equally important is a willingness to learn,
  adapt and explore new ways of working.

  Given the nature of our work, a strong understanding of
  responsible AI use, data security and confidentiality is
  essential.

  Diversity & Inclusion

  We’re committed to building a diverse and inclusive
  workplace. We welcome applications from people of all
  backgrounds, experiences, and identities.

  If you need any adjustments during the recruitment process,
  please let us know. We’re here to support you

  Further Information

  Due to the nature of the work and the sectors we support,
  any offer of employment will be subject to the successful
  completion of the relevant security screening and clearance
  process.

  This role requires eligibility for [BPSS / SC / DV]
  clearance. As part of the vetting process, candidates must
  meet the UK Government's residency and right-to-work
  requirements associated with the required level of
  clearance.
