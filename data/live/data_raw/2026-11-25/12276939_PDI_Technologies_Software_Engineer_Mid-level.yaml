description: |
  At PDI Technologies, we empower some of the world's leading
  convenience retail and petroleum brands with cutting-edge
  technology solutions that drive growth and operational
  efficiency. By “Connecting Convenience” across the globe, we
  empower businesses to increase productivity, make more
  informed decisions, and engage faster with customers through
  loyalty programs, shopper insights, and unmatched real-time
  market intelligence via mobile applications, such as
  GasBuddy.  We’re a global team committed to excellence,
  collaboration, and driving real impact. Explore our
  opportunities and become part of a company that values
  diversity, integrity, and growth.

  The Opportunity

  Are you a C# engineer who enjoys building reliable, high-
  performance software and is excited about the possibilities
  of AI?

  We’re looking for a Software Engineer II – AI & C# to join
  our team and help build and enhance PDI’s market-leading POS
  and back-office solutions. This role is a great opportunity
  for an experienced software engineer who has strong C#/.NET
  fundamentals and wants to expand their hands-on experience
  with artificial intelligence.

  You do not need prior production AI experience. We’re
  looking for solid engineering skills, curiosity, and a
  desire to learn.

  You’ll work as part of an agile engineering team designing,
  developing, testing, and supporting enterprise software
  while helping introduce practical AI capabilities into our
  products. You’ll collaborate closely with engineers,
  architects, product owners, UX, QA, SRE, and operations to
  deliver scalable solutions that solve real business
  problems.

  What You'll Do

  What We're Looking For

  Nice to Have

  This is an opportunity to build on your existing software
  engineering experience while developing skills in one of the
  fastest-moving areas of technology. You’ll have the chance
  to experiment with AI, learn from experienced engineers and
  architects, and turn new ideas into features that solve real
  problems for PDI customers.

  You don’t need to come in as an AI expert. Bring your
  C#/.NET expertise, engineering mindset, and curiosity. We’ll
  give you the opportunity to grow the rest.

  PDI is committed to offering a well-rounded benefits
  program, designed to support and care for you, and your
  family throughout your life and career.  This includes a
  competitive salary, market-competitive benefits, and a
  quarterly perks program. We encourage a good work-life
  balance with ample time off [time away] and, where
  appropriate, hybrid working arrangements.  Employees have
  access to continuous learning, professional certifications,
  and leadership development opportunities. Our global culture
  fosters diversity, inclusion, and values authenticity,
  trust, curiosity, and diversity of thought, ensuring a
  supportive environment for all.
