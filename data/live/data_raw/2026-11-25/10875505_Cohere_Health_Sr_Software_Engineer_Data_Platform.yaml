description: |
  Opportunity Overview:

  This is a remote-first role that may require travel to
  Boston, MA for new hire onboarding and occasional in-person
  team meetings and company events.

  We’re seeking a Senior Software Engineer to join our Data
  Platform team and take ownership of designing and delivering
  large-scale, reliable, and governed data pipelines that
  power analytics, operations, and clinical intelligence
  across Cohere Health. This role is ideal for an engineer who
  thrives on solving complex data challenges, mentoring
  others, and raising engineering standards while contributing
  to scalable and sustainable platform growth.

  As a Senior Software Engineer of the data platform team,
  you’ll operate across the end-to-end data lifecycle—from
  ingestion to transformation to integration—driving solutions
  that align with architectural best practices, governance
  needs, and business outcomes. You’ll partner closely with
  analytics engineers, architects, and product stakeholders to
  ensure that data products are performant, compliant, and
  trustworthy.

  What you’ll do:

  - Lead the design and implementation of complex data pipelines
    and infrastructure across multiple domains
  - Mentor junior engineers, sharing expertise and raising team-
    wide engineering standards
  - Implement and enforce data quality, schema validation, and
    observability practices to ensure trustworthy outputs
  - Contribute to architecture discussions and tool evaluation,
    helping to shape platform scalability and governance
    alignment
  - Write clean, maintainable, and testable code in Python and
    SQL, following best practices in version control, CI/CD,
    and documentation
  - Optimize and monitor production workflows using tools such
    as Airflow, dbt, Athena, EMR, Kafka, and Iceberg/Parquet
  - Collaborate with cross-functional stakeholders (analytics,
    product, compliance) to ensure technical solutions meet
    business needs
  - Participate in on-call rotations to support critical
    platform jobs and reduce operational disruptions
  - Champion a culture of excellence, accountability, and
    continuous improvement through code reviews,
    documentation, and knowledge sharing

  What you’ll need:

  - Bachelor’s or Master’s degree in Computer Science, Data
    Engineering, or a related field is required
  - 5+ years of experience in data engineering or software
    development with a strong focus on data infrastructure
  - Demonstrated success designing and delivering large-scale,
    reliable, and governed data infrastructure projects
  - Track record of building and maintaining production grade
    systems using APIs
  - Strong proficiency in Python and SQL, with experience
    applying software engineering rigor to data workflows
    (testing, version control, observability)
  - Hands-on experience with modern data tools such as Airflow,
    dbt, AWS (EMR, Athena, S3), Iceberg, Parquet, and Kafka
  - Track record of mentoring engineers and raising team-wide
    engineering standards through code reviews, documentation,
    and knowledge sharing
  - Ability to work effectively in a fast-paced, agile
    environment, collaborating across technical and non-
    technical stakeholders
  - Experience with healthcare data (claims, eligibility,
    clinical, EHR) is strongly preferred
  - Understanding of data security, privacy, and compliance
    practices (HIPAA or similar) in pipeline and platform
    design
  - Experience with snowflake, Databricks is a plus
  - Bachelor’s or Master’s degree in Computer Science, Data
    Engineering, or a related field is a plus

  Pay & Perks:

  💻 Fully remote opportunity with about 5% travel

  🩺 Medical, dental, vision, life, disability insurance, and
  Employee Assistance Program

  📈 401K retirement plan with company match; flexible spending
  and health savings account

  🏝️ Flex Time Off + company holidays

  👶 Up to 14 weeks of paid parental leave

  🐶 Pet insurance 

  The salary range for this position is $135,000 to $160,000
  annually; as part of a total benefits package which includes
  health insurance, 401k and bonus. In accordance with state
  applicable laws, Cohere is required to provide a reasonable
  estimate of the compensation range for this role. Individual
  pay decisions are ultimately based on a number of factors,
  including but not limited to qualifications for the role,
  experience level, skillset, and internal alignment.

  Interview Process*:

  - Connect with Talent Acquisition for a Preliminary Phone
    Screening
  - Meet your Hiring Manager!
  - Feature Design
  - System Design
  - Behavioral Interview

  *Subject to change

  About Cohere Health:

  Cohere Health’s clinical intelligence and operations
  platform and agentic AI-powered solutions connect health
  plans’ strategic goals and providers’ needs, optimizing the
  speed, cost, and quality of care. With an enterprise
  approach that streamlines payer-provider decision-making
  across the care continuum–including policy, prior
  authorization, payment accuracy, and more–the company
  improves collaboration and reduces burden, resulting in up
  to 9x ROI and 94% provider satisfaction.

  Cohere Health is recognized on TIME’s World’s Top HealthTech
  Companies list, the Inc. 5000 list, the Deloitte Technology
  Fast 500™, and by numerous industry analysts.

   The Coherenauts, as we call ourselves, who succeed here are
  empathetic teammates who are candid, kind, caring, and
  embody our core values and principles. We believe that
  diverse, inclusive teams make the most impactful work.
  Cohere is deeply invested in ensuring that we have a
  supportive, growth-oriented environment that works for
  everyone.

  We can’t wait to learn more about you and meet you at Cohere
  Health!

  Equal Opportunity Statement:

  Cohere Health is an Equal Opportunity Employer. We are
  committed to fostering an environment of mutual respect
  where equal employment opportunities are available to all.
  To us, it’s personal.

