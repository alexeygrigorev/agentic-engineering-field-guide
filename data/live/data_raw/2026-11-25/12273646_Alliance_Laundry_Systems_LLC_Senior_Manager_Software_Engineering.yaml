description: |
  Overview

  The Senior Manager - Software Engineering will lead a cross-
  functional engineering team responsible for our e-commerce
  platform, product information management (PIM), and the
  portal of internal tools and systems that support the
  business. This role blends people management, technical
  leadership, and delivery ownership, with primary focus on
  team development, sprint execution, and engineering
  excellence over hands-on code contribution.

  Responsibilities

  - Lead, mentor, and grow a team of software engineers through
    coaching, feedback, performance management, and career
    development
  - Provide technical leadership through code reviews,
    architecture decisions, and debugging escalations—serving
    as an escalation point for complex technical challenges
  - Own sprint planning, delivery execution, and predictable
    delivery outcomes in partnership with stakeholders
  - Define and enforce engineering best practices across coding
    standards, documentation, scalability, performance, and
    maintainability
  - Own delivery and reliability of e-commerce experiences,
    including catalog, checkout, payments integrations, and
    order flows
  - Own the PIM platform, including product data quality and
    syndication to e-commerce and downstream channels
  - Own the internal tools and systems portal serving internal
    business users
  - Collaborate with business stakeholders (sales, marketing,
    operations), product managers, architects, and other
    stakeholder groups to align on priorities and milestones
  - Drive modernization of legacy .NET applications and other
    frameworks.
  - Promote DevSecOps concepts, CI/CD automation, and secure-by-
    design engineering practices
  - Maintain strong communication channels across technical and
    non-technical teams
  - Foster a culture of ownership, accountability, and
    continuous improvement

  Qualifications

  Education:

  - Bachelor’s degree in computer science, engineering, or a
    similar field. Equivalent experience considered

  Experience:

  - Typical candidates will have 15+ years of professional
    software engineering experience
  - Typical candidates will have 5+ years of engineering
    leadership experience (team lead, tech lead, or people
    manager)
  - Experience delivering e-commerce platforms and/or PIM
    systems
  - Experience building distributed systems



  Skills and Abilities



  Technical Proficiency

  - Deep understanding of modern software architecture, REST
    APIs, and integration patterns
  - Experience with e-commerce platforms and payment, tax, and
    shipping integrations
  - Experience with relational (including Postgres and SQL
    Server) and NoSQL databases
  - Experience with CI/CD pipelines and trunk-based workflows

  AI-Augmented Development

  - Demonstrated prior experience using AI-assisted development
    tools (e.g., Claude Code, Codex) in engineering work
  - Ability to coach and mentor engineers on effective AI-
    augmented development workflows
  - Competency evaluating AI-generated code quality during
    reviews
  - Experience designing team processes that incorporate AI
    tooling effectively

  Preferred Experience

  - Trunk-based development as the primary branching strategy
  - Familiarity with DevSecOps and the DevSecOps Maturity Model
  - Experience with PIM systems and product data modeling
  - Experience with ERP integration
  - Experience with Salesforce
  - Experience modernizing legacy .NET applications
  - Experience with SSO and identity management for internal
    tools
  - Experience with Next.js and React.js

  Travel:

  - Travel is less than 10%.

  Standard and Physical Requirements:

  Position involves sitting long periods, standing, manual
  dexterity, stooping, bending and minimal lifting.

  Alliance Team Members Demonstrate DRIVE:

  - Dedicated: Follows through on commitments. Strong say/do.
  - Respectful: Acts with integrity and values diverse
    perspective.
  - Innovative: Always looking for a better way; leads change.
  - Versatile: Adapts quickly to changing circumstances.
    Demonstrates agility.
  - Engaged: Acts like an owner. Wants to create and grow a
    business which is tightly aligned with market needs.

