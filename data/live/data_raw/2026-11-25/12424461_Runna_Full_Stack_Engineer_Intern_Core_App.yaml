description: |
  We're putting together a talented team to build the #1
  training platform for Runners

  We help everyday runners become outstanding by building an
  incredible app providing world-class training, coaching and
  community for everyone, whether you're improving your 5k
  time or training for your first marathon.

  We’re growing extremely fast! In November 2023 we closed a
  $6.5M funding round led by JamJar with participation from
  Eka Ventures, Venrex and Creator Ventures. In 2024, we were
  selected by Apple as one of three global finalists for the
  iPhone app of the year, reflecting the innovation and impact
  of what we’ve built & in 2025 we were acquired by Strava!

  Our ambition is huge: to become the go-to global leading
  training platform for millions of runners everywhere. We’re
  growing with purpose and looking for people who want to
  build something meaningful with lasting impact. With the
  recent acquisition by Strava accelerating our journey, now
  is a really magical time to join. 🚀

  We follow a flexible hybrid model that translates to more
  than half of your time on-site – 3 days per week in Runna's
  office based in London, UK.

  The team you'll join

  We're looking for a curious, ambitious Full Stack
  Engineering Intern to join one of our Core App teams - the
  squads that build the heart of the Runna experience. Between
  them, these teams own the training plans, coaching, workouts
  and the day-to-day experiences runners rely on, across our
  mobile app (iOS & Android) and the services behind them.

  You'll work alongside experienced engineers, product and
  design partners to design and ship features that runners use
  every day. We'll match you to a squad where you can have
  real impact, and you'll get broad exposure to how a modern
  product engineering team builds, ships and learns.

  This internship is ideal for a recent or upcoming university
  graduate (Computer Science or similar technical degree) who
  loves shipping features, ideating on product improvements,
  and learning how modern product engineering teams operate.

  What you'll be doing

  - Contribute to designing, building, testing and shipping
    features across the Runna app and its backend - the
    training, coaching and workout experiences at the core of
    the product.
  - Help run experiments to improve how features perform and how
    runners engage, and learn from the results.
  - Work closely with engineers, Product and Design to
    prioritise opportunities, define success metrics and
    iterate.
  - Help implement and maintain instrumentation and tracking so
    we can understand behaviour, spot issues quickly and
    measure impact.
  - Ship features end-to-end with support from the team: from
    scoping and implementation through rollout, monitoring and
    iteration.
  - Contribute to our developer experience by supporting
    improvements to CI/CD, testing and release workflows, so
    we can ship and learn quickly.
  - Take part in code reviews, pairing sessions and design
    discussions to learn best practices and improve your
    craft.

  What you'll bring to the team

  - Currently completing or recently completed a Computer
    Science or similar technical degree, or equivalent
    practical experience.
  - Some experience with TypeScript/JavaScript (university
    projects, side projects, internships or similar).
  - Interest in building user-facing product features that
    people love - thinking about the experience, quality and
    the problem you're solving, not just the code.
  - A genuine desire to ship things, learn quickly and iterate
    based on feedback and data.
  - Comfortable working in a fast-paced, iterative environment
    with lots of experimentation and learning from data.
  - You enjoy working with others and are open to feedback,
    pairing and knowledge sharing.
  - Enthusiasm for our ways of working:
    - Iterative development, continuous deployment and test
      automation.
    - Knowledge sharing and collaborative design.
    - Shared ownership of code and outcomes across cross-
      functional teams.

  Nice to have (not required)

  - Experience building small full-stack projects (for example
    with React/Next.js, Node.js, or similar).
  - Exposure to mobile development (React Native, Swift or
    Kotlin) - our app is built in React Native, so this is a
    real plus.
  - Experience with analytics and experimentation tooling from a
    project, internship or course.

  If you're excited about building products that help people
  run, love shipping and learning quickly, and want to see how
  a real product engineering team operates, we'd love to hear
  from you.

  Benefits

  We'll be growing our package of benefits over time. We
  currently offer:

  - £42.5k salary (prorated over your internship)
  - Flexible working (we typically work 3 days a week in the
    office)
  - 10 days flexible holiday, with the choice to use your bank
    holiday allowance on days that better suit you
  - Bi-weekly team run and lunch
  - Socials throughout the internship (Team and company wide)

  Full Stack Engineer Intern, Core App Interview Process

  Our goal is to make the interview process as simple and
  enjoyable as possible. This process consists of the
  following stages:

  - Kick off! apply below (application deadline is 4th December,
    so the sooner you apply the better!)
  - Once you have applied, you will receive an update on your
    application no later than the 22nd of January, from there
    it’s two interviews;
  - First interview: 25-minute live coding technical interview
    with our Engineers (This will consist of two exercises
    from https://leetcode.com/)
  - Second interview: 25-minute chat with two of our Senior
    Engineers (This will consist of general tech and
    motivational questions) and then a 10 minute interview
    with Josh, Talent Partner

  We will be closing applications for this role on Fri, Dec 4
  at 5:00pm GMT.

  Once the process is finished, we promise to let you know our
  decision as soon as possible.

  Please let us know if there’s anything we can do to better
  accommodate you throughout the interview process - this can
  be from scheduling interviews around childcare commitments
  to accessibility requirements. We want you to show your best
  self in the process, so please speak to your Talent Partner.
