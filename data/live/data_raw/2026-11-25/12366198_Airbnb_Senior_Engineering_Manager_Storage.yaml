description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.

  The Community You Will Join:

  Airbnb's Online Data organization runs the stores behind
  every booking, every message, and every payment. Storage
  Foundation owns the engines underneath those stores. We
  build and operate Airbnb's source of truth databases for the
  company's online OLTP traffic, and we own the control plane
  that provisions, upgrades, and heals them. This is engine
  work, not fleet administration. When our engines are slow,
  unavailable, or wrong, so is the product.

  As Senior Engineering Manager you will lead engineers across
  multiple teams and you will manage managers. You will own
  the engine strategy, the reliability commitment that every
  service above you depends on, and the growth of the people
  who do the work. Your leverage comes from the managers and
  technical leads on your teams, the bar you hold in design
  and incident reviews, and the trust you build with the teams
  who stake their product on us.

  The Difference You Will Make:Set the technical direction for
  Airbnb's online storage engines

  You will set a multi-year technical vision for the engines
  and the control plane beneath every transactional and key
  value store at Airbnb, and you will make the calls that
  follow from it. That includes where we invest in our own
  engine expertise, where we buy instead of build, how we
  evaluate alternative engines against real production
  traffic, and which capabilities have to exist before a
  workload can safely land on us. You will also make the cost
  of these systems measurable and attributable, so that
  investment decisions rest on evidence. You will make these
  calls alongside senior technical leaders across Online Data
  and the broader Infrastructure organization.

  Make reliability the ground truth of the platform

  The services built on your engines commit to availability
  targets that only hold if the engine underneath them is
  better than they are. You will own that engine level
  commitment and the error budgets that feed every product
  surface above it. You will drive fault isolation so that one
  tenant cannot degrade everyone else, prove regional failover
  with scheduled production drills, and treat capacity
  headroom as a reliability decision. You will own incidents
  in your area personally, and you will turn each one into a
  structural fix.

  Make routine work disappear

  Every ticket is a product team waiting on us and an engineer
  pulled off platform work. You will push your teams to build
  API first, so that provisioning, schema changes, grants, and
  quotas can be driven by an engineer, a tool, or an agent
  without a human in the loop. You will use AI where it takes
  real work off your teams.

  Build and grow the team

  You will coach engineering managers and senior technical
  leads, and grow the depth of database expertise inside
  Airbnb. That means taking a forward view of talent needs,
  building a succession pipeline, hiring senior engineers who
  can own a complex open source codebase, and creating the
  conditions where people do the most technically ambitious
  work of their careers. You will also represent this group to
  executive leadership and to our customers, and you will make
  the case for investment in terms the business can act on.

  Your Expertise:

  - 12+ years of engineering experience with a BS or Masters, or
    9+ years with a PhD, including several years managing
    engineers and experience managing managers or senior
    technical leads
  - Experience leading teams that build and operate Tier 0
    distributed systems, with accountability for availability
    targets, on call health, and incident response at a
    company where downtime is visible to customers
  - Enough technical depth in databases, storage, or comparable
    stateful infrastructure to set direction, judge tradeoffs,
    and earn the trust of engineers who work on engine
    internals, without needing to be the architect of record
  - Experience making build versus buy and vendor decisions with
    evidence, including managing a critical vendor or open
    source dependency while building more capability in house
  - Demonstrated ability to attract, hire, and grow senior
    technical talent, including other managers
  - Excellent written and verbal communication, including
    presenting strategy, risk, and investment return to
    executives and explaining complex systems to non technical
    partners
  - Strong cross functional collaboration with customer teams,
    peer platform teams, and partners who do not report to
    you, including resolving conflict before it escalates

  Nice to have:

  - Experience with distributed SQL systems, or with relational
    engine internals such as query execution, storage engines,
    replication, or consensus
  - Experience running large stateful workloads on Kubernetes
  - Experience leading migrations of business critical data
    under strict availability and correctness requirements
  - Experience with upstream open source contribution as a team
    practice, not just an individual one
  - Experience building platform products with internal
    customers, including onboarding and adoption

  Your Location:

  This position is US - Remote Eligible. The role may include
  occasional work at an Airbnb office or attendance at
  offsites, as agreed to with your manager. While the position
  is Remote Eligible, you must live in a state where Airbnb,
  Inc. has a registered entity. Click here for the up-to-date
  list of excluded states. This list is continuously evolving,
  so please check back with us if the state you live in is on
  the exclusion list. If your position is employed by another
  Airbnb entity, your recruiter will inform you what states
  you are eligible to work from.

  Our Commitment To Inclusion & Belonging:

  Airbnb is committed to working with the broadest talent pool
  possible. We believe diverse ideas foster innovation and
  engagement, and allow us to attract creatively-led people,
  and to develop the best products, services and solutions.
  All qualified individuals are encouraged to apply.

  We strive to also provide a disability inclusive application
  and interview process. If you are a candidate with a
  disability and require reasonable accommodation in order to
  submit an application, please contact us at:
