description: |
  About Dash0

  Join Dash0 and help us define the future of observability.
  We are OpenTelemetry-native, building a delightful, simple,
  and AI-centric platform that eliminates vendor lock-in and
  meaningless toil. Shape a product developers love, with
  transparent pricing and built-in cost control.

  Are you ready to shape the moments that make developers fall
  in love with a product?

  At Dash0, we're not just building another observability
  tool; we're on a mission to bring observability closer to
  the developers; make it a part of their everyday work. We
  believe that getting deep insights should be easy and
  accessible. Our customers praise our simpler solution that
  empowers developers, and we're scaling fast. We're looking
  for Product Engineers to drive growth from inside the
  product: the first login, the first insight, and every
  moment that decides whether a developer stays. And that's
  where you come in!

  The Challenge You'll Tackle:

  - Make the first five minutes count. Developers decide fast
    whether a tool is worth their time. Your challenge is to
    design and build onboarding flows, using React, TypeScript
    and our Go backend, that take a new user from sign-up to
    their first meaningful insight as quickly as possible.
  - Listen to our users at scale. From "how did you hear about
    us?" to cancellation feedback, you'll build in-product
    surveys and in-app messaging that reach the right user at
    the right moment, without ever getting in their way.
  - Turn data into personal journeys. As we grow, you'll lay the
    foundations for personalized user pathways, so Dash0
    adapts to each user's stack, role and goals. You'll own
    the full loop: instrument, ship, measure, iterate.
  - Champion the user, and the numbers. You will work closely
    with product, design, marketing and backend engineers, and
    you'll care as much about the activation metric as about
    the code behind it. This is where we need you to be a
    Product Engineer, not just a software developer!

  What Success Looks Like (and How You'll Get There):

  - Within 1 week, you'll have shipped your first piece of
    production code.
  - Within 3 months, you'll have shipped our in-product survey
    and in-app messaging capabilities, giving the whole
    company a direct line to what our users think.
  - Within 6 months, you'll have reworked key onboarding flows
    and be able to show their impact on activation, backed by
    data you instrumented yourself. You'll be working
    alongside some very talented engineers who are eager to
    collaborate and learn with you.
  - Within 12 months, you'll have played a pivotal role in
    building personalised user pathways and be the go-to
    expert for growth engineering at Dash0.

  We're looking for someone who:

  - Has 4–5+ years of experience as a full-stack engineer,
    building production applications with React and
    TypeScript.
  - Is comfortable on the backend in Go and/or Java, and enjoys
    owning a feature end to end, from UI to API to data.
  - Expertly leverages AI and agentic coding tools every day to
    accelerate development, applying deep technical judgment
    to verify, refine, and own the final output.
  - Learns fast and loves picking up whatever the problem needs.
  - Is a great teammate: curious, low ego, and a clear
    communicator.
  - Thrives in a fast-paced startup environment where you can
    make a huge impact.
  - Bonus: has worked with product analytics tools (e.g.,
    PostHog, Amplitude, Mixpanel, Segment, ClickHouse).
  - Bonus: has experience with growth, onboarding or
    experimentation, or has built developer tools or
    observability products.

  Why Dash0?

  - Real Impact: See your work directly shape how developers
    discover, adopt and stay with Dash0.
  - Brilliant Team: Learn from and contribute to a team of
    highly talented and passionate engineers. We value
    learning and growth!
  - Product-Market Fit: We're solving a real problem with a
    product that's gaining serious traction.
  - Fully Remote & Flexible: Work from anywhere in Europe with
    competitive salary and stock options.

  Ready to build the future of observability with us? Apply
  now!

  Why Dash0

  This is a unique opportunity to help build a generational
  company. Dash0 is backed by top-tier investors including
  Balderton Capital, Accel, and Cherry Ventures, and led by a
  founding team with decades of experience in observability.
  We're in the middle of a massive growth phase after our
  Series B, and we're just getting started.

  If you're looking for a place where a great product meets
  great people, where momentum is real, and your impact is
  visible from day one — this is it.

  What we offer:

  - Competitive salary & meaningful equity participation; you'll
    own part of what you're building
  - Flexible, remote-first work environment with offices in New
    York, Amsterdam, and Munich
  - €60/month Lifestyle allowance
  - Location-specific benefits
  - Collaborative, fast-moving team culture with a builder
    mindset
  - Clear path for career growth and development
  - Direct access to founders and leadership
