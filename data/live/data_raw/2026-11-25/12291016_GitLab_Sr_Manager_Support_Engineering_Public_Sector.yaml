  Senior Manager, Support Engineering (U.S. Government)An
  overview of this role

  As a Senior Manager, Support Engineering on our U.S.
  Government support team, you’ll co-lead a team of engineers
  supporting complex enterprise deployments in highly
  regulated environments. You’ll combine people-focused
  leadership, technical judgment, and business acumen to
  develop engineers, strengthen our support program, and help
  customers realize value from GitLab.

  You’ll also connect the team’s technical contributions to
  outcomes that matter across the business. This includes
  telling a compelling, evidence-based story about how Support
  Engineering helps protect revenue, enable growth, remove
  barriers to adoption, and accelerate customer time to value.
  You’ll help executives and sales teams understand the
  significance of the work engineers perform and how that work
  supports customer and organizational success.

  Beyond individual cases, you’ll recognize Support
  Engineering as a valuable source of business intelligence.
  By bringing together engineers’ firsthand observations,
  product trends, and recurring customer pain points, you’ll
  turn field signal into actionable insights for Product,
  Engineering, Sales, and Customer Success.

  What you’ll do

  - Co-lead, coach, and develop a team of Support Engineers,
    building a culture of trust, accountability, technical
    excellence, and customer-focused decision-making.
  - Drive hiring, onboarding, performance management, and career
    development, helping engineers build technical expertise,
    communication skills, and an understanding of their
    broader business impact.
  - Partner with other Support Engineering Managers to shape
    program strategy, establish priorities, plan capacity, and
    evolve processes and tooling as customer and business
    needs change.
  - Translate complex technical work into clear, compelling
    narratives for executives and sales teams, connecting
    engineers’ contributions to revenue protection, growth
    opportunities, customer adoption, and faster time to
    value.
  - Use operational data, customer context, and qualitative
    feedback to evaluate support effectiveness, communicate
    impact, and guide investment and improvement decisions.
  - Establish a repeatable approach to capturing engineers’
    insights and identifying product trends, recurring
    customer pain points, adoption barriers, and emerging
    government requirements.
  - Partner with Product, Engineering, Sales, and Customer
    Success to turn support intelligence into actionable
    recommendations for product improvements, enablement, and
    customer engagement.
  - Maintain technical engagement by joining customer calls,
    reviewing tickets, and helping engineers navigate complex
    or sensitive issues, while developing the team’s ability
    to resolve challenges independently.
  - Coordinate responses to escalated and critical customer
    situations during working hours, providing clear
    communication and sound judgment.
  - Champion improvements that address recurring problems,
    reduce customer friction, and strengthen the quality and
    scalability of our U.S. Government support offering.

  What you’ll bring

  - Demonstrated success leading and developing technical
    support or engineering teams, including coaching,
    performance management, career development, and leadership
    through growth and change.
  - A strong technical background supporting complex enterprise
    software or infrastructure, with the ability to assess
    technical challenges, recognize the value engineers
    deliver, and understand the implications for customer
    outcomes.
  - Experience translating technical accomplishments into
    business value for executive and sales audiences, using
    clear storytelling supported by data and customer context.
  - Business acumen to connect support outcomes with revenue
    protection, customer retention, growth, product adoption,
    and time to value.
  - The ability to treat engineers’ knowledge and customer
    interactions as sources of business intelligence,
    synthesizing individual observations into meaningful
    trends and actionable recommendations.
  - Experience setting priorities, planning resources, and
    improving support programs while balancing immediate
    customer needs with longer-term organizational goals.
  - A people-focused leadership approach that builds trust,
    encourages candid feedback, recognizes contributions, and
    creates opportunities for engineers to grow.
  - Experience managing high-severity incidents and sensitive
    escalations, including effective communication with
    customers, executives, and cross-functional stakeholders.
  - The ability to influence across Product, Engineering, Sales,
    and Customer Success, building alignment around customer
    needs and shared business outcomes.
  - Familiarity with U.S. Government customers and the
    operational, security, and regulatory constraints that
    shape their environments. We also welcome candidates with
    relevant experience in other complex or regulated
    industries.

  About the team

  Our U.S. Government Support team formed in 2019 and has
  grown alongside the adoption of GitLab within government
  agencies. We help customers troubleshoot complex
  environments and use GitLab’s DevSecOps platform securely
  and effectively.

  Distributed across the United States, we combine synchronous
  and asynchronous collaboration to support customers and
  build strong working relationships in a remote-first
  environment. Our team includes both tenured and newer
  engineers, bringing diverse technical experience and
  perspectives.

  We’re focused on developing our people, scaling our
  operations, strengthening crisis management for sensitive
  systems, and deepening our partnerships across GitLab. As a
  senior leader, you’ll help make the team’s technical
  expertise and customer knowledge more valuable to the
  broader organization, while ensuring engineers have the
  support, direction, and development opportunities they need
  to succeed.

