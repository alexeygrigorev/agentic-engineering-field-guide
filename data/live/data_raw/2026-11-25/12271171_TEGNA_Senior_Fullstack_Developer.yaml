description: |
  About TEGNA

  TEGNA Inc. helps people thrive in their local communities by
  providing the trusted local news and services that matter
  most. With 64 television stations in 51 U.S. markets, TEGNA
  reaches more than 100 million people monthly across the web,
  mobile apps, streaming, and linear television. Together, we
  are building a sustainable future for local news.

  We are looking for a Senior FullStack Developer with a
  strong front-end focus to build the web experiences and
  modular front-end framework behind TEGNA's digital content
  management system. You'll work primarily in React and
  TypeScript, building scalable, reusable interfaces — ideally
  within a micro-frontend (MFE) architecture — that compose
  cleanly across teams and product lines. These front-ends are
  backed by our C#/.NET microservices on Azure, so you'll
  integrate closely with backend services and APIs. You'll
  partner with the Solutions Architects, who set the overall
  platform direction, and with the microservices teams whose
  services you consume. As a senior, you'll set front-end
  standards, mentor other engineers, and raise the bar for
  quality and maintainability across the UI/UX layer.

  Responsibilities:

  ●    Build and maintain performant, accessible web front-
  ends in React and TypeScript, and contribute to our modular,
  micro-frontend architecture. ●    Design reusable UI
  components and front-end modules that standardize
  experiences and accelerate delivery across teams. ●
  Integrate front-ends with backend C#/.NET microservices and
  APIs (REST and event-driven), handling loading, error, and
  failure states gracefully. ●    Own front-end quality —
  testing, performance, accessibility, and cross-
  browser/device behavior. ●    Set and uphold front-end
  standards and patterns, and mentor mid-level engineers on UI
  architecture and best practices. ●    Turn designs and
  product requirements into well-structured, maintainable
  implementations, and help shape them with product and design
  partners. ●    Collaborate with the Solutions Architects and
  microservices teams to align the front-end with the broader
  platform direction. ●    Work cloud-native in an Agile/Scrum
  team with disciplined Git-based source control.

  Requirements:

  ●    5+ years of professional software engineering
  experience with a strong front-end emphasis. ●    Deep,
  hands-on expertise with React and TypeScript, and modern
  front-end tooling (build systems, state management,
  component libraries). ●    Experience with micro-frontend
  architecture (e.g., module federation or equivalent
  composition patterns) is strongly preferred. ●    Solid
  experience integrating front-ends with backend services and
  APIs (REST, and ideally event-driven patterns). ●    Strong
  grasp of front-end performance, accessibility, and testing
  practices. ●    Full-stack range — comfort working close to
  the backend; familiarity with C#/.NET is a plus, since our
  services are .NET. ●    A track record of setting front-end
  standards and mentoring other engineers. ●    Fluent in
  Agile/Scrum delivery and Git-based source control. ●
  Media, streaming, CMS, or high-traffic consumer platform
  experience is a plus.

  Why Join TEGNA? You'll shape the front-end framework and
  user experiences that reach more than 100 million people
  across all of TEGNA's media properties, working at the
  intersection of modern UI architecture and a rich cloud-
  native backend. We are investing heavily in AI-assisted
  development, modern cloud-native services, and flexible,
  modular architecture patterns that let our teams innovate
  quickly while delivering high-quality, high-impact products
  for our users.

  Pay Range

  $100,000—$105,000 USD

  Benefits:

  TEGNA offers comprehensive benefits designed to safeguard
  the physical, mental and financial health of our employees
  and their families. TEGNA offers two medical plan options
  for full and part-time employees through Blue Cross Blue
  Shield of Texas, as well as access to dental and eye care
  coverage; fertility, surrogacy and adoption assistance;
  disability and life insurance.

  Our 401(k) program offers full, part-time and temporary
  employees the opportunity to contribute 1% - 80% of their
  pay on a pre-tax basis to TEGNA’s 401(k). Contributions made
  up to the first 4% of pay are eligible for a 100% match from
  the company and are 100% vested from day one.

  Regardless of participation in TEGNA medical plans, ALL
  employees and their eligible family members receive nine
  free virtual doctor’s appointments with a physician through
  Teladoc, and 12 free annual therapy sessions with a licensed
  clinician through Spring Health.

  TEGNA offers a generous Paid Time Off (PTO) benefit as well
  as nine paid holidays per year.

  * Some jobs are covered by a collective bargaining agreement
  and thus some or all of the benefits described herein may
  not apply. For example, some newsroom bargaining unit
  employees receive health and retirement benefits under plans
  administered by the union.

