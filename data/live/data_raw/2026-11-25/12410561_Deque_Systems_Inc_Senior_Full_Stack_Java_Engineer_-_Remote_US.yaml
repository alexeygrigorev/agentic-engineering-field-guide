description: |
  Career Fulfillment & Culture

  People come to work for Deque because of what we do: enable
  businesses and organizations to make their sites and apps
  accessible to everyone, including people with disabilities.
  The personal fulfillment employees feel here is
  unparalleled. In addition to the altruistic nature of our
  jobs, the organizational structure is extremely flat and
  welcoming. Women-owned and operated, Deque CEO Preety Kumar
  is internationally revered for her down-to-earth personality
  and work ethic. Deque's core values are central to our
  culture of customer satisfaction. Do you share them?

  - Innovation with results that matter
  - Deliver what you promise
  - Can-do attitude
  - Open, direct & respectful communications
  - We care deeply
  - We practice humility

  At Deque, you'll work with the best and brightest minds in
  the industry, sharing best practices, tackling new issues
  and uncovering new approaches. Accessibility Consultants at
  Deque also love their jobs because of the support systems in
  place.

  Deque experts regularly contribute to W3C Accessibility
  Working Groups and collectively hold more CPACC, WAS, & CPWA
  certifications issued by the IAAP than any accessibility
  testing company in the world.

  Position Description

  We're looking for a passionate, self-motivated Senior Full-
  Stack Engineer to help us develop within our Axe Monitor
  product and component libraries. Front end work is done
  primarily in TypeScript and ReactJS. Backend work is a
  combination of Node.js and Java. This position will be
  expected to contribute to all aspects of the high volume,
  industry leading scanning solution.

  This role serves as our primary engineering anchor during US
  Eastern business hours. You will drive backend architecture
  (Java / Spring Boot / SQL) and independently investigate and
  resolve production customer issues when overseas team
  members are offline. On the frontend, you'll work with
  TypeScript, Node.js, and ReactJS.

  We're AI-first and we mean it. You'll use AI to write and
  review code, including other people's, and you'll help build
  the context and practices that make AI effective on this
  codebase. What we're hiring for is the judgment on top of
  that: AI raises how much code you can produce, which raises
  the value of being able to tell when it's wrong. Axe Monitor
  is a large, long-lived system, and getting good output from
  an agent here takes someone who understands it.

  Our team is fully remote and has flexible working hours.

  Primary Responsibilities

  - US Eastern Anchor: Take ownership of investigating,
    troubleshooting, and resolving production customer issues
    during US Eastern business hours.
  - Backend Core: Build high-volume services, scanner engines,
    data pipelines, and database queries using Java, Spring
    Boot, Hibernate, and SQL.
  - Frontend Components: Maintain and build accessible UI
    components and APIs in TypeScript, Node.js, and ReactJS.
  - Critical AI Engineering: Leverage AI tools to accelerate
    delivery while strictly reviewing AI-generated code for
    security, logic, and accuracy.

  Requirements

  - Backend Depth: 4+ years of full-stack engineering
    experience, with strong backend depth in Java, Spring
    Boot, Hibernate, and relational databases.
  - Frontend Skills: 2+ years of experience with TypeScript,
    Node.js, and ReactJS.
  - Skeptical AI Mastery: Proven experience using AI tools
    effectively alongside the critical judgment to catch AI
    errors and edge cases.
  - Production Troubleshooting: Demonstrated ability to query
    databases, trace code, and resolve live production issues
    independently.
  - US Hours Alignment: Ability to work dedicated 9 AM – 5 PM US
    Eastern business hours.
  - Enterprise Background: Experience building complex software
    in large enterprise environments (finance, insurance, big
    tech, or scaled SaaS).
  - Public Code: Active GitHub profile with inspectable code
    (Java samples preferred).
  - Accessibility Basics: Basic web accessibility knowledge.
    (Expertise built on the job).

  Preferred Skills

  - Foundational familiarity with web accessibility principles
    (WCAG, accessible DOM patterns, ARIA) and a commitment to
    building domain expertise alongside industry leaders.
  - Claude Certified Developer - Foundations (CCDV-F) credential
    (or equivalent practical experience).

  About Deque

  Deque (pronounced dee-cue) is a web accessibility software
  and services company, and our mission is Digital Equality.
  We believe everyone, regardless of their ability, should
  have equal access to the information, services,
  applications, and everything else on the web.

  We work with enterprise-level businesses and organizations
  to ensure that their sites and mobile apps are accessible.
  With over 475,000 extensions installed and over 5,000 audit
  projects completed, Deque is the industry standard. Join our
  growing family as we work to make the web a better place for
  everyone.

  Job Location

  Remote (US East/Central timezone with full 9 AM – 5 PM US
  Eastern hour alignment)

  How to Apply

  Submit your resume and link to your public GitHub profile.

  Deque is committed to providing Equal Employment
  Opportunities. Reference and background checks will be
  required. The expected salary range is $120,000 – $145,000
  but is subject to change based on the skills, abilities, and
  experience of each candidate. The values listed are not
  intended to guarantee a salary for candidates or current
  employees.
