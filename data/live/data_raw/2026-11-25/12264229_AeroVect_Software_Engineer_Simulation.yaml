description: |
  Who We Are

  AeroVect is transforming ground handling with autonomy,
  redefining how airlines and ground service providers around
  the globe run day-to-day operations. We are a Series A
  company backed by top-tier venture capital investors in
  aviation and autonomous driving. Our customers include some
  of the world’s largest airlines and ground handling
  providers. For more information, visit www.aerovect.com.

  Software Engineer, Simulation

  You will own and extend our simulation: the simulator
  itself, how it connects to the autonomy stack, the models of
  the tractor and of the aircraft, people, and vehicles around
  it, and the scenarios we run.

  What you'll do

  • Build and extend the simulator and its integration with
  the production autonomy stack. • Model vehicle dynamics,
  actor behavior, and sensors so that the stack behaves in
  simulation as it does on the road. • Find where simulated
  and real inputs differ enough to change the stack's
  behavior, and close those gaps. • Bring field data into
  simulation: replay real-world recordings through the stack,
  and rebuild field events as scenarios. • Grow scenario
  generation and the authoring tools, across backend and
  frontend, and extend coverage to new maps and sites. • Run
  simulation at scale in the cloud: orchestration, parallel
  execution, artifacts, and cost. • Build the evaluation that
  turns a run into a pass/fail result, and the triage tools
  that autonomy engineers use on their own. • Keep the
  simulation deterministic, reproducible, and fast as the
  number of scenarios grows.

  What you'll need

  • 3+ years of experience in simulation work for autonomous
  vehicles, robotics, or aerospace • Strong Python, with a
  track record of maintainable code in a shared codebase •
  Experience with a simulator such as CARLA, Applied
  Intuition, Foretellix, NVIDIA Omniverse, Isaac Sim, Gazebo,
  or an in-house platform • Understanding of simulation and
  modeling methodology: vehicle and actor models, fidelity,
  and how simulated results support claims about real-world
  behavior • Docker, Linux, and distributed-systems
  fundamentals, with experience running GPU-based simulation •
  Experience running simulation at scale in the cloud and in
  CI • Experience debugging and profiling distributed, GPU-
  bound systems, and finding bottlenecks and failure modes in
  simulation output and telemetry • Git and code review
  experience • Bachelor's or Master's degree in Computer
  Science, Electrical Engineering, Robotics, or a related
  field, or equivalent practical experience

  Nice to have

  • 6+ years building simulation for autonomous vehicles,
  robotics, or aerospace • Experience with ROS 2 or other
  autonomous vehicle software stacks • Vehicle dynamics or
  actor behavior modeling • Sensor modeling (camera, lidar,
  radar), environment generation, or perception ground-truth
  pipelines • Unreal Engine or other game engines • Log replay
  and reconstruction of scenarios from real-world recordings •
  Large-scale cloud simulation infrastructure • Determinism
  and reproducibility work in simulators, including golden-
  output comparison • Safety-critical systems in autonomous
  driving, aerospace, or robotics • Safety standards: ISO
  26262, ISO 21448 (SOTIF), UL 4600, ISO 13849

  Leveling

  We hire remotely from Europe and North America at two levels
  and set the level from the interviews, based on demonstrated
  depth rather than years. Mid level (typically 3-6 years):
  you own defined parts of the simulation end to end, ship
  them tested and documented, and make routine design
  decisions on your own. Senior level (typically 6+ years):
  you own the roadmap for an area, such as scenario expansion
  or cloud execution. You find problems in how we build and
  use the simulation, not only in the code, and you mentor
  other engineers.
