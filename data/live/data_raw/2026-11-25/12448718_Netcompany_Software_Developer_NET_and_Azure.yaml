description: |
  Company Description

  Netcompany is one of Europe’s leading technology partners,
  with more than 9,500 colleagues delivering digital solutions
  for governments, critical industries and businesses across
  Europe. We take responsibility for the full journey, from
  strategy and development to daily operations. As Europe’s
  leader in sovereign AI, we build technology on Europe’s own
  terms.

  In the United Kingdom, you will join colleagues across our
  offices in London, Leeds, and Birmingham. Together, we
  deliver digital solutions for major organisations while
  combining local expertise with the strength of an
  international company.

  Job Description

  This is an exciting opportunity with us, which offers you
  career development opportunities, as well as the opportunity
  to explore new and cutting-edge technologies. This role
  supports the full life cycle of software development and
  includes the opportunity for hands-on coding in a greenfield
  environment. Can you see yourself playing a crucial role in
  supporting and driving your team to succeed? Are you looking
  to be involved in all parts of the process - from design and
  development, to ensuring that we deliver a high-quality end
  product?

  There will always be a lead manager associated with the
  project with the overall delivery responsibility, who you
  can lean on and learn from to hone your skills around
  management and IT deliveries.

  Key Activities:

  - System development - both front-end, back-end and
    integrations
  - Workflow planning
  - Process optimization and quality assurance
  - Implementing customer requirements for the design of new
    features
  - Analysis and design of the overall solution
  - Daily sparring with your team
  - Full life cycle of delivery

  Qualifications

  - Experience or exposure to Microsoft .NET development.
  - Experience or exposure to Microsoft Azure.
  - Understanding of software development principles and best
    practices.
  - Ability to work collaboratively within a team environment.
  - Strong problem-solving skills and willingness to learn.
  - Desirable
  - Familiarity with Azure DevOps, CI/CD pipelines and automated
    deployments.
  - Understanding of source control tools such as Git.
  - Knowledge of Agile delivery methodologies.

  Additional Information

  Benefits include

  - Hybrid working model with some flexible working
  - 25 days’ holiday
  - Private Medical Health Care via Vitality
  - Pension contribution, Life Assurance
  - Professional certifications supported as part of learning
    and development.
  - A range of retail discounts to enhance your lifestyle,
    encompassing restaurants, supermarkets, travel, leisure
    activities and health and well-being services.
  - Access to our Employee Resource Groups: our groups represent
    diverse backgrounds and provide a platform for colleagues
    to connect, learn, and support one another.



  At Netcompany, we pride ourselves on our entrepreneurial
  spirit and our capacity for doing things differently. Our
  culture is built on fostering low bureaucracy, emphasising
  high agility and promoting flexibility, enabling everyone to
  contribute their best.

  Our journey began in the UK with the acquisition of Hunter
  Macdonald in 2017. As one of Northern Europe's most
  accomplished IT companies, we have expanded our headcount
  globally to 7400+ employees and have offices in the UK,
  Denmark, Norway, Poland, Holland and Vietnam.

  Netcompany is committed to providing an inclusive and
  barrier-free recruitment process for anyone wishing to apply
  for a job with us.  We operate a Disability Confident
  Interview Scheme, which means that we offer guaranteed
  interviews to all applicants with a disability who meet the
  minimum criteria for a role. Applicants are asked to opt in,
  so please let us know if you wish your application to be
  considered under this scheme.

  If you need any reasonable adjustments or extra support
  during the recruitment process, please contact us at
  reasonableadjustments@netcompany.com.

