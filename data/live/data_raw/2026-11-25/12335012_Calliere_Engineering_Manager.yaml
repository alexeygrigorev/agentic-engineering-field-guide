description: |
  Engineering Manager

  Confidential search | Enterprise data for AI | Full-time,
  on-site in New York City

  The opportunity

  Our client is hiring an Engineering Manager to hire and
  develop the engineers who own its core software: the systems
  that connect to companies' work tools, export their data,
  and turn sensitive datasets into useful, de-identified data
  for AI development.

  You'll shape who the team hires, how ownership is divided,
  which capabilities become shared infrastructure, how quality
  is evaluated, and how the team uses AI to build and verify
  software.

  What you'll do

  - Hire, onboard, coach and develop engineers into strong,
    independent owners.
  - Define ownership and technical direction across your team's
    product and systems, including handoffs between
    integrations, processing, review and delivery.
  - Build a sequenced roadmap with clear acceptance criteria,
    based on customer behavior, product usage, data quality,
    system health and team capacity.
  - Stay technical. Review key designs and pull requests, debug
    hard failures with the team, and lead technical decisions
    and incidents when needed.
  - Use AI coding tools and agents yourself, and help engineers
    scope their work, review what the tools produce and verify
    the integrated result.

  About the company

  Our client helps businesses turn their proprietary work data
  into a new revenue stream by making it available for AI
  development. It builds the systems that collect data from
  business tools, remove identifying information, and prepare
  datasets that keep their useful context.

  Customers trust the company with sensitive records, and the
  buyers of that data need quality they can measure. The
  engineering work combines enterprise integrations,
  distributed processing, machine learning, privacy and
  reliable delivery, along with software that retrieves
  information, guides workflows and takes carefully limited
  actions, all grounded in real business data.

  - Stage: Early-stage, venture-backed
  - Team size: Small, founding-stage team
  - Office: New York City

  How the team works

  A small, high-conviction team that moves fast and holds a
  high bar. The culture centers on solving real customer
  problems with empathy, following through on commitments,
  acting quickly and learning fast, holding every piece of
  work to a top standard, winning and losing together, and
  judging success by outcomes rather than output.

  Tech stack

  Python, AWS, machine learning, LLM-as-a-judge, data
  pipelines and ETL, distributed systems, de-identification
  and PII removal, and AI coding agents.

  Location

  In the office 5 days a week in New York City.

  Work authorization

  Open to visa transfers (for example OPT and H1B transfers,
  pr TN for Canadians).

  Company name and further details are shared with qualified
  candidates after an initial conversation.

  Requirements

  What they're looking for

  - 5 to 15 years as a software or data engineer.
  - At least 2 years directly managing engineers who build
    production software, ideally a team of 3 to 5 or more.
  - Enough technical depth to review designs and code and to
    debug alongside the team.
  - Hands-on use of AI coding tools and agents.
  - A plus: data pipelines, ETL, distributed systems, machine
    learning, or privacy and PII removal.
  - Ability to work in person 5 days a week in New York City.

  Benefits

  - Base salary: $230,000 to $300,000
  - Equity: Competitive equity, vesting over 4 years with a
    1-year cliff
  - Full medical, dental and vision
  - Unlimited PTO
  - Wellness membership
  - Home office budget
  - Relocation support
