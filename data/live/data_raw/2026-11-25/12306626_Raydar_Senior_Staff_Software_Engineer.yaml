description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own the shared platform layer that the engineering team
  builds on, including agent frameworks, orchestration, data
  infrastructure and developer tooling. Design systems that
  gather and reconcile records from many business software
  sources into one dependable foundation. Work closely with
  customers and their operations leaders to turn their
  processes into reusable building blocks while setting
  technical direction for a growing team.

  What you'll do

  - Build and maintain the shared platform layer, including
    agent frameworks, orchestration, verification, monitoring
    and developer tooling.

  - Design data infrastructure that ingests, normalizes and
    reconciles records from many enterprise business systems.

  - Work directly with customers and their controllers to map
    their workflows into reusable platform components.

  - Make architectural decisions with incomplete information,
    identify bottlenecks and ship full-stack changes when
    needed.

  - Lead cross-functional technical projects that raise the
    output of the wider engineering team as the company grows.

  Requirements

  What we're looking for

  - 4 to 12 years of experience building core platform or
    infrastructure systems at scale.

  - A history of seeing a large, multi-team technical effort
    through to a production launch at real volume.

  - Deep expertise in distributed systems and data
    infrastructure.

  - Fluency with AI coding tools.

  - Some hands-on applied AI experience.

  - Full-stack ability, including shipping TypeScript and React
    frontends.

  - Ability to discuss technical solutions directly with end
    customers and their business stakeholders.

  - Bachelor's degree in computer science, or a CS-heavy math or
    engineering field, from a top-ranked US computer science
    program.

  Bonus points

  - Early-stage startup experience.

  - Prior work on money-movement or books-of-record software.

  - Experience with enterprise integrations, including ERPs,
    APIs and financial data pipelines.

  Benefits

  Compensation and benefits

  - Base salary: $180K - $270K

  - Equity

  Location and work model

  - New York City, NY, United States

  - On-site, 5 days in-office

  - Full-time
