  Job Description:

  Transform technology into opportunity as a Junior (Jr.)
  Scala Back-End Developer at GDIT. Shape what’s next for
  mission-critical government projects while shaping what’s
  next for your engineering career.

  We are GDIT. We think. We act. We deliver. There is no
  challenge we can’t turn into opportunity. Our work depends
  on a Jr. Scala Back-End Developer remotely joining our team
  to support the Centers for Medicare & Medicaid Services
  (CMS) activities. Work visa sponsorship will not be provided
  for this role. As a Jr. Scala Back-End Developer, the work
  you’ll do at GDIT will be impactful to the mission of CMS.
  You will play a crucial role in designing, developing, and
  maintaining sophisticated server-side applications using
  Scala and related technologies. Your primary
  responsibilities will include creating robust and scalable
  APIs, ensuring efficient data processing, and implementing
  business logic. In this role, a typical day may include:

  - Designing, developing, and maintaining scalable server-side
    applications and services using Scala and related
    technologies.
  - Building robust RESTful APIs, implementing complex business
    logic, and supporting efficient, secure data processing.
  - Analyzing requirements and translating them into technical
    specifications and maintainable back-end solutions.
  - Contributing to system architecture, design reviews,
    integration, testing, and performance optimization.
  - Writing comprehensive unit tests and help ensure the
    reliability, scalability, data integrity, and security of
    distributed systems.
  - Identifying and resolving complex technical issues and
    proactively address weaknesses in system design.
  - Collaborating with cross-functional teams and provide
    technical guidance to junior team members.
  - Managing multiple priorities, working effectively both
    independently and as part of a team.

  WHAT YOU’LL NEED TO SUCCEED Bring your engineering expertise
  along with a drive for innovation to GDIT. The Jr. Scala
  Back-End Developer must have:

  - Technical Training, Certification(s) or Degree with 1-3
    years of relevant experince.
  - 3+ years of hands-on Scala programming development expertise
    and functional programming concepts, with the ability to
    develop and maintain production-quality back-end services.
    (Scala is a non-negotiable!)
  - Working proficiency in designing, developing, integrating,
    and troubleshooting RESTful APIs.
  - Hands-on experience with distributed systems and modern
    back-end development practices.
  - Working proficiency with Git-based version control
    workflows, including branching, merging, and collaborative
    code reviews.
  - Working proficiency with PostgreSQL or comparable SQL
    databases, including writing queries and supporting data
    integrity.
  - Experience using Maven or similar build and dependency-
    management tools.

  - Excellent written, oral, and presentation communication
    skills for technical and nontechnical audiences.
  - Candidate must be able to obtain CMS Public Trust clearance.
  - Candidate must have lived in the United States at least
    three (3) out of the last five (5) years.

  PREFERRED QUALIFICATIONS:

  - Experience supporting Centers for Medicare & Medicaid
    Services (CMS) programs or comparable federal health
    initiatives.
  - Familiarity with cloud platforms such as AWS, Microsoft
    Azure, or Google Cloud Platform.
  - Experience with container platforms and technologies,
    particularly OpenShift.
  - Familiarity with Angular, React, or other front-end
    technologies that support effective full-stack
    collaboration.
  - Strong analytical, organizational, attention-to-detail,
    multitasking, and time-management skills.
  - Ability to work independently with minimal supervision and
    collaborate effectively as a team member.

  GDIT IS YOUR PLACE At GDIT, the mission is our purpose, and
  our people are at the center of everything we do.

  - Growth: AI-powered career tool that identifies career steps
    and learning opportunities
  - Support: An internal mobility team focused on helping you
    achieve your career goals
  - Rewards: Comprehensive benefits and wellness packages, 401K
    with company match, and competitive pay and paid time off
  - Community: Award-winning culture of innovation and a
    military-friendly workplace

  OWN YOUR OPPORTUNITY Explore a career in software
  development at GDIT and you’ll find endless opportunities
  and colleagues who share your dedication to advancing
  innovation.

