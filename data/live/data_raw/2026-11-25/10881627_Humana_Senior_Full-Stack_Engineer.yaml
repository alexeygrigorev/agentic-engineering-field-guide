description: |
  Become a part of our caring community The Senior Software
  Engineer plays a key role in designing, developing, and
  enhancing software solutions that support Humana's business
  objectives and digital transformation initiatives. As part
  of a collaborative engineering team, you will help deliver
  scalable, reliable, and high-quality applications that
  improve experiences for customers, members, and associates.
  Working closely with product managers, architects,
  engineers, and business stakeholders, you will contribute to
  the full software development lifecycle, from solution
  design and development through testing, deployment, and
  ongoing support. This role offers the opportunity to solve
  complex technical challenges, influence engineering
  standards and best practices, and help shape the future
  direction of the team's technology platforms.

  The Senior Software Engineer combines strong technical
  expertise with a passion for continuous improvement, driving
  software quality, modernization efforts, and operational
  excellence. In this role, you will mentor peers, contribute
  to technical strategy, and deliver innovative solutions that
  support Humana's mission of helping people achieve their
  best health.

  Key Responsibilities

  - Frontend Feature Development:** Design and build high-
    quality user experiences using TypeScript, React, and
    Next.js for care team members and, where applicable,
    patients.
  - AI Output Rendering:** Translate AI capabilities—LLM-
    generated content, structured summaries, clinical
    recommendations—into interface patterns that are
    intuitive, trustworthy, and appropriate for high-stakes
    clinical contexts.
  - Full-Stack Delivery:** Build end-to-end features spanning
    server-side rendering, API integration, and client-side
    state management. Own features from design handoff through
    production deployment.
  - Component Library and Design System:** Contribute to shared
    component libraries, establish reusable UI patterns, and
    maintain design system consistency across the product
    surface.
  - Accessibility and Health Literacy:** Ensure all interfaces
    meet WCAG accessibility standards and are designed with
    the cognitive demands of clinical users and the varying
    digital literacy of patients in mind.
  - HIPAA-Compliant Frontend Practices:** Implement sensitive
    data display, client-side logging, and session handling in
    accordance with HIPAA requirements.
  - Technical Collaboration:** Participate in code reviews,
    architecture discussions, and design reviews with
    engineers, product managers, and designers.

  Use your skills to make an impact


  Required Qualifications

  - B.S. or M.S. in Computer Science, Engineering, or a related
    field (or equivalent experience)
  - 5+ years of software engineering experience with strong
    frontend depth
  - Expert-level proficiency in TypeScript and React
  - Hands-on experience with Next.js, including App Router,
    SSR/SSG patterns, and server components
  - Ability to build and consume REST or GraphQL APIs and
    deliver full-stack features independently
  - Strong eye for UX quality and attention to detail in
    interface implementation
  - Familiarity with WCAG accessibility standards and their
    practical application
  - Understanding of sensitive data handling requirements in
    frontend contexts
  - Hands-on experience with AI-assisted development tools and
    LLM coding harnesses (Claude Code, Pi Agent, Cursor,
    Codex, or similar)

  Preferred Qualifications

  - Experience building clinical or healthcare-facing
    applications
  - Familiarity with AI/LLM output rendering patterns—streaming
    responses, citations, uncertainty display, or structured
    clinical outputs
  - Experience collaborating with product designers in a design-
    system-driven workflow
  - Exposure to Python or backend service development
  - Experience in a greenfield or early-stage product
    engineering environment

  Additional Information

  Candidates must reside within a reasonable commuting
  distance of one of our designated IT hub locations:

  - Nashville, TN
  - Washington, DC
  - Dallas, TX
  - Louisville, KY
  - New York, NY

  Work at Home Requirements: To ensure Home or Hybrid
  Home/Office employees’ ability to work effectively, the
  self-provided internet service of Home or Hybrid Home/Office
  employees must meet the following criteria: At minimum, a
  download speed of 25 Mbps and an upload speed of 10 Mbps is
  required; wireless, wired cable or DSL connection is
  suggested. In certain roles, the minimum recommended
  internet speed required by Humana may not be sufficient for
  business needs. Humana reserves the right to require
  associates to upgrade their internet service if necessary.
  Work from a dedicated space lacking ongoing interruptions to
  protect member PHI / HIPAA information. Travel: While this
  is a remote position, occasional travel to Humana's offices
  for training or meetings may be required.

  Scheduled Weekly Hours

  40

  Pay Range

  The compensation range below reflects a good faith estimate
  of starting base pay for full time (40 hours per week)
  employment at the time of posting. The pay range may be
  higher or lower based on geographic location and individual
  pay will vary based on demonstrated job related skills,
  knowledge, experience, education, certifications, etc.



  $128,300 - $176,400 per year



  This job is eligible for a bonus incentive plan. This
  incentive opportunity is based upon company and/or
  individual performance.

  Description of Benefits

  Humana, Inc. and its affiliated subsidiaries (collectively,
  “Humana”) offers competitive benefits that support whole-
  person well-being. Associate benefits are designed to
  encourage personal wellness and smart healthcare decisions
  for you and your family while also knowing your life extends
  outside of work. Among our benefits, Humana provides
  medical, dental and vision benefits, 401(k) retirement
  savings plan, time off (including paid time off, company and
  personal holidays, paid parental and caregiver leave),
  short-term and long-term disability, life insurance and many
  other opportunities.

  About Us About Humana: Humana Inc. (NYSE: HUM) is a leading
