description: |
  About GameChanger:

  We believe in the life-changing impact youth sports have on
  and off the field because they encourage leadership,
  teamwork, responsibility, and confidence—important life
  lessons that have the power to propel our youth toward
  meaningful futures. We recognize that without coaches,
  parents, and volunteers, organized youth sports could not
  exist. By building the first and best place to experience
  the youth sports moments important to our community, we are
  helping families elevate the next generation through youth
  sports.

  So if you love sports and their community-building
  potential, or building cool products is your sport,
  GameChanger is the team for you. We are a remote-first,
  dynamic tech company based in New York City, and we are
  solving some of the biggest challenges in youth sports
  today.

  The Position:

  As a Principal Software Engineer, you will shape the
  technical vision and lead the delivery of integrations and
  APIs built and operated as products. Your initial focus will
  be the Partner API: turning GameChanger’s capabilities and
  domain expertise into secure, reliable, scalable, and
  intuitive experiences that external developers and partners
  can build on with confidence. Over time, your impact will
  extend across product lines and the broader engineering
  organization as you help establish durable technical
  direction and raise the standard for backend and API
  engineering.

  This is a hands-on technical leadership role, not a hands-
  off architecture position. You will work directly with
  engineers to design, build, launch, and operate integrations
  and APIs, making consequential architectural decisions and
  contributing to critical implementation work. You will bring
  deep experience building developer-facing products and guide
  decisions across API contracts, authentication and
  authorization, versioning, documentation, observability,
  reliability, support, and developer experience.

  You will connect immediate product delivery to GameChanger’s
  longer-term architecture and business strategy. Working with
  engineering and product leaders, service owners, and
  business partners, you will align teams around a shared
  technical direction, address cross-system risks and
  dependencies, and establish reusable patterns and
  operational standards. You will mentor engineers and
  technical leaders across specialties, grow backend and
  integration expertise, and help teams make and execute sound
  decisions. This role will report to an Engineering Director.

  What You’ll Do:

  - Shape the technical vision and roadmap for integrations and
    API products, initially leading the design and delivery of
    the Partner API in partnership with Engineering and
    Product leaders.
  - Work hands-on with engineers to design, build, launch, and
    operate these products, owning critical implementation
    work and balancing near-term partner learning with a
    durable long-term foundation.
  - Establish and scale standards and reusable patterns for API
    contracts, authentication and authorization, versioning,
    rate limiting, error handling, webhooks, documentation,
    and developer experience.
  - Lead and review system designs across GameChanger services
    and external systems, aligning architecture with broader
    organizational goals and addressing dependencies, failure
    modes, and tradeoffs involving performance, security,
    reliability, maintainability, cost, and future use cases.
  - Partner with engineering leadership and service owners to
    establish production support, reliability, observability,
    and incident-management practices, including shared SLIs,
    SLOs, and service-health metrics that span systems and
    teams.
  - Identify strategic risks to the long-term health,
    scalability, and resilience of systems, secure support for
    practical improvements, and drive investments in testing,
    incident prevention, and remediation.
  - Partner with Product and business leaders to clarify partner
    needs, shape product and technical priorities, and connect
    investments and outcomes to company strategy.
  - Serve as a technical bridge across teams responsible for
    backend services, infrastructure, data, and client
    applications, helping each understand how its work
    contributes to a cohesive integration and developer
    experience.
  - Evaluate build, buy, and integration options, clearly
    communicating tradeoffs and recommendations to technical
    and non-technical stakeholders and driving decisions to
    clear outcomes.
  - Establish and improve lightweight, scalable practices for
    design reviews, technical proposals, API lifecycle
    decisions, and documenting architectural tradeoffs across
    teams.
  - Mentor engineers and technical leaders, including Staff and
    senior engineers, and raise the technical bar across the
    organization through pairing, design reviews, code
    reviews, knowledge sharing, and reusable guidance.
  - Identify organizational skill gaps and help build lasting
    backend, integration, and technical leadership
    capabilities through mentorship, learning forums, and
    other practical development efforts.
  - Build trusted relationships across Engineering, Product, and
    business functions; surface disagreement and ambiguity
    early and align stakeholders around shared goals.
  - Participate in an occasional on-call rotation and model
    strong ownership of production systems.

  Who You Are

  - You are a hands-on technical leader who connects business
    and product goals to technical vision and architecture,
    breaks complex initiatives into deliverable milestones,
    and works through implementation details.
  - You have strong product judgment and understand that
    successful integrations and API products include
    contracts, documentation, developer workflows, operations,
    and support—not only endpoints.
  - You are comfortable taking ownership of an ambiguous, high-
    impact space, clarifying the most important problems, and
    creating a path forward without detailed direction.
  - You decompose complex, company-wide problems, clarify
    dependencies and ownership across teams, and help teams
    understand how their contributions support a shared
    outcome.
  - You reason clearly about tradeoffs and design systems for
    both immediate needs and plausible future use cases,
    recognizing risks to long-term system health.
  - You build trust with engineers and senior leaders across
    technical, product, and business functions, adapt your
    communication to your audience, and create clarity and
    alignment across departments.
  - You lead through influence, direct contribution, and follow-
    through, and you take accountability for outcomes rather
    than stopping at recommendations.
  - You invest in engineers and technical leaders and create
    reusable guidance, tools, and practices that raise quality
    and decision-making across the organization.

  Experience

  - 8+ years of professional software development experience,
    including hands-on technical leadership on complex,
    business-critical systems.
  - Demonstrated experience building, launching, and operating
    integrations or developer-facing APIs as products,
    including supporting external consumers over time.
  - Deep knowledge of API design and lifecycle management,
    including authentication and authorization, versioning,
    backwards compatibility, rate limiting, documentation, and
    developer experience.
  - Experience designing and evolving distributed, high-scale
    production systems with strong security, reliability,
    observability, and performance characteristics.
  - Experience shaping technical vision and architecture across
    multiple teams, systems, or product areas, and leading
    substantial initiatives from problem definition through
    production operation.
  - Experience establishing production-readiness standards,
    shared service-health metrics, and incident practices, and
    driving longer-term investments in reliability and
    resilience across teams.
  - A track record of aligning engineering, product, and
    business leaders, resolving cross-team ambiguity, and
    connecting technical decisions to customer and business
    outcomes.
  - Experience mentoring senior and Staff engineers or other
    technical leaders, identifying capability gaps, and
    improving engineering practices across an organization.
  - Experience working with third-party developers, strategic
    partners, API consumers, or platform ecosystems is
    strongly preferred.
  - Experience with TypeScript, Node.js, AWS, Redis, and
    PostgreSQL is preferred.

  Perks:

  - Work remotely throughout the US* or from our well-furnished,
    modern office in Manhattan, NY.
  - Unlimited vacation policy.
  - Paid volunteer opportunities.
  - Technology stipend - $4,000 every 2 years after your start
    to make sure you have the latest and greatest technology.
  - WFH stipend - $500 annually to make your WFH situation
    comfortable.
  - Monthly physical, mental, wellness & learning stipend
    offered through Holisticly.
  - Monthly lifestyle stipend offered through Fringe.
  - Full health benefits - medical, dental, vision,
    prescription, FSA, HRA, HSA, and coverage for
    family/dependents.
  - Retirement savings - Traditional and Roth 401K plans are
    offered through Vanguard, with an immediate company match.
  - Life insurance - basic life, supplemental life, and
    dependent life.
  - Disability leave - short-term disability and long-term
    disability.
  - Company paid parental leave - up to 20 weeks for birthing
    parents and up to 12 weeks for non-birthing parents.
  - Family building benefits offered through Progyny.
  - DICK'S Sporting Goods and their family of brands teammate
    discount.

  The target salary range for this position is between
  $210,000 and $230,000. This is part of a total compensation
  package that includes incentive, equity, and benefits for
  eligible roles. Individual pay may vary from the target
  range and is determined by several factors including
  experience, internal pay equity, and other relevant business
  considerations. We constantly review all teammate pay to
  ensure a great compensation package that is fair and equal
  across the board.

  * DICK'S Sporting Goods has company-wide practices to
  monitor and protect the company from significant compliance
  and monetary implications as it pertains to employer state
  tax liabilities. Due to said guidelines put in place, we are
  unable to hire in AK, DE, HI, IA, LA, MS, MT, OK, and SC.

  We are an equal opportunity employer and value diversity in
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  Our Interview Process & AI

  We recognize that AI has become a common part of everyday
  life and professional work, and its use continues to evolve
  rapidly. Our perspective on AI in the hiring process will
  evolve as well. At this time, we ask that candidates please
  refrain from using AI tools during interviews and
  assessments, as we want to see your authentic self. We will
  clearly indicate if and when AI use is acceptable in the
  process. If you have any questions or need accommodations,
  we're here to help. Thanks for helping us keep the process
  fair and secure for everyone!

  IMPORTANT NOTICE: All official recruitment communications
  from GameChanger will come from an email address ending in
  @gc.com or no-reply@ashby.hq.com. If you receive
  communication from any other domain, please be cautious, as
  it is likely fraudulent.
