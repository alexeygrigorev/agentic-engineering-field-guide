description: |
  At Spotify, our Subscriptions mission helps make the
  subscription experience seamless and reliable for millions
  of listeners around the world. We're building the technology
  that supports subscribers throughout their journey, from
  their first purchase to renewals, plan changes, and beyond.

  We're looking for a Backend Engineer to join Rover, the team
  responsible for Spotify's core subscription system. Our
  services manage the lifecycle of every Spotify subscription,
  including activation, renewals, plan changes, grace periods,
  and cancellations.

  You'll help build and improve the backend services and data
  systems that millions of subscribers depend on. Whether
  you're growing your engineering experience or looking for a
  new technical challenge, you'll have opportunities to learn,
  collaborate, and make a meaningful impact on Spotify's
  subscription experience.

