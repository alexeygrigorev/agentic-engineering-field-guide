description: |
  Central Engineering (CENG) Protective Relay Strategy
  Implementation, an innovative/goals-oriented department,
  that is tasked with supporting the advancement of Protection
  and Control (P&C) systems critical to the clean energy
  transition seeks dedicated, dynamic, and innovative leaders
  to join our team. The Project Manager will provide
  leadership, technical expertise, guidance, and oversight of
  internal and external resources for engineering and design
  associated with various PRSI P&C Projects including
  modernization of P&C communication systems, CORE software
  integration, and TPL-001 CAP implementation. Assures safety,
  quality, efficiency and compliance with regulations, codes,
  standards and company policies, procedures and
  specifications. The Project Manager will be responsible for
  development, review, and maintenance of guidelines,
  standards, and procedures.

  This position does not provide employment pursuant to the
  terms of a STEM OPT Training Plan.

  ResponsibilitiesCore Responsibilities

  - Lead cross-functional project teams in the planning and
    execution of engineering deliverables in support of
    Protection and Controls (P&C) projects including
    modernization of P&C communication systems, CORE software
    integration, TPL-001 CAP implementation plan, and P&C R&D
    initiatives.
  - Manage multiple complex projects simultaneously, ensuring
    alignment with scopes, vendor proposals, schedules,
    estimates, budgets, and department objectives.
  - Track, analyze, and report on project performance metrics
    (scope, budget, schedule, and compliance).
  - Attend field visits, field walks, and vendor meetings.
  - Prepare and deliver technical reports, presentations, and
    communications for a wide range of audiences, including
    senior leadership.
  - Develop, review, and maintain engineering guidelines,
    standards, specifications and procedures.
  - Promote a strong safety culture by integrating human
    performance improvement tools and supporting a Zero
    Accident Culture, operational excellence, and workplace
    culture and inclusion initiatives.
  - Support company operations during system emergencies and
    other operational needs and perform additional related
    duties as required.

  QualificationsRequired Education/Experience

  - Bachelor's Degree in Engineering and 8 years of related
    experience in the fields of relay protection and control
    systems, or
  - Master's Degree with a Bachelor's degree in Engineering and
    6 years of related experience in the fields of relay
    protection and control systems.

  Preferred Education/Experience

  - Bachelor's Degree in Engineering and 8 years of related
    experience in the fields of relay protection and control
    systems. Experience with Fiber Networks and/or
    Teleprotection Circuits.

  Relevant Work Experience

  - Demonstrated knowledge of engineering design, construction
    and/or utility operations, required.
  - Strong written, verbal, presentation communication skills,
    and interpersonal skills with the ability to interact with
    all levels and motivate employees, required.
  - Demonstrated leadership, organizational and analytical
    skills, required.
  - Be well organized, detail oriented, flexible to handle
    multiple assignments and meet deadlines, required.
  - Demonstrated decisiveness in resolving project issues,
    prioritizing and decision-making, required.
  - Knowledge of Relay Protection and Control Systems, required.
  - Previous supervisory experience and/or project team lead
    experience, required.
  - Computer proficiency to include Microsoft Office (Word,
    Excel and PowerPoint), required.
  - Excellent interpersonal, oral and written communication
    skills to effectively interact with various levels of
    management and representatives of outside organizations,
    required.
  - Experience in the areas of operations and/or maintenance of
    electrical distribution and/or transmission facilities,
    preferred.
  - Experience with Fiber Network Installations and/or
    Teleprotection Circuits, preferred.

  Licenses and Certifications

  - Driver's License Required
  - Project Management Professional (PMP) Preferred

  Physical Demands

  - Ability to respond to system emergencies
  - Able to work in all weather conditions, i.e. excessive heat
    and/or cold
  - Work in, under, and on top of all types of company vehicles
    and/or equipment
  - Ability to work in adverse conditions that include, noise,
    confined spaces, and high elevations
  - Ability to travel to company locations to work on storm
    restoration and heat contingencies
  - Wear necessary Personal Protective Equipment (PPE), i.e.
    fire-retardant clothing and safety harnesses

  Additional Physical Demands

  - The selected candidate will be assigned a System Emergency
    Assignment (i.e., an emergency response role) and will be
    expected to work non-business hours during emergencies,
    which may include nights, weekends, and holidays.
  - Ability to work in power plants and high voltage
    substations.

