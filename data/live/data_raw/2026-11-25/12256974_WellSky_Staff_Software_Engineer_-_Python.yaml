description: |
  The Staff Software Engineer is responsible for all stages of
  the software development lifecycle using a variety of
  technologies and tools to build impactful software
  solutions. The scope of this job includes building and
  optimizing comprehensive solutions that prioritize end-user
  efficiency and experience.

  Key Responsibilities:

  - Lead the design and architecture of major systems and
    services, and ensure software solutions are scalable,
    reliable, maintainable, and aligned with business needs.
  - Collaborate with solution managers, engineers, data
    scientists, and other stakeholders to define and
    prioritize technical requirements that meet client needs
    and business objectives.
  - Collaborate with teams to ensure sustained quality and
    reliability of our software solutions, and act as a go-to
    expert by identifying and resolving complex, high-priority
    issues in both development and production environments.
  - Actively contribute to code reviews, provide constructive
    feedback on design and implementation, and provide
    technical guidance to other engineers to elevate skills,
    productivity, and overall effectiveness.
  - Drive innovation by evaluating and implementing new
    technologies, methodologies, and AI capabilities that
    improve team efficiency, software performance, and
    development processes.
  - Ensure code meets functional and performance requirements,
    advocate for high-quality software, and ensure rigorous
    testing processes, including automated unit tests,
    integration tests, and other testing frameworks.
  - Leverage AI tools and platforms as an integral part of daily
    responsibilities to enhance decision-making, streamline
    workflows, and drive data-informed outcomes.
  - Perform other job duties as assigned



  Required Qualifications:  

  - Bachelor's degree in a related field or equivalent work
    experience

  - 8-12 years related work experience



  Preferred Qualifications:     

  - Proficient with Python
  - Experience in NoSQL
  - Experience with cloud technologies such as GCP/AWS
  - CI/CD experience (Docker, Kubernetes, Terraform,
    CloudFormation, Elastic Search)
  - Familiarity with observability and APM tools (e.g., New
    Relic, OpenTelemetry)
  - Experience utilizing AI tools (preferred Claude)
  - Experience in healthcare domain

  - Healthcare industry experience



  Job Expectations:

  - Willing to work additional or irregular hours as needed
  - Must work in accordance with applicable security policies
    and procedures to safeguard company and client information
  - Must be able to sit and view a computer screen for extended
    periods of time

