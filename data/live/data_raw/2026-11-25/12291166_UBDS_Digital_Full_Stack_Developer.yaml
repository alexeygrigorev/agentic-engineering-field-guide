description: |
  At UBDS, we help organisations transform through cloud,
  cyber security, AI and digital innovation. We're looking for
  an experienced Full Stack Developer to support the design,
  development and delivery of modern, scalable software
  solutions across complex customer environments.

  This is a hands-on engineering role with a strong focus on
  C#, .NET, JavaScript/TypeScript and Microsoft Azure. You'll
  work within multidisciplinary Agile teams, developing
  secure, reliable and maintainable applications while
  contributing to technical design, engineering standards and
  continuous improvement.

  Working closely with Cloud Architects, Software Engineers,
  Product Managers and delivery colleagues, you'll help
  translate business and technical requirements into high-
  quality digital solutions.

  What You'll Do

  - Design, develop, test and maintain high-quality software
    applications and services.
  - Build scalable web applications using C#, .NET,
    JavaScript/TypeScript and React or Angular.
  - Develop and integrate REST APIs and backend services.
  - Develop and deploy applications within Microsoft Azure
    environments.
  - Contribute to technical design discussions and
    implementation decisions.
  - Write clean, secure, maintainable and well-tested code.
  - Develop and maintain automated tests to support application
    quality and reliability.
  - Work with CI/CD pipelines, GitHub and associated development
    tooling.
  - Support Infrastructure as Code using Azure Bicep, Terraform
    or equivalent technologies.
  - Participate in code reviews, troubleshooting and technical
    problem-solving.
  - Collaborate with Architects, Engineers, Testers and Product
    teams to deliver effective technical solutions.
  - Support application performance, security, resilience and
    ongoing improvements.
  - Follow established engineering standards and contribute to
    continuous improvement.
  - Work within Agile/Scrum teams, supporting iterative
    development and continuous delivery.

  What We're Looking For

  - Proven experience as a Full Stack Developer, Software
    Developer or Software Engineer.
  - Strong hands-on development experience using C# and .NET.
  - Experience with JavaScript/TypeScript and frontend
    frameworks such as React or Angular.
  - Experience developing REST APIs, integrating services and
    building scalable web applications.
  - Practical experience developing and deploying applications
    within Microsoft Azure.
  - Working knowledge of Infrastructure as Code, including Azure
    Bicep or Terraform.
  - Experience with GitHub, CI/CD pipelines, automated testing
    and version control.
  - Good understanding of secure coding practices, software
    design principles and maintainable application
    development.
  - Ability to contribute to technical design discussions, code
    reviews and troubleshooting.
  - Experience working within Agile/Scrum development teams.
  - Ability to take ownership of development tasks and deliver
    independently within agreed technical standards.
  - Strong problem-solving, communication and collaboration
    skills.

  Desirable Experience

  Experience across some of the following would be beneficial:

  - Azure App Service, Azure Functions and other Azure
    application services.
  - Azure SQL, SQL Server or other relational databases.
  - Microservices and cloud-native application architectures.
  - Docker, containers and Kubernetes.
  - Event-driven architectures and messaging technologies.
  - GitHub Actions or Azure DevOps.
  - Application monitoring and observability tooling.
  - Experience modernising legacy applications and migrating
    services to Azure.
  - Experience delivering software within Government, Defence or
    other regulated environments.
  - Relevant Microsoft Azure or software development
    certifications.

  The Opportunity

  This role would suit an experienced Full Stack Developer who
  enjoys hands-on engineering, solving technical challenges
  and working collaboratively to deliver high-quality
  software.

  You'll work on modern cloud-based applications and services,
  contributing to the development of secure, scalable
  solutions alongside experienced Cloud, Engineering and
  Architecture specialists.

  You'll have the opportunity to broaden your technical
  expertise, contribute to engineering improvements and take
  increasing ownership of development activities as part of
  UBDS's growing software engineering capability.

  Requirements

  Skills and experience (from the demand specification)
