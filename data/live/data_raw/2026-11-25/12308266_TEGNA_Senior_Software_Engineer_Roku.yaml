description: |
  About TEGNA

  TEGNA Inc. helps people thrive in their local communities by
  providing the trusted local news and services that matter
  most. With 64 television stations in 51 U.S. markets, TEGNA
  reaches more than 100 million people monthly across the web,
  mobile apps, streaming, and linear television. Together, we
  are building a sustainable future for local news.

  Senior Software Engineer, Roku Responsibilities:

  - Own the design and delivery of significant features and
    subsystems, including playback, advertising, deep linking,
    analytics, and the configuration-driven page and module
    pipeline.
  - Design SceneGraph components and task-based asynchronous
    flows that stay responsive within Roku's memory and
    threading constraints.
  - Maintain and improve live and on-demand video playback,
    including server-side and client-side ad integration.
  - Support a multi-station build process that produces branded
    channels for many local stations from one codebase.
  - Integrate and maintain third-party SDKs for analytics, video
    quality monitoring, feature flagging, user consent, and
    attribution.
  - Improve test coverage and quality tooling (unit tests,
    linting, formatting, on-device test runs in CI) and keep
    releases predictable.
  - Manage Roku certification requirements and channel packaging
    and publishing.
  - Lead code reviews, mentor engineers, and make pragmatic
    decisions about technical debt and refactoring in a long-
    lived codebase.
  - Triage production errors and crashes using monitoring and
    logging tools.

  Requirements:
  - 6+ years of software engineering experience, including
    significant experience shipping on **Roku** (BrightScript
    and SceneGraph), or a comparable connected TV platform
    with demonstrated ability to become productive in
    BrightScript quickly.
  - Strong understanding of the SceneGraph component model, node
    and task threading, field observers, and RowList/grid-
    based UI.
  - Experience with video playback on Roku, including HLS and ad
    integration (e.g., RAF, server-side ad insertion).
  - Experience with REST/JSON APIs, token-based authentication,
    and resilient caching and error-recovery strategies.
  - Strong testing and code quality habits, with experience in
    unit testing frameworks and static analysis.
  - Ability to debug on-device, including memory and performance
    profiling.
  - Clear communication and a track record of mentoring other
    engineers.
  **Nice to have**
  - Experience with **BrighterScript**, **Rooibos**,
    bslint/bsfmt, and the Roku developer toolchain.
  - Experience with CI/CD for Roku, including automated on-
    device testing.
  - Experience with multi-brand or multi-tenant app builds.
  - Familiarity with feature flag platforms, analytics
    instrumentation, and privacy/consent frameworks
    (CCPA/GDPR).
  - Background in news, media, or live streaming.

  Pay Range

  $100,000—$140,000 USD

  Benefits:

  TEGNA offers comprehensive benefits designed to safeguard
  the physical, mental and financial health of our employees
  and their families. TEGNA offers two medical plan options
  for full and part-time employees through Blue Cross Blue
  Shield of Texas, as well as access to dental and eye care
  coverage; fertility, surrogacy and adoption assistance;
  disability and life insurance.

  Our 401(k) program offers full, part-time and temporary
  employees the opportunity to contribute 1% - 80% of their
  pay on a pre-tax basis to TEGNA’s 401(k). Contributions made
  up to the first 4% of pay are eligible for a 100% match from
  the company and are 100% vested from day one.

  Regardless of participation in TEGNA medical plans, ALL
  employees and their eligible family members receive nine
  free virtual doctor’s appointments with a physician through
  Teladoc, and 12 free annual therapy sessions with a licensed
  clinician through Spring Health.

  TEGNA offers a generous Paid Time Off (PTO) benefit as well
  as nine paid holidays per year.

  * Some jobs are covered by a collective bargaining agreement
  and thus some or all of the benefits described herein may
  not apply. For example, some newsroom bargaining unit
  employees receive health and retirement benefits under plans
  administered by the union.

