description: |
  Classification: Contract-to-hire

  Contract Length: 12 Months

  Position Summary

  The Full Stack Engineer – Consulting Level will be part of
  the team in Nashville, TN or Remotely. This role is on a
  Data Solutions team responsible for UI and AI of a Master
  Data Management app. The ideal candidate has extremely
  strong Python skills, proven experience using AI Spec Kit AI
  tools, GitHub CoPilot CLI, and has experience leveraging AI
  to assist in development practices. This role is on a Data
  Solutions team, so background in ETL processing is
  beneficial, but strong Python skills and experience using AI
  tools is more important. In this role you will be building
  smart work queues that can filter work queues and sort,
  typically by spend or amount of times purchased. The ideal
  candidate is a traditional software engineer who uses tools
  like GitHub Copilot, Claude Code, Cursor, and Spec Kit to
  improve development productivity.

  The Product & Technology Organization at HealthTrust defines
  and implements solutions that empower our customers,
  suppliers, and business partners to realize savings and
  drive improved clinical outcomes. If we do our jobs well, we
  lower costs for healthcare providers, enabling them to make
  care more affordable for all.

  Responsibilities

  - Work in a dynamic, collaborative, transparent, non-
    hierarchal, and ego-free culture where your contribution
    is valued over a title.
  - Discover business problems, hypothesize solutions, and use
    data to quickly test, learn, and implement solutions that
    deliver value.
  - Minimize in-progress work by focusing on the most important
    thing
  - Write user interface and server-side code
  - Write unit tests, integration tests and functional tests
  - Automate deployment and management of platforms using cloud
    technologies

  Requirements

  - 10+ years of Python coding experience
  - Professional experience using AI Spec Kit AI tools, GitHub
    CoPilot CLI, and has experience leveraging AI to assist in
    development practices beyond just Proof of Concepts and
    MVP’s.
  - 10+ years of development skills with Python, React, Vue,
    .NET Core, or other applicable languages
  - Experience with ETL processes or Analytics/Reporting
    applications
  - Experience with Microsoft Azure or Google Cloud Platform
  - Strong development experience with Microsoft SQL or
    Postgres, including advanced features
  - Solid expertise in developing modern, scalable applications
  - Strong initiative, self-motivated, and able to drive results
    with minimal guidance
  - Ability to work within team scope to drive development
    direction and team objectives
  - Comfortable with uncertainty, ambiguity, and change
  - A professional, relaxed, and enthusiastic attitude
  - Pragmatic focus on delivering business value, with a
    relentless focus on creating and measuring outcomes
  - Demonstrated ability to value team over individual success
    by focusing on collaboration and progress instead of dogma
  - Continuously seeks opportunities to learn and improve self
    and team
  - Excellent problem-solving and analytical skills
  - Effective interpersonal, written, and oral communication
    skills
  - Experience with HL7 or other healthcare integration a plus
  - Supply chain or healthcare industry experience a plus
  - Relevant Years Experience: 10+
  - Bachelor’s Degree in Computer Science, Software Engineering,
    Computer Engineering, Electrical Engineering, Electronics
    Engineering, or related field.
