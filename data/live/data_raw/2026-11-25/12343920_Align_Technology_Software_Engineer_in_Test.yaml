description: |
  This position is ideal for an experienced software quality
  engineer with interest in the manufacturing industry to join
  the Global Manufacturing Applications team as a Software
  Development Engineer in Test (SDET) supporting Align’s
  global manufacturing operations. Partnering closely with
  Software Engineers, product and process engineering teams,
  you’ll leverage software quality engineering, test
  automation and analytical skills to enable high-tech
  manufacturing and operational improvements. This role is
  vital in implementing Align Technology’s manufacturing
  software CI/CD and automated testing strategy and ensuring
  the quality, reliability and operational success of
  manufacturing software solutions.

  Key Responsibilities

  ·       Design, develop and maintain automated testing
  solutions for MES applications, APIs, integrations and
  reporting solutions using appropriate test automation
  technologies and frameworks.

  ·       Partner closely with Software Engineers to establish
  test strategies and acceptance criteria and ensure that
  software is designed and developed with quality,
  reliability, testability and maintainability in mind.

  ·       Develop and maintain automated functional,
  integration, API, regression and end-to-end tests that
  provide rapid and reliable feedback throughout the software
  development lifecycle.

  ·       Integrate automated testing into CI/CD pipelines in
  collaboration with Software Engineers and DevOps engineers,
  enabling efficient and repeatable validation of software
  builds and deployments.

  ·       Develop test strategies for multi-tiered and highly
  integrated manufacturing systems, including MES integrations
  using Kafka, Rockwell FTPC, SAP Mii, RESTful APIs and other
  synchronous and event-driven approaches.

  ·       Investigate software defects and system failures and
  collaborate with Software Engineers to perform root-cause
  analysis, reproduce complex issues and validate corrective
  solutions.

  ·       Identify opportunities to improve product quality,
  test coverage, automation, development practices and
  manufacturing software release processes, and share your
  ideas with the team.

  ·       Ensure that test plans, automated test assets, test
  results and other relevant quality engineering documentation
  are maintained and accessible to the team.

  ·       Maintain knowledge and seek mastery of appropriate
  software quality engineering, automation and technical
  skills at the highest level.

  ·       Collaborate with a diverse group of Software
  Engineers, end-users, SMEs and other cross-functional team
  members to understand application behavior, manufacturing
  processes and business-critical workflows.

  ·       Connect with other team members, through Scrum and
  other means, and share your experience and knowledge in all
  things related to software quality, test automation and
  manufacturing software development.

  ·       Celebrate in your successes and those of your team
  members. This position does not supervise others.

  Skills, Knowledge & Expertise

  ·       Bachelor or Master’s Degree in Computer Science,
  Engineering or related field.

  ·       5+ years of experience in software quality
  engineering, software testing, software development or
  related technical roles, with 2+ years of hands-on
  experience supporting software within a Manufacturing
  Operations environment.

  ·       Familiarity with full-stack web application
  architecture and modern distributed application
  architectures.

  ·       Intermediate programming skills using Java, Python
  or another object-oriented programming language, with
  demonstrated ability to develop and maintain automated test
  software.

  ·       Hands-on experience developing automated tests for
  RESTful APIs, web applications, backend services and
  integrated systems.

  ·       Experience with modern test automation technologies
  and frameworks such as JUnit, REST Assured, Selenium,
  Playwright, Cypress or similar technologies.

  ·       Ability to develop effective test strategies
  covering functional, integration, regression, API and end-
  to-end testing, with a risk-based approach to determining
  appropriate test coverage.

  ·       Ability to work both independently and
  collaboratively within a full-stack team including
  architects, Software Engineers, SQA engineers and DevOps
  engineers.

  ·       Quality, security, performance, scalability,
  reliability and usability mindset.

  ·       Strong understanding of SDLC, Agile/Scrum and DevOps
  practices, including automated testing within CI/CD
  pipelines.

  ·       Strong troubleshooting, analytical and root-cause
  analysis skills for multi-tiered and highly integrated
  software systems.

  ·       Excellent presentation, communication and teach-back
  skills.

  Complementary Skills

  ·       Experience testing full-stack applications using
  Spring Boot, RESTful APIs, and modern Single-Page
  Application (SPA) frameworks such as Angular or React.

  ·       Experience testing applications developed using
  Rockwell FTPC Modular Framework or Vaadin framework.

  ·       Experience developing automated API tests using
  tools or frameworks such as REST Assured, Postman/Newman or
  similar technologies.

  ·       Experience with UI test automation using
  technologies such as Playwright, Selenium or Cypress.

  ·       Experience testing synchronous and asynchronous MES
  integrations using message brokers such as Kafka.

  ·       Experience implementing automated testing and
  quality gates within CI/CD pipeline

  ·       Experience with performance and load testing of web
  applications, APIs or distributed systems using tools such
  as JMeter, Gatling or similar technologies.

  ·       Experience with SQL and database validation,
  including the ability to analyze data and validate
  application behavior across multiple system layers.

  ·       Knowledge about shop floor/manufacturing processes.

  ·       Experience in working with the Medical Device
  industry.

  ·       Experience validating software supporting global
  product labeling needs in a Medical Device company.

  Additional Information

  The salary range indicated for this role reflects the
  minimum and maximum we expect to offer at the time of
  publication of the advert. The final salary will be
  determined based on factors such as experience, skills,
  business needs and alignment with equivalent salary levels.
  Where applicable, employees may also be eligible for an
  annual bonus, long-term incentive schemes and other
  benefits; further details are available from our Talent
  Acquisition team.

