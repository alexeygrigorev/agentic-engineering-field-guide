description: |
  About SewerAI Corporation

  SewerAI is transforming underground infrastructure
  management through AI-powered inspection and risk analysis.
  Our platform helps contractors, engineering firms, and
  utilities unlock valuable insights from sewer inspection
  data—turning hours of manual video review into actionable
  intelligence in minutes. After doubling our customer base
  over the past year, we’re now entering an exciting phase of
  accelerated growth.

  Summary

  Almost every major municipal program we've won had an
  engineering firm in the room. The firm was the route in, the
  credibility, or the delivery capacity, and often all three.
  Eight of those firms have signed on as SewerAI partners,
  with offices in 49 states. When they refer us to a utility,
  we win far more often than when we go in cold. The problem
  is volume: referrals arrive one partner at a time, when they
  arrive at all.

  The Senior Partner Manager fixes that. You own every
  engineering-firm partner relationship and the partner-
  sourced bookings number, pair our AEs with the partners in
  their territory, and run the program that rewards firms for
  referrals. The measure is partner-sourced pipeline and
  bookings, not logos on a partner page.

  Responsibilities

  - Own the partner-sourced pipeline and bookings number for
    SewerAI's engineering-firm partners: referrals in, deals
    closed, fees paid.
  - Run the relationships with 8–10 partner firms, from the
    national firms to the regional specialists: regular check-
    ins with each firm's partner lead, quarterly business
    reviews, and agreement renewals and negotiations.
  - Build the referral machine. Pair every SewerAI Account
    Executive with home partners in their territory, run
    monthly pipeline syncs and quarterly territory plans with
    each firm, and make sure every referral is registered,
    worked and followed up.
  - Run the partner program: points, partner levels, quarterly
    statements to each firm, and referral-fee payouts with
    Finance. Move existing partners onto one standard
    agreement as they renew.
  - Train partner teams (project managers, client service leads,
    business developers) on Pioneer, AutoCode and Risk &
    Rehab, and coordinate their SewerAI certification. Train
    our AEs on how to work with engineering counterparts.
  - Drive joint marketing with Marketing: co-branded case
    studies, joint webinars, launches to partners' internal
    offices, and co-presented sessions at WEFTEC, NASSCO and
    state water conferences.
  - Keep attribution clean. Every partner-sourced opportunity
    carries the partner in Salesforce, every referral is
    registered, and leadership can see the channel's pipeline
    at any time.
  - Hold the line on the rules: no exclusivity or territory
    promises outside the program, and Risk & Rehab is never
    positioned as an engineering deliverable. We code and
    score; the partner engineers.
  - Add new partners only where coverage runs out, with Sales
    Leadership aligned before an agreement is offered.

  Qualifications

  - 6+ years in partner or channel management, alliances, or B2B
    sales, including 3+ years managing partners who source
    revenue through referral, co-sell or resale.
  - A track record of building a partner-sourced pipeline number
    from a small base, with the numbers to show it.
  - Experience working with or inside consulting engineering
    (AEC) firms. You know how a firm wins a CIP program, how
    its PMs and business developers are measured, and why
    billable hours matter to them.
  - Comfort with municipal and utility buying: RFPs and RFQs,
    co-op contracts, council approvals and capital-plan
    cycles.
  - An operator's habits: you live in Salesforce, keep a clean
    ledger, and build the scorecard yourself.
  - Equally at home presenting alongside a partner principal at
    WEFTEC and sitting with an AE on a pipeline review the
    same afternoon.
  - Civil or environmental engineering background, or experience
    in wastewater collection systems (preferred).
  - Familiarity with PACP/NASSCO, CCTV inspection or rehab
    planning (preferred).
  - Existing relationships in the water and wastewater
    engineering community (preferred).

  What success looks like in year one

  - Every partner has named SewerAI AE counterparts, a territory
    plan and a monthly pipeline rhythm.
  - Partner referrals arrive as a steady monthly flow from
    several firms, not one partner at a time.
  - Partner-sourced bookings are a line the business plans on,
    with clean attribution behind every dollar.

  Compensation & Benefits

  - Base Salary: $110,000–$130,000
  - OTE: $170,000–$200,000

  Benefits include:

  - Medical, Dental, Vision, Basic Life, 401(k), and more
  - Unlimited PTO
  - Tools and resources to support success
  - Competitive compensation with high-growth potential

  *This position is open to US-based candidates only, and
  applicants must be authorized to work in the United States.

  Why Join SewerAI? Join the fastest-growing team in
  wastewater tech and help modernize critical infrastructure
  with AI. You’ll own high-visibility projects, influence how
  our brand meets the market, and see your work drive
  measurable impact for customers and communities.

