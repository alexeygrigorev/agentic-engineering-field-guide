description: |
  About Meridial

  Meridial is a Focused Research Organisation (FRO) with a
  mission to bring connectomics into the living brain. We are
  building a platform for longitudinal, synapse-resolution
  mapping of functional neural circuitry in preclinical
  models. Our aim is to deploy this platform for translational
  projects and improve drug development outcomes for disorders
  of the central nervous system.

  Meridial is a new not-for-profit FRO in the Convergent
  Research Ecosystem and funded by the Advanced Research and
  Invention Agency (ARIA).

  The technical challenge

  Our imaging platform records the activity of neurons and
  synapses in the living brain. The scientific value of these
  recordings depends on converting raw images into reliable,
  quantitative data.

  This is a demanding image processing problem. Fluorescence
  signals are faint, noisy and spatially overlapping; residual
  tissue motion and other imaging artefacts must be corrected;
  in addition to conventional planar frames, data may be
  acquired from arbitrarily shaped 3D regions or several
  depths at once; properties vary between signal types and
  experimental configurations; and the same cells and synapses
  must be reliably matched across imaging sessions spanning
  weeks. You will build a software package that addresses
  these challenges in two modes: real-time processing and
  visualisation, with latencies of tens to hundreds of
  milliseconds, that inform experimental decisions at the
  microscope, and offline pipelines that deliver maximum
  accuracy for scientific analysis and serve as the benchmark
  for the real-time methods.

  The impact of this work is direct and visible: your software
  will be used at the microscope as experiments unfold, and
  your pipelines will generate the data underpinning new
  insights into how neural circuits function and how they
  change in disease.

