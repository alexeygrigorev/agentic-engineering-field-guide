description: |
  At CFC, technology is central to how we create and deliver
  specialist insurance products. Our platforms support every
  part of the business, enabling underwriters, brokers and
  clients to work more efficiently and make better decisions.

  We're seeking a Senior Software Developer to join our
  Engineering team. Working within a collaborative, product-
  led environment, you'll design and deliver scalable software
  solutions, contribute to technical strategy, and help shape
  the evolution of our technology platforms.

  This role offers the opportunity to work on complex
  engineering challenges, influence architectural direction,
  and contribute to products that have a direct impact on the
  business.

  About the role

  - Design, build and maintain scalable, secure and high-
    performing software solutions.
  - Collaborate with product, delivery and engineering teams to
    translate business requirements into technical solutions.
  - Contribute to architectural decisions and the ongoing
    evolution of our technology platforms.
  - Develop clean, well-tested and maintainable code aligned
    with engineering standards and best practice.
  - Conduct code reviews and support a culture of continuous
    improvement and technical excellence.
  - Mentor and support other engineers, sharing knowledge and
    helping develop team capability.
  - Champion modern engineering practices including automated
    testing, CI/CD and DevOps.
  - Design and support APIs, microservices and event-driven
    architectures.
  - Ensure solutions are resilient, secure and aligned with
    organisational standards and controls.

  About you

  You'll be an experienced software engineer with a strong
  track record of delivering high-quality solutions in modern
  development environments. You enjoy solving complex
  problems, working collaboratively across teams, and
  balancing technical excellence with business outcomes.

  Ideally, you'll bring:

  - Strong experience developing software using C#/.NET and
    object-oriented design principles.
  - Experience designing and building distributed systems, APIs
    and scalable applications.
  - Knowledge of microservices, event-driven architectures and
    cloud-native development, ideally within Azure.
  - Experience with CI/CD pipelines, DevOps practices and
    containerisation technologies such as Docker and
    Kubernetes.
  - Strong understanding of software architecture, engineering
    best practices and secure development principles.
  - Experience working with relational and NoSQL databases.
  - Exposure to modern frontend frameworks such as Angular.
  - Strong communication skills and the ability to collaborate
    effectively across technical and business teams.
  - Previous experience mentoring or supporting other engineers.

  Core Values

  Love what you do: We show up each day ready to take on the
  world. Our passion and intensity set us apart and makes the
  difference to our colleagues, customers, brokers and
  carriers. Challenge everything: We’re never afraid to
  question the way that things are done and we constantly
  challenge ourselves and others to makes things better. Have
  fun, be good: Insurance is a serious business, but we don’t
  take ourselves too seriously. We make it fun to work at CFC,
  we welcome all viewpoints, and we treat everyone how we
  would expect to be treated.

  About CFC is a specialist insurance provider, pioneering
  emerging risk and market leader in cyber. Our global
  insurance platform uses cutting-edge technology and data
  science to deliver smarter, faster underwriting and protect
  customers from today's most critical business
  risk.Headquartered in London with offices in New York,
  Melbourne, Sydney, Austin, Madrid, Brussels and Brisbane,
  CFC has over 1200 staff and is trusted by more than 100,000
  businesses across 90 countries.At CFC, insurance isn't just
  about underwriting. From data science to software
  development, and digital marketing design, we've got
  something for everyone. We're passionate about pushing
  boundaries, thinking differently and building the insurance
  company of the future.CFC is committed to the principles of
  equal opportunities and creating an environment in which all
  individuals are always treated with dignity and respect. We
  encourage a diverse corporate culture of openness and
  appreciation to create an environment in which your talent
  can be developed in the best possible way. Should you
  require any reasonable adjustments at any stage of the
  recruitment process please let us know.Feeling like you need
  to tick every box before applying? We see things
  differently. In a rapidly scaling company like ours,
  ambition and the drive to learn count for more than a
  'perfect' checklist. We're building the future of insurance,
  and that requires diverse talent eager to grow with us. If
  this role excites you and you're ready to make a significant
  impact, bring your unique background and let's build
  something great together.
