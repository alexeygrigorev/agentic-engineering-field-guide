  candidate’s identity and is not intended to verify
  citizenship, immigration status, or employment
  authorization.

    About BOOST

  BOOST LLC is a dynamic management consulting firm that
  offers an array of government-compliant back-office
  solutions to support our teaming partners within the GovCon
  space. Our consultants are experts in the areas of
  Accounting, Contracts, Human Resources, Recruiting &
  Sourcing, and Strategic Pricing and our passion is to guide
  and propel our partners towards success within this
  competitive sector.



  Position Summary

  We are seeking a Software Developer to join a growing
  technology startup developing software-enabled solutions for
  government and mission-focused customers.

  This is an opportunity to join an early-stage organization
  with an established foundation. The company has existing
  recurring revenue and is part of a family of well-
  established service providers with decades of experience
  supporting the federal government.

  The ideal candidate is a hands-on developer with strong
  Python skills who enjoys building, testing, and integrating
  software with physical hardware. We are particularly
  interested in candidates who have worked with single-board
  computers, embedded or edge-computing environments, hardware
  interfaces, and user-facing applications. This position is
  intended for an early-career to journeyman-level developer,
  generally with approximately 2–5 years of relevant
  experience.

  We anticipate bringing this individual onboard within
  approximately 60–90 days. The position may initially be
  structured as a contract engagement, with the expectation of
  conversion to a full-time W-2 position as the company
  reaches the appropriate stage of growth.



  Key Considerations

  - This role is Hybrid/Remote-friendly – Silver Spring, MD
    20904
  - U.S. Citizenship is necessary due to federal contract
    requirements.
    - Applicants must be prepared to verify identity at interview
      stage.



  Key Responsibilities

  - Design, develop, test, troubleshoot, and maintain Python-
    based software applications.
  - Develop clean, efficient, maintainable, and well-documented
    Python code.
  - Support the integration of software applications with
    physical hardware, sensors, peripherals, and other
    connected devices.
  - Develop solutions utilizing single-board computers (SBCs)
    such as Raspberry Pi, NVIDIA Jetson, BeagleBone, or
    comparable platforms.
  - Develop and maintain interfaces between software and
    hardware components using appropriate communications
    protocols and APIs.
  - Create intuitive graphical user interfaces and other user-
    facing application components.
  - Participate in system design, prototyping, integration,
    testing, debugging, and technical documentation.
  - Troubleshoot software, hardware, and integration issues in
    laboratory and operational environments.
  - Work collaboratively with technical leadership, engineers,
    customers, and other stakeholders to translate
    requirements into functional solutions.
  - Contribute to the development of new products and
    capabilities in a fast-moving startup environment.
  - Support demonstrations, testing, and deployment of solutions
    for government or mission-oriented customers as required.



  Qualifications:

  Experience Requirements

  - U.S. citizenship is required.
  - Approximately 2-5 years of relevant software development
    experience preferred.
  - Candidates with less professional experience, including
    recent graduates, may be considered when they demonstrate
    substantial relevant academic, internship, research,
    personal-project, military, or other hands-on technical
    experience.
  - Ability to work effectively in a small, entrepreneurial
    environment where responsibilities may evolve as the
    organization grows.

  Work Environment

  - Regularly operates a computer and uses other standard office
    equipment such as a phone, calculator, photocopier, and
    computer printer
  - Ability to see and read a computer screen and printed matter
    with or without visual aids
  - Occasionally lifts, carries or otherwise moves and positions
    objects weighing up to 15 pounds
  - This role is Hybrid/Remote-friendly – Based in Silver
    Spring, MD 20904

  Technical Environment

  - Strong to advanced proficiency in Python, including
    experience developing production-quality or technically
    sophisticated applications.
  - Demonstrated understanding of software development
    principles, object-oriented programming, debugging,
    testing, version control, and software documentation.
  - Experience integrating software with hardware, peripherals,
    sensors, controllers, or other physical devices.
  - Ability to independently troubleshoot technical problems
    spanning both software and hardware.

  Education Requirements

  - Bachelor's degree in Computer Science, Computer Engineering,
    Software Engineering, or a closely related technical
    discipline.
  - Professional experience in lieu of education accepted.



  Compensation & Benefits



  Salary Range: $88,000 - $97,000 with significant
  performance-based bonus potential.



  Comprehensive Benefits Package (upon transitioning to full-
  time W2 employment):

  - Medical, dental, and vision insurance
  - Life and short-term/long-term disability insurance
  - 401(k) retirement plan
  - Paid vacation and holiday leave
  - Educational assistance program



  U.S. Citizenship is necessary due to federal contract
  requirements. Applicants must be prepared to verify
  citizenship at interview stage.
