description: |
  TL;DR – We’re looking for Staff Software Engineers to join
  the team and build Lovable for our Enterprise customers.
  Your time will be split between customer engagements and
  building our core product. Up to 40% of your time could be
  forward deployed, working directly with enterprise customers
  to solve their hardest technical problems. The rest you’ll
  spend back in the product team, building what you’ve learned
  in the field into the Lovable platform. It’s a unique
  opportunity to work on both sides of enterprise software and
  solve problems with AI that no one has solved before.



  Why Lovable?

  Lovable is the software creation platform that gives people
  the power to act on the problems closest to them. For
  decades, turning an idea into software required so much
  capital, technical fluency, and time that many ideas never
  came to life. Lovable is the counterargument: a platform for
  all people with ideas, ambition, and problems worth solving.
  From solopreneurs to small business owners to teams at
  companies like Adidas and Zendesk, people have built over 60
  million projects on Lovable since its launch in November
  2024. And we’re just getting started.

  We’re building a generational company from Stockholm, with
  growing teams in London, Boston, New York, and San
  Francisco. Our team is small, talent-dense, and moving
  quickly, with a culture rooted in extreme ownership, high
  velocity, and low-ego collaboration. We look for people who
  care deeply, ship fast, and are eager to make a dent in the
  world.

  Lovable is one of TIME’s 100 Most Influential Companies and
  has been recognized on the Forbes AI 50 and CNBC Disruptor
  50, reflecting our momentum as one of Europe’s fastest-
  growing AI companies and one of the most ambitious places to
  build in this next era of software.



  About the role

  Most engineering roles place you either close to the product
  or close to the customer. This role gives you both.

  You'll build the parts of Lovable that Enterprise level
  companies depend on: security, governance, admin controls,
  integrations with their existing systems, and performance at
  scale.

  Up to 40% of your time you’ll be forward deployed, working
  directly with enterprise customers on their hardest
  technical problems. The rest of the time you’ll be back in
  the product team, building what the field showed you. The
  aim of every rotation is to turn what one customer needs
  into something every customer can use.

  If you want to stay deeply hands-on, close to both real
  customer problems and the product that solves them, this is
  that role. Forward Deployed rotations may involve travel to
  customer sites.



  What you’ll do

  - Build and ship core enterprise capabilities across Lovable’s
    frontend, backend and AI systems, and operate them in
    production
  - Turn ambiguous requirements into clear technical designs and
    working production systems
  - Spend up-to 40% of your time forward deployed with
    enterprise customers, solving their hardest technical
    problems
  - Turn what you learned in the field into foundational
    platform improvements
  - Identify and codify repeatable deployment patterns and
    contribute insights back to our Product and Engineering
    teams.
  - Own projects end-to-end—from discovery and architecture
    through shipping and iteration
  - Debug complex issues across application, infrastructure, and
    AI-system boundaries
  - Shape how the Enterprise team runs its field rotations,
    including engineering standards, rituals, and playbooks
  - Contribute to core product strategy, technical decisions,
    and cultural foundations



  What we’re looking for

  - 8+ years experience building, shipping and maintaining
    production-grade software
  - Strong full-stack engineering fundamentals, including robust
    backend (Go, Rust) development and React and TypeScript on
    the frontend
  - You have worked directly with customers, and have the
    product sense to tell a one-off request from something
    every customer needs
  - Strong architectural thinking and familiarity with
    distributed systems
  - Experience building for enterprise requirements such as SSO,
    role-based access control, audit logging, data residency
    or compliance
  - Strong architectural thinking and familiarity with
    distributed systems
  - Ability to prototype rapidly and turn successful experiments
    into production-quality solutions

  Bonus if you’ve:

  - Worked on agentic AI systems or built with LLMs before
  - Led zero-to-one product development
  - Worked in a forward deployed, solutions, or partner
    engineering role
  - Worked in a founding or early startup environment



  Our Tech Stack

  - Backend: Golang & Rust
  - Frontend: React, Typescript
  - Cloud: Cloudflare, GCP, AWS, multiple LLM providers
  - Tooling: Github Actions, OTEL, Grafana, Terraform, and more



  How we hire

  - Fill out a short form and hop on a brief intro call with our
    recruiting team.
  - Complete a quick live coding exercise.
  - Show us how you approach problems during several technical
    interviews.
  - Show us something you’ve built that makes you proud.



  About your application

  - Please submit your application in English - it’s our company
    language
  - We treat all candidates equally - if you’re interested
    please apply through our careers portal.
