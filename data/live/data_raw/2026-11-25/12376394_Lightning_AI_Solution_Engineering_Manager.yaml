title: Solution Engineering Manager
company: Lightning AI
location: New York, USA
work_type: FULL_TIME
company_size: 50 Employees
description: |
  Who We Are

  Lightning AI is the company behind PyTorch Lightning.
  Founded in 2019, we build an end-to-end platform for
  developing, training, and deploying AI systems—designed to
  take ideas from research to production with less friction.

  Through our merger with Voltage Park, a neocloud and AI
  Factory, Lightning AI combines developer-first software with
  cost-efficient, large-scale compute. Teams get the tools
  they need for experimentation, training, and production
  inference, with security, observability, and control built
  in.

  We serve solo researchers, startups, and large enterprises.
  Lightning AI operates globally with offices in New York
  City, San Francisco, Seattle, and London, and is backed by
  Coatue, Index Ventures, Bain Capital Ventures, and
  Firstminute.

  The Way We Work

  The people who thrive here are builders who move fast,
  communicate openly, take ownership, and continuously improve
  themselves, their teams, and our company. Here's what that
  looks like in practice:

  - Move with Urgency: We move quickly, make thoughtful
    decisions, and keep momentum. We value action over
    perfection and learn by shipping.
  - Take Ownership: We own outcomes, not just our individual
    work. We make decisions that move the company forward and
    follow through.
  - Communicate Openly: We communicate directly, seek to
    understand, and create clarity for others. Honest
    conversations help us move faster together.
  - Build Great Teams: We lead by example, empower others, and
    create healthy teams where people can do their best work.
  - Raise the Bar: We're always improving ourselves. We learn
    from feedback, consistently challenge ourselves to grow,
    and focus on the work that matters most.
  - Think Long-Term: We design for what's next. We create
    scalable systems, simplify complexity, and use AI and
    automation to amplify our impact.



  What We're Looking For

  Lightning AI is seeking a Solutions Engineering Manager to
  lead a team of presales Solutions Engineers who win and
  expand our AI/ML platform deals, with customers ranging from
  AI-native startups to research labs and Fortune 500
  enterprises. This is a true player-coach role: you'll build
  and develop the team and own technical win rate across your
  segment, while personally running a set of strategic deals
  as lead SE from discovery to technical close.

  This role requires hands-on AI/ML experience. Our buyers are
  ML engineers, researchers, and platform teams, and they can
  tell quickly whether someone has trained and deployed models
  themselves. You'll need to earn that trust in your own deals
  and set the technical bar for your team.

  Your SEs are the technical voice in the sales cycle. They
  run discovery with ML leads and platform teams, design
  solutions for training, fine-tuning, and inference
  workloads, and earn the technical decision through demos and
  proofs of concept. You'll partner with Sales leadership as
  an equal and be the bridge from the field to Product and
  Engineering.

  This role is hybrid with a minimum of 3 in-office days per
  week in New York City, with up to 30% travel. All employees
  participate in occasional team and company offsites.

  What You'll Do

  - Hire, onboard, and develop Solutions Engineers who combine
    hands-on AI/ML depth with strong customer presence, and
    run 1:1s, career plans, and performance reviews that build
    a culture of ownership, curiosity, and craft
  - Coach the team on discovery, solution design, demos,
    objection handling, and POC execution, joining calls,
    giving specific feedback, and raising the team's ML
    technical depth
  - Own technical win rate, POC conversion, and SE contribution
    to pipeline and bookings, aligning SE coverage with AE
    territories and partnering with Sales leadership on
    forecasting, deal strategy, and account planning
  - Run your own book of strategic deals as lead SE, from
    discovery and solution design through demos, POCs,
    executive technical briefings, and security and
    procurement reviews
  - Set the standard for POCs, with clear success criteria,
    scoped timelines, and a crisp technical close
  - Build repeatable playbooks and reusable assets, including
    discovery frameworks, reference architectures, demo
    environments, and POC templates that show Lightning on
    real workloads such as LLM fine-tuning, distributed
    training, and model serving
  - Bring structured field feedback and competitive insight to
    Product and Engineering, and partner with Customer Success
    on clean handoffs so technical wins become long-term
    adoption and expansion

  What You Need

  - 5+ years in presales Solutions Engineering, Sales
    Engineering, or a similar customer-facing technical role,
    including 2+ years managing SEs
  - Hands-on AI/ML experience: you have trained, fine-tuned, or
    deployed models yourself, whether as an ML engineer, data
    scientist, researcher, or a deeply technical ML-focused
    SE, and can explain the tradeoffs across the lifecycle
    from training to inference
  - Working fluency in the modern AI/ML stack, including
    PyTorch, GPU compute, distributed training, and LLM fine-
    tuning and serving, deep enough to build and debug demos
    and POCs yourself, not just guide them
  - A record of hitting team targets and winning complex,
    technical enterprise deals for AI/ML or ML infrastructure
    products such as ML platforms, MLOps tools, or AI compute,
    using MEDDIC or a similar qualification methodology
  - Experience engaging ML buyer personas such as ML engineers,
    data scientists, researchers, and ML platform engineers
  - Working knowledge of cloud infrastructure (AWS, GCP, or
    Azure), Kubernetes and containers, and enterprise needs
    such as SSO, VPC deployment, and data security
  - Strong executive presence and written communication, with
    the range to pitch to a CTO and go deep on model
    architecture with an ML team on the same day
  - A coaching mindset and the judgment to know when to lead
    from the front and when to let your team run

  Nice to Have

  - Deep experience with LLM fine-tuning and serving tools
    (LoRA, vLLM, TensorRT-LLM) or distributed training
    frameworks (DDP, FSDP, DeepSpeed)
  - Production ML experience at scale, such as multi-node
    training runs or high-throughput inference
  - Experience selling GPU cloud or AI compute specifically
  - Familiarity with cloud marketplace and co-sell motions (AWS,
    GCP, Azure)
  - Open-source contributions, technical content, or conference
    talks in the ML community
  - Experience building an SE team at an early- or growth-stage
    startup

  Compensation

  We are committed to offering competitive compensation that
  reflects the value each team member brings to our mission.
  Final offers are based on factors such as experience,
  skills, geographic location, and role expectations. In
  addition to base salary, our total rewards package for
  eligible roles includes a discretionary bonus, a meaningful
  equity component, and comprehensive benefits. Anticipated on
  target earnings is $240,000-$300,000 USD

  Benefits and Perks

  We offer a comprehensive and competitive benefits package
  designed to support our employees’ health, well-being, and
  long-term success:

  - Comprehensive Health Coverage: Medical, dental, and vision
    coverage for employees and eligible dependents.
  - Meaningful Equity: RSUs that give employees a stake in the
    company's long-term success.
  - Retirement Savings: 401(k) matching (U.S.) and pension
    contributions (U.K.).
  - Flexible Time Off: Unlimited PTO, company holidays, and
    floating holidays to support work-life balance.
  - Paid Parental & Family Leave: Paid leave to support you and
    your family through life's important moments.
  - Professional Development: Annual learning and development
    allowance to support your professional growth.
  - Wellness Benefits: Wellness and work-from-home stipends to
    support your physical and mental well-being.
  - Sabbatical Program: Four weeks of paid sabbatical leave
    after four years of service.
  - Flexible Work: Flexible schedules and a hybrid work model
    for our office-based teams.
  - In-Office Meals: Complimentary meals at our office hubs.

  Benefits may vary by location, team, and role.

  At Lightning AI, we are committed to fostering an inclusive
  and diverse workplace. We believe that diverse teams drive
  innovation and create better products. We provide equal
  employment opportunities to all employees and applicants
  without regard to race, color, religion, gender, sexual
  orientation, gender identity, national origin, age,
  disability, veteran status, or any other protected
  characteristic. We are dedicated to building a culture where
  everyone can thrive and contribute to their fullest
  potential.
