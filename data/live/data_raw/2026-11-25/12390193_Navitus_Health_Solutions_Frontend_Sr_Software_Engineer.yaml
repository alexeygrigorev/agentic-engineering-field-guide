  Qualifications

  What our team expects from you?

  - College degree typically in the field of computer science,
    information systems, or software engineering, and must
    have 8+ years of professional development experience
  - Proven technical leadership within a team and an
    organization
  - Proficient development skills utilizing .NET Core, C#,
    JavaScript, and Angular
  - Experience using git and Azure DevOps (TFS) to manage
    development codebases
  - Excellent understanding of coding methods and best practices
    including object-oriented programming
  - Excellent understanding of application performance and
    tuning using development techniques such as caching and
    application gateway
  - Experience developing and implementing RESTful APIs
    including routes secured with an enterprise grade identity
    management platform
  - Experience developing and implementing a role-based security
    model
  - Experience with data integration using standard formats such
    as HL7 FHIR and NCPDP standards
  - Experience creating real time integrations using event
    streaming tools such as Kafka/Confluent
  - Proven design, development and thorough understanding of a
    microservices architecture
  - Oracle and/or SQL Server database development experience
  - Familiarity with NOSQL databases
  - Prior experience collaborating with business teams to
    analyze business requirements and develop technical
    specifications
  - Ability to interview end-users for insight on functionality,
    interface, problems, and/or usability issues
  - Hands-on experience developing test cases and test plans
    including unit testing as part of the development process
  - Experience with agile software delivery methods including
    continuous integration and delivery using technologies
    such as Docker, Kubernetes, and OpenShift
  - Knowledge of accessibility requirements as it relates to
    application development such as section 508 and WCAG
  - Healthcare industry practices and HIPAA knowledge would be a
    plus
  - Knowledge of applicable data privacy practices and laws
  - Participate in, adhere to, and support compliance program
    objectives
  - The ability to consistently interact cooperatively and
    respectfully with other employees

