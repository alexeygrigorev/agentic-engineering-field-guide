  Lumicera Health Services is seeking a Sr. Software Engineer
  to join our team!

  The Sr. Software Engineer ensures efforts are in alignment
  with Enterprise Architecture team to support customer-
  focused objectives and the IT Vision, a collaborative
  partner delivering innovative ideas, solutions and services
  to simplify people’s lives. The role is to develop, test,
  and analyze software applications in support of the
  achievement of business requirements. The individual will
  also research, document and modify software applications
  throughout the software development life cycle. This role
  requires a strong understanding of development and
  architectural principles that can be applied to enhance
  overall quality, speed, and scalability of development
  across the organization. This role will also work on adding
  visibility to technical debt and increasing software
  delivery speed, quality, and efficiency across the
  enterprise.

  Is this you? Find out more below!

  Responsibilities

  How do I make an impact on my team?

  - Research and identify technology upgrades which will enhance
    the ability to deliver robust solutions
  - Ensure the new projects and enhancements to legacy solutions
    (where possible) work towards an enterprise architecture
    as opposed to a proliferation of point solutions
  - Work with other technical teams to define and identify
    cross-functional solutions for integration with new or
    existing technologies
  - Lead application and system architecture design working in
    conjunction with partners in the areas of architecture and
    infrastructure
  - Lead the effort for design, development and implementation
    to deliver solutions which are easily maintainable and
    scalable
  - Direct or indirect involvement in the development of
    policies, standards, and guidelines that direct the
    selection, development, implementation and use of
    Information Technology within the enterprise
  - Provide coaching and guidance to colleagues to ensure
    applications, services, and processes are developed in a
    way that complies with architectural guidelines and
    established methodologies
  - Informs management and provides recommendations for
    mitigation of potential bottlenecks or single-points of
    failure within the environment that may affect system
    performance or availability
  - Estimate effort required for the design, development and
    implementation of technical solutions
  - Other duties as assigned

