description: |
  Secure Every Identity, from AI to Human Identity is the key
  to unlocking the potential of AI. Okta secures AI by
  building the trusted, neutral infrastructure that enables
  organizations to safely embrace this new era. This work
  requires a relentless drive to solve complex challenges with
  real-world stakes. We are looking for builders and owners
  who operate with speed and urgency and execute with
  excellence. This is an opportunity to do career-defining
  work. We're all in on this mission. If you are too, let's
  talk.

  Opportunity

  As a Staff Engineer on the OIG team, you will be involved
  into development, design, and maintenance of our product to
  serve enterprise customers at scale. You will involve the
  architecture and evolution of our product features —
  spanning the across different access governance personas —
  and work collaboratively across engineering, product, and
  design to deliver features that are secure, scalable, and
  delightful to use.

  This is a role for someone who thinks in systems, leads with
  craft, and is energized by the challenge of building
  enterprise-grade software that millions of users depend on.

  This is a rare opportunity to join a team where your
  technical decisions will directly shape how thousands of
  enterprises manage access governance at scale, where the
  technical challenges are genuinely hard, and where the work
  you ship will be seen and felt by real users every day.

  Job Duties And Responsibilities

  - Take end-to-end ownership of feature areas — from technical
    design through implementation, testing, deployment, and
    post-launch monitoring
  - Design, build, and ship high-quality, production-ready
    features across the OIG system, with a focus on
    correctness, reliability, and performance
  - Quickly deliver high-quality bug fixes and handle customer-
    reported issues
  - Write clean, well-tested, maintainable code and hold
    yourself and teammates to a high bar for engineering
    quality
  - Partner with our Product Development, QA, and Site
    Reliability Engineering teams for scoping the development
    and deployment work

  Required Knowledge, Skills, And Abilities

  - 8+ years of software engineering experience, with a
    demonstrated ability to independently own and deliver
    complex features in a production environment
  - Proven track record of architecting and delivering large-
    scale, distributed systems in production environments
    serving enterprise customers
  - Deep expertise in microservices, event-driven architectures,
    APIs, and data modeling at scale
  - Strong proficiency in one or more of: Java, Kotlin, Go, or
    equivalent JVM/cloud-native languages used in Okta's
    backend stack
  - Demonstrated ability to influence without authority —
    driving technical alignment across multiple teams and
    stakeholders
  - Experience designing systems that meet enterprise
    reliability, scalability, and security requirements
    (think: multi-tenancy, high availability, audit logging,
    RBAC/ABAC)
  - Excellent written and verbal communication skills, with the
    ability to make complex technical topics accessible to
    both engineers and non-engineers

  Preferred if you have experience in any of the following!

  - Experience building identity, access management, or
    governance (IAM/IGA) products or platforms
  - Familiarity with workflow engines or approval/routing
    systems (e.g., finite state machines, BPM-style systems)
  - Experience with enterprise SaaS platforms serving large,
    complex customer organizations
  - Hands-on experience with cloud infrastructure (AWS, GCP, or
    Azure) and modern observability tooling

  Education

  - B.S. Computer Science or equivalent

  *Must attend in-person onboarding the first week of
  employment in San Francisco, CA for West Coast and Chicago
  for East Coast

  * Must go to office 2 days a week

