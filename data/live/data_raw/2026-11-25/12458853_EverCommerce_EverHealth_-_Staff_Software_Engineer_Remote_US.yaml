description: |
  EverHealth - Staff Software Engineer

  EverCommerce (Nasdaq: EVCM) is a leading service commerce
  platform, providing vertically-tailored, integrated SaaS
  solutions that help more than 745,000 global service-based
  businesses accelerate growth, streamline operations, and
  increase retention. Its modern digital and mobile
  applications create predictable, informed, and convenient
  experiences between customers and their service
  professionals. With its EverPro, EverHealth, and EverWell
  brands specializing in Home, Health, and Wellness service
  industries, EverCommerce provides end-to-end business
  management software, embedded payment acceptance, marketing
  technology, and customer experience applications. Learn more
  at EverCommerce.com.

  We are building an extraordinary company and looking for
  talented and motivated people to join our team. You can
  learn more about our Company, Culture and Values here:
  https://www.evercommerce.com/about-us/careers/

  EverHealth, a business within EverCommerce, provides modern
  end-to-end solutions for healthcare providers. Our open,
  connected ecosystem of solutions and services helps
  providers engage patients, increase revenue, improve
  business efficiency, and remain market competitive. We serve
  72,000+ healthcare practices and counting. EverHealth
  consists of SaaS products including DrChrono, iSalus,
  CollaborateMD, Updox, eProviderSolutions, AlertMD, and MD
  Coder. With two EHRs and platform-level solutions such as
  communication platforms and a clearinghouse, EverHealth
  delivers a turn-key, end-to-end solution for the software
  needs of a modern healthcare practice.

  We are looking for a Staff Software Engineer to focus on
  advancing revenue cycle management (RCM) capabilities within
  our CollaborateMD product. RCM is at the heart of how our
  customers get paid, and we are building a new generation of
  RCM tools that pair modern workflow software with AI agents
  to help billing teams work smarter, resolve issues faster,
  and collect more of what they’ve earned. This work is part
  of our broader focus on finding where automation, AI, and
  new experiences can make the biggest impact across the
  EverHealth portfolio.

  As a Software Engineer on the CollaborateMD team, you’ll
  help build and evolve a cloud-based practice management and
  medical billing platform that healthcare practices rely on
  every day to run their business and get paid. The work you
  ship affects real practices, their staff and ultimately
  their patients.

  You’ll own features end to end across our Angular front end,
  Java back end and PostgreSQL database, from understanding
  the business problem to shipping and supporting the solution
  in production. You’ll help design and build AI-powered
  features, including agents that help users work faster and
  more accurately.

  CollaborateMD is an established product with a large, long-
  lived codebase. You’ll improve it incrementally through
  refactoring, better test coverage, performance tuning and
  better observability, without disrupting the customers who
  depend on it. You’ll contribute to our ongoing AWS
  modernization, including containerized services, database
  scaling and secure data integrations.

  Responsibilities:

  - Build and ship features, from the user interface through
    backend services, APIs, and the data model

  - Build and maintain integrations that connect the platform
    with EverHealth products, our clearinghouse, and third-
    party systems

  - Participate in design discussions and code reviews

  - Author technical design documents (RFCs) and advocate for
    modern development patterns, enhancing code quality,
    security, and maintainability

  - Use AI-assisted development across planning, design, coding,
    testing, review, and operations

  - Being up to date with new technologies, frameworks and
    tooling that can improve the software development
    lifecycle

  - Build secure, reliable software that keeps PHI within our
    AWS environment and meets HIPAA, SOC 2, and HITRUST
    requirements, backed by strong testing, monitoring, and
    operational practices



  Skills and Experience needed for success in this role:

  - 7+ years of experience of professional software development

  - Deep, production-grade proficiency in Java (Java 17/21,
    Spring Boot) developing RESTful APIs, distributed
    microservices, multi-threading, and event-driven
    architectures

  - Strong working knowledge of modern frontend frameworks
    (TypeScript, Angular preferred)

  - Extensive expertise in database modeling, indexing, and
    performance tuning across relational document stores
    (PostgreSQL preferred)

  - Expertise with AWS core and serverless architecture (RDS,
    ECS, Lambda, API Gateway, SQS/SNS, EventBridge, IAM,
    Secrets Manager, CloudWatch, S3)

  - Demonstrated experience with Docker and containerized
    deployments

  - Daily, hands-on use of AI coding and agent tools (e.g.,
    Claude Code, Cursor, Copilot) across the development
    lifecycle in your own work

  - Experience integrating LLMs or AI agents into production
    software, including orchestration, evaluation, and human-
    in-the-loop workflows

  - Experience with AWS Bedrock or Bedrock AgentCore

  - A product engineering mindset focused on solving problems
    and delivering outcomes, not just technology

  - Ability to work directly with non-technical stakeholders and
    turn their needs into working software

  - Strong written and verbal communication skills

  Nice to Have:

  - Healthcare/RCM experience, such as claims, EDI 837/835,
    eligibility, denial and A/R workflows, and HIPAA

  - Regulated environments such as HIPAA, PCI DSS or SOC 2,
    including secure coding and audit work

  Where: The EverCommerce team is distributed globally, with
  teams in the U.S., Canada, the U.K., New Zealand, and
  Australia. With a widely distributed team, we are used to
  working remotely across different time zones. This role can
  be based anywhere in the United States. Candidates based in
  the Chicago area will work hybrid, meeting with the team in
  person 1–2 days per week. Candidates elsewhere in the U.S.
  will work remotely. Please note that you must be eligible to
  work without sponsorship to qualify for this position, and
  this role may require travel to our Corporate Headquarters
  in Denver, Colorado, or to other office locations around
  North America.



  Benefits and Perks:

  ·       Hybrid or remote work, depending on location

  ·       Continued investment in your professional
  development

  ·       Day 1 access to robust health and wellness benefits,
  including an annual wellness stipend

  ·       401k with up to a 4% match and immediate vesting

  ·       Flexible and generous (FTO) time-off

  ·       Employee Stock Purchase Program



  Compensation: The target base compensation for this position
  is $150,000 to $170,000 USD per year in most US locations.
  Final offer amounts are determined by multiple factors
  including location, local market variances, and candidate
  experience and expertise, and may vary from the amounts
  listed above.

