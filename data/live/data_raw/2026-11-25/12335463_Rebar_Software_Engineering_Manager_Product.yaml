description: |
  About Rebar

  Construction is a $2 trillion industry in the US alone. Most
  of it still runs like it’s 1995: PDFs, spreadsheets, and
  email.

  Every commercial building starts the same way. Someone opens
  a few hundred pages of blueprints and counts every piece of
  equipment, duct, and pipe by hand. Then they price it, bid
  it, and chase it for months. That work decides who builds
  what, and for how much. It has barely changed in 30 years.

  Rebar is building the AI platform the trades run on. Our
  models read blueprints the way a veteran in the trades does.
  Our agents then do the work that follows: counting the job,
  pricing it, managing the bid, and tracking it through to the
  order. Counts that took three days now take one. Customers
  spend hours a day in Rebar, and thousands of new plan sets
  flow through it every week.

  We started with HVAC contractors and their suppliers. Every
  other trade comes next.

  Here’s where we go: when a building goes up, the trades that
  build it run on Rebar. Agents win the job, run the job, and
  buy the equipment.

  We’re about 50 people in Union Square, growing fast, and
  backed by top investors. We’ve built only a fraction of what
  we need to.

  Job Overview

  We're looking for a hands-on Engineering Manager to lead our
  product engineering team. You'll own the people, the
  delivery, and the technical direction behind key product
  expansion, a quickly rising quality bar, and the
  architecture of the application our customers live in daily,
  while still shipping code yourself.

  We understand the challenges and sacrifices that come with
  joining an early-stage startup, and want to emphasize the
  importance of making it our mission to ensure you leave as a
  better and more experienced engineer and leader than when
  you joined. Here you’ll have the opportunity to build and
  shape a product team, set its technical standard, own a hard
  piece of client-side engineering, and watch it scale from
  hundreds to thousands of users.

  This is a scale moment for us. We are expanding our market
  and need an experienced, technically strong leader to build
  the team that gets us there.

  Responsibilities

  Lead and grow the team

  - Build and manage the product engineering team
    - Hire, onboard, coach, and give direct feedback. Run 1:1s and
      performance reviews, and grow engineers into owners of
      their domains.
  - Own delivery
    - Turn product goals into a realistic plan, scope and sequence
      the work, make the tradeoff calls, and keep Product,
      Design, and leadership informed on progress and risk.
  - Set a strong engineering standard in the agentic world
    - Define how the team builds with AI tools, and keep raising
      the quality bar for the engineering org as it roughly
      doubles.
  - Raise the review and testing bar
    - Required checks, meaningful end-to-end coverage of the flows
      that actually break, and review that catches design
      problems rather than typos.

  Stay hands-on

  - Own runtime quality of the product
    - Interaction latency, rendering performance, memory, and
      correctness on real customer projects - not lab
      conditions. You and your team own the metrics, the
      budgets, and the regressions.
  - Own the hard client-side architecture
    - The canvas editor, the collaborative document layer, and the
      state that ties them together. You make or sign off on
      the big calls here.
  - Ship features end to end
    - From the editor down through the API and the database. You
      write production code, design data models and endpoints,
      and pair with engineers on the hardest problems.

  What You Bring

  - Experience leading one or more engineering teams,
    accountable for technical execution, delivery, and quality
    across architecture, development, and production in fast-
    paced environments where speed and quality both matter.
  - Proven success guiding teams through the end-to-end delivery
    of complex, user-facing, AI-native products, from system
    design and technical decision-making through production
    and iteration.
  - Demonstrated ability to hire, mentor, and develop engineers
    across multiple career stages, fostering diverse, high-
    performing teams with strong ownership and accountability.
  - Low ego, with a builder mindset and strong technical
    judgment when making difficult trade-offs, reviewing
    designs, and guiding decisions without becoming the
    bottleneck.
  - Deep experience partnering cross-functionally with Product,
    Design, Data, and Clinical to align technical execution
    with user, clinical, and business outcomes.
  - A data-driven approach to product development, with
    experience defining success measures, using data to
    evaluate impact, and iterating effectively in fast-moving
    product cycles.
  - Significant hands-on engineering experience in the domain
    you’ll be leading, enabling credibility with technical
    teams.



  Compensation & Benefits

  - Competitive salary based on experience
  - Equity: meaningful grant, aligned with your background
  - Benefits: medical, dental, vision
  - Perks: free lunches and dinners

  This is a full-time, on-site role in NYC’s Flatiron
  District, steps from Madison Square Park and Union Square.

  Equal Opportunity

  Rebar is an equal opportunity employer. We welcome
  applicants of every background and do not discriminate on
  the basis of race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, veteran
  status, or any other protected characteristic.
