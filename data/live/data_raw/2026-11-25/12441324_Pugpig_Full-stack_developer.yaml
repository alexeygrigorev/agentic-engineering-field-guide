description: |
  Reporting to:

  Development Team Lead (Professional Services)

  About the role

  As a Pugpig Developer, you'll play a pivotal role in
  delivering exceptional mobile app experiences using web
  technologies like HTML, SaSS, Vue.js, JavaScript, and PHP.
  Working within our professional services team, you'll craft
  and structure custom WordPress themes and plugins to create
  polished, rich and visually stunning mobile applications.

  Beyond development, you’ll dive deep into our product
  codebase, becoming a subject matter expert and the go-to
  individual that supports both professional services and
  product development teams. Your expertise will ensure smooth
  project delivery and empower you to contribute to the
  continued evolution of our leading platforms.

  Key Responsibilities:

  - Develop native App webview UI’s and occasionally feature
    rich Wordpress websites from a design concept to a pixel
    perfect product collaborating closely with support
    engineers and clients
  - Developing custom WordPress themes and plugins with rich
    custom logic, extending our CMS services which are based
    on WordPress
  - Writing neat, testable, efficient code
  - Participating in daily stand-ups, meetings, sprint demos and
    retrospectives
  - Working closely with project managers, customer success
    managers, support engineers, as well as other back-end,
    front-end, web and native app developers, to deliver
    custom projects according to agreed scope, time and budget
  - Debugging/fixing and replying to support requests from
    clients
  - Consulting with clients on their designs and projects, where
    necessary joining client calls to discuss issues and
    solutions, and communicating via Slack/Email with updates,
    to request information and to answer questions
  - Working with project managers to scope and estimate custom
    projects, working through solutions, and helping to
    identify risks, issues and dependencies
  - Studying, interpreting and understanding product code
  - Acting as a facilitator for professional services and
    product developers to support delivery

  About Pugpig

  - We are the best mobile publishing platform on the market and
    we work with the world's best media companies.
  - We work in close partnership with our customers to conceive,
    evolve, customise and operate our platforms, so they can
    focus on their core business.
  - Our platforms power hundreds of apps for the biggest media
    brands in the world, including The Independent, New
    Scientist, The Spectator, Condé Nast, Reach, DMG Media,
    CNN, Hearst and many more.
  - We work with news media, consumer magazines, B2B publishers
    and membership organisations.
  - Our teams in London, New York and the Philippines offer deep
    expertise and support to customers around the world.

  Working at Pugpig

  Here are some of the things you’ll experience if you come
  and join us:

  - You’ll be working with the world’s best media companies
  - Alongside an awesome, vibrant team of technology
    professionals
  - With a set of values that puts an emphasis on quality of
    life for all of our team members
  - Hybrid working and shorter days on Wednesdays and Fridays
  - Performance-related bonus scheme
  - Wellbeing support and healthcare options
  - Volunteering days every year so that you can support a
    charity that’s close to your heart
  - Training and conference budgets that help you stay on the
    top of your game

  Our values

  - Be the solution

  We take the initiative and seek to solve problems with
  creativity.

  - Make tomorrow better

  We think critically about what will deliver our goals and
  improve tomorrow;

  Our future selves will thank us.

  - Zoom out

  We think big picture and look beyond our immediate field of
  vision.

  - Be kind

  We communicate with kindness, openness and respect;

  We approach interactions with a positive and supportive
  attitude.

  - Enjoy the ride

  We have fun and prioritise quality of life, even when we’re
  up against it.

  About you

  You will have 1 year minimum working in a similar industry
  such as app/web design and development or software
  development. You will have a good eye for design and
  typography, an understanding of accessibility standards, and
  an interest in UX/UI.

  You will be organised, methodical and delivery focused, with
  the ability to see a high level of detail and to step back
  and see the big picture. Pugpig is fast paced, you may be
  working on several projects at once, as well as smaller
  support tasks at the same time so you’ll be able to
  prioritise and manage multiple tasks. You will enjoy
  collaborating and working with a team to attain goals and be
  an active contributor. You will have a desire to learn
  continuously, picking up new skills and working with new
  technologies.

  Required skills and experience:

  - Proficiency in modern HTML, JavaScript, and CSS, with a
    minimum of 1 year experience
  - Solid working knowledge of JavaScript frameworks/libraries
    such as Vue.js, React (at least 1 year)
  - Solid ability to read, understand and extend existing PHP &
    Vue.js code
  - An understanding of WordPress action/filter hooks
  - CSS preprocessors (Sass)
  - Experience of server side development and working with APIs
    (you'll be working with back end, front end and app devs)
  - A good understanding of package managers (NPM and Docker)
  - A good understanding of responsive mobile-first design using
    CSS Media Queries
  - A good design eye, and experience with web fonts and
    typography.
  - A good understanding of accessibility best practices
  - A good understanding of Software Development Lifecycle
  - Experience with cross-browser testing, accessibility
    testing, and performance testing and fixes
  - Source control tools - we use Bitbucket / Git
  - Comfort using AI-assisted coding tools (Claude Code, Codex,
    GitHub Copilot, or similar) to accelerate development and
    code review, while taking responsibility for the quality
    and accuracy of output
  - Clear and effective written and verbal communication
  - Good presentation skills, possessing the ability to break
    down and explain complex topics in simple terms
  - Commercial experience working in an agile environment using
    project management tools such as Jira
  - A portfolio site / github or equivalent/example work

  The following would be a bonus but not required:

  - An understanding of JavaScript bundlers such as Webpack and
    Vite
  - Familiarity with static code analysis and/or unit testing
  - A good understanding of UX principles and UI design
  - An interest in AI and how it can be used to work smarter,
    whether that’s through tools you’ve already used or ideas
    you’re keen to explore
  - Project management skills, supporting project estimation and
    scoping
  - Experience with Figma and/or Adobe Creative Suite
    (Photoshop, Illustrator, XD) (to work with designs for
    clients)
  - An interest in PHP frameworks such as Laravel
  - Keen interest in up-to-date technologies
  - An interest in Apple News development
  - An interest in, or experience of, how native mobile apps are
    built
  - An interest in publishing.

  If this role sounds like a great fit, get in touch with us,
  we’d love to hear from you!

  Pugpig is committed to promoting an inclusive culture. We
  believe that diversity leads to a happier and more
  productive working environment.

  We welcome suitably qualified applicants from all different
  backgrounds.

  Please let us know if you have additional requirements. We
  are happy to make the necessary accommodations so that we
  can facilitate a positive recruitment process.
