description: |
  We are seeking a Mid-level Full-Time Full Stack Software
  Engineer to join our team. The ideal candidate will have
  experience in React, TypeScript, JavaScript, and Next.js for
  front-end development, along with proficiency in Java and
  Spring Boot for back-end systems. A solid understanding of
  Infrastructure as Code (IAC) and AWS Cloud services is
  essential, as is a proven track record in both front-end and
  back-end development. The successful candidate will
  demonstrate a deep understanding of cloud infrastructure and
  deployment processes. This position is based in the United
  States, with a preference for candidates who can overlap
  with Pacific Time Zone working hours. 

  Please note that we are currently unable to sponsor visas
  for this position.


  Responsibilities:

  - Design, develop, and maintain high-quality web applications
    using React, TypeScript, JavaScript, and Next.js.

  - Build robust and scalable back-end services with Java and
    Spring Boot.

  - Implement and manage cloud infrastructure using AWS and IAC
    tools such as Terraform or CloudFormation.

  - Collaborate with cross-functional teams to define, design,
    and ship new features.

  - Ensure the performance, quality, and responsiveness of
    applications.

  - Identify and correct bottlenecks and fix bugs.

  - Help maintain code quality, organization, and automation by
    writing tests and frameworks.


  Please note that responsibilities may evolve based on
  company needs and the dynamic nature of this position.

  Requirements

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field, or equivalent experience.

  - 5+ years of professional experience as a Full Stack
    Engineer.

  - Proficiency in front-end technologies: React, TypeScript,
    JavaScript, and Next.js.

  - Proficiency in writing tests using frameworks and tools e.g:
    Playwright, JUNIT, Cucumber, Postman

  - Strong back-end development skills in Java and Spring Boot.

  - Hands-on experience with AWS services and cloud
    architecture.

  - Experience with Infrastructure as Code (IAC) tools like
    Terraform or CloudFormation.

  - Solid understanding of RESTful APIs and web services.

  - Experience with CI/CD pipelines and DevOps practices.

  - Strong problem-solving skills and attention to detail.

  - Experience refining requirements UX, frontend, and backend
    with Product team and Architects

  - Excellent communication and teamwork skills.

  Nice to have:

  - Experience with Docker and Kubernetes.

  - Familiarity with microservices architecture.

  - Knowledge of database systems, both SQL and NoSQL.

  Salary Range: $150,000-180,000
