description: |
  Company Description

  Role summary

  The technical lead for bank integration. You make sure each
  participant bank's connection to the platform is built,
  tested and certified correctly, and you are TCH's technical
  L2 contact once banks are live.

  Job Description

  Responsibilities

  - Lead technical integration for each bank: connectivity, API
    and message set-up, testing and certification.
  - Diagnose integration and L2 issues hands-on, escalating
    cleanly to Platform Reliability, Security Operations or
    Protocol Engineering.
  - Own technical onboarding documentation, test packs and
    certification scripts.
  - Direct and coach the three Onboarding & Certification
    Specialists.

  Qualifications

  The experience we are looking for

  - 5+ years in implementation engineering, solutions
    engineering or technical account management at a bank,
    payment processor, scheme or payments software vendor.
  - Has personally integrated banks or financial institutions
    onto a payment, clearing or treasury platform, not only
    project-managed it.
  - Hands-on with REST APIs, ISO 20022 messages (for example
    pacs and camt), and connectivity set-up such as mTLS,
    certificates, VPN or SFTP.
  - Can read logs and message payloads to find the root cause of
    a failed test or transaction.
  - 2+ years leading or mentoring a small technical team.

  Desirable

  - Experience with RTP, FedNow, Fedwire, CHIPS or Swift
    connectivity and certification.
  - Scripting (Python or SQL) for test data and validation.

  Not the profile for this role

  - Project or programme managers without hands-on technical
    depth.
  - IT service desk or ITIL service managers from outsourced IT.
  - Pre-sales engineers whose experience ends at demos and
    proposals.

  Success measures

  - Integration and certification milestones met for each bank
    go-live.
  - Certification first-pass rate.
  - L2 resolution rate and quality of escalations into
    engineering.
  - Client technical satisfaction.

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
