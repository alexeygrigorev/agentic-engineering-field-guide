description: |
  About Nebius:

  Nebius is leading a new era in cloud infrastructure for the
  global AI economy. We are building a full-stack AI cloud
  platform that supports developers and enterprises from data
  and model training through to production deployment, without
  the cost and complexity of building large in-house AI/ML
  infrastructure.

  Built by engineers, for engineers. From large-scale GPU
  orchestration to inference optimization, we own the hard
  problems across compute, storage, networking and applied AI.

  Listed on Nasdaq (NBIS) and headquartered in Amsterdam, we
  have a global footprint with R&D hubs across Europe, the UK,
  North America and Israel. Our team of 1,500+ includes
  hundreds of engineers with deep expertise across hardware,
  software and AI R&D.

  The roleWe are looking for Senior Fullstack Engineers to
  work on creating UX solutions for external and internal
  customers. Thousands of AI engineers across healthcare,
  robotics, media, and retail as well as your own collegues
  interact with Nebius through what you build. Your
  responsibilities:

  - Working with multiple internal customers, while keeping UX
    consistent across all the different services
  - Working with APIs in multiple data centers, with changing
    regional model, while thinking about client latencies
  - Creating completely new UX solutions, not directly related
    to infrastructure services, such as customer communication
    services, Cloud shell, IaaC code generation and anything
    else that will improve customer experience
  - Creating complex user flow scenarios for different customer
    tiers in close collaboration with other teams
  - Building a design system that stays coherent as the product
    surface doubles. And making instruments to facilitate
    quick delivery across development, design and
    documentation teams

  We expect you to have:

  - 5+ years of experience in software development.
  - Strong proficiency in modern web development
  - Strong proficiency in Node.JS
  - Understanding of modern databases (PostgreSQL or other
    relational databases)
  - Experience designing and working with APIs (RESTful and
    other RPC)

  It would be nice if you have:

  - Experience with React, tanstack-query
  - Experience with NestJS or similar Node.js frameworks.
  - Exposure to DevOps concepts (Docker, Kubernetes, Linux).
  - Experience with Go development
  - Experience with modern message queues/brokers systems
  - Experience working with distributed systems or complex
    workflows.

  We conduct coding interviews as part of the process.

  Benefits & Perks:

  - Competitive compensation
  - Career growth and learning opportunities
  - Flexibility and ownership
  - Collaborative and innovative culture
  - Opportunity to work on impactful AI projects
  - International environment and talented teams

  What's it like to work at Nebius:

  Fast moving - Bold thinking - Constant growth - Meaningful
  impact - Trust and real ownership - Opportunity to shape the
  future of AI

  Equal Opportunity Statement:

