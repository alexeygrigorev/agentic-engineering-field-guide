description: |
  Clover is reinventing health insurance by working to keep
  people healthier.

  We value diversity in backgrounds and experiences.
  Healthcare is a universal concern, and we need people from
  all backgrounds and walks of life to help build the future
  of healthcare. Clover's engineering team is empathetic,
  caring, and supportive. We are deliberate about the team and
  culture we are building. We seek engineers who are strong in
  their own work and care deeply about supporting each other's
  growth.

  We are looking for a senior software engineer to make
  Counterpart Health's existing customer-facing platform
  agentic. You will build applied AI systems that retrieve
  relevant information, call tools, and help healthcare users
  complete meaningful work. You will work with engineers, data
  scientists, and healthcare professionals, with ownership
  across data pipelines, backend services, model behavior, and
  the user experience.

  As a Senior Software Engineer, you will:

  - Simplify the complexities of healthcare by building systems
    that multiply human efforts.
  - Build and maintain customer-facing agentic AI software, with
    ownership from data ingestion through to the user
    interface.
  - Protect PHI and tenant boundaries across data, prompts,
    retrieval, tools, and outputs in a HIPAA-regulated
    environment.
  - Use customer feedback and failure analysis to improve
    answers and tool execution.
  - Measure and improve quality, reliability, latency, and cost.
  - Master new tools and technologies to solve concrete user
    problems while keeping the system simple enough for the
    team to maintain and operate.
  - Help the team define development practices that support fast
    iteration and quality, including tests and documentation
    of key implementations.
  - Work with Product Managers and operational staff to choose
    useful workflows, define success, and deliver features to
    customers.

  You should get in touch if:

  - You have personally owned a production agentic system used
    by external customers. You can explain your contribution
    across ingestion, ETL, storage, retrieval, the tool-
    calling loop, inference, and UI integration.
  - You have used evaluations to improve a live system. Can
    explain the test data, failure categories, release
    criteria, and limits of automated or LLM-as-judge scoring.
  - You bring senior software engineering experience and can
    write, test, debug, and operate the application code
    behind an AI feature. Python and TypeScript or JavaScript
    experience are useful, as is comparable experience in
    another production language.
  - You have experience with SQL, APIs, data pipelines, and
    cloud services such as GCP or AWS.
  - You have handled practical LLM limitations, such as context-
    window limits, unsupported answers, retrieval failures,
    and incorrect tool calls.
  - Experience with healthcare or another regulated industry is
    a plus. Experience with tools such as LangGraph, Langfuse,
    pgvector, or OpenSearch is useful, but we care more about
    your engineering decisions and production results than a
    particular framework. Using AI coding assistants, building
    demos, or shipping internal tools alone does not meet the
    production AI experience required for this role.

  You will love this job if:

  - You are curious about how systems work and use pragmatic
    engineering to solve complicated problems. You test
    whether an AI approach improves the workflow and use
    simpler software when it is the better choice.
  - You enjoy a collaborative environment where you help define
    priorities and own delivery. You bring clarity to
    ambiguity and change your view when new evidence calls for
    it.
  - You take responsibility for what reaches customers. You
    investigate broken behavior, fix the cause, and improve
    the tests and evaluations that should catch it.
  - You care about what good technology can do for people and
    want to work with healthcare professionals on tools they
    can trust.

  Benefits Overview:

  - Financial Well-Being: Our commitment to attracting and
    retaining top talent begins with a competitive base salary
    and equity opportunities. Additionally, we offer a
    performance-based bonus program and regular compensation
    reviews to recognize and reward exceptional contributions.
  - Physical Well-Being: We prioritize the health and well-being
    of our employees and their families by offering
    comprehensive group medical coverage that include coverage
    for hospitalization, outpatient care, optical services,
    and dental benefits.
  - Mental Well-Being: We understand the importance of mental
    health in fostering productivity and maintaining work-life
    balance. To support this, we offer initiatives such as No-
    Meeting Fridays, company holidays, access to mental health
    resources, and a generous annual leave policy.
    Additionally, we embrace a remote-first culture that
    supports collaboration and flexibility, allowing our team
    members to thrive from any location.
  - Professional Development: We are committed to developing our
    talent professionally. We offer learning programs,
    mentorship, professional development funding, and regular
    performance feedback and reviews.

  Additional Perks:

  - Reimbursement for office setup expenses
  - Flexibility to work from home, enabling collaboration with
    global teams
  - Paid parental leave for all new parents
  - And much more!

  About Counterpart Health: In 2018, Clover Health set out to
  do something unprecedented: build a clinically intuitive,
  AI-enabled solution that fits within physicians' workflows
  to help support the earlier diagnosis and management of
  chronic conditions.

  Years later, that vision is a reality, with thousands of
  practitioners using Counterpart Assistant during patient
  visits to improve disease management, reduce medical
  expenses, and drive success in value-based care.

  With an exceptional team of value-based care and technology
  experts, Counterpart Health is driving value-based care at
  the speed of software.

  Counterpart Health is a subsidiary of Clover Health. From
  Clover’s inception, Diversity & Inclusion have always been
  key to our success. We are an Equal Opportunity Employer and
  our employees are people with different strengths,
  experiences, perspectives, opinions, and backgrounds, who
  share a passion for improving people's lives. Diversity not
  only includes race and gender identity, but also age,
  disability status, veteran status, sexual orientation,
  religion and many other parts of one’s identity. All of our
  employee’s points of view are key to our success, and
  inclusion is everyone's responsibility.

  #LI-REMOTE

  Pursuant to the San Francisco Fair Chance Ordinance, we will
  consider for employment qualified applicants with arrest and
  conviction records. We are an E-Verify company.

  Final pay is based on several factors including but not
  limited to internal equity, market data, and the applicant’s
  education, work experience, certifications, etc.

  A reasonable estimate of the base salary range for this role
  is:

  $169,200—$220,000 USD
