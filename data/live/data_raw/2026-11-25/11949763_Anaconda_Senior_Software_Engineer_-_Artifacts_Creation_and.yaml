description: |
  About AnacondaBe at the center of AI

  Anaconda is built to advance AI with open source at scale,
  giving builders and organizations the confidence to increase
  productivity, and save time, spend and risk associated with
  open source. 95% of the Fortune 500 including Panasonic,
  AmTrust, Booz Allen Hamilton and over 50 million users rely
  on the value The Anaconda AI Platform delivers through a
  centralized approach to sourcing, securing, building, and
  deploying AI. With 21 billion downloads and growing,
  Anaconda has established itself as the gold standard for
  Python, data science, and AI and the enterprise-ready
  solution of choice for AI innovation. Anaconda is backed by
  world-class investors including Insight Partners. Learn more
  at https://www.anaconda.com.

  Summary:

  Our Artifact Creation & Release Engineering team builds,
  secures, and operates the platform that produces and
  releases Anaconda's packages—the foundation of trust and
  compliance for millions of users and thousands of enterprise
  customers. As platforms increasingly serve automation and AI
  agents, the bar for access control, isolation, and
  reliability has never been higher. We're looking for a
  Senior Software Engineer who brings strong Python expertise,
  systems thinking, and an SRE mindset to help us close
  critical gaps in platform infrastructure and security while
  maintaining the velocity our users depend on.

  What You'll Do:

  - Design and build features for our internal package build
    system, balancing technical excellence with practical
    constraints and delivery timelines
  - Review pull requests with rigor and care, coaching teammates
    on architecture, security, and maintainability
  - Write clear design docs and architecture proposals that help
    cross-functional partners understand tradeoffs and make
    informed decisions
  - Take ownership when things break: diagnose root causes,
    implement fixes, and ensure the same issue doesn't happen
    twice
  - Partner with Security, Platform Infrastructure, IT, and
    Product teams to answer build and access questions and
    unblock their work
  - Use AI tooling to eliminate toil and accelerate
    delivery—automating repetitive tasks, generating
    boilerplate, and augmenting your debugging and code review
    workflows
  - Mentor engineers across the team, sharing context on
    platform decisions and helping them grow their systems
    thinking and ownership skills
  - Identify and advocate for technical investments that reduce
    production risk and avoid single points of failure

  Your Impact Will Be Measured Through:

  - Initiatives you own ship on the agreed milestones, with
    clear design documentation and delivery plans
  - Fewer production risks depend on a single person, your work
    distributes knowledge and builds shared ownership
  - Platform security and access control improvements measurably
    reduce risk surface area as AI agents and automation scale
    usage
  - Cross-functional partners report faster resolution of build
    and access blockers, enabling their teams to ship with
    confidence

  What You Need:

  - 5+ years of professional software engineering experience
    with strong Python expertise and deep understanding of
    core engineering fundamentals
  - Demonstrated experience building or maintaining
    infrastructure, platform tooling, or DevOps systems with
    an SRE or operational mindset
  - Proven ability to write technical design documents,
    architecture proposals, and detailed code reviews that
    communicate tradeoffs clearly
  - Experience working independently to diagnose complex system
    issues, propose solutions, and drive them to completion
  - Track record of coaching or mentoring other engineers,
    regardless of their level, through technical decisions and
    growth opportunities
  - Proficiency using AI-powered development tools to accelerate
    workflows, reduce toil, and maintain focus on high-value
    engineering work while preserving strong fundamentals

  What Will Make You Stand Out:

  - You've worked in fast-paced startup or scale-up environments
    where you've had to balance high quality with speed and
    pragmatism
  - Experience in open-source ecosystems, package management
    systems, or build/release engineering workflows
  - Hands-on experience with cloud platforms (AWS, Azure),
    container orchestration (Kubernetes), or GitOps tooling
    (ArgoCD)
  - You're genuinely curious about the 'why' behind every
    request—who benefits, what unlocks, is now the right
    time—and you're comfortable pushing back when the timing
    or tradeoffs don't align
  - You've worked at an AI-focused or data science company and
    understand the unique security and reliability demands of
    platforms serving automated workloads
  - You embody our values: 'Curious by Default', 'Build
    Together', 'Own It', and 'Lead with Guts and Heart', and
    our behaviors: Clarity, Care and Candor
  - You care deeply about fostering an environment where people
    of all backgrounds and experiences can flourish

  Why You'll Like Working Here:

  - You'll thrive in a high-performance environment where
    results are recognized and rewarded
  - Your work directly contributes to shaping the future of data
    science, machine learning, and AI in the enterprise.
  - You'll work alongside a collaborative team that values
    diverse, thoughtful discussion, clarity and candor.
  - You'll be supported by a culture that puts employees first -
    with flexible hours, a fully remote setup, and a genuine
    commitment to your wellbeing and growth.

  The application deadline for this role is 12/28/2026;
  applicants will be reviewed on an ongoing basis until the
  role is filled.

  The base salary range for this role is $150,000 - $184,500 ,
  along with annual bonus potential, equity participation, and
  benefits.

  Our salary ranges are determined by role, level, and
