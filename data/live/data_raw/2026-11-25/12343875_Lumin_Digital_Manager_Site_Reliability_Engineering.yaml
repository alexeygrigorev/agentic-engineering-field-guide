description: |
  Basic Function

  The Site Reliability Engineering (SRE) Manager provides
  leadership and strategic oversight for the SRE function,
  ensuring operational excellence, incident preparedness, and
  system reliability across the organization. This role is
  responsible for capacity management, budget planning, and
  policy adherence, as well as guiding the team through
  critical events and audits. The SRE Manager champions key
  performance metrics such as uptime and SLA compliance, and
  fosters a healthy, high-performing team culture through
  mentorship, alignment with company values, and career
  development. This role reports to the VP of SRE and helps
  align SRE initiatives with organizational priorities.

  Essential Functions and Responsibilities:

  - Provide strategic leadership to the SRE team, ensuring high
    engagement, operational alignment, and execution of
    meaningful, value-driven work.
  - Serve as incident commander during critical and disaster
    recovery events, ensuring coordination, communication, and
    rapid resolution.
  - Oversee policy compliance and audit readiness, ensuring the
    SRE team adheres to internal standards and regulatory
    obligations.
  - Track, analyze, and report SRE performance metrics (e.g.,
    SLAs, uptime, error budgets) to the Senior Leadership Team
    (SLT) for transparency and improvement.
  - Collaborate with the VP of SRE to define and manage the
    annual operating budget, balancing cost efficiency with
    system reliability.
  - Evaluate and prioritize incoming workstreams, ensuring
    projects align with broader organizational goals and drive
    long-term sustainability and innovation.
  - Partner cross-functionally with engineering, security, and
    product teams to ensure the successful delivery of SRE
    initiatives.
  - Champion professional development, promoting team growth
    through mentorship, feedback, and career pathing.
  - Drive a culture of operational excellence, encouraging
    automation, process improvement, and continuous learning
    across the team.
  - Other duties as assigned

  Physical Demands:

  - While performing the duties of this Job, the employee is
    regularly required to sit; use hands to type, handle, or
    feel and talk or hear
  - Specific vision abilities required by this job include close
    vision
  - Ability to occasionally lift/move up to 25 pounds
  - Individuals with a disability who are otherwise able to
    perform the essential functions of the job may request
    reasonable accommodation through the Human Resources
    department.
  - Other physical activities may be required to support
    business operations.

  Supervisory Responsibility:

  - Set clear expectations, offer direction, and ensure
    alignment with organizational goals while fostering a
    supportive environment that encourages collaboration,
    accountability, and growth.
  - Coach, mentor, and provide training opportunities to build
    team members’ skills, promote internal growth, and prepare
    staff for future roles and responsibilities.

  - 5+ years of experience managing a technical team (e.g., SRE,
    DevOps, Infrastructure).
  - Hands-on experience with cloud-based platforms, especially
    Amazon Web Services (AWS).
  - Familiarity with operational toolsets such as Atlassian
    Jira/Confluence, monitoring and incident management
    systems.
  - Experience working with cross-functional teams and aligning
    technology efforts with business outcomes.

  - Manage hiring, onboarding, performance evaluations,
    promotions, compensation, and terminations, ensuring fair
    and consistent application of policies and procedures.
  - Assess team performance regularly, address gaps, and ensure
    duties are completed efficiently and effectively in
    alignment with department and organizational objectives

  Position Specifications

  Education:

  - Bachelor’s degree or higher in Computer Science, or a
    related field, or equivalent combination of education and
    experience required

  Experience:

  - 5+ years managing a technical team (e.g., SRE, DevOps,
    Platform, or Infrastructure), including hiring,
    performance management, and career development.
  - Hands-on experience with cloud platforms, especially Amazon
    Web Services (AWS), and a solid understanding of cloud
    architecture, scalability, and cost management.
  - Experience defining and operating SLIs, SLOs, and error
    budgets, and reporting reliability metrics (uptime, SLA
    compliance) to senior leadership.
  - Experience leading incident response, including serving as
    incident commander, running blameless postmortems, and
    driving corrective actions to completion.
  - Experience with monitoring, observability, and incident
    management tools (e.g., Datadog, Grafana, Prometheus,
    PagerDuty), plus Atlassian Jira and Confluence.
  - Familiarity with infrastructure as code and CI/CD practices
    (e.g., Terraform, CloudFormation, GitHub Actions) and a
    track record of driving automation to reduce toil.
  - Experience with disaster recovery and business continuity
    planning, including testing and documenting recovery
    procedures.
  - Experience supporting audits and compliance requirements
    (e.g., SOC 2, PCI DSS) in a regulated or security-
    conscious environment.
  - Experience managing or contributing to an operating budget
    and capacity planning for cloud infrastructure.
  - Experience partnering with engineering, security, and
    product teams to align reliability work with business
    outcomes.

  Knowledge, Skills, & Abilities:

  - Strong cultural alignment with values such as integrity,
    humility, ownership, and initiative.
  - Exceptional leadership and organizational skills with a
    strong operational mindset.
  - Excellent written and verbal communication, with the ability
    to present to senior leadership.
  - Practical knowledge of SRE/DevOps best practices, including
    automation, error budgeting, and postmortem analysis.
  - Ability to work in a fast-paced, dynamic environment while
    maintaining focus on reliability and continuous
    improvement.

  Travel:

  - Minimal, generally 12 days or less per year, ~2X team get
    togethers a year

