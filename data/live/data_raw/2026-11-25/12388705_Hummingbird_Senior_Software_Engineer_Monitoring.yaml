description: |
  Hummingbird is a remote-first, fully distributed team united
  by the shared mission of helping fight financial crime.
  Since our launch in 2017, we’ve helped major financial
  institutions and tech-savvy trailblazers alike (e.g. Plaid,
  Raymond James, Crypto.com etc.) orchestrate their compliance
  programs through our thoughtfully designed, intuitive, AI
  powered compliance tools. We believe finding and stopping
  financial crime is a problem rooted in code, language and
  design, so we built the product that the heroes doing this
  work deserve.

  We are customer-obsessed, and we love building and shipping
  great products. We set a high bar, challenge our
  assumptions, seek diverse opinions, and support each other
  to do our best work.

  We do our best to write inclusive, descriptive and accurate
  job descriptions, but we’re not always perfect. If you’re
  interested in the role, we’d love to hear from you even if
  you don’t feel like you meet everything we’re looking for.
  We’re always iterating and improving, and it’s possible that
  your experience is even more impactful than we could have
  imagined.





   About the role

  At Hummingbird, we want to build better software to fight
  financial crime. Our engineering team is responsible for
  making that a reality. They dive deep into the problems that
  make financial crime fighting so difficult and design
  flexible, scalable solutions that empower our customers to
  catch bad actors. Our product sits at the intersection of
  financial technology, data science, security, policy, law
  enforcement, and design. As employees at a small startup,
  software engineers at Hummingbird have the opportunity to
  wear many hats and learn and grow across a multitude of
  dimensions.

  In this role, you'll help build the future of Transaction
  Monitoring at Hummingbird. You will improve a live,
  customer-facing risk detection product while helping a small
  team solve challenging data-processing, reliability, and
  scalability problems. Your engineering judgment will
  directly influence how the product evolves.

  What you'll do:

  - Write code to fight financial crime: First and foremost, our
    software engineers use their skills to serve our shared
    mission. You'll build easy-to-use tools that help our
    customers utilize data and leverage automations to
    identify and address suspicious activities.
  - Build highly scalable, reliable monitoring products: You’ll
    play an outsized role in evolving our transaction
    monitoring product, architecting the rule execution,
    enrichment, and data-processing systems that let it scale
    through high data volumes and complex workflows. You’ll
    make it more reliable, faster, and easier to observe, so
    our customers can count on it every day.
  - Tackle the challenges of working in a high-security, high-
    stakes environment: We work with some of the most
    sensitive data you can imagine and provide a critical
    service to our customers. Security, reliability, and
    correctness must always come first.
  - Partner cross functionally with Product and Customer Success
    to solve real customer problems.
  - Own work through design, delivery, and production.

  What we're looking for:

  - You’ve built and run data systems at scale. You’ve designed,
    shipped, and operated large production data-processing
    systems.
  - You make pragmatic architecture decisions. You know when to
    move fast and when to invest in reliability and
    maintainability, and you can explain the tradeoffs.
  - You know the stack. You’re fluent in SQL, comfortable with
    data pipelines, and have hands-on experience with
    distributed systems.
  - You work well with data science and ML. You’ve worked
    closely with data scientists or ML specialists to turn
    models and insights into production systems.
  - You own outcomes end to end. You take work from a fuzzy
    problem to a production system and keep improving it after
    launch.
  - You follow the problem across technologies. You pick up new
    tools, languages, and domains when the work needs them.
  - You build with the customer in mind. You care how compliance
    teams actually use what you build, and that shapes your
    technical decisions.
  - You take quality and security seriously. Testing and secure
    design matter even more when customers rely on your
    systems to catch financial crime.
  - Bonus: Experience with fraud, AML, or transaction
    monitoring.

  Technologies we use and teach:

  - AWS, Azure, PostgreSQL, Redis
  - Terraform, CircleCI, Nix, Docker
  - Ruby/Rails, Python
  - OpenAI
  - React, JavaScript, TypeScript, GraphQL, d3
  - Snowflake
  - OpenSearch

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. We will ensure that individuals with
  disabilities are provided reasonable accommodation to
  participate in the job application or interview process, to
  perform essential job functions, and to receive other
  benefits and privileges of employment. Please don't hesitate
  to contact us to request accommodation.
