description: |
  About the Team

  DotCom builds the web experiences that introduce OpenAI’s
  research and products to the world. We bring together
  engineering, design, content, and production to make complex
  technology clear, useful, and engaging. Our work spans
  OpenAI.com, product storytelling such as the ChatGPT
  overview, and interactive experiences such as OpenAI
  Progress.

  For businesses exploring AI, these experiences help connect
  new capabilities to real needs. We partner with product and
  marketing teams to show what OpenAI’s products can do and
  help people discover how to use them. The work combines
  visual craft with the engineering behind fast, accessible
  experiences that reach a global audience.

  About the Role

  We’re hiring a software engineer to take dedicated ownership
  of B2B web experiences on DotCom. You’ll work directly with
  product teams to understand their capabilities, then partner
  with design and marketing to bring those capabilities and
  stories to life on OpenAI.com through product pages,
  interactive features, and discovery experiences.

  This is a frontend-focused role for an engineer who combines
  strong UI skills with product judgment and can connect the
  interface to the systems behind it. You’ll shape ambiguous
  projects, make thoughtful technical and design tradeoffs,
  and own delivery from the first prototype through launch and
  iteration. We welcome frontend and full-stack backgrounds
  with a strong track record of building for the web.

  This role is based on-site in San Francisco or New York
  City.

  In this role, you will:

  - Build and evolve B2B product pages and interactive web
    experiences that help business audiences understand
    OpenAI’s capabilities and discover relevant products and
    use cases.
  - Partner with product engineers to bring capabilities,
    integrations, and directory-style discovery experiences
    onto OpenAI.com, connecting user-facing interfaces with
    the APIs and data they need.
  - Develop reusable UI components and patterns with designers,
    balancing visual detail, accessibility, responsiveness,
    and maintainability.
  - Use analytics, feature flags, and experiments to understand
    user behavior and improve discovery, engagement, and
    conversion.
  - Improve performance, reliability, and localization support
    so experiences work well across devices, languages, and
    periods of high traffic.
  - Drive projects across product, design, marketing, and
    content partners: clarify goals, question assumptions,
    resolve dependencies, and carry work through launch and
    ongoing improvement.

  You might thrive in this role if you have:

  - 7+ years of frontend and/or full-stack software development
    experience, with an emphasis on building polished web
    products and integrating APIs.
  - Strong frontend fundamentals in JavaScript, CSS, and browser
    behavior, with experience building and evolving reusable
    component systems.
  - Excellent written and verbal communication skills, with the
    ability to work effectively across product, design,
    marketing, and engineering teams.
  - Deep care for quality, functionality, and the people using
    your work, with attention to every detail—from visual
    interactions and accessibility to the last page request.
  - Innate curiosity and strong product judgment: you ask
    critical questions, challenge assumptions, and turn
    complex ideas into clear, useful experiences.
  - Enjoyment of working quickly, with the initiative to
    navigate ambiguity, unblock collaborators, and own
    projects from prototype through launch and iteration.
  - Experience with B2B products, web growth, experimentation,
    or conversion optimization is a plus.
  - Experience with React or Next.js, or with high-traffic,
    localized websites, is helpful; strong web fundamentals
    and the ability to learn matter most.

  About OpenAI

  OpenAI is an AI research and deployment company dedicated to
  ensuring that general-purpose artificial intelligence
  benefits all of humanity. We push the boundaries of the
  capabilities of AI systems and seek to safely deploy them to
  the world through our products. AI is an extremely powerful
  tool that must be created with safety and human needs at its
  core, and to achieve our mission, we must encompass and
  value the many different perspectives, voices, and
  experiences that form the full spectrum of humanity.

