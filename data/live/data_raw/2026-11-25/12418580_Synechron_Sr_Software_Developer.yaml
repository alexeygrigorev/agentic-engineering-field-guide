description: |
  We are:

  At Synechron, we believe in the power of digital to
  transform businesses for the better. Our global consulting
  firm combines creativity and innovative technology to
  deliver industry-leading digital solutions. Synechron’s
  progressive technologies and optimization strategies span
  end-to-end Artificial Intelligence, Consulting, Digital,
  Cloud & DevOps, Data, and Software Engineering, servicing an
  array of noteworthy financial services and technology firms.
  Through research and development initiatives in our FinLabs
  we develop solutions for modernization, from Artificial
  Intelligence and Blockchain to Data Science models, Digital
  Underwriting, mobile-first applications and more. Over the
  last 20+ years, our company has been honored with multiple
  employer awards, recognizing our commitment to our talented
  teams. With top clients to boast about, Synechron has a
  global workforce of 14,500+, and has 58 offices in 21
  countries within key global markets.



  Our Challenge



  Sr. Software Developer (full-time; five openings)



  Synechron, Inc. is in need of Sr. Software Developer(s) in
  New York, NY and various unanticipated locations throughout
  the U.S. to coordinate the design, development, testing, and
  implementation of computer applications to gather and
  analyze client requirements.



  Additional Information*

  The base salary for this position will vary based on
  geography and other factors. In accordance with law, the
  base salary for this role if filled within New York,
  NY/Jersey City, NJ is $193,461.00 to $193,461.00/year &
  benefits (see below).



  This position qualifies under our incentive-based employee
  referral program.



  For full job description, including salary and benefits, and
  to apply, please visit: https://www.synechron.com/careers
  and search JD Keyword.





  Responsibilities



  - Coordinate the design, development, testing, and
    implementation of computer applications to gather and
    analyze client requirements.
  - Convert high-level designs and requirements to technical
    specifications.
  - Involved in the solution architecture design for
    applications to demonstrate the overall structure of the
    application along with the use case.
  - Design and develop reusable and scalable enterprise
    application assets such as processes, decision rules, and
    workflows.
  - Lead integration testing, system testing, troubleshooting,
    and support to deliver products with high quality and
    scalability.
  - Conduct design review sessions to ensure the application
    meets required specifications.
  - Perform unit testing of software applications.
  - Perform root cause analysis of issues discovered during the
    testing phase.
  - Conduct codes walkthrough sessions and problem analysis for
    the identified issues.
  - Debug and fix defects raised by the testing team.
  - Involved in preparation of production deployment plan for
    developed applications.



  Requirements



  - Must have a Master’s Degree (or foreign equivalent) in
    Computer Science, Engineering (any), Mathematics, or
    related field, plus two (2) years of IT experience as a
    Sr. Software Developer, Software Engineer, Test Lead or
    related occupation. The two (2) years of IT experience
    must include experience using Java, Web Services, Spring,
    Hibernate, JavaScript, and PL/SQL.
  - In the alternative, we will accept a Bachelor’s Degree (or
    foreign equivalent) in Computer Science, Engineering
    (any), Mathematics, or related field, plus five (5) years
    of progressive post-baccalaureate IT experience. Two (2)
    years of the five (5) years of progressive post
    baccalaureate IT experience must include experience using
    Java, Web Services, Spring, Hibernate, JavaScript, and
    PL/SQL.
  - All experience may be acquired concurrently.
  - Domestic travel not to exceed 20% of time and relocation is
    required. International travel not required. Travel is
    limited to Synechron and/or client facilities based on
    project needs. Incidental telecommuting permitted.





   We offer:

  - A highly competitive compensation and benefits package.
  - A multinational organization with 60 offices in 20 countries
    and the possibility to work abroad.
  - 10 days of paid annual leave (plus sick leave and national
    holidays).
  - Maternity & paternity leave plans.
  - A comprehensive insurance plan including medical, dental,
    vision, life insurance, and long-/short-term disability
    (plans vary by region).
  - Retirement savings plans.
  - A higher education certification policy.
  - Commuter benefits (varies by region).
  - Extensive training opportunities, focused on skills,
    substantive knowledge, and personal development.
  - On-demand Udemy for Business for all Synechron employees
    with free access to more than 5000 curated courses.
  - Coaching opportunities with experienced colleagues from our
    Financial Innovation Labs (FinLabs) and Center of
    Excellences (CoE) groups.
  - Cutting edge projects at the world’s leading tier-one banks,
    financial institutions and insurance firms.
  - A flat and approachable organization.

