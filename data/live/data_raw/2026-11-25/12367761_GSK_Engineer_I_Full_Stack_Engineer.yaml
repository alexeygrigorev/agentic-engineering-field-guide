description: |
  About the role

  GSK’s Enterprise AI team builds artificial intelligence (AI)
  products that combine advanced modelling with applications
  people can use in their day-to-day work.

  As a Full Stack Engineer, you will help build AI products
  from end to end. You will work across data, machine learning
  models, application programming interfaces (APIs), platforms
  and user-facing applications.

  You will use AI coding and research assistants as part of
  your everyday engineering workflow. These tools will support
  development, testing and evaluation, while you remain
  responsible for reviewing their output and ensuring what we
  build meets our engineering standards.

  Working with guidance from senior engineers, you will build
  and ship production AI features, operate what you create and
  develop towards greater independent ownership.

  Key responsibilities

  In this role, you will:

  - Build and ship AI features across data, modelling, backend
    services and user-facing applications.
  - Run modelling and analysis workflows, including preparing
    data, developing models, evaluating results and
    translating findings into product improvements.
  - Use AI coding and research assistants to support
    development, experimentation and testing, while reviewing
    their output for quality and accuracy.
  - Build and maintain RESTful APIs with clear contracts,
    authentication, versioning and effective error handling.
  - Integrate large language models (LLMs) into production
    applications, including context management, retrieval
    augmentation, streaming and tool use.
  - Connect AI applications to relevant data sources and GSK’s
    governed context layer.
  - Build accessible, intuitive interfaces based on user needs
    and feedback.
  - Monitor production AI features for performance, reliability,
    latency, errors and usage.
  - Support incident response and improvements to services you
    have helped develop.
  - Write clean, testable and maintainable code and contribute
    constructively to code reviews.
  - Develop reusable tools, libraries, templates and components
    that improve engineering efficiency.
  - Communicate clearly with technical and non-technical
    stakeholders about the capabilities and limitations of AI
    solutions.

  Basic qualifications

  We are looking for professionals with these required skills
  to achieve our goals:

  - Bachelor’s degree in Computer Science, Data Science,
    Statistics, Applied Mathematics or a related discipline,
    or equivalent practical experience.
  - Experience combining applied machine learning, data science
    and software engineering, with evidence of delivering
    production work or strong experience in a closely related
    field.
  - Strong Python programming skills and experience with
    relevant data or machine learning libraries, such as
    pandas, scikit-learn or PyTorch.
  - Experience with a modern web development stack, such as
    React or Next.js, alongside FastAPI or Node.js.
  - Hands-on experience designing, developing and evaluating
    models or analytical workflows in a product or research
    environment.
  - Experience integrating LLMs into applications, including
    context management, retrieval augmentation, tool use or
    evaluation.
  - Experience building and deploying APIs, including
    authentication and error handling.
  - Experience using AI coding assistants as part of a regular
    software development workflow.

  Preferred qualifications

  If you have the following characteristics, it would be a
  plus:

  - Experience delivering a substantial AI feature that combines
    modelling with a user-facing application.
  - Experience building or extending agents that automate
    research, modelling or engineering workflows.
  - Experience with AI evaluation methods, prompt iteration
    frameworks or LLM observability.
  - Experience monitoring and operating AI-powered applications
    in production.
  - Experience developing reusable engineering tools, libraries
    or shared components.
  - Experience working in a fast-moving environment where
    priorities and requirements can evolve.
  - Experience working in a regulated or high-stakes
    environment, such as life sciences.



  Why join us?

  This is an opportunity to help define how modern data
  engineering operates in an AI-enabled organisation.

  You will work on some of the foundational capabilities that
  allow AI systems to access and use data with the appropriate
  context, quality, permissions and governance. You will have
  the opportunity to influence engineering standards, shape
  the adoption of AI-enabled development practices and build
  capabilities that can be reused across GSK.

  At GSK, we unite science, technology and talent to get ahead
  of disease together. #AGTech #hybrid



  Closing date for applications: 2nd December 2026

  Skills

  AI Frameworks, Computer Programming, Deep Learning, Google
  Cloud Platform (GCP) for Machine Learning, Machine Learning
  Algorithms, Microsoft Azure Data and AI, ML Frameworks,
  Model Evaluation, Model Training, Model Validation

  Why GSK?

  Uniting science, technology and talent to get ahead of
  disease together.

  GSK is a global biopharma company with a purpose to unite
  science, technology and talent to get ahead of disease
  together. We aim to positively impact the health of 2.5
  billion people by the end of the decade, as a successful,
  growing company where people can thrive. We get ahead of
  disease by preventing and treating it with innovation in
  specialty medicines and vaccines. We focus on four
  therapeutic areas: respiratory, immunology and inflammation;
  oncology; HIV; and infectious diseases – to impact health at
  scale.

  People and patients around the world count on the medicines
  and vaccines we make, so we’re committed to creating an
  environment where our people can thrive and focus on what
  matters most. Our culture of being ambitious for patients,
  accountable for impact and doing the right thing is the
  foundation for how, together, we deliver for patients,
  shareholders and our people.

