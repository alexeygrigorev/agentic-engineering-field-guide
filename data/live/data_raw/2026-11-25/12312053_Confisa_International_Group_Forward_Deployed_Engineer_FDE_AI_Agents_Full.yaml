description: |
  Job Description

  Forward Deployed Engineer (FDE) | AI Agents & Full Stack |
  Atlanta / Minneapolis

  Locations:

  - Atlanta, Georgia
  - Minneapolis, Minnesota

  Work arrangement: Hybrid.

  The client is specifically looking for candidates currently
  based in either location. Relocation candidates should not
  be prioritized.

  Key Responsibilities

  - AI Implementation: Deploy and fine-tune applied AI
    workflows, including LLM integrations, retrieval-augmented
    generation (RAG) pipelines, and vector databases within
    customer firewalls.
  - On-Site Integration: Embed directly with client engineering
    and business teams to build custom integrations, data
    pipelines, and scalable APIs.
  - Production Deployment: Own the technical implementation
    lifecycle from initial scoping to shipping production-
    ready systems.
  - Feedback Loop: Synthesize field insights and customer pain
    points to help core engineering teams improve the base
    product.
  - Backend Development: Architect high-volume, low-latency
    applications utilizing Java, Spring Boot, and robust
    microservices architectures.
  - Frontend Development: Build responsive, modern single-page
    web applications (SPAs) using React, Angular, or
    TypeScript/JavaScript.
  - Database Management: Optimize database operations using
    relational systems (PostgreSQL, MySQL, Oracle) and Object-
    Relational Mapping tools (Hibernate/JPA).
  - Testing & CI/CD: Write unit and integration tests (JUnit,
    Mockito) and support continuous integration and deployment
    initiatives.

  Technical Requirements

  - Backend: Java 17+, Spring Framework (Boot, MVC, Security,
    Data), and REST/JSON APIs.
  - Frontend: JavaScript/TypeScript, HTML5, CSS3, Angular 10+.
  - Infrastructure: Maven/Gradle, AWS CDK/CFT, Git/GitHub, and
    basic familiarity with containerization (Docker,
    Kubernetes).
  - Data & Distributed Systems: Mastery of SQL, schema design,
    query optimization, and RESTful API architectures.
  - Cloud & DevOps: Hands-on experience with cloud platforms -
    AWS alongside Kubernetes, and modern CI/CD pipelines.
  - Soft Skills: Strong stakeholder management, ability to
    explain complex technical concepts to non-technical
    business leaders.

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
