title: "Manager, Windows & VDI End Point Engineering & Support"
company: Pfizer
location: New York, USA
work_type: FULL_TIME
company_size: 121,990 Employees
description: |
  ROLE SUMMARY The Manager, Windows & VDI End Point
  Engineering & Support supports the organization's global
  Windows and Virtual Desktop Infrastructure (VDI) endpoint
  platforms. This role ensures secure, reliable, and high-
  performing end-user computing experiences, drives execution
  of endpoint modernization initiatives, and provides day-to-
  day technical and people leadership across large-scale
  deployment, patching, and platform operations. ROLE
  RESPONSIBILITIES

  - Oversee the design, deployment, and support of Windows OS
    images, application packaging, patch management, and VDI
    solutions.
  - Execute endpoint modernization initiatives, including
    operating system servicing and endpoint management
    modernization.
  - Enforce standards, policies, and best practices for endpoint
    management, security, and user experience.
  - Collaborate with cybersecurity, infrastructure, and
    application teams to ensure secure and seamless
    integration of endpoint technologies.
  - Manage vendor and managed-service deliverables and service
    level agreements supporting Windows and VDI platforms.
  - Monitor performance metrics, analyze trends, and implement
    continuous improvement initiatives.
  - Lead incident response and problem management for endpoint-
    related issues, ensuring timely resolution and
    communication.
  - Develop engineering talent and coordinate work with global
    hub teams, including knowledge transfer from senior
    subject matter experts.

  BASIC QUALIFICATIONS

  - Applicant must have a bachelor's degree with at least 4
    years ofexperience; OR a master's degree with at least 2
    years of experience; OR a PhD with 0+ years of experience;
    OR as associate's degree with 8 years of experience; OR a
    high school diploma (or equivalent) and 10 years of
    relevant experience
  - 5+ years of progressive experience in IT infrastructure
  - Deep expertise in Windows OS, VDI technologies (e.g., Amazon
    Web Services, Windows 365), and endpoint management tools
    (e.g., Microsoft Configuration Manager (SCCM), Microsoft
    Intune).
  - Proven track record delivering endpoint projects in a
    complex, global environment.
  - Strong knowledge of cybersecurity principles, compliance
    requirements, and risk management for endpoint devices.
  - Excellent leadership, communication, and stakeholder
    management skills.

  PREFERRED QUALIFICATIONS

  - Relevant certifications (e.g., Microsoft Certified: Modern
    Desktop / Endpoint Administrator, Citrix certifications).
  - Experience in the pharmaceutical or highly regulated
    industry.
  - Familiarity with cloud-based endpoint solutions and Zero
    Trust security models.
  - Experience managing hybrid and remote workforce endpoint
    strategies.

  Standard work schedule, must follow Login For Your Day 10%
  regional or international travel Will require meetings with
  individuals and teams in other time-zones and with global
  responsibility roles. PHYSICAL/MENTAL REQUIREMENTS

  - Ability to analyze complex technical problems and develop
    innovative solutions.
  - Occasional travel may be required to support global teams
    and initiatives.

  NON-STANDARD WORK SCHEDULE, TRAVEL OR ENVIRONMENT
  REQUIREMENTS

  - Flexibility to work outside standard hours to support global
    operations and critical incidents.
  - Occasional travel to company sites or vendor locations as
    needed.

  Work Location Assignment: Must be able to work from assigned
  Pfizer office 2-3 days per week, or as needed by the
  business Last day to apply: December 3rd 2026 The annual
  base salary for this position ranges from $99,200.00 to
  $165,400.00. In addition, this position is eligible for
  participation in Pfizer's Global Performance Plan with a
  bonus target of 12.5% of the base salary and eligibility to
  participate in our share based long term incentive program.
  We offer comprehensive and generous benefits and programs to
  help our colleagues lead healthy lives and to support each
  of life's moments. Benefits offered include a 401(k) plan
  with Pfizer Matching Contributions and an additional Pfizer
  Retirement Savings Contribution, paid vacation, holiday and
  personal days, paid caregiver/parental and medical leave,
  and health benefits to include medical, prescription drug,
  dental and vision coverage. Learn more at Pfizer Candidate
  Site - U.S. Benefits | (uscandidates.mypfizerbenefits.com).
  Pfizer compensation structures and benefit packages are
  aligned based on the location of hire. The United States
  salary range provided does not apply to Tampa, FL or any
  location outside of the United States. Relocation assistance
  may be available based on business needs and/or eligibility.
