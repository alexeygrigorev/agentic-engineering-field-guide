description: |
  SUMMARY

  Support the design, development, and enhancement of a large-
  scale, Salesforce-based federal case management system. Work
  within an Agile team to build, test, and maintain platform
  functionality supporting a high-volume, mission-critical
  application; plan scalable, high-performance web system
  structures and select appropriate frameworks, cloud
  services, and APIs. Enforce coding guidelines, conduct code
  reviews, and set up testing frameworks for clean,
  maintainable code.

  ESSENTIAL DUTIES & RESPONSIBILITIES

  · Design, develop, and maintain custom Salesforce solutions,
  including Apex classes, triggers, Lightning Web Components,
  and Flows.

  · Enhance and maintain the existing Salesforce platform to
  support millions of unique user accounts and high-volume
  concurrent usage.

  · Configure and customize Salesforce objects, workflows,
  validation rules, and page layouts to meet evolving business
  requirements.

  · Integrate Salesforce with external systems and third-party
  applications, including APIs and middleware.

  · Participate in code reviews, unit testing, and deployment
  activities using CI/CD pipelines.

  · Troubleshoot and resolve defects identified during testing
  and production operations.

  · Collaborate with business analysts, system engineers, and
  QA/test teams to translate requirements into technical
  solutions.

  · Support release management and change control processes
  for platform updates.

  · Write complex or critical code, solve performance
  bottlenecks, and optimize database queries while identifying
  risks, redundancies, and outdated infrastructure, and
  planning updates and system security audits.

  · Maintain code, scripts, and configuration files in source
  control (GitHub Enterprise) per agency and industry
  standards, with traceability back to the originating Jira
  work item.

  · Support data models and dashboards and coordinate with
  technical personnel to resolve reporting and data issues.

  · Translate business and product requirements into clear
  technical specifications for the team.

  · Coordinate with product managers, designers, and QA
  engineers to align development with business objectives.

  · Responsible for conducting internal peer reviews and
  process audits prior to submissions.

  · Document business requirements, processes, procedures,
  meeting notes, and newly discovered requirements in
  Confluence, keeping the team's knowledge repository current
  and preventing knowledge silos.

  · Work in an Agile Scrum execution team to ensure all
  contract deliverables, program milestones, and reporting
  requirements are met in support of program objectives.

  · Maintain regular and punctual attendance.

  · Perform other duties as assigned.

  SUPERVISORY RESPONSIBILITIES

  None.

  Requirements

  MINIMUM QUALIFICATIONS

  · Must be able to meet and maintain eligibility requirements
  for a Public Trust position in accordance with Department of
  Commerce and OPM requirements. U.S. work authorization is
  required.

  · Bachelor’s degree in Computer Science, Software
  Engineering, Information Systems, or a related
  field.Master's preferred.

  · Four (4) or more years of software-development experience
  across frontend and backend technologies.

  · Proven hands-on experience developing and configuring
  Salesforce applications (Apex, Visualforce, Lightning/LWC,
  SOQL).

  · Demonstrated expertise in designing overall web systems
  and choosing frameworks (like React, Vue, or Node.js).

  · Demonstrated knowledge of Agile / Scrum practices in a
  Government CI/CD environment.

  · Experience producing SOPs and technical documentation.

  · Must obtain and maintain any necessary security access
  and/or background checks.

  DESIRED QUALIFICATIONS & SKILLS

  · Excellent written and verbal communication skills.

  · Strong problem-solving skills and ability to work in a
  fast-paced, high-availability production environment.

  · Experience modernizing legacy applications for cloud
  environments (AWS or Azure).

  · Experience with secure coding practices and automated
  security scanning in a CI/CD pipeline.

  · Experience with enterprise monitoring and incident
  response in a federal or regulated environment aligned to
  NIST standards.

  · Familiarity with the Department of Commerce, U.S. Census
  Bureau, or comparable federal financial, budget, or
  statistical-agency systems.

  · Salesforce certification(s) (e.g., Platform Developer
  I/II, Administrator) preferred.

  · Experience with Salesforce DevOps/release tools (e.g.,
  Copado) a plus.

  WORK SCHEDULE

  Full-time. May be required to work additional hours as
  needed to complete assignment or project.

  TRAVEL

  The expected travel time is less than 15%.

  DRIVING REQUIREMENTS

  Must have or be able to attain a valid state driver’s
  license and be insurable on the company’s automobile
  insurance policy. Driving, with or without accommodation,
  may be required when traveling for training and/or short
  occasional amounts of local driving. The expected driving
  time is less than 15%.

  WORK ENVIRONMENT

  Work is expected to be remote; however, the company reserves
  the right to require onsite work.

  PHYSICAL DEMANDS

  Position consists of sitting for long periods of time,
  bending, stooping, crouching, and lifting weights up to 20
  pounds. Frequently uses hands/fingers for manipulation of
  keyboard and mouse. It is Katmai's business philosophy and
  practice to provide reasonable accommodations, according to
  applicable state and federal laws, to all qualified
  individuals with physical or mental disabilities.

  Benefits

  Compensation & Benefits:

  - Pay: $90,000 - $100,000 annually
  - Eligible Benefits: Medical, Dental, Vision, Life & AD&D
    Insurance, Long-Term & Short-Term Disability Insurance,
    401(k) Savings Plan, Employee Assistance Program (EAP),
    Vacation & Paid Personal Time, 11 Paid Federal Holidays,
    and Leave of Absence.

  Compliance:

  To be considered for this position, all applicants must
  apply on the company website,
  https://apply.workable.com/katmai/

   We are a VEVRAA Federal Contractor.

   We are an equal opportunity employer, and all qualified
  applicants will receive consideration for employment without
  regard to age, race, color, religion, sex, sexual
  orientation, gender identity or national origin, disability
  status, protected veteran status, marital status, familial
  status or any other characteristic protected by law.

  Preference will be given to Ouzinkie Shareholders,
  Descendants of Shareholders and Spouses of Shareholders in
  accordance with Title 43 U.S. Code 1626(g) and Title 42 U.S.
  Code 2000e - 2(i).
