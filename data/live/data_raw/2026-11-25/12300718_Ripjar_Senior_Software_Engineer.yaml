description: |
  Ripjar specialises in the development of software and data
  products that help governments and organisations combat
  serious financial crime. Our technology is used to identify
  criminal activity such as money laundering and terrorist
  financing, and enables organisations to enforce sanctions at
  scale to help combat rogue entities and state actors.

  Team mission:

  Our engineering team builds software that makes the world a
  safer place. We work collectively to use technology,
  creativity and engineering best practice to solve problems
  that nobody else can.

  What you’ll be doing:

  You’ll join a diverse team of talented engineers building
  Labyrinth Screening: a sophisticated AI-powered solution at
  the forefront of the fight against financial crime. You’ll
  contribute to our customers’ success by designing,
  developing and shipping features to prevent money
  laundering, fraud and terrorist financing.

  Some of the key technology challenges facing the team this
  year include:

  - Developing our scalable, multi-tenant, cloud-based SaaS-
    first architecture.
  - Upgrading our DevOps tooling to ship code fast with
    certainty.
  - Automating end user and system actions with our Labyrinth
    RPA Workflow Engine.
  - Harnessing the power of Labyrinth Screening to work with
    arbitrary data at any scale within wider financial crime,
    cyber crime and national security solutions.

  Key tasks:

  - Develop innovative software with a global impact. You’ll
    work across the software development lifecycle to build
    and deliver technology in a cross-functional agile team.
  - Collaborate with engineers, product managers, architects, UX
    and QA specialists as part of the wider Ripjar engineering
    team.
  - Work with our Delivery team to provide deep support
    expertise for our growing customer base.
  - Proactively improve how we build and ship software. You
    won’t wait for process to be handed down. You’ll spot
    friction across our SDLC, in planning, code review,
    testing, CI/CD, release and support, then propose
    practical improvements and help the team adopt them. As we
    grow from start-up to scale-up, you’ll help shape
    lightweight ways of working that scale without slowing us
    down.
  - Help accelerate our AI adoption. You’ll bring curiosity to
    AI tools and techniques, running small, well-scoped
    experiments with things like coding assistants, agents,
    automated test generation and review support to find what
    adds real value. You’ll share what works and what doesn’t,
    help turn successful trials into team practice, and do it
    responsibly, with care for the security and sensitivity of
    the data our customers trust us with.

  Requirements

  The successful candidate should have these skills:

  We recognise that demonstrable skills in all these
  technologies is not easy to find. Don’t let that stop you
  from applying! We can work in partnership to identify your
  strengths and provide you with the training necessary to
  fill any gaps.

  - You will ideally worked have with some of our core
    technologies: Node.js, React, Elasticsearch, Kafka,
    MongoDB, Redis. You’ll be proficient in at least one
    programming language and be used to evaluating new
    technologies
  - Building and maintaining production software. It’s great if
    you’ve worked with large scale data processing systems.
  - You will be technically proficient with each stage of the
    software development lifecycle. Your strengths will
    include designing and developing high quality software,
    finding and fixing bugs and providing maintenance for
    production systems.
  - Strong communication skills. You’ll be able to explain
    complex concepts, write clear and concise code reviews,
    pull requests and documentation.
  - An improvement-minded approach. You’ve noticed
    inefficiencies in how a team works and taken the
    initiative to fix them, whether that meant tightening a CI
    pipeline, improving test strategy or simplifying a release
    process.

  Benefits

  Why we think you’ll enjoy it here:

  - Competitive base salary DOE
  - Fully remote working
  - 25 days annual leave + your birthday off and Christmas
    shutdown, rising to 30 days after 5 years of service
  - 35 hour working week
  - Flexible working hours
  - Life assurance
  - Private Family Healthcare
  - Employee Assistance Programme
  - Company contributions to your pension
  - Enhanced maternity/paternity pay
  - The latest tech including a top of the range MacBook Pro
  - Office equipped with well-stocked pantries with food, snacks
    and drinks when in the office
