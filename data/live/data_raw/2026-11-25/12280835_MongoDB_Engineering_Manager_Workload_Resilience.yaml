description: |
  Come join and lead the Workload Resilience Team! The
  Workload Resilience team is focused on improving the
  availability of MongoDB through solutions in the data plane.
  We build out the core server workload management
  infrastructure so that MongoDB can properly queue, load
  shed, and prioritize operations to stabilize performance
  during situations where system resources are beginning to
  become constrained. Workload Resilience is the team behind
  the recent release of Intelligent Workload Management, a new
  product feature that introduces dynamic rate limiting and
  operation prioritizations when the database is overloaded.

  Our team champions a strong culture of inclusivity,
  diversity, and collaboration, and lives MongoDB cultural
  values every day – we value intellectual curiosity and
  honesty, building together in an environment that
  prioritizes collaboration over competition, and working
  urgently to deliver value to our customers each and every
  day. If you want to lead a fast-moving team that applies
  distributed systems, operating systems, operational
  excellence, performance tuning, and queueing theory to
  maximize the resilience of MongoDB at scale, join us!

  This role is based in North America.

  Candidate Profile

  - 3+ years of experience managing a team of software
    engineers, including hiring, performance and growth
    management, compensation planning, and mentoring.
  - You have 8+ years of experience building and operating
    mission-critical low-level and high performance
    distributed systems
  - You have experience owning the operations of a projection
    service
  - You have strong technical judgment that you use to
    effectively guide engineering decisions that balance
    tradeoffs in performance, availability, and customer
    experience
  - You have delivered complex, cross-functional projects to
    customers that required coordination across many teams,
    under tight timelines
  - You enjoy coaching, career development, and creating growth
    opportunities to help your team reach their full potential
  - You have experience building a diverse, inclusive team where
    engineers can do their best work, operating greater than
    the sum of its parts

  Position Expectations

  - Lead a team of engineers, managing all aspects of people
    management including hiring, growth, compensation, and
    performance management.
  - Be directly responsible for the results your team delivers
  - Lead the design, implementation, and operation of:
  - Own the definition and execution of the team's 12-month
    roadmap for the Intelligent Workload Management (IWM)
    tuning platform, the Server features at the core of IWM,
    and the availability testing systems
  - Work with Product Management, Program Management, and
    Engineering leadership to specify, prioritize, and deliver
    new features
  - Handle (or lead the effort to handle) time-sensitive
    availability incidents and customer escalations
  - Estimate task complexity, communicate delivery timelines,
    and manage risks for projects executed by the team
  - Ensure the team is running smoothly by eliminating technical
    barriers, coordinating cross-team dependencies, and
    focusing on the overall health and happiness of the team
  - Contribute to planning for organizational growth, including
    allocation of engineering resources, future hiring plans,
    and assignment of projects

  Success Measures

  - In the first month: Understand the high-level architecture
    of the Intelligent Workload Management (IWM) system, how
    the key components of the Atlas Data Plane fit together,
    MongoDB's availability testing framework, the team's
    current projects, and the required day-to-day processes.
    Begin developing relationships with key stakeholders
    across the company
  - In three months: Take over full management of the team and
    begin building trust with your reports. Assume
    responsibility for day-to-day team operations. Be involved
    in reviewing designs for new features and helping the team
    navigate technical challenges. Hire engineers for the team
    as needed
  - In six months: Establish yourself as a leader in the
    organization such that team members naturally come to you
    for guidance. Take over full ownership of the team's
    software components. Manage the planning and execution of
    major features supporting the team’s major annual goals
  - In twelve months: Perform a full annual cycle of performance
    and growth conversations with your team members.
    Contribute to the long-term vision for the IWM stack and
    develop a plan to achieve that vision. Increase the
    capability and velocity of the team in measurable ways

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  AI-native startups and approximately 75% of the Fortune 100,
  relying on MongoDB for their most important applications,
  we’re powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

