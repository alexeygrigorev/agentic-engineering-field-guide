description: |
  CreateFuture is an AI-native consulting partner where people
  do work that matters and are supported to do it well. We
  work side by side with our clients, challenging what's not
  working and helping them to build the future.

  We work alongside organisations such as PayPal, adidas,
  NatWest, FanDuel, and Money Saving Expert, building digital
  products and services that make a difference while always
  putting people first. Our commitment to craft, quality, and
  culture has helped us scale to over 600 people in just a few
  years.

  About the role and team:

  Our .Net engineering capability builds backend services and
  APIs for clients across sectors, from payment integrations
  to large-scale platform migrations, always working as part
  of cross-functional scrum teams alongside testers, product
  owners and designers. As a Senior .Net Engineer, you'll take
  ownership of complex backend components end-to-end,
  operating with greater autonomy while mentoring less
  experienced colleagues. You'll be a trusted technical voice
  within your project team, helping to shape how the team
  builds, tests and ships software.

  What you'll be doing:

  - Designing and building backend services and APIs in C# and
    .NET/.NET Core, taking ownership of technical decisions
    within your area with minimal supervision
  - Integrating with third-party APIs and systems, such as
    payment gateways, and designing resilient, well-documented
    interfaces for other developers to consume
  - Mentoring and supporting less experienced engineers through
    code review, pairing and technical guidance, helping them
    grow their skills
  - Championing engineering best practice, clean code, and
    thorough unit and integration testing across your project
    team
  - Working as a senior member of a cross-functional scrum team,
    contributing to technical decisions, estimation and
    planning
  - Identifying opportunities to improve the scalability,
    maintainability and long-term robustness of the codebase,
    and proposing solutions to the team

  We'd love to talk to you if you:

  - Have strong, proven experience building APIs using C# and
    .NET/.NET Core, including ORM and dependency injection
    experience with relational or NoSQL data stores such as
    SQL Server, PostgreSQL or Cosmos DB, at a senior level
  - Have a track record of mentoring or supporting less
    experienced engineers, through code review, pairing or
    technical coaching
  - Have deep experience with engineering best practice, clean
    code and a strong testing culture, including unit and
    integration testing
  - Have experience working as part of a cross-functional
    development team using Agile practices; experience with
    other languages and frameworks such as JavaScript/Node.js,
    Java/Spring, TypeScript, Scala, Kotlin or Python is a plus
  - Have cloud experience using AWS or Azure (Azure is
    especially common on .NET stacks) — the specific provider
    matters less than solid cloud fundamentals; experience
    with infrastructure-as-code tooling such as Terraform,
    Bicep or ARM Templates is a plus, and we're happy to help
    you broaden your platform knowledge

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
