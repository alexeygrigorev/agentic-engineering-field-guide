description: |
  SentiLink helps institutions and protects customers by
  accurately resolving identities and flagging fraud risk.
  Each day, we verify more than 3 million identities, flagging
  150k+ fraud attempts in the process. The problems we work on
  are challenging, and solving them takes deep domain
  expertise, rigorous analysis, and a willingness to dig into
  the details.

  At SentiLink, you'll work alongside smart, highly
  collaborative colleagues who respect each other's time and
  judgment, take ownership, and follow through on their
  commitments. Together, we do truly meaningful work
  protecting the identities of innocent consumers and flagging
  the fraudsters attempting to exploit them.

  We're well capitalized and growing quickly. We already serve
  13 of the top 15 U.S. banks, we're expanding into new
  markets, and we're backed by Craft Ventures, Andreessen
  Horowitz, NYCA, and Max Levchin. We've been named to the
  Forbes Fintech 50 and as a 2026 FICO Industry Vanguard
  Decision Award Winner. We were also the first company to go
  live with the electronic Consent Based Social Security
  Number Verification (eCBSV) service, and we've testified
  before the U.S. Congress on the future of identity.

  We want SentiLink to be the best place you've ever worked.
  We offer generous benefits and support a range of working
  arrangements, from fully remote to in-office. We are a
  digital-first company with strong collaboration across the
  U.S. and India, and we meet in person regularly to build
  relationships. We have offices in Austin, San Francisco, New
  York City, Seattle (Bellevue), Los Angeles, and Chicago in
  the U.S., and in Gurugram (Delhi) and Bengaluru in India.

  Role:

  The Engineering team builds the systems and products that
  power SentiLink’s fraud detection capabilities. For this
  role, you’ll work closely with the NOVA squad across
  Product, Engineering, Data Science, Fraud Intelligence, and
  Sales to bring mobile device intelligence into SentiLink’s
  products and deepen our understanding of the mobile device
  landscape.

  We’re looking for a Senior Mobile Software Engineer with
  deep systems-level expertise across both iOS and Android.
  You will own the technical approach and implementation of
  mobile SDKs for device fingerprinting, starting with
  bringing mobile device fingerprinting in-house for NOVA.
  Success in this role means independently navigating
  ambiguous technical problems, understanding how mobile
  platforms behave below the application layer, and building
  reliable mobile capabilities that strengthen our fraud
  detection models. Over time, your work may also help enable
  a mobile-optimized experience for SentiLink’s dashboard.

  This is a remote, US-based role.

  Responsibilities:

  - Own the design and implementation of SentiLink’s mobile SDKs
    for device fingerprinting across native iOS and Android.
  - Develop a deep technical understanding of device behavior
    and the signals available across both mobile platforms,
    including networking and other system-level capabilities.
  - Evaluate approaches to mobile device fingerprinting and make
    technical decisions that balance signal quality, platform
    constraints, and maintainability.
  - Partner with Product and Engineering to define and deliver
    mobile capabilities for NOVA.
  - Collaborate with Data Science to make mobile device signals
    available for fraud detection models and support effective
    use of those signals.
  - Investigate ambiguous mobile engineering problems
    independently, using rigorous analysis and experimentation
    to determine the right technical approach.
  - Contribute mobile expertise and technical direction as
    SentiLink evaluates longer-term opportunities for mobile
    experiences.

  Requirements:

  - 5+ years of professional software engineering experience,
    with extensive experience developing for both native iOS
    and native Android.
  - Deep systems-level understanding of both iOS and Android,
    including areas such as networking, device APIs, operating
    system behavior, and platform internals.
  - Proficiency with using an AI tool such as Claude Code,
    ChatGPT/Codex, Cursor or another similar tool
  - Demonstrated ability to build technically complex mobile
    software with an emphasis on systems-level engineering
    rather than primarily user interface development.
  - Strong ability to independently explore and solve ambiguous
    technical problems with a high degree of ownership and
    autonomy.
  - Excellent analytical, problem-solving, communication, and
    interpersonal skills.
  - Deep understanding of device fingerprinting approaches and
    mechanisms preferred.
  - Experience partnering with data scientists to provide
    signals or capabilities used in machine learning models
    preferred.

  Compensation:

  - $210,000 - $240,000/year + equity + benefits.

  Note: This salary range may be inclusive of multiple career
  levels, and the actual base salary within that range will be
  determined by several components including but not limited
  to the individual's experience, skills, and
  qualifications.Perks:

  - Employer paid group health insurance for you and your
    dependents
  - 401(k) plan with employer match (or equivalent for non US-
    based roles)
  - Flexible paid time off
  - Regular company-wide in-person events
  - Home office stipend, and more!

  Corporate Values:

  - Follow Through
  - Deep Understanding
  - Whatever It Takes
  - Do Something Smart
