description: |
  Your Mission:

  As a Backend Developer, you will translate user and business
  needs into robust backend solutions for our HR product,
  KiwiHR. Your skills will help the team make informed
  decisions about backend technologies and practices. You will
  share your knowledge with colleagues, contribute to code
  reviews, and ensure that we maintain high engineering
  standards and code quality. Your mission extends beyond
  coding. You will collaborate with cross-functional teams to
  define, design, and implement new features. You will also
  work closely with frontend developers and other team members
  to ensure the seamless integration and functionality of the
  system.

  About the team:

  KiwiHR product team is a team of 20+ people, organized into
  multiple smaller teams, each made up of 4-5 individuals. Our
  particular sub-team is a vibrant mix of two Backend
  Developers and three Frontend Developers, bolstered by the
  support of Design, QA and DevOps teams. Despite our remote
  operations and flexible working hours, we maintain a high
  degree of collaboration and close-knit interaction within
  our team. We enjoy a camaraderie that extends beyond work,
  fostering a lively and enjoyable team atmosphere.

  Your 12-month journey:

  During the first 3 months: You will meet the team, learn
  about the product and the way we work. You will start to
  understand how the application works under the hood and what
  direction it is heading. You will have a bunch of small
  features implemented and being used by our customers on
  production.

  Within 6 months: You will be prepared to work mainly on your
  own and will know what’s coming up next. You will be
  responsible for implementing more complex features and
  contributing to technical documentation. You will have a
  deep understanding of what we do and why we do it.

  After 1 year: There will be parts of the application you
  know about better than anybody else. On a daily basis you
  will be using features that you implemented or extended. You
  will continue to develop new modules and help us plan ahead.
  There will be changes in the tools, codebase and processes
  that you suggested and the team has agreed to implement.

  What you’ll be doing:

  - Assisting in development of the Core modules of KiwiHR
  - Helping to maintain and extend existing modules and to
    develop new ones
  - Collaborating with other Developers and QAs and Designers to
    deliver high-quality solutions
  - Ensuring the quality, stability, and maintainability of the
    code base
  - Proposing innovative solutions to encountered challenges
  - Identifying root causes of performance bottlenecks or bugs
    and fixing them
  - Participating in code reviews and preparing technical
    documentation

  What you’ll bring to the team:

  - Proficiency in modern JavaScript and TypeScript
  - Minimum 2 years of commercial experience in backend
    development on Node.js platform
  - Proven experience working with:
    - Express.js or similar frameworks
    - Relational databases (PostgreSQL, MySQL, Oracle)
    - ORM libraries (Sequelize, TypeORM or similar)
    - Testing frameworks (Mocha, Jest)
    - GraphQL APIs
    - Git
  - Understanding of asynchronous programming
  - Excellent collaboration and communication skills in Polish
    and English
  - Problem-solving mindset

  What we offer:

  - Great offices and locations in Poznań, Wroclaw and Krakow OR
    the possibility to work fully remotely from Poland
  - Working within an international, friendly team that truly
    values your contribution
  - Brilliant culture and informal, come-as-you-are dress code
  - For B2B contract salary in the range of: 15,000-20,000 PLN +
    VAT and 30 paid break days.
  - Employee contract option is available too (26 holiday days)
  - €1000 of training budget per year to keep you sharp and in
    tune with trends
  - €500 travel budget to visit your colleagues in Amsterdam
  - €200 home office budget + work from home allowance
  - Work from anywhere for 4 weeks/year
  - MacBook + displays, alongside all the tools you need to
    succeed
  - Travel reimbursement, and Wellness perks
  - Fitness card (Multisport)
  - Private health care (LuxMed)

  About Tellent

  Tellent, a premier Talent Management Suite, enables People
  teams to improve the full employee lifecycle with a cutting-
  edge Applicant Tracking System, Human Resources Information
  System, and Performance Management Software – all in one
  place. With 300+ talented employees operating from six
  global locations, we've empowered over 7,000 organizations
  across 100+ countries with our leading HR tech solutions –
  Recruitee, KiwiHR, and Javelo. We have a growing network of
  over 300 partners, all committed to one vision: guiding all
  People leaders to create a better world of work. Have we
  caught your attention? ⚡️ If you’d like to be part of this
  incredible journey, please apply directly - we're looking
  forward to speaking to you!

  About Hiring Process

  We are asking you to fill in the application form with some
  details regarding your technical knowledge and background in
  order to minimise the amount of interviews and skip
  technical assessment part. Each your answers will be
  reviewed by our technical team personally. Please fill them
  in and we are very grateful for your time investment!

  Tellent is an Equal Opportunity Employer. We celebrate
  diversity and welcome applications from underrepresented
  groups and encourage people of all backgrounds to apply. We
  do not discriminate based upon race, religion, color,
  national origin, gender (including pregnancy, childbirth, or
  related medical conditions), sexual orientation, gender
  identity, gender expression, age, neurodiversity, or status
  as an individual with a disability.
