description: |
  Our Team

  At Trilitech, we advance Web3 and frontier technologies by
  empowering developers and creators to build pioneering
  solutions on Tezos and beyond. Our expertise spans core
  blockchain development, decentralised applications,
  infrastructure tooling, developer experience, and incubation
  programs, with a strong focus on cultural projects, capital
  markets, and gaming. We're dedicated to redefining
  possibilities and setting new standards within a rapidly
  evolving space.

  The Technology

  Tezos is an open-source blockchain known for its
  flexibility, security, and unique self-evolving
  capabilities. With innovations like the rollout of Tezos X,
  a new execution layer for Tezos that will enable cross-
  runtime transactions between EVM and Michelson environments,
  Tezos is scaling rapidly and attracting a growing developer
  community. Its ecosystem supports diverse projects, from
  metals.io, a decentralized marketplace for tokenized
  uranium, to leading digital art platforms like Objkt.com.

  We encourage you to explore the Tezos website and follow us
  on Twitter & Discord to learn more about the project.

  The Role

  We are looking for an Engineering Manager with an
  exceptionally strong engineering foundation, someone who
  reasons like a mathematician, has deep computer science
  fundamentals, and has chosen to spend most of their time
  helping engineers deliver outcomes that matter.

  Most of your time goes to management. What we expect from
  your technical side is not hours spent coding but the
  ability to work on hard problems: follow and challenge a
  proof, a protocol design or a performance argument; discuss
  on equal terms with our most senior engineers; and build
  something yourself when that is the fastest way forward. Our
  work ranges from protocol research and formal methods to
  products used by banks, developers and end users, and the
  systems behind them must stay secure and reliable.

  You will provide stable people management for engineers and
  be accountable for the health and progress of defined
  engineering areas. We work as one engineering team,
  organising delivery through crews: small groups with clear
  outcomes and time boundaries. Crews bring together engineers
  from different reporting lines, and staffing can change
  without changing a person's manager. Deciding with the other
  managers where people are most needed, including outside
  your own areas, is at the heart of the job.

  This is not a role with a protected scope where product
  defines the work and engineering delivers it. Our managers
  take part in product decisions: they understand users,
  challenge assumptions, propose what to build, test or stop,
  and say no when something should not be done. We value
  speed: understand quickly, decide, and move forward with as
  many people aligned as possible, rather than waiting for
  consensus before acting.

  AI is part of how we work. We expect you to use it yourself
  to build, explore and understand, and to help engineers
  develop effective practices. Human judgement, validation and
  accountability remain essential. What You’ll Do

  - Lead, not only support. Take positions, make decisions
    within your areas, give your expertise and how confident
    you are in it, and stand by your judgement. Say "I don't
    know" when you don't.
  - Coach and develop engineers through clear expectations,
    direct feedback and career conversations. Address hard
    topics early, recognise high performance and support
    people who are struggling.
  - Be accountable for the health and progress of your
    engineering areas, working with named technical owners and
    their backups to address delivery, reliability, security
    and knowledge gaps.
  - Make plans and estimates that can be trusted. Give every
    piece of work a clear outcome, a date and exit criteria,
    and close it with a deliverable even when the work
    continues.
  - Think about the whole organisation, not only your areas. Tie
    work to the company's priorities, stop what no longer
    serves them, and staff crews with the other managers based
    on skills, development opportunities and operational
    needs.
  - Take part in product discovery and decisions with product,
    business and technical stakeholders. Bring user insight
    and technical possibilities to the discussion, and agree
    success criteria and priorities. Make sure significant
    work has explicit ownership and sponsorship.
  - Bring technical judgement to design discussions and
    challenge assumptions. Get hands-on when needed to
    investigate a problem, test an idea or unblock delivery,
    while engineers keep ownership of their decisions and talk
    directly to their stakeholders.
  - Make progress, risks and trade-offs visible in clear
    writing, without being asked. Escalate significant risks
    early. Discuss openly the decisions that affect others
    before they are made.
  - Use AI in your own work, help engineers apply it well and
    evaluate its results critically. Keep deep understanding
    of, and accountability for, what is shipped.
  - Work as one team with the other engineering managers, the
    wider company and the Tezos ecosystem: disagree in
    writing, then commit.

  What You'll Need

  - Strong mathematical reasoning: you can take an unfamiliar,
    difficult problem, structure it, and reason rigorously
    towards a solution. Our interviews test this directly,
    early in the process.
  - Very solid computer science fundamentals: algorithms and
    complexity, programming languages, systems, concurrency
    and distributed systems, and the ability to reason about
    correctness, security and performance. Formal methods or
    cryptography are a plus. A degree in another scientific
    field is fine if you have built these foundations.
  - Significant prior experience as a senior software engineer
    building and operating complex software used by developers
    or end users, and recent evidence that you still build:
    side projects, prototypes, open-source work, or what you
    built yourself with AI agents.
  - Experience managing and developing engineers in a technical
    organisation, with evidence of effective coaching and
    performance management.
  - Product judgement: you have worked close to users,
    contributed to decisions about what to build and why, and
    are comfortable owning those decisions.
  - A record of helping engineers own and deliver outcomes in
    uncertain, fast-moving environments, with dependencies
    across teams and changing priorities.
  - The judgement to balance delivery, operational continuity
    and long-term technical health, and to know when to
    challenge, delegate or escalate.
  - Strong written and verbal communication with technical and
    non-technical stakeholders.
  - Curiosity and a willingness to learn unfamiliar systems
    quickly. Prior Web3 experience is welcome but not
    required.
  - Location: London or Paris preferred (hybrid). Fully remote
    is possible within a close time zone.

  What You Can Expect From Us

  - Competitive salary with substantial incentive schemes
  - Generous long-term incentive plan (LTIP) tez scheme
  - Hybrid working environment
  - Daily lunch provided in the London office
  - Commuter costs reimbursement (up to £3,300 in the London
    office)
  - 20-day policy for working abroad
  - 25 days paid holiday plus your birthday off
  - Enhanced parental & adoption leave
  - Pension contributions double matched (up to 10% in London)
  - Private medical insurance with (AXA in Paris, BUPA in
    London)
  - Learning and development programs
  - Life assurance (x5 base salary in London)

  Why You'll Love It Join a fast-paced environment where
  you'll lead impactful initiatives. You'll have autonomy to
  deliver results, supported by passionate colleagues in a
  focused but fun environment. We value ambition, creativity,
  and continuous learning, providing the ideal setting for
  career growth.



  Our Principles:

  - Desire to Win: We strive for excellence and aim to be the
    best.
  - Sense of Urgency: Adaptability and decisive action keep us
    ahead.
  - Ownership Mindset: We lead by example, taking responsibility
    for outcomes.
  - Pragmatism: We focus on impactful results.
  - Communication: Transparency and collaboration are central.
  - Resourceful Approach: We maximise our resources for
    competitive advantage.

  --

  Experience is great, but passion is key. If you believe in
  your potential, we encourage you to apply. Trilitech is an
  equal opportunity employer, dedicated to fostering diversity
  and inclusion. Please inform us if you require
  accommodations during the interview process.

  By applying, you consent to your application data being
  shared with our partner companies for recruitment purposes,
  in compliance with our privacy policy.
