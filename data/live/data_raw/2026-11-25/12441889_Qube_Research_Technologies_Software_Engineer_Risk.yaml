description: |
  QRT is a global quantitative and systematic investment
  manager, operating across all liquid asset classes. We are a
  data- and technology-driven organization applying scientific
  methods to investing. Our collaborative culture and focus on
  innovation enable us to solve complex challenges and deliver
  high-quality returns for our investors.



  The Risk Team develop scalable software used by Risk
  Managers, Portfolio Managers and Quantitative Researchers
  across the business. This team is critical in building high-
  performance production systems, cloud-native services and
  engineering tooling that support our risk management
  capabilities.



  Your future role within QRT


  We are seeking an experienced Software Engineer to work
  within our Risk Team to help design and build the next
  generation of our risk platform. The role is expected to
  involve the following activities:



  - Design, develop and maintain production-grade Python
    applications and services.
  - Build scalable APIs, distributed systems and data pipelines
    supporting risk analytics and business workflows.
  - Design and develop cloud-native applications using modern
    software engineering practices.
  - Collaborate closely with Risk Managers and Quantitative
    Researchers to productionise analytical models and enhance
    existing platforms.
  - Design reliable, observable and maintainable software with a
    strong focus on performance, scalability and operational
    excellence.
  - Contribute to architecture discussions and continuously
    improve engineering standards, tooling and development
    practices across the team.
  - Leverage modern AI-assisted development tools to improve
    software quality, developer productivity and delivery.

  Your present skillset

  - Excellent Python development skills
  - Strong understanding of object-oriented design and software
    engineering principles
  - Demonstrable experience designing, building and supporting
    high-quality production systems
  - Good knowledge and experience of developing REST APIs and
    backend services
  - Strong SQL knowledge
  - Experience with distributed systems, asynchronous processing
    and data pipelines
  - Ability to test, debug and optimise software with a strong
    focus on reliability and performance
  - Experience with containerisation and CI/CD practices
  - Demonstrable ability to communicate and collaborate
    effectively with technical and business stakeholders
  - A passion for building robust, maintainable software and
    continuously improving engineering practices

  Desirable to have experience or a willingness to learn in
  the following areas:

  - Cloud-native technologies, including AWS, Docker, Kubernetes
    and infrastructure automation
  - Monitoring and observability tooling such as Prometheus,
    Grafana, OpenTelemetry or similar technologies
  - Modern backend and data technologies such as FastAPI, Kafka,
    Airflow, Terraform or gRPC
  - Financial markets or another data-intensive, low-latency
    environment
  - Quantitative analytics, trading or risk platforms
  - AI-enabled engineering solutions, retrieval-augmented
    applications or agentic workflows
  - Modern AI-assisted development tools as part of the software
    engineering lifecycle

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
