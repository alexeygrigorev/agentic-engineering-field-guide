title: Senior Software Engineer - Core Compute Platform
company: StubHub
location: New York, USA
work_type: FULL_TIME
company_size: 1,000 Employees
description: |
  StubHub is on a mission to redefine the live event
  experience on a global scale. Whether someone is looking to
  attend their first event or their hundredth, we’re here to
  delight them all the way from the moment they start looking
  for a ticket until they step through the gate. The same goes
  for our sellers. From fans selling a single ticket to the
  promoters of a worldwide stadium tour, we want StubHub to be
  the safest, most convenient way to offer a ticket to the
  millions of fans who browse our platform around the world.

  We are seeking an experienced Senior Platform Engineer to
  join the Core Compute team. This role is central to driving
  the architectural vision, development, and operational
  excellence of our end-to-end Compute Platform.
  Responsibilities include technical leadership in
  provisioning, scaling, and optimizing the platform, as well
  as designing high-leverage interfaces and tooling that
  empower internal engineering teams to run critical
  production services, internal infrastructure, and facilitate
  AI Agent and model training.

  About the Compute Platform Team The Compute Platform team's
  goal is to deliver an intuitive, performant, and cross-
  language environment for hundreds of services across
  StubHub. We own the platform that empowers developers to
  accelerate their work and focus on business objectives by
  abstracting and automating complex, common concerns. This
  includes deployment, configuration, service discovery, and
  day 2 operations for their entire service fleet. We operate
  the Platform as a product, not a service desk, promoting
  self-service, providing "easy buttons," and fostering
  empowerment over rigid controls and gates.

  Location: Hybrid (3 days in office/2 days remote) – Century
  City, CA or New York, NY

  What You'll Do:

  - Platform Strategy & AI Readiness: Architect and advance our
    core compute platform (EKS in AWS) to support rapid
    iteration and next-generation AI and Agentic development
    workflows.
  - Developer Enablement & Tooling: Lead organizational
    engineering efficiency initiatives by designing and
    building powerful, reusable tools, SDKs, services, and
    shared packages across teams.
  - Simplification & Velocity: Maximize developer velocity and
    minimize cognitive load by creating intuitive platform
    interfaces and abstractions that simplify underlying
    complexity.
  - Strategic Partnership: Serve as a strategic partner and
    consultant to engineering teams, proactively identifying
    technical bottlenecks and architecting lasting, scalable
    engineering solutions.
  - Performance & Reliability: Lead initiatives to enhance the
    platform's performance, reliability, and scalability
    through dedicated automation and robust tooling.
  - Technical Leadership & Best Practices: Mentor junior/mid-
    level engineers, champion high engineering standards, and
    drive continuous adoption of best practices in software
    architecture and platform engineering.
  - High-Velocity Execution: Thrive in a fast-paced environment,
    skillfully managing and prioritizing multiple concurrent,
    complex technical initiatives.
  - Culture: Foster a positive, inclusive team culture where
    diverse perspectives are valued and drive technical
    innovation.

  What You've Done:

  - Professional Software Development: 5+ years of hands-on
    experience designing, building, and operating production
    software platforms.
  - Core Programming Expertise: Experience developing robust,
    mission-critical systems using one or more general-purpose
    programming languages (e.g., Java, C#, Python, Go).
  - Cloud Infrastructure & DevOps: Proven ability to build and
    manage multi-tenant cloud infrastructure utilizing
    Infrastructure as Code tools such as Terraform or
    Crossplane.
  - System Architecture & Multi-Tenancy: Deep expertise in
    architecting large-scale, distributed, multi-tenant
    environments with an emphasis on fault tolerance,
    security, scalability, and cost optimization.
  - Impactful Problem Solving: Demonstrated experience in
    designing and developing solutions to complex problems
    that deliver significant business impact.
  - System Ownership & Context: Strong understanding of how
    developed systems interact within the broader production
    environment, including a deep grasp of dependencies and
    platform primitives.
  - Adaptability & Learning: Proven ability to quickly learn and
    adopt new coding languages, platforms, frameworks, and
    tools.
  - Communication & Collaboration: Excellent communication
    skills and a track record of effective collaboration with
    cross-functional teams.
  - End-to-End Ownership & Mentorship: Proven track record of
    owning complex, multi-quarter initiatives from initial
    architecture design to production, along with mentoring
    and elevating team members.

  What We Offer:

  - Accelerated Growth Environment: An environment designed for
    swift skill and knowledge enhancement, where you have the
    autonomy to lead experiments and tests on a massive scale.
  - Top Tier Compensation Package: Competitive base, equity, and
    upside that tracks with your impact.
  - Flexible Time Off: Enjoy unlimited Flex Time Off, giving you
    the flexibility to manage your schedule and take time to
    recharge as needed.
  - Comprehensive Benefits Package: Prioritize your well-being
    with a comprehensive benefits package, featuring 401k, and
    premium Health, Vision, and Dental Insurance options.

  The anticipated gross base pay range is below for this role.
  Actual compensation will vary depending on factors such as a
  candidate’s qualifications, skills, experience, and
  competencies. Base annual salary is one component of
  StubHub’s total compensation and competitive benefits
  package, which includes equity, 401(k), paid time off, paid
  parental leave, and comprehensive health benefits.

  Salary Range

  $200,000—$250,000 USD

  About Us

  StubHub is the world’s leading marketplace to buy and sell
  tickets to any live event, anywhere. Through StubHub in
  North America and viagogo, our international platform, we
  service customers in 195 countries in 33 languages and 49
  available currencies. With more than 300 million tickets
  available annually on our platform to events around the
  world -- from sports to music, comedy to dance, festivals to
  theater -- StubHub offers the safest, most convenient way to
  buy or sell tickets to the most memorable live experiences.
  Come join our team for a front-row seat to the action.



