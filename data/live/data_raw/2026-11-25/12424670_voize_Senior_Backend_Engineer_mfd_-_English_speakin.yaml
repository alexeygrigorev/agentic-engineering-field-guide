description: |
  🎤 Why voize? Because we’re more than just a job!

  At voize, we believe the greatest gift to frontline workers
  is time - time to care, connect, and be present. Today, that
  time is lost to admin work that pulls nurses away from what
  matters most: people.

  We’re changing that by building the AI companion that frees
  nurses from admin, giving them back up to 30% of time. We
  don’t replace humans - we support and amplify their impact.
  Today, 2,000+ care facilities trust voize, and over 200,000
  nurses rely on our AI companion to ease their daily
  workload.

  Our mission is backed with a $50M Series A funding led by
  Balderton Capital, with support from HV Capital, Y
  Combinator and other leading VCs.

  As a fast-growing team, we combine first-in-class technology
  with meaningful social impact. And now, we’re looking for
  you to join us on this mission!

  💡 Your Mission

  As a Backend Engineer part of our US/UK squad based in
  Germany, you’ll ensure that data flows smoothly between our
  products and our partners' software solutions. You'll build
  and maintain the integrations that connect the voize with
  senior care and hospital software platforms.

   🚀 Your Daily Business – No two days are alike

  - Shape the future of our integrations: Build interfaces that
    connect voize with systems across the care and medical
    sector.
  - Build future-proof solutions: Develop scalable APIs, help
    set industry standards, and work closely with partners and
    clients.
  - Take end to-end ownership: Own integrations from the first
    idea through implementation to long-term operation.
  - Architecture with foresight: Design sound data models and
    resilient, concurrent systems that stay dependable when
    partner systems are slow, flaky or inconsistent.
  - Raise the bar: Set technical direction, review code, and
    help other engineers grow.
  - Work with impact: Your work saves caregivers time, improves
    documentation, and supports people who do amazing work
    every day.

  🤝 Your Skillset – What you bring to the table

  - Several years of backend development experience on the JVM
    (Kotlin, Java, Scala or similar), including production
    systems you've owned
  - Solid grasp of concurrent and asynchronous programming: non-
    blocking I/O, cancellation and timeouts, error
    propagation, and backpressure (through coroutines,
    reactive streams, virtual threads or futures)
  - Experience designing and building APIs and integrations with
    REST or GraphQL, ideally with third-party or partner
    systems
  - Business-fluent English (C1) to work directly with customers
    and partners
  - Openness to occasional travel to the UK or US

  🌱 Growing together – what you can expect at voize

  - We are a fast-growing startup, that means you will tackle
    challenges, grow quickly, and make a real impact, giving
    healthcare professionals more time for real patient care
  - We foster an open, collaborative culture with regular team
    events, whether you work from our Berlin office or
    remotely from Germany
  - Become a co-creator of our success with stock options
  - Generous perks: 30 vacation days plus your birthday off,
    Germany Transport Ticket, Urban Sports Club, regular
    company off-sites, and access to learning platforms such
    as Blinkist and Audible
  - You decide when you work best, that means flexible working
    hours and a good hybrid set-up.

  ✨ Ready to talk? Apply now! 🚀

  We look forward to your application and can’t wait to meet
  you – no matter who you are or what background you have!
