description: |
  At MoneyGram, we're combining the strength of a trusted
  global brand with the agility of a tech-forward, growth
  driven culture. With 85+ years of experience and a presence
  in more than 200 countries and territories, we've built a
  foundation of stability and trust to help millions of people
  around the world send funds quickly, securely, and
  affordably.

  We're looking for bold thinkers, builders, technologists,
  and sellers who want real ownership of their work, thrive in
  collaborative environments, and are energized by solving
  complex challenges. Here, you'll have the opportunity to
  make a measurable impact - fast.

  If you're eager to shape the future of cross-border payments
  and financial services, join us as we transform how the
  world moves money.

  NAME OF EMPLOYER:       MoneyGram International, Inc.

  POSITION TITLE:                Software Engineer IV

  POSITION LOCATION:       100% remote position reporting to
  2828 North Harwood Street, Suite 1500, Dallas, TX 75201.

  SALARY:                               $160,285/yr.

  HOURS:                                 Full Time/40 hours



  JOB DUTIES: Engages with system users and business analysts
  to identify system enhancements and/or new applications to
  meet business needs. Contributes to development of solutions
  and ideas that add value. Develops solutions for software
  issues. Creates quality design documents to illustrate how
  software system works. Writes clear and detailed technical
  specifications for development. Provides big picture view of
  how various connected system designs are consolidated or
  affected. Produces products on schedule, including elegant
  and efficient designs, high performance, and scalable code
  that allows for easy extension to future needs. Produces
  code of high quality and reliability with strong quality
  code metrics. Performs code walkthroughs in conjunction with
  Quality Services. Performs extensive system testing to
  ensure systems work efficiently and are developed following
  applicable development methodology. Completes unit tests
  ensuring accuracy. Tracks record of identifying largest risk
  areas and driving resolution of issues. Leads design,
  development, and implementation of complex software systems.
  Provides accurate and timely input to Project Manager about
  status of technical tasks for self and team. Effectively and
  actively plays role of technical advisor for projects,
  advising on tools, process, and design. Initiates and
  facilitates meetings and issue resolutions, involving the
  right team members. Ensures project goals make sense and
  overall development objectives are met. Serves as contact
  person in support of serious production issues. Designs and
  develops high quality, scalable, and efficient solutions and
  products on schedule. Manipulates databases with Cloud
  providers AWS and GCP.



  REQUIREMENTS: Bachelor’s degree or equivalent in Computer
  Science, Computer Engineering, Information Technology, or
  related field of study and 7 years of progressive experience
  with system development platforms. Employer will accept a
  Master’s degree or equivalent in Computer Science, Computer
  Engineering, Information Technology, or related field of
  study and 3 years of experience with system development
  platforms, in lieu of a Bachelor’s degree or equivalent and
  7 years of progressive experience.



  Applicants must have demonstrated experience with:



  1) Gathering requirements, design, and developing systems.

  2) Leading requirements, gathering, designing and
  development of systems.

  3) Designing and developing application solutions and
  products with a focus on quality, scalability, and
  efficiency.

  4) Architectural disciplines.

  5) Identifying root cause of technical problems.

  6) Project management skills including building schedules,
  organizing project milestones, and maintaining simple
  project plans.

  7) Working with applications OS: UNIX flavors (Linux) or
  DOS.

  8) Working with databases: Oracle, Postgres, No SQL,
  BigQuery (Couchbase, Opensearch), or GCP BigQuery.

  9) Programming and scripting technical specifications using
  Bash, Python, Java, or similar languages.

  10) Developing environment commensurate with the assigned
  database application.



  CONTACT: Applicants who are interested in this position
  should submit a complete resume to
  talentacquisitionamericas@moneygram.com. Reference Job
  #MC-0701.







  Anticipated Base Pay: $160,285/yr.



  Day 1 Benefits to include: Customizable health plan-PPO/High
  Deductible Plan with Employer HSA Contribution; 20 Days of
  Accrued PTO; 13 Paid Holidays; 2 Community Service Days;
  401k with Employer Match; Parental Leave; Employee
  Assistance Program; Tuition Reimbursement; Money Transfer
  Reimbursement; Pet Insurance options.



