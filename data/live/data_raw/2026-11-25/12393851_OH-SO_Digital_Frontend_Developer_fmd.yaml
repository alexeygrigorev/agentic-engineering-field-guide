description: |
  What to expect

  We are a startup digital agency, and no two projects,
  clients, or even days look the same.

  In ecommerce we build on Shopify and Liquid and Next.js,
  with custom AWS microservices and apps that take Shopify
  well past the defaults.

  On the marketing side we build highly customised sites in
  Next.js and React, with careful design and animation and a
  real focus on how the page performs and feels.

  In automotive we build full platforms, from stock-car
  locators to configurators and more. Across all of it, we
  bring AI into the work through our own products.

  Here nothing will be fixed. You will work across changing
  projects and settings, on long builds that run for months
  and shorter spikes to figure out how a business can actually
  use AI, and you will help us rethink how agency work is
  done.

  Sound like your kind of place? Here is what we need from
  you.

  Your competencies

  Mindset

  Is your goal to deliver great software, whether the problem
  is easy or hard? Do you push deeper than most to find the
  right solution, not just the first one that works? Then you
  are the person we need.

  Responsibility

  You own what you build, all the way through, not just until
  it ships and becomes someone else's problem. The parts that
  go smoothly and the parts that get messy are both yours to
  see through. You bring your ideas, experience and your
  curiosity, you use AI to build better and faster, and you
  stand behind what you put your name on.

  Drive

  You will not know everything yet, and that is fine. What we
  can't teach is curiosity. We bring the tools and the
  guidance. You bring the willingness to ask, learn fast, and
  grow with people who'll back you.

  What you bring to the table:

  - You work across crafts, not in a corner. You are close with
    developers, designers, and strategists, and you would
    rather build in the open than behind a wall.
  - You make the team better. You say so when something can be
    sharper — and you're just as ready to hear it back — and
    you share what you learn instead of sitting on it.
  - You care whether the client wins. You focus on the quality
    of the product and the experience, not just the ticket in
    front of you.

  What You Can Look Forward To

  What you will actually do:

  We build complex, end-to-end products for both big-name and
  niche clients. You will own the frontend side of that work,
  plus the wider circle around it. You run most of it on your
  own, with a foundation solid enough to pick up whatever the
  project throws at you, fast.

  Day to day, that means:

  - Owning features end to end: states, edge cases,
    accessibility, performance, not just the happy path.
  - Taking medium and larger pieces on your own, and pairing
    with seniors on the architecture-level calls.
  - Being a real team member and pushing past that: taking on
    things that stretch you, presenting your work to the
    client, and steering thin slices on your own.
  - You’re enjoying being part of a team, not a remote desk
    which prefers to work in isolation most of the time.

  The tech stack you will work with:

  - Languages and frameworks: React, Next.js, TypeScript, HTML,
    CSS
  - APIs: REST and GraphQL
  - Cloud: AWS, GCP
  - Delivery: Existing CI/CD usage and maintenance
  - AI tooling: Claude, Cursor, Pi, Antigravity, plus your and
    our own Skills and MCP setup

  Who you will work with

  We are a bunch of colleagues originally from similar
  backgrounds who got tired of how things were usually done
  and set out to find better ways. That is the whole reason
  this company exists, and it is still what we are doing.

  We are not a place of rockstars and egos. People here ask
  questions out loud, show rough work without flinching, and
  would rather help each other get something right than look
  clever alone. We push each other, in the good way, and we do
  not take ourselves too seriously while we are at it.

  You would be joining that. You’ll work closely with the
  crafts, designers and strategists, and just as easily with
  the people steering the projects and the business. There is
  no wall between you and any of it. Take on the parts you are
  ready for, and when you want more, a pitch, a client
  conversation, a bigger call, speak up at the right moment
  and the door is open.

  Smaller team. More ownership. Real support.
