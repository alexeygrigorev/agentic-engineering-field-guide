description: |
  At Render, we’re building the modern cloud platform for
  developers creating AI-native, full-stack, multi-service
  applications. Our mission is to eliminate the tradeoff
  between the power of hyperscalers and the simplicity of
  developer-friendly platforms—so teams can ship fast, scale
  reliably, and focus on their product, not infrastructure.

  Unlike complex hyperscalers or ephemeral edge/serverless
  solutions, Render offers a developer-first experience with
  persistent compute, dynamic autoscaling, built-in
  orchestration, and observability, allowing teams to launch,
  scale, and manage real-world applications without writing
  infrastructure code or managing servers. Whether you're
  building LLM-powered applications, scalable SaaS products,
  or async processing pipelines, Render empowers teams to move
  fast and scale confidently from MVP to millions of users.

  Our platform is trusted by over 7 million developers
  worldwide and continues to grow rapidly. In February 2026,
  we raised an additional $100M in Series C financing,
  bringing our total funding to $260M, to accelerate our
  vision of making cloud infrastructure both powerful and
  intuitive—designed for the speed of modern AI development.

  We’re a diverse and talented team that values craft,
  velocity, and user experience. If you’re excited to help
  shape the future of the intelligent cloud and empower
  developers everywhere, we’d love to hear from you.

  Applying to Render

  We're seeking candidates who possess high integrity,
  humility, and an insatiable drive to learn. Through reasoned
  discussions and continuous feedback, we strive to improve
  both individually and collectively. We foster an environment
  of mutual trust and respect, empowering effective debate to
  achieve the best outcomes for our customers and team.

  We especially encourage members of underrepresented groups
  in the tech community to apply and understand that not all
  successful candidates will meet each requirement listed.

  Our interview process is unique to each role, and we value
  the candidate experience just as much as our customer
  experience. We hope your conversations with us reflect a
  thoughtful process that is illuminative, enjoyable, and
  respectful of your time.

  About the Role

  As an Engineering Manager for Postgres, you will lead a
  group of talented engineers building and maintaining the
  Render Postgres product. This role blends strong technical
  leadership with product thinking: you’ll partner closely
  with product managers and designers to translate user needs
  into a high-quality, scalable system, that hundreds of
  thousands of developers rely on every day. You’ll be
  responsible for guiding technical direction, developing
  engineers, and ensuring the team ships meaningful
  improvements quickly while maintaining the high standards
  that define Render’s platform. The ideal candidate brings a
  strong engineering background, a deep sense of ownership,
  experience building stateful services, and a passion for
  building products that developers love.



  What You'll Do

  - Lead and grow a team of postgres engineers, supporting their
    development through mentorship, feedback, and clear
    technical guidance.
  - Drive execution on key product initiatives from ideation
    through launch, balancing speed with high standards of
    reliability and quality.
  - Partner closely with Product, Design, and Infra teams to
    translate customer needs into thoughtful technical
    solutions and product roadmaps.
  - Engage deeply in technical discussions, guiding system
    design decisions and helping the team navigate
    architectural tradeoffs.
  - Foster a culture of ownership, accountability, and
    continuous improvement across engineering practices and
    team processes.
  - Help the team break down complex problems into incremental
    milestones that deliver value quickly while supporting
    long-term platform evolution.
  - Ensure teams maintain a strong understanding of the
    developer experience and customer impact of the features
    they build.
  - Stakeholder Collaboration: Partner closely with product
    management, customers, and internal teams to understand
    needs, align priorities, and ensure delivery of impactful
    features and solutions.



  What We're Looking For

  - 8+ years as an Engineer shipping products and/or features
    that have downstream impact on the business and product
    ecosystem. Ideally, experience with building stateful
    services.
  - 2+ years of experience managing people and developing
    engineers, including hiring, mentorship, and performance
    management.
  - Strong technical background with the ability to engage
    deeply in system design, architecture, and engineering
    tradeoffs.
  - Product-oriented mindset with experience translating
    business goals and user needs into engineering roadmaps
    and shipped features.
  - Ability to balance urgency with thoughtful execution,
    helping teams ship quickly while maintaining high quality.
  - Excellent communication and collaboration skills, with the
    ability to work effectively across engineering, product,
    and design.
  - A strong sense of ownership and accountability for both team
    outcomes and long-term system health.

  Nice-to-haves:

  - Experience building products for developer platforms, cloud
    infrastructure, or DevTools.
  - Background working on highly scalable distributed systems or
    infrastructure platforms.
  - Experience improving engineering velocity through tooling,
    processes, and team practices.
  - Experience building products used directly by developers or
    technical users.
  - A track record of successful collaboration with product,
    marketing, and customer support teams to drive adoption
    and retention.

  If this role excites you but you don’t meet every single
  requirement, we’d still love to hear from you—your unique
  experience might be just what we need.

