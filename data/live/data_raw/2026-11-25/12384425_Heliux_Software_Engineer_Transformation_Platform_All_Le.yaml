description: |
  Why Heliux:

  Heliux is building the AI-native operating system for the
  manufacturing enterprise. We’re fundamentally reshaping how
  engineering and manufacturing companies run by eliminating
  cross-functional fragmentation and enabling agentic
  execution on a single, shared operational reality. Companies
  developing and scaling production of next-generation defense
  systems, nuclear reactors, robotics, and more all trust
  Heliux to drive their operations.

  We’re on a mission to deliver unprecedented operating
  performance for manufacturers. Our team is built on a
  foundation of grit combined with deep commitment to our
  customers and the mission. If you want to do important work
  for critical industries on an ambitious, high-energy team,
  we’d love for you to join us.

  About the Role:

  Engineers at Heliux are directly responsible for end-to-end
  design, development, and delivery of our core software
  platform:

  - Acquire expertise in hardware engineering and manufacturing
    through immersive, hands-on problem-solving with our
    customers.
  - Rapidly design, build, test, deliver, and maintain complex
    software systems that are performant, reliable, and
    scalable.
  - Contribute to the high-level technical direction of both the
    organization and the platform to ensure we are always
    accelerating shipping velocity.
  - Relentlessly solve any and all technical problems that stand
    in the way of company objectives—and therefore, our
    success.

  You will be placed to work on one of the following platform
  modules: Product OS, Supply Chain OS, Manufacturing OS,
  Planning OS, or Sales OS.

  About You:

  - Proven experience building complex, scalable software
    systems from zero-to-one—i.e., problem identification to
    production-grade solution.
  - Demonstrated proficiency in programming languages such as
    Rust, Python, Java, TypeScript, or similar.
  - Inherent desire to operate with extreme levels of urgency
    across all aspects of life and work.

  About Our Stack:

  - Frontend: React, TypeScript, NextJS, ThreeJS
  - Backend: Rust, Python w/ FastAPI and Flask
  - Database & Infra: PostgreSQL, DynamoDB, Standard and
    Government AWS: RDS, S3, ECS, SQS
  - Runtime: Electron, Docker

  What We Offer:

  - Competitive compensation package, including company equity.
  - Healthcare coverage across medical, dental, and vision.
  - Company-provided lunch and dinner.
  - Unlimited PTO.

  All qualified applicants will receive consideration for
  employment regardless of race, color, religion, sex,
  national origin, age, physical and mental disability, health
  status, marital and family status, sexual orientation,
  gender identity and expression, military and veteran status,
  and any other characteristic protected by applicable law.

  ITAR Requirements

  To conform to U.S. Government export regulations, applicant
  must be a (i) U.S. citizen or national, (ii) U.S. lawful,
  permanent resident (aka green card holder), (iii) Refugee
  under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158,
  or be eligible to obtain the required authorizations from
  the U.S. Department of State. Learn more about the ITAR
  here.
