title: "Staff Software Engineer (Full Stack & Backend)"
company: Cloaked, Inc.
location: New York, USA
work_type: FULL_TIME
company_size: 500000 Employees
description: |
  Cloaked is a privacy startup dedicated to rebuilding
  consumer trust in how personal data is used. Nearly a
  million paying members use Cloaked to take back control of
  their data, their identity, and who can reach them. That
  covers masked emails, phone numbers, and payment cards, data
  removal from broker sites, and an AI voice agent that
  screens calls before they ring through.

  We've protected tens of millions of identities, screened
  hundreds of millions of calls, and removed billions of
  records from data brokers. Backed by a $375M Series B.

  About the Role

  We’re looking for strong Staff Software Engineers (Full
  Stack & Backend) who want real ownership and range. At
  Cloaked, our engineers aren’t boxed into a single feature.
  They go where the hardest problems are, whether that’s
  building AI agents and voice AI, shipping new features in
  Cloaked Pay and Call Guard, scaling the systems underneath
  it all, or launching something new from scratch.

  We hire builders, and we give them room to run. The team is
  growing fast, and there’s plenty of space to own your
  direction and shape both what we build and how we build it,
  all on a zero-knowledge, end-to-end-encrypted architecture
  built to scale.

  What will you do?

  - Own the technical direction for the systems and initiatives
    you lead, from scoping and architecture through to
    shipping
  - Work across the stack and across teams, taking on the
    highest-impact problems wherever they sit
  - Lead zero-to-one work, from new consumer features to our
    expansion into enterprise
  - Strengthen our foundations: scalability, reliability,
    performance, and cost efficiency as we grow 10x
  - Partner closely with product and design to turn ambiguous
    problems into products customers love
  - Raise the engineering bar through architecture decisions,
    code reviews, and mentorship
  - Build AI-natively, using and shaping the tools that help us
    ship faster without compromising on privacy or quality

  What we’re looking for

  - Significant experience building and shipping production
    software end to end, ideally at a consumer or growth-stage
    company
  - A track record of technical leadership at the Staff level:
    setting direction, making sound architecture and system-
    design calls, and raising the bar for the engineers around
    you
  - Strong backend depth in Python or a similar language,
    including scalable systems, secure production-grade APIs,
    databases, and backend architecture patterns
  - For full stack candidates: strong frontend fundamentals and
    experience building high-quality, responsive user
    interfaces (we care more about fundamentals than any
    specific framework). For backend-focused candidates,
    frontend experience is a plus
  - Product sense: you think about the user and the “why,” not
    just the implementation, and you’re comfortable making
    scope trade-offs
  - AI-forward: you use AI coding tools (Claude Code, Codex,
    Cursor, and others) fluently to ship faster, and you’re
    excited to build where AI is core to what we make.
    Experience shipping AI-powered features is a plus, not a
    requirement
  - Familiarity with modern tooling, testing, and CI/CD
    practices

  What do we like?

  - A get-it-done mindset: you’re driven to create new solutions
    and solve problems in a fast-paced environment
  - Comfort working across teams to find the best solution
  - Passion for security and internet ethics
  - Interest in data and analytics
  - Care and respect for our customers’ privacy as if it were
    your own

  What we offer

  Cloaked is a well-funded Series B startup based out of NYC.

  Although we are a distributed team, the NYC team operates
  with a hybrid model. The office building is home to several
  amenities, including a gourmet cafe, cocktail bar, and a
  rooftop work area.

  We have a fully built out kitchen packed with drinks and
  snacks. The Cloaked team has diverse interests and so we
  frequently embark on team outings and go out for socials!

  Our Values

  1. Do the impossible for everyday people.

  2. Use what we build, build what we would use.

  3. Prioritize value delivery.

  4. Stay curious and get better.

  5. Be candid and kind.

  6. Under one cloak toward one mission.



  Compensation and Benefits

  We offer above market rate pay and equity based off of the
  market’s best commercially available data. Your compensation
  will be a combination of salary, bonus and equity.

  Cloaked employees have 401K, as well as top of the line
  Health, Dental, and Vision benefits.

  We offer flexible work arrangements and the ability to work
  remotely as needed. Cloaked provides a home office stipend
  in addition to a new company laptop (and other tech
  depending on the role).



  Perks

  🌴 Competitive PTO: We encourage employees to take a minimum
  # of vacation per quarter. We see PTO as a preventative
  burnout measure and are committed to changing the industry
  standard.

  🤸 Monthly health stipend: Used for any kind of physical,
  mental or emotional care you’d like to take for yourself, be
  it a gym membership, a meditation app, or time with a
  personal trainer.

  🥗 Late Night Meals: We understand that sometimes work can
  get in the way of meal prep. In response to that, we offer
  employees a monthly meal stipend to be used when they don’t
  have time to get a home cooked meal going!

  🧠 Professional Growth: Opportunities for career development
  and personal growth are provided to all employees who seek
  to further their knowledge and capabilities through an
  unlimited professional development fund. Additionally team
  members are encouraged to regularly attend conferences and
  industry events.

  We are really excited about having you join our mission-
  driven team and help us build the future of online privacy!
