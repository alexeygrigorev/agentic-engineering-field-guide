description: |
  About the team

  Earners (drivers and couriers) are an integral part of
  Uber’s multi-sided marketplace. They provide the time and
  the means to move people and things. Importantly, they
  enable the connection between the physical and digital world
  to make the movement happen at the push of a button for
  everyone, everywhere.

  Within Uber, the Earner Intelligence team plays a critical
  role in earners’ journey as the team is responsible for
  building AI/ML systems across earner onboarding, activation,
  early life cycle, and resurrection.

  The team employs a variety of ML/AI techniques, spanning
  from causal ML meta learners, supervised ML, RL multi-armed
  bandits and contextual bandits, genAI LLM, long running
  agents, agentic harnesses, and training our own Earner
  language model to deep learning embeddings to build
  impactful data products

  What the candidate will do

  - Design, build, and ship novel computer vision models to
    process images on the cloud and on the device
  - Build statistical, optimization, and machine learning models
  - Work closely with multi-functional leads to develop
    technical vision, new methodological approaches, and drive
    team direction.
  - Collaborate with cross-functional teams such as product,
    engineering, operations, and marketing to drive ML system
    development end-to-end from conceptualization to final
    product.

  Basic Qualifications

  - Bachelor’s or Master’s or equivalent experience in Computer
    Science, Machine Learning, Operations Research,
    Statistics, or other related quantitative fields or
    related field
  - 4 years minimum of industry experience as a Machine Learning
    Engineer/Research Scientist with a strong focus on
    computer vision modeling, Convolutional Neural Networks
    (CNNs), Vision Transformers, Vision Language Models,
    Object Detection Frameworks, Image Segmentation, Transfer
    Learning, Fine-tuning such as SFT, LoRa.
  - Proficiency in multiple object-oriented programming
    languages (e.g. Python, Go, Java, C++).
  - Experience with any of the following: Spark, Hive, Kafka,
    Cassandra.
  - Experience building and productionizing innovative end-to-
    end Machine Learning systems.
  - Experience in exploratory data analysis, statistical
    modeling, hypothesis testing, and experimental design.
  - Experience working with cross-functional teams(product,
    science, product ops etc).

  Preferred Qualifications

  - PhD or equivalent experience in Computer Science, Machine
    Learning, Operations Research, Statistics, or other
    related quantitative fields or related field
  - 5+ years of industry experience in machine learning,
    including building and deploying computer vision models
    and architectures.
  - Expertise on training and deploying on device models and
    expertise with methodologies such as Knowledge
    Distillation, Modeling Pruning, and Quantization
  - Publications at industry recognized ML conferences.
  - Expertise in the design and architecture of ML systems and
    workflows.

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For Seattle, WA-based roles: The base salary range for this
  role is USD $202,000 per year - USD $224,000 per year.

  For Sunnyvale, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
