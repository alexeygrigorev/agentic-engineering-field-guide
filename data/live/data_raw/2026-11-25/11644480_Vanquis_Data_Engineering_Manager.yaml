description: |
  THE NEXT CHAPTER STARTS WITH YOU

  Data Engineering Manager

  Contract Type: Permanent | Full Time

  Location: Bradford or London

  Working Pattern: Hybrid



  Lead the people, platform and standards powering the next
  chapter of data at Vanquis

  We have invested in modernising our technology landscape and
  strengthening our data capability. The opportunity now is to
  evolve and scale our Snowflake platform while building the
  engineering leadership, standards and controls needed for
  what comes next.

  As Data Engineering Manager, you will lead and develop Lead
  Data Engineers and oversee multiple squads delivering data
  products across Vanquis. You will combine people leadership
  with deep technical authority across Snowflake, Data Vault
  2.0 and metadata-driven transformation, with visible
  ownership of quality, cost, resilience and governance.

  This is a role for someone who wants more than delivery
  ownership. You will shape how a significant data platform
  evolves, influence decisions across Technology & Change and
  develop the engineering leaders who will carry the
  capability forward.



  There's More to the Story

  Vanquis is evolving. We are investing in our people,
  modernising how we work and building data capabilities that
  support regulatory obligations, commercial decisions and
  better customer outcomes.



  How you'll make an impact:

  You'll…

  So that…

  Lead and develop Lead Data Engineers and the squads around
  them.

  Engineering leaders grow their capability, teams have clear
  direction and the portfolio has the skills and succession
  strength to deliver.

  Set and evolve Data Vault 2.0 modelling and engineering
  standards.

  Data products are consistent, reusable and trusted across
  regulatory, analytical and commercial use cases.

  Shape how Snowflake operates at scale, including
  architecture, access, observability and warehouse strategy.

  The platform remains secure, resilient and ready to support
  changing demand.

  Strengthen cost governance, consumption insight and
  attribution.

  Investment decisions are evidence-led and platform value is
  balanced with efficient use.

  Embed controls for access, masking, classification,
  environments and audit evidence.

  Data is handled safely and the organisation can demonstrate
  effective control to Risk, Compliance and Internal Audit.

  Coordinate portfolio plans, dependencies, risks and service
  handovers across internal and partner teams.

  Complex delivery moves forward with clearer ownership, fewer
  blockers and controlled transition into service.

  Champion automation, CI/CD and infrastructure as code.

  Engineering flow improves, repeatable work is streamlined
  and legacy practices reduce over time.

  Influence architecture, governance and senior stakeholders
  through informed challenge.

  Technical choices connect to customer, regulatory and
  business outcomes rather than being made in isolation.



  Why this role matters

  Our Snowflake platform supports important regulatory,
  commercial and strategic outcomes. This role exists to turn
  that investment into a scalable, controlled and cost-
  effective engineering capability, while ensuring the
  organisation can trust the quality, resilience and
  governance of its data products.

  Reporting to the Senior Data Engineering Manager, you will
  lead 4 to 6 Lead Data Engineers and influence the wider
  squads around them. You will work with Architecture, Data
  Governance, Risk, Compliance, Internal Audit, Security,
  Operations, Service teams and third-party partners. You will
  also contribute to the Enterprise Design Forum and
  Architectural Community of Practice, giving you visibility
  beyond your immediate portfolio.

  Success will be seen in stronger engineering leadership,
  clearer standards, improved delivery flow, effective
  platform controls and informed decisions about cost and
  capability. You will have the authority to challenge
  constructively and the ownership to translate technical
  direction into measurable outcomes.



  Our Data Engineering approach:

  We believe in

  What that means

  Engineering with purpose

  We connect platform and modelling decisions to trusted data,
  customer outcomes and business priorities.

  Controlled by design

  Quality, security, resilience, cost and compliance are
  considered from the start, not added later.

  Constructive challenge

  We use technical evidence and sound judgement to test
  assumptions and improve decisions.

  Shared ownership

  Engineering, Architecture, Governance, Risk, Security,
  Operations and partners work together from design to service
  handover.

  Automation and flow

  We remove avoidable manual effort through CI/CD,
  infrastructure as code and repeatable engineering patterns.

  Developing capability

  We coach engineering leaders, share knowledge and create an
  inclusive environment where people can grow.



  Technology stack and engineering environment:

  Platform & Data Design

  Delivery, Control & Operations

  Snowflake multi-account architecture

  Role-based access control, warehouse strategy and platform
  operations

  Data Vault 2.0

  Data-product ownership, semantic modelling and analytics
  enablement

  Coalesce, dbt or comparable tooling

  Metadata-driven transformation and reusable engineering
  patterns

  Platform controls

  Data access, masking, classification and environment
  discipline

  Observability and resilience

  Monitoring, service readiness and evidence-led improvement

  Modern engineering

  Git, CI/CD, infrastructure as code, automation and
  controlled release



  Essential experience

  - Leadership experience within data engineering, including
    developing engineers or senior technical contributors and
    building capability across teams.
  - Deep Snowflake expertise at scale, covering platform
    architecture, role-based access control, operations,
    observability, warehouse strategy and cost governance.
  - Strong Data Vault 2.0 knowledge, with evidence of shaping,
    applying or owning modelling standards.
  - Experience with Coalesce, dbt or another metadata-driven
    transformation platform.
  - Experience overseeing complex engineering delivery across
    multiple teams, priorities, dependencies and service
    handovers.
  - Experience establishing governance for data access, masking,
    classification, environments and auditable control
    evidence.
  - Commercial judgement across platform consumption, cost,
    resilience, quality and investment decisions.
  - Confidence influencing senior technical and non-technical
    stakeholders, using evidence to question assumptions and
    challenge constructively.
  - Experience developing inclusive teams, addressing capability
    needs and supporting succession.
  - Experience working with third-party partners, distributed
    teams or similarly complex delivery structures.



  You do not need to match every point perfectly. We are
  interested in the technical authority, leadership experience
  and transferable knowledge you can bring, alongside your
  commitment to developing others and improving how
  engineering works.



  Useful, but not essential

  - Experience in financial services or another regulated and
    controlled environment.
  - SnowPro, Data Vault, data management, leadership or
    management qualifications.
  - Experience with semantic modelling, analytics enablement or
    internal data marketplaces.
  - Experience contributing to an enterprise design forum,
    architecture community or comparable governance group.
  - A relevant degree, although equivalent practical technical
    experience is equally valued.



  Career development

  This role offers broad exposure across enterprise
  architecture, governance, risk, security, operations and
  senior technology leadership. You will deepen your platform
  and portfolio leadership while developing Lead Data
  Engineers and influencing standards beyond your immediate
  teams.

  Future pathways could include broader senior data
  engineering leadership, platform leadership, enterprise data
  roles or architecture-focused opportunities. Your work with
  the Enterprise Design Forum and Architectural Community of
  Practice will help build the organisation-wide perspective
  needed for those next steps.



