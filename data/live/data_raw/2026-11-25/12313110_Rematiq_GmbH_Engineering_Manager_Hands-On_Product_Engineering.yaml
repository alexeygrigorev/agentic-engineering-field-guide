title: Engineering Manager (Hands-On, Product Engineering)
company: Rematiq GmbH
location: Berlin, DEU
work_type: FULL_TIME
company_size: 20 Employees
description: |
  REMATIQ is building AI software that helps life sciences and
  medical device companies bring products to market faster,
  without compromising the quality, traceability and
  compliance their industry demands. We turn hundreds of pages
  of complex regulations, like MDR and FDA guidance, into
  structured, actionable requirements that plug directly into
  our customers' development and quality processes.

  We work with leading companies including Philips, Siemens
  Healthineers, B. Braun and Novartis, and have recently
  closed our Series A.

  About the job

  We're growing from one engineering group into dedicated
  teams, and we're looking for a hands-on Engineering Manager
  to lead one of them: the team behind our core customer
  workflows, such as requirements formulation, document
  comparison, compliance checks and the AI agents that support
  regulatory and quality experts.

  This is a player-coach role. You'll lead a team of around
  six engineers, including product and ML engineers, and
  you'll stay close enough to the code to make good technical
  calls, review designs and step in when it matters. You won't
  be managing from the sidelines.

  You'll work closely with the team's product owner and
  designer, and report to the Head of Engineering.

  We believe in the value of in-person collaboration and work
  in a hybrid setup, with the team coming together in our
  office in the heart of Berlin-Mitte typically four days per
  week.

  What you'll do

  - Own the team's outcomes. Make sure what the team ships works
    for customers: quality, reliability, delivery and the
    long-term health of the system.
  - Lead and grow people. Run 1:1s, give direct feedback, help
    engineers grow their scope, and build a team where people
    hold outcomes, not tickets.
  - Hire. Help us grow the team with people who raise the bar.
  - Make delivery predictable. Work with product on priorities,
    own how the work is sequenced, and keep commitments to
    customers realistic and kept.
  - Hold the gaps. Notice what falls between people, features
    and teams, such as dependencies nobody wrote down or
    incidents nobody picked up, and make sure someone owns
    them.
  - Stay technical. Shape architecture with the team, review
    designs and code, and help debug the hard problems.
  - Improve how we work. Bring structure where it helps and
    remove it where it doesn't, in an engineering organisation
    where agents are part of the daily development loop.

  What we're looking for

  - Significant software engineering experience, with a strong
    technical background in building and running production
    systems, ideally in TypeScript.
  - 2+ years of managing engineers directly, including hiring,
    feedback and growing people.
  - Experience leading delivery on a product team, working
    closely with product managers and designers.
  - Strong technical depth. You stay close to the code, can
    review designs and implementations, debug complex issues,
    and make sound architectural trade-offs.
  - Clear, direct communication, in writing and in conversation,
    including when things are going badly.
  - High ownership. When something breaks for a customer, you
    treat it as yours to fix first and understand later.

  We'll be especially excited if you

  - Have led a team shipping AI or LLM-based features to
    enterprise customers.
  - Have worked in regulated or quality-heavy domains, where
    traceability and correctness matter.
  - Have grown a team through a scaling phase, for example from
    Series A onwards.
  - Have experience with ML engineers on your team, and know how
    to plan work where outcomes are uncertain.

  Why this is a great opportunity

  - Build the team, not just run it. Our team structure and ways
    of working for the next stage are still yours to shape.
  - Real ownership. You'll own a team and the product outcomes
    it's responsible for.
  - Stay close to the craft. A player-coach role by design, with
    real technical depth.
  - AI-agent-first engineering. Help define how an engineering
    team works when agents are part of the core development
    loop.
  - Meaningful impact. Help medical innovators reduce manual
    work and bring important products to market faster and
    more safely.
  - Compensation: Competitive salary and meaningful equity.
