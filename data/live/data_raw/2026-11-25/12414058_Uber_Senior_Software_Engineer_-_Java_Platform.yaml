description: |
  About the Team

  The Java Platform team is focused on empowering every Java
  engineer within Uber to efficiently deliver high-quality
  software solutions, excelling in cost efficiency, continuous
  innovation, and maximum engineering productivity. Our
  mission is to make writing the best Java code easy for all
  Uber engineers by building an end-to-end solution that
  leverages the latest language features to make Uber backend
  services performant, reliable, and efficient. Our work spans
  core platform pillars including Quality (linters, testing,
  profiling), Efficiency and Performance (JVM tuning,
  CPU/memory consumption), and Modernization (latest Java
  versions, GenAI automation).

  About the Role

  We are seeking a Senior Software Engineer to join the Java
  Platform team. In this role, you will be a key contributor
  to foundational platform initiatives, responsible for
  designing and implementing high-performance Java components.
  You will work with technical depth and a high degree of
  autonomy to deliver projects that enhance engineering
  productivity and system reliability across Uber's backend
  services. You will collaborate with other platform teams to
  drive the adoption of modern Java features and optimize
  ecosystem-wide performance.What You'll Do

  - Lead the architecture and implementation of crucial Java
    platform components, ensuring high performance,
    efficiency, and reliability.
  - Support long-term optimization and efficiency initiatives,
    such as enabling virtual threads and developing the
    TaskGraph framework for Java developers.
  - Participate in the strategic modernization of Uber's Java
    ecosystem by supporting the adoption of the latest LTS
    versions and enhancing developer tools.
  - Develop scalable and resilient platform designs that
    minimize operational support costs.
  - Collaborate with team members to foster a culture of
    knowledge exchange and continuous technical improvement.

  Basic Qualifications

  - A Bachelor's Degree in Computer Science or a related field
    (or equivalent experience).
  - 5+ years of full-time engineering experience.
  - Systematic problem-solving approach and knowledge of
    algorithms, data structures, and complexity analysis.
  - Strong understanding of distributed systems or stream
    processing.
  - Proficient in at least one programming language, such as
    Java, Golang, C#, or C++.

  Preferred Qualifications

  - 3+ years of experience building and managing large-scale
    distributed systems.
  - Highly proficient in Java.
  - Experience with JVM tuning, performance benchmarking, or
    continuous profiling.
  - Familiarity with leveraging AI/GenAI technologies to
    automate routine development tasks.
  - Great sense of ownership and a proactive bias towards
    action.

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.
  For San Francisco, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For Seattle, WA-based roles: The base salary range for this
  role is USD $202,000 per year - USD $224,000 per year.

  For Sunnyvale, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
  various benefits.

  About Us

  Ready to Ride?



  This isn't the kind of place where you follow a playbook —
  it's where you help write one. If you're driven by impact,
  energized by challenge, and ready to shape how the world
  moves — we'd love to hear from you.

  You may be eligible for bonuses, equity, and other
  compensation, as well as a range of benefits. Explore our
  benefits.

