description: |
  About Baringa

  Baringa is a global consulting firm that partners with
  leaders to drive change and create value. With deep industry
  expertise, and enabled by advanced technology, the firm
  helps clients to deliver with greater confidence and
  certainty. With over 2,000 people across the UK, Europe,
  North America, Asia and Australia, the firm combines global
  insight with local understanding.

  The firm works across energy and resources, financial
  services, government and public sector, consumer products
  and retail, pharmaceuticals and life sciences,
  manufacturing, and technology, media and telecoms, with
  capabilities spanning strategy, transformation and
  operational excellence – all powered by advanced technology,
  data, AI and digital innovation.

  Clients value Baringa’s collaborative approach and the way
  its teams integrate seamlessly – all working with a shared
  understanding of what matters most. The firm is known for
  its kind, curious experts who listen closely and care deeply
  about client success as they help clients transform energy
  markets, modernise financial platforms, expand telecoms and
  digital networks through advanced data analytics, enable
  digital services in government, and unlock growth in
  consumer sectors.

  Certified as a Great Place to Work around the world, Baringa
  has been recognised by the Financial Times in 22 categories
  of its UK Leading Management Consultants rankings, and by
  Forbes for four consecutive years as one of the World’s Best
  Management Consulting Firms.

  Our Data, AI, Solutions & Engineering practice are looking
  for experienced Data Engineers to join the team.

  In DAISE, we are focused on delivering value-adding,
  sustainable data capabilities, aligned to our client’s
  specific needs. This expertise is applied across clients in
  all of our industry market sectors (Financial Services,
  Products & Services, Energy & Resources, Pharmaceutical &
  Lifesciences and  Government).

  What you will be doing

  You will be using your experience to help our clients solve
  their most important data challenges. You would be also
  responsible to support the growth of our team, helping them
  to build the skills they need to solve our client’s
  challenges. Depending on the level, you can be a part of our
  leadership  team, shaping the direction of the practice,
  growing the business and leading our people. Typical
  engagements include:

  - Defining and implementing on premise or cloud architectures,
    for example, a cloud data warehouse, data lake or a data
    platform to enable digital transformation.
  - Working with clients in more traditional areas of data
    engineering such as, data warehousing, building
    operational ETL/ELT data pipelines across a number of
    sources, and constructing relational and dimensional data
    models
  - Performing maturity assessments across clients’ data
    capabilities and recommending improvements
  - Building technology blueprints and advising clients on the
    different technology options
  - Translating business requirements (both functional and non-
    functional) into solutions, ensuring compliance with the
    organisations strategy, policies and standards and in some
    cases, help customers to define new policies, principles
    and standards
  - Helping clients to identify risks and mitigations for their
    complex data programmes, as well as transition to modern
    cloud-based infrastructures (AWS, Azure, GCP) by
    leveraging related architecture patterns (e.g., APIs,
    events)
  - Working with clients in key areas of data governance, such
    as in defining principles including, but not limited to
    Master Data Management, Data Lineage and Data Security


  Your skills and experience

  We are seeking passionate and dynamic data engineers who are
  excited by empowering decision making with data, and keen to
  take an active part in the growth of the company. We’re
  looking for people who can both advise our clients and, when
  needed, get hands on in technical delivery to bring  a
  solution to life.

  - Passionate individual who is excited by problems with data
    and can bring a good mix of technical delivery and core
    consulting skills in client engagements

  - Ability to own and run complex client engagements, interact
    with leaders across industry, work with senior
    stakeholders to help them understand and frame their
    problems, assess their current state, and make impactful
    recommendations which help shape their thinking

  - Strong hands on expertise in data engineering, delivering
    data architectures, data pipelines and solutions that are
    robust and scalable using modern delivery frameworks and
    tools (e.g. Databricks)

  - Experience in using cloud technologies (Azure, AWS, GCP) as
    both infrastructure and as a service, as well as big data
    platforms either on-premise or cloud setup

  - Knowledge of different technology stacks including common
    legacy and modern stacks, experience of applying DevOps
    practices to data engineering as well as ability to build
    CI/CD pipelines

  - Competent in SQL and at least one modern programming
    language, such as Python

  - Understanding of key core concepts like distributed
    computing, batch & stream processing, functional and
    object-orientated programming, how pipelines are built and
    deployed on cloud, pipeline schedules and SLAs
  - Well-versed with documentation and artefacts that need to go
    along with the solution design and delivery work

  What a career at Baringa will give you
  Putting People First. Baringa is a People First company and
  wellbeing is at the forefront of our culture. We recognise
  the importance of work-life balance and flexible working and
  provide our staff amazing benefits. Some of these benefits
  include:

  - Generous Annual Leave Policy: We recognise everyone needs a
    well-deserved break. We provide our employees with 5 weeks
    of annual leave, fully available at the start of each
    year. In addition to this, we have introduced our 5-Year
    Recharge benefit which allows all employees an additional
    2 weeks of paid leave after 5 years continuous service.

  - Flexible Working: We know that the ‘ideal’ work-life balance
    will vary from person to person and change at different
    stages of our working lives. To accommodate this, we have
    implemented a hybrid working policy and introduced more
    flexibility around taking unpaid leave.

  - Corporate Responsibility Days: Our world is important to us,
    so all our employees get 3 every year to help social and
    environmental causes and increase our impact on the
    communities that mean the most to us.

  - Wellbeing Fund: We want to encourage all employees to take
    charge and prioritise their own wellbeing. We’ve
    introduced our annual People Fund to support this by
    offering every individual a fund to support and manage
    their wellbeing through an activity of their choice.

  - Profit Share Scheme: All employees participate in the
    Baringa Group Profit Share Scheme so everyone has a stake
    in the company’s success.

  Diversity and Inclusion

  We are proud to be an Equal Opportunity Employer. We believe
  that creating an environment where everyone feels a sense of
  belonging is central to our culture and that diversity is
  paramount to driving creativity, innovation, and value for
  our clients and for our people.

  An award-winning workplace

  You can be a part of our ‘Great Place to Work’ – with our
  commitment to women and well-being in the workplace for
  all. Click here to see some of our recent awards and how
  we’ve achieved this.

  Using business as a force for good.

  We maintain high standards of environmental performance and
  transparency, which can be seen through our commitment to
  Net Zero with our SBTI-verified Scope 1, 2 and 3 emissions
  reduction targets and our support of the Better Business
  Act. We report our progress publicly and ensure that we are
  also externally assessed and scored through organisations
  like CDP and EcoVadis - helping us to continually identify
  where we can improve.

  We have a long legacy of supporting the communities in which
  we work, and offer a variety of ways to contribute, by
  putting people first and creating impact that lasts. Our
  Corporate Social Responsibility (CSR) agenda is about giving
  back to the communities in which we live and work by sharing
  our skills, talent and time. In essence, we aim to empower
  and encourage everyone in the firm to contribute to the
  things we care about, and support registered charities and
  organisations with a clear social or environmental purpose
  to increase the positive impact they can have.

  Join us

  All applications received will be reviewed by a member of
  our Talent Acquisition team. We never rely solely on
  automated screening or AI tools to make hiring decisions.
  Your application will be considered for employment without
  regard to race, ethnicity, religion, gender, gender identity
  or expression, sexual orientation, nationality, disability,
  age, faith or social background. We do not filter
  applications by university background and encourage those
  who have taken alternative educational and career paths to
  apply. We would like to actively encourage applications from
  those who identify with less represented and minority
  groups. We operate an inclusive recruitment process,
  ensuring reasonable adjustments where needed. Please contact
  a member of our Recruitment Team to discuss further.

