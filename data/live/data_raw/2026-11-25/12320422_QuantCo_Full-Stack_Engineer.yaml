description: |
  Help us build great products

  QuantCo delivers impactful business solutions powered by AI
  & machine learning, bringing immense value to our clients.
  As a full-stack developer, you will be responsible for
  building the technology & tools that enable real people to
  turn machine learning insights into decisions and actions.
  You’ll work with our data scientists, AI engineers, product
  managers, other full-stack engineers, and users to create
  products that provide transparency and actionability to our
  solutions.  Full-stack engineers work in a truly end-to-end
  capacity at QuantCo, managing the complete software
  development lifecycle from initial conception and
  architecture design to deployment. You'll write business
  logic and manage server architecture, as well as integrate
  responsive, accessible, and intuitive user interfaces using
  modern web technologies.


  What we are looking for:

  - Proficiency with programming languages such as TypeScript
    and Python
  - Expertise in at least one popular web frontend framework;
    React is preferred
  - Expertise in designing and implementing backends for
    frontends
  - Experience with at least one popular DBMS
  - Ability to write clean, effective, and production-ready code
  - Experience with orchestration frameworks such as Terraform,
    Helm, or similar is beneficial, but not required
  - Business proficiency in English. Conversational proficiency
    in German is beneficial, but not required
  - Willingness to travel when necessary

  We warmly invite you to apply if:

  - You are a team player with an entrepreneurial mindset
  - You have a demonstrated ability to learn continuously, work
    independently, and make smart decisions with minimal
    supervision
  - You subscribe to the mindset “you build it, you run it” as
    you will be taking care of testing, deploying, and
    monitoring your code
  - You have the adaptability to work effectively in
    interdisciplinary teams of technical and non-technical
    individuals with many different backgrounds
  - You are motivated by building what is useful to our users
    and valuable to our customers

  What we offer



  You will be part of a smart, motivated, and driven team that
  revels in working on challenging problems and finding novel
  solutions; values our customers and users; and strives to
  deliver thoughtful and impactful products. You will be
  surrounded by people that respect each other and the
  contributions each of us brings. We offer a generous
  compensation package that includes a base salary, bonus,
  stock options, and relocation support along with additional
  location-based benefits.

  About QuantCo

  At QuantCo, we leverage expertise in data science,
  engineering, and economics to help organizations turn data
  into decisions. Started by 4 PhDs from Harvard and Stanford,
  we are now more than 180 professionals with extensive
  quantitative, engineering, and business experience. We are
  globally distributed with offices in Berlin, Boston,
  Cologne, Karlsruhe, London, Munich, San Francisco, and
  Zurich.



  Our solutions include algorithmic pricing, data-driven
  claims management, and high-dimensional forecasting systems.
  Our customers include some of the largest financial, retail,
  and healthcare organizations in the US and Europe. We impact
  core business processes and decisions by combining advanced
  data-driven insights with scalable engineering solutions.



  We are excited about writing mission-critical code that
  affects millions of people and impacts billions of dollars.
  If you feel the same way, we look forward to hearing from
  you.
