description: |
  Software Engineer - CloudDevOps Engineer

  Location: United Kingdom (Hybrid - Winchester or London
  office 1-2 times a week)

  What’s in it for you

  - Salary 41,600 to 62,400 dependent on experience
  - 6% pension contribution
  - Private Medical Insurance
  - 25 days annual leave
  - Access to flexible benefits including discounts on major
    brands, wellness programmes, gymflex, travel and dental
    insurance
  - A flexible and hybrid working culture

  Overview

  AWS will be your primary technical focus, drawing on your
  practical Cloud/DevOps engineering knowledge.

  Within a cross-functional team, you will contribute to
  design and implement infrastructure as code, CI/CD,
  networking, security, observability and automation. You will
  apply established standards and reference patterns, make
  implementation decisions within your scope and recommend
  improvements where patterns do not meet requirements.

  You will remain hands-on through delivery and production
  operations, ensuring your work is secure, reliable, cost-
  effective and supportable. You will participate in peer
  reviews, share knowledge and contribute to design
  discussions, working with Senior Engineers on complex
  troubleshooting.

  You will apply AI-assisted and agentic engineering using
  GitHub Copilot, Kiro, coding agents and MCP integrations
  within established engineering and security patterns. You
  will review and test outputs, seek guidance and retain human
  ownership of decisions and outcomes. GCP knowledge is
  beneficial for multi-cloud requirements; deep frontend or
  backend expertise is not essential.

  Accountabilities

  - Build and maintain secure, reliable AWS infrastructure
    across core services using established patterns.
  - Develop Terraform infrastructure as code, CI/CD pipelines
    and Git-based workflows.
  - Implement networking, IAM, encryption, secrets management
    and DevSecOps controls, including VPCs, subnets, routing,
    security groups, load balancing, DNS and logging.
  - Build and operate containerised workloads using Docker, ECS,
    EKS or Kubernetes.
  - Implement monitoring, dashboards and alerting using
    CloudWatch, Datadog or equivalent tools.
  - Troubleshoot infrastructure, networking and deployments;
    contribute to operational support, incident response and
    service improvement.
  - Support vulnerability remediation, patching and service
    lifecycle management.
  - Automate recurring engineering and operational tasks using
    scripting.
  - Review infrastructure code, pipelines and configurations;
    validate human and AI-generated outputs.
  - Contribute to cost optimisation, resource management and
    FinOps.
  - Maintain technical documentation, diagrams and operational
    runbooks.
  - Use AI responsibly and collaborate across Engineering,
    Security, Networks, Architecture and Service Management.

  Required Technical Skills

  - Practical AWS knowledge and cloud engineering practices,
    including core services, networking, IAM, security and
    reliable cloud-native operations.
  - Infrastructure as Code proficiency, ideally Terraform.
  - Git and CI/CD experience: GitHub Actions, GitLab CI/CD,
    Jenkins or AWS CodePipeline.
  - Linux and automation using Python, Bash, PowerShell or
    equivalent.
  - Docker and Kubernetes knowledge; ECS or EKS beneficial.
  - CloudWatch, Datadog or equivalent observability experience.
  - AWS Well-Architected Framework and DevSecOps awareness.
  - Experience with GitHub Copilot, Kiro or equivalent;
    awareness of agentic engineering workflows.
  - Awareness of GCP and comparable cloud concepts is
    beneficial.

  Other Key Skills

  - Analytical, problem-solving and troubleshooting skills.
  - Translate requirements into implementations within
    established standards.
  - Balance delivery with security, quality, reliability and
    maintainability.
  - Communicate and collaborate effectively across teams.
  - Contribute to production support, continuous learning and
    professional development, using sound engineering
    judgement.

  Qualifications

  - Degree in Computer Science, Engineering or a related
    discipline, or equivalent relevant industry experience.
  - AWS, Terraform, Kubernetes or related professional
    certifications are beneficial but not essential.



