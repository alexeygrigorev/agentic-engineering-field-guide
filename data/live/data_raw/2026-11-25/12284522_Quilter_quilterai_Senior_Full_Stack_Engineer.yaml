description: |
  About Quilter

  At Quilter, we are helping electrical engineers save time
  and accomplish more by automating the tedious and time-
  consuming task of designing printed circuit boards (PCBs).
  Our small team is composed of experts in electrical
  engineering, electromagnetic simulation, ML/AI, and high-
  performance computing (HPC). We are inventing and leveraging
  novel techniques to solve the decades-old problem of
  automating circuit board design where today hundreds of
  billions of dollars are spent. We have raised $25 million in
  Series B funding from some of the very best and are charging
  full-speed toward our goal.

  No matter where we come from, we're united by a common
  vision for the future and a core set of values we think will
  get us there:

  - Curiosity
  - Conviction
  - Rigor

  We’re looking for a Senior Full Stack Engineer to join
  Quilter’s Application Team and help us build the software
  platform behind the future of circuit board design. We are a
  team of generalists who pride ourselves on solving new
  challenges and always learning. You’ll work across the stack
  to create helpful and friendly user interfaces as well as
  the services backing them. As one of our early engineers,
  you’ll have massive ownership and influence over the
  direction of our product, architecture, and team culture.

  This role is ideal for someone who thrives in high-ownership
  environments, loves solving complex technical problems, and
  is excited by the idea of bridging the worlds of software
  and hardware development.

  Today, the team works mainly with Python and Typescript /
  Javascript so strong fundamentals with those tools is
  required.

  What You’ll Do

  - Build new customer-facing features from top to bottom (data
    models, API, UI, and beyond)
  - Create clean, intuitive UIs that empower customers to easily
    work with complex circuit board data
  - Develop and maintain performant and reliable backend
    services, data pipelines, and APIs
  - Collaborate with ML, EDA, and electrical engineering experts
    to integrate novel core algorithms
  - Contribute to architectural decisions, infrastructure
    design, and internal dev tooling
  - Own large parts of the product—from concept to deployment—in
    a fast-moving, early-stage team

  What We’re Looking For

  - 6+ years of experience as a software engineer, ideally in a
    startup or high-velocity environment, but also with some
    experience in a large collaborative team
  - Strong fluency in TypeScript / Javascript, Python, React,
    MongoDB, Docker, and Kubernetes
  - Strong experience with automated testing, CI/CD systems, and
    modern cloud infrastructure
  - Experience with LLM/agentic coding in an enterprise setting,
    with an understanding of how to maintain code quality
  - Comfortable designing APIs and building backend services
    from scratch
  - Enthusiastic about shaping product direction and working in
    a tight-knit, mission-driven team
  - Excellent communication skills and a collaborative mindset
  - Comfort navigating ambiguous or unscoped challenges with
    autonomy

  Nice to Have

  - Experience with C++, CUDA, or ML workflows
  - Experience with PostgreSQL, Terraform, Kubernetes, AWS
  - Interest or hands-on experience with hardware—from designing
    PCBs to tinkering with Arduinos, breadboards, or embedded
    systems
  - Exposure to high-performance computing, simulation tools, or
    CAD systems

  Please note: We are an equal opportunity employer. At this
  time, we are focused on hiring primarily within the US, with
  occasional exception to accommodate exceptional talent.

  What we offer:

  - Interesting and challenging work
  - Competitive salary and equity benefits
  - Health, dental, and vision insurance
  - Regular team events and offsites (~4x / year)
  - Unlimited paid time off
  - Paid parental leave

  Want to learn more about Quilter, our vision, and our
  investors? Visit our About page and visit our Blog.
