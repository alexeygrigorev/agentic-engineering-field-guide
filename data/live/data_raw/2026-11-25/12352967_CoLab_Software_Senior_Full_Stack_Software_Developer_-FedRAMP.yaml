description: |
  About CoLab

  At CoLab, we help mechanical engineering teams bring life-
  changing products to market years sooner.

  We build AI for engineers designing cars, medical devices,
  and jet engines. Products this complex aren't sketched and
  sent to production. Teams spend months on iterations,
  reviews, and tests, predicting how every part performs
  before anything is built. CoLab is where those reviews
  happen, and we capture the rationale behind every change.
  Other tools show what changed between versions. Only CoLab
  knows why. That's how our AI helps manufacturers like
  Bobcat, Triumph Motorcycles, and GE Appliances make better
  decisions, eliminate rework cycles, and get to market
  faster.

  Proudly based in St. John’s, Newfoundland, CoLab started
  with one customer in 2018. Since then we’ve raised a $72M
  Series C, been named the 57th fastest growing company in
  North America by Deloitte (Fast 500™), signed multi-year AI
  partnerships with companies like Bombardier, and grown to a
  team of 250+.

  About the Role We're building out CoLab's commercial product
  in AWS GovCloud to serve customers with stringent security
  and compliance requirements. We're looking for an
  exceptional full stack engineer to help make it happen. As
  one of the first Software Developers on our FedRAMP team,
  you'll own significant portions of this effort end-to-end.
  From architecture decisions to backend services, databases,
  and frontend experiences, you'll be responsible for turning
  a complex technical vision into a working product.

  This isn't a role where you'll inherit a neatly defined
  backlog. You'll need to navigate ambiguity, make sound
  technical decisions, and write production-quality code
  across the stack. The scope is substantial, the constraints
  are real, and your work will directly shape how CoLab serves
  an entirely new segment of customers.

  Our Ideal Candidate You're a deeply technical builder who
  thrives when given ownership of a difficult problem. You're
  equally comfortable designing backend systems, building
  frontend features, and working through unfamiliar
  infrastructure challenges.You don't need someone to break a
  large initiative into tickets for you. You can define the
  path forward, communicate tradeoffs, and bring others along.
  You balance speed with engineering discipline, and you're
  comfortable being accountable for the outcome—not just your
  portion of the code.

  Job Responsibilities

  - Lead analysis and development efforts required to bring
    CoLab’s commercial product features into our FedRAMP Class
    D (High) certified application, hosted in AWS GovCloud.
  - Design and build across our stack: React, TypeScript,
    JavaScript, Python, and PostgreSQL.
  - Direct technical designs that balance security, scalability,
    maintainability, and delivery.
  - Translate FedRAMP requirements into practical engineering
    solutions alongside security and compliance partners.
  - Take complex compliance challenges from technical discovery
    through implementation, testing, and production.
  - Establish engineering patterns and foundations that future
    FedRAMP team members can build upon.

  Qualifications

  - Extensive experience building and shipping complex,
    production-grade SaaS applications.
  - Experience developing and implementing solutions requiring
    FIPS 140-3 validated cryptography and hardening apps for
    regulated environments
  - Deep hands-on expertise across frontend and backend
    development, including React, TypeScript, Python, and
    PostgreSQL.
  - Strong AWS experience, including cloud architecture,
    security, and deployment.
  - Demonstrated ownership of large, complex technical
    initiatives from start to finish.
  - Experience designing secure, reliable, maintainable systems.
  - Clear communication, sound technical judgment, and a
    collaborative approach to solving difficult problems.
  - Must be a U.S. person (U.S. citizen or lawful permanent
    resident) residing in the U.S.

  Bonus:

  - Experience with AWS GovCloud, FedRAMP, regulated
    environments, or compliance-driven software development.
  - Experience integrating with AI providers for SaaS
    applications

  Extra Details This is a full-time, permanent position with
  competitive compensation, stock options, health benefits and
  a 401K match. The role can be worked remotely from anywhere
  in the United States.

  Equity Note Frequently cited statistics show that people who
  identify with historically marginalized groups are likely to
  apply to jobs only if they meet 100% of the qualifications.
  We encourage you to help us break that statistic and apply
  even if you don’t meet every single qualification—your
  potential is what matters most to us.
