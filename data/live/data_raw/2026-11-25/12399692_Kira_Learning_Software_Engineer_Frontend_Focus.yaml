description: |
  We live in a world where technology is rapidly changing the
  educational experiences of students and teachers everywhere,
  and we have the opportunity to shape how this change takes
  place. Kira's mission is to harness transformative AI
  technologies to make world-class personalized teaching and
  learning accessible to everyone. Kira is a rapidly growing
  startup backed by top-tier Venture Capital funds including
  New Enterprise Associates (NEA), Andrew Ng's AI Fund, and
  Primavera. Our platform is now live in classrooms across El
  Salvador, so what you ship reaches students and teachers at
  national scale.

  As a mid-level Software Engineer, you will own meaningful,
  multi-week features that teachers and students use every
  day: React/TypeScript product surfaces, real-time and AI-
  streaming UI, and the APIs behind them. This role is for an
  engineer with roughly 3–6 years of experience who already
  ships independently and wants more ownership, scope, and
  influence on a small, high-trust team. You'll partner
  closely with product and design, learn from senior engineers
  through code review and design discussions, and contribute
  some backend work as projects require.

  This is a full-time position that may require flexibility
  with work hours and availability outside of regular business
  hours. We have offices in San Francisco, CA and New York
  City, NY. We ask that employees work from one of the two
  locations and come into the office in person 4 days a week
  (Wednesdays WFH).

  What You'll Do

  - Own and ship end-to-end frontend features, from scoping
    through production, with increasing independence and
    minimal hand-holding
  - Build polished, accessible UI in React and TypeScript for
    teachers and students, including real-time and LLM-backed
    experiences
  - Work across the stack as needed: backend services, APIs, and
    the data behind them (our stack includes Kotlin/Spring
    Boot, Python, and MySQL)
  - Partner with product managers and designers to shape
    requirements, UX quality, and tradeoffs
  - Debug real production issues and improve reliability,
    performance, and code quality
  - Write tested, production-quality code deployed through our
    CI/CD pipeline
  - Use AI coding tools (such as Cursor and Claude Code) as part
    of your daily workflow, and review and understand
    everything they produce
  - Contribute to design discussions and code reviews, and help
    raise the bar for newer engineers

  What We're Looking For

  - Bachelor's or Master's degree in Computer Science or a
    related field, or equivalent technical experience
  - 3–6 years of professional software engineering experience
    (we're open to standout candidates outside this range),
    with a frontend-leaning focus
  - Strong React and TypeScript experience, including ownership
    of multi-week, user-facing features in production
  - Strong CSS skills and an eye for UX quality, with experience
    in systems such as Tailwind or SCSS
  - Working backend and full-stack fundamentals: APIs,
    relational databases (for example MySQL), and willingness
    to ramp up on Kotlin and Python
  - Familiarity with automated testing and CI/CD practices for
    reliable frontend delivery
  - A substantive project you can walk us through in detail:
    what you owned, the decisions and tradeoffs you made, and
    what you would do differently
  - AI-assisted development as a real workflow (Cursor, Claude
    Code, or similar), with the judgment to question, debug,
    and explain what the AI produces
  - Independent debugging ability: you can diagnose and fix
    issues without heavy guidance
  - Clear written and verbal communication, including explaining
    technical tradeoffs to product and design partners
  - Comfort in a fast-paced, early-stage environment with
    changing priorities, and genuine interest in Kira's
    mission in education

  Nice To Have

  - Startup or fast-growing company experience
  - Prior Kotlin or Spring Boot experience
  - Experience building streaming, real-time, or LLM-backed UI
  - Cloud experience (ideally AWS)
  - Experience building for accessibility, localization, or low-
    bandwidth and varied-device users
  - Mentoring interns or junior engineers

  What We Offer

  - Competitive compensation and equity. For applicants in the
    US, the salary range for this role is $165,000 - $195,000
    depending on relevant experience and skill set
  - Medical, dental, vision and life insurance, including a
    medical insurance plan with 100% coverage of employee
    premiums
  - Flexible PTO policy and company holidays
  - DoorDash credit for lunch daily
  - Wellhub Membership: 100% company-paid access to premium gym
    networks (Orangetheory, SoulCycle), 60+ wellness apps
    (Headspace, MyFitnessPal, Apple Fitness+), and 1:1
    coaching sessions spanning fitness, mental health,
    nutrition, and sleep
  - 401(k) matching
  - Dog friendly office

  Equal Employment Opportunity Employer

  At Kira, we are committed to providing an environment of
  mutual respect where equal employment opportunities are
  available to all applicants without regard to race, color,
  religion, sex, pregnancy (including childbirth, lactation
  and related medical conditions), national origin, age,
  physical and mental disability, marital status, sexual
  orientation, gender identity, gender expression, genetic
  information (including characteristics and testing),
  military and veteran status, and any other characteristic
  protected by applicable law. Kira believes that diversity
  and inclusion among our employees are critical to our
  success as a company, and we seek to recruit, develop and
  retain the most talented people from a diverse candidate
  pool. Selection for employment is decided on the basis of
  qualifications, merit, and business need.

  Background Check

  Kira will make a conditional job offer in line with local,
  state and federal laws, and a subsequent criminal,
  education, and employment history background check will then
  be issued.
