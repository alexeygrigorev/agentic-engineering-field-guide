description: |
  We're looking for a full-stack engineer to join our Product
  Engineering team, reporting to one of the Engineering
  Managers of the Marketplace area, with a dotted line to the
  Marketing SEO Manager, focused on supporting the Growth and
  Marketing area. This role will have a 60% focus on Front
  End, and 40% focus on Back End.

  You'll work on Treatwell’s Marketplace products and help
  Treatwell be discovered, understood, and chosen across 13
  markets: SEO foundations, site performance, experimentation,
  analytics instrumentation, and the product surfaces that
  connect customer intent with booking, alongside three
  product engineering teams in the Marketplace area,
  contributing across the full breadth of what makes
  Treatwell's marketplace tick. As a full-stack engineer,
  you're the person who can move fluidly between teams
  accelerating growth and marketing efforts wherever the need
  is greatest.

  You bring the mindset of someone who cares about how people
  find Treatwell, what experience they land on, and whether
  the product helps them make a confident booking. You are
  comfortable partnering with marketing and growth
  stakeholders, while staying grounded in engineering quality
  and product outcomes.

  ➡️ Our product is built on:

  - Backend: Java, Spring Boot, RabbitMQ, PostgreSQL, MS-SQL
  - Frontend: React, TypeScript, Cypress, Jest
  - Infrastructure: Kubernetes, GitLab CI/CD, AWS, Datadog
  - Mindset: DevOps, DDD, event-driven architecture

  💡 About Treatwell

  Hi, we’re Treatwell. Nice to meet you.

  We’re a team of 800 passionate and brilliantly talented
  people across Europe. We’re the industry’s smartest salon
  management software, all connected to Europe’s leading
  bookings platform, working with over 95,000 salon partners
  across 14 countries, processing over 14 million bookings
  every month. And….breathe.

  But we’re not done yet. We’re on an exciting journey to
  digitally revolutionise the hair and beauty community.

  If this excites you, we might just have the role for you.

  🧐 You will be responsible for:

  - Growth and marketing engineering - build and evolve the
    technical foundations that support customer acquisition,
    activation, and retention across Treatwell's markets
  - Discoverability - improve how search engines and users
    understand Treatwell's marketplace, without turning the
    role into a pure SEO implementation function
  - Experimentation and measurement - instrument your work,
    support testing frameworks, and help teams validate ideas
    with data before scaling them
  - Product surfaces - ship user-facing improvements to landing
    pages, discovery journeys, and conversion flows, owning
    the work from problem framing through production
  - Platform quality - own your services end-to-end, from
    architecture through deployment, with a DevOps mindset
    baked in
  - Cross-functional clarity - translate growth and marketing
    opportunities into clear engineering work, challenge scope
    when needed, and keep quality standards high

  🔝 About you:

  - You have proven experience owning production-grade web
    applications end-to-end, and understand that the best
    technical decisions come from deeply understanding the
    problem - not just the code (mid/senior level)
  - You own features end-to-end - from database schema to UI,
    without needing a handoff
  - You think in systems and trade-offs, not just tickets - you
    spot the upstream cause, not just the downstream symptom
  - You have a product mindset - you think about the person
    using what you build, ask why before how, and push back
    when something doesn't make sense
  - You're data-driven and hypothesis-led - you instrument your
    work, measure impact, and use evidence to make decisions
  - You can partner with non-engineering stakeholders, turning
    ambiguous growth or marketing needs into sensible
    technical options
  - You will act as the key technical partner for marketing
    stakeholders, evaluating the feasibility of their
    requests, managing expectations, and finding the right
    trade-off between business speed and technical quality
    (TBC).
  - You are able to make progress in evolving or complex domains
    while collaborating to create clarity - growth work often
    moves fast, and you know how to navigate that without
    getting paralysed
  - Experience with SEO, experimentation, analytics,
    performance, or growth-related product areas
  - Experience with AI-assisted development tools such as
    Claude, Cursor, or similar - and clear opinions about
    where they genuinely add value is a plus
  - You can communicate fluently in English.
  - You are based in any city within Italy, Spain, UK or
    Netherlands with a valid right to work - candidates
    outside of these countries will not be considered.

  NOTE: If you don't meet every requirement but believe you'd
  thrive in this role, we'd still love to hear from you.

  💼 We’ll treat you with:

  - 28-days holiday, plus bank holidays 🏖️
  - Monthly £/€40 Treatwell vouchers so you can treat yourself
    too 💅🏻
  - 100% remote position 🧑🏻‍💻
  - Market-specific benefits that will be discussed in the
    interview process

  ⚖️ Equal Opportunities

  Treatwell is an 'Open to All' employer and warmly welcomes
  everybody to the team. We are committed to making reasonable
  adjustments to the recruitment process as required. Please
  add any adjustment requests to your application.
