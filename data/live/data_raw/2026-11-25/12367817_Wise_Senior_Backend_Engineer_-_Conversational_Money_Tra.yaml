description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We're looking for a Senior Backend Engineer to join Customer
  Activation team. New Send Money customers struggle  for many
  reasons: a confusing step, a missing detail, not knowing
  what to do next. Your job will be to remove each of those
  reasons by letting customers set up a transfer just by
  talking to our AI assistant.

  Every new customer compares Wise with their bank and our
  competitors, and their experience with the first few
  transfers decide whether they stay and tell their friends.
  The team influences and owns the experience, and that makes
  this team one of the biggest drivers of Wise's growth.
  You'll build the backend behind those moments, across Send,
  Add money, Pay-in flows and Money tracker. You'll also help
  move our assistant from text conversations to actionable UI
  responses, so customers can complete a transfer, not just
  ask about one. Conversational transfers are still new in
  banking, and we want to lead the way.

  How we work:

  - We're a cross-functional team of Backend, Web, iOS and
    Android engineers working closely with a Product Manager,
    Analyst and Designers, based in London and Budapest.
  - Engineers take part in product discovery, ideation from day
    one, not just delivery.
  - We make decisions based on data and experiments.
  - We own our product features end to end, from architecture
    plan to production.
  - We use AI-assisted development throughout the whole process.
  - We value strong feature ownership, knowledge sharing and
    stable, scalable systems, and we learn and iterate fast.



  What will you be working on?:

  - Finding where new customers get stuck on each currency route
    and building flows that let them finish on their own.
  - Influencing key architectural decisions and building robust,
    scalable backend systems.
  - Powering our AI assistant's move from text replies to
    actionable UI responses.
  - Shaping the new customer roadmap for Send, Add money, Pay-in
    flows and Money tracker.
  - Owning projects end to end, from the first idea to delivery,
    and coordinating the engineers working on them.
  - Working closely with every discipline in the team: PM,
    Designers, Analyst, and mobile and web engineers.
  - Working with other teams, stakeholders and regional teams
    who know their local customers, and aligning everyone on
    shared goals.



  What do you need?:

  - Real interest in AI and LLM-based products, and a solid
    understanding of how agentic systems work (tool calling,
    planning, guardrails).
  - A strong product mindset: you put customers first and make
    decisions based on data.
  - A sense of ownership and the communication skills to drive
    projects across teams.
  - A proven ability to get things done without formal authority
    by influencing, aligning and moving work forward.
  - 4+ years of experience with Java or Kotlin, plus the Spring
    framework and microservice best practices.
  - Experience making architectural decisions and designing
    distributed, concurrent systems.
  - Experience with relational databases, schema design and
    query optimisation.
  - Hands-on knowledge of system integration patterns and CI/CD
    pipelines.
  - A commitment to good coding practice: clean, testable code,
    TDD, code reviews and open feedback.



  Nice to have:

  - Experience building or working with AI and LLM-based
    products.
  - Hands-on use of AI coding tools at every stage of
    development, from design and coding to testing, review and
    debugging.



