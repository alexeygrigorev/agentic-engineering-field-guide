description: |
  Technology

  Our Technology Practice partners with organizations to
  design, build, and scale innovative digital solutions that
  drive measurable business impact. We bring together product
  strategists, engineers, architects, data experts, and
  transformation leaders to solve complex challenges across
  cloud, data, AI, cybersecurity, enterprise platforms, and
  modern application development. We don't just implement
  technology, we translate business strategy into scalable,
  secure, and future-ready solutions. Our teams work at the
  intersection of innovation and execution, helping clients
  modernize legacy systems, accelerate digital transformation,
  and unlock the full value of emerging technologies. We
  foster a collaborative, growth-oriented environment where
  technologists are empowered to solve meaningful problems,
  continuously learn, and deliver high-impact outcomes.

  What We're Looking For:

  We're looking for a Manager, Platform Engineering &
  Reliability Engineering to own the cloud platform foundation
  and the site reliability engineering (SRE) practices that
  let our product and engineering teams build, deploy, and
  operate services reliably. This person will design and run
  the landing zones, cloud networking, policy-as-code
  guardrails, billing constructs, and Internal Developer
  Platform (IDP) that give teams secure, self-service
  environments to build in, while building the observability
  and reliability disciplines that keep those services healthy
  and prevent incidents before they happen. They'll partner
  closely with our core infrastructure team, who own the
  underlying physical network and identity substrate the
  platform runs on, and will lead and grow a team of platform
  and SRE engineers.

  What You’ll Do:

  - Architect and own our cloud platform foundation — landing
    zones, management group and subscription hierarchies,
    cloud networking (hub-spoke or Virtual WAN topologies,
    private endpoints, firewalls), and account/billing
    constructs that give teams secure, cost-visible
    environments to build in.
  - Enforce guardrails and policy as code — implementing Azure
    Policy (or comparable), management group governance,
    security baselines, and automated compliance checks so
    teams can move fast within safe boundaries.
  - Build and operate our Internal Developer Platform (IDP) —
    self-service provisioning portals, golden-path templates,
    CI/CD pipelines, and paved-road tooling that let
    engineering teams stand up environments without filing
    tickets.
  - Own platform and reliability outcomes — defining and
    managing service level indicators (SLIs), service level
    objectives (SLOs), and error budgets, and driving
    observability maturity across our cloud and hosted
    platforms.
  - Lead incident response and operational discipline — incident
    classification, escalation procedures, blameless
    postmortems, runbooks, and change management.
  - Partner across teams — working closely with our core
    infrastructure team to align cloud networking and platform
    security with the underlying infrastructure, and with
    product teams to remove delivery blockers.
  - Build and mentor your team — hiring and developing SRE and
    platform engineers and defining clear career paths.

  What You Need to Succeed:

  Required:

  - 8+ years of experience in platform engineering, site
    reliability engineering, or cloud engineering.
  - 3+ years in a team leadership role, or as a senior
    individual contributor with mentorship experience.
  - Bachelor's degree in Computer Science, Information Systems,
    or equivalent technical leadership experience.
  - Hands-on experience running production Azure environments at
    scale — compute, networking fundamentals, identity (Entra
    ID / hybrid identity), and observability tooling such as
    Prometheus or Grafana.
  - Experience with infrastructure-as-code (Terraform, Bicep, or
    comparable), CI/CD pipeline design, and self-service
    developer platforms.
  - Practical experience defining and operating SLIs, SLOs, and
    error budgets, and leading incident response and
    postmortem processes.
  - Strong communication skills, with experience translating
    technical trade-offs for non-technical stakeholders and
    executive leadership.

  Preferred:

  - Experience running SRE teams or establishing SRE practices
    within an infrastructure or platform engineering
    organization.
  - Experience managing through organizational change, including
    reorganizations or operating model shifts.
  - Familiarity with core infrastructure domains (networking,
    identity, on-premises compute).
  - Experience with AWS infrastructure.
  - Familiarity with NIST 800-53, CIS Benchmarks, or CMMC/DFARS
    requirements as applied to platform or reliability
    engineering.

  Compensation:

  The approximate compensation range for this position is
  $124,454 – $194,383. This compensation range is a good faith
  estimate for the position at the time of posting. Actual
  compensation will be dependent upon factors including, but
  not limited to, relevant experience, qualifications,
  education, skill set, and geographic location.

  Why Choose Us:

  - Medical, dental, vision insurance
  - 401(k) Retirement Plan
  - Health Savings Account (HSA)
  - Flexible Spending Account (FSA)
  - Life, AD&D, short-term, and long-term disability
  - Professional and personal development
  - Generous paid time off
  - Commuter and wellness benefits
  - Tuition reimbursement

  About UsMichael Baker International, a leading provider of
  engineering and consulting services, including design,
  planning, architectural, environmental, construction and
  program management, has been solving some of the world’s
  most complex infrastructure challenges for more than 85
  years with a legacy of expertise, experience, innovation and
  integrity.

  Based in Pittsburgh and with over 100 offices nationwide, we
  partner with clients on everything from roads, bridges,
  tunnels, mass transit, and airports, to water treatment
  plants, arctic oil pipelines, environmental restoration and
  specialized overseas construction. We serve as a trusted
  adviser to the communities we serve, making them safer, more
  accessible, more sustainable and more prosperous.

  We provide visionary leadership in facilitating
  transformational change for our clients. Our work delivers
  differentiating innovations and dedicated experts who
  challenge the status quo and share a world of diverse
  experience and an impassioned entrepreneurial spirit. We
  deliver quality of life.

