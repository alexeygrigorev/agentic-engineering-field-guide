description: |
  Hi, We’re CompanyCam

  We’re a simple-to-use photo documentation and productivity
  app for contractors of every industry. Packed with intuitive
  functionality, CompanyCam facilitates unparalleled
  communication and accountability across a contractor’s
  entire business. By providing a consumer-grade, game-
  changing experience, we help contractors build trust within
  their company and with their users.

  CompanyCam is a fun, energetic team united by our core
  values of Show Up, Grow Up, and Do Good. As soon as you join
  our team, you'll notice that we trust our employees to do
  what's best for our product, customers, and team members and
  empower them to make the right calls.

  The Role

  We’re looking for a sharp, driven, problem-solving Senior
  Software Engineer (Ruby on Rails) to join our engineering
  team.

  As a Senior Software Engineer, you’ll work alongside other
  engineers, designers, and product managers to tackle
  everything from huge company initiatives to modest but
  important bug fixes. While your primary focus will be
  backend development, we value engineers who are T-shaped,
  bringing deep expertise in one area while being comfortable
  contributing in others. Whether that means diving into
  frontend code, supporting mobile efforts, or lending an
  extra set of eyes in discovery, you’ll collaborate with your
  teammates to move work forward.

  Most importantly, you’ll actively contribute to the
  evolution of the culture and processes of a growing
  engineering team, especially our backend engineering
  discipline. We want senior devs with experience effectively
  scaling codebases and iterating on processes as part of a
  growing team and with interest in mentoring to help our devs
  grow, too.

  Working At CompanyCam

  Our engineering team is remote-first, spanning every time
  zone in the United States. We welcome people from all
  backgrounds and really don't care whether or not you have a
  CS degree or even a high school diploma. All that matters is
  that you're not an a**hole and you're good at what you do.

  At CompanyCam we’re driven to produce work with meaningful
  outcomes. That means not just dumping features and
  “improvements” but being able to reflect and learn from our
  outputs.

  Our teams are made up of a product manager, a product
  designer, a tech lead and an appropriate number of engineers
  for the scope of your team. We take a flexible approach,
  pulling from Agile, Scrum, Kanban, and even Shape Up. Rather
  than being overly prescriptive, we provide guardrails and
  just enough constraints to keep teams moving. Each team is
  expected to collaborate, iterate, and refine their best
  practices to produce high-quality work.

  What You’ll Do

  - Design, implement and deliver complex, cross-cutting
    features and systems in Ruby on Rails, Postgres, GraphQL,
    and REST, and occasionally in React and React Native.
  - Lead efforts to address technical debt and system
    reliability, proactively identifying areas for refactoring
    or optimization.
  - Influence and evolve the architecture and system design,
    anticipating future needs and driving long-term
    improvements across services and applications.
  - Set and uphold high standards for code quality, testing
    coverage, and documentation, mentoring others to do the
    same.
  - Drive improvements to internal tooling, CI/CD pipelines, and
    monitoring systems to enhance developer experience and
    system resilience.
  - Facilitate technical discussions and decision-making,
    helping the team navigate trade-offs and align on best
    solutions.
  - Act as a point of escalation for complex technical
    challenges, supporting team members in unblocking
    progress.
  - Partner closely with product managers, designers, and
    engineers, shaping feature direction by identifying
    technical opportunities, risks, and trade-offs early in
    discovery.

  What You’ll Bring

  Must-haves

  These are our non-negotiables:

  - Show up: Have the courage to do difficult but necessary
    work.
  - Grow up: Take ownership, learn continuously, and bring a
    growth mindset.
  - Do good: Treat your teammates and customers the way you'd
    want to be treated.
  - 5+ years of professional software development experience.
    (Not all years of experience are created equal, so this
    one isn't set in stone).
  - Advanced proficiency in Ruby on Rails (and/or other MVC
    frameworks) and relational databases, with demonstrated
    ability to design and optimize scalable data models and
    APIs.
  - Familiarity with Redis, PostgreSQL, and Sidekiq in a
    production environment.
  - Experience contributing across the full stack, including
    front-end, back-end, and data layers.
  - Demonstrated experience in leveraging artificial
    intelligence (AI) to build, enhance, or optimize tools and
    features within products, driving innovation and improving
    user experience.
  - Ability to handle complex tasks and ambiguous problems
    without guidance.
  - Understanding of business trade-offs and ability to
    effectively communicate the risks and benefits of various
    technical approaches.
  - Strong collaboration skills with the ability to lift up the
    team by providing mentorship and proactive feedback.
  - You live and work permanently in the U.S. (We’re not set up
    to hire outside the U.S.).

  Nice-to-haves

  You’ll encounter the following technologies with varying
  frequency — experience with them is a plus, but not
  required:

  - AWS (S3, EC2, etc.)
  - ElasticSearch
  - MongoDB
  - React
  - React Native
  - Terraform (we don’t write much, but familiarity is helpful)
  - GraphQL
  - Experience integrating with large language models (e.g.,
    OpenAI, Gemini)

  Benefits and Compensation

  This is a salaried position at CompanyCam. Our salary range
  is $175,000 - $200,000 per year and is based on experience.
  We also offer meaningful equity and other benefits.

  CompanyCam is an equal-opportunity employer committed to
  respect, inclusion, and growth. We work hard, take
  responsibility, and support each other. Great ideas come
  from all backgrounds, and we carefully consider every
  applicant without regard to personal characteristics or
  traits. Even if your work experience doesn’t align
  perfectly, we encourage you to apply. What really matters to
  us is your potential, your passion, and your commitment to
  learning, innovation, and contributing meaningfully to our
  team.

  For any accommodations or technical issues related to the
  online application or interview process, please email
  jobs@companycam.com and we’ll respond promptly. Please do
  not include any medical or health information in your
  message.

  Note: Resumes sent to this email will not be reviewed or
  responded to. To be considered for a position, you must
  apply directly through our careers page.
