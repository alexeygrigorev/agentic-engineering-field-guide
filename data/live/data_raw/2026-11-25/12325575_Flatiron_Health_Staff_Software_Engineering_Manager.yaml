title: Staff Software Engineering Manager
company: Flatiron Health
location: London, GBR
work_type: FULL_TIME
company_size: 2,500 Employees
description: |
  We're looking for a data and technology-oriented Staff
  Software Engineering Manager to help us accomplish our
  mission to improve and extend lives by learning from the
  experience of every person with cancer. Are you ready to be
  the next changemaker in cancer care? Flatiron Health is a
  healthtech company using data for good to power smarter care
  for every person with cancer, around the world. Flatiron
  partners with cancer centers in the US, Europe and Asia to
  transform patients' real-life experiences into real-world
  evidence and create a more modern, connected oncology
  ecosystem. Our multidisciplinary teams include oncologists,
  data scientists, software engineers, epidemiologists,
  product experts and more. Flatiron Health is an independent
  affiliate of the Roche Group. What You'll Do This role will
  design and develop technology in partnership with software
  engineering teams in the UK, Germany, and Japan, as well as
  manage engineers within Europe. Additionally, this role will
  collaborate with other Flatiron employees in the US, and
  work day-to-day with oncologists, clinicians, product
  leaders, quantitative scientists, and customers to
  understand their challenges and how technology can help
  solve them. In addition you will:

  - Provide technical leadership, including shaping the
    direction of roadmaps and technology development.
  - Help build our European engineering teams and company
    culture as we grow.
  - Devise creative solutions for technical and business
    challenges
  - Rapidly iterate on products while maintaining engineering
    practices that ensure quality and security
  - Promote technical excellence and elegant infrastructure
    design with teammates and customers
  - Work with complex data pipelines using a variety of data
    processing tools
  - Bring or develop a deep knowledge of healthcare in the UK,
    including data sources, security requirements, and
    emerging trends

  Who You Are You're a kind, passionate and collaborative
  problem-solver who values the opportunity to think beyond
  the way things are. You're excited by the prospect of
  working on difficult and meaningful problems each day. You
  seek and give candid feedback, and value the chance to make
  an important impact on cancer patients and society.

  - You're an experienced software engineer with a minimum of 6
    years of relevant professional experience and 1-2 years
    managing engineers
  - You're willing to flex between Individual Contributor,
    Management and Tech Leadership as the team grows and
    changes
  - You are excited to work in a startup environment, think
    creatively and be scrappy to get the job done
  - You have a nose for value and empathy for your customers
  - You have experience with agile development environments
    using programming languages like Python, C#, SQL, Java and
    R, but are also language agnostic and willing to pick up
    new programming languages as needed
  - You believe in using boring technology (described in this
    blog post). You're willing to apply the right tools for
    the job
  - You are excited about working in a passionate, fast-paced,
    technology-driven culture
  - You can collaborate and easily explain technical terms to a
    non-technical, highly sophisticated audience
  - You are excited to talk to customers and help design
    collaboration models that scale across industries
  - You are comfortable with ambiguity and always willing to
    teach and learn

  Extra credit

  - You have experience working in healthcare in the UK
  - You hold a bachelors, masters, and/or Ph.D. in computer
    science or a related field
  - You have experience in machine learning, data engineering,
    infrastructure, devops, or security engineering

  If this sounds like you, you'll fit right in at Flatiron.
  Who We Are Our people are at the center of everything we do.
  We strive to foster a culture where our teammates feel
  equipped and empowered to make meaningful contributions with
  confidence, compassion, and clarity. Visit the Life at
  Flatiron page to learn more. Preferred Primary Location:
  London office The annual pay range reflected above for this
  position is based on the preferred primary location of the
  role which is listed in the job description. Salary ranges
  for other locations vary from the range reflected above.
  Base pay offered may vary depending on job-related
  knowledge, skills, and experience. An annual bonus and
  equity may be provided as part of the compensation package,
  in addition to a full range of medical, financial, and/or
  other benefits, dependent on the position offered.
