  General Summary:

   The Senior Manager, Software Engineering leads a team of AI
  and software engineers responsible for delivering multiple
  AI projects across the ConnectWise platform. This role
  combines people leadership, delivery ownership and technical
  judgment to turn business priorities into production-grade
  AI products, including machine learning models, LLM-powered
  features and AI agents. The Senior Manager works in
  partnership with product, data, platform and business
  stakeholders to set direction, manage priorities and ensure
  the team delivers high-quality outcomes on time and at
  scale.

  Essential Duties and Responsibilities:

    - Leads, hires, develops and retains a high-performing team of
      AI, machine learning and software engineers, including
      managers or technical leads where applicable.

  Knowledge, Skills, and/or Abilities Required:

  - Proven ability to lead and grow engineering teams and to
    manage multiple projects simultaneously with minimal
    supervision.

  - Strong understanding of the machine learning and generative
    AI lifecycle, including model development, fine-tuning,
    retrieval-augmented generation, AI agents, evaluation and
    production deployment.

  - Solid software engineering background, with the ability to
    review designs and guide decisions on distributed systems,
    microservices, APIs and cloud-native architecture.

  - Experience with MLOps and DevOps practices, CI/CD,
    containerization (Docker, Kubernetes) and production
    monitoring.

  - Knowledge of at least one cloud platform (e.g. AWS or Azure)
    and its AI and data services.

  - Strong project and program management skills, including
    agile methodologies, estimation, prioritization and
    stakeholder management.

  - Ability to interpret business requirements and translate
    them into clear technical strategies and delivery plans.

  - Excellent communication skills, with the ability to explain
    complex technical concepts to executives and audiences of
    varying technical understanding.

  - Strong decision-making, problem-solving and conflict-
    resolution skills.

  Educational/Vocational/Previous Experience Recommendations:

    - Bachelor's degree in Computer Science or a related field
      required; Master's degree preferred.

  Working Conditions:

    - Onsite/Hybrid/Remote depending on location

