description: |
  Citizens Financial Group, Inc. (CFG) seeks a Principal
  Software Engineer, Vice President for its Johnston, Rhode
  Island location.

  Responsibilities:

  •    Develop IT strategies/solutions for Banking and/or
  Financial services.  •    Ensure cutting edge solutions
  using the Sprint framework, Angular and best practices. •
  Manage, design, and lead the development of multiple digital
  channels. •    Lead a technical team of developers engaged
  in developing software for the bank, and mentor lead, and
  manage Java teams. •    Encourage the use of new and
  emerging technologies in order to deliver best in class
  software solutions. •    Manage risk identification and risk
  mitigation strategies associated with the architecture,
  understanding, and planning for evolutionary paths. •
  Implement high performing and scalable SOA/BPM based
  architecture solution, de- coupled from legacy applications
  via events over an Integration Hub. •    Prepare and present
  test plans, scan reports, technical presentations and
  analyst briefings addressing potential solutions and best
  practices. •    Utilize Java, Spring Boot, Spring Security,
  Spring Cloud, AWS, PaaS, laaS, Saas, Node JS, Angular, React
  JS, WebAssembly, JavaScript, Typescript, jQuery, Hibernate,
  GIT, UML, Oracle, and MySQL. •    Work with Driven Design
  Development (DDD), Test Driven Development (TDD) and
  Continuous Integration (Cl) software development approaches.
  •    Manage, design and lead the development of multiple
  digital channels. •    Undertake initial code spikes and lay
  down foundations of the architecture. •    Manage risk
  identification and risk mitigation strategies associated
  with the architecture. •    Work on Cloud Computing, GAIA,
  Jules, J2EE, Web Services, SOAP, REST and API Gateway
  Development. •    Developed POCs using Hadoop, Python,
  Express JS, Vue JS, Mongo DB, Docker, Kubernetes, Artificial
  Intelligence (Al) and Machine Learning (ML).

  Qualifications:

  Requires a Bachelor’s degree, or foreign equivalent, in
  Computer Science, Electronics Engineering, or related field
  and 7 years of progressive, post-baccalaureate experience as
  Principal Software Engineer, Assistant Consultant, or
  related position developing complex software and
  architectures.

  Must have 7 years of experience with:

  •    Writing, testing, integrating, and documenting product
  or system development code using full stack technologies
  within an Agile/Scrum environment; •    Creating, deploying,
  and maintaining enterprise-scale applications in production
  using CI/CD pipelines and Dockers; •    Applying principles
  and techniques of computer science, engineering, and
  mathematical analysis to develop complex software and
  architectures; •    Researching and analyzing data,
  including customer design proposals, market trends, state of
  technology, specifications, and manuals to determine the
  feasibility of design or application; •    Utilizing UID
  grids, and developing responsive/adaptive apps using
  TypeScript, D3js, jQuery, AJAX, AWS, Azure, Vue.js,
  Ember.js, Angular, React.js, Node, RESTful API, GraphQL,
  Terraform, PostgreSQL, Python, HTML5, CSS3, SASS, JavaScript
  (ES 6+), and Bootstrap; •    Utilizing TDD in JS using
  frameworks, including Jasmine, Mocha, and Karma; and •
  Designing with UI patterns and apps using Adobe Photoshop
  CC, Illustrator, Dreamweaver, InDesign, Visio, Azure RP, and
  InVision.

  100% telecommuting permitted from any US location.

  Worksite: One Citizens Bank Way, Johnston, RI 02919 United
  States, 40 hrs/wk. Salary Range: $210,184 - $210,184. EO
  employer.

  For summary of benefits and to apply visit our website at
  https://jobs.citizensbank.com  and apply online (Job ID:
  50563) or email resume and cover letter to
  Recruiting@Citizensbank.com with subject line: 50563.

  For an overview of our benefits, visit
  https://jobs.citizensbank.com/benefits.

  Direct applicants only.


