description: |
  About Snorkel

  Snorkel AI is the frontier AI data lab, helping teams build
  the data and environments behind high-performing frontier
  and agentic AI. We combine technology with research-driven
  AI data development to create datasets, benchmarks, evals,
  and custom solutions for real-world AI systems. Founded out
  of the Stanford AI Lab in 2019, Snorkel works with leading
  AI labs and enterprises to move from better data to better
  outcomes.  Excited to help us redefine how AI is built?
  Apply to be the newest Snorkeler!

  About the Role

  Snorkel AI is hiring an Engineering Manager to lead a team
  building the foundational systems of our AI data factory.
  Customers come to us for evals, benchmarks and training
  data. This agent-first platform is how we produce at scale
  and quality. You’ll be responsible for large eval workflows
  that run end to end, from the infrastructure that executes
  them to the tooling that tunes them. It also includes the
  tools to create and review both data and the RL environments
  across many current and future modalities.

  You’ll own the roadmap, technical strategy, and execution
  quality of your team. You’ll find where the biggest leverage
  is for our internal teams and build the systems that remove
  bottlenecks, whether that’s cutting the time to stand up a
  new eval, supporting a new modality, or making expert review
  faster and more reliable. You’ll work across our Platform,
  Delivery and Research teams to build reusable platform
  capabilities. You’ll know the systems well enough to
  challenge designs and propose better ones while meeting the
  urgency required at the frontier of AI.

  What You’ll Do

  - Set the team’s technical direction, operating model,
    roadmap, and execution standards.
  - Lead engineers as they turn one-off scripts, notebooks, and
    prototypes into systematized, scalable, production-grade
    services.
  - Own technical and execution decisions, partnering with tech
    leads on architecture, design reviews, and quality.
  - Partner with teams across the company to understand what
    they’ve proven out and translate it into scalable
    engineering solutions.
  - Establish standards for design reviews, testing, CI/CD,
    observability, on-call, and SLOs so systems run reliably
    at scale.
  - Set clear priorities, plans, and delivery commitments,
    balancing systematization work with reliability,
    governance, cost, and developer velocity.
  - Build scalable playbooks, internal tooling, and shared
    libraries so promising ideas can be systematized more
    quickly.
  - Hire, develop, and retain a strong engineering team.
  - Coach engineers and tech leads to take ownership beyond
    their immediate projects.
  - Provide technical guidance, review designs, unblock
    difficult problems, and step into the code when it
    matters.
  - Help productionize new approaches and continuously improve
    Snorkel’s engineering capabilities.

  What You’ll Bring

  - 6+ years of software engineering experience, with strong
    technical depth.
  - 2+ years of experience managing a team of engineers.
  - A track record of taking promising but one-off
    approaches—such as scripts, prototypes, or experimental
    workflows—and turning them into reliable, scaled
    production systems.
  - Strong technical judgment across backend and data-platform
    engineering, including distributed systems, data
    pipelines, APIs, and cloud infrastructure. You can
    evaluate architecture decisions, not just delegate them.
  - Experience hiring, developing, and retaining strong
    engineers.
  - Clear communication skills and the ability to understand
    stakeholder needs and translate them into engineering
    plans.
  - Experience establishing engineering standards and
    operational practices, including testing, CI/CD,
    observability, and on-call, in a fast-moving environment.
  - A pragmatic approach to systematization: you know the
    difference between infrastructure for its own sake and
    infrastructure that helps the company ship.
  - Comfort with ambiguity and fast iteration; you can set
    direction before every requirement is settled.

  Locations

  New York; San Francisco Bay Area

