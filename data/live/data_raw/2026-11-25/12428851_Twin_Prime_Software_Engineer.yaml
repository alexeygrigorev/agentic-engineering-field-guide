  Software Engineer



  Location: New York, USA; Athens, Greece (On-site)



  About Twin Prime

  Twin Prime is an AI lab built for reasoning in the physical
  world, especially in defense and security settings. Founded
  by researchers and engineers from leading frontier model
  companies and quant funds, we build architectures that
  reason across complex sensor modalities in real time. We are
  headquartered in New York City and are currently expanding
  our footprint in the EU by way of Athens, Greece.



  The Role

  We are looking for engineers interested in high-performance
  systems, distributed infrastructure, and deployment in
  constrained environments. Ideal candidates have experience
  building reliable and scalable systems in research or
  production environments. Areas of work include:

  - Distributed systems and compute infrastructure
  - Edge deployment and runtime optimization
  - High-performance data processing
  - Systems reliability and observability
  - Infrastructure tooling and automation
  - Performance-critical software systems
