  About the Role

  We are seeking an experienced Backend Engineer to join a
  platform engineering team supporting core customer-facing
  applications across web and mobile platforms at a leading
  enterprise technology organization.

  In this role, you will design, develop, and maintain
  scalable backend services while collaborating with
  Engineering, Product, UX, Business, and Analytics teams. You
  will contribute to high-impact platform initiatives, build
  reliable API integrations, and help introduce advanced
  capabilities such as Generative AI into production systems.

  The ideal candidate has strong hands-on experience with
  Node.js, TypeScript, and Rust, along with a deep
  understanding of web technologies, distributed systems, and
  high-traffic application architecture.

  This is a full-time opportunity requiring a commitment of 40
  hours per week.

  RequirementsKey Responsibilities

  - Lead the development and delivery of backend features in
    collaboration with cross-functional engineering teams.
  - Design, develop, test, and maintain scalable, efficient, and
    high-quality backend services using Node.js, TypeScript,
    and Rust.
  - Build and optimize server-to-server integrations and API
    layers using REST and GraphQL.
  - Develop backend solutions that support high-traffic,
    customer-facing web and mobile applications.
  - Integrate AI/ML capabilities, including Generative AI, into
    production services and product workflows.
  - Leverage AI-powered development tools to improve engineering
    productivity and software delivery.
  - Participate in technical architecture discussions, solution
    design, and implementation planning.
  - Conduct code reviews and ensure adherence to best practices
    for security, scalability, performance, and
    maintainability.
  - Monitor application performance, troubleshoot production
    issues, and drive continuous system improvements.
  - Work across the complete software development lifecycle,
    including testing, deployment, and CI/CD processes.
  - Mentor team members, share technical knowledge, and
    contribute to overall engineering excellence.

  Core Qualifications

  - 5+ years of professional software engineering experience, or
    a Bachelor's degree in Computer Science or a related field
    with at least 3+ years of relevant experience.
  - Experience building and maintaining production-grade backend
    systems in established, high-scale technology
    environments.
  - Strong hands-on backend development experience with Node.js
    and TypeScript.
  - Practical coding experience with Rust, preferably in
    production services, performance-critical modules, or
    large-scale systems.
  - Strong understanding of web fundamentals, including:
  - Experience building, scaling, or maintaining high-traffic
