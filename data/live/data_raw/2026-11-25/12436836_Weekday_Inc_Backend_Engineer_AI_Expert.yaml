  - Strong understanding of backend architecture, API design,
    and distributed systems.
  - Ability to write clean, efficient, testable, and
    maintainable code.
  - Demonstrated career progression with experience taking
    ownership of senior-level engineering responsibilities.
  - Excellent written and verbal communication skills, with the
