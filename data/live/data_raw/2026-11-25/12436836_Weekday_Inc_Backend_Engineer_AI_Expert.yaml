  - Senior backend engineers with strong production experience
    in Node.js, TypeScript, and Rust.
  - Professionals who have worked on scalable, customer-facing
    platforms.
  - Engineers with strong system design capabilities and an
    understanding of web technologies at scale.
  - Individuals who can independently own technical deliverables
