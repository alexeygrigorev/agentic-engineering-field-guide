description: |
  We power people’s progress.

  At Preply, we’re all about creating life-changing learning
  experiences. We help people discover the magic of the
  perfect tutor, craft a personalised learning journey, and
  stay motivated to keep growing. Our approach is human-led,
  tech-enabled - and it’s creating real impact.

  We’ve just reached unicorn status with a $150M Series D,
  accelerating our vision to transform education through
  human-led, AI-enhanced learning. Today, 100,000+ tutors
  teach 90+ languages to learners in 180 countries - and we’re
  only getting started. As a category-defining company, we’re
  shaping what the future of learning looks like at global
  scale.

  Every Preply lesson sparks change, fuels ambition, and
  drives progress that matters. Joining Preply means helping
  define the future of education at global scale, and building
  something that truly matters for millions of people, every
  day.

  Meet the Team!

  At Preply, we build scalable and reliable applications using
  Python/Django, with a strong focus on data, A/B testing, and
  feedback from students and tutors to guide our decisions. We
  prioritize product quality through robust monitoring,
  metrics analysis, and continuous optimization. Thanks to our
  advanced CI/CD processes, we release code 50–60 times per
  day.

  We’ve reached 90%+ adoption of AI coding tools across
  engineering, and we’re now moving towards more autonomous,
  AI-Augmented development at scale. At Preply, engineers have
  direct access to the best tools available, with the freedom
  to use them fully and experiment as they build.

  As a fast-growing company, we face a wide range of technical
  challenges, giving our engineers plenty of opportunities to
  grow and make an impact, some of which we even share on our
  Engineering Blog. Please, also visit our Tech Radar and our
  YouTube channel to learn more about the technologies we use
  at Preply!

  We're looking for an Engineering Manager to join the MarTech
  team.

  Preply invests heavily in marketing to reach learners around
  the world. Our MarTech teams make that investment go
  further, building tools to automate campaigns, create
  content at scale, and measure what works across paid
  marketing, SEO, and AI Search.

  As an Engineering Manager in MarTech, you’ll lead engineers
  building these platforms and help shape their technical
  direction. Working closely with Marketing, Product, and
  Data, you’ll solve complex problems with a direct impact on
  business growth.

  What you’ll be doing:

  - Lead and grow high-performing engineering teams, building a
    culture of ownership, collaboration, and technical
    excellence.
  - Coach and develop engineers through regular feedback,
    mentorship, and career development, creating an
    environment where people can grow and take ownership.
  - Set the vision and strategy for your teams, shaping how
    technology, data, and AI help Preply scale marketing,
    acquisition, and measurement.
  - Identify and prioritise high-impact opportunities,
    partnering with Product, Marketing, and Data to focus on
    initiatives that improve marketing efficiency and drive
    business growth.
  - Own execution and delivery, turning strategy into clear,
    realistic plans and balancing speed, quality, and
    reliability.
  - Provide technical leadership, guiding system design and
    architectural decisions, diving into complex problems, and
    helping teams navigate trade-offs.
  - Champion engineering best practices, improving code quality,
    reliability, observability, security, and development
    processes.
  - Partner across Marketing, SEO, Brand, Product, Data, and
    Legal, aligning on priorities and outcomes while ensuring
    reliable tracking, high-quality data, and responsible
    handling of privacy and consent.

  What you need to succeed

  - Engineering and management experience: A strong software
    engineering background and 4+ years of experience leading
    and developing engineering teams, with a track record of
    delivering business-critical products or platforms.
  - Relevant domain experience: Experience in MarTech, AdTech,
    Growth, tracking and attribution, paid marketing, or SEO
    platforms. We’re also open to related experience building
    data-intensive systems, automation, or platforms that
    support marketing and business teams.
  - People leadership and team building: A passion for building
    high-performing teams and helping people grow. You create
    clear expectations, give actionable feedback, and support
    engineers through coaching, mentorship, and career
    development.
  - Strong technical judgment and systems thinking: You’re
    comfortable guiding architectural discussions, evaluating
    technical trade-offs, and partnering with senior engineers
    on technical strategy. You know when to seek more input
    and when to make a decision and give clear direction.
  - Product and business partnership: You work closely with
    Product, Marketing, and Data to identify opportunities,
    set priorities, and drive measurable outcomes. You connect
    technical decisions to customer needs and business goals.
  - Strong execution and focus on results: You turn broad goals
    into realistic plans, manage dependencies, and help teams
    achieve ambitious, measurable outcomes while balancing
    speed, quality, and reliability.
  - Clear communication and thoughtful leadership: You explain
    complex topics simply, bring stakeholders together around
    decisions, and lead with empathy, transparency, and
    accountability. You create an environment where people
    feel safe to challenge ideas, learn, and take ownership.

  Why you’ll love it at Preply:

  - An open, collaborative, dynamic and diverse culture;
  - A generous monthly allowance for lessons on Preply.com,
    Learning & Development budget and time off for your self-
    development;
  - A competitive financial package with equity, leave allowance
    and health insurance;
  - Access to free mental health support platforms;
  - The opportunity to unlock the potential of learners and
    tutors through language learning and teaching in 175
    countries (and counting!)

  Our Principles

  - Care to change the world - We are passionate about our work
    and care deeply about its impact to be life changing.
  - We do it for learners - For both Preply and tutors, learners
    are why we do what we do. Every day we focus on empowering
    tutors to deliver an exceptional learning experience.
  - Keep perfecting - To create an outstanding customer
    experience, we focus on simplicity, smoothness, and
    enjoyment, continually perfecting it as every detail
    matters.
  - Now is the time - In a fast-paced world, it matters how
    quickly we act. Now is the time to make great things
    happen.
  - Disciplined execution - What makes us disciplined is the
    excellence in our execution. We set clear goals, focus on
    what matters, and utilize our resources efficiently.
  - Dive deep - We leverage business acumen and curiosity to
    investigate disparities between numbers and stories,
    unlocking meaningful insights to guide our decisions.
  - Growth mindset - We proactively seek growth opportunities
    and believe today's best performance becomes tomorrow's
    starting point. We humbly embrace feedback and learn from
    setbacks.
  - Raise the bar - We raise our performance standards
    continuously, alongside each new hire and promotion. We
    build diverse and high-performing teams that can make a
    real difference.
  - Challenge, disagree and commit - We value open and candid
    communication, even when we don’t fully agree. We speak
    our minds, challenge when necessary, and fully commit to
    decisions once made.
  - One Preply - We prioritize collaboration, inclusion, and the
    success of our team over personal ambitions. Together, we
    support and celebrate each other's progress.

  Diversity, Equity, and Inclusion

  Preply.com is committed to creating an inclusive environment
  where people of diverse backgrounds can thrive. We believe
  that the presence of different opinions and viewpoints is a
  key ingredient for our success as a multicultural Ed-Tech
  company. That means that Preply will consider all
  applications for employment without regard to race, color,
  religion, gender identity or expression, sexual orientation,
  national origin, disability, age or veteran status.
