description: |
  Be the one building AI-powered experiences where they matter
  most.

  At Genesys, we help organizations create better customer
  experiences through AI-powered experience orchestration. Our
  platform connects people, systems, data and AI to help
  organizations deliver more personalized service, improve
  operational efficiency and build stronger customer
  relationships.

  Help build, support and operate technology used by more than
  8,000 organizations in over 100 countries – moving AI from
  possibility to production in real-world enterprise
  environments every day.

  Principal Software Engineer

  Join the Innovation team at Genesys, where we’re redefining
  customer experience by building innovative, scalable
  solutions integrated with Genesys Cloud. We’re looking for a
  Principal Software Engineer to help design and deliver high-
  performance applications using AWS infrastructure. This is a
  unique opportunity to shape next-generation systems that
  impact customers around the globe.

  Key Responsibilities:

  - Develop advanced Agentic AI solutions leveraging the latest
    capabilities and tools available on the Genesys Cloud
    platform.
  - Utilize AI-powered tools and frameworks to significantly
    accelerate code development and increase overall
    efficiency.
  - Design and implement robust integrations to enhance and
    extend Agentic AI functionalities.
  - Build scalable, high-performance backend applications using
    Go.
  - Create dynamic, intuitive, and responsive front-end
    components with JavaScript and TypeScript.
  - Deploy and manage containerized applications using
    Kubernetes on AWS.
  - Integrate with Genesys Cloud APIs to deliver seamless
    enhancements to customer experience (CX) workflows.
  - Optimize application performance, scalability, and
    reliability within cloud-native environments.
  - Collaborate closely with product managers, architects, and
    UX designers to define technical requirements and deliver
    exceptional solutions.
  - Write clean, maintainable, and well-documented code that
    adheres to industry best practices and engineering
    standards.
  - Troubleshoot and resolve complex production issues with
    speed and precision.
  - Actively participate in peer code reviews and provide
    mentorship to junior engineers.

  Required Qualifications:

  - Minimum of 10+ years of professional software development
    experience
  - 2+ years working with AI solutions
  - Proven expertise in agentic AI development, including hands-
    on experience with RAG, RAG pipelines and MCP framework
  - Proficiency in Go for backend development
  - Strong experience in system prompt engineering and tool use
    configuration and tuning
  - Strong experience with JavaScript and TypeScript for front-
    end and full-stack applications
  - Hands-on expertise with Kubernetes for orchestration and
    container lifecycle management
  - Proven experience building and deploying cloud-native
    solutions on AWS (e.g., EKS, Fargate, Dynamo DB, EC2, ECS,
    Lambda, S3)
  - Solid understanding of microservices architecture and
    RESTful API design
  - Strong analytical and problem-solving skills with attention
    to detail
  - Bachelor’s degree in Computer Science, Engineering, or a
    related discipline, or equivalent practical experience

  Preferred Qualifications:

  - Experience integrating with Genesys Cloud APIs or comparable
    customer experience platforms
  - Exposure to UX design principles or experience developing
    intuitive user interfaces
  - Familiarity with AWS-native services such as CloudFormation,
    Step Functions, or DynamoDB
  - Demonstrated contributions to open-source projects or a
    strong GitHub portfolio

  - Experience with DevOps tooling including Docker, CI/CD
    pipelines, and Terraform
  - Knowledge of Agile/Scrum methodologies and team
    collaboration practices

  Compensation:

  This role has a market-competitive salary with an
  anticipated base compensation range listed below. Actual
  salaries will vary depending on a candidate’s experience,
  qualifications, skills, and location. This role might also
  be eligible for a commission or performance-based bonus
  opportunities.

  $165,400.00 - $290,800.00

  Benefits:

  - Medical, Dental, and Vision Insurance.
  - Telehealth coverage
  - Flexible work schedules and work from home opportunities
  - Development and career growth opportunities
  - Open Time Off in addition to 10 paid holidays
  - 401(k) matching program
  - Adoption Assistance
  - Fertility treatments

