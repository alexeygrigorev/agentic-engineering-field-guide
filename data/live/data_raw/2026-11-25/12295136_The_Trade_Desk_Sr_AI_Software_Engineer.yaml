description: |
  The Trade Desk is a global technology company and the
  world’s leading independent platform for digital
  advertising, with over 3,000 employees across more than 30
  offices. Our technology helps advertisers reach the right
  audiences across the open internet — from streaming TV and
  podcasts to mobile apps, news, and more.   Advertising
  powers the content people love. By making it more
  transparent, effective, and responsible, we help support
  trusted journalism, quality entertainment, and creators
  worldwide. The world’s brands and agencies rely on us to
  reach their customers and grow their businesses responsibly.
  The scale of our platform brings unique technical challenges
  — from processing massive datasets in real time to building
  systems that operate reliably on a global scale. When you
  work here, your impact is worldwide. We welcome diverse
  perspectives, encourage curiosity, and build teams that
  learn from one another. If you’re driven to solve meaningful
  challenges, we’d love to meet you.

  What we do:

  You’ll join a software engineering team that builds internal
  AI solutions supporting teams across The Trade Desk. We use
  large language models (LLMs), retrieval-augmented generation
  (RAG), agentic systems, custom MCP servers, and enterprise
  platforms like Anthropic Claude to improve productivity,
  streamline workflows, and reduce operational friction.

  Our team also plays a key role in AI enablement across the
  company—supporting teams as they adopt Copilot, Claude and
  similar tools, designing and deploying custom AI agents, and
  guiding partners through their AI journey from idea to
  impact.

  As a Senior AI Software Engineer on this team, you’ll be an
  end-to-end owner—collaborating closely with stakeholders,
  identifying opportunities, and delivering tools that make a
  real impact. We’re a nimble, fast-paced, and highly
  collaborative group that thrives on transforming the way
  teams operate and driving greater value across The Trade
  Desk.

  What you'll do:

  Some of the work that you will be doing to help us deliver
  on our mission is:

  - Partner with Business teams across The Trade Desk to
    understand Business processes, identify opportunities,
    scope and prioritize use cases, and define success metrics
    before building.
  - Design and build agents and agentic workflows, including
    background and conversational agents, that orchestrate
    tools, data, and business processes end to end to solve
    real-world problems and deliver measurable business value
    within enterprise guardrails.
  - Design and build custom MCP servers that securely expose
    enterprise data, APIs, and internal systems to AI agents,
    with well-designed tool schemas, proper authentication,
    least-privilege permission scoping, and observability.
  - Design and deploy intelligent agentic systems that integrate
    large language models (LLMs) with enterprise data, tools,
    and workflows using modern agent SDKs and orchestration
    frameworks.
  - Rapidly prototype, validate with real users, then harden the
    winners into supported solutions or hand them off to the
    owning team.
  - Drive adoption through training, office hours, playbooks,
    reusable templates, and reference implementations that
    other teams can self-serve from.
  - Drive quality and performance through automated testing,
    evaluation suites, monitoring, and data-driven evaluation
    of success criteria, user adoption, cost, and operational
    efficiency.
  - Mentor teammates and contribute to a culture of innovation,
    technical excellence, and continuous learning.

  Who you are:

  - You have a Bachelor's/Master's level degree in computer
    science or relevant engineering-related field or
    equivalent experience.
  - You have 6-8+ years of experience in software engineering,
    forward deployed engineering, solutions engineering, or
    technical consulting, including 1-2+ years building LLM-
    powered solutions that reached real users in production.
  - You are proficient in Python and/or TypeScript and
    comfortable with additional languages such as C# or SQL.
  - You're excited about AI, including helping teams adopt
    Anthropic Claude, building agents, workflows and MCP
    servers, and guiding others through their AI journey.
  - You have hands-on experience with LLM APIs, tool use, and
    prompt engineering, and you've built MCP servers or
    equivalent function-calling integrations, or can show
    you'd ramp up quickly.
  - You have experience with enterprise identity and access,
    including OAuth, SSO/Entra ID, and scoping permissions so
    an agent can only do what the user is allowed to do.
  - You have experience productionizing applications and
    implementing CI/CD pipelines to ensure reliable, scalable
    deployments.
  - You are skilled in data ingestion and transformation using
    APIs, ETL pipelines, and connectors, and familiar with
    vector databases and retrieval strategies.
  - You treat evaluation and safety as core engineering work,
    including evals, tracing, prompt-injection defenses, and
    cost and latency management.
  - You communicate clearly across technical and non-technical
    audiences, can run discovery sessions and demos with
    business partners, and thrive in a collaborative, cross-
    functional environment.
  - You are a fast learner who adapts quickly to new
    technologies and solves complex problems with creativity
    and pragmatism.

