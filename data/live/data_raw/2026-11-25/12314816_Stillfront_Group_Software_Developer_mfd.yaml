description: |
  Who we are

  Sandbox Interactive is the ambitious game development studio
  behind the award-winning game Albion Online. The game is the
  first true cross-platform MMO, and is playable on Windows,
  Mac, Linux, iOS and Android with more than 350.000 daily
  players and over 2 million monthly visitors on our website.
  We started as a small independent group of experienced
  gaming professionals in 2012, and now employ an
  international team of more than 110 people. Since 2020,
  Sandbox Interactive has been part of the Stillfront Group.
  Our team is passionate about making Albion Online the best
  game it can be, and we’re constantly on the lookout for
  talented individuals to join our growing team in the heart
  of Berlin.

  Your Game

  As a member of the Web Team, you'll play a crucial role in
  supporting the successful delivery and operation of Albion
  Online. While our team does not develop the game itself, we
  manage all the essential services that ensure a seamless
  experience for players. This includes managing the Albion
  Online website, handling registration and login processes,
  facilitating in-game purchases, and supporting operational
  tools for shop management and customer service.

  Our infrastructure is both complex and demanding. We operate
  services that require high performance and 24/7
  availability. We are committed to developing and maintaining
  these systems to ensure excellent reliability and deliver
  the best possible experience for our users.

  As a Software Developer you will:

  - Work on projects for both internal and external audiences,
    collaborating with adjacent teams and stakeholders
  - Develop our frontend and backend systems, with a primary
    focus on web UI development
  - Support the evolution of established systems into modern
    architectures
  - Contribute to the code quality of the team by participating
    in code reviews
  - Advance unit and integration testing of microservices
  - Assist in analyzing and fixing issues on the production
    environment

  Your TalentMinimum Qualifications:

  - Bachelor's or Master's degree in Computer Science or a
    related field
  - Over 3 years of experience as a software engineer working
    across both backend and frontend development, however with
    a strong emphasis on web UI development
  - A passion and skill for implementing web page layouts with
    high fidelity to the original design
  - Proficiency in React, JavaScript/TypeScript, HTML, and CSS
  - Practical experience with Java and Spring Boot
  - Understanding of microservice architecture, API design, REST
  - Experience with relational databases
  - Experience with the code review process
  - Solid communication skills (presentation, verbal and
    written) in English

  Preferred Qualifications:

  - Practical experience with PHP and the Symfony framework
  - Practical experience with Redis and RabbitMQ

  Our Offer

  - BVG corporate ticket:
    - Receive a free company ticket for Germany's public
      transportation system
  - Personal Development:
    - Have a high degree of autonomy and ownership from the start
    - Develop your skills through company-sponsored training and
      language courses
    - Enjoy company-sponsored tickets for Gamescom Dev & other
      game conferences
  - Hybrid Work model:
    - Combine the best of both worlds, and enjoy the freedom to
      switch between working in the office and working
      remotely
  - Health & Wellbeing:
    - Discounted membership to Urban Sport Club for fitness and
      wellness
    - Access to nilo health for confidential mental health
      support, coaching, and wellbeing resources
    - Extra vacation days awarded based on years of service, up to
      a maximum of 30 days annually
  - Modern & Well-Equipped Office:
    - Work in the heart of Prenzlauer Berg, a central, vibrant
      neighborhood in Berlin with many dining and
      entertainment options
    - Enjoy height-adjustable tables, ergonomic chair options,
      dimmable lighting, and acoustic panels
  - Start-up perks:
    - Benefit from free drinks and snacks in the office
    - Participate in team events, breakfast weeks, summer and
      winter parties
  - Sustainable business:
    - Be part of a successful, profitable company on a continued
      growth path
  - Gaming-driven culture:
    - Work alongside a supportive team of gaming enthusiasts who
      are deeply committed to their craft
  - Global reach:
    - Join a team of industry experts shaping a game enjoyed by
      hundreds of thousands worldwide
