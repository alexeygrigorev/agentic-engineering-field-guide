description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Engineer who works alongside business clients to map how
  their operations run, then builds the server-side
  connections and automation that keep software dependable in
  live use. The position blends hands-on engineering with
  direct client collaboration and rollout planning.

  What you'll do

  - Meet with clients to learn how their day-to-day operations
    and finance processes work, then convert them into
    scalable engineering solutions.

  - Connect software to major business platforms using APIs and
    data pipelines.

  - Write server-side code, automations and bespoke features for
    individual clients in Python and Django.

  - Team up with product and engineering colleagues to find
    recurring needs that can be added to the shared codebase.

  - Help scope client projects, shape rollout plans and join
    periodic in-person working sessions at client sites.

  Requirements

  What we're looking for

  - More than five years of professional software development,
    with particular strength in server-side work.

  - A track record of linking software with third-party services
    or moving data between systems.

  - Experience translating non-technical stakeholders' goals
    into engineering plans.

  - Prior delivery of live code into a client setting, spanning
    deployment and infrastructure work across the stack.

  - Sound grounding in computing principles, such as
    architecture design and weighing database and language
    choices.

  - Previous employment at a leading technology firm or a well-
    known fast-scaling company.

  - Regular use of AI-assisted coding tools.

  - Working knowledge of Python, TypeScript or Rust.

  - Prior experience creating new solutions or bespoke workflows
    for clients from the ground up.

  Bonus points

  - Prior work building autonomous software agents or launching
    machine-learning features, whether on the job or in
    personal projects.

  Benefits

  Compensation and benefits

  - Base salary: USD 180,000 to 300,000 per year

  - Equity

  - Health, dental and vision coverage

  - Flexible time off

  Location and work model

  - New York, NY, United States

  - Hybrid, with occasional on-site customer visits (about 1 to
    2 times per month)

  - Full-time
