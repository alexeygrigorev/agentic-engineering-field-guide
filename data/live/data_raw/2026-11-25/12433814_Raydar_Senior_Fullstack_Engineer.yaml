description: |
  About the company

  Our client is a real estate technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and scale backend services and React interfaces for a
  data-heavy software product, owning features from design
  through production. You will work directly with the founder
  and a small engineering group, taking on large processing
  workloads, analytics and automated AI-driven workflows.

  What you'll do

  - Extend and scale a Python web API that handles high-volume
    processing and visualization workloads.

  - Own internal automation and data service infrastructure,
    aiming to make it largely self-operating.

  - Work closely with the founder and a small engineering group
    to define problems and ship solutions, not just features.

  - Build ingestion and parsing pipelines for documents,
    messages and other data sources, and link that data to
    structured records.

  - Lead the design and delivery of an automated project
    management service, from architecture through production
    release.

  - Design efficient calculations, analytics and dashboard
    aggregations, and write React frontend code as needed.

  Requirements

  What we're looking for

  - Six or more years of software engineering work on intricate
    systems that handle large data loads.

  - Experience at early-stage or early-to-mid stage startups.

  - Deep backend skills in Python and its web frameworks.

  - Hands-on React experience and comfort splitting time roughly
    70/30 to 80/20 between backend and frontend work.

  - Prior work delivering high-throughput data handling, for
    example across imagery, documents or analytics workloads.

  - Has taken user-facing functionality from concept to release
    within a live browser application.

  - Has driven products from early user research through design,
    build and rollout.

  - Comfort working autonomously in a fast-moving environment
    with minimal guidance.

  Bonus points

  - Experience building agentic AI workflows or LLM-powered
    feedback systems.

  - Strong background in geometry and math for working with 3D
    spatial data.

  Benefits

  Compensation and benefits

  - Base salary: $230K - $280K

  - Equity

  Location and work model

  - New York, New York, United States

  - Hybrid, about 3 days a week in office

  - Full-time
