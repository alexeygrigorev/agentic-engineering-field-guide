description: |
  About Vercel:

  Vercel is the agentic infrastructure company, freeing people
  and agents to ship what's next. For more than a decade we've
  helped builders move from idea to production with speed,
  security, and exceptional developer experience.

  Now we're scaling our products for both agents and people to
  ship and run software, built in the open and trusted by
  OpenAI, PayPal, Ramp, Supreme, and millions of developers
  worldwide.

  About the role

  As a Software Engineer on Vercel’s Website team, you’ll
  build and own the software behind vercel.com and our public
  web experiences. Your work will span React and Next.js
  applications, shared libraries, APIs, and the services that
  power forms, analytics, content and more.

  You’ll work alongside engineers and design engineers to make
  our websites fast, accessible, reliable, and easier to build
  on. You’ll partner with marketing, data, security, and
  framework teams to turn business needs into maintainable
  software, investigate production issues, and improve the
  systems other teams use every day.

  We’re looking for someone who enjoys moving between the
  browser and the server, making architectural decisions with
  peers, and carrying work from an open-ended problem through
  rollout and ongoing ownership.

  This is a hybrid role with 3 in-office days per week in New
  York City.

  What you'll do

  - Build and maintain full stack features and shared services
    for Vercel’s websites, including form submission, content
    integrations, and analytics.
  - Design APIs and data contracts that connect browser
    experiences with backend and third-party services. Handle
    validation, retries, duplicate requests, and upstream
    failures.
  - Measure and improve loading, rendering, and navigation
    performance while preserving accessibility and accurate
    event tracking.
  - Turn repeated implementation work into reusable libraries,
    clear interfaces, documentation, and tools that engineers
    and coding agents can use independently.
  - Improve website security and privacy with the teams that own
    those requirements, including shared security policies and
    consent behavior.
  - Investigate production issues using logs, traces, and
    browser tools. Add meaningful verification and monitoring,
    and follow fixes through deployment.
  - Shape technical approaches with your teammates, ship changes
    in focused increments, and share responsibility for code
    review, migrations, and the long-term health of the
    website.

  What you need

  - 5+ years of professional software engineering experience
    building and maintaining production web applications.
  - Strong JavaScript and TypeScript skills, with hands-on
    experience shipping React and Next.js applications.
  - Experience writing server-side application code, designing
    APIs, integrating external services, and reasoning about
    data flow and failure handling.
  - A practical understanding of browser behavior, web
    performance, accessibility, and how server rendering and
    caching affect a website.
  - Experience debugging production problems and choosing tests
    and instrumentation that give you confidence a change
    works.
  - The ability to turn ambiguous requirements into a scoped
    plan, explain tradeoffs, and carry the work through
    implementation and rollout.
  - A collaborative approach to technical decisions and code
    review. You can give useful feedback, incorporate other
    perspectives, and make your work understandable to the
    people maintaining it.
  - Comfort using AI-assisted development tools while
    understanding, reviewing, and validating the code you
    ship.

  Bonus if you

  - Have built shared libraries, SDKs, developer tools, or
    infrastructure used by multiple applications.
  - Have worked on analytics, event pipelines, experimentation,
    forms, or consent systems.
  - Have experience with CMS integrations, technical SEO, or
    migrations in a large web codebase.
  - Have deployed applications on Vercel or contributed to open
    source.

  Compensation & Benefits:

  - Competitive compensation package, including equity.
  - Inclusive Healthcare Package.
  - Learn and Grow - we provide mentorship and send you to
    events that help you build your network and skills.
  - Flexible Time Off.
  - We will provide you the gear you need to do your role, and a
    WFH budget for you to outfit your space as needed.

  The San Francisco, CA base pay range for this role is
  $196,000 - $294,000. Actual salary will be based on job-
  related skills, experience, and location. Compensation
  outside of San Francisco may be adjusted based on employee
  location. The total compensation package may include
  benefits, equity-based compensation, and eligibility for a
  company bonus or variable pay program depending on the role.
  Your recruiter can share more details during the hiring
  process.

  #LI-NG1

