description: |
  WHAT MAKES US, US Join some of the most innovative thinkers
  in FinTech as we lead the evolution of financial technology.
  If you are an innovative, curious, collaborative person who
  embraces challenges and wants to grow, learn and pursue
  outcomes with our prestigious financial clients, say Hello
  to SimCorp!

  At its foundation, SimCorp is guided by our values — caring,
  customer success-driven, collaborative, curious, and
  courageous. Our people-centered organization focuses on
  skills development, relationship building, and client
  success. We take pride in cultivating an environment where
  all team members can grow, feel heard, valued, and
  empowered. If you like what we’re saying, keep reading!

  WHY THIS ROLE IS IMPORTANT TO US Our risk models team builds
  the analytics that investment professionals rely on to
  understand and manage risk. As our Lead Software Engineer,
  you will help evolve these Analytics software products so
  they keep meeting the needs of demanding clients. You will
  work closely with Product, Research and Customer Experience,
  and help shape a strong engineering culture across the
  organization.

  WHAT YOU WILL BE RESPONSIBLE FOR

  - Develop, maintain and enhance application code for our
    Analytics software products
  - Collaborate with our Product, Research and Customer
    Experience teams to ensure our solutions meet customer
    needs
  - Use databases, messaging, caching and other technologies to
    improve how our applications work
  - Collaborate with developers across the organization through
    guilds, sprint reviews and knowledge-sharing sessions to
    foster a vibrant engineering culture

  WHAT WE VALUE Most importantly, you can see yourself
  contributing and thriving in the position described above.
  We expect you to be proficient in several of the following
  skills and able to upskill to a high standard in the rest.

  Requirements:

  - 2+ years of experience with Python
  - Experience with Pandas and/or NumPy
  - 2+ years of practical experience with SQL and relational
    databases
  - 2+ years of building software with test automation and
    integration in mind
  - Experience in financial markets and products

  It would be a real plus if you have experience with:

  - Linux (highly preferred)
  - Azure and Azure cloud-native technologies, including
    Kubernetes or other scalable architectures
  - Agile software development practices and tools such as
    JIRA/Azure DevOps, GitHub and SonarQube
  - Working in an environment that follows Continuous Delivery
    best practices
  - A DevOps application ownership mindset

  BENEFITS

  - Global hybrid work policy – We ask you to work 2 days a week
    from the office. You can work remotely the other days if
    you choose.
  - Growth and development – We offer an individual approach to
    professional development to support the direction you want
    to take.
  - Inclusive and diverse company culture – We want people to
    bring different perspectives and contribute to a
    respectful workplace.
  - Work-life balance – We believe balance between professional
    and private life makes us better colleagues and better
    engineers.
  - Empowerment – All voices are valuable, and you will be
    involved in shaping our work processes.

  NEXT STEPS Please click below to apply and learn more about
  the vacancy and what SimCorp offers regarding salary,
  benefits and perks. Applications are continuously assessed,
  so please send your CV in English as soon as possible. The
  approximate time to consider your CV is three weeks.

  At SimCorp, we recognize that bias can unintentionally occur
  in the recruitment process. To uphold fairness and equal
  opportunities for all applicants, we kindly ask you to
  exclude personal data such as photo, age or any non-
  professional information from your application.

  If you are interested in being a part of SimCorp but are not
  sure this role is the right fit, submit your CV anyway.
  SimCorp is on an exciting growth journey, and our Talent
  Acquisition Team is ready to help you discover the right
  role for you.

  We are eager to continually improve our talent acquisition
  process and make everyone’s experience positive and
  valuable. Therefore, during the process we will ask you to
  provide your feedback, which is highly appreciated.

  WHO WE ARE For over 50 years, SimCorp have worked closely
  with investment and asset managers to become the world’s
  leading provider of integrated investment management
  solutions. We are 3,500+ colleagues with a broad range of
  nationalities, educations, professional experiences, ages,
  and backgrounds. Following the recent merger with Axioma, we
  leverage the combined strength of our brands to provide an
  industry-leading, full, front-to-back offering for our
  clients, with SimCorp as the overarching company brand and
  Axioma as a key product brand. SimCorp is an equal
  opportunity employer. We are committed to building a culture
  where diverse perspectives and expertise are integrated in
  our everyday work. We believe in the continual growth and
  development of our employees, so that we can provide best-
  in-class solutions to our clients. While striving to deliver
  client value, we believe it is vital to consider our people
  and our planet in every business decision we make. Acting
  responsibly is not optional. It is essential.

  SimCorp is an independent subsidiary of the Deutsche Börse
  Group.

