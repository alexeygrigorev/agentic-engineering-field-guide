description: |
  This is your opportunity to join AXIS Capital – a trusted
  global provider of specialty lines insurance and
  reinsurance.  We stand apart for our outstanding client
  service, intelligent risk taking and superior risk adjusted
  returns for our shareholders. We also proudly maintain an
  entrepreneurial, disciplined and ethical corporate culture.
  As a member of AXIS, you join a team that is among the best
  in the industry.

  At AXIS, we believe that we are only as strong as our
  people. We strive to create an inclusive and welcoming
  culture where employees of all backgrounds and from all
  walks of life feel comfortable and empowered to be
  themselves. This means that we bring our whole selves to
  work.

  All qualified applicants will receive consideration for
  employment without regard to any protected characteristic,
  including age, color, disability, ethnicity, gender
  identity, marital status, national origin, pregnancy, race,
  religion, sex, sexual orientation, veteran status, or any
  basis prohibited by the laws that govern its operations.

  EPM Software Developer Job Family Grouping: IT Group Job
  Family: IT Group > Application Development How does this
  role contribute to our collective success? This role is part
  of the team responsible for developing and supporting
  Finance and Regulatory Reporting applications used by AXIS
  Finance and Actuarial functions. Tagetik is the primary
  platform for the role, with a smaller element of work across
  the existing Oracle Hyperion and Essbase estate. The EPM
  Developer will work across new development, enhancement
  delivery and data integration. The role requires a blend of
  technical development capability, understanding of finance
  and regulatory reporting processes, and the ability to
  translate business requirements into reliable, controlled
  and supportable EPM solutions. The successful candidate will
  work with finance stakeholders, fellow developers, domain
  experts and technical teams including architecture and data
  governance. What will you do in this role? You will apply
  disciplined engineering practices and strong configuration
  and coding standards to the design, build, testing and
  support of EPM solutions. Key responsibilities include: •
  Design, develop, configure and enhance Tagetik applications
  supporting Finance, Actuarial and Regulatory Reporting
  requirements. • Deliver changes to regulatory reporting
  solutions, including Solvency II, in line with applicable
  EIOPA, PRA and CBI requirements. • Collaborate with Finance,
  Actuarial and Regulatory Reporting stakeholders to
  understand requirements, identify solution options and
  translate business needs into technical and functional
  designs. • Develop and maintain Tagetik processes,
  workflows, dimensions, data models, calculations, data
  mappings, reports and security configurations. • Build and
  maintain SQL queries and data-processing routines. • Develop
  and support integration and ETL/ELT processes between
  Tagetik and upstream systems, with appropriate
  reconciliation and validation controls. • Support financial
  consolidation, and other finance or regulatory reporting use
  cases implemented within the EPM estate. • Provide targeted
  development for legacy Oracle Hyperion and Essbase
  applications. • Analyse existing Hyperion and Essbase
  solutions, data flows and reporting logic to support
  remediation, knowledge transfer and migration planning. •
  Provide Level 3 production support, including incident
  investigation, root-cause analysis, bug fixing, performance
  troubleshooting and improvements. • Working with support
  teams to improve resilience, monitoring and recoverability.
  • Participate in Agile delivery activities and contribute to
  estimation, planning, peer review, continuous improvement
  and transparent communication of delivery risks. About You:
  We encourage you to bring your own experience and expertise
  to the table, so while there are some qualifications and
  experiences, we need you to have, we are open to discussing
  how your individual knowledge might lend itself to
  fulfilling this role and help us achieve our goals. What you
  need to have: The preferred candidate will have: •
  Bachelor’s degree in accounting, computer science or related
  field. • Hands-on experience developing and configuring CCH
  Tagetik solutions. • Practical experience with Analytical
  Information Hub (AIH), building Tagetik processes and
  workflows, dimensions, data processing, data mappings,
  calculations and reporting solutions • Knowledge of ETL
  /ELT, working with large data sets, with expertise in
  validation, and data cleansing techniques. • SQL Server
  Integration Services (SSIS) is a plus • Experience in Data
  Modelling, Data Warehousing, PL/SQL • Strong experience with
  Microsoft development and tooling stacks (MS SQL, Visual
  Studio, Azure DevOps or equivalent). • Experienced in
  delivering finance & accounting domain reporting solutions.
  What we prefer you to have: • Knowledge of financial
  processes and consolidation • Knowledge of Tagetik User
  Rights functionality • Working knowledge of Tagetik Data
  Loader • Knowledge of distributed systems and service-
  oriented architecture • Experience with Agile methodologies
  including SCRUM • The ability to collaborate effectively and
  communicate transparently • Strong problem-solving and
  analytical skills What success looks like • Reliable,
  controlled and supportable EPM solutions that meet Finance
  and Regulatory Reporting needs. • High-quality Tagetik
  delivery with clear traceability from requirement through
  design, test and release. • Effective support of the
  existing Hyperion and Essbase estate while reducing
  dependency on legacy platforms over time. • Strong
  partnership with Finance, Actuarial, Regulatory Reporting
  and technology stakeholders. What we offer: [NON US]: You
  will be eligible for a comprehensive and competitive
  benefits package which includes medical plans for you and
  your family, health and wellness programs, retirement plans,
  tuition reimbursement, paid annual leave, and much more.

  This posting is for an existing vacancy.
