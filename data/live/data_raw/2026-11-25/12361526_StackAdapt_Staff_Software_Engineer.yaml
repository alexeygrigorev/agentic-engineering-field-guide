description: |
  StackAdapt is the leading technology company that empowers
  marketers to reach, engage, and convert audiences with
  precision. With 465 billion automated optimizations per
  second, the AI-powered StackAdapt Marketing Platform
  seamlessly connects brand and performance marketing to drive
  measurable results across the entire customer journey. The
  most forward-thinking marketers choose StackAdapt to
  orchestrate high-impact campaigns across programmatic
  advertising and marketing channels.

  About the Team

  Activations is part of StackAdapt's Data Hub product, our
  customer data platform. Advertisers bring their first-party
  data into Data Hub: CRM lists, website and app events,
  product catalogs and store locations. Activations turn that
  data into something they can use. We build audiences, keep
  them in sync with the channels advertisers buy on, and feed
  products and locations into dynamic creative.

  We are a small team of senior and mid-level engineers. We
  work mostly in Go, on event-driven services that run at
  large scale, using Kafka, gRPC and TiDB on AWS. Advertisers
  spend against the audiences we build, and privacy law shapes
  how we handle their data, so correctness matters as much as
  speed.

  The team runs flat. Senior engineers lead projects from
  design to launch. You will set the technical standard those
  project leads work to: how we design, review and ship. You
  will help every engineer on the team get better at it,
  mostly by building alongside them.

  You will work closely with our Data Hub architect, who sets
  technical direction across the whole domain and decides
  designs that cross Data Hub teams. You decide designs inside
  Activations, and the two of you work together on the ones
  that cross the line. You also own the technical calls the
  team makes day to day, and the case for changing direction
  when what we learn in production says we should.

  What You'll Be Doing

  - Owning the technical health of the team's systems. You will
    own audience evaluation, CRM and programmatic audience
    syncs, and the product and location feeds behind dynamic
    creative. You will decide where reliability, cost and tech
    debt work goes, and make the case for it on the roadmap.
  - Building. You will write production code every week and take
    on the hardest work yourself: how we evaluate audiences at
    scale, how we keep long-running syncs reliable, and how
    activation grows beyond email to new identifiers.
  - Setting the review bar. A growing share of our code is
    written with AI coding agents. You will define what a good
    review looks like when an agent wrote the first draft,
    review the risky changes yourself, and teach the team to
    catch what agents miss: concurrency, data correctness,
    idempotency, privacy.
  - Coaching engineers. You will help senior engineers lead
    their own projects, and help mid-level engineers grow into
    senior ones. Expect to do this through design reviews,
    pairing and code reviews that teach.
  - Making the team faster with AI, carefully. You will find
    where AI tools save real time for us, such as review
    assistants, test generation, runbooks and on-call triage.
    You will build or adopt those tools, measure whether they
    work, and drop the ones that don't.
  - Turning product needs into technical plans. You will work
    with Product and the engineering teams around us to shape
    multi-month plans. You will find unknowns and cross-team
    dependencies early, and explain trade-offs in plain
    language.
  - Leading on reliability. You will take part in the on-call
    rotation, lead root cause analysis for team incidents, and
    make sure the fixes hold. You will set the team's
    standards for testing, observability and alerting.

  What You'll Bring to the Table

  - 8+ years building backend systems, with several years as the
    engineer others turned to for design decisions on a team
    that owns production services.
  - Strong Go, or deep experience in another backend language
    and a willingness to work in Go every day.
  - Experience designing and running distributed, data-heavy
    systems: event streaming (Kafka or similar), workflow
    orchestration, high-volume batch or streaming pipelines,
    and SQL/NewSQL stores at scale.
  - Has led a multi-month project across teams, from design to
    production.
  - Has led incident response and root cause analysis for
    production services.
  - A track record of raising a team's engineering standards
    beyond code review, through artifacts others adopted:
    design docs, review guidelines, shared libraries, CI
    checks, runbooks.
  - Real experience with AI coding tools: you use them to build,
    you know where they fail, and you have helped others use
    them well.
  - Evidence that engineers grew because of you, through
    mentoring, sponsorship, or by stepping back so someone
    else could lead.
  - Clear writing. Most of our decisions are made in design docs
    and pull requests.
  - Good judgment about trade-offs: when to ship the simple
    thing, when to pay down debt, and when to push back.
  - Bonus: Ad tech, marketing technology or customer data
    platforms (identity resolution, audience segmentation, CRM
    integrations).
  - Bonus: Privacy and data deletion compliance (CCPA/CPRA, data
    broker deletion requests, GDPR).
  - Bonus: Temporal, gRPC/protobuf, TiDB or Vitess.

