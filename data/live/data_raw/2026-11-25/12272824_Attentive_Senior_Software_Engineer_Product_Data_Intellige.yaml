description: |
  Attentive® is the AI marketing platform for 1:1
  personalization redefining the way brands and people
  connect. We’re the only marketing platform that combines
  powerful technology with human expertise to build authentic
  customer relationships. By unifying SMS, RCS, email, and
  push notifications, our AI-powered personalization engine
  delivers bespoke experiences that drive performance,
  revenue, and loyalty through real-time behavioral insights.



  Recognized as the #1 provider in SMS Marketing by G2,
  Attentive partners with more than 8,000 customers across 70+
  industries. Leading global brands like Crate and Barrel,
  Urban Outfitters, and Carter’s work with us to enable
  billions of interactions that power tens of billions in
  revenue for our customers.



  With a distributed global workforce and employee hubs in New
  York City, San Francisco, London, and Sydney, Attentive’s
  team has been consistently recognized for its performance
  and culture. We’re proud to be included in Deloitte’s Fast
  500 (four years running!), LinkedIn’s Top Startups, Forbes’
  Cloud 100 (five years running!), Inc.’s Best Workplaces, and
  the Human Rights Campaign Foundation's Corporate Equality
  Index!

  About the Role

  Our Product Data & Intelligence team builds the data
  infrastructure that makes product personalization possible
  at Attentive. We ingest, validate, and serve product and
  behavioral data, powering product recommendations and
  personalized content across the platform. Our work makes
  that data reliable and actionable so brands can deliver more
  relevant shopping experiences.

  As a Senior Software Engineer, you will lead the design,
  development, and operation of complex projects across our
  product catalog, data ingestion, and personalization
  services. You will turn ambiguous problems into practical
  designs, make thoughtful tradeoffs, and stay close to
  implementation and production behavior. You will partner
  with engineering, product, and ML teams, mentor teammates,
  and help shape the technical direction of the services you
  own.

  We use AI actively in how we build. We expect engineers to
  understand systems deeply, use AI tools to accelerate
  delivery, and apply their own judgment to correctness,
  simplicity, and customer impact. You will help the team
  improve these practices while remaining accountable for the
  software you ship.

  This hybrid role is based in our New York office, with in-
  office collaboration Tuesday through Thursday each week.

  What You’ll Accomplish

  - Own complex projects from problem definition and technical
    design through implementation, rollout, and ongoing
    operation across our product catalog, data pipelines, and
    personalization services.
  - Build reliable distributed systems for data ingestion,
    validation, storage, and serving. Improve data quality,
    freshness, performance, and observability so downstream
    features can depend on the data they use.
  - Partner with product, ML, and engineering teams to turn
    customer needs into clear deliverables, coordinate
    dependencies, and make practical tradeoffs between scope,
    reliability, and delivery speed.
  - Simplify the architecture of the services you own, identify
    technical risks early, and make incremental improvements
    that support the team’s longer-term direction.
  - Mentor engineers through design discussions, code reviews,
    and hands-on collaboration. Help teammates build stronger
    judgment and take ownership of increasingly complex work.
  - Use AI tools to accelerate development and investigation
    while maintaining a high bar for testing, correctness, and
    maintainability.

  Your Expertise

  - 5+ years of software engineering experience, including
    designing, shipping, and operating backend services or
    distributed data systems in production.
  - Strong software design, data structures, and algorithms
    fundamentals, with the ability to write clear,
    maintainable code and reason about system performance and
    failure modes.
  - Experience with relational and non-relational databases,
    data modeling, and access patterns. You understand how
    these choices affect correctness, scale, and reliability.
  - A track record of independently leading complex projects,
    breaking ambiguous problems into achievable milestones,
    and working across team boundaries to deliver results.
  - You take responsibility for the full impact of your work,
    from data quality and production operations to the
    customer experience. You diagnose problems across service
    boundaries and address their underlying causes.
  - You communicate technical decisions clearly, welcome
    feedback, and help other engineers grow through practical
    guidance and collaboration.
  - You use AI tools thoughtfully, critically evaluate their
    output, and ground design and implementation decisions in
    a clear understanding of the system.

  You'll get competitive perks and benefits, from health &
  wellness to equity, to help you bring your best self to
  work.

  For US based applicants:

  - The US base salary range for this full-time position is
    $178,400 - $267,600 annually + equity + benefits
  - Our salary ranges are determined by role, level and location

