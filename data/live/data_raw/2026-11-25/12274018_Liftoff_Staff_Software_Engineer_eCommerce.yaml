description: |
  Liftoff is a leading AI-powered performance marketing
  platform for the mobile app economy. Our end-to-end
  technology stack helps app marketers acquire and retain
  high-value users, while enabling publishers to maximize
  revenue across programmatic and direct demand.

  Liftoff’s solutions, including Accelerate, Direct, Monetize,
  Intelligence, and Vungle Exchange, support over 6,600 mobile
  businesses across 74 countries in sectors such as gaming,
  social, finance, ecommerce, and entertainment. Founded in
  2012 and headquartered in Redwood City, CA, Liftoff has a
  diverse, global presence.

  Liftoff’s E-commerce team builds an app-to-web product that
  drives mobile app users to purchase on Shopify web stores.
  We operate like a startup inside Liftoff. Requirements shift
  as we learn from live customers, and most problems arrive
  without an internal playbook. We built the product from the
  ground up and have already shipped major performance wins.

  As a Software Engineer, you’ll turn ambiguous problems into
  sound designs and execution plans, then drive them to
  production. You’ll own architecture and technical decisions
  for core targeting and attribution systems, and help shape
  the team’s work through design and code review. When
  customer performance drops, you’ll trace the cause through
  our systems, determine whether it’s a bug or a market
  signal, and turn the finding into a design.

  Responsibilities:

  - Own epics end to end, including scoping, design, delivery,
    and production health.
  - Help set the team’s technical direction and long-term
    roadmap.
  - Build privacy-compliant data systems that expand reach while
    maintaining accuracy.
  - Design attribution logic that captures more of the purchases
    we drive without overcounting.
  - Lead customer performance deep dives and turn findings into
    experiments.
  - Research new tools and approaches, and recommend solutions
    that balance short-term and long-term needs.
  - Review design docs and PRs, and help set the team’s bar for
    reliability, scalability, observability, privacy, cost
    efficiency, and documentation.
  - Partner with ML engineers to improve conversion models,
    including training data and conversion signal quality.
  - Build and extend our Shopify app and web pixel.
  - Mentor engineers and help hold the senior engineering bar in
    interviews.
  - Other duties as assigned.

  Requirements:

  - Minimum Bachelors Degree and 8 yrs of relevant experience.
    Equivalent practical experience may be considered in place
    of a formal degree.
  - Experience leading the design and delivery of complex
    projects across multiple engineers.
  - Strong programming skills in one or more languages such as
    Go, Java, Python, or JavaScript/TypeScript, plus fluent
    SQL (Trino, Spark, or equivalent).
  - A track record of taking ambiguous problems from scoping to
    shipped outcome with minimal oversight.
  - Demonstrated ability to diagnose performance or data
    discrepancies across a multi-stage pipeline, from raw
    signal to reported outcome.
  - Experience with cloud infrastructure (AWS, GCP, or Azure),
    container orchestration (Docker, Kubernetes), and event-
    driven systems (Kafka, Pub/Sub, or equivalent).
  - You operate with Agency and Urgency by taking initiative to
    solve problems and drive outcomes independently, with a
    strong sense of ownership and accountability.
  - You have a Growth Mindset and are adaptable, quick to test,
    iterate, and improve both ideas and your own skill set.
  - Experience with identity resolution, probabilistic matching,
    or device graphs is a plus.

  NICE TO HAVE:

  - Experience with web attribution or conversion tracking, such
    as pixels, server-side conversion APIs, or attribution
    platforms.
  - Working knowledge of browser privacy constraints and data
    privacy regulations.
  - Experience with Shopify or other e-commerce platforms.

  Working at Liftoff is fast-paced, fun, and challenging, and
  we thrive on innovation. Come join our team and help shape
  the future of the mobile app ecosystem. If this role sounds
  interesting to you, we would love to hear from you!

  Location: This role is eligible for full-time remote work in
  one of our entities: CA, CO, ID, IL, FL, GA, MA, MI, MN, MO,
  NJ, NV, NY, OR, PA, TX, UT, and WA.

  We are a remote-first company with US hubs in Redwood City,
  Los Angeles, and New York City.

  Travel Expectations: We offer several opportunities for in-
  person team gatherings, including but not limited to project
  meetings, regional meetups, and company-wide events. We
  expect our employees to attend these gatherings at least
  once per quarter. These gatherings provide essential
  opportunities for collaboration, communication, and team
  building.

  Compensation: Liftoff offers all employees a full
  compensation package that includes equity and
  health/vision/dental benefits associated with your country
  of residence. Base compensation will vary based on the
  candidate's location and experience.

  The following are our base salary ranges for this role:

  - SF Bay Area, NYC, Los Angeles/Orange County: $210,000 -
    $260,000
  - Seattle/Olympia, Austin, San Diego, Santa Barbara, Boston:
    $193,000 - $239,000
  - All other cities and towns in our approved states: $180,000
    - $223,000

