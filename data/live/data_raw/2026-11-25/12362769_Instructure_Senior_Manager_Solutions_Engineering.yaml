description: |
  At Instructure, we believe in the power of people to grow
  and succeed throughout their lives. Our goal is to amplify
  that power by creating intuitive products that simplify
  learning and personal development, facilitate meaningful
  relationships, and inspire people to go further in their
  education and careers. We do this by giving smart, creative,
  passionate people opportunities to create awesome. And
  that's where you come in:

  We're looking for an experienced Solutions Engineering
  leader to join us as a Senior Manager, Solutions
  Engineering. You'll lead a Solutions Engineering (SE) team
  aligned to the Business, Government and Partner BU,
  partnering with Sales leaders to help prospective customers
  evaluate the Instructure Learning Platform and our other
  products.

  Senior Managers set clear direction for their team, coach
  and mentor each direct report to success, and invest in
  every direct report's career, with greater competency and
  proven leadership experience. You'll connect your team's
  work to the company mission, the Growth Org mission, and the
  Global SE mission and vision. You'll build a functional,
  cohesive team and answer for the revenue goal and win rate
  of the market it supports.

  What you will be doing:

  - Establish Direction: Translate the company mission, the
    Growth Org mission, and the SE mission and vision into
    your team's mission, vision, goals and OKRs, KPIs, and
    priorities. Connect team goals to strategy, revisit
    priorities weekly, and adjust quickly when priorities
    shift.
  - Coach and Mentor: Coach and mentor direct reports to high
    degrees of success, as evidenced by competency ratings,
    demo scorecards, and other metrics. Use regular 1:1s, in-
    the-moment feedback, dedicated coaching sessions, and deal
    reviews.
  - Career Conversations: Hold a structured career conversation
    with every direct report.
  - Build a Cohesive Team: Build a functional team that trusts
    one another, disagrees productively, makes clear
    commitments, and holds each other accountable. Model
    vulnerability and put the needs of the larger organization
    ahead of your own team's.
  - Deliver Business Outcomes: Support attainment of the revenue
    goal and win rate for the market your team supports. Track
    quota attainment and win rates for the Account Executive
    cohorts your SEs support at least quarterly, and take
    ownership of everything the team does or fails to do.
  - Run the Team: Lead the blocking and tackling that lets the
    team operate well: assignments, coverage, processes,
    budgets, personnel issues, technical win tracking, and
    reporting.
  - Hiring and Onboarding: Recruit, hire, and ramp new SEs
    against clear milestones.
  - Key Opportunities: Support the most important opportunities
    as a coach, mentor, and guide.
  - Voice of the Field: Gather structured feedback from your
    team and customers, and share it with Product through the
    product gap tracker.
  - Data and AI: Keep Salesforce and other systems accurate and
    current. Adopt AI tools that improve team performance,
    model experimentation, and share what works.
  - Partnership: Work with Sales leaders, Sales Enablement, the
    SE Specialists team, and peers in other regions to solve
    problems together.

  Here is what you need to know/have:

  - Education and Experience: Bachelor's degree required.
    Solutions engineering experience, with a record of winning
    complex deals. Proven experience leading SEs or similar
    teams, with results to show for it.
  - Coaching Skills: A structured approach to feedback, such as
    SBI, and a record of developing individual contributors to
    high degrees of success.
  - Career Development: Experience running career conversations
    that look beyond the next promotion.
  - Team Building: Ability to build trust, manage conflict, and
    secure commitment on a team.
  - Goal Setting: Experience using OKRs and KPIs to align a
    team's work to company priorities.
  - Leadership Expectations: Ability to meet the Senior Manager
    level of Instructure's leadership expectations.
  - Market Expertise: Working knowledge of the education
    technology market and SaaS business models.
  - Tool Fluency: Proficiency in Salesforce, and both Microsoft
    and Google Suites. Comfort using AI tools in daily work.
  - Analytical Skills: Ability to ground decisions in data and
    turn analysis into clear next steps.
  - Communication Skills: Excellent communication in speech and
    writing, in plain language, tailored to the audience.
    Executive presence with customers and internal leaders.
  - Ownership: A habit of owning outcomes, both wins and misses,
    and bringing solutions when raising issues.
  - Travel and Location: Location is flexible, but requires
    access to a nearby airport and a willingness to travel (up
    to 30%).

  Get in on all the awesome at Instructure!

  We offer competitive, meaningful benefits in every country
  where we operate. While they vary by location, here's a
  general idea of what you can expect:

  - Competitive compensation, plus all full-time employees
    participate in our ownership program - because everyone
    should have a stake in our success.
  - Flexible work culture. Our remote, hybrid and in-office
    collaboration spaces vary by role, team and location.
  - Generous time off, including local holidays and our annual
    “Dim the Lights” period in late December, when teams are
    encouraged to step back and recharge based on departmental
    needs.
  - Comprehensive wellness programs and mental health support
  - Learning and development resources, including professional
    development tools and tuition reimbursement, to support
    your growth
  - The technology and tools you need to do your best work
  - Motivosity employee recognition program
  - A culture rooted in inclusivity, support, and meaningful
    connection

  We believe in hiring great people and treating them right.
  The more diverse we are, the better our ideas and outcomes.

  Instructure is an Equal Opportunity Employer. We comply with
  applicable employment and anti-discrimination laws in every
  country where we operate.

  All employees must pass a background check as part of the
  hiring process. To help protect our teams and systems, we’ve
  implemented identity verification measures. Candidates may
  be asked to verify their legal name, current physical
  location, and provide a valid contact number and residential
  address, in accordance with local data privacy laws.

  Any attempt to misrepresent personal or professional
  information will result in disqualification.
