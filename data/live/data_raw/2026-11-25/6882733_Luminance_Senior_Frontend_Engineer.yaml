description: |
  Join Luminance as a Senior Frontend Engineer and help teams
  turn complex contract information into clear, actionable
  insight.

  Our Contract Intelligence platform helps enterprise teams
  understand risk, manage obligations and make better business
  decisions. You’ll shape how customers interact with that
  platform, building interfaces that make demanding workflows
  feel straightforward. Working closely with product, design
  and engineering colleagues, you’ll own projects from early
  exploration through to release and ongoing improvement.

  Responsibilities

  - Own the design and delivery of frontend projects, helping
    define both the technical approach and the customer
    experience.
  - Build and maintain customer-facing features using TypeScript
    and React.
  - Partner with product and design to translate complex
    contract workflows into intuitive, accessible interfaces.
  - Work with backend engineers to define APIs and data flows
    that support complete features.
  - Make pragmatic choices about frontend architecture, reusable
    components and application state, balancing delivery speed
    with quality and maintainability.
  - Improve application performance, usability and consistency
    across the platform.
  - Build reliable, secure and well-tested software, taking
    responsibility for how it performs in production.
  - Investigate production issues and participate in on-call
    duties.
  - Mentor colleagues, share knowledge and contribute to
    effective engineering practices.

  Requirements

  - 5+ years of commercial software engineering experience, with
    8–10 years preferred, including ownership of significant
    frontend projects or product areas.
  - Strong experience with TypeScript and React, or comparable
    languages and frontend frameworks.
  - Experience building and operating customer-facing web-based
    SaaS products.
  - A track record of creating maintainable frontend
    applications, integrating APIs and working with complex,
    data-driven interfaces.
  - A practical understanding of accessibility, web performance,
    browser behaviour and frontend testing.
  - Familiarity with server-side development and confidence
    collaborating across the stack. Our backend includes
    Node.js, Python, PostgreSQL, Redis and Elasticsearch.
  - Practical experience using AI coding agents to improve
    productivity, including coordinating multiple agents on
    parallel tasks.
  - Experience with on-call rotations and diagnosing and
    resolving production issues.
  - The ability to deliver at pace while maintaining appropriate
    standards for reliability and maintainability.
  - Strong problem-solving and communication skills, sound
    technical judgement and a willingness to support other
    engineers.
