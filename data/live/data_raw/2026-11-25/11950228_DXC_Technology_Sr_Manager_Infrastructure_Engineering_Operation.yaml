  Job Description:

  DXC Technology's Insurance Software and Business Process
  Services (ISB) business helps insurers worldwide modernize
  and manage their core operations through deep industry
  expertise, proven software platforms, and innovative AI-
  driven solutions.

  As a global provider of insurance technology solutions, ISB
  supports policy administration, claims management, billing,
  analytics, and digital engagement across Life & Annuity,
  Property & Casualty, and Specialty insurance markets. Our
  solutions enable leading insurers to transform the critical
  policy, underwriting, and claims systems that millions of
  customers rely on every day.

  Role Overview

  We are seeking an experienced Senior Manager, Infrastructure
  Engineering & Operations to lead enterprise technology
  engineering and operational teams supporting complex, global
  technology environments.

  This role is responsible for driving infrastructure and
  cloud operations, engineering excellence, service
  reliability, automation, and technology transformation
  initiatives. The successful candidate will combine strong
  technical knowledge with proven people leadership,
  operational management, and strategic execution
  capabilities.

  Working closely with engineering, architecture,
  cybersecurity, business, and customer-facing teams, this
  leader will ensure the reliability, scalability, security,
  and cost efficiency of enterprise technology services while
  advancing cloud modernization, automation, AIOps, and Site
  Reliability Engineering (SRE) practices.

  Key Responsibilities Engineering & Technology Operations
  Leadership

  - Lead and develop engineering and technical operations teams
    responsible for enterprise infrastructure, cloud
    platforms, systems engineering, automation, and
    operational services.
  - Drive the strategy and execution of infrastructure
    modernization, cloud transformation, platform engineering,
    automation, AIOps, and Site Reliability Engineering (SRE)
    initiatives.
  - Oversee technical architecture reviews, infrastructure
    design, solution assessments, and technology governance to
    ensure scalability, resilience, security, availability,
    and performance.
  - Partner with application engineering, enterprise
    architecture, cybersecurity, and business stakeholders to
    define technical requirements, establish priorities, and
    deliver technology solutions aligned with business
    objectives.
  - Promote engineering best practices, operational standards,
    and continuous improvement across the technology
    organization.

  Service Delivery & Operational Excellence

  - Ensure consistent and reliable delivery of enterprise
    technology services, maintaining agreed service-level
    agreements (SLAs), operational performance indicators
    (KPIs), availability targets, and quality standards.
  - Drive service reliability, incident prevention, problem
    management, change management, and root cause analysis to
    minimize service disruptions and improve operational
    performance.
  - Implement automation and intelligent operations capabilities
    to reduce manual intervention, accelerate incident
    resolution, and improve engineering productivity.
  - Establish and monitor operational dashboards, performance
    metrics, and governance frameworks to identify improvement
    opportunities and ensure service delivery excellence.
  - Lead operational risk management, ensuring timely
    identification, mitigation, and resolution of technical,
    security, and service delivery risks.

  Cloud, Infrastructure & Financial Management

  - Oversee enterprise cloud and infrastructure environments,
    ensuring effective capacity planning, resource
    utilization, scalability, and operational resilience.
  - Lead cloud financial management and cost optimization
    initiatives, including forecasting, budget governance,
    resource allocation, and cost accountability.
  - Drive infrastructure efficiency through automation,
    standardization, technology optimization, and adoption of
    modern engineering practices.
  - Oversee vendor relationships, technology partnerships,
    workforce planning, resource allocation, and operational
    budgets to maximize delivery effectiveness.

  Security, Risk & Governance

  - Partner with cybersecurity and compliance teams to maintain
    security standards, vulnerability remediation, access
    governance, and regulatory compliance.
  - Ensure operational readiness through effective disaster
    recovery, business continuity, and resilience planning.
  - Maintain technology governance frameworks, audit readiness,
    and adherence to enterprise architecture and operational
    standards.
  - Ensure appropriate controls and risk mitigation strategies
    are embedded across infrastructure and cloud operations.

  People & Stakeholder Leadership

  - Lead, mentor, and develop geographically distributed
    engineering and operations teams, establishing clear
    performance objectives, development plans, and succession
    opportunities.
  - Foster a culture of accountability, collaboration,
    innovation, technical excellence, and continuous learning.
  - Build strong partnerships with senior leadership, business
    stakeholders, customers, and cross-functional technology
    teams.
  - Communicate operational performance, transformation
    progress, risks, and strategic recommendations to senior
    management.
  - Align technology initiatives, workforce capabilities, and
    operational priorities with business strategy and customer
    expectations.

  Basic Qualifications

  - High School Diploma or equivalent is required.
  - Bachelor's degree in Information Technology, Computer
    Science, Engineering, or a related discipline is
    preferred.
  - Typically, 8+ years of relevant experience in enterprise
    technology, infrastructure engineering, cloud operations,
    systems management, or IT service delivery.
  - At least 3 years of experience in a technical leadership,
    engineering management, infrastructure management, or IT
    operations leadership role.
  - Demonstrated experience leading enterprise infrastructure,
    cloud platforms, systems engineering, or large-scale
    technology operations.
  - Strong understanding of cloud computing environments,
    including AWS and/or Microsoft Azure, as well as
    enterprise infrastructure, virtualization, storage,
    networking, identity and access management, and systems
    administration.
  - Experience with infrastructure automation, monitoring and
    observability platforms, incident management, problem
    management, change management, and service reliability
    practices.
  - Knowledge of IT Service Management (ITSM) frameworks,
    operational governance, service-level management, and
    continuous improvement methodologies.
  - Proven experience managing technical teams, project
    delivery, workforce planning, operational budgets, vendor
    relationships, and stakeholder expectations.
  - Ability to lead technical assessments, architecture
    discussions, solution evaluations, and operational risk
    management activities.
  - Understanding of cloud financial management (FinOps), cost
    optimization, vulnerability management, security controls,
    disaster recovery, business continuity, and audit
    compliance.
  - Strong leadership, communication, problem-solving,
    organizational, and stakeholder management skills.
  - Demonstrated ability to manage complex technology
    initiatives, competing priorities, and transformation
    programs while delivering measurable business and
    operational outcomes.
  - Experience leading globally distributed teams and
    coordinating delivery across onshore and offshore
    environments.

  Preferred Qualifications

  - Nice to have: Master's degree in information technology,
    Computer Science, Engineering, Business Administration, or
    a related field.
  - Experience supporting enterprise customers in financial
    services, insurance, retail, telecommunications,
    hospitality, travel, or other complex business
    environments.
  - Previous experience in the insurance technology industry is
    highly desirable.
  - Relevant certifications in cloud platforms (AWS or Azure),
    ITIL, SRE, FinOps, or project/program management are an
    advantage.
  - Experience implementing AIOps, infrastructure automation,
    cloud-native technologies, and modern observability
    solutions.

