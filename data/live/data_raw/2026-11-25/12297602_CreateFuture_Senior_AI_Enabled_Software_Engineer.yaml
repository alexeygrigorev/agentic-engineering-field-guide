description: |
  Working at CreateFuture CreateFuture is an AI-native
  consulting partner where people do work that matters and are
  supported to do it well. We work alongside organisations
  such as PayPal, adidas, NatWest, FanDuel and Money Saving
  Expert, building digital products and services that make a
  difference  while always putting people first.

  We’re a team of creators. We write code, shape delivery,
  build go-to-market strategies, develop AI solutions and
  create the practices that support our people. We work side
  by side with our clients, challenging what’s not working and
  helping them to build the future. Our commitment to craft,
  quality, and culture has helped us scale to over 600 people
  in just a few years. CreateFuture is a Great Place to Work-
  Certified™ company and has won Best Workplaces UK multiple
  years in a row.

  Join us on our journey. Let’s create tomorrow, together,
  today.

  About the role and team:

  You’ll join our team, working side by side with clients and
  our delivery teams to turn architectural designs into
  production systems. Increasingly, our clients want products
  and platforms that are AI-native from the start. As a Senior
  AI-enabled Software Engineer, you’ll be both a hands-on
  individual contributor and a technical driving force in your
  team: closing the gap between design and delivery,
  recognising operational bottlenecks, and establishing good
  engineering practice in client environments.  How we work
  CreateFuture is an AI-native organisation. Every core
  technical role is expected to:

  - Work with AI-native delivery and workflow practices.
  - Practise agentic engineering through at least one harness.
  - Apply context engineering through prompts, skills, tools and
    harnesses.
  - Know at least one runtime or language.
  - Use CI/CD and automated quality practices to verify work in
    all its forms.

  What you'll be doing:

  As a Senior AI-enabled Software Engineer, you’ll develop
  application features using AI-assisted engineering,
  combining sound software engineering practice with agentic
  ways of working.

  You’ll bring credible, role-specific capability in:

  - Application architecture and modular design.
  - Application data, state, and persistence design.
  - Application feature, API, interface, and service-integration
    engineering.
  - Spec-driven development.
  - Test-driven development.
  - Secure application development.
  - Application performance and operability.
  - Context and workflow optimisation for agentic engineering.
  - AI Agent Orchestration & Workflow Design.
  - Building generative AI features on Amazon Bedrock, including
    working with foundation models, Knowledge Bases for
    retrieval-augmented generation (RAG), and Bedrock Agents
    or AgentCore.
  - AI Evaluation, Observability & Guardrails, including Amazon
    Bedrock Guardrails and model evaluation.

  You won’t need depth in all of these, but experience in one
  or more of the following would be valuable:

  - Front-end application development.
  - Mobile application development.
  - Back-end and service development.
  - Cloud-native application development.
  - Real-time and event-driven systems.
  - Legacy application modernisation and migration.
  - AI-enabled product features.
  - Agentic development environments and harnesses.
  - Agentic engineering evaluation and observability platforms.
  - AWS certifications such as AWS Certified AI Practitioner or
    AWS Certified Machine Learning Engineer – Associate.

  We’d love to talk to you if you

  - Resolve complex or ambiguous application engineering
    problems within a team or engagement, making sound
    judgement calls.
  - Shape technical direction for application design and
    delivery, influencing how work gets done as well as what.
  - Act as a trusted advisor to clients on application
    architecture, quality and engineering trade-offs.
  - Coach and develop other engineers, and raise standards
    across our software engineering discipline.

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
