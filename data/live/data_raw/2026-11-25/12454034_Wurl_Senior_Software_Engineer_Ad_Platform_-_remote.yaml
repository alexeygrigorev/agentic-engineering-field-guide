description: |
  About Wurl, LLC.

  At Wurl, our mission is to create innovative technologies
  and services that help accelerate the shift to streaming. At
  our core, we are innovators focused on driving the streaming
  industry forward with technologies that help connect viewers
  to the right content and ads. Our technology and data-driven
  solutions help companies reach new audiences, engage high-
  value viewers, and ultimately increase their revenue.

  In 2022, Wurl was acquired by AppLovin (Nasdaq: APP), a
  leading marketing platform, giving our employees the best of
  both worlds: the dynamic environment of a 150+ person
  startup as well as the stability of a high-growth public
  tech company. We invest in providing a culture that fosters
  passion, drives excellence, and encourages collaboration to
  drive innovation. Wurl is a fully-remote company that has
  been globally recognized for our people and technology,
  having been named a Great Place to Work by Fortune in 2022,
  2023, and 2024; an Ad Tech Company of the Year finalist by
  the UK Business Tech Awards in 2023; a BIG Innovation Awards
  winner in 2024 and 2025; and the “Innovation in Advertising”
  winner by the StreamTV Awards in 2024.

  The Opportunity

  As the leading FAST channel technology provider, Wurl brings
  together content, inventory, and bidstream enrichment to
  activate content intelligence across CTV. Wurl is seeking a
  Senior Software Engineer to help build the real-time systems
  at the core of our advertising platform.

  What you’ll do

  - Lead the design and delivery of features for our real-time
    bidding platform that connects our supply and demand
    partners with contextual signals.
  - Own services end to end: development, deployment,
    monitoring, and participation in on-call rotation.
  - Build systems that scale predictably and fail gracefully
    under load.
  - Improve performance and cost through profiling and
    observability.
  - Mentor engineers and help shape the platform’s technical
    direction.

  What you’ll bring

  - 5+ years of professional experience building high-scale
    production systems, with deep experience in Go.
  - Hands-on experience operating services on AWS and
    Kubernetes.
  - Experience with OpenRTB and VAST.
  - Clear written communication about design trade-offs.
  - Good judgment with AI coding agents.
  - Curiosity and initiative to find and pursue improvements.

  What We Offer:

  - Competitive Salary, Equity (ESPP) and Bonus
  - Strong Medical, Dental and Vision Benefits, 100% paid by
    Wurl
  - Remote first policy
  - Flexible, unlimited Time Off
  - 10 US Holidays
  - 401(k) Matching and Roth options
  - Pre-Tax Savings Plans, HSA & FSA
  - Various subscriptions for mental and physical wellness
  - OneMedical subscription for 24/7 convenient medical care
  - Paid Maternity and Parental Leave for all family additions
  - $1k Work From Home Stipend to set up your Office

  Few companies allow you to thrive like you will at Wurl.
  Join us to revolutionize the way the world watches
  television while enjoying mentorship, collaboration, and
  innovation.

  We encourage all applicants, even those who don’t meet 100%
  of the requirements, to apply. Passion and potential go a
  long way here at Wurl.

  AppLovin provides a competitive total compensation package
  with a pay for performance rewards approach. Total
  compensation at AppLovin is based on a number of factors
  including market location and may vary depending on job-
  related knowledge, skills, and experience. Depending on the
  position offered, equity, and other forms of incentive
  compensation (as applicable) may be provided as part of a
  total compensation package, in addition to dental, vision,
  and other benefits.

  Health Insurance: Medical, Dental, Vision, Life, Disability

  Retirement Benefits: 401(k) Retirement Plan

  Paid Time Off: Unlimited Discretionary Time Off

  Paid Holidays: 10 paid holidays per year

  Paid Sick Leave: 80 hours per year

  Method of Application: Apply online

  Application Window: The application window is expected to
  close within 30 days of the posting date.

  All questions or concerns about this posting should be
  directed to peopleops@applovin.com.

  USA Base Pay Range: CA, NY, WA States

  $188,000—$282,000 USD

  USA Base Pay Range: all other States (excludes CA, NY, WA)

  $160,000—$242,000 USD

