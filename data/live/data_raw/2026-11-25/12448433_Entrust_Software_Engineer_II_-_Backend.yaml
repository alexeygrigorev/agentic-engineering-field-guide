  Software Engineer II - Platform Backend Developer

  Department: Engineering

  Position Overview

  As a Platform Backend Developer, you will play a crucial
  role in building and evolving the backend services that
  power our Digital Identity solutions. You will work on
  technologies that enable organizations to securely issue,
  manage, and verify digital identities and credentials across
  different platforms and ecosystems.

  Your responsibilities will include designing, developing,
  and maintaining secure and scalable backend services and
  APIs that support digital identity use cases, including
  credential issuance and verification, identity wallets,
  trust management, and interoperability with external
  systems. You will work with modern identity standards and
  protocols and contribute to solutions designed to meet
  evolving security, privacy, and regulatory requirements.

  You will collaborate with a dynamic, cross-functional team
  of backend and frontend developers, product managers, and
  UX/UI designers to deliver innovative features that enhance
  user experience. Your work will directly contribute to
  making digital interactions more secure, privacy-preserving,
  and trustworthy, while enabling our products to scale across
  customers, markets, and regulatory environments.

  We are seeking a talented Backend Developer to join our
  Platform team. The ideal candidate has a strong background
  in server-side development, with a passion for building
  scalable and efficient systems. Experience with identity
  technologies is valuable, but curiosity and a willingness to
  learn and work with emerging Digital Identity standards are
  equally important.

  What you will do:

  - Design, develop, test and maintain the APIs for the Digital
    ID platform as well as it’s backend services.
  - Collaborate with backend and frontend developers, product
    managers, product designers, test engineers and other
    stakeholders to deliver high-quality features.
  - Contribute to the scalability, performance, and reliability
    of the platform.
  - Implement security best practices to protect user data and
    maintain compliance with industry standards.
  - Participate in code reviews, providing and receiving
    constructive feedback to improve code quality.
  - Stay up-to-date with emerging technologies and industry
    trends to continuously improve the platform.

  Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field, or equivalent experience.
  - Proven experience as a Backend Developer or similar role.
  - Solid knowledge and experience in server-side languages such
    as Python, Ruby and Kotlin.
  - Experience with database technologies such as PostgreSQL
  - Familiarity with RESTful API design and development.
  - Knowledge of cloud platforms such as AWS, Azure, or Google
    Cloud.
  - Understanding of containerization and orchestration tools
    like Docker and Kubernetes.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and collaboration skills.

  Preferred Qualifications:

  - Experience with microservices and event driven architecture.
  - Knowledge of OpenID4VP, SD-JWT VC, mDoc, OpenID4VCI, PKI,
    and HSMs.
  - Knowledge of Gitlab, CI/CD pipelines and DevOps practices.
  - Familiarity with frontend and mobile technologies is a plus.

