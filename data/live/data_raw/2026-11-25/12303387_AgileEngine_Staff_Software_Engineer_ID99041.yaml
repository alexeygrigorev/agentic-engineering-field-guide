description: |
  AgileEngine is an Inc. 5000 company that creates award-
  winning software for Fortune 500 brands and trailblazing
  startups across 17+ industries. We rank among the leaders in
  areas like application development and AI/ML, and our
  people-first culture has earned us multiple Best Place to
  Work awards.

  WHY JOIN US

  If you're looking for a place to grow, make an impact, and
  work with people who care, we'd love to meet you!

  ABOUT THE ROLE

  We are looking for a Staff Software Engineer to lead
  architecture and write production code for an AI-powered
  supply chain platform.

  The mandatory requirements are 6+ years in software
  engineering with architecture ownership, 5+ years with C#
  and ASP.NET Core, Angular, eligibility for US security
  clearance, ideally working in office in Austin, TX, and
  strong English communication skills.

  WHAT YOU WILL DO

  - Own the architecture of the ABP-based applications: module
    boundaries, shared libraries, and the conventions other
    teams build on.

  - Lead technical design for major features while writing
    production full-stack code, including the hardest and most
    ambiguous problems.

  - Set the team’s .NET standards and enforce them through code
    review, design review, CI and mentoring.

  - Build secure-by-design systems, including for AWS GovCloud
    and government customer environments.

  - Own reliability, performance and observability of what they
    ship, and fix root causes when things fail.

  - Plan and lead major .NET and ABP version upgrades while
    feature work continues.

  - Evaluate tools and frameworks and make the call.

  - Turn business needs into technical priorities with the
    Director of Engineering and Product, and document
    decisions so the team can work without them.

  MUST HAVES

  - At this moment, we will not sponsor any new applicant for
    employment authorization or offer immigration support for
    this position (e.g. F-1 STEM OPT, F-1 CPT, J-1, E-3, O-1,
    or any other form of work authorization requiring
    immigration support or sponsorship;

  - 6+ years in software engineering, including several years
    owning the architecture of production systems.

  - Has led technical delivery across a team without formal
    authority.

  - 5+ years of production C# and ASP.NET Core, with deep
    knowledge of the request pipeline, dependency injection
    lifetimes and async behavior.

  - Strong EF Core and PostgreSQL: migrations across
    environments, query plans, indexing, concurrency control.

  - Has fixed .NET performance problems in production using
    tools like dotnet-trace, dotnet-counters or Datadog APM.

  - Can ship features end to end in Angular and TypeScript.

  - Experience with distributed systems, AWS, containers and
    CI/CD.

  - Secure coding discipline and experience in regulated or
    high-assurance environments.

  - Clear communication with both engineers and executives.

  - Ability to obtain and maintain a US government security
    clearance. Certain programs may require US citizenship.

  - Upper-intermediate English level.

  NICE TO HAVES

  - Production experience with ABP Framework. The posting calls
    it “strongly preferred,” but deep experience with the same
    patterns in another .NET framework is accepted.

  - Early-stage startup or SaaS experience.

  - AWS GovCloud specifically.

  - Kafka (Amazon MSK), Kubernetes, Terraform, GitLab, Datadog.

  - Works in office in Austin, TX.

  PERKS AND BENEFITS

  - Professional growth: Mentorship, TechTalks, and personalized
    growth roadmaps.

  - Competitive compensation: USD-based pay with education,
    fitness, and team activity budgets.

  - Exciting projects: Modern solutions with Fortune 500 and top
    product companies.

  - Flextime: Flexible schedule with remote and office options.
