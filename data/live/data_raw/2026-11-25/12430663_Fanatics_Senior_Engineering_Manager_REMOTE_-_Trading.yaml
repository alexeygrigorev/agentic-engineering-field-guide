description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Launched in 2021, Fanatics Betting and Gaming is the online
  and retail sports betting subsidiary of Fanatics, a global
  digital sports platform. The Fanatics Sportsbook is
  available to 95% of the addressable online sports bettor
  market in the U.S. Fanatics Casino is currently available
  online in Michigan, New Jersey, Pennsylvania and West
  Virginia. Fanatics Betting and Gaming operates twenty-two
  retail sports betting locations, including the only
  sportsbook inside an NFL stadium at Northwest Stadium.
  Fanatics Betting and Gaming is headquartered in New York
  with offices in Denver, Leeds and Dublin.

  We are looking for a Senior Engineering Manager to lead this
  team. This is a people leadership role with a real technical
  core. You will manage, coach and grow the engineers, own
  what the team commits to and ships, and be the engineering
  lead the team turns to on how the system works. Expect to
  spend roughly 30 percent of your time in the code: not
  heads-down on big features for weeks at a time, but close
  enough to the stack that you can answer a question, review a
  design, pick up the smaller pieces that keep the team
  moving, and sense when an estimate or a status is wrong.

  Overview

  - Lead the engineering team: hire, coach, develop and set the
    standard for six engineers, and hold that standard with
    direct, timely feedback in both directions.
  - Own delivery for basketball: commit the team to work that is
    properly scoped, deliver what you committed inside the
    milestone, and tell us early and in your own words when
    the forecast moves.
  - Own stability for basketball: be ready before the season
    starts and before every major release, be on the bridge
    for every P1 in your area, root-cause every incident and
    land a durable change so the lesson sticks.
  - Be the engineering lead for the team: stay current across
    the stack, take part in the architecture and design
    discussions that matter, review code, and keep enough
    hands-on work to know how the system behaves in
    production.
  - Be the team’s link to trading: know the senior traders for
    basketball, understand what they need and why, translate
    it for the engineers, and push back when the ask does not
    match the problem.
  - Partner with product, quants to shape a basketball roadmap
    that is ambitious and achievable, and that the team
    believes in.
  - Hold the quality bar against the date: small batches, tests
    that ship with the change, and review rigor that does not
    drop when the calendar gets tight.
  - Drive adoption of AI-assisted engineering workflows across
    the team, from development tooling and testing to code
    review and documentation, with the team still able to
    explain and defend everything it ships.
  - Make the team measurably better every milestone: retros that
    produce specific changes the team owns, followed up until
    they stick.
  - Travel occasionally to Fanatics offices and to the trading
    floor in Denver.

  Required Qualifications

  - Three or more years managing software engineers, with a
    track record of building a team that delivers and of
    holding people to a clear bar.
  - Strong, recent, hands-on experience with C# and .NET, and
    with building and running services on Azure. You will be
    assessed at a senior engineer level on coding and system
    design.
  - Experience with distributed, event-driven systems: message
    brokers (Kafka, RabbitMQ, Service Bus or similar), event
    sourcing, partitioning, and the failure modes that come
    with them.
  - Experience owning production systems: on-call, incident
    command, post-incident reviews and operational readiness
    for peak periods.
  - Proactive and self-directing. You find the people you need,
    make the call with 70 percent of the picture, and surface
    risk before you are asked.
  - Comfortable with ambiguity and with a fast-moving
    environment where priorities change and decisions are made
    quickly.
  - Able to communicate complex technical topics to engineers,
    traders, product and executives, in writing and in person.
  - Based in the United States, ideally in the Eastern or
    Central time zones, with the right to work in the US.

  Preferred Qualifications

  - Experience in sports betting, trading, or another real-time
    pricing or risk domain.
  - Experience with Azure Service Fabric or Kubernetes, and with
    moving workloads between them.
  - Experience with live sports data feeds and the latency and
    correctness problems they bring.
  - Experience working closely with quantitative or data science
    teams on models running in production.
  - Knowledge of basketball and how it is traded.

  If you have some of these qualifications but not all of
  them, we still encourage you to apply.

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Ranges will change based on country and state of residence,
  which are reflected in Geographical Zones defined by
  Fanatics Betting and Gaming. The range incorporates all of
  our Geographical Compensation Zones and is subject to change
  as the Zone associated with the actual offer is confirmed.
  In addition to the base and bonus, full-time employment, and
  more. For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Salary Range

  $163,400—$268,750 USD

  By submitting your application, you agree to our terms of
  service and acknowledge you have read our Candidate Privacy
  Policy.

  Fanatics will never ask candidates for money, banking
  information, or other sensitive personal information as part
  of the interview process. If you receive a suspicious
  message claiming to be from Fanatics recruiting, please do
  not respond and report it here.
