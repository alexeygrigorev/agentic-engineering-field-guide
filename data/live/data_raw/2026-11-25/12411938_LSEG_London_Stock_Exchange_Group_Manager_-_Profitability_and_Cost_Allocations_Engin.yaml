description: |
  Enterprise Functions Engineering

  Enterprise Functions Engineering builds and operates
  technology supporting critical functions across LSEG,
  including Finance and Risk. We simplify processes,
  strengthen resilience and accelerate digital transformation
  through scalable, secure and data-driven solutions.

  The Opportunity

  We are looking for an expert Profitability & Cost
  Allocations Engineering Lead to own the engineering and
  evolution of our enterprise profitability, cost allocation
  and technology cost transparency solutions.

  This is a hands-on leadership role with Oracle EPM Cloud
  Enterprise Profitability and Cost Management (EPCM) at its
  core. You will set the technical direction for the platform,
  own an engineering team and remain close to the design and
  delivery of sophisticated profitability and allocation
  solutions.

  You will also lead all aspects of Technology Business
  Management (TBM) and Total Cost of Ownership (TCO)
  solutions, working across Finance and Technology to improve
  cost transparency and support better business decisions.

  What You’ll Be Doing

  - Lead the engineering and technical roadmap for Oracle EPM
    Cloud EPCM and related profitability and cost allocation
    solutions.
  - Build and deliver sophisticated EPCM models, including
    allocation rules, calculations, integrations, reporting
    and automation.
  - Lead all aspects of TBM and TCO solutions across Oracle PCM,
    MagicOrange, IBM Apptio or comparable platforms.
  - Lead engineering delivery from design and development
    through testing, deployment and production.
  - Partner with Finance and Technology teams on profitability
    models, cost drivers, service costing and
    chargeback/showback solutions.
  - Build resilient, well-controlled services and drive
    automation, performance optimisation and platform
    simplification.
  - Lead, mentor and develop the engineering team while managing
    key vendors and implementation partners.
  - Act as a trusted technical partner to senior stakeholders.

  What You’ll Bring

  - Deep hands-on experience with Oracle EPM Cloud EPCM,
    including model design, allocation rules, calculations,
    integrations, reporting and optimisation.
  - Strong knowledge of profitability and cost allocation
    methodologies, including cost pools, cost drivers, service
    costing and chargeback/showback.
  - Experience with Oracle PCM and/or modernising profitability
    solutions to Oracle EPM Cloud EPCM.
  - Understanding of TBM and TCO, ideally with MagicOrange, IBM
    Apptio or a comparable platform.
  - Experience leading engineering teams and delivering complex
    enterprise technology solutions.
  - Knowledge of the wider Oracle EPM Cloud ecosystem and
    enterprise integrations.
  - Strong stakeholder leadership skills, with the ability to
    translate complex Finance requirements into scalable
    technology solutions.
  - Experience working within enterprise security, risk and
    control frameworks.

  Nice to Have

  - Oracle EPM Cloud/EPCM, MagicOrange, IBM Apptio or TBM-
    related certifications.
  - Knowledge of FinOps, cloud cost management or TBM standards.
  - Experience with Azure, ServiceNow, Power BI, APIs or DevOps
    practices.
  - Experience applying AI to EPM, Finance or cost-management
    use cases.
  - Experience within financial services or another complex,
    regulated environment.
  - Relevant Finance or Technology qualifications.

  How You’ll Lead

  You’ll combine technical depth with strong people
  leadership, setting clear engineering direction while
  staying close to the technology. You’ll create an inclusive,
  collaborative environment and balance delivery speed with
  quality, resilience and long-term platform sustainability.

  Career Stage:

  Manager

  LSEG unlocks the power of markets to create opportunities
  across the global economy.

  Through our connected network of market infrastructure, data
  and analytics, we help customers access capital, manage risk
