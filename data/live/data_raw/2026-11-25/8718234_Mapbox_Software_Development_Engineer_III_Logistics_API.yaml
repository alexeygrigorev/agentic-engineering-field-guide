description: |
  Mapbox is the leading real-time location platform for a new
  generation of location-aware businesses. Mapbox is the only
  platform that equips organizations with the full set of
  tools to power the navigation of people, packages, and
  vehicles everywhere. More than 4 million registered
  developers have chosen Mapbox because of the platform’s
  flexibility, security and privacy compliance. Organizations
  use Mapbox applications, data, SDKs and APIs to create
  customized and immersive experiences that delight their
  customers.

  What We Do

  Our team is responsible for the Directions and Logistics
  APIs, which power everything from a single driver's route
  request to the complex logistics optimization for major
  delivery companies. We handle millions of requests daily,
  operating under strict latency requirements, making our work
  both challenging and highly rewarding. Given the essential
  nature of our services, we maintain a responsible on-call
  rotation and treat alarms seriously to ensure system
  stability without excessive noise.  We have an exciting
  roadmap for 2026, and this is the perfect time to join us to
  be a part of this exciting journey!

  As AI becomes embedded in modern engineering workflows, we
  value engineers who can thoughtfully integrate AI into
  design, development, and decision-making. Our interview
  process will include a discussion of how you use AI in your
  engineering workflow.

  What You’ll Do

  As a Staff Engineer, you will be responsible for designing,
  developing and operating significant areas of our routing
  services. In this role, you can expect to:

  - Design and implement scalable services for our API and
    routing engine tiers, following best practices for
    deployment, resilience, and observability.
  - Design and improve services that power the data consumption
    and storage of the routing data.
  - Drive the design, development, and testing of Mapbox tools
  - Shape internal tools and automations to make the whole
    engineering life easier and fun.
  - Drive design and development of services quality metrics and
    analytics.
  - Run and design experiments to evaluate the quality,
    reliability, and capacity requirements of our user-facing
    navigation products.
  - Participate in end-to-end feature implementation within the
    larger navigation team; review code and design documents,
    shepherd feature releases, and participate in an on-call
    rotation.
  - Work with product owners, sales engineering, and management
    to drive future product direction.
  - Participate in an on-call rotation to ensure our systems
    remain available to customers 12/7. Team members alternate
    as the on-call primary responder, which may require
    immediate response outside normal working hours, including
    weekends.

  Navigation API services interact with many internal systems
  at Mapbox, making this a high-visibility team with great
  opportunities to collaborate across the company.

  What We Believe are Important Traits for This Role

  - 5+ years of experience in engineering web services in either
    Rust or Typescript (Node.js)
  - Experience building highly-available API services within
    container-based environments (e.g., Docker, ECS,
    Kubernetes, etc. on AWS)
  - Proficiency in implementing monitoring instrumentation,
    triaging incidents, resolving customer issues, and
    continuous product improvement
  - Knowledge of operating systems and distributed systems
    (e.g., fault-tolerance, consistency, service discovery,
    etc.)
  - Proven ability to design long-term technical strategies that
    balance immediate product delivery with the reduction of
    systemic technical debt across multiple departments
  - Extensive experience driving high-visibility initiatives
    that improve engineering standards and operational
    excellence for the cross-functional teams
  - Strong English verbal and written communication skills (B2
    level minimum). Mapbox has offices across the globe. You
    should communicate about complex ideas concisely to an
    audience worldwide
  - Experience or interest in solving geo-spatial problems

  Candidates should also have:

  - A desire to work with individuals with diverse backgrounds,
    perspectives, and experiences
  - Enthusiasm for learning and knowledge sharing in a
    multidisciplinary environment, supported by mentorship
    experience and strong written and verbal communication
    skills
  - A rigorous approach to problem solving, using experiments
    and data analysis to drive quality of service improvements

  Employment Requirements

  - Employment Type: Full-time
  - Weekly Hours: 40 h per week
  - Location/Hybrid Policy: Remote (from any city in Germany)

  What We Value

  In addition to our core values, which are not unique to this
  position and are necessary for Mapbox leaders:

  - We value high-performing creative individuals who dig into
    problems and opportunities.
  - We believe in individuals being their whole selves at work.
    We commit to this through supportive health care, parental
    leave, flexibility for the things that come up in life,
    and innovating on how we think about supporting our
    people.
  - We emphasize an environment of teaching and learning to
    equip employees with the tools needed to be successful in
    their function and the company.
  - We strongly believe in the value of growing a diverse team
    and encourage people of all backgrounds, genders,
    ethnicities, abilities, and sexual orientations to apply.

  How We Support You

  - Hybrid/Remote Options: Enjoy flexibility to work comfortably
    from home or periodically from an office where applicable.
  - Country-Specific Care & Coverage: Private health, dental,
    and income protection plans tailored to elevate your
    regional statutory benefits.
  - Family-First Support: Family care, maternity and paternity
    leave policies to support your growing family.
  - Lifestyle Spending Account: Contributions to support your
    health, wellness, and personal growth
  - Balance & Brainpower: Mental health support for you and your
    dependents.
  - Rest & Recharge: Paid time away, company holidays, and
    generous absence policies.
  - Time Off to Give Back: Dedicated paid volunteering time in
    addition to your standard PTO.

  By applying for this position, you acknowledge that you have
  received the Mapbox Non-US Privacy Notice for applicants,
  which is linked here. Completing this application requires
  you to provide personal data, such as your name and contact
  information, which is mandatory for Mapbox to process your
  application.

  We are committed to a fair and equitable hiring process. We
  do not discriminate against any protected class.

