description: |
  About Trax

  Trax is a global leader in freight audit and transportation
  spend management. Some of the world's largest enterprises
  rely on us to audit, pay and understand their freight spend
  across modes and countries. We're a globally distributed
  team that works remotely, with main hubs in the US, Costa
  Rica, the Philippines (Cebu), Amsterdam and Tallinn.



  Why now

  We're in the middle of a major transformation. Through 2027
  we're rebuilding the foundations of our platform
  (architecture, data, core features and user experience)
  while keeping major enterprise customers live on the system
  they rely on every day. We've formed focused squads and are
  hiring a small group of specialists to lead the change.

  We're looking for creators and innovators: people with fresh
  eyes and the drive to transform, who have taken a legacy
  platform through change before and know how hard that is
  when large customers depend on it. This is a B2B role
  through and through.



  The role

  Our users live in our interface. We strive for perfection
  from dirty data, and the frontend is where our users see it.
  You'll own the frontend architecture the whole rebuild
  depends on: how our interfaces are designed, built, shared
  and scaled, so they can support reliable operations today
  and new experiences tomorrow.

