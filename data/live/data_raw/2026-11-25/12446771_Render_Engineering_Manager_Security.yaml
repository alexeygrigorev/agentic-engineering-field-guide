description: |
  At Render, we’re building the modern cloud platform for
  developers creating AI-native, full-stack, multi-service
  applications. Our mission is to eliminate the tradeoff
  between the power of hyperscalers and the simplicity of
  developer-friendly platforms—so teams can ship fast, scale
  reliably, and focus on their product, not infrastructure.

  Unlike complex hyperscalers or ephemeral edge/serverless
  solutions, Render offers a developer-first experience with
  persistent compute, dynamic autoscaling, built-in
  orchestration, and observability, allowing teams to launch,
  scale, and manage real-world applications without writing
  infrastructure code or managing servers. Whether you're
  building LLM-powered applications, scalable SaaS products,
  or async processing pipelines, Render empowers teams to move
  fast and scale confidently from MVP to millions of users.

  Our platform is trusted by over 7 million developers
  worldwide and continues to grow rapidly. In February 2026,
  we raised an additional $100M in Series C financing,
  bringing our total funding to $260M, to accelerate our
  vision of making cloud infrastructure both powerful and
  intuitive—designed for the speed of modern AI development.

  We’re a diverse and talented team that values craft,
  velocity, and user experience. If you’re excited to help
  shape the future of the intelligent cloud and empower
  developers everywhere, we’d love to hear from you.

  Applying to Render

  We're seeking candidates who possess high integrity,
  humility, and an insatiable drive to learn. Through reasoned
  discussions and continuous feedback, we strive to improve
  both individually and collectively. We foster an environment
  of mutual trust and respect, empowering effective debate to
  achieve the best outcomes for our customers and team.

  We especially encourage members of underrepresented groups
  in the tech community to apply and understand that not all
  successful candidates will meet each requirement listed.

  Our interview process is unique to each role, and we value
  the candidate experience just as much as our customer
  experience. We hope your conversations with us reflect a
  thoughtful process that is illuminative, enjoyable, and
  respectful of your time.

  About the Role

  We’re looking for an Engineering Manager to lead Trust &
  Safety within Render’s Security team. Your mission is to
  keep Render a trusted place to build and run applications by
  preventing fraud and abuse, protecting customers from
  malicious activity, and making it harder for attackers to
  use our platform.

  You’ll lead a team of engineers who build and operate the
  systems behind this work: detection pipelines, investigation
  tools, automated enforcement, and protections across the
  customer lifecycle. You’ll combine strong people leadership
  with technical judgement, helping the team respond
  effectively to incidents while investing in systems that
  prevent recurring problems.

  You’ll partner closely with Product, Infrastructure,
  customer-facing teams, Finance, and Legal to translate
  emerging threats and customer needs into practical
  engineering work. The decisions your team makes will
  directly affect customer safety, platform reputation, fraud
  losses, and the experience of legitimate developers.

  What You'll Do

  - Lead and grow the Trust & Safety engineering team through
    hiring, mentorship, regular feedback, performance
    management, and career development.
  - Define the team’s roadmap, balancing investigations and
    operational needs with sustained investments in
    prevention, automation, and platform protections.
  - Guide the design and delivery of systems that detect
    phishing, malicious workloads, payment fraud, and other
    forms of platform abuse.
  - Build investigation and enforcement tooling that gives
    responders the context to act quickly, records decisions,
    and supports consistent handling of escalations and
    appeals.
  - Lead the team’s response to significant fraud and abuse
    incidents, coordinating with other Security teams,
    Infrastructure, Support, Finance, and Legal.
  - Establish sustainable on-call and response practices,
    including clear ownership, runbooks, escalation paths, and
    learning from incidents.
  - Partner with Product and Engineering to introduce
    protections at the right points in the customer lifecycle,
    balancing prevention with onboarding friction and false
    positives.
  - Turn knowledge of attacker behavior and recurring abuse
    campaigns into improvements that protect customers and
    reduce repeat incidents.
  - Define and use metrics for fraud losses, detection and
    response time, false positives, repeat abuse, and
    operational workload to guide investment.

  What We’re Looking For

  - 5+ years experience managing and developing engineers,
    including hiring, coaching, performance management, and
    building a healthy, inclusive team.
  - A strong background in software and security engineering,
    with the ability to guide system design, review technical
    proposals, and make pragmatic architectural tradeoffs.
  - Experience building or operating systems for fraud
    prevention, abuse detection, Trust & Safety, or
    adversarial security problems.
  - Experience leading teams with on-call or incident response
    responsibilities, and sound judgement when decisions must
    be made with incomplete information.
  - The ability to translate ambiguous threats and business
    needs into clear priorities, incremental milestones, and
    shipped improvements.
  - Experience using data to evaluate detection quality,
    understand operational problems, and measure whether
    interventions work.
  - Clear communication and effective collaboration across
    engineering and business teams, including explaining risks
    and tradeoffs to technical and non-technical partners.
  - Empathy for customers and responders, high integrity, and a
    strong sense of ownership for both team outcomes and long-
    term system health.

  Nice-to-Haves

  - Experience with cloud infrastructure, developer platforms,
    or services that run customer-controlled code and
    workloads.
  - Experience addressing payment fraud, phishing, malware
    hosting, account compromise, or coordinated abuse
    campaigns.
  - Experience building threat intelligence pipelines, linking
    related malicious accounts, or integrating external
    reputation signals.
  - Familiarity with Go, TypeScript, Kubernetes, Postgres,
    Terraform, or Temporal.
  - Experience partnering with Legal and customer-facing teams
    on sensitive enforcement decisions and external abuse
    reports.
  - Experience building and scaling a team at a growing company.

  If this role excites you but you don’t meet every single
  requirement, we’d still love to hear from you—your unique
  experience might be just what we need.

  Benefits

  - 4 weeks of paid vacation.
  - 14 weeks of fully paid parental leave for all parents to
    bond with a newly born, adopted, or fostered child. We
    will also work with you to create a supportive plan of
    return.
  - Long-term disability, life insurance, and 401K plans.
  - 100% employer-paid medical coverage and 99% employer-paid
    dental and vision coverage for you and a dependent. FSAs
    and HSAs are available as well.
  - Monthly lifestyle stipend for wellness, mental health and
    therapy, hobbies, etc.
  - Monthly cell phone and internet subsidy.
  - Commuter benefits for Renders in the Bay Area, and home
    office stipends for remote Renders.
  - Continuous learning benefits & related support.

  This position is generally not eligible for new visa
  sponsorship. At Render's discretion, the business may
  sponsor existing visa transfers. Applicants who require
  sponsorship must receive business authorization.

