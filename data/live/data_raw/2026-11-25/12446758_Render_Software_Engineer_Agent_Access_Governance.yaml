description: |
  At Render, we’re building the modern cloud platform for
  developers creating AI-native, full-stack, multi-service
  applications. Our mission is to eliminate the tradeoff
  between the power of hyperscalers and the simplicity of
  developer-friendly platforms—so teams can ship fast, scale
  reliably, and focus on their product, not infrastructure.

  Unlike complex hyperscalers or ephemeral edge/serverless
  solutions, Render offers a developer-first experience with
  persistent compute, dynamic autoscaling, built-in
  orchestration, and observability, allowing teams to launch,
  scale, and manage real-world applications without writing
  infrastructure code or managing servers. Whether you're
  building LLM-powered applications, scalable SaaS products,
  or async processing pipelines, Render empowers teams to move
  fast and scale confidently from MVP to millions of users.

  Our platform is trusted by over 7 million developers
  worldwide and continues to grow rapidly. In February 2026,
  we raised an additional $100M in Series C financing,
  bringing our total funding to $260M, to accelerate our
  vision of making cloud infrastructure both powerful and
  intuitive—designed for the speed of modern AI development.

  We’re a diverse and talented team that values craft,
  velocity, and user experience. If you’re excited to help
  shape the future of the intelligent cloud and empower
  developers everywhere, we’d love to hear from you.

  Applying to Render

  We're seeking candidates who possess high integrity,
  humility, and an insatiable drive to learn. Through reasoned
  discussions and continuous feedback, we strive to improve
  both individually and collectively. We foster an environment
  of mutual trust and respect, empowering effective debate to
  achieve the best outcomes for our customers and team.

  We especially encourage members of underrepresented groups
  in the tech community to apply and understand that not all
  successful candidates will meet each requirement listed.

  Our interview process is unique to each role, and we value
  the candidate experience just as much as our customer
  experience. We hope your conversations with us reflect a
  thoughtful process that is illuminative, enjoyable, and
  respectful of your time.

  About the Role

  Render's mission is to eliminate the undifferentiated work
  that goes into building software products by offering an
  easy-to-use, powerful cloud platform for developer teams of
  all sizes.

  We're looking for a software engineer to join our Access &
  Governance team and help build the next generation of
  security and governance experiences on Render. As AI agents
  become more prevalent and organizations scale on Render,
  you'll help shape how customers securely manage access,
  protect their applications, and maintain visibility and
  control over their infrastructure.

  This is a product-focused engineering role where you'll
  solve complex platform challenges while building intuitive,
  customer-facing experiences that make security simple and
  accessible to developers.

  What You'll Do

  - Design and ship customer-facing security and governance
    products, owning the experience end to end, from intuitive
    interfaces and APIs to the underlying backend systems.
  - Build foundational platform capabilities that help
    developers, teams, services, and AI agents securely access
    and operate on Render.
  - Tackle challenging engineering problems involving
    distributed systems, authorization, scalability, and
    reliability while keeping the customer experience simple.
  - Partner closely with Product, Design, and other engineering
    teams to translate complex customer needs into elegant,
    impactful product experiences.
  - Help evolve and operate critical platform systems, ensuring
    high standards for correctness, performance,
    observability, and safe rollouts.

  What We're Looking For

  - 6+ years of experience shipping and operating production
    systems.
  - Experience building and shipping customer-facing platform
    products, with a strong appreciation for intuitive UX,
    well-designed APIs, and end-to-end product ownership.
  - Strong technical fundamentals and experience designing
    reliable, scalable systems, including navigating complex
    APIs, data models, and architectural tradeoffs.
  - A product-minded approach to engineering, with the ability
    to balance technical complexity, customer experience, and
    business impact.
  - A track record of driving ambiguous projects from concept to
    production while collaborating effectively with Product,
    Design, and Engineering.

  We care more about the systems you've built and the
  decisions you made than whether your last role had a
  "security" title.

  Nice-to-haves:

  - Hands-on experience with OAuth, OpenID Connect, SAML, SCIM,
    JWTs or other authentication methods.
  - Experience with multi-tenant authorization models such as
    RBAC, ABAC, or ReBAC, including policy engines or fine-
    grained authorization systems.
  - Experience with workload identity, short-lived credentials,
    secrets management, privileged access, or security
    controls for services and agents.
  - Experience building developer platforms, cloud
    infrastructure, identity product or SaaS products where
    APIs and backwards compatibility matter.
  - Familiarity with compliance frameworks such as SOC 2 or ISO
    27001 and an ability to turn those requirements into
    security improvements for all customers.
  - Contributions to open-source auth/security tooling.

  If this role excites you but you don’t meet every single
  requirement, we’d still love to hear from you—your unique
  experience might be just what we need.

  Benefits

  - 4 weeks of paid vacation.
  - 14 weeks of fully paid parental leave for all parents to
    bond with a newly born, adopted, or fostered child. We
    will also work with you to create a supportive plan of
    return.
  - Long-term disability, life insurance, and 401K plans.
  - 100% employer-paid medical coverage and 99% employer-paid
    dental and vision coverage for you and a dependent. FSAs
    and HSAs are available as well.
  - Monthly lifestyle stipend for wellness, mental health and
    therapy, hobbies, etc.
  - Monthly cell phone and internet subsidy.
  - Commuter benefits for Renders in the Bay Area, and home
    office stipends for remote Renders.
  - Continuous learning benefits & related support.

  This position is generally not eligible for new visa
  sponsorship. At Render's discretion, the business may
  sponsor existing visa transfers. Applicants who require
  sponsorship must receive business authorization.

