description: |
  Responsibilities & Qualifications

  POSITION ACTIVITIES & RESPONSIBILITIES

  - Provides analysis, design, and integration support for
    infrastructure systems, including cloud-based services
    like AWS or Azure for hosting enterprise offerings (e.g.,
    Atlassian Suite).
  - Develops and implements strategies for automating
    deployments using IaC tools such as Ansible, Packer, and
    AWS CloudFormation.
  - Designs and manages cloud environments, including EC2, S3,
    RDS, VPCs, Lambda, IAM, and other AWS services to ensure
    optimal performance, security, and scalability.
  - Implements CI/CD pipelines and integrates with services like
    Bamboo to streamline workflows, accelerate software
    delivery, and ensure consistent configuration management
    across environments.
  - Monitors and manages cloud infrastructure using tools like
    AWS CloudWatch, CloudTrail, Splunk, Prometheus, and
    Grafana to ensure high performance, availability, and
    uptime.
  - Applies security best practices to infrastructure, including
    secure access controls, data encryption, and integration
    with AWS services to safeguard systems from unauthorized
    access and vulnerabilities.
  - Works with containerization technologies (e.g., Docker) and
    orchestration platforms (e.g., Kubernetes, ECS) to scale
    and manage resource-intensive tasks effectively.
  - Performs systems engineering studies and analyses, ensuring
    infrastructure systems meet business and operational
    requirements.
  - Assesses and recommends new technologies, tools, and
    processes to improve system performance, security, and
    efficiency.
  - Provides technical support for troubleshooting system issues
    and ensures corrective actions are taken to maintain
    system reliability.
  - Experience working in an Agile organization using Scrum,
    Kanban, Jira, Confluence, and SAFe.
  - Provide team specific training as needed.

  SKILLS

  - Follow Agile Methodology & Practices
    - Follow SAFe Agile principles and practices, including
      iterative development, continuous delivery, and
      collaboration.
    - Participate in all required SAFe ceremonies, including
      Program Increment (PI) Planning, Iteration Planning,
      Daily Standups, Sprint Reviews, and Retrospectives.
    - Continuously improve development processes by embracing
      retrospectives and feedback from stakeholders.
    - Support and adhere to the integration of system-level
      architecture and design principles to ensure system
      interoperability.
  - Responsible for
    - Agile Artifacts: Documentation of all work in Epics,
      Features, and Stories in JIRA.
    - User Stories: Document detailed user stories for each
      feature. These user stories will be maintained and
      updated throughout the project lifecycle as needed.
    - Product Backlog & Iteration Backlogs: Create and maintain a
      prioritized product backlog outlining all features and
      functionalities. Additionally Iteration backlogs will be
      developed for each iteration, detailing the specific
      user stories planned for completion within that
      timeframe.
  - Collaboration & Communication
    - Plan and coordinate with all teams within the Value Streams
      (ex. Shared Services value stream) to ensure alignment
      and cross-functional collaboration.
    - Foster transparency through regular progress updates and
      continuous communication with stakeholders.
    - Participate in System Demos and demonstrate completed work
      to stakeholders at the end of each iteration.
    - Collaborate with other teams across the organization to
      remove dependencies and resolve blockers to ensure
      continuous flow of work.
  - Work Management & Tools
    - Use the Government-provided toolset (e.g., JIRA, Confluence)
      for managing work, tracking progress, and documenting
      deliverables.
    - Break down work into manageable features and user stories
      with clear acceptance criteria.

  REQUIRED QUALIFICATIONS

  - Active Secret Clearance or higher
  - 5 or more years of experience in related field

  PREFERRED QUALIFICATIONS & COMPETENCIES

  - Bachelor's degree in computer science, Software Engineering,
    Information Systems, or a related technical field,
    preferred.

  Overview

  TekSynap is seeking members for an Agile service contract.
  To meet strategic goals and operational needs, specialized
  Agile teams are needed to focus on Data Engineering, Data
  Standards, Core Services, and Enterprise Tools support. This
  contract is for Agile teams to advance the organization's
  Enterprise Services capabilities, focusing on delivering
  secure, scalable, and high-quality solutions that meet
  evolving business needs. Agile teams will be responsible for
  understanding complex technical and organizational
  requirements, then translating them into innovative,
  efficient solutions that align with enterprise standards and
  promote seamless integration across various systems.
  Following the Scaled Agile Framework (SAFe) Agile
  methodology, the teams will ensure a continuous delivery
  model that meets rigorous standards of security,
  scalability, and reliability. Agile teams will bring
  expertise across essential domains, including data
  engineering and standards, software development, and
  enterprise tool support, ensuring comprehensive capabilities
  to meet the diverse technical and operational needs of the
  government customer.

  TekSynap is a fast-growing high-tech company that
  understands both the pace of technology today and the need
  to have a comprehensive well planned information management
  environment. “Technology moving at the speed of thought”
  embodies these principles – the need to nimbly utilize the
  best that information technology offers to meet the business
  needs of our Federal Government customers.

  We offer our full-time employees a competitive benefits
  package to include health, dental, vision, 401K, life
  insurance, short-term and long-term disability plans,
  vacation time and holidays.

  Visit us at www.TekSynap.com.

  Apply now to explore jobs with us!

  The safety and health of our employees is of the utmost
  importance. Employees are required to comply with any
  vaccination requirements mandated by contract, applicable
  law or regulation.

