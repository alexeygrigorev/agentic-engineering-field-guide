description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  We’re hiring talented Software Engineers for the Snowflake
  Dynamic Tables team in Berlin, Germany. Join us to build the
  next generation data platform that enables customers to
  transform data with declarative SQL while maintaining
  control over cost, latency, and throughput. We are looking
  for strong engineers who are enthusiastic about building new
  cutting-edge technologies, who look forward to tackling
  complex database problems, and pick up and understand deep
  technical areas quickly. You will work alongside seasoned
  engineers and grow in your scope and influence.

  AS A SOFTWARE ENGINEER AT SNOWFLAKE YOU WILL:

  - Work with a talented and collaborative team of engineers and
    Product Managers in our globally distributed team to
    design and build Dynamic Tables capabilities
  - Design, implement, support, and evolve new features and
    performance improvements
  - Help shape technical and product direction with senior
    teammates
  - Break ambiguous problems down, weigh the tradeoffs, and make
    technical and product decisions
  - Analyze and solve performance, correctness, and fault-
    tolerance challenges at scale
  - Dig into unfamiliar parts of a large system to root cause
    and solve problems
  - Ensure operational readiness of what you build and help meet
    the commitments to our customers regarding reliability,
    availability, and performance
  - Understand how customers use Dynamic Tables to shape what
    you build

  OUR IDEAL SOFTWARE ENGINEER WILL HAVE:

  - 2+ years of industry experience designing and building
    database internals or data-intensive systems, or
    equivalent research experience
  - Excellent problem-solving skills and strong CS fundamentals
    including data structures, algorithms, and distributed
    systems
  - A track record of taking a problem from open question to
    software running in production
  - Proficiency with AI-native software engineering and agentic
    development workflows
  - Preference for working in a collaborative team with
    opportunities to both mentor and learn
  - BS in Computer Science or related field
  - Strong English communication skills

  BONUS POINTS FOR EXPERIENCE WITH THE FOLLOWING:

  - Query compilers, optimizers, or database internals
  - Building enterprise-grade, reliable and trustworthy software
    or services
  - Large scale distributed systems, transactions and
    consistency models
  - Contributions to open-source data infrastructure or database
    systems

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
