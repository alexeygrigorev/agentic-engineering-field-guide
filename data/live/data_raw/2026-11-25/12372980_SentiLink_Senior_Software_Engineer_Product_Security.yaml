description: |
  SentiLink helps institutions and protects customers by
  accurately resolving identities and flagging fraud risk.
  Each day, we verify more than 3 million identities, flagging
  150k+ fraud attempts in the process. The problems we work on
  are challenging, and solving them takes deep domain
  expertise, rigorous analysis, and a willingness to dig into
  the details.

  At SentiLink, you'll work alongside smart, highly
  collaborative colleagues who respect each other's time and
  judgment, take ownership, and follow through on their
  commitments. Together, we do truly meaningful work
  protecting the identities of innocent consumers and flagging
  the fraudsters attempting to exploit them.

  We're well capitalized and growing quickly. We already serve
  13 of the top 15 U.S. banks, we're expanding into new
  markets, and we're backed by Craft Ventures, Andreessen
  Horowitz, NYCA, and Max Levchin. We've been named to the
  Forbes Fintech 50 and as a 2026 FICO Industry Vanguard
  Decision Award Winner. We were also the first company to go
  live with the electronic Consent Based Social Security
  Number Verification (eCBSV) service, and we've testified
  before the U.S. Congress on the future of identity.

  We want SentiLink to be the best place you've ever worked.
  We offer generous benefits and support a range of working
  arrangements, from fully remote to in-office. We are a
  digital-first company with strong collaboration across the
  U.S. and India, and we meet in person regularly to build
  relationships. We have offices in Austin, San Francisco, New
  York City, Seattle (Bellevue), Los Angeles, and Chicago in
  the U.S., and in Gurugram (Delhi) and Bengaluru in India.

  Role:

  SentiLink's Information Security team protects our systems,
  data, and customers while enabling the business to move
  quickly and securely. As software development accelerates
  across the company, we're investing in engineers who can
  both build security capabilities and improve the security of
  the products we deliver to customers.

  We're looking for a Senior Software Engineer, Product
  Security who combines strong software engineering skills
  with a security mindset. You'll build and operate custom
  security applications, automation, and integrations;
  investigate vulnerabilities in our applications and cloud
  infrastructure; and help engineering teams develop, test,
  and deliver more secure software.

  This role spans software development and hands-on product
  security. You'll work closely with other product security
  engineers and the broader Engineering and Infrastructure
  teams to uncover difficult security problems, develop
  practical solutions, and drive them through implementation.
  We're looking for someone who is curious about how systems
  fail, can navigate complex codebases and architectures, and
  has the technical range to move between building security
  tooling and validating the security of customer-facing
  products.

  Responsibilities:

  - Design, build, deploy, and maintain custom security
    applications and services that improve vulnerability
    discovery, attack-surface visibility, security testing,
    and remediation workflows.
  - Develop backend services, APIs, data-processing pipelines,
    integrations, and user interfaces that make security
    information useful and actionable for engineers.
  - Assess the security of SentiLink's customer-facing products
    and internal applications through code review, threat
    modeling, vulnerability research, and hands-on security
    testing.
  - Perform targeted penetration testing and validate potential
    vulnerabilities, including reproducing findings, assessing
    exploitability and impact, and verifying that fixes are
    effective.
  - Work directly with product engineering teams to investigate
    and remediate application vulnerabilities, strengthen
    security-sensitive designs, and implement durable fixes.
  - Develop and improve automated security testing within CI/CD
    and application delivery workflows, including static and
    dynamic analysis, dependency and container scanning, and
    security validation.
  - Build integrations with cloud services, source-control
    systems, scanners, and other engineering and security
    platforms; improve the quality and usefulness of
    vulnerability data and reduce manual operational work.
  - Use AI-assisted development and security analysis tools to
    accelerate delivery and expand testing coverage, while
    applying independent technical scrutiny to their output.
  - Take responsibility for the full lifecycle of the systems
    you build, including architecture, implementation,
    testing, deployment, observability, reliability, and
    ongoing improvement.
  - Collaborate with Security Engineering, Infrastructure, and
    product teams on security architecture, technical
    investigations, incident response, and remediation of
    identified risks.
  - Participate in the security on-call rotation and help
    improve the effectiveness of the team's technical security
    capabilities.

  Requirements:

  - 4+ years of professional software engineering, product
    security engineering, or closely related experience, with
    substantial recent hands-on coding work.
  - Strong proficiency in at least one modern programming
    language such as Python, Go, Java, or TypeScript, with the
    ability to work effectively across unfamiliar codebases
    and technologies.
  - Demonstrated experience designing, shipping, and operating
    substantial software systems, including backend services,
    APIs, integrations, and data-intensive applications.
  - Ability to investigate application security weaknesses at
    the code and architecture levels, understand how
    vulnerabilities can be exploited, and work with developers
    to implement effective remediations.
  - Experience with practical application security testing,
    vulnerability assessment, or penetration testing,
    including validating findings beyond automated scanner
    output.
  - Strong understanding of common software security failures,
    authentication and authorization, web services and APIs,
    dependencies, and secure development practices.
  - Familiarity with cloud-native application environments,
    including AWS or comparable cloud platforms, containers,
    CI/CD, and infrastructure as code.
  - Demonstrated ability to independently navigate ambiguous
    technical problems, investigate root causes, make
    pragmatic tradeoffs, and drive projects through delivery.
  - Strong communication and collaboration skills, particularly
    when working with engineers to explain vulnerabilities,
    evaluate fixes, and improve security without creating
    unnecessary friction.

  Nice to have:

  - Experience developing vulnerability-management, attack-
    surface management, security analytics, or security
    automation platforms.
  - Experience building security testing tools, exploit
    validation harnesses, fuzzers, or other offensive-security
    automation.
  - Hands-on red-team experience, advanced penetration testing,
    vulnerability research, or participation in responsible
    disclosure programs.
  - Experience with AWS IAM, EKS/Kubernetes, cloud networking,
    Terraform, and security-sensitive cloud architecture.
  - Experience integrating SAST, DAST, SCA, container scanning,
    or software supply-chain security controls into developer
    workflows.
  - Experience with PostgreSQL, asynchronous processing, event-
    driven systems, FastAPI, React, or similar application
    technologies.
  - Experience building LLM-based agents or using AI-assisted
    tooling for software development, security testing, or
    vulnerability discovery.
  - Published security research, open-source tooling
    contributions, CVEs, or other evidence of hands-on
    security exploration.
  - Experience in fintech, identity verification, financial
    services, or highly regulated SaaS environments.
  - Familiarity with FedRAMP, SOC 2, PCI DSS, or comparable
    security and compliance obligations.

  Compensation:

  - $180,000/year - $230,000/year + equity + benefits

  Perks:

  - Employer paid group health insurance for you and your
    dependents
  - 401(k) plan with employer match (or equivalent for non US-
    based roles)
  - Flexible paid time off
  - Regular company-wide in-person events
  - Home office stipend, and more!

  Corporate Values:

  - Follow Through
  - Deep Understanding
  - Whatever It Takes
  - Do Something Smart
