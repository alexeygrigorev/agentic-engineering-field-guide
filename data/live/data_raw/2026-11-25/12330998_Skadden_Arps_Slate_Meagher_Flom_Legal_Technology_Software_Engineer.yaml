description: |
  We invite you to review our current business services
  professionals openings to learn about the opportunities
  available across the firm.

  About Us

  Skadden, Arps, Slate, Meagher & Flom LLP has forged a
  reputation as one of the most prestigious law firms in the
  world. Relying on innovation, intellect, teamwork and
  tenacity, our lawyers deliver the highest quality advice and
  novel solutions to our clients’ legal issues. We are known
  for handling the most complex transactions,
  litigation/controversy issues, and regulatory matters, as
  well as for the strong partnerships we build with clients
  and each other. Our attorneys, who reflect a broad range of
  experiences and perspectives, work together seamlessly
  across 50-plus practices and 21 offices in the world’s major
  financial centers.

  The Opportunity

  We are seeking a Legal Technology Software Engineer to join
  our Firm. This position will be based in our New York office
  (hybrid).

  Position Overview

  Participates in all aspects of the product development life
  cycle, from design to delivery, building modern, high-
  performance web, desktop, and AI-enabled applications that
  provide an outstanding user experience for the Firm’s
  attorneys and staff. Develops features, APIs, and
  integrations using technologies such as C#, ASP.NET Core,
  and Angular, and builds solutions that apply large language
  models and AI agents to legal and business workflows. Works
  within an agile team using modern engineering practices,
  including code review, automated testing, CI/CD, and cloud
  deployment, and follows Firm requirements for information
  security and confidentiality.

  Responsibilities

  - Meets with team members, end users, and stakeholders to
    understand business needs and establish software
    requirements.
  - Prepares analyses of processes and requirements and writes
    user stories with acceptance criteria.
  - Designs and develops features for web applications using
    Angular, C#, ASP.NET Core, TypeScript, HTML, and CSS, and
    maintains and enhances existing desktop applications.
  - Develops and consumes REST APIs and builds integrations
    between Firm applications and third-party platforms.
  - Designs databases and data access layers based on analysis
    of requirements within established guidelines.
  - Develops AI-enabled features and applications that integrate
    with large language model services, including prompt
    design, retrieval-augmented generation (RAG), and tool or
    function calling.
  - Builds and contributes to AI agents and agentic workflows
    that automate multi-step legal and business processes,
    with appropriate human review and oversight.
  - Tests and evaluates AI features for accuracy, reliability,
    and cost, and monitors their performance in production.
  - Uses AI-assisted development tools, such as coding
    assistants, to improve productivity and code quality,
    applying careful review and following Firm guidelines for
    approved technology use.
  - Writes high-performance, maintainable code that follows team
    coding standards, and participates in code reviews.
  - Develops unit and integration tests and contributes to
    automated testing.
  - Develops application testing plans and partners with Quality
    Assurance on the testing process, including compatibility
    with existing desktop applications.
  - Builds and deploys applications on cloud platforms such as
    Azure and contributes to CI/CD pipelines.
  - Implements authentication, authorization, and security
    access controls in applications, and applies secure coding
    practices to protect Firm and client information,
    including data used by AI services.
  - Troubleshoots and resolves production issues in partnership
    with support and operations teams.
  - Instructs Legal Technology Trainers in use and training of
    the software.
  - Researches emerging technology and AI trends and shares
    findings and recommendations with the team.
  - Demonstrates effective interpersonal, written and verbal
    communication skills to facilitate effective work
    relationships with others.
  - Manages Firm resources responsibly.
  - Complies with and understands Firm operation, policies and
    procedures.
  - Performs other related duties as assigned.

  Qualifications

  - Experience developing applications using C#, .NET and
    ASP.NET Core, and modern front-end frameworks such as
    Angular, with TypeScript, HTML5, and CSS
  - Experience maintaining desktop applications using WPF and
    MVVM
  - Experience designing and consuming REST APIs and integrating
    with third-party services
  - Ability to design SQL Server database objects, including
    tables, stored procedures, and user-defined functions, and
    to work with ORMs such as Entity Framework
  - Experience building applications that use large language
    model APIs (e.g., Azure OpenAI, Anthropic, or similar
    services)
  - Hands-on experience with AI application patterns such as
    retrieval-augmented generation, embeddings and vector
    search, agents and tool calling, and AI evaluation
  - Experience using AI-assisted coding tools in a professional
    development workflow
  - Experience with Git-based source control, pull requests,
    code reviews, and CI/CD pipelines using tools such as
    Azure DevOps
  - Experience with cloud development and services (e.g., Azure)
  - Experience writing unit and integration tests
  - Knowledge of secure coding practices, including
    authentication, authorization, and protection of sensitive
    data
  - Knowledge of Agile development methodologies
  - Strong problem solving abilities and an aptitude for
    learning new technologies
  - Strong analytical, troubleshooting, organizational, and
    planning skills, with close attention to detail and the
    ability to prioritize work effectively.
  - Excellent written and verbal communication and interpersonal
    skills, with sound judgment, discretion, and the ability
    to handle sensitive and confidential matters.
  - Proven ability to thrive in demanding, fast-paced
    environments, manage multiple projects and shifting
    priorities, and work both independently and
    collaboratively as part of a team
  - Flexibility to adjust hours and work the hours necessary to
    meet operating and business needs

  Education and Experience Required

  - Bachelor’s degree in Computer Science or equivalent
  - Minimum of four years of software development work
    experience

  Culture & Life at Skadden

  What makes Skadden special is our people and the culture,
  community and spirit of collaboration we have created. We
  believe in teamwork and inspiring each other to be our best
  in an atmosphere that promotes professionalism and
  excellence in all that we do. We know that inclusion and
  drawing on the strength of a wide spectrum of talent only
  make us better and is vital to the firm's success. Our goal
  is for everyone at the firm to enjoy a challenging career
  with opportunities for development and growth and to support
  the well-being of our attorneys and business services
  professionals.

  Benefits

  The overall well-being of our team is important to us. We
  offer generous benefits to help you achieve wellness in all
  areas of your life.

  - Competitive salaries and year-end discretionary bonuses.
  - Comprehensive health care (medical, dental, vision), savings
    plan/401(k) and voluntary benefits.
  - Generous paid time off.
  - Paid leave options, including parental.
  - In-classroom, remote, and on-demand learning and
    professional development opportunities.
  - Robust well-being classes and programs.
  - Opportunities to give back and make an impact in local
    communities.

  For further details, please visit:
  https://www.skadden.com/careers/staff/employee-benefits

  The starting base salary for this position is expected to be
  within the range listed under Salary Details.  Actual salary
  will be determined based on skills, experience (to the
  extent relevant) and other-job related factors, consistent
  with applicable law.

  Salary Details

  $135,000 - $155,000

