description: |
  About the Role

  Uber One is Uber's flagship membership program, serving more
  than 50 million members globally across Mobility, Delivery,
  Grocery, and other Uber experiences. Membership combines
  savings, benefits, priority experiences, and exclusive
  offerings while driving engagement, cross-platform adoption,
  and long-term retention.

  As a Senior Software Engineer, you will lead significant
  backend and product-platform investments that support user-
  facing Membership experiences at global scale, spanning
  high-QPS services, experimentation, APIs, and consumer
  product integrations.

  What You Will Do

  - Lead high-scale backend systems powering Membership
    benefits, savings, and engagement.
  - Architect reliable, low-latency services and APIs across
    Mobility and Delivery.
  - Build platforms that enable teams to rapidly launch and
    experiment with member experiences.
  - Lead complex projects from architecture through global
    productionization and measurement.
  - Partner across Product, Design, Data Science, Web, Android,
    and iOS.
  - Create reusable frameworks that improve developer velocity
    and reduce technical debt.
  - Mentor engineers and raise standards for design,
    reliability, and operational excellence.

  Basic Qualifications

  - 5+ years of professional software engineering experience
    building large-scale systems.
  - Strong proficiency in Go, Java, Python, C++, or a comparable
    backend language.
  - Deep understanding of distributed systems, APIs, data
    modeling, and service architecture.
  - Experience designing high-throughput, low-latency systems
    with strong availability requirements.
  - Proven ability to own complex projects from ambiguous
    requirements through production.
  - Experience building backend platforms that directly power
    consumer-facing products.
  - Strong collaboration skills across multiple engineering and
    product teams.

  Preferred Qualifications

  - Experience building membership, subscription, benefits,
    growth, or consumer engagement products.
  - Experience building consumer-facing products in real-time
    marketplaces at global scale.
  - Experience with experimentation, personalization,
    configuration, or dynamic product platforms.
  - Strong product mindset with a track record of translating
    consumer needs into measurable customer and business
    impact.
  - Proven ability to lead across teams and navigate complex
    cross-system dependencies.
  - Demonstrated ability to combine strong backend architecture
    with consumer-product judgment.

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For Sunnyvale, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
  various benefits.

  About Us

  Ready to Ride?



  This isn't the kind of place where you follow a playbook —
  it's where you help write one. If you're driven by impact,
  energized by challenge, and ready to shape how the world
  moves — we'd love to hear from you.

  You may be eligible for bonuses, equity, and other
  compensation, as well as a range of benefits. Explore our
  benefits.

  Offices remain key to collaboration and Uber's culture.
  Unless approved for full remote work, employees must spend
  at least 50% of their time in-office. Some roles, like those
  at greenlight hubs, require full-time in-office presence.
  Ask your Recruiter for details about this role's
  requirements.

