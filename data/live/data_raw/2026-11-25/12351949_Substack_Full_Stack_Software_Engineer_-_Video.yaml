description: |
  Substack is building a new economic engine for culture,
  giving the brightest, most interesting, and most creative
  people on the internet the power of their own publishing
  platform. The terms of our culture should not be set by
  gate-keeping legacy media or chaos-fueling social media, but
  by the people who make and participate in that culture.
  Substack’s model, based on direct subscriptions, has fueled
  an explosion of independent publishing. It empowers creators
  with economic autonomy, creative ownership, and a direct
  connection to their most engaged audiences.

  As a Software Engineer at Substack, you are responsible for
  the core product platform, from APIs, low-level services,
  and database operations, to frontend UI and testing. On the
  Video team you’ll be working on podcasting, live streaming,
  video and audio recording, uploading, clipping, and
  everything related to an excellent video product experience.
  Full Stack Engineers work in close partnership with
  designers, product thinkers, and customers directly to build
  out new product offerings and tooling across the platform.
  They are on the front-lines of product development and are
  responsible for creating what’s next for Substack.

  Responsibilities

  - With the support of the engineering team, develop the core
    Substack product for creators and consumers. This is a
    dynamic organization with needs across the board. We
    expect that engineers will be able to jump into any area
    of the product, learn quickly and add value.
  - Support and collaborate with other team members, including
    engineers, designers, creators, support staff, and many
    others.
  - Own your work and deliver high-quality solutions from
    product concept and proposal to implementation,
    experimentation, and measurement.
  - Work directly with customers to solve their problems. The
    entire company (CEO included) participates in customer
    support in order to drive empathy for our users and help
    us build better products.
  - We work with TypeScript, especially Node/Express and React,
    and Postgres. It’s helpful if you know these technologies
    already, if not, we’ll be excited to help you learn.
  - We work to stay on the leading edge of AI tooling, to both
    improve our internal workflows, as well as utilize them in
    product to improve publisher capabilities and experiences

  Requirements

  - 4+ years of non-internship professional full stack web
    software development.
  - Proficiency with Node.js and React is an advantage.
  - Have a degree in Computer Science or have the equivalent
    industry experience.
  - Independent and autonomous. We’re too small to micromanage,
    and expect that every person at the company owns their
    work and can be a leader.
  - Take pride in building elegant and delightful product
    experiences. Substack works best when it gets out of the
    way so creators can focus on creating and connecting with
    their readers.
  - Enjoy collaboration with a diverse group of thinkers while
    bringing our own unique experience and background to the
    team.
  - Believe in Substack’s mission to build a better business
    model for content creation.
  - Proficiency with video processing frameworks and libraries
    such as FFmpeg is an advantage.
  - Experience with workflow systems such as Temporal is an
    advantage.

  Substack’s compensation package includes a market
  competitive salary, equity for all full time roles, and
  exceptional benefits. Our cash compensation salary range for
  this role is $140,000 - $260,000. Final offer amounts are
  determined by multiple factors including candidate
  experience and expertise and may vary from the amounts
  listed above.

  Substack is an equal opportunity employer. All applicants
  will be considered for employment without regard to race,
  color, religion, sex (including pregnancy, sexual
  orientation, gender identity or transgender status), age,
  national origin, veteran or disability status. We’re seeking
  people passionate about enabling independent expression and
  building a better business model for creators. If you want
  to see what media, communities, and content can become when
  unmoored from advertising models, and you have the skills
  and experience to contribute, we’d love to meet you.

