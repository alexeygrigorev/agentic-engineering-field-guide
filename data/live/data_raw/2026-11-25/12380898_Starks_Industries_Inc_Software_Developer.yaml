description: |
  SUMMARY

  The Software Developer is responsible for designing,
  developing, testing, and maintaining secure, enterprise-
  level applications in support of mission-critical
  operations. This role works collaboratively with DevSecOps
  teams to implement modern development practices, support
  automation and continuous integration/continuous delivery
  (CI/CD) pipelines, and ensure compliance with federal
  cybersecurity and system authorization requirements. The
  ideal candidate brings strong technical expertise, a
  security-focused mindset, and experience supporting
  applications in regulated or secure environments.



  KEY DUTIES AND RESPONSIBILITIES

  - Design, develop, test, deploy, and maintain enterprise
    applications throughout the full software development
    lifecycle

  - Support and enhance solutions using SharePoint, Power
    Platform, and automation tools

  - Collaborate with DevSecOps teams to support CI/CD pipelines
    and modern development practices

  - Troubleshoot, analyze, and resolve application issues in a
    timely and efficient manner

  - Participate in system upgrades, enhancements, and
    modernization initiatives

  - Ensure applications meet security, compliance, and
    authorization requirements

  - Support compliance with federal cybersecurity frameworks and
    system authorization processes

  - Apply secure coding practices and contribute to continuous
    improvement of system reliability and performance



  EDUCATION AND/OR EXPERIENCE

  - Bachelor’s degree in Computer Science, Information Systems,
    or a related field, or equivalent professional experience

  - Minimum of 3–7+ years of professional software development
    experience

  - Experience working with modern development frameworks,
    tools, and methodologies

  - Familiarity with DevSecOps principles and practices

  - Experience supporting applications in federal, government,
    or other highly regulated environments is preferred

  - Ability to obtain and maintain a U.S. Department of Defense
    (DoD) security clearance as required by the contract;
    active clearance preferred



  KNOWLEDGE, SKILLS AND ABILITIES

  - Strong proficiency in software design, development, and
    testing methodologies

  - Experience with SharePoint, Power Platform, and/or
    automation tools preferred

  - Knowledge of federal cybersecurity standards and frameworks,
    including RMF and NIST 800-53, is highly desirable

  - Understanding of secure coding principles and system
    authorization requirements

  - Ability to collaborate effectively within cross-functional
    technical teams

  - Strong problem-solving, analytical, and troubleshooting
    skills

  - Excellent communication skills, with the ability to document
    and explain technical concepts clearly

  - Ability to adapt to evolving technologies, tools, and
    mission requirements
