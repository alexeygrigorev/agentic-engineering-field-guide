  Care Lumen | Remote (US Only)

  Employment Type: Full-time Employee

  Salary Range: $145000 to $174000

  About the Role Care Lumen is a healthcare technology company
  on a mission to connect people, care, and data so that every
  decision leads to better outcomes. Built in partnership with
  one of the nation’s largest healthcare organizations, we
  develop a unified clinical platform that supports care teams
  and the people they serve. Care management is how people
  living with serious illness get the right level of support
  and care, at the right time. Behind every case is a person
  who may be facing the hardest stretch of their life, and a
  care team working to make sure they don’t face it alone. The
  software we build helps those care teams see the full
  picture, act quickly, and focus their time on the people
  they serve. This is a role for a mission-driven engineering
  leader who still loves to build. You’ll lead one of our care
  management engineering teams, creating software that care
  teams rely on every day. You’ll set the technical direction,
  stay close to the code, and push what’s possible with AI,
  both in how your team builds software and in where AI can
  make a real difference for care teams. We’re already
  building AI and ambient listening capabilities for care
  teams, and it’s early days, so there’s real room to help
  shape where they go. This is also a transformation role.
  We’re moving to fully AI-native software development, and
  you’ll lead your team through that change: raising the bar,
  investing in engineers who are ready to grow, and building
  out the team with new talent where it’s needed.

  You’ll have real ownership. Our infrastructure is run by our
  client’s teams, but your team owns its services end to end,
  from the first design sketch to how they perform in
  production.

  What You’ll Do

  - Build and lead a team of engineers who care about their
    craft and about the people their software serves; hire
    well, give direct feedback, and help every engineer grow,
    including senior engineers ready to become technical
    leaders
  - Shape the architecture of your team’s services and make the
    big technical calls with your senior engineers, designing
    systems that stay easy to change as care models and
    healthcare rules evolve
  - Stay hands-on: write code, review pull requests, dig into
    tough production issues, and jump in on features and fixes
    when it helps the team
  - Push the frontier of AI-assisted development on your team:
    use AI coding and agentic tools in your own work, find out
    what really works, and turn it into practices that help
    your engineers build better software faster, safely
  - Get close to the work of care teams and the people they
    support, partnering with product and care management
    experts to understand real problems and turn them into
    simple, well-designed solutions shipped in small, frequent
    increments
  - Own your services end to end, including quality,
    observability, reliability, and performance, on
    infrastructure run by our client; when something breaks,
    your team owns the fix
  - Treat the protection of patient data as a first principle,
    building security and privacy into your designs from the
    start
  - Keep your systems healthy by paying down technical debt,
    keeping dependencies current, and making smart build-vs-
    buy calls
  - Collaborate with the other care management teams, sharing
    what you learn and keeping your plans and technical
    choices aligned

  What’s Required

  - 8+ years building software, including 2+ years managing
    engineers, and a genuine enjoyment of still writing code
  - Strong engineering foundation, with current skills in a
    modern backend language (e.g., Java, C#, Python, Go, or
    TypeScript) and experience designing and building
    distributed services, APIs, and data models
  - Hands-on experience using AI to build software, with AI
    coding assistants and agentic development tools (e.g.,
    GitHub Copilot, Claude Code, Cursor) as a real part of how
    you work, and experience helping a team adopt them
  - A track record of shipping and running production systems,
    including automated testing, CI/CD, observability, and
    incident response on cloud and containerized platforms
  - Experience building and growing engineering teams through
    hiring, coaching, and developing engineers
  - A genuine connection to the mission: you’re motivated by
    improving care for people with serious illness, and you
    bring empathy for patients, care teams, and your own
    engineers to your work
  - A product mindset: you partner closely with product, take
    time to understand the people using your software, and
    favor simple solutions
  - Experience building secure systems that handle sensitive
    data
  - Clear communication and a compassionate, collaborative
    leadership style that earns trust with engineers and
    partners alike

  What’s Preferred

  - Experience building care management solutions, such as care
    coordination, case management, or population health tools
  - Experience in healthcare or another regulated industry
    (HIPAA, SOC 2), including familiarity with Medicaid or
    Medicare lines of business
  - Experience with ambient listening technologies, such as
    ambient clinical documentation, speech-to-text, or AI-
    generated summaries of care conversations
  - Experience building product features with large language
    models
  - Experience with healthcare interoperability standards such
    as FHIR or HL7

  Compensation & Benefits

  The expected total cash compensation for this role is
  market-driven, with an expected starting salary of $145000
  to $175000. Salary is ultimately determined based on a
  candidate's skills, expertise, and experience.  Care Lumen
  offers a robust and comprehensive benefits package
  including:

  - Remote-first environment with company provided computer
  - Thirteen paid holidays per year (average)
  - Medical, dental and vision coverage with multiple levels of
    coverage
  - HSA, FSA and Dependent Care accounts
  - Short-term and Long-term disability
  - Life and accidental death insurance
  - Discounted voluntary benefits, such as additional life
    insurance
  - Employee Assistance Program
  - Paid Parental Leave
  - Flexible vacation time
  - 401(k) with employer matching and immediate vesting

  Offers are contingent upon successful completion of a
  background screening. Background screenings will be
  conducted in compliance with applicable laws and will not be
  initiated without your consent.

