description: |
  About Fabric Health

  At Fabric Health, we are powering boundless care by solving
  healthcare’s biggest challenge: clinical capacity. We aren’t
  here to disrupt healthcare; we’re here to fix it. We unify
  the care journey from intake to treatment, using intelligent
  automation to remove administrative burdens and make care
  delivery 2-10x more efficient. Our technology empowers
  clinicians to move faster and focus on what matters most:
  the patient.

  We are a mission-driven team of brilliant minds trusted by
  leading organizations including Intermountain Health, OSF
  HealthCare, SSM Health, and MUSC Health. Our vision is
  backed by premier investors such as Thrive Capital, GV
  (Google Ventures), General Catalyst, and Salesforce
  Ventures. We move quickly for good reason, listen deeply to
  solve big challenges, and build products with the same care
  and quality we’d want for our own loved ones.

  Learn more: About Us | News & Press | LinkedIn | Careers

  About the Role

  MEM is a full stack team focused on driving patient
  momentum, expanding the care relationship between patient
  and provider, and building engagement between visits. You
  work with product, design, data analytics, clinical, and
  engineering partners, and you are a key contributor to the
  design, development, delivery, and maintenance of the Python
  and Django services behind member-facing features. Much of
  MyHealth runs on legacy code, so judgment about what to
  refactor, what to rebuild, and what to leave alone matters
  as much as speed.

  Every service you touch carries protected health
  information, so HIPAA and SOC 2 shape how you design, log,
  and test from the first commit. You use AI coding tools
  every day to read unfamiliar code faster, draft tests, and
  work through refactors, and you check what they produce. As
  the AI companion work takes shape, you help decide how AI
  fits into member-facing features safely.

  What You'll Do

  As a Software Engineer on the Member Experience team, your
  primary responsibilities include:

  - Member-Facing Services:
    - Design and build backend services and APIs in Python and
      Django that power member-facing experiences such as
      intake, messaging, and health tracking.
    - Modernize MyHealth, where members review their
      prescriptions, visit history, and personal care plan, so
      it is safer and faster to change.
    - Build messaging capabilities that help members reach their
      care team and help our operations team respond more
      efficiently.
    - Deliver the backend for Quick Care for PlushCare patients,
      applying Fabric's async clinical protocols to quick
      visits.
    - Improve the personalization and care-navigation logic that
      determines what each member sees and is recommended
      next.
    - Shape the backend design for a potential AI companion that
      supports more personalized health plans.

  - Data and Reliability:
    - Model and evolve data in MySQL and Postgres, writing
      migrations and queries that stay performant as the
      member base grows.
    - Own the quality of what you ship: unit tests, meaningful
      monitoring, and a fast path to diagnosing issues in
      production.
    - Investigate and resolve production issues affecting members,
      tracing problems across services and datastores to
      durable fixes.
    - Protect PHI in every design, log line, and data change, in
      line with HIPAA and SOC 2 requirements.

  - Collaboration and Craft:
    - Partner with product, design, data analytics, and clinical
      teams to translate member needs into technical
      requirements, and push back when a simpler solution
      serves the member better.
    - Strengthen the codebase through thoughtful refactoring,
      clear documentation, and constructive code review.
    - Use AI coding tools such as GitHub Copilot, Cursor, or
      Claude Code to navigate legacy code, scaffold tests, and
      speed up refactors, reviewing every change before it
      ships.

  Why You Might Be a Good Fit

  - You have worked in a large, mature Django codebase and know
    how to improve legacy code without breaking what members
    rely on.
  - You think about the member first and can explain the
    tradeoffs of a technical choice to a product manager or a
    clinician.
  - You like turning an ambiguous product idea into a plan with
    scoped, testable steps.
  - You reach for the simpler solution when it serves the member
    better, and you say so.
  - You treat tests, monitoring, and documentation as part of
    the work, not cleanup for later.
  - You want your work to matter to the whole team, because the
    next web and mobile feature often waits on the service you
    build.
  - You use AI tools in your daily workflow, get real leverage
    from them, and verify what they produce.

  This Might Not Be The Right Fit If...

  - You want only greenfield work and would rather not touch
    legacy code.
  - You are primarily a front-end or mobile engineer without
    deep, hands-on Python and Django experience.
  - You need fully defined requirements before you start and
    prefer someone else to scope the work.
  - You see production issues as someone else's job.
  - You prefer manual workflows and resist AI-assisted tooling.

  Your Qualifications

  - 4+ years of professional software engineering experience
    with a record of owning production systems end to end.
  - Deep, hands-on Python expertise: you can navigate and edit a
    large, mature Django codebase and pay down technical debt
    as you go.
  - Proven ability to design relational schemas and write
    efficient SQL against MySQL, Postgres, or similar,
    including diagnosing and fixing slow queries.
  - Ability to break ambiguous product requirements into scoped,
    testable work and deliver it independently.
  - Clear written and verbal communication with both engineers
    and non-technical partners.
  - Reliable debugging and production troubleshooting skills,
    from a vague report to a root cause and a lasting fix.
  - Demonstrated care for handling sensitive user data
    responsibly and securely.
  - Proficiency with AI development tools in your day-to-day
    engineering work, and the judgment to verify what they
    produce.

  Bonus Points

  - Experience building software in healthcare, or in another
    high-stakes, highly regulated, or safety-critical domain,
    especially with PHI in a HIPAA environment.
  - Front-end experience with React and Next.js.
  - Experience integrating with Braze, Zendesk, or both.
  - Experience building or integrating LLM-powered features in
    production, such as personalization or conversational
    experiences.

  The national pay range for this role is $130,000.00 –
  $150,000.00 per year. Actual compensation will be determined
  by factors such as the candidate's geographic market,
