  More About This Job

  Required Qualifications

  - Production experience in Python and working proficiency in
    Rust (professional, open-source, or substantial personal
    projects), with Git, code review, and automated testing.

  - Working proficiency in TypeScript and a modern web
    framework.

  - Experience building APIs and services backed by a relational
    database such as PostgreSQL.

  - Experience shipping and supporting features in production,
    including debugging and incident follow-up.

  - Experience running workloads on a major public cloud with
    containers and CI/CD.

  - Work you can walk through in detail: code repositories,
    design documents, or shipped features (described at a high
    level if proprietary).
  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field, or an equivalent combination of
    education and experience.

  - Three years of professional software engineering experience
    building and operating production systems.

  Preferred Qualifications

  - Production Rust services (for example, Axum with Diesel or
    SQLx) and Rust UI frameworks (Tauri, Leptos, or Dioxus).

  - Python web services (for example, FastAPI) and React front
    ends that stream agent output.

  - C#/.NET (ASP.NET Core) experience for migrating existing
    services.

  - WebSocket APIs, live queries, or event-driven architectures;
    local-first or offline-first applications.

  - Authentication and authorization: OpenID Connect and OAuth
    2.0, PostgreSQL row-level security, or relationship-based
    authorization (for example, OpenFGA or SpiceDB).

  - LLM application development: retrieval, agents and tool use,
    agent SDKs, MCP servers, and serving open-weight models
    (vLLM or comparable).

  - Kubernetes, Terraform or OpenTofu, OpenTelemetry, and
    durable workflow engines (for example, Temporal or DBOS).

  - Effective use of AI coding agents on production code, with
    tests and human review.

  - Open-source contributions.

  - Experience in research, scientific, or regulated-data
    environments. Familiarity with neurodegeneration research.

