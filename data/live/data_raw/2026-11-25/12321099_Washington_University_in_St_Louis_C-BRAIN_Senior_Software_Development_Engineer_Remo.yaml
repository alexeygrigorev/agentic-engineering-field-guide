  Position SummaryThe Consortium for Brain Research and AI in
  Neurodegeneration (C-BRAIN) is an academic-industry
  consortium directed by Dr. Randall J. Bateman, Washington
  University School of Medicine in St. Louis. C-BRAIN brings
  together academic research institutions, pharmaceutical and
  biotech companies, technology partners, philanthropic
  organizations, and government agencies to develop AI-powered
  tools to accelerate discovery in Alzheimer's disease and
  neurodegenerative disorders. Washington University serves as
  the coordinating center for C-BRAIN. C-BRAIN is currently
  deploying initial versions of the tools and developing plans
  for benchmarking and evaluation of the tools in addition to
  platform integration and scaling. C-BRAIN is also working on
  development of foundational AI models for brain aging and
  neurodegeneration. See www.c-brain.org. The C-BRAIN Senior
  Software Development Engineer builds and supports the
  platform behind C-BRAIN's AI research tools, including
  InsightEngine and OpenScientist. Reporting to the C-BRAIN
  Senior Technical Product Manager, who leads C-BRAIN platform
  engineering, and working day to day with C-BRAIN's Principal
  Software Development Engineer, this role implements the
  integrated platform: shared services and data models, agent
  job execution, the gateway through which agents call C-BRAIN
  tools, the event-driven data layer, web, desktop, and mobile
  clients, and model serving, along with the testing,
  security, and operations work that keeps them reliable as
  use grows. The ideal candidate is a production-minded
  engineer who turns designs into well-tested, maintainable
  software, owns features from design review through
  production, and is growing toward senior-level technical
  leadership. C-BRAIN-specific context will be provided;
  software engineering fundamentals will not. Knowledge of
  neurodegeneration research data is a plus, not a
  requirement.

  Job Description

  Primary Duties & Responsibilities:

  Feature and Service Development

  - Implement platform services, APIs, and data models from
    designs set with C-BRAIN's Principal Software Development
    Engineer, primarily in Python and Rust on PostgreSQL, with
    TypeScript for the web workspace.

  - Build user-facing features for web, desktop, and mobile
    clients, in TypeScript (for example, React), with a Tauri
    shell for desktop where the platform adopts one.

  - Implement live data updates, streamed agent events, and
    durable event-driven workflows so interfaces, services,
    and agents react to new data and jobs without polling.

  - Own features end to end: break work into tasks, estimate,
    implement, test, ship, and follow up in production.

  - Contribute to design discussions and propose improvements
    based on what you learn while building.

  Quality, Security and Operations

  - Write automated unit, integration, and contract tests, and
    keep CI/CD pipelines, type checks, and security scans
    passing.

  - Implement security controls under the Principal Software
    Development Engineer's guidance: authentication and
    authorization, row-level and fine-grained access rules,
    secrets handling, and safe execution of AI-generated code
    in sandboxed containers.

  - Add logging, metrics, tracing, and alerts; take part in
    incident response and in an on-call rotation as the team
    grows; and fix root causes.

  - Find and fix performance and cost problems through profiling
    and load testing, including load rehearsals before major
    events.

  Integration and Migration

  - Move existing InsightEngine and OpenScientist capabilities
    onto the shared platform as modular tools behind a common
    agent and job framework and a shared tool gateway.

  - Replace components incrementally behind stable interfaces,
    including porting services from C#/.NET and Python to Rust
    where the design calls for it, while keeping current tools
    working for users.

  - Build and maintain versioned APIs and plug-in interfaces for
    scientific tools, including Model Context Protocol (MCP)
    servers.

  Model Serving and AI Features

  - Integrate approved and self-hosted open-weight models into
    C-BRAIN tools, including model gateway configuration,
    routing, and versioning.

  - Build agent and tool integrations with provenance on every
    result, and add hooks that let automated evaluations run
    before each release.

  - Work with C-BRAIN data scientists and applied scientists to
    package models and data services for production.

  Collaboration and Documentation

  - Take part in design and code reviews, giving and receiving
    feedback that raises the quality bar.

  - Write and maintain technical documentation, runbooks, and
    API references.

  - Work with engineers from partner development teams and open-
    source maintainers, including contributing changes to
    upstream repositories, and use AI coding assistants with
    human review of every change.

  Working Conditions:

  - Remote within the United States, per current Washington
    University policies.
  - Occasional on-site presence required for team meetings and
    consortium events.
  - Occasional domestic travel may be required for consortium
    events, partner meetings, or conferences.
  - Standard office environment.
  - Primarily sedentary with standard computer use.

  The above statements are intended to describe the general
  nature and level of work performed by people assigned to
  this classification. They are not intended to be construed
  as an exhaustive list of all job duties performed by the
  personnel so classified. Management reserves the right to
  revise or amend duties at any time.

