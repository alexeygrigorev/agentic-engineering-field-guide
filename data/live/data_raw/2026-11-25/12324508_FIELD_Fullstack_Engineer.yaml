description: |
  A bit about Field

  At Field, we’re accelerating the build out of renewable
  energy infrastructure to reach net zero. We are starting
  with battery storage, storing up energy for when it’s needed
  most to create a more reliable, flexible and greener grid.
  At Field, we will show that batteries are a totally viable
  part of our energy infrastructure - now, not in some distant
  future.

  We have ambitious plans to become the defining new clean
  energy player in Europe over the next few years, gradually
  expanding beyond batteries into new asset types.

  Overview

  We are building our automated energy trading platform from
  the ground up. A key subsystem within this, the Operations
  Platform, allows us to introspect the behaviour of our
  platform as a whole and configure other components and sub
  platforms in it. The successful candidate will join our
  existing team, to build new features to multiply the
  effectiveness of our platform's users.

  Key Responsibilities

  The role

  This is a broad and varied role with the opportunity to have
  massive impact. Key responsibilities including

  - Write architecture proposals, build prototypes, and develop
    production event-driven systems, APIs, and frontend
    features with support from the wider team.
  - Coordinate with engineering and product leads to define and
    prioritise task projects that help us meet business
    objectives
  - Develop and shape our emerging design patterns and ways of
    working

  Skills, Knowledge and Expertise

  A bit about you

  - You’re a problem solver - you’re able to break down problems
    and design an approach to find the solution at the right
    level of detail
  - Clear, impactful communicator, able to articulate complex
    concepts to technical, and non-technical audiences
  - You thrive in autonomous work environments with a positive
    and proactive approach
  - You have exceptional attention to detail and take a balanced
    and pragmatic approach to designing and testing software

  Essential Skills

  - Experience with building and testing web applications in a
    commercial setting
  - Experience with relational databases or NoSQL backends
  - You’ve collaborated on project where you’ve been
    contributing to system architecture and API design
  - Experience with end to end testing of systems

  Technology Stack

  We’ve listed a few of the technologies we use, we’re not
  expecting you to have expertise in all of them but a
  willingness to learn.

  - Languages: Typescript, Python and Go
  - Applications:  React, Remix, Fast API, Benthos
  - Compute: AWS Lambda, AWS ECS,
  - Databases and Storage: DynamoDB, PostgreSQL, S3
  - Microservice orchestration: Temporal, AWS Eventbridge, AWS
    SNS
  - Infrastructure: Terraform, AWS
  - CICD: Docker, Github Actions

  Benefits

  Package Details

  Salary: £64,000 - £78,750

  We’re offering a competitive compensation package, including
  participation in our employee share scheme which rewards all
  employees for the growth of the business. You’ll be awarded
  shares when you join, which will vest over four years - and
  as the business grows in size and value, so will your
  shares!

  We value our team’s wellbeing and belonging so we invest
  approx £5,000 a year on a range of perks, benefits and
  wellbeing activities, including regular team socials and
  events.

  Other benefits include

  - Up to 10% Company wide bonus based on company performance
  - Hybrid working (blend of home and office working to suit
    individual needs)
  - £2,000 per year to spend on your professional development
  - Private medical cover with Bupa from day one with the option
    to add family members.
  - Company Pension with 8% Contribution
  - Enhanced parental leave, for all new parents:
    - 6 months fully paid primary carer leave
    - 3 months fully paid secondary carer leave
    - 10 days fully paid leave for fertility treatment
  - Fun co-working office space in Shoreditch, London
  - 1 month work from anywhere, for those with a travel bug
  - 1 day green leave to do something good for the environment
  - free lunch once a week - a great way to get to know people
    in the wider team
  - dog friendly office, feel free to bring your pooch along
  - Spill: our mental health benefit allowing every Fielder
    access to equal and unrestricted therapy and resources
  - Regular, optional team socials designed to be inclusive for
    everyone (not just the pub goers!)

  A bit about Field

  Field is an international builder, owner, and operator of
  renewable infrastructure. Founded by a successful
  entrepreneur, we have robust BESS project pipelines across
  the UK, Italy, Spain, and Germany, backed by a recent £200
  million investment from DIF Capital Partners. Our mission is
  to grow internationally and develop a strong global BESS
  portfolio.

  We are an eclectic team with diverse backgrounds, from
  scaling billion-dollar tech startups to building energy
  companies and specializing in energy markets. You'll work
  with fun, curious, entrepreneurial people making a real
  impact. We're proving batteries are a viable energy solution
  now. Our ambitious plans include becoming Europe's leading
  clean energy player and expanding beyond batteries into new
  assets.

  Our Values

  - Work for the team - We are friendly and approachable. We
    make time for each other, value diverse perspectives, and
    learn and grow together.
  - Do it right - We prioritise doing things right, never
    cutting corners. Safety comes first, and we consider our
    impact on communities and the environment. We act with
    integrity always.
  - Move fast - We’re doers. We take responsibility, deliver on
    promises, and get things done. FAST.
  - Know your stuff - We’re curious self-starters, always
    learning, adapting, and improving. No question is too
    small. We own our growth.

  Read more about our values at www.field.energy

  Love the sound of Field but not sure this role is right for
  you? Have a look at our careers page and register your CV.
  We are always interested in candidates who have exposure to
  BESS and work within the Renewable Energy space. We’d love
  to hear from you

  Equality, Diversity & inclusion

  Diverse teams make better teams. Field is committed to
  creating a diverse and inclusive environment which is as
  representative as possible of our society. All qualified
  applicants will receive consideration for employment without
  regard to age, disability, gender expression, marriage/civil
  partnership status, pregnancy/maternity status, race,
  nationality, religion or belief, or sexual orientation. We
  published a blog discussing our findings and learnings from
  our first Equity, Diversity and Inclusion survey in March
  2023 which you can read here.

  Still not convinced? See what our current team think about
  working here to find out why you should join us!

  About To reach Net Zero, we need to solve big challenges.
  Field will fund, build and run the renewable infrastructure
  we need to tackle these challenges. At Field, we will show
  that batteries are a totally viable part of our energy
  infrastructure - now, not in some distant future. And, we
  have ambitious plans to become the defining new clean energy
  player in Europe over the next few years, gradually
  expanding beyond batteries into new asset types.
