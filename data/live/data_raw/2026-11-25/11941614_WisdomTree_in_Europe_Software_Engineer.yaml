description: |
  WisdomTree is a leading provider of exchange-traded funds
  (ETFs) and exchange-traded products (ETPs), offering
  innovative investment solutions to investors across Europe.
  Our Investment Research team works across markets, portfolio
  construction, quantitative research, product development and
  client-facing market intelligence.

  We are looking for a hands-on Software Engineer to join our
  IT team, dedicated to the Investment Management function,
  supporting our new generation of research technology that
  combines investment expertise, data, modern software
  engineering and AI.

  We are looking for someone who is exceptionally productive
  with modern AI coding tools, but who also has the software
  engineering fundamentals to understand, maintain and improve
  the systems those tools help create. A major initial
  responsibility will be taking ownership of CUBE,
  WisdomTree's internal platform for Investment Management,
  that includes Risk Management and Valuation management. CUBE
  allows portfolio managers and to efficiently manage their
  portfolios. The platform has grown quickly, which is a good
  problem to have. Your job will be to take what works, keep
  the speed and experimentation that made it successful, and
  progressively make the underlying platform simpler, more
  robust and easier for other developers to understand and
  operate.

  You should be equally comfortable using an AI coding agent
  to build an application in an afternoon and opening the
  resulting codebase to work out how it actually works.

  Key Accountabilities and Scope

  Skills and Qualifications

  About Us:

  WisdomTree is a global financial innovator, offering a
  diverse suite of exchange-traded products (ETPs), models and
  solutions, private market investments and digital asset-
  related products. Our offerings empower investors to shape
  their financial future and equip financial professionals to
  grow their businesses. Leveraging the latest financial
  infrastructure, we create products that emphasize access and
  transparency and provide an enhanced user experience.
  Building on our heritage of innovation, we offer next-
  generation digital products and services related to
  tokenized real world assets and stablecoins, as well as our
  institutional platform, WisdomTree Connect™, blockchain-
  native digital wallet, WisdomTree Prime®*, and have expanded
  into private markets through the acquisition of Ceres
  Partners’ U.S. farmland platform.

  Work Smart:

  Headquartered in New York City, WisdomTree embraces a “Work
  Smart” philosophy that transcends physical workspace, aiming
  to optimize productivity, efficiency and effectiveness.
  Employee time in the office generally is not prescribed, and
  team leaders are empowered to determine how their teams work
  best, based on their roles, which may include in-person, in-
  office engagement.

  Mission, Vision & Values:

  WisdomTree is committed to delivering a better financial
  experience through the quality of our products, solutions
  and engagement, and to be the leader in delivering best
  structured access to global asset classes, empowering
  clients through innovative solutions and long-term
  performance. WisdomTree employees strive for excellence and
  innovation, work with transparency and accountability and
  support each other as a global team. We welcome the
  applications of qualified individuals who will support this
  mission and thrive in our collaborative and empowering work
  environment.
