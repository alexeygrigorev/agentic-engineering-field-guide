description: |
  Job Title: Software Engineer (Rust)Location: London/Hybrid.
  Type: Full-timeLevel: Mid Level
  Reports to:Team Lead

  We are seeking a highly skilled Software Engineer to join
  our team responsible for designing, building, and optimising
  a next-generation multi-region, multi-tenanted engineering
  team supporting our Execution Management System (EMS)
  platform.

  The ideal candidate will have experience building
  concurrent, performance sensitive systems where correctness
  and high availability are maintained across multiple regions
  to meet the stringent demands of our global trading
  customers.

  Key Responsibilities

  - Platform Development: Design and implement low-latency,
    high-throughput systems for a multi-region, multi-tenanted
    EMS platform, ensuring compliance with industry standards.
  - Latency Optimisation: Analyse and optimise critical paths in
    the system to reduce latency and improve performance.
  - Multi-Tenancy & Isolation: Develop scalable architectures to
    ensure strong tenant isolation, data security and resource
    fairness in multi-tenant environments.
  - Distributed Systems: Maintain distributed, fault-tolerant
    systems with high availability across multiple regions,
    ensuring data consistency and low-latency communication.
  - Monitoring & Observability: Implement real-time monitoring,
    telemetry and alerting systems for proactive issue
    detection and resolution.
  - Collaboration: Work closely with product, QA and
    infrastructure teams to align technical solutions with
    business requirements and ensure seamless deployments.
  - R&D: Stay ahead of industry trends and incorporate emerging
    technologies, tools, and best practices to continuously
    enhance the platform.

  Qualifications / Knowledge

  - 5 years of professional software engineering experience
  - Proven experience in low-latency system design, development,
    and optimisation.
  - Expert proficiency in a compiled, statically typed language
    (e.g. C++, Rust, GO, Java or C#)  Experience with Rust is
    a plus.
  - Experience with distributed systems (e.g. Kafka/nats, Redis,
    Zookeeper) and event-driven architectures.
  - Knowledge of multi-tenancy patterns and best practices.
  - Familiarity with cloud platforms (e.g. AWS, GCP, Azure) and
    tools for multi-region deployments.
  - Strong grasp of database performance tuning for low-latency
    access.
  - Experience with observability tools (e.g. Prometheus,
    Grafana, ELK stack).

  Soft Skills:

  - Strong analytical and problem-solving abilities.
  - Excellent communication and collaboration skills, with a
    track record of working in cross-functional teams.
  - Attention to detail and ability to work under pressure in a
    fast-paced environment.
  - Understanding of crypto markets and products (Desirable).
  - Experience in leveraging LLMs to accelerate delivery.
  - Financial Services experience is essential along with a
    background in trading/EMS platforms.

  What we offer:

  💵  Competitive salary and compensation packages

  🍎 Fully paid medical and discounted dental schemes for
  employees and their family

  ✈️ Generous time off + bank holidays

  🍼 Enhanced parental leave for all employees who have been
  with the company for one (1) year

  🍔 Fully stocked kitchen and access to Ubereats

  💪 Discounted gym scheme with Fitness First

  🐕‍ Employee Assistance Programme

  📚 Paid study leave and personal leave

  Why Elwood?

  - Join one of the fastest growing FinTech companies and help
    shape the future of finance.
  - A startup with deep financial backing and a strong market
    presence.
  - Our platform is enabling institutional access to the most
    exciting growth opportunity in Finance.
  - Work with a modern technology stack and help solve high
    impact problems.
  - Strong client-focused team with a diverse background.
  - We’re a Global company and have modern, centrally based
    offices in London, New York and Singapore.
