description: |
  Citizens Financial Group, Inc. (CFG) seeks a Senior Software
  Engineer for its Charlotte, North Carolina location.

  Responsibilities:

  •    Designs, develops, and prototypes software and
  implements of technology solutions for commercial lending. •
  Implements AWS Cloud utilizing EC2 instances, develops on
  build repositories in Github, and reviews file processing
  code in Python. •    Creates and clarifies requirements in
  coordination with Business Analysts and provides estimates
  of work for planning purposes. •    Uses Spring Boot Batch
  to develop code to process files, and develops UI interfaces
  in HTML, Javascript, and Angular. •    Implements Agile best
  practices and tracks all Agile epics, stories, tasks, and
  defects using Jira. •    Leads a team of software
  developers, assisting with design and development, including
  peer reviews of design and code. •    Mentors new team
  members and ensures efficient onboarding. •    Provides
  continuous support to application teams helping with
  Dev/Test/Prod Branching Model for weekly releases.

  Qualifications:

  Bachelor’s degree, or foreign equivalent, in Computer
  Science, Mechanical Engineering, or related field and seven
  (7) years of progressive, post-baccalaureate experience as
  Senior Software Engineer, Technical Test Lead, or related
  position involving designing, developing, and prototyping
  software.

  Full term of experience must include:

  •    Designing, developing, and prototyping software using
  programming languages, including Java, Python, and SQL;  •
  Utilizing AWS EC2, AWS RDS, AWS Systems Manager Parameter
  Store, SQL Server, and MS-SQL to store and maintain
  transactions in AWS Cloud; •    Utilizing Amazon Web
  Services for software development and deployment in AWS
  Cloud; •    Utilizing databases, including MySQL, and
  PostgreSQL to store, maintain, and access business data; •
  Utilizing Atlassian tech stacks, including JIRA, Crucible,
  and Bitbucket to plan, assign, track, report, and manage
  work, review tickets against committed code, and manage
  repositories; •    Designing and developing Web Service
  applications and Micro services using Restful Web Services;
  •    Utilizing Nexus IQ to accelerate delivery and increase
  product quality; •    Utilizing issue management and version
  control systems, including JIRA, Bitbucket, and Service Now;
  •    Utilizing tools, including CloudFormation, Terraform,
  Python, PowerShell, and AWSCLI to set up development
  environments; •    Utilizing CI/CD tools, including Jenkins,
  to automate build processes and testing, perform continuous
  integration management, and to manage build results and
  deployment; •    Utilizing Bitbucket for source code
  management; and •    Utilizing Jenkins open source
  automation to manage weekly builds, tests, and to deploy
  chains.

  Remote work permitted up to 3 days per week.

  Worksite: 4250 Congress Street, Charlotte, NC 28209 United
  States, 40 hrs/wk. Salary Range: $158,746 - $159,000/yr. EO
  employer.

  For summary of benefits and to apply visit our website at
  https://jobs.citizensbank.com  and apply online (Job ID:
  50562) or email resume and cover letter to
  Recruiting@Citizensbank.com with subject line: 50562.

  For an overview of our benefits, visit
  https://jobs.citizensbank.com/benefits.

  Direct applicants only.


