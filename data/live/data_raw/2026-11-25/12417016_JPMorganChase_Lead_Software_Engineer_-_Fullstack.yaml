description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.


  As a Lead Software Engineer at JPMorganChase within the
  Consumer & Community Banking , JPM Wealth Management
  Technology team, you are an integral part of an agile team
  that works to enhance, build, and deliver trusted market-
  leading technology products in a secure, stable, and
  scalable way. As a core technical contributor, you are
  responsible for conducting critical technology solutions
  across multiple technical areas within various business
  functions in support of the firm’s business objectives.


  Job Responsibilities

  • Executes software solutions, design, development, and
  technical troubleshooting with ability to think beyond
  routine or conventional approaches to build solutions or
  break down technical problems • Creates secure and high-
  quality production code and maintains algorithms that run
  synchronously with appropriate systems • Produces
  architecture and design artifacts for complex applications
  while being accountable for ensuring design constraints are
  met by software code development • Gathers, analyzes,
  synthesizes, and develops visualizations and reporting from
  large, diverse data sets in service of continuous
  improvement of software applications and systems •
  Proactively identifies hidden problems and patterns in data
  and uses these insights to drive improvements to coding
  hygiene and system architecture • Contributes to software
  engineering communities of practice and events that explore
  new and emerging technologies • Adds to team culture of
  diversity, opportunity, inclusion, and respect

  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.



  Required qualifications, capabilities, and skills



  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Full-stack development experience, including both server-
    side and UI development.
  - Proficiency in Java, Springboot, React and AWS
  - Experience building software using AI-assisted development
    tools, such as Claude Code and GitHub Copilot.
  - Hands-on experience in system design, application
    development, testing, and operational stability.
  - Experience developing, debugging, and maintaining
    applications in a large-scale corporate environment, using
    modern programming and database querying languages.
  - Strong understanding of the Software Development Life Cycle
    (SDLC).
  - Solid understanding of Agile methodologies, CI/CD,
    application resiliency, and security.
  - Knowledge of software applications and technical processes
    across areas such as cloud, artificial intelligence,
    machine learning, and mobile technologies.
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices



  Preferred qualifications, capabilities, and skills

  - Familiarity with modern front-end technologies like Java
    Script, HTML, CSS, Git, Rest
  - Exposure to TerraForm



  About Us

  Chase is a leading financial services firm, helping nearly
  half of America’s households and small businesses achieve
  their financial goals through a broad range of financial
  products. Our mission is to create engaged, lifelong
  relationships and put our customers at the heart of
  everything we do. We also help small businesses, nonprofits
  and cities grow, delivering solutions to solve all their
  financial needs.

  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions.  We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.

  We recognize that our people are our strength and the
  diverse talents they bring to our global workforce are
  directly linked to our success. We are an equal opportunity
  employer and place a high value on diversity and inclusion
  at our company. We do not discriminate on the basis of any
  protected attribute, including race, religion, color,
  national origin, gender, sexual orientation, gender
  identity, gender expression, age, marital or veteran status,
  pregnancy or disability, or any other basis protected under
  applicable law. We also make reasonable accommodations for
  applicants’ and employees’ religious practices and beliefs,
  as well as mental health or physical disability needs. Visit
  our FAQs for more information about requesting an
  accommodation.

