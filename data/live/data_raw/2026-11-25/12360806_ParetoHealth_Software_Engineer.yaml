description: |
  About ParetoHealth

  ParetoHealth is redefining the way employers fund
  healthcare. As the largest and fastest-growing benefits
  captive in the United States, we help thousands of small and
  midsize employers take control of healthcare costs through a
  smarter, more sustainable model.

  Our mission is simple: give small and midsize employers the
  scale and protection they need to eliminate volatility and
  lower healthcare costs.

  By combining data-driven insights, innovative risk
  management, and the collective purchasing power of our
  community, we enable employers to reduce volatility, improve
  long-term outcomes, and reinvest savings into their
  businesses and their people.

  Headquartered in Philadelphia, ParetoHealth is growing
  rapidly and transforming one of the country's largest
  industries. Our success is fueled by talented people who are
  united by our four core values: Fire in the Belly, For the
  Greater Good, See the Field, and Get It Done Right. These
  values shape how we innovate, collaborate, make decisions,
  and deliver exceptional results for our clients and one
  another.

  If you're energized by solving complex challenges, thrive in
  a high-growth environment, and want to help reshape the
  future of healthcare, we'd love to meet you.

  Please note that ParetoHealth does not provide employment
  visa sponsorship for this position. Candidates must be
  authorized to work in the United States without sponsorship
  both now or in the future.

  Position Summary:

  The Software Engineer will build, test, and maintain full-
  stack solutions in TypeScript on AWS serverless technologies
  to support business operations. Working within established
  team patterns and with guidance from senior engineers, this
  role will develop GraphQL API endpoints, business logic, and
  Lambda-based services deployed with the AWS CDK, along with
  responsive Angular/Ionic user interfaces, ensuring solutions
  are reliable, secure, and HIPAA compliant. The engineer will
  work closely with other engineers and business analysts to
  understand requirements and deliver on agreed timelines. In
  addition, the role will use approved AI tools to work more
  effectively within established team patterns, validating AI-
  assisted output and remaining accountable for its
  correctness.

  Key Responsibilities:

  - Develop and maintain API endpoints supporting GraphQL
    queries, following established schema and coding
    standards.
  - Implement and test TypeScript business logic within shared
    libraries.
  - Develop and deploy AWS Lambda functions using established
    AWS CDK patterns.
  - Support job automation using AWS Glue.
  - Develop responsive Angular/Ionic user interface features.
  - Write unit and integration tests, participate in code
    reviews, and help troubleshoot and resolve defects.
  - Support DevOps workflows, including:
  - Contributing to CI/CD pipelines.
  - Working with Git repositories and branching workflows.
  - Following coding standards enforced through linting.
  - Use approved AI tools to support the implementation,
    testing, troubleshooting, and documentation of software,
    reviewing and testing AI-generated code before use, and
    seeking guidance from senior engineers when results or
    permitted use are unclear.

  Required Skills & Qualifications:

  - Strong communication and collaboration skills.
  - Experience building applications on AWS, ideally with
    serverless services such as Lambda.
  - Experience developing APIs (e.g., GraphQL, REST).
  - Working knowledge of SQL/NoSQL databases and data modeling.
  - Experience building responsive web or mobile applications
    using Angular, Ionic, or a similar framework.
  - Understanding of the software development lifecycle and
    testing practices.
  - Awareness of security best practices for handling sensitive
    data; experience developing HIPAA-compliant software is a
    plus.
  - Familiarity with CI/CD tools and Git-based workflows.
  - Experience using AI coding assistants or similar tools to
    support engineering work, including providing clear
    context, reviewing and testing generated code, and
    explaining the final solution; awareness of the data-
    handling boundaries for using AI tools with sensitive
    healthcare and financial data.
  - Exposure to the AWS CDK or other Infrastructure as Code
    tools is a plus.

  Minimum Requirements:

  - Bachelor’s degree in Computer Engineering, Computer Science,
    or related discipline, or equivalent practical experience.
  - 3+ years of hands-on full-stack development experience.
  - 1+ year of experience developing in TypeScript/JavaScript.
  - Preferred: AWS certification(s).

  Perks & Benefits:

  - Fully paid medical, dental, and vision benefits.
  - Flexible PTO
  - 401k company contribution
  - Tuition reimbursement
  - Professional development allowance
  - Transportation allowance and daily parking reimbursement
  - Engaging hybrid work environment

  We are guided by our values:

  Fire in the belly

  The drive to learn, to improve, and to deliver outstanding
  value every day.

  See the field

  The ability to see the big picture and prepare to meet
  tomorrow’s needs.

  Get it done right

  The passion to produce at higher rates and to the highest
  standards.

  For the greater good

  A united community creating better health benefit solutions
  for all.

