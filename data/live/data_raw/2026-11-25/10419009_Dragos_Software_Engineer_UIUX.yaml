description: |
  At Dragos, the mission is personal. The systems we protect
  deliver the water you drink, power your home, and keep the
  hospitals your community depends on running. Those critical
  infrastructure systems that power our civilization around
  the world are under attack every day by adversaries. When
  those systems fail, people are immediately at risk. We are
  the global leader in xOT cybersecurity, combining
  technology, threat intelligence, and expert services. The
  people here chose this work because they understand what is
  at stake. Here, you will find a remote-first mission-driven
  team across North America, Europe, the Middle East, and APAC
  built on authenticity, transparency, and trust. If
  safeguarding the systems that protect your family, friends,
  and community is the kind of work that matters to you, you
  are in the right place.

  About the Role:

  Every day, the world depends on critical infrastructure. As
  those systems become increasingly connected, protecting them
  from cyber threats has never been more important.

  At Dragos, we build software that gives defenders the
  visibility and capabilities they need to detect,
  investigate, and respond to cyber threats before they
  disrupt the systems people depend on every day.

  As a Software Engineer, you'll build the experiences
  security professionals rely on. You'll solve meaningful
  problems, simplify complex data, and create intuitive
  workflows that enable users to detect, investigate, and act
  on cyber threats.

  Success in this role means taking ownership beyond
  implementation. You'll solve meaningful problems, make
  thoughtful engineering decisions, and continuously improve
  the software, engineering practices, and teams around you.

  What You'll Own:

  - Own the design, implementation, and evolution of features
    from concept through delivery.
  - Make sound engineering decisions by balancing user
    experience, technical quality, delivery, and long-term
    maintainability.
  - Collaborate with Product, Design, and Engineering to turn
    ambiguous problems into well-designed solutions.
  - Continuously identify opportunities to simplify systems,
    reduce technical complexity, and improve the way we build
    software.
  - Drive improvements to engineering practices, tooling, and
    the developer experience through technical leadership and
    collaboration.
  - Contribute to the evolution of our architecture, tooling,
    and engineering standards.
  - Leverage AI-assisted development tools responsibly to
    improve engineering effectiveness, quality, and delivery.

  What You'll Bring:

  - Strong engineering fundamentals and the ability to apply
    them to real-world problems.
  - Sound engineering judgment and the ability to balance
    delivery, quality, and long-term maintainability.
  - Experience taking ownership of meaningful work from concept
    through delivery.
  - Ability to collaborate effectively across Product, Design,
    and Engineering.
  - A mindset of continuous improvement and a desire to
    strengthen the software, systems, and teams around you.
  - Experience with modern front-end technologies, including
    React, TypeScript, testing frameworks, state management,
    and modern build tooling.
  - Experience leveraging AI-assisted development tools to
    improve engineering effectiveness and quality.
  - Typical candidates for this role have 2-4+ years of
    professional software engineering experience. Equivalent
    experience and demonstrated capability are equally valued.

  Experience That Will Help You Succeed:

  - Experience building or contributing to shared UI component
    libraries or design systems.
  - Experience working closely with UX and Product from concept
    through delivery.
  - Experience designing or integrating with backend APIs and
    distributed systems.
  - Experience driving technical initiatives or influencing
    engineering practices across teams.
  - Experience working in cybersecurity environments.  OT, or
    ICS are a plus

  Closing:

  We care less about checking every box and more about hiring
  curious engineers who are excited by our mission and eager
  to grow. If this role sounds like the right fit, we'd love
  to hear from you.

  Compensation:

  - Salary: $135,000
  - Competitive Equity Package
  - Comprehensive Benefits Plan



