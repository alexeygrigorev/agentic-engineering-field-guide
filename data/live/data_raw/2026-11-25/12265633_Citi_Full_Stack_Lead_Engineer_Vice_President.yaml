description: |
  Overview:

  Finance Technology is a critical driver of Citi’s growth and
  transformation, delivering the platforms, engineering
  capabilities, and technology solutions that power the bank’s
  strategic objectives. We partner across the enterprise to
  modernize core financial systems, accelerate innovation, and
  create scalable solutions that support both today’s
  priorities and tomorrow’s opportunities.

  Our teams are leading a large-scale technology
  transformation, reimagining legacy ecosystems through cloud-
  ready architectures, data-driven platforms, automation, and
  next-generation engineering practices. By leveraging best-
  in-class technologies, we simplify complex business
  processes, enhance operational efficiency, strengthen
  controls, and enable compliance with evolving regulatory
  requirements.

  At Finance Technology, we are redefining how technology
  empowers Finance, and other global functions. Our products
  and platforms are built on Citi’s strategic architecture
  principles, enabling seamless end-to-end integration,
  greater transparency, and faster decision-making across the
  enterprise. Together, we are pushing the boundaries of
  technology to build resilient, intelligent, and future-ready
  solutions that help Citi deliver for its clients and
  stakeholders worldwide.

  What we offer:

  Be part of Strategic technology team to develop, enhance,
  support and maintain solutions for Finance Technology
  leveraging Emerging Technologies and AI-Led tools.
  Participate in technical discussions/brainstorming sessions
  and define ideas and strategies for existing and future
  platforms. Gain exposure to Wholesale, Retail business
  across data, risk and finance. Work across diverse set of
  Finance platforms and have an opportunity to be part of re
  architecture and re-platforming initiatives on business
  process transformation.

  Responsibilities: -

  - Write code on one or more development platforms to deliver
    part or all of a feature, collaborating with Enterprise
    Architect and Senior engineers.
  - Respond to problems, questions, or situations by applying
    established criteria to directly influence development
    outcomes. In doing so, use the right technology to solve
    technical challenges required to deliver all or part of
    small scale features and functions and / or supporting
    aspects of a larger program efforts.
  - Have responsibility for applications solution design and
    programming activities that may include inputs to
    feasibility studies, time and cost estimates and
    implementation of new or revised applications systems and
    programs.
  - Accountable for development, design, construction, testing
    and implementation and write secure, stable, testable and
    maintainable code.
  - Operate with autonomy, while some oversight and direction
    may be required.
  - Engage in digital applications development, risk technology,
    Analytic Model Development and Application support
    activities to meet specific business needs of user areas
    and to test systems to ensure integrity of deliverables.
  - Expected to provide sound understanding of application
    development concepts and principles and a basic knowledge
    of concepts and principles in other technology areas.
  - On occasion, may need to consult with users, clients and
    other technology groups on issues and recommend
    programming solutions for customer exposed systems.
  - Understand the functionality of the systems involved with
    projects. This includes the applications/services, runtime
    operations, and maintenance.
  - Understand the business context and the associated customer
    use cases.
  - Understand your technologies for your features and are able
    to evaluate system designs and architecture while
    participating in solution discussions, development and the
    creation of application / systems documentation.
  - Participate in design sessions to gain an understanding of
    the context for design decisions and provide inputs for
    making these design decisions.
  - Expected to seek guidance from peers and / or manager for
    items not outlined in our operating procedures.
  - Provide inputs for building project development schedules.
  - Provide inputs for feature prioritization, highlight
    technical dependencies between deliverables and help the
    scrum team reach consensus with the product owner.
  - Verbal and written communication is clear and concise.
  - Have good working relationships with team members, manager,
    and peers.
  - Provide inputs to help improve development related processes
    that accelerate delivery, drive innovation, lower costs,
    and improve quality.
  - Successfully complete assessment tests offered in
    Pluralsight, Udemy, etc. or complete certifications to
    demonstrate technical expertise on your development
    platform(s).
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency.

  Qualifications:

  - Strong experience in Application Development or systems
    analysis role.
  - Experience in programming of software applications and
    implementing successful projects.
  - Proven engineering experience building robust, scalable, and
    maintainable applications in the Financial Services
    industry.
  - Build, deploy, and test application components in a
    development environment during the implementation phase
    working with all layers of the application stack.
  - Work proactively & independently to address project
    requirements, and articulate issues/challenges with enough
    lead time to address project delivery risks.
  - Ensure code developed meets the requirements.Ability to
    adjust priorities quickly as circumstances dictate.
  - Experience working in Financial Services or a large complex
    and/or global environment.Consistently demonstrates clear
    and concise written and verbal communication.Demonstrated
    analytic/diagnostic skills.
  - Ability to work in a matrix environment and partner with
    virtual teams.
  - Ability to work independently, prioritize, and take
    ownership of various parts of a project or initiative.
  - Ability to work under pressure and manage to tight deadlines
    or unexpected changes in expectations or requirements.
  - Proven track record of operational process changes and
    improvement.
  - Consistently demonstrates clear and concise written and
    verbal communication.

  Technical Skills:

  Must have:

  - Strong experience in Full stack development using React,
    Typescript, Node.js, stylesheets, Java/JVM Based Language
    Like Java, Kotlin, Microservices.Should have strong hand-
    on experience designing and building UI framework using
    react in align with latest UI framework practices and
    guidelines.
  - Experience of API Development and its Eco-systems.
  - Hands-on working experience React, Java script, Java /
    Spring / Spring Cloud / Spring Data JPA / Spring Boot
    Microservices.
  - Should have troubleshooting skills using debuggers, logs,
    etc.Strong understanding of test-driven development using
    Jest, Cypress, Java script, Junit, Mockito.
  - Experience with Public clouds like AWS, GCP will be added
    advantage.
  - Experience with OpenShift, Docker and Kubernetes.
  - Understanding of build and deployment tools like, Jenkin.
    Teckton, UDeploy, Harness, NPM, Maven, Gradle.
  - Implement Unit Testing and TDD to ensure software quality
    and maintainability.Proficiency in SQL Databases, MongoDB,
    Oracle preferred.

  Nice to have:

  - Experience on Observability and monitoring tech stack as
    well.
  - Understanding of Gen AI based Productivity tool like
    Microsoft Co-Pilot, Devin etc. Understanding Middleware
    like Tibco RV, EMS, Solace, Kafka etc.
  - Understanding of Python, Gen AI will be plus.

  Educational Qualification:

  - Bachelor’s degree/University degree or equivalent
    experience.

