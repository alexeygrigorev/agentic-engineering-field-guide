description: |
  Job Title: Senior Software Engineer

  LOCATION: Dallas, TX (Hybrid)

  POSITION TYPE: Full time W2 or Contract

  OVERVIEW:

  Serves as a technical leader responsible for the
  architecture, design, and delivery of robust, scalable, and
  secure software solutions. The Software Engineer Senior
  provides guidance to development teams, drives engineering
  best practices, collaborates across divisions to modernize
  legacy systems, and supports mission-critical County
  services.

  This role plays a key part in shaping technology direction,
  mentoring engineers, and ensuring alignment with enterprise
  standards and strategic objectives. The position contributes
  to modernization initiatives, cloud-first strategies, and
  digital public service delivery while ensuring compliance
  with accessibility, security, and regulatory requirements.

  RESPONSIBILITIES AND DUTIES

  (Responsibilities and duties include, but are not limited to
  the following. Percentages reflect estimated allocation of
  time.)

  - Leads the technical design and implementation of complex
    applications, platforms, and services.
  - Ensures timely, high-quality delivery of features aligned
    with business and user needs.
  - Supports end-to-end service delivery across development,
    testing, deployment, and operations.
  - Resolves critical production issues and leads incident
    response and root cause analysis.
  - Ensures systems comply with accessibility, security, and
    regulatory standards.
  - Designs systems for resilience, scalability, and long-term
    maintainability.
  - Coordinates release planning and deployment readiness across
    platforms and teams.
  - Collaborates with QA, DevOps, and support teams to
    streamline service transitions.
  - Implements secure coding practices to protect systems from
    vulnerabilities.
  - Automates security scanning and threat detection within
    CI/CD pipelines.
  - Establishes access control measures to protect sensitive
    County data.
  - Establishes coding, documentation, and testing standards
    across engineering teams.
  - Promotes DevOps practices including automation,
    observability, and continuous delivery.
  - Leads backlog refinement, estimation, and sprint planning
    for technical deliverables.
  - Contributes to budget estimates and resource planning for
    technical initiatives.
  - Optimizes system performance, uptime, and reliability across
    environments.
  - Collaborates with infrastructure and security teams to align
    development with operational requirements.
  - Ensures data security, privacy, and audit readiness across
    all systems.
  - Drives refactoring and modernization of legacy or monolithic
    applications.
  - Collaborates with architects and product managers to define
    technical strategy and solution architecture.
  - Evaluates and recommends technologies, frameworks, and tools
    for long-term sustainability.
  - Ensures architectural consistency, modularity, and
    interoperability across systems.
  - Leads technical planning sessions, design reviews, and
    proof-of-concepts.
  - Develops technical roadmaps and blueprints aligned with
    enterprise IT strategy.
  - Addresses system integration challenges and API design
    across legacy and modern platforms.
  - Drives alignment with cloud-first, mobile-ready, and open-
    standards architectures.
  - Documents system architecture, components, interfaces, and
    technical decisions.
  - Champions software quality through code reviews, unit
    testing, and continuous integration.
  - Establishes automated testing, deployment pipelines, and
    monitoring practices.
  - Guides resolution of technical debt and system performance
    issues.
  - Identifies gaps in processes, tools, and documentation and
    recommends improvements.
  - Conducts retrospectives and leads continuous improvement
    initiatives.
  - Monitors and reports system metrics and performance
    indicators.
  - Promotes accessibility and usability best practices across
    all public-facing solutions.
  - Ensures continuous feedback loops throughout the development
    lifecycle.
  - Mentors junior and mid-level engineers through coaching,
    pairing, and code reviews.
  - Supports onboarding, training, and professional development
    for new engineers.
  - Promotes an inclusive team culture emphasizing
    collaboration, learning, and accountability.
  - Sets clear technical expectations and supports career
    development planning.
  - Leads internal knowledge-sharing sessions and communities of
    practice.
  - Encourages cross-training, skill development, and continuous
    learning.
  - Supports morale through recognition and constructive
    feedback.
  - Encourages participation in public sector innovation and
    open-source initiatives.
  - Collaborates with product owners, analysts, and business
    partners to define technical requirements.
  - Presents technical plans, trade-offs, and solutions in
    accessible, non-technical language.
  - Acts as a liaison between engineering teams and executive
    stakeholders.
  - Participates in governance, security, and compliance review
    boards.
  - Leads technical demonstrations and system walkthroughs.
  - Supports RFP/RFQ development, vendor evaluations, and
    solution assessments.
  - Ensures user needs are reflected in system design and
    delivery priorities.
  - Advocates for digital equity, modern architecture, and
    public value.
  - Performs other duties as assigned. (Non-essential)

  MINIMUM QUALIFICATIONSEducation, Experience & Training

  - Education and experience equivalent to a Bachelor’s degree
    in Computer Science, Software Engineering, or a job-
    related field.
  - Master’s degree preferred.
  - Seven (7+) years of experience in software development,
    including system design and technical leadership.

  Certifications (Preferred)

  - Microsoft Certified: Azure Solutions Architect
  - AWS Certified Solutions Architect
  - DevOps Advanced Certification

  KNOWLEDGE, SKILLS & ABILITIES

  - Ability to lead and mentor engineering teams.
  - Knowledge of modern development architectures
    (microservices, event-driven design).
  - Advanced problem-solving, debugging, and system optimization
    skills.
  - Knowledge of security best practices and government IT
    compliance.
  - Strong written and verbal communication skills, including
    technical documentation.
  - Ability to manage multiple projects and prioritize
    effectively.
  - Ability to influence technical decisions across teams.
  - Experience in fast-paced, evolving technical environments.
  - Knowledge of enterprise systems, scalable platforms, and
    Agile delivery.
  - Experience with cloud platforms (AWS, Azure, Google Cloud).
  - Knowledge of ITIL, SAFe, Agile, and DevOps practices.
  - Expert-level programming and design skills in modern stacks
    (.NET, JavaScript/Node.js, Python, Java).
  - Strong understanding of architecture patterns, integration,
    infrastructure, and DevOps.
  - Ability to translate technical concepts into business
    outcomes.
  - Proficiency in languages such as .NET, TypeScript, Java,
    Python, C#, JavaScript, or equivalent.
  - Experience with SQL and NoSQL databases.
  - Knowledge of CI/CD pipelines, containerization (Docker,
    Kubernetes).
  - Strong proficiency with front-end frameworks (preferably
    React).
  - Familiarity with version control systems (Git).

  SPECIAL REQUIREMENTS

  - Must possess a valid Texas Driver’s License with a good
    driving record.
  - Required to provide a 10-year driving history.
  - Must remain compliant with Article II, Subdivision II of
    Chapter 90 of the Dallas County Code.
  - Must pass and maintain eligibility for national fingerprint-
    based criminal justice systems checks (FBI CJIS,
    NCIC/TCIC), if applicable.
