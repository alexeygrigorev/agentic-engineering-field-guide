description: |
  SMX is currently looking for a highly motivated Software
  Engineer - Front End Web Applications to contribute to the
  design, build, support, and implementation of the Budget and
  Spend (BAS) solution.  This is an exciting role where you
  will work with some of the most interesting and powerful
  agencies in the world. This role is remote supporting a
  Washington, DC based customer and requires a Public Trust
  clearance.

  Essential Duties & Responsibilities:

  SAC is an all-in-one cloud product offered as software as a
  service (SaaS) for business intelligence (BI), planning, and
  predictive analytics. Using SAC Analytics Designer as a
  platform the team at SMX develops interactive web
  applications ranging from widgets & dashboards to
  sophisticated planning and analytic applications. This
  position will work with the team to develop new features as
  well as enhance existing features of the BAS web application
  built using SAC Analytics Designer.

  - Build enterprise planning and reporting applications using
    SAP Analytics Cloud (SAC) or other web technologies such
    as JavaScript
  - Review application requirements and interface designs
  - Develop and implement highly interactive UI/UX components
  - Monitor and improve front-end performance.
  - Document application changes and developing updates
  - Provide feedback on the technical feasibility of UI/UX
    designs
  - Optimize web applications for scalability and speed
  - Participate in code reviews and communicate effectively with
    team members.

  Required Skills & Experience:

  - Bachelor’s degree in computer science or related field
    (Software Engineering, Web Development) or equivalent job
    experience
  - 2 years of software engineering experience working across
    front-end web technologies (JavaScript, HTML5, CSS, etc.)
  - Understanding of JavaScript and all its intricacies
  - Knowledge of REST APIs, experience creating and consuming
    APIs, as well as ability to work with different data
    formats such as XML and JSON.
  - Experience in Object Oriented Programming/Design, Web
    Development and debugging
  - Proven ability to work independently as well as
    collaboratively
  - Strong programming skills
  - Excellent verbal and written communication skills
  - Public Trust
  - U.S. citizenship required to maintain a federal clearance

  Desired Skills & Experience

  - SAP Analytics Cloud Experience
  - Experience with Federal, State, Local, or Higher Education
    organizations
  - Firm understanding of standard SDLC, lean, and agile
    practices

  # LI-SA1

  #CJPOST

