description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  CrowdStrike Cloud Workload Protection places security
  controls at the level of individual application workloads.
  It enables organizations to identify and remediate
  vulnerabilities across the application lifecycle, enforcing
  compliance and security best practices across containers,
  Kubernetes and any workload. We also build security tools
  into the earliest phases of the development process, so
  vulnerable code is identified as it is written rather than
  in testing, which reduces costs and results in more secure
  applications.

  Our engineers work with AI coding agents every day. We're
  looking for people who can use these tools to move fast
  while bringing the judgment, depth and ownership that keep
  production systems correct and secure.

  This role is hybrid, requiring a minimum of 3 days per week
  on-site from our New York City office.

  What You’ll Do:

  - Contribute to and lead backend engineering efforts, from
    rapid prototypes to large-scale services across
    CrowdStrike's cloud security products.
  - Design, build, test, deploy and operate large-scale
    distributed services. Use AI coding agents to speed up
    delivery, while staying fully accountable for the
    correctness, security and maintainability of everything
    you ship.
  - Turn product requirements into clear technical designs and
    well-scoped tasks that both engineers and AI agents can
    carry out reliably.
  - Review code with a critical eye, whether a person or an
    agent wrote it. Catch logic errors, performance problems,
    insecure patterns and unnecessary complexity.
  - Build and maintain the guardrails that make fast, AI-
    assisted development safe: strong test suites, CI checks,
    static analysis, observability and clear repository
    documentation and conventions.
  - Triage and debug production issues across distributed
    systems, using AI tools to speed up investigation while
    applying your own judgment about root cause and impact.
  - Build public-facing command-line tools, some of which
    interact with our web services.
  - Mentor other engineers on our services, engineering best
    practices, and effective and responsible use of AI
    development tools.
  - Work with cross-functional teams across geographies, and
    partner with Product to define requirements and deliver
    features.
  - Respond to customer-reported issues quickly and take
    ownership through to resolution.
  - Keep re-evaluating our architecture, test coverage,
    performance, observability and stability, including how
    our team's development workflows can improve as AI tooling
    evolves.
  - Ultimately, help build a platform that secures the entire
    lifecycle of cloud workloads for CrowdStrike customers.

  What You’ll Need:

  - U.S. citizen or Permanent Resident and work solely from U.S.
    soil.
  - A bachelor's degree in Computer Science or equivalent
    practical experience.
  - A solid understanding of distributed systems and scalability
    challenges. Sharding, partitioning and horizontal scaling
    are second nature to you.
  - Strong programming fundamentals in at least one statically
    typed language. We write Go; you can learn it on the job,
    but you should be able to read and judge Go code
    critically.
  - Hands-on experience with AWS, Azure or GCP, infrastructure-
    as-code (Terraform, CloudFormation, ARM/Bicep), and
    Docker/Kubernetes/Helm.
  - Experience with Kafka or a similar message queue (message
    design, sizing and rates, monitoring consumer lag) and
    with relational databases such as Postgres.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.
  - Experience with, or strong interest in, AI-assisted
    development. You know how to give an agent the right
    context, when to trust its output, and when to step in and
    write or rewrite the code yourself.
  - Awareness of the risks that come with AI-generated code:
    invented or untrusted dependencies, secrets exposure,
    prompt injection, and insecure defaults.
  - Excellent code review skills, and a strong grasp of testing
    strategies that make correctness checkable rather than
    assumed.
  - Clear written communication. Design docs, task breakdowns
    and pull request descriptions are how you guide both your
    teammates and your tools.
  - A habit of owning outcomes: you meet commitments, you love
    seeing your code run in production, and you stand behind
    it when it breaks.

  Bonus points:

  - Understanding of cloud security concepts such as CSPM, CWPP
    and CNAPP.
  - Familiarity with container and Kubernetes security (build-
    time and runtime).
  - Exposure to cloud security products, including product
    direction for AI/ML, XDR, SIEM, SOAR or related
    cybersecurity domains.
  - Experience building internal developer tooling or agent
    integrations, such as tool/MCP servers or automated review
    and remediation pipelines.
  - Experience securing AI/LLM-powered systems, or applying AI
    to cloud security detection and remediation.
  - Experience with large-scale data processing like Apache and
    Spark and analytical queries like Apache Pinot

  #LI-JC1

