title: Lead Software Engineer
company: Founders Law
location: London, GBR
work_type: FULL_TIME
company_size: 26 Employees
description: |
  We're super proud to have recently been named one of the
  ''Best Places to Work'' in 2026, as well as listed in the
  ''Top 50 Places To Work For People Development'' in 2026.

  Job purpose

  Founders Law is hiring a hands-on Lead Software Engineer to
  build the systems our firm runs on, the internal tools our
  lawyers use, and our client-facing tech products.

  You’ll spend most of your time shipping code, lead one
  senior engineer, and have a clear route to Head of Software
  Engineering should you want it.

  In the words of the hiring manager

  I’m Chris, the Chief Transformation Officer. You’d be
  joining my team.

  I am a lawyer and software engineer by background. Nowadays
  I spend most of my time figuring out how we apply the right
  mix of deterministic and non-deterministic technology to
  both the business and practice of law.

  I need a Lead Software Engineer to take ownership of
  engineering so I can focus on product, legal engineering and
  our firm-wide operating model.

  This is a hands-on job. You’ll be on the tools most of the
  time, with one senior engineer reporting to you.

  You’ll set technical direction, make the architecture calls
  and ship alongside a small team.

  You’ll need to be comfortable working two ways:

  - Where limited domain expertise is required, I’ll expect you
    to work with me on big product calls, but otherwise take
    the lead end-to-end.
  - Where deep domain expertise is required, I’ll typically
    build a version 1 that captures the core requirements.
    You’ll work with the team and users to flesh it out
    further and iterate on it.

  Over the next 6–12 months I’ll increasingly need to shift my
  focus to product, legal engineering and our firm-wide
  operating model, leaving scope for the right candidate to
  progress into a Head of Software Engineering role.

  What we’re looking for

  You’re a strong full-stack engineer who is comfortable
  leading a small team but still wants to work on code every
  day.

  Essential:

  - Deep experience with Laravel and React, and confidence with
    Postgres.
  - An AI-native way of working. Most if not all of your code is
    written by agents, with you focusing on architecture,
    quality assurance and improved ways of working.
  - You are a Laravel artisan. You value code that is fluent and
    leans into the framework, even if most of it is now
    written by agents.
  - You’ve led engineers before, as a line manager or technical
    lead for at least one other person.
  - Startup or scale-up experience. You’re comfortable with a
    small team, ambiguity and shipping without heavy process.

  Strongly preferred:

  - Time in LegalTech or another regulated sector where
    confidential data and compliance shape how you build.
  - Basic familiarity with Domain-Driven Design (we only use the
    good bits!).
  - You’ve shipped LLM-powered features in a production setting.
  - You have built, tested and deployed robust task-focused MCP
    servers.

  Nice to have:

  - Working knowledge of other ecosystems (e.g. Go or Rust)
    where our core technology stack isn’t the right tool for
    the job.

  Key accountabilities

  You’ll own engineering across everything we build. In your
  first 12 months that covers four areas:

  - Founders Law Operating System. Work directly with Chris on
    our firm-wide operating system, shaped around how we
    actually work, with a view to taking ownership of the
    platform as product cadence settles.
  - Lawyer-facing tools. Build the context layer and tools our
    lawyers use day to day, working closely with the people
    who use them.
  - Client-facing products. Own and iterate on our existing
    client-facing applications, including our client portal,
    Tilder, our Founders Law Store and DocGen platform.
  - DevOps and application security. Own DevOps, from how we
    plan and code through to CI/CD and deployments on Laravel
    Cloud. Own application security across everything we
    build.

  Around that, you’ll:

  - Lead, review and develop our senior engineer, and set the
    engineering standards we hold ourselves to.
  - Work with Chris to turn product and legal engineering
    requirements into shipped applications.
  - Shape how the engineering function grows as the product
    portfolio expands.

  How we build

  We’re an AI-native engineering team: agentic coding tools
  are central to how we build, not an add-on.

  We expect you to work this way too. That means you:

  - are hot on architecture;
  - effectively delegate to agents to write and review code; and
  - take ownership of the quality of what ships.

  We operate in a regulated space. Even with agents writing
  most of the code, we value simple, well-architected code
  that is secure, easy to maintain and easy for someone else
  to pick up.

  Our stack is Laravel, React, Inertia, Tailwind and Postgres.
  We deploy predominantly on Laravel Cloud.

  We are building everything to be agent-first or at the very
  least agent-ready. That means users can do nearly everything
  they can in the UI from their favourite chat assistant.

  The team is small, so the path from idea to production is
  short. You’ll work directly with leadership, our lawyers and
  the people using what you build.

  Who are we?

  We are absolutely not your traditional law firm.

  We’re on a mission to stand in as a turnkey in-house legal
  team for founder-led businesses, with a particular focus on
  seed to Series C.

  Our client base spans the full breadth of the UK, European,
  Middle Eastern and US tech scene, from fintechs to edtechs,
  AI to fashion, FMCG to EV, and VCs, accelerators and
  incubators.

  We are part of the Founders Forum Group and are plugged into
  the tech ecosystem by our very nature.

  We’re growing rapidly, but we’re firm believers in
  sustainable & profitable growth. This year we’ve grown
  revenue by 40% (up from 23% last year), with margin growth
  to match.

  We’re more than a law firm

  Most law firms bend the way they work around off-the-shelf
  IT. We’re doing the opposite.

  We’re building the Founders Law Operating System: core
  technology designed around our business model, not the other
  way around. It’s built with agents and chat assistants as
  first-class users.

  Not only that, we are building:

  - Tooling for our own lawyers to better service our clients,
    whether that’s for speed, quality or surfacing the right
    knowledge in the right place.
  - Client-facing products that help clients allocate valuable
    human lawyer time where it will have the highest impact.

  We recently acquired Tilder, the tech behind one of the
  first AI-native contract review services.

  We expect to grow our application portfolio rapidly over the
  next 12–18 months.

  What you want to know

  We’re working to keep building an environment where talented
  individuals with lots of energy can thrive.

  This role is remote within the UK, with some days in London
  to work in person with Chris, the team and our lawyers.

  Beyond that we’re hybrid, so you can work from the office,
  home or Narnia; it’s your choice.

  We just need you to be on the UK tax system. We’ll set you
  up on a MacBook Pro or Surface Business with a home office
  allowance, so you have everything you need.

  When you do come in, we have a beautiful, shiny office with
  a terrace overlooking Temple Park, Big Ben* and The Shard.
  In the office, the team currently offers a free corporate
  chair massage once a month, weekly yoga sessions, free bike
  servicing once a quarter, and various other events.

  We have some pretty good perks too:

  - Salary up to £110k, dependent on experience.
  - “Surprise and delight” gifts for going the extra mile.
  - 25 days annual leave. Don’t worry, bank holidays are on top.
  - Day off on your birthday and other significant life events.
  - 5 days leave for education a year, plus a dedicated annual
    education budget.
  - Private healthcare with Vitality.
  - Private dental care, plus hearing cover and discounts with
    Boots Opticians.
  - £350 home setup allowance.
  - Worldwide travel insurance, including winter sports.
  - Annual emergency childcare allowance.
  - Half-price gym membership at Virgin Active, PureGym and
    Nuffield Health.
  - Electric car leasing salary sacrifice scheme, saving up to
    40% on electric cars.
  - Cycle to work scheme, saving up to 32% on a bike and
    splitting your payments over 12 months.
  - Access to a tech and home scheme with discounts and 12-month
    interest-free payment options through partners including
    Currys PC World, IKEA and John Lewis.
  - Socials every four weeks if you want to join us, from bars
    and restaurants to experiences at the F1 Arcade, Gamebox,
    Fairgame and many more.

  Plus lots more.

  *In autumn and winter, when the leaves fall off the trees.
