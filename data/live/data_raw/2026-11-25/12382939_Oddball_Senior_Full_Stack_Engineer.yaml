description: |
  Oddball believes that we can bring change and improve the
  daily lives of millions by bringing quality software to the
  federal space. Our team is full of experienced engineering,
  product, and user experience professionals who love bringing
  scalable solutions to life as much as they love working with
  clients to solve problems. We value learning, growth, and
  the ability to make a big impact at a rapidly growing
  company.

  This position is contingent upon contract award.

  We’re looking for a Senior Full Stack Engineer to join our
  VA innovation team, building and piloting applications that
  put new technology in front of Veterans and VA teams.

  What you'll be doing:

  - Build front-end interfaces with React and
    JavaScript/TypeScript
  - Build back-end services and APIs with Java or Node.js
  - Write tests and debug across the full stack
  - Work with PostgreSQL or MongoDB data stores
  - Contribute to CI/CD pipelines using GitHub Actions and
    deploy on AWS
  - Use AI-assisted development tools such as GitHub Copilot or
    Claude Code to speed up delivery while keeping quality
    high
  - Work with designers, product managers, and data teams to
    ship user-centered features
  - Review code and mentor other engineers

  What you’ll bring:

  - Strong experience with React and JavaScript or TypeScript on
    the front end
  - Strong back-end experience with Java or Node.js and Express
  - Solid understanding of API design and how backend systems
    work
  - Experience with PostgreSQL or MongoDB
  - Experience with AWS services such as S3 and Lambda is a plus
  - Experience with human-centered design and data-driven
    product development is a plus
  - Familiarity with AI-assisted development tools is a plus
  - Thrives in a remote, collaborative Agile environment and
    genuinely enjoys working with engineers, designers, and
    data scientists
  - Communicates clearly and openly, whether in a code review or
    a planning session
  - Performs other related duties as assigned

  Requirements:

  - Applicants must be authorized to work in the United States.
    In alignment with federal contract requirements, certain
    roles may also require U.S. citizenship and the ability to
    obtain and maintain a federal background investigation
    and/or a security clearance.

  Education:

  - Bachelor's Degree

  Benefits:

  - Fully remote
  - Annual Stipend
  - Comprehensive Benefits Package
  - Company Match 401(k) plan
  - Flexible PTO, Paid Holidays

