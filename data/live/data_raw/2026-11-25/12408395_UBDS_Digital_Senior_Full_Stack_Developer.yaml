description: |
  At UBDS, we help organisations transform through cloud,
  cyber security, AI and digital innovation. As our Software
  Engineering capability continues to grow, we're looking for
  an experienced Senior Full Stack Developer to support the
  design, development and delivery of modern, scalable
  applications across complex customer environments.

  This is a hands-on engineering role focused on full-stack
  development across frontend applications, backend services
  and APIs, primarily within AWS cloud environments.

  You'll work closely with Cloud Architects, Software
  Engineers, Product Managers and delivery teams to build
  secure, reliable and maintainable digital solutions, while
  providing technical guidance and contributing to engineering
  standards and best practices.

  What You'll Do

  - Design, develop, test and maintain scalable full-stack
    applications and services.
  - Build modern frontend applications using
    JavaScript/TypeScript and frameworks such as React or
    Angular.
  - Develop backend services, APIs and application integrations
    using Python, Node.js or equivalent technologies.
  - Design and implement REST APIs and integrations with
    internal and external systems.
  - Develop and deploy cloud-native applications within AWS
    environments.
  - Work with AWS services supporting application hosting,
    compute, storage and integration.
  - Contribute to application architecture, technical design and
    engineering decisions.
  - Write clean, secure, maintainable and well-tested code.
  - Develop and maintain automated tests and CI/CD pipelines.
  - Support Infrastructure as Code and automated deployments
    using Terraform, CloudFormation or equivalent tooling.
  - Participate in code reviews, troubleshooting and performance
    optimisation.
  - Work closely with Architects, Engineers, Testers and Product
    teams to translate requirements into technical solutions.
  - Support application security, resilience, scalability and
    operational reliability.
  - Provide technical guidance and mentoring to other
    developers.
  - Contribute to engineering standards, knowledge sharing and
    continuous improvement.
  - Work within Agile delivery teams, supporting iterative
    development and continuous delivery.

  What We're Looking For

  - Strong experience as a Senior Full Stack Developer, Software
    Engineer or similar.
  - Proven experience developing applications across frontend,
    backend and API layers.
  - Strong development experience using JavaScript/TypeScript
    and modern frontend frameworks such as React or Angular.
  - Backend development experience using Python, Node.js or
    comparable technologies.
  - Experience designing, developing and integrating REST APIs.
  - Hands-on experience developing and deploying applications
    within AWS.
  - Good understanding of cloud-native application
    architectures, microservices and distributed systems.
  - Experience working with relational or NoSQL databases.
  - Experience with Git, CI/CD pipelines, automated testing and
    modern DevOps practices.
  - Understanding of Infrastructure as Code and deployment
    automation.
  - Strong knowledge of secure coding, software design
    principles and maintainable application development.
  - Experience contributing to technical design, code reviews
    and engineering improvements.
  - Ability to provide technical guidance and support to other
    developers.
  - Experience working within Agile, multidisciplinary
    engineering teams.
  - Strong communication, problem-solving and stakeholder
    engagement skills.

  Desirable Experience

  Experience across some of the following would be beneficial:

  - AWS Lambda, API Gateway, ECS, EKS or EC2.
  - Amazon RDS, PostgreSQL, DynamoDB or S3.
  - AWS messaging and integration services such as SQS, SNS or
    EventBridge.
  - Serverless and event-driven application architectures.
  - Docker, Kubernetes and containerised application
    deployments.
  - Terraform, AWS CloudFormation or AWS CDK.
  - GitHub Actions, GitLab CI/CD or AWS deployment tooling.
  - Application monitoring and observability using CloudWatch or
    equivalent.
  - OAuth, OpenID Connect and cloud identity integration.
  - Experience modernising legacy applications and migrating
    services to AWS.
  - Experience delivering software within Government, Defence or
    other regulated environments.
  - Relevant AWS or software engineering certifications.

  Security Clearance

  Due to the nature of our Government and Defence engagements,
  candidates must be eligible and willing to obtain Security
  Check (SC) clearance and maintain the required level of
  clearance for the duration of their employment.

  Some assignments may require candidates to hold current SC
  clearance prior to commencement. Existing SC clearance would
  therefore be advantageous but is not essential for all
  opportunities.

  The Opportunity

  This role would suit an experienced Full Stack Developer who
  enjoys combining hands-on software engineering with
  technical ownership and collaboration.

  You'll work on modern AWS-based applications and services,
  developing secure, scalable solutions while contributing to
  technical design and engineering best practices.

  Working alongside experienced Cloud, Architecture, Data and
  Engineering specialists, you'll have the opportunity to
  influence technical decisions, mentor other developers and
  contribute to the continued development of UBDS's Software
  Engineering capability.

  Benefits

  Why people choose to grow their careers at UBDS Group

  Professionals choose to grow their careers at UBDS Group for
  its reputation as a dynamic and forward-thinking
  organisation that is deeply committed to both innovation and
  employee development. At UBDS Group, employees are given
  unique opportunities to work on cutting-edge projects across
  a diverse range of industries, exposing them to new
  challenges and learning opportunities that are pivotal for
  professional growth. The Group’s culture emphasises
  continuous improvement, offering ample training programs,
  mentorship, and the chance to gain certifications that
  enhance their skills and marketability.

  UBDS Group fosters a collaborative environment where
  creativity and innovation are encouraged, allowing employees
  to contribute ideas and solutions that have a tangible
  impact on the company and its clients. This combination of
  professional development, a culture of innovation, and the
  opportunity to make meaningful contributions makes UBDS
  Group an attractive place for those looking to advance their
  careers and be at the forefront of technological and
  operational excellence.

  Employee Benefits

  - Training – All team members are offered a number of options
    in terms of personal development, whether it is technical
    led, business acumen or methodologies. We want you to grow
    with us and to help us achieve more
  - Private medical cover for you and your spouse/partner,
    offered via Vitality
  - Discretionary bonus based on a blend of personal and company
    performance
  - Holiday – You will receive 25 Days holiday, plus 1 day for
    Birthday and 1 day for your work anniversary in addition
    to UK bank holidays
  - Electric Vehicle leasing with salary sacrifice
  - Contributed Pension Scheme
  - Death in service cover
  - Hybrid Working – UBDS Group offers a flexible working
    environment to help enable you to operate at your maximum
    regardless of your location. With offices in London &
    Manchester we offer a culture that is focussed on outcomes
    and giving you a work life balance but at that same time
    creating and driving a culture of inclusivity and
    togetherness

  About UBDS Group

  At UBDS Group our mission is to support entrepreneurs who
  are setting new standards with technology solutions across
  cloud services, cybersecurity, data and AI, ensuring that
  every investment advances our commitment to innovation,
  making a difference, and creating impactful solutions for
  organisations and society.

  With a portfolio including UBDS Digital and Rayo, UBDS Group
  Companies proudly offer comprehensive, end-to-end digital
  solutions tailored for both the public and private sectors.
  By harnessing the strengths of leading technology partners,
  we deliver innovative strategies, services and solutions
  that address complex challenges and drive significant value.
  Our services cover digital consulting, cloud platforms, data
  and ai, cybersecurity, managed services and delivery
  management.

  Equal Opportunities

  We are an equal opportunities employer and do not
  discriminate on the grounds of gender, sexual orientation,
  marital or civil partner status, pregnancy or maternity,
  gender reassignment, race, colour, nationality, ethnic or
  national origin, religion or belief, disability or age.
