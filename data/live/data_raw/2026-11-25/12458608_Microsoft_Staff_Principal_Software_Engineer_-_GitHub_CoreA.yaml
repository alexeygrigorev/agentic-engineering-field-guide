description: |
  Overview

  Who We Are:

  GitHub is the developer company. We make it easier for
  developers to be developers: to work together, to solve
  challenging problems, and to create the world’s most
  important technologies. We foster a collaborative community
  that can come together - as individuals and in teams - to
  create the future of software and make a difference in the
  world.

  What does planning and collaboration look like when coding
  agents are part of the team? How do you take an early idea,
  work through it with other people, and carry that shared
  understanding into implementation without losing the context
  along the way?

  GitHub’s Planning and Tracking team is working on those
  questions! We’re looking for a Staff/ Principal Software
  Engineer to help evolve GitHub’s collaborational tools and
  build new experiences that connect ideas, decisions, and
  code. This is an opportunity to shape both what we build and
  how we build it.

  You’ll be a hands-on technical leader with strong product
  instincts and care for user (and agent) experience.

  You’ll partner closely with design and product to turn
  uncertain ideas into working prototypes, learn from
  customers, and carry promising experiments into reliable,
  accessible experiences. You should be comfortable following
  a problem across the stack, from an interaction that doesn’t
  feel right to the APIs and services underneath it. Knowing
  when to reuse what exists, when to invest in a stronger
  foundation, and when to try a different approach will matter
  as much as the code you write.

  Your impact will extend beyond your own implementation work.
  You’ll help the team make difficult technical decisions,
  bring clarity when the path is unclear, and grow other
  engineers through pairing, thoughtful reviews, and shared
  ownership. We want someone who can explain a strong point of
  view, invite disagreement, and change their mind when the
  evidence calls for it.

  We’re also transforming our own development process: using
  coding agents, building prototypes to test assumptions, and
  using the tools we’re creating in our daily work. We don’t
  expect you to arrive with every answer. We’re looking for
  curiosity, sound judgment, and a genuine interest in helping
  a distributed team build something useful together.



  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As part of
  GitHub and CoreAI, we build developer tools that materially
  improve how software is written, reviewed, and shipped,
  while maintaining a culture of ownership, rigor, and
  technical excellence.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Build experiences that millions of people love and use every
    day, helping them to be more productive, collaborate more
    effectively and achieve their goals

  - Have a real impact, take on ownership of GitHub. Contribute
    to and improve it from day one

  - Foster technical growth across the team by researching new
    approaches, sharing insights, and guiding their practical
    adoption

  - Write architecture briefs and proposals, carry out code
    experiments, and build prototypes to learn how we can
    achieve planetary scale with our systems

  - Work closely with engineering leadership to guide technical
    investment and implement technical roadmaps and priorities

  - Coordinate with engineering and product leads to define,
    prioritize, and task projects that help us meet business
    objectives

  - Provide technical leadership, mentorship, pairing
    opportunities, and code reviews to encourage the growth of
    others

  Qualifications



  Required Qualifications

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, React
    JavaScript, or Ruby, GO, Python OR equivalent experience.



  Other Requirements

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include but are not limited to the
  following specialized security screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years


  Preferred Qualifications

  - 10+ years of hands-on experience working on web applications
    at scale
  - 1+ years of experience working remotely as part of a
    distributed software engineering team
  - 5+ years of React experience

  - Customer focus and data driven approach



  - Analytical skills as well as communication skills both
    verbal and written. We’re a distributed team so we’re
    extra mindful about communication

  - Clear and effective communicator, be it when you write code,
    write emails, or explain complex technical issues to non-
    technical co-workers

  - Passionate and self-motivated, with a demonstrated ability
    to work in a fast-paced environment



