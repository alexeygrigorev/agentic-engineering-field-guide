description: |
  Job Description

  Job Purpose

  The New York Stock Exchange (an Intercontinental Exchange
  company) is synonymous with finance. It's where global
  investors turn every day. As the world's most trusted
  exchange group, we operate a family of exchanges spanning
  equities, options, ETFs, and bonds, all running on trading
  technology we build and operate ourselves, combining that
  technology with a human being at the point of sale.

  We are looking for a versatile Full Stack Software Engineer
  with a strong technical foundation and the ability to work
  across the entire stack, from data and services through to
  the user experience. This is a builder's role. You will own
  problems from idea to production and take on work across
  design, implementation, testing, and delivery rather than
  staying inside a single layer.

  AI is reshaping how software is built, and we want an
  engineer who takes full advantage of it. The most effective
  developers today use AI and agentic tools to raise both
  their speed and their quality, and to expand the scope of
  what one engineer can deliver. We are looking for someone
  who has made these tools part of how they work and who stays
  current as the field evolves.

  You will join a fluid team that moves quickly, where ideas
  need to be communicated concisely and effectively. The ideal
  candidate is driven, works well independently and as part of
  a team, and knows when to escalate. You should thrive in an
  agile environment, welcome constructive feedback in the
  spirit of improving software quality, enjoy modern tooling,
  and be able to take on complex, loosely defined problems
  with limited direction.



  Responsibilities

  - Design and build thoroughly tested, efficient, maintainable
    software across the full stack
  - Own features from early concept and prototype through to
    production and support
  - Design, build, and integrate RESTful APIs and services
  - Contribute to and enhance shared component and testing
    frameworks
  - Use AI and agentic development tools to accelerate
    implementation, testing, refactoring, and documentation,
    while retaining full ownership of the correctness,
    quality, security, and maintainability of everything
    shipped
  - Review and validate code generated by AI with the same rigor
    as any other change, and define the conventions and
    guardrails that keep this work consistent with the
    codebase
  - Choose an appropriately sized AI model for each task,
    balancing capability against speed and cost
  - Create and maintain clear software documentation
  - Prepare and produce releases of software components
  - Build wireframes and prototypes to validate ideas quickly
  - Provide support throughout the software delivery process,
    including beyond business hours when necessary

  Working with AI

  Fluency with modern AI development tools is a core
  expectation for this role, not something optional. We expect
  candidates to have actively used these tools in real
  development work within the past year.

  - Direct experience with AI and agentic coding tools such as
    Claude Code, OpenAI Codex, Cursor, and GitHub Copilot in
    VS Code
  - Practical experience using AI agents to accomplish real
    engineering tasks from start to finish, including
    planning, implementing, testing, and refactoring, rather
    than autocomplete alone
  - Sound judgment about when to rely on AI and when not to, and
    a disciplined approach to reviewing and validating the
    code these tools produce
  - Working familiarity with the current model landscape across
    providers such as Anthropic, OpenAI, Google, xAI, and
    Meta, and an understanding of their relative strengths
  - Selecting models with cost in mind, knowing when a smaller
    and faster model is the right choice and when a frontier
    model is warranted
  - A habit of following developments in this quickly changing
    space and adapting as tools and models evolve
  - A track record of using AI to learn new concepts and grow
    independently, and a genuine appetite for continuous
    improvement

  Knowledge and Experience

  We are hiring at the 2+ year experience level and do not
  expect deep mastery of every item below. What matters most
  is a strong technical foundation, active and thoughtful use
  of AI tooling, excellent communication, and a clear growth
  trajectory. We want a capable engineer with the right
  fundamentals and real drive who we are confident can grow
  with us.

  - Bachelor's degree in Computer Science or a related field, or
    equivalent practical experience
  - 2 or more years of professional software development
    experience
  - Strong computer science fundamentals, including data
    structures, testing, debugging, and clean, maintainable
    design
  - Proven ability to work across the full stack, comfortable on
    both the frontend and the backend rather than in a single
    layer
  - Proficiency with a modern frontend framework and the core
    web technologies beneath it, including component design
    and state management. We primarily use React and
    TypeScript, with JavaScript, HTML5, and CSS
  - Experience building backend services and integrating RESTful
    APIs
  - Experience working with a relational database such as Oracle
    or PostgreSQL
  - A habit of writing automated tests and reviewing code with
    care, including code produced by AI
  - Demonstrated, recent experience using AI development tools
    (see Working with AI above)
  - Excellent communication skills and the ability to explain
    technical solutions clearly
  - Ability to work well both independently and as part of a
    team, with a strong desire to grow

  Preferred

  - Experience with the Spring Boot framework or another modern
    backend framework
  - Experience with data grids and data virtualization in React,
    including AG Grid
  - Experience with D3 or a similar JavaScript visualization
    library
  - Experience with testing and browser automation frameworks
    such as Jest, React Testing Library, Enzyme, Chai,
    Playwright, jest-puppeteer, or cucumber-js
  - Experience with WebSocket integration
  - Exposure to cloud platforms, containers, or CI/CD pipelines
  - Interest in or exposure to financial markets or trading
    systems

  New York Base Salary Range

  The expected base salary for this role, if located in New
  York, is between $130,000 - 160,000 USD.  The base salary
  range does not include Intercontinental Exchange’s incentive
  compensation.  While we provide this range as general
  guidance, at ICE we compensate employees based on the
  skillset and experience of the individual. Regular full-time
  ICE employees are eligible for a suite of competitive
  employee benefits, including healthcare coverage (medical,
  dental and vision), a 401(k) plan, life insurance, time off,
  and paid leave for qualifying circumstances.

  ----------Intercontinental Exchange, Inc. is an Equal
  Opportunity Employer. All qualified applicants will receive
  consideration for employment without regard to legally
  protected characteristics.
