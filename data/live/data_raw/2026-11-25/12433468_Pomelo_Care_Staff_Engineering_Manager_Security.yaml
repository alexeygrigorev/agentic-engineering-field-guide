description: |
  Pomelo Care is the leading virtual medical practice for
  women and children, providing care across pregnancy,
  postpartum, pediatrics, menopause, and perimenopause. We
  combine proactive, 24/7 clinical care with technology that
  helps us reach patients earlier, identify risks sooner, and
  deliver personalized care throughout their journey. Our team
  includes clinicians, technologists, operators, and problem-
  solvers working together to make high-quality care more
  accessible for families nationwide.

  About The Role

  Security at Pomelo is an engineering problem, and you'll
  lead the team that solves it. You'll work in tandem with a
  peer leader focused on the non-technical side of security:
  compliance, policy and customer relationships. Together,
  you'll make security a differentiator for Pomelo, not a
  checkbox.

  This role reports to the VP of Engineering and is open to
  any candidates located in the continental US.

  What You’ll Do

  - Set the team's priorities: figure out which risks matter
    most and make sure the team spends its time closing those
    instead of chasing noise.
  - Hire and grow a team of senior and staff security engineers.
    Give them real ownership and hold a high bar for what
    "done" means.
  - Stay hands-on. Design and ship controls yourself, review the
    team's work and take on some of the hardest technical
    problems.
  - Make sure we're ready for what's out there: least privilege
    for every vendor and integration, and an incident response
    program that holds up against supply chain attacks, roving
    Artex hordes and Whatever Comes Next from AI.
  - Partner with our compliance and policy leadership to turn
    control objectives into real controls, and steer effort
    toward the requirements that actually reduce risk or
    unlock commercial deals (ex. HITRUST, health plan
    requirements).

  Who You Are

  - You've led teams that made organizations measurably safer.
    Your track record is risks you've closed, not tickets
    you've opened.
  - You can tell signal from noise, and you can teach it. You
    know an A+ problem from a B+ problem, and you protect your
    team's time for the A+ ones.
  - You're a builder first, with 7+ years shipping production
    code (Kotlin, Java, Python, Go, C# or similar) and real
    security depth: threat modeling, identity and auth, and
    cloud and supply chain security. You still ship code, and
    you've put AI to work on defense enough to know where it
    helps and where it doesn't.
  - You've worked under HIPAA and HITRUST and know how to
    satisfy them without drowning engineering in process.
  - You've managed engineers for 3+ years. You hire great
    people, give them direct feedback and grow them into
    bigger roles.
  - You're calm, deliberate and decisive under pressure, and you
    dig in until you understand the actual threat. Sometimes
    the fix is a vendor and sometimes it's 50 lines of code,
    and either way you can explain why.

  Compensation

  The expected base salary range offered for this role is
  $245,000 - $275,000. This role is also eligible for equity,
  giving you an ownership stake in Pomelo’s mission. Actual
  compensation may vary based on relevant experience, skills,
  competencies, and certifications.

  We are committed to hiring the best team to improve outcomes
  for all mothers and babies. To solve the complex challenges
  facing the diverse population we serve, we need diverse
  perspectives, actively welcoming people of all races, ages,
  sexual orientations, gender identities and expressions,
  national origins, religions, disabilities, and veteran
  statuses. We strive to cultivate an inclusive and respectful
  environment where team members thrive by working across
  disciplines, moving fast, making data driven decisions,
  learning continuously, and always putting the patient first.

  By submitting your application you are acknowledging we are
  using your personal data as outlined in the Privacy Notice
  for Employees and Candidates.
