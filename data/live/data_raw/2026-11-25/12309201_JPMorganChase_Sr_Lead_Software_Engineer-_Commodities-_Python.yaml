description: |
  Be an integral part of an agile team that's constantly
  pushing the envelope to enhance, build, and deliver top-
  notch technology products.   As a Senior Lead Software
  Engineer at JPMorganChase within the Commercial & Investment
  Bank, Commodities team, you are an integral part of an agile
  team that works to enhance, build, and deliver trusted
  market-leading technology products in a secure, stable, and
  scalable way.

  The Commodities Line of business is one of the early
  adopters of thepython-based Athena platform. In Commodities,
  from trade capturing to day-to-day live risk management to
  all the middle and back-office operations; all are handled
  in Athena. The Application layer of Athena is entirely in
  Python with heavy application of Graph. Athena uses an in-
  house built object database called hydra.



  Commodities Transformation is about modernizing the
  Commodities Athena platform. To that end the first aim to
  modernize the Commodity Physical Inventory Management for
  the physical trading. This is to uplift the existing system
  (which is also in Athena) into a robust, scalable, and
  consistent state. This also entails to developing an
  intuitive User Experience using cutting edge technologies.
  This is a full-stack development challenge.

  Job responsibilities

  - Problem solving – given a problem statement find out and
    evaluate alternatives, plan, and build quick POC, present
    it to broader team and stakeholders.
  - Lead a group of engineers to provide innovative engineering
    design and solution to various challenging problems.
  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems.
  - Adoption of AI in creative way in all phases of the projects
    and do effective AI drives Spec Based Design and
    Development.
  - Participate and develop to create an intuitive user
    experience at the front end.
  - Develops secure high-quality production code, and reviews
    and debugs code written by others.
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and
    systems.
  - Improves experience for trading, operations developing
    intuitive user interfaces and performant back ends.
  - Work with QR (Quantitative Research) group as well as other
    technical partners in a collaborative environment.
  - Partner with many groups both upstream and downstream with
    varied priorities. Communication is the key here.
  - Drives and executes within the strategy of macro technology,
    of which commodities is one section (aligning with rates
    and FX technology peers)

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience.
  - Leadership skills – plan, delegate, resolve conflicts and
    lead a group of engineers through the different phases of
    the project,
  - Quick learning abilities – Athena is Graph based enterprise
    system. You need to learn Athena quickly to become
    productive in shortest possible time.
  - Formal training or certification on software engineering
    concepts and advanced applied experience
  - Hands-on practical experience in any enterprise system in
    developing robust backend codes.
  - Advanced in one or more programming language(s). (Python,
    C++ and / or Java) .
  - Willingness to become proficient and develop in Python if
    not already a primary language.
  - Knowledgeable in automation and continuous delivery methods
  - Knowledgeable in the Software Development Life Cycle
  - Prior track record of delivery within risk management in
    financial services
  - Ability to collaborate with and influence other technology
    teams to deliver end to end solutions to the business in a
    constantly changing environment.
  - Adoption of AI into all levels of design, development and
    testing phase.

  Preferred qualifications, capabilities, and skills

  - Full stack development skillset – some hands-on experience
    in UI development is a plus.
  - Concept of Risk, Markets – any knowledge in commodities
    markets is a plus.
  - Expertise in python, pandas, NumPy, SciPy is a plus.

