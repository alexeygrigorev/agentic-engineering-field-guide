description: |
  GoodRx is the trusted platform for prescription access and
  affordability. The company helps consumers navigate care,
  cost, and fulfillment so they can start and stay on
  treatment, while enabling partners to deliver self-pay
  pricing, affordability programs, and pharmacy access at
  scale. With a trusted brand, nationwide pharmacy network,
  and more than 280 million site visits annually, GoodRx
  reaches consumers at the moments when cost and access are
  shaping healthcare decisions. Since 2011, GoodRx has helped
  Americans save over $100 billion on medications.

  About the role:

  GoodRx is standing up an AI Center of Excellence to take AI
  initiatives from concept to governed, production-grade
  deployment. We are hiring a Sr. Engineering Manager, AI and
  Agents to lead the engineers who build and operate our AI
  products, agents, and shared platform, including the
  evaluation and guardrails infrastructure every AI launch at
  GoodRx runs through. You will lead engineering teams and
  technical leaders across multiple AI use-case pods and
  shared platform capabilities, own engineering quality and
  delivery, and partner closely with the CoE’s lead product
  manager and enterprise architecture. This is a highly
  technical leadership role where you will set the engineering
  bar, develop engineering talent and leaders, guide technical
  decisions, and ensure the reliable delivery of production-
  grade AI solutions.

  What You Will Do

  - Lead, hire, develop, and scale AI engineering teams and
    technical leaders supporting multiple use-case pods and
    shared platform capabilities (e.g., marketing creative
    generation, AI product experiences, agentic distribution,
    enterprise workflow automation), setting clear
    expectations, providing ongoing coaching and feedback,
    managing performance, career growth, and leadership
    development.
  - Own delivery and engineering quality for LLM-based systems,
    agents, and integrations, from architecture and build
    through production operation, cost, latency, and
    reliability, ensuring teams make sound technical tradeoffs
    and deliver scalable, maintainable solutions across
    multiple products and services.
  - Guide technical direction and lead the development and
    operation of the CoE’s shared AI platform: evaluation
    pipelines, behavioral and quality testing, prompt and
    model management, observability, DLP / sensitive-prompt
    guardrails, agent frameworks, and reusable AI capabilities
    that can scale across teams.
  - Partner with Product, Architecture, and business leaders to
    translate product and business priorities into technical
    plans, prioritize engineering work, and balance capacity
    and resources across teams and initiatives; make informed
    tradeoffs across delivery commitments and technical
    investments, including build/buy/partner, vendor, and
    model decisions.
  - Establish and maintain effective engineering practices
    across planning, design and code reviews, on-call, and
    incident management; proactively manage cross-team
    dependencies, operational risks, and systemic technical
    issues, and keep senior stakeholders aligned on key
    progress, risks, tradeoffs, and decisions.
  - Ensure every launch meets CoE evaluation, security, and
    governance standards; collaborate with Legal, Compliance,
    and Security to move fast with the right guardrails and
    drive consistent adoption of these practices across AI
    engineering teams.
  - Develop, scale, and champion engineering standards, reusable
    patterns, and playbooks that enable the CoE and partner
    teams to adopt AI safely and quickly; establish knowledge-
    sharing practices that scale across teams.
  - Stay close to the technology through critical architecture,
    design, and technical decisions, while maintaining primary
    accountability for engineering leadership and delivery
    through teams and leaders.
  - Navigate complex, ambiguous, cross-cutting engineering
    challenges that span teams and organizational boundaries,
    establishing scalable approaches and driving alignment
    where precedent or clear solutions may not exist.



  What You Bring

  - 12+ years of software engineering experience, including
    experience building AI/ML or GenAI systems in production
    and 3+ years managing or leading engineers and engineering
    teams.
  - Demonstrated ability to lead multiple highly technical
    engineering teams and technical leaders while driving
    effective execution across related teams and initiatives.
  - Deep technical fluency with LLM application architecture:
    RAG, agents and tool use, prompt engineering, fine-tuning
    trade-offs, evaluation methods, and MLOps / LLMOps, with
    experience developing and scaling reusable AI platforms,
    agent frameworks, evaluation systems, and observability
    practices.
  - Hands-on experience shipping and operating production AI
    services, including APIs, orchestration, cloud
    infrastructure, cost and latency optimization, and
    monitoring at scale.
  - Track record of building and leading high-performing
    engineering teams in a matrixed organization, including
    blended employee and contractor teams, with demonstrated
    experience developing engineers and engineering leaders.
  - Experience designing evaluation and behavioral measurement
    for AI systems and using those results to gate releases,
    improve quality, and inform ongoing technical and product
    decisions.
  - Excellent communication and influence skills, with
    demonstrated ability to explain complex technical
    strategy, drive alignment across teams and organizational
    boundaries, and influence senior stakeholders through
    complex technical tradeoffs and decisions, including
    presenting effectively to executive audiences when
    appropriate.
  - Bachelor’s degree in computer science or a related technical
    field, or equivalent experience; advanced degree a plus.



  Nice to Have

  - Healthcare, pharma, finance, or other regulated-industry
    experience.
  - Familiarity with AI governance frameworks (NIST AI RMF),
    responsible AI practices, and data protection controls.
  - Experience with agentic systems, MCP, enterprise agent
    platforms, or AI evaluation tooling.
  - Experience integrating AI into consumer-scale products.

  Engineering teams are responsible for supporting appropriate
  security controls, including management, operational, and
  technical controls in addition to general GoodRx best
  practices, such as reading and adhering to the security
  policies and procedures, being vigilant and observant of
  potential security threats, etc.

  We’re committed to growing and empowering a more inclusive
  community within our company and industry. That’s why we
  hire and cultivate diverse teams of the best and brightest
  from all backgrounds, experiences, and perspectives. We
  believe that true innovation happens when everyone has a
  seat at the table and the tools, resources, and
  opportunities to excel.



  With that said, research shows that women and other
  underrepresented groups apply only if they meet 100% of the
  criteria. GoodRx is committed to leveling the playing field,
  and we encourage women, people of color, those in the LGBTQ+
  communities, individuals with disabilities, and Veterans to
  apply for positions even if they don’t necessarily check
  every box outlined in the job description. Please still get
  in touch - we’d love to connect and see if you could be good
  for the role!



  GoodRx is committed to providing reasonable accommodations
  for candidates with disabilities during our recruiting
  process. If you need any assistance or accommodations due to
  a disability, please reach out to us at
  accommodations@goodrx.com.



  We prioritize candidate safety. Please be aware that all
  official communication will only be sent from @goodrx.com or
  @ashbyhq.com addresses.
