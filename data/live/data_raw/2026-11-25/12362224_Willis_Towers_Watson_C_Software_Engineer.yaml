description: |
  We are seeking for a talented C# Software Engineer to join
  one of our highly-skilled and close-knit development teams
  following Scrum methodologies to develop market-leading
  insurance pricing solutions.

  These are varied and challenging opportunities where you
  will be able to play a key role creating new product
  features and enhancing existing code, whilst ensuring the
  product continues to meet high levels of reliability,
  maintainability, usability and performance. The role also
  includes supporting mathematical and statistical algorithms
  underpinning our pricing solutions, with the ability to
  translate mathematical problems and solutions into reliable,
  efficient code when required.


  The Role

  - Working with the Product Owner to define, refine and deliver
    the product backlog,
  - Designing and documenting software solutions meeting
    functional and non-functional requirements,
  - Implementing and refactoring product code (C#), following
    best practices for maintainability, testability and
    performance,
  - Supporting the implementation and maintenance of
    mathematical and statistical algorithms, translating
    mathematical problems and solutions into reliable,
    efficient C# code when required,
  - Implementing unit tests, developing test frameworks and
    associated automated test cases,
  - Reviewing and debugging code to identify defects,
    performance bottlenecks or technical debt,
  - Working closely with test engineers to guarantee suitable
    test coverage, identifying and executing manual tests if
    necessary,
  - Participating in sprint planning meetings, daily stand-ups
    and sprint retrospectives, striving to continuously
    improve the team velocity, its processes and engineering
    practices,
  - Depending on experience, mentoring junior members of the
    team and taking a lead role for some of the above
    activities.

  Qualifications

  What you’ll bring

  The essential skills/experience for this position are:

  - A degree in Mathematics or an equivalent qualification or
    experience demonstrating a strong mathematical foundation,
  - Proficient in software development using C# .NET,
  - Practical proficiency in Python is required. Although Python
    will not be used frequently, the ability to write,
    understand and maintain Python code will be essential when
    needed,
  - Demonstrable extensive hands-on experience using AI-assisted
    development tools, including AI Copilot, to write, refine,
    debug and test code, with the ability to critically review
    and validate AI-generated code,
  - Experience with the full software development lifecycle in a
    commercial/production environment: requirements capture
    and analysis, estimation, detailed software design,
    implementation, unit and system-level testing,
    installation and deployment, maintenance,
  - Experience with software engineering best practices: object-
    oriented design and implementation, design patterns, SOLID
    principles, Agile and Extreme Programming methodologies,
  - Experience with software development tools: IDE’s, version
    control, test automation, continuous integration, defect
    and backlog management systems,

  Other highly desirable, but not essential skills are:



  - Ability to coordinate day-to-day development and bug fixing
    activities,
  - Ability to design high-performance, scalable and extensible
    software architectures which are also easy to test, debug
    and maintain,
  - GUI design/implementation, knowledge of standards and
    frameworks such as WPF or WinForms,
  - Appreciation of current and emerging technologies along with
    their potential benefits and limitations,
  - Visual Studio, Git and Azure DevOps
  - Experience of unit and GUI test automation frameworks
  - Passion for maths, statistics and complex algorithms.
  - General knowledge of the Insurance Industry

  What we offer

  Enjoy a benefits package designed to help you thrive, both
  professionally and personally. You'll receive 25 days of
  annual leave plus an extra WTW day to relax and recharge.
  Our comprehensive health and wellbeing offering includes
  private healthcare, life insurance, group income protection,
  and regular health assessments, all giving you peace of
  mind. Secure your future with our defined contribution
  pension scheme, featuring matched contributions up to 10%
  from the company.

  We support your growth and balance with hybrid working
  options, access to an employee assistance programme, and a
  fully paid volunteer day to make a difference in your
  community. On top of these, you can opt into a variety of
  additional perks including an electric vehicle car scheme,
  share scheme, cycle-to-work programme, dental and optical
  cover, critical illness protection, and much more. Start
  making the most of your career and wellbeing with a range of
  benefits tailored for you.

  Equal Opportunity Employer

  We’re committed to equal employment opportunity and provide
  application, interview and workplace adjustments and
  accommodations to all applicants. If you foresee any
  barriers, from the application process through to joining
  WTW, please email candidatehelpdesk@wtwco.com




