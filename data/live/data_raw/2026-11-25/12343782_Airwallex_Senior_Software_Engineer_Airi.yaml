description: |
  About Airwallex

  Airwallex is the AI-native financial operating system for a
  real-time, intelligent economy. More than 675,000
  businesses, including McLaren Racing, Qantas, SHEIN, and
  TikTok, use us, directly or through our platform partners,
  to run their financial operations or build and monetize
  financial products of their own.

  We started in Melbourne in 2015 to build the infrastructure
  global commerce runs on. We're the regulated backbone behind
  global payments: not by accident, but by design. A decade
  plus, 85+ licenses, and a financial infrastructure spanning
  North America, Europe, the Middle East, and Asia-Pacific.

  We're co-headquartered in San Francisco and Singapore, with
  more than 2,700 people across 27 offices. We hire builders
  with founder-level energy, people who move fast with good
  judgment, dig in with real curiosity, and make calls from
  first principles rather than waiting to be told what to do.
  Read our operating principles to see it in full.



  How you’ll make impact You’ll help build the infrastructure
  behind reliable, secure payment processing for businesses
  around the world. You’ll work across real-time transaction
  scenarios and contribute to systems that make online
  payments easier to integrate and safer to use.

  - Build infrastructure services that improve payment
    processing capabilities, strengthen security, and increase
    customer trust.
  - Design, develop, and maintain APIs, services, and systems
    that support a reliable global payment processing flow.
  - Collaborate with engineering teams across Airwallex’s global
    offices, as well as users and financial partners, to
    deliver seamless integrations.
  - Own critical components of Airwallex’s online payment
    processing flow, troubleshoot production issues across the
    stack, and continuously improve system reliability.

  You'll work from our London office three days a week. What
  we’re looking for Essentials

  - 6+ years of software engineering experience.
  - Experience designing elegant systems that abstract complex
    patterns, particularly in the financial industry.
  - Strong systems-thinking skills and a track record of writing
    high-quality code and documentation, with a preference for
    Kotlin.
  - High standards when working with production systems.
  - A commitment to best practices in engineering, security, and
    design.
  - Experience making decisions with diverse stakeholders and
    subject matter experts in collaborative environments.
  - Enjoyment of working with diverse groups of people and
    bridging gaps between teams and areas of expertise.

  Preferred

  - Familiarity with Spring or Spring Boot.
  - Proficiency in Java, Kotlin, or another modern programming
    language.
  - Proficiency with HTTP and RESTful specifications.
  - Familiarity with OAuth 2.0 or JWT.
  - Experience with PostgreSQL, Redis, or NoSQL databases.
  - Experience with Kafka or RabbitMQ.
  - Familiarity with Nginx or Istio.
  - Experience with cloud providers such as Aliyun Cloud, GCP,
    or AWS.
  - Experience designing, implementing, and maintaining complex
    public API products, including user integration guides.

  You’ll thrive here if

  - You own the outcome and you don’t wait for permission to fix
    what’s broken.
  - You hold yourself to a high standard even when no one is
    watching. Quality and accountability aren’t external
    expectations, they’re internal ones.
  - You enjoy working closely with people across multiple
    countries and time zones as part of one connected, global
    team, including flexing your hours occasionally to make
    that connection work.
  - You’ve worked in a high-growth or scaling environment and
    know what it takes to build systems that need to grow with
    the business.
  - You connect dots across functions and hold the big picture
    without losing grip on the details.

  Learn more about your team Payments Platform at Airwallex
  builds the infrastructure that turns global payment
  complexity into reliable, scalable payment experiences,
  helping businesses accept and process money across markets
  with less friction. The challenge is balancing performance,
  reliability, local complexity, and commercial outcomes in
  the same system, where small improvements can materially
  affect conversion and failures are immediately visible.
  Within Payments Platform, Airi builds and scales the
  identity and product capabilities behind secure, one-click
  checkout for shoppers. Dynamic tokenization helps strengthen
  checkout security, while Airi’s work lays the groundwork for
  a future where AI agents can complete purchases on shoppers’
  behalf.

  Applicant Safety Policy: Fraud and Third-Party Recruiters

  To protect you from recruitment scams, please be aware that
  Airwallex will not ask for bank details, sensitive ID
  numbers (i.e. passport), or any form of payment during the
  application or interview process. All official communication
  will come from an @airwallex.com email address. Please apply
  only through careers.airwallex.com or our official LinkedIn
  page.

  Airwallex does not accept unsolicited resumes from search
  firms/recruiters. Airwallex will not pay any fees to search
  firms/recruiters if a candidate is submitted by a search
  firm/recruiter unless an agreement has been entered into
  with respect to specific open position(s). Search
  firms/recruiters submitting resumes to Airwallex on an
  unsolicited basis shall be deemed to accept this condition,
  regardless of any other provision to the contrary.

  Equal opportunity

  Airwallex is proud to be an equal opportunity employer. We
  value diversity and anyone seeking employment at Airwallex
  is considered based on merit, qualifications, competence and
  talent. We don’t regard color, religion, race, national
  origin, sexual orientation, ancestry, citizenship, sex,
  marital or family status, disability, gender, or any other
  legally protected status when making our hiring decisions.
  If you have a disability or special need that requires
  accommodation, please let us know.
