description: |
  About Alaffia & Our Mission

  Every year, U.S. health plans lose billions to improper
  payments and administrative waste. That wasted spending
  ultimately trickles down across the healthcare ecosystem,
  driving up costs for plans, providers, and patients alike.
  We're here to change that paradigm.

  Alaffia is a new kind of claims operations partner for
  health plans. Using expert clinicians and transparent AI, we
  deliver deeper insights, smarter automation, and
  consistently better outcomes across the entire lifecycle of
  claims. With Alaffia, health plans can cut wasted spending
  more effectively than ever — and provide their members the
  most affordable care.

  We're a high-growth, venture-backed Series B healthtech
  startup based in NYC and are actively scaling our company.
  Join us in helping to build a healthcare system that works
  better for everyone.

  About the Role & What You'll Be Doing

  We're looking for someone who is a strong, product-minded
  frontend engineer to help shape the interfaces our Payment
  Integrity and Operations teams rely on every day. You'll
  build and scale the React-based applications that sit at the
  center of our platform, working closely with backend,
  product, and design to turn complex workflows into fast,
  intuitive experiences. As we grow, you'll play a key role in
  leveling up our frontend architecture and setting the
  standard for how we build UI going forward.

  Your Responsibilities

  - Design, build, and maintain high-quality, production-grade
    React applications that power our core auditing and
    workflow tools.
  - Own the architecture of key frontend systems, making
    thoughtful decisions around state management, component
    design, and performance.
  - Improve and maintain frontend infrastructure, including
    build tooling, testing practices, and CI/CD pipelines.
  - Partner with backend engineers to define clean API contracts
    and ensure smooth end-to-end integration.
  - Identify opportunities to improve UI performance,
    accessibility, and overall user experience across the
    platform.
  - Contribute to code reviews and help establish frontend best
    practices as the team scales.
  - Debug and resolve complex, cross-component issues, using
    deep familiarity with the React ecosystem and our
    codebase.

  What We're Looking For

  - 7+ years of professional experience building production
    frontend applications, with deep hands-on expertise in
    React.
  - Strong command of modern JavaScript/TypeScript, component
    architecture, and state management patterns.
  - Experience building and scaling frontend systems within a
    growing engineering team.
  - Track record of collaborating cross-functionally with
    backend, product, and design to ship high-quality
    features.
  - Strong eye for UX and a track record of building interfaces
    that are both functional and easy to use.
  - Comfortable working through ambiguity and translating
    operational or business requirements into clean technical
    solutions.
  - Experience with testing frameworks and CI/CD tooling for
    frontend applications.

  Preferred

  - Experience building B2B SaaS products, particularly for
    operations, clinical, or financial teams.
  - Experience in healthcare technology or another highly
    regulated industry.
  - Familiarity with design systems and building reusable,
    scalable component libraries.
  - Experience with performance optimization for data-dense,
    workflow-heavy applications.
  - Exposure to AI/GenAI-powered features on the frontend (e.g.,
    chat interfaces, agentic workflows, natural language
    interactions).

  Our Culture

  Alaffia was born out of our founders' personal connection to
  the inefficiency of the U.S. healthcare system. We are
  deeply mission-driven, with an abiding belief that
  technology can help create a better future for everyone —
  and we're looking for others who share our passion for
  change to join the team.

  What Else Do You Get Working With Us?

  - Competitive Compensation
  - Medical, Dental, and Vision benefits
  - Flexible, paid vacation policy
  - Work in a flat organizational structure — direct access to
    Leadership
