description: |
  Job Title: Principal Software Engineer, AI Innovation Career
  Architecture Role: Software Engineer Career Architecture
  Tier: E35 (Principal, Expert Track)

  Job Summary:

  This is a founding engineer role in a new, innovation-
  focused team being built from scratch within Pearson's
  Enterprise Innovation function. The mission of the team is
  to drive early-stage, high-impact innovation initiatives:
  solving customer problems, supporting strategic deals, and
  co-innovating with external partners.

  You will lead the design and delivery of advanced AI
  solutions, collaborate with partners and product leaders to
  co-innovate, assess technical feasibility, and drive
  architecture decisions for high-impact, ambiguous, early-
  stage projects.



  Key Responsibilities:

  - Partner with internal and external stakeholders to identify,
    assess, and co-develop AI-driven innovation opportunities.
  - Shape and prototype early-stage ideas, taking undefined
    problems and helping define what gets built.
  - Lead technical feasibility reviews and shape architecture
    for enterprise-scale AI initiatives.
  - Decide how projects are executed — whether built internally,
    handed off to partners, or scaled through dedicated
    delivery teams — and drive that execution.
  - Build and prototype across the full stack, using modern
    tools and infrastructure.
  - Guide multiple engineering squads, ensuring execution of the
    co-innovation strategy and measurable business impact.
  - Collaborate closely with UX and Product to deliver
    differentiated, cross-functional solutions.



  Required Skills and Competencies:

  - Artificial Intelligence, Machine Learning, Automated AI
    (AutoAI), AI Agents (Advanced): Architect and deliver
    innovative AI solutions.
  - Full-Stack Engineering, Modern Development Tools (Advanced):
    Build and prototype end-to-end across frontend, backend,
    and infrastructure.
  - Cloud Computing, API Management, DevOps, Data Security,
    Information Security (Advanced): Lead technical execution
    and ensure compliance.
  - Collaboration, Innovation, Cross-Functional Working,
    Technical Acumen, Problem Solving (Advanced): Influence
    across teams and partners, shape ideas, and drive
    differentiated solutions.
  - Comfort with Ambiguity, Builder Mindset (Advanced): Operate
    effectively in undefined, fast-moving, early-stage
    environments.
  - Learning to Learn, Adaptability, Ethical Responsibility
    (Effective–Advanced): Embrace new technologies and
    maintain high ethical standards.

  Qualifications (Education & Experience):

  - Extensive experience in software engineering and AI
    innovation, with a broad full-stack skillset.
  - Proven track record of working on early-stage or 0→1
    products, shaping direction rather than only executing
    defined requirements.
  - Demonstrated ability to thrive in ambiguity and collaborate
    cross-functionally with UX, Product, and external
    partners.
  - Proven track record in partner co-development and technical
    delivery.
  - Deep expertise in software architecture, cloud, and emerging
    AI technologies.
  - A career history showing adaptability across products or
    problem spaces.



