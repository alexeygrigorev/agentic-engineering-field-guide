  Additional Information

  Epoch AI is a research institute that investigates trends in
  machine learning and the economic consequences of AI. Our
  mission is to develop a comprehensive, publicly accessible
  knowledge base on AI that informs policymakers, industry
  leaders, and society at large.

  We strive to achieve both rigor and accessibility to our
  work, as exemplified by some of our most successful
  projects, including our database of AI models and our AI
  trends dashboard. Our body of research includes our work on
  compute trends (IJCN 2022), data scarcity (ICML 2024), and
  algorithmic progress (NeurIPS 2024). You can read more about
  our work and mission on our website and in this Time
  profile.
