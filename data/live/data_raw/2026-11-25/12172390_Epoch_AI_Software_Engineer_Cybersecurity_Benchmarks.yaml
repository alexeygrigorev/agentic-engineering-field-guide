description: |
  Epoch AI is looking for a Software Engineer, Cybersecurity
  Benchmarks who will help us measure how capable frontier AI
  models are at cybersecurity, and keep those measurements
  safe to run. The role will involve building and owning
  cybersecurity benchmarks, securing our evaluation
  environments against AI escape, and using threat modelling
  to shape our evaluation strategy.

