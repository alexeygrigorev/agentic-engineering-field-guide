description: |
  About DataCamp

  Data and AI skills are critical for thriving today, and
  DataCamp is the platform that empowers everyone to learn
  them. We help individuals and Fortune 1000 companies close
  the data and AI skills gap through world-class learning,
  hands-on training, and a global community of expert
  instructors.

  In this role, you’ll combine AI skills, technical expertise,
  and passion for great didactic experiences to usher in the
  next generation of education.

  About the role

  This is an individual contributor role. You will collaborate
  with subject matter experts and leverage in-house-built
  cutting-edge AI tooling to scale high-quality course
  creation across AI engineering: building applications with
  large language models (LLMs), prompt and context
  engineering, retrieval-augmented generation (RAG), AI
  agents, and related topics such as evaluation, fine-tuning,
  guardrails, and LLMOps. Here's what your day-to-day will
  look like:

  - Manage the entire content development lifecycle and
    deadlines.
  - Source and recruit top-tier subject-matter experts as
    instructors.
  - Collaborate with instructors to create engaging content.
  - Consistently leverage AI tools like Claude Code, Cursor, and
    more to drive high-quality content production at scale.
  - Design, review, and create content on LLM application
    development, prompt and context engineering, RAG and
    vector databases, agents and tool use, evaluation,
    deployment, and monitoring of AI systems, and related
    topics. You will review content from a learner
    perspective, ensuring it is technically accurate, reflects
    current AI engineering best practices in a fast-moving
    field, and is pedagogically effective.
  - Continuously assess course performance using learner
    feedback and engagement data to drive improvements.
  - Identify and prioritize existing curriculum gaps or new
    topics in DataCamp's AI engineering curriculum.

  We’re excited about you because you have the following:

  - A solid hands-on background building and shipping production
    AI applications as an AI engineer, machine learning
    engineer, or software engineer. Experience taking LLM-
    powered systems from prototype to production (e.g.
    evaluation, monitoring, cost and latency optimization) is
    a strong plus.
  - Broad AI engineering fluency spanning LLM fundamentals,
    prompt and context engineering, RAG, agents, and
    evaluation, with additional depth in at least one area
    such as agentic systems, retrieval and search, fine-
    tuning, or LLMOps.
  - A solid technical background in Python, with comfort working
    with LLM APIs (e.g. OpenAI, Anthropic), open-source models
    and frameworks (e.g. Hugging Face, LangChain, LangGraph,
    LlamaIndex), agentic systems, vector databases, Git, and
    the command line.
  - Intuitive understanding of instructional design, with proven
    ability to structure and teach technical concepts clearly.
  - Graduate degree (Master's or PhD) in Computer Science, AI,
    Machine Learning, or a related STEM field—or equivalent
    industry experience.
  - Strong experience with agentic coding systems, including
    Claude Code, Cursor, Codex, or Replit. You consider
    yourself a sophisticated user of these tools.

  Bonus if you have the following:

  - A deep understanding of the DataCamp course format—you have
    an intuitive understanding of what makes a great DataCamp
    course.
  - An existing network of potential subject matter experts who
    can become DataCamp instructors.
  - An extensive track record of teaching AI engineering to
    technical audiences.
