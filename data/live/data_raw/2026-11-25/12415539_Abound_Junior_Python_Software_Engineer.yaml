description: |
  About Abound

  We’re redefining consumer lending in the UK, and beyond.
  Using advanced AI and Open Banking data, we make fair,
  affordable personal finance available to more people. While
  traditional lenders rely almost entirely on credit scores,
  we look at the full financial picture - how much you spend,
  and what you can afford to repay to build a deeper, more
  accurate understanding of each customer's unique financial
  situation.

  And we've shown it works at scale. We’ve issued over £1.3bn
  in loans directly to customers while delivering market-
  leading credit performance - for every 10 defaults the
  industry expects, we see only 3. We also reached
  profitability just 2.5 years after launch.

  Backed by £2bn+ of funding from top-tier investors including
  Citi, GSR Ventures, and Deutsche Bank, we’re recognised as
  one of Europe’s fastest-growing fintechs (Sifted, CNBC).
  Now, we’re expanding into new markets and product lines -
  and we’re looking for ambitious people who want to learn
  fast, take ownership, and grow with us.

  About the role

  We’re looking for a Junior Software Engineer to join our New
  Products & Geographies Engineering team in London. This team
  launches and scales new lending propositions in two
  directions: bringing Abound’s lending to customers in new
  countries and expanding our B2B offering for partners. We
  move quickly, exploring ideas through production-ready MVPs
  and iterating as products mature.

  This is a hybrid role, with at least three days a week in
  our London office. It’s a great opportunity for someone
  early in their career who wants to grow quickly, work on
  real production systems, and learn how a high-growth fintech
  operates from the inside.

  You’ll work alongside experienced engineers who will support
  you through code reviews, pairing, and mentorship. We value
  engineers who are curious about the business and are keen to
  work with stakeholders to improve processes and customer
  experience.

  Our technology stack

  Python (including FastAPI, OpenTelemetry, procrastinate,
  SQLAlchemy and Uvicorn), Postgres, MySQL, Liquibase, Retool,
  Docker and AWS.

  What you’ll be doing:

  - Build and maintain features in our backend services, which
    can span any part of the lending lifecycle – from finding
    and onboarding new customers, to helping underwriters
    assess affordability, through to paying out and collecting
    loans

  - Take part in the full software development lifecycle:
    contributing to designs, writing tests, reviewing code and
    helping with deployments

  - Write clean, well-tested Python, with guidance and feedback
    from senior engineers

  - Work with colleagues in Product and Design, as well as
    internal users, to understand requirements and turn them
    into working software

  - Work closely with our React frontend developers to build the
    APIs and backend logic their features rely on

  - Write and improve SQL queries against our Postgres databases

  - Help troubleshoot and resolve system issues that affect our
    customers

  - Gradually take ownership of parts of the platform as your
    experience grows

  Who you are:

  You’ll need:

  - 0–2 years of professional software engineering experience,
    or equivalent experience from a degree, bootcamp,
    internships or personal projects

  - Working knowledge of Python – you don’t need to be an
    expert, but you’re comfortable writing, testing and
    debugging code

  - An understanding of core programming concepts such as data
    structures, object-oriented design and unit testing

  - Familiarity with SQL, relational databases and Git

  - To be able to work from our London office at least three
    days a week

  You’ll do well here if you:

  - Have a sharp eye for detail – in lending, small mistakes can
    have a real impact on customers

  - Learn quickly, take initiative and work methodically through
    problems, even in a large, evolving codebase

  - Communicate clearly, ask questions, take on feedback and
    work well in a team

  - Have a genuine interest in fintech and how financial
    products work

  Ideally you'll also have:

  - Experience with async Python or frameworks such as FastAPI

  - Basic familiarity with cloud platforms (AWS, GCP or Azure)
    or Docker

  - Knowledge of lending products or open banking

  How we work:

  To be successful here, our culture needs to energies you.
  Here’s how we operate:

  - High bar and real ownership: We’re a high-performing team,
    and we hire people who raise the bar and take pride in
    great work. We own outcomes, not tasks.

  - Focus on impact: We measure success by what we deliver to
    customers. We prioritise carefully so our energy goes
    where it makes the biggest difference.

  - MVP and iteration culture: We ship fast, learn from real
    customers, and continuously improve our products and
    processes.
  - One team collaboration: We collaborate closely across
    engineering, product, operations and the wider business.

  - Thrive in change: Priorities evolve as we learn what works.
    We value people who use good judgement, adapt quickly, and
    stay focused on outcomes.

  What we offer:

  - Equity – everyone owns a piece of the company

  - Hybrid working, with three days a week in the office

  - 25 days’ holiday a year, plus 8 bank holidays

  - 2 paid volunteering days a year

  - A one-month paid sabbatical after 4 years

  - Employee loan

  - Free gym membership through WellHub

  - A team wellness budget to be active together – set up a yoga
    class, a tennis lesson or go bouldering
