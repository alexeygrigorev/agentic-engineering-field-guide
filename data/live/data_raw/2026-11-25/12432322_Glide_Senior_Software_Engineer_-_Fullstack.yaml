description: |
  👋 Welcome to Glide!



  Glide builds AI-powered account opening, lending, onboarding
  and back-office tools for credit unions and banks. Members
  open accounts and get loans funded in minutes, and our AI
  agents handle the follow-ups, documents and verifications
  that used to eat up staff time. More than 40 credit unions
  and banks run on Glide today, and we’re expanding into new
  lending products.

  We’re hiring a Senior Fullstack Engineer to own large parts
  of the platform end to end. You’ll join a small New York
  engineering team with experience from Stripe, Google and
  Amazon, and work directly with the founders, product, and
  the team that takes each institution live.



  What you’ll do

  - Own features end to end across our TypeScript stack: React
    and Next.js on the front end, Node and tRPC services, and
    MySQL underneath, all running on AWS.
  - Build and harden integrations with core banking systems and
    with vendors for identity verification, fraud checks,
    credit, payments and e-signature, so they stay reliable
    when those systems are slow or unpredictable.
  - Build AI agents and LLM-powered features for a regulated
    industry, with the guardrails, evaluation and audit trail
    that requires.
  - Design for a multi-tenant platform where each institution
    has its own configuration, products and compliance needs.
  - Help set technical direction through design reviews, code
    reviews and mentoring, and share ownership of how we ship
    and run in production.
  - Help shape how we build with AI. Agents write and review a
    lot of our code, and you’ll help evolve the specs, tests,
    review and CI that keep quality high.



  What we’re looking for

  - 5+ years building production web products, with deep
    experience in TypeScript, React and Node.
  - A track record of owning systems from design through launch
    and production support.
  - Strong backend fundamentals: data modeling, SQL, APIs, and
    integrating with third-party systems.
  - Care for security and correctness. We handle sensitive
    personal and financial data every day.
  - Fluency with AI coding tools. You work every day with agents
    that write and review code, know where they shine and
    where they need guardrails, and can design workflows and
    pipelines around them.
  - Clear communication with engineers and non-engineers alike.



  Nice to have

  - Experience in fintech, banking, lending or payments.
  - Early-stage startup or founding-engineer experience.
  - Experience with Next.js, tRPC, Drizzle, AWS or PlanetScale.
  - Production experience with LLM-powered features or agents.



  Our interview process

  - Intro call
  - Take-home exercise
  - Meet the engineering team
  - Final round with our CEO and CTO



  How we work

  We’re hybrid: three days a week together in our office by
  Madison Square Park in NYC.



  Perks and benefits💸 Competitive compensation

  A competitive salary and a generous equity package.



  ❤️ Wellbeing credits (US employees)

  Health, dental and vision insurance, plus a health and
  wellness stipend.



  🥗 Lunch on us (US employees)

  Free lunch for the whole team, every day.



  💻 Best tools

  A top-of-the-line computer and your pick of keyboard, mouse
  and accessories.
