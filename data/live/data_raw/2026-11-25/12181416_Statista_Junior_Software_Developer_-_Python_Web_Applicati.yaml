description: |
  At Statista, we’re all about facts and data, for we are the
  world's leading business data platform. By providing
  reliable and easy-to-use data as well as various data
  analytics products and services, we empower people worldwide
  to make fact-based decisions.

  Founded in Hamburg in 2007, we have quickly grown into a
  global company with offices in major cities such as London,
  New York, Berlin and Tokyo. And we still have a lot of
  plans. Our constant growth does not only prove our success,
  but also keeps creating new development and career
  opportunities for our employees.

  We value and celebrate our diverse culture. You are welcome
  here for who you are, no matter where you come from, what
  you look like, or whether you prefer bar graphs to pie
  charts. Your story matters – keep writing it as part of our
  team.

  Are you ready to join us?

  Your team This job is with Statista R, a vertical business
  unit of Statista.

  Statista R is a world leader in the creation of company,
  brand, and product rankings and top lists, based on
  comprehensive market research and data analysis: Statista R
  recognizes the best.

  With a team of over 100 expert analysts and in cooperation
  with more than 40 high profile media brands across all
  continents like Forbes, TIME Magazine and Newsweek, Statista
  R creates transparency for consumers and business decision
  makers and helps companies build trust and recognition
  across a plethora of industries and product categories. A
  team of over 50 licensing specialists based in New York,
  Hamburg, Tokyo, and Singapore offers the awarded companies
  meaningful and eye-catching opportunities to communicate
  their success via logos and other award related products.
  Visit rankings.statista.com for further information about
  Statista R and our rankings.

  Your Role

  - Design, build and maintain web applications for working with
    data as a core part of your role, mainly using Python
    frameworks such as Django and Streamlit
  - Work closely with our senior Data Engineer and other
    experienced data professionals who build our analytics
    products and pipelines, learn hands-on about our AWS cloud
    environment and ETL processes, and help build reliable
    data pipelines and PostgreSQL queries
  - Prepare, transform and validate data so our applications and
    analyses rest on a solid foundation
  - Create visualizations and insight reports that make findings
    clear and actionable, both to make our analyst team's
    processes more efficient and to produce strong client-
    facing materials
  - Work with teammates to turn analytical questions into usable
    features and workflows, and develop repeatable ways to
    build expertise and value for our stakeholders
  - Support projects based on large-scale, survey-based market
    research data, and help develop methods that complement
    our existing ranking products

  Your Profile

  - Solid hands-on skills in Python, gained through professional
    work, internships, research, or your own projects.
    Experience coding in R is advantageous
  - Experience building web applications with Django and/or
    Streamlit is a strong plus. Knowledge of PostgreSQL or
    another SQL database, and basic HTML, CSS or JavaScript,
    is also a plus
  - A basic understanding of cloud environments such as AWS and
    of ETL concepts, and the motivation to grow these skills
    alongside experienced colleagues
  - Hands-on experience working with data, including querying,
    cleaning, analyzing, visualizing and checking data quality
  - Clean coding habits that make teamwork easy, such as
    readable code and basic Git workflows
  - Enjoyment in building tools other people use, a
    collaborative way of working, and the curiosity to dig
    into unfamiliar problems

  What we offer

  In addition to our great team, culture, and our shared goal
  of empowering people with data, there are many other things
  that make Statista a great place to work! Join us and
  benefit from:

  - Work from abroad up to 30 calendar days a year
  - Hybrid work and flex-time
  - International team and social events
  - Subsidized urban mobility and access to fitness and wellness
    options
  - Free access to Langdock and all its amazing functionalities
  - Career & training opportunities
  - Attractive locations and modern offices
  - Mental health support with OpenUp

  Some of the benefits listed here apply only to the German
  entity and to Junior-level roles or above.
