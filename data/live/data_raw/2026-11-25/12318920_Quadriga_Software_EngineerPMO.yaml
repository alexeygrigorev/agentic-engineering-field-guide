description: |
  Company Description

  Quadriga is a leading international provider of guest
  technology managed services that enhances engagement,
  generates additional revenue, and fuels value for hotels
  through a continued focus on the global customer experience.
  Quadriga is part of the Exceptional Innovation (EI) family
  of companies and affiliates which benefits from the
  technology innovation driven by EI. The Group is constantly
  at the forefront of hospitality guest technology with its
  IQx platform and suite of integrated solutions for
  hoteliers.

  Job Description

  JOB DESCRIPTION

  Title:

  Software Engineer/Project Management Office

  Reports to:

  Director of Customer Delivery Europe

  Main purpose:

  The primary function of the role will be to track and report
  on the performance of all system and high value projects
  across EMEA and support the software packages related to the
  business

  Key responsibilities and accountabilities:



  ·         Develop the PMO function in conjunction with the
  Delivery Director and the Operations Director.

  ·         Implement process and programs to all regions.

  ·         Track all opportunities which are Closed as Won
  and generate the base project within the tracking system
  (Sales Force)

  ·         Work with The Delivery Director / Operations
  Director to identify and co-ordinate any project
  interdependencies.

  ·         Allocation of individual projects to the technical
  project managers

  ·         Collation and Preparation of the weekly/monthly
  governance reports to enable fact based decision making.

  ·         Maintain and track programme deliverables and
  milestones ensuring all changes are recorded and logged.
  Special attention to the moving of UAC dates.

  ·         Assist where appropriate with the mobilization of
  new projects and work streams within specific programs

  ·         Support the director with the day to day running
  of programs, including communications to the PM team and
  third party base.

  ·         Attend weekly planning meetings

  ·         Undertaking appropriate tasks as defined by the
  Director aligned to delivering on the Main Purpose of the
  role

  Competency / Performance Drivers/



  Technical Expertise

  ·         Qualified software engineer

  ·         A real and genuine enthusiasm for service, people
  and delivering customer excellence and high performance

  ·         Experience of project management methodology and
  terminology

  ·         Experience in maintaining programme documentation
  including project registers, action lists, etc

  ·         Proficient in the German language

  ·         Proficiency in Microsoft office

  ·         An appreciation of Microsoft Project

  ·         Attention to detail.

  ·         Good documentation skills

  ·         Good communicator

  ·         Able to work closely with peers and other business
  units



