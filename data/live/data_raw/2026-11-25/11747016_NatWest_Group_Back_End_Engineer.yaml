description: |
  Join us as a Back End Engineer

  - You’ll work alongside a collaborative team building new,
    resilient financial technology products that deliver
    tangible impact for small business owners.
  - In this role, you’ll deepen your backend expertise, mentor
    team members, and help steer our engineering practices as
    our platform scales.
  - Hone your existing software engineering skills and advance
    your career in this critical role.

  What you'll do

  You’ll join one of the core cross-functional mission teams
  to build and develop Mettle. We will look to you to develop
  clean, elegant and reusable code that is well-tested and
  easy to maintain and extend.

  You’ll also:

  - Work with stakeholders across the business to drive the
    direction of Mettle Engineering and put the long-term
    interests of customers at the heart of key decisions
  - Collaborate across our backend chapter to uphold standards,
    best practices and to promote innovation
  - Work collaboratively with the team to resolve technical
    issues
  - Support and oversee junior engineers and act as a subject
    matter expert

  The skills you'll need

  You’ll need 5+ years of experience in Software Engineering,
  with 3+ years in Core Java. Experience of working in Hybrid
  teams will be beneficial.

  You’ll also need experience of:

  - Container technologies (Kubernetes / Docker)
  - Cloud Computing (in particular AWS)
  - Working with message-driven architectures / Kafka / event
    sourcing
  - Translating business objectives into architectural designs

  Hours

  35

