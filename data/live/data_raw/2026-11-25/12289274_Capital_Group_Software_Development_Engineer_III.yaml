  Discover your potential. Build your legacy.

  Go the distance with Capital Group

  At Capital Group, we go the distance — for our people, our
  clients, and each other. As a global, privately held firm
  with more than 95 years of history, we believe meaningful
  careers, like meaningful investing, are built over the long
  term. That’s why we invest in our associates with the same
  conviction we bring to our clients — through career growth,
  purpose-driven work, whole-person wellness, and rewards that
  recognize your contributions. Here, you’ll find the
  opportunity, global scale and support to unlock your
  potential and build a career that lasts.

  The Role

  As a Senior Software Engineer, you’ll partner with business
  partners and product managers to turn ambiguous problems
  into reliable production software, with a particular focus
  on AI-enabled solutions that improve our investment process
  and business outcomes. You’ll lead technical discovery,
  shape architecture, write and review code, and own systems
  in production. This hands-on role combines strong software
  engineering foundations with modern AI engineering, from
  retrieval and evaluation to secure, observable agentic
  workflows. Your work will help establish responsible
  engineering standards and reusable patterns that support
  dependable, long-term outcomes across the firm.

  The Team

  You’ll join an engineering team building AI-enabled software
  for the investment process. You’ll work closely with
  business partners, product managers, platform and
  engineering teams, and colleagues in information security,
  data governance, risk, and compliance. Together, the team
  turns high-value opportunities into secure, reliable
  production services and establishes practical standards that
  help the firm deliver AI solutions consistently and
  responsibly.

  Your Impact

  - Partner with business partners and product managers to
    understand workflows, identify high-value opportunities,
    and turn ambiguous needs into clear technical
    specifications.

  - Design, build, test, deploy, and operate maintainable
    software and AI applications with the reliability,
    performance, security, and scalability required for
    production.

  - Architect retrieval and grounding systems across document
    ingestion, chunking, embeddings, vector and hybrid search,
    context management, prompts, and enterprise data
    integrations.

  - Build agentic workflows that execute multi-step tasks within
    explicit, auditable boundaries, using guardrails and human
    oversight to keep behavior safe and predictable.

  - Define acceptance criteria and evaluation harnesses that
    measure quality, latency, failure modes, and hallucination
    risk, catching regressions before release.

  - Own systems from discovery through rollout and operations,
    using observability, cost monitoring, auditability,
    documentation, and runbooks to diagnose and improve
    performance.

  - Embed security, privacy, data protection, identity and
    access controls, encryption, secrets management, and audit
    logging in partnership with governance and control teams.

  - Set technical direction, communicate architecture trade-
    offs, and codify successful approaches into reusable
    components, patterns, tools, and playbooks for other
    teams.

  What You’ll Bring

  - 10+ years of professional software engineering experience,
    with strong proficiency in Python, Java, C#, or a
    comparable modern programming language.

  - Demonstrable hands-on depth contributing production code,
    leading technical design, reviewing architecture
    constructively, and owning complex systems through
    production.

  - Strong foundations in APIs, system design, data stores,
    distributed systems, cloud-native development, automated
    testing, CI/CD, observability, debugging, and production
    operations.

  - Hands-on experience shipping AI or LLM-powered applications
    for real business problems, including context and prompt
    engineering, retrieval, tool use, agents, and evaluation.

  - Practical experience with document ingestion, chunking,
    embeddings, vector or hybrid search, retrieval strategies,
    and structured and unstructured enterprise data.

  - A disciplined approach to deterministic and non-
    deterministic testing, including acceptance criteria,
    automated evaluation harnesses, guardrails, and regression
    detection.

  - Experience integrating enterprise systems, data platforms,
    and APIs while implementing authentication, authorization,
    identity and access management, secrets, encryption, audit
    logging, and data-governance controls.

  - Strong technical leadership, communication, systems
    thinking, and collaborative judgment, plus a bachelor’s
    degree in Computer Science, Engineering, or a related
    field, or equivalent practical experience.

  Preferred

  - Experience in financial services or another highly regulated
    enterprise environment.

  - Experience with AWS, Azure AI, Databricks, or comparable
    public-cloud, data, and AI platforms, including cloud-
    native architecture and deployment patterns.

  - Experience with vector databases, vector and hybrid search,
    model platforms, agent orchestration, and protocols such
    as Model Context Protocol.

  - Experience with MLOps or LLMOps, including model and prompt
    versioning, experiment tracking, evaluation,
    observability, monitoring, and CI/CD for AI systems.

  - Experience implementing responsible-AI controls, working
    across full-stack applications, mentoring engineers, and
    influencing technical standards across teams.

  What You’ll Get

  When you go the distance for our clients, we go the distance
  for you. You’ll grow through mentoring, leadership programs,
  and tuition reimbursement, and do work that matters at a
  firm managing $3T+ in AUM for millions of investors
  worldwide. We invest in your whole life too — comprehensive
  wellness and mental health support, family-first benefits,
  competitive pay with performance and profitability bonuses,
  and a company-funded retirement plan. And as a privately
  held firm built for the long term, we offer the opportunity
  and support to build a career that lasts.

  Ready to apply? Visit careers.capitalgroup.com.

