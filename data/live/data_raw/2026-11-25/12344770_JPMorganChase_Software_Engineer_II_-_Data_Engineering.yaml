description: |
  We have an exciting opportunity for you to advance your
  career in data engineering, analytics, and technology
  delivery.

  As a Data Engineer at JPMorganChase within Commercial &
  Investment Bank, you will help build and modernize data and
  analytics capabilities. You will work across engineering,
  analytics, and business teams to integrate data, deliver
  trusted insights, and create intuitive experiences—including
  dashboards, reports, and conversational analytics—while
  supporting secure, controlled access to data.

  Job responsibilities

  - Design, build, and maintain scalable data ingestion
    pipelines across multiple source systems and formats,
    using batch and, where appropriate, incremental or event-
    driven processes and data-sharing patterns such as Delta
    Sharing and Fusion Sharing.
  - Implement data validation, quality checks, lineage,
    monitoring, and error handling; partner with source-system
    owners and platform teams to resolve data-access,
    integration, and operational issues.
  - Transform and aggregate data; implement complex business
    logic, calculations, and reconciliations; investigate
    discrepancies and establish controls to improve accuracy
    and consistency.
  - Partner with business and analytics stakeholders to define
    metrics, calculation rules, and acceptance criteria, and
    build performant, accessible dashboards, reports, and
    front-end components based on user needs.
  - Contribute to conversational analytics and chatbots
    connected to approved data sources; support authorization
    controls, output validation, testing, monitoring, and
    error escalation. Support localization and AU/Glass
    migration and refactoring, maintaining data integrity and
    documenting decisions, dependencies, risks, and
    operational requirements.



  Required qualifications, capabilities, and skills

  - Experience in data engineering, analytics engineering,
    business intelligence development, or a related technology
    role, including hands-on experience building pipelines and
    integrating multiple data sources.
  - Expertise in Flink, Databricks, Power BI, UI development,
    and AI. Builds reliable data pipelines, complex analytics,
    reconciliations, dashboards, and conversational tools,
    while supporting data-sharing, localisation, and data
    migrations.
  - Strong SQL skills and experience with data modeling,
    aggregation, transformation, complex business logic, data-
    quality controls, and reconciliation.
  - Experience developing dashboards or reports using a BI
    platform, plus front-end development experience building
    or maintaining user-facing data applications.
  - Experience with Delta Sharing, Fusion Sharing, or comparable
    technologies; document repositories and structured and
    unstructured data; cloud data platforms, orchestration,
    version control, automated testing, and CI/CD; and
    exposure to governance, access controls, lineage,
    auditability, APIs, secure integration, conversational
    analytics, localization, or platform migrations.
  - Strong problem-solving and attention to detail, with the
    ability to investigate data issues, translate business
    requirements into technical deliverables, and communicate
    and document solutions for technical and non-technical
    audiences.



  Preferred qualifications, capabilities, and skills

  - Experience with multiple data-sharing, integration, or
    orchestration patterns, and familiarity with front-end
    usability and accessibility, or conversational analytics
    testing, monitoring, and controlled-access design.



  What success looks like

  - Reliable, monitored pipelines make approved data available;
    analytics outputs are trusted and reconciled; dashboards
    are performant and usable; conversational analytics
    respects access controls; and migrations are delivered
    with appropriate testing, documentation, and operational
    readiness.

