description: |
  About Starbridge

  We're building the front door for how businesses partner
  with government in America.

  Public agencies spend roughly a trillion dollars a year with
  private companies, and nearly all of it still moves through
  infrastructure that hasn't changed in decades. Starbridge is
  building the full operating system for that relationship:
  the data, the signals, the workflows, and the rails that let
  a company find a public buyer, win the work, and get paid.

  We monitor 320,000+ public sector entities around the clock.
  500+ customers have joined us since our launch in March.
  We've raised $50M from top investors including Craft and
  Michael Seibel of Y Combinator.

  About the role

  Starbridge Federal is a small team inside Starbridge focused
  on companies selling to the federal government. We're hiring
  a software engineer to build and own our federal product and
  to bring what works there into the core Starbridge platform.

  This is a small team with tons of ownership. You'll work
  directly with the founders and the engineering lead on what
  to build, then take it from idea to production yourself.
  There's no layer of PMs or tickets between you and the
  problem: you'll talk to users, make the technical calls,
  ship, and keep improving what you shipped.

  Our stack is React and TypeScript on the frontend and Python
  on the backend. We're particularly interested in someone who
  enjoys working with AI tools and building agents and
  automations into their own workflow.

  What you’ll do:

  - Own Starbridge Federal end to end. Build new features across
    the frontend and backend, maintain and improve what's
    already there, and keep it fast and reliable in
    production.
  - Build with AI. Work on semantic search, search
    infrastructure, and AI-driven workflows that help
    companies find and win federal opportunities.
  - Work directly with founders. Shape the product roadmap with
    leadership and customers, not just implement a spec.
  - Raise the bar. Make sound technical decisions, write
    maintainable code with meaningful tests, and help set
    engineering practices for a small team.

  What you bring:

  - 1–5 years of experience as a software engineer shipping
    production code, with a track record of fast growth.
  - Strong Python and React/TypeScript. You're comfortable
    across the full stack and can own a feature from database
    to UI.
  - Solid fundamentals. Data structures, concurrency, databases,
    and system design, including how to scale a system and
    handle failures.
  - Ownership. You've owned something meaningful end to end and
    want more of that, not less.
  - Startup experience, or a clear appetite for a fast-moving,
    small-team environment.
  - Curiosity about AI and automation. You use AI tools and
    agents to move faster and enjoy experimenting with new
    ones.
  - Based in or willing to relocate to NYC and work from our
    office.
  - U.S. citizenship is required, as this role will have access
    to our federal environment.

  Bonus if you have:

  - Experience with search, LLMs, or data-heavy products.
  - Experience with government data, GovTech, or regulated
    industries.
  - Experience with GCP or AWS.

  Interview process

  We move fast — really fast. Getting back to someone today
  beats tomorrow, and our interview process reflects that
  mindset. Please keep us posted on your timeline so we can
  move quickly and speed things up where needed.

  - A 15-minute intro chat with the hiring manager.
  - A 30-minute programming exercise.
  - A 1-hour pair programming session on a real codebase: fixing
    bugs and adding a feature.
  - An onsite in our NYC office, where you'll build a small
    feature end to end with the team and meet our founders.

  How we work

  - Build Bridges to Help Customers Win - We pride ourselves on
    being obsessively customer-centric.
  - Shooting Star Speed - We move with extreme speed. We value
    momentum, decisiveness, and the ability to accelerate when
    it matters.
  - Fun Is a Feature - We intentionally design Starbridge to be
    an energizing place to do hard work. Joy, humor, and
    camaraderie make great teams faster, sharper, and more
    resilient.
  - In the Arena - We believe the best ideas come from living
    close to the work, feeling the friction, hearing the
    nuance, and experiencing the details firsthand.

  Benefits include

  - Competitive salary + early-stage equity
  - Comprehensive medical, dental, and vision insurance
  - Company-provided lunch in the office every day
  - Gym stipend
  - Pre-tax commuter benefits
  - Unlimited PTO
  - Regular offsites (NYC + global locations)
