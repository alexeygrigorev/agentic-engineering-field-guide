description: |
  OUR ORIGIN STORY 🎂

  In 2011 SkySlope started as an idea born at the kitchen
  table of our CEO, with just him and two others.
  Headquartered in Sacramento, California, we have since grown
  out of our previous 3 offices and many of our close to 150
  employees are spread all across the United States. Those 150
  employees support close to 300,000 users across 5,000
  offices nationwide and now in Canada as well. Included in
  that is 8 out of the 15 largest Real Estate Brokerages in
  the nation.

  But, despite being happy with what we’ve achieved we know
  that as industry leaders in our space there’s a lot of work
  left to be done. All of the growth and success that has
  happened is a result of us obsessing over building cutting
  edge software that makes the Real Estate world a better
  place. We know this only happens by hiring people who don’t
  just come up with out of the box ideas but hiring people who
  actually see those ideas through and bring them to life. As
  we’ve grown, we’ve been fortunate enough to hire plenty of
  people who possess that quality and realize it’s equally
  important to hire people who can pair that skill with
  empathy, collaboration, and a keen sense of urgency. If
  you’re looking to join a company where you can have real
  impact and surround yourself with an incredible team of
  people then look no further.



  SKYSLOPE’S CORE VALUES 💪🏻

  These are the principles that helped us get to where we are
  and they are the principles that will guide us to where we
  want to go in the future. You can apply them to your
  professional life, your personal life, to any business and
  any situation. In no specific hierarchy, our core values
  are:

  Awareness | Execution | Obsession | Ownership | Humility |
  Radical Candor | Urgency | Greatness | Inches I Fun

  Learn more about our core values from our CEO, Tyler Smith
  here!



  Purpose: The purpose of the Security Engineering Manager is
  to build and lead SkySlope's dedicated security engineering
  team in pursuit of making life better for every real estate
  agent, broker and service provider. This is a player-coach
  role: they will design the security engineering program, own
  its execution, hire and grow the team that delivers it, and
  stay hands-on in the technical work throughout. SkySlope is
  making a significant, sustained investment in security
  engineering, and this role is the foundation of that
  investment.

  Why This Role: This is a genuine greenfield leadership
  opportunity. You are not inheriting someone else's program,
  tooling decisions, or org chart. You will design the
  program, pick the tools, hire the team, and set the
  standards, with direct executive sponsorship and a Director
  of Engineering who currently leads the security function and
  is invested in your success. SkySlope is also an
  aggressively pro-AI engineering organization: we treat AI as
  a security force multiplier for review, triage, and
  detection engineering, operating within guardrails you will
  help define. If you want to build a modern security program
  from first principles, with AI in the toolbox rather than on
  the threat slide, this is that role.

