description: |
  Pomelo Care is the leading virtual medical practice for
  women and children, providing care across pregnancy,
  postpartum, pediatrics, menopause, and perimenopause. We
  combine proactive, 24/7 clinical care with technology that
  helps us reach patients earlier, identify risks sooner, and
  deliver personalized care throughout their journey. Our team
  includes clinicians, technologists, operators, and problem-
  solvers working together to make high-quality care more
  accessible for families nationwide.

  About The Role

  Your North Star: You'll serve as the technical lead for how
  patients interact with Pomelo from the moment they enroll
  through their entire care journey.

  We can only meaningfully improve health outcomes if patients
  are highly engaged in their care and trust our team. The
  earlier we start providing care, the more likely we can
  affect outcomes, which puts this role at the very center of
  our mission. You will focus on driving proactive patient
  engagement, personalizing care experiences to individual
  needs to move health outcomes, building habits that make
  Pomelo the first point of contact during pregnancy, and
  creating scalable engagement models that don't always
  require direct clinical intervention.

  You’ll bring this focus to life by shaping the end-to-end
  patient experience—building features that check in with
  patients throughout their journey, triage urgent needs, make
  high-quality care effortless, and ensure every patient feels
  deeply supported.

  This role reports to the Director of Engineering and is open
  to any candidates located in the continental US.

  What you'll do

  - Lead the technical direction for our mobile development
    strategy and patient-facing apps, shaping how tens of
    thousands of patients experience Pomelo
  - Rapidly prototype and ship features in our patient mobile
    and web apps alongside design and product, using AI tools
    to move fast and test ideas that meaningfully improve
    engagement and retention
  - Help steer product direction for how we support and retain
    patients in their critical first month with Pomelo, when
    the window to affect outcomes is widest
  - Talk directly to patients and partner with product, design,
    and clinical teams to turn real needs into real features
  - Mentor and grow junior engineers, raising the bar for the
    whole team
  - Set the technical standards, architecture patterns, and
    development practices that our patient-facing products are
    built on

  Who you are

  - 6+ years of experience building and shipping consumer or
    patient-facing products
  - Have served as a technical lead on a team, setting
    architecture direction and mentoring other engineers
  - Comfortable working across the full stack and moving quickly
    in a startup environment
  - Up to date with key with trends in LLM coding agents to
    multiply your engineering impact
  - Enjoy collaborating closely with product and design, not
    just executing on specs
  - Experience with React Native or cross-platform mobile
    frameworks
  - Built products in healthcare, wellness, or other high-trust
    consumer domains
  - Have worked on engagement, retention, or onboarding flows
    and understand what makes users stick around
  - Experience with AI/ML or building agent-based systems

  Our Tech Stack

  We build in a single Bazel monorepo: Kotlin and Python gRPC
  services on Google Cloud, TypeScript/React on the web, React
  Native on mobile, Spanner and BigQuery for data with dbt and
  Dagster in the pipeline, and Terraform for infrastructure.



  Compensation

  The expected base salary range offered for this role is
  $220,000 - $260,000. This role is also eligible for equity,
  giving you an ownership stake in Pomelo’s mission. Actual
  compensation may vary based on relevant experience, skills,
  competencies, and certifications.



  Why You Should Join Our Team

  By joining Pomelo, you’ll get in on the ground floor of a
  fast-moving, well-funded startup on a mission to improve
  outcomes for all mothers and babies. We cultivate a
  collaborative, patient-first environment where data drives
  our decisions and team members are challenged to learn,
  grow, and have fun together.

  Benefits and Perks:

  - Comprehensive Health, Dental, and Vision coverage for
    employees and their families
  - High deductible Health Plans with Health Savings Account
    (HSA) options
  - Flexible Spending Account (FSA)
  - Equity grant participation
  - 401(k) program
  - Competitive vacation policy
  - 16 weeks paid parental leave
  - Fully remote work flexibility (within the US) with offices
    in NYC and SF for those who prefer in person work

  We are committed to hiring the best team to improve outcomes
  for all mothers and babies. To solve the complex challenges
  facing the diverse population we serve, we need diverse
  perspectives, actively welcoming people of all races, ages,
  sexual orientations, gender identities and expressions,
  national origins, religions, disabilities, and veteran
  statuses. We strive to cultivate an inclusive and respectful
  environment where team members thrive by working across
  disciplines, moving fast, making data driven decisions,
  learning continuously, and always putting the patient first.

  By submitting your application you are acknowledging we are
  using your personal data as outlined in the Privacy Notice
  for Employees and Candidates.
