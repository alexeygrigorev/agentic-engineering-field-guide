description: |
  ABOUT QUINCE

  Quince is a destination for builders, creators, innovators,
  and operators who want to come together and challenge the
  status quo. Our mission is simple: make really high quality
  essentials for really low prices, fairly and sustainably. We
  deliver on that mission through a unique manufacturer-to-
  consumer (M2C) model eliminating the layers of traditional
  retail that add cost and result in consumers paying more
  than they need to. We find, build relationships with, and
  work directly with the manufacturing partners behind some of
  the world’s finest products. From there, our teams design
  smart, efficient operational processes  and build and deploy
  proprietary technology, AI, and analytics to help us scale
  fast.

  What began with a small assortment of elevated basics has
  quickly grown into a cross-category brand spanning apparel,
  accessories, home goods, and more. Today, tens of millions
  of people across a growing number of countries come – and
  return – to Quince because they trust us to deliver.

  OUR CULTURE

  Quince is a culture built for builders by builders. Our way
  of working starts with a blank sheet of paper. We question
  conventional thinking, use technology and data to uncover
  new opportunities, and move quickly to turn ideas into
  reality. We aren’t interested in replicating how others do
  retail. We’re building a better way – at a speed and scale
  unlike anything that’s been done before.

  - We dream big and chase the hard problems others shy away
    from. Rejecting long-held assumptions is part of our
    company's DNA.  Where conventional wisdom says you have to
    choose – soft or durable, speed or rigor, quality or price
    – we ask why that trade-off has to exist in the first
    place.
  - Our pace is fast and the bar is high because our customers
    expect a lot from us and we refuse to let them down. We
    believe the best results come from challenging ourselves,
    learning from one another, and building on each other's
    strengths.
  - Here, responsibility is not determined by role, tenure, or
    seniority. Every team member - no matter their level - has
    the opportunity to drive our business and shape our
    trajectory.

  If you’re someone who likes to imagine new possibilities and
  build better systems rather than plug-in to outdated ones,
  Quince is the place for you.

  THE ROLE

  Staff Software Development Engineer in Test (SDET)

  We are seeking a highly experienced Staff SDET to join our
  growing Quality Engineering team. This is a senior technical
  leadership role focused on designing scalable automation,
  improving system testability, and setting engineering-wide
  quality practices. You will combine strong software
  development skills with deep testing expertise to build
  frameworks, tools, and infrastructure that help engineering
  teams deliver reliable, high-quality software at scale. In
  this role, you will define the SDET and automation strategy
  across multiple products and teams, influence architecture
  decisions from a quality perspective, and reduce dependence
  on manual regression. Responsibilities:

  - Define and drive the SDET and test automation strategy
    across multiple products and engineering teams.
  - Architect, build, and maintain scalable automation
    frameworks for UI (app and web), API, integration, end-to-
    end, and service-level testing.
  - Develop production-quality test code in Java, Python,
    JavaScript/TypeScript, or C#, and build reusable
    libraries, utilities, test-data frameworks, and
    infrastructure.
  - Design automated testing solutions for microservices, APIs,
    distributed systems, and mobile and web applications.
  - Integrate automated test suites with CI/CD pipelines,
    establish effective quality gates, and improve execution
    speed, reliability, parallelization, and maintainability.
  - Identify and eliminate flaky tests, and build solutions for
    test-data generation, environment management, mocking,
    service virtualization, and dependency management.
  - Partner with software engineers and architects during system
    design to improve testability, reliability, scalability,
    and observability.
  - Implement shift-left and continuous testing practices across
    the software development lifecycle.
  - Define and monitor engineering quality metrics, including
    automation coverage, defect leakage, flaky-test rates,
    execution time, and release quality.
  - Perform deep debugging and root-cause analysis of complex
    failures across application, API, database, and
    infrastructure layers.
  - Evaluate and introduce new automation tools, frameworks, and
    engineering practices, and lead technical design reviews.
  - Mentor SDETs and software engineers on automation
    architecture, coding standards, and testing best
    practices, and drive cross-team initiatives that improve
    engineering quality and developer productivity.

  Qualifications Required:

  - 8+ years of experience in SDET, software engineering, test
    automation, or quality engineering roles
  - Strong software development skills in at least one language
    such as Java, Python, JavaScript/TypeScript, or C#, with a
    solid grasp of object-oriented programming, data
    structures, algorithms, and software design principles
  - Proven experience designing automation frameworks from the
    ground up
  - Hands-on experience with tools such as Playwright, Selenium,
    Cypress, Appium, REST Assured, PyTest, TestNG, JUnit, or
    equivalent
  - Strong experience with REST APIs, microservices, and backend
    or service-level automation
  - Experience with SQL-based database validation and with
    testing complex distributed and asynchronous systems
  - Experience integrating automated tests into CI/CD platforms
    such as Jenkins, GitHub Actions, GitLab CI, or Azure
    DevOps, and proficiency with Git
  - Strong debugging, troubleshooting, and root-cause analysis
    skills, along with a solid understanding of software
    architecture, design patterns, and testing methodologies
  - Demonstrated ability to influence engineering practices
    across multiple teams
  - Excellent communication, technical leadership, and
    collaboration skills

  Preferred:

  - Experience with AWS, Azure, or GCP, and with Docker and
    Kubernetes
  - Experience with performance testing tools such as k6,
    JMeter, Gatling, or Locust
  - Knowledge of event-driven technologies such as Kafka or
    RabbitMQ, and experience with contract testing tools such
    as Pact
  - Experience with observability platforms such as Datadog,
    Grafana, or Splunk
  - Understanding of security testing and application security
    fundamentals
  - Experience with large-scale SaaS, cloud-native, or
    enterprise platforms
  - Experience building internal developer or test productivity
    tools
  - Exposure to AI-assisted test generation or AI-based quality
    engineering tools

  Pay Range: $193,000 - $223,000

