description: |
  About Us

  In 2019, the founders were working as engineers solving
  complex cross-domain problems within government
  organisations.

  TwinStream was formed to bring together their collective
  expertise and experience into a single business, focused on
  delivering technical excellence and high-quality service to
  clients.

  Since then, the company has grown to over 100 team members
  across the UK, with colleagues working both on-site with
  clients, hybrid and remotely from home.

  Details:

  Salary: £70,000 - £90,000

  Location: Remote, with potential travel to the Bristol
  office in the future.

  Security: BPSS

  About the role:

  TwinStream software engineers (Java) develop components of a
  cross-domain security system within an agile development
  team. They are involved in the entire software development
  lifecycle, which includes understanding the need for change,
  software design, coding, testing, delivery, and support. A
  TwinStream software engineer is not just a coder; they
  comprehend the business and domain challenges and utilize
  their technical skills to address those issues.



  Responsibilities:

  - Understand high-level requirements and collaborate to find
    solutions

  - Investigate technologies to gain a deep understanding of
    their applicability

  - Develop high-quality code

  - Problem-solving deeply technical issues

  - Build tests at all stages of development from, unit tests to
    acceptance & performance tests

  - Build deployment code and pipelines, consulting with DevOps
    specialists

  - Analyse and resolve issues from 3rd line support

  - Collaborate in code development and review colleagues’ work

  - Participate in indicative estimating & planning

  - Any other reasonable duties relevant to skills and
    experience.



  Key Skills

  - Experience in developing software using our core and/or
    related technologies

  - An agile development mindset

  - Experience in agile working practices including

  - TDD

  - BDD

  - Continuous delivery

  - DevOps

  - Pair programming

  - Estimating & Planning

  - Open, honest & positive attitude



  Core Technologies

  Java is the primary development language. Some exposure to
  other languages is useful, including Python, JavaScript,
  Golang, Bash Scripting, although these languages are used
  only occasionally.

  The following technologies are used extensively in our
  solutions:

  - Java

  - Spring Boot

  - AWS – S3, Fargate, Lambda, SQS / SNS

  - RDBMS (Postgres, Oracle) & JPA

  - Mongo DB

  - DynamoDB

  - REST

  - Rabbit MQ

  - Docker

  - Linux

  - Terraform

  - Ansible

  - Jenkins

  - GIT/Bitbucket

  - GitLab

  - Kubernetes



  Desirable Skills

  - OpenShift

  - Docker Compose/Swarm

  - Terraform

  - Ansible

  - Python

  AI & Innovation

  We're looking for people who are curious about emerging
  technologies, open to using AI tools and eager to use AI
  tools to work smarter, solve problems and improve
  efficiency.

  Experience using AI-powered tools in your day-to-day work is
  welcomed, but equally important is a willingness to learn,
  adapt and explore new ways of working.

  Given the nature of our work, a strong understanding of
  responsible AI use, data security and confidentiality is
  essential.

  Diversity & Inclusion

  We’re committed to building a diverse and inclusive
  workplace. We welcome applications from people of all
  backgrounds, experiences, and identities.

  If you need any adjustments during the recruitment process,
  please let us know. We’re here to support you

  Further Information

  Due to the nature of the work and the sectors we support,
  any offer of employment will be subject to the successful
  completion of the relevant security screening and clearance
  process.

  This role requires eligibility for [BPSS / SC / DV]
  clearance. As part of the vetting process, candidates must
  meet the UK Government's residency and right-to-work
  requirements associated with the required level of
  clearance.
