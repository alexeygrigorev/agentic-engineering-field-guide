description: |
  Senior Backend Engineer - Ledger Platform

  Hybrid in London, UK

  We’re looking for a Senior Backend Engineer to join the
  Ledger Platform team.

  You'll design and build iwoca's new ledger platform – the
  distributed system that records every movement of money,
  starting with the business credit card and moving on to
  loans.

  The company

  Small businesses move fast. Opportunities often don’t wait,
  and cash flow pressures can appear overnight. To keep going,
  and growing, SMEs need finance that’s as flexible and
  responsive as they are.

  That's why we built iwoca. Our smart technology, data
  science and five-star customer service ensures business
  owners can act with the speed, confidence and control they
  need, exactly when it's needed.

  We’ve already cleared the way for 100,000 businesses with
  more than £4 billion in funding. Our passionate team is
  driven to help even more SMEs succeed, through access to
  better finance and other services that make running a
  business easier. Our ultimate mission is to support one
  million SMEs in their defining moments, creating lasting
  impact for the communities and economies they drive.

  The team

  The Ledger Platform team is rebuilding all of iwoca’s
  ledgers as one platform, starting with the ledger for the
  business credit card. Every card payment, loan repayment,
  and payout will end up there. Finance, Accounting, and
  Capital Markets rely on that record, so it has to be right
  every time.

  The team is small – a principal engineer who leads it, a
  staff engineer, another engineer, and you. It works closely
  with the product teams that build on its ledgers, and with
  Finance.

  The role

  You'll lead projects from design to production, and decide
  with product what the team builds and how. With the
  principal engineer, you'll design the platform's service
  boundaries and the APIs and event streams other teams build
  on. Most of the platform is still to be built, and you’ll
  own part of it yourself. It’s a hands-on individual
  contributor role with high ownership and no line management.

  Every payment a small business makes with iwoca crosses
  several services and network hops before it reaches the
  ledger, and any of them can fail. You'll build services that
  record each one exactly once, with no single point of
  failure, safe timeouts and retries, and graceful degradation
  when a dependency is down. When something breaks in
  production, you'll fix it so it doesn't break again.

  You’ll learn iwoca’s financial products in depth, so you can
  challenge requirements and explain technical trade-offs to
  Finance. When the answer isn’t obvious, you’ll scope and
  prototype, and use domain modelling to find the simple
  design behind a complicated problem. You’ll influence which
  parts of a problem need solving now, which can wait, and
  which aren’t worth solving at all.

  Live project examples:

  - New ledgers. Building the ledgers for Flexi-Loan and
    iwocaPay.
  - Account migration. Moving existing loan accounts onto the
    new ledgers with zero downtime and no data lost.
  - Credit card ledger. Building new features for the credit
    card ledger, from real-time card holds to daily interest
    and monthly statements.
  - Reconciliation and journals. Reconciling the ledger with
    banks, payment providers, and the card scheme, and
    producing the accounting journals Finance relies on.
  - Funding facilities. Recording how loans move between iwoca’s
    funding facilities.

  The requirements

  Essential:

  - Distributed systems. You’ve built and run fault-tolerant
    services in production, and handled the hard parts:
    durable communication between services, idempotency,
    transactional correctness, and partial failure.
  - Backend engineering. You have deep expertise in at least one
    object-oriented language. You’ve written and run backend
    services in it.
  - Databases. You’ve worked in depth with relational databases,
    ideally PostgreSQL, and solved data integrity,
    concurrency, and performance problems in them.
  - Ownership. You’ve led projects involving several engineers
    end to end, and mentored the people around you.
  - Testing. You’ve tested for edge cases and failures as
    carefully as you designed for them.
  - AI leverage. You’ve built agentic workflows, or used AI to
    scale your engineering output beyond what you could
    deliver alone, at work or in your own projects. You judge
    when to use it and when not to, and you check its output
    before it reaches production.
  - Communication. You write and speak clearly, directly, and
    concisely. You adapt technical detail to your audience.

  Bonus:

  - Financial systems. You’ve built ledgers, billing, or payment
    systems, including the audit trails and reconciliation
    that prove they’re correct.
  - High volume. You’ve worked at a company where the volume of
    data or transactions shaped how you designed systems.
  - Migrations. You’ve moved live systems and data onto a new
    platform with zero downtime.
  - Python. You’ve used Python in production, with a web
    framework such as Django, FastAPI, or Flask. It’s the
    language the team works in.
  - Data tooling. You’ve built pipelines with Snowflake and dbt,
    or similar, that turn ledger data into reports for
    Finance.
  - Messaging. You’ve built asynchronous messaging with queues
    or topics, such as Kafka.

  The salary

  We expect to pay from £100,000 to £120,000 for this role.
  But, we're open-minded, so definitely include your salary
  goals with your application. We routinely benchmark salaries
  against market rates, and run quarterly performance and
  salary reviews.

  The culture

  At iwoca, the best idea wins. We model our culture on
  independent thinking, challenging untested logic, and
  evidence-based decisions. We prioritise learning and growth,
  and give people the autonomy to develop in the direction
  that makes them most effective.

  We're a tech company and believe in the power of AI to help
  us work faster and better. We provide the infrastructure
  where every iwocan always has access to the best models and
  where those models have access to all of our data. We will
  help our people to learn how to use and grow with the new
  tools available to them.

  The offices

  We put a lot of effort into making iwoca a great place to
  work:

  - Offices in London, Leeds, Berlin, and Frankfurt with plenty
    of drinks and snacks.
  - Events and community-led groups, including running groups,
    padel, and monthly ping-pong and pool competitions.

  The benefits

  - Flexible working hours.
  - Medical insurance from Vitality, including discounted gym
    membership.
  - A private GP service (separate from Vitality) for you, your
    partner, and your dependents.
  - 25 days’ holiday per year, an extra day off for your
    birthday, the option to buy or sell an additional five
    days of annual leave, and unlimited unpaid leave.
  - A one-month, fully paid sabbatical after four years.
  - Instant access to external counselling and therapy sessions
    for team members that need emotional or mental health
    support.
  - 3% Pension contributions on total earnings.
  - An employee equity incentive scheme.
  - Generous parental leave and a nursery tax benefit scheme to
    help you save money.
  - Electric car scheme and cycle to work scheme.
  - Two company retreats a year: we’ve been to France, Italy,
    Spain, and further afield.

  And to make sure we all keep learning, we offer:

  - A learning and development budget for everyone.
  - Company-wide talks with internal and external speakers.
  - Access to learning platforms like Treehouse.

