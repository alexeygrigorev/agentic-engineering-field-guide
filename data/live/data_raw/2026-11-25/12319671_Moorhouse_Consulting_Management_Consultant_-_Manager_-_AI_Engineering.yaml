description: |
  Overview

  Why Moorhouse?

  Moorhouse is an independent, private equity-backed
  transformation consultancy that helps organisations tackle
  complex challenges and deliver lasting change. We combine
  deep sector expertise with practical delivery experience to
  help clients turn strategy into action, improve how they
  operate and deliver services, and build the capabilities and
  culture to sustain change.

  We have strong client relationships across Life Sciences,
  Government, Health, Energy, Utilities and Infrastructure,
  Financial Services, and Telecoms, Media and Technology. Many
  of our clients work in regulated environments. In a market
  where clients increasingly focus on demonstrable value, we
  differentiate ourselves through the quality of our people,
  our sector and service knowledge, and our commitment to
  delivering measurable outcomes.

  With new investment from LDC, we are entering our next
  chapter. We are strengthening the services our clients value
  most, from improving performance and shaping future
  organisations to delivering complex transformation, and
  embedding AI, data and technology in how we deliver them. We
  are also continuing to develop our product suite and IP,
  giving clients new ways to work with us.

  Our people are at the heart of our success. We are a
  collaborative, straightforward team, guided by our values of
  integrity, accountability, courage, humour and perspective.
  We believe in high performance without losing sight of what
  makes Moorhouse special: supporting one another, celebrating
  success and creating an environment where people can do
  their best work.

  As a B Corp-certified consultancy, we are equally committed
  to being a responsible business and making a positive
  impact. We will expect you to contribute to a culture of
  sustainability and embrace Moorhouse’s social responsibility
  by integrating responsible practices and upholding ethical
  standards and awareness in everyday work.

  Joining Moorhouse now means joining an ambitious business at
  an important point in its development, with the opportunity
  to help shape its future.

  Moorhouse is currently unable to offer visa sponsorship for
  this role. Unfortunately, this means we are not able to
  progress applications from candidates who would require
  sponsorship now or in the future.

  AI Engineering at Moorhouse

  Our AD3 Service Line—covering Advisory, Product, and
  Transformation—brings together expertise in Digital, Data,
  AI, and Delivery to help organisations achieve measurable,
  sustainable results. We guide technology leaders through
  every stage of the journey, from shaping strategic roadmaps
  to delivering large-scale technology-enabled change.

  - Digital - We translate digital ambitions into reality,
    optimising technology landscapes, modernising platforms,
    and delivering innovative digital solutions that drive
    transformational impact.
  - Data - We lay the foundations for data-driven decision-
    making, building the infrastructure, analytics
    capabilities, and insights needed to unlock the full
    potential of data.
  - AI - We help organisations adopt AI responsibly and
    effectively, by designing and building solutions, defining
    governance models, piloting AI use cases, and scaling
    solutions that align with strategic objectives.
  - Delivery - We ensure that solutions move seamlessly from
    concept to implementation. Our Delivery teams manage
    complex portfolios and programs, orchestrating each phase
    to achieve on-time, on-budget outcomes that truly make a
    difference.

  Working across our teams, we ensure all capabilities are
  integrated to solve the most challenging problems and create
  lasting value.

  Essential skills

  What are we looking for?

  You will lead the design, development and deployment of AI
  solutions, including LLM-based agents, automation and
  decision-support tools, helping clients achieve measurable
  outcomes while ensuring solutions can be operated safely and
  effectively in enterprise environments.

  Potential is what excites us so we are keen to hear from
  people who want to harness their experience within an
  organisation that will invest in their professional
  development from day one. This isn’t just about skills for
  the job but skills for life – mindset, adaptability,
  resilience and leadership to name just a few. It is
  important that you can contribute to sales and business
  development as well as leading consultant / client delivery
  teams on key engagements and accounts. In addition, we will
  expect you to motivate, support and develop junior members
  of the Moorhouse team and play an active role in supporting
  the career development of a small group of colleagues.

  Responsibilities:

  - Design and build AI solutions using LLMs, agent frameworks
    and related tooling, from prototype to production
  - Integrate AI components with client and Moorhouse systems
    via APIs, event streams and workflow tools
  - Implement robust engineering practices including version
    control, testing, observability and performance tuning
  - Work with architects and data engineers to define scalable,
    secure and cost‑effective solution designs
  - Collaborate with AI Delivery Leads to estimate, plan and
    deliver work across discovery, pilot and scale phases
  - Implement evaluation frameworks for AI performance
    (accuracy, safety, latency, cost) in partnership with the
    Evaluation & Assurance Analyst
  - Provide technical leadership and support and coaching to AI
    Engineers and broader consulting teams.
  - Contribute to Moorhouse intellectual property (IP): reusable
    components, accelerators, templates and knowledge assets

  Essential Skills:

  - 6 - 8 years’ consulting experience whether this is from a
    big consulting firm, boutique consultancy or experience
    gained in developing and delivering AI products within
    industry
  - Strong hands-on experience building AI/ML systems in
    production (ideally including LLMs and/or agents)
  - Proficiency in Python (or similar) and common AI tooling
    (e.g. LangChain, LlamaIndex, vector databases, cloud AI
    services)
  - Experience integrating with enterprise systems (REST APIs,
    microservices, identity/permissions)
  - Understanding of software engineering best practice (CI/CD,
    testing, code quality, observability)
  - Confident communicating with both technical and non-
    technical audiences, with experience building effective
    relationships with senior client stakeholders and
    leadership teams.
  - A passion for building and nurturing strong relationships
    with colleagues
  - A keen interest in playing a senior role within the Service
    Line team, supporting the development of compelling
    propositions and integrating with Sector teams
  - Experience across multiple sectors can be valuable, although
    we equally welcome candidates who have developed deeper
    expertise within a particular sector.

  Success Measures:

  - Number and quality of AI pilots / solutions delivered into
    production
  - Measured impact of solutions (cost, capacity, risk, service)
  - Reuse of patterns / components across engagements

  We recognise that candidates may not meet every requirement
  listed above. If your experience is closely aligned and you
  are excited about the opportunity, we encourage you to
  apply.

  Benefits

  What we can offer you:

  - A total cash package of up to £110,000 comprising of a base
    salary of £82,005 and a combination of personal and
    company bonuses that are paid every six months.
  - 25 days annual leave increasing by one day for every full
    year of service to a maximum of 30 days with the option to
    buy or sell up to five days of annual leave per year.
  - Life Assurance, Private Medical Insurance, Group Personal
    Pension Scheme and a range of lifestyle and wellbeing
    benefits.
  - Enhanced family-friendly package: generous parental pay,
    flexible working options, and paid time off for family
    commitments so you can balance work and home life with
    confidence.
  - Inclusive Culture and Community: a wide range of employee
    resource groups that encourage collaboration, peer support
    and offer learning and education opportunities across the
    business and create a strong sense of belonging across the
    business.
  - A culture where you will not need to compete with others
    because of promotion quotas or the typical distribution
    curves that govern performance management in other
    organisations. We recognise and reward performance
    consistently and transparently across the firm so that
    everyone knows where they stand.

  We offer flexible working arrangements with our offices near
  Liverpool Street although you can expect to spend some time
  as part of a team on UK client sites. We support flexibility
  wherever possible.

  Moorhouse is proud to be an equal opportunities employer,
  and our values underpin a working environment that is
  inclusive for all those who work for us. We encourage people
  to bring their whole selves to work, contribute ideas, take
  the initiative and be responsible for their impact on others
  internally and externally.
