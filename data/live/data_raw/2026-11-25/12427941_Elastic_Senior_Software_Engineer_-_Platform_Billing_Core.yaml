description: |
  Elastic, the Search AI Company, enables everyone to find the
  answers they need in real time, using all their data, at
  scale — unleashing the potential of businesses and people.
  The Elastic Search AI Platform, used by more than 50% of the
  Fortune 500, brings together the precision of search and the
  intelligence of AI to enable everyone to accelerate the
  results that matter. By taking advantage of all structured
  and unstructured data — securing and protecting private
  information more effectively — Elastic’s complete, cloud-
  based solutions for search, security, and observability help
  organizations deliver on the promise of AI.

  What Is The Role :

  Billing powers Elastic's Cloud business. It runs across AWS,
  GCP, and Azure in over 50 regions. We oversee usage-based
  metering, consumption billing, and marketplace integrations
  at global scale.

  The Billing Core team owns the data layer that makes billing
  correct, auditable, and automated. We work across two areas:

  - Usage — Collect and process usage and cost data. This data
    is the foundation of our billing and financial reporting.
  - Engine — Turn hourly usage data into customer invoices and
    revenue records.

  We are looking for a Senior Software Engineer to join the
  Billing Core team. You will take ownership of key systems,
  solve complex problems with minimal guidance, and help raise
  the bar for engineering quality on the team. You will work
  closely with Product, SRE, and Cloud Infrastructure teams.

  What You Will Be Doing :

  - Own and improve billing data pipelines for usage ingestion,
    transformation, and reconciliation.
  - Design and build reliable, scalable backend services in
    Python, with a focus on correctness and data integrity.
  - Take ownership of Elasticsearch and PostgreSQL schema design
    and query performance for billing data.
  - Lead small to medium projects end-to-end — from design to
    delivery — within the team.
  - Improve observability and reliability of core billing
    systems through better monitoring, alerting, and incident
    response.
  - Participate in code and design reviews. Be a trusted
    reviewer for your area of the stack.
  - Mentor junior engineers through feedback, pairing, and
    design discussions.
  - Work with Product and Tech Leads to help shape priorities
    and technical direction.
  - Take part in on-call rotations and contribute to production
    readiness.

  What You Bring :

  - 5+ years in backend engineering, with solid skills in Python
    and production experience with data stores and storage
    systems (schema design, query performance, reliability).
  - Experience building and operating data pipelines or event-
    driven systems in a production environment.
  - Knowledge with large-scale data processing and storage
    technologies, such as Spark, AWS Glue and Athena, Iceberg,
    and Parquet.
  - Solid understanding of distributed systems and how to build
    for reliability and scale.
  - Background in cloud infrastructure (AWS, GCP, or Azure) —
    networking, monitoring, and deployment basics.
  - Strong judgment in technical trade-offs. You can work
    through ambiguous problems and deliver well-thought-out
    solutions.
  - Good communication skills. You write clearly and speak up in
    discussions to share your perspective.
  - Experience with SaaS billing, metering, or financial systems
    is a plus.
  - Knowledge with PostgreSQL or Elasticsearch is a plus.
  - Comfortable working in a global, distributed, async
    environment.
  - Track record of using AI to improve development practices,
    including design, development, and debugging, while
    continuing to own the outcomes.



  Additional Information - We Take Care of Our People

  As a distributed company, diversity drives our identity.
  Whether you’re looking to launch a new career or grow an
  existing one, Elastic is the type of company where you can
  balance great work with great life. Your age is only a
  number. It doesn’t matter if you’re just out of college or
  your children are; we need you for what you can do.

  We strive to have parity of benefits across regions and
  while regulations differ from place to place, we believe
  taking care of our people is the right thing to do.

  - Competitive pay based on the work you do here and not your
    previous salary
  - Health coverage for you and your family in many locations
  - Ability to craft your calendar with flexible locations and
    schedules for many roles
  - Generous number of vacation days each year
  - Increase your impact - We match up to $2000 (or local
    currency equivalent) for financial donations and service
  - Up to 40 hours each year to use toward volunteer projects
    you love
  - Embracing parenthood with minimum of 16 weeks of parental
    leave

