description: |
  TAKE YOUR CAREER IN A NEW DIRECTION

  At Eurostar, we’re fuelling the future of rail travel –
  operating in five countries and sparking new opportunities
  for travellers. But our trains connect much more than just
  people and places. They’re helping us build a greener, more
  inclusive future for everyone. Join us and you’ll be part of
  a passionate team which always goes the extra mile.

  An exciting opportunity awaits you as Senior Software
  Developer in our Digital Technology team. As Senior Software
  Developer you’ll be working with product owners, business
  analysts, scrum masters, and engineers to implement features
  across our estate of cloud native software products and
  services. We’re working in modern JavaScript/TypeScript,
  hosted on AWS with Kubernetes, with a fully automated
  continuous integration pipeline.

  This permanent position is based in our London Kings Cross
  office.

  The closing date for this role is 5pm on Tuesday, 1 December
  2026. Candidates are encouraged to apply as soon as
  possible; Eurostar reserves the right to contact candidates
  before close date and to close the role earlier if suitable
  candidates are identified.

  Internal use only: Grade E, travel services 3-4.

  Requirements

  We’re looking for someone to:

  - Work as an integral part of an agile team contributing
    towards the planning and development of the systems the
    team use
  - Collaborate with engineers, Product Owners and Business
    Analysts to define solutions, ways of working and share
    knowledge across the department
  - Review code and providing support to other members of the
    team
  - Work on client-facing applications in React/Next.js and our
    mobile app in React Native
  - Design and build Node.js/GraphQL APIs
  - Maintain and improve the quality of the software we deliver,
    the codebases we work on and the tooling we use.
  - Regularly deploy code to production
  - Lead a workstream/project/team
  - Mentor/coach less experienced developers in the team
  - Help to identify and resolve reported issues
  - Keep our customers' data safe

  You'll need...

  - 3-5 years’ experience as a mobile app developer
  - Senior level experience in modern JavaScript applications
    written with ECMAScript, TypeScript, Node.js, React,
    Next.js, etc
  - Experience with AI engineering (LLM integration, RAG,
    agents, evals) and a desire to learn more
  - Experience designing and developing HTTP APIs in Node.js
  - Understanding of DevOps/modern infrastructure practices
    (AWS, Docker/Kubernetes, CI, etc) and a desire to learn
    more
  - Experience in (automated) testing (unit, integration, E2E,
    etc) and a keen interest in testing your code
    Understanding of distributed systems design, including
    building for resilience and cloud architectural patterns
    Experience working in autonomous agile environments
  - Awareness of security best practices in software development

  Benefits

  Benefits

  We’re constantly working to create a bright future for our
  company and our colleagues. That’s why we offer a wide range
  of brilliant benefits, including:

  ·        Travel benefits that can be used for both work and
  play including 75% off underground network from Day 1

  ·        Competitive defined benefit pension scheme

  ·        Free Eurostar tickets

  ·        Discounted Eurostar tickets for friends and family

  ·        Ongoing training and development

  ·        Free, confidential support via our Employee
  Assistance Programme

  ·        Peer-to-Peer support from trained Mental Health
  First Aiders/Personne de Confiance

  ·        Lots of other exclusive deals, discounts and perks

  A whole new platform for your career - If you think you’ve
  got what it takes to help us make Eurostar bigger and better
  than ever before then we’d love to hear from you.

  At Eurostar we believe in giving everyone an equal chance.
  We actively encourage applications from talented individuals
  regardless of sex, race, disability, age, sexual
  orientation, gender identity, religion or belief, marital
  status, whether you’re pregnant or on maternity leave.

  Your individuality is your strength, and we want a diverse
  team that reflects the world we live in.
