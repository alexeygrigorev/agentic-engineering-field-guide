description: |
  Location: US Remote

  ** Candidates must currently live in the US and have work
  authorization to work for any US employer **

  About Us:

  Friday Harbor is the leading AI-native technology platform
  in US mortgage, the largest sector of consumer credit in the
  world.

  We’re already used on almost 1% of all residential mortgages
  in the US, and that number is growing rapidly. Three of the
  top 25 lenders in the country trust Friday Harbor in
  production today, which means the work you ship here touches
  real loans and real borrowers right away.

  We’re a Seattle-based startup backed by leading venture
  firms, including Abstract, Mischief, Wischoff, AI2
  Incubator, and CoFound.

  Our engineering team is small, fully US remote, and comes
  together for regular off-sites. We care about doing
  ambitious work while offering flexibility and good work-life
  balance.

  What You'll Do:

  - Design, build, and own backend features for our underwriting
    product, from scoping through production
  - Turn product requirements and user feedback into durable
    product capabilities
  - Build LLM-powered features and agentic workflows, and help
    us measure and improve their quality with evals
  - Contribute to integrations with third-party mortgage systems
    like LOS platforms
  - Improve the reliability, latency, and cost of our AI
    underwriting pipeline

  What We're Looking For:

  - 3-5 years of backend engineering experience, ideally on
    product-facing teams
  - Strong product sense and a track record of owning features
    end to end, including the technical decisions
  - Motivated and high-agency. You move fast, take initiative,
    and want to keep taking on more responsibility
  - Solid Python, or a similar language and the ability to ramp
    quickly
  - Clear communicator who works well in a small, distributed
    team and with non-engineers

  Nice to Have:

  - Experience building with LLMs or agentic systems in
    production, including evals
  - Startup experience, or a fintech or regulated industry
    background
  - Mortgage or lending domain knowledge

  We offer a competitive cash salary ($140-170k), significant
  equity compensation, and a complete benefits package. Our
  compensation strategy is geared towards attracting world-
  class talent and creating the possibility for significant
  potential equity upside for our early employees.

  This is your chance to build cutting-edge AI systems with
  LLMs and agentic workflows, and make a lasting impact in the
  US housing industry!
