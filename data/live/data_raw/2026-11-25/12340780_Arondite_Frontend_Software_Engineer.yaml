description: |
  DescriptionAbout Arondite

  Arondite is a defence technology company building the
  foundational software and AI to power the autonomous age.
  Our aim is to revolutionise the way organisations
  collaborate with sensors, robots and autonomous systems and
  use the data they generate. We are driven by our
  determination to help defend our collective democratic
  values and by our strong belief that an elite group of
  engineers can make a big difference. We are ambitious, well-
  funded and building for the long-term.

  You will join Arondite at a pivotal moment in the company’s
  journey. Our company is being built by exceptional engineers
  - people who find high-impact and technically challenging
  work engaging and exciting, and who consistently deliver
  outsized impact. You will collaborate with other brilliant
  minds to solve some of the world’s hardest and most
  important problems.

  You will have ownership and autonomy from Day One. There is
  no corporate ladder at Arondite. From your first day, you
  will directly influence the design, functionality, and
  direction of Arondite’s product offering. We hire the best
  people and give them extremely high levels of autonomy; the
  sky is the limit for an individual with the right ambition.

  If you are motivated by our mission and if you want to be
  part of a growing team of outstanding people, then we want
  to hear from you.

  About the role

  As a Frontend Engineer at Arondite, you will be driving the
  development of software to enable autonomous devices to
  collaborate, process large sensor datasets, and build
  graphical user interfaces for the web. User interfaces will
  involve the presentation of complex information in an
  intuitive way to enable tasking and control of multiple
  devices.

  You will be expected to write flexible and maintainable code
  that will operate in mission-critical environments. You will
  iterate closely with designers and end users to rapidly add
  and improve the most relevant features to support their
  priorities - this may sometimes involve working outdoors and
  at other sites.

  Your responsibilities will include:

  - Architecting, building, and testing Arondite’s user-facing
    software
  - Working closely with in-house designers to deliver a
    polished product
  - Iterating with customers and users to better understand and
    implement their requirements
  - Collaborating with engineers with diverse skill sets,
    including AI/ML, networking, and robotics
  - Driving a culture of excellence within the engineering team
    and the wider company

  RequirementsYou should have:

  - A degree in Computer Science, Engineering, or a related
    technical/scientific subject (or equivalent experience)
  - Good professional experience developing in TypeScript or
    JavaScript, using frameworks such as Angular or React
  - A deep enthusiasm for expanding your knowledge of a diverse
    technology stack

  Ideally, you would also have (or be willing to rapidly
  gain):

  - Working knowledge of a server-side language such as C++,
    Java, Rust or Python
  - A keen eye for UI, UX, and software design
  - Experience with frontend mapping libraries (Cesium, Mapbox,
    Leaflet)
  - Experience working on a large and complex user interface

  Note: We want Arondite to bring together individuals from
  diverse backgrounds and perspectives. We don't expect
  everyone to have experience across each of these areas.
  Please apply even if you only partially fulfil this list.

  Security clearance

  We believe in working closely with defence customers. As a
  result, this role is likely to require you to hold a
  clearance or be willing to undergo UK security vetting to
  Security Check (SC) or above. This normally requires having
  continuous residency in the UK for at least 5 years.

  Office vs hybrid working

  We are focused on building a positive, collaborative
  engineering-driven culture. We therefore believe in making
  the office a friendly, comfortable and fun place to be, and
  we try to work from the office where possible. Of course,
  there are times when it makes sense for you to work from
  home and that's OK. You may also need to travel to visit
  customers, depending on your role. But in general you should
  only apply to join Arondite if you're excited to come into
  the office and work in person by default.

  Application process

  Generally, after CV submission our interview process is
  comprised of the following stages:

  - Intro Teams call with Talent team (15 mins)
  - Technical screening call (30-45 mins)
  - In-person technical interview (1-2 hours)
  - Final interview with one of Arondite’s Founders (30 mins)

  Benefits

  - Unlimited annual leave policy
  - 7% employer pension contribution through salary sacrifice
  - Highly competitive salary and generous equity through EMI
    share options
  - Private health and dental insurance through Bupa, with
    discounted cover for partners and children
  - Monthly wellness allowance, plus vision tests, flu/Covid
    jabs and an annual health check
  - Family support - 20 weeks parental leave, workplace nursery
    scheme, at-home (child/pet/elder) care allowances
  - Support for reservists, and paid compassionate, carer’s and
    emergency leave
  - Breakfast, lunch and dinner in the office every day, company
    pizzas on a Friday
  - Extremely competitive referrals scheme, including "friends
    of friends" bonuses for non-employees
  - Relocation support and visa sponsorship for exceptional
    international candidates
  - Interest-free season ticket loans, cycle to work
  - Access to any resources, equipment and training that you
    need to do your job in a world-class way
  - The opportunity to work with and learn from exceptional
    colleagues with excellent academic experience and deep
    industry knowledge
