description: |
  As part of the M&S Software Engineering team, you’ll be
  joining a well-loved, historic brand, working on solutions
  that serve millions of loyal customers and thousands of
  colleagues. With ethical values at the heart of the business
  and technology leaders who truly understand software
  engineering, it’s an exciting time to join us as we continue
  to become a digital-first, engineering-led organisation.

  This role sits within the International Partner Catalogue &
  Ordering team, supporting M&S’s International business
  across stores and online markets outside the UK and Ireland.
  As our international business continues to grow, you’ll help
  build and evolve the platforms and integrations that enable
  our partners to access catalogue information and ordering
  capabilities. You’ll deliver robust, scalable solutions with
  strong observability, clear metrics and best-in-class
  engineering practices.

  Due to high interest, this role may close earlier than
  advertised. We recommend applying as soon as possible.

  What You’ll Do

  Your key accountabilities will include:

  - Develop, test and debug high-quality software solutions,
    championing clean code, automated testing and engineering
    best practices.
  - Provide technical leadership on complex initiatives,
    ensuring solutions align with our technology strategy,
    standards and long-term engineering direction.
  - Lead the design of scalable and adaptable software solutions
    and third-party integrations, partnering closely with
    Architecture and other engineering teams.
  - Collaborate with Product Managers, business stakeholders and
    engineers to understand international partner requirements
    and create effective technical solutions.
  - Mentor and coach engineers, sharing knowledge, raising
    engineering standards and fostering a culture of
    continuous improvement.
  - Drive operational excellence through effective
    observability, monitoring, alerting and incident
    management, using operational learnings to continuously
    improve our platforms.

  Who You Are

  Your skills and experience will include:

  - Proven experience developing high-performing, robust backend
    systems and enterprise integrations, with a focus on
    scalability, optimisation and reliability.
  - Deep understanding of software engineering principles,
    design patterns and practices, applied to building
    maintainable and adaptable solutions.
  - Strong knowledge of automated testing across unit,
    integration and system levels, alongside hands-on
    experience implementing DevSecOps practices at enterprise
    scale.
  - Technical proficiency across technologies such as Java,
    PL/SQL and JavaScript, complemented by strong experience
    with Git, CI/CD pipelines and modern engineering tooling.
  - Experience designing and operating scalable cloud-based
    applications with a strong focus on performance, security,
    observability and operational resilience.
  - Strong communication and mentoring skills, combined with
    knowledge of AI/ML and GenAI tools such as Copilot and
    experience using AI-enabled tools or agents across the
    software development lifecycle.

  Tech Stack

  Teams use a variety of technologies, including:

  - Languages & Frameworks: PL/SQL, Java/Spring Boot, Python,
    AI/ML
  - Cloud & Infrastructure: Azure IaaS and PaaS, Docker,
    Kubernetes, Helm, Terraform
  - Data & Messaging: Kafka/Confluent, IBM MQ/MQFTE, SFTP
  - Databases: MongoDB, SQL Server on Azure
  - API & Integration: Apigee, REST APIs, Windows Services
  - Observability: Dynatrace, OpenTelemetry, PagerDuty, Helix
  - UI: Angular, React, TypeScript

  Desirable Experience

  - Knowledge of the retail domain would be advantageous but is
    not essential.
  - Experience supporting international commerce, partner,
    catalogue or ordering platforms would be beneficial.
  - Experience working with complex integrations, event-driven
    architectures or distributed enterprise systems would be
    advantageous.

  What’s in it for you?

  Working at M&S means being part of something bigger -
  helping to deliver quality, value and service to millions of
  customers every day. We’re inclusive, fast-moving and always
  evolving, with a strong sense of purpose and a focus on
  doing the right thing.

  Here are just a few of the benefits that make working here
  even more rewarding:

  - 20% colleague discount on all M&S products and many third-
    party brands for you and someone in your household,
    available once you’ve completed your probation.
  - Competitive holiday allowance with the option to buy more.
  - Discretionary bonus schemes linked to your performance and
    ours.
  - Strong pension and life assurance to help plan for the
    future.
  - Tailored induction and training to support your development
    from day one.
  - Exclusive perks and savings through our M&S Choices portal.
  - Market-leading family policies, including parental, adoption
    and neonatal leave.
  - 24/7 wellbeing support, including virtual GP access and
    mental health services.
  - One paid volunteer day a year to support a cause that
    matters to you.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet. Marks & Spencer strives to be an
  inclusive organisation, trusted and admired by our
  colleagues, customers and suppliers. Join us and make change
  happen.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and work
  together to win together.

  If you feel you'd benefit from any support or reasonable
  adjustments during any stage of the recruitment process,
  please don’t hesitate to let us know when completing your
  application. This information will be picked up by our team,
  so we can try and put steps in place to help you be at your
  best through this process.

