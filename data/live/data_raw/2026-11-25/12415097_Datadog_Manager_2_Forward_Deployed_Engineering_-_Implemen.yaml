title: Manager 2, Forward Deployed Engineering - Implementation Services
company: Datadog
location: New York, USA
work_type: FULL_TIME
company_size: 6,500 Employees
description: |
  Datadog’s Implementation Services team leads end-to-end
  deployment and optimization projects. Our Forward Deployed
  Engineers (FDEs) own the discovery, design, and build of the
  Datadog platform in customer environments, helping customers
  get to value faster.

  As a Manager for FDE, you’ll lead the engineers behind our
  most complex engagements: deploying Datadog at scale,
  migrating customers off legacy platforms, and optimizing
  existing observability setups. You’ll set the bar for what
  great build looks like, review architectures and code
  alongside your team, and work shoulder to shoulder with
  Datadog Engineering and Product. You’ll also stay close to
  customers, supporting scoping and showing up in the
  engagements that matter most.

  At Datadog, we place value in our office culture - the
  relationships and collaboration it builds and the creativity
  it brings to the table. We operate as a hybrid workplace to
  ensure our Datadogs can create a work-life harmony that best
  fits them.

  What you’ll do

  - Coach and Develop your team: Hire, manage, develop, and
    mentor a fast-paced team of Forward Deployed Engineers,
    giving direct, actionable feedback and holding a high bar
    for technical quality
  - Define what great build looks like across the SDLC: design
    review, code review, testing, CI/CD, release, and
    operational readiness for customer deliverables
  - Own high quality delivery for your portfolio: prioritize
    work across your team and run regular inspection on
    deliverables and outcomes to ensure quality at scale
  - Build relationships with the customer to scope engagements,
    cultivate trust, and evaluate the impact of our work on
    their business
  - Collaborate cross functionally: with Sales, Customer
    Success, and Technical Account Management to deliver an
    exceptional customer experience

  Who you are

  - You have 8+ years in software engineering, SRE, DevOps,
    platform engineering, or customer-facing technical roles,
    and 3+ years of people management experience leading
    engineers or technical consultants
  - You collaborate credibly with Engineering and Product teams,
    weigh in on architecture and design tradeoffs, and can
    read, review, and write production-grade code
  - You have a strong grasp of SDLC fundamentals and what great
    build looks like (design reviews, testing strategy, CI/CD,
    release management, production readiness)
  - You know at least one major cloud well (AWS, GCP or Azure),
    along with strong fundamentals in Kubernetes, Terraform or
    Ansible, and CI/CD, and have hands-on observability
    experience with Datadog or a comparable platform
  - You’re comfortable in front of customers: you can run
    technical discovery, build trust with engineering leaders,
    present to technical and executive audiences, and turn
    field experience into sharp, actionable feedback for
    Product and Engineering
  - Able to sit up to 4 hours, traveling to and from client
    sites. Able to travel via auto, train or air up to 30% of
    the time.

  Datadog values people from all walks of life. We understand
  not everyone will meet all the above qualifications on day
  one. That’s okay. If you’re passionate about technology and
  want to grow your skills, we encourage you to apply.

  Benefits and Growth:

  - Best-in-breed onboarding
  - Generous global benefits
  - Intra-departmental mentor and buddy program for in-house
    networking
  - New hire stock equity (RSUs) and employee stock purchase
    plan (ESPP)
  - Continuous professional development, product training, and
    career pathing
  - An inclusive company culture, able to join our Community
    Guilds and Inclusion Talks

  Benefits and Growth listed above may vary based on the
  country of your employment and the nature of your employment
  with Datadog.

  #LI-Hybrid

  Datadog offers a competitive salary and equity package, and
  may include variable compensation. Actual compensation is
  based on factors such as the candidate's skills,
  qualifications, and experience. In addition, Datadog offers
  a wide range of best in class, comprehensive and inclusive
  employee benefits for this role including healthcare,
  dental, parental planning, and mental health benefits, a
  401(k) plan and match, paid time off, fitness
  reimbursements, and a discounted employee stock purchase
  plan.

  The reasonably estimated yearly salary for this role at
  Datadog is:

  $180,000—$240,000 USD

  About Datadog:

  Datadog is the leading observability and security platform
  for the AI era, providing businesses with unified visibility
  across the technology stack to manage complexity at scale.
  It brings applications, infrastructure, data, models, and
  security into one place, using AI to detect and resolve
  issues before they impact customers. Trusted globally by
  Fortune 500 companies and high-growth AI leaders, Datadog
  enables businesses to move faster with clarity and
  confidence. Learn more about #DatadogLife on Instagram,
  LinkedIn, and Datadog Learning Center.

