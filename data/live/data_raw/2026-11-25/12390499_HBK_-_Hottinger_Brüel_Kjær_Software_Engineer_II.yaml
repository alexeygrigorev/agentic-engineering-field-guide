description: |
  The Position: Hottinger Bruel & Kjaer Solutions LLC is
  looking for a talented Software Engineer III to join our
  team. We combine our expertise in reliability, durability,
  advanced modeling, and software engineering to provide Asset
  Performance Management Solutions, some of which include
  Machine Learning Model-drive Predictive Analytics. You will
  be joining an active, dynamic, and growing software design,
  development, and configuration team to rapidly create
  innovative digital software solutions. This includes working
  with a team alongside subject matter experts, project
  managers, and product managers to deliver innovative
  solutions using the latest technology and approaches.

  Must be a US citizen. Unable to hire dual citizens, visa
  holders, or green card holders for this position.

  Location: USA Home Working Primary Responsibilities:

  - Design, develop, test, and maintain enterprise-grade
    software applications
  - Build scalable backend services, APIs, and application
    integrations
  - Implement authentication, authorization, logging,
    monitoring, and error-handling mechanisms
  - Write clean, maintainable, reusable, and well-tested code
  - Participate in architecture discussions, code reviews, and
    technical design sessions
  - Troubleshoot, debug, and optimize application performance,
    accessibility, and usability
  - Assist in customer and partner implementations
  - Follow software development best practices, including Agile
    methodologies and CI/CD
  - Implement responsible AI practices, including data privacy,
    security, and output validation
  - Collaborate with cross-functional teams to translate
    business requirements into technical solutions
  - Participate in sprint planning, estimation, and daily
    engineering activities
  - Contribute to technical documentation and knowledge sharing
  - Stay current with emerging software engineering trends
    including AI technologies and frameworks
  - Other duties as needed

  Professional Qualifications:

  - A Bachelor or Master of Science degree in Computer
    Engineering or Computer Science with an aptitude for
    engineering applications
  - A minimum of 3 years of relevant experience and related
    technology professional certifications

   Personal Skills:

  - Mandatory Requirement: US Citizen
  - Strong programming experience in one or more of the
    following technologies across multiple categories:
    - Programming:  Python, C#, Java/Kotlin
    - Frameworks: .NET (ASP.NET, Entity Framework Core)
    - Databases: SQL Server, PostgreSQL, MongoDB (NoSQL), Redis
    - DevOps: Git, Docker, Kubernetes, CI/CD
    - Operating Systems: Linux, MS Windows
  - Experience designing and developing scalable RESTful APIs
    and backend services
  - Experience designing/developing enterprise-scale web-based
    solutions involving large-scale data and BI visualization
    technologies
  - Experience with Git, CI/CD pipelines, and Agile development
    practices
  - In-depth knowledge of object-oriented programming, data
    structures, algorithms, and design patterns
  - Familiarity with Generative AI, LLMs, and prompt engineering
  - High level analytical ability where problems are unusual and
    complex
  - Excellent verbal and communication skills, with ability to
    articulate technical solutions to both technical and non-
    technical audiences
  - Strong interpersonal skills to work both independently and
    effectively with others
  - Exceptional skills related to time management and decision
    making
  - Willingness to travel to support customer projects and
    implementations

  Compensation:

  The pay range for this position is $105,000 to $115,000
  annually plus 10% bonus. Please note that the pay range
  provided is a good faith estimate for the position at the
  time of posting. Actual compensation will be dependent on
  factors, including but not limited to the individual's
  qualifications, experience, knowledge, skills, and
  abilities, as well as physical work location within the
  state.

