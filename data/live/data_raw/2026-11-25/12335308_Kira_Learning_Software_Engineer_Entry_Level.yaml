description: |
  We live in a world where technology is rapidly changing the
  educational experiences of students and teachers everywhere,
  and we have the opportunity to shape how this change takes
  place. Kira’s mission is to harness transformative AI
  technologies to make world-class personalized teaching and
  learning accessible to everyone. Kira is a rapidly growing
  startup backed by top-tier Venture Capital funds including
  New Enterprise Associates (NEA), Andrew Ng’s AI Fund, and
  Primavera.

  As an entry-level Software Engineer at Kira, you will help
  build and ship product that real teachers and students use
  every day, and you will grow quickly while doing it. This
  role is for an early-career engineer, such as a recent
  graduate or someone with 0–2 years of experience, who is
  curious, learns fast, and wants real ownership on a small,
  high-trust team. You’ll work closely with our VP of
  Engineering and learn from senior engineers through code
  review, pairing, and design discussions.

  This is a generalist role. You don’t need to be a “frontend”
  or “backend” engineer. You’ll start where your strengths
  are, work across our stack as projects need, and find where
  you want to go deeper. You’ll partner with product and
  design to ship complete features, and you’ll have chances to
  meet directly with teachers and students to learn how they
  use Kira.

  This is a full-time position that may require flexibility
  with work hours and availability outside of regular business
  hours. We have offices in San Francisco, CA and New York
  City, NY. We ask that employees work from one of the two
  locations and come into the office in person 4 days a week
  (Wednesdays WFH).

  What You’ll Do

  - Ship scoped, end-to-end features that improve student and
    teacher experiences, with guidance from senior engineers
    and increasing independence over time
  - Work across the stack (user-facing product surfaces, backend
    services and APIs, and the data behind them) as your
    projects require
  - Debug real issues and help improve reliability, performance,
    and code quality
  - Write tested, production-quality code that is reviewed and
    deployed through our CI/CD pipeline
  - Partner with product managers and designers to clarify
    requirements and tradeoffs
  - Use AI coding tools (such as Cursor and Claude Code) as part
    of your daily workflow, and review and understand
    everything they produce
  - Contribute to design discussions and code reviews, and grow
    through mentorship from senior engineers

  What We’re Looking For

  - Bachelor's or Master's degree in Computer Science or a
    related field, or equivalent technical experience
  - You’re early in your software engineering career, with 0–2
    years of professional experience. You can show your work
    through an internship, coursework, research, open source,
    a personal project, or a job
  - Strong fundamentals in data structures, algorithms, and how
    software systems work
  - Experience building and shipping projects end-to-end in at
    least one modern language (for example Python, TypeScript,
    Kotlin, Go, or Rust). We care more about depth in a modern
    language than an exact stack match, and we’ll teach you
    Kira’s stack
  - You’ve built something you can walk us through in detail.
    Tell us what you owned, one decision you made, and how you
    checked that it worked.
  - Familiarity with APIs, relational databases (for example
    MySQL), and automated testing
  - AI-assisted development as a real workflow (Cursor, Claude
    Code, or similar), with the judgment to question, debug,
    and explain what the AI produces rather than accept it at
    face value
  - Curiosity, initiative, and coachability: you ask clarifying
    questions, flag blockers early, and can point to a time
    feedback changed how you worked
  - Clear written and verbal communication, including explaining
    your thinking and the tradeoffs behind it
  - Comfort in a fast-paced, early-stage environment with
    changing priorities, and genuine interest in Kira’s
    mission in education

  Nice To Have

  - Internship or project experience at a startup or a fast-
    growing company
  - Experience with React and TypeScript, or with backend
    services and event-driven systems
  - Cloud experience (ideally AWS)
  - Exposure to LLM-backed features or AI evaluations (datasets,
    quality checks, regression tests for prompt or model
    changes)
  - Open source contributions, research, or technical writing

  What We Offer

  - Competitive compensation and equity. For applicants in the
    US, the salary range for this role is $115,000 – $140,000,
    depending on relevant experience and skill set
  - Medical, dental, vision and life insurance, including a
    medical insurance plan with 100% coverage of employee
    premiums
  - Flexible PTO policy and company holidays
  - DoorDash credit for lunch daily
  - Wellhub Membership: 100% company-paid access to premium gym
    networks (Orangetheory, SoulCycle), 60+ wellness apps
    (Headspace, MyFitnessPal, Apple Fitness+), and 1:1
    coaching sessions spanning fitness, mental health,
    nutrition, and sleep
  - 401(k) matching
  - Dog friendly office 🐶

  Equal Employment Opportunity Employer

  At Kira, we are committed to providing an environment of
  mutual respect where equal employment opportunities are
  available to all applicants without regard to race, color,
  religion, sex, pregnancy (including childbirth, lactation
  and related medical conditions), national origin, age,
  physical and mental disability, marital status, sexual
  orientation, gender identity, gender expression, genetic
  information (including characteristics and testing),
  military and veteran status, and any other characteristic
  protected by applicable law. Kira believes that diversity
  and inclusion among our employees are critical to our
  success as a company, and we seek to recruit, develop and
  retain the most talented people from a diverse candidate
  pool. Selection for employment is decided on the basis of
  qualifications, merit, and business need.

  Background Check

  Kira will make a conditional job offer in line with local,
  state and federal laws, and a subsequent criminal,
  education, and employment history background check will then
  be issued.
