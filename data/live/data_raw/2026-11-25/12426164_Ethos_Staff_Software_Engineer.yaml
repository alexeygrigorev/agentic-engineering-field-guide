description: |
  About Ethos

  Ethos (Nasdaq: $LIFE) is a leading life insurance technology
  company on a mission to protect families by democratizing
  access to life insurance and empowering agents at scale.
  With its robust three-sided technology platform, Ethos is
  transforming the life insurance experience for consumers,
  agents, and carriers alike. Ethos offers instant, accessible
  products and a seamless online process that requires no
  medical exams and just a few health questions; it eliminates
  traditional barriers, making it easier than ever for
  everyone to protect their families. Ethos is redefining how
  life insurance is bought, sold, and underwritten.

  About the Role

   As a Staff Software Engineer, you’ll work on building
  scalable and reliable backend services and systems. You’ll
  collaborate with other engineers and stakeholders to design,
  implement and ship impactful features. We value clean,
  modular and high-performing code, and you’ll contribute to
  strengthening our engineering practices and standards.

  Duties and Responsibilities:

  - Design, build and maintain backend services and APIs.
  - Collaborate with engineers, PMs and non-technical
    stakeholders to define and deliver features.
  - Ensure system reliability, scalability and performance.
  - Find and solve performance issues.
  - Share and advocate for best engineering practices.

  Qualifications and Skills:

  - 7+ years of experience.
  - Experience with backend architectural patterns of large,
    high-scale web applications.
  - Proficiency in designing clean, maintainable APIs.
  - Experienced with software engineering best practices –
    design patterns, code reviews, unit and integration
    testing etc.
  - Good communication skills (written and verbal).

  #LI-MK1

