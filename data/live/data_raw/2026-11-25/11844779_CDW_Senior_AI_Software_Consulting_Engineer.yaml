description: |
  Description Job Summary The Senior AI Software Consulting
  Engineer actively participates in the design, integration,
  and delivery of advanced artificial intelligence, machine
  learning, and MLOps solutions for clients. This client-
  facing, billable role serves as a technical lead on complex
  engagements, provides mentorship and guidance to engineers,
  and ensures solutions are implemented as designed to the
  client's satisfaction and approval. The position translates
  business and technical requirements into secure, scalable,
  production-ready AI software architectures and
  implementation plans. What You Will Do • Lead the technical
  design and delivery of complex AI software, generative AI,
  agentic AI, model-serving, and MLOps engagements. •
  Regularly interface with client technical and business
  stakeholders, project sponsors, architects, and delivery
  leadership on complex engagements. • Work with professional
  services managers, architects, project managers, sales
  teams, partners, and clients to manage expectations, risks,
  decisions, and timelines. • Serve as the technical point of
  contact for customer engagements and provide guidance on
  application architecture, integration, security,
  observability, evaluation, and operational readiness. •
  Mentor engineers in software design, development, testing,
  troubleshooting, documentation, and customer delivery
  practices. • Support sales activities by contributing to
  discovery, solution validation, proposals, SOWs, ROMs, LOEs,
  and presentations. • Create and maintain accurate project
  documentation, as-built configurations, test plans, work
  logs, and client handoff materials. What We Expect of You •
  Bachelor's degree and 5 years' experience delivering complex
  software, data, or AI/ML solutions, including planning,
  development, implementation, integration, and support OR 9
  years' experience delivering complex software, data, or
  AI/ML solutions, including planning, development,
  implementation, integration, and support • Demonstrated
  ability to design and lead implementation of production-
  grade AI applications and MLOps solutions. • Advanced
  software development experience using Python, APIs,
  containers, Kubernetes, Git, automated testing, and CI/CD. •
  Experience with NVIDIA NIM, NVIDIA Blueprints, model-serving
  platforms, PyTorch, Hugging Face, or comparable AI software
  ecosystems. • Experience designing retrieval-augmented
  generation, vector search, agentic workflows, enterprise
  integrations, and evaluation approaches. • Working knowledge
  of model optimization, inference patterns, security,
  observability, data governance, and production operations. •
  Understanding GPU infrastructure, accelerated computing
  dependencies, and how software architecture decisions affect
  performance and scalability. • Demonstrated ability to
  research advanced technologies, evaluate alternatives, make
  recommendations, and present findings to clients and
  management. • Strong written, presentation, and verbal
  communication skills, including experience presenting
  technical recommendations from a business perspective. •
  History of balancing competing priorities, leading through
  ambiguity, and escalating risks with clear alternatives and
  impacts. • Ability and willingness to work beyond regularly
  scheduled shifts, select weekends, or overtime as necessary
  to meet operational needs. • Ability and willingness to
  travel as needed to CDW locations or client sites. • Valid
  U.S. driver's license. • Experience leading enterprise
  generative AI, agentic AI, fine-tuning, distributed
  inference, or advanced MLOps implementations, is a plus. •
  Experience with vector databases, AI gateways,
  observability, evaluation frameworks, guardrails, and model
  lifecycle platforms, is a plus. • Experience integrating AI
  solutions with enterprise applications, identity platforms,
  data estates, and security controls, is a plus. • Preferred
  NVIDIA certifications aligned to the role include NVIDIA-
  Certified Professional Generative AI LLMs (NCP-GENL) and
  NVIDIA-Certified Professional Agentic AI (NCP-AAI), is a
  plus. Pay range: $107,300 - $150,180 depending on experience
  and skill set Annual bonus target of %10 subject to terms
  and conditions of plan Benefits overview:
  https://cdw.benefit-info.com/ Salary ranges may be subject
  to geographic differentials * CDW is committed to being an
  AI-fluent organization * We're looking for people who bring
  curiosity, a learner's mindset, and a willingness to engage
  with ever-evolving technology and tools. We value adopting
  AI as a partner, openness to experimentation, and a shared
  interest in learning together on AI. Our goal is to create a
  culture where AI enhances- not replaces- human creativity
  and decision-making. You don't need to be an expert today;
  what matters is your readiness to explore, adapt, and grow
  with us as we integrate AI responsibly and effectively into
  our work.Additionally, CDW is committed to fostering an
  equitable, transparent, and respectful hiring process for
  all applicants. During our application process, our goal is
  to understand your experience, strengths, skills, and
  qualifications. As an AI forward company, we see AI not just
  as a tool, but as a catalyst for new ways of thinking,
  creating, and communicating. We encourage candidates to
  embrace an AI mindset, one that's curious, adaptive, and
  ready to explore what's possible. We welcome thoughtful use
  of AI to expand your perspective and elevate how you share
  your story, while ensuring your application remains rooted
  in your own background, judgment, and voice. * About Us *
  CDW is a Fortune 500 technology solutions provider that
  helps businesses, government, education, and healthcare
  organizations achieve what's possible through technology.
  What makes CDW different isn't just what we do- it's how we
  do it. At CDW we act as one- building trust, speaking
  candidly, and working together to achieve more. We play to
  win- focusing on what matters most and delivering for our
  customers. And we think forward- staying curious, moving
  fast, and continuously learning. We believe meaningful work
  happens when people feel supported, heard, and empowered to
  contribute. That's why we think of ourselves as coworkers,
  not just employees- working together to solve complex
  challenges and deliver real impact for our customers and
  communities. As a full-stack, full-lifecycle technology
  partner, CDW brings deep expertise, strong relationships,
  and broad industry knowledge to help turn ideas into
  outcomes. When you join CDW, you become part of a
  collaborative environment where your work matters, your
  growth is supported, and your contributions help shape
  what's next. Together, we deliver the full promise of what
  technology can do. * Together, we Make Amazing Happen. * CDW
  is an equal opportunity employer. All qualified applicants
  will receive consideration for employment without regards to
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, disability status, protected
  veteran status or any other basis prohibited by state and
  local law.
