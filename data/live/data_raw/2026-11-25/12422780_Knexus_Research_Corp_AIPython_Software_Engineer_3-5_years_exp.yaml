description: |
  US Citizenship Required, Remote

  Due to Federal Government contract regulations US
  Citizenship is required, as well as a Secret Clearance
  (either a current or be eligible for one).

  The Opportunity

  We are looking for an energetic and creative software
  engineer to join our AI applications team. You will gain
  firsthand experience in putting AI technologies into
  software products that help military commanders and business
  leaders make mission critical decisions. You will see and
  contribute to all parts of software development life cycle
  design, from design to delivery. The ideal candidate will be
  an individual with exceptional algorithmic, problem solving,
  and interpersonal skills, who will be able to hit the ground
  running. We will provide the necessary training and tools to
  help you produce world class software.

  Responsibilities

  - Collaboratively design, implement, and test decision support
    and simulation software using cutting-edge technologies
    including AI and machine learning components
  - Develop modular systems in a distributed architecture such
    as with RESTful containerized micro services
  - Review and analyze software runtime performance, make
    algorithmic and performance improvements
  - Use agile development techniques

  Qualifications and Experience

  - Degree in Computer Science or related field
  - 3-5 years in software development including design, coding,
    and testing and delivery
  - Mastery in object-oriented design and programming, knowledge
    of design patterns, and algorithmic analysis
  - Proficient in Python and experience with Java, TypeScript,
    or C++
  - Experience with essential software development tools
  - distributed version control such as Git
  - build frameworks such as Gradle, Maven, or CMake
  - unit test frameworks such as JUnit, or Python unittest
  - Experience working in a small team environment, in a remote
    environment

  Bonus Experience

  - Exposure to Artificial Intelligence and/or Machine Learning
    technologies
  - Experience with discrete event simulation
  - Experience with geo-spatial and/or temporal databases
  - Experience performing scientific evaluations,
    experimentation, and comparisons
  - Familiarity with technologies such as Docker, Node, Spring,
    Flask
  - Experience with database systems including SQL, NoSQL
    databases, and ORMs
  - Experience with RESTful containerized micro services
  - Experience with Kanban Workflow, GitFlow, and related
    software engineering practices

  Interview and Selection

  Applicants should be prepared to participate in an online
  Technical Assessment, and a couple of remote interviews.  We
  may also ask for coding samples or examples of your work,
  academic transcripts, and professional references.
