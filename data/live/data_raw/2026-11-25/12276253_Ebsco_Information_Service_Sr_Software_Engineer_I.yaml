description: |
  EBSCO Information Services (EBSCO) delivers a fully
  optimized research experience, seamlessly integrated with a
  powerful discovery platform to support the information needs
  and maximize the research experience of our end-users.
  Headquartered in Ipswich, MA, EBSCO employs more than 2,700
  people worldwide, with most embracing hybrid or remote work
  models. As an AI-enabled service leader, we thrive on
  innovation, forward-thinking strategies, and the dedication
  of our exceptional team. At EBSCO, we’re driven to inspire,
  empower and support research. Our mission is to transform
  lives by providing reliable and relevant information — when,
  where and how people need it. We’re seeking dynamic,
  creative individuals whose diverse perspectives will help us
  achieve this global, inclusive mission. Join us to help make
  an impact. Your Opportunity

  As a Senior Software Engineer, you will work on an Agile
  development team building, testing and deploying great
  products and services for our customers. You will create
  information products and services that inform the world,
  advancing research in traditional and emerging fields and
  transforming learning and education.

  As a member of an Agile development team, you will design,
  develop and demonstrate software in 2-week iterations as
  part of an Agile Release Train developing to a SAFe Program
  Increment. You will make commitments to the business and
  meet those commitments as a team. You will strive for
  continuous improvement in knowledge and productivity and
  display a pattern of continual learning and a desire to
  broaden your software development and design skills.

  What You'll Do

  - Provide expertise on system architecture, design,
    implementation, testing, delivery, and operation of
    premium EBSCO products.
  - Provide operational support to components that your team
    owns, including 24/7 availability as needed.
  - Work directly with product management and your team while
    analyzing and decomposing complex software requirements
    into simple user stories for planning and execution.
  - Collaborate with your team to estimate the size and
    complexity of the features. Perform the technical design,
    implementation, and testing of features and commit to
    stories to be accomplished in an iteration.
  - Drive value and build to continuously improve the quality of
    the team’s deliverables. Authoring well-engineered
    solutions using test-first/test-driven methodologies.
  - Conduct new technology research, proof of concept, and
    design work that will provide direction for the
    enhancement of the overall system and products.
  - Provide ongoing maintenance, support and enhancements in
    existing systems and platforms.
  - Work alongside other software engineers to deliver and
    consistently apply best practices for design, coding
    standards, performance, security, delivery, and
    maintainability.
  - Demonstrate ownership of developed components from
    development through production.

  About You

  Skills or experience you need:

  - Bachelor’s Degree in Computer Science, MIS, Computer
    Engineering or other Technical related degree
  - 5 years of Java, JavaScript, and/or .NET development (C#)
  - 5 years of experience in large systems software design and
    development with hands on experience in RESTful Web
    Services, HTML, XML/JSON, HTTP, SSL.
  - Proficiency with source code management tools such as
    GitHub.
  - Database Development such as SQL Server, MySQL
  - Problem Solving and Troubleshooting skills

  Skills or experience that sets you apart:

  - Advanced Degree in Computer Science, MIS, Computer
    Engineering or other Technical or Library Science related
    degree.
  - AWS experience
  - Test Driven Development (TDD) and Automated Testing with
    JUnit, LoadRunner, JMeter, etc.
  - DevOps CI/CD
  - Developing automated integration, acceptance, and/or
    contract driven tests scenarios.
  - Performance testing strategies and techniques
  - Workload automation tools like Automic Automation (AOA)

  Pay RangeUSD $99,720.00 - USD $142,460.00 /Yr.
