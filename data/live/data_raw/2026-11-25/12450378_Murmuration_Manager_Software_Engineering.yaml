description: |
  Who We Are

  At Murmuration, we believe that America’s promise is shaped
  and reshaped by the best ideas and ideals of its
  communities, and the dreams of the people who believe in a
  better life for themselves, their families, and each other.

  We help organizations build power in their communities in
  four key ways: we organize a network of values-aligned
  partners; we provide deep, data-driven insights into people,
  places, and perspectives; we develop tools that make
  organizing and engagement easy and more effective; and we
  offer services that strengthen our partners’ capacity to
  lead change in their communities.

  We envision an America where every community has what it
  needs to help people lead healthy, free, and dignified
  lives. We work to redesign the systems and structures we all
  depend on — how we learn, live, govern, and solve problems —
  so that they are just, equitable, resilient, and rooted in
  shared responsibility. By strengthening the ties that hold
  communities together, we aim for civic life defined by
  collective action and care, with effective leadership that
  truly represents everyone.

  We are a collaborative, curious, and creative team of
  organizers, scientists, teachers, technologists, campaign
  veterans, and more who share the unwavering belief that we
  can use our gifts in service of transforming America —
  together. We’ve built our team guided by the belief that the
  whole is greater than the sum of its parts. And so we
  support each other relentlessly — rallying together to face
  challenges the same way we celebrate each other’s wins.

  About the Position

  Do you see yourself as a mission-driven leader ready to join
  a team built on trust and open communication, where you’ll
  guide the growth of its engineers and help set the technical
  direction for a platform with an impact that matters?

  We are seeking a Manager, Software Engineering who believes
  that engineering teams do their best work when they trust
  each other, understand why their work matters, and have a
  manager who clears and illuminates the path for them. In
  this role, you will lead and mentor an already high-
  performing team of data engineers as they design, develop,
  and maintain the core data platform and data pipelines that
  power Murmuration’s Organizer web application - a tool our
  users rely on to organize and engage with their communities.
  By fostering a collaborative and innovative development
  environment, you will see your impact in the team’s
  successful delivery of new features and performance
  improvements that directly translate to our users’ increased
  organizing power.

  We are looking for an engineering leader who has a proven
  track record of balancing people management, technical
  leadership, and hands-on engagement. You will oversee all
  engineering design plans for your team, using product
  requirements, platform knowledge, and systems thinking to
  provide guidance, feedback, and approval. You will manage
  project timelines and help prioritize tasks to ensure
  successful team delivery. You will be expected to build a
  first-hand understanding of the platform and the effort
  behind your team’s work by remaining hands-on: contributing
  to the code, reviewing code, and helping engineers clear
  technical hurdles.

  Job Level:  M3

  What You’ll Do

  Manage a High-Performing Engineering Team

  - Manage a team of up to six engineers, ensuring each
    individual has a clear understanding of how their work
    aligns with our engineering vision and benefits our
    Partners;
  - Cultivate an inclusive, high-trust culture aligned with
    Murmuration and engineering values;
  - Manage performance directly and early with support from your
    manager and the People Team; and
  - Help shape the team as needed by taking part in our hiring
    process and identifying and onboarding great engineers.

  Oversee Sprint Execution & Project Management

  - Own the software development lifecycle for the Organizer
    data platform team, ensuring the platform we provide is
    performant, stable, scalable, and maintainable;
  - Oversee Scrum/Agile practices that keep sprint goals aligned
    with engineering and product commitments;
  - Lead effective retrospectives, turning what the team learns
    into process and culture improvements across the division;
  - Create project plans in partnership with product and other
    technical leaders, then guide projects through
    implementation by working with the team to understand and
    unblock issues and keeping leadership informed of project
    status; and
  - Identify process and technical challenges and drive
    solutions that improve both team effectiveness and team
    health.

  Provide Architectural & Technical Guidance

  - Partner with senior engineers to set the technical direction
    for the core data platform, weighing near-term delivery
    against long-term needs;
  - Ensure your team’s designs fit coherently within the broader
    data platform and Murmuration’s engineering architecture;
    and
  - Advocate for performance improvements and technical debt
    reduction alongside new feature work.

  Facilitate Cross-Team Communication & Collaboration

  - Work with product team members to clarify requirements and
    communicate tradeoffs among scope, timeline, and
    complexity;
  - Coordinate with other engineering teams on dependencies and
    shared systems so work integrates smoothly; and
  - Communicate team progress, risks, and blockers clearly and
    early to stakeholders and your manager.

  Requirements

  - 2+ years of experience managing a team of three or more
    software engineers;
  - Experience mentoring and growing engineers, as well as
    building inclusive, collaborative teams;
  - Experience leading projects from planning through delivery;
  - 5+ years of experience as an individual contributor,
    including data engineering experience;
  - Experience in both functional and object-oriented
    programming (e.g., Python, Scala, Java);
  - Production experience with the AWS data stack or equivalent
    (e.g., Lambda, ECS, Glue, Athena);
  - Experience with data pipeline development and orchestration
    (e.g., Airflow, Step Functions, Kafka);
  - Experience designing data architectures and data models with
    strong SQL and/or NoSQL experience;
  - Experience owning production data systems, including
    incident response and reliability; and
  - Experience with modern software delivery practices,
    including Git branching workflows, CI/CD pipelines, and
    automated testing and deployment.

  Nice to Haves

  - Familiarity with Voter File Data and other political data,
    and/or
  - A background in political tech, civic tech, advocacy, or
    mission-driven organizations.

  Talented Engineering Managers come from all walks of life
  and career. If you are passionate about civic engagement and
  technology, please apply, even if you do not check every
  box!

  Benefits

  Location and Compensation

  The Manager, Software Engineering role is a full-time,
  salaried position with a comprehensive benefits package
  (detail below), open to candidates anywhere in the United
  States.

  The starting salary for this position is $196,105. We set
  compensation using market data and apply it consistently
  across the organization to ensure fairness and transparency
  for everyone in similar roles.

  Our Culture of Care

  We work hard to create a culture of care to ensure that our
  staff are best equipped to lead happy, healthy, and balanced
  lives. To that end, we offer a comprehensive benefits
  package which includes:

  - Health, vision, and dental insurance with 100% of premiums
    covered for you and qualifying family members;
  - Retirement benefits with a 5% employer match;
  - A flexible unlimited PTO plan;
  - Generous paid parental leave;
  - Pre-tax commuter benefits;
  - A company laptop;
  - A flexible remote work environment;
  - A home office setup stipend for all new employees;
  - Monthly reimbursement for remote work expenses;
  - A yearly professional development fund;
  - Mental health and wellness benefits through Calm and Better
    Help;
  - Yearly in-person staff retreats; and
  - A welcoming culture that celebrates diversity, equity,
    inclusion, and belonging.

  At Murmuration, we believe a vibrant, representative
  democracy depends on the inclusion of diverse voices, lived
  experiences, and perspectives. The best ideas don’t come
  from a single person or ideology — they emerge at the
  intersection of different backgrounds, identities, and
  viewpoints. We are proud of our commitment to building an
  organization and culture shaped by respect, empathy, and
  collaboration, where our team’s diversity fuels innovation,
  civic engagement, and meaningful change. We welcome new
  colleagues who will help us nurture this collective effort.
  Join us.

  An Equal-Opportunity Employer with a Commitment to Diversity

  Murmuration is proud to be an equal opportunity employer,
  and as an organization committed to diversity and the
  perspective of all voices, we consider applicants equally of
  race, gender, color, sexual orientation, religion, marital
  status, disability, political affiliation and national
  origin. We reasonably accommodate staff members and/or
  applicants with disabilities, provided they are otherwise
  able to perform the essential functions of the job.

  Note: Murmuration is two organizations working together to
  pursue our mission of amplifying the power of civic
  engagement: Murmuration Research Institute, a 501(c)(3) that
  conducts research to identify, design, and create the data,
  tools, and insights that build healthier and more equitable
  communities; and Murmuration, Inc., a 501(c)(4) that
  supports organizations working across the country on the
  nation’s most challenging issues with access to data, tools,
  and research that build healthier and more equitable
  communities.
