description: |
  About us

  Sparrow is the first high-tech, high-touch employee leave
  management solution. Our mission is to make it simple for
  companies to provide their employees with all kinds of leave
  (i.e. family, medical, etc.).

  Currently, the leave management process is painful and
  inefficient for everyone. Company leaders struggle to keep
  up with regulations and processes that change frequently,
  and the employees going on leave are overwhelmed by
  bureaucracy at an exceptionally important juncture in their
  career. Sparrow transforms this ordinarily tedious, error-
  prone, complex to remain compliant, and time-consuming
  process into a 30-minute end-to-end experience saving teams
  time (20 - 40 hours per leave) and money (up to $30K per
  leave).

  Sparrow is headquartered in San Francisco but all employees
  work remotely across the country. Sparrow is a diverse,
  highly talented, and supportive team. Together, we are
  hardworking, collaborative, smart, and humble—after all,
  we’re solving real problems.

  As an early member of the engineering leadership team, you
  will have a significant opportunity to play a pivotal role
  in Sparrow’s growth and setting the direction and culture of
  the engineering team.

  About the Role

  We are growing quickly and looking for engineering leaders
  to join our team. In this role you will:

  - Hire, mentor, and develop a talented team of engineers
  - Shape critical team practices and process around onboarding,
    interviewing, planning, execution and more;
  - Lead the team in adopting AI-assisted development practices
    to accelerate how we design, build, test, and ship, while
    maintaining a high bar for quality, security, and
    reliability
  - Help identify opportunities to apply AI within the product
    itself, partnering with Product and Design to explore how
    it can simplify complex leave workflows and reduce manual
    work for employers and employees
  - Partner closely with Product, Design and teams across the
    company to understand user problems, clarify requirements,
    and translate them into an engineering roadmap;
  - Nurture and develop a team culture that values
    collaboration, engineering excellence, psychological
    safety, and pragmatic execution.

  About You

  We are looking for a product-minded hands-on technical
  leader who stays close to the customer and the details.
  You’ll empower engineers to do their best work while also
  diving into product and technical specifics to unblock
  progress and ship. You see AI as a practical force
  multiplier for engineering teams. You use it in your own
  work, you’ve helped teams adopt it thoughtfully, and you
  have a clear-eyed view of where it speeds things up and
  where human judgment still matters most.

  More specifically, we are looking for people with:

  - Bachelors degree or equivalent experience, with a minimum of
    7 years of experience with software development;
  - 5+ years of experience in a technical leadership role, with
    at least 2+ years of people management experience;
  - Proven track record of leading teams to successfully execute
    projects in dynamic environments;
  - Experience building strong and diverse engineering teams;
  - Strong written and verbal communication skills.
  - Hands-on experience using AI tools to build and ship
    production software, and a track record of helping teams
    integrate them into their day-to-day workflows
  - Familiarity with building AI-powered product features,
    including evaluating model outputs, handling edge cases,
    and designing for accuracy in domains where mistakes carry
    real consequences (a plus)

  Ultimately, though, most important to us is someone who is
  passionate about applying technology to real, difficult
  problems, who loves building beautiful useful products, and
  who finds our mission compelling. If that is you, please
  reach out to us!

  Compensation

  - This is a full-time salaried, exempt position. Compensation
    ranges from $180,000 to $220,000 and is based on your
    experience and legal state of residence.



  Why Sparrow?

  Our work at Sparrow is impactful. We help People teams with
  one of the hardest parts of their job, and we support
  employees at a time when they need it most. We’re driven by
  our mission, much like a nonprofit, but with the resources
  and scale of a fast-growing venture-backed company.

  Sparrow is proud to be an equal opportunity employer. While
  we are united by our excitement for the mission and product,
  the diversity of our experiences is one of our strengths.
  The Sparrow team is made up of people with all types of
  backgrounds, and we have teammates in 40 states and
  counting. To learn more about the Sparrow team and its
  benefits, check out our careers page.
