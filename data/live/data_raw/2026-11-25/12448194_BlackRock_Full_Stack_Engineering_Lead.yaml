description: |
  About this role

  You will join Aladdin Trading Engineering, a collaborative
  technology team building solutions that support investment
  and trading workflows. The team operates at the intersection
  of finance and technology, engineering systems with a focus
  on reliability, scalability, performance, and tangible
  business impact.

  Your role and impact

  You will help build and evolve BlackRock’s Aladdin platform,
  which supports investment, portfolio management, trading,
  risk analytics, and operations workflows for BlackRock and
  external financial institutions. As a Full Stack Engineer,
  you will design, develop, and maintain scalable web
  applications and backend services, collaborating with
  traders, product managers, and engineers to deliver
  impactful solutions. You will also troubleshoot complex
  technical challenges, optimize services and data pipelines,
  and provide technical leadership and mentorship.

  Your responsibilities

  In every role at BlackRock, you'll be expected to apply
  sound judgement and critical thinking to solve complex
  problems, adapt as the business evolves, and combine the
  curiosity to explore new approaches and technologies with
  the rigor to challenge the results. The scope of this role
  also includes the following responsibilities:

  - Design, develop, and maintain scalable web applications and
    backend services to support trading operations.
  - Collaborate with cross-functional teams including traders,
    product managers, and other engineers to define
    requirements and deliver solutions.
  - Implement and optimize high-performance application
    programming interfaces (APIs), microservices, and data
    processing pipelines.
  - Ensure best practices in code quality, testing, deployment,
    and security.
  - Troubleshoot and resolve technical issues across the full
    stack with a focus on reliability and efficiency.
  - Continuously research and adopt new technologies to improve
    team productivity and system performance.
  - Mentor junior engineers and contribute to a positive,
    innovative team culture.

  Your experience Minimum qualifications

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related technical field.
  - Experience leading and managing a team of engineers.
  - Minimum 7 years’ proven experience as a Full Stack Engineer,
    preferably in trading, finance, or similarly complex
    environments.
  - Strong proficiency in modern web frameworks such as React,
    Angular, or Vue.
  - Proven experience with object-oriented programming languages
    such as Java 17+ or TypeScript.
  - Expertise in designing and maintaining RESTful and GraphQL
    APIs.
  - Experience working with Structured Query Language (SQL) and
    NoSQL databases, including highly available distributed
    NoSQL data storage platforms and Ignite.
  - Experience with cloud platforms such as Amazon Web Services
    (AWS), Microsoft Azure, or Google Cloud Platform (GCP),
    Open Container Initiative (OCI) container image packaging
    and runtime, enterprise-grade container orchestration
    platforms supporting declarative infrastructure and
    horizontal scaling, and continuous integration and
    continuous delivery (CI/CD) pipelines.
  - Ability to communicate complex technical concepts clearly to
    both technical and non-technical stakeholders.
  - Strong understanding of the software development lifecycle,
    agile methodologies, and engineering best practices.
  - Strong understanding of design patterns in an enterprise
    environment.
  - Excellent problem-solving skills and an analytical mindset.

  Preferred qualifications

  - Prior experience working in trading or financial-services
    technology teams.
  - Knowledge of market data feeds, trading protocols, and low-
    latency systems.
  - Familiarity with data analytics and visualization tools.
  - Experience working with Spring Framework and Spring Boot web
    services.
  - Experience fostering a collaborative environment and driving
    projects to successful completion.
  - Strong leadership and mentorship skills to guide team
    members and support their professional growth.

  For New York, NY Only the salary range for this position is
  USD$162,000.00 - USD$210,000.00 . Additionally, employees
  are eligible for an annual discretionary bonus, and benefits
  including healthcare, leave benefits, and retirement
  benefits. BlackRock operates a pay-for-performance
  compensation philosophy and your total compensation may vary
  based on role, location, and firm, department and individual
  performance.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

