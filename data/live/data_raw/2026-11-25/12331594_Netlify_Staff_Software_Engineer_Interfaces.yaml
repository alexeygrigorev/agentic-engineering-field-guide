description: |
  About the Team

  As a Staff Software Engineer at Netlify, you'll join a
  collaborative team that values continuous learning, mutual
  support, and shared growth. Together, we create tools that
  help developers build faster, more intuitively, and with
  greater impact. Our Experience team owns the core product
  experience at Netlify, which is every way a human or an
  agent interacts with the platform, from our React-based web
  application to CLI, MCP, SDK, and API. If users interact
  with it directly, it's likely ours. We're reimagining how
  developers experience web development by thoughtfully
  integrating AI into our workflows - not as a novelty, but as
  a practical tool that enhances how we build the web.

  With our team, you'll help set technical direction for our
  product area, mentor a highly senior team of engineers, and
  shape user experiences that serve millions of developers.
  You'll work closely with Product, Design, and engineering
  leadership, and partner with teams across the organization
  to build, iterate, and scale meaningful solutions. You'll
  have the autonomy to guide what we build and how, and the
  influence to bring others along with you, all while staying
  hands-on in the codebase.

  We're looking for thoughtful engineers who enjoy owning
  problems end to end, collaborating across disciplines, and
  solving complex technical challenges for products that
  millions of developers rely on every day. AI is a
  foundational part of how we build, so we value engineers who
  are excited to thoughtfully incorporate AI-assisted
  workflows while continuing to apply strong engineering
  fundamentals. We believe the best engineering happens when
  talented people are trusted to solve difficult problems
  together, share what they're learning, and create space for
  different perspectives to shape better solutions.  With our
  team, you'll have real ownership from day one - not a tiny
  slice of a massive codebase. Engineers here are trusted to
  make decisions, shape technical direction, and move quickly
  while collaborating closely with Product and Design.

  What You'll Do

  - Use your deep expertise in full-stack development
    (TypeScript, JavaScript, Go, and React) to ship reliable,
    scalable, performant code across our product suite, and
    set the patterns that others on the team and across the
    org follow.
  - Own the technical direction for our product area, including
    the web app, CLI, MCP, SDK, API, and docs, by defining
    architecture and roadmap alongside your manager, Product,
    and Design, and make tradeoffs explicit so decisions are
    easy to understand and revisit
  - Lead large, ambiguous projects that span multiple teams from
    conception to delivery, such as our application rewrite
    and upcoming CLI rework, writing RFCs, driving alignment,
    and managing risk and timelines
  - Design and evolve user-facing features and product APIs for
    both humans and agents, recognizing that the best
    interface isn’t always a React application. Build them to
    scale to millions of developers worldwide, with a clear
    view of reliability, performance, and long-term
    maintainability.
  - Make thoughtful product and interface decisions on your own
    with the overall customer experience top of mind
  - Set the bar for engineering practices - testing,
    documentation, observability, and performance optimization
    - and lead how the team pragmatically uses AI tools,
    sharing what works and what doesn't
  - Turn ambiguity into clear plans, guiding both early-stage
    prototypes and production-ready applications that directly
    impact user experience and business metrics
  - Mentor and grow engineers through code reviews, design
    reviews, pairing, and sponsorship, raising the technical
    level of the whole team
  - Practice proactive async communication and create visibility
    across projects by documenting your workflows and
    decision-making clearly
  - Participate in on-call rotations, lead incident follow-up,
    and drive continuous improvement efforts that reduce
    technical debt and prevent recurring problems
  - Collaborate with cross-functional teams and engineering
    leadership to shape user flows that enhance the developer
    experience across our platform, and contribute to hiring
    and team growth

  What You'll Bring

  - Deep expertise in TypeScript and JavaScript, with a long
    track record of designing, shipping, and maintaining
    production-quality software in modern full-stack
    environments
  - A history of building interfaces developers use directly,
    such as web apps, CLIs, APIs, SDKs, or other dev tools,
    and a strong sense of what works well for developers (and,
    by extension, agents)
  - Passion for building strong user-facing experiences,
    including working with React and modern frontend
    architecture and making architectural decisions that hold
    up as products and teams grow, paired with the backend
    knowledge to design software well beyond the UI
  - Strong product and design instincts. This isn’t about visual
    polish - it’s about making thoughtful decisions about how
    users interact with a product.
  - Strong proficiency with Go and/or Ruby for backend services
    and API development, with a thoughtful approach to
    reliability and performance
  - Hands-on experience with React and modern frontend
    architecture, including making architectural decisions
    that hold up as products and teams grow
  - Demonstrated ability to raise the technical bar: providing
    direction to senior and staff-level engineers,
    distributing ownership, mentoring, shaping standards, and
    influencing decisions beyond your own team
  - Extensive experience delivering features and services that
    serve large user bases, including designing for scale and
    operating systems in production
  - A track record of leading technically complex, cross-team
    projects from ambiguous problem to shipped outcome,
    including writing RFCs and building consensus
  - Demonstrated ability to raise the technical bar: mentoring
    senior and mid-level engineers, shaping standards, and
    influencing decisions beyond your own team
  - Experience writing high-quality, testable code that's
    reliable and maintainable over time, and setting that
    expectation for others
  - Proficiency using and experimenting with AI-assisted
    development tools, with sound judgment about when and how
    to apply them and the ability to help others do the same
  - Experience contributing to open-source projects or working
    in public codebases is a plus
  - Strong written and verbal communication skills, especially
    in asynchronous, remote-first environments, with the
    ability to explain tradeoffs to engineers, leadership, and
    non-technical partners
  - Critical thinking abilities and a solution-oriented approach
    to complex technical challenges, with the judgment to
    prioritize and say no when needed
  - A collaborative approach to problem-solving with curiosity
    about how your work supports teammates, users, and broader
    goals
  - Growth mindset and openness to learning new tools,
    technologies, and best practices
  - Passion for working in a collaborative environment with
    diverse teams across distributed locations

  This Role is a Great Fit If

  - You're energized by building user-facing products and
    features that directly impact millions of developers'
    daily workflows
  - You thrive in collaborative environments, working closely
    with your team and cross-functionally to turn ideas into
    reality
  - You enjoy the autonomy and influence of staff-level work -
    setting technical direction, writing RFCs, and driving
    decisions across teams while staying connected to the
    people doing the work
  - You find satisfaction in making other engineers better,
    whether through mentoring, design reviews, or setting a
    clear example
  - You see ambiguity as a creative opportunity and can navigate
    uncertainty to build practical solutions and bring clarity
    to others
  - You see AI as a multiplier for your skills, not a shortcut,
    and can articulate where it helps, where it doesn't, and
    how you use it
  - You're excited by new tools, challenges, and opportunities
    to grow, even when they feel a little uncomfortable at
    first
  - You want to work on a fully remote team that believes in
    autonomy, transparency, and building a better web,
    together

  Applying

  Not sure you meet 100% of our qualifications? Please apply
  anyway!

  When applying please include:

  A resume or short listing of your job history & skills (link
  to a LinkedIn profile would be fine). We appreciate a cover
  letter explaining why you would enjoy working in this role
  at Netlify to get to know you a bit better, though this is
  not required and will not impact your application. Our
  mission is to “build a better web” and that cannot be done
  without a diversity of skill sets, backgrounds and thoughts.

  Of everything we've ever built at Netlify, we are most proud
  of our team. Netlify is an Equal Opportunity Employer. We
  are devoted to building a team of people with diverse
  backgrounds and lifestyles. Driving equality empowers our
  team, enables us to innovate, and helps us maintain a more
  inclusive environment. We don’t discriminate against
  employees or applicants based on gender identity or
  expression, sexual orientation, religion, age, race,
  military/veteran status, citizenship, pregnancy status, or
  any other differences. If we can do anything to provide a
  better interview, i.e. accommodate a disability, then please
  let us know by emailing accommodations@netlify.com.

  About Netlify

  Netlify is a platform that lets you create, share, and run
  anything on the web: a website, an app, an agent experience,
  whatever you can dream up. Use your own tools or ours to
  build it, collaborate with your team, get it live, and keep
  it running. Anyone, from people just starting out to
  seasoned developers, can create pro-level web experiences
  that really work, really well.

  We are a Series D company that has raised over $200M from
  investors such as Andreessen Horowitz, Kleiner Perkins, EQT,
  Bessemer, BOND, and Menlo Ventures. As a fully distributed
  company, we aim to create a company culture where the best
  idea can come from anywhere and strive to be thoughtful,
  compassionate, and collaborative in our work. If this sounds
  like something you’d like to be part of, we’re excited to
  connect with you!

  At Netlify, we are committed to a compensation philosophy
  that prioritizes fairness and equity, positions our employee
  compensation competitively in the market, recognizes and
  rewards performance, and takes a comprehensive approach to
  our rewards package. We anchor our compensation philosophy
  on a market-based approach, therefore salary ranges may
  differ depending on the labor cost in a particular location.
  The salary provided is in addition to robust benefits and
  participation in Netlify’s equity plan. Our hiring range for
  this role is targeted at $182,000 - $248,000 for most US-
  based locations, $175,000 - $235,000 CAD in most Canada-
  based locations, and £105,000 – £144,000 GBP for most UK-
  based locations.  Candidates outside the US, Canada, UK, or
  in premium markets should consult with their Talent
  Acquisition partner regarding location-based ranges, as they
  may be higher or lower than the average US range listed. The
  starting pay will be determined based on multiple factors,
  including expertise and skills, market demands, experience,
  internal equity, and applicable geographic location. These
  compensation packages and ranges are subject to change and
  may be modified in the future.
