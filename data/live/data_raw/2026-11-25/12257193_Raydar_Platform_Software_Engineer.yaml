description: |
  About the company

  Our client is a software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and grow the server-side infrastructure that logs
  customer activity and supports invoicing. The work centers
  on data accuracy when records arrive delayed, reordered or
  repeated, on steady service response times across
  interactive and offline workloads, and on reporting screens
  that stay quick as stored history expands.

  What you'll do

  - Engineer counting logic so each usage record is captured one
    time despite delayed, reordered or duplicated inputs.

  - Tune service response times for both interactive calls and
    large offline workloads so neither degrades the other.

  - Verify that invoiced amounts line up with the usage actually
    logged for each account.

  - Improve the speed of usage dashboards as stored history
    grows larger.

  - Contribute to server-side infrastructure alongside the
    company's technical and executive leadership.

  Requirements

  What we're looking for

  - 4 to 7 years of software engineering experience.

  - Experience building and scaling core backend systems at an
    early-stage startup.

  - Track record of carrying server-side software from design
    through live operation, serving several million requests
    daily.

  - Hands-on experience with Python and a relational or cache
    data store.

  - Working knowledge of Next.js or React.

  Bonus points

  - Prior experience as a startup founder.

  - Experience with AI systems, payments integrations, or
    developer-facing APIs or SDKs.

  Benefits

  Compensation and benefits

  - Base salary: USD 210,000 to 240,000 per year

  - Equity

  - Health, dental and vision coverage

  Location and work model

  - New York, NY, United States

  - On-site

  - Full-time
