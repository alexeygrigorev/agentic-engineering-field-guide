description: |
  If you are interested in exploring more about potential
  opportunities with JLL as part of this transition, we invite
  you to register your interest by completing this Getting to
  Know You (GTKY) application.

  Submitting this information allows our team to better
  understand your background, skills, and career interests.
  Completing the application is an important first step in the
  transition process. A member of the JLL team will reach out
  to those who complete an application to schedule a 1:1
  conversation to further discuss your current role and
  responsibilities on account.

  This transition represents a unique opportunity to continue
  delivering excellence for our client while learning more
  about JLL as a global leader in real estate services. We
  appreciate your interest, and we look forward to getting to
  know you and discussing how your expertise can contribute to
  our shared success!

  JLL empowers you to shape a brighter way.

  Our people at JLL are shaping the future of real estate for
  a better world by combining world class services, advisory
  and technology for our clients. We are committed to hiring
  the best, most talented people and empowering them to
  thrive, grow meaningful careers and to find a place where
  they belong.  Whether you’ve got deep experience in
  commercial real estate, skilled trades or technology, or
  you’re looking to apply your relevant experience to a new
  industry, join our team as we help shape a brighter way
  forward.

  JLL recognizes the impact that the workplace can have on
  your wellness, so we offer a supportive culture and
  comprehensive benefits package that prioritizes mental,
  physical and emotional health. Some of these benefits may
  include:

  - Retirement Planning
  - Comprehensive Medical, Dental & Vision Care
  - Paid Parental Leave
  - Paid Time Off and Company Holidays

  At JLL, we harness the power of artificial intelligence (AI)
  to efficiently accelerate meaningful connections between
  candidates and opportunities. Using AI capabilities, we
  analyze your application for relevant skills, experiences,
  and qualifications to generate valuable insights about how
  your unique profile aligns with the specific requirements of
  the role you're pursuing.

  JLL Privacy Notice

  Jones Lang LaSalle (JLL), together with its subsidiaries and
  affiliates, is a leading global provider of real estate and
  investment management services. We take our responsibility
  to protect the personal information provided to us
  seriously. Generally the personal information we collect
  from you are for the purposes of processing in connection
  with JLL’s recruitment process. We endeavour to keep your
  personal information secure with appropriate level of
  security and keep for as long as we need it for legitimate
  business or legal reasons. We will then delete it safely and
  securely.

  For more information about how JLL processes your personal
