description: |
  Overview

  Summary

  Karsun Solutions is actively looking to support a
  modernization of digital services and accelerate delivery of
  healthcare and benefits programs for Veterans at the
  Department of Veterans Affairs. Candidates will support a
  program focused on expanding the Digital Transformation
  Center’s ability to deliver enterprise applications using
  modern development frameworks, low code and no code
  platforms, and cloud based SaaS and PaaS environments. The
  objective is to deliver digital capabilities that support
  both Veteran healthcare services and benefits programs.

  The program supports multiple concurrent low code/no code
  products serving a wide-range of users, while maintaining
  reliability, security, and delivery speed across a complex
  enterprise platform environment.

  This position is a contingent opportunity. Prefer candidates
  local to the DMV Area and willing to be onsite two days per
  week.

  Responsibilities

  What You'll Be Doing:

  - Solution Architecture & Engineering: Lead technical design
    for modular, reusable, platform-agnostic solutions across
    the DTC PaaS and SaaS platforms (Salesforce/MuleSoft,
    Microsoft Power Platform/Dynamics, Pega, Box, Appian),
    including APIs and SaaS integrations.
  - Team Planning: Translate prioritized agile requirements into
    technical designs, estimates, and Definitions of Done with
    scrum teams, DTC Platform Leads, and VA product owners.
  - Quality Gates and Standards: Prepare solutions to pass DTC
    solution architecture, security architecture, and release
    management approval gates. Contribute to the quarterly
    revisions of DTC platform-specific standards.
  - DevOps and AI-Assisted Delivery: Build and maintain cloud
    DevOps pipelines in GitHub. Apply AI-assisted code
    generation, automated testing, and code quality analysis,
    with human oversight and accountability for every
    deliverable.
  - Technical Debt and Sustainment: Lead remediation plans for
    non-conformance exceptions found during the 90-day product
    warranty. Prepare modules for transition to sustainment.
  - Compliance: Build in Section 508, HIPAA, FedRAMP, and ATO
    requirements from design onward.
  - Technical Leadership: Mentor engineers across the delivery
    teams. Serve as technical point of contact to DTC Platform
    Leads.

  Qualifications and Education

  Required Qualifications:

  - Bachelor’s degree in Computer Science, Information Systems,
    Business Administration, Business Management, Information
    Resource Management, Industrial Engineering, Operations
    Research, or a related field, plus a minimum of 10 years
    of relevant experience. 10 years of relevant experience
    may substitute for the degree.
  - Demonstrated knowledge and use of modern software
    development and DevOps tools, including GitHub, and
    implementation of a DevOps pipeline in a cloud
    environment.
  - Chief Architect or Senior Engineer on a production system in
    a commercial cloud service provider (CSP) environment.
  - Experience as a Software Engineer on at least one project in
    a CSP environment.
  - Experience delivering on Appian, Pega, or Box, and
    familiarity with Salesforce/MuleSoft and Microsoft Power
    Platform, including integration through APIs and reusable
    software components.
  - Ability to obtain and maintain a VA Public Trust background
    investigation.
  - Available on contract award and willing to sign a letter of
    commitment.

  Compensation

  The proposed salary range for this role is $****** to
  $******* USD. The salary range provided is a good faith
  estimate representative of all experience levels. Karsun
  considers several factors when extending an offer, including
  but not limited to, the role, function and associated
  responsibilities, a candidate’s work experience, location,
  education/training, and key skills.
