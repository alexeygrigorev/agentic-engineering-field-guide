description: |
  Software Developer

  Location: UK / Remote (occasional travel may be required)
  Clearance: Active Security Clearance (SC) essential
  Contract: Perm

  About the Role

  Olive Jar Digital is looking for an experienced Software
  Developer with strong Python and Django expertise to join a
  growing digital delivery team.

  You'll be responsible for developing, maintaining and
  improving high-quality software solutions, working closely
  with other developers, technical leads and delivery
  professionals to build scalable, secure and user-focused
  applications.

  This is an opportunity to contribute to technically
  challenging projects, working within an agile environment
  and delivering modern digital solutions.

  Key Responsibilities

  - Design, develop and maintain applications using Python and
    Django.
  - Build and maintain robust, scalable backend services and
    APIs.
  - Write clean, maintainable and well-tested code.
  - Work collaboratively with developers, designers and
    technical stakeholders.
  - Contribute to code reviews and support continuous
    improvement of development practices.
  - Troubleshoot, debug and resolve technical issues.
  - Work with version control and CI/CD pipelines.
  - Ensure solutions meet security, performance and quality
    standards.

  Essential Experience & Skills

  - Strong commercial experience developing applications using
    Python.
  - Hands-on experience with the Django framework.
  - Experience building and integrating REST APIs.
  - Good understanding of software engineering principles and
    best practices.
  - Experience working with relational databases and SQL.
  - Familiarity with Git and collaborative development
    workflows.
  - Experience working in Agile delivery environments.
  - Must hold active Security Check (SC) clearance.

  Desirable Experience

  - Experience with cloud platforms and cloud-based development.
  - Familiarity with Docker and containerisation.
  - Experience with automated testing and CI/CD pipelines.
  - Knowledge of secure software development practices.

  Why Join Olive Jar Digital?

  At Olive Jar Digital, we connect talented technology
  professionals with meaningful digital projects. You'll have
  the opportunity to work alongside experienced teams,
  contribute to modern software solutions and develop your
  technical expertise.

  Interested?

  If you have strong Python and Django experience and
  currently hold active SC clearance, we'd love to hear from
  you.

  Apply today or get in touch with the Olive Jar Digital
  recruitment team to find out more.
