description: |
  Join the company that’s building the telemetry
  infrastructure for the AI era. At Cribl, we partner with IT
  and Security teams at many of the world’s biggest
  enterprises, including half of the Fortune 100, to bridge
  the gap between AI ambition and infrastructure reality. As
  the AI Platform for Telemetry, we give customers the choice,
  control, and flexibility to manage and analyze telemetry for
  both humans and agents, so they can build what’s next.

  We’re one of the fastest‑growing private companies and a
  leading player in a massive, fast‑moving market. With a
  global workforce, we’re remote‑first and grounded in a
  simple idea: software is a people business. Cribl is the
  place where curious, collaborative people can do their best
  work, grow fast, and bring their full selves to the herd.

  Why You’ll Love This Role

  Cribl Stream unlocks the value of all machine data by giving
  users a new level of observability, intelligence, and
  control over real-time data. We’re looking for a Staff
  Software Engineer to help shape the systems that let
  customers operate Cribl Stream reliably and confidently at
  scale.

  As a Staff Software Engineer on the Stream Control Plane
  team,you will be a technical expert working alongside
  skilled engineers as part of a cross functional team that
  delivers highly reliable and scalable software to drive
  customer value and satisfaction. You’ll help set technical
  direction for the deployment, configuration, and
  orchestration of distributed nodes, improving the
  scalability, resilience, security, and operability of the
  platform.

  This is a fully remote role, and Cribl is a remote-first
  company. Our culture embraces the diversity of team members
  across the globe.

  As An Active Member Of Our Team, You Will…

  - Design, build, and evolve the services and APIs that power
    reliable deployment, configuration, and orchestration of
    Cribl Stream’s distributed nodes at scale.
  - Lead the technical approach for systems that must meet
    demanding availability, performance, scalability, and
    operational requirements, while balancing delivery speed
    and maintainability.
  - Partner with engineers, product managers, and designers to
    turn product requirements into practical technical designs
    and high-quality implementations
  - Stay hands-on: prototype, implement, review, test, and
    troubleshoot critical parts of the system, and help teams
    navigate complex technical problems.
  - Raise the quality of engineering design and execution
    through thoughtful design reviews, code reviews, testing
    strategies, and reusable patterns.
  - Improve the reliability and operability of production
    services through observability, capacity and performance
    improvements, incident learning, and automation.
  - Mentor and coach engineers, helping strengthen technical
    judgment, ownership, and engineering practices across the
    team.
  - Use AI-assisted tools and agentic workflows effectively in
    development, debugging, testing, and operational work,
    applying sound engineering judgment to their use.
  - Help maintain and support our SaaS offerings, including
    participation in a 24x7 on-call rotation and occasional
    stand-by, on-call, or off-hours responsibilities as
    needed.

  If You’ve Got It - We Want It

  - Applicants must be able to comply with U.S. government
    security requirements for access to FedRAMP-authorized
    systems, which may include U.S. citizenship and US
    residence.
  - BS in CS/EE with 7+ years of experience or MS with 4+ years
  - Strong hands-on software development experience delivering
    production systems and customer-facing capabilities in
    cloud environments such as AWS, GCP, or Azure.
  - Significant experience designing, building, and operating
    production APIs and services, such as REST or RPC
    interfaces.
  - Strong coding experience with Node.js, TypeScript, and
    JavaScript, or the ability to contribute effectively in a
    comparable modern programming ecosystem.
  - Experience with production operations, including on-call
    participation, incident response, and using operational
    feedback to improve system resilience.
  - Knowledge of or experience with data streaming and
    transformation, high-volume telemetry, logs, metrics, or
    observability systems.
  - Excellent written and verbal communication skills, with the
    ability to explain complex technical topics and build
    alignment in remote, distributed teams.
  - A track record of ownership, sound technical judgment, and
    delivering durable outcomes in fast-paced, collaborative
    environments.
  - Comfortable working in an AI-native, agentic engineering
    environment and using AI-assisted tools to improve
    productivity, code quality, and customer outcomes.

  #LI-EL1 #LI-Remote

  The salary for this role is dependent on geographic location
  and will be based on the individual candidate's job-related
  knowledge, skills, and experience. In addition to base
  salary, for sales and some sales-adjacent roles, employees
  are eligible to earn incentive compensation (commission).
  For all other roles, employees are eligible to participate
  in the Cribl Corporate Bonus Program. In addition to a
  competitive salary, Cribl also offers a generous benefits
  package which includes health, dental, vision, short-term
  disability, and life insurance, paid holidays and paid time
  off, a fertility treatment benefit, 401(k), and equity.

  Base Salary Range

  $200,000—$240,000 USD

  Bring Your Whole Self

  Diversity drives innovation, enables better decisions to
  support our customers, and inspires change for the better.
  We’re building a culture where differences are valued and
  welcomed, and we work together to bring out the best in each
  other. All qualified applicants will receive consideration
  for employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which the candidate is applying.

  Interested in joining the Cribl herd? Learn more about the
  smartest, funniest, most passionate goats you’ll ever meet
  at cribl.io/about-us.
