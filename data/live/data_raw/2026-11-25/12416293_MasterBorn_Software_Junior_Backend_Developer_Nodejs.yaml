description: |
  We're looking for a Junior Backend Developer to help build
  and improve applications for our US clients - from early-
  stage MVPs to established products in FinTech, SportsTech,
  MedTech, and other industries.

  TypeScript, Node.js, and React are our bread and butter. We
  value solid fundamentals, curiosity, and a willingness to
  learn how applications work beyond a particular framework.

  We're building a team of engineers who can contribute across
  the application while developing deep expertise in backend
  or frontend engineering. In this role, backend is your
  primary discipline, and you'll broaden your contribution
  across the stack as your experience grows. You'll build this
  foundation with support from experienced teammates.

  AI-assisted development is part of this role. You'll learn
  to use coding assistants for exploration, implementation,
  and debugging, while building the skills to understand their
  suggestions, check the results, and recognise when to ask
  for help.

  Contract summary:

  - Rate: PLN 6.000 - 10.000 + VAT (B2B); PLN 6.000 - 8.300
    brutto (UZL)
  - Contract: B2B/UZL, paid days off, 100% remote (or
    hybrid/onsite - as you prefer), Polish time zone, Europe-
    based, flexible hours, full-time position, long-term
    contract, Scrum Teams and more
  - Perks and Benefits: 3,000 PLN annual training budget,
    Multisport, Luxmed, Cafeteria Platform, Tech-talks,
    Learning sessions, and more
  - Tools you’ll use: Apple MacBook Pro, Slack, GSuite, GitHub,
    Jira, Coda, FigJam, Claude Code

  Your future tasks:

  - Develop application features and fix bugs, working on
    clearly defined tasks with support from experienced
    developers
  - Implement API endpoints and business logic, learning what
    correct error handling and data integrity look like in
    practice
  - Work with relational databases - queries, migrations, simple
    schema changes - and learn how the backend, data, and
    frontend work together
  - Gradually contribute to frontend tasks, such as connecting a
    screen to your API or small UI changes, with guidance and
    code review
  - Use AI coding assistants to explore approaches, understand
    unfamiliar code, and support implementation - checking
    their suggestions and discussing anything you're unsure
    about
  - Write readable code following team standards and verify your
    changes
  - Run existing automated tests and add tests for your changes
    with guidance
  - Learn how changes move from a pull request to a deployed
    application, using the team's automated checks and
    deployment workflow with support
  - Collaborate with developers, QA, designers, and product
    owners to understand requirements and deliver features
  - Participate in code reviews, apply feedback, document your
    work, and share what you learn

  About you - Tech skills & Experience:

  - Around 1 year of commercial experience in web development
  - Solid JavaScript fundamentals and working knowledge of
    TypeScript - you use it in your daily work, not only in
    tutorials
  - Hands-on experience with a Node.js backend framework (e.g.
    Express, NestJS, Fastify) - building endpoints that
    validate input, store data, and return it to a frontend
  - Basic understanding of HTTP and how a backend communicates
    with frontends and other services
  - Experience with a SQL database through an ORM or query
    builder (e.g. Prisma, Knex, TypeORM, Drizzle) and a basic
    understanding of SQL itself
  - Understanding of why automated tests matter and first
    experience writing them
  - Ability to investigate straightforward issues using logs,
    error messages, a debugger, and documentation
  - Familiarity with Git and running applications locally using
    standard development tools
  - Some experience using AI coding assistants for learning or
    development, with a habit of checking their output and
    understanding code before using it

  About you - Soft Skills:

  - English at B2 or above for international collaboration
  - Polish at C1 or above for daily team communication
  - Curious about user needs and why a feature matters
  - Ask questions, share progress, and raise blockers when you
    need help
  - You welcome feedback and use it to improve your work
  - Comfortable acknowledging knowledge gaps and working through
    them with your teammates
  - Open to learning new tools and gradually exploring frontend
    development
  - Ready to work closely with mentors while building
    independence and contributing to an Agile/Scrum team

  Nice to have:

  - Experience writing unit or API tests for a real project
  - Exposure to frontend development (React preferred, but any
    framework counts)
  - Experience with a framework that combines frontend and
    server-side development (e.g. Next.js, Remix)
  - Experience taking a personal or commercial application from
    an idea to a working deployment
  - Basic familiarity with cloud services, Docker, or
    configuring CI/CD pipelines
  - Exposure to queues, background jobs, or caching (e.g. SQS,
    BullMQ, Redis)

  Recruitment Process:

  - CV Review
  - Phone call with our Recruiter (15min)
  - Technical task (3h)
  - Soft-skills interview with our Recruiter (30min)
  - Technical interview with our Specialist (1,5h)
  - Decision and feedback 🥳







  Meaningful projects, top-notch experts and value-driven
  workplace

  Sound good?

  Apply now!
