description: |
  Job Description Summary

  Job Description

  Role Scope:

  The Manager, Talent Acquisition- Central Europe-
  Engineering, Software & Tech will play a pivotal role in
  driving the success of the organization’s talent acquisition
  efforts, aligning with the strategic goals set by their
  Senior Manager, TA- Central Europe and Regional Talent
  Acquisition Leader- EMEA.

  This role is responsible for managing end-to-end recruitment
  processes, supporting business leaders, and ensuring the
  attraction and selection of top talent across assigned
  regions.

  The Manager, Talent Acquisition will lead recruitment
  activities, optimize processes, and collaborate closely with
  HR business partners and hiring managers to meet hiring
  targets while maintaining a high level of candidate
  experience.

  Key Responsibilities

  - Manage Full-Cycle Recruitment: Lead and oversee the
    recruitment process ensuring the hiring of top talent
    through effective sourcing, screening, and selection
    methods. Support both volume and strategic hiring efforts
    for key positions across multiple functions and levels for
    assigned region.

  - Collaborate with Business Leaders: Work closely with HR
    business partners, hiring managers, and senior leadership
    to understand hiring needs and develop effective
    recruitment strategies that align with business goals.

  - Lead and Develop Recruitment Team: Supervise and mentor a
    team of recruiters, ensuring high performance, continuous
    development, and alignment with recruitment objectives.
    Foster a team environment focused on collaboration,
    excellence, and proactive problem-solving.

  - Attract and Source Talent: Implement targeted sourcing
    strategies to build inclusive talent pipelines and
    leverage innovative recruitment tools and channels.
    Partner with the Talent Attraction team to execute
    employer branding initiatives that attract top talent.

  - Optimize Recruitment Processes: Continuously evaluate and
    suggest improvements to recruitment processes to enhance
    efficiency, candidate experience, and time-to-fill
    metrics. Identify opportunities for streamlining and
    eliminating inefficiencies.

  - Utilize Data and Metrics: Track, analyze, and report on
    recruitment metrics to measure the effectiveness of
    recruitment efforts, identify trends, and recommend
    improvements. Use data-driven insights to optimize
    strategies and improve recruitment outcomes.

  - Foster Cross-Regional Collaboration: Ensure functional
    recruiting alignment and consistency across regions by
    collaborating with Talent Acquisition Managers and teams
    in other regions to share best practices, processes, and
    tools.

  - Manage External Partners: Oversee relationships with
    recruitment agencies, contractors, and other external
    vendors to support sourcing and hiring efforts as
    necessary. Ensure external partnerships align with
    business needs and recruitment goals.

  - Ensure Compliance: Maintain knowledge of local, regional,
    and global employment laws and regulations, ensuring
    recruitment processes comply with relevant legal
    requirements and internal policies.

  - Provide Insights to Leadership: Act as a key advisor to
    senior leadership on recruitment trends, labor market
    conditions, and competitive insights, ensuring talent
    acquisition strategies are proactive and aligned with
    organizational needs.

  Experience and Skills Required

  - At least significant experience in talent acquisition or
    recruitment, with a proven track record of managing
    recruitment efforts across multiple regions and functions.

  - Experience leading or mentoring teams of recruiters, with a
    focus on coaching, development, and performance
    management.

  - Strong knowledge of recruitment strategies, including the
    use of social media, job boards, and professional networks
    to attract talent.

  - Ability to develop and implement recruitment plans aligned
    with organizational goals and objectives.

  - Proven ability to build strong relationships with business
    leaders, HR partners, hiring managers, and external
    vendors.

  - Experience advising and influencing key stakeholders on
    talent acquisition strategies and recruitment best
    practices.

  - Strong experience using recruitment metrics and data
    analytics to track performance, identify areas for
    improvement, and implement solutions.

  - Ability to leverage labor market insights and internal data
    to make informed decisions about sourcing and hiring.

  - A solution-oriented mindset with the ability to adapt to
    changing business needs and leverage innovative
    recruitment technologies and methods.

  - Knowledge of local, regional, and global employment laws,
    ensuring recruitment practices comply with all relevant
    regulations.

  - Excellent verbal and written communication skills, with the
    ability to effectively present recruitment strategies,
    provide updates, and engage stakeholders at all levels.

  - Fluency in English and German is required.

  Additional Information

  Relocation Assistance Provided: No

