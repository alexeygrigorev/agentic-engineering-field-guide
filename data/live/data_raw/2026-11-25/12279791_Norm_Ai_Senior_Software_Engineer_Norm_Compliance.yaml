description: |
  About Norm

  Norm builds AI-native professional services firms and the
  technology that powers them. Our mission is to help expert
  professionals deliver better work at greater scale.

  Developing the technology and the firms together lets us
  rethink how work gets done, how teams operate and what
  clients can expect. Professional judgment and experience
  guide what we build, while advances in the technology expand
  what our firms can deliver. Our shared agentic platform
  connects that progress across teams and services.

  Founded in 2023, Norm brings together experts across
  engineering, research, product, design and professional
  practice. Our legal and compliance platform serves
  institutions representing more than $35 trillion in combined
  assets under management.

  Norm also powers Norm Law, LLP, an affiliated AI-native law
  firm whose attorneys advise leading institutions on complex
  corporate matters. AI Fluency: Norm prefers all team members
  to be fluent in AI. Successful candidates actively use AI in
  their day-to-day work to support thinking, creation, and
  problem-solving. They use it to improve the quality and
  speed of their work and to continuously refine how work gets
  done end-to-end. Candidates should be prepared to
  demonstrate and discuss their AI usage throughout the
  interview process, including concrete examples of tools,
  workflows, and outcomes. We look for practical, hands-on
  experience, not theoretical familiarity.

  This Role

  We are hiring Senior Software Engineers for Norm Compliance,
  the team that owns Norm's compliance platform for asset
  managers: the product behind marketing and content review at
  large financial institutions. The team is fully remote in
  the US, up to eight engineers, and owns the platform end to
  end: the code, the AI that does the reviewing, the
  infrastructure it runs on, and the clients it serves.

  Most senior seats are full stack: each owns a group of our
  clients end to end (their features, intake forms and
  settings, SSO and SCIM, integrations and bug fixes,
  onboarding new clients on existing patterns, and a written
  account of where each client stands) plus one or more of the
  platform's shared surfaces. The Applied AI seat builds and
  runs the regression tooling, ships prompt and pipeline
  changes per client, and owns the quality of document
  processing, the input to every review. The Platform seat
  owns observability and the health baseline, the
  infrastructure we deploy into client environments, the
  external services the product depends on, and upgrades. The
  Applied AI and Platform engineers are full-stack engineers
  too, and ship product work every week.

  How You'll Work

  The team reports to the General Manager of Norm Compliance.
  Day to day you work with a product manager who owns the
  backlog and our commitments to clients, and with a client
  engagement/deployment strategy team that owns the
  relationships. You will ramp with the engineer who owns your
  clients or your domain today; after that they are yours.

  You Will

  - Ship committed features from estimate to production,
    whichever seat you hold, in Python (FastAPI, SQLAlchemy)
    and TypeScript (React, Next.js) on Postgres and AWS, and
    deploy through the pipeline.
  - Write the technical page for each of your clients (the
    written account of where they stand) and answer their
    technical questions in writing or through meetings, along
    the client engagement/deployment strategy team.
  - Full stack: own your clients' intake forms, configuration,
    SSO and SCIM, and integrations, and simplify the client-
    specific code you inherit; triage and fix their bugs;
    onboard a new client on an existing pattern with the
    client engagement/deployment strategy team; own one or
    more shared surfaces (the Microsoft Office add-in, the
    public API and webhooks, regulatory filing, data exchange,
    analytics or an integration).
  - Applied AI: build and run the regression suites' tooling;
    ship prompt and pipeline changes per client through the
    evaluation gate as it comes online; own document-
    processing quality (extraction from PDF, Word, PowerPoint
    and Excel); tune a new client's review flow on an existing
    pattern.
  - Platform: own the health baseline, its dashboards and
    alerts; make and apply changes to the infrastructure we
    deploy into client environments; own the external consoles
    and credentials the product depends on; run upgrades as
    routine work; share platform on-call.

  Skills & Experience - Core

  - Bachelor's or Master's in computer science or an equivalent
    field, or equivalent practical experience
  - 5+ years of experience writing application-layer Python for
    production use, and 2+ years writing React + TypeScript,
    or similar, for production use
  - Experience writing APIs using a framework such as FastAPI or
    similar, with a Postgres database or similar
  - Experience shipping in a large codebase within the last
    year, and clear, brief writing
  - Full stack: experience working directly with enterprise
    clients' requirements, and negotiating scope with them
  - Applied AI: 2+ years on LLM-backed production features;
    experience building or maintaining evaluation suites
  - Platform: AWS and Terraform in production; observability
    (Datadog or similar); CI/CD; experience owning an on-call
    rotation and making it quieter; care with secrets and
    access

  Skills & Experience - Pluses

  - Experience with financial-services or compliance products
  - Experience working with PDFs, Excel, or file-driven
    products; configurable UIs tied to editable schemas; SSO
    and SCIM; Microsoft Office add-ins
  - Applied AI: document extraction and OCR pipelines; retrieval
    systems
  - Platform: Terraform modules delivered into customer
    accounts; Kubernetes; SOC 2 evidence work

  What Success Looks Like - 90 Days

  - You have shipped to production with code review from the
    team
  - Full stack: you own your clients' committed features and
    technical pages, and run them on your own
  - Applied AI: you own the regression sets for two large
    clients
  - Platform: you are maintaining an overall stable and up-to-
    date platform

  Comp and Benefits

  $170,000 - $225,000 a year plus equity.

  The range displayed in this job posting reflects the minimum
  and maximum target for new hire salary for this position.
  Within the range, individual pay is determined by various
  factors, including job-related skills (as uncovered during
  the interview process), experience, and relevant education
  or training. Please note that the compensation details
  listed here reflect the base salary only, and do not include
  equity or benefits. We offer a competitive salary along with
  equity compensation. Our comprehensive benefits package
  includes a 401(k) plan with an employer match. Employees
  enjoy top-tier insurance coverage, encompassing health,
  dental, hospital, accident, and vision plans. You'll thrive
  in our fast-paced learning environment where professional
  growth is constant.

  This role is fully remote within the United States, with
  core hours on US Eastern time. You will start in our New
  York office at One World Trade Center. Norm employment, US
  residency and work performed from the US are conditions of
  the role; because our clients are financial institutions,
  offers are conditional on a background check, including
  E-Verify. Visa sponsorship is not offered for these
  positions.

  If you're interested in the role but aren't sure whether
  you're a good fit, we'd still like to hear from you.

  To learn more about Norm, visit our website.
