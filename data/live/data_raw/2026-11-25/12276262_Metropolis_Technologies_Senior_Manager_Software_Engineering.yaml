description: |
  Who we are

  The real world is the next frontier, and at Metropolis, we
  are creating the artificial intelligence to make it
  responsive. We are pioneering the Recognition Economy — a
  future where mundane repetition disappears and being known
  unlocks access, comfort, and belonging everywhere you go.
  From transforming parking into a seamless drive-in, drive-
  out experience for millions of Members to expanding our
  intelligence layer across retail and hospitality, we are
  building a world that feels instinctive and magical. The
  future isn’t coming; it’s here, and we need builders,
  innovators, and problem solvers to help us create it.

  Who you are

  Metropolis is seeking a Senior Manager to lead one of our
  Customer Experience application development teams through
  our next step function growth phase. As a product-oriented
  engineering leader with a passion for technology and
  customer satisfaction, you will drive the future of our
  products by contributing to a vision and strategy that
  enables top-notch customer experiences. You will inspire a
  distributed team, shape a strong engineering culture, and
  work closely with leads across Product Management, Data
  Science, and User Research to build an end-to-end mobility
  platform that impacts the everyday experience of millions of
  people.

  What you'll do

  - Execute on a multi-year vision and strategy for developing
    customer-facing product offerings in close partnership
    with Product Management
  - Establish the processes needed to achieve operational
    excellence in system reliability while enabling rapid
    experimentation and data-informed decisions
  - Coach your engineering team to bring out their best
    performance and professional growth
  - Drive the hiring of top talent and set the cultural standard
    within Metropolis Engineering
  - Foster a collaborative environment where the best product
    and technical ideas are nurtured and brought to life
  - Manage the delivery of high-impact workflow, dashboard, and
    data visualization applications
  - Contribute to improving the customer-oriented mindset
    competency across the entire Metropolis organization

  What we're looking for

  - 5+ years of Management experience and 10+ years software
    development experience building customer-centric
    applications and products
  - Experience scaling and supporting 10+ person teams and
    building a strong bench of senior individual contributors
  - Experience in successfully executing and landing initiatives
    with strategic business impact
  - Track record of successful cross-functional collaboration
    while building customer solutions in B2C and B2B settings
  - Proven track record of designing and delivering large-scale
    distributed systems and software products in high-volume
    consumer-facing applications
  - Excellent written and verbal communication skills with a
    proven ability to present complex information in a clear
    and concise manner

  While not required, these are a plus:

  - Previous experience working inside innovative, high-growth
    environments
  - Comfort operating in an environment with high levels of
    ambiguity
  - Experience with influencing open-source community or
    industry groups
  - Experience with leveraging AI technology to streamline
    engineering activities

  Our Stack

  - Languages + Frameworks: TypeScript, React, Scala
    (principally), Java (limited)
  - Datastores: MySQL, PostgreSQL, Snowflake
  - Cloud: AWS
  - Version control: Git & GitHub
  - AI Tooling: Copilot on GitHub and Claude Code
  - Observability: Datadog

  4 Days in Office: Metropolis values in-person collaboration
  to drive innovation, strengthen culture, and enhance the
  Member experience. Our corporate team members hold to our
  office-first model, which requires employees to be on-site
  at least four days a week, fostering organic interactions
  that spark creativity and connection

  When you join Metropolis, you'll join a team of world-class
  product leaders and engineers, building an ecosystem of
  technologies at the intersection of parking, mobility, and
  real estate. Our goal is to build an inclusive culture where
  everyone has a voice and the best idea wins. You will play a
  key role in building and maintaining this culture as our
  organization grows. The anticipated base salary for this
  position is $216,500.00 USD to $264,500.00 USD annually. The
  actual base salary offered is determined by a number of
  variables, including, as appropriate, the applicant's
  qualifications for the position, years of relevant
  experience, distinctive skills, level of education attained,
  certifications or other professional licenses held, and the
  location of residence and/or place of employment. Base
  salary is one component of Metropolis' total compensation
  package, which may also include access to or eligibility for
  healthcare benefits, a 401(k) plan, short-term and long-term
  disability coverage, basic life insurance, a lucrative stock
  option plan, bonus plans, and more. #LI-RR1 #LI-Onsite

  Metropolis may utilize an automated employment decision tool
  (AEDT) to assess or evaluate your candidacy for employment
  or promotion. AEDTs are used to assist in assessing a
  candidate’s application relative to the required job
  qualifications and responsibilities listed in the job
  posting.

  As part of this process, Metropolis retains data relevant to
  your candidacy, including personal information, for a period
  that is reasonably necessary for the use of the tool. If you
  are hired for the position, your data may become part of
  your employee records.

  Metropolis Technologies is an equal opportunity employer. We
  make all hiring decisions based on merit, qualifications,
  and business needs — without regard to race, color,
  religion, sex (including gender identity, sexual
  orientation, and pregnancy), national origin, disability,
  veteran status, or any other protected characteristic under
  federal, state, or local law. We are committed to providing
  a welcoming, accessible hiring experience. If you need a
  reasonable accommodation for any part of the application or
  interview process, please reach out to us at
  recruiting@metropolis.io.
