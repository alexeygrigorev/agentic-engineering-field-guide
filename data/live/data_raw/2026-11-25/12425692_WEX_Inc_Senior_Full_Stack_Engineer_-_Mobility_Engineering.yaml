description: |
  About the Team/Role

  We’re looking for a Senior Full-Stack Developer with 5+
  years of professional software development experience,
  including hands-on experience in both frontend and backend
  development, to join our WEX Mobility Engineering team. You
  will design, develop, and support customer-facing web
  applications and backend services using modern frontend
  technologies, Java, Spring Boot, PostgreSQL, and REST APIs.
  You will collaborate with Product, Design, Mobile, and
  Platform Engineering teams to deliver secure, scalable, and
  reliable customer experiences.

  WEX Mobility provides fleet management and mobility payment
  solutions to customers and partners across North America.
  Our engineering teams span the United States, India, and
  Brazil, delivering SaaS, mobile, and API solutions that help
  fleet managers and drivers manage payments, access fuel
  discounts, configure spending controls, and track
  transactions. In this role, you will deliver features across
  the frontend, backend, and database layers, supporting
  reliable experiences for our customers.

  How you’ll make an impact

  - Develop and maintain responsive, accessible web applications
    using React, Angular, or similar frameworks, along with
    TypeScript, JavaScript, HTML, and CSS.
  - Build scalable, secure, and high-performance backend
    services using Java, Spring Boot, PostgreSQL, and REST
    APIs.
  - Own full-stack features across frontend interfaces, backend
    services, and databases—from technical design through
    implementation, testing, deployment, and production
    support.
  - Develop reusable UI components and integrate frontend
    applications with backend services, ensuring consistent
    user experiences and effective handling of loading states,
    errors, and authentication.
  - Contribute to system design discussions, API contracts, and
    technical decisions in collaboration with technical leads
    and partner teams.
  - Design and optimize database schemas, queries, indexes, and
    transactions to improve application performance and data
    integrity.
  - Write automated unit, integration, API, and end-to-end
    tests, and contribute to performance and load testing.
  - Improve application reliability through logging, metrics,
    distributed tracing, monitoring, and alerting.
  - Implement secure authentication, authorization, input
    validation, and data-handling practices across frontend
    and backend layers.
  - Contribute to CI/CD pipelines, deployment automation, and
    engineering tools that improve delivery quality and
    efficiency.
  - Troubleshoot frontend and backend production issues, perform
    root cause analysis, and implement lasting corrective
    actions.
  - Participate in code reviews, mentor junior engineers, and
    improve code quality, maintainability, and engineering
    practices.
  - Partner with Product, Design, Mobile, Security, and DevOps
    teams to clarify requirements, resolve dependencies, and
    deliver features.
  - Maintain technical documentation, including design
    documents, API specifications, and operational runbooks.
  - Use AI-assisted development tools to accelerate
    implementation, testing, and refactoring while validating
    generated code for correctness, security, and
    maintainability.

  Experience you’ll bring

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related field, or equivalent practical experience.
  - 5+ years of professional software development experience,
    with demonstrated hands-on experience in both frontend and
    backend development.
  - Strong proficiency in Java and Spring Boot for developing
    backend applications and services.
  - Hands-on experience with React, Angular, or a similar
    frontend framework, along with TypeScript, JavaScript,
    HTML, and CSS.
  - Experience building responsive, accessible web interfaces
    using reusable components, state management, routing, and
    API integration.
  - Experience delivering complete features that connect
    frontend user interfaces with backend business logic,
    APIs, and databases.
  - Experience designing, developing, and consuming RESTful APIs
    and working with microservices.
  - Strong understanding of object-oriented design, data
    structures, algorithms, and software design principles.
  - Experience with PostgreSQL or another relational database,
    including schema design, query optimization, indexing, and
    transaction management.
  - Understanding of authentication, authorization, OAuth 2.0,
    JWT, API security, and secure software development
    practices.
  - Experience with automated testing frameworks and tools for
    both frontend and backend applications.
  - Experience with Git, CI/CD pipelines, code reviews, and
    modern software delivery practices.
  - Ability to diagnose performance and reliability issues
    across the browser, API, service, and database layers.
  - Strong communication and collaboration skills, with the
    ability to independently deliver features and mentor
    junior engineers.
  - Hands-on experience using AI coding assistants such as
    GitHub Copilot, Cursor, or Claude to support software
    development.

  Preferred Qualifications

  - Experience developing and deploying cloud-native
    applications using AWS, Docker, and Kubernetes.
  - Familiarity with infrastructure as code tools such as
    Terraform.
  - Experience with asynchronous messaging and event-driven
    systems using Kafka, RabbitMQ, or similar technologies.
  - Familiarity with Redis or other caching technologies.
  - Experience with API gateways and resilience patterns such as
    retries, circuit breakers, rate limiting, and graceful
    degradation.
  - Familiarity with OpenTelemetry, Grafana, Prometheus, or
    similar observability platforms.
  - Experience building payment, financial services, fleet
    management, or other transaction-intensive applications.
  - Experience collaborating with mobile engineering teams and
    developing APIs for iOS and Android applications.
  - Familiarity with web accessibility standards and frontend
    performance optimization.

