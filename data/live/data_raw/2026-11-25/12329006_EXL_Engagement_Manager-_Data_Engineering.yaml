title: Engagement Manager- Data Engineering
company: EXL
location: New York, USA
work_type: FULL_TIME
company_size: 30,246 Employees
description: |
  The Engagement Lead owns the outcome of one or more AI and
  analytics engagements for Retail and CPG clients, from
  problem framing through deployed solution and measured
  business impact. The Engagement Lead is the client's trusted
  advisor and the delivery team's technical anchor.

  The Engagement Lead translates commercial questions in
  pricing, marketing, supply chain, merchandising and digital
  commerce into data science and AI solutions, then leads the
  teams that build, deploy and scale them. The role also
  pitches solutions and drives business development to grow
  existing accounts and win new clients, and helps grow the
  practice by shaping proposals, deepening client
  relationships and mentoring talent.

  ResponsibilitiesKey Responsibilities

  Delivery leadership

  - Own end-to-end delivery of data engineering engagements:
    lakehouse and warehouse builds, batch and streaming
    pipelines, cloud migrations, data quality and governance
    programs.
  - Define scope, plan, milestones, staffing and dependencies;
    track progress with clear status, risk and issue
    reporting.
  - Work with architects and tech leads to ensure solutions meet
    standards for scalability, security, reliability and cost.
  - Run agile delivery rituals (sprint planning, reviews,
    retros) and enforce engineering practices such as CI/CD,
    testing, code review and observability.

  Client and stakeholder management

  - Be the primary contact for client sponsors, product owners
    and technical leads; run steering committees and executive
    updates.
  - Translate business goals into technical roadmaps and clearly
    explain trade-offs to non-technical audiences.
  - Manage expectations, change requests and escalations, and
    keep the relationship healthy.

  Commercial ownership

  - Own engagement P&L: budget, forecast, utilization, margin
    and billing milestones.
  - Identify expansion opportunities and support pre-sales,
    including solutioning, estimation and proposals.
  - Manage SOWs, change orders and contractual commitments.

  People and team

  - Lead, mentor and develop engineers and delivery staff;
    support hiring, onboarding and performance reviews.
  - Build a culture of ownership, quality and continuous
    improvement.

  Practice building

  - Contribute reusable accelerators, delivery playbooks,
    templates and lessons learned.
  - Track trends in data platforms (e.g. lakehouse, data mesh,
    GenAI-ready data) and bring them into client
    conversations.

  QualificationsRequired Qualifications

  - 8+ years in data engineering, analytics engineering or data
    platform delivery, including 3+ years managing client-
    facing engagements or programs.
  - Proven record of delivering large data programs on cloud
    platforms (AWS, Azure or GCP) and modern data stacks such
    as Snowflake, Databricks, BigQuery or Redshift.
  - Strong working knowledge of data architecture: ETL/ELT, data
    modeling, orchestration (e.g. Airflow, dbt), streaming
    (e.g. Kafka) and data governance.
  - Hands-on technical credibility; able to review designs and
    challenge engineering decisions.
  - Experience with Agile and hybrid delivery, estimation, risk
    management and project financials.
  - Excellent communication, negotiation and executive presence.
  - Experience leading and developing distributed teams.
  - Bachelor's degree in Computer Science, Engineering or a
    related field, or equivalent experience.

  Preferred Qualifications

  - Experience in consulting, professional services or a systems
    integrator.
  - Certifications such as PMP, PMI-ACP, Scrum Master, or cloud
    and data platform certifications (e.g. Snowflake,
    Databricks, AWS, Azure, GCP).
  - Experience with data migration and modernization (on-prem to
    cloud, legacy warehouse to lakehouse).
  - Familiarity with DataOps, MLOps and preparing data for AI
    and ML use cases.
  - Domain experience in financial services, healthcare, retail
    or telecom.
  - Experience supporting pre-sales and shaping SOWs.
