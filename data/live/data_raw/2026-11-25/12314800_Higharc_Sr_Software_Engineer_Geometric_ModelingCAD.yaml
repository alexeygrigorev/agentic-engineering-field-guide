description: |
  About Us

  Higharc is a VC-backed startup that is changing how new
  homes are designed and built. Join a founding team who’ve
  shipped products for Autodesk, Electronic Arts, Nike, and
  Apple. We have raised over $175M with support from top-notch
  venture capital firms and more than 18 strategic investors:
  industry leaders in construction, building products
  manufacturing, and distribution.

  We are seeking Senior Software Engineers to contribute to
  our core geometric modeling technologies that support
  design, presentation, and analysis of homes. We are remote-
  first, this role can sit anywhere in the continental US or
  Canada.

  What You'll Do

  Expect to:

  - Conceive and implement algorithmic solutions to the most
    difficult geometric modeling problems
  - Work closely with other engineers, product, and customer
    success teams to define expected behavior, discover gaps
    in existing product, and ultimately ensure customers are
    happy
  - Write tests to verify that your code can handle the worst
    corner cases.
  - Mentor junior developers to write code as robust as yours.

  About You

  The right candidate for this role prioritizes working
  software over perfection and wants to deliver code, get user
  feedback, and iterate. Your ability to be hands-on, while
  also focusing on the bigger strategic picture, sets us
  apart. You're not hesitant to deeply understand our codebase
  to contribute effectively to it.

  You have:

  - 5+ years of experience working in CAD or geometric modeling
  - Knowledge of geometric modeling concepts techniques such as
    but not limited to meshes, BReps, NURBS, and BSPs.
  - Able to understand and navigate a large TypeScript + React
    codebase
  - Professional fluency with modern development tools,
    including AI-assisted workflows, paired with clear
    ownership of the correctness, maintainability, and
    behavior of the code you produce.
  - Excellent communication within a dynamic organization —
    highlighting tradeoffs, delivery timelines, and making
    decisions considering various alternatives
  - Ideally you have a strong interest in the homebuilding
    industry, whether it's a passion for homes, construction,
    or home design and you’re motivated by the prospect of
    elevating an entire industry through geometric modeling.

  While we've identified the core experience and skills
  required above, please still apply if you have more or
  different experience than this! We will use your previous
  experience and performance across the series of interviews
  to establish appropriate level within our organization in a
  fair and equitable way.

  Working at Higharc

  Remote work and travel: Our company is entirely remote, and
  has been since we were founded in 2018. Remote work means
  more time with family, less time commuting, and the
  flexibility to blend work and life. We value in-person
  collaboration and asynchronous deep-work time, which is why
  we schedule regular team meet-ups in our hubs across the US
  and, depending on the role, prioritize hiring in those hubs.
  If your role requires frequent travel beyond pre-scheduled
  team meet ups, we will represent that to the best of our
  ability as early as possible in the interview process.

  Compensation and benefits: Higharc offers competitive
  salaries with significant equity, in a fast-growing, well-
  funded company. We provide comprehensive medical, dental,
  and vision coverage, with flexible PTO, and meaningful
  maternity/paternity leave to all U.S based employees that
  are full-time. You'll also have access to other big-company
  benefits such like short and long-term disability plans and
  a 401K. We also provide a stipend to create the ideal home
  office and support ongoing L&D.  Please note: we are seeing
  an uptick of fraudulent recruiting activity claiming to be
  associated with Higharc. All communication and outreach from
  our in-house team will come from an @higharc.com email
  address.
