description: |
  At Hudl, we build great teams. We hire the best of the best
  to ensure you’re working with people you can constantly
  learn from. You’re trusted to get your work done your way
  while testing the limits of what’s possible and what’s next.
  We work hard to provide a culture where everyone feels
  supported, and our employees feel it—their votes helped us
  become one of the Top 100 Inspiring Workplaces. We think of
  ourselves as the team behind the team, supporting the
  lifelong impact sports can have: the lessons in teamwork and
  dedication; the influence of inspiring coaches; and the
  opportunities to reach new heights. That’s why we help teams
  from all over the world see their game differently. Our
  products make it easier for coaches and athletes at any
  level to capture video, analyze data, share highlights and
  more. Ready to join us?

  Your Role

  We’re hiring an Engineering Manager to join our North
  American Sports (NAS) squad within the College &
  Professional group, leading squads that deliver products and
  services to coaches and athletes across American Football,
  Basketball, Ice Hockey, Soccer and Volleyball. NAS focuses
  on the top clubs and athletes in the industry and works
  closely with them to optimize their workflows in our unified
  ecosystem across web and mutli-device platforms. As an
  Engineering Manager, you’ll:

  - Lead with technical excellence. You’ll work closely with
    engineers to make sure we’re building high-quality,
    scalable software the right way, and you’ll be involved in
    architecture and system design.
  - Drive product delivery. You’ll partner with product
    managers, design and QA to understand customer and
    business value, negotiate trade-offs, and oversee the
    successful shipment of new features in a fast-paced
    environment.
  - Empower your team. You’ll typically manage 6/8 engineers
    across two squads, focusing on their growth and wellbeing
    while building a high-performing, healthy team culture.
  - Champion AI-first engineering. We’re heavily invested in an
    AI-first mindset. You’ll encourage your team to use AI
    tools and modern tech to stay ahead of the curve, and
    you’ll help shape what we share more widely across Hudl.
  - Help unify the Hudl platform. This role succeeds when
    College & Professional workflows land cleanly in core Hudl
    tools and customers get one coherent experience. You’ll
    measure success by the workflows converged and the
    customer outcomes unlocked.

  Location

  For this role, we're currently considering candidates who
  are within commuting distance of our office in London.

  Must-Haves

  - Experienced. You have 3+ years of experience in engineering
    management, ideally with a background as an individual
    contributor or tech lead on customer-facing product teams.
    Platform or API experience is valued alongside it.
  - Product-minded. You’ve shipped user-facing software and can
    partner with product, design and QA to weigh customer
    value against technical trade-offs. You’re comfortable
    owning delivery in a fast-paced environment.
  - Technically grounded. You have a strong technical background
    and are comfortable architecting complex software, ideally
    with C#, TypeScript, AWS and a relational database such as
    PostgreSQL. You can stay involved in system design and
    architecture decisions.
  - Credible engineering leader. You can build trust quickly
    with engineers through your technical knowledge, helping
    them work through complex designs and trade-offs. You also
    care about the team’s growth, wellbeing and culture.
  - Quality-focused. You take ownership of reliability and
    quality, including on-call, service health and working
    closely with QA, so teams can ship confidently.
  - Forward-thinking. You’re genuinely excited about AI-
    augmented engineering as a capability shift, not just a
    productivity tool. You encourage your team to adopt it and
    measure what works.

  Nice-to-Haves

  - Broad tech stack. Experience with additional languages or
    tools beyond our core stack is valued.
  - Data and API depth. Experience designing APIs for multiple
    consumers, or working with GraphQL and data-lake patterns.
  - Domain passion. An interest in North American sports such as
    football, basketball or volleyball, and in building tools
    used by coaches and athletes at college and professional
    level.
  - Product convergence experience. You’ve helped bring separate
    products or workflows together onto a shared platform.

  Our Role

  - Champion work-life harmony. We'll give you the flexibility
    you need in your work life (e.g., flexible vacation time
    above any required statutory leave, company-wide holidays,
    remote work options and more) so you can enjoy your
    personal life too. Plus, every five years, we give you a
    paid sabbatical to unplug and recharge.
  - Guarantee autonomy. We have an open, honest culture and we
    trust our people from day one. Your team will support you,
    but you'll own your work and have the agency to try new
    ideas.
  - Encourage career growth. We're lifelong learners who
    encourage professional development. We'll give you tons of
    resources and opportunities to keep growing.
  - Provide an environment to help you succeed. We've invested
    in our offices, designing incredible spaces with our
    employees in mind. But whether you're at the office or
    working remotely, we'll provide you the tech you need to
    do your best work.
  - Support your wellbeing. Depending on location, we offer
    medical and retirement benefits for employees—but no
    matter where you're located, we have resources like our
    Employee Assistance Program and employee resource groups
    to support your mental health.

  Compensation

  The base salary range for this role is displayed
  below—starting salaries will typically fall near the middle
  of this range.

  We make compensation decisions based on an individual's
  experience, skills and education in line with our internal
  pay equity practices.

  This role will also be eligible for a long-term incentive
  (LTI) award. Any bonuses awarded are based on individual and
  company performance paid at Hudl's discretion.

  Base Salary Range

  £76,000—£127,000 GBP

