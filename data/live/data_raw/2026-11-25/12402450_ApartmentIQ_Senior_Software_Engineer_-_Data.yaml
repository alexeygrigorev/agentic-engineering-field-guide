description: |
  We’re Changing the Rentals Industry

  We’re a profitable, growth-stage company building industry-
  leading martech and data products for the PropTech space.
  Our focus is on our category-leading AI and data SaaS
  products with triple-digit growth rates.

  We’re a fully remote team of 100+ spread across the U.S.
  from coast to coast. We operate on a strict no a**holes
  policy and are proud to have built a community of highly
  performant people that take our work seriously, but not
  ourselves. And, we're looking for exceptional people to help
  further accelerate our growth.

  While we’ve raised $30MM+ to date from some of the world’s
  best investors, we’re profitable with a strong balance sheet
  and an indefinite runway. We pride ourselves on achieving
  rapid growth without having to incinerate capital.

  About Our Products

  ApartmentIQ is the all-in-one data platform powering smarter
  decisions across multifamily - covering 40M units with daily
  property and market intelligence used for surveys, research,
  and revenue management. We're trusted by 65% of the NMHC Top
  50. MavenAI, delivers AI-powered marketing automation built
  by industry experts and integrated directly with property
  management systems, serving over 2M units.

  The Role

  We are looking for a Senior Software Engineer to drive the
  evolution of our shared data platform - the core
  infrastructure that powers all three ApartmentIQ products.
  In this role, you will be a key architect of our data
  capabilities, shaping our product roadmap by expanding
  coverage, improving freshness, and enabling deeper insights
  for the multifamily industry.

  You will handle technical execution while ensuring our data
  initiatives align with business goals. You’ll translate
  product objectives into high-performance data outcomes,
  ensuring every project delivers clear value.

  What You’ll Be Doing

  - Deliver Product-Focused Data: Own the end-to-end delivery of
    data across Market Research, Market Surveys, and Daylight
    Revenue, aligning technical priorities with product goals.
  - Scale Data Ingestion: Design and evolve our ingestion
    pipelines, processing data for 10M+ multifamily units
    through XML/JSON feeds, web scraping, warehouse
    transformations, and API exposure.
  - Set Technical Standards: Define what accuracy, completeness,
    and timeliness mean for our datasets, ensuring all
    requirements meet the specific needs of each product line.
  - Collaborate Across Teams: Work closely with Product and
    Application Engineering to ensure new datasets unlock
    measurable features and actionable customer insights.
  - Ensure Operational Excellence: Build strong observability
    into our systems, including daily monitoring, anomaly
    detection, and automated alerts to maintain ingest health.
  - Manage Roadmap Execution: Lead the delivery of data
    milestones by defining goals, tracking progress in Linear,
    and communicating outcomes to stakeholders.
  - Adopt Emerging Tools: Stay current with data and AI tooling
    to help the team work more efficiently and integrate new
    technologies where they add value.
  - Document & Share Knowledge: Foster a culture of continuous
    improvement by maintaining clear documentation and
    mentoring others on data best practices.

  Who You Are

  - Technical Expert: You are a senior level engineer who enjoys
    being hands on while thinking strategically about the
    platform's growth.
  - Problem Solver: You don’t just build pipelines; you build
    solutions that solve real world problems for our users.
  - Reliable Owner: You thrive in an environment where you are
    given the autonomy to take a project from initial concept
    to full deployment.
  - Strategic Thinker: You understand how technical decisions
    impact business outcomes and prioritize your work
    accordingly.

  Qualifications

  - Proven Track Record: 5+ years of software or data
    engineering experience with a focus on delivering
    pipelines that power customer-facing features.
  - Technical Versatility: Strong experience in Python.
  - Data Ingestion Expert: Deep understanding of large-scale
    data collection, including web scraping, parsing, proxy
    management, and structured feed ingestion.
  - Pipeline Architect: Hands-on experience with batch-style
    data workflows using tools like dbt, Airflow, or similar
    equivalents.
  - Cloud Native: Deep expertise in AWS infrastructure (RDS,
    ECS, S3, Lambda, OpenSearch).
  - Observability Minded: Familiar with modern stacks for
    performance tracking, error monitoring, and distributed
    tracing.
  - Strategic Communicator: Strong ability to translate complex
    technical details into clear, actionable product outcomes.
  - Adaptable & Autonomous: Experience navigating a fast-paced,
    growth-stage environment where priorities shift and
    ownership is expected.

  Why Choose Us:

  - Remote-First: We offer the freedom to work from home across
    most of the U.S. You’ll enjoy the flexibility of remote
    work, balanced with high-energy in-person offsites to
    build real connections and celebrate our wins together.
  - Competitive Compensation: We believe in hiring the best and
    paying accordingly. You’ll receive a competitive salary
    that reflects your impact and expertise.
  - Paid Time Off: Take the time you need with our flexible
    vacation policy and dedicated paid parental leave to
    support you and your family’s biggest milestones.
  - Your Health Matters: Stay healthy with high-quality Medical,
    Dental, and Vision insurance plans for you and your
    family.
  - Peace of Mind (On Us): We fully invest in your security with
    100% company-paid Short-Term Disability, Long-Term
    Disability, and Basic Life Insurance.
  - Protection for Your Whole Crew: Access supplemental
    insurance for the unexpected, plus specialized coverage to
    keep your pets happy and healthy, too.
  - Invest in Your Future: Secure your financial goals with our
    401k Program, helping you build for the long term while
    you help us build the company.

  If you need assistance and/or a reasonable accommodation in
  the application or recruiting process, please contact your
  recruiter. Applicants must be authorized to work for any
  employer in the U.S. We are unable to sponsor or take over
  sponsorship of an employment Visa at this time.

  We want to alert you to potential recruiting scams targeting
  job seekers. Please note that our company will never request
  payment, personal information, or any confidential details
  during the interview process.
