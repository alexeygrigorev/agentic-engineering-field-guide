description: |
  Company Description

  Palmetto is a consumer energy platform that provides
  homeowners with a single destination to discover, purchase,
  finance, install, monitor and manage home energy products
  and services. By offering one integrated platform across
  solar, battery storage, HVAC, heat pumps and more, Palmetto
  helps homeowners make home energy more affordable, reliable
  and accessible. Today Palmetto serves hundreds of thousands
  of homeowners, across 30+ states, building the operating
  infrastructure for the consumer energy transition, one home
  at a time.

  Our employees are our most valuable resource. We foster a
  promote-from-within culture that prioritizes talent
  development, career growth, and purpose-driven work.
  Palmetto offers a comprehensive benefits package—including
  unlimited PTO, medical, dental, and vision coverage, paid
  parental leave, retirement plans, and more—so you can have
  it all both personally and professionally. Palmetto
  prioritizes people, planet, and profit—backed by a culture
  that values collaboration, impact, and balance. Join us in
  building a brighter, cleaner world.

  Location

  This position will be based in Charlotte, NC. Remote
  acceptable for exceptional talent.

  Reporting

  This position will report to the VP, Engineering.

  Summary of Role

  You will lead the engineering teams behind how homeowners
  find, choose, and start with Palmetto. Growth builds our
  digital acquisition experience, including the multi-product
  front door and the funnel that turns interested leads into
  qualified appointments. Journey builds the onboarding,
  service and support experiences in our consumer app.

  This is a player-coach role leading roughly 8 to 15
  engineers across two squads, working side by side with
  Product and Design. You'll set direction, review designs,
  and write code when it helps. AI agents are first-class
  tools for how we build, and you'll help your teams use them
  well.

  Strategic & Tactical

  - Lead and grow the team. Hire, develop, and retain strong
    engineers and leads. Set clear expectations, give honest
    feedback, and build career paths so no system depends on
    one person.
  - Set direction and deliver. Set the roadmap with Product and
    Design, weigh trade-offs openly, and be clear about what
    the teams are not doing. Deliver work that crosses
    platform, data, and partner dependencies.
  - Build for learning. Make instrumentation and experimentation
    part of every release, and use the data to decide what to
    do next.
  - Own the journey outcomes. Be accountable for the experiences
    that turn interested homeowners into customers, keep them
    confident through installation, and make it easy to get
    help afterward.
  - Raise the bar. Keep standards high with specs, tests, and
    design and code review, and with responsible use of AI
    tools.
  - Own reliability and cost. Be accountable for system health,
    on-call, and cloud cost in your area.
  - Partner across the company. Work with Product, Design,
    Marketing, Customer Experience, Data, and Platform. Agree
    on priorities when viewpoints differ, and keep leadership
    clear on progress and risks.

  Qualifications

  - 10+ years in software engineering, including 5+ years
    managing engineers and experience leading multiple teams.
  - A record of hiring well, developing people, and building
    teams with strong technical leads.
  - Hands-on depth in Node.js and TypeScript and in designing
    and consuming REST APIs, enough to review designs and
    code.
  - Experience with web experimentation and analytics: A/B
    testing, funnel instrumentation, and conversion-focused
    product work.
  - A track record of delivering large consumer-facing projects
    with sound judgment on priorities and trade-offs.
  - Strong partnership with Product and Design, and the ability
    to turn business goals into technical plans.
  - Practical knowledge of agentic engineering.

  Nice to have

  - React Native or mobile app experience, and integrations with
    external partners.



  Employment is contingent upon the successful completion of a
  background check.

  Equal Employment Opportunity

  Palmetto embraces diversity and is an Equal Employment
  Opportunity employer. Employment is decided on the basis of
  qualifications, merit, and business need. We do not
  discriminate based upon race, religion, color, national
  origin, gender, sexual orientation, gender identity, gender
  expression, age, status as a protected veteran, status as an
  individual with a disability, or any other status protected
  under federal, state, or local law.

  To ensure a fair evaluation, we may use AI to assist in
  sorting applications, but all final decisions are made by
  our hiring team and no candidate dispositions are automated.
  We will keep your information on file for four years from
  the date of your application. For detailed information about
  how we handle your data and our use of AI, please review our
  full privacy policy.

  For more about our Privacy Policy, visit:
  https://palmetto.com/privacy-policy
