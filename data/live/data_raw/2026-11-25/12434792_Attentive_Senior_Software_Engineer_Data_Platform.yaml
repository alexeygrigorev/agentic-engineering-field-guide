description: |
  Attentive® is the AI marketing platform for 1:1
  personalization redefining the way brands and people
  connect. We’re the only marketing platform that combines
  powerful technology with human expertise to build authentic
  customer relationships. By unifying SMS, RCS, email, and
  push notifications, our AI-powered personalization engine
  delivers bespoke experiences that drive performance,
  revenue, and loyalty through real-time behavioral insights.



  Recognized as the #1 provider in SMS Marketing by G2,
  Attentive partners with more than 8,000 customers across 70+
  industries. Leading global brands like Crate and Barrel,
  Urban Outfitters, and Carter’s work with us to enable
  billions of interactions that power tens of billions in
  revenue for our customers.



  With a distributed global workforce and employee hubs in New
  York City, San Francisco, London, and Sydney, Attentive’s
  team has been consistently recognized for its performance
  and culture. We’re proud to be included in Deloitte’s Fast
  500 (four years running!), LinkedIn’s Top Startups, Forbes’
  Cloud 100 (five years running!), Inc.’s Best Workplaces, and
  the Human Rights Campaign Foundation's Corporate Equality
  Index!

  Job Duties:

  - Architect high-throughput solutions that power our most
    critical operations, ensuring scalability and efficiency
  - Expand and enhance our self-service platform, collaborating
    with cross-functional teams to fuel our AI, ML, and
    analytics goals
  - Tackle complex distributed data challenges, streamline
    system integrations, and uphold high standards of quality
    and governance
  - Champion cutting-edge technologies, keeping our platform at
    the forefront of industry advancements and enabling
    strategic outcomes
  - Unify data from diverse systems, paving the way for
    experimentation and innovation while empowering teams with
    intuitive tools and frameworks
  - Leverage expertise in Spark, Flink, and/or Kafka, as well as
    other complex technologies such as Snowflake, Clickhouse,
    Trino, Apache Iceberg, Parquet, Arrow, Hudi, and others to
    debug issues across layers-from application logic to
    infrastructure bottlenecks and understand the tradeoffs in
    system design
  - Perform data modeling, data access, and data replication
    techniques, such as CDC
  - Architect applications at scale and maintain infrastructure
    as code via Terraform.

  Telecommuting: 100% Remote; Must reside in U.S.; Reports to
  HQ in New York, NY.

  Minimum Requirements:  Bachelor’s degree or U.S. equivalent
  in Computer Science, Computer Engineering, or a related
  field and 5 years of professional experience as a Software
  Engineer, Systems Engineer, or any occupation, job title, or
  position involving design, development, and implementation
  of scalable distributed systems, data platforms, and high-
  throughput software applications.

  Must also have the following experience:

  - 5 years of professional experience developing object-
    oriented applications
  - 5 years of professional experience troubleshooting
    application and infrastructure performance issues in
    distributed computing environments
  - 5 years of professional experience evaluating system
    architecture and engineering tradeoffs related to
    performance, scalability, reliability, and maintainability
  - 3 years of professional experience designing and supporting
    data warehouse and query engine technologies including
    Snowflake or Trino
  - 3 years of professional experience designing and
    implementing data storage, data modeling, and data
    replication solutions utilizing Apache Iceberg, Parquet,
    Arrow, Hudi, or change data capture (CDC)
  - 3 years of professional experience designing and supporting
    distributed data processing systems utilizing Spark,
    Flink, or Kafka
  - 3 years of professional experience designing, implementing,
    and optimizing distributed systems to support high-
    throughput, scalable, and reliable data processing
  - 1 year of professional experience developing and supporting
    cloud-based infrastructure utilizing AWS, Kubernetes, and
    Infrastructure-as-Code tools, including Terraform

  Apply at www.attentivemobile.com/careers#jobs or via email
  to careers@attentivemobile.com. Job code: CLJG.

  You'll get competitive perks and benefits, from health &
  wellness to equity, to help you bring your best self to
  work.

  For US based applicants:

  - The US base salary range for this full-time position is
    $193,461 - $220,000per year. annually + equity + benefits
  - Our salary ranges are determined by role, level and location

