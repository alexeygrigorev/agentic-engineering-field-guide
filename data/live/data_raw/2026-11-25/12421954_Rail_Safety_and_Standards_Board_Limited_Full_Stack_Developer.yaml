description: |
  Overview

  RSSB are now seeking a Full Stack Developer to join our
  Digital Product Engineering team and help shape the next
  generation of digital products supporting the GB rail
  industry.

  In this role, you will contribute to the development and
  support of a web portal, its supporting APIs and related
  services. Working as part of a collaborative engineering
  team, you will independently undertake end-to-end
  development across the full stack and lead on specific
  technical areas of the projects.  Using technologies
  including C#/.NET, ASP.NET Core, React and Next.js, you will
  collaborate with designers, product owners and other
  engineers to develop high-quality digital products and
  services that meet user needs and deliver lasting value.

  This is a two-year fixed-term opportunity based at our
  Fenchurch Avenue office, with hybrid working – expectations
  being 1 day per week in the office on average. The closing
  date for applications is 7 December 2026, and interviews are
  expected to take place during December 2026.

  Responsibilities

  - Deliver features end to end across the full stack, including
    APIs, services and web applications.
  - Design, develop and maintain RESTful APIs using ASP.NET
    Core.
  - Develop and maintain web applications using Next.js, React
    and TypeScript.
  - Integrate applications with databases and supporting
    services.
  - Implement observability through logging, metrics and
    tracing.
  - Design, build, test and document maintainable software
    solutions.
  - Take the lead on specific technical areas of the project,
    working with the Principal Technical Lead on their design
    and delivery.
  - Participate in code reviews and contribute to engineering
    standards and best practices.
  - Ensure solutions meet accessibility, security and quality
    requirements.
  - Collaborate with designers, product owners and other
    engineers to deliver high-quality products.
  - Make informed technical decisions, balancing business
    requirements, delivery timelines, quality and technical
    constraints

  Qualifications

  Essential:

  - Strong experience designing, building and maintaining
    RESTful APIs using C#/.NET and ASP.NET Core.
  - Proficient in React, with experience developing web
    applications using Next.js and TypeScript.
  - Experience with relational databases and SQL.
  - Experience with JWT authentication, Swagger/OpenAPI and
    Docker.
  - Experience implementing observability through logging,
    metrics and tracing.
  - Sound engineering practices, including version control
    (Git), automated testing, security and code review.
  - Strong communication and collaboration skills, working
    effectively with team members and stakeholders.

  Desirable:

  - Experience deploying and running services on Microsoft
    Azure.
  - Experience with PostgreSQL.
  - Experience with the Minimal API approach.
  - Experience with Dapper, DbUp, Brighter, Testcontainers and
    xUnit.
  - Experience using Azure DevOps (Boards, Repos and Pipelines).
  - Exposure to Python for software development.
  - Exposure to Terraform or other infrastructure-as-code tools.

  Why Join RSSB?  

  We value our people and offer a competitive benefits
  package, including:  

  - 30 days annual leave (plus bank holidays)
  - Private medical and dental cover
  - Flexible and hybrid working options
  - Season ticket loan and travel subsidy
  - Cycle to work scheme
  - Volunteer leave
  - Performance-related bonus
  - Pension scheme
  - Learning and development opportunities

  Ready to Apply?  

  If you're ready to take the next step in your career with
  RSSB, we’d love to hear from you. Apply now.  



  We understand the importance of work-life balance, and we
  offer our staff the flexibility to work within our core
  hours and the option to vary their location between both the
  office and home. If you are looking for further flexibility,
  speak to us at interview stage so that we can consider your
  request.  

  We value diversity and equal opportunities in employment and
  are committed to creating a workplace which is inclusive to
  everyone. As a member of the Disability Confident Scheme, we
  encourage candidates with disabilities who meet the minimum
  criteria, to apply for our jobs. If you have applied under
  the Disability Confident Scheme, please let us know in
  advance by emailing vacancies@RSSB.CO.UK Find out more about
  Diversity and Inclusion at RSSB: Rail Safety and Standards
  Board Careers - VERCIDA  

  If you require any reasonable adjustments with respect to
  our selection process including information in an
  alternative format, please contact us at
  vacancies@rssb.co.uk
