description: |
  About OrderfulOrderful is reinventing how businesses connect
  and trade. We modernize EDI - the backbone of $5T+ in global
  commerce - so companies can click-to-trade with any partner
  fast. We’re Series C and among the fastest-growing in
  supply-chain tech. Our culture is high-ownership, high-
  tempo, and low-ego; we iterate quickly, care deeply about
  customers and teammates, and love turning manual operations
  into products. If that sounds like you, let’s talk. Our Core
  Company ValuesAs a team, we're guided by four core values.
  They impact what we are building, while helping us stay true
  to ourselves and accountable to each other.

  - Our Customers Win
  - Learn, Iterate, Grow
  - Build a Great Community
  - We Show that We Care

  About the role As a Senior Software Engineer, you’ll own the
  design, delivery, and reliability of core parts of the
  platform that lets companies trade with their retailers,
  suppliers, and logistics partners through one modern API.
  Our customers run mission-critical orders, shipments, and
  invoices through Orderful, and we’re building toward a
  future where most new trading partnerships go live at the
  click of a button. You’ll combine deep engineering
  fundamentals with the judgment to direct AI coding agents,
  review their output rigorously, and stay fully accountable
  for what reaches customers. This is a high-impact role on a
  small, senior team, and you’ll help shape how modern
  software gets built at Orderful.

  What you’ll do

  - Lead the technical design of major platform initiatives, and
    write designs that weigh performance, reliability, and the
    business case from the start.
  - Turn ambiguous problems into clear specs that AI coding
    agents can build from, then test and review their work
    with a high bar.
  - Own quality as speed increases, from testing and evaluation
    to diagnosing the hardest bugs in production.
  - Decide where AI adds value, where deterministic software is
    the better choice, and where human judgment still matters.
  - Work with Product, and talk with customers regularly, to
    understand the problem before you build.
  - Mentor other engineers, and share what you learn about new
    models, agents, and workflows so the whole team gets
    better.

  What we’re looking for

  - 5+ years building and running production backend systems,
    with a record of leading the design of complex systems.
  - Strong experience with TypeScript and Node.js, APIs,
    distributed systems, event-driven architectures, and
    relational and non-relational databases.
  - An AI-first way of working, with real experience planning,
    building, and reviewing code at an accelerated pace with
    tools like Claude Code or Cursor.
  - A track record of shipping rapidly and owning what you ship,
    including reliability and on-call.
  - Comfort with ambiguity, and the ability to figure out what
    needs to happen without waiting for a plan.
  - Clear writing and opinions held with good reasoning, plus a
    collaborative, low-ego attitude.

  Bonus points

  - Experience at a high-growth startup or a company like
    Stripe, Shopify, Ramp, or Plaid, or experience building
    integrations, partner APIs, or AI agent evaluation
    systems.
  - Experience with EDI, supply chain, logistics, or commerce
    platforms.

  Why work at Orderful?

  - Flexibility & Balance: Unlimited PTO, a full week off for
    the holidays, remote work options, and schedules that fit
    your life.
  - Wellness & Support: Health, dental, vision, and life
    insurance, an EAP for when life gets tricky, weekly yoga,
    and paid parental leave.
  - Growth & Connection: Take on meaningful projects, plan for
    your future with a 401(k), and build relationships at our
    twice-yearly company-wide offsites.
  - Financial Upside: Competitive pay and stock options that let
    you share in the company’s success.

  At Orderful, building a great community is at the heart of
  everything we do. We’re looking for team members who lead
  with empathy and bring a champion mentality to the
  challenges our industry faces.  We believe the best work
  happens when people show up as their authentic selves and
  play to their unique strengths. By taking calculated risks
  and learning together, we’re building the infrastructure
  that keeps the global economy moving. If you’re ready to
  grow with a team that stays curious and stays bold, we’d
  love for you to join us.
