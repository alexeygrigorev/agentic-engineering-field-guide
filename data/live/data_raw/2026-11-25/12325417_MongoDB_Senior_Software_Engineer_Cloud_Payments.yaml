description: |
  MongoDB’s mission is to empower innovators to create,
  transform and disrupt industries by unleashing the power of
  software and data. Cloud Payments helps make that possible
  by ensuring that usage of MongoDB Atlas and our growing
  suite of products becomes accurate, reliable revenue every
  day. Our systems support the financial foundation of
  MongoDB’s cloud business, processing large volumes of usage
  and billing data where correctness, resilience and
  auditability matter.

  About the Cloud Payments team

  Cloud Payments is part of the Cloud Billing organization. As
  MongoDB’s cloud business grows, billing and payments become
  increasingly mission-critical. Our team:

  - Ingests and aggregates detailed metering and usage data from
    internal services and major cloud providers, including
    AWS, Azure and GCP
  - Calculates and generates daily customer bills for millions
    of customers worldwide
  - Integrates with payment processors and internal financial
    systems that support Finance, Sales, Marketing and
    Accounting
  - Improves customer-facing billing and payment experiences, as
    well as the reliability and scalability of backend systems

  We care deeply about code quality, correctness and
  observability. We work closely with technical teams and
  business stakeholders to solve problems that have direct
  customer and business impact.

  The role

  We’re looking for a Senior Software Engineer to provide
  technical leadership while designing, building and operating
  the services that power Cloud Payments. You’ll take on
  complex, ambiguous problems, shape solutions across service
  boundaries and help the team make sound engineering
  decisions for systems that process high-volume, financially
  significant data.

  You’ll work primarily in the JVM ecosystem, including Java
  and contribute across the software lifecycle: from
  clarifying the problem and setting technical direction
  through implementation, rollout and ongoing operation.
  You’ll raise the quality and effectiveness of the team
  through design feedback, mentorship and thoughtful
  collaboration, without needing formal people-management
  responsibility.

  This role can be based out of one of our United States
  offices, or remotely within the United States.

  What you’ll do

  - Lead the technical design and delivery of substantial
    backend capabilities, from problem definition and
    requirements through launch, operation and iteration
  - Break down ambiguous business and customer needs into
    pragmatic, well-scoped technical plans; identify risks,
    dependencies and meaningful tradeoffs early
  - Design and evolve reliable, scalable services and data flows
    that ingest, process, reconcile and report large volumes
    of usage and billing data
  - Set a high bar for correctness, resilience, security,
    auditability, testability and operability in systems with
    financial impact
  - Guide architecture and implementation across services or
    teams, building alignment with engineering partners and
    stakeholders in Product, Finance, Revenue and other
    organizations
  - Make systems easier and safer to operate by improving
    observability, incident response, automation and
    operational practices
  - Raise engineering quality through design and code reviews,
    clear technical documentation and constructive feedback
  - Mentor and support other engineers, sharing context and
    helping teammates grow their technical judgment and
    ownership
  - Participate in the on-call rotation and contribute to a
    sustainable approach to reliability

  What we’re looking for

  - Significant experience designing, building and operating
    production backend systems in a compiled OOM language,
    ideally Java or another JVM language - 6+ years of
    relevant experience
  - Demonstrated ownership of complex projects, including making
    design decisions, managing delivery risks and following
    through on launches
  - Strong understanding of distributed systems and the
    practical challenges of availability, consistency,
    scalability and failure recovery
  - Experience designing for data correctness, including
    patterns such as idempotency, replay safety,
    reconciliation and auditability
  - Ability to reason about service boundaries, APIs, data
    models and system evolution over time
  - Experience with databases, data modeling and access patterns
    in production
  - Strong operational bias: you use observability and
    production feedback to improve systems and you are willing
    to not only participate in on-call, but improve
    operational stance of the team
  - Clear communication and a track record of influencing
    technical decisions across teams and with non-technical
    stakeholders
  - A collaborative approach to technical leadership, including
    mentoring others and improving the team’s engineering
    practices
  - Self-motivation to solve customer and business problems, not
    just deliver isolated tickets

  Nice to have

  - Experience with billing, payments, or other financial
    systems where correctness, auditability and compliance are
    important
  - Experience with cloud platforms such as AWS, GCP or Azure
    and communication protocols such as gRPC
  - Familiarity with data-intensive applications, data
    pipelines, or data lakes
  - Exposure to I/O frameworks such as Reactor
  - Experience with containerization and orchestration, such as
    Docker and Kubernetes
  - Prior experience developing with or operating MongoDB

  We don’t expect you to check every box. If you’re excited
  about the problem space and believe you could make a strong
  contribution, we’d love to hear from you.

  How we’ll support you

  MongoDB is committed to building a supportive, inclusive and
  growth-oriented environment. Our benefits and working models
  are designed to support physical, emotional, financial and
  family well-being and to give people flexibility in how they
  do their best work.

  You’ll have opportunities to:

  - Work on complex, meaningful projects that directly affect
    MongoDB’s cloud business
  - Collaborate with experienced engineers across Cloud Billing
    and other parts of MongoDB
  - Grow through mentorship, feedback and stretch projects
    aligned with your interests

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  AI-native startups and approximately 75% of the Fortune 100,
  relying on MongoDB for their most important applications,
  we’re powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

  To drive the personal growth and business impact of our
  employees, we’re committed to developing a supportive and
  enriching culture for everyone. From employee affinity
  groups, to fertility assistance and a generous parental
  leave policy, we value our employees’ wellbeing and want to
  support them along every step of their professional and
  personal journeys. Learn more about what it’s like to work
  at MongoDB, and help us make an impact on the world!

