description: |
  Position Summary...

  What you'll do...Role summary:  Walmart is seeking a Staff
  Software Engineer to lead the development and delivery of
  scalable platform capabilities, including infrastructure,
  tooling, and AI/ML frameworks. This role involves driving
  the full software lifecycle, applying cloud-native
  architecture principles, and ensuring technical excellence
  through design reviews and innovation. The position requires
  collaboration with cross-functional teams to translate
  complex problems into actionable solutions while mentoring
  engineers and influencing architectural decisions. The ideal
  candidate will demonstrate strong technical judgment,
  adaptability, and a commitment to continuous improvement to
  support Walmart’s strategic objectives. About the team: The
  team addresses complex business and technical challenges
  within Growth Tech by leveraging advanced AI coding agents
  throughout planning, design, implementation, testing, and
  operations. They establish standards for scalable, reliable,
  and secure production systems at the intersection of
  software engineering, data, and AI. Focused on delivering
  valuable insights to suppliers and merchants, the team
  builds platforms for intelligent automation, including agent
  orchestration and customer-facing AI solutions. Emphasizing
  rapid iteration and adaptive systems that learn from usage,
  the team promotes collaboration and continuous improvement
  to drive innovation in a dynamic environment. What you'll
  do:


  - Deliver platform capabilities including infrastructure,
    tooling, and ML frameworks aligned with roadmap
    priorities.
  - Apply cloud-native architecture principles to ensure
    scalable, resilient, and agile systems.
  - Lead full software development lifecycle activities
    including coding, testing, deployment, monitoring, and
    maintenance.
  - Conduct system design reviews to validate quality and
    alignment with architectural standards.
  - Build AI-driven applications integrating ML components and
    automation features.
  - Mentor engineers, influence technical decisions, and promote
    engineering best practices.
  - Collaborate with stakeholders to define technical
    requirements and track success metrics.
  - Drive continuous improvement through innovation, feedback,
    and knowledge sharing.


  What you'll bring:


  - Proven expertise in cloud-native architecture, including
    microservices, containers, and automation to build
    scalable and resilient systems.
  - Strong proficiency in software design patterns, API design,
    and software prototyping to deliver maintainable and
    modular solutions.
  - Extensive experience with programming languages such as
    Python, JavaScript, TypeScript, Java, Rust, Dart, or C++.
  - Demonstrated ability to lead full software development
    lifecycle activities including coding, testing, CI/CD
    deployment, and observability.
  - Skilled in debugging, remedial action, and data-driven
    decision making to optimize engineering outcomes.
  - Experience mentoring engineers and influencing architectural
    decisions to promote engineering excellence.
  - Effective collaboration and communication skills to engage
    cross-functional teams and stakeholders.


   At Walmart, we offer competitive pay as well as
  performance-based bonus awards and other great benefits for
  a happier mind, body, and wallet. Health benefits include
  medical, vision and dental coverage. Financial benefits
  include 401(k), stock purchase and company-paid life
  insurance. Paid time off benefits include PTO (including
  sick leave), parental leave, family care leave, bereavement,
  jury duty, and voting. Other benefits include short-term and
  long-term disability, company discounts, Military Leave Pay,
  adoption and surrogacy expense reimbursement, and more.

  You will also receive PTO and/or PPTO that can be used for
  vacation, sick leave, holidays, or other purposes. The
  amount you receive depends on your job classification and
  length of employment. It will meet or exceed the
  requirements of paid sick leave laws, where applicable.

  For information about PTO, see
  https://one.walmart.com/notices.

  Live Better U is a Walmart-paid education benefit program
  for full-time and part-time associates in Walmart and Sam's
  Club facilities. Programs range from high school completion
  to bachelor's degrees, including English Language Learning
  and short-form certificates. Tuition, books, and fees are
  completely paid for by Walmart.

  Eligibility requirements apply to some benefits and may
  depend on your job classification and length of employment.
  Benefits are subject to change and may be subject to a
  specific plan or program terms.

  For information about benefits and eligibility, see
  One.Walmart.

  The annual salary range for this position is $110,000.00 -
  $220,000.00

  Additional compensation includes annual or quarterly
  performance bonuses.

  Additional compensation for certain positions may also
  include :
  - Stock

