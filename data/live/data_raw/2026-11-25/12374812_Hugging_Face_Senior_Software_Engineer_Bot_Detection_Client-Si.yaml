description: |
  At Hugging Face, we're on a journey to democratize good AI.
  We are building the fastest growing platform for AI builders
  with over 20 million users who collectively shared over 4
  million models, 1 million datasets & 1.5 million apps. Our
  open-source libraries have more than 700,000 stars on
  Github.

  About the Role

  Hugging Face hosts millions of models, datasets and Spaces,
  and serves a very large community of developers. That scale
  also brings automated abuse: fake accounts, scraping, spam,
  credential stuffing, and bots gaming downloads, likes and
  trending signals. We're building a small, dedicated bot-
  detection effort inside our Trust & Safety team, and we're
  looking for an engineer to own the signal-collection side of
  it.

  You'll design and ship the mechanisms that tell humans from
  automation across every surface where people and machines
  touch the Hub: web, API, git/LFS, CLI and client libraries.
  "Front" here is broad. It covers browser instrumentation,
  but also what we can learn from network, TLS and protocol
  behavior, and from how clients talk to our infrastructure.

  What you'll do

  - Design, build and deploy detection signals in production:
    browser and device fingerprinting, client-side challenges,
    TLS/HTTP fingerprinting, behavioral telemetry
  - Analyze how real-world bots and automation frameworks work
    (headless browsers, anti-detect browsers, residential
    proxies, CAPTCHA farms) and build countermeasures that
    hold up when attackers adapt
  - Work with our data-focused bot-detection engineer to turn
    raw signals into reliable features and decisions
  - Respect user privacy and keep legitimate developers,
    researchers and API users free of friction
  - Partner with infra, security and Hub engineers to roll out
    mitigations (rate limiting, step-up challenges,
    enforcement) safely at scale
  - Contribute openly where it makes sense: tooling, write-ups
    and research shared with the community

  Requirements

  - You have solid hands-on experience in bot detection, anti-
    fraud, browser fingerprinting, web security or a closely
    related field, and you've shipped things that ran in
    production
  - You understand browser internals and the web platform deeply
    (JavaScript, DOM and rendering APIs, WebGL/Canvas/Audio,
    extensions), as well as networking protocols (HTTP/2/3,
    TLS)
  - You know the attacker's toolbox from the inside
    (Puppeteer/Playwright/Selenium, stealth plugins,
    automation frameworks) and you like taking it apart
  - You're comfortable across the stack: TypeScript/JavaScript,
    and at least one backend language (Python, Go, Rust…)
  - You're pragmatic: you prefer a signal that works today and
    improves tomorrow over a perfect system that never ships
  - You care about privacy and about not punishing legitimate
    users

  Nice to have

  - Published work or talks on fingerprinting, bot detection or
    web measurement (academic or industry). A research
    background is welcome as long as you like seeing your work
    in prod
  - Experience at a bot-management, anti-fraud or CDN/WAF
    company
  - Open-source contributions

  One more thing

  At Hugging Face we believe great AI shouldn't require a
  massive cluster, we build for everyone, especially the GPU-
  poor. And because we read every application, here's a small
  sign that you read this one too: start your answer to the
  first application question with the words “GPU-poor and
  proud 🤗”. No trick, no catch, it just tells us a real person
  is on the other side.

  Benefits

