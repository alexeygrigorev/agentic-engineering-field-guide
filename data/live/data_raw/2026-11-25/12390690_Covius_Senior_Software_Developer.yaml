description: |
  It's fun to work in a company where people truly BELIEVE in
  what they're doing!

  We're committed to bringing passion and customer focus to
  the business.

  The Senior Software Developer will code and develop software
  applications. The Senior Developer will be responsible for
  working with stakeholders to elicit project requirements,
  recommend strategies and collaborate with team members, as
  needed, to ensure the most complex projects meet
  requirements and are completed on time. In addition, the
  Senior Developer will help establish standards, guidelines
  and create efficiencies in processes.

  Essential Functions

  - Works as part of a software development team in the design
    of software applications.
  - Build products out further by improving the performance of
    our codebase and handle scaling issues to accommodate user
    growth as well as write thorough tests to ensure code
    stability requirements.
  - Integrate existing software into new or modify systems or
    operating environments.
  - Review code, identify system design trade-offs and recommend
    product revisions or enhancements based on user feedback.
  - Optimize sites for efficiency and scale.
  - Develop and maintain documentation and/or user manuals.
  - Contribute to software development standards and best
    practices for the company.
  - Provide mentoring to less experienced developers.
  - Perform related duties as requested.

  Essential Knowledge, Skills & Abilities

  - Able to effectively communicate both verbally and in writing
    to accurately convey messages.
  - Ability to prioritize and work with minimal supervision.
  - Advanced coding skills in C#, NET. and a deep understanding
    of associated front-end and back-end technologies.
  - Ability to develop, maintain and write SQL Server databases,
    queries, stored procedures, and other functions as needed.
  - Expert proficiency with Git version control, or similar
    system, and associated collaboration tools such as JIRA
    and ADO.
  - Ability to solve complex problems, use analytical skills and
    implement solutions.
  - Advanced knowledge of agile development practices and scrum
    methodologies.
  - Ability to analyze and interpret technical documentation
    such as software requirements, detailed designs, flow
    charts and database schemas.
  - Commitment and ability to cultivate a diverse and inclusive
    work environment.

  Education

  - BS in computer science or related field preferred; the
    equivalent amount of relevant experience will be
    considered in lieu.

  Experience

  - 6+ years of experience in software/.net development.

  Compensation and Benefits

  - Covius offers an extensive benefits package for all
    employees, including medical, dental, vision and 401(k)!
  - Compensation: $100,800 to $126,000 annualized with a 15% AIP
    opportunity



  Application Guidelines:

  For best consideration, please submit your resume and
  application materials as soon as possible. Review of
  applications will begin immediately.

  Working Conditions

  This is a remote position. Employees are expected to
  maintain a dedicated and professional workspace that
  supports productivity and confidentiality. This requires
  reliable internet access and the ability to be on camera to
  participate in virtual meetings and communications during
  standard business hours. Work is primarily performed in a
  home office environment. Flexible work hours may be
  available, though employees must be able to collaborate
  effectively across time zones and attend scheduled meetings
  during core business hours. May require extended periods of
  computer use and sitting. Occasional travel or in-person
  meetings may be required based on business needs. Employees
  must adhere to company policies regarding data security,
  time tracking, and virtual collaboration.

  Physical Demands and Activities

  While performing the duties of this job, the employee is
  frequently required to communicate. The employee is
  regularly required to stand, walk, sit, and constantly
  operate a computer and other office equipment using hands
  and fingers for fine manipulation, including keyboarding and
  mouse use. The employee must occasionally lift, carry, push,
  pull, or otherwise move objects, such as files and small
  parcels and/or move boxes weighing up to 15 lbs. Prolonged
  periods of sitting or standing may be required depending on
  the nature of the work. Specific vision abilities required
  by this job include close vision, distance vision, and the
  ability to observe objects at close range in presence of
  glare or bright lighting (e.g. computer screen).

  Covius is committed to equal opportunity in all employment
  practices to all qualified applicants and employees without
  regard to race, color, religion, gender, gender identity,
  age, national origin, pregnancy, disability, genetics,
  marital status, military or veteran status or any other
  protected category as established by local, state, and
  federal law. This policy applies to all aspects of the
  employment relationship including recruitment and hiring,
  placement, promotion, transfer, compensation, disciplinary
  action, layoff, leaves of absence, training, and
  termination. All such employment decisions will be made
  without unlawful discrimination based on any prohibited
  basis.

  The essential functions, working conditions and physical
  demands described above are representative of those that
  must be met by an employee to successfully perform the
  essential functions of this job. Reasonable accommodations
  may be made to enable individuals with disabilities to
  perform the essential functions of this position.

  Please note that all job descriptions are not intended to be
  all-inclusive. This job description is not designed to cover
  all activities, duties or responsibilities that are required
  of the employee for this job. Employees may be required to
  perform other duties at any time with or without notice to
  meet the ongoing needs of the organization.

  If you like wild growth and working with happy, enthusiastic
  over-achievers, you'll enjoy your career with us!
